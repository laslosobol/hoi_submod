l_russian:
 HSM_BAR_residencies_reports:0 "Расследования резидентур"
 HSM_BAR_residencies_reports_desc:0 "Скопированная надпись, стёртая музейная запись, песня, оборванная на середине: в первых донесениях остались вопросы, на которые их авторы не смогли ответить. Резидентуры вновь отправляют корреспондентов, на этот раз с приборами, переводчиками и временем, чтобы выслушать собеседников."
 HSM_BAR_residencies_countertrade:0 "Торговая цепочка за делом конвоя"
 HSM_BAR_residencies_countertrade_desc:0 "У исчезнувших покупателей есть другие посредники. Проверять сведения об этой сети, не объявляя каждого торговца врагом и не расходуя одного свидетеля дважды."
 HSM_BAR_residencies_methods:0 "Методы резидентур"
 HSM_BAR_residencies_methods_desc:0 "Полевые расследования дали прикладные методы, исправили ложные утверждения и выявили ограниченную торговую сеть. Наблюдение требует защиты и расходов; закрытый канал остаётся закрытым."
 HSM_BAR_residencies_actor_tt:0 "Независимый Баррад имеет действующую Службу, не капитулировал, владеет регионом $STATE_624$ и контролирует его."
 HSM_BAR_residencies_no_pending_tt:0 "По этому заданию нет незавершённого расследования или отчёта без решения; обязательный перерыв перед повторной проверкой истёк."
 HSM_BAR_residencies_start_tt:0 "Стоимость решения оплачивает расследование. При отмене средства не возвращаются; незавершённая работа не даёт результатов. Отчёт поступит только после полного срока."
 HSM_BAR_residencies_finish_tt:0 "Непрерванное расследование даст отчёт для выбора применения результатов. Оно не передаёт аномалию под контроль и не завершает исследование сдерживания."
 HSM_BAR_residencies_continuation_tt:0 "Дело торговой сети продолжится через сохранённого посредника либо, если канал закрыт, через защищённых свидетелей и торговые документы."
 HSM_BAR_residencies_clinical_exchange:0 "Медицинские записи о закрытой комнате"
 HSM_BAR_residencies_materials_exchange:0 "Сравнение музейных отливок"
 HSM_BAR_residencies_optics_exchange:0 "Оптические наблюдения Кальк"
 HSM_BAR_residencies_survey_exchange:0 "Методы съёмки у парома"
 HSM_BAR_residencies_route_exchange:0 "Согласованное изучение маршрутной памяти"
 HSM_BAR_residencies_translation_exchange:0 "Сравнительное обнаружение ошибок"
 HSM_BAR_residencies_equus_a_tt:0 "Один бонус §Y50%§! к исследованию §Yполевых госпиталей§!; аномальный предмет не приобретается."
 HSM_BAR_residencies_equus_b_tt:0 "§Y«Методы резидентур»§!: потери от истощения §G-1.00%§!."
 HSM_BAR_residencies_griffonia_a_tt:0 "Один бонус §Y50%§! к исследованию §Yпромышленности§!."
 HSM_BAR_residencies_griffonia_b_tt:0 "Сохранить торговые доказательства для дела о торговой сети."
 HSM_BAR_residencies_griffonia_b_lar_tt:0 "§Y«Методы резидентур»§!: стоимость операций §G-3.00%§!."
 HSM_BAR_residencies_griffonia_b_legacy_tt:0 "§Y«Методы резидентур»§!: разведка §G+0.50%§!."
 HSM_BAR_residencies_north_a_tt:0 "Один бонус §Y50%§! к исследованию §Yэлектроники§!. Неподтверждённое наблюдение остаётся неразрешённым."
 HSM_BAR_residencies_north_b_tt:0 "§Y«Методы резидентур»§!: разведка §G+1.00%§!."
 HSM_BAR_residencies_riverlands_a_tt:0 "Один бонус §Y50%§! к исследованию §Yрот снабжения§!."
 HSM_BAR_residencies_riverlands_b_tt:0 "§Y«Методы резидентур»§!: скорость окапывания §G+5.00%§!."
 HSM_BAR_residencies_zebrica_a_tt:0 "Сопоставление будет основано на полном рассказе хранительницы и записи под местным контролем. До завершения проверки награда не выдаётся."
 HSM_BAR_residencies_zebrica_b_tt:0 "Сопоставление независимо проверит запись торговца и заявленное доказательство. Покупка утверждения не подтверждает его."
 HSM_BAR_residencies_comparison_a_log_tt:0 "Один бонус §Y50%§! к исследованию §Yрот снабжения§! на основе согласованного изучения маршрутной памяти."
 HSM_BAR_residencies_comparison_a_ele_tt:0 "Один бонус §Y50%§! к исследованию §Yэлектроники§! на основе исправленного сравнения кодированных сообщений."
 HSM_BAR_residencies_comparison_b_local_tt:0 "§Y«Методы резидентур»§!: потребление припасов §G-2.00%§! благодаря оплачиваемому местному сотрудничеству."
 HSM_BAR_residencies_comparison_b_lar_tt:0 "Сохранить подложные свидетельства как торговые доказательства. §Y«Методы резидентур»§!: результат операций §G+3.00%§!."
 HSM_BAR_residencies_comparison_b_legacy_tt:0 "Сохранить подложные свидетельства как торговые доказательства. §Y«Методы резидентур»§!: разведка §G+1.00%§!."
 HSM_BAR_residencies_contact_a_tt:0 "Защитить свидетелей и работать с записями вместо живого контакта. Следующее отправление можно расследовать через §Y30 дней§!."
 HSM_BAR_residencies_contact_a_lar_tt:0 "До окончательного урегулирования: защита разведывательного агентства §G+1§!."
 HSM_BAR_residencies_contact_a_legacy_tt:0 "До окончательного урегулирования: разведка §G+0.50%§!."
 HSM_BAR_residencies_contact_b_tt:0 "Разрешить контролируемый подход. Следующее отправление можно расследовать через §Y30 дней§!."
 HSM_BAR_residencies_contact_b_retained_tt:0 "До окончательного урегулирования: рост разведывательной сети §G+5.00%§!, вероятность захвата нашего агента §R+5.00%§!, пока сохранённый источник остаётся под угрозой."
 HSM_BAR_residencies_contact_b_closed_tt:0 "До окончательного урегулирования: рост разведывательной сети §G+2.50%§!. Прежний источник остаётся вне работы."
 HSM_BAR_residencies_contact_b_legacy_tt:0 "До окончательного урегулирования: разведка §G+1.00%§!."
 HSM_BAR_residencies_exchange_a_tt:0 "До окончательного урегулирования: потребление припасов §G-1.00%§! благодаря проверке отправлений. Следующая проверка станет доступна через §Y60 дней§!."
 HSM_BAR_residencies_exchange_b_tt:0 "До окончательного урегулирования: ежедневная политическая власть §R-0.02§! на контролируемое наблюдение. Следующая проверка доступна через §Y60 дней§!."
 HSM_BAR_residencies_exchange_b_lar_tt:0 "Результат операций §G+5.00%§!, пока продолжается контролируемое наблюдение."
 HSM_BAR_residencies_exchange_b_legacy_tt:0 "Разведка §G+0.50%§!, пока продолжается контролируемое наблюдение."
 HSM_BAR_residencies_aftermath_a_tt:0 "Заменяет прежний вклад дела торговцев, включая риск захвата и расходы на наблюдение. Региональные результаты сохраняются. Потребление припасов §G-1.00%§!. Пересмотр через §Y180 дней§!."
 HSM_BAR_residencies_aftermath_a_lar_tt:0 "Защита разведывательного агентства §G+1§!."
 HSM_BAR_residencies_aftermath_a_legacy_tt:0 "Разведка §G+1.00%§!."
 HSM_BAR_residencies_aftermath_b_tt:0 "Заменяет прежний вклад дела торговцев и убирает риск захвата старого источника. Региональные результаты сохраняются. Ежедневная политическая власть §R-0.03§! на новое наблюдение. Пересмотр через §Y180 дней§!."
 HSM_BAR_residencies_aftermath_b_lar_tt:0 "Рост разведывательной сети §G+5.00%§!; результат операций §G+5.00%§!."
 HSM_BAR_residencies_aftermath_b_legacy_tt:0 "Разведка §G+2.00%§!."
 HSM_BAR_residencies_review_a_tt:0 "Заменить оплаченное наблюдение защитной проверкой отправлений: потребление припасов §G-1.00%§!, без расходов на наблюдение. Региональные результаты сохраняются. Повторной награды исследований нет."
 HSM_BAR_residencies_review_a_lar_tt:0 "Защита разведывательного агентства §G+1§! вместо разведывательных бонусов наблюдения."
 HSM_BAR_residencies_review_a_legacy_tt:0 "Разведка §G+1.00%§! вместо разведывательного бонуса наблюдения."
 HSM_BAR_residencies_review_b_tt:0 "Сохранить или восстановить коммерческое наблюдение: ежедневная политическая власть §R-0.03§!. Заменяет вклад защитной проверки, не суммируется с ним. Повторной награды исследований нет."
 HSM_BAR_residencies_review_b_lar_tt:0 "Рост разведывательной сети §G+5.00%§!; результат операций §G+5.00%§!."
 HSM_BAR_residencies_review_b_legacy_tt:0 "Разведка §G+2.00%§!."
 HSM_BAR_residencies_equus:0 "Эквус: вернуться в закрытую комнату"
 HSM_BAR_residencies_equus_desc:0 "Целительница согласилась на посещение на своих условиях. Оплатить работу местного медицинского корреспондента и проверить воздух, прежде чем принимать объяснение, основанное на скопированной надписи."
 HSM_BAR_residencies_equus_access_tt:0 "Резидентура открыла это расследование; предшествующая беседа завершена."
 HSM_BAR_residencies_griffonia:0 "Грифония: найти изготовителя шкафа"
 HSM_BAR_residencies_griffonia_desc:0 "Плотник согласен говорить днём, вдали от торговца, заказавшего шкаф. Нужно сопоставить его рассказ с музейными записями и спросить хранителя, кто последним расписался за исчезнувший сосуд."
 HSM_BAR_residencies_griffonia_access_tt:0 "Резидентура открыла это расследование; предшествующая беседа завершена."
 HSM_BAR_residencies_north:0 "Север: наблюдать с двух берегов"
 HSM_BAR_residencies_north_desc:0 "Обеспечить Ирме Кальк вторую точку наблюдения и погодные приборы. По возможности воспроизвести свет; сохранить даты, для которых сведения неполны."
 HSM_BAR_residencies_north_access_tt:0 "Резидентура открыла это расследование; предшествующая беседа завершена."
 HSM_BAR_residencies_riverlands:0 "Речные земли: повторить съёмку у парома"
 HSM_BAR_residencies_riverlands_desc:0 "Лодочники расходятся во мнениях о том, где впервые повернулась стрелка компаса. Нужно заказать измерения на обоих берегах и на пароме, со вторым прибором и учётом груза каждого рейса. Пусть команды запишут свои наблюдения рядом с записями землемера."
 HSM_BAR_residencies_riverlands_access_tt:0 "Резидентура открыла это расследование; предшествующая беседа завершена."
 HSM_BAR_residencies_zebrica:0 "Зебрика: услышать ответный куплет"
 HSM_BAR_residencies_zebrica_desc:0 "Оплатить вторую беседу с хранительницей и переводчиком, способным исправлять наши вопросы. Установить, кто говорит, кто отвечает и что позволяет заключить запись."
 HSM_BAR_residencies_zebrica_access_tt:0 "Резидентура открыла это расследование; предшествующая беседа завершена."
 HSM_BAR_residencies_comparison:0 "Зебрика: сопоставить рассказы о страннике"
 HSM_BAR_residencies_comparison_desc:0 "В разных рассказах имя странника меняется, а приветствие остаётся прежним. Нужно заказать независимый перевод, сопоставить куплеты с описанными в них путешествиями и договориться с участниками о наблюдениях. Свидетельства торговца тоже стоит дать прочесть другому специалисту."
 HSM_BAR_residencies_comparison_access_tt:0 "Резидентура открыла это расследование; предшествующая беседа завершена."
 HSM_BAR_residencies_reply:0 "Ответить защищённому посреднику"
 HSM_BAR_residencies_reply_desc:0 "Подготовить безопасный отход, затем разобрать новую просьбу, поступившую через сохранённый канал. Защита посредника входит в задание, а не выдаётся за полезные сведения."
 HSM_BAR_residencies_reply_access_tt:0 "Дело конвоя дошло до этого этапа; прежнее решение о посреднике соблюдено."
 HSM_BAR_residencies_papers:0 "Восстановить след закрытого канала"
 HSM_BAR_residencies_papers_desc:0 "Сопоставить выброшенные бумаги и копии, добровольно предоставленные торговыми связными. Прежний посредник останется вне контакта; закрытие канала не прекращает расследование."
 HSM_BAR_residencies_papers_access_tt:0 "Дело конвоя дошло до этого этапа; прежнее решение о посреднике соблюдено."
 HSM_BAR_residencies_exchange:0 "Проверить второе отправление"
 HSM_BAR_residencies_exchange_desc:0 "Торговый спор позволяет получить законный доступ через сотрудничающего складского связного. Выяснить содержимое и разрешённый маршрут, затем решить: задержать ящик или заменить его содержимое инертной упаковкой."
 HSM_BAR_residencies_exchange_access_tt:0 "Дело конвоя дошло до этого этапа; прежнее решение о посреднике соблюдено."
 HSM_BAR_residencies_aftermath:0 "Защитить свидетелей от нового обращения"
 HSM_BAR_residencies_aftermath_desc:0 "Сопоставить предложения нового поставщика и проверить оговорённую защиту. Источник выведут при угрозе раскрытия; уже выведенного не вернут ради удобства."
 HSM_BAR_residencies_aftermath_access_tt:0 "Дело конвоя дошло до этого этапа; прежнее решение о посреднике соблюдено."
 HSM_BAR_residencies_review:0 "Пересмотреть коммерческое наблюдение"
 HSM_BAR_residencies_review_desc:0 "За полгода накопились каталоги и незапрошенные предложения, которые предстоит сопоставить с делом конвоя. Врона хочет знать, приносит ли новое коммерческое прикрытие полезные зацепки и оправдывают ли они расходы на его содержание."
 HSM_BAR_residencies_review_access_tt:0 "Дело конвоя дошло до этого этапа; прежнее решение о посреднике соблюдено."
 HSM_BAR_residencies.1.t:0 "Комната, которую держали закрытой"
 HSM_BAR_residencies.1.a:0 "Опубликовать медицинскую заметку с согласия семьи."
 HSM_BAR_residencies.1.b:0 "Оставить порядок осмотра полевым группам."
 HSM_BAR_residencies.1.d:0 "Целительница впускает корреспондента после того, как жаровню вынесли наружу. Старую надпись копировать нельзя; семья сама решит, что разрешено опубликовать. Внутри пробные полоски Марты меняют цвет возле забитого дымохода. Строители подключили к нему новую печь, не проверив, куда он выходит.\n\nОтставная целительница замечала головную боль и внезапную слабость задолго до того, как узнала название газа. Круг у двери предупреждал: не вносить сюда ещё один огонь. Сходство с баррадским рисунком остаётся в деле, но не доказывает, что в обоих местах находится одно и то же. После ремонта недомогание прекращается.\n\nОльха предлагает обезличенную медицинскую заметку, которую семья сможет проверить. Врона предпочитает закрытую инструкцию для осмотра съёмных комнат и полевых госпиталей. Ни в одном отчёте не появится сверхъестественная сущность, якобы извлечённая из дома."
 HSM_BAR_residencies.2.t:0 "Вторая стенка шкафа"
 HSM_BAR_residencies.2.a:0 "Передать результаты испытаний литья мастерским."
 HSM_BAR_residencies.2.b:0 "Сохранить клейма торговца и цепочку платежей."
 HSM_BAR_residencies.2.d:0 "Плотник соглашается встретиться днём. Он помнит шкаф из-за двойной задней стенки, сделанной по настоянию заказчика, и двух жалоб на ночные щелчки в ящиках. Изменение влажности воспроизводит звук. Исчезнувший инвентарный номер плотник объяснить не может.\n\nОбъяснение есть у библиотекаря. Торговец предложил вывезти якобы опасный предмет, затем выставил музею счёт за замену шкафа. В его описи бронзовый сосуд фигурирует под тремя названиями. Изымать уже нечего: остались образец литья, расписки и смущённое признание хранителя.\n\nОбразец поможет мастерским отличать добротную отливку от замаскированного брака. Другой путь предлагает Врона: сохранить всю цепочку расчётов для сопоставления с другими торговцами. Она не станет объявлять плотника или музей мааристами лишь потому, что им продали пугающую историю."
 HSM_BAR_residencies.3.t:0 "Берег за берегом"
 HSM_BAR_residencies.3.a:0 "Распространить исследование оптики с оговорками."
 HSM_BAR_residencies.3.b:0 "Принять метод парных наблюдений Кальк."
 HSM_BAR_residencies.3.d:0 "Ирма Кальк присылает парные наблюдения: перед рассветом и после перемены ветра. Береговой фонарь возникает над пустым мысом только тогда, когда холодный слой ложится над тёплым воздухом. Переставляют лампу, смещается далёкий огонь; убирают её, и предполагаемая часовня гаснет. Старый план рыбака помог найти нужное направление.\n\nОдна запись остаётся без объяснения: свидетель описал свет в ночь, для которой нет погодных наблюдений. Кальк отказывается и удостоверить явление призрака, и вычеркнуть свидетельство. Ольха наконец присылает скрытые отрывки. В них описано другое место, а не объяснение этого.\n\nСтанция может выпустить полезное исследование оптики с прямо обозначенным пробелом. Либо Служба превратит метод парных наблюдений Кальк в наставление для полевой разведки. Непроверенная ночь останется непроверенной при любом решении."
 HSM_BAR_residencies.4.t:0 "Стрелка на пароме"
 HSM_BAR_residencies.4.a:0 "Передать воспроизводимую съёмку службе снабжения."
 HSM_BAR_residencies.4.b:0 "Научить полевые группы сначала проверять приборы."
 HSM_BAR_residencies.4.d:0 "Землемер возвращается на оба берега со вторым прибором. На суше показания совпадают. На пароме расходятся, но лишь над сундуком под передним сиденьем. Паромщик открывает его: запасные железные крепления, перенесённые туда после течи на корме.\n\nЕго соперник брал с пассажиров доплату за обход якобы проклятой излучины. Арестовывать кого-либо за аномальное воздействие не требуется. Резидентура оплачивает оговорённую съёмку, передаёт паромщику показания и просит не отвергать будущие жалобы на основании одного успокоительного результата.\n\nИз записей получится урок маршрутной съёмки и размещения приборов. Врона предлагает вместо этого краткую проверку инструментов перед рытьём укрытий и разметкой периметра. Необъяснённая ночь на северной станции и подлинные баррадские искажения не исчезнут оттого, что на одном пароме оказалось много железа."
 HSM_BAR_residencies.5.t:0 "Кому позволено закончить куплет?"
 HSM_BAR_residencies.5.a:0 "Оплатить хранительнице и переводчику полный рассказ."
 HSM_BAR_residencies.5.b:0 "Купить версию торговца для независимой проверки."
 HSM_BAR_residencies.5.d:0 "Вторая собеседница не спрашивает о возрасте странника. Она спрашивает, кто вправе петь ответ. Переводчик объясняет: первая запись содержит половину обмена, слова гостя без ответа хозяина. Хранительница устроит полное исполнение после следующего собрания, если имена и запись останутся под местным контролем.\n\nТорговец предлагает более быстрый путь. У него есть письменный вариант, объяснение недостающего куплета и запечатанный предмет, якобы доказывающий, что странник не умер. Его рассказ понятен без перевода. Рассказ хранительницы потребует времени, оплаты исполнителям и переводчика, способного оспаривать сами вопросы.\n\nВрона просит прямо отметить выбор источника в полевом дневнике. Покупка у торговца не разрешает присвоить запись хранительницы; выбор хранительницы ещё не устанавливает природу того, о чём поют."
 HSM_BAR_residencies.6.t:0 "Странник в трёх рассказах"
 HSM_BAR_residencies.6.a:0 "Подготовить исправленное научное сопоставление."
 HSM_BAR_residencies.6.b:0 "Применить результаты в работе резидентур."
 HSM_BAR_residencies.6.listeners:0 "С разрешения участников резидентура записывает весь обмен. Странник оказывается ролью, которую проводники принимают по очереди: приветствие обозначает ответственность за путь, а не бессмертное тело. Повторяющиеся куплеты передают изменения доступа к воде и обязательства перед хозяевами. Старшие исполнители исправляют запись, которая отправила бы путников к закрытому колодцу.\n\nЭтот приём помогает запоминать сведения; отвечающий певец способен обнаружить ошибку. Ольха подчеркнул предполагаемое личное имя. Переводчик возвращает страницу с отмеченными грамматическими окончаниями. Оснований для приказа об удержании нет.\n\nИсполнители разрешают ограниченное изложение метода, но не публикацию имён, священных отрывков или самих маршрутов. Оно поможет нашей подготовке снабжения. Другой путь состоит в оплачиваемом местном сотрудничестве и постоянной проверке полевых сведений. Первым приобретённым знанием оказалось умение задать вопрос."
 HSM_BAR_residencies.6.broker:0 "В письменном куплете торговца слова гостя превращены в личное имя. Недостающий ответ взят из другого обряда. Независимый перевод выявляет склейку; в запечатанном доказательстве находят недавно обработанный материал, а не опознанные останки. Ни тело, ни бессмертный странник не обнаружены.\n\nХранительница соглашается объяснить ошибку после возвращения копии записи и оплаты дополнительной работы переводчика. Торговец продавал похожие свидетельства и раньше. Необычный ремонт его печати стоит запомнить, хотя поддельная древность сама по себе не доказывает ни культа, ни сверхъестественного свойства.\n\nОльха может превратить сопоставление в узкое исследование обнаружения ошибок в кодированных сообщениях. Врона предпочитает сохранить подложные свидетельства как материал для проверки будущих приобретений. Первый отчёт резидентуры отзывают; причина прямо указана на обложке."
 HSM_BAR_residencies.7.t:0 "Оставленный канал"
 HSM_BAR_residencies.7.a:0 "Защитить свидетелей. Продолжить через записи."
 HSM_BAR_residencies.7.b:0 "Разрешить контролируемый подход."
 HSM_BAR_residencies.7.retained:0 "Посредник, оставленный после истории с конвоем, получил вопрос, известный только исчезнувшим покупателям. Вопрос касается номерной печати, не заключённых. Он передаёт Вроне записку и спрашивает, не приведёт ли правильный ответ покупателей к его двери.\n\nОтветная формула совпадает с обращением к Маару, услышанным за дверью съёмной комнаты. Это связывает переписку с той же ячейкой, но не делает каждого торговца на её складе поклонником Маара. Врона может вывести посредника сейчас и продолжить работу через бумаги и защищённых свидетелей. Контакт даст более свежие сведения, но повысит риск захвата для него и тех, кто с ним встречается.\n\nОн согласен на один контролируемый ответ, только если отход уже подготовлен. В служебной записи о выборе останется это обещание, а не одни ожидаемые сведения."
 HSM_BAR_residencies.7.closed:0 "После истории с конвоем никто не ответил. Свидетели переехали; у покупателей больше нет голоса на другом конце канала. Врона сравнивает выброшенные бумаги, ремонты печатей и суммы с копиями, добровольно предоставленными торговыми связными. Это медленнее и дороже разговора с живым источником.\n\nВ одной инструкции повторено обращение к Маару, записанное за дверью съёмной комнаты. Платёжная пометка указывает на другого посредника, но не позволяет считать членом ячейки каждого участника расчётов.\n\nСлужба может ограничить список наблюдением ради защиты свидетелей. Либо подготовить контролируемое обращение через независимое прикрытие, не возвращая прежнего посредника из безопасного места. Закрытие канала было настоящим решением. Продолжение дела не потребует отменить его задним числом."
 HSM_BAR_residencies.8.t:0 "Второе отправление"
 HSM_BAR_residencies.8.a:0 "Задержать отправление и сохранить записи."
 HSM_BAR_residencies.8.b:0 "Отправить инертную замену под наблюдением."
 HSM_BAR_residencies.8.linked:0 "Сохранённые резидентурой торговые материалы совпадают с ремонтом печати, которой пользовались заговорщики из дела конвоя. Совпадение узкое, но проверяемое. У Вроны есть номер отправления, согласие складского связного и ящик с обещанным ритуальным сосудом. Связной разрешает осмотр; местной таможней Служба не командует.\n\nВ ящике упаковка вокруг обычной замены. Покупатель всё ещё ждёт подлинник и прислал новую инструкцию с обрядовой формулой ячейки. Здесь торгуют и опасными обещаниями, и простой подделкой. Обнаруженный обман не делает намерение похитить заключённых безобидным.\n\nСвязной вправе задержать отправление по условиям торгового спора. Другой вариант допускает движение инертной замены по согласованному маршруту, чтобы наблюдатели установили получателей. Ни неизвестного предмета, ни пленника через эту операцию не повезут."
 HSM_BAR_residencies.8.independent:0 "После нескольких недель сравнения торговые связные устанавливают ещё один заказ. Полезного совпадения из резидентур нет; наблюдателям Вроны пришлось проверять каждую передачу самостоятельно. Складской хозяин разрешает осмотреть спорный ящик и отказывается превращать остальное своё дело в ловушку.\n\nВ ящике обычная замена обещанного ритуального сосуда. В указаниях покупателя повторены обращение ячейки к Маару и ссылка на прежний конвой. Это сведения о данных покупателях, а не доказательство всемирного командования любой торговлей старинными вещами.\n\nХозяин может задержать отправление по договору. Либо позволит выпустить инертную замену и проследить за получателями. Врона записывает разрешённый маршрут в план. Никто не соглашался перевозить пленника или предмет с неизвестным воздействием."
 HSM_BAR_residencies.9.t:0 "Покупатели пробуют снова"
 HSM_BAR_residencies.9.a:0 "Закрыть эту цепочку и сохранить защитные сведения."
 HSM_BAR_residencies.9.b:0 "Оплатить новое наблюдение без прежнего источника."
 HSM_BAR_residencies.9.exposed:0 "Покупатели пробуют нового поставщика. В его бумагах Врона находит адрес через улицу от убежища посредника. Возможно, это ошибка; план наблюдения исходит из обратного. Подготовленный перед контролируемым ответом отход осуществлён: посредник и его домашние уезжают до следующего сбора.\n\nПереписка принесла пользу. Через неё также проверяли, как далеко действует Служба. Ольха возражает против слов об успешном проникновении, если отчёт умалчивает о переезде. Врона добавляет расходы и просьбу посредника никогда больше не выходить на него под прежним именем.\n\nМестную торговую цепочку теперь можно закрыть через подтверждённые споры, сохранив защищённые записи. Либо новое коммерческое прикрытие будет наблюдать за последующими предложениями, с постоянными расходами и без выведенного источника. Старый канал дошёл до обещанного конца."
 HSM_BAR_residencies.9.protected:0 "Новый поставщик присылает каталог с теми же неверными размерами, что и в старом списке ячейки. Защищённые свидетели узнают канцелярскую привычку, не появляясь на встрече. Решение не подвергать посредника риску оставило меньше непосредственных подробностей, зато теперь некого выводить из опасного контакта.\n\nСравнения хватает, чтобы связать предложения с уже исследуемой торговлей. Это не заявление о победе над всеми мааристскими организациями. Одни отправления оказались мошенничеством, другие предназначались для подготовки похищения; в отчёте различие сохранено.\n\nВрона может закрыть подтверждённую цепочку и оставить защитные сведения. Либо оплатить новое коммерческое наблюдение за будущими обращениями. Свидетели останутся в безопасности при любом плане. Их защитой не расплатятся повторно ради более убедительного следующего отчёта."
 HSM_BAR_residencies.10.t:0 "Следующий каталог"
 HSM_BAR_residencies.10.a:0 "Вернуться к защите сведений и проверке отправлений."
 HSM_BAR_residencies.10.b:0 "Сохранить оплачиваемое коммерческое наблюдение."
 HSM_BAR_residencies.10.d:0 "Плановая проверка сопоставляет новые обращения с законченным делом. Большинство касается обычной торговли. В одном повторён номер, намеренно выведенный из оборота после истории с конвоем. Проверяющий отмечает его для сравнения, не для автоматической конфискации.\n\nСо старым посредником не связывались. Другое коммерческое прикрытие способно поддерживать ограниченное наблюдение, но оно требует постоянных расходов. Альтернатива состоит в защищённых записях, проверке отправлений и предупреждениях согласившимся сотрудничать связным. Врона кладёт счета рядом с каталогом: кому-то предстоит решить, сколько стоит ещё одна сомнительная зацепка.\n\nВрона подписывает разбор после удаления строки о том, что ячейка уничтожена навсегда. Закрытый маршрут можно заменить. Это причина сохранять доказательства, а не объявлять каждую непонятную продажу частью одного заговора."

