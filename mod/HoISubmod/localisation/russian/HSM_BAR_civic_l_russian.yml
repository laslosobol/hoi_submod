l_russian:
 HSM_BAR_civic_government:0 "Гражданское правительство"
 HSM_BAR_civic_available_tt:0 "Независимый Баррад следует пути Коллегиума, завершил фокус §Y«$HSM_BAR_collegium_oath$»§!, не капитулировал, владеет регионом §Y$STATE_624$§! и контролирует его."
 HSM_BAR_civic_municipalities_settled_tt:0 "Делегаты согласовали представительство общин или округов."
 HSM_BAR_civic_courts_settled_tt:0 "Ведомство юстиции выбрало выездные заседания или постоянный суд."
 HSM_BAR_civic_defence_settled_tt:0 "Ведомство обороны выбрало местные резервы или центральную службу снабжения."
 HSM_BAR_civic_procurement_settled_tt:0 "Кабинет утвердил открытые торги или долгосрочные договоры."
 HSM_BAR_civic_territorial_representation_settled_tt:0 "Кабинет утвердил местные уставы или общие гражданские права."
 HSM_BAR_civic_government_desc:0 "Представительство общин, гражданские суды и служащие на жалованье создают в Барраде публичную администрацию, отдельную от Коллегиума. Министры отвечают за собственные решения; учёные дают советы, не владея государством."
 HSM_BAR_civic_republic:0 "Власть за пределами Коллегиума"
 HSM_BAR_civic_republic_desc:0 "Двери Коллегиума открыты, но лаборатория не может решать, кто починит мост или рассмотрит прошение вдовы. Временная администрация Гасеницы до сих пор заимствует столы, писарей и полномочия где придётся. Республике нужны собственные учреждения. Четверо уцелевших учёных смогут давать им советы; знания больше не будут правом собственности на страну."
 HSM_BAR_civic_republic_tt:0 "Учреждает гражданскую администрацию и национальный модификатор §Y«Гражданское правительство»§!. Открывает ветку государственного управления."
 HSM_BAR_civic_municipalities:0 "Общины присылают делегатов"
 HSM_BAR_civic_municipalities_desc:0 "Сельские сходы пережили графа, занимаясь делами, слишком мелкими для его внимания. Они поддерживали колодцы, делились семенами и помнили межи, когда землемеры перестали приезжать. Теперь их делегаты прибывают с совершенно разными наказами. Предстоит решить, как из местных поручений складываются общие решения, не превращая жителей дальних селений в безмолвных зрителей."
 HSM_BAR_civic_municipalities_tt:0 "Делегаты выберут обязательные наказы общин или окружное представительство. Соглашение изменит §Y«Гражданское правительство»§!; оно необходимо для создания государственной службы на жалованье."
 HSM_BAR_civic_registry:0 "Граждане, а не подданные поместья"
 HSM_BAR_civic_registry_desc:0 "Старые списки учитывали повинности перед имением, а не принадлежность к стране. Одни семьи записаны дважды; другие исчезли вместе с опустевшим селом. Гражданские регистраторы будут принимать свидетельства наряду с уцелевшими бумагами и объяснять порядок обжалования. Записи о рождении, составе семьи и призывные извещения должны попадать по адресу. Учёт не вернёт прежнему хозяину право на существо и не создаст нового."
 HSM_BAR_civic_registry_tt:0 "Изменения §Y«Гражданского правительства»§!:\nСкорость мобилизации: §G+10.00%§!"
 HSM_BAR_civic_courts:0 "Суд без покровителя"
 HSM_BAR_civic_courts_desc:0 "Вызванный на разбирательство проситель по-прежнему приносит письмо от влиятельного знакомого. Эта привычка старше Республики. Нам нужны судьи, чьи полномочия определяются опубликованным порядком, и решения, которые можно обжаловать, не разыскивая другого покровителя. Осталось понять, где заседать такому суду, если значительная часть страны не может позволить себе поездку к нему."
 HSM_BAR_civic_courts_tt:0 "Ведомство юстиции выберет выездные заседания или постоянный суд. Решение изменит §Y«Гражданское правительство»§!; оно необходимо для формирования кабинета."
 HSM_BAR_civic_civil_service:0 "Жалованье вместо одолжения"
 HSM_BAR_civic_civil_service_desc:0 "У писаря, которому платит проситель, два хозяина, и ни один не может доверять ответу. Муниципальные служащие получат жалованье, установленные обязанности, испытания по своей работе и увольнение за частные поборы. Опытных работников не следует выбрасывать вместе с графскими печатями. Но ни служба графу, ни дружба с учёным не освободят их от общих правил."
 HSM_BAR_civic_civil_service_tt:0 "Изменения §Y«Гражданского правительства»§!:\nПрирост политической власти: §G+8.00%§!"
 HSM_BAR_civic_accounts:0 "Счета Республики"
 HSM_BAR_civic_accounts_desc:0 "Никто не может объяснить Гасенице, принадлежит ли казне зерно на трёх государственных складах. Один писарь учёл покупку, другой заём, третий обещание вернуть всё после жатвы. Государственная отчётность должна различать деньги, имущество и обязательства. Исследовательский бюджет Коллегиума остаётся отдельным публичным вопросом; эти книги касаются налогов и обещаний всей страны."
 HSM_BAR_civic_accounts_tt:0 "Изменения §Y«Гражданского правительства»§!:\nПрирост политической власти: §G+5.00%§!"
 HSM_BAR_civic_cabinet:0 "Министры с обязанностями"
 HSM_BAR_civic_cabinet_desc:0 "Временный совет слишком часто решал вопросы по принципу: кто оказался в комнате, тот и отвечает. Гасеница возглавит кабинет с определёнными обязанностями министров: казна, правосудие, местное управление и оборона. Учёные смогут выступать и вносить предложения. Они не получат министерства в придачу к лабораториям, а разногласия об опыте перестанут останавливать работу государства."
 HSM_BAR_civic_cabinet_tt:0 "Изменения §Y«Гражданского правительства»§!:\nПрирост политической власти: §G+5.00%§!"
 HSM_BAR_civic_defence:0 "Гражданская подпись"
 HSM_BAR_civic_defence_desc:0 "Военная реквизиция всё ещё похожа на графский приказ взять необходимое. Гасеница знает, почему офицеры ценят быстроту; сёла знают, кто за неё платит. Гражданское ведомство обороны будет утверждать расходы, учитывать изъятия и разбирать требования о возмещении. Где бы ни хранились запасы, на местах или в казённых депо, ни офицер, ни профессор не сможет сам себе выдать разрешение."
 HSM_BAR_civic_defence_tt:0 "Ведомство обороны выберет подотчётные местные резервы или центральную службу снабжения. Решение изменит §Y«Гражданское правительство»§!; оно необходимо для учреждения административного обжалования."
 HSM_BAR_civic_procurement:0 "Закупки для страны"
 HSM_BAR_civic_procurement_desc:0 "Маленькая мастерская починит сельский насос, но не обещает тысячу одинаковых деталей. Крупный поставщик обещает, а затем привязывает любой ремонт к собственному образцу. Государственные закупки требуют большего, чем выбора низкой цены. Кабинет должен решить, сколько места оставить соперничеству поставщиков и сколько единообразия нужно, чтобы основные службы работали без перебоев."
 HSM_BAR_civic_procurement_tt:0 "Кабинет выберет открытые торги или долгосрочные договоры. Решение изменит §Y«Гражданское правительство»§!; оно необходимо для местных строительных управлений и казённой ревизии."
 HSM_BAR_civic_foreign_office:0 "Республика говорит с соседями"
 HSM_BAR_civic_foreign_office_desc:0 "Соседям всё ещё приходят письма с именами, которые они связывают с графским поместьем. Ведомство иностранных дел отправит посланников от имени Республики, приведёт соглашения к единому учёту и отделит торговые просьбы от военных угроз. Коллегиум сохранит научную переписку. Но дипломатия страны больше не будет зависеть от приглашений на ужин и обещаний, которые хозяева не могут выполнить."
 HSM_BAR_civic_foreign_office_tt:0 "Изменения §Y«Гражданского правительства»§!:\nСтоимость поддержания улучшения отношений: §G-10.00%§!\nОткрывает существующие дипломатические миссии к соседним государствам."
 HSM_BAR_civic_appeals:0 "Право оспорить приказ"
 HSM_BAR_civic_appeals_desc:0 "Первое предписание оборонного ведомства возвращается с жалобой. Офицеру нужна повозка; её владельцу предстоит жатва. Гражданское обращение не должно исчезнуть лишь потому, что первоначальное распоряжение было законным. Опубликованные основания пересмотра и обязанность дать ответ сделают решения менее удобными для чиновников и более убедительными для тех, кому предстоит им подчиняться."
 HSM_BAR_civic_appeals_tt:0 "Изменения §Y«Гражданского правительства»§!:\nЦель сопротивления: §G-2.00%§!\nСтабильность: §G+3.00%§!"
 HSM_BAR_civic_local_works:0 "Работы по просьбе общин"
 HSM_BAR_civic_local_works_desc:0 "На столичном плане дорога прямая. На сельском отмечено место, где её смывает весенним разливом. Местные строительные управления соединят расчёты землемеров со знаниями тех, кто ежедневно пользуется мостом, канавой или дорогой. Подрядчик обязан закончить заказанное, а не оставить эффектный показательный образец, который после отъезда гостей придётся поддерживать кому-то другому."
 HSM_BAR_civic_local_works_tt:0 "Изменения §Y«Гражданского правительства»§!:\nСкорость строительства инфраструктуры: §G+10.00%§!"
 HSM_BAR_civic_inspectors:0 "Ревизор не из министерства"
 HSM_BAR_civic_inspectors_desc:0 "Министр не может подтвердить правильность собственных счетов, просто назначив более преданного счетовода. Казённые ревизоры получат доступ к договорам, описям и платёжным книгам всех ведомств. Их отчёты касаются государственных денег, включая закупки у Коллегиума, но не превращаются в новый суд над научными убеждениями. За расхождения в своей работе кабинет будет отвечать сам."
 HSM_BAR_civic_inspectors_tt:0 "Изменения §Y«Гражданского правительства»§!:\nПрирост политической власти: §G+5.00%§!"
 HSM_BAR_civic_territorial_representation:0 "Место за общим столом"
 HSM_BAR_civic_territorial_representation_desc:0 "Республике нужен порядок для общин за пределами города, где она возникла, в том числе тех, которыми ей когда-нибудь придётся управлять по другую сторону прежней границы. Приход армии не решает вопроса об их правах. Нужно выслушать представителей, разобрать местные обязательства и сделать службы подотчётными жителям. Кабинет установит общий порядок, не выдавая провозглашение за уже полученное согласие."
 HSM_BAR_civic_territorial_representation_tt:0 "Кабинет выберет местные уставы или общие гражданские права. Решение закрепит порядок представительства и изменит §Y«Гражданское правительство»§!. Оно не присоединяет территории и не делает их национальными немедленно."
 HSM_BAR_civic_equal_services:0 "Открыта та же дверь"
 HSM_BAR_civic_equal_services_desc:0 "Чтобы получить гражданскую запись, жителю не должны требоваться правильный выговор, рекомендация профессора или родственник в столице. Администрация обеспечит доступ к судам, регистраторам и муниципальным службам везде, где управляет, соблюдая принятое соглашение о представительстве. Это медленная работа обыкновенных служащих. Именно она ежедневно проверяет, стоят ли наши обещания чего-нибудь за пределами кабинета."
 HSM_BAR_civic_equal_services_tt:0 "Изменения §Y«Гражданского правительства»§!:\nПрирост подчинения: §G+0.02§!"
 HSM_BAR_civic_ordinary_state:0 "Обычный день в Барраде"
 HSM_BAR_civic_ordinary_state_desc:0 "Последнее заседание кабинета заканчивается без откровения. Министр объясняет неоплаченный счёт; село оспаривает маршрут дороги; суд просит ещё одного писаря. Коллегиум присылает заключение и возвращается к своим занятиям. Чудеса и опасности из Баррада не исчезли. Но за ними появилось то, чего прежде не хватало: власть, способная заниматься общественными делами, не дожидаясь внимания выдающейся личности."
 HSM_BAR_civic_ordinary_state_tt:0 "Изменения §Y«Гражданского правительства»§!:\nСтабильность: §G+5.00%§!\nПрирост политической власти: §G+5.00%§!"
 HSM_BAR_civic.1.t:0 "Стул, принесённый из дома"
 HSM_BAR_civic.1.d:0 "Делегат от самого дальнего села приносит складной стул. Ей сказали, что мест может не хватить, а возвращаться домой, простояв за дверью, она не намерена. До начала заседания трое других представителей спрашивают, позволяет ли её наказ голосовать по вопросам, которые их собственные сходы ещё не обсуждали.\n\nГасеница выслушивает два предложения. Каждая община может сохранить обязательный наказ делегату, а общественные работы кабинет будет согласовывать непосредственно с затронутыми селениями. Местные обещания останутся на виду, но министрам придётся снова и снова добиваться согласия. Иначе окружные советы объединят наказы и отправят представителей, уполномоченных договориться об общей программе. Решения будут приходить быстрее, хотя маленькое село рискует узнать, что окружное большинство опять отложило его колодец.\n\nДелегат раскрывает стул. Она просит, чтобы выбранное правило поместилось на объявлении, которое можно прочесть дома."
 HSM_BAR_civic.1.a:0 "Сохранить обязательные наказы общин."
 HSM_BAR_civic.1.b:0 "Поручить окружным советам согласование общей программы."
 HSM_BAR_civic_local_mandates_tt:0 "Изменения §Y«Гражданского правительства»§!:\nСкорость строительства: §G+5.00%§!\nПрирост политической власти: §R-3.00%§!"
 HSM_BAR_civic_district_mandates_tt:0 "Изменения §Y«Гражданского правительства»§!:\nПрирост политической власти: §G+5.00%§!\nСтабильность: §R-2.00%§!"
 HSM_BAR_civic.2.t:0 "Судья и сломанное колесо"
 HSM_BAR_civic.2.d:0 "У одолженной повозки ломается ось по дороге к суду. Пассажиры прибывают после вызова по их делу: двое соседей спорят о меже, которую ни один не докажет без свидетельства другого. Писарь предлагает новую дату. Один из соседей спрашивает, оплатит ли Республика ещё одну повозку.\n\nВедомство юстиции предлагает выездные заседания: судья, писарь и опубликованные формы будут прибывать в селения в установленные дни. Выслушать удастся больше жителей, но кабинет оплатит поездки и будет считаться с подвижным расписанием. Другой вариант предполагает постоянный суд, регулярные слушания, подготовленных служащих и надёжный архив. Обжалование станет последовательнее, однако дальним общинам, особенно незнакомым с баррадскими учреждениями, добраться до суда останется трудно.\n\nГасеница вычёркивает из проекта исключение для старших советников Коллегиума. Выбор суда не изменит того, кому придётся перед ним отвечать."
 HSM_BAR_civic.2.a:0 "Пусть суд приезжает в селения."
 HSM_BAR_civic.2.b:0 "Создать постоянный суд с регулярными заседаниями."
 HSM_BAR_civic_circuit_courts_tt:0 "Изменения §Y«Гражданского правительства»§!:\nЦель сопротивления: §G-5.00%§!\nПрирост политической власти: §R-2.00%§!"
 HSM_BAR_civic_permanent_bench_tt:0 "Изменения §Y«Гражданского правительства»§!:\nСтабильность: §G+4.00%§!\nПрирост подчинения: §R-0.02§!"
 HSM_BAR_civic.3.t:0 "У кого ключ от склада?"
 HSM_BAR_civic.3.d:0 "Ведомство обороны запрашивает опись. Село присылает число мешков, имена семей, наполнивших их, и вопрос: успеет ли охрана прибыть раньше повозок, которые всё увезут?\n\nГасеница помнит реквизиции при графе и отказывается подписывать предписание без номера. Местные резервы могли бы хранить запасы рядом с общинами и обучаться там, где им предстоит обороняться. Разные расписания замедлят подготовку, зато у ополченцев будет причина удерживать собственные дороги. Центральная служба снабжения обеспечит части ровнее и быстрее вернёт уставшие подразделения в строй. Но для этого нужны постоянные служащие и средства, а не офицерское обещание рассчитаться с селом потом.\n\nВ обоих проектах ключи остаются у гражданской администрации. Леопольд предлагает придумать более надёжные замки. Министр благодарит его и просит подать расценки, как всякого другого поставщика."
 HSM_BAR_civic.3.a:0 "Оставить подотчётные резервы в общинах."
 HSM_BAR_civic.3.b:0 "Учредить центральную службу снабжения на жалованье."
 HSM_BAR_civic_local_reserve_tt:0 "Изменения §Y«Гражданского правительства»§!:\nЗащита дивизий на национальной территории: §G+10.00%§!\nВремя подготовки: §R+3.00%§!"
 HSM_BAR_civic_central_depots_tt:0 "Изменения §Y«Гражданского правительства»§!:\nПотребление припасов: §G-8.00%§!\nВосстановление организации армии: §G+5.00%§!\nПрирост политической власти: §R-3.00%§!"
 HSM_BAR_civic.4.t:0 "Две заявки на один насос"
 HSM_BAR_civic.4.d:0 "Дешёвая заявка включает установку. Другая обещает запасные детали на десять лет, но только если государство примет образец изготовителя для всех насосов округа. Министр спрашивает Леопольда, какая машина лучше. Тот отвечает вопросом о воде, затем заполняет поля расчётами. Ни один расчёт не решает, кому отдать договор на обслуживание.\n\nОткрытые торги позволят местным мастерским соперничать за общественные заказы и сделают строительство гибче. Частая смена поставщика замедлит накопление производственного опыта. Долгосрочные договоры обеспечат устойчивый выпуск и предсказуемые военные поставки, но закреплённый на годы образец ограничит последующие усовершенствования.\n\nЗакупочный писарь кладёт чертежи рядом с заявками, а не поверх них. Техническое заключение будет сопровождать выбор правительства, а не скрывать его."
 HSM_BAR_civic.4.a:0 "Проводить торги на каждый общественный заказ."
 HSM_BAR_civic.4.b:0 "Заключать долгосрочные договоры по единому образцу."
 HSM_BAR_civic_open_tenders_tt:0 "Изменения §Y«Гражданского правительства»§!:\nСкорость строительства: §G+7.00%§!\nРост эффективности производства: §R-3.00%§!"
 HSM_BAR_civic_framework_orders_tt:0 "Изменения §Y«Гражданского правительства»§!:\nОбъём заводского производства: §G+8.00%§!\nПотребление припасов: §G-5.00%§!\nМаксимальная эффективность производства: §R-2.00%§!"
 HSM_BAR_civic.5.t:0 "Карта и пустые стулья"
 HSM_BAR_civic.5.d:0 "В проекте закона о представительстве после названий первых муниципалитетов оставлен пробел. Писарь спрашивает, не лучше ли заполнить его после следующего пограничного соглашения. Гасеница отвечает: кабинету стоит решить, что он обещает, прежде чем солдаты сделают вопрос неотложным.\n\nОдин проект признаёт местные уставы и предлагает согласовывать обязательства с территориальными собраниями. Для общин это понятный путь к участию в управлении; для столицы долгие и трудные переговоры. Другой устанавливает одинаковые гражданские права и обязанности повсюду. Общее политическое устройство станет яснее, а места для произвола останется меньше. Но государству придётся обеспечивать одинаковую работу учреждений, а не пользоваться дешёвыми порядками на окраинах.\n\nЭто голосование не заполняет ни одного стула и не перекрашивает карту. Закон определяет условия, на которых будущие представители смогут занять свои места. Впервые обещание записано раньше победной речи."
 HSM_BAR_civic.5.a:0 "Признать местные уставы и согласовать общие обязательства."
 HSM_BAR_civic.5.b:0 "Дать одинаковые гражданские права и услуги повсюду."
 HSM_BAR_civic_local_statutes_tt:0 "Изменения §Y«Гражданского правительства»§!:\nПрирост подчинения: §G+0.04§!\nПрирост политической власти: §R-3.00%§!"
 HSM_BAR_civic_equal_franchise_tt:0 "Изменения §Y«Гражданского правительства»§!:\nСтабильность: §G+3.00%§!\nЦель сопротивления: §G-3.00%§!\nОбъём заводского производства: §R-1.00%§!"

