 HSM_BAR_collegium_war_services_tt:0 "Общественные службы: вся поддержка гражданского строительства приостанавливается. Расход припасов §G-8%§!, скорость восстановления дивизий §G+8%§!; готовый резерв и районные выезды усиливают эти эффекты. Без мандата жителей: стабильность §R-2%§! на время действия. Ежемесячной платы нет."
 HSM_BAR_collegium_civil_services_tt:0 "Вернуть эффекты завершённых гражданских строительных программ; убрать военные эффекты снабжения, восстановления и штраф чрезвычайного распределения."
 HSM_BAR_collegium_mandate_services_tt:0 "Мандат жителей снимает штраф стабильности §R-2%§! от военного распределения."
 HSM_BAR_collegium_standing_services_tt:0 "Во время войны распределение можно ввести немедленно, но до получения общественного мандата оно даёт §R-2%§! стабильности."
 HSM_BAR_collegium_mandate_deliberation_tt:0 "Чрезвычайное распределение должно дождаться §Y21 дня§! слушаний по мандату жителей. После этого штраф чрезвычайного распределения не применяется."
