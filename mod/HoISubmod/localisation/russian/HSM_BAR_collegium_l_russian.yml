l_russian:
 HSM_BAR_collegium_oath:0 "Обещание на площади"
 HSM_BAR_collegium_applied_chorus:0 "Хор без дирижёра"
 HSM_BAR_collegium_applied_chorus_desc:0 "Завершённый «Хор» Вииры связывает подготовленные группы, а не все разумы провинции. Опубликуем проверенные упражнения и отправим преподавателей, умеющих распознать обрыв связи так же уверенно, как удачный сеанс. Военные смогут изучать метод с теми же ограничениями, что и гражданские команды. Распространение результата требует дальнейших исследований, а не разрешения забыть о согласии."
 HSM_BAR_collegium_applied_manufactory:0 "Чертежи для других мастерских"
 HSM_BAR_collegium_applied_manufactory_desc:0 "Мануфактура прошла испытания. Следующая проверка менее зрелищна: сумеет ли окружная мастерская прочитать утверждённые чертежи, заказать запасные части и остановить станцию без Леопольда рядом? Коллегиум опубликует производственные нормы и поддержит промышленные исследования. Независимые остановки, известные материалы и честные сроки ремонта останутся частью проекта, вместе с уроком неудачной гаубицы."
 HSM_BAR_collegium_applied_last_minute:0 "Дорога до госпиталя"
 HSM_BAR_collegium_applied_last_minute_desc:0 "«Последняя минута» сохраняет шанс на лечение, но не заменяет его. После клинических испытаний Сильвер вместе с врачами республики займётся порядком эвакуации, приёмными отделениями и передачей пациентов. Госпитальные исследования должны сделать метод доступным за пределами его лаборатории, не обещая погибшим вторую жизнь. Каждая выигранная минута должна к чему-то вести."
 HSM_BAR_collegium_applied_contact:0 "Словарь без обещаний"
 HSM_BAR_collegium_applied_contact_desc:0 "Завершённые испытания Асинти подтвердили ограниченный контакт без живого носителя. Они не подтвердили, что отвечающий подразумевает то же, что мы. Сравнительная программа изучит повторяющиеся знаки, молчание и противоречивые ответы с соблюдением проверенных мер безопасности. Эти записи относятся к магическим исследованиям, а не к иностранному ведомству: необъяснённый голос ещё не стал признанным послом."
 HSM_BAR_collegium_school_research:0 "Приборная подготовка"
 HSM_BAR_collegium_grid_research:0 "Нормы муниципальной энергетики"
 HSM_BAR_collegium_wards_research:0 "Воспроизводимые защитные чары"
 HSM_BAR_collegium_longevity_research:0 "Клиническое наблюдение"
 HSM_BAR_collegium_bodycraft_research:0 "Окружная ремонтная сеть"
 HSM_BAR_collegium_teachers_research:0 "Учебные лаборатории"
 HSM_BAR_collegium_peer_review_research:0 "Независимая проверка чар"
 HSM_BAR_collegium_war_reserve_research:0 "Медицинское снабжение и эвакуация"
 HSM_BAR_collegium_chorus_ready_tt:0 "Завершён проект Коллегиума «Хор», включая испытания."
 HSM_BAR_collegium_manufactory_ready_tt:0 "Завершён проект Коллегиума «Мануфактура», включая испытания."
 HSM_BAR_collegium_last_minute_ready_tt:0 "Завершён проект Коллегиума «Последняя минута», включая испытания."
 HSM_BAR_collegium_contact_ready_tt:0 "Завершён проект Коллегиума «Контакт», включая испытания."
 HSM_BAR_collegium_oath_desc:0 "Площадь не избрала четырёх новых государей. Толпа сохранила четверым жизнь, а вместе с ней возложила обязательства. Временное правительство Гасеницы должно отвечать за продовольствие, суды и дороги; Коллегиум должен отвечать за происходящее в его лабораториях. Начнём с этого разграничения, пока все ещё помнят, зачем оно понадобилось."
 HSM_BAR_collegium_names:0 "Вернуть пропавшим имена"
 HSM_BAR_collegium_names_desc:0 "Первый список приносят на обороте кухонной описи. Рядом с одними именами указано место работы; рядом с другими — лишь день, когда кого-то видели в последний раз. Бывшие слуги замечают пропуски, о которых молчат лабораторные журналы. Прежде чем Коллегиум опубликует свои открытия, республика должна сохранить эту, другую историю Пентархии — вне досягаемости четырёх основателей."
 HSM_BAR_collegium_silver:0 "Смертный вопрос Сильвера"
 HSM_BAR_collegium_silver_desc:0 "Расчёты Сильвера точны до той минуты, когда живое тело перестаёт отвечать. Дальше стоит вопросительный знак, продавленный так сильно, что его след остался на следующем листе. Тень Уайт Стар по-прежнему преследует его, но клиника ставит вопрос, которого не решить ни славой, ни соперничеством: какие угасающие процессы можно удержать достаточно долго, чтобы врач успел вмешаться?"
 HSM_BAR_collegium_leopold:0 "Сначала пациент, потом изобретатель"
 HSM_BAR_collegium_leopold_desc:0 "Леопольд может объяснить устройство каждого шарнира своего протеза. Работник мельницы хочет знать, не заклинит ли его от мучной пыли, кто починит механизм зимой и сколько стоит обычная шина. На чертеже этих вопросов нет. Изобретателю, переделавшему собственное болезненное тело, предстоит научиться проектировать для чужой жизни — начав с того, кто вправе ему отказать."
 HSM_BAR_collegium_asinti:0 "Бывший раб должен выслушать"
 HSM_BAR_collegium_asinti_desc:0 "Среди приготовлений Асинти есть указание не размыкать круг до окончания отклика. Что делать, если отклик не закончится, никто не написал. Асинти помнит неволю; есть и выжившие, которые помнят себя его пленниками. В следующем обсуждении примет участие свидетель, выбранный самими участниками. На этот раз первым предстоит решить вопрос об остановке."
 HSM_BAR_collegium_viira:0 "Объяснить первый шаг"
 HSM_BAR_collegium_viira_desc:0 "Виира начертила одну и ту же схему трижды. Ученики воспроизводят каждую линию, но их кристаллы остаются тёмными. С каждой попыткой объяснение становится короче, словно пропущенный шаг должен проясниться в тишине. Чтобы создать школу, ей придётся найти этот шаг: то, что она делает не задумываясь, а другой разум мог бы научиться делать осознанно."
 HSM_BAR_collegium_records:0 "Архив вне нашей власти"
 HSM_BAR_collegium_records_desc:0 "Передадим копии показаний избранным хранителям. Семьи решают, публиковать ли имена; обвиняемые не распоряжаются доказательствами."
 HSM_BAR_collegium_life:0 "Изучать живых"
 HSM_BAR_collegium_life_desc:0 "Профинансируем наблюдения за старением, сном и восстановлением. Страх Сильвера не исчезнет, но может послужить незнакомым ему людям."
 HSM_BAR_collegium_clinic:0 "Общая клиника"
 HSM_BAR_collegium_clinic_desc:0 "Откроем клинику с обычными койками и кристальными приборами. Пища, обезболивание и право уйти важнее любого эксперимента."
 HSM_BAR_collegium_wards:0 "Защита с открытым выходом"
 HSM_BAR_collegium_wards_desc:0 "Асинти и Виира умеют описать круг, оставляющий опасность снаружи. Жители задают другой вопрос: кто откроет его, когда исследователь уйдёт? Нужны воспроизводимые чары, понятный выход и проверка с участием самих жильцов. Зафиксировав эти условия, мы сделаем защитную магию предметом обучения и проверки, а не очередной милостью пентарха."
 HSM_BAR_collegium_school:0 "Школа для обыкновенных"
 HSM_BAR_collegium_school_desc:0 "Блестящая демонстрация не заменит подготовленную смену. Виира поможет открыть занятия по измерениям, работе с приборами и обслуживанию зачарованного оборудования; экзамены будет принимать не она сама. Выпускники понадобятся Коллегиуму, больницам и городским службам. Школа состоится, когда её урок сможет повторить незнакомый преподаватель."
 HSM_BAR_collegium_grid:0 "Свет за стенами лаборатории"
 HSM_BAR_collegium_grid_desc:0 "Подачу энергии в лабораторию можно остановить, когда изобретатель потерял интерес. Улицу так обслуживать нельзя. Леопольд передаст муниципальным инженерам рабочие нормы и порядок обслуживания, а гражданские чиновники распределят ответственность за ремонт. Энергетическая программа даст основу для совершенствования промышленного оборудования, но не превратит непроверенный кристалл в готовое изобретение."
 HSM_BAR_collegium_land:0 "Вернуть поле земледельцам"
 HSM_BAR_collegium_land_desc:0 "После опытов остались канавы, заброшенные дороги и земля, за безопасность которой никто не ручается. Правительство оплатит дренажные работы и восстановление подъездов, пока Коллегиум наносит загрязнение на карту. Первые работы улучшат инфраструктуру Баррада, а не объявят всю страну исцелённой. Земледелец должен получить и проезжую дорогу, и честный ответ о том, что пока остаётся опасным."
 HSM_BAR_collegium_refugees:0 "Гости, которые могут уйти"
 HSM_BAR_collegium_refugees_desc:0 "Предложим беженцам жильё и возможность уехать дальше. Проживание, работа и участие в исследованиях требуют трёх разных соглашений."
 HSM_BAR_collegium_oversight:0 "Ключи для инспекторов"
 HSM_BAR_collegium_oversight_desc:0 "Инспектор, вынужденный спрашивать разрешения у четверых, бессилен. Выдадим избранным проверяющим ключи и обеспечим защищённую связь с заявителями."
 HSM_BAR_collegium_budget:0 "Открытый бюджет Коллегиума"
 HSM_BAR_collegium_budget_desc:0 "Казна республики и счета Коллегиума не являются одним кошельком. Клиники, лаборатории и учебные кабинеты представят гражданской власти общую заявку, включив обслуживание в расходы, а не спрятав его за обещаниями открытий. Пользователи этих служб смогут оспорить приоритеты. Четверым придётся объяснять, почему их опыт заслуживает оборудования, нужного и другой кафедре."
 HSM_BAR_collegium_report:0 "Первый нелицеприятный отчёт"
 HSM_BAR_collegium_report_desc:0 "На полках клиники уже лежат письма пациентов, вернувшихся к работе. Инспекторы приносят папку потоньше: незавершённые наблюдения, спорные измерения и жалобу, которую кафедра пыталась уладить без огласки. И то и другое должно прозвучать на одних слушаниях. Четверо научились защищать друг друга; первый открытый отчёт покажет, способны ли они выслушивать и неудобные вопросы друг к другу."
 HSM_BAR_collegium_future:0 "Коллегиум, достойный будущего"
 HSM_BAR_collegium_future_desc:0 "Восстановление сделало будущее возможным. Вопросы государственного устройства останутся рядом с летописью того, как мы сюда пришли."
 HSM_BAR_collegium_future_root:0 "Дело переживёт основателей"
 HSM_BAR_collegium_future_root_desc:0 "Учреждение не может держаться на четырёх не спящих друзьях. Подготовим преемников и распределим полномочия, пока нужда не решила за нас."
 HSM_BAR_collegium_longevity:0 "Годы, принадлежащие каждому"
 HSM_BAR_collegium_longevity_desc:0 "Таблицы Сильвера мало значат, если после выписки пациент исчезает из наблюдения. Сеть амбулаторий сопоставит выздоровления, неудачи и обычный уход, сопровождавший лечение. Исследовательская программа поможет больницам, не объявляя смерть побеждённой. У экспериментальных проектов останутся собственные испытания: административное распоряжение не заменит их выводов."
 HSM_BAR_collegium_bodycraft:0 "Собственное тело"
 HSM_BAR_collegium_bodycraft_desc:0 "Протез, который способен починить только Леопольд, остаётся привязан к изобретателю. Опубликуем проверенные крепления, обучим окружные мастерские и наладим доставку запасных деталей. Медицинское решение останется за врачом, согласие на лечение за пациентом. Такой порядок ремонта пригодится и службам снабжения, не делая каждый новый протез автоматически испытанным."
 HSM_BAR_collegium_ethics:0 "Право прекратить ритуал"
 HSM_BAR_collegium_ethics_desc:0 "Защитим участников и жителей от опытов, которые нельзя прервать. Мастерство Асинти должно включать умение оставить вопрос без ответа."
 HSM_BAR_collegium_teachers:0 "Учителя без чудес"
 HSM_BAR_collegium_teachers_desc:0 "Виира посетит урок своего ученика и промолчит до его окончания. Учебники, проверенные приборы и преподаватели, способные отвечать на незнакомые вопросы, важнее нового показа исключительного дара. Коллегиум поддержит прикладное приборостроение и подготовит учителей, которым для работы в муниципальной школе не придётся каждое утро приглашать основателя."
 HSM_BAR_collegium_civil_reserve:0 "Гражданский резерв"
 HSM_BAR_collegium_civil_reserve_desc:0 "Создадим запас кристаллов и опубликуем приоритеты для домов и больниц. Резерву необходим готовый проект сети либо развитые местные службы."
 HSM_BAR_collegium_war_reserve:0 "Служба под огнём"
 HSM_BAR_collegium_war_reserve_desc:0 "Кабинет может запросить полевую медицину, ремонтные команды и защитные чары. Он не получит их, объявив каждого пациента и лаборанта военным имуществом. Подготовим порядок эвакуации и снабжения с оговорёнными гражданскими обязательствами и возвратом оборудования. Совершенствовать эти методы должен Коллегиум; решать вопрос о войне должно правительство."
 HSM_BAR_collegium_peer_review:0 "Пусть ученик нас опровергнет"
 HSM_BAR_collegium_peer_review_desc:0 "Две лаборатории получили несовместимые результаты, следуя одной инструкции. Виира подозревает кристалл, Леопольд — крепление. Самый молодой ассистент подчеркнул фразу, которую оба основателя пропустили. Независимым группам выделят собственные приборы и время для повторных опытов. Где бы ни оказалась ошибка — в установке, инструкции или теории, — разногласие уже дало магическим исследованиям полезное направление."
 HSM_BAR_collegium_memorial:0 "Пустой стул за столом"
 HSM_BAR_collegium_memorial_desc:0 "Дружба основателей не займёт мест, которые опустели по их вине. Семьи вправе поминать погибших, не празднуя наше исправление."
 HSM_BAR_collegium_assembly:0 "Кто вправе сказать «нет»?"
 HSM_BAR_collegium_assembly_desc:0 "У республики теперь есть гражданский кабинет, с которым можно договариваться, а не только делегация у лабораторной двери. Его представители и Коллегиум решат, кто назначает научный совет, проверяет расходы и вправе остановить программу. Ни один из предлагаемых уставов не передаёт четверым основателям государственные суды или внешнюю политику."
 HSM_BAR_collegium_open:0 "Открытый коллегиум"
 HSM_BAR_collegium_open_desc:0 "Самоуправляемый научный коллегиум отвечает перед советами жителей и пациентов. За четверыми сохранятся лаборатории, но не иммунитет от закона."
 HSM_BAR_collegium_republic:0 "Коллегиум республики"
 HSM_BAR_collegium_republic_desc:0 "Избранная гражданская власть утверждает бюджет и назначает совет коллегиума. Научная заслуга даёт право быть услышанным, но не лишний голос."
 HSM_BAR_collegium_tutelage:0 "Бремя наставников"
 HSM_BAR_collegium_tutelage_desc:0 "Четверо сохранят исполнительное руководство Коллегиумом, пока готовят преемников. Эти полномочия ограничены самим учреждением: кабинет управляет республикой, суды разбирают жалобы на исследователей. Цена решения состоит в меньшем влиянии общества на научные приоритеты, а не в восстановлении четырёх личных престолов."
 HSM_BAR_collegium_lasting:0 "Друзья под общим законом"
 HSM_BAR_collegium_lasting_desc:0 "Опубликуем хартию со всеми обещанными ограничениями. Никому из четверых не нужно становиться богом, чтобы построить нечто долговечное."
 HSM_BAR_collegium_students:0 "Следующий выпуск"
 HSM_BAR_collegium_students_desc:0 "Первые выпускники уезжают с ящиками приборов, неоконченными спорами и адресами, по которым нужно отправлять запасные детали. Одна деревня просит учителя; другая — того, кто объяснит, почему насос ломается после заморозков. Четверо могли бы решить эти задачи сами. Их собственное, более трудное задание — позволить попробовать ученикам, а затем прочитать отчёты, не переписывая незаметно каждый вывод."
 HSM_BAR_collegium.1.t:0 "После вил"
 HSM_BAR_collegium.1.d:0 "Площадь опустела, но у ступеней остались погнутые вилы. Сильвер всё смотрит на них. Леопольд начинает объяснять, что толпа не поняла их намерений; Асинти останавливает его. Поняла достаточно.\n\nПрачка возвращается с тремя соседями и списком пропавших. Её не интересует, подружились ли четверо. Она спрашивает, кто рассмотрит жалобу на них. Виира пододвигает ей стул. Прощение дало возможность быть услышанными, а не право повелевать."
 HSM_BAR_collegium.1.a:0 "Предоставить заявителям независимых представителей."
 HSM_BAR_collegium.1.b:0 "Четверо лично выслушают каждую семью."
 HSM_BAR_collegium.2.t:0 "Незаполненная строка"
 HSM_BAR_collegium.2.d:0 "Писарь доходит до строки, где Асинти указал лишь номер подопытного. Женщина узнаёт дату и просит не вписывать имя, пока судьба её брата не выяснена. Асинти нечем облегчить ожидание.\n\nСильвер предлагает опубликовать всё в доказательство открытости. Леопольд указывает на лицо женщины. Следователям нужны доказательства, но горе семьи не принадлежит публике."
 HSM_BAR_collegium.2.a:0 "Публикация с согласия семей; следователям — запечатанные копии."
 HSM_BAR_collegium.2.b:0 "Провести открытые слушания с возможностью защищённых показаний."
 HSM_BAR_collegium.3.t:0 "Годы его сестры"
 HSM_BAR_collegium.3.d:0 "На полях таблицы продолжительности жизни Сильвер написал имя Уайт Стар. При появлении Вииры он зачёркивает его. Она не делает вид, будто ничего не заметила. Он признаётся: всё ещё мечтает об открытии, после которого Виттенленд первым вспомнит его имя.\n\nПотом признаёт и другое: он боится умереть, так и не сделав ничего полезного. Виира садится рядом и ждёт, пока он заговорит о пациентах, чьи записи лежат между ними непрочитанными."
 HSM_BAR_collegium.3.a:0 "Профинансировать открытое исследование старения."
 HSM_BAR_collegium.3.b:0 "Начать с небольшой лаборатории под независимым надзором."
 HSM_BAR_collegium.4.t:0 "Нет, доктор"
 HSM_BAR_collegium.4.d:0 "Леопольд показывает кристальный протез, способный укрепить повреждённую переднюю ногу работника мельницы. Он знает боль тела, которое не слушается. Устройство он объясняет блестяще, а расходы на обслуживание — скверно.\n\nРаботник отказывается. На мгновение Леопольд выглядит так, будто отвергли само его спасение. Сильвер просит столь же внимательно объяснить устройство обычного ортеза. Теперь пациент задаёт вопрос."
 HSM_BAR_collegium.4.a:0 "Гарантировать обычную помощь при любом испытании."
 HSM_BAR_collegium.4.b:0 "Оплатить независимых советников для объяснения обоих вариантов."
 HSM_BAR_collegium.5.t:0 "По другую сторону двери"
 HSM_BAR_collegium.5.d:0 "Асинти помнит, как не мог уйти. Бывшая подопытная помнит его стоящим в дверях. Он начинает объяснять цель ритуала и узнаёт в своём голосе интонацию того, кого когда-то ненавидел.\n\nОна не требует примирения. Ей нужны открытая дверь, выбранный ею свидетель и право остановить процедуру после согласия начать. Асинти кладёт ключ на стол. Его страдания многое объясняют, но ничего не оправдывают."
 HSM_BAR_collegium.5.a:0 "Свидетели вправе остановить любой опыт."
 HSM_BAR_collegium.5.b:0 "Создать независимую комиссию с таким же правом запрета."
 HSM_BAR_collegium.6.t:0 "Очевидный шаг"
 HSM_BAR_collegium.6.d:0 "Виира зажигает кристалл. Ученики копируют схему; ничего не происходит. Она повторяет опыт ярче, и один ученик прикрывает глаза. Леопольд спрашивает, что она сделала между третьей и четвёртой отметками.\n\nНичего, отвечает она. Затем пробует обойтись без движения рогами, которого прежде не замечала. Кристалл остаётся тёмным. Впервые за весь день все присутствующие столкнулись с одной и той же задачей."
 HSM_BAR_collegium.6.a:0 "Переписать уроки для обычных учеников."
 HSM_BAR_collegium.6.b:0 "Подготовить помощников, которые объяснят пропущенные шаги."
 HSM_BAR_collegium.7.t:0 "Первая приёмная"
 HSM_BAR_collegium.7.d:0 "Сильвер дважды проверяет пульс пожилой кобылы. Леопольд трижды проверяет стерилизатор. Асинти убирает ритуальные инструменты: медсестра говорит, что они пугают детей. Виира всё утро подписывает ящики.\n\nК полудню клиника полна пациентов, чьи болезни не прославят научную статью. Денег хватит либо на большее число обычных приёмов, либо на оборудование для многолетнего наблюдения за небольшой группой добровольцев."
 HSM_BAR_collegium.7.a:0 "Сначала больше приёмов."
 HSM_BAR_collegium.7.b:0 "Меньшая служба с длительным наблюдением."
 HSM_BAR_collegium.8.t:0 "Кому отключат свет?"
 HSM_BAR_collegium.8.d:0 "Новая сеть работает, пока мастерская и клиника не включаются одновременно. Леопольд предлагает переключатель приоритетов. Сильвер тянется поставить лабораторию первой в списке и останавливается.\n\nПредставитель жителей замечает: тёмная кухня — не мелкое неудобство, если семья готовит после поздней смены. Приоритеты нужны, но график должен показывать, кто за них платит."
 HSM_BAR_collegium.8.a:0 "Приоритет домам и клинике."
 HSM_BAR_collegium.8.b:0 "Выделить мастерским открыто объявленные часы."
 HSM_BAR_collegium.9.t:0 "Дорога из Баррада"
 HSM_BAR_collegium.9.d:0 "Плотница-беженка спрашивает, не обяжет ли предоставленная койка её семью служить коллегиуму. Писарь отвечает отрицательно. Когда входит Асинти, она спрашивает снова. Он садится так, чтобы не загораживать дверь, и просит писаря продолжать.\n\nСемья вправе остаться, работать за плату, отказаться от исследований или уехать дальше. Жильё в любом случае требует расходов. Благодарность не заменяет подписи под договором."
 HSM_BAR_collegium.9.a:0 "Оплатить обустройство и независимые консультации."
 HSM_BAR_collegium.9.b:0 "Оплатить небольшой приют и дальнейшую дорогу."
 HSM_BAR_collegium.10.t:0 "Хороший результат, плохая процедура"
 HSM_BAR_collegium.10.d:0 "Первый отчёт подтверждает реальные выздоровления. В нём также указано, что помощник продолжил измерение после отзыва согласия пациентом. Леопольд говорит, что измерение было безвредным. Инспектор отвечает: спор не об этом.\n\nСильвер закрывает журнал успехов. Асинти спрашивает представителя пациента, какого возмещения тот требует. Виира выдерживает молчание. Дружба помогает оставаться в этой комнате, но не отменяет заключения."
 HSM_BAR_collegium.10.a:0 "Приостановить работу отделения и возместить ущерб."
 HSM_BAR_collegium.10.b:0 "Независимый надзор за счёт бюджета основателей."
 HSM_BAR_collegium.11.t:0 "Четыре чашки, пять стульев"
 HSM_BAR_collegium.11.d:0 "После вечерних отчётов они привыкли пить чай. Сегодня Виира приносит пятый стул для писаря, который постоянно исправляет их счета. Сильвер приготовил доводы за независимость коллегиума. Асинти — список тех, кто имеет основания возразить.\n\nПисарь спрашивает: независимость от графа, друг от друга или от людей, оплачивающих этот чай? Быстрого ответа ни у кого нет."
 HSM_BAR_collegium.11.a:0 "Пригласить писарей и жителей к составлению хартии."
 HSM_BAR_collegium.11.b:0 "Подготовить проект специалистов для общественных поправок."
 HSM_BAR_collegium.12.t:0 "Обычный день рождения"
 HSM_BAR_collegium.12.d:0 "Сильвер навещает добровольную участницу, пережившую ещё одну зиму. Он принёс график; она испекла что-то неровное и сладкое. Ей хочется знать, позволит ли лечение дождаться, когда внук окончит школу.\n\nОн не может этого обещать. Признаться труднее, чем выполнить расчёты. Она благодарит за честность и предлагает присесть. Позже он пишет сестре о дне рождения, ни разу не упомянув прорыв."
 HSM_BAR_collegium.12.a:0 "Сделать последующее наблюдение общественным обязательством."
 HSM_BAR_collegium.12.b:0 "Опубликовать ограничения и обучить местных врачей."
 HSM_BAR_collegium.13.t:0 "Ремонт, доступный каждому"
 HSM_BAR_collegium.13.d:0 "Пациентка возвращается со сломанным креплением и извинениями. Леопольд уже придумывает усовершенствование, когда она просит чертёж прежней конструкции. Деревенский кузнец сможет починить её, если поймёт устройство.\n\nСначала Леопольд отвечает, что кузнец не разберётся. Виира молча кладёт на стол свой переработанный учебник. К вечеру рядом лежит схема с графиком обслуживания, без запрета на копирование."
 HSM_BAR_collegium.13.a:0 "Открыть чертежи и субсидировать запасные части."
 HSM_BAR_collegium.13.b:0 "Подготовить лицензированных мастеров, подотчётных пациентам."
 HSM_BAR_collegium.14.t:0 "Остановиться до ответа"
 HSM_BAR_collegium.14.d:0 "Приборы показывают: ритуал Асинти наконец приближается к полезному результату. Доброволец подаёт условленный сигнал. В голове возникает знакомый довод: ещё мгновение оправдает все усилия.\n\nОн останавливается. Виира снимает внешние чары, Леопольд осматривает участника, Сильвер записывает незавершённый результат. Позже Асинти просит указать, сколько он колебался."
 HSM_BAR_collegium.14.a:0 "Опубликовать случай и улучшить механизм остановки."
 HSM_BAR_collegium.14.b:0 "Поручить следующий разбор независимым свидетелям."
 HSM_BAR_collegium.15.t:0 "Учитель на задней парте"
 HSM_BAR_collegium.15.d:0 "Виира сидит на задней парте, пока бывший ученик ведёт вечернее занятие. Опыт идёт медленно. Двое задают один вопрос. Учитель отвечает дважды, разными словами.\n\nВиира едва удерживается, чтобы не показать изящное решение. Затем ученик, почти лишённый магии, замыкает цепь с помощью ручного регулятора. Неизящно. Зато работает и после ухода Вииры."
 HSM_BAR_collegium.15.a:0 "Открыть вечерние занятия во всех подходящих залах."
 HSM_BAR_collegium.15.b:0 "Предоставить выпускникам самостоятельные учительские должности."
 HSM_BAR_collegium.16.t:0 "Места основателей"
 HSM_BAR_collegium.16.d:0 "Собрание поставило четыре стула на одном уровне с остальными. Пожилая делегатка благодарит Леопольда за возвращённую подвижность ноги и голосует против предложенных им полномочий над Коллегиумом. Он смотрит на друзей. Асинти кивает делегатке. Сильвер записывает возражение.\n\nПри любом решении за республику продолжит отвечать кабинет. Предстоит определить отношения власти с наукой: самоуправление Коллегиума вместе с его пользователями, научный совет по назначению выборной власти или руководство основателей под надзором судов и независимых счетоводов. Ни один вариант не обещает, что дружба сделает власть безвредной."
 HSM_BAR_collegium.16.a:0 "Провести независимые слушания по хартии."
 HSM_BAR_collegium.16.b:0 "Принять опубликованные поправки собрания."
 HSM_BAR_collegium.17.t:0 "Подпись, которая обязывает"
 HSM_BAR_collegium.17.a:0 "Открытая хартия принадлежит её участникам."
 HSM_BAR_collegium.17.b:0 "Избранный совет республики вступает в должность."
 HSM_BAR_collegium.17.c:0 "Наставники признают право суда вмешаться."
 HSM_BAR_collegium.18.t:0 "Гражданский режим"
 HSM_BAR_collegium.18.d:0 "Вместе с войной завершилось чрезвычайное распределение ресурсов. Носильщик везёт через двор имущество полевой клиники. Часть приборов нуждается в ремонте; к другим так привыкли, что никто не хочет сдавать их обратно.\n\nГрафик был обещанием. Энергия возвращается в дома и мастерские, а коллегиум подсчитывает, что израсходовано за время чрезвычайного положения."
 HSM_BAR_collegium.18.a:0 "Опубликовать ведомость возврата."
 HSM_BAR_collegium.19.t:0 "Не спрашивая разрешения"
 HSM_BAR_collegium.19.d:0 "Выпускники приносят новый регулятор насоса, журнал ошибок клиники и письмо деревни с просьбой прислать второго учителя. Руководитель объясняет: первый проект был неверен. Это был проект Вииры. Она просит показать измерения.\n\nСильвер смеётся и вспоминает, что прежде услышал бы оскорбление. Леопольд изучает записи о ремонте. Асинти проверяет, что свидетели клиники расписались сами. Никто из четверых не стал бессмертным. На один день это кажется менее важным, чем работа на столе."
 HSM_BAR_collegium.19.a:0 "Выделить выпускникам собственный бюджет."
 HSM_BAR_collegium.19.b:0 "Пусть первый выпуск выберет следующих учителей."
 HSM_BAR_collegium.20.t:0 "Чрезвычайные полномочия взаймы"
 HSM_BAR_collegium.20.d:0 "Оборонный план перечисляет перевязочные средства, эвакуационные чары и ремонтные бригады. В нём также указаны гражданские приёмы, которые придётся отложить. Леопольд не станет притворяться, будто одни приборы могут работать в двух местах сразу.\n\nИнспекторы спрашивают, кто вправе запустить план. Общественный мандат требует времени; постоянное разрешение позволяет основателям действовать и объясняться позднее. После войны специалисты вернутся в гражданские службы. Если действовать без мандата, протест против отложенных приёмов останется, пока жители не утвердят решение."
 HSM_BAR_collegium.20.a:0 "Получить чрезвычайный мандат жителей."
 HSM_BAR_collegium.20.b:0 "Разрешить введение плана с последующим разбором."
 HSM_BAR_collegium.21.t:0 "Цена жалобы"
 HSM_BAR_collegium.21.d:0 "Представитель пациентов остановил перспективное испытание. Жалоба касается беседы о согласии, а не прибора. Сильвер боится, что пауза погубит месяцы полезной работы. Асинти напоминает: право, которым можно пользоваться лишь когда это удобно, вообще не право.\n\nИнспекторы предлагают два решения: остановить новые испытания на время переобучения или оплатить независимый надзор на каждом оставшемся приёме. Нынешние пациенты в любом случае получат обычную помощь."
 HSM_BAR_collegium.21.a:0 "Приостановить набор в испытания на шестьдесят дней."
 HSM_BAR_collegium.21.b:0 "Оплатить независимый надзор на каждом приёме."
 HSM_BAR_collegium.22.t:0 "Первый урожай принадлежит им"
 HSM_BAR_collegium.22.d:0 "Анализы почвы обнадёживают, но земледелица просит Вииру подождать, пока сама проверит дренажную канаву. Виира едва не предлагает передвинуть всё поле одним жестом. Вместо этого берёт лопату поменьше.\n\nК вечеру бригада передаёт результаты съёмки, в том числе отметку об участке, безопасность которого ещё не подтверждена. Хозяйка благодарит за эту отметку. Земля больше не лаборатория только потому, что четверо умеют её изучать."
 HSM_BAR_collegium.22.a:0 "Поручить следующий осмотр самим земледельцам."
 HSM_BAR_collegium.22.b:0 "Сохранить оплачиваемую проверочную бригаду."
 HSM_BAR_collegium.23.t:0 "Дверь в защитном круге"
 HSM_BAR_collegium.23.d:0 "Защита выдерживает пробный разряд. Затем жилец пытается выйти и обнаруживает, что засов слушается лишь Вииру. Она говорит: это легко исправить. Асинти просит исправить до того, как здесь кто-нибудь уснёт.\n\nОни тратят ещё одну ночь на переделку механизма. Утром ребёнок открывает калитку без магии. Защита немного слабее. Наконец в доме можно жить."
 HSM_BAR_collegium.23.a:0 "Механический выход для каждого жильца."
 HSM_BAR_collegium.23.b:0 "Обучить смотрителей из жителей и установить аварийные выходы."
 HSM_BAR_collegium.24.t:0 "Без речи четверых"
 HSM_BAR_collegium.24.d:0 "Комитет памятного дня попросил основателей присутствовать без выступлений. По дороге Сильвер всё равно репетирует извинение. У ворот Леопольд касается его плеча, и он убирает листок.\n\nИмена читают знавшие погибших. При появлении Асинти некоторые уходят. Виира не зовёт их обратно. После церемонии четверо вместе со всеми относят стулья в кладовую."
 HSM_BAR_collegium.24.a:0 "Учредить независимый памятный фонд семей."
 HSM_BAR_collegium.24.b:0 "Выделить архивистам время для поиска остальных имён."
 HSM_BAR_collegium_train_cohort:0 "Обучить гражданскую группу"
 HSM_BAR_collegium_train_cohort_desc:0 "Подготовить первую гражданскую группу за тридцать пять дней. Двести прикомандированных специалистов вернутся после окончания или отмены курса. Завершённый курс создаёт постоянную преподавательскую команду; повторное получение награды невозможно."
 HSM_BAR_collegium_equip_workshops:0 "Оснастить общие мастерские"
 HSM_BAR_collegium_equip_workshops_desc:0 "Оснастить общие мастерские измерителями: одна гражданская фабрика на тридцать пять дней и 25 единиц дополнительного оснащения. Завершённая программа один раз улучшает поддержку гражданского строительства."
 HSM_BAR_collegium_clinic_rounds:0 "Организовать районные медицинские выезды"
 HSM_BAR_collegium_clinic_rounds_desc:0 "Снабдить первые районные бригады 25 единицами дополнительного оснащения для тридцати пяти дней выездов и наблюдения. Их отчёт поможет медицинским исследованиям, а завершённая подготовка позднее усилит полевую медицинскую службу."
 HSM_BAR_collegium_repair_fields:0 "Восстановить первые опытные поля"
 HSM_BAR_collegium_repair_fields_desc:0 "На сорок два дня выделить одну гражданскую фабрику и 100 работников для дренажа и проверки почвы. После завершения работ люди вернутся в резерв, а местные земледельцы получат результаты обследования."
 HSM_BAR_collegium_settlement_houses:0 "Подготовить дома для добровольного поселения"
 HSM_BAR_collegium_settlement_houses_desc:0 "Одна гражданская фабрика за тридцать пять дней подготовит жильё. Добровольно оставшиеся жители включатся в гражданскую жизнь; 500 взрослых добровольцев станут доступны для службы. Участие в исследованиях остаётся отдельным решением."
 HSM_BAR_collegium_onward_travel:0 "Оплатить дальнейший путь"
 HSM_BAR_collegium_onward_travel_desc:0 "Потратить 20 единиц дополнительного оснащения на безопасный дальнейший путь, переносное жильё и припасы. Принятая помощь не обязывает никого трудиться на Баррад."
 HSM_BAR_collegium_review_complaint:0 "Рассмотреть жалобу представителя пациентов"
 HSM_BAR_collegium_review_complaint_desc:0 "Новый представитель пациентов оспорил порядок испытания. Проведём открытое слушание и выберем меры; перспективный результат не отменяет жалобу."
 HSM_BAR_collegium_war_allocation:0 "Ввести военное распределение"
 HSM_BAR_collegium_war_allocation_desc:0 "Приостановить поддержку строительства гражданских фабрик от этого духа и направить те же команды на полевую медицину и снабжение. Ежемесячной платы нет. Без мандата жителей действует постоянный штраф стабильности 2% на время распределения. Мир возвращает гражданские службы."
 HSM_BAR_collegium_civil_allocation:0 "Вернуть гражданское распределение"
 HSM_BAR_collegium_civil_allocation_desc:0 "Вернуть приборы и энергетический резерв обычным службам даже до окончания войны. Преимущества гражданского строительства заменят поддержку полевых служб."
 HSM_BAR_collegium_seek_mandate:0 "Получить общественный чрезвычайный мандат"
 HSM_BAR_collegium_seek_mandate_desc:0 "Провести двадцать один день открытых слушаний и заменить постоянные чрезвычайные полномочия обязательным мандатом жителей. Он снимает штраф стабильности военного распределения; никакой ресурс при этом не пополняется."
 HSM_BAR_collegium_maintain_reserve:0 "Оснастить резерв общественных служб"
 HSM_BAR_collegium_maintain_reserve_desc:0 "Выделить 50 единиц дополнительного оснащения и тридцать пять дней для оснащения постоянного эвакуационного и ремонтного резерва. Готовый резерв один раз сокращает расход припасов при военном распределении."
 HSM_BAR_collegium.17.open:0 "Открытая хартия даёт жителям, пациентам и сотрудникам места в совете коллегиума. Основатели сохраняют лаборатории, подчинённые общему закону. Независимый суд по жалобам вправе приостановить опасную программу даже вопреки всем четверым.\n\nСильвер дважды читает ограничения. Леопольд спрашивает о средствах на ремонт. Асинти проверяет право отказаться. Виира исправляет непонятное обычному читателю предложение. Они подписывают рядом с общественными свидетелями. Снаружи уже подают первую жалобу. Это, объясняет писарь, значит, что хартия начала действовать."
 HSM_BAR_collegium.17.republic:0 "Избранное собрание республики утверждает бюджет и назначает научный совет. Четверо остаются друзьями и исследователями; их должности могут перейти к другим. Председательское кресло Гасеницы — пост гражданской власти, а не пятый трон.\n\nЛеопольд проиграл голосование о расходах лаборатории. Сильвер помогает переписать заявку, Асинти приносит чай. Виира сидит напротив и отмечает объяснение, которое избиратели сочли непонятным. Писарь регистрирует исправленную просьбу по общим для всех правилам."
 HSM_BAR_collegium.17.tutelage:0 "Наставники сохраняют исполнительное руководство коллегиумом и его общественными программами. Гасеница по-прежнему возглавляет гражданское правительство. Хартия даёт обычным жителям меньше влияния на научную политику, чем требовали некоторые делегаты; те уходят без аплодисментов. Но суд, независимая отчётность и право отказаться от лечения остаются обязательными.\n\nВиира начинает объяснять, почему им нужно больше времени. Асинти просит сохранить несогласие в протоколе. Сильвер записывает его. Леопольд вписывает дату следующего общественного разбора. Они выбрали власть и обязательство, которое придётся исполнять вновь и вновь."
 HSM_BAR_collegium_programs:0 "Маготехнический коллегиум"
 HSM_BAR_collegium_programs_desc:0 "Клиника, школа, кристальная сеть и независимые инспекторы ведут общие программы Коллегиума. Их отчёты рассказывают о принятых пациентах, открытых классах и доставленном оборудовании. Гражданские учреждения и фронт нуждаются в одних и тех же специалистах и приборах."
 HSM_BAR_collegium_services:0 "Общественные службы коллегиума"
 HSM_BAR_collegium_services_desc:0 "Независимый архив и инспекторы, открытая школа, исследовательский совет и рецензирование дают указанные для них эффекты. Приоритеты клиники и сети сохраняются. Военное распределение заменяет поддержку гражданского строительства полевой медициной и снабжением; работа без общественного мандата даёт постоянный штраф стабильности на время этого режима."
 HSM_BAR_collegium_provisional:0 "Четверо под общественным надзором"
 HSM_BAR_collegium_provisional_desc:0 "Прощение толпы спасло четверых. Их временный коллегиум должен теперь оплачивать слушания, обеспечение согласия и надзора, постепенно заслуживая полномочия."
 HSM_BAR_collegium_open_spirit:0 "Хартия открытого коллегиума"
 HSM_BAR_collegium_open_spirit_desc:0 "Жители, пациенты и сотрудники управляют коллегиумом вместе с исследователями. Независимые суды защищают право отказа и проверяют общественные расходы."
 HSM_BAR_collegium_republic_spirit:0 "Наука под выборной властью"
 HSM_BAR_collegium_republic_spirit_desc:0 "Избранное собрание распоряжается научным финансированием и назначениями. Четверо остаются коллегами, подчинёнными тем же законам, что и их ученики."
 HSM_BAR_collegium_tutelage_spirit:0 "Подотчётные наставники"
 HSM_BAR_collegium_tutelage_spirit_desc:0 "Четверо сохраняют исполнительную власть над программами коллегиума. Независимые суды и защищённое право отказа ограничивают их власть, но слабое влияние общества остаётся источником трений."
 HSM_BAR_collegium_next_tree_tt:0 "Откроет второй этап коллегиума. Все прежние фокусы коллегиума и общей ветки останутся, сохранив завершённый прогресс."
