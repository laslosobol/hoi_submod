l_russian:
 HSM_ZYP_victory_roll:0 "Ведомость победы"
 HSM_ZYP_victory_roll_desc:0 "Трон, на который мы предъявили права в Грифенхейме, был целью, а не достигнутым результатом. Прежде чем провозглашать новый императорский титул, необходимо закрепить владение Герцландом и действительное управление им, напрямую либо через зависимые государства. Пусть военные и гражданские ведомства отчитаются о положении страны за победными сообщениями."
 HSM_ZYP_imperial_coronation:0 "Императорская коронация"
 HSM_ZYP_imperial_coronation_desc:0 "У Верении уже есть кайзер. У Грифонии ещё нет императора из дома Зипрессен. После закрепления власти в Герцланде подготовим отдельную коронацию и канцелярию, способную превратить новый титул в управление. Ни церемония, ни фамилия завоевателя не заменят согласия каждой короны за пределами столицы."
 HSM_ZYP_household_register:0 "Что говорят реестры"
 HSM_ZYP_household_register_desc:0 "В имперских архивах полезные сведения соседствуют с притязаниями на наследование. Отделим технические записи от придворных слухов, сохраним подтверждённые сведения о прежнем дворе и улучшим обмен информацией между ведомствами. Императору, желающему сменить династию, незачем притворяться, будто недостающая страница доказывает всё, во что хочется верить придворным."
 HSM_ZYP_rolls_of_the_crowns:0 "Короны привозят свои счета"
 HSM_ZYP_rolls_of_the_crowns_desc:0 "У зависимых правительств нашей династии есть собственные казначейства, мастерские и обязательства. Решим, что им предложить: защищённое местное управление с техническим сотрудничеством либо согласованные министерства для общих промышленных и военных дел. Семейная верность может начать разговор, но не определить ответ."
 HSM_ZYP_repair_the_arteries:0 "Грузы прежде церемоний"
 HSM_ZYP_repair_the_arteries_desc:0 "После победы ремонтные заказы конкурируют с перевозкой продовольствия, оборудования и войск. Поддержим инженеров и определим следующее вложение: гражданские мастерские и совершенствование строительства либо постоянное ведомство инфраструктуры и снабжения. Императорская процессия не перевезёт грузы, вытесненные её расписанием."
 HSM_ZYP_commissions_not_orders:0 "Комиссии вместо семейных приказов"
 HSM_ZYP_commissions_not_orders_desc:0 "Династические правители получили предложение об общих министерствах, и некоторые вернули его с вычеркнутыми абзацами. Со времени завоеваний, поставивших их у власти, казначейства и советы научились управлять. Трубаху предстоит договариваться с этими учреждениями: родство может обеспечить аудиенцию, но не полномочия, нужные его канцелярии."
 HSM_ZYP_arsenals_and_workshops:0 "Арсеналы и мастерские"
 HSM_ZYP_arsenals_and_workshops_desc:0 "Военному министерству нужно оружие, которое можно ремонтировать деталями не из одного-единственного арсенала. Расширим военное производство на надёжно управляемой территории и соберём промышленных специалистов для выработки общих требований. Власть династии распространится дальше, если её техника выдержит дорогу."
 HSM_ZYP_common_colleges:0 "Обмен практическими знаниями"
 HSM_ZYP_common_colleges_desc:0 "Общая фамилия не делает приборы всех лабораторий взаимозаменяемыми. Коллегии обменяются чертежами и преподавателями с коронами, подписавшими технические соглашения. Первой задачей станет опыт, который можно повторить в мастерской другой страны. Позднейшие участники привезут собственные приборы и вопросы о том, чему уже научились прежние партнёры."
 HSM_ZYP_the_muster_dispute:0 "Сбор войск и урожай"
 HSM_ZYP_the_muster_dispute_desc:0 "Аккуратный мобилизационный календарь штаба столкнулся с работой, которая кормит его солдат. Зависимые правители спрашивают, что следующая кампания оставит дома. Нам предстоит выбрать устройство собственных сил: усиленный постоянный кадровый состав с более тяжёлой внутренней нагрузкой либо ограниченные ротации с лучшей подготовкой и снабжением."
 HSM_ZYP_western_campaign:0 "Западные подступы"
 HSM_ZYP_western_campaign_desc:0 "Подготовим аквилейскую кампанию против правительств, которым теперь принадлежат намеченные территории. Старые названия на карте могут уже не обозначать государства перед нами. Нынешние союзники и зависимые владения не входят в новые требования; генеральный штаб должен отличать внешнюю границу от династического владения."
 HSM_ZYP_reconstruction_contracts:0 "Заказы после походных колонн"
 HSM_ZYP_reconstruction_contracts_desc:0 "Западному урегулированию недостаточно прошедших военных колонн. Дадим гражданским строителям надёжные заказы и разовьём методы, способные вернуть пострадавшему округу работающую экономику. Наши мастерские должны поддержать эту работу, не объявляя соседскую промышленность своей собственностью."
 HSM_ZYP_northern_campaign:0 "Северные пути"
 HSM_ZYP_northern_campaign_desc:0 "После урегулирования на западных подступах подготовим пути к Клаудбери, Ведине, Скайфоллу и Хаукленду. Штаб должен учитывать нынешние правительства и владения, не предполагая, что каждая прежняя корона ещё правит. Соглашения с союзниками остаются соглашениями, даже если их земли нанесены на имперскую карту."
 HSM_ZYP_southern_campaign:0 "Южные мастерские"
 HSM_ZYP_southern_campaign_desc:0 "Урегулированный север позволяет штабу обратиться к Вингбардии и южным промышленным государствам. Их печи и мастерские значат не меньше дворцов. Подготовим требования к действительным независимым владельцам, не превращая уже служащие династии зависимые короны в завоевание, которое следует повторить."
 HSM_ZYP_eastern_campaign:0 "За восточными марками"
 HSM_ZYP_eastern_campaign_desc:0 "Восточные марки открывают пути к Хеллквиллу, Лонгсворду, Луши и более дальним восточным княжествам. Готовить этот поход следует лишь после урегулирования прежних направлений. Амбиции императора охватывают Грифонию, но штаб обязан двигаться через действительные территории, обеспеченные маршруты и правительства, способные дать ответ."
 HSM_ZYP_seats_for_new_crowns:0 "Места для позднейших участников"
 HSM_ZYP_seats_for_new_crowns_desc:0 "Кампании расширили круг зависимых корон. Новые правители приходят со своими чиновниками, долгами и местными обещаниями, которых имперская канцелярия не составляла. Трубах предложит им места рядом с прежними участниками, и им так же придётся согласовать, какие полномочия останутся дома, а какие можно доверить общим учреждениям."
 HSM_ZYP_accounts_after_campaign:0 "Счета после кампаний"
 HSM_ZYP_accounts_after_campaign_desc:0 "Региональные кампании завершились урегулированием через имперское владение, зависимые правительства или союзные договорённости. Проверим, чем действительно распоряжаются наши министерства и что остаётся обязанностью другого правительства. Устойчивому производству нужны заказы, сохраняющие силу после отъезда офицера, который их впервые потребовал."
 HSM_ZYP_crown_and_countries:0 "Одна династия, многие страны"
 HSM_ZYP_crown_and_countries_desc:0 "Императорская корона получила задачу континентального масштаба. Её успех нельзя измерять, называя каждое зависимое правительство канцелярией, а каждого союзника подданным. Закрепим опыт армии и практические службы обеспечения, сохранив честную запись о согласованных полномочиях. Будущим Зипрессенов необходимо управлять, а не только провозглашать его."
 HSM_ZYP_imperial_chancery:0 "Императорская канцелярия"
 HSM_ZYP_imperial_chancery_desc:0 "Новое имперское ведомство подкрепляет коронацию Трубаха стабильностью и политическим авторитетом. Оно действует, пока сохраняются его независимое правительство и действительный контроль над Грифенхеймом через Верению или её подданных."
 HSM_ZYP_autonomous_crown:0 "Автономное династическое соглашение"
 HSM_ZYP_autonomous_crown_desc:0 "Это зависимое правительство согласилось на техническое сотрудничество, сохранив собственную администрацию. Устойчивые местные заказы благоприятствуют гражданскому строительству ценой постоянных политических затрат. Соглашение не передаёт территории или суверенитет."
 HSM_ZYP_common_ministries:0 "Согласованные общие министерства"
 HSM_ZYP_common_ministries_desc:0 "Это правительство прямо передало согласованные промышленные и технические обязанности общим министерствам. Военное производство и исследования получают преимущества, а управление требует политических усилий. Корона, территория и прежнее положение зависимого государства сохраняются."
 HSM_ZYP_dynastic_exchange:0 "Действующее династическое сотрудничество"
 HSM_ZYP_dynastic_exchange_desc:0 "Хотя бы одна подходящая корона приняла соглашение об общих учреждениях. Обмен ускоряет исследования и рост эффективности производства ценой политических затрат имперского правительства. Если все партнёры отказали, сотрудничеством ещё некому заниматься."
 HSM_ZYP_railway_board:0 "Ведомство координации перевозок"
 HSM_ZYP_railway_board_desc:0 "Постоянные диспетчеры согласуют инфраструктурные работы и сокращают расход военных припасов. Их полномочия касаются нашего транспортного управления: железные дороги другой короны им не передавали."
 HSM_ZYP_professional_muster:0 "Постоянные походные кадры"
 HSM_ZYP_professional_muster_desc:0 "Постоянные офицеры и специалисты улучшают организацию и планирование. Содержание этих кадров создаёт внутреннее напряжение. Мера перестраивает нашу армию, а не призывает войска зависимой страны одним указом."
 HSM_ZYP_limited_muster:0 "Ротации по силам округам"
 HSM_ZYP_limited_muster_desc:0 "Ограниченные ротации и практическое обучение сокращают время подготовки наших солдат и расход припасов. Штаб принимает более скромные постоянные обязательства в обмен на надёжное обеспечение."
 HSM_ZYP_settled_orders:0 "Заказы долговременнее похода"
 HSM_ZYP_settled_orders_desc:0 "Предсказуемые промышленные заказы поддерживают гражданское строительство и повышают предел эффективности производства. Имперская администрация учится обеспечивать длительный выпуск, а не считать каждую мастерскую временным военным складом."
 HSM_ZYP_imperial_business:0 "Дела императорской короны"
 HSM_ZYP_imperial_business_desc:0 "Отложенная коронация, неподписанное соглашение или устаревший план кампании могут потребовать нового решения. Канцелярия не вправе заменять согласие молчанием или требовать от прежнего владельца ответа за земли, которыми теперь владеет другой."
 HSM_ZYP_reconvene_coronation:0 "Возобновить подготовку коронации"
 HSM_ZYP_reconvene_coronation_desc:0 "Камергер сохранил исправленные приглашения. В Грифенхейме устроителям церемонии предстоит согласовать её с послевоенным порядком: кого принять, какую клятву прочесть и какой титул Трубах понесёт из зала. Приход армии не ответил ни на один из этих вопросов."
 HSM_ZYP_reopen_congress:0 "Возобновить переговоры о соглашениях"
 HSM_ZYP_reopen_congress_desc:0 "Некоторые короны ещё не поставили печати под соглашением. Канцелярия вернётся к их возражениям и предложит новым дворам изложить собственные нужды. Прежние участники будут ждать соблюдения своих условий, пока император договаривается с теми, кто ещё сомневается, чего потребует от них общее министерство."
 HSM_ZYP_review_campaign:0 "Пересмотреть владельцев на текущем направлении"
 HSM_ZYP_review_campaign_desc:0 "Последние донесения не совпадают с названиями на старой штабной карте. Спорная граница может теперь подчиняться другому правительству, а местный правитель скрываться под защитой чужой короны. Прежде чем Трубах направит новое требование, офицеры должны установить, кто способен ответить и какие соглашения ещё связывают императорский двор."
 HSM_ZYP_industry_bonus:0 "Династический обмен промышленными методами"
 HSM_ZYP_construction_bonus:0 "Строительные методы восстановления"
 HSM_ZYP_electronics_bonus:0 "Реестры и технические коллегии"
 HSM_ZYP_support_bonus:0 "Снабжение на походных маршрутах"
 HSM_ZYP_congress_tt:0 "Приглашает подходящих династических вассалов. Каждый может согласиться, потребовать автономных условий или отказать. Ответ ожидают 30 дней; новое приглашение возможно через 90 дней после предыдущего."
 HSM_ZYP_colleges_tt:0 "Каждая подходящая корона, давшая согласие, получает одну 100%-ную скидку на исследование электроники, включая позднейших участников. Уже выданные пособия не повторяются после перерыва или новых переговоров."
 HSM_ZYP_no_custody_tt:0 "Учитывает только установленные сведения о Гровере VI. Не перемещает, не нанимает, не удаляет и не назначает персонажей, не устанавливает опеку, регентство или восстановление династии."
 HSM_ZYP_campaign_tt:0 "Готовит цели войны против подходящих противников в первом неурегулированном регионе. Дружественные страны, их вассалы и текущие враги исключены. Объявление войны остаётся отдельным решением."
 HSM_ZYP_started:0 "Начато имперское продолжение Зипрессенов"
 HSM_ZYP_crowned:0 "Трубах принял новую императорскую корону"
 HSM_ZYP_coronation_pending:0 "Императорская коронация ожидает решения"
 HSM_ZYP_coronation_retry:0 "Действует шестидесятидневная отсрочка императорской коронации"
 HSM_ZYP_policy_chosen:0 "Выбрано предложение династическим коронам"
 HSM_ZYP_policy_pending:0 "Предложение об учреждениях ожидает выбора императора"
 HSM_ZYP_central_proposal:0 "Император предложил согласованные общие министерства"
 HSM_ZYP_works_chosen:0 "Выбрано направление вложений в восстановление"
 HSM_ZYP_works_pending:0 "Вложения в восстановление ожидают решения"
 HSM_ZYP_muster_chosen:0 "Выбран порядок сбора армии"
 HSM_ZYP_muster_pending:0 "Спор о сборе войск ожидает решения"
 HSM_ZYP_signed:0 "Это династическое правительство подписало соглашение об учреждениях"
 HSM_ZYP_autonomous:0 "Отдельная администрация этой короны защищена соглашением"
 HSM_ZYP_offer_pending:0 "Имперское предложение ожидает ответа этой короны"
 HSM_ZYP_offer_retry:0 "Династическое приглашение направлено менее девяноста дней назад"
 HSM_ZYP_counter_pending:0 "Автономное встречное предложение ожидает согласия императора"
 HSM_ZYP_refused:0 "Переговоры об учреждениях завершились без соглашения"
 HSM_ZYP_workshop_grant:0 "Разовое пособие на промышленное исследование предоставлено"
 HSM_ZYP_college_grant:0 "Разовое пособие на исследование электроники предоставлено"
 HSM_ZYP_frontier_retry:0 "После пересмотра владельцев на направлении ещё не прошло девяносто дней"
 hsm_ver_zypressen.0.t:0 "Карта после войны"
 hsm_ver_zypressen.0.d:0 "Писари принесли Трубаху две карты. Одна следовала за продвижением армий; другая показывала владения после урегулирования. Он велел подготовить вторую, потому что победоносная колонна могла покинуть округ раньше, чем его налоги, суды или железнодорожные счета переходили в другие руки.\n\nТеперь донесения со всего Герцланда описывали власть, способную остаться. Ведомости отличали учреждения под прямой властью Верении от возможных зависимых администраций, сохранявших собственные печати. Грифенхейм больше не был лишь конечным пунктом под военным приказом.\n\nПрежнее провозглашение дало Трубаху королевство и притязание на империю. Оно не совершило коронации, которую предлагали теперь. Камергер спросил, какой титул поставить в приглашениях. Трубах вернул пробный оттиск со старым титулом: следующему потребуется собственная церемония."
 hsm_ver_zypressen.0.a:0 "Подготовить императорскую коронацию."
 hsm_ver_zypressen.1.t:0 "Другая корона"
 hsm_ver_zypressen.1.d:0 "Трубах остановился у входа, пока последняя команда проходила вдоль караула. Этот звук был ему знакомее музыки внутри. Команду повторяли от ряда к ряду, и караул перестраивался у него на глазах. Императорский титул обещал нечто большее и менее послушное.\n\nОн уже провозгласил королевство. Корона, ожидавшая в Грифенхейме, принадлежала другой амбиции: сделать так, чтобы имя Зипрессен пережило армию, принёсшую его сюда. Под церемониальными тканями ещё виднелось свежее дерево. Где-то снаружи молоток продолжал стучать и в назначенный час. Победа дала ему столицу, требующую ремонта, а не готовую империю.\n\nНа мгновение он представил зал без своих офицеров, через годы после того, как их команды перестанут иметь значение. Будет ли его имя по-прежнему удерживать страну? Затем двери открылись. Он выпрямился, вошёл положенным шагом и позволил вопросу сопровождать себя к короне."
 hsm_ver_zypressen.1.a:0 "Принять императорскую корону и учредить её канцелярию."
 hsm_ver_zypressen.1.b:0 "Отложить церемонию; королевство сохраняется."
 hsm_ver_zypressen.2.t:0 "Родственники с казначействами"
 hsm_ver_zypressen.2.d:0 "Проект обращения называл зависимых правителей членами одного семейства. Приложенные счета делали их куда менее похожими. Одна казна зависела от гражданских заказов; другая могла выиграть от общих военных контрактов, если её чиновники понимали, какими полномочиями придётся поступиться.\n\nСекретарь Трубаха заметил, что семейное распоряжение будет короче конституционного предложения. Император указал на прошение с вопросом, кто оплатит простой мастерских после имперской реквизиции. Общая фамилия не давала ответа.\n\nОн мог предложить защищённое местное управление с техническим сотрудничеством, признав, что эти короны продолжат распоряжаться собственными делами. Или добиваться общих министерств с определёнными промышленными и техническими полномочиями. Второй порядок обещал более тесное согласование, но должен был выдержать настоящий ответ. Его назначенцы получили страны, которыми предстояло управлять. Они начинали говорить не только от имени династии, но и от имени этих стран."
 hsm_ver_zypressen.2.a:0 "Предложить автономным коронам общую программу работы."
 hsm_ver_zypressen.2.b:0 "Предложить общие министерства с прямо переданными полномочиями."
 hsm_ver_zypressen.3.t:0 "Имя в записях прежнего двора"
 hsm_ver_zypressen.3.dead.d:0 "Архивисты получили подтверждение смерти Гровера VI. Один чиновник предлагает вовсе закрыть дело прежнего двора; другой указывает на оставшиеся в нём требования и обязательства. Смерть решает вопрос о живом претенденте, но не каждый вопрос, оставленный его правительством. Трубах велит внести установленный факт, не превращая его в новый рассказ о событиях, которых никто в комнате не видел. Архив сохранит документы. Рассмотрение не меняет опеки и не восстанавливает династию."
 hsm_ver_zypressen.3.local.d:0 "Гровер VI отмечен как находящийся в нашей стране. Архивист отказывается превращать этот ограниченный факт в рассказ о его прибытии, сопровождавших его лицах или данных обещаниях. Трубах собрал это ведомство не для назначения регента и не для торга своей новой короной. Запись отразит присутствие, которое можно установить. Обстоятельства прежнего двора остаются вопросом свидетельств, а не тем, что писарь вправе переставить ради удобства церемонии."
 hsm_ver_zypressen.3.foreign.d:0 "Поиск по дворцовым записям обнаружил Гровера VI вне нашего правительства. Придворный предлагает написать так, будто взятие Грифенхейма непременно отдало прежнюю династию в руки Трубаха. Архивист кладёт рядом с проектом противоречающую запись. Владение столицей не означает владения каждым, кто когда-то был с ней связан. Присутствие за границей будет признано без выдуманных обстоятельств. Требований опеки, регентства или восстановления династии запись не содержит."
 hsm_ver_zypressen.3.d:0 "Сохранившиеся записи не подтверждают ни смерти Гровера VI, ни его присутствия при известном архивистам правительстве. Пробел неудобен для имперского реестра, и писарю советовали предложить правдоподобный вывод. Трубах велит сохранить неопределённость. Выдуманное местонахождение станет чьим-нибудь доказательством в следующем споре. Дело остаётся неполным; рассмотрение не назначает поискового отряда, передачи опеки, регентства или восстановления династии."
 hsm_ver_zypressen.3.a:0 "Записать лишь то, что можно установить."
 hsm_ver_zypressen.4.t:0 "Поезд, который не мог отправиться"
 hsm_ver_zypressen.4.d:0 "Вагонная ведомость обещала оборудование повреждённой мастерской. Диспетчерский график обещал тот же подъездной путь военному поезду. Ни одно распоряжение само по себе не было нелепым; вместе они заставили оба груза ждать, пока писарь искал подпись достаточно высокого начальника, чтобы отменить другое решение.\n\nСтроительное ведомство просило вложений в гражданские мощности и методы строительства. Более надёжное производство уменьшило бы соперничество за каждую запасную деталь. Транспортные чиновники отстаивали постоянное координационное управление, способное упорядочить движение ещё до закупоренного пути.\n\nТрубах годами требовал от ведомств работать быстрее. Здесь два ведомства быстро исполнили несовместимые указания. Он мог поддержать мастерские, снабжавшие систему, или диспетчеров, обеспечивавших её движение. Ждавшему за дверью инженеру требовалось решение, которое можно превратить в завтрашнюю работу."
 hsm_ver_zypressen.4.a:0 "Вложить средства в гражданские мастерские и строительные методы."
 hsm_ver_zypressen.4.b:0 "Учредить постоянное ведомство координации перевозок."
 hsm_ver_zypressen.5.t:0 "Два календаря"
 hsm_ver_zypressen.5.d:0 "Календарь генерального штаба показывал следующее сосредоточение войск. Окружная ведомость отмечала те же недели для работ, отсрочка которых скажется на продовольствии и ремонте. Окружная администрация вернула оба документа с вопросом: какое обещание должны нарушить её чиновники?\n\nТрубах дважды прочёл записку. Подписавшие её чиновники служили его собственному правительству, но именно им предстояло столкнуться с нехваткой после ухода имперской колонны. Это не делало возражение нелояльным. Это делало запрошенное обязательство дороже, чем признавал штабной расчёт.\n\nИмператор мог усилить собственные постоянные кадры, получив лучшую организацию и планирование ценой внутреннего напряжения. Или устроить ограниченные ротации, направив усилия на подготовку и снабжение, чтобы более скромное постоянное обязательство оставалось надёжным. Ожидавшим ответа чиновникам предстояло воплотить новый календарь в полях и мастерских ещё долго после того, как штаб обратится к следующей границе."
 hsm_ver_zypressen.5.a:0 "Создать постоянные кадры в нашей собственной армии."
 hsm_ver_zypressen.5.b:0 "Ввести ограниченные ротации с лучшей подготовкой и снабжением."
 hsm_ver_zypressen.6.t:0 "Какое ведомство вправе подписать?"
 hsm_ver_zypressen.6.d:0 "Проверка началась с заказа, возвращённого для уточнения. Имперский заголовок выглядел внушительно. Подпись принадлежала ведомству, которому не передавали полномочий над соответствующим поставщиком.\n\nСчетоводы разделили порядки: работа под прямым управлением Верении, обязанности участвующих корон и дела, по-прежнему оставленные другому правительству. Отказ не исчезал оттого, что карта кампании выросла. Союзную границу также нельзя было записать как зависимое казначейство лишь потому, что штаб больше не ожидал там войны.\n\nТрубах потребовал назвать в исправленном заказе учреждение, действительно способное его оплатить. Амбиции династии оставались континентальными. Её производство будет зависеть от менее зрелищных различий: кто обещал договор, из чьих средств его исполнят и сохранится ли ответ после ухода солдат. Поставщикам, ожидавшим подтверждения, очередной церемониальный титул был почти бесполезен."
 hsm_ver_zypressen.6.a:0 "Направлять заказы через ведомства, уполномоченные их исполнять."
 hsm_ver_zypressen.7.t:0 "Император и страны"
 hsm_ver_zypressen.7.d:0 "С балкона Трубах видел повозки, ожидавшие у восстановленной переправы. Патруль прошёл мимо, не остановив движение. Зрелище было обыкновенным, и он заметил, что смотрит дольше, чем смотрел на парад.\n\nРанние победы делали будущее династии похожим на череду мест, которых нужно достичь. Грифенхейм, затем дороги за ним, затем следующая граница. Теперь по этим путям везли припасы мастерским, рассчитывавшим работать и в следующем сезоне. Жители строили планы, предполагая, что его империя продолжит существовать. Эта уверенность радовала его и мешала легко отмахнуться от возможности провала.\n\nКонтинент не превратился в единое семейство. У стран оставались интересы, которых не могла поглотить фамилия, а сотрудничество союзника не было послушанием. Трубах всё ещё хотел, чтобы его династия пережила каждого соперника. Глядя на переправу, он начал подозревать, что её долговечность отчасти измерят тем, насколько редко обычной поездке понадобится ждать его."
 hsm_ver_zypressen.7.a:0 "Имперскому будущему всё ещё нужны правительства."
 hsm_ver_zypressen.10.t:0 "Предложение императора об учреждениях"
 hsm_ver_zypressen.10.central.d:0 "Имперское предложение просит наше правительство передать определённые промышленные и технические обязанности общим министерствам. Ожидаемые выгоды действительны: согласованные военные заказы, общие исследования и доступ к специалистам. Действительны и затраты на содержание новой администрации.\n\nДинастическая связь нашего правителя обеспечила возможность быть выслушанным, но не устранила интересов, представленных этой казной. Мастерская, ожидающая гражданских заказов, может прочесть предложение иначе, чем арсенал. Мы вправе принять передачу полномочий, предложить сотрудничество при защите собственной администрации или отказаться. Ни один текст не упраздняет нашу страну. Вопрос в том, какие учреждения готово разрешить наше правительство."
 hsm_ver_zypressen.10.d:0 "Имперское предложение обещает техническое сотрудничество с признанием нашей отдельной администрации. В проекте названы мастерские, чьи заказы можно объединить, и инженеры, которых пригласят проверить работу. Наши чиновники хотят знать, кто разрешит спорный счёт, если поставщик подчиняется другой короне.\n\nСвязь правителя с династией не делает решение казначейства автоматическим. Чиновники приложили к приглашению собственные требования: работа должна оставаться подотчётной разрешившим её ведомствам, а общие проекты не должны становиться предлогом для незаметного расширения имперских требований. Мы можем принять соглашение либо сохранить прежние отношения без него. Император попросил подпись; он ещё её не получил."
 hsm_ver_zypressen.10.a:0 "Передать согласованные обязанности общим министерствам."
 hsm_ver_zypressen.10.b:0 "Принять сотрудничество с защитой нашей администрации."
 hsm_ver_zypressen.10.c:0 "Предложить сотрудничество, но без общих министерств."
 hsm_ver_zypressen.10.e:0 "Отказать; сохранить прежние зависимые отношения."
 hsm_ver_zypressen.11.t:0 "Корона возвращает проект"
 hsm_ver_zypressen.11.d:0 "[From.GetName] возвращает проект передачи полномочий со своим вариантом. Правительство предлагает техническое сотрудничество и участие в практических проектах, но намерено сохранить собственную администрацию.\n\nСопроводительная записка описывает договоры, уже обещанные дома. Её автору придётся отвечать за их срыв после отъезда имперских чиновников. Династия представлена с обеих сторон переписки, но интересы двух казначейств всё же различаются.\n\nТрубах может принять более узкое соглашение и получить согласного партнёра либо отклонить изменённые условия, оставив прежние зависимые отношения неизменными. Ни один ответ не превратит первоначальное предложение в подпись, которой никто не давал. Возможность возражения теперь имеет конкретную цену для имперского замысла."
 hsm_ver_zypressen.11.a:0 "Принять автономное сотрудничество на предложенных условиях."
 hsm_ver_zypressen.11.b:0 "Отклонить встречное предложение, не навязывая министерства."
 hsm_ver_zypressen.12.t:0 "Ответ и назначение"
 hsm_ver_zypressen.12.d:0 "Ответ зависимого правительства поступил в императорскую канцелярию. Писарь кладёт его рядом с назначением правителя, затем открывает отдельное дело для предложения об учреждениях. Документы относятся к одной стране, но служат разным целям. Один фиксирует уже установленную династическую связь; другой фиксирует принятые или отвергнутые дополнительные обязанности. Будущим приказам придётся учитывать различие."
 hsm_ver_zypressen.12.a:0 "Подшить ответ, не переписывая его."
 hsm_ver_zypressen.20.t:0 "Названия на западной карте"
 hsm_ver_zypressen.20.d:0 "Штабной офицер начал с привычных названий аквилейских владений. Коллега прервал его нынешними ведомостями собственности: несколько строк плана следовало адресовать не тем правительствам, которые значились на старой карте.\n\nТрубах велел подготовить требования к независимым владельцам намеченных земель, а при иностранной зависимости обращаться к сюзерену. Союзники и наши подданные оставались вне требований. Там, где договорённость уже урегулировала границу, не требовалось выдумывать врага. Приказ готовил основания для кампании; перед началом войны армии всё равно понадобится отдельное решение."
 hsm_ver_zypressen.20.a:0 "Адресовать требования существующим правительствам."
 hsm_ver_zypressen.21.t:0 "Северные расстояния"
 hsm_ver_zypressen.21.d:0 "Северные планы охватывали Клаудбери, Ведину и пути к побережью и островам. Интендант положил грузовые таблицы рядом с цветными стрелками. Стрелка могла мгновенно пересечь большую часть карты; припасы за ней не могли.\n\nЗападное урегулирование позволило начать следующую подготовку. Оно не устранило необходимости различать нынешних владельцев, союзников и зависимые короны. Трубах одобрил требования там, где сохранялась внешняя независимая власть, включая сюзеренов местных подданных, не затрагивая дружественных отношений. Штаб подготовит кампанию, а не объявит север уже завоёванным."
 hsm_ver_zypressen.21.a:0 "Готовить пути столь же тщательно, как требования."
 hsm_ver_zypressen.22.t:0 "Печи за границей"
 hsm_ver_zypressen.22.d:0 "Южные промышленные отчёты интересовали Трубаха не меньше военных расчётов. Мастерские и печи могли обеспечить следующий этап имперской мощи, если их выпуск переживёт проход армий. Штабу приказали определить нынешних владельцев и их сюзеренов, а не планировать войну против исчезнувшего вингбардского правительства.\n\nСуществующие династические короны стояли в другой графе, чем будущие противники. Одну землю нельзя было считать одновременно зависимым обязательством и вражеским владением. После урегулирования прежних направлений новые требования были подготовлены. Потребуют ли они войны, оставалось отдельным решением."
 hsm_ver_zypressen.22.a:0 "Оставить прежние обязательства вне новых требований."
 hsm_ver_zypressen.23.t:0 "За пределами марок"
 hsm_ver_zypressen.23.d:0 "Восточный план расширялся, пока офицеры раскладывали сведения о марках и княжествах за ними. Каждое дополнение приносило другое правительство, более длинный путь или обязательство перед кем-то ещё. Притязание императора на континентальное будущее стало стопкой практических вопросов.\n\nТребования последуют за действительными независимыми владельцами намеченных земель и иностранными сюзеренами местных подданных. На союзные и наши зависимые правительства не станут нападать ради административного удобства. Трубах одобрил подготовку лишь после урегулирования прежних направлений. Даже теперь одобрение плана кампании не означало объявления войны."
 hsm_ver_zypressen.23.a:0 "Следующая граница требует работы, а не провозглашения."
