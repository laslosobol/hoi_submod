l_russian:
 HSM_BAR_mtc_frontiers_WIT_victory:0 "Баррад победил в оборонительной войне, начатой Виттенлендом"
 HSM_BAR_mtc_frontiers_WIT_attacked_history:0 "Виттенленд напрямую напал на Баррад с Коллегиумом"
 HSM_BAR_mtc_frontiers_direct_declaration:0 "Зафиксировано прямое объявление войны Виттенлендом"
 HSM_BAR_mtc_frontiers_defending:0 "Баррад обороняется от зафиксированного нападения Виттенленда"
 HSM_BAR_mtc_frontiers_conference:0 "Баррад участвует в мирной конференции как победитель Виттенленда"
 HSM_BAR_mtc_frontiers_held_before_war:0 "Область принадлежала Барраду до этой войны"
 HSM_BAR_mtc_frontiers_settlement:0 "Область получена Баррадом по итогам оборонительной победы"
 HSM_BAR_mtc_frontiers_registered:0 "Гражданская регистрация в области завершена"
 HSM_BAR_mtc_frontiers_registry_running:0 "Идёт восстановление гражданских реестров"
 HSM_BAR_mtc_frontiers_citizenship_running:0 "Идёт программа предоставления гражданства"
 HSM_BAR_mtc_frontiers_integrated:0 "Область приняла равное республиканское гражданство"
 HSM_BAR_mtc_frontiers_citizenship_report:0 "Собрание получило первый итоговый доклад о предоставлении гражданства"
 HSM_BAR_mtc_frontiers_ZES_goal:0 "Действует парламентское разрешение на войну против Казы"
 HSM_BAR_mtc_frontiers_OLV_goal:0 "Действует парламентский мандат против государства [OLV.GetName]"
 HSM_BAR_mtc_frontiers_ZES_goal_issued:0 "Решение по военному мандату в отношении Казы уже принято"
 HSM_BAR_mtc_frontiers_OLV_goal_issued:0 "Решение по военному мандату в отношении государства [OLV.GetName] уже принято"
 HSM_BAR_mtc_frontiers_ZES_vote:0 "Сохранилась запись о прежнем парламентском голосовании по Казе"
 HSM_BAR_mtc_frontiers_OLV_vote:0 "Сохранилась запись о прежнем парламентском голосовании по государству [OLV.GetName]"
 HSM_BAR_mtc_frontiers:0 "Республика среди соседей"
 HSM_BAR_mtc_frontiers_desc:0 "Для Пентархии внешняя политика была личной ссорой магов. Республика не может позволить себе такую роскошь. Министерству иностранных дел нужны публичные полномочия, оборонный бюджет и право оспаривать советы Коллегиума. Гражданские землемеры и армейские разведчики сверят карты пограничья прежде, чем собрание рассмотрит планы похода. Подготовка армии не освобождает от необходимости объяснить, зачем ей воевать."
 HSM_BAR_mtc_frontiers_supply:0 "Армия, которую можно снабжать"
 HSM_BAR_mtc_frontiers_supply_desc:0 "Показательный двигатель способен впечатлить комиссию за один день. Армейская повозка должна работать под дождём, в грязи и в копытах измотанного механика. Гражданские снабженцы введут единые требования к полевым мастерским и транспорту. Коллегиуму придётся отвечать не только за изобретения, но и за ремонт."
 HSM_BAR_mtc_frontiers_staff:0 "Офицеры перед собранием"
 HSM_BAR_mtc_frontiers_staff_desc:0 "Первые штабные учения закончатся в зале собрания. Офицеры объяснят расчёты потерь, боеприпасов и транспорта прежде, чем кто-либо проголосует за поход. Эти слушания будут неприятными. Армии, привыкшей к приказу мага, предстоит усвоить: отказ гражданской власти тоже является приказом."
 HSM_BAR_mtc_frontiers_ZES_hearing:0 "Слушания о Казе"
 HSM_BAR_mtc_frontiers_ZES_hearing_desc:0 "В пограничном деле соседствуют торговые споры, военные расчёты и совершенно разные оценки нового Баррада. Из них не следует, что любое правительство Казы является нашим естественным врагом. Интенданты превратят показания перевозчиков и проводников в практическое исследование снабжения. Собрание сможет начать переговоры, не отказываясь от права обсудить поход."
 HSM_BAR_mtc_frontiers_ZES_mandate:0 "Мандат в отношении Казы"
 HSM_BAR_mtc_frontiers_ZES_mandate_desc:0 "Сторонники вмешательства обещают безопасность подступов и доступ к южным рынкам. Противники спрашивают, когда республика, возникшая против произвола, получила право решать судьбу другой страны. Теперь собрание должно само разрешить спор: открыто одобрить наступательную цель и принять ответственность. Такой мандат ещё не приказывает армии переходить границу."
 HSM_BAR_mtc_frontiers_OLV_hearing:0 "Слушания: [OLV.GetName]"
 HSM_BAR_mtc_frontiers_OLV_hearing_desc:0 "За южной границей лежит [OLV.GetName], а не пустое место на карте. Торговцы и проводники знают дороги, по которым может пройти колонна вторжения, урожай или караван беженцев. Их показания лягут в основу исследования снабжения прежде, чем собрание рассмотрит сотрудничество или поход."
 HSM_BAR_mtc_frontiers_OLV_mandate:0 "Мандат: [OLV.GetName]"
 HSM_BAR_mtc_frontiers_OLV_mandate_desc:0 "Перед депутатами лежит план похода; его цель — [OLV.GetName]. Кабинет говорит о стратегической глубине; критики видят старые притязания под новой печатью. Собрание разрешит спор само, а не переложит ответственность на очередную комиссию. Одобренная цель допускает войну, но ещё не является приказом её начать."
 HSM_BAR_mtc_frontiers_WIT_line:0 "Рубеж против вторжения"
 HSM_BAR_mtc_frontiers_WIT_line_desc:0 "Притязания Виттенленда не исчезли с падением Амброзия. Инженеры обследуют оборонительные позиции, пока дипломаты сохраняют возможность разговора. Республика не предоставляет Сильвер Стару поход против его прежней родины. План укреплений должен защищать деревни, а не служить предлогом для личного сведения счётов."
 HSM_BAR_mtc_frontiers_WIT_armistice:0 "После оборонительной войны"
 HSM_BAR_mtc_frontiers_WIT_armistice_desc:0 "Виттенленд напал, и мирная конференция признала Баррад победителем. Эта последовательность важна: ею нельзя оправдать постороннее завоевание. Гражданская делегация рассмотрит положение только тех областей, которые действительно отошли нам. Судьбу остальных земель Виттенленда мы не вправе определять указом."
 HSM_BAR_mtc_frontiers_WIT_councils:0 "Советы по ту сторону границы"
 HSM_BAR_mtc_frontiers_WIT_councils_desc:0 "Военный губернатор может изъять зерно, но смена бланка не сделает реквизицию законной. Местные представители должны проверить земельные записи, открыть суды и получить право оспаривать чрезвычайные распоряжения. Интеграция начнётся пообластно: недоступный округ не должен держать остальные общины в заложниках."
 HSM_BAR_mtc_frontiers_WIT_charter:0 "Гражданство вместо добычи"
 HSM_BAR_mtc_frontiers_WIT_charter_desc:0 "Итоговая хартия предлагает тот же гражданский статус, что и в Барраде, а не бессрочную власть победителей. Регистрация должна предшествовать гражданству; устойчивое сопротивление остановит процесс. Никакое голосование не передаст нам область, принадлежащую другой стране. Обещание дано жителям, которыми мы действительно управляем, и его исполнение потребует времени и средств."
 HSM_BAR_mtc_frontiers_ZES_mandate_tt:0 "Завершение фокуса даёт цель войны на аннексию Казы сроком на 180 дней. Отдельное решение и дополнительная плата политической властью не нужны. Война не объявляется, земли не передаются и не становятся национальными. Последующее соглашение или утрата условий допустимости цели отзывают неиспользованное разрешение."
 HSM_BAR_mtc_frontiers_OLV_mandate_tt:0 "Завершение фокуса даёт цель войны на аннексию сроком на 180 дней. Цель — [OLV.GetName]. Отдельное решение и дополнительная плата политической властью не нужны. Война не объявляется, земли не передаются и не становятся национальными. Последующее соглашение или утрата условий допустимости цели отзывают неиспользованное разрешение."
 HSM_BAR_mtc_frontiers_WIT_councils_tt:0 "Открывает областную регистрацию: 50 политической власти, 60 дней, подчинение не ниже 25 и сопротивление не выше 35 на всём протяжении; даёт 10 подчинения и завершённую гражданскую регистрацию, но не национальную территорию. Доступна только в исторических областях Виттенленда, полученных по итогам зафиксированной оборонительной победы. Необходимы мир, владение и контроль. Отмена не возвращает затраты."
 HSM_BAR_mtc_frontiers_WIT_charter_tt:0 "Открывает предоставление гражданства уже зарегистрированным областям: 100 политической власти, 120 дней, подчинение не ниже 60 и сопротивление не выше 10 на всём протяжении. Необходимо сохранять мир, владение, контроль и доступ к учреждениям. Успешное завершение делает только данную область национальной территорией Баррада. Отмена не возвращает затраты и не даёт национальную территорию."
 HSM_BAR_mtc_frontiers_policy:0 "Гражданское устройство Виттенленда"
 HSM_BAR_mtc_frontiers_policy_desc:0 "Восстановление реестров и предоставление равного гражданства касаются только областей, полученных после прямого нападения Виттенленда на Баррад и поражения нападавшего на мирной конференции. Мандаты на походы принимаются в дереве фокусов, а не через эти областные программы."
 HSM_BAR_mtc_frontiers_assembly_t:0 "Кто вправе приказать начать поход?"
 HSM_BAR_mtc_frontiers_assembly_d:0 "Генеральный штаб принёс три папки. Председатель попросил четвёртую: с указанием полномочий, на основании которых подготовлены первые три. Инженер возразил, что дорогам безразлично, какая комиссия за них платит. Депутат от деревень ответил, что семьям будущих солдат это совсем не безразлично.\n\nКомпромисс устроил не всех. Коллегиум будет давать заключения, армия готовить планы, а гражданские представители отдельно разрешать каждую наступательную цель. Договоры сохраняют силу до официального расторжения. Впервые судьба соседа решается не в личном кабинете мага."
 HSM_BAR_mtc_frontiers_assembly_a:0 "Занесите эти ограничения в протокол."
 HSM_BAR_mtc_frontiers_ZES_vote_t:0 "Мандат по Казе принят"
 HSM_BAR_mtc_frontiers_ZES_vote_d:0 "Кабинет назвал предполагаемый поход мерой безопасности. На другом конце зала депутат вычеркнул эти слова и написал: «война, которую мы решаем начать». У правительства Казы есть свои сторонники, противники и обязательства; его нельзя превратить в удобного злодея из истории основания республики.\n\nПредложение прошло, а возражения остались в протоколе. На ближайшие шесть месяцев кабинет получил право добиваться военной цели. На границе пока тихо: разрешение не является приказом выступать, а собрание не присоединило соседа на бумаге и не превратило его жителей в наших граждан."
 HSM_BAR_mtc_frontiers_OLV_vote_t:0 "Цена стратегической глубины"
 HSM_BAR_mtc_frontiers_OLV_vote_d:0 "Штабной офицер положил линейку на южную карту. За этой чертой, сказал он, Баррад получит удобные подступы и линии снабжения. Торговец спросил, сколько хозяйств оказалось под линейкой. Никто не считал.\n\nТем не менее собрание утвердило военную цель на ближайшие шесть месяцев. В постановлении указан [OLV.GetName]; воспользоваться ли разрешением, решит кабинет. Местные жители не препятствия, нарисованные чернилами, а победа принесёт оккупацию, не мгновенное гражданство. Республика разрешила экспансию. Она не вправе притворяться, будто экспансия выбрала её сама."
 HSM_BAR_mtc_frontiers_peace_t:0 "Победа не заменяет конституцию"
 HSM_BAR_mtc_frontiers_peace_d:0 "Мирные документы устанавливают, кто напал и кто победил. Они не объясняют, как деревне выбирать совет, какой суд рассмотрит земельный спор и сохранит ли школа свои книги. Эти вопросы легли на стол гражданской делегации.\n\nВ её дело включаются только области, действительно переданные Барраду. Ни один чиновник не должен обводить новой границей земли, которыми по-прежнему управляет другая страна. Прежде чем заговорить о согражданах, республика обязана научиться управлять приобретёнными обязанностями, не считая их добычей."
 HSM_BAR_mtc_frontiers_peace_a:0 "Отправить управленцев, а не новых хозяев."
 HSM_BAR_mtc_frontiers_family_t:0 "Имя в списке делегации"
 HSM_BAR_mtc_frontiers_family_d:0 "Сильвер Стар нашёл своё имя среди предполагаемых советников и спросил, кто его вписал. «Вы знаете эту страну», ответил секретарь. Он уставился на список. Знать страну не значит иметь на неё право.\n\nЕго сестра Уайт Стар осудила тёмные искусства, уведшие его из Виттенленда. Он вспомнил её приговор с прежней обидой и с неудовольствием признал: обида не является доказательством. Какое бы положение сестра ни занимала теперь, её брат не вправе использовать победу республики для сведения личных счётов.\n\nОн вычеркнул предложение возглавить урегулирование и вместо этого предложил составить медицинскую опись. На этот раз возвращение домой не обязано было напоминать триумф."
 HSM_BAR_mtc_frontiers_delegation_d:0 "Проект полномочий делегации вернули без подписи. В нём временный управляющий одновременно становился судьёй, сборщиком налогов и последней инстанцией в любом споре. Приписка собрания содержала простой вопрос: неужели Баррад сверг Пентархию лишь для того, чтобы перенести её привычки за границу?\n\nНовая редакция сохраняет местные записи и требует гражданских слушаний перед постоянными изменениями. Делегация будет отчитываться перед республикой, а не превращаться в новый двор магов по ту сторону рубежа."
 HSM_BAR_mtc_frontiers_family_a:0 "Никаких личных притязаний от имени республики."
 HSM_BAR_mtc_frontiers_citizens_t:0 "Первый завершённый реестр"
 HSM_BAR_mtc_frontiers_citizens_d:0 "Первый областной реестр поступил с исправлениями тремя разными чернилами. Некоторые записи оспорили, другие восстановили после возвращения свидетелей. Секретарь извинилась за неопрятные страницы. Председатель ответил, что безупречно чистому реестру, составленному без единого возражения, доверять было бы гораздо труднее.\n\nЕго жители входят в республику на тех же гражданских основаниях, что и общины самого Баррада. Другим областям ещё предстоят собственные слушания. Завершение этой работы не даёт права пропустить их."
 HSM_BAR_mtc_frontiers_citizens_a:0 "Следующая область заслуживает таких же слушаний."
 HSM_BAR_mtc_frontiers_ZES_hearing_t:0 "Чего не доказывает дело Казы"
 HSM_BAR_mtc_frontiers_ZES_hearing_d:0 "Депутат попросил министерство отделить намерения соседа от наших собственных желаний. Получившееся дело заметно похудело. Полезнее оказалось исследование интендантов: переправы, ремонтные стоянки и склады отмечали по показаниям перевозчиков, а не по стрелкам на штабной карте.\n\nКопии уже переданы полевым мастерским. Гражданский посланник может теперь обсудить политические вопросы в Казе, либо собрание ограничится полученным докладом и не станет открывать переговоры. Ни один выбор не разрешает вторжение."
 HSM_BAR_mtc_frontiers_OLV_hearing_t:0 "Прежде южных карт"
 HSM_BAR_mtc_frontiers_OLV_hearing_d:0 "Проводники принесли наброски дорог, не совпавшие с аккуратными армейскими стрелками. Спор был не только географическим. За границей лежит [OLV.GetName]; одни депутаты хотели безопасности по обе её стороны, другие хотели её передвинуть. Председатель настоял на том, что это разные предложения.\n\nВ готовом исследовании снабжения описаны дороги, зимние склады и пределы возможностей армейского транспорта. Мастерские получат его независимо от решения о переговорах. Дипломатическое обращение ещё может открыть возможность сосуществования, но не является разрешением на войну."
 HSM_BAR_mtc_frontiers_envoy:0 "Отправить гражданского посланника."
 HSM_BAR_mtc_frontiers_registry_614:0 "Восстановить гражданские записи: $STATE_614$"
 HSM_BAR_mtc_frontiers_registry_614_desc:0 "Прежде чем обещать гражданство, нужно восстановить земельные записи, сведения о пропавших и сельские советы. Работа занимает 60 дней, стоит 50 политической власти и даёт 10 подчинения. Необходимы владение и контроль, мир, подчинение не ниже 25 и сопротивление не выше 35 на всём протяжении. Прерывание не даёт награды и не возвращает расходы."
 HSM_BAR_mtc_frontiers_citizenship_614:0 "Предоставить равное гражданство: $STATE_614$"
 HSM_BAR_mtc_frontiers_citizenship_614_desc:0 "После завершения регистрации область может принять общую гражданскую хартию. Это стоит 100 политической власти и занимает 120 дней при сохранении мира, владения и контроля, подчинения не ниже 60 и сопротивления не выше 10. Только успешное завершение делает данную область национальной территорией; другие области и прежние национальные принадлежности не затрагиваются."
 HSM_BAR_mtc_frontiers_registry_615:0 "Восстановить гражданские записи: $STATE_615$"
 HSM_BAR_mtc_frontiers_registry_615_desc:0 "Прежде чем обещать гражданство, нужно восстановить земельные записи, сведения о пропавших и сельские советы. Работа занимает 60 дней, стоит 50 политической власти и даёт 10 подчинения. Необходимы владение и контроль, мир, подчинение не ниже 25 и сопротивление не выше 35 на всём протяжении. Прерывание не даёт награды и не возвращает расходы."
 HSM_BAR_mtc_frontiers_citizenship_615:0 "Предоставить равное гражданство: $STATE_615$"
 HSM_BAR_mtc_frontiers_citizenship_615_desc:0 "После завершения регистрации область может принять общую гражданскую хартию. Это стоит 100 политической власти и занимает 120 дней при сохранении мира, владения и контроля, подчинения не ниже 60 и сопротивления не выше 10. Только успешное завершение делает данную область национальной территорией; другие области и прежние национальные принадлежности не затрагиваются."
