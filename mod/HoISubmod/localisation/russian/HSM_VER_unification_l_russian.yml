l_russian:
 HSM_VER_UNI_convention:0 "Веренский конвент"
 HSM_VER_UNI_convention_desc:0 "Речные страны показали, как совместная работа может стать основой общего государства. Нашим домам предстоит составить собственное соглашение. Дом, созывающий конвент, добивается конституционного председательства, но его делегатам придётся объяснить, перед кем оно будет отвечать. Города приходят со своими обычаями и судами; сохранившиеся правительства приносят полномочия, которые не уступят за одно обещание."
 HSM_VER_UNI_convention_tt:0 "Приглашает дома к объединению под нашим председательством. §YДля аннексии потребуется отдельное согласие.§! Нейтральный Авиан не мешает союзу герцогств. Война или оккупация приостанавливает процесс; окончательное согласие затем нужно возобновить."
 HSM_VER_UNI_customs_union:0 "Единый таможенный тариф"
 HSM_VER_UNI_customs_union_desc:0 "Купцы могут пересекать мирную границу и всё же дважды платить за один груз. Общему тарифу предстоит выдержать первую встречу с гружёным возом и двумя писарями, привыкшими вести разные книги. Дома сверят сборы и квитанции, чтобы документы перевозчика имели одинаковую силу на обеих заставах."
 HSM_VER_UNI_customs_union_tt:0 "Все участники получают указанный ниже дух общей таможни. Внедрение занимает §Y60 дней§!."
 HSM_VER_UNI_common_works:0 "Дороги и общие мастерские"
 HSM_VER_UNI_common_works_desc:0 "Мост не может обрываться там, где у землеустроителя меняется бланк. Инженеры округов согласуют нагрузки, поставки и обслуживание. Новые гражданские мастерские позволят проверить договорённости на деле: крепления, заказанные на одном берегу, должны попасть к строителям на другом до подъёма воды."
 HSM_VER_UNI_common_works_tt:0 "Каждый участник получает указанный ниже дух, §G1 ячейку строительства§! в своём исконном центре и §G1 гражданскую фабрику§! при наличии вместимости. Вложение однократное."
 HSM_VER_UNI_common_administration:0 "Общая гражданская служба"
 HSM_VER_UNI_common_administration_desc:0 "Новые учреждения нужно финансировать и наделить полномочиями, которые герцог не сможет отменить из-за неудобного прошения. Местные титулы и языки Авиана сохранят место в общем реестре. Личная переписка Розалин и Монтага не даёт чиновникам права устраивать брак: учреждения должны опираться на публичный договор."
 HSM_VER_UNI_common_administration_tt:0 "Расходует §Y100 политической власти§!. Все участники получают указанный ниже дух; переход к общей администрации занимает §Y90 дней§!."
 HSM_VER_UNI_unified_command:0 "Единая система приказов"
 HSM_VER_UNI_unified_command_desc:0 "Иовинус знает, как легко временный штаб становится постоянным правительством. Офицерам Винсента тоже придётся признавать приказы с подписью другого округа. Общий штаб подотчётен конституционному председательству и утверждённому бюджету. Местные традиции службы сохраняются в единой системе командования."
 HSM_VER_UNI_unified_command_tt:0 "Расходует §Y50 политической власти§!. Все участники получают указанный ниже дух общего командования."
 HSM_VER_UNI_constitutional_draft:0 "Окончательные статьи"
 HSM_VER_UNI_constitutional_draft_desc:0 "У делегатов уже есть таможенная служба, общественные работы, общие учреждения и штаб, которые можно объединить конституцией. Последние подписи будут означать больше, чем принятие приглашения. Каждое оставшееся правительство должно прямо согласиться прекратить отдельное существование страны, передать войска и владения и признать председательство созвавшего конвент дома."
 HSM_VER_UNI_constitutional_draft_tt:0 "Запрашивает отдельное прямое согласие каждого сохранившегося участника на присоединение. Отказ выводит дом из соглашения; отказ любого необходимого герцогства завершает этот конвент."
 HSM_VER_UNI_constitutional_act:0 "Единое Веренское государство"
 HSM_VER_UNI_constitutional_act_desc:0 "Акт подчиняет общие учреждения единому суверенному правительству во главе с домом, созвавшим конвент. Его статьи защищают местные обычаи, суды и языки. Старые притязания герцогов теперь будут рассматриваться внутри страны, которую они прежде разделяли, а общая печать свяжет ведомства, отвечавшие лишь собственному дому."
 HSM_VER_UNI_constitutional_act_tt:0 "§RАннексирует согласившихся участников, получая их войска и владения.§! Национальными становятся только исконные земли объединённых домов. Наш лидер сохраняет власть. Духи конвента заменяются указанной ниже учредительной администрацией."
 HSM_VER_UNI_settled_institutions:0 "Первый обычный бюджет"
 HSM_VER_UNI_settled_institutions_desc:0 "Министерствам предстоит представить первый обычный бюджет объединённой страны. Представители округов привозят сметы ремонта и школьные списки вместо соперничающих заявлений о суверенитете. Подпись председателя сопоставит обещания нового государства с его доходами, и каждый округ захочет увидеть, где в счетах учтены его нужды."
 HSM_VER_UNI_settled_institutions_tt:0 "Заменяет учредительную администрацию указанным ниже постоянным духом. Дополнительно даёт §G+3% стабильности§!."
 HSM_VER_UNI_can_start_tt:0 "Завершённое урегулирование по хартии или признанная военная победа, мирные исконные земли и отсутствие другого председательства. Позиция второго дома по объединению должна допускать созыв конвента."
 HSM_VER_UNI_can_customs_tt:0 "Все необходимые дома признали наше председательство. Необязательные приглашения должны получить ответ. Соглашение действительно и не приостановлено."
 HSM_VER_UNI_can_works_tt:0 "Таможенный союз действует, а общие работы ещё не получили финансирование."
 HSM_VER_UNI_can_administration_tt:0 "Общие работы завершены, прошли шестьдесят дней таможенного перехода, соглашение действительно и имеется не менее 100 политической власти."
 HSM_VER_UNI_can_command_tt:0 "Общая администрация учреждена, прошли девяносто дней перехода, соглашение действительно и имеется не менее 50 политической власти."
 HSM_VER_UNI_can_draft_tt:0 "Единое командование действует, а окончательные статьи ещё не выносились на утверждение."
 HSM_VER_UNI_can_found_tt:0 "Все этапы и сроки завершены; каждый сохранившийся участник прямо согласен на присоединение. Исконные земли должны принадлежать участникам и полностью контролироваться ими, без войны и чужого сюзерена."
 HSM_VER_UNI_can_settle_tt:0 "Учреждённое единое государство владеет всеми пятью герцогскими областями, независимо, находится в мире и завершило шестьдесят дней учредительной администрации."
 HSM_VER_UNI_customs_spirit:0 "Общая таможня"
 HSM_VER_UNI_customs_spirit_desc:0 "Единый тариф и совместимые промышленные стандарты сокращают повторную работу."
 HSM_VER_UNI_works_spirit:0 "Межобластные работы"
 HSM_VER_UNI_works_spirit_desc:0 "Общие подряды связывают мастерские и дороги по обе стороны прежних границ."
 HSM_VER_UNI_administration_spirit:0 "Создание общей службы"
 HSM_VER_UNI_administration_spirit_desc:0 "Новые учреждения требуют политического внимания, пока налаживают надёжную общую отчётность."
 HSM_VER_UNI_command_spirit:0 "Общее конституционное командование"
 HSM_VER_UNI_command_spirit_desc:0 "Общий штаб подчиняется председательству, сохраняя местные традиции службы."
 HSM_VER_UNI_constitutional_state:0 "Учреждённое Веренское государство"
 HSM_VER_UNI_constitutional_state_desc:0 "Учредительная администрация объединяет промышленность и оборону под одной властью. Первый обычный бюджет ещё готовится."
 HSM_VER_UNI_settled_state:0 "Общие учреждения Верении"
 HSM_VER_UNI_settled_state_desc:0 "Местные обычаи и языки сохраняются в едином конституционном государстве. Школы, учреждения, мастерские и общий штаб обеспечивают устойчивую основу его председательства."
 HSM_VER_UNI_participation_tt:0 "Присоединяется к учреждениям указанного председательства. Наша администрация продолжает работу; поглощение страны потребует отдельного окончательного голосования."
 HSM_VER_UNI_absorption_warning_tt:0 "§RЭто согласие разрешает прекращение существования нашего независимого государства.§! По конституционному акту наше управление, войска и владения перейдут стране указанного председателя. Новыми национальными территориями станут только исконные земли."
 hsm_ver_uni.10.t:0 "Конвент под председательством дома Эри"
 hsm_ver_uni.10.d:0 "Дом Эри предлагает общую таможенную службу, общественные работы, гражданскую администрацию и военный штаб под конституционным председательством Винсента. Каждый этап будет завершён до рассмотрения вопроса о едином суверенном государстве. Статьи сохранят место для местных судов, обычаев и языков Авиана.\n\nНаши делегаты могут участвовать, пока собственное правительство продолжает работу. Передача суверенитета потребует отдельного голосования по готовой конституции. Пока приглашение спрашивает, готовы ли мы помочь её составить и выслушать, что другие дома согласны доверить общей стране."
 hsm_ver_uni.20.t:0 "Акт об объединении: дом Эри"
 hsm_ver_uni.20.d:0 "Делегаты принесли готовые статьи и акты передачи власти единому государству под председательством Винсента. Дом Эри просит нашей окончательной подписи. Местные обычаи, суды и языки защищены, но отдельное правительство прекратит существование: его полки, материковые округа и заморские владения перейдут общей стране.\n\nСекретарь зачитывает условия передачи вслух, прежде чем положить перо на стол. Подпись здесь будет означать больше, чем сотрудничество соседей. Отказ выведет наш дом из этого конвента; согласие доверит его будущее конституции, которую мы помогли составить. Никто не вправе подписать за нас."
