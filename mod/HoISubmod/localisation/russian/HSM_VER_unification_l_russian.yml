 hsm_ver_uni.decline:0 "Отклонить приглашение."
 hsm_ver_uni.participate:0 "Присоединиться к учреждениям; сохранить право окончательного решения."
 hsm_ver_uni.refuse_absorption:0 "Сохранить нашу страну. Отказаться от акта."
 hsm_ver_uni.approve_absorption:0 "§RОдобрить присоединение и прекращение существования нашей страны.§!"
 hsm_ver_uni.30.t:0 "Первый день единого государства"
 hsm_ver_uni.30.d:0 "Общая печать поставлена на конституции рядом с названиями участвующих округов. [Root.GetLeader] остаётся во главе сохранившегося правительства. Местные обычаи и суды домов теперь действуют внутри единого государства.\n\nЗа стенами собрания учреждения продолжают работу, сделавшую акт возможным: принимают прошения, оплачивают мастерские и отдают приказы. Казначейство приступило к сверке окружных смет для первого обычного бюджета. Он станет следующим отчётом нового председательства перед гражданами."
 hsm_ver_uni.30.a:0 "Пусть учреждения отвечают перед страной."

