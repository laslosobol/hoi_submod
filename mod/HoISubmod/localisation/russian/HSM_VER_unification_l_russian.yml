 hsm_ver_uni.12.t:0 "Конвент под председательством дома Авиан"
 hsm_ver_uni.12.d:0 "Дом Авиан предлагает общую таможенную службу, общественные работы, гражданскую администрацию и военный штаб под конституционным председательством Катрины. Каждый этап будет завершён до рассмотрения вопроса о едином суверенном государстве. Статьи сохранят место для местных судов, обычаев и языков Авиана.\n\nНаши делегаты могут участвовать, пока собственное правительство продолжает работу. Передача суверенитета потребует отдельного голосования по готовой конституции. Пока приглашение спрашивает, готовы ли мы помочь её составить и выслушать, что другие дома согласны доверить общей стране."
 hsm_ver_uni.22.t:0 "Акт об объединении: дом Авиан"
 hsm_ver_uni.22.d:0 "Делегаты принесли готовые статьи и акты передачи власти единому государству под председательством Катрины. Дом Авиан просит нашей окончательной подписи. Местные обычаи, суды и языки защищены, но отдельное правительство прекратит существование: его полки, материковые округа и заморские владения перейдут общей стране.\n\nСекретарь зачитывает условия передачи вслух, прежде чем положить перо на стол. Подпись здесь будет означать больше, чем сотрудничество соседей. Отказ выведет наш дом из этого конвента; согласие доверит его будущее конституции, которую мы помогли составить. Никто не вправе подписать за нас."
