l_russian:
 HSM_ERI_diplomatic_settlement:0 "Наследство, которым можно поделиться"
 HSM_ERI_diplomatic_settlement_desc:0 "Винсент может сохранить представление о своих правах на Верению, не заставляя соседей жить под угрозой его армии. Он выберет соглашение с Эйри: выслушает страну, даст слово родственникам и примет обязательства для собственных офицеров, прежде чем требовать сдержанности от Иовинуса. Этот выбор закрывает путь к навязыванию наследственных прав завоеванием. Даже если другой двор откажет, у Эри останется будущее, которое стоит строить."
 HSM_EYR_diplomatic_settlement:0 "Безопасность без вражды"
 HSM_EYR_diplomatic_settlement_desc:0 "Иовинус так долго охранял границу, что его офицеры начали путать её безопасность со свободой устраивать набеги. Он выберет урегулирование, защищающее Эйри без подчинения Эри. Сведения о войсках должны быть честными, родственникам следует дать слово, а гарантии обязаны связывать оба командования. Армия будет защищать страну. Она не станет отвечать на неудачную конференцию завоеванием соседа."
 HSM_VER_diplomatic_route_tt:0 "Наш дом выбирает договорное урегулирование и отказывается от военного объединения. Каждое соглашение требует согласия; заключённое перемирие действует до войны или договора о дружбе. При неудаче переговоров остаётся путь самостоятельного развития."
 HSM_VER_military_route_tt:0 "Выбирает §Yпуть военного объединения§! и §Rисключает ветвь договорного урегулирования§!. Победа ведёт к обустройству побеждённых округов и отдельному военному продолжению в отношении Авиана. Цели войны не объявляют войну автоматически; действующие перемирия, пакты и обязательства перед фракциями сохраняют силу. Выбор пути не отменяет их и не передаёт земли заранее."
 hsm_ver_routes.1.t:0 "Условия на границе"
 hsm_ver_routes.1.d:0 "Встреча проходит у переправы, которую ни одно сопровождение не решается оставить без охраны. Земледелец принёс порванную упряжь. Офицер, забравший его тягловых животных, назвал это реквизицией; семья, которой пришлось самой тянуть плуг, нашла другое слово. По другую сторону стола рассказывают почти такую же историю о наших патрулях.\n\nОсталось два предложения. Смешанные патрули будут разбирать происшествия вместе: за каждой спорной историей придётся следить офицерам обоих домов. Поддерживать такие проверки предстоит обоим дворам. Фонд возмещения вместо этого обяжет наш двор рассматривать имущественные требования и принять политическую цену признания ущерба.\n\nГарантии нужно выбрать до заключения перемирия. Впервые на границе обсуждают, на что мы готовы пойти сами."
 hsm_ver_routes.1.a:0 "Включить в патрули офицеров обоих домов."
 hsm_ver_routes.1.b:0 "Учредить фонд возмещения ущерба."
 hsm_ver_routes.2.t:0 "То, что мы ещё можем обещать"
 hsm_ver_routes.2.d:0 "Конференция закончилась без общего урегулирования, к которому мы стремились. Одни советники указывают на пустое место за столом, другие на статью, которую так и не удалось согласовать. Никто не может превратить отсутствующую подпись в обещание.\n\nСтроители за дверью принесли другие вопросы: какая школа получит крышу, где начнут работу дорожные бригады, смогут ли мастерские наконец оставить у себя учеников. Эти решения не требуют согласия чужого правительства.\n\nМы обещали прекратить попытки подчинить соседа силой. Разочарование от этого слова не освобождает. Сохранившиеся соглашения будут соблюдены; никогда не существовавшие не будут провозглашены. Мы будем защищать свою страну и восстанавливать её, не ставя её будущее в зависимость от новой конференции."
 hsm_ver_routes.2.a:0 "Работа дома должна продолжаться."
 HSM_VER_conference_construction_bonus:0 "Строительный опыт конференции"
 HSM_VER_diplomatic_route:0 "Выбран путь договорного урегулирования"
 HSM_VER_military_route:0 "Выбран путь военного объединения"
 HSM_VER_conference_failed_tt:0 "Конференция сорвана отказом или утратой партнёра, и ни одно приглашение не ожидает ответа. Наша страна независима, находится в мире и не связана действующей общей хартией."
 HSM_VER_diplomatic_routes_open_tt:0 "Ни Эри, ни Эйри не выбрали военное объединение."
 EYR_border_skirmish_desc:0 "На столе Иовинуса лежит очередное донесение с границы Эри. Капитаны требуют резкого ответа, пока соседи не приняли сдержанность за страх. Приграничные деревни знают цену таких ответов: вытоптанные поля, пропавшие повозки и новый рассказ о том, кто пересёк черту первым. Офицеры герцога готовы отнести его ответ за границу."
 EYR_border_skirmish_timeout_desc:0 "Бои на границе Эри затянулись вопреки первым заверениям капитанов. Посыльные приносят просьбы о патронах и вести о позициях, которые занимают, теряют и вновь оспаривают. Офицерам Иовинуса предстоит решить, сколько ещё солдаты смогут держаться, прежде чем отступление станет неизбежным. Позади повозки везут раненых через деревни, которым обещали короткую стычку."
 ERI_border_skirmish_desc:0 "Капитаны Винсента принесли очередную жалобу с границы Эйри и план, как разрешить её силой. Патруль перейдёт черту, заставе бросят вызов, а двор назовёт случившееся защитой своей чести. Семьям у дороги придётся разбираться с тем, что оставят после себя солдаты."
 ERI_border_skirmish_timeout_desc:0 "Столкновение с войсками Эйри продолжается вдоль спорной черты. Капитаны Винсента шлют противоречивые донесения, каждый просит времени, чтобы превратить упорный бой в обещанный двору быстрый успех. Солдаты у переправы пересчитывают патроны и ждут смены. Если закрепиться не удастся, офицерам придётся привести их домой с рассказом, который герцог вряд ли захочет услышать."
 ERI_create_wargoal_desc:0 "Старое притязание на Верению переписывают из родословных в военные записки. Придворные говорят об отнятом наследстве; офицеры требуют припасов, маршрутов и правительства, готового ответить за поход. Соперничающий дом заметит перемену в тоне. Спор, возобновлявшийся на каждом приёме, становится требованием, за которым стоит армия."
 ERI_white_peace_desc:0 "Списки потерь стали длиннее перечней спорных имений. Ни один двор не вернёт жизни, потраченные на защиту притязаний, но оба ещё могут приказать прекратить огонь. Посланник повезёт условия, оставляющие наследственный спор открытым и позволяющие уцелевшим солдатам вернуться домой. Другому дому предстоит решить, достаточно ли и ему этой войны."
