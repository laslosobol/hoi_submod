l_russian:
 HSM_VER_UI_AVI_government_tt:0 "Катрина или её конституционный преемник сохраняет курс Интергигантес."
 HSM_VER_UI_AVI_friendship_tt:0 "Свободные дома сохраняют мир; Договор о дружбе заключён."
 HSM_VER_UI_AVI_peace_entry_tt:0 "Договорный мир действует либо исходный мир ещё можно признать."
 HSM_VER_UI_AVI_union_peace_tt:0 "Конституционный союз и мир между тремя домами сохраняются."
 HSM_VER_UI_AVI_route_active_tt:0 "Мирный конституционный курс сохраняется."
 HSM_VER_UI_AVI_charter_consent_tt:0 "Все три дома ратифицировали хартию; её действие не приостановлено."
 HSM_VER_UI_AVI_charter_in_force_tt:0 "Конституционный курс и хартия трёх домов сохраняют силу."
 HSM_VER_UI_AVI_budget_answers_tt:0 "Эри и Эйри ответили на бюджетное предложение либо сроки ответа истекли."
 HSM_VER_UI_AVI_budget_reviewed_tt:0 "Первый общий бюджет рассмотрен."
 HSM_VER_UI_AVI_levy_settled_tt:0 "Спор о сборе урегулирован; Авиан отказался от исключительного сбора."
 HSM_VER_UI_AVI_no_charter_tt:0 "Действующей хартии трёх домов нет."
 HSM_VER_UI_AVI_separate_settlement_tt:0 "Переговоры не удались либо Авиан вне действующей хартии и не ожидает ратификации."
 HSM_VER_UI_AVI_start_effect_tt:0 "Признаёт действующий мир и открывает конституционные переговоры. Авиан наблюдает за конгрессом; членство в хартии требует отдельного согласия."
 HSM_VER_UI_AVI_language_effect_tt:0 "Открывает §Y$hsm_ver_avian.2.t$§!: дома определят языки общего управления."
 HSM_VER_UI_AVI_charter_effect_tt:0 "Выступает посредником в переговорах о хартии Эри и Эйри. Каждый дом вправе отказать; Авиан решает вопрос своего членства отдельно."
 HSM_VER_UI_AVI_budget_effect_tt:0 "Приглашает Эри и Эйри к общему бюджету. Каждый дом может внести вклад или отказать; Авиану нужен хотя бы один партнёр. Ответ ожидают 30 дней; новое приглашение возможно через 90 дней."
 HSM_VER_UI_AVI_services_effect_tt:0 "Общие службы трёх домов: +10% к росту эффективности производства и +5% к выпуску заводов, пока действует хартия."
 HSM_VER_UI_AVI_staff_effect_tt:0 "Общий штаб трёх домов: +5% к организации армии и -8% к потреблению снабжения, пока действует хартия."
 HSM_VER_UI_AVI_review_budget_effect_tt:0 "Открывает рассмотрение первого бюджета. Подтверждение итогов открывает фокус о спорном сборе, даже если оба дома отказались или не ответили в срок."
 HSM_VER_UI_AVI_minutes_effect_tt:0 "Через день опубликованные протоколы покажут, как хартия изменила общие учреждения домов. Открывает завершение конституционного урегулирования."
 HSM_VER_UI_AVI_levy_effect_tt:0 "Открывает §Y$hsm_ver_avian.30.t$§!: соблюдать освобождение от сбора или заявить исключение, приостанавливающее хартию."
 HSM_VER_UI_AVI_works_effect_tt:0 "Добавляет 1 гражданскую фабрику и 1 ячейку строительства в своей полностью контролируемой национальной области со свободным местом.\nЕсли подходящей области нет: вместо этого один бонус 100% к исследованию строительства."
 HSM_VER_UI_AVI_convention_effect_tt:0 "Завершает первый конституционный этап и открывает Учредительное собрание для дальнейшего объединения по согласию."
 HSM_VER_UI_ZYP_government_tt:0 "Трубах правит независимой фашистской Веренией и заявил права на имперский престол."
 HSM_VER_UI_ZYP_herzland_tt:0 "Верения или её подданные владеют всем Герцландом и полностью контролируют его."
 HSM_VER_UI_ZYP_crowned_government_tt:0 "Коронованный Трубах сохраняет независимое фашистское правительство без капитуляции."
 HSM_VER_UI_ZYP_capital_tt:0 "Грифенхеймом владеет Верения или её подданный, полностью контролирующий область."
 HSM_VER_UI_ZYP_policy_tt:0 "Предложение династическим коронам выбрано."
 HSM_VER_UI_ZYP_works_tt:0 "Направление вложений в восстановление выбрано."
 HSM_VER_UI_ZYP_muster_tt:0 "Спор о сборе войск разрешён."
 HSM_VER_UI_ZYP_west_tt:0 "Западом владеем мы, наши подданные, союзники по альянсу или их подданные."
 HSM_VER_UI_ZYP_north_tt:0 "Севером владеем мы, наши подданные, союзники по альянсу или их подданные."
 HSM_VER_UI_ZYP_three_regions_tt:0 "Запад, север и юг урегулированы; владение союзников по альянсу и их подданных засчитывается."
 HSM_VER_UI_ZYP_all_regions_tt:0 "Все четыре региона урегулированы; владение союзников по альянсу и их подданных засчитывается."
 HSM_VER_UI_ZYP_victory_roll_effect_tt:0 "Открывает послевоенный доклад и подготовку императорской коронации."
 HSM_VER_UI_ZYP_imperial_coronation_effect_tt:0 "Предстоит выбор на императорской коронации:\nПринять корону: +7% к стабильности и Императорская канцелярия (+5% к стабильности, +5% к приросту политической власти).\nОтложить: повторная церемония возможна через 60 дней."
 HSM_VER_UI_ZYP_household_register_effect_tt:0 "Открывает доклад с подтверждёнными сведениями о Гровере VI."
 HSM_VER_UI_ZYP_rolls_of_the_crowns_effect_tt:0 "Предстоит выбрать предложение династическим подданным: автономные соглашения или общие министерства. Каждая корона ответит отдельно."
 HSM_VER_UI_ZYP_repair_the_arteries_effect_tt:0 "Два бонуса 100% к исследованиям технологий обеспечения, затем выбор:\nГражданские мастерские: 1 фабрика и 1 ячейка на своей полностью контролируемой земле со свободным местом, плюс один бонус 100% к строительным исследованиям; без места вместо фабрики даётся второй бонус.\nВедомство перевозок: -10% к потреблению снабжения, +15% к скорости строительства инфраструктуры."
 HSM_VER_UI_ZYP_commissions_not_orders_effect_tt:0 "Приглашает династических вассалов к соглашению. Каждое правительство может согласиться, потребовать новых условий или отказать."
 HSM_VER_UI_ZYP_arsenals_and_workshops_effect_tt:0 "Два бонуса 100% к промышленным исследованиям.\nДобавляет 1 военный завод и 1 ячейку на своей полностью контролируемой земле со свободным местом; иначе даёт ещё один бонус 100% к промышленным исследованиям."
 HSM_VER_UI_ZYP_common_colleges_effect_tt:0 "Два бонуса 100% к исследованию электроники для Верении.\nКаждая подходящая корона, давшая согласие, однократно получает один бонус 100% к электронике, включая позднейших участников."
 HSM_VER_UI_ZYP_the_muster_dispute_effect_tt:0 "Открывает спор о профессиональных кадрах и ограниченной ротации войск."
 HSM_VER_UI_ZYP_campaign_effect_tt:0 "Даёт цели войны за области против подходящих внешних владельцев на первом открытом неурегулированном направлении; их сюзерены без земель там получают цели аннексии.\nИсключает дружественные страны и их подданных, а также текущих противников. Войну не объявляет."
 HSM_VER_UI_ZYP_western_campaign_effect_tt:0 "Открывает западную кампанию и доклад по ней.\n$HSM_VER_UI_ZYP_campaign_effect_tt$"
 HSM_VER_UI_ZYP_reconstruction_contracts_effect_tt:0 "Два бонуса 100% к исследованиям строительства.\nДобавляет 1 гражданскую фабрику и 1 ячейку на своей полностью контролируемой земле со свободным местом; иначе даёт ещё один бонус 100% к строительным исследованиям."
 HSM_VER_UI_ZYP_northern_campaign_effect_tt:0 "Открывает северную кампанию и доклад по ней.\n$HSM_VER_UI_ZYP_campaign_effect_tt$"
 HSM_VER_UI_ZYP_southern_campaign_effect_tt:0 "Открывает южную кампанию и доклад по ней.\n$HSM_VER_UI_ZYP_campaign_effect_tt$"
 HSM_VER_UI_ZYP_eastern_campaign_effect_tt:0 "Открывает восточную кампанию и доклад по ней.\n$HSM_VER_UI_ZYP_campaign_effect_tt$"
 HSM_VER_UI_ZYP_seats_for_new_crowns_effect_tt:0 "Приглашает новые подходящие короны к действующему соглашению. Каждая даёт отдельное согласие; прежние пожалования не повторяются."
 HSM_VER_UI_ZYP_accounts_after_campaign_effect_tt:0 "Открывает обсуждение послевоенных счетов империи."
 HSM_VER_UI_ZYP_crown_and_countries_effect_tt:0 "Открывает эпилог имперского устройства.\n+40 опыта армии и два бонуса 100% к исследованиям технологий обеспечения."
