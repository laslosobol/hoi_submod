l_russian:
 HSM_BAR_dir_charter:0 "[Player.GetHSMBAR_charter]"
 HSM_BAR_dir_charter_desc:0 "[Player.GetHSMBAR_charter_desc]"
 HSM_BAR_dir_charter_internal:0 "За дверью закрытой палаты"
 HSM_BAR_dir_charter_internal_desc:0 "У Службы уже есть имя, которого не слышал ни один баррадский министр. Её основатели по-прежнему собираются, когда засыпают пациенты Марты Кшемень. Теперь предстоит решить, кто снарядит следующую группу, кто вправе открыть лабораторию и кто может отказаться от опасного приказа. Ольха просит общую приборную мастерскую, чтобы каждой группе не приходилось заново собирать инструменты из обломков. Северин Ольха приносит найденные тетради; Ядвига Врона приносит список спускавшихся рабочих. Ни один не готов оставить другому и записи, и людей. За стенами палаты Михал Завиша строит республику. То, что возникнет здесь, не должно вновь превратить его страну в чужую опытную площадку."
 HSM_BAR_dir_charter_cover:0 "Комиссия по восстановлению"
 HSM_BAR_dir_charter_cover_desc:0 "Первые обследования выявили повреждения, с которыми не справиться обычным ремонтом. Комиссия по восстановлению объединит врачей, землемеров и инженеров мастерских; сельские советы по-прежнему будут решать, куда могут возвращаться семьи. Завиша ждёт от каждого специалиста ответа на простой вопрос: можно ли пить из колодца, засеять поле, открыть школу? Комиссии предстоит заслужить доверие результатами, которые выдержат следующую зиму. Одних печатей нового правительства для этого мало. Первыми судьями её работы станут сами возвращающиеся жители."
 HSM_BAR_dir_names:0 "[Player.GetHSMBAR_names]"
 HSM_BAR_dir_names_desc:0 "[Player.GetHSMBAR_names_desc]"
 HSM_BAR_dir_names_internal:0 "Два имени одной находки"
 HSM_BAR_dir_names_internal_desc:0 "В двух заключениях описан один колодец. Инженеры Завиши винят повреждённую кладку; в записях Марты есть наблюдения, которых кладка не объясняет. Обеим группам нужен доступ, и обе должны знать об опасности достаточно, чтобы вернуться. Врона предлагает разделить задания, сохранив предупреждения, но скрыв общего нанимателя. Исследователям предстоит научиться отвечать на обычные вопросы о своей работе так, чтобы любознательный чиновник не дошёл по их следу до палаты. Ольха предпочёл бы воспользоваться готовыми связями министерства. Их прикрытие первым испытает не вражеский агент, а добросовестный чиновник. Пока они спорят, колодец остаётся закрытым, а жители ходят за водой в соседнюю деревню."
 HSM_BAR_dir_names_cover:0 "Независимые обследования"
 HSM_BAR_dir_names_cover_desc:0 "Две группы обследовали один колодец и представили несовместимые сметы. Прежде чем начинать ремонт, комиссия должна выяснить, кто отвечает за каждое измерение и какие работы действительно оплачены. Независимое обследование обходится дороже, зато подрядчик не будет сам подтверждать свои спорные выводы. Завиша требует понятного заключения для сельского совета и имени того, кто ответит за неудачный ремонт. До разрешения спора деревню необходимо снабжать питьевой водой."
 HSM_BAR_dir_seal_labs:0 "[Player.GetHSMBAR_seal_labs]"
 HSM_BAR_dir_seal_labs_desc:0 "[Player.GetHSMBAR_seal_labs_desc]"
 HSM_BAR_dir_seal_labs_internal:0 "Что хранили запертые комнаты"
 HSM_BAR_dir_seal_labs_internal_desc:0 "Первый спуск не заставил умолкнуть помещения под старыми лабораториями. Землемер слышит движение за стеной, хотя на плане там сплошная порода. Ольха узнаёт предупреждение у двери, но утверждает, что не помнит автора. Врона приказывает обследовать подходы прежде, чем трогать замок. Землемерам предстоит выяснить, какие насосы, крепления и вентиляционные шахты можно восстановить, не открывая помещений, ради которых их когда-то построили. Марта требует осматривать рабочих до и после каждого посещения. Среди оставленных опытов может найтись средство вернуть поля к жизни. Искать его следует так, чтобы мёртвые магократы не получили новых помощников и новых подопытных."
 HSM_BAR_dir_seal_labs_cover:0 "Обследовать старые фундаменты"
 HSM_BAR_dir_seal_labs_cover_desc:0 "Строители приближаются к подвалам и галереям, которых нет на общедоступных планах поместья. Прежде чем прокладывать над ними дороги или возводить жильё, необходимо проверить состояние перекрытий. Комиссия сопоставит уцелевшие чертежи с новыми измерениями и отметит опасные подходы. Представители деревень получат точные границы закрытых участков вместо очередного бессрочного запрета. Там, где грунт надёжен, работы должны продолжаться: неизвестность не оправдывает отказ от восстановления целого округа. Решение о безопасности участка должно опираться на осмотр, а не на удобство подрядчика."
 HSM_BAR_dir_watchmen:0 "[Player.GetHSMBAR_watchmen]"
 HSM_BAR_dir_watchmen_desc:0 "[Player.GetHSMBAR_watchmen_desc]"
 HSM_BAR_dir_watchmen_internal:0 "Где умолкает дорога"
 HSM_BAR_dir_watchmen_internal_desc:0 "Пациенты Марты увереннее называют места, чем описывают симптомы. У одного кашель начинается возле определённой канавы; у другого прекращается за ручьём. Врона идёт по этим указаниям с врачебной сумкой и двумя землемерами, не выставляя оружие напоказ. Её группы научатся различать следы Пентархии и последствия забитого водостока. Знакомый врач или смотритель колодца представит исследователя там, где вопросы чужака заставили бы закрыть каждую дверь. Жителям нужен кто-то, кто вернётся после первого разговора. Они слишком часто встречали приезжих, которые записывали имя, обещали разобраться и исчезали. На этот раз у обследования должно быть продолжение."
 HSM_BAR_dir_watchmen_cover:0 "Выездные врачебные бригады"
 HSM_BAR_dir_watchmen_cover_desc:0 "Отдалённые поселения не могут ждать окончания дорожных работ, чтобы получить врачебную помощь. Выездные бригады привезут лекарства, обследуют источники воды и организуют перевозку тех, кому нужна больница. Врачи и землемеры сопоставят наблюдения, не заставляя семьи раз за разом добираться до окружных учреждений. Регулярные посещения помогут раньше замечать повторяющиеся заболевания. У сельских советов появятся знакомые специалисты, к которым можно обратиться при изменении обстановки."
 HSM_BAR_dir_evidence:0 "[Player.GetHSMBAR_evidence]"
 HSM_BAR_dir_evidence_desc:0 "[Player.GetHSMBAR_evidence_desc]"
 HSM_BAR_dir_evidence_internal:0 "Свидетель рядом с образцом"
 HSM_BAR_dir_evidence_internal_desc:0 "Ольха определяет обломок по номеру на сосуде. Рабочий, собравший его, настаивает: этот номер относился к другой находке. Несмотря на возражения Ольхи, Врона приводит свидетеля в лабораторию. Дальнейшее мало напоминает открытие: повторный обход, обнаруженная подмена, отложенный опыт. Марта оставляет показания рабочего рядом с измерениями. Врона требует восстанавливать путь предмета ещё до изъятия, а Ольха ставит рядом второй прибор для независимой проверки. Незамеченный свидетель может сообщить больше, чем изначально надеялась найти группа. Служба не поймёт уцелевшие исследования Пентархии, если учёного голоса по-прежнему достаточно, чтобы вычеркнуть того, кто испытал их последствия. Авторитет не должен определять, чья память заслуживает проверки, а чья будет забыта."
 HSM_BAR_dir_evidence_cover:0 "Достоверные полевые измерения"
 HSM_BAR_dir_evidence_cover_desc:0 "Спорный образец обнаружил расхождения в методах обследования. Место сбора, показания приборов и наблюдения должны оставаться проверяемыми, когда материал попадёт в удалённую лабораторию. Комиссия научит полевых работников самостоятельно описывать находки и сохранять часть материала для повторной экспертизы. Специалисты вправе спорить, но судьба сельского ремонта не может зависеть от уверенного тона одного заключения. Проверить результат должен суметь и тот, кто не присутствовал при сборе. Спорные выводы останутся открытыми для повторного обследования."
 HSM_BAR_dir_training:0 "[Player.GetHSMBAR_training]"
 HSM_BAR_dir_training_desc:0 "[Player.GetHSMBAR_training_desc]"
 HSM_BAR_dir_training_internal:0 "Вернуться должны все"
 HSM_BAR_dir_training_internal_desc:0 "На учебном извлечении находки рабочий получает травму. Группе приходится выбирать между образцом и носилками. Врона отвечает сразу; спор после учения затягивается. Ольха видел, как при поспешном отступлении погибают невосполнимые свидетельства. Марта видела, что происходит, когда они становятся важнее пациента. До следующего спуска Марта отработает со спасателями помощь раненым, а Врона заставит их потренироваться уходить от преследования. Запасной маршрут и тот, кто умеет им пользоваться, могут не дать пропавшему исследователю стать пленником. Приказы из безопасной комнаты нередко переживают тех, кого отправили их выполнять. И следующий командир вспомнит не речь основателей, а судьбу своего предшественника."
 HSM_BAR_dir_training_cover:0 "Спасательные команды для строек"
 HSM_BAR_dir_training_cover_desc:0 "Возвращение в старые выработки означает знакомые опасности: слабые крепления, дым, неисправные подъёмники и усталость. Спасателям нужны учения с настоящим рабочим оборудованием, а не показательные выступления для чиновников. На каждом участке следует знать, как поднять тревогу, освободить подход и принять раненых. Комиссия потребует от начальников отрабатывать отход столь же тщательно, как обычную смену. Программа восстановления не может позволить себе считать работников расходным материалом."
 HSM_BAR_dir_register:0 "[Player.GetHSMBAR_register]"
 HSM_BAR_dir_register_desc:0 "[Player.GetHSMBAR_register_desc]"
 HSM_BAR_dir_register_internal:0 "Карта незаживших ран"
 HSM_BAR_dir_register_internal_desc:0 "Марта раскладывает открытые дела рядом со схемами лабораторий Ольхи. Врона отметила обследованные места; пробелы остались пробелами. Растущему архиву нужны различия, которых не подскажет один страх. Очаг, Лунный круг, Зимняя стража и Беззвездье обозначат разные задачи наблюдения и удержания, а не лестницу для всего непонятного. Вред, доступ и неизвестность следует отмечать отдельно. Обычное объяснение должно сохраниться рядом с опасной находкой. Исследователи смогут сопоставлять измерения с разных участков, не повторяя опыт, несостоятельность которого уже доказала другая группа. Иначе карта покажет лишь то, чего Служба ожидала испугаться, и скроет то, чего она не сумела понять."
 HSM_BAR_dir_register_cover:0 "Обследование баррадских земель"
 HSM_BAR_dir_register_cover_desc:0 "Республике достались карты, удобные для сбора податей, но мало говорящие о безопасности жилья. Новое обследование объединит пробы почвы, измерения воды и рассказы жителей, помнящих перемены вокруг своих домов. Результаты помогут выбрать колодцы для ремонта и участки для возвращения в обработку. Ещё не обследованные земли будут чётко отделены от проверенных. Обнадёживающий набросок не должен превратиться в распоряжение возвращать семьи туда, где никто не побывал."
 HSM_BAR_dir_radio:0 "[Player.GetHSMBAR_radio]"
 HSM_BAR_dir_radio_desc:0 "[Player.GetHSMBAR_radio_desc]"
 HSM_BAR_dir_radio_internal:0 "Голос на поверхности"
 HSM_BAR_dir_radio_internal_desc:0 "Под лабораторией однажды ответили раньше, чем прозвучал вопрос. С тех пор Врона не считает знакомый голос доказательством того, что товарищ жив. Полевым группам нужна независимая связь с поверхностью, сменные шифровальные ключи и условные вопросы, согласованные до выхода. Радисты научатся прерывать разговор, если знакомый голос даёт неверный ответ. Ольха проверяет аппаратуру; Марта прислушивается к паузам между ответами. Обычная радиостанция не объяснит случившееся в шахте, но поможет заметить, когда разговор перестаёт быть обычным. Ни один дальний пост не должен в одиночку решать, кому принадлежит голос, требующий открыть дверь."
 HSM_BAR_dir_radio_cover:0 "Аварийная радиосвязь"
 HSM_BAR_dir_radio_cover_desc:0 "На разбитых дорогах помощь раненой бригаде может задержаться на несколько часов. Комиссия предлагает связать радиостанциями лечебницы, лагеря землемеров и крупные стройки, предусмотрев регулярные проверки и резервное питание. Операторы будут заранее учиться передавать понятные запросы при плохой слышимости. Гражданские власти получат достоверные сведения о том, где требуется помощь. Для деревень вдали от основных дорог связь станет возможностью вовремя вызвать врача или предупредить соседей об аварии. Дежурства свяжут с реальным распорядком лечебниц и рабочих смен."
 HSM_BAR_dir_archives:0 "[Player.GetHSMBAR_archives]"
 HSM_BAR_dir_archives_desc:0 "[Player.GetHSMBAR_archives_desc]"
 HSM_BAR_dir_archives_internal:0 "Почерк Ольхи"
 HSM_BAR_dir_archives_internal_desc:0 "Тетради открыты, но многое в них по-прежнему понятно лишь помощнику, который когда-то заполнял страницы. Ольха начинает исправлять схему по памяти. Марта спрашивает, почему раньше он об этой памяти молчал. Восстановление архива потребует повторных проверок, сопоставления чужих выводов и отделения воспроизводимых методов от способностей, умерших вместе с владельцами. Среди спорных страниц нашлись схемы приёмников и измерительных приборов. Их можно восстановить в обычной мастерской, обучая техников без необходимости доверять опытам, к которым некогда подводили эти провода. Ольха ещё может помочь Барраду получить необходимые знания, но его полезность не должна определять, какие страницы сохранятся, а какие опять окажутся вырваны."
 HSM_BAR_dir_archives_cover:0 "Восстановить техническую библиотеку"
 HSM_BAR_dir_archives_cover_desc:0 "Уцелевшие чертежи и тетради рассеяны по повреждённым мастерским и частным шкафам. Республика соберёт их в техническую библиотеку, сохранив расхождения между версиями, а не только самые аккуратные экземпляры. Инженеры и преподаватели смогут проверить старые методы и подготовить материал для учеников. Полезные знания должны выйти за пределы хозяйства одного покровителя. При этом каждый сохранившийся чертёж ещё предстоит отличить от надёжного руководства к работе. Ученики получат не непогрешимое наследие, а возможность самостоятельно проверять прочитанное."
 HSM_BAR_dir_agency:0 "[Player.GetHSMBAR_agency]"
 HSM_BAR_dir_agency_desc:0 "[Player.GetHSMBAR_agency_desc]"
 HSM_BAR_dir_agency_internal:0 "Дверь без подозрений"
 HSM_BAR_dir_agency_internal_desc:0 "Вроне нужен способ задавать вопросы за пределами оцепления, не представляясь его командиром. Компания «Alder Survey» позволит нанимать переводчиков, обращаться к специалистам и посещать опасные участки. Большинство сотрудников действительно будет этим заниматься. Лишь немногие запросы попадут к агенту и небольшой группе лингвистов-аналитиков, которые не приходят на заседания правления. Между настоящими обследованиями они будут учиться искать за шифрованным сообщением его подлинного адресата. Завиша должен увидеть при проверке настоящую работу и настоящие результаты. Труднее всего дать честному учреждению жить под прикрытием, не превращая каждого работника в заговорщика. Его неведение будет защищать Службу надёжнее заученной легенды."
 HSM_BAR_dir_agency_cover:0 "Компания «Alder Survey»"
 HSM_BAR_dir_agency_cover_desc:0 "Ведомства восстановления не могут постоянно содержать специалистов на все случаи. Компания «Alder Survey» возьмёт на себя геологические обследования, лабораторные анализы и технические консультации там, где государственным бригадам не хватает опыта. Её работа должна привлекать заказчиков и за пределами министерств. Понятные договоры и профессиональные требования позволят получать необходимые знания, не создавая ещё одного громоздкого ведомства. У подготовленных выпускников появится причина остаться в Барраде, а не искать заработок за границей."
 HSM_BAR_dir_storage:0 "[Player.GetHSMBAR_storage]"
 HSM_BAR_dir_storage_desc:0 "[Player.GetHSMBAR_storage_desc]"
 HSM_BAR_dir_storage_internal:0 "Прежде чем открыть порог"
 HSM_BAR_dir_storage_internal_desc:0 "Приёмное помещение оказалось слишком близко к палате. Марта замечает это раньше, чем начинается разговор о замках. Врона спрашивает, куда отступит группа, если привезённая находка поведёт себя иначе, чем обещало заключение. Ольха перечисляет меры из тетрадей, но некоторые авторы не пережили их применения. Службе нужны раздельные помещения, места наблюдения и свободный выход. Многоразовая тара, подготовленные машины и снаряжение, сохранённое между заданиями, избавят группы изъятия от дорогих сборов в последнюю минуту. Сначала они позволят работать осторожно. Для каждой будущей находки всё равно придётся искать собственное решение, а не полагаться на толщину одной двери."
 HSM_BAR_dir_storage_cover:0 "Изолированные помещения для экспертиз"
 HSM_BAR_dir_storage_cover_desc:0 "Собранные при восстановлении образцы не следует исследовать рядом с занятыми палатами или людными мастерскими. Отдельные помещения обеспечат вентиляцию, удобную очистку и безопасный приём материала. Врачи и инженеры помогут выбрать место до начала строительства, а обслуживающий персонал подготовится к перебоям освещения и воды. Хорошие условия позволят проводить тщательные экспертизы, не подвергая пациентов и соседей последствиям чужой работы. Больничный двор наконец перестанет служить временной площадкой для любого привезённого образца."
 HSM_BAR_dir_foreign_mandate:0 "[Player.GetHSMBAR_foreign_mandate]"
 HSM_BAR_dir_foreign_mandate_desc:0 "[Player.GetHSMBAR_foreign_mandate_desc]"
 HSM_BAR_dir_foreign_mandate_internal:0 "За первым урожаем"
 HSM_BAR_dir_foreign_mandate_internal_desc:0 "Первые возвращённые поля дали зерно. За их границей тот же способ по-прежнему не действует. Ольха снова берётся за восстановленные исследования и находит ссылки на работу вне Баррада: водную пробу, незнакомый защитный узор, имя, исчезнувшее из окончательной копии. Марта не обещает соседней деревне того, чего пока не может дать. Врона предлагает искать эти следы за границей и подготовить агента к постоянной работе за рубежом. До отъезда ему потребуются язык, обычная профессия и знакомые, ничего не знающие о палате. Служба начиналась с попытки вернуть рабочих из одной шахты. Чтобы завершить начатое, теперь придётся покинуть страну, которую она собиралась исцелить."
 HSM_BAR_dir_foreign_mandate_cover:0 "Исследования за рубежом"
 HSM_BAR_dir_foreign_mandate_cover_desc:0 "Первые успехи восстановления показали пределы местных методов. Для оставшихся повреждённых районов нужны знания и образцы, которых нет в баррадских собраниях. Комиссия предлагает зарубежные поездки для знакомства с лабораториями, водоочисткой и защитными инженерными сооружениями. Завиша согласен оплатить их, если каждая отвечает на вопрос, возникший из незавершённых работ дома. Следующее обещание вернуть людям землю должно опираться на проверенное решение. Республика не может бесконечно оплачивать повторение одного и того же неудачного опыта."
 HSM_BAR_dir_world:0 "[Player.GetHSMBAR_world]"
 HSM_BAR_dir_world_desc:0 "[Player.GetHSMBAR_world_desc]"
 HSM_BAR_dir_world_internal:0 "Вдали от закрытой палаты"
 HSM_BAR_dir_world_internal_desc:0 "Первым зарубежным заданиям нельзя отдавать приказы так же, как очередному спуску под поместье. Вроне нужны исследователи, способные жить на месте, распознавать местные предупреждения и пережить потерю связи с Баррадом. Марта ждёт результатов до нового посевного сезона. Ольха опасается того, что дальнее отделение сумеет скрыть от собственных основателей. Опытные полевые сотрудники подготовят новые базы, обучат первых связных и проверят дальнюю связь прежде, чем доверят ей безопасность чужой группы. Каждое отделение получит и ответственность, которую основателям уже не разделить за одним столом. Теперь ошибочное решение может остаться незамеченным до возвращения последнего выжившего."
 HSM_BAR_dir_world_cover:0 "Региональные научные партнёрства"
 HSM_BAR_dir_world_cover_desc:0 "Приезжий специалист может решить отдельный вопрос; длительному восстановлению нужны связи, которые сохранятся после его отъезда. Баррадские исследовательские компании будут искать региональных партнёров для обследований, консультаций и сравнительных испытаний. Местные сотрудники помогут приезжим и продолжат работу между экспедициями. Каждое сотрудничество должно приносить пользу обычным заказчикам. Республика получит больше от устойчивых профессиональных связей, чем от череды впечатляющих поездок, результаты которых некому проверить или повторить."
 HSM_BAR_dir_equus:0 "[Player.GetHSMBAR_equus]"
 HSM_BAR_dir_equus_desc:0 "[Player.GetHSMBAR_equus_desc]"
 HSM_BAR_dir_equus_internal:0 "За западным морем"
 HSM_BAR_dir_equus_internal_desc:0 "В Эквусе магия не сводится к шёпоту обвинений или наследию забытой лаборатории. Она принадлежит повседневной жизни, которую нашим исследователям ещё предстоит отличить от искомых опасностей. Снабжение Серебряного берега даст законную опору среди поставщиков лекарств и изыскателей. Врона сперва отправляет вопросы, а не оборудование для изъятия. Первые исследователи будут работать рядом с местными сотрудниками, учась выбирать собеседников и не выдавать интереса, которого не объяснить их обычными обязанностями. Марта просит изучать защиту и выздоровление, а не составлять перечень чудес. Если возникнет большая угроза, отделение должно знать, к кому обратиться за помощью, не став для окружающих ещё одной опасностью."
 HSM_BAR_dir_equus_cover:0 "Снабжение Серебряного берега"
 HSM_BAR_dir_equus_cover_desc:0 "Восстановлению нужны надёжные приборы, лекарства и материалы, которых Баррад пока производит недостаточно. Снабжение Серебряного берега наладит закупки в Эквусе и консультации с опытными поставщиками. Представителям предстоит выяснять, что подходит для местных условий, а не покупать самое необычное оборудование. Вместе с заказами должен идти обмен практическими знаниями. Тогда наши мастерские смогут обслуживать привезённые устройства и не будут зависеть от постоянной замены при каждой неисправности."
 HSM_BAR_dir_griffonia:0 "[Player.GetHSMBAR_griffonia]"
 HSM_BAR_dir_griffonia_desc:0 "[Player.GetHSMBAR_griffonia_desc]"
 HSM_BAR_dir_griffonia_internal:0 "Реликвии меняют хозяев"
 HSM_BAR_dir_griffonia_internal_desc:0 "Врона находит одно описание в каталоге коллекционера и на полях тетради Пентархии. Нынешний владелец не указан ни там, ни там. В Землях Грифонов старые собрания, переселённые семьи и честолюбивые покровители оставили следы, которые редко сходятся. Изыскательское товарищество позволит идти по ним, не объявляя распродажу баррадских тайн. Местные связи помогут аналитикам сопоставлять псевдонимы торговцев и повторяющиеся обороты в шифрованной переписке: старая сделка может дать ключ к новому сообщению. Ольха хочет выяснить, какие предметы его хозяева понимали, а какими лишь мечтали обладать. Ответ может храниться в университете, кладовой или у свидетеля, давно разуверившегося и в учёных, и в собирателях."
 HSM_BAR_dir_griffonia_cover:0 "Изыскания и разведка месторождений"
 HSM_BAR_dir_griffonia_cover_desc:0 "В Землях Грифонов есть технические собрания и опытные специалисты, чьи знания пригодятся восстановлению Баррада. Изыскательское товарищество закажет консультации, сопоставит геологические пробы и договорится о работе с доступными коллекциями. Его представителям следует уважать владельцев и проверять происхождение предложенных покупок. Осторожные приобретения и постоянные профессиональные связи принесут больше пользы, чем дорогая находка с неясной историей. Республика вправе ждать от зарубежных расходов не сенсации, а проверяемого результата для своих строек."
 HSM_BAR_dir_north:0 "[Player.GetHSMBAR_north]"
 HSM_BAR_dir_north_desc:0 "[Player.GetHSMBAR_north_desc]"
 HSM_BAR_dir_north_internal:0 "Последний огонь на севере"
 HSM_BAR_dir_north_internal_desc:0 "Ирма Кальк сняла помещение для северного отделения и уже отвергла первое громкое донесение. Два свидетеля повторили слова одного пропавшего путника; ей нужно его имя. За знакомыми дорогами лежат места, где тишина означает либо пустую тропу, либо нечто менее милосердное. Кальк намерена понять разницу прежде, чем отправит туда людей. Врона одобряет требование готовить возвращение заранее. Вместе с кругом связных должны появляться надёжные проводники, укрытия для встреч и проверенные пути отхода. Северное задание не может зависеть от одного проводника, которому известно всё. Марта добавляет собственную просьбу: записывать не только рассказы об опасности, но и судьбы тех, кому приходится жить рядом с ней."
 HSM_BAR_dir_north_cover:0 "Северное транзитное общество"
 HSM_BAR_dir_north_cover_desc:0 "Северный маршрут требует большего, чем линия на карте. Северное транзитное общество изучит сезонные условия, найдёт надёжных местных помощников и подготовит помощь для специалистов в пути. Знающие регион сотрудники проверят жильё, запасы и состояние подходов ещё до выхода экспедиции из Баррада. Постоянная поддержка позволит обращаться к северным специалистам без лишнего риска. Каждой новой группе больше не придётся на собственном опыте заново открывать одни и те же опасности. Подготовленные остановки пригодятся и обычным путникам на тех же дорогах."
 HSM_BAR_dir_riverlands:0 "[Player.GetHSMBAR_riverlands]"
 HSM_BAR_dir_riverlands_desc:0 "[Player.GetHSMBAR_riverlands_desc]"
 HSM_BAR_dir_riverlands_internal:0 "Что приносит вода"
 HSM_BAR_dir_riverlands_internal_desc:0 "Землемер из Речных земель предлагает повторить необычное измерение за обычную плату. Марта считает это многообещающим началом. Барраду необходимо понять, как повреждение распространяется через почву и ручьи и почему некоторые воды словно сопротивляются ему. Местная группа Вроны займётся этими вопросами наряду с менее ясными прибрежными слухами. Землемер представит надёжных коллег и поможет оснастить полевую базу приборами, с которыми они уже умеют работать. Объяснение может оказаться совершенно обычным и всё же приблизить выздоровление деревни. Ольхе, привыкшему к покровителю, требовавшему чудес, предстоит научиться ценить такой ответ не меньше эффектного открытия."
 HSM_BAR_dir_riverlands_cover:0 "Товарищество речных изысканий"
 HSM_BAR_dir_riverlands_cover_desc:0 "Комиссии нужны надёжные сравнения для повреждённых баррадских водоёмов. Товарищество речных изысканий будет работать с местными специалистами над течениями, отложениями и укреплением берегов. Сопоставление проб поможет отличить ошибку метода от особенностей самого грунта. Практическая цель проста: чистая вода, безопасные переправы и ремонт, который переживёт следующее половодье. Совместная работа должна приносить пользу и нашим строителям, и региональным партнёрам, предоставившим свои знания и участки для обследования."
 HSM_BAR_dir_zebrica:0 "[Player.GetHSMBAR_zebrica]"
 HSM_BAR_dir_zebrica_desc:0 "[Player.GetHSMBAR_zebrica_desc]"
 HSM_BAR_dir_zebrica_internal:0 "Слово, которое не перевели"
 HSM_BAR_dir_zebrica_internal_desc:0 "Переводчица отказывается передать выражение свидетеля словом «бессмертный». Оно может означать долговечность, связь с предками или память; дарить приезжему открытие она не собирается. Врона просит нанять её для следующей беседы. Зебриканскому отделению нужны люди, понимающие, где распадаются сами его вопросы. Местные проводники и поставщики помогут завести постоянные знакомства и готовить экспедиции, не оплачивая дважды каждую ошибку приезжего. Ольха обвёл ссылку в старых исследованиях, но чужое имя на странице ещё не даёт дороги по незнакомой стране. Первая экспедиция может привезти лишь более точный вопрос. Ей должно быть позволено вернуться с таким результатом."
 HSM_BAR_dir_zebrica_cover:0 "Южное караванное товарищество"
 HSM_BAR_dir_zebrica_cover_desc:0 "Южное караванное товарищество наймёт переводчиков, проводников и местных специалистов для баррадских исследователей в Зебрике. Его представители должны договариваться с теми, кто знает посещаемые места, а не полагаться на далёкие пересказы. Подготовка включает изучение местных выражений и понимание вопросов, неразрешимых за короткий визит. Скромные, хорошо обеспеченные поездки помогут заслужить доверие для дальнейшего сотрудничества. Первое знакомство не должно исчерпать его обещаниями, которых приезжие не способны выполнить."
 HSM_BAR_dir_liaison:0 "[Player.GetHSMBAR_liaison]"
 HSM_BAR_dir_liaison_desc:0 "[Player.GetHSMBAR_liaison_desc]"
 HSM_BAR_dir_liaison_internal:0 "Кто-то ещё несёт дозор"
 HSM_BAR_dir_liaison_internal_desc:0 "Марта предпочла бы сравнить защитный метод с другим исследователем, а не обнаружить его недостаток у больничной койки. Надёжный посредник позволит сделать это, не раскрывая, кто руководит работой в Барраде. Врона научит связных не выводить собеседника прямо на исследователя, запросившего встречу: слежка за одним посетителем не должна раскрывать всё отделение. Врона настаивает: начинать следует с общей опасности, а не с притязания на власть. В Эквусе S.M.I.L.E. может заинтересоваться разговором, если возвращение Сомбры даст обеим сторонам одного противника. Пока Служба подготовит честный вопрос и возможность его задать. Секретность не должна обязывать встречать любую угрозу в одиночку."
 HSM_BAR_dir_liaison_cover:0 "Обмен научными делегациями"
 HSM_BAR_dir_liaison_cover_desc:0 "Зарубежные лаборатории сталкиваются с практическими затруднениями, похожими на наши. Взаимные визиты позволят сравнить методы, осмотреть приборы и найти темы сотрудничества, не обещая согласия по всем вопросам. Каждая делегация должна привезти ясный вопрос и достаточно материала для его оценки. Баррад, со своей стороны, должен показать результаты собственных исследований вместе с их ограничениями. Принимать чужую помощь, скрывая известные недостатки предлагаемого взамен метода, было бы плохим началом отношений."
 HSM_BAR_dir_trafficking:0 "[Player.GetHSMBAR_trafficking]"
 HSM_BAR_dir_trafficking_desc:0 "[Player.GetHSMBAR_trafficking_desc]"
 HSM_BAR_dir_trafficking_internal:0 "Покупатели запретного"
 HSM_BAR_dir_trafficking_internal_desc:0 "Реликварий трижды меняет владельца, а его описание с каждой продажей становится беднее. Последний посредник исчез. Врона подозревает торговлю, участники которой знают, каких вопросов покупатели предпочитают не задавать. Ольха узнаёт привычки собирателей, когда-то добивавшихся внимания Пентархии, но привычка ещё ничего не доказывает. След покупок может привести к опасному предмету, обману или замыслу, о котором пока неизвестно. Врона требует изучить привычки посредников до вмешательства: вовремя перехваченный груз может открыть и путь к следующему покупателю. Марта хочет найти заказчиков прежде, чем их опыты приведут к ней новых пациентов. Обычный спор о собственности позволит начать без лишнего шума."
 HSM_BAR_dir_trafficking_cover:0 "Страхование исследовательских грузов"
 HSM_BAR_dir_trafficking_cover_desc:0 "Тонкие приборы и редкие исследовательские материалы трудно заменить после утраты. Специализированная страховая контора будет проверять происхождение, условия перевозки и спорные права собственности до выплаты возмещения. Точные описания защитят и поставщиков, и учреждения, оплачивающие их работу. Баррадским подрядчикам нужен надёжный порядок разрешения споров. Нельзя принимать каждую завышенную оценку, но и необъяснимое исчезновение не следует списывать на неизбежные торговые издержки, не попытавшись выяснить, что произошло."
 HSM_BAR_dir_rulers:0 "[Player.GetHSMBAR_rulers]"
 HSM_BAR_dir_rulers_desc:0 "[Player.GetHSMBAR_rulers_desc]"
 HSM_BAR_dir_rulers_internal:0 "Монарх не экспонат"
 HSM_BAR_dir_rulers_internal_desc:0 "В проекте досье государя поставили рядом с лабораторным артефактом, будто оба ждут одинакового изъятия. Врона зачёркивает заголовок. У правителя есть подданные, враги и история, не заканчивающаяся нашими наблюдениями. Марта спрашивает, кого защитит превращение подозрения в попытку похищения. Расследования начнутся со свидетелей, публичных поступков и перемен в обстоятельствах. Лингвисты-аналитики сопоставят открытые сведения с перехваченной перепиской, ища повторяющиеся имена и обороты, способные дать ключ к шифру. Власть заслуживает изучения, но необычная природа не даёт права схватить её носителя. Основатели Службы уже жили при хозяевах, считавших иначе, и помнят цену такого убеждения."
 HSM_BAR_dir_rulers_cover:0 "Изучение исторических собраний"
 HSM_BAR_dir_rulers_cover_desc:0 "В коллекциях частных покровителей достоверные записи часто соседствуют с лестными легендами. Исследователи сопоставят рассказы о происхождении вещей, проследят смену владельцев и обратятся к учреждениям, готовым поделиться свидетельствами. Особая осторожность нужна там, где предмет связан с живущей династией или спорным притязанием. Баррадские изыскания должны расширять знания, не превращая каталог в право собственности. Научное любопытство не оправдывает дипломатической ссоры, которой можно избежать уважением к владельцу собрания."
 HSM_BAR_dir_countercult:0 "[Player.GetHSMBAR_countercult]"
 HSM_BAR_dir_countercult_desc:0 "[Player.GetHSMBAR_countercult_desc]"
 HSM_BAR_dir_countercult_internal:0 "Те, кто пришёл забрать"
 HSM_BAR_dir_countercult_internal_desc:0 "Кто-то покупает расписания тюремных перевозок через тех же посредников, что занимались реликварием. Врона видит подготовку, а не простое любопытство собирателя. Следы ведут к небольшой мааритской ячейке; они не объясняют всех тайн, оставшихся от Пентархии. Ольха хочет обезопасить подозрительный материал до новой смены владельца. Врона хочет узнать, кто ждёт в конце пути и кто передал им расписание. Её сотрудники проследят утечку через собственные связи, учась распознавать лазутчика до того, как будет сорвана следующая перевозка. Оба решения столкнут Службу с чужим замыслом. Предотвратить следующий шаг противника важнее, чем объявить о его обнаружении и потерять единственную возможность проследить за ним."
 HSM_BAR_dir_countercult_cover:0 "Защитить восстановительные бригады"
 HSM_BAR_dir_countercult_cover_desc:0 "Технические обследования и ценные грузы привлекли воровство и угрозы. Подрядчики согласуют охрану, проверят уязвимые подходы и подготовят запасные маршруты для неотложных работ. Осторожные меры должны защитить работников, не перекрывая обычные дороги и не объявляя соседние поселения подозреваемыми. Завиша требует разбирать конкретные обстоятельства и отвечать за принятые решения. Трудности восстановления не должны стать предлогом для возвращения графских порядков, от которых Республика обещала избавить своих жителей."
 HSM_BAR_dir_foreign_protocol:0 "[Player.GetHSMBAR_foreign_protocol]"
 HSM_BAR_dir_foreign_protocol_desc:0 "[Player.GetHSMBAR_foreign_protocol_desc]"
 HSM_BAR_dir_foreign_protocol_internal:0 "Что нельзя закрашивать"
 HSM_BAR_dir_foreign_protocol_internal_desc:0 "В проекте обмена скрыты все неудачные испытания, зато адрес исследователя оставлен. Марта кладёт рядом историю раненого полевого работника: вот что партнёру нужнее всего, а вот без чего он прекрасно обойдётся. Ольха начинает заново. Имена, маршруты и посторонние дела могут остаться тайной; предельные значения, опасные реакции и нерешённые вопросы должны пережить цензуру. Врона хочет, чтобы зарубежная группа знала, какое снаряжение взять, к какому местному специалисту обратиться и когда отступить. Пригодные предостережения избавят партнёров от повторных поездок и загубленных приборов. Этого не случится, если секретность превратит предупреждение в страницу успокоительных умолчаний, подписанную уважаемым специалистом."
 HSM_BAR_dir_foreign_protocol_cover:0 "Общие лабораторные стандарты"
 HSM_BAR_dir_foreign_protocol_cover_desc:0 "Полезный научный обмен должен позволять другой лаборатории повторить работу. Участники согласуют описание приборов, условий и известных источников ошибки, сохраняя личные и коммерческие сведения в тайне. Неудачные испытания необходимы рядом с удачными, когда они показывают пределы метода. Баррадские специалисты должны полагаться на полученные предупреждения и рассчитывать, что их собственные дойдут до исполнителей. Точность изложенных условий важнее торжественного обещания успеха в сопроводительном заключении. Согласие продолжать совместную работу требует доверия к каждой оговорке."
 HSM_BAR_dir_remains:0 "[Player.GetHSMBAR_remains]"
 HSM_BAR_dir_remains_desc:0 "[Player.GetHSMBAR_remains_desc]"
 HSM_BAR_dir_remains_internal:0 "После ухода свидетелей"
 HSM_BAR_dir_remains_internal_desc:0 "В Баррад приходит известие о поражении вместе с предложением забрать предполагаемые останки. Марта спрашивает, кто видел тело. Ответа нет. Врона может отправить человека искать место и свидетеля, но не пошлёт группу изъятия вслед за газетной уверенностью. Марта научит врачей сохранять следы, распознавать заражённые ткани и изучать повреждения, не становясь следующими пострадавшими. Если останки действительно сохранились и до них можно добраться, Ольха узнает то, чего владелец не позволил бы исследовать при жизни. Пока само отсутствие ответа принадлежит делу. Служба не должна придумывать удобную смерть лишь потому, что уже подготовила помещение для экспертизы."
 HSM_BAR_dir_remains_cover:0 "Сохранение и установление происхождения"
 HSM_BAR_dir_remains_cover_desc:0 "Повреждённые собрания и перемещённые материалы требуют экспертизы до начала реставрации. Лаборатория установит происхождение, отделит первоначальную работу от поздних изменений и обратится к свидетелям там, где не хватает записей. Особенно осторожно следует обращаться с находками, связанными с насилием или спорной собственностью. Республика не должна оплачивать уверенное восстановление вещи, чья подлинность не установлена. Привлекательный рассказ о её прошлом ещё предстоит подтвердить независимыми свидетельствами. Добросовестное заключение вправе оставить часть вопросов без окончательного ответа."
 HSM_BAR_dir_commission:0 "[Player.GetHSMBAR_commission]"
 HSM_BAR_dir_commission_desc:0 "[Player.GetHSMBAR_commission_desc]"
 HSM_BAR_dir_commission_internal:0 "Когда поля возвращены"
 HSM_BAR_dir_commission_internal_desc:0 "Программа восстановления дошла до земель, ради которых началась. Местные исследования, речные пробы и защитные разработки вместе сделали то, чего порознь обещать не могли. Ближайший замысел враждебной ячейки тоже сорван. Марта приносит эти результаты на совещание; Ольха приносит незакрытые дела. Нужен постоянный круг исследователей, способных сопоставлять работу отделений, оспаривать многообещающий вывод и избавлять следующую группу от повторения уже опровергнутого опыта. Врона спрашивает, какие опасности теперь оправдывают работу за рубежом. Служба больше не может объяснять любое решение чрезвычайным положением дома. Основателям предстоит выбрать: успех обязывает их беречь сложный мир или даёт право упростить его по собственному разумению."
 HSM_BAR_dir_commission_cover:0 "Совещание по итогам восстановления"
 HSM_BAR_dir_commission_cover_desc:0 "Завершение программы оздоровления родных земель позволяет определить, какие методы должны войти в обычную практику. Врачи, агрономы и инженеры сопоставят местную работу с зарубежными консультациями. Успешным решениям необходимо обслуживание, оставшимся вопросам нужно назначить ответственных. Завиша предлагает начинать следующую программу с потребностей жителей, а не с желания сохранить учреждение, выполнившее первую задачу. Восстановление должно оставить после себя устойчивые службы, способные работать без постоянных чрезвычайных полномочий."
 HSM_BAR_dir_coexistence:0 "[Player.GetHSMBAR_coexistence]"
 HSM_BAR_dir_coexistence_desc:0 "[Player.GetHSMBAR_coexistence_desc]"
 HSM_BAR_dir_coexistence_internal:0 "Свет, который мы оставим"
 HSM_BAR_dir_coexistence_internal_desc:0 "Марта помнит школу Ольхового Брода с заколоченными окнами. Теперь под порогом лежит защитная пластина, созданная благодаря исследованиям, начавшимся со страха. Уничтожение всего необъяснимого не открыло бы этих окон. Служба будет различать опасность и жизнь, которой помогают те же силы. Вроне ещё придётся входить туда, куда не могут другие; некоторые двери останутся запертыми. Исследователи будут искать тех, кто пытается проникнуть на защищённые участки под чужим именем, а не подозревать каждого соседа. Но смысл дозора не в том, чтобы лишить мир всего, чего пока не понимают его хранители, и назвать оставшуюся пустоту безопасностью."
 HSM_BAR_dir_coexistence_cover:0 "Безопасные лечебницы, живая страна"
 HSM_BAR_dir_coexistence_cover_desc:0 "Восстановление нельзя считать полным, если жители вынуждены отказаться от методов, поддерживающих их дома и лечебницы. Комиссия сохранит полезные способы лечения и защитные сооружения, тщательно разбирая конкретные неисправности. Местные специалисты должны совершенствовать работу, не оправдывая каждую непривычную практику перед подозрительным чиновником. Республика отвечает за безопасную жизнь общин. Опыт и исследование следует соединять, а не требовать, чтобы один уступил место другому только ради удобства общего предписания."
 HSM_BAR_dir_normalization:0 "[Player.GetHSMBAR_normalization]"
 HSM_BAR_dir_normalization_desc:0 "[Player.GetHSMBAR_normalization_desc]"
 HSM_BAR_dir_normalization_internal:0 "Больше никаких исключений"
 HSM_BAR_dir_normalization_internal_desc:0 "Ольха знает, сколько в восстановлении зависит от предосторожностей, чьи авторы сами не понимали их пределов. Он переписал достаточно предупреждений погибших исследователей, чтобы усомниться в очередном обещании бдительности. Что, если заставить умолкнуть сам источник исключений? Марта просит не забыть защиту под школьным порогом и приборы возле пациентов. В его предложении пока нет ответа. Он просит аналитиков разобрать перехваченные сведения о защитных сооружениях, сопоставляя шифры так же тщательно, как скрытые за ними утверждения. Умение читать чужие тайны ещё не докажет правоту его собственной теории. Притягательность нормализации заключена в недописанной фразе: подобных бед больше не будет, если только удастся подчинить весь мир одному правилу, для которого не потребуется следующая оговорка."
 HSM_BAR_dir_normalization_cover:0 "Стандарты для ненадёжных систем"
 HSM_BAR_dir_normalization_cover_desc:0 "Восстановление оставило соседним районам оборудование и защитные сооружения с разными пределами надёжности. Программа стандартизации выявит повторяющиеся неисправности, сопоставит обслуживание и проверит способы сделать непредсказуемые процессы устойчивее. Исследователи обязаны учитывать полезные функции каждой системы, которую предлагают заменить. Простое предписание не обязательно безопаснее сложного. Республике нужны улучшения, работающие за пределами показательного испытания, где необходимые условия заранее подбирают под желаемый результат и не замечают неудобных различий."
 HSM_BAR_dir_custody_law:0 "[Player.GetHSMBAR_custody_law]"
 HSM_BAR_dir_custody_law_desc:0 "[Player.GetHSMBAR_custody_law_desc]"
 HSM_BAR_dir_custody_law_internal:0 "Второй ключ"
 HSM_BAR_dir_custody_law_internal_desc:0 "Марта обнаруживает экспертизу, которую дважды откладывали, не поставив её в известность. Начальник, запросивший исследование, сам решил, что остальным знать необязательно. Врона предлагает независимого проверяющего на каждом закрытом участке, способного остановить работу без разрешения ответственного за опасность. Ольха замечает, что это замедлит срочные задания. Именно так и должно быть, когда срочность определяет единственный голос. Министры не узнают владельцев этих ключей. Но внутри Службы ни один ключ не должен переходить по наследству от одного неподотчётного хозяина к следующему."
 HSM_BAR_dir_custody_law_cover:0 "Независимая проверка безопасности"
 HSM_BAR_dir_custody_law_cover_desc:0 "Начальник участка не должен единолично решать, продолжать ли работу после аварии. Независимые инспекторы проверят обслуживание, хранение и условия труда отдельно от проверяемого подрядчика. Их выводы должны доходить до тех, кто вправе назначить ремонт, даже если остановка неудобна. Республика оплатит независимость проверки, а не предложит рабочим довольствоваться уверенностью начальства. Право требовать осмотра должно оставаться действительным и тогда, когда задержка угрожает срокам дорогого государственного заказа."
 HSM_BAR_dir_open_report:0 "[Player.GetHSMBAR_open_report]"
 HSM_BAR_dir_open_report_desc:0 "[Player.GetHSMBAR_open_report_desc]"
 HSM_BAR_dir_open_report_internal:0 "Что останется деревням"
 HSM_BAR_dir_open_report_internal_desc:0 "Мастерская сможет использовать улучшенную деталь, не зная, где впервые провели измерения. Марта хочет передать результат через комиссию; Ольха просит ещё одну проверку. Врона помнит рабочих, чьи наблюдения сделали улучшение возможным. Их соседи не должны вечно ждать пользы лишь потому, что исходное расследование засекречено. Службе предстоит вернуть знания, не возвращая вместе с ними опасность. Обычный механик должен получить работающий метод, его ограничения и право сделать его лучше, не вступая ради этого в круг посвящённых и не прося разрешения на каждую поправку."
 HSM_BAR_dir_open_report_cover:0 "Прикладные исследования для мастерских"
 HSM_BAR_dir_open_report_cover_desc:0 "Восстановительные работы принесли улучшения, которые можно проверить и применить в обычной мастерской. Комиссия подготовит практические инструкции с точными условиями, требованиями к материалам и известными ограничениями. Независимые мастера должны повторять результат без постоянных обращений к первым исследователям. Их поправки помогут превратить лабораторный метод в надёжную практику. Открытое распространение позволит полезным находкам добраться до общин, не оплачивавших первоначальное обследование, и сделает государственные расходы ощутимыми далеко за пределами опытных участков."
 HSM_BAR_dir_quiet_watch:0 "[Player.GetHSMBAR_quiet_watch]"
 HSM_BAR_dir_quiet_watch_desc:0 "[Player.GetHSMBAR_quiet_watch_desc]"
 HSM_BAR_dir_quiet_watch_internal:0 "Обычное утро"
 HSM_BAR_dir_quiet_watch_internal_desc:0 "Открывается школа, запускается починенный насос, и Марта не слышит торопливых шагов за дверью палаты. В другом месте группа Вроны сменяет караул у двери, которую нельзя открывать. Обе работы исполняют одно обещание, хотя Завиша увидит лишь одну. Будут новые дела и ошибки, которых не предотвратит ни одна учредительная клятва. После долгой полевой работы её исследователи умеют уходить от слежки, покидать встречу порознь и возвращаться к обычной профессии. Пока Служба научилась замечать успех, не требуя, чтобы страна заметила её саму. Утро, принадлежащее тем, кто его проживает, стоит незримых усилий, позволивших ему остаться обычным."
 HSM_BAR_dir_quiet_watch_cover:0 "Забота после восстановления"
 HSM_BAR_dir_quiet_watch_cover_desc:0 "Завершение срочного ремонта не должно означать конец надёжного обслуживания. Лечебницам, водопроводам и защитным сооружениям нужны знакомые с ними работники, запасные материалы и регулярные осмотры. Комиссия передаст проверенные порядки постоянным местным службам, чтобы мелкая неисправность не оборачивалась новым бедствием для округа. Жители больше не должны ждать приезда важной делегации ради повседневной помощи. Способный разобраться специалист должен находиться достаточно близко и располагать средствами для обычной работы."
 HSM_BAR_dir_sealed_orders:0 "[Player.GetHSMBAR_sealed_orders]"
 HSM_BAR_dir_sealed_orders_desc:0 "[Player.GetHSMBAR_sealed_orders_desc]"
 HSM_BAR_dir_sealed_orders_internal:0 "Докуда доходит стена?"
 HSM_BAR_dir_sealed_orders_internal_desc:0 "Ольха обвёл периметр будущего испытания. Врона прослеживает пересекающую линию коммуникацию и спрашивает, где та заканчивается под землёй. Изолированную выработку дорого готовить; связанная галерея обещает больший опыт и проходы туда, где испытатели ничего не контролируют. Марта требует разобраться с каждым таким проходом прежде, чем назвать участок пустым. Врона настаивает на отдельных шифровальных ключах для испытателей и проверке подлинности приказа об остановке: украденный полевой код не должен стать распоряжением для операторов. Скрытое от кабинета место не становится изолированным от страны. Площадку следует выбрать, пока ещё возможно отказаться от удобства, а не объяснять после аварии, почему никто не учёл соседнюю лечебницу."
 HSM_BAR_dir_sealed_orders_cover:0 "Разделить технические сети"
 HSM_BAR_dir_sealed_orders_cover_desc:0 "Старые участки часто соединены трубами, кабелями и служебными галереями, чьи маршруты плохо известны. До крупных опытных работ инженеры выяснят, какие сооружения от них зависят и куда может распространиться неисправность. Разделение сетей дорого, зато позволяет разбирать аварию без остановки посторонних служб. Комиссия сопоставит затраты с риском для лечебниц, мастерских и домов, отсутствующих на первоначальном плане подрядчика. Экономия не должна заключаться в том, чтобы оставить этих соседей за пределами расчёта."
 HSM_BAR_dir_suppression_lab:0 "[Player.GetHSMBAR_suppression_lab]"
 HSM_BAR_dir_suppression_lab_desc:0 "[Player.GetHSMBAR_suppression_lab_desc]"
 HSM_BAR_dir_suppression_lab_internal:0 "Строить лишь понятое"
 HSM_BAR_dir_suppression_lab_internal_desc:0 "Ольха раскладывает исследования материалов рядом с наблюдениями за амулетом и работами о защитных границах. Только вместе они подсказывают, как воздействовать на магию, а не просто пережить встречу с ней. Марта просит отметить измеренные выводы и оставшиеся предположения. Пометок оказывается больше, чем он ожидал. Лаборатория теперь может взяться за установку, но недостающие ответы придётся искать у приборов. Ни восстановленные тетради, ни новые притязания Службы не дадут результата, которого её исследователи ещё не добились собственными опытами."
 HSM_BAR_dir_suppression_lab_cover:0 "Лаборатория опытных приборов"
 HSM_BAR_dir_suppression_lab_cover_desc:0 "Накопленные измерения позволяют создать лабораторию для испытаний в контролируемых условиях. Исследователи сопоставят реакции материалов, проверят показания и установят поведение опытного оборудования возле действующих сооружений. Каждую схему необходимо связать с подтверждающими наблюдениями, отметив предположения до начала сборки. Республике нужна надёжная инженерная работа. Череда впечатляющих образцов, меняющих поведение за пределами подготовленной лаборатории, не оправдает расходов и не поможет тем, кто должен пользоваться приборами в обычных условиях."
 HSM_BAR_dir_activation:0 "[Player.GetHSMBAR_activation]"
 HSM_BAR_dir_activation_desc:0 "[Player.GetHSMBAR_activation_desc]"
 HSM_BAR_dir_activation_internal:0 "Тридцать дней тишины"
 HSM_BAR_dir_activation_internal_desc:0 "Установка готова к местному испытанию. Ольха просит тридцать дней измерений; Марта спрашивает, насколько быстро откажет защитное сооружение, прежде чем кто-то заметит перемену. Врона лично проверяет независимый путь остановки. За периметром министерство ждёт ремонта старых выработок, а не опыта над силами, которым обязана часть восстановленной земли. Успех внутри этой границы ещё ничего не решит для остального мира. В ближайший месяц даже первый шаг должен оставаться таким, который испытатели готовы прервать, не дожидаясь разрешения из безопасного кабинета."
 HSM_BAR_dir_activation_cover:0 "Тридцатидневное испытание оборудования"
 HSM_BAR_dir_activation_cover_desc:0 "Опытное оборудование готово к ограниченному наблюдению на выбранном участке. Инженеры будут тридцать дней записывать его поведение, осматривать соседние сооружения и сохранять независимый способ остановки. Испытание должно показать потребности обслуживания, а не только работу при удачных условиях. Полезный результат включает понимание того, когда прибор применять нельзя. Комиссия не вправе оставлять обычным службам выяснение этого предела через аварию, которую можно было предупредить внимательным наблюдением на полигоне."
 HSM_BAR_dir_aftermath:0 "[Player.GetHSMBAR_aftermath]"
 HSM_BAR_dir_aftermath_desc:0 "[Player.GetHSMBAR_aftermath_desc]"
 HSM_BAR_dir_aftermath_internal:0 "Мир за периметром"
 HSM_BAR_dir_aftermath_internal_desc:0 "Местное испытание завершено. Измерения лежат на столе Ольхи рядом с предупреждениями. Марта требует отказаться от широкого подавления и вернуть полезные знания защитной работе. Другой замысел вынесет опыт за пределы Баррада, на региональные площадки, которым ещё нужны подготовка и доказательства, не заменяемые подписью. Врона спрашивает, какие части отчёта получат их группы. Разрешение не запустит эту программу; оно обяжет Службу готовить решение несоизмеримо больше первого обещания у шахты. Пока они ещё могут отказаться и оставить миру право не участвовать в их опыте."
 HSM_BAR_dir_aftermath_cover:0 "Пересмотреть опытную программу"
 HSM_BAR_dir_aftermath_cover_desc:0 "Наблюдения испытания предстоит сопоставить с первоначальной задачей. Комиссия сохранит неудачи, остановки и полезные результаты вместе, чтобы удобное резюме не стало опасным руководством для другого участка. Дальнейшая работа потребует отдельной оценки условий и затрат. Завиша ждёт обоснованного решения о том, какие методы сохранить, изменить или оставить. Уже потраченные средства не обязывают Республику бесконечно продолжать программу, если её исходные предположения не выдержали проверки или нуждаются в существенном пересмотре."
