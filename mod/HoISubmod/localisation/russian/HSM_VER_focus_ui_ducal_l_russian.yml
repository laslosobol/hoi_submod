l_russian:
 HSM_VER_UI_ducal_eyr_government_tt:0 "Эйри независима, не капитулировала и находится под властью Иовинуса."
 HSM_VER_UI_ducal_charter_recipients_tt:0 "При действующей хартии: Эри и Эйри, а также Авиан, если он участвует в хартии:"
 HSM_VER_UI_ducal_diplomacy_tt:0 "Ни один Дом не выбрал военное объединение."
 HSM_VER_UI_ducal_armistice_context_tt:0 "Оба свободных Дома не воюют при Винсенте и Иовинусе. Путь дипломатии открыт; договор о дружбе ещё не действует."
 HSM_VER_UI_ducal_peace_tt:0 "Оба Дома свободны и не воюют друг с другом; действует перемирие или договор о дружбе."
 HSM_VER_UI_ducal_guarantees_tt:0 "Оба свободных Дома могут вести переговоры при своих герцогах либо уже имеют действующее перемирие или договор о дружбе."
 HSM_VER_UI_ducal_treaty_tt:0 "Договор о дружбе действует между двумя свободными Домами, не воюющими друг с другом."
 HSM_VER_UI_ducal_charter_tt:0 "Оба Дома свободны и не воюют друг с другом. Договор и хартия действуют без приостановки."
 HSM_VER_UI_ducal_erie_settlement_tt:0 "$HSM_VER_UI_ducal_charter_tt$ Наше правительство исполнило решение суда."
 HSM_VER_UI_ducal_eyr_charter_tt:0 "$HSM_VER_UI_ducal_charter_tt$ Эйри по-прежнему правит Иовинус."
 HSM_VER_UI_ducal_eyr_settlement_tt:0 "$HSM_VER_UI_ducal_charter_tt$ Иовинус правит; спор о реквизициях урегулирован."
 HSM_VER_UI_ducal_failed_conference_tt:0 "Наш свободный Дом не воюет. Дипломатия провалилась, ожидаемых ответов нет; хартия не действует, Верения ещё не основана."
 HSM_VER_UI_ducal_avian_available_tt:0 "Действует герцогское урегулирование; свободный Авиан следует Intergigantes и не воюет. Земли и альянсы допускают переговоры; прежние или текущие предложения им не мешают."
 HSM_VER_UI_ducal_avian_bypass_tt:0 "Действует ассоциация с Авианом либо он вошёл в нашу свободную Верению, полностью владеющую необходимыми родными землями."
 HSM_VER_UI_ducal_erie_start_tt:0 "Открывает событие §Y$hsm_verenia.1.t$§!: Винсент начинает разбирать жалобы страны.\n$HSM_VER_UI_ducal_inherited_treaty_tt$"
 HSM_VER_UI_ducal_eyrie_start_tt:0 "Открывает событие §Y$hsm_ver_eyrie.1.t$§!: Иовинус требует проверить списки войск и реквизиции.\n$HSM_VER_UI_ducal_inherited_treaty_tt$"
 HSM_VER_UI_ducal_inherited_treaty_tt:0 "Признаёт действующий мир, заключённый при посредничестве Авиана."
 HSM_VER_UI_ducal_choose_diplomacy_tt:0 "Наш дом выбирает дипломатию. Соглашения требуют согласия другого дома; действующее перемирие становится бессрочным."
 HSM_VER_UI_ducal_petitions_tt:0 "Открывает событие §Y$hsm_verenia.2.t$§!: выберите публичные слушания с обязательствами перед гражданами либо частный приём прошений за политическую власть."
 HSM_VER_UI_ducal_erie_letters_tt:0 "Открывает событие §Y$hsm_verenia.3.t$§!: Винсент выслушивает просьбу Розалины свободно переписываться с Монтегю, открывая личное общение между Домами."
 HSM_VER_UI_ducal_eyrie_letters_tt:0 "Открывает событие §Y$hsm_ver_eyrie.3.t$§!: Иовинус разрешает переписку Монтегю и Розалины, обеспечивая проезд и не диктуя им ответ."
 HSM_VER_UI_ducal_armistice_reward_tt:0 "Предлагает перемирие. Другой дом может согласиться, потребовать проверок или отказать. Соглашение прекращает пограничные бои и взаимные цели завоевания; оно действует до войны или договора о дружбе."
 HSM_VER_UI_ducal_prepare_guarantees_tt:0 "Готовит гарантии и до договора открывает событие §Y$hsm_ver_routes.1.t$§!: выберите патрули с расходами на содержание либо разовый фонд возмещения, заменяющий инспекции арбитражем."
 HSM_VER_UI_ducal_open_roads_tt:0 "Если мы владеем и управляем областью §Y$STATE_401$§!, мгновенно добавляет §G1 уровень инфраструктуры§!. Открывает событие §Y$hsm_verenia.4.t$§!: на переправу возвращается гражданское движение."
 HSM_VER_UI_ducal_bridge_tt:0 "Пока действует мир, открывает событие §Y$hsm_ver_eyrie.4.t$§!: инженеры используют пограничные планы для ремонта моста и восстановления гражданского движения."
 HSM_VER_UI_ducal_treaty_reward_tt:0 "Предлагает договор о дружбе. Другой дом может подписать его, потребовать имущественного арбитража или отказать. Ратификация прекращает соперничество и взаимные территориальные притязания."
 HSM_VER_UI_ducal_treaty_recipients_tt:0 "При ратификации оба дома получают:"
 HSM_VER_UI_ducal_treaty_terms_tt:0 "Ратификация прекращает соперничество, проверки и взаимные территориальные притязания. Оба дома сохраняют независимость."
 HSM_VER_UI_ducal_delegates_tt:0 "Открывает событие §Y$hsm_verenia.40.t$§!: потратьте политическую власть на гражданских делегатов и возможность общественного совета либо сохраните делегатов двора."
 HSM_VER_UI_ducal_erie_charter_reward_tt:0 "Предлагает равноправие или ограниченное председательство герцога. Эйри может согласиться, потребовать равноправия или отказать."
 HSM_VER_UI_ducal_eyrie_charter_reward_tt:0 "Предлагает равноправную хартию. Эри может согласиться, запросить ограниченное председательство или отказать; встречное условие требует согласия Эйри."
 HSM_VER_UI_ducal_charter_benefits_tt:0 "Ратификация учреждает общие суды и сотрудничество по хартии."
 HSM_VER_UI_ducal_joint_staff_tt:0 "При действующей хартии создаёт совместный штаб обоих Домов и подходящего партнёра Авиана: каждому §G+5% к организации дивизий§! и §G-8% к потреблению снабжения§!."
 HSM_VER_UI_ducal_shared_services_tt:0 "При действующей хартии создаёт общие службы обоих Домов и подходящего партнёра Авиана: каждому §G+10% к росту эффективности производства§! и §G+5% к выпуску военных заводов§!."
 HSM_VER_UI_ducal_judgement_tt:0 "Открывает событие §Y$hsm_verenia.70.t$§!: исполните решение суда за политическую власть и продолжите урегулирование либо объявите герцогское исключение, приостановив преимущества хартии."
 HSM_VER_UI_ducal_erie_defence_tt:0 "Запрашивает согласие Эйри на оборонительный союз. Новый союз возглавит Эри; прежнее руководство сохраняется. Авиан получает отдельное приглашение."
 HSM_VER_UI_ducal_eyrie_defence_tt:0 "Запрашивает согласие Эри на оборонительный союз. Новый союз возглавит Эйри; прежнее руководство сохраняется. Авиан получает отдельное приглашение."
 HSM_VER_UI_ducal_keep_word_tt:0 "Если мы владеем и управляем областью §Y$STATE_401$§!, мгновенно добавляет §G1 гражданскую фабрику и 1 общую ячейку строительства§!. Через 30 дней §Y$hsm_verenia.90.t$§! подводит итоги обещаний, если урегулирование действует."
 HSM_VER_UI_ducal_erie_finale_tt:0 "Завершает урегулирование Эри и открывает событие §Y$hsm_verenia.91.t$§!. Дома остаются независимыми партнёрами; последующий конвент может создать единое государство Верении."
 HSM_VER_UI_ducal_eyrie_finale_tt:0 "Завершает урегулирование Эйри и открывает событие §Y$hsm_ver_eyrie.40.t$§!: мастерские и пограничное движение возвращаются к мирной жизни по хартии, сохраняя независимость Домов."
 HSM_VER_UI_ducal_independent_settlement_tt:0 "Открывает событие §Y$hsm_ver_routes.2.t$§!: после провала конференции наш Дом выбирает самостоятельное развитие без общего совета."
 HSM_VER_UI_ducal_avian_offer_tt:0 "Приглашает Авиан к ассоциации. Авиан вправе отказать; вступление в единое государство требует отдельного соглашения."
 HSM_VER_UI_ducal_muster_tt:0 "Открывает событие §Y$hsm_ver_eyrie.2.t$§!: выберите публичную проверку списков для гражданской подотчётности за политическую власть либо армейскую комиссию, укрепляющую офицеров."
 HSM_VER_UI_ducal_command_policy_tt:0 "Открывает событие §Y$hsm_ver_eyrie.10.t$§!: выберите гражданский контроль военных требований либо профессиональное командование с определёнными обязанностями по обороне."
 HSM_VER_UI_ducal_return_order_tt:0 "Открывает событие §Y$hsm_ver_eyrie.30.t$§!: потратьте политическую власть на возврат мастерских и урегулирование спора либо защитите реквизиции, приостановив преимущества хартии."
 HSM_VER_UI_ducal_workshops_tt:0 "При действующем урегулировании даёт §G1 гражданскую фабрику и 1 общую ячейку строительства§! в подходящей нашей национальной области под полным контролем. Если её нет, даёт §G1 бонус +100% к исследованию строительных технологий§!. Однократно."
