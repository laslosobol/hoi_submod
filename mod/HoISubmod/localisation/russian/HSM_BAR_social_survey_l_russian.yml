 HSM_BAR_social_survey_tt:0 "Первое общегосударственное обследование исправляет унаследованную оценку на §Y$poverty1$§! и §Y$lack_of_scientists1$§!. Более тяжёлое положение сохраняется. Обследование проводится один раз: последующие улучшения не сбрасываются при смене дерева фокусов. Промышленность, научная база и ячейки исследований не меняются."
 hsm_bar_social_survey.1.t:0 "Деревни за строками отчёта"
 hsm_bar_social_survey.1.d:0 "Первые донесения привезли вместе со списками жителей. Против одних имён стоял долг зерном; против других — отметка свидетеля, прочитавшего вопросы вслух. Один учитель нашёл в школьной комнате склад. В соседнем селе занятия шли за кухонным столом: дети передавали друг другу единственную книгу.\n\nДворцовые счета отмечали всё, что поступало в лаборатории, но не то, что оставалось деревням. Полный склад ещё не означал сытую семью. Четверо учёных ещё не делали страну образованной. Делегаты отказались подписывать отчёт, в котором одно подменяет другое.\n\nЭти сведения не сделали Баррад беднее за одну ночь. Они лишь не позволяют больше вычёркивать его бедность из отчётности. Теперь республике предстоит ответить продовольствием, школами и работой, которая дойдёт дальше дворцовых ворот."
 hsm_bar_social_survey.1.a:0 "Начнём со страны, которая у нас есть."
