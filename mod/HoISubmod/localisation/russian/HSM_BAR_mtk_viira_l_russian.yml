l_russian:
 HSM_BAR_mtk_field_atlas_title:0 "Атлас полей"
 HSM_BAR_mtk_field_atlas_idea:0 "Я различаю течения в комнате, которую ученики называют пустой. Пока это наблюдение обо мне, а не описание комнаты. Предлагаю составить атлас, с отметками которого другой наблюдатель сможет спорить. На прозрачных листах будут отдельно нанесены местность, показания кристаллов и впечатления исследователя. При наложении станет видно, что именно мы привыкли называть единым полем. Леопольд согласился переносить приборы, если я перестану поправлять их во время измерений. Справедливое условие. Первую съёмку проведём по пути из учебной комнаты в мастерскую; каждый отметит также места, где не заметил ничего необычного.\n\nПредложение подписала Виира."
 HSM_BAR_mtk_field_atlas_theory:0 "Рабочая гипотеза: местное магическое возмущение даёт повторяемый спектральный рисунок, хотя разные наблюдатели замечают разные его части. Сначала запишем состояние невозбуждённого кристалла, затем применим знакомые световые чары и сменим наблюдателей, не передвигая стойку. На отдельных прозрачных схемах отметим источник, соседние действующие приборы и направление взгляда. Показание, которое следует за наблюдателем, а не за источником, должно остаться характеристикой восприятия. Сильвер скроет от наблюдателей порядок проб, а записи соберёт до общего обсуждения, чтобы наши объяснения не подменили увиденное.\n\nНа полях Леопольд: Нужен пустой лист для выключенного прибора. Виира: Добавлен, с твоей подписью рядом с моей."
 HSM_BAR_mtk_field_atlas_tests:0 "Новая съёмочная группа определила положение световых чар по листам атласа ещё до входа в учебную комнату. При перемещении источника показания следовали за ним; смена наблюдателя меняла оценку яркости, но не нанесённую границу. В мастерской предполагаемый второй источник исчез, когда Леопольд остановил соседний зачарованный прибор. Эту помеху мы вынесли на отдельный прозрачный слой. Дождь у наружной стены размыл самые слабые показания, и провести надёжную границу там не удалось. Соответствующий участок оставили незамкнутым, сохранив все первоначальные отметки.\n\nСъёмку подписали Виира и Леопольд. Сверка Сильвера: Пустые пробы остались пустыми; атлас описывает поле, а не одно лишь ожидание."
 HSM_BAR_mtk_field_atlas_conclusion:0 "Атлас принят для повторных съёмок в условиях, указанных на каждом листе. Его результатом стала общая система отсчёта: другая группа может найти записанное возмущение и отличить его от необычной чувствительности наблюдателя. Атлас не превращает любое впечатление в измерение. Если погода или соседние приборы изменились, сомнительная граница должна оставаться сомнительной. Леопольд добавил съёмные накладки, чтобы исправления не уничтожали предыдущую съёмку. Я хотела получить красивую окончательную карту. Его устройство лучше подходит для рабочего атласа: теперь по нему можно восстановить и наши разногласия.\n\nПриняла Виира. Подпись мастерской: Леопольд, с просьбой сушить мокрые листы перед подшивкой."

 HSM_BAR_mtk_shared_senses_title:0 "Общие чувства"
 HSM_BAR_mtk_shared_senses_idea:0 "Когда я описываю спектральную кромку, Леопольд спрашивает, имею ли я в виду её положение, яркость или ощущение за глазами. Обычно всё сразу. Возможно, намеренно переданный фрагмент восприятия прояснит вопрос раньше, чем объяснения станут совсем запутанными. Предлагаю парные места наблюдения: отправитель сосредоточится на цветной фигуре, получатель зарисует пришедший образ. Каждый сохранит обычный обзор комнаты и собственный журнал. Нам нужен мост между наблюдениями с отчётливо обозначенными входом и выходом. Заранее условимся различать увиденное в комнате, принятое по связи и добавленное воображением.\n\nВиира. Приписка Леопольда: Начнём с фигуры, которая никуда не движется."
 HSM_BAR_mtk_shared_senses_theory:0 "Предлагаемая связь должна передавать выбранный чувственный образ, а не всё сознание отправителя. Гипотеза состоит в том, что устойчивое внимание придаёт простому контуру узнаваемую магическую оболочку. Участники будут поочерёдно смотреть на карточку и представлять её, пока получатель рисует за непрозрачной ширмой. Сравнением послужит неактивная связь. На прозрачных накладках отделим передаваемый образ от собственного поля зрения получателя. Следует также записывать усталость и любые ошибки в определении направления, даже если сама фигура опознана верно.\n\nПротокол Вииры. Дополнение Асинти: Пусть каждый пост самостоятельно размыкает связь; иначе мы не сможем правильно исследовать прерванное наблюдение."
 HSM_BAR_mtk_shared_senses_tests:0 "При действующей связи получатели узнавали предложенные неподвижные контуры чаще, чем в контрольных пробах. Они по-прежнему отвечали на вопросы о собственной комнате и самостоятельно прерывали передачу. Цвет оказался ненадёжным: бледно-зелёная карточка воспринималась как яркость без оттенка, а движущиеся фигуры вызывали путаницу направлений и дурноту. Воображаемые карточки передавались особенно плохо. Леопольд сравнил рисунки, не зная, когда связь действовала, и разложил прозрачные листы на моём столе. Совпадение было настоящим, но куда более узким, чем следовало из моего первого описания.\n\nИспытание подписала Виира. Асинти наблюдал размыкания; Сильвер записывал восстановление самочувствия после сеансов."
 HSM_BAR_mtk_shared_senses_conclusion:0 "Общее восприятие сохраняется как ограниченный способ намеренной передачи простых чувственных признаков. Оно не заменяет всего опыта другого наблюдателя, а уверенное суждение получателя о цвете не заслуживает особого доверия. Сеансы должны оставаться местными, короткими и опираться на обычный обзор комнаты. Движение и воображаемые сцены лежат за пределами принятой процедуры. Асинти предложил сохранять отдельные рисунки даже при разногласиях. Леопольд изготовил неглубокие лотки, чтобы листы не приходилось складывать в обманчиво цельную картину.\n\nВиира: Я собиралась одолжить кому-нибудь свои глаза. Мы научились обмениваться контуром и указывать, кому он принадлежит; остальное пока остаётся за границами опыта."

 HSM_BAR_mtk_sleep_lecture_title:0 "Лекция во сне"
 HSM_BAR_mtk_sleep_lecture_idea:0 "Вечером ученики могут повторить объяснение, а к утру теряют порядок действий. Мне интересно, сохранится ли урок, прочитанный во сне, без обычных отвлечений учебной комнаты. Сильвер возражает: узнавание после пробуждения может объясняться вечерним разговором. Он прав, требуя незнакомого материала. Предлагаю безобидную последовательность выдуманных знаков, которую предъявят только после засыпания, и отдельное бодрствующее занятие для сравнения. В записи не будет знакомых чар, восстанавливаемых опытным учеником по привычке. Утренние ответы нужно получить прежде, чем участники начнут пересказывать друг другу свои сновидения.\n\nВиира. Знаки подготовит Сильвер; я не стану заранее смотреть правильные ответы."
 HSM_BAR_mtk_sleep_lecture_theory:0 "Рабочая гипотеза требует большего, чем реакции спящего на звук: после пробуждения должны сохраняться порядок и значение незнакомых знаков. Сильвер подготовит сопоставимые наборы; один объяснят бодрствующим ученикам, другой предъявят во время наблюдаемого сна. Тихие ночи и выключенный прибор помогут отделить обучение от простого нарушения отдыха. Утренний проверяющий не будет знать, какой сеанс состоялся. Узнавание, объяснение и применение в новой комбинации запишем отдельно, не объединяя их общим впечатлением от ответа.\n\nПротокол Вииры. Пометка Сильвера: Сон о лекции ещё не свидетельствует об усвоении урока. Согласна; рассказ о сновидении получит собственный лист."
 HSM_BAR_mtk_sleep_lecture_tests:0 "Спящие участники иногда вспоминали голос или видели во сне учебную комнату. Однако они не могли объяснить незнакомые знаки или расположить их лучше, чем после тихих контрольных ночей. Кажущееся узнавание исчезало, когда проверяющий менял карточки. Бодрствующая группа со своим отдельным набором могла объяснить правило собственными словами. Повторные сеансы во сне приносили усталость без усвоения материала, поэтому Сильвер прекратил их. Я проверила записи на случай пропущенного отрывка; пропусков не было, и порядок знаков соответствовал протоколу.\n\nПротокол испытания подписали Виира и Сильвер. Леопольд подтвердил, что прибор воспроизводил назначенный урок в течение всего наблюдаемого промежутка."
 HSM_BAR_mtk_sleep_lecture_conclusion:0 "Лекция во сне потерпела неудачу. Она не даёт подтверждённого обучения, не заменяет занятия и не приносит никакой возмещающей практической пользы. Прибор изымается из учебной работы; после полноценного отдыха ученики возвращаются к обычным урокам. Рассказы о сновидениях остаются в отчёте, поскольку объясняют прежнюю убедительность замысла, а не составляют его частичный успех. Я попросила Сильвера ещё раз проверить толкование, которое мне хотелось принять. Он терпеливо проверил и получил прежний ответ. Оснований продолжать занятия этим способом нет.\n\nРаботу закрыла Виира. Последняя пометка Сильвера: Хранить бодрствующее сравнение рядом со снами, чтобы читатель видел, какое именно утверждение отвергнуто."

 HSM_BAR_mtk_crystal_memory_title:0 "Память кристалла"
 HSM_BAR_mtk_crystal_memory_idea:0 "Схема сохраняет расположение предметов в опыте, но теряет изменение их света. Предлагаю проверить, способен ли кристалл удержать это меняющееся впечатление достаточно долго, чтобы его рассмотрел другой наблюдатель. Первым предметом станет световой рисунок, а не воспоминание из чьей-либо жизни. Леопольд принёс лоток внешне похожих кристаллов и требует нумеровать мутные образцы столь же тщательно, как прозрачные. Он подозревает, что я отбираю их по ощущению, которое никогда не описывала. Это подозрение следует внести в предложение: выбор красивого образца не должен заранее определять ответ.\n\nВиира. Реестр образцов проверил и подписал Леопольд."
 HSM_BAR_mtk_crystal_memory_theory:0 "Наша гипотеза: наложенный магический рисунок оставляет временную упорядоченность внутри восприимчивого кристалла. Последующее возбуждение, возможно, воспроизведёт видимый след, но воспроизведение необходимо отличать от нового образа, внесённого самим наблюдателем. Сравним обработанные и нетронутые кристаллы, сменим наблюдателей и покажем исходный рисунок рядом с восстановленным следом только после независимых зарисовок. На прозрачных спектральных листах отметим угасание и любые наложения после повторного использования. Неясные изображения также войдут в запись.\n\nЛеопольд: Указывать условия хранения, особенно тепло. Виира: Согласна. Красивое воспроизведение после тщательного отбора слишком мало скажет нам о кристалле на обычной полке."
 HSM_BAR_mtk_crystal_memory_tests:0 "Обработанные кристаллы воспроизвели общий порядок светового рисунка; нетронутые образцы этого не сделали. Наблюдатели, не видевшие оригинала, всё же зарисовали узнаваемые следы. Однако тонкие края исчезали при хранении, а возле тёплой стены мастерской образцы расплывались раньше. При повторном использовании под новым изображением иногда оставалась прежняя фигура. Леопольд установил, что мои любимые прозрачные образцы не защищены от такого наложения. Мы совместили восстановленные изображения с исходной прозрачной схемой и отметили каждое расхождение, не сглаживая неровности ради сходства.\n\nЗапись подписали Виира и Леопольд. Сильвер проверил независимые зарисовки прежде, чем были открыты листы для сравнения."
 HSM_BAR_mtk_crystal_memory_conclusion:0 "Кристальная память принята только для временной записи простых видимых магических рисунков. Восстановленный след должен сопровождаться исходной схемой, условиями хранения и отметкой о прежнем использовании образца. Он не годится для точной записи мелких деталей, тем более для хранения личности или полной памяти о пережитом. Название удобно; различие обязательно. Леопольд выделил отдельный лоток для сомнительных образцов, а я перестала называть их расплывчатые края художественным сходством. Бумажные зарисовки будут храниться рядом, даже если кристалл кажется безупречным.\n\nВиира. Дополнение Леопольда: Сохранять оригиналы. Кристалл, который неточно помнит вчерашнее, не должен оставаться его единственным свидетелем."

 HSM_BAR_mtk_spell_notation_title:0 "Нотация чар"
 HSM_BAR_mtk_spell_notation_idea:0 "В моей учебной схеме написано: поддерживать свет. Именно этого ученики и не могут повторить. Леопольд следил за моими рогами и заметил движение, которое я пропустила, поскольку почти не замечала сама. Предлагаю запись, учитывающую подготовку, внимание и прерывание столь же тщательно, как видимые чары. Прозрачные схемы отделят желаемое действие от действий заклинателя. Начальным упражнением станут обычные световые чары; вести его по записи будет преподаватель, который не видел моего исполнения. Его вопросы нужно сохранить вместе с первоначальным листом.\n\nВиира. Леопольд вызвался ещё раз задавать вопросы, которые сначала кажутся глупыми."
 HSM_BAR_mtk_spell_notation_theory:0 "Гипотеза состоит в том, что доступные обучению чары содержат описуемые действия наряду с личными привычками. Каждый знак должен обозначать наблюдаемое действие, проверяемое условие или момент остановки. Незнакомый с упражнением преподаватель получит запись; вопросы соберём до показа. Отдельные схемы объяснят, как оленьи рога, рог единорога или внешний регулятор обеспечивают одно условие. Одного сходства движений недостаточно, чтобы признать их равноценными. Преподаватель также отметит места, где ему захотелось дополнить текст догадкой.\n\nСильвер предлагает намеренно пропустить указание в сравнительном экземпляре. Виира: Согласна, если упражнение безобидно и мы запишем, где читатель обнаружил пропуск."
 HSM_BAR_mtk_spell_notation_tests:0 "Преподаватель, не присутствовавший на моих показах, провёл световое упражнение по исправленным страницам. Ученики сумели не только зажечь свет, но и объяснить его остановку. Сравнительный экземпляр привёл к заминке на пропущенном указании; преподаватель отметил её, не придумывая ответ. Внешний регулятор воспроизвёл нужное условие для ученика со слабой магией, тогда как простое копирование движения моих рогов не помогло. Более сложные чары всё ещё требовали незаписанных суждений, поэтому их листы остаются черновиками.\n\nВиира. Сильвер проверил записи занятий. Карандашная пометка Леопольда: Самое маленькое исправление оказалось именно тем, которое ты считала совершенно ненужным."
 HSM_BAR_mtk_spell_notation_conclusion:0 "Нотация принята для начальных упражнений, воспроизведённых другим преподавателем. Она описывает порядок действий с проверками, но не обещает, что любое существо обладает одинаковой магией. Непереведённые телесные привычки и суждения остаются видимыми пробелами до отдельных опытов. Прозрачные схемы теперь позволяют заменить способ исполнения, не притворяясь, будто изменилось требуемое условие. Я снова села за последнюю парту и наблюдала, как преподаватель исправляет мою первоначальную страницу, не обращаясь ко мне. Ученики продолжили упражнение по его объяснению.\n\nВиира. Леопольд подписал чертежи регулятора. Сильвер просит экземпляры с широкими полями: нашей законченной записи, по-видимому, ещё нужно место для споров."

 HSM_BAR_mtk_chorus_title:0 "Хор"
 HSM_BAR_mtk_chorus_idea:0 "Предлагаю зал, где несколько исследователей смогут следить за одним магическим явлением, оставаясь различимыми наблюдателями. Каждый пост будет передавать выбранное впечатление и небольшой вклад в общий световой рисунок; прозрачные схемы сохранят отдельные следы. Сборка должна дождаться завершённых отчётов по Атласу полей, Общим чувствам, Лекции во сне, Памяти кристалла и Нотации чар. Нельзя опустить ни одну работу только потому, что её ответ нас разочаровал. Замысел зависит от их рассмотрения, а не от моей способности залить слабое соединение избыточной силой.\n\nВиира. Леопольд подготовит отдельные посты; Асинти проверит предусмотренные способы прерывания."
 HSM_BAR_mtk_chorus_theory:0 "Гипотеза Хора объединяет ограниченные обмены восприятием без слияния сознаний. Атлас полей задаёт обследованные границы и слои помех. Общие чувства ограничивают передачу намеренно предложенными неподвижными признаками. Неудача Лекции во сне исключает пассивное усвоение: каждый участник должен бодрствуя освоить и объяснить задачу. Память кристалла даёт лишь временные образцы, сверяемые с бумагой из-за угасания. Нотация чар описывает вклады и явные моменты остановки. Все эти завершённые исследования обязательны перед сборкой. Предполагаем, что независимые посты смогут поддерживать общий световой рисунок в обследованном зале; дальность, перегрузка и выход участника ещё требуют проверки.\n\nВиира; посты проверил Леопольд, порядок занятий Сильвер и Асинти."
 HSM_BAR_mtk_chorus_tests:0 "Хор поддерживал согласованный световой рисунок, пока участники описывали собственное окружение и независимо выходили из связи. Атлас полей выявил помехи у стены мастерской; перенос постов внутрь обследованной границы восстановил рисунок. Общие чувства передавали предложенные контуры, но по-прежнему путали цвет. После провала Лекции во сне Сильвер требовал объяснений наяву: одного копирования сигнала оказалось недостаточно. Следы Памяти кристалла искажались при повторах, и разногласия разрешали бумажные образцы. Нотация чар позволила другому читателю продолжить оставленный вклад без догадок о его назначении. Насыщенный обмен вызывал усталость; вне подготовленного зала приём прекращался.\n\nВиира записала спектры; Леопольд, Сильвер и Асинти подписали отдельные журналы постов."
 HSM_BAR_mtk_chorus_conclusion:0 "Хор принят как местное совместное исследование восприятия и магии с независимыми участниками и отдельно прерываемыми вкладами. Атлас полей определяет допустимое пространство сеанса. Общие чувства ограничивают предмет передачи. Неудачная Лекция во сне не приносит пользы обучению; её отвергнутая предпосылка запрещает считать приём пониманием. Память кристалла остаётся угасающим образцом рядом с постоянными рисунками. Нотация чар делает каждый вклад проверяемым и заменяемым. Все эти исследования прилагаются к каждому экземпляру отчёта. Наблюдения не подтверждают доступ к отсутствующим разумам или сознание за пределами подготовленной группы.\n\nВиира: На прозрачных листах по-прежнему различимы авторы. Леопольд, Сильвер и Асинти подписывают каждый собственный след рядом с её записью."
