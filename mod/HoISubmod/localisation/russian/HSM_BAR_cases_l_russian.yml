 HSM_BAR_study_plants:0 "Исследование: Рост под наблюдением"
 HSM_BAR_study_plants_desc:0 "БР-005 / запись гербария. Большинство собранных раздражающих растений повело себя в соответствии с агрономическим справочником. Образец V-6 стал исключением: после переноса лампы новые побеги снова пошли по затенённой стороне ограждения. Повторное наблюдение опечатано вместе с первым рисунком; имя сборщика скрыто.\n\nПравила Кшемень уже предотвратили ещё одно поражение при контакте. Агроном предлагает наблюдаемый участок для восстановления истощённой почвы. Врона согласна лишь при отдельном сборе стоков. До решения директора черенки не должны покидать ограждение.\n\n$HSM_BAR_case_study_terms_tt$"
