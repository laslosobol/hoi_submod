 HSM_BAR_study_herald:0 "Исследование: Свет без приговора"
 HSM_BAR_study_herald_desc:0 "БР-013 / сравнение экспозиций. Сохранившиеся свидетельства сходятся в том, что был свет, но расходятся в его источнике и порядке событий. В одном описана тень там, где регистрирующая поверхность оказалась засвечена. Лаборатория не установила, относятся ли эти наблюдения к одному промежутку времени.\n\nСравнение выявило недостатки наших собственных приборов. Исправленная методика калибровки готова к испытаниям. Кшемень просит сохранить защитные экраны, даже если новые показания будут выглядеть успокаивающе. Список свидетелей остаётся в исходном отделении и здесь не воспроизводится.\n\n$HSM_BAR_case_study_terms_tt$"
