 HSM_BAR_study_crown:0 "Исследование: Корона за стеклом"
 HSM_BAR_study_crown_desc:0 "БР-007 / наблюдение через экран. Изъятую корону никто не надевал. Тем не менее на первом сеансе дежурный повторил приказ, который в комнате не произносили. Он помнил голос начальника; начальник отсутствовал.\n\nВрона ввела второй канал подтверждения и сменила порядок дежурств. В записанных опытах происшествие не повторилось. Прервали ли воздействие или лишь лишили его удобного случая, остаётся спорным. Учебный отдел просит разрешить закрытые занятия по новой методике. Кшемень предлагает не выносить её за пределы персонала хранилища.\n\n$HSM_BAR_case_study_terms_tt$"
