 HSM_BAR_study_grover:0 "Исследование: Две даты одного императора"
 HSM_BAR_study_grover_desc:0 "БР-011 / комиссия по установлению личности. Полученные записи отделяют свидетельства современников от копий, составленных уже после того, как имя императора приобрело политическую ценность. Два предполагаемых очевидца повторяют одну повреждённую фразу, включая пропуск слова. Считать их показания независимыми нельзя.\n\nВрона предлагает обучить полевых сотрудников отличать личность от истории претендента. Ольха просит оставить противоречивую хронологию в закрытом архиве. Комиссия не делала заключений о физическом удержании. Приложение по йельским материалам требует отдельной подписи.\n\n$HSM_BAR_case_study_terms_tt$"
