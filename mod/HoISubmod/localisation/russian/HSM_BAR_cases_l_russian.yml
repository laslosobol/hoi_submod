l_russian:
 HSM_BAR_cases_studies:0 "Научный комплекс: предметные исследования"
 HSM_BAR_cases_studies_desc:0 "Исследователи Кшемень сопоставляют образцы с записями Ольхи. Врона требует сохранять рядом с каждым выводом первоначальное показание: лаборатория не должна решать за тех, кто вернётся на место опыта."
 HSM_BAR_cases_containment_knowledge_tt:0 "Изучены Живой камень, подземный ответ и естественное объяснение эха в шахте."
 HSM_BAR_cases_forensics_knowledge_tt:0 "Дополнительно изучены сочленения Титана и магнитная причина ошибки компаса."
 HSM_BAR_cases_suppression_knowledge_tt:0 "Дополнительно изучена наблюдаемая защитная граница амулета Яношика. Это знание о локальном барьере, не доказательство возможности подавить всю магию."
 HSM_BAR_cases_lead_confirmed_tt:0 "Проверенная зацепка открывает точечную операцию против нынешнего хранителя. При La Resistance нужен разведывательный путь; без дополнения доступна экспедиция. Объект ещё не получен."
 HSM_BAR_cases_samples_received_tt:0 "Получены материалы полевой проверки. В Научном комплексе доступно отдельное исследование; научный вывод и бонус ещё не получены."
 HSM_BAR_cases_review_ready_tt:0 "Завершены исследования Живого камня и эха в шахте; принято решение о применении либо хранении результатов дела об эхе."
 HSM_BAR_cases_reserve:0 "Использовать выводы для внутренней защиты."
 HSM_BAR_cases_later:0 "Отложить решение о применении."
 HSM_BAR_cases_local:0 "Местное отделение: первичные сообщения"
 HSM_BAR_cases_local_desc:0 "Врона собирает группы из тех, кто знает старые шахты и уцелевшие деревни. Жители помнят приказы Пентархии лучше, чем названия её опытов. Иногда начать приходится с обещания не возвращать их туда силой."
 HSM_BAR_cases_equus:0 "Эквус: полевые расследования"
 HSM_BAR_cases_equus_desc:0 "Здесь чудеса не всегда прячут от посторонних. Труднее понять, кто умеет отличить древнюю защиту от угрозы, принявшей знакомый облик. Марта просит искать свидетелей прежде, чем искать противников."
 HSM_BAR_cases_griffonia:0 "Центральная Грифония: проверка источников"
 HSM_BAR_cases_griffonia_desc:0 "В университетских хранилищах встречаются страницы с теми же обозначениями, что в тетрадях Ольхи. Одни считают их ошибками переписчиков; другие слишком настойчиво интересуются тем, кто их читает."
 HSM_BAR_cases_north:0 "Северное отделение: закрытые маршруты"
 HSM_BAR_cases_north_desc:0 "Ирма Кальк хранит карту мест, откуда перестали возвращаться проводники. Сведения о ритуалах, болезнях и старых захоронениях лежат отдельно: один страх ещё не делает их одной угрозой."
 HSM_BAR_cases_riverlands:0 "Речные земли: исследовательская группа"
 HSM_BAR_cases_riverlands_desc:0 "Образцы воды отправляют в Баррад под видом помощи комиссии по восстановлению. Это не совсем ложь. Если болотные огни имеют обычную причину, её понимание может оказаться полезнее очередной опасной реликвии."
 HSM_BAR_cases_zebrica:0 "Зебрика: караванные донесения"
 HSM_BAR_cases_zebrica_desc:0 "Каждый рассказ меняется с языком переводчика. Южная группа записывает имена проводников в отдельной тетради и не платит за чудо, пока не найдёт того, кто видел его без посредников."
 HSM_BAR_rumor_echo:0 "Второй голос в шахте"
 HSM_BAR_rumor_echo_desc:0 "Ремонтная бригада утверждает, что пустая вентиляционная шахта отвечает на вопросы. Местная группа повторит измерения звука, прежде чем объявлять ответ разумным."
 HSM_BAR_rumor_compass:0 "Стрелка, отказавшаяся от севера"
 HSM_BAR_rumor_compass_desc:0 "Торговец предлагает компас, якобы указывающий на подземное святилище. Проверить упаковку, повторить маршрут и взять контрольный прибор."
 HSM_BAR_rumor_marsh:0 "Огни без перевозчика"
 HSM_BAR_rumor_marsh_desc:0 "Свидетели описывают огни над речным болотом. Паромщик отказывается переправлять после заката. Получить воду и осадок с указанного берега; записать его показания до знакомства с чужими рассказами."
 HSM_BAR_rumor_reactor:0 "Недостающий журнал действующего реактора"
 HSM_BAR_rumor_reactor_desc:0 "Среди лабораторных бумаг найдена пропавшая страница рабочего журнала реактора. Указанный инженер отрицает подпись. Сверить показания исходных приборов с записью остановки."
 HSM_BAR_rumor_sombra:0 "Вернувшийся король в кристальных донесениях"
 HSM_BAR_rumor_sombra_desc:0 "В донесениях Кристальной Империи появилось имя, которое переписчик считал частью завершённой истории. Установить автора первого сообщения и выяснить, добавляют ли поздние копии что-либо к его словам."
 HSM_BAR_rumor_darkheart:0 "Второе сердце в описи"
 HSM_BAR_rumor_darkheart_desc:0 "В строительной записи упомянуто второе сердце. Фразу сначала сочли метафорой; опись назначает ему отдельного хранителя. Проследить запись до её источника."
 HSM_BAR_rumor_grover:0 "Император, внесённый дважды"
 HSM_BAR_rumor_grover_desc:0 "Два рассказа помещают имя императора рядом с несовместимыми датами. Йельские материалы могут показать, где началось переписывание. Получить самый ранний документ прежде, чем повторять утверждение."
 HSM_BAR_rumor_herald:0 "Свидетель света из хранилища"
 HSM_BAR_rumor_herald_desc:0 "Одно хранилище упомянуто в заметках исследователя и молитве свидетеля. Оба описывают свет, но не называют источник друг друга. Найти свидетеля прежде, чем рассказ станет проповедью."
 HSM_BAR_rumor_rosa:0 "Меняющиеся подписи Мейджхолда"
 HSM_BAR_rumor_rosa_desc:0 "На ритуальной странице стоит знакомая подпись поверх незнакомых поправок. Северный отдел установил того, кто держал более раннюю копию. Организовать беседу, не называя нынешнего владельца страницы."
 HSM_BAR_rumor_chalice:0 "Пропавший сосуд экспедиции"
 HSM_BAR_rumor_chalice_desc:0 "Экспедиционная опись перечисляет сосуд, пропущенный в открытом отчёте. Свидетель помнит, кто опечатал его футляр. Проследить эту цепочку до попытки осмотра содержимого."
 HSM_BAR_rumor_phylactery:0 "Хранилище после ритуала"
 HSM_BAR_rumor_phylactery_desc:0 "Одну складскую запись сохранили после ритуала, тогда как соседние перечеркнули. Установить, остался ли сосуд у хранителя и почему опись обращается с ним иначе."
 HSM_BAR_rumor_zebrica:0 "Три накладные на одну невозможную реликвию"
 HSM_BAR_rumor_zebrica_desc:0 "Три торговца предлагают реликвию, якобы проходящую сквозь запертые стены. Каждый по-разному описывает футляр. Прежде закупки найти того, кто видел его открытым."
 HSM_BAR_rumor_crown_equus:0 "Корона, о которой заговорили хранители"
 HSM_BAR_rumor_crown_equus_desc:0 "Найденная корона приобрела тревожную репутацию. Отделению нужны первый свидетель, нынешний хранитель и рассказ о том, что произошло между ними. Расследование в отношении правящего носителя должно оставаться наблюдением."
 HSM_BAR_rumor_crown_griffonia:0 "Корона, о которой заговорили хранители"
 HSM_BAR_rumor_crown_griffonia_desc:0 "Найденная корона приобрела тревожную репутацию. Отделению нужны первый свидетель, нынешний хранитель и рассказ о том, что произошло между ними. Расследование в отношении правящего носителя должно оставаться наблюдением."
 HSM_BAR_rumor_crown_zebrica:0 "Корона, о которой заговорили хранители"
 HSM_BAR_rumor_crown_zebrica_desc:0 "Найденная корона приобрела тревожную репутацию. Отделению нужны первый свидетель, нынешний хранитель и рассказ о том, что произошло между ними. Расследование в отношении правящего носителя должно оставаться наблюдением."
 HSM_BAR_study_rock:0 "Исследование: Живой камень"
 HSM_BAR_study_rock_desc:0 "БР-001 / испытание давлением. На четвёртом повторе осколок сдвинулся навстречу нагрузке, но лишь пока необработанная грань была обращена к храму. Контрольная крупица оставалась неподвижной. Ольха приказал повернуть камеру; движение прекратилось. До смены дежурства поворачивать её обратно запретили.\n\nНа плане выработки появилась граница, которой нет на сохранившихся чертежах Асинти. Рядом чужим почерком: Второй вход не строить. Подпись из этой копии изъята.\n\n$HSM_BAR_case_study_terms_tt$"
 HSM_BAR_project_case_rock:0 "Живой камень"
 HSM_BAR_project_case_rock_desc:0 "БР-001 / испытание давлением. На четвёртом повторе осколок сдвинулся навстречу нагрузке, но лишь пока необработанная грань была обращена к храму. Контрольная крупица оставалась неподвижной. Ольха приказал повернуть камеру; движение прекратилось. До смены дежурства поворачивать её обратно запретили.\n\nНа плане выработки появилась граница, которой нет на сохранившихся чертежах Асинти. Рядом чужим почерком: Второй вход не строить. Подпись из этой копии изъята."
 HSM_BAR_study_rock_disposition:0 "Решение по делу: Живой камень"
 HSM_BAR_study_rock_disposition_desc:0 "Завершённый отчёт ожидает подписанного решения. Оба предложения и их эффекты указаны при повторном открытии. Последующее окончательное решение заменит предварительную политику."
 hsm_bar_cases.1.t:0 "Живой камень"
 hsm_bar_cases.1.d:0 "ОГРАНИЧЕННАЯ КОПИЯ / исследовательский отдел\nБР-001 / испытание давлением. На четвёртом повторе осколок сдвинулся навстречу нагрузке, но лишь пока необработанная грань была обращена к храму. Контрольная крупица оставалась неподвижной. Ольха приказал повернуть камеру; движение прекратилось. До смены дежурства поворачивать её обратно запретили.\n\nНа плане выработки появилась граница, которой нет на сохранившихся чертежах Асинти. Рядом чужим почерком: Второй вход не строить. Подпись из этой копии изъята."
 hsm_bar_cases.1.a:0 "Разрешить проходку под наблюдением."
 HSM_BAR_study_rock_done:0 "Завершено исследование: Живой камень"
 HSM_BAR_study_rock_applied:0 "Применены результаты: Живой камень"
 HSM_BAR_study_rock_reserved:0 "Результаты оставлены в архиве: Живой камень"
 HSM_BAR_study_rock_retry:0 "Повторное исследование после утраты доступа: Живой камень"
 HSM_BAR_study_titan:0 "Исследование: Сочленения Титана"
 HSM_BAR_study_titan_desc:0 "БР-002 / сверка схем нагрузки. Три уцелевших чертежа расходятся в устройстве центрального сочленения. Без спорной линии расчёт не сходится; с ней получается смещение, отмеченное на реперах при обследовании. Автор чертежа не установлен.\n\nГруппа Вроны не нашла соответствующей детали в доступных выработках. В последней записке она спрашивает, изображает ли чертёж построенное или то, что собирались найти под ним. Нижний лист съёмки хранится в отдельном конверте. Заводские инженеры запросили исправленные таблицы.\n\n$HSM_BAR_case_study_terms_tt$"
 HSM_BAR_project_case_titan:0 "Сочленения Титана"
 HSM_BAR_project_case_titan_desc:0 "БР-002 / сверка схем нагрузки. Три уцелевших чертежа расходятся в устройстве центрального сочленения. Без спорной линии расчёт не сходится; с ней получается смещение, отмеченное на реперах при обследовании. Автор чертежа не установлен.\n\nГруппа Вроны не нашла соответствующей детали в доступных выработках. В последней записке она спрашивает, изображает ли чертёж построенное или то, что собирались найти под ним. Нижний лист съёмки хранится в отдельном конверте. Заводские инженеры запросили исправленные таблицы."
 HSM_BAR_study_titan_disposition:0 "Решение по делу: Сочленения Титана"
 HSM_BAR_study_titan_disposition_desc:0 "Завершённый отчёт ожидает подписанного решения. Оба предложения и их эффекты указаны при повторном открытии. Последующее окончательное решение заменит предварительную политику."
 hsm_bar_cases.2.t:0 "Сочленения Титана"
 hsm_bar_cases.2.d:0 "ОГРАНИЧЕННАЯ КОПИЯ / исследовательский отдел\nБР-002 / сверка схем нагрузки. Три уцелевших чертежа расходятся в устройстве центрального сочленения. Без спорной линии расчёт не сходится; с ней получается смещение, отмеченное на реперах при обследовании. Автор чертежа не установлен.\n\nГруппа Вроны не нашла соответствующей детали в доступных выработках. В последней записке она спрашивает, изображает ли чертёж построенное или то, что собирались найти под ним. Нижний лист съёмки хранится в отдельном конверте. Заводские инженеры запросили исправленные таблицы."
 hsm_bar_cases.2.a:0 "Приспособить таблицы для заводских механизмов."
 HSM_BAR_study_titan_done:0 "Завершено исследование: Сочленения Титана"
 HSM_BAR_study_titan_applied:0 "Применены результаты: Сочленения Титана"
 HSM_BAR_study_titan_reserved:0 "Результаты оставлены в архиве: Сочленения Титана"
 HSM_BAR_study_titan_retry:0 "Повторное исследование после утраты доступа: Сочленения Титана"
 HSM_BAR_study_entity:0 "Исследование: Ответ под полом"
 HSM_BAR_study_entity_desc:0 "БР-003 / пост прослушивания. На вторую ночь из двух шахт пришла одинаковая последовательность ударов. Третий приёмник записал ответ на сигнал, который дежурный ещё не передал. Тот предположил перекрёстное соединение. Провод перерезали; ответ продолжался.\n\nОльха вычеркнул из отчёта слово «эхо», но отказался вписывать вместо него имя. Кшемень просит набрать следующую смену из добровольцев, не читавших стенограмму БР-«СКРЫТО». В инструктаж нельзя включать фразу, слышную в конце записи.\n\n$HSM_BAR_case_study_terms_tt$"
 HSM_BAR_project_case_entity:0 "Ответ под полом"
 HSM_BAR_project_case_entity_desc:0 "БР-003 / пост прослушивания. На вторую ночь из двух шахт пришла одинаковая последовательность ударов. Третий приёмник записал ответ на сигнал, который дежурный ещё не передал. Тот предположил перекрёстное соединение. Провод перерезали; ответ продолжался.\n\nОльха вычеркнул из отчёта слово «эхо», но отказался вписывать вместо него имя. Кшемень просит набрать следующую смену из добровольцев, не читавших стенограмму БР-«СКРЫТО». В инструктаж нельзя включать фразу, слышную в конце записи."
 HSM_BAR_study_entity_disposition:0 "Решение по делу: Ответ под полом"
 HSM_BAR_study_entity_disposition_desc:0 "Завершённый отчёт ожидает подписанного решения. Оба предложения и их эффекты указаны при повторном открытии. Последующее окончательное решение заменит предварительную политику."
 hsm_bar_cases.3.t:0 "Ответ под полом"
 hsm_bar_cases.3.d:0 "ОГРАНИЧЕННАЯ КОПИЯ / исследовательский отдел\nБР-003 / пост прослушивания. На вторую ночь из двух шахт пришла одинаковая последовательность ударов. Третий приёмник записал ответ на сигнал, который дежурный ещё не передал. Тот предположил перекрёстное соединение. Провод перерезали; ответ продолжался.\n\nОльха вычеркнул из отчёта слово «эхо», но отказался вписывать вместо него имя. Кшемень просит набрать следующую смену из добровольцев, не читавших стенограмму БР-«СКРЫТО». В инструктаж нельзя включать фразу, слышную в конце записи."
 hsm_bar_cases.3.a:0 "Продолжить опыты с изолированными сигналами."
 HSM_BAR_study_entity_done:0 "Завершено исследование: Ответ под полом"
 HSM_BAR_study_entity_applied:0 "Применены результаты: Ответ под полом"
 HSM_BAR_study_entity_reserved:0 "Результаты оставлены в архиве: Ответ под полом"
 HSM_BAR_study_entity_retry:0 "Повторное исследование после утраты доступа: Ответ под полом"
 HSM_BAR_study_amulet:0 "Исследование: Защитная граница Яношика"
 HSM_BAR_study_amulet_desc:0 "БР-004 / пограничная съёмка. Старейший свидетель помнил предупреждение хранителя, но не его слова. Второй помнил слова и отрицал, что это было предупреждением. Не видя чужой карты, оба отметили один изгиб тропы.\n\nСохранившиеся записи об амулете совпадают с новой съёмкой именно там. На других участках совпадения нет. Кшемень запретила переносить сельские межевые знаки ради чистоты опыта. Уменьшенную испытательную линию можно устроить на заброшенной земле; сохранение прежней защиты потребует постоянной связи с жителями.\n\n$HSM_BAR_case_study_terms_tt$"
 HSM_BAR_project_case_amulet:0 "Защитная граница Яношика"
