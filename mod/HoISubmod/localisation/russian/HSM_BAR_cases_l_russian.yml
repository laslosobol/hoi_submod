 hsm_bar_cases.30.t:0 "Ящик, которого никто не видел"
 hsm_bar_cases.30.d:0 "ЮЖНОЕ ОТДЕЛЕНИЕ / заключительная записка\nПервый продавец направил сотрудника ко второму; второй никогда не видел сосуд и назвал своим источником первого. Осмотр предложенного хранилища не выявил ящика, подходящего хотя бы под одно описание.\n\nКальк приостановила закупку. В последнем письме курьера есть третий адрес, записанный другим почерком. Он оставлен в деле с пометкой «не проверен». Имя под ним из этой копии изъято. Новых средств не выделять без свидетеля, независимого от продавцов."
 hsm_bar_cases.30.a:0 "Недостаток данных — тоже результат проверки."
