 hsm_bar_cases.15.t:0 "Шахта, ответившая дважды"
 hsm_bar_cases.15.d:0 "ОГРАНИЧЕННАЯ КОПИЯ / исследовательский отдел\nБР-015 / закрытие проверки шахты. Второй голос отставал от свистка на тот же промежуток, что и от речи. За повреждённой перегородкой изыскатели нашли вентиляционную камеру, отсутствующую на всех доступных планах. Открытие люка изменило задержку точно по расчёту.\n\nБригадир спросил, не выдумали ли рабочие голос. Кшемень ответила, что они сообщили об услышанном. Исправленные чертежи можно использовать для возвращения выработок в строй или оставить для меньшей программы вентиляции убежищ. Других необъяснимых ответов не зарегистрировано."
 hsm_bar_cases.15.a:0 "Передать исправленные планы восстановительным бригадам."
