 hsm_bar_cases.17.d:0 "ОГРАНИЧЕННАЯ КОПИЯ / исследовательский отдел\nБР-017 / слепая проверка маршрута. Когда ящик перенесли без ведома носильщика, стрелка повернулась вслед за ним. Крепление под крышкой сохранило намагниченность. После его удаления контрольное показание восстановилось. Маршрут к подземному святилищу не подтвердился.\n\nНа первом рисунке торговца ящик есть; на поздних копиях он исчез. Врона сохранила их все. Изыскателям пригодится проверка калибровки, тогда как плановый отдел запрашивает слепую сверку для собственных карт. Имя продавца не раскрывается до окончания расследования подлога."
