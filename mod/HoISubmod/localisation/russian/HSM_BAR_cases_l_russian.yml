 HSM_BAR_study_chalice:0 "Исследование: Опись с печатью"
 HSM_BAR_study_chalice_desc:0 "БР-008 / исследование сосуда. След внутри изъятой Чаши сохранился после промывки контрольным раствором. Герметичное предметное стекло с пробой потемнело, когда сосуд внесли в соседнюю комнату; второе стекло не изменилось. Опыт повторили за экраном.\n\nКшемень просит разрешить приспособить метод обнаружения для заражённых медицинских запасов. Введение проб живому испытуемому не разрешено. Северное отделение рекомендует вместо этого закрытый порядок перевозки. Приложение о причинах хранения обоих стёкол из распространённой копии изъято.\n\n$HSM_BAR_case_study_terms_tt$"
