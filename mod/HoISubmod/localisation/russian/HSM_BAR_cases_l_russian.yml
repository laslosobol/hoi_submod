 HSM_BAR_study_reactor:0 "Исследование: Реактор, а не откровение"
 HSM_BAR_study_reactor_desc:0 "БР-006 / сверка остановок. Рабочие журналы показывают рост температуры охлаждения раньше, чем защитный контур отмечает возмущение. На одной странице порядок обратный. Бумага и чернила те же; указанная смена отрицает, что делала запись.\n\nИнженеры смогут удерживать большую нагрузку, если наблюдать за контурами раздельно. Ольха рекомендует обратное: снизить нагрузку, пока каждую остановку не повторят с независимым самописцем. Спорная страница помещена к материалам нижних шахт, а не в открытый журнал станции.\n\n$HSM_BAR_case_study_terms_tt$"
