 HSM_BAR_study_marsh:0 "Исследование: Огни над болотом"
 HSM_BAR_study_marsh_desc:0 "БР-016 / закупленные пробы воды. Описанные огни удалось воспроизвести с теми же осадком, водой и температурой. После проветривания сосуда они прекратились. Курьер доставил вторую пробу с исходного берега; она повела себя так же. Рассказ паромщика сохранён, но для его объяснения не требуется путник под водой.\n\nМедицинский отдел рекомендует пересмотреть правила хранения и водоотвода. Более узкая рассылка ограничит рекомендации полевыми госпиталями. Кальк просит сначала объяснить результат свидетелям, а уже затем публиковать опровержение их истории.\n\n$HSM_BAR_case_study_terms_tt$"
