 HSM_BAR_study_rosa:0 "Исследование: Автор и превращение"
 HSM_BAR_study_rosa_desc:0 "БР-012 / проверка происхождения. На нескольких ритуальных страницах, полученных под разными именами, обнаружена одна и та же поправка. Ошибка первой копии стала указанием в третьей. Кальк предупреждает: убедительная подпись значит меньше, чем путь, которым текст попал к нам.\n\nЛаборатория завершила сравнение, не воспроизводя ритуал. Ольха просит передать метод проверки избранным исследователям. Кальк предпочитает оставить его аналитикам, отслеживающим поставщиков. Имена двух посредников изъяты; за обоими продолжается наблюдение.\n\n$HSM_BAR_case_study_terms_tt$"
