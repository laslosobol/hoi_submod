 HSM_BAR_study_echo:0 "Исследование: Шахта, ответившая дважды"
 HSM_BAR_study_echo_desc:0 "БР-015 / закрытие проверки шахты. Второй голос отставал от свистка на тот же промежуток, что и от речи. За повреждённой перегородкой изыскатели нашли вентиляционную камеру, отсутствующую на всех доступных планах. Открытие люка изменило задержку точно по расчёту.\n\nБригадир спросил, не выдумали ли рабочие голос. Кшемень ответила, что они сообщили об услышанном. Исправленные чертежи можно использовать для возвращения выработок в строй или оставить для меньшей программы вентиляции убежищ. Других необъяснимых ответов не зарегистрировано.\n\n$HSM_BAR_case_study_terms_tt$"
