 HSM_BAR_study_darkheart_desc:0 "БР-010 / запись помех. Захваченное Тёмное сердце создавало повторяющееся возмущение в приёмном контуре. Перемещение контрольного кристалла ничего не изменило. Перестановка выводов изменила картину; дежурный также сообщил о вторых шагах. Независимого подтверждения этому нет.\n\nВозмущение можно распознать до отказа приёмника. Аналитики просят сравнительный стенд для враждебных передач. Врона рекомендует оставить лишь порог тревоги. Личное свидетельство дежурного хранится отдельно от приборного журнала.\n\n$HSM_BAR_case_study_terms_tt$"
