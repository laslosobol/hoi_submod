 HSM_BAR_study_compass:0 "Исследование: Стрелка с памятью"
 HSM_BAR_study_compass_desc:0 "БР-017 / слепая проверка маршрута. Когда ящик перенесли без ведома носильщика, стрелка повернулась вслед за ним. Крепление под крышкой сохранило намагниченность. После его удаления контрольное показание восстановилось. Маршрут к подземному святилищу не подтвердился.\n\nНа первом рисунке торговца ящик есть; на поздних копиях он исчез. Врона сохранила их все. Изыскателям пригодится проверка калибровки, тогда как плановый отдел запрашивает слепую сверку для собственных карт. Имя продавца не раскрывается до окончания расследования подлога.\n\n$HSM_BAR_case_study_terms_tt$"
