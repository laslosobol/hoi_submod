 HSM_BAR_study_phylactery:0 "Исследование: Сосуд — не тело"
 HSM_BAR_study_phylactery_desc:0 "БР-009 / испытание изоляции. Изъятый сосуд дважды заключали в оболочки из разных материалов. В обоих случаях приборы отмечали возмущение у внешней границы. Внутренние показания не совпали; усреднять их запретили.\n\nОльха предлагает продолжить исследование связи между двумя границами. Приложен ответ Кальк: её отделение получило сосуд, чтобы устранить неопределённость, а не создать вторую. Под стёртой строкой исходной описи обнаружено личное имя. Разрешение прочесть эту строку хранится только у директора.\n\n$HSM_BAR_case_study_terms_tt$"
