 HSM_BAR_study_sombra:0 "Исследование: Свидетельства против вернувшегося короля"
 HSM_BAR_study_sombra_desc:0 "БР-014 / кристальные свидетельства. В проверенных донесениях описаны приказы, исполненные раньше, чем получатели смогли объяснить причину. Поздние рассказы теми же словами передают обычный страх; разделить их непросто. Отдел оставил только эпизоды со вторым источником.\n\nТеперь можно составить порядок тревоги для частей, которым угрожает такое воздействие. Другой вариант: ограничиться убежищами и восстановлением мирной жизни. Врона запретила называть любой из них невосприимчивостью. Свидетель, предоставивший последнее сравнение, просил никогда не читать отчёт вслух в его присутствии.\n\n$HSM_BAR_case_study_terms_tt$"
