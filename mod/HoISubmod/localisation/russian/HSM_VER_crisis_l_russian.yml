 hsm_ver_crisis.1.t:0 "Вести из Холлхауса"
 hsm_ver_crisis.1.eri.d:0 "Первое известие попало в канцелярию Эри вместе с накладной перевозчика. Второй Винтерфестский бал в Холлхаусе прервали выстрелы; гостей эвакуировали, больницы заполнялись ранеными. Второй гонец привёз меньше достоверных сведений и более длинный список тех, кого предстояло разыскать. Никто за нашим столом не мог сказать, кто стрелял и кому будут принадлежать улицы к приходу следующего письма.\n\nУправляющий положил рядом с донесением казначейские ведомости. Наши собственные поселения дорого заплатили за годы соперничества, и начальник пограничной стражи требовал оставить все доступные средства дома. Врач просил перевязочный материал, транспорт и разрешение выехать. Один из советников возразил, что, бросив законное правительство сейчас, мы обесценим каждое обещание мира между домами.\n\nУ каждого требования были основания. Мы можем охранять собственную территорию без новых расходов, оплатить чрезвычайную медицинскую помощь Авиану или оказать более существенную политическую поддержку лоялистам. Ни одна из лежащих перед нами бумаг не решит исход борьбы в Холлхаусе. Зато они определят поступок Эри в те дни, когда наши соседи ещё ждут известий о том, кто остался в живых."
 hsm_ver_crisis.1.eyr.d:0 "Писарь Эйри дважды прочёл донесение, прежде чем занести его в журнал. Второй Винтерфестский бал закончился стрельбой. В Холлхаусе эвакуировали гостей и несли раненых в больницы; позднейшие сообщения говорили о сборе вооружённых сторонников враждующих группировок. За столом спросили, принадлежит ли печать на последнем письме власти, которая ещё способна защитить собственных курьеров.\n\nПограничные офицеры призывали к осторожности. Красивое выражение сочувствия не исправит последствий, если оставить границу без присмотра. Врачей тревожило другое: каждый час проверки очередного письма отнимал время у раненых, которых ещё можно спасти. Сторонники законного правительства требовали ответа весомее соболезнований, опасаясь, что промедление поможет тем, кто пытается захватить власть.\n\nСтарые притязания дома приучили его советников разбирать обязательства, скрытые за любезными словами. Сегодня обязательство придётся выбрать до того, как станет известен исход. Можно удерживать собственные посты, оплатить отправку медицинской помощи в Авиан или поддержать лоялистов в предстоящей борьбе. Ни одно донесение с бала пока не говорит, что завтрашние власти запомнят о нашем решении."
 hsm_ver_crisis.1.a:0 "Направить медиков в Авиан. (25 ПВ; 120 дней)"
 hsm_ver_crisis.1.b:0 "Помочь законному правительству. (40 ПВ)"
 hsm_ver_crisis.1.c:0 "Оставить ополчение на своей границе. (Без затрат)"

 hsm_ver_crisis.2.t:0 "Госпитальные ведомости"
 hsm_ver_crisis.2.loyalist.d:0 "Госпитальные ведомости принесли в корзине для белья: в канцелярии закончились ящики. На некоторых страницах одного больного записали дважды, сначала по фамилии, потом по месту, где его нашли санитары. На других оставили одинаковые аккуратные пробелы вместо домашнего адреса. Писарь спросил, следует ли приложить воззвание о победе. Врач попросил ещё бумаги.\n\nУстоявшее правительство Авиана собирает сведения о действиях соседей во время боёв. Просьбы, отправленные в Эри и Эйри, лежат рядом с ответами, если ответы вообще приходили. Медицинская помощь и поддержка лоялистов занимают разные графы. Ни одна графа не вмещает всех, кто ждал у закрытого перехода или вернулся в дом, где теперь была одна лишняя кровать.\n\nВелик соблазн превратить всю пачку в список друзей и врагов. Вместо этого писарь готовит благодарности, достаточно точные, чтобы им поверили. Признательность может начать разговор с домом, который нам не подчинён; подписать за него договор она не может. В самом Авиане уже настал срок исполнить более трудное обещание: из спасённой власти должно получиться правительство, при котором можно жить."
 hsm_ver_crisis.2.military.d:0 "Офицер, проверявший госпитальные ведомости, задержался на странице с заголовком «Помощь от домов». Он потребовал расположить записи по политической принадлежности. Старший хирург указал на даты поступления: большинство записей сделали, когда радиостанция ещё переходила из когтей в когти. В те ночи никто не мог сверяться со списком одобренных благодетелей.\n\nВоенная администрация овладела Авианом. Вместе с властью ей достались больничные палаты, запросы о пропавших и письма в учреждения, чьи прежние служащие больше не ответят. Сведения о поведении Эри и Эйри разнятся. Там, где присылали припасы или поддержку лоялистам, квитанции сохраняют это различие. Там, где помощи не было, остаётся пустое место; оно мало говорит о страхе по другую сторону границы.\n\nПисарь составляет отдельные благодарности за медицинскую работу и закрытую записку о помощи побеждённому правительству. Администрация может помнить и то и другое, не принимая ни одну запись за подпись под признанием её верховенства. За пределами её действительных владений граница по-прежнему разделяет правительства. Госпитальные счета закроют печатью победителей. Дипломатические счета ещё только открывают."
 hsm_ver_crisis.2.technocrat.d:0 "Железнодорожник, выздоравливавший в больнице, попросил пришедшего чиновника найти его брата. Чиновник явился подсчитать свободные койки и лекарства. И всё же записал имя на полях. К концу обхода имён на полях оказалось больше, чем строк в печатном бланке.\n\nРеволюция овладела Холлхаусом, и новые власти собирают документы страны, работу которой теперь предстоит наладить. Госпитальные ведомости отмечают помощь, полученную во время кризиса, в том числе присланную Эри или Эйри. Поддержку лоялистов записывают отдельно. Для политического комитета это свидетельство выбора против революции; для хирурга ещё одно напоминание, что раненые не поступали в аккуратно разделённых политических группах.\n\nПрежних правителей уже нельзя вызвать для объяснения оставленных ими бумаг. Но и новое правительство не может считать, будто его победа упразднила всех независимых соседей. Чиновникам приходится различать включённых в страну подданных и иностранные администрации, по-прежнему способные отвечать за себя. Просьба железнодорожника отправляется с исходящей почтой рядом с первыми официальными письмами. И тем и другим нужен адрес, существующий за пределами комитетской картотеки."
 hsm_ver_crisis.2.a:0 "Записать сделанное и отправить благодарности."

 hsm_ver_crisis.3.t:0 "Соглашение на столе"
 hsm_ver_crisis.3.military.d:0 "Делегация государства [From.GetName] привезла документ, который дежурный офицер успел прочесть ещё до того, как впустил посетителей. В нём говорилось о гражданском проезде, дорожных работах, поставках и обязательстве о ненападении. В строках для подписей значились два правительства. Эта подробность вызвала более долгий спор, чем все предложенные расписания вместе взятые.\n\nДля военной администрации принять такие условия означает вести дела с домом, который не признал нашего верховенства. Часть офицеров считает это недопустимой оговоркой к одержанной победе. Другие всё утро объясняли, почему мастерским не хватает материалов и почему очередной объезд задержал госпитальный груз. Им понятна польза границы, повседневная работа которой не требует нового столкновения.\n\nПосланник не предлагает присяги и не просит места в нашем командовании. Мы можем принять ограниченную договорённость или вернуть её без подписи. Люди, включённые в Авиан как его подданные, остаются под властью Авиана; эта делегация говорит от имени страны за его пределами. Соглашение свяжет наше поведение на границе обязательствами, но не принесёт подчинения, которого первоначально добивался генеральный штаб."
 hsm_ver_crisis.3.technocrat.d:0 "Секретарю комитета не понравилась печать на предложении государства [From.GetName], зато понравилась первая страница. Там перечислялись задержки гражданских грузов, необходимый ремонт дорог и трудности с возвращением больных домой. Вторая страница ясно давала понять: отправитель намерен и впредь отвечать за свою сторону границы.\n\nОдин член комитета возразил, что договор с администрацией дома придаст законность учреждениям, отвергнутым революцией. Представитель транспорта заметил, что сломанной оси безразлично происхождение чиновника, распорядившегося её заменить. Новому правительству предстоит решить, может ли практическое сотрудничество служить населению, не превращая вчерашних противников в политических союзников внутри страны.\n\nПредложение предусматривает взаимное обязательство о ненападении и ограниченное гражданское взаимодействие. Территория и власть никуда не переходят. Можно подписать его, признав, что независимый сосед продолжит отвечать нам от собственного имени, или отказать и нести издержки неустроенной границы. Секретарь оставляет спорную печать на виду. Никто за столом не должен ошибиться в том, что именно ему предлагают признать."
 hsm_ver_crisis.3.loyalist.d:0 "Конверт от государства [From.GetName] положили к письмам, полученным во время чрезвычайного положения. Занимавшийся им чиновник помнил, с какой надеждой вскрывали прежние конверты и как часто их содержимое кого-нибудь разочаровывало. В этом лежали проект гражданского соглашения и лист с подписями перевозчиков, которым был нужен надёжный переход.\n\nУ правительства, пережившего бои, есть причины приветствовать полезного соседа. Есть у него и причины осторожнее говорить о воссоединении. Помощь во время кризиса не решила всех вопросов суверенитета, а собственные гражданские преобразования нельзя ставить в зависимость от очередной торжественной сделки между домами.\n\nПроект предлагает умеренные обязательства: ненападение, порядок гражданского проезда и сотрудничество в дорожных работах и производстве, которые его обеспечивают. Каждая сторона сохранит собственные учреждения. Писарь подготовил согласие и отказ, оставив под обоими место для объяснения причин. Подпись могла бы дать нашим заверениям повседневное, зримое воплощение. Отказ сохранит свободу действий, но перевозчикам за дверью канцелярии всё равно потребуется ответ о завтрашней поездке."
 hsm_ver_crisis.3.neutral.d:0 "Леди Катрина прочла предложение государства [From.GetName] после утренней внутренней переписки. Знакомая печать привлекла её внимание; отсутствие призывов к общей армии позволило его удержать. Делегация поняла хотя бы часть её решения. Проект касался гражданских поездок, поставок и содержания соединяющих страны дорог.\n\nСекретарь спросил, не поощрит ли сам приём предложения новую попытку втянуть Авиан в распри домов. Катрина указала на статью, сохранявшую власть за каждым правительством. Между ответственностью за соседские честолюбивые замыслы и порядком, позволяющим повозке пересечь границу без трёх дней неизвестности, была разница. Ей предстояло выдержать первое разногласие, а не только церемонию подписания.\n\nМы можем принять гражданское соглашение с обязательством о ненападении или предпочесть более полную отстранённость. Ни один из путей не предполагает военного союза. Посланник ждёт с незапечатанным обратным конвертом, готовый к любому ответу. Авиан выбрал нейтралитет, чтобы у его жителей было будущее за пределами распри; теперь нужно решить, найдётся ли в этом будущем место тщательно оговорённому переходу."
 hsm_ver_crisis.3.foundation.d:0 "Письмо от государства [From.GetName] прошло через большее число кабинетов, чем предполагал его автор. Гражданский секретарь приложил перечень задержанных грузов. Представитель службы безопасности вернул бумаги, подчеркнув несколько предложенных часов проезда и не объяснив, почему остальные часы должны оставаться свободными.\n\nСосед добивается гражданского соглашения: ненападения, предсказуемых поездок и сотрудничества на соединяющих нас дорогах. Он просит назвать чиновника, который ответит за задержку обычной поставки. Доступа к закрытой работе Фонда он не запрашивал и не получал. Трудность в другом: сколько определённости наша гражданская администрация вправе обещать, когда требования безопасности остаются за пределами знаний посетителей?\n\nИсправленный проект отделяет гражданское движение от закрытой деятельности и назначает ответственных за уведомления о задержках. Мы можем одобрить его, не открывая архивов Фонда, или отказать, не принимая обязательств, которые нашим учреждениям будет трудно согласовать. Секретарь вычеркнул обещание полного отсутствия перебоев. Обязательство объяснять разрешённый маршрут выглядит скромнее, но пограничный чиновник хотя бы способен его исполнить."
 hsm_ver_crisis.3.a:0 "Принять соглашение и пакт о ненападении."
 hsm_ver_crisis.3.b:0 "Вернуть предложение без подписи."

 hsm_ver_crisis.4.t:0 "Неподписанный экземпляр"
 hsm_ver_crisis.4.d:0 "Канцелярия закрыла дело, так и не получив подписи Авиана. Возвращённый проект и молчание, затянувшееся дольше установленного срока, имеют для ожидающих перевозчиков одинаковое последствие: согласованного расписания на переходе не появится.\n\nРабота делегации уже потребовала денег, влияния и времени. Писарь сохраняет экземпляр с пометками для возможной новой попытки, но не заносит его в число договоров. Пограничной канцелярии придётся по-прежнему отвечать каждому перевозчику отдельно. Следующей делегации понадобятся условия, отвечающие на возражения, с которыми не справилась эта."
 hsm_ver_crisis.4.a:0 "Сохранить проект. Закрыть этот раунд переговоров."

 hsm_ver_crisis.5.t:0 "Ответ от тех, кто выстоял"
 hsm_ver_crisis.5.support.d:0 "В письме наш дом благодарят за помощь, оказанную до того, как кто-либо мог знать, какое правительство переживёт борьбу. Автор зачеркнул слова «в час победы» и написал «когда победа ещё была под вопросом». При переписывании страницы исправление оставили видимым. Кто-то в Холлхаусе хотел, чтобы мы его заметили.\n\nЛоялисты победили, но в их письме говорится о нехватке служащих и семьях, всё ещё ищущих пропавших. Наша поддержка помогла их делу; она не купила права распоряжаться правительством, которое им теперь предстоит выстроить. Один советник называет благодарность недостаточной. Другой спрашивает, сколько услуг можно потребовать, прежде чем признательность превратится в обвинение.\n\nУстоявшие власти предлагают отношения, в которых кризис будут помнить честно. Мы можем принять благодарность, не добавляя новых обязательств. Если наш дом независим, можно также представить Авиану гражданское пограничное соглашение и дождаться отдельного ответа. Существующие отношения подчинения сохраняются. Письмо заканчивается просьбой проверить имена в списке пропавших. Какой бы курс мы ни избрали, писарь уже начал проверку."
 hsm_ver_crisis.5.medics.d:0 "К письму из Холлхауса прилагалась небольшая посылка: очищенные инструменты, пачка квитанций и список выписанных больных. На одной квитанции вместо подписи стоял отпечаток пальца. Читавший её врач узнал имя и отложил страницу для семьи, которая давно просила известий.\n\nПравительство лоялистов благодарит наш дом за медицинскую помощь во время чрезвычайного положения. Оно не пытается представить работу хирурга присягой политической группировке. Это различие важно и тем, кто трудился в палатах, и тем, кто дома одобрил расходы, не желая делать ставку на победителя.\n\nЧрезвычайное положение пройдёт, а поездки между домами и больницами продолжатся. Мы можем принять благодарность и вернуться к обычной переписке. Независимый дом вправе предложить гражданское соглашение, чтобы сделать такие переходы надёжными, если Авиан согласится. Дом, уже подчинённый Авиану, остаётся в прежнем положении. Пока советники обсуждают ответ, врач просит разрешения доставить список выписанных до закрытия канцелярии. Для нескольких семей самый важный ответ уже пришёл."
 hsm_ver_crisis.5.border.d:0 "Из Холлхауса пришло официальное письмо нашему правительству, без особых выражений признательности. Лоялисты выстояли; наш дом сосредоточился на собственной территории. Формулировки достаточно корректны, чтобы никто не мог возразить, и достаточно холодны, чтобы все поняли недосказанное.\n\nНачальник пограничной стражи кладёт рядом патрульные донесения. Для осторожности были причины, когда никто не знал, кому принадлежат дороги. Гражданский чиновник добавляет оставшиеся без ответа просьбы семей, чьи родственники находились в Авиане. У осторожности были и издержки. Ни одна пачка не отменяет другую.\n\nВластям Холлхауса предстоит жить рядом с соседями, чей выбор не помог их победе. Нам предстоит решить, останется ли охрана собственной границы нашим единственным ответом. Можно признать новые обстоятельства и оставить отношения как есть. Если мы независимы, можно потратить необходимое влияние на предложение гражданского соглашения, которое потребует согласия Авиана. Прошлое не исправить любезным письмом. Но о переходе, который будет работать завтра, ещё можно договориться."
 hsm_ver_crisis.5.a:0 "Ответить на письмо, сохранив прежние обязательства."
 hsm_ver_crisis.5.b:0 "Предложить гражданское соглашение. (35 ПВ)"

 hsm_ver_crisis.6.t:0 "Требование возвращается"
 hsm_ver_crisis.6.d:0 "Ответ государства [From.GetName] краток. Его правительство отвергает наше притязание на верховенство и распорядилось, чтобы пограничные посты продолжали исполнять приказы собственных властей. Курьер просит расписку, чтобы отказ остался в документах обеих сторон.\n\nОфицер тянется к карте; писарь ждёт распоряжения о расписке. Сам отказ не начал войну. Победа Авиана определяет произошедшее внутри Авиана и судьбу его действительных подданных. Сохранившийся независимый дом представляет иную задачу, которую нельзя решить, подшив его ответ к внутренним приказам."
 hsm_ver_crisis.6.a:0 "Подтвердить получение отказа."

 hsm_ver_crisis.7.t:0 "Катрина проводит черту"
 hsm_ver_crisis.7.eri.d:0 "В письме леди Катрины не оказалось приглашения. Авиан намеревался идти своим путём, не ставя будущее в зависимость от очередного примирения соперничающих домов. Тон был учтивым, но управляющий не нашёл в нём места для привычной надежды: ещё одна встреча, и все снова соберутся за общим столом.\n\nВ Эри первыми прозвучали практические возражения. Купцы уже наметили поездки через Авиан; семьи поддерживали связи по ту сторону границы; ремонт одного участка дороги мало значил, если следующий оставался непроезжим. Советник предложил напомнить Катрине об обязанностях перед родственниками. Управляющий спросил, какой абзац такого напоминания объяснит перевозчику, открыт ли мост.\n\nМы можем уважить решение Авиана и устраивать собственные дела с учётом его отстранённости. Можно предложить и более узкие обязательства, ограниченные гражданским проездом и ненападением. Это потребует влияния и новой подписи Авиана. Ответственности за честолюбивые замыслы Эри Катрина на себя не возьмёт. Недописанный ответ лежит рядом со счетами: предстоит решить, сколько обычного добрососедства может сохраниться после отказа от больших ожиданий."
 hsm_ver_crisis.7.eyr.d:0 "В Эйри регистратор определил письму Катрины место среди дипломатических актов, а не семейной переписки. Решение Авиана о подлинном нейтралитете было государственной политикой. Какое бы родство ни связывало дома, отныне его нельзя считать постоянным приглашением втягивать Авиан в их споры.\n\nНекоторые советники услышали в письме упрёк притязаниям Эйри. Другие увидели возможность оставить эти притязания в покое, избежав очередного навязываемого компромисса. Пограничного офицера занимал вопрос скромнее: когда к рубежу подъедет гражданская повозка, какие условия он ещё вправе обещать пассажирам? Прежние любезности никогда не предусматривали столь намеренного отдаления.\n\nМы можем принять эту дистанцию и соответственно распорядиться на своей стороне. Или предложить ограниченный гражданский проезд и ненападение, сохранив ответственность каждого правительства за собственную территорию. Потребуется согласие Катрины: само предложение не даёт права пересекать её границу. Регистратор оставляет рядом с письмом место для нового документа. История Эйри даёт ему причины беречь свою юрисдикцию и, возможно, понять соседа, который поступает так же."
 hsm_ver_crisis.7.a:0 "Уважить решение Авиана держаться в стороне."
 hsm_ver_crisis.7.b:0 "Договориться о гражданском проезде. (35 ПВ)"

 hsm_ver_crisis.8.t:0 "Новые объявления на переходе"
 hsm_ver_crisis.8.d:0 "Перевозчик вернулся с новой печатью на накладных и предписанием пользоваться другим переходом. Он мог описать шлагбаум, дополнительных часовых и гражданского чиновника, извинившегося за задержку. Объяснить, почему дорогу закрыли, он не мог. Чиновник отказался это обсуждать.\n\nАвиан допустил к себе Фонд. Помимо самого этого факта, у нашего правительства мало надёжных сведений. В купеческих прошениях говорится о нарушенных маршрутах и непривычных требованиях охраны. Более причудливым слухам, которыми обмениваются в приёмной, нет места в докладе для совета.\n\nОдин советник требует ограничить подобное сообщение, пока Авиан не даст более полного объяснения. Другой предлагает задать вопрос, на который его гражданская администрация способна ответить: где могут ездить обычные жители и кто отвечает, если опубликованный порядок не соблюдается? Ограниченное соглашение могло бы решить эти задачи, не открывая нам доступ к делам Фонда и не отдавая ему власть над нашей границей.\n\nМы можем принять изменившиеся условия к сведению и сохранить осторожность. Можно оплатить делегацию, которая добьётся ясных правил. Перевозчик просит лишь, чтобы следующее предписание дошло до него прежде, чем он загрузит повозку."
 hsm_ver_crisis.8.a:0 "Принять к сведению. Сохранить свои меры предосторожности."
 hsm_ver_crisis.8.b:0 "Согласовать ясный порядок гражданского проезда. (35 ПВ)"

 hsm_ver_crisis.9.t:0 "Бумаги о выборах"
 hsm_ver_crisis.9.eri.d:0 "Из Авиана прислали результаты выборов и газету, сложенную на странице местных споров о расходах. Федералисты одержали убедительную победу. Под объявлением читатель жаловался на состояние дороги с такой свободой выражений, которая некогда показалась бы более примечательной, чем сами выбоины.\n\nВ канцелярии Эри управляющий прочёл жалобу раньше торжественного обращения. За победой лоялистов последовало демократическое переустройство: гражданское участие расширилось, власть знати сократилась. Знакомые фамилии остались в общественной жизни, но уже не объясняли сами по себе, кто вправе отвечать за правительство.\n\nЧасть советников видит в этом долгожданную опору законности после насилия. Других тревожат вопросы, которые подобные газеты вызовут дома. Мы можем поздравить избранные власти или признать результат с большей сдержанностью. Ни один ответ не изменит нашего правительства и не отменит существующего подчинения. Изменится тон следующего письма. Управляющий кладёт дорожную жалобу рядом с нашими счетами. Кто бы теперь ни говорил от имени Авиана, ему всё равно предстоит объяснить, откуда взять средства на работу."
 hsm_ver_crisis.9.eyr.d:0 "Регистратор Эйри начал ответ привычной формулой, затем остановился на строке с названием правительства Авиана. Выборы принесли решительную победу федералистам. Теперь документ следовало адресовать властям, чьи полномочия происходили от голосов избирателей; старый образец не подсказывал, насколько тепло их приветствовать.\n\nО степени теплоты совет спорил долго. Одни считали выборы исполнением обещания лоялистов сделать спасение страны чем-то большим, чем сохранение двора. Другие опасались, что сокращение дворянской власти в Авиане заставит усомниться в каждой привычной привилегии Эйри. Правовед заметил, что признание соседнего правительства не требует заимствования его конституции.\n\nДемократический исход в Авиане уже стал фактом. Можно открыто приветствовать его или направить корректное, сдержанное признание. Наши учреждения и существующие отношения подчинения останутся прежними. Регистратор наконец вписывает полное официальное название избранного правительства. Какой бы оценкой его ни сопроводили, дальнейшая переписка должна доходить до тех, кто уполномочен отвечать. Архив, признающий только удобные ему власти, вскоре перестаёт описывать соседнюю страну."
 hsm_ver_crisis.9.a:0 "Поздравить избранное правительство Авиана."
 hsm_ver_crisis.9.b:0 "Признать результат с дипломатической сдержанностью."

 hsm_ver_crisis.10.t:0 "Две подписи"
 hsm_ver_crisis.10.d:0 "Подписанный экземпляр доставлен. На переходе чиновник вывешивает согласованные гражданские правила рядом с объявлениями, уже выцветшими от непогоды. Перевозчик дочитывает страницу до конца и спрашивает, действует ли она сегодня. На этот раз чиновник может ответить утвердительно.\n\nАвиан принял наше соглашение и взаимное обязательство о ненападении. Дорожные бригады могут согласовать работы у границы, а мастерские назначить поставки по расписанию, признаваемому обоими правительствами. На каждом переходе по-прежнему две власти, теперь способные отвечать друг другу. Эти подписи не дали прежнему конгрессу новых полномочий. Достижение скромнее, и первые путники смогут оценить его сами."
 hsm_ver_crisis.10.a:0 "Ввести подписанные договорённости в действие."

 hsm_ver_crisis.11.t:0 "Прежней подписи недостаточно"
 hsm_ver_crisis.11.d:0 "На переходе сняли объявление о соглашении. Новые указания из столицы больше не признают основания, на которых оно было подписано. Перевозчики спрашивают, какие из завтрашних грузов ещё пропустят, а чиновник может предложить лишь порядок, за который готово отвечать его собственное правительство.\n\nВыполненный ремонт остался, как и поездки, о которых помнят семьи. Писарь убирает оба подписанных экземпляра в архив и заводит новое дело для вопросов без ответа. Дальнейшему сотрудничеству вновь понадобятся правительства, готовые взять его на себя."
 hsm_ver_crisis.11.a:0 "Закрыть соглашение и сохранить документы."

 hsm_ver_crisis.12.t:0 "Ответ пойдёт через Холлхаус"
 hsm_ver_crisis.12.d:0 "Первые указания пришли раньше, чем в канцелярии нашли место для нового лотка с перепиской. Обычный ответ по внешним отношениям вернули для согласования через Авиан. Писарь сразу понял перемену; нескольким советникам понадобилось увидеть возвращённую бумагу, прежде чем признать значение собственной подписи.\n\nНаш дом явно согласился на сюзеренитет Авиана. Его ведомства по-прежнему принимают прошения и отдают местные распоряжения, но письма, прежде уходившие от нашего имени, теперь проходят через руки другого правительства. Это не гражданское соглашение между независимыми правительствами. Совет выбрал подчинение, отказавшись от свободы отвечать на каждый внешний вопрос от собственного имени."
 hsm_ver_crisis.12.a:0 "Записать принятые нами обязательства."

 hsm_ver_crisis.15.t:0 "Чем стал этот переход"
 hsm_ver_crisis.15.military.d:0 "Возвращавшийся больной не мог спуститься с повозки без помощи. На авианском посту часовой задержал путников дольше согласованного времени. Теперь, на нашей стороне, сестра больного придерживала стул, пока возница жаловался на задержку и повреждённое колесо. Она слушала, пока брат не сел, а потом попросила жаловаться потише.\n\nПоездка продолжилась потому, что наш пограничный офицер сослался на соглашение, а авианский начальник распорядился пропустить повозку. В отчёт о первых результатах вошла эта переписка с приложенным счётом за ремонт. Она выглядит менее обнадёживающей, чем сцена у семейного дома: военная администрация по-прежнему отдаёт приказы так, будто любое возражение нарушает дисциплину. Наши представители по-прежнему настаивают на праве отвечать за собственную территорию.\n\nДорожные работы и гражданские поставки стали достаточно предсказуемыми, чтобы их планировать, хотя каждую помеху приходится оспаривать и записывать. Соглашение принесло ощутимую пользу в отношениях с соседом, чьи притязания остаются тревожными. Дома больной просит передвинуть стул поближе к огню. Сестра сберегла для него тёплый ужин. Им не нужно называть границу дружественной, чтобы понимать, как важно было её пересечь."
 hsm_ver_crisis.15.technocrat.d:0 "Авианский механик привёз недостающую муфту и накладную, из которой убрали все почётные обращения к дому. Наш мастер установил муфту и только потом послал за тем, кто имел право спорить о бланке. К середине дня станок работал, а два представителя всё ещё выясняли, как следует обращаться друг к другу.\n\nВ этой сцене уместился первый отчёт о соглашении. Технократическая администрация ценит доставленные материалы и предотвращённые простои. Наши чиновники считают также случаи, когда удалось отстоять свою юрисдикцию перед соседом, которому само её существование кажется досадным. Рабочие расписания переживают споры, потому что работа нужна обеим сторонам.\n\nПеред отъездом механик спрашивает о рабочем, пострадавшем во время кризиса. Найденный инструмент ехал в его сумке отдельно от запасных частей. Мастер обещает передать его и выдаёт расписку с полным официальным названием дома. Оба предпочитают не замечать выражения лица собеседника. Революция глубоко изменила Авиан; наш дом остался независимым учреждением, которому приходится иметь дело с новым правительством. Здесь, в мастерской, сотрудничество обрело звук вновь запущенного станка. Ни гостю, ни хозяину для этого не пришлось притворяться, будто политический спор закончен."
 hsm_ver_crisis.15.elections.d:0 "Приглашение пришло от избранного местного представителя в Авиане: нашего пограничного чиновника просили объяснить задержку ремонта на открытом собрании. Тот сначала подготовил частный ответ министерству. В ответ ему напомнили, что вопрос был задан публично и заслуживает такого же ответа.\n\nНаше приветствие авианских выборов приобрело практический смысл. Теперь расписания и расходы по соглашению обсуждают люди, способные оспаривать решения ответственных властей. Жалоба поставщика доходит до совета без посредничества знатного покровителя; обещание чиновника могут прочесть ему вслух на следующем собрании.\n\nСотрудничество стало менее церемонным, а порой и менее удобным. Зато некоторые устранимые провалы теперь труднее скрыть. Отчёт отмечает работающие переходы, продолжающийся ремонт и правительство Авиана, чей демократический мандат остаётся его собственным. Наши учреждения не преобразились оттого, что мы его поздравили. Но мы научились адресовать вопросы ведомству, которое должно отвечать не только перед одной семьёй. К публичному ответу приложена смета, включая статью, которую наш чиновник надеялся оставить без обсуждения."
 hsm_ver_crisis.15.loyalist.d:0 "В отчёт вошли два письма из одного авианского ведомства. Первое благодарит наших представителей за решение трудностей с гражданскими поставками. Второе оспаривает стоимость предложенного ремонта дороги. Привычная теплота вступительных строк не помогла защитить цифры.\n\nУ правительства, пережившего кризис, снова появились обычные обязанности. Наш дом занимается ими в рамках соглашения, сохраняя собственную власть и принимая обязательства, исполнения которых с него вправе потребовать. Гражданское переустройство Авиана идёт на его собственных условиях; договорённость не возвращает привилегий, отменённых реформами, и не даёт нам решать его политическое будущее.\n\nНа переходе больничный служитель провожает выписанного пациента до ожидающей семьи. Проверяющий бумаги чиновник узнаёт имя из чрезвычайных списков и молча исправляет адрес в журнале. Отчёт рекомендует сохранить действующий порядок. В нём нет всеобъемлющего вывода о будущем домов. Хватает работы по уже подписанным обязательствам, а в возможности спорить об их цене, не задаваясь прежде вопросом, кто переживёт этот спор, есть своя доля примирения."
 hsm_ver_crisis.15.neutral.d:0 "Две дорожные бригады встретились у границы с разными указаниями об осушении одной затопленной канавы. Бригадиры вместе прошли вдоль неё, поспорили об уклоне и решили, куда пойдёт вода. До обеда каждый вернулся к своим рабочим. Общего знамени над отремонтированным участком не подняли.\n\nАвиан сохранил дистанцию. В последнем ответе Катрина отклоняет приглашение к более широким политическим обсуждениям и одновременно подтверждает гражданские договорённости на следующий месяц. Соглашение не сделало её ответственной за честолюбие нашего дома. Оно дало людям по обе стороны надёжный способ решать трудности, которые иначе упирались бы в границу и лишь усугублялись.\n\nОтчёт отмечает намеченные поставки и законченные работы, в том числе канаву. Одна семья благодарит за возвращение родственника из больницы по вновь пригодной дороге. Когда начался дождь, они боялись очередной отсрочки. Наш дом сохранил полезного соседа, не получив союзника в больших замыслах; Авиан сохранил свободу заниматься собственными делами. Завтра бригады опять будут работать на разных участках. Вода уже течёт через оба."
 hsm_ver_crisis.15.foundation.d:0 "Авианское уведомление изменило часы гражданского перехода, и на этот раз оно пришло прежде, чем перевозчики загрузили повозки. Наша пограничная служба разослала новое расписание. Купец пожаловался на неудобство, а затем признал, что заблаговременная весть спасла его от напрасной поездки.\n\nСоглашение не объяснило Фонд. Донесения по-прежнему описывают охраняемые маршруты, закрытые зоны и чиновников, отказывающихся обсуждать то, что выходит за пределы их полномочий. Наши представители узнали, какое гражданское ведомство вправе разрешить объезд и какие вопросы остаются без ответа. Знание ограниченное, но его хватает, чтобы часть неизвестности не оборачивалась лишениями.\n\nОтчёт рекомендует тщательно записывать перебои и сохранять собственную власть на границе. В нём есть и письмо семьи, чей родственник вернулся после лечения в Авиане, вовремя получив все необходимые проездные бумаги. О том, что находится за закрытыми воротами, в письме нет ни слова. Наше правительство знает об этом не больше, чем при подписании. Проверить оно может меньшее: разрешённой дорогой можно пользоваться, с ответственным чиновником можно связаться, и это конкретное обещание соседи исполнили."
 hsm_ver_crisis.15.a:0 "Хранить отчёт вместе с соглашением."

 hsm_ver_crisis.16.t:0 "Граница остаётся нашей"
 hsm_ver_crisis.16.eri.d:0 "Управляющий Эри приносит совету расходы на границу за три месяца. Посты содержали, оборонительные работы проверяли, гражданские обращения разбирали по одному: соглашения, которое заранее уладило бы их порядок, нет. Дом отверг верховенство Авиана, и цена убедительности этого отказа стала обычной строкой в счетах.\n\nНеизвестность не исчезла чудесным образом. Перевозчики по-прежнему спрашивают, какие бумаги признают; семьи приносят письма, которые не могут доставить сами. Пограничные офицеры учатся отличать задержанную повозку от провокации, а служащие наших учреждений узнают, сколько терпения требуют такие различия.\n\nОтчёт фиксирует главный результат без победной речи. Наше правительство продолжает отдавать собственные распоряжения. Победа Авиана не превратилась в право делать это за нас. Новые переговоры возможны, когда позволят обстоятельства, но гражданского соглашения пока никто не подписал. Управляющий кладёт новые расходы рядом с прежней ценой соперничества. Независимость выдержала предъявленное требование; задача сделать жизнь при ней сносной останется и после того, как это дело будет закрыто."
 hsm_ver_crisis.16.eyr.d:0 "Молодой стражник выучил ответ Эйри наизусть. От него оказалось мало пользы, когда путница спросила, почему письмо от родных шло так долго. Сержант услышал разговор, проверил её бумаги и объяснил, каким переходом она может попытаться воспользоваться. Обещать, как её встретят на авианской стороне, он не стал.\n\nТри месяца наши пограничные посты продолжают подчиняться собственным властям. Гражданского соглашения, которое установило бы общие процедуры, нет; подчинения, которое дало бы Холлхаусу право отдавать нам приказы, тоже нет. Представители Эйри сохранили его юрисдикцию. Теперь им приходится отвечать за повседневные трудности её осуществления рядом с правительством, потребовавшим от неё отказаться.\n\nНовости путницы были хорошими, а жалоба оставалась справедливой. После её ухода сержант велел стражнику учить действующие правила перехода так же внимательно, как декларацию. Отчёт отмечает независимый дом, чьи учреждения устояли вместе со всеми издержками и обязанностями этого решения. Дальнейшие переговоры на приемлемых условиях возможны. Пока же границу должны держать люди, понимающие и то, кому они служат, и то, в чём нуждаются ожидающие у неё."
 hsm_ver_crisis.16.a:0 "Сохранять свою власть и отвечать за её цену."

 HSM_VER_CR_demand_military_desc:0 "Офицер, представляющий требование Авиана, ждёт, пока наш писарь проверит его полномочия. Документ называет победу в Холлхаусе началом нового регионального порядка и призывает наш дом признать верховенство Авиана. Писарь спрашивает, требуется ли наша подпись. Офицер отвечает, что администрация рассчитывает на благоприятный ответ.\n\nВ самом Авиане военные захватили власть и включили в страну дома, действительно находившиеся в его подчинении. Наша страна остаётся независимой. Воззвание из Холлхауса не может заменить наше решение здесь, а чиновники, принимающие посланника, представляют учреждение, которое по-прежнему управляет собственной территорией.\n\nПограничный капитан требует отвергнуть притязание и усилить посты. Гражданские посланники предлагают договориться о переходах и поставках между правительствами, ещё отвечающими за себя. Сторонники подчинения просят совет доверить свою независимость победителям в Холлхаусе. Офицер кладёт на стол чистый экземпляр. Возможных ответов несколько, но только один передаёт его правительству власть, за которой он прибыл."
 HSM_VER_CR_demand_technocrat_desc:0 "Представитель Авиана кладёт машинописную декларацию на парадную скатерть нашего совета. Новые власти называют наследственное правление препятствием для будущего региона. Они требуют, чтобы наш дом признал верховенство Авиана и включил свою администрацию в порядок, созданный революцией.\n\nДекларация уверенно рассуждает об истории. Её предъявитель менее уверен, когда его спрашивают, какой правовой акт уже дал Холлхаусу власть по нашу сторону границы. Революция овладела Авианом и присоединила его действительных подданных. Наша страна остаётся независимой, как бы победители ни судили о правящем ею учреждении. Его представители собрались принять решение, а не удостоверить, что за них уже решили где-то ещё.\n\nОфицеры предлагают удерживать границу под нашей властью. Гражданские посланники спрашивают, согласится ли революционное правительство на обычные условия торговли и проезда. Другие считают, что совету следует подчиниться и позволить Холлхаусу определить место дома в новом порядке. Пока читают варианты ответа, секретарь совета оставляет место для подписи пустым. Практические отношения с революционным соседом не обязательно начинать с отказа от права ему отвечать."
 HSM_VER_CR_military_victory_desc:0 "Приказы военных зачитывают в учреждениях, до которых теперь можно добраться из Холлхауса. Переворот генерал-лейтенанта Трубаха одержал победу. Разбитые организаторы коммунистов и командиры лоялистов предстают перед трибуналами победителей, а военное положение даёт новой администрации средства проводить решения по всему Авиану.\n\nКарта на штабном столе менее сговорчива, чем воззвание. Дома, действительно подчинявшиеся Авиану, включены в новый порядок. Сохранившиеся страны за пределами этих отношений по-прежнему имеют собственные власти, пограничные посты и возможность ответить авианскому курьеру отказом. Победа внутри страны не принесла подписей независимых правительств.\n\nШтаб готовит два комплекта переписки: распоряжения территориям, которые теперь находятся под его властью, и требования для отправки за рубеж. Один офицер предлагает одинаковые формулировки для обоих. Секретарь снова разделяет пачки. Администрация вправе заявлять притязания на будущее всей Верении, но ей придётся столкнуться с разницей между захваченной властью и признанием, которого ещё предстоит добиться."
 HSM_VER_CR_technocrat_victory_desc:0 "Над Холлхаусом развевается красный флаг. Победа коммунистов разрушила прежний центр власти: побеждённое руководство и знать, оказавшаяся в гуще борьбы, встретили суд революции, а комитеты занимают учреждения, из которых теперь будут управлять Авианом. Восстановление начинается среди документов, ещё хранящих следы боёв.\n\nПобедившие власти присоединяют дома, действительно находившиеся в подчинении Авиана. Этот акт не охватывает все уцелевшие страны региона. Независимые правительства сохраняют территорию и собственных представителей; зарубежных правителей нельзя записать в число пленников Холлхауса лишь потому, что воззвание объявляет их учреждения устаревшими.\n\nТранспортный чиновник спрашивает, какую печать ставить на первые письма за пределы авианской власти. Комитет утверждает новый штамп и добавляет требования признать его верховенство. На них потребуются отдельные ответы. Пока революции принадлежат Авиан и обязанности по управлению им. Граница отмечает место, где её распоряжения становятся перепиской, а получатели всё ещё могут сказать «нет»."
