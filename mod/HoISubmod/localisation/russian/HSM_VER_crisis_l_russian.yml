l_russian:
 HSM_VER_CR_emergency_hospitals:0 "Чрезвычайные госпитальные отделения"
 HSM_VER_CR_emergency_hospitals_desc:0 "Койки поставили даже в комнатах, никогда не предназначавшихся для больных. Медицинские припасы и помощь из-за границы дают изнурённым хирургам Авиана возможность лечить раненых и возвращать выздоравливающих в строй. Чрезвычайная помощь рассчитана на 120 дней."
 HSM_VER_CR_border_watch:0 "Дом защищает свою границу"
 HSM_VER_CR_border_watch_desc:0 "Ответ на требование Авиана дошёл до пограничных постов. Офицеры готовят оборонительные позиции и проверяют, можно ли по-прежнему выполнять местные приказы без разрешения из Холлхауса. В течение 180 дней повышенная готовность усиливает защиту войск и ускоряет окапывание."
 HSM_VER_CR_civilian_transit:0 "Гражданское пограничное соглашение"
 HSM_VER_CR_civilian_transit_desc:0 "Дорожные бригады, мастерские и гражданские перевозчики работают по расписаниям, признанным по обе стороны границы. Каждое правительство сохраняет свою власть. Пока подписанное соглашение действует, сотрудничество даёт §G+10%§! к скорости строительства инфраструктуры и §G+5%§! к объёму заводского производства. Капитуляция приостанавливает эти преимущества; война между сторонами, подчинение, исчезновение страны или смена политического курса Авиана требуют нового соглашения."
 HSM_VER_CR_border_correspondence:0 "Переписка через границу Авиана"
 HSM_VER_CR_border_correspondence_desc:0 "Курьеры по-прежнему знают дорогу в Холлхаус, даже когда на дверях его учреждений меняются имена. Мы можем предложить властям ограниченные гражданские договорённости: надёжный порядок проезда, ремонт соединяющих нас дорог и обязательство о ненападении. Каждому дому предстоит заключить собственное соглашение."
 HSM_VER_CR_reopen_talks:0 "Предложить гражданское пограничное соглашение"
 HSM_VER_CR_reopen_talks_desc:0 "Наши писари сохранили спорные проекты и прошения перевозчиков. Следующая делегация отвезёт в Холлхаус и те и другие. Исправная переправа и надёжное расписание поставок могут убедить Авиан вновь выслушать нас, даже если более крупные споры остаются открытыми. Его правительству всё равно предстоит подписаться под собственными обязательствами."
 HSM_VER_CR_integration_correspondence:0 "Незавершённый союз"
 HSM_VER_CR_integration_correspondence_desc:0 "Место рядом с Авианом в военном союзе ещё не решает вопрос о политической власти. Независимые партнёры вправе рассмотреть предложение об интеграции и отказаться от подписи. Переписку можно возобновить, не выдавая прежние колебания за согласие."
 HSM_VER_CR_reconsider_integration:0 "Возобновить предложение об интеграции"
 HSM_VER_CR_reconsider_integration_desc:0 "Союз собрал офицеров домов за одним столом, но правительства по-прежнему отвечают каждое от своего имени. Посланники Авиана вернутся с условиями подчинения и вопросами, оставшимися после прошлой встречи. Партнёр, которого просят отказаться от самостоятельности, должен знать, что будет означать этот отказ."
 HSM_VER_CR_integration_defer:0 "Мы не подпишем документ, пока условия не согласованы."
 HSM_VER_CR_negotiate_demand_option:0 "Предложить гражданское соглашение. (35 ПВ)"
 HSM_VER_CR_loyalist_support_tt:0 "Наша помощь укрепит законное правительство в предстоящей борьбе. Она не гарантирует победу лоялистов и не меняет политическое положение нашего дома."
 HSM_VER_CR_erie_medics_tt:0 "Дом Эри направил медицинскую помощь Авиану во время чрезвычайного положения."
 HSM_VER_CR_eyrie_medics_tt:0 "Дом Эйри направил медицинскую помощь Авиану во время чрезвычайного положения."
 HSM_VER_CR_erie_support_tt:0 "Дом Эри поддержал законное правительство, когда исход борьбы ещё не был известен."
 HSM_VER_CR_eyrie_support_tt:0 "Дом Эйри поддержал законное правительство, когда исход борьбы ещё не был известен."
 HSM_VER_CR_elections_no_regime_change_tt:0 "Будет отмечена наша реакция на выборы в Авиане. Авиан сохраняет демократическое правительство; наше правительство и существующие отношения подчинения не меняются."

