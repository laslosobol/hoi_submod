l_russian:
 HSM_AET_opening:0 "Письма без ответа"
 HSM_AET_opening_desc:0 "На старых соглашениях в кабинете Клаудета ещё видна имперская печать, но гонцы не привозят внятных ответов. Грайфвальд не может разрешить все споры за своими границами. Однако он может решить, имеют ли прежние обязательства значение для семей, которые теперь просят о помощи."
 HSM_AET_focus_opening_effect_tt:0 "Открывает переписку о помощи и определяет ответственность Грайфвальда перед беженцами, пострадавшими от имперского кризиса."

 HSM_AET_refuge:0 "Приют для изгнанников"
 HSM_AET_refuge_desc:0 "Прибывшие везут инструменты, счётные книги и адреса домов, которых, возможно, уже нет. Сначала нужно найти им ночлег, а потом аккуратно переписать имена. Местонахождение императорского двора предстоит выяснить: пустая комната ещё не означает, что тот, для кого её приготовили, уже прибыл."
 HSM_AET_focus_refuge_effect_tt:0 "Принимает беженцев и выясняет местонахождение двора. Гровера можно спасти из распущенного императорского двора после установления власти над Грифенхеймом, если у него нет другого действующего опекуна."

 HSM_AET_home_budget:0 "Нужды своего графства"
 HSM_AET_home_budget_desc:0 "Сельские делегации принесли собственные списки: черепица, посевное зерно, неоплаченные счета. Они много слышали о долге перед короной и мало — о долге перед соседями. Прежде чем канцелярия даст новые обещания, графству нужно решить, кто за них заплатит и кто получит право проверять счета."
 HSM_AET_focus_home_budget_effect_tt:0 "Предлагает выбрать между открытым бюджетом помощи и частным кредитом, налагающими разные обязательства на графство."

 HSM_AET_congress:0 "Съезд тех, кто здесь живёт"
 HSM_AET_congress_desc:0 "Делегаты приехали из мест, куда действительно могут добраться наши чиновники. Одни представляют старые общины, другие — города, ещё восстанавливающие ворота. Их подписи должны определить полномочия, которые они готовы доверить общей администрации, и пределы этих полномочий."
 HSM_AET_focus_congress_effect_tt:0 "Созывает представителей земель под управлением Грайфвальда для утверждения ограниченных полномочий территориальной администрации."

 HSM_AET_mandate:0 "Обязанность по согласию"
 HSM_AET_mandate_desc:0 "Предоставленный приют сам по себе не даёт права править от чужого имени. Прежде чем объявлять о каких-либо полномочиях, нужно выслушать Гровера и определить его положение при дворе. Опека или передача ответственности взрослому правителю должны начинаться с согласия и ясного понимания своих границ."
 HSM_AET_focus_mandate_effect_tt:0 "Предлагает законную опеку либо полномочия для передачи власти взрослому Гроверу. Он может предпочесть остаться частным гостем под защитой графства."

 HSM_AET_household:0 "За дверями дворца"
 HSM_AET_household_desc:0 "У двора есть распорядок, наставники и тщательно отобранные посетители. За его дверями — школы, мастерские и соседи, чьи слова никто заранее не проверяет. От того, как Гровер встретится с ними, зависит его понимание страны: и во время учёбы, и при исполнении обязанностей взрослого правителя."
 HSM_AET_focus_household_effect_tt:0 "Предлагает открытое гражданское воспитание или придворное образование; для взрослого Гровера предусмотрена соответствующая программа общественных встреч."

 HSM_AET_court_accounts:0 "Расходная книга двора"
 HSM_AET_court_accounts_desc:0 "Двору нужна не только крыша над головой. Кто-то должен платить наставникам, прислуге и поставщикам, а тот, кто платит, рассчитывает быть услышанным. Расходную книгу можно открыть рядом со счетами графства или оставить у покровителей, чья щедрость порождает собственные обязательства."
 HSM_AET_focus_court_accounts_effect_tt:0 "Предлагает открытое финансирование двора либо помощь покровителей; эти обязательства позднее будут рассмотрены за рабочим столом."

 HSM_AET_service:0 "Присяга с пределами"
 HSM_AET_service_desc:0 "Офицеры хотят знать, чьи приказы сохранят силу после следующей смены власти. Общины хотят знать, кто вправе отозвать их сыновей и дочерей из дома. Обоим нужен ответ, который будет действовать и тогда, когда прославленный командир решит, что обычай позволяет ему больше."
 HSM_AET_focus_service_effect_tt:0 "Определяет порядок военной службы через конституционные нормы или соглашения с офицерами. Присяга распространяется на управляемую страну."

 HSM_AET_working_table:0 "Бумаги между нами"
 HSM_AET_working_table_desc:0 "Жалоба на придворного финансиста легла на тот же стол, что и соглашения о службе. Подписи знакомы, как и обещания, которыми их добились. У Гровера возникнут вопросы о том, что именно защищала власть, и отвечать придётся с учётом уже заключённых сделок."
 HSM_AET_focus_working_table_effect_tt:0 "Открывает дело финансиста, за которым следует разговор с Гровером о решении и прежних военных соглашениях. Оба разговора должны завершиться до подписания условий передачи власти."

 HSM_AET_prepare:0 "Ключи на хранении"
 HSM_AET_prepare_desc:0 "Проекты готовы покинуть канцелярию. В них названы управляемые земли, обязательства перед их жителями и условия, на которых ключи в свой срок перейдут в другие когти. Обещание, данное ради будущего Гровера, должно связывать его авторов столь же крепко, как будущего наследника."
 HSM_AET_focus_prepare_effect_tt:0 "Открывает соглашение о передаче власти. Подписание подготавливает передачу; она состоится после §Y21 мая 1021 года§!, если Гровер жив и находится здесь, страна пребывает в мире, а территориальные и правовые условия договора соблюдены.\nТолько после фактической передачи соглашение Грайфвальда навсегда получает §G+10%§! к пределу эффективности производства и §G+5%§! к скорости исследований."

 HSM_AET_obituary:0 "Имя в траурной рамке"
 HSM_AET_obituary_desc:0 "Сообщение сверили с уцелевшими документами. Надежда на следующего гонца больше не утешает. Какими бы ни были прежние замыслы Грайфвальда о Гровере, теперь нужно честно произнести его имя, почтить завершившуюся жизнь и выслушать тех, чьи воспоминания не умещаются в официальное объявление."
 HSM_AET_focus_obituary_effect_tt:0 "Подтверждает траур по Гроверу и открывает гражданское продолжение, в том числе если его смерть прервала уже установленную опеку."

 HSM_AET_interim:0 "Пока не собралось собрание"
 HSM_AET_interim_desc:0 "Завтра учреждения должны открыться, пока управляемые земли решают, как жить после смерти Гровера. Писарям нужны указания, а деревням — те, кто ответит на прошения. Временная администрация исполнит эти обязанности, оставив окончательное устройство представителям земель."
 HSM_AET_focus_interim_effect_tt:0 "Учреждает ограниченную временную администрацию до принятия общего государственного устройства, без притязаний на корону Гровера."

 HSM_AET_delegates:0 "Место для каждого округа"
 HSM_AET_delegates_desc:0 "Графство невелико, но его канцелярия стала местом встречи куда более обширной страны. Старые общины требуют равного голоса; многолюдные округа — учёта числа жителей. Распределение мест определит, к чьим возражениям предстоит прислушиваться новому союзу."
 HSM_AET_focus_delegates_effect_tt:0 "Предлагает равное представительство земель либо представительство по численности населения в учредительном собрании."

 HSM_AET_union:0 "Союз по согласию"
 HSM_AET_union_desc:0 "Хартия вернулась из округов с исправлениями, сделанными разными когтями. Её сила будет опираться на подписи и готовность администрации соблюдать написанное. Графство Клаудета может сохранить свою историю и титул; общему государству предстоит обрести основание в согласии тех, кто решил его построить."
 HSM_AET_focus_union_effect_tt:0 "Утверждает государственный союз с согласия управляемых земель, с собственными гражданскими учреждениями и отдельным положением графства."

 HSM_AET_revenues:0 "Что остаётся округам"
 HSM_AET_revenues_desc:0 "Первые общие счета поступили с просьбами на полях. Мост срочно нужен округу, в котором он стоит; надёжное казначейство нужно всем округам сразу. Союзу предстоит решить, какая свобода распоряжения средствами останется на местах и какая ответственность ляжет на центр."
 HSM_AET_focus_revenues_effect_tt:0 "Предлагает самостоятельность местных бюджетов либо централизованное управление доходами союза."

 HSM_AET_succession:0 "Должность переживёт имя"
 HSM_AET_succession_desc:0 "Конституции нужен ответ на вопрос, который не любит задавать ни один осторожный правитель: кто займёт опустевшее кресло? У графства свой порядок наследования, а председатель унии исполняет обязанности, доверенные её участниками. Порядок выбора нового председателя должен быть настолько ясен, чтобы будущее собрание не ждало решения одной семьи."
 HSM_AET_focus_succession_effect_tt:0 "Отделяет наследственное графство от выборной должности председателя унии и предлагает выбирать его через собрание либо совет земель."

 HSM_AET_winter:0 "Первый зимний бюджет"
 HSM_AET_winter_desc:0 "Дороги стали труднее, и за каждой задержанной поставкой теперь стоит чьё-то имя. Обещанное казначейством должно дойти до мастерских, школ и семей, прежде чем ударят холода. Впервые союз будут судить по созданным им учреждениям и повседневным обязательствам, которые они способны исполнить."
 HSM_AET_focus_winter_effect_tt:0 "Завершает учредительную программу союза первым зимним бюджетом, проверяя политическое устройство и все четыре внутренних проекта."

 HSM_AET_workshops:0 "Инструменты возвращаются"
 HSM_AET_workshops_desc:0 "За закрытыми ставнями ещё стоят исправные станки и верстаки, ожидающие умелых когтей. Мастера из числа беженцев и местные ученики уже обсуждают, чем могут быть полезны друг другу. Администрация способна дать их начинаниям надёжное место в восстановлении графства."
 HSM_AET_focus_workshops_effect_tt:0 "Создаёт гражданскую мастерскую в подходящей области родного графства либо поддерживает промышленные исследования, если строительство невозможно. Соглашение даёт §G+10%§! к скорости строительства."

 HSM_AET_roads:0 "Дороги до самого порога"
 HSM_AET_roads_desc:0 "Линия на карте мало помогает, если последний мост смыт. Землемеры проверяют пути, по которым продовольствие, письма и запасные части должны доходить до адресата. Их отчёты начинаются с дорог графства и подступов к Грифенхейму, где обещанные поставки становятся настоящими обязательствами."
 HSM_AET_focus_roads_effect_tt:0 "Улучшает дороги подходящих областей графства и Грифенхейма под полным контролем страны. Соглашение даёт §G−10%§! к потреблению снабжения."

 HSM_AET_scholars:0 "Место для учёных"
 HSM_AET_scholars_desc:0 "Учителя, покинувшие свои дома, привезли уцелевшие книги, конспекты и привычку спорить. Местные школы могут предложить комнаты, но для новой жизни нужны коллеги, ученики и достойное дело. Пусть мастерские и классы станут местами, где прерванное призвание обретёт продолжение."
 HSM_AET_focus_scholars_effect_tt:0 "Поддерживает исследования электроники и повышает грамотность там, где это допускают существующие условия образования. Соглашение даёт §G+5%§! к скорости исследований."

 HSM_AET_demobilisation:0 "Ремесло после службы"
 HSM_AET_demobilisation_desc:0 "Документы об увольнении со службы — лишь начало пути домой. Одним ветеранам некуда возвращаться, другим нужно ремесло, которым можно заниматься с полученными ранениями. Графство должно найти им место в мирной жизни и сохранить опыт, который они способны передать тем, кто ещё служит."
 HSM_AET_focus_demobilisation_effect_tt:0 "Сохраняет военный опыт и уменьшает бедность там, где это допускают существующие условия. Соглашение даёт §G−10%§! ко времени подготовки армии."

 HSM_AET_letters:0 "Другой почерк"
 HSM_AET_letters_desc:0 "Подпись почти знакомая. Но обещание над ней не совпадает с тем, которое помнят свидетели. Старая переписка лежит рядом с новыми приказами и ждёт того, кто вправе спросить, почему почерк и воспоминания начали расходиться."
 HSM_AET_focus_letters_effect_tt:0 "Начинает открытое либо негласное расследование личности правителя. Негласное расследование оставляет последствия, которые придётся принять при раскрытии правды."

 HSM_AET_audience:0 "За закрытой дверью"
 HSM_AET_audience_desc:0 "Аудиенция назначена без обычной свиты. Письма разложены в порядке написания, а вопросы задают без подсказанных ответов. Тому, кто скрывается за именем Клаудета, теперь придётся ответить за связанные с этим именем обещания."
 HSM_AET_focus_audience_effect_tt:0 "Предъявляет обвинения самозванцу и устанавливает истинную личность Триммеля, подготавливая доказательства для открытого слушания."

 HSM_AET_hearing:0 "Имя перед собранием"
 HSM_AET_hearing_desc:0 "Протокол больше не может оставаться во дворце. Свидетели вспоминают решения, изменившие их жизнь, а собранию предстоит оценить их после раскрытия личности говорившего. Власть, полученная после этого слушания, должна носить честное имя и подчиняться исполнимым ограничениям."
 HSM_AET_focus_hearing_effect_tt:0 "Позволяет вернуть графа, если он доступен, либо передать ответственность гражданскому совету; другой исход — публичное утверждение Триммеля протектором с ограниченными полномочиями."

 HSM_AET_signature:0 "Под собственным именем"
 HSM_AET_signature_desc:0 "В заключительном документе нет места чужой подписи. Он должен назвать того, кто теперь отвечает за власть, определить обязательства перед обманутыми и подтвердить сохраняющие силу обещания. Когда его прочтут вслух, каждый должен точно знать, чьё обещание ему дают."
 HSM_AET_focus_signature_effect_tt:0 "Подписывает соглашение по итогам слушания, решает вопрос возмещения и снимает приостановку законного утверждения решений."

 HSM_AET_focus_can_open_tt:0 "Независимый Грайфвальд не капитулировал и сохраняет прагматичное правительство."
 HSM_AET_focus_active_tt:0 "Общая администрация Грайфвальда продолжает действовать."
 HSM_AET_focus_can_congress_tt:0 "Администрация помощи Грайфвальда действует; возникший кризис подмены правителя законно урегулирован."
 HSM_AET_focus_can_mandate_tt:0 "Гровер жив и находится под защитой Грайфвальда."
 HSM_AET_focus_regency_tt:0 "Законные полномочия в отношении живого Гровера сохраняют силу."
 HSM_AET_focus_can_union_tt:0 "Смерть Гровера подтверждена."
 HSM_AET_focus_union_work_tt:0 "Траур завершён, и законное гражданское урегулирование может продолжаться."
 HSM_AET_focus_can_prepare_tt:0 "Полномочия, завершённые слушания и внутренние проекты позволяют заключить мирное соглашение о передаче власти."
 HSM_AET_focus_can_finish_union_tt:0 "Порядок преемственности и внутренние проекты готовы к первому зимнему бюджету."
 HSM_AET_focus_crisis_tt:0 "Подмена правителя остаётся неразрешённым государственным вопросом."
 HSM_AET_focus_can_hear_tt:0 "Личность Триммеля установлена и ожидает открытого разбирательства."
 HSM_AET_focus_can_sign_tt:0 "Слушание завершено, и соглашение по его итогам ожидает подписи."

 HSM_AET_focus_opening_done_tt:0 "Ответ на переписку о помощи получен."
 HSM_AET_focus_refuge_done_tt:0 "Вопрос о приёме беженцев решён."
 HSM_AET_focus_home_budget_done_tt:0 "Графство выбрало способ финансирования помощи."
 HSM_AET_focus_congress_done_tt:0 "Съезд утвердил общую администрацию."
 HSM_AET_focus_mandate_done_tt:0 "Двор дал ответ на предложение о публичных полномочиях."
 HSM_AET_focus_household_done_tt:0 "Образование Гровера либо его общественные встречи согласованы."
 HSM_AET_focus_court_accounts_done_tt:0 "Порядок финансирования двора определён."
 HSM_AET_focus_service_done_tt:0 "Условия военной службы согласованы."
 HSM_AET_focus_judgement_done_tt:0 "По делу финансиста принято решение."
 HSM_AET_focus_working_table_done_tt:0 "На вопросы Гровера о решении и соглашениях даны ответы."
 HSM_AET_focus_obituary_done_tt:0 "Гровер оплакан, и его смерть признана."
 HSM_AET_focus_interim_done_tt:0 "Временная администрация утверждена."
 HSM_AET_focus_delegates_done_tt:0 "Представительство земель в учредительном собрании согласовано."
 HSM_AET_focus_union_done_tt:0 "Хартия союза подписана."
 HSM_AET_focus_revenues_done_tt:0 "Распределение государственных доходов согласовано."
