l_russian:
 HSM_AET_context_lost:0 "Обстоятельства уже изменились."
 HSM_AET_context_lost_desc:0 "Обстоятельства, записанные в этом документе, уже изменились. Канцелярия подшивает его, не разрешая предложенных действий."
 HSM_AET_postpone:0 "Отложить до следующего рассмотрения."
 HSM_AET_postpone_tt:0 "Отложить вопрос без затрат, награды и выбора политики. К нему вернутся при следующем плановом рассмотрении через несколько недель, если обстоятельства по-прежнему это допускают."
 HSM_AET_story_afford_10:0 "Доступно не менее §Y10§! политической власти."
 HSM_AET_story_afford_25:0 "Доступно не менее §Y25§! политической власти."
 HSM_AET_story_afford_35:0 "Доступно не менее §Y35§! политической власти."
 HSM_AET_story_afford_50:0 "Доступно не менее §Y50§! политической власти."
 HSM_AET_story_afford_75:0 "Доступно не менее §Y75§! политической власти."
 HSM_AET_story_afford_revision:0 "Для пересмотра договоров требуется §Y50§! политической власти, если финансист предстал перед судом, либо §Y100§!, если его защитили."
 HSM_AET.1.t:0 "Письма без ответа"
 HSM_AET.1.imperial.d:0 "В пакете с имперской дороги — три неоплаченных счёта, просьба прислать муку и письмо в министерство, которое больше не отвечает. Прежний адрес для пересылки аккуратно зачёркнут.\n\nКогда-то связи с Империей служили Грайфвальду страховкой от соседей. Теперь у этих связей появились лица: писарь у ворот, носильщик со списком пропавших товарищей. Графство может предложить хлеб, кров и канцелярию, где прочтут прошение. Для более громких обещаний ещё придётся заслужить право подписи."
 HSM_AET.1.changed.d:0 "На столе всё ещё лежит старая записка о внешней политике: торговать с обоими соседями, никому не обещать лишнего. Рядом — промокшее письмо с имперской дороги. Его автор спрашивает, где ночевать перемещённым лицам.\n\nСмотрел ли Грайфвальд на запад или держался в стороне, ответа в записке нет. Писари составляют более скромное обязательство: укрыть тех, кто доберётся до нас, честно вести счета и не обещать престола, которым мы не вправе распоряжаться. Первая повозка уже у ворот."
 HSM_AET.1.a:0 "Пусть у писем будет адрес."
 HSM_AET.1.a.tt:0 "Открыть канцелярию помощи и начать работу графства."
 HSM_AET.2.t:0 "Комната в списке"
 HSM_AET.2.minor.d:0 "В книге смотрительницы одна графа отведена именам, другая — одеялам. Когда к столу подходит двор Гровера, она спрашивает о том и о другом именно в таком порядке. Мальчик смотрит, как плотник несёт наверх сломанную школьную скамью; впервые за день от него не ждут благословения.\n\nЕго присутствие заносят в книгу. Как и имена соседних семей. Кров ещё не означает регентства, а тёплая комната не покупает присягу. Прибывшие инженеры просят сперва мастерскую, а потом уже церемонии."
 HSM_AET.2.adult.d:0 "Гровер приходит в квартирную канцелярию с собственным списком расходов двора. Писарь обращается к нему через сопровождающего; Гровер придвигает книгу и отвечает сам. На улице мастера-беженцы спорят о ключах от пустующей мастерской.\n\nОн совершеннолетний гость, а не подопечный, которого можно куда-то определить. Здесь ему могут предложить защиту; государственные полномочия потребуют его согласия и соглашения о землях. Сегодня же в книгу вносят комнату, двор и расходы, которые кому-то предстоит оплатить."
 HSM_AET.2.absent.d:0 "Первые прибывшие привезли разобранный печатный станок, приходские книги и ключи от дверей, к которым уже не вернутся. Писарь отводит инженерам мастерскую, а семьи вносит в квартирный список.\n\nИмператорского двора среди прибывших нет. Дворцовые комнаты готовы, но пустая комната не доказывает ни смерти, ни прибытия, ни права на опеку. Графство займётся теми, кто действительно здесь, пока посланники выясняют, где укрылись Гровер и его двор."
 HSM_AET.2.dead.d:0 "Прибывшие привезли разобранный печатный станок, приходские книги и пачку дворцовых бумаг, перевязанную чёрной лентой. Гибель Гровера подтверждена. Смотрительница не вносит его имя в список ожидаемых гостей, а затем спрашивает выживших, где они будут ночевать.\n\nБывший придворный слуга помогает ей записать имена членов семей, разлучённых в дороге. Инженеры спрашивают, можно ли открыть пустующую мастерскую, а плотник вызывается починить её дверь. Комнаты, приготовленные для императорского двора, отдают тем, кому они нужны сейчас. У графства по-прежнему достаточно работы."
 HSM_AET.2.a:0 "Сперва имена. Титулы потом."
 HSM_AET.2.a.tt:0 "Принять беженцев и воспользоваться опытом прибывших инженеров."
 HSM_AET.3.t:0 "Крыша самого графства"
 HSM_AET.3.d:0 "Староста кладёт треснувшую черепицу рядом со сметой помощи. В деревенскую школу с весны течёт вода. Купец напротив предлагает кредит и на крышу, и на новые квартиры; график платежей он подложил под само предложение.\n\nНикто не требует выгнать гостей. Спрашивают другое: чей ремонт отложат и кто продолжит платить, когда процессия уедет. Открытое бюджетное решение позволит решить спор при всех. Кредит быстрее приведёт строителей — и надолго закрепит заимодавцу место у дверей канцелярии."
 HSM_AET.3.a:0 "Опубликовать смету."
 HSM_AET.3.a.tt:0 "Оплатить помощь из открытого бюджета. Договор даёт §G+5%§! к стабильности."
 HSM_AET.3.b:0 "Принять заём и напечатать условия."
 HSM_AET.3.b.tt:0 "Воспользоваться частным кредитом. Договор даёт §G+5%§! к скорости строительства и §R−0,10§! политической власти в день."
 HSM_AET.4.t:0 "Карта с границей"
 HSM_AET.4.d:0 "Делегаты отвергают первую карту. На ней одним цветом отмечены все прежние имперские провинции, включая те, откуда в этот зал никто не приехал. Землемер уносит лист.\n\nНа новой карте — Грифенхейм и районы Герцланда, которыми наша администрация действительно владеет и управляет. Родные земли Грайфвальда выделены отдельно. Делегаты соглашаются на временное общее управление в этих границах до окончательного соглашения. Писарь обводит земли подписантов твёрдой линией. На этот раз у амбиций есть видимая граница."
 HSM_AET.4.a:0 "Таковы пределы наших полномочий."
 HSM_AET.4.a.tt:0 "Утвердить решение территориального съезда и открыть программу внутреннего развития графства."
 HSM_AET.10.t:0 "Гость или мандат"
 HSM_AET.10.minor.d:0 "Акт об опеке лежит рядом с книгой двора. Один документ обещает ребёнку кров; другой позволит Грайфвальду управлять подконтрольным Герцландом от его имени до законной передачи власти. Юристы тратят весь день, чтобы не смешать эти обязательства.\n\nГровер спрашивает, придётся ли собирать вещи в случае отказа. Секретарь поворачивает к нему договор о проживании: такого условия там нет. Двор может принять государственный мандат или остаться под частной защитой. Никто за столом не вправе называть этот выбор семейным долгом."
 HSM_AET.10.adult.d:0 "Гровер зачёркивает слово «опекун», не дожидаясь конца чтения. Он уже вправе подписывать документы сам. Он может согласиться на временную администрацию, открытый бюджет и обязательную передачу подконтрольного Герцланда при выполнении условий.\n\nНовая редакция оставляет родные земли Грайфвальда вне передачи. За самим Гровером сохраняется право отказаться. Кров и личная защита не зависят от того, одолжит ли он своё имя правительству. Он дважды перечитывает этот пункт и кладёт перо."
 HSM_AET.10.a:0 "Принять письменный мандат."
 HSM_AET.10.a.tt:0 "Учредить законное регентство либо переходное управление для совершеннолетнего правителя. Полностью контролируемые владения в Герцланде получают временную интеграцию; родные земли графства остаются отдельно."
 HSM_AET.10.b:0 "Сохранить частную защиту."
 HSM_AET.10.b.tt:0 "Отклонить государственный мандат. Гровер останется под защитой как гость; программа регентства закроется, внутреннее развитие останется доступным."
 HSM_AET.11.t:0 "Кому позволено спрашивать?"
 HSM_AET.11.minor.d:0 "В школьном классе Гровер замечает на маленькой парте чернильное пятно, похожее на реку. Ученик уверяет, что это дракон. Спор заканчивается, лишь когда наставник зовёт Гровера обратно в экипаж.\n\nДвор может устроить обычные занятия вместе с детьми, чьи родители ждут честных ответов о делах графства. Или собрать опытных придворных учителей и обучать его рядом с учреждениями, которыми он однажды будет руководить. Оба пути обещают объяснить устройство власти. Но лишь один начинается с возражений из-за чернильного пятна."
 HSM_AET.11.adult.d:0 "К первой поездке Гровера по городским учреждениям составили список вопросов. Снизу протокольный чиновник приложил ответы. Гровер кладёт листы рядом и спрашивает, для какой части поездки требуется его присутствие.\n\nМожно открыть программу школам, мастерским и общественным собраниям, где с ответом вправе поспорить. Двор предлагает взамен упорядоченные совещания с опытными чиновниками. Один путь расширяет круг участников будущего управления; другой помогает уже сложившемуся кругу работать слаженнее."
 HSM_AET.11.a:0 "Пусть двери открываются в обе стороны."
 HSM_AET.11.a.tt:0 "Выбрать открытое образование и гражданские встречи. Договор даёт §G+5%§! к скорости исследований."
 HSM_AET.11.b:0 "Поручить занятия двору."
 HSM_AET.11.b.tt:0 "Выбрать придворных учителей и совещания с чиновниками. Договор даёт §G+10%§! к приросту политической власти."
 HSM_AET.12.t:0 "Цена свечей"
 HSM_AET.12.d:0 "В дворцовых счетах церемониальные свечи отделены от обычных. Казначей не может объяснить, почему первые втрое дороже. Частный покровитель предлагает покрыть разницу и избавить всех от неловкого разбирательства.\n\nВместе с предложением идут кабинет для его доверенного лица и предпочтение его поставщикам. Открытое финансирование потребует времени и политических усилий; зато каждую квитанцию можно будет проверить. Частные деньги облегчат нагрузку на промышленность, но у двора появится кредитор, чьи счета неизменно сопровождаются просьбами."
 HSM_AET.12.a:0 "Каждую свечу — в открытый реестр."
 HSM_AET.12.a.tt:0 "Опубликовать и оплатить счета двора. Договор даёт §G+5%§! к стабильности."
 HSM_AET.12.b:0 "Принять предложение покровителя."
 HSM_AET.12.b.tt:0 "Принять частное финансирование. Договор даёт §G−5%§! к множителю фабрик товаров народного потребления, но §R−0,10§! политической власти в день."
 HSM_AET.13.t:0 "Последняя строка присяги"
 HSM_AET.13.d:0 "Полковник читает проект присяги голосом, привыкшим перекрывать плац. Затем депутат спрашивает, кто сможет отстранить его, если правительство само нарушит закон. Полковник начинает читать заново.\n\nГражданский проект подчиняет армию опубликованному закону и ограничивает её задачу управляемыми землями. Офицеры предлагают профессиональные контракты в обмен на твёрдые гарантии оплаты и влияние на военные назначения. Ни один проект не обещает похода через всю Грифонию. Спор идёт о том, кто вправе командовать стоящими здесь солдатами."
 HSM_AET.13.a:0 "Армия служит закону."
 HSM_AET.13.a.tt:0 "Подчинить службу гражданскому закону. Договор даёт §G+5%§! к организации дивизий и §G−5%§! к потреблению снабжения."
 HSM_AET.13.b:0 "Подписать офицерские контракты."
 HSM_AET.13.b.tt:0 "Обеспечить сотрудничество офицеров. Договор даёт §G+10%§! к организации дивизий и §R+5%§! к множителю фабрик товаров народного потребления."
 HSM_AET.14.t:0 "Печать поставщика"
 HSM_AET.14.patron.d:0 "Жалоба подана на финансиста, чьи деньги содержат двор. Мельник принёс квитанции: доверенный агент скупал зерно ниже объявленной цены, а двору выставлял полную стоимость. Покровитель предлагает новый аванс, если проверку оставят его собственным счетоводам.\n\nУ мельника нет защитника. Зато есть подлинные квитанции, завёрнутые от дождя. Судья спрашивает, должен ли кредитор двора отвечать перед той же скамьёй, что и все остальные."
 HSM_AET.14.public.d:0 "Открытые счета принесли результат: мельник сверил свои квитанции с опубликованными закупками зерна для двора. Цифры не сходятся. Поставщик, который также ссужает деньгами влиятельных чиновников, предлагает аванс, если расхождение удастся уладить негласно.\n\nОпубликовать книгу оказалось проще, чем судить того, чьи друзья помогали её утвердить. Мельник сидит на деревянной скамье с квитанциями на коленях. Судья ждёт ответа о пределах своих полномочий."
 HSM_AET.14.a:0 "Печать не даёт неприкосновенности."
 HSM_AET.14.a.tt:0 "Передать дело финансиста независимому суду. Договор даёт §G+5%§! к стабильности."
 HSM_AET.14.b:0 "Двору ещё нужен его кредит."
 HSM_AET.14.b.tt:0 "Защитить финансиста и принять его помощь. Его влияние будет стоить договору §R0,10§! политической власти в день."
 HSM_AET.15.t:0 "Первое возражение"
 HSM_AET.15.minor_judged_law.d:0 "Гровер принёс за рабочий стол дело о зерне. В учебнике он подчеркнул фразу: закон для всех одинаков. «Для тех, кто нам платит, тоже?» — спрашивает он. Никто не тянется за учебником.\n\nФинансист предстал перед судом. Гровер спрашивает, хватит ли той же решимости для спора с более полезным союзником. Армия уже присягнула закону. Пересмотр оставшихся привилегий придаст этим словам вес; сохранение договоров удержит прежнее соглашение и его сторонников."
 HSM_AET.15.minor_judged_contract.d:0 "Гровер принёс за рабочий стол дело о зерне. В учебнике он подчеркнул фразу: закон для всех одинаков. «Для тех, кто нам платит, тоже?» — спрашивает он. Никто не тянется за учебником.\n\nФинансист предстал перед судом. Гровер спрашивает, хватит ли той же решимости для спора с более полезным союзником. Офицерские контракты сохраняют их привилегии. Пересмотр гражданских соглашений позволит ответить на жалобу, хотя отдельная военная договорённость останется в силе. Сохранение договоров удержит покровителей вместе и оставит возражение Гровера в протоколе."
 HSM_AET.15.minor_protected_law.d:0 "Гровер принёс за рабочий стол дело о зерне. В учебнике он подчеркнул фразу: закон для всех одинаков. «Для тех, кто нам платит, тоже?» — спрашивает он. Никто не тянется за учебником.\n\nФинансиста защитили. Гровер указывает на квитанции мельника, оставшиеся без ответа: нужда двора в кредите стала исключением, которого никто не записывал. Армия уже присягнула закону. Пересмотр оставшихся привилегий придаст этим словам вес; сохранение договоров удержит прежнее соглашение и его сторонников."
 HSM_AET.15.minor_protected_contract.d:0 "Гровер принёс за рабочий стол дело о зерне. В учебнике он подчеркнул фразу: закон для всех одинаков. «Для тех, кто нам платит, тоже?» — спрашивает он. Никто не тянется за учебником.\n\nФинансиста защитили. Гровер указывает на квитанции мельника, оставшиеся без ответа: нужда двора в кредите стала исключением, которого никто не записывал. Офицерские контракты сохраняют их привилегии. Пересмотр гражданских соглашений позволит ответить на жалобу, хотя отдельная военная договорённость останется в силе. Сохранение договоров удержит покровителей вместе и оставит возражение Гровера в протоколе."
 HSM_AET.15.adult_judged_law.d:0 "Гровер кладёт решение по зерновому делу рядом с соглашением об армейской службе. Он отметил места, где обязательство превращается в исключение. «Мне предстоит управлять по этим правилам, — говорит он. — Я хотел бы знать, каким из них мы верим».\n\nФинансист предстал перед судом. Гровер спрашивает, хватит ли той же решимости для спора с более полезным союзником. Армия уже присягнула закону. Пересмотр оставшихся привилегий придаст этим словам вес; сохранение договоров удержит прежнее соглашение и его сторонников."
 HSM_AET.15.adult_judged_contract.d:0 "Гровер кладёт решение по зерновому делу рядом с соглашением об армейской службе. Он отметил места, где обязательство превращается в исключение. «Мне предстоит управлять по этим правилам, — говорит он. — Я хотел бы знать, каким из них мы верим».\n\nФинансист предстал перед судом. Гровер спрашивает, хватит ли той же решимости для спора с более полезным союзником. Офицерские контракты сохраняют их привилегии. Пересмотр гражданских соглашений позволит ответить на жалобу, хотя отдельная военная договорённость останется в силе. Сохранение договоров удержит покровителей вместе и оставит возражение Гровера в протоколе."
 HSM_AET.15.adult_protected_law.d:0 "Гровер кладёт жалобу по зерновому делу рядом с соглашением об армейской службе. Он отметил места, где обязательство превращается в исключение. «Мне предстоит управлять по этим правилам, — говорит он. — Я хотел бы знать, каким из них мы верим».\n\nФинансиста защитили. Гровер указывает на квитанции мельника, оставшиеся без ответа: нужда двора в кредите стала исключением, которого никто не записывал. Армия уже присягнула закону. Пересмотр оставшихся привилегий придаст этим словам вес; сохранение договоров удержит прежнее соглашение и его сторонников."
 HSM_AET.15.adult_protected_contract.d:0 "Гровер кладёт жалобу по зерновому делу рядом с соглашением об армейской службе. Он отметил места, где обязательство превращается в исключение. «Мне предстоит управлять по этим правилам, — говорит он. — Я хотел бы знать, каким из них мы верим».\n\nФинансиста защитили. Гровер указывает на квитанции мельника, оставшиеся без ответа: нужда двора в кредите стала исключением, которого никто не записывал. Офицерские контракты сохраняют их привилегии. Пересмотр гражданских соглашений позволит ответить на жалобу, хотя отдельная военная договорённость останется в силе. Сохранение договоров удержит покровителей вместе и оставит возражение Гровера в протоколе."
 HSM_AET.15.a:0 "Исправить то, что ещё можно исправить."
 HSM_AET.15.a.tt:0 "Пересмотреть гражданские соглашения и утвердить судебный надзор. Условия военной службы остаются прежними."
 HSM_AET.15.a.protected.tt:0 "Подчинить защищённого финансиста судебному надзору: убрать его штраф §R−0,10§! ежедневной политической власти и заменить его бонусом §G+5%§! к стабильности от договора. Условия военной службы остаются прежними."
 HSM_AET.15.b:0 "Записать возражение. Соблюсти договоры."
 HSM_AET.15.b.tt:0 "Сохранить выбранные договорённости с покровителями и армией. Возражение Гровера останется в протоколе."
 HSM_AET.16.t:0 "Незаполненная дата"
 HSM_AET.16.minor.d:0 "В договоре оставлено место для даты передачи, но секретарь его не заполняет. Гровер должен сперва достичь совершеннолетия; к тому дню ещё должны сохраниться мир и законный контроль над землями. Всё остальное записывают сейчас, пока отсрочка кажется удобной.\n\nВосстановленная власть получит Грифенхейм и наши полностью контролируемые владения в согласованных границах Герцланда. Родные земли Грайфвальд сохранит. Передачу сопроводит четверть армии, авиации и военных запасов; корабли и офицеров передавать не будут. Гровер проводит когтем по пустой строке даты. У обещания наконец появился конец."
 HSM_AET.16.adult.d:0 "Гровер читает график передачи как полноправный подписант и исправляет на полях ссылку на границу. Временная администрация вправе работать лишь до выполнения условий: мира, законного пребывания Гровера, урегулированной власти и действительного контроля над указанными землями. Совершеннолетия ждать уже не нужно.\n\nГрифенхейм и наши полностью контролируемые владения в Герцланде перейдут восстановленной власти; родные земли Грайфвальда останутся отдельно. Передачу сопроводит четверть армии, авиации и военных запасов, но ни корабли, ни офицеры. Последняя страница требует подписи правительства, которому предстоит научиться отпускать."
 HSM_AET.16.a:0 "Сделать обещание обязательным."
 HSM_AET.16.a.tt:0 "Подписать договор о передаче. В мирное время совершеннолетний Гровер, законно находящийся у нас, получит независимую восстановленную Империю и подлежащие передаче владения Герцланда, включая Грифенхейм. Передать §Y25%§! армии, авиации и запасов снаряжения; сохранить корабли, офицеров, родные земли Грайфвальда и Аделарт. Вступление в альянс требует согласия соответствующего лидера. До выполнения всех условий администрация продолжит работу.\nТолько после фактической передачи договор Грайфвальда навсегда получит §G+10%§! к пределу эффективности производства и §G+5%§! к скорости исследований."
 HSM_AET.17.t:0 "Возвращённый ключ"
 HSM_AET.17.d:0 "Донесение из Грифенхейма приходит с заверенным актом передачи. Гровер вступил там в свои полномочия; администрация, управлявшая от его имени, передала власть. В экземпляре графства перечислены действительно переданные земли, части и запасы. Провинции за их пределами никто не закрашивал.\n\nВ бывших комнатах двора смотритель находит ключ, возвращённый в конверте. Никакой просьбы к нему не приложено. Последнюю страницу счёта графства наконец можно закрыть. Завтрашние трудности будут заботой двух правительств, каждое из которых обязано отвечать за собственные обещания."
 HSM_AET.17.a:0 "Закрыть книгу регентства."
 HSM_AET.17.a.tt:0 "Признать завершённую передачу. Грайфвальд и восстановленная Империя теперь управляют собственными землями. Завершённая передача уже дала договору Грайфвальда постоянные бонусы: §G+10%§! к пределу эффективности производства и §G+5%§! к скорости исследований; это признание не выдаёт их повторно."
 HSM_AET.20.t:0 "Имя чёрными чернилами"
 HSM_AET.20.guardian.d:0 "Подтверждённое известие зачитывают за столом, которым прежде пользовался двор. Гровер мёртв. Служанка, приносившая ему еду, спрашивает, что теперь делать с его комнатой, и обрывает вопрос на полуслове.\n\nСекретарь откладывает следующее прошение. Тем, кто знал Гровера, дают время высказаться — в том числе слугам, чьи имена никогда не попали бы в придворный некролог. Во дворе, как обычно, грузят обозы помощи. Хотя бы этим утром можно оплакивать потерю, не превращая её в очередной спор о власти."
 HSM_AET.20.distant.d:0 "Бумаги гонца сверили с уцелевшими записями и показаниями свидетелей. Гровер мёртв. Беженка просит прочесть донесение ещё раз, а затем складывает письмо, которое надеялась отправить его двору.\n\nУ здания суда собирается небольшая толпа. Кто-то помнит императорский двор, кто-то знал Гровера лишь по имени в официальных бумагах. По их просьбе звонят в колокол, а дневные прошения откладывают до конца поминальной службы. Делегаты вновь встретятся завтра. Сегодня графство даёт людям время пережить потерю, на которую не ответить прокламацией."
 HSM_AET.20.a:0 "Дать графству проститься."
 HSM_AET.20.a.tt:0 "Засвидетельствовать подтверждённую гибель Гровера. Прекратить династический мандат и временную интеграцию Герцланда, если они были установлены. Сохраняется возможность добровольной унии без притязаний на императорское наследование."
 HSM_AET.21.t:0 "Пока делегаты не решат"
 HSM_AET.21.d:0 "На утреннее совещание писари приносят две печати. Первая ссылается на опеку над императорской короной. На второй значится только «временная администрация». Первую запирают при свидетелях.\n\nНовый приказ сохраняет работу судов, выплату жалованья и движение обозов помощи. Постоянную конституцию он не устанавливает. Районный делегат спрашивает, когда закончатся эти временные полномочия. Секретарь вписывает ответ в приказ: их продолжение должны одобрить представители учредительных земель. Делегат остаётся, пока не высохнут чернила."
 HSM_AET.21.direct.d:0 "Суд открылся на основании временных полномочий, данных съездом, но служащие не могут сказать просителям, как долго эти полномочия продлятся. Делегат округа приносит на утреннее совещание нерассмотренные дела и кладёт их рядом с ведомостью жалованья работников канцелярии помощи.\n\nСъезд продлевает работу гражданской администрации, пока представители учредительных земель не определят её будущее. Суды продолжат заседать, жалованье будут платить; окончательное решение о конституционном устройстве останется за собранием. Уходя, делегат просит вывесить распоряжение у здания суда. Люди, ожидающие снаружи, должны прочесть то же обещание."
 HSM_AET.21.a:0 "Сохранить учреждения и ограничить мандат."
 HSM_AET.21.a.tt:0 "Сохранить необходимое управление, пока учредительные земли договариваются об унии."
 HSM_AET.22.t:0 "Кресло для графства"
 HSM_AET.22.d:0 "Делегация Герцланда приезжает с переписными таблицами. Представители Грайфвальда — с проектом соглашения, благодаря которому встреча вообще состоялась. Обе стороны кладут бумаги в центр стола.\n\nРавное представительство земель защитит малых участников от крупных городов. Места по численности населения дадут этим городам голос, соразмерный числу жителей, перед которыми они отвечают. Графство не может одновременно иметь малый налоговый список и вечное большинство. Его делегатов просят выбрать принцип, который они готовы отстаивать даже ценой проигранного голосования."
 HSM_AET.22.a:0 "Равный голос учредительным землям."
 HSM_AET.22.a.tt:0 "Предоставить учредительным землям равное представительство. Договор даёт §G+5%§! к стабильности."
 HSM_AET.22.b:0 "Число мест должно следовать за числом жителей."
 HSM_AET.22.b.tt:0 "Распределить места по численности населения. Договор даёт §G+10%§! к приросту политической власти."
 HSM_AET.23.t:0 "Договор без короны"
 HSM_AET.23.d:0 "Делегат одного из малых городов отказывается подписывать договор, пока название его города не вернут в перечень земель. Другой привёз поправки, одобренные дома. Секретарь зачитывает каждое исправление; подписи появляются лишь тогда, когда делегаты узнают в тексте соглашение, ради которого их сюда послали.\n\nХартия объединяет Грайфвальд и управляемые земли Герцланда в общее государство. В перечне только наши владения под нашим контролем; за отсутствующих соседей никто в унию не вступал. Графство сохраняет свой титул, а полномочия унии опираются на договор. Когда запечатывают последний экземпляр, первый делегат спрашивает, кто доставит его в суд родного города."
 HSM_AET.23.a:0 "Пусть основанием станет соглашение."
 HSM_AET.23.a.tt:0 "Учредить договорную унию и окончательно интегрировать полностью контролируемые владения Герцланда в согласованных границах. На земли третьих стран претензии не распространяются."
 HSM_AET.24.t:0 "Два экземпляра каждой квитанции"
 HSM_AET.24.d:0 "Первая налоговая квитанция унии отмечена двумя печатями. Районный сборщик говорит, что мост нужно починить прежде, чем из города уйдёт ещё один платёж. Общее казначейство отвечает: три района уже ждут помощи с куда более тяжёлыми разрушениями.\n\nМестные бюджеты позволят общинам чинить знакомое хозяйство и защищать обещанную им долю. Общее казначейство сможет собирать крупные суммы и строить через районные границы. Ни один ответ сам по себе денег не создаёт. Спорят о том, кому объяснять очередь людям, которые в ней стоят."
 HSM_AET.24.a:0 "Гарантировать местную долю."
 HSM_AET.24.a.tt:0 "Защитить местные бюджеты. Договор даёт §G+5%§! к стабильности и §G+15%§! к скорости ремонта фабрик."
 HSM_AET.24.b:0 "Объединить доходы для общих работ."
 HSM_AET.24.b.tt:0 "Сосредоточить средства на общих вложениях. Договор даёт §G+10%§! к скорости строительства."
 HSM_AET.25.t:0 "Должность, которую не наследуют"
 HSM_AET.25.d:0 "Собрание проверяет проект порядка преемственности на пустом кресле. Секретарь читает, что произойдёт, если нынешний председатель больше не сможет исполнять обязанности. Он ещё не дочитал первую страницу, а двое делегатов уже спрашивают, кто вправе созвать голосование.\n\nОдин проект поручает выбор общему собранию. Другой оставляет его совету учредительных земель. Оба сохраняют отдельный закон о наследовании графского титула. Делегатам предстоит решить, кто созовёт выборщиков и удостоверит их решение, пока кресло пустует лишь для этой проверки."
 HSM_AET.25.a:0 "Председателя избирает собрание."
 HSM_AET.25.a.tt:0 "Сделать председательство выборным через общее собрание. Договор даёт §G+10%§! к приросту политической власти."
 HSM_AET.25.b:0 "Поручить выбор совету земель."
 HSM_AET.25.b.tt:0 "Передать выбор совету учредительных земель. Договор даёт §G−5%§! к множителю фабрик товаров народного потребления."
 HSM_AET.26.t:0 "Счёт первой зимы"
 HSM_AET.26.local.d:0 "Снег перекрывает северную дорогу прежде, чем общее собрание успевает закончить поздравления. Районный казначей выделяет защищённые средства на ремонт и направляет счёт по летнему соглашению. Центральной канцелярии приходится принять законное решение, которого она не принимала сама.\n\nОбоз опаздывает, но доезжает. Зимний бюджет утверждают, оставив возражения в протоколе. Снаружи писарь подметает ступени перед следующими просителями. Первое достижение унии скромно и потому ощутимо: её учреждения сработали в день, когда основатели предпочли бы спорить."
 HSM_AET.26.central.d:0 "Снег перекрывает северную дорогу прежде, чем общее собрание успевает закончить поздравления. Казначейство перенаправляет туда обоз общего строительства. Делегаты района, которому теперь придётся ждать, требуют расчётов и получают их раньше извинений.\n\nЗимний бюджет выдерживает первую неприятную поправку. Снаружи писарь подметает ступени перед следующими просителями. Никто не называет итог коронацией. Уния начинает делать то, что труднее праздновать: принимать решение, объяснять его цену и отвечать за него после окончания аплодисментов."
 HSM_AET.26.a:0 "Утвердить бюджет. Открыть завтрашнее заседание."
 HSM_AET.26.a.tt:0 "Завершить учредительное соглашение. Принятые учреждения унии и программа внутреннего развития сохраняются."
 HSM_AET.27.t:0 "Во что обходится император"
 HSM_AET.27.minor.d:0 "Гровер кладёт маленькую драгоценность на дворцовый счёт. Она его собственная, объясняет он, а значит, так проще, чем снова просить у графства. В книге казначея нет графы для такого объяснения.\n\nОдин из сопровождающих предлагает объявить дар примером императорского самопожертвования. Другой молча приносит коробочку, чтобы вещь не затерялась среди квитанций. Можно принять частный взнос, не превращая щедрость ребёнка в публичную обязанность. А можно дать газетам сделать из неё урок. Драгоценность блестит одинаково."
 HSM_AET.27.adult.d:0 "Гровер приносит распоряжение о перечислении дохода со своего личного имения. Он проверил расходы двора и предлагает покрыть часть самостоятельно. Казначей читает условия; секретарь по печати уже читает будущий заголовок.\n\nВзнос может остаться частной, надлежаще учтённой операцией. А может стать публичным заявлением: будущий правитель разделяет цену восстановления. Гровер просит в любом случае точно указать сумму. У него нет желания жертвовать состояние, существующее только в газете."
 HSM_AET.27.a:0 "Поблагодарить его без газет."
 HSM_AET.27.a.tt:0 "Принять частный взнос и выдать обычную квитанцию."
 HSM_AET.27.b:0 "Обнародовать дар и его точную стоимость."
 HSM_AET.27.b.tt:0 "Сделать взнос публичным жестом общей ответственности."
 HSM_AET.30.t:0 "Знакомый почерк"
 HSM_AET.30.minor_patron.d:0 "Гровер замечает подпись раньше писарей. Имя знакомое, но ответ под ним принадлежит тому, кто не помнит прежнего разговора. На вопрос о старом обещании канцелярия графа присылает тот же ответ на более чистой бумаге.\n\nСреди бумаг — исключение для защищённого финансиста. Нынешний владелец печати утверждает, что никогда не обещал ему защиты. Можно сразу открыть расследование свидетелям или сначала негласно проверить доказательства перед публичным слушанием. Молчание даст время, но впоследствии придётся объяснить и его."
 HSM_AET.30.minor_law.d:0 "Гровер замечает подпись раньше писарей. Имя знакомое, но ответ под ним принадлежит тому, кто не помнит прежнего разговора. На вопрос о старом обещании канцелярия графа присылает тот же ответ на более чистой бумаге.\n\nСреди бумаг — присяга армии гражданскому закону. Новый приказ обращается с командованием как с личной собственностью, хотя подписанная присяга говорит обратное. Можно сразу открыть расследование свидетелям или сначала негласно проверить доказательства перед публичным слушанием. Молчание даст время, но впоследствии придётся объяснить и его."
 HSM_AET.30.minor_other.d:0 "Гровер замечает подпись раньше писарей. Имя знакомое, но ответ под ним принадлежит тому, кто не помнит прежнего разговора. На вопрос о старом обещании канцелярия графа присылает тот же ответ на более чистой бумаге.\n\nСреди бумаг — первое обязательство о помощи. Его скромные пределы исчезли из новых указаний. Можно сразу открыть расследование свидетелям или сначала негласно проверить доказательства перед публичным слушанием. Молчание даст время, но впоследствии придётся объяснить и его."
 HSM_AET.30.adult_patron.d:0 "Гровер возвращает в канцелярию два письма. На обоих стоит имя графа; одно и то же обязательство истолковано несовместимыми способами. В сопроводительной записке он спрашивает, с каким правительством ведёт переговоры. Ни один наставник не сможет отмахнуться от вопроса как от детского недоразумения.\n\nСреди бумаг — исключение для защищённого финансиста. Нынешний владелец печати утверждает, что никогда не обещал ему защиты. Можно сразу открыть расследование свидетелям или сначала негласно проверить доказательства перед публичным слушанием. Молчание даст время, но впоследствии придётся объяснить и его."
 HSM_AET.30.adult_law.d:0 "Гровер возвращает в канцелярию два письма. На обоих стоит имя графа; одно и то же обязательство истолковано несовместимыми способами. В сопроводительной записке он спрашивает, с каким правительством ведёт переговоры. Ни один наставник не сможет отмахнуться от вопроса как от детского недоразумения.\n\nСреди бумаг — присяга армии гражданскому закону. Новый приказ обращается с командованием как с личной собственностью, хотя подписанная присяга говорит обратное. Можно сразу открыть расследование свидетелям или сначала негласно проверить доказательства перед публичным слушанием. Молчание даст время, но впоследствии придётся объяснить и его."
 HSM_AET.30.adult_other.d:0 "Гровер возвращает в канцелярию два письма. На обоих стоит имя графа; одно и то же обязательство истолковано несовместимыми способами. В сопроводительной записке он спрашивает, с каким правительством ведёт переговоры. Ни один наставник не сможет отмахнуться от вопроса как от детского недоразумения.\n\nСреди бумаг — первое обязательство о помощи. Его скромные пределы исчезли из новых указаний. Можно сразу открыть расследование свидетелям или сначала негласно проверить доказательства перед публичным слушанием. Молчание даст время, но впоследствии придётся объяснить и его."
 HSM_AET.30.secretary_patron.d:0 "Гражданский секретарь сверяет новый приказ с протоколом районного архива. Подпись повторяет старый росчерк графа. Указания противоречат обязательству, которое по настоянию самой канцелярии когда-то записали дословно. Императорского свидетеля здесь нет; говорить придётся самим документам.\n\nСреди бумаг — исключение для защищённого финансиста. Нынешний владелец печати утверждает, что никогда не обещал ему защиты. Можно сразу открыть расследование свидетелям или сначала негласно проверить доказательства перед публичным слушанием. Молчание даст время, но впоследствии придётся объяснить и его."
 HSM_AET.30.secretary_law.d:0 "Гражданский секретарь сверяет новый приказ с протоколом районного архива. Подпись повторяет старый росчерк графа. Указания противоречат обязательству, которое по настоянию самой канцелярии когда-то записали дословно. Императорского свидетеля здесь нет; говорить придётся самим документам.\n\nСреди бумаг — присяга армии гражданскому закону. Новый приказ обращается с командованием как с личной собственностью, хотя подписанная присяга говорит обратное. Можно сразу открыть расследование свидетелям или сначала негласно проверить доказательства перед публичным слушанием. Молчание даст время, но впоследствии придётся объяснить и его."
 HSM_AET.30.secretary_other.d:0 "Гражданский секретарь сверяет новый приказ с протоколом районного архива. Подпись повторяет старый росчерк графа. Указания противоречат обязательству, которое по настоянию самой канцелярии когда-то записали дословно. Императорского свидетеля здесь нет; говорить придётся самим документам.\n\nСреди бумаг — первое обязательство о помощи. Его скромные пределы исчезли из новых указаний. Можно сразу открыть расследование свидетелям или сначала негласно проверить доказательства перед публичным слушанием. Молчание даст время, но впоследствии придётся объяснить и его."
 HSM_AET.30.a:0 "Открыть документы свидетелям."
 HSM_AET.30.a.tt:0 "Начать открытое расследование. Итоговое урегулирование личности добавит §G5 п. п.§! стабильности; его отдельная цена подписания — §Y35§! политической власти."
 HSM_AET.30.b:0 "Проверить доказательства за закрытыми дверями."
 HSM_AET.30.b.tt:0 "Провести негласное расследование, затем публичное слушание. Итоговое раскрытие прежней секретности снизит стабильность на §R5 п. п.§!; отдельная цена подписания остаётся прежней — §Y35§! политической власти."
 HSM_AET.31.t:0 "Имя за печатью"
 HSM_AET.31.d:0 "Писарь кладёт спорные приказы рядом с военными донесениями, которые Триммель подписывал прежде, чем присвоил имя графа. В обоих наборах повторяются одни и те же необычные исправления. Офицеры, доставлявшие распоряжения, подтвердили их происхождение; заверенные копии уже хранятся за пределами дворца. Даже если аудиенцию прервут, останутся свидетели и бумаги.\n\nИнтендант подтверждает, что благодаря спорным приказам снабжение не прекратилось. Но новую платёжную ведомость он не заверит под именем, которое теперь оспаривают свидетели. Триммель называет себя: он будет отстаивать своё командование на слушании, пока каждая его подпись не стала предметом спора. Писарь записывает признание и показания интенданта. Ни то ни другое не устанавливает судьбу настоящего графа."
 HSM_AET.31.a:0 "Записать признание под его настоящим именем."
 HSM_AET.31.a.tt:0 "Зафиксировать личность Триммеля и перейти к публичному слушанию. Юридическое утверждение и передача власти императору останутся приостановлены до подписания урегулирования."
 HSM_AET.32.t:0 "Власть заимствованного лица"
 HSM_AET.32.count.d:0 "Граф Клаудет занимает место перед собранием. Несколько делегатов встают ему навстречу; он просит сначала выслушать спорные приказы. Теперь им есть кому передать управление графством, но возвращение его имени само по себе не исправит сделанного от этого имени.\n\nОтстранение можно сопроводить фондом возмещения либо провести без компенсаций, если средств не хватает. Третий проект оставляет Триммеля открыто признанным протектором с письменными ограничениями: публичные счета, гражданское утверждение решений и никаких наследственных прав на графство или корону. Зал разделился. Делать вид, будто перед ним по-прежнему Клаудет, не позволено никому."
 HSM_AET.32.council.d:0 "Поиски графа Клаудета пока не принесли достоверных известий. Некоторые делегаты требуют объявить его погибшим, но писарь отказывается вносить слух в протокол. Если Триммеля отстранят, ответственность за графство примет гражданский совет до законного урегулирования.\n\nПросители ждут большего, чем смена имён: за договорами, подписанными обманным путём, остались неоплаченные счета. Компенсации облегчат переход; без них убытки останутся на пострадавших. Другие предлагают открыто оставить Триммеля протектором, подчинив его публичной отчётности и гражданскому утверждению решений. Ему придётся отказаться и от заимствованного лица, и от притязаний на наследственный титул."
 HSM_AET.32.a:0 "Отстранить его и оплатить возмещение."
 HSM_AET.32.a.tt:0 "Отстранить Триммеля от власти. Вернуть графа Клаудета, если его удалось найти; иначе назначить гражданский совет. Выплатить компенсации за непосредственный вред от подмены."
 HSM_AET.32.b:0 "Утвердить протектора под его именем."
 HSM_AET.32.b.tt:0 "Оставить Триммеля открыто признанным протектором с ограниченными полномочиями. Договор даёт §G+5%§! к организации дивизий и §R−0,15§! политической власти в день. Окончательное подписание ещё требуется."
 HSM_AET.32.c:0 "Отстранить его. На компенсации нет средств."
 HSM_AET.32.c.tt:0 "Отстранить Триммеля. Вернуть графа Клаудета, если его удалось найти; иначе назначить гражданский совет. Не выплачивать компенсации; непосредственный убыток останется на пострадавших."
 HSM_AET.33.t:0 "Собственная подпись"
 HSM_AET.33.trimmel_open.d:0 "Триммель дважды перечитывает статьи о командовании. Казначейство исполнит лишь распоряжения, скреплённые подписью гражданской администрации; за нарушение хартии собрание сможет отстранить его. Взамен он сохраняет признанное командование и бюджет, средства из которого учреждения будут отпускать под его собственным именем. Он проверяет, приложены ли согласованные военные счета, и подписывает документ как протектор. Наследственного титула это назначение не даёт.\n\nПри публичном чтении свидетель спрашивает, кто именно вправе отклонить незаконный приказ. Чиновница, чья подпись должна скреплять распоряжения, встаёт и представляется. Следившие за открытым расследованием могут сверить хартию с услышанными показаниями. Назначение записывают на имя Триммеля, а учреждения возвращаются к делам, отложенным на время слушания."
 HSM_AET.33.trimmel_quiet.d:0 "Триммель дважды перечитывает статьи о командовании. Казначейство исполнит лишь распоряжения, скреплённые подписью гражданской администрации; за нарушение хартии собрание сможет отстранить его. Взамен он сохраняет признанное командование и бюджет, средства из которого учреждения будут отпускать под его собственным именем. Он проверяет, приложены ли согласованные военные счета, и подписывает документ как протектор. Наследственного титула это назначение не даёт.\n\nПри публичном чтении делегат спрашивает, когда чиновники впервые узнали, чьи приказы исполняли. Даты в журнале негласного расследования вызывают ропот. Назначение Триммеля может вступить в силу с опубликованными ограничениями, но чиновникам, скрывавшим расследование, ещё предстоит ответить за промедление. Учреждения возвращаются к делам, отложенным на время слушания."
 HSM_AET.33.count_open.d:0 "Граф Клаудет берёт перо и просит оставить спорные приказы в приложении. Вернувшийся правитель, говорит он, не вправе наследовать только удобные страницы. Писарь освобождает место для подлинной подписи и не отпускает свидетелей, пока она не высохнет.\n\nСоглашение о возмещении остаётся среди обязательств восстановленной администрации. Свидетели открытого расследования могут сверить итоговый протокол с услышанным. Юридическую приостановку можно снять: имя, должность и ответственность наконец стоят в одной строке."
 HSM_AET.33.count_open_unpaid.d:0 "Граф Клаудет берёт перо и просит оставить спорные приказы в приложении. Вернувшийся правитель, говорит он, не вправе наследовать только удобные страницы. Писарь освобождает место для подлинной подписи и не отпускает свидетелей, пока она не высохнет.\n\nОтстранение без средств оставило требования неоплаченными; эта подпись фиксирует их, но не создаёт недостающей компенсации. Свидетели открытого расследования могут сверить итоговый протокол с услышанным. Юридическую приостановку можно снять: имя, должность и ответственность наконец стоят в одной строке."
 HSM_AET.33.count_quiet.d:0 "Граф Клаудет берёт перо и просит оставить спорные приказы в приложении. Вернувшийся правитель, говорит он, не вправе наследовать только удобные страницы. Писарь освобождает место для подлинной подписи и не отпускает свидетелей, пока она не высохнет.\n\nСоглашение о возмещении остаётся среди обязательств восстановленной администрации. Общество также узнаёт, как долго расследование оставалось тайным. Вопросы об этом молчании переживут сегодняшнюю церемонию. И всё же юридическую приостановку можно снять: имя, должность и ответственность наконец стоят в одной строке."
 HSM_AET.33.count_quiet_unpaid.d:0 "Граф Клаудет берёт перо и просит оставить спорные приказы в приложении. Вернувшийся правитель, говорит он, не вправе наследовать только удобные страницы. Писарь освобождает место для подлинной подписи и не отпускает свидетелей, пока она не высохнет.\n\nОтстранение без средств оставило требования неоплаченными; эта подпись фиксирует их, но не создаёт недостающей компенсации. Общество также узнаёт, как долго расследование оставалось тайным. Вопросы об этом молчании переживут сегодняшнюю церемонию. И всё же юридическую приостановку можно снять: имя, должность и ответственность наконец стоят в одной строке."
 HSM_AET.33.council_open.d:0 "Гражданский совет указывает при подписи должность и дату. Никто не подражает почерку графа и не заполняет неизвестность о его судьбе удобным некрологом. Сегодня полномочия возвращаются законной администрации, за решениями которой можно найти конкретных должностных лиц.\n\nСоглашение о возмещении остаётся среди обязательств восстановленной администрации. Свидетели открытого расследования могут сверить итоговый протокол с услышанным. Юридическую приостановку можно снять: имя, должность и ответственность наконец стоят в одной строке."
 HSM_AET.33.council_open_unpaid.d:0 "Гражданский совет указывает при подписи должность и дату. Никто не подражает почерку графа и не заполняет неизвестность о его судьбе удобным некрологом. Сегодня полномочия возвращаются законной администрации, за решениями которой можно найти конкретных должностных лиц.\n\nОтстранение без средств оставило требования неоплаченными; эта подпись фиксирует их, но не создаёт недостающей компенсации. Свидетели открытого расследования могут сверить итоговый протокол с услышанным. Юридическую приостановку можно снять: имя, должность и ответственность наконец стоят в одной строке."
 HSM_AET.33.council_quiet.d:0 "Гражданский совет указывает при подписи должность и дату. Никто не подражает почерку графа и не заполняет неизвестность о его судьбе удобным некрологом. Сегодня полномочия возвращаются законной администрации, за решениями которой можно найти конкретных должностных лиц.\n\nСоглашение о возмещении остаётся среди обязательств восстановленной администрации. Общество также узнаёт, как долго расследование оставалось тайным. Вопросы об этом молчании переживут сегодняшнюю церемонию. И всё же юридическую приостановку можно снять: имя, должность и ответственность наконец стоят в одной строке."
 HSM_AET.33.council_quiet_unpaid.d:0 "Гражданский совет указывает при подписи должность и дату. Никто не подражает почерку графа и не заполняет неизвестность о его судьбе удобным некрологом. Сегодня полномочия возвращаются законной администрации, за решениями которой можно найти конкретных должностных лиц.\n\nОтстранение без средств оставило требования неоплаченными; эта подпись фиксирует их, но не создаёт недостающей компенсации. Общество также узнаёт, как долго расследование оставалось тайным. Вопросы об этом молчании переживут сегодняшнюю церемонию. И всё же юридическую приостановку можно снять: имя, должность и ответственность наконец стоят в одной строке."
 HSM_AET.33.a:0 "Подписать, опубликовать и отвечать."
 HSM_AET.33.a.tt:0 "Опубликовать урегулирование и снять юридическую приостановку. Убрать действующий на время расследования подмены модификатор §R−10%§! к стабильности.\n§YОтдельное немедленное изменение стабильности:§!\n§YОткрытое расследование:§! §G+5 п. п.§!.\n§YНегласное расследование:§! §R−5 п. п.§! при раскрытии прежней секретности."
 HSM_AET.40.t:0 "Приглашение из Грайфвальда"
 HSM_AET.40.minor.d:0 "[AET.GetName] просит разрешения принять Гровера и его двор. В обращении обещаны личная защита и подходящее жильё; владение имперской столицей не объявляется правом забрать ребёнка из-под нашей опеки.\n\nОтвет должен быть явным. Мы можем разрешить переезд двора либо сохранить нынешние обязанности. Государственная опека потребует отдельного соглашения в Грайфвальде. Посланник ждёт с незапечатанным конвертом для ответа. Само по себе наше молчание ничего не разрешает."
 HSM_AET.40.adult.d:0 "[AET.GetName] предлагает принять Гровера и его двор как защищённых гостей. Он совершеннолетний, и приглашение не предполагает опеки над его личностью. Любые государственные полномочия от его имени потребуют отдельного соглашения с ним.\n\nНынешнего хозяина двора просят согласиться на передачу обязанностей по защите. Мы можем разрешить переезд или отказать. Ответ не обещает ни престола, ни передачи земель, ни политического подчинения. Посланнику велено дождаться решения, а не считать молчание разрешением."
 HSM_AET.40.a:0 "Дать согласие на переезд двора."
 HSM_AET.40.a.tt:0 "Передать настоящего Гровера и обязанности по его защите Грайфвальду только при сохранении действительности приглашения и наших полномочий. Земли не передаются."
 HSM_AET.40.b:0 "Отказать. Двор остаётся здесь."
 HSM_AET.40.b.tt:0 "Отказать в разрешении и сохранить двор у нас. Грайфвальд получит наш ответ."
 HSM_AET.41.t:0 "Возвращённый конверт"
 HSM_AET.41.d:0 "Переписка о дворе вернулась без действительного разрешения на поездку. Нынешнее приглашение либо отклонено, либо его уже нельзя законно принять. Секретарь подшивает его к несостоявшимся договорённостям, а не к извещениям о смерти.\n\nНа основании старого запроса экипаж не отправят. Канцелярии помощи продолжат работу, а любое следующее обращение должно учитывать настоящий двор и действительные на тот момент обстоятельства."
 HSM_AET.41.a:0 "Записать ответ."
 HSM_AET.41.a.tt:0 "Нынешний запрос не даёт разрешения на перемещение двора."
 HSM_AET.42.t:0 "Книга прибытий"
 HSM_AET.42.minor.d:0 "Сопровождение доставляет двор в Грайфвальд на основании полученного согласия. Принимающий писарь проверяет имена раньше багажа. Гровер ждёт у окна и смотрит, как сундук пытаются протащить в заведомо узкую дверь.\n\nТеперь книга подтверждает его присутствие здесь. Завершённая поездка определяет, кто обеспечивает его защиту; она не решает, кто вправе управлять от его имени. Для этого графству и двору предстоит вместе прочесть другой документ."
 HSM_AET.42.adult.d:0 "Гровер сам подписывает книгу прибытий. Документы сопровождения подтверждают согласие, по которому его двор переехал в Грайфвальд. Он просит копию, а затем спрашивает, какое учреждение отвечает за предполагаемое территориальное соглашение.\n\nОбязанности по его защите перешли к другой стороне; политического согласия за него никто не подписывал. Теперь двор действительно здесь, и любой государственный мандат следует предложить Гроверу как взрослому, вправе принять его или отказаться."
 HSM_AET.42.changed.d:0 "В переписке отмечена завершённая передача двора, но нынешний список уже не подтверждает присутствия Гровера у нас. Писарь отказывается превращать прежнее извещение о прибытии в новые полномочия действовать за него.\n\nПоездку можно учесть как свершившийся факт. Любая опека, публичная аудиенция или передача власти должна зависеть от нынешних обстоятельств двора. Сама по себе эта запись ничего не говорит о смерти."
 HSM_AET.42.a:0 "Вести книгу точно."
 HSM_AET.42.a.tt:0 "Зафиксировать завершённую передачу; последующий мандат требует отдельного законного соглашения."
 HSM_AET.3.choices_tt:0 "Цена выбора: бюджетная помощь — §Y50§! политической власти; частный кредит — §Y25§!."
 HSM_AET.12.choices_tt:0 "Цена выбора: бюджетное содержание двора — §Y50§! политической власти; финансирование через покровителя — §Y25§!."
 HSM_AET.14.choices_tt:0 "Цена выбора: независимый суд — §Y75§! политической власти; защита финансиста не требует политической власти и даёт §G35§!."
 HSM_AET.15.choices_tt:0 "Цена выбора: пересмотр гражданских соглашений — §Y50§! политической власти после суда над финансистом либо §Y100§!, если его защитили; сохранение соглашений не требует политической власти и даёт §G25§!."
 HSM_AET.16.choices_tt:0 "Подписание договора о передаче стоит §Y50§! политической власти."
 HSM_AET.22.choices_tt:0 "Цена выбора: равные голоса земель или представительство по населению — по §Y35§! политической власти."
 HSM_AET.23.choices_tt:0 "Учреждение договорной унии стоит §Y35§! политической власти."
 HSM_AET.24.choices_tt:0 "Цена выбора: гарантированная доля местных бюджетов или объединение доходов для общих работ — по §Y35§! политической власти."
 HSM_AET.25.choices_tt:0 "Цена выбора: избрание председателя собранием или советом земель — по §Y35§! политической власти."
 HSM_AET.30.choices_tt:0 "Цена выбора: открытое расследование — §Y25§! политической власти; негласное — §Y10§!. Последующее подписание итогового соглашения стоит ещё §Y35§!."
 HSM_AET.32.choices_tt:0 "Цена выбора: отставка с возмещением ущерба — §Y50§! политической власти; утверждение протектором — §Y75§!. Только при запасе менее §Y50§! политической власти доступна отставка без возмещения: она не требует политической власти, но снижает стабильность на §R8 п. п.§!."
 HSM_AET.33.choices_tt:0 "Подписание окончательного соглашения по делу о подмене стоит §Y35§! политической власти."
 HSM_AET.1.imperial_cloudet.d:0 "В пакете с имперской дороги — три неоплаченных счёта, просьба прислать муку и письмо в министерство, которое больше не отвечает. Прежний адрес для пересылки аккуратно зачёркнут.\n\nКогда-то связи с Империей служили Грайфвальду страховкой от соседей. Теперь у этих связей появились лица: писарь у ворот, носильщик со списком пропавших товарищей. Графство может предложить хлеб, кров и канцелярию, где прочтут прошение. Для более громких обещаний ещё придётся заслужить право подписи.\n\nКлаудет ставит печать рядом с просьбой о муке. «Пообещаем то, что пекарь сможет выполнить»."
 HSM_AET.1.changed_cloudet.d:0 "На столе всё ещё лежит старая записка о внешней политике: торговать с обоими соседями, никому не обещать лишнего. Рядом — промокшее письмо с имперской дороги. Его автор спрашивает, где ночевать перемещённым лицам.\n\nСмотрел ли Грайфвальд на запад или держался в стороне, ответа в записке нет. Писари составляют более скромное обязательство: укрыть тех, кто доберётся до нас, честно вести счета и не обещать престола, которым мы не вправе распоряжаться. Первая повозка уже у ворот.\n\nКлаудет ставит печать рядом с просьбой о муке. «Пообещаем то, что пекарь сможет выполнить»."
