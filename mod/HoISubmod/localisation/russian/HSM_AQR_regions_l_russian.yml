l_russian:
 HSM_AQR.10.a:0 "Наши статьи обязывают и нас."
 HSM_AQR.10.d:0 "Сегодня утром писарь принёс областные реестры в государственный архив. Их знакомые переплёты кажутся маленькими между высокими стеллажами. Делегаты поддержавших нас городов требуют ответа: сохранят ли силу обещания, данные во времена нашей слабости, теперь, когда мы управляем столицей? Первые приглашения отправятся в другие провинции. Каждой предстоит ответить от собственного имени."
 HSM_AQR.10.t:0 "Областная печать в столице"
 HSM_AQR.100.a:0 "Пусть суды рассмотрят жалобы."
 HSM_AQR.100.b:0 "Капитаны будут отвечать непосредственно передо мной."
 HSM_AQR.100.d:0 "Мишель кладёт рядом со сводками последних боёв конфискованный учебник. Его владельца арестовали за заметки на полях, посвящённые королевской власти. Ответственный капитан настаивает, что промедление стоило бы жизней. Сидящий напротив судья спрашивает, какая именно фраза в книге приказывала стрелять.\n\nГерцог уже слышал эти доводы, нередко от друзей. Но теперь война окончена, а решение скрепят его печатью. Можно подчинить чрезвычайные распоряжения проверке местных судов. Можно сохранить единое исполнительное командование, отвечающее перед самим Мишелем. Выбор разочарует тех, кто считал, что победа уже разрешила спор. Герцог поворачивает учебник к себе и ещё раз читает подчёркнутую строку."
 HSM_AQR.100.t:0 "Приказы на столе Мишеля"
 HSM_AQR.101.a:0 "Дать представителям действенное право пересмотра."
 HSM_AQR.101.b:0 "Пусть кабинет действует, а затем отвечает собранию."
 HSM_AQR.101.d:0 "Кресло, отведённое Мишелю, стоит рядом со скамьями делегатов. Герцог остаётся на ногах, пока печатник читает проект присяги. Министр обязан объяснить спорное распоряжение собранию, однако в тексте почти ничего не сказано о времени до этих объяснений.\n\nВетеран клубов предлагает дать местным представителям право приостанавливать спорные меры до слушания. Другая делегатка вспоминает поезд с припасами, задержанный перепиской трёх комитетов. Она выступает за кабинет, способный действовать сразу, а затем отвечать на вопросы депутатов. Мишель просит подготовить окончательную формулировку. Он готов подписать конституцию, которая будет доставлять неудобства правительству, если каждый участник соглашения понимает, как именно она действует."
 HSM_AQR.101.t:0 "Незанятое кресло"
 HSM_AQR.102.a:0 "Пусть местные слушания установят факты."
 HSM_AQR.102.b:0 "Дать общему исполнительному органу полномочия для расследования."
 HSM_AQR.102.d:0 "Писарь вложил в одну папку два прошения. В первом требуют освободить задержанного роялиста, во втором обвиняют его в приказе убить соседа. Член комитета узнаёт обе подписи. С одним просителем он сражался рядом, у другого одалживал печатный станок.\n\nКлубы больше не могут решать такие дела по дружбе или громкости одобрительных возгласов. Часть делегатов предлагает открытое рассмотрение жалоб местными судами и выборными комитетами. Другие требуют общего исполнительного органа, способного быстро расследовать дела и применять одинаковые правила по всей Риле. Обе стороны обещают судебное разбирательство. Спор идёт о том, кто вправе начать действовать прежде, чем весь комитет заслушает доказательства."
 HSM_AQR.102.t:0 "Имя под обвинением"
 HSM_AQR.103.a:0 "Поставить комитет перед выборными представителями."
 HSM_AQR.103.b:0 "Сохранить сильную исполнительную власть для защиты нового порядка."
 HSM_AQR.103.d:0 "Перед залом заседаний рабочие возвращают на мостовую последние камни баррикады. Внутри оратор кокардьеров предупреждает, что враги республики лишь сменили одежду. Делегатка небольшого клуба поднимает неподписанный приказ о задержании. Её брат носил донесения для комитета, а теперь стража увела его неизвестно куда.\n\nНикто не предлагает вернуть власть старому двору. Спорят о том, должен ли комитет подчинить свои распоряжения контролю выборных гражданских представителей или сохранить сильную исполнительную власть, способную совместно направлять мастерские и вооружённые силы. Оратор смотрит в окно. Баррикада защищала этот зал, но не может навсегда перегородить улицу. Делегатка всё ещё стоит с поднятым листом, ожидая ответа."
 HSM_AQR.103.t:0 "Когда разбирают баррикаду"
 HSM_AQR.104.a:0 "Двор будет отвечать своим просителям."
 HSM_AQR.104.b:0 "Дать наместникам власть завершить работу."
 HSM_AQR.104.d:0 "Дворянин кладёт семейную печать рядом с проектом назначения для своего племянника. Напротив сельский представитель ставит доску от так и не починенного моста. Оба поддержали Жанну; оба пришли за обещанным. Маркиза просит офицеров остаться, пока читают обязательства её нового правительства. Первый проект сохраняет право прошений и местные гарантии, на которые двор должен ответить прежде, чем требовать новой службы. Второй даёт назначенным ею наместникам право руководить восстановлением по всей марке, а дворян обязывает предоставить работников и подводы. Прежних военных хозяев не возвращает ни один проект. Сторонникам предстоит решить, связывают ли подписи их самих столь же крепко, как маркизу."
 HSM_AQR.104.t:0 "Цена их подписей"
 HSM_AQR.105.a:0 "Пусть города сформируют совет."
 HSM_AQR.105.b:0 "Общий кабинет, подотчётный представителям."
 HSM_AQR.105.d:0 "Кресло рядом с Жанной оставили пустым, пока коалиция не решит, кто вправе его занять. Делегат-республиканец предлагает совет от городов, который сможет оспаривать назначения и отказывать в согласии на новые повинности. Офицер возражает: из-за отдельных разрешений каждая разбитая дорога будет ждать очередного заседания. Другой проект создаёт общий кабинет, назначенный Жанной, но обязанный защитить свою программу перед представителями. Он сможет руководить работами через муниципальные границы, а суды будут принимать жалобы. Маркиза кладёт между проектами первоначальное обращение. Её возвращение к управлению зависит от соглашения, в котором партнёры узнают прежние обещания и после исчезновения общего врага."
 HSM_AQR.105.t:0 "Место рядом с Жанной"
 HSM_AQR.106.a:0 "Передать гражданским союзникам их долю власти."
 HSM_AQR.106.b:0 "Сохранить национальное командование для восстановления."
 HSM_AQR.106.d:0 "Колетт узнаёт железнодорожника ещё до того, как он подходит к столу. Он принёс расписание, использованное во время восстания; на обороте записаны обещания гражданским организаторам. Офицеры представили план национального восстановления под её руководством. Союзники отвечают проектом совета, который будет утверждать военные расходы и поставит гражданских министров над мастерскими. Колетт может принять такое разделение власти, сохранив командование по поручению совета. Либо она создаст более сильную национальную исполнительную власть, оставив армию в центре восстановления, но допустив организованное гражданское представительство. Рабочий кладёт старое расписание между ними. Сотрудничество провело революцию через опасность; теперь его условия должны выдержать мир."
 HSM_AQR.106.t:0 "Союзники приносят свою программу"
 HSM_AQR.107.a:0 "Пусть портовый совет выслушает город."
 HSM_AQR.107.b:0 "Единое управление портом с ясными обязанностями."
 HSM_AQR.107.d:0 "Верфяной гудок звучит, пока Деннис слушает прошение. Никто не встаёт: мастера договорились, что это заседание важнее первой смены. Они предлагают портовый совет, где рабочие и купцы смогут оспаривать реквизиции и подавать жалобы на стражу. Капитаны предлагают единое управление портом, отвечающее за грузы, ремонт и безопасность, с назначенными гражданскими чиновниками для разрешения споров. Деннис проводит старым шрамом по подлокотнику. Он знает, как захватить гавань, а город знает, какой ценой это делается. Теперь его правительству предстоит решить, будет ли обычная работа опираться на соглашение с жителями или на командование, способное обеспечить движение у каждого причала."
 HSM_AQR.107.t:0 "Гудок после боёв"
 HSM_AQR.108.a:0 "Коммуны сохранят право отзыва."
 HSM_AQR.108.b:0 "Дать общему секретариату рабочие полномочия."
 HSM_AQR.108.d:0 "Пекарь принёс ключ от склада ополчения. Он спрашивает, какому собранию его теперь передать. Один делегат предлагает федеральный совет, участники которого связаны местными поручениями и могут быть отозваны до следующей сессии. Другой указывает на ожидающие хлебные подводы: совместному секретариату нужны полномочия распределять припасы и организовывать оборону без отдельного разрешения на каждую поездку. Его мандат по-прежнему будет исходить от коммун, но разногласия придётся разбирать уже после выдачи общих распоряжений. В комнате становится тихо, когда пекарь кладёт ключ на стол. Они обещали революцию без хозяев. Они также обещали не оставлять голодные кварталы наедине с нуждой. Сейчас оба обещания требуют ответа."
 HSM_AQR.108.t:0 "У кого останется ключ от пекарни?"
 HSM_AQR.109.a:0 "Сильное государство должно выслушать возражение."
 HSM_AQR.109.b:0 "Дать директории полномочия действовать согласованно."
 HSM_AQR.109.d:0 "Следователь читает показания купца, затем переходит к речи товарища по революции. Делегат прерывает его: первое касается украденной поставки, второе — разногласия о командовании. Основатели движения настаивают, что Аквелия не выживет, доверяя каждому, кто объявит себя другом. Некоторые всё же предлагают национальный совет с открытыми слушаниями и правом оспаривать распоряжения безопасности. Другие хотят директорию, способную координировать промышленность и оборону; её собственные инспекторы будут проверять злоупотребления после исполнения срочных решений. Обе стороны намерены строить сильное революционное государство. Вопрос в том, смогут ли жители оспорить обвинение прежде, чем запущенные против них учреждения закончат свою работу и вынесут решение."
 HSM_AQR.109.t:0 "Два имени на одной странице"
 HSM_AQR.110.a:0 "Включить советы в парламентское соглашение."
 HSM_AQR.110.b:0 "Дать избранной коалиции твёрдые исполнительные полномочия."
 HSM_AQR.110.d:0 "Коммунар разворачивает бумагу, привезённую с лесной встречи. Последняя строка откладывает спор о собственности до победы. Представитель МАФ кладёт рядом проект трудового закона и напоминает: победа уже наступила. Один вариант даёт муниципальным и производственным советам постоянное участие в социальной политике, а избранному собранию поручает разрешать споры. Другой доверяет восстановление более сильному коалиционному кабинету, отвечающему перед парламентом за общую промышленную программу. Оба сохраняют выборы с соперниками, законную оппозицию и возможность потерять должность. Работница лечебницы ждёт с новой заявкой на припасы. Правительство необходимо сформировать, но партнёров не попросят отказаться от права спорить с ним. Лесное соглашение должно пережить первое открытое разногласие."
 HSM_AQR.110.t:0 "Вопросы, оставленные в лесу"
 HSM_AQR.111.a:0 "Дать общинам право оспаривать требования."
 HSM_AQR.111.b:0 "Моё правительство будет согласовывать требования и отвечать за них."
 HSM_AQR.111.d:0 "Деревенский возчик привёз во дворец сломанное колесо и расписку о королевской реквизиции. Его упряжку забрали во время боёв. Теперь он спрашивает, вспашет ли верность его поле весной. Управляющий Гадиффера предлагает возмещение, но возчик указывает на расписку: это уже обещали.\n\nОфицер предупреждает, что право каждой деревни отклонять требования лишит герцогство возможности участвовать в общей обороне. Местные делегаты просят законного способа оспаривать то, чего они не могут предоставить. Гадиффер может поставить такие слушания между короной и подданными либо поручить своему правительству согласовывать требования и лично отвечать за тяжесть повинностей. Возчик ждёт, прислонив колесо к стене."
 HSM_AQR.111.t:0 "Собственная телега герцога"
 HSM_AQR.112.a:0 "Пусть общины участвуют в составлении программы."
 HSM_AQR.112.b:0 "Дать общему совету средства для её согласованного проведения."
 HSM_AQR.112.d:0 "Класс слишком мал для собрания, поэтому организаторы ABC открывают окна и выносят доску во двор. Студентка записывает план восстановления Виновии. Прежде чем она заканчивает вторую строку, рабочий мельницы спрашивает, почему все выступающие до сих пор оказались из одной аудитории.\n\nВопрос вызывает смех, затем неловкое молчание. Местные советы могли бы сами определять приоритеты и посылать подотчётных делегатов на общий съезд. Более сильный координационный совет мог бы направлять немногочисленных учителей и возможности мастерских туда, где они нужнее всего. Оба проекта обещают социальную республику. Движению предстоит решить, какую часть своей программы оно готово позволить переписать новым соседям."
 HSM_AQR.112.t:0 "Кому достанется мел?"
 HSM_AQR.113.a:0 "Сохранить подотчётность гвардии общинам."
 HSM_AQR.113.b:0 "Согласовывать действия гвардии через общую исполнительную власть."
 HSM_AQR.113.d:0 "Капитан местной гвардии приносит прошение в ратушу. Его бойцы защищали округ во время сражений, и теперь он хочет постоянное командование, способное направлять их туда, где возникает опасность. Смотрительница зала помнит, как те же бойцы помогали ей носить суп раненым. Она помнит и обещание соседям: их гвардия останется перед ними в ответе.\n\nРыцарям верности предстоит решить, как сохранить это обещание. Городские советы могли бы непосредственно управлять своими учреждениями, либо общий исполнительный орган координировал бы гвардию и мастерские всей Виновии. Капитан кладёт меч на свободную скамью. На этот раз никто не просит его возглавить торжественное шествие."
 HSM_AQR.113.t:0 "Гвардия и ратуша"
 HSM_AQR.114.a:0 "Выслушать провинции прежде, чем утвердить правила."
 HSM_AQR.114.b:0 "Поручить проведение программы профессиональному исполнительному органу."
 HSM_AQR.114.d:0 "Проект гражданского кодекса раскрыт под прошением, на котором остался грязный след когтя. Его автор приехал из деревни, где привычные права пользования водой не укладываются в категории проекта. Юрист общества объясняет, что равное гражданство требует общих правил. Бывший учитель предлагает объяснить эти правила крестьянину, ожидающему за дверью.\n\nНовое правительство может поручить представителям провинций проверять влияние реформ на местный уклад либо дать профессиональному исполнительному органу право проводить общую программу с последующим рассмотрением споров. Ни один подход не оправдывает произвола. Разногласие касается того, сколько реформаторы должны знать о жизни гражданина, прежде чем решать, что в ней необходимо изменить."
 HSM_AQR.114.t:0 "Прошение со следом грязного когтя"
 HSM_AQR.20.a:0 "Мы не поддержим такое государственное устройство."
 HSM_AQR.20.b:0 "Подписать статьи о присоединении."
 HSM_AQR.20.d:0 "Посланник доставил статьи нового аквелийского правительства. Местные суды и выборные советы сохранят повседневные обязанности, но внешняя политика, армия и общая казна перейдут столице. Это приглашение стать частью единого государства. Наши подписи прекратят отдельную власть областного правительства. Делегаты попросили закрыть двери на время обсуждения."
 HSM_AQR.20.t:0 "Столица приглашает наших делегатов"
 HSM_AQR.200.a_desc:0 "Рильская хартия прибыла в общегосударственное собрание вместе с делегатами провинции. Получив мандат говорить от имени вновь объединённой страны, Мишель раскрывает её перед собой. Делегатка спрашивает, будут ли её гарантии действовать за прежними границами герцогства. Мишель предлагает ей отметить нужный пункт.\n\nПисцам потребуется ещё один чистовик. На этот раз никто не предлагает обойтись королевской подписью без обсуждения. Правительству за столом предстоит выслушивать жалобы из мест, где Мишель никогда не бывал. Перед выходом делегатка забирает черновик: дома ей придётся объяснить каждое исправление."
 HSM_AQR.200.b_desc:0 "Опыт управления Рилой теперь предстоит применить к нуждам целой страны. Представители провинций доверили Мишелю общегосударственный мандат, и его первый кабинет собирается над картой, залитой чаем. Курьерам нужны открытые дороги, командирам необходимо знать, чьи распоряжения обязательны.\n\nМишель вычёркивает просьбу о бессрочных чрезвычайных полномочиях. Правительство будет отдавать согласованные приказы, но каждый министр подпишет те, за которые отвечает лично. Придворные обнаруживают, что близость к герцогу приносит обязанности. Когда заседание заканчивается, один из них остаётся проверять список задержанных обозов: теперь жалобы возчиков поступают прямо к нему."
 HSM_AQR.200.t:0 "Новая ответственность короны"
 HSM_AQR.201.a_desc:0 "Делегаты объединённой Аквелии привозят собственные поправки к рильской хартии. Мишель не может разрешить их спор ссылкой на герцогский титул: место короны в новом устройстве должно определить общегосударственное собрание. Он занимает кресло, пока представитель провинции оспаривает лежащий перед депутатами проект.\n\nПрения затягиваются до вечера. Когда зажигают лампы, приезжие всё ещё спорят, и никто не приказывает закрыть двери. Соглашение, прежде ограничивавшее одного герцога, становится обещанием провинций друг другу. Мишель передаёт секретарю записку с просьбой принести ещё бумаги. Его собственной речи придётся подождать до следующего заседания."
 HSM_AQR.201.b_desc:0 "Новый аквелийский кабинет наследует рильский порядок: сначала действовать, затем защищать решение перед собранием. Первое распоряжение о железных дорогах затрагивает несколько провинций и приводит в зал разгневанную делегацию. Мишель выслушивает её вопросы рядом с министрами, подписавшими приказ.\n\nЕго герцогский титул не определяет положение общегосударственной короны: это по-прежнему предстоит решить собранию. Сегодня же спор идёт о товарных вагонах. Прочность конституции проверяется в подобных будничных столкновениях, когда исполнительная власть должна оставаться в зале и отвечать. Министр уже встал, но, заметив взгляд Мишеля, снова садится и раскрывает свои бумаги."
 HSM_AQR.201.t:0 "Хартия выходит за пределы Рилы"
 HSM_AQR.202.a_desc:0 "В первом собрании объединённой Аквелии заседают те, кто спорил с клубами на протяжении всей революции. Один из них просит слова и получает его к явному недовольству нескольких ветеранов. Он рассказывает о провинциальной газете, редактору которой угрожают за критику нового правительства.\n\nПредседатель вызывает ответственного делегата. Победа дала клубам большую страну и множество граждан, готовых с ними спорить. К концу слушания приезжие понимают, куда обращаться с жалобами. Ветераны узнают, что такие заседания не всегда будут приятными. Газетчик тем временем записывает ответ, который собирается напечатать полностью."
 HSM_AQR.202.b_desc:0 "Общий исполнительный орган Аквелии получает первое требование согласованно открыть провинциальные железные дороги. Приказ выходит прежде, чем собрание заканчивает обсуждать расписание. Через несколько дней оппозиционная газета называет решение оскорблением городов, чьи грузы остались ждать.\n\nМинистр приходит на следующее заседание с журналом отправленных распоряжений. Правительство выбрало решительные действия и теперь должно защищать установленные приоритеты. Клубы не распустили оппозицию и не обещали соглашаться с ней. Они дали ей того, кто обязан отвечать. Редактор занимает место у прохода, чтобы хорошо слышать, и раскрывает блокнот на чистой странице."
 HSM_AQR.202.t:0 "Оппозиция занимает места"
 HSM_AQR.203.a_desc:0 "Собрание объединённой Аквелии требует от революционного комитета передать полномочия, которыми тот прежде пользовался беспрепятственно. Делегаты приносят связку первоначальных чрезвычайных приказов. Одни считают передачу победой, другие опасаются, что люди, не сражавшиеся со старым режимом, растратят завоёванное.\n\nПровинциальный депутат просит изучить бумаги, прежде чем выступать с речью. Комитет соглашается. Республика распространяет равенство перед законом на свои земли, и этот закон должен касаться тех, кто охранял её первые собрания. Депутат развязывает бечёвку осторожно: несколько подписей ему знакомы, а одно из дел касается его родного города."
 HSM_AQR.203.b_desc:0 "Теперь диспетчерская комитета обслуживает объединённую Аквелию. Представители заводов ждут рядом с офицерами решений о тех же перегруженных железных дорогах. Общая исполнительная власть быстро определяет приоритеты, и её участники уже привыкли к этому. За дверью прежние союзники спрашивают, когда им позволят обсуждать принятые решения.\n\nПредседатель велит принести ещё одну скамью. Сохранение власти комитета не превратило каждого критика в монархиста. Самым трудным будет выслушивать республиканские возражения, не принимая вызванную ими задержку за доказательство измены. Первым садится делегат клуба, который когда-то предоставил комитету свой единственный печатный станок."
 HSM_AQR.203.t:0 "Республика за пределами баррикад"
 HSM_AQR.204.a_desc:0 "Первая делегация прибывает в объединённую столицу с прошением в простой полотняной обложке. Её участники слышали, что Жанна когда-то провела сельскую жалобу мимо солдат у своих дверей. Теперь такого же рассмотрения требует их провинция. Опыт управления Весткипом подготовил её к общегосударственным обязанностям; её мандат опирается на согласие представителей, а не одно лишь родовое имя. Она велит приготовить места для свидетелей. Позади ждут дворяне, надеявшиеся, что новый двор избавит их от неудобных прежних обещаний. Просителей принимают первыми, и никто не предлагает убрать их скромную папку со стола."
 HSM_AQR.204.b_desc:0 "Приёмный зал столицы заполнен наместниками, ожидающими распоряжений Жанны. Посланник провинции приносит полномочия, данные местным собранием, и спрашивает, где проходит граница между его властью и их властью. Маркиза добилась соглашения об общем правительстве, но не унаследовала вместе с титулом каждую местную должность. Она отмечает полномочия наместников, а остальные вопросы возвращает посланнику. Во дворе их обозные офицеры уже распределяют подводы между собой. Порядок, помогший вернуть её марку, теперь должен служить стране, с которой пришлось договариваться. Следующее распоряжение отправят лишь после сверки обеих грамот."
 HSM_AQR.204.t:0 "Первая аквелийская аудиенция"
 HSM_AQR.205.a_desc:0 "Провинциальные делегаты привозят стулья из своих залов заседаний. Один слишком широк для отведённого места. Последовавший спор касается не обивки и не церемониала: провинция хочет убедиться, что её учреждения найдут место в новом аквелийском устройстве. Жанна просит объяснить, какие полномочия делегатам поручили сохранить. Её общегосударственный мандат опирается на опыт провинциальной коалиции, но никакое наследственное притязание не заменило бы их согласия. К вечеру схема мест изменилась, а в договор внесли местный суд, забытый в первом проекте. Делегация оставляет свой широкий стул там, где сможет заседать и завтра."
 HSM_AQR.205.b_desc:0 "Первый общий кабинет получает два противоречивых распоряжения об одном железнодорожном узле. На обоих стоят действительные провинциальные печати. Министр предъявляет их представителям и просит единых полномочий для открытия линии. Жанна поддерживает просьбу, но коалиция требует объяснить, чьи грузы будут ждать и почему. Кабинет получает разрешение составить общее расписание. На следующей сессии ему предстоит отвечать за результат. У Аквелии появилось правительство, способное действовать поверх региональных границ, однако соглашение, благодаря которому оно возникло, не стало пустой формальностью. Представители оставляют обе прежние инструкции в материалах предстоящего отчёта."
 HSM_AQR.205.t:0 "Места для делегатов за пределами Весткипа"
 HSM_AQR.206.a_desc:0 "Бывшая подпольщица приходит в столичное ведомство снабжения с назначением, утверждённым советом. Полковник у входа отправляет её в очередь посетителей. Она просит ещё раз прочесть подпись. Колетт спускается из зала заседаний и сама представляет нового министра служащим. Объединение увеличило обязанности армии, но принесло гражданским партнёрам обещанные полномочия. Вечером министр отклоняет реквизицию, к которой не приложено объяснение. Офицерам предстоит научиться его давать. На прежних тайных встречах её просили достать недостающие грузы; теперь она вправе спросить, кому они понадобились и почему нельзя обойтись без них."
 HSM_AQR.206.b_desc:0 "Штаб восстановления Колетт включил провинциальные мастерские в общую программу снабжения. Первый поезд приходит вовремя, доставляя инструменты, которые три города не смогли бы получить порознь. На платформе рабочий делегат указывает на груз, изготовленный во время обязательных сверхурочных работ, и спрашивает, когда состоится обещанное гражданское слушание. Колетт называет дату и приказывает ответственному офицеру явиться. Национальная исполнительная власть сохранила командование, и её достижения видны каждому. Видны и те, кто оплачивает эту спешку своим трудом. Делегат забирает копию распоряжения, чтобы на заводе знали, кого готовить к выступлению."
 HSM_AQR.206.t:0 "Первое гражданское назначение"
 HSM_AQR.207.a_desc:0 "Делегаты внутренней провинции наблюдают, как докер оспаривает флотскую реквизицию перед портовым советом. Они ожидали, что Деннис решит дело одним окриком. Вместо этого совет спрашивает, какой гражданский груз задержат, и отправляет офицера за ответом. Соглашение, объединившее их провинции в Аквелию, обещало нечто подобное. Опыт управления Придеей подготовил Денниса к общегосударственным обязанностям; новый мандат не превратил каждый город в палубу его корабля. Делегаты забирают порядок слушаний, собираясь потребовать такой же возможности для своих жителей. Адмирал замечает это, но не велит вернуть документ."
 HSM_AQR.207.b_desc:0 "Первое общегосударственное расписание перевозок висит там, где Деннис прежде держал карту знакомых прибрежных вод. Связи с внутренними областями согласованы с провинциями, принявшими его руководство после распада прежнего политического порядка. Капитан-ветеран требует первоочередного обслуживания судна старого товарища. Новый начальник порта отказывает: другой груз уже обещан северным мастерским. Деннис изучает расписание и оставляет отказ в силе. Централизованное управление мало чего добьётся, если любая личная дружба сможет отменить решение назначенного чиновника. Капитан уходит недовольным, но порт впервые исполняет обещание, которое подкреплено не личным знакомством с адмиралом."
 HSM_AQR.207.t:0 "Больше, чем обещание адмирала"
 HSM_AQR.208.a_desc:0 "Коммуны новой федерации присылают замену делегату, одобрившему нежелательный сбор припасов. Он возражает: место в общем совете заслужено во время боёв. Его собственное собрание предъявляет поручения, которыми он пренебрёг. Совет принимает замену и продолжает работу. За пределами Придеи обещанное право отзыва стало возможностью, которой действительно пользуется небольшая община. Отозванный делегат уходит сердитым, однако хлебные подводы отправляются в путь тем же днём. Федерация пережила смену представителя, не объявляя несогласный квартал врагом. Его преемнице передают карту перевозок и объясняют, за какое поручение ей предстоит отвечать перед собранием."
 HSM_AQR.208.b_desc:0 "Общий секретариат перенаправил муку в затопленный квартал раньше, чем смогли собраться соседние общины. Решение спасло дневную выпечку, но одна коммуна обнаружила, что её запасы ниже обещанных. На федеральном собрании делегат требует объяснения перед всеми. Секретариат предъявляет донесения о повреждённых дорогах и принимает график восполнения запасов. Коммуны Аквелии дали центру настоящие координационные полномочия. Чтобы они не превратились в постоянное превосходство, добрых намерений будет недостаточно всякий раз, когда срочный приказ оставит кого-то без припасов. Делегат увозит домой график, который его соседи смогут проверить по прибывающим подводам."
 HSM_AQR.208.t:0 "Делегата отправляют домой"
 HSM_AQR.209.a_desc:0 "На первом общегосударственном слушании делегата мастерских обвиняют в подрыве революции за возражение против распределительного приказа. Он просит совет выслушать рабочих, которые его избрали. Их показания касаются сломанных станков и невозможного срока поставки, а не иностранного заговора. Обвинение снимают, приказ пересматривают. Движение по-прежнему говорит о врагах Аквелии, но новые учреждения отказались превращать практическое возражение в доказательство измены. За дверями зала делегат отвечает на вопросы товарищей, не ожидавших его возвращения. Он показывает исправленное распоряжение: теперь его подпись означает согласие с работой, которую действительно можно выполнить."
 HSM_AQR.209.b_desc:0 "Общие распоряжения директории включили провинциальные литейные предприятия в единый производственный график. Впервые мастерская получает недостающую деталь без обращений в три соперничающих комитета. Одновременно ведомство безопасности требует разрешений на собрания, которым прежде было достаточно свободной комнаты. Бывшая связная ждёт снаружи с прошением от собственной ячейки. Директория облегчила управление промышленностью объединённой страны, но затруднила доверие между знакомыми товарищами. Её инспекторам предстоит разобрать жалобу на правила, которые они сами применяют. Связная узнаёт дежурного и всё равно должна предъявить пропуск, прежде чем тот согласится принять её письмо."
 HSM_AQR.209.t:0 "Обвинение в столице"
 HSM_AQR.21.a:0 "Опубликовать гарантии."
 HSM_AQR.21.d:0 "Подписанные статьи прибыли. За воском и лентами стоят учреждения, которые предстоит объединить, офицеры, чьи звания нужно подтвердить, и деревни, ожидающие защиты от нового соглашения. Послы вернутся с экземплярами, скреплёнными обеими печатями."
 HSM_AQR.21.t:0 "Ещё одна областная печать"
 HSM_AQR.210.a_desc:0 "Первое муниципальное голосование в объединённой стране даёт бывшему союзнику-коммунару достаточно мест, чтобы оспорить жилищный план коалиции. Наши организаторы приходят в арендованный зал, ожидая нападок на всё, что строили вместе. Вместо этого они находят предложение изменить квартирную плату и очередность ремонта повреждённых домов. Спор остаётся острым и законным. Парламентское устройство Аквелии привело прежних партнёров в учреждения, где сотрудничество не требует постоянного согласия. Коалиции предстоит выиграть спор прежде, чем голосование. У входа висит объявление о следующей встрече, и никто не требует снять его после окончания заседания."
 HSM_AQR.210.b_desc:0 "Коалиционный кабинет направил средства восстановления заводам, обслуживающим сразу несколько провинций. Производство ожило, но город, оставшийся ждать жилищной программы, приглашает оппозиционного оратора представить другой бюджет. Министр предлагает отложить собрание, пока работу кабинета не станут лучше понимать. Его парламентские коллеги отказывают. Правительство получило полномочия координировать вложения, а не прекращать спор о собственном выборе. На следующих выборах его кандидатам придётся защищать общую программу, включая обещания, отложенные ради центральных приоритетов. Городской зал останется открыт, и министр тоже сможет выступить, если придёт отвечать на вопросы жителей на общих основаниях."
 HSM_AQR.210.t:0 "Оппозиция снимает зал"
 HSM_AQR.211.a_desc:0 "В Виновии Гадиффер научился отвечать на верность деревень защитой от непосильных королевских требований. Теперь представители объединённой страны доверили ему общегосударственный мандат, перенеся знакомый виновийский спор за гораздо больший стол.\n\nДелегатка провинции спрашивает, действуют ли гарантии герцогских деревень и для её земляков. Гадиффер узнаёт вопрос прежде, чем она заканчивает. Обещание, помогавшее удержать герцогство, должно пережить момент, когда он сам становится властью, от которой другим провинциям нужна защита. Герцог просит принести прежний текст соглашения и оставляет для делегатки место рядом с собой."
 HSM_AQR.211.b_desc:0 "Опираясь на опыт управления Виновией, Гадиффер получил от представителей провинций мандат на управление объединённой Аквелией. Письма на его столе теперь приходят из мест, которые управляющему приходится искать на карте. Каждое требует решения, а нескольким просителям нужны одни и те же вагоны.\n\nГерцог создаёт общее исполнительное управление по виновийскому принципу: власть, предъявляющая требования, отвечает за их последствия. Верность семье привела его к этой борьбе, но не разрешит нынешних споров. Министрам предстоит узнать страну, за которую они взялись отвечать. Гадиффер отдаёт им карту, оставив письма у себя для вечернего чтения."
 HSM_AQR.211.t:0 "Верность за пределами Виновии"
 HSM_AQR.212.a_desc:0 "Съезд объединённой Аквелии оказался шумнее, чем ожидали основатели ABC. Сельская учительница возражает против плана университетских друзей, делегат мастерской предлагает то, чего никто из них не обсуждал до революции. Председатель призывает к терпению, затем понимает, что зал делает именно то, к чему движение его призывало.\n\nСоциальная федерация не может оставаться закрытым семинаром первых организаторов. Делегаты вместе исправляют программу. К вечеру на доске видны разные почерки, а первоначальный автор помогает новичку освободить место для ещё одной строки. Учительница остаётся после заседания, чтобы переписать предложения своей деревни начисто."
 HSM_AQR.212.b_desc:0 "Общий совет объединённой Аквелии получает столько просьб прислать учителей, что организаторы ABC не могут выполнить их сразу. Первые группы направляются в округа, где школы закрыты дольше всего. Делегация другой провинции приезжает в ярости: обещанный ей визит отложен.\n\nСовету предстоит объяснить приоритеты, не принимая разочарование за невежество. Его участники получили право координировать восстановление страны и теперь видят, сколько разумных требований соперничает за одни ресурсы. Конспекты, прежде дававшие ответ на всё, лежат закрытыми на столе председателя. Он просит делегатов рассказать, как их школа пережила последнюю зиму."
 HSM_AQR.212.t:0 "Новые голоса на съезде"
 HSM_AQR.213.a_desc:0 "Рыцари верности объясняют своё участие в объединении Аквелии обещанием конфедерации. Виновия надёжнее сохранит свои учреждения среди провинций, признающих одинаковые права, чем под властью очередного далёкого и ничем не ограниченного центра. Новому собранию предстоит убедительно доказать это за пределами их родины.\n\nДелегат небольшой провинции просит сохранить местную церемонию, неизвестную виновийцам. Председатель предлагает рассказать о ней. Именно такую договорённость предлагали рыцари: их традиции заслуживают защиты потому, что её заслуживают местные общины, в том числе общины с незнакомыми обычаями. Слушатели откладывают приготовленные возражения и дают гостю закончить."
 HSM_AQR.213.b_desc:0 "Объединённая Аквелия ставит перед рыцарями верности задачу, которую нельзя решить одной заботой о Виновии. Предложенная ими конфедерация должна защищать учреждения провинций и обеспечивать общую оборону. Они приняли более сильную исполнительную власть для согласования этой обороны, и другие провинции хотят знать пределы её полномочий.\n\nПервое совещание общего командования начинается с провинциальной хартии рядом с картой походов. Офицеры получают согласованные распоряжения, местные представители оспаривают требования за пределами договора. Обоснование объединения должно выдержать новую возможность рыцарей отдавать приказы на чужой родине. Председатель возвращает спорную заявку офицеру для повторного обсуждения."
 HSM_AQR.213.t:0 "Союз, который стоит защищать"
 HSM_AQR.214.a_desc:0 "Участники общества прежде заимствовали доводы у далёких республиканских движений. В объединённой Аквелии им приходится отвечать провинциям, способным прислать делегацию уже к утру. Местная газета резко критикует предложенные назначения на государственную службу. Автора приглашают объяснить возражения перед собранием.\n\nОн приезжает в ожидании выговора и находит для себя место среди выступающих. Связи общества помогли построить республику, но принадлежность к этому кругу не может стать условием права быть услышанным. Председатель просит редактора полностью напечатать ответ. После заседания критик остаётся поговорить с кандидатом, чьё назначение оспаривал, и задаёт ему ещё несколько вопросов."
 HSM_AQR.214.b_desc:0 "Новая аквелийская администрация направляет подготовленных служащих в провинции, о которых общество прежде знало лишь по нескольким письмам. Указания ясны, уверенность велика. В первом докладе говорится, что городской совет отказывается менять давний порядок содержания колодцев.\n\nИсполнительный орган вызывает служащего объяснить, что именно улучшат общие правила. Профессиональная власть должна обосновывать себя, не прячась за дипломом. Общество выбрало решительное управление; его репутация зависит от того, поможет ли опыт распознать ошибку прежде, чем она станет приказом. Служащий возвращается с записями местного смотрителя колодцев, которых не счёл нужным приложить к первоначальному докладу."
 HSM_AQR.214.t:0 "Республика читает своих критиков"
 HSM_AQR.22.a:0 "Мы получили их ответ."
 HSM_AQR.22.d:0 "Областные делегаты не приедут. Их письмо отвергает передачу власти столице. Министрам, обещавшим быстрое объединение, теперь придётся объяснить, примут ли они отказ соседа или потребуют полномочий для осуществления общегосударственного притязания."
 HSM_AQR.22.t:0 "Пустое место за столом"
 HSM_AQR.30.continue:0 "Присоединиться к общегосударственному движению; продолжить за Аквелию."
 HSM_AQR.30.d:0 "Революция окончена, и посланники Аквелии прибыли за ответом. Они привезли приказы о передаче наших гарнизонов и областного управления национальному правительству. Подписавшие приведут своих сторонников в движение, уже управляющее столицей. По другую сторону стола возражают: страну должны возглавить здесь. Посланники уедут с нашими подписями либо с объявлением войны."
 HSM_AQR.30.dismiss:0 "Обстоятельства изменились. Закрыть переговоры."
 HSM_AQR.30.game_over:0 "Войти в состав Аквелии и завершить нашу отдельную кампанию."
 HSM_AQR.30.incorporate:0 "Присоединиться к общегосударственному движению."
 HSM_AQR.30.lead:0 "Отказать. Мы будем сражаться за руководство Аквелией."
 HSM_AQR.30.t:0 "Одна Аквелия"
 HSM_AQR.300.a_desc:0 "Урегулирование касается тех земель Герцланда, которые сейчас находятся в наших руках. Пограничные округа входят в Аквелию, остальные владения передаются зависимому правительству. На первом слушании сельский представитель предъявляет два налоговых требования с разными печатями. Он хочет знать, к кому обращаться, когда вернутся оба сборщика.\n\nУполномоченный Мишеля садится рядом с переводчиком. Местные суды должны рассматривать споры о новой границе, а зависимому правительству необходимо пространство для собственных решений. Документ остаётся неподписанным, пока деревня не получит понятного ответа. Представитель терпеливо ждёт, положив оба требования на край стола."
 HSM_AQR.300.b_desc:0 "Курьер доставляет Мишелю проект раздела земель Герцланда под нашим контролем. Пограничными округами будет управлять Аквелия, остальные владения составят территорию зависимого государства. Рядом с картой лежит просьба разрешить каждому гарнизону самостоятельно договариваться с соседними городами.\n\nМишель отклоняет это удобное решение. Кабинет должен дать общие указания и назначить отвечающих за них офицеров. Прошения местных жителей будут поступать к этим офицерам через переводчика, а не путешествовать между штабами. Новой границе нужна власть, способная дать определённый ответ. Герцог возвращает карту курьеру только после того, как на ней появляются имена ответственных."
 HSM_AQR.300.t:0 "Граница и печать"
 HSM_AQR.301.a_desc:0 "Герцландское урегулирование разделяет только земли, которыми сейчас владеет наша страна. Аквелия принимает пограничные округа, остальные владения получают зависимое правительство. Его делегаты приезжают со знакомым Мишелю требованием: соглашение не должно оставлять местному собранию лишь обсуждение приказов, уже изданных в чужой столице.\n\nСтол вскоре покрывается исправленными страницами. Опыт Рилы не даёт аквелийским представителям убедительных оснований отвергать каждую поправку. Полномочия зависимого правительства необходимо изложить ясно, а присоединённым округам предоставить голос в новой стране. Один из делегатов узнаёт формулировку из рильской хартии и просит прочитать её вслух до конца."
 HSM_AQR.301.b_desc:0 "Кабинет представляет собранию раздел наших герцландских владений. Он предлагает общее управление пограничными округами, входящими в Аквелию, и зависимое правительство на оставшейся территории. Ответственный министр объясняет, что поезда и таможенные посты не могут ждать разрешения каждого спора о формулировках.\n\nДепутаты разрешают приступить к работе, затем требуют его возвращения с соглашениями, подписанными на местах. Мишель смотрит, как министр записывает дату в блокнот. Свободу исполнительной власти сопровождает знакомая обязанность: объяснять свои действия представителям, которых не было рядом при издании приказа. Для этого заседания секретарь заранее заказывает переводчика."
 HSM_AQR.301.t:0 "Хартия по обе стороны границы"
 HSM_AQR.302.a_desc:0 "Новая граница разделяет герцландские земли во владении Аквелии между присоединёнными пограничными округами и зависимой республикой. На таможне совет одного из округов спрашивает, сможет ли школа продолжать обучение на языке, на котором дети говорят дома.\n\nАквелийские делегаты годами требовали голоса для провинций. Они предлагают совету изложить возражения и приглашают представителей зависимой республики к обсуждению. Для соглашения недостаточно перевести воззвание. Жители должны получить возможность изменить сам текст. Учительница просит оставить ей копию проекта: вечером её будут читать родители учеников, ещё не уверенные, что их действительно готовы выслушать."
 HSM_AQR.302.b_desc:0 "Исполнительный орган устанавливает единый порядок управления герцландскими пограничными округами, входящими в Аквелию. Оставшиеся земли под нашим контролем передаются зависимой республике. Её служащие прибывают на границу и обнаруживают три разных распоряжения о проезде продовольственных телег.\n\nАквелийский комиссар отзывает противоречащие приказы и выдаёт обеим администрациям общее расписание. Жалобы будут поступать в определённое учреждение, а письменные решения можно оспорить. Умеренные клубы предпочли координацию отдельным переговорам у каждого переезда. Но путникам по-прежнему полагается понятное объяснение. Комиссар выходит к ожидающим возчикам с переводчиком и исправленным расписанием в руках."
 HSM_AQR.302.t:0 "Слушание на таможне"
 HSM_AQR.303.a_desc:0 "Раздел наших герцландских владений приводит за стол переговоров местных республиканцев. Пограничные округа входят в Аквелию, оставшаяся территория получает зависимую республику. Один из гостей говорит, что боролся с прежними правителями, чтобы далёкие чиновники перестали решать всё за его город. Ему знаком язык наших воззваний. Теперь он спрашивает, признаём ли мы его требование.\n\nГражданские делегаты комитета оставляют место для поправок. Отказ от чрезвычайных полномочий мало значит, если соседней республике позволено лишь повиноваться. Пограничный договор должен дать местным представителям то, что они смогут защитить перед своими городами."
 HSM_AQR.303.b_desc:0 "Исполнительная власть считает земли Герцланда под нашим контролем рубежом, которому необходимо согласованное управление. Пограничные округа войдут в Аквелию, остальные владения образуют зависимую республику. Её делегаты признают необходимость сотрудничества, но возражают, когда офицер обращается с их советом как с отделом собственного штаба.\n\nКомитету предстоит разрешить созданный им спор. Общая безопасность требует ясной ответственности, однако зависимому правительству нужно пространство для управления. Офицеру поручают вернуться с соглашением, а не с копией собственных приказов. На следующее заседание он приносит карту, где впервые отмечены предложения местного совета."
 HSM_AQR.303.t:0 "Республиканцы напротив"
 HSM_AQR.304.a_desc:0 "У новой согласованной границы генерал просит Жанну передать соседнюю зависимую монархию под его постоянный надзор. Он называет это естественной наградой за обеспечение безопасности. Местные представители привезли другое толкование договора: их правитель сохраняет обещанные суды и право назначать должностных лиц. Жанна велит прочесть оба документа перед офицерами. Когда-то ей понадобился союз с дворянством, чтобы избавиться от военной опеки; защита меньшего соседа теперь стоит ей благодарности победоносного командира. Он забирает прошение, но не отводит взгляд. После победы спорить с генералами не стало легче."
 HSM_AQR.304.b_desc:0 "Пограничные наместники докладывают, что согласованные округа можно снабжать без расширения военной власти вглубь Герцланда. Один командир всё же присылает карту, объявляя следующий речной рубеж необходимой линией обороны. Жанна помнит офицеров, находивших подобные причины распоряжаться её собственным двором. Она возвращает карту с неизменной договорной границей и назначает совместную проверку складов. Её правительство сохраняет твёрдый контроль над своими пограничными землями, а соседняя зависимая монархия — отдельное управление. Победа не дала полномочий занять ещё одну провинцию. Генералу придётся обосновать снабжение в пределах уже принятого соглашения."
 HSM_AQR.304.t:0 "Победоносные генералы"
 HSM_AQR.305.a_desc:0 "Представители зависимого государства Герцланда приходят на первое совместное заседание без военного сопровождения внутри зала. Они спрашивают, когда можно пересмотреть отношения покровительства и кто рассмотрит споры о новой границе. Провинциальные союзники Жанны узнают эти вопросы: когда-то они задавали ей почти те же самые. Оборонное соглашение читают вместе с гарантиями гражданскому правительству соседа и его местным судам. Граница остаётся согласованной. Секретарь отводит место для будущего пересмотра, и теперь меньшая делегация участвует в выборе даты. Её министрам предстоит вернуться домой с ответом, который они смогут защитить перед собственным собранием."
 HSM_AQR.305.b_desc:0 "Общий оборонный график готов, но кабинет соседнего государства Герцланда отвергает статью, позволяющую офицерам без предупреждения перенаправлять гражданские поезда. Наши министры предупреждают: новые переговоры задержат оборудование складов. Жанна возвращает спорную страницу совместной комиссии, вместо того чтобы утвердить её единолично. Исправленный график даёт военным перевозкам преимущество в согласованных пределах, оставляя соседнему правительству ответственность за гражданское сообщение. Координация будет жёстче, чем первоначально хотели провинции, но её условия подлежат пересмотру. Кабинету предстоит объяснить компромисс тем же представителям, которые наделили его полномочиями. График не изменяет ни границ, ни устройства соседней страны."
 HSM_AQR.305.t:0 "Собственный кабинет соседа"
 HSM_AQR.306.a_desc:0 "Делегация Герцланда возражает против советника, который начал утверждать назначения в её железнодорожной службе. Наш гражданский министр просит офицера предъявить статью, дающую такое право. Её нет. Колетт поддерживает отзыв и отправляет замену с письменными обязанностями в пределах согласованного оборонного устройства. Переданные пограничные округа остаются под нашим управлением, соседнее государство сохраняет гражданское правительство. Левые партнёры, когда-то переносившие шифрованные сообщения между гарнизонами, теперь следят, означает ли освобождение за границей ту же сдержанность, которой они добивались дома. Новый советник начинает работу с визита к местному министру, а не с распоряжения начальнику станции."
 HSM_AQR.306.b_desc:0 "Пограничный штаб представляет Колетт график размещения баз, инструкторов и использования железных дорог зависимого государства Герцланда. Командиры хотят, чтобы порядок пережил любую мыслимую чрезвычайную ситуацию. Гражданский делегат спрашивает, что остаётся решать соседнему правительству. Колетт очерчивает пределы согласованных объектов, оставляя остальное управление его министрам. Военное сотрудничество будет тесным, но не даёт права идти в следующую провинцию. Вернувшись в штаб, офицеры должны составить план демобилизации, не рассчитывая, что новая кампания позволит его отложить. У гражданских союзников уже есть вопросы о том, когда домой вернутся железнодорожники и заводские рабочие."
 HSM_AQR.306.t:0 "Кто отдаёт приказы советникам?"
 HSM_AQR.307.a_desc:0 "Транспортная делегация Герцланда называет свой железнодорожный склад сухопутной гаванью. Деннису нравится сравнение; затем он спрашивает, кому жаловаться, когда наши военные грузы займут все свободные вагоны. В ответ называют гражданскую комиссию, созданную по пограничному соглашению. Наш портовый совет направляет представителей договориться о доступе и возмещении убытков. Зависимый партнёр будет перевозить товары через континент, сохраняя обычное управление своими делами. Деннис оставляет церемониальную карту сложенной. Сегодня важно, сможет ли земледелец провести своё зерно через склад после разгрузки солдат. Без ответа на этот вопрос договор останется красивой бумагой."
 HSM_AQR.307.b_desc:0 "Новый начальник перевозок приносит Деннису расписание, связывающее контролируемые пограничные округа со складами зависимого партнёра в Герцланде. Оно позволяет доставлять грузы без новых территориальных требований. Капитан возражает, что местные проверяющие будут задерживать поезда. Начальник предъявляет согласованные часы осмотра и подписанное обязательство соседнего правительства. Деннис велит капитану соблюдать график. Сеть должна работать и в отсутствие адмирала, через чиновников, чьи полномочия понятны обеим сторонам. Флотская слава может обеспечить приём у министра, но не отправит каждый поезд. Капитан получает адрес служащего, который ответит за задержку следующего состава."
 HSM_AQR.307.t:0 "Гавань без воды"
 HSM_AQR.308.a_desc:0 "Делегаты коммун Герцланда приезжают в дорожных плащах, в которых пересекли новую границу. Они спрашивают, почему оборонное устройство всё ещё ставит их в зависимость от большой федерации, говорящей о равенстве. Наши представители не могут ответить указанием на карту. Они предлагают внести пересмотр отношений в общую повестку рядом с уже согласованными гарантиями пограничным общинам. Нынешнее соглашение продолжает действовать, но его временный характер должен что-то значить. Ради права быть услышанным никто не обязан отказываться от местного языка или собрания. Гости занимают места и сами зачитывают свой первый вопрос."
 HSM_AQR.308.b_desc:0 "Объединённый штаб просит ещё на один сезон сохранить власть над путями снабжения коммун Герцланда. По его словам, враждебные правительства за пределами региона всё ещё угрожают революции. Приглашённый делегат спрашивает, может ли далёкий враг продлевать этот мандат бесконечно. Секретариат сохраняет согласованную координацию обороны, но должен предъявить участвующим коммунам просьбу с ясными издержками и пределами. Контролируемое пограничье не расширяется вместе с офицерской картой. Тем, кто понёс обещание освобождения за пределы Аквелии, теперь приходится объяснять, почему общая защита всё ещё требует неравных полномочий. Делегат остаётся ждать ответа до конца заседания."
 HSM_AQR.308.t:0 "Гости за общим столом"
 HSM_AQR.309.a_desc:0 "Пограничная комиссия докладывает, что согласованное буферное государство в Герцланде выполняет свои обязанности. Офицер безопасности просит распространить его полномочия на газеты, критикующие наших советников. Национальный совет вместо этого вызывает советников ответить на замечания. Зависимый сосед сохраняет обязательства по оборонному договору, а его жители — гарантии собственным учреждениям, установленные на переговорах. Аквелия обеспечила контроль над стратегическими округами, названными в соглашении. Совет отказывается считать каждый спор за этой границей новым окружением, а каждый местный обычай — препятствием национальному выживанию. Газеты получают приглашение направить представителей на слушание вместе с советниками."
 HSM_AQR.309.b_desc:0 "После сдерживания главной пограничной угрозы директория получает предложение бессрочно сохранить чрезвычайный контроль перевозок. Авторы указывают на возможных врагов за пределами буфера. Соседнее правительство Герцланда вместо этого спрашивает, когда его гражданские заводы получат обещанные места в расписании поездов. Наши комиссары сохраняют централизованное управление согласованной оборонной сетью, но не могут удовлетворить обе просьбы без нового политического решения. Граница остаётся неизменной. На складе рабочие ждут рядом с готовыми товарами, пока инспектор изучает разрешения. У доктрины постоянной опасности теперь есть повседневная хозяйственная цена. Завершённая военная задача ещё не вернула привычную работу станции."
 HSM_AQR.309.t:0 "Пределы доктрины окружения"
 HSM_AQR.310.a_desc:0 "Соседняя социальная республика Герцланда направляет делегацию, обеспокоенную ценой оборонного соглашения. Её министры хотят открыть школы прежде, чем сохранять нормы военного снабжения. Наши рабочие представители поддерживают просьбу, а вернувшиеся солдаты спрашивают, когда будет готово их жильё. Парламентской комиссии предстоит рассмотреть оба вопроса вместе с гарантиями включённым пограничным округам. Зависимость пока остаётся частью соглашения, но гражданские приоритеты партнёра получили место на переговорах. Ни одна делегация не согласна, чтобы очередная чрезвычайная ситуация бесконечно откладывала социальные обещания её избирателям. Комиссия приглашает обе стороны на открытое обсуждение расходов."
 HSM_AQR.310.b_desc:0 "Кабинет предлагает общий график восстановления, связывающий наши пограничные заводы с мастерскими зависимой республики Герцланда. Её правительство принимает согласованные заказы, но просит парламент сохранить средства для местных больниц. Соглашение поступает в оба законодательных собрания с открыто обозначенными спорными цифрами. Наше правительство может доказывать необходимость сосредоточения ресурсов, но не вправе объявлять каждое возражение нелояльностью союзу. Пограничное урегулирование дало партнёра и ограниченную границу, а не повод отказаться от выборов. Министры готовятся защищать бюджет перед представителями, которые могут его отклонить. Коалиция должна убедить их, даже если это задержит исполнение её общего плана."
 HSM_AQR.310.t:0 "Бюджет после демобилизации"
 HSM_AQR.311.a_desc:0 "Герцландское урегулирование передаёт наши пограничные владения Аквелии, а оставшуюся территорию в нашем распоряжении — зависимому правительству. Делегаты Гадиффера встречают знакомую тревогу на другом языке: жители хотят знать, вправе ли следующая проходящая армия забрать всё необходимое.\n\nГерцог присылает гарантии, первоначально составленные для Виновии. Их потребуется обсудить и приспособить к местным условиям, но смысл остаётся понятным. У зависимого соседа должно быть правительство, способное говорить от имени общин. Представители Гадиффера не могут обещать уважение дома и считать то же требование за границей дерзостью. Переговоры начинаются с рассказа о последней реквизиции."
 HSM_AQR.311.b_desc:0 "Гадиффер требует единый доклад о землях Герцланда под нашим контролем. Пограничные округа войдут в Аквелию, остальные владения получат зависимое правительство. Офицеры предлагают отдельные правила снабжения каждого гарнизона, согласуемые по мере возникновения нужды.\n\nГерцог вспоминает возчика, доставившего сломанное колесо во дворец. Он поручает министрам согласовать общий порядок с зависимым правительством и определить, кто ответит за спорные требования. Твёрдое руководство должно помогать находить ответственного. Иначе граница унаследует все отговорки, прежде звучавшие из уст королевских квартирмейстеров. Офицеры забирают доклад, чтобы вписать туда имена вместо названий ведомств."
 HSM_AQR.311.t:0 "Обещание доходит до границы"
 HSM_AQR.312.a_desc:0 "Урегулирование разделяет герцландские земли в нашем владении между аквелийскими пограничными округами и зависимой республикой. Добровольцы ABC приезжают с книгами и обнаруживают, что в деревне уже есть учительница. Она благодарит за помощь, затем спрашивает, почему все подаренные учебники предполагают, что её ученики говорят дома по-аквелийски.\n\nПриезжие садятся вместе с ней пересматривать план занятий. Доступ к образованию не должен требовать отказа от местного языка. Представители по обе стороны новой границы присоединяются к разговору с тем же требованием участия, которое прежде привело ABC в сельские классы. Учительница приносит собственные тетради."
 HSM_AQR.312.b_desc:0 "Координационный совет направляет восстановительные группы на земли Герцланда, которыми теперь владеет наша страна. Пограничные округа входят в Аквелию, остальные владения получают зависимую республику. Первое расписание отправляет учителей вместе с ремонтниками, чтобы занятия начинались под исправными крышами.\n\nМестные организаторы возражают против единой учебной программы, прибывшей вместе с припасами. Представитель совета исправляет указания: координация определяет направление помощи, а преподавание должно учитывать язык и опыт учеников. Расписание позволит открыть класс, но не решит, что следует говорить внутри. Учителям предлагают остаться на встречу с родителями прежде, чем начинать первый урок."
 HSM_AQR.312.t:0 "Школа на двух языках"
 HSM_AQR.313.a_desc:0 "Урегулирование разделяет наши герцландские владения между пограничными округами, входящими в Аквелию, и зависимым правительством на оставшейся территории. Делегация просит сохранить благотворительное общество и зал встреч местных ветеранов. Рыцари верности сразу узнают просьбу: когда-то они почти теми же словами обращались к аквелийскому чиновнику.\n\nПредставители движения приглашают смотрителя общества участвовать в составлении гарантий. Защита культуры не может заканчиваться у границ Виновии. Зависимое правительство и присоединённые общины должны сохранить место для учреждений собственной истории, даже если их знамёна выглядят непривычно. Смотритель показывает старую опись зала и объясняет, что означают вышитые на знамёнах имена."
 HSM_AQR.313.b_desc:0 "Общая исполнительная власть предлагает согласованные пограничные патрули на герцландских землях в нашем владении. Пограничные округа входят в Аквелию, на остальных владениях создаётся зависимое правительство. Местные офицеры согласны обмениваться сведениями, но возражают против замены всех привычных эмблем частей аквелийскими.\n\nВозглавляющий переговоры рыцарь убирает это указание из проекта. Общему командованию нужны надёжная связь и ясная ответственность, а не уничтожение памяти тех, кто ему служит. Договор будут оценивать по способности зависимого соседа сотрудничать, сохраняя собственные учреждения. Офицеры возвращаются к карте, оставив спорные образцы эмблем лежать в стороне от остальных бумаг."
 HSM_AQR.313.t:0 "Традиции соседа"
 HSM_AQR.314.a_desc:0 "Герцландское урегулирование передаёт пограничные округа в нашем владении Аквелии, а остальные земли — зависимой республике. Юристы общества приносят на переговоры проект конституции. Переводчик останавливается на термине, чьё аккуратное определение отменило бы несколько местных способов совместного пользования землёй.\n\nСельский делегат просит рассказать об этих порядках прежде, чем переводить фразу. Юристы соглашаются его выслушать. Конституционное сотрудничество не может исходить из того, что знакомые слова всюду означают одно и то же. Зависимому правительству нужен договор, который граждане способны понять и изменить. Переводчик откладывает готовый вариант и берёт новый лист."
 HSM_AQR.314.b_desc:0 "Исполнительный орган направляет профессиональную комиссию для устройства земель Герцланда под нашим контролем. Пограничные округа войдут в Аквелию, остальные владения получат зависимую республику. Комиссары привозят общий график открытия учреждений и порядок распределения прошений между двумя правительствами.\n\nНа первой встрече местные юристы указывают, что предложенные бланки не учитывают несколько обычных прав. Комиссии предстоит исправить указания, сохранив согласованность, ради которой её прислали. Администрация может обладать полномочиями и всё же нуждаться в объяснениях тех, кому жить по её решениям. Комиссары остаются за столом, когда первоначально отведённое для встречи время заканчивается."
 HSM_AQR.314.t:0 "Конституции нужен перевод"
 HSM_AQR.410.JEB_cocardiers:0 "Кокардьеры"
 HSM_AQR.410.JEB_constitutional:0 "Разрешить переговоры о примирении с Мишелем на основе хартии."
 HSM_AQR.410.JEB_moderate:0 "Умеренные клубы"
 HSM_AQR.410.JEB_royal:0 "Лоялисты Мишеля"
 HSM_AQR.410.later:0 "Продолжить переговоры позднее."
 HSM_AQR.410.marais:0 "Делегаты Марэ занимают места вместе; вокруг собираются представители нескольких небольших клубов. Когда очередной оратор начинает причислять их голоса к своим, представительница Марэ просит прочесть соглашение, которое они якобы подписали. Такого соглашения нет.\n\nОна кладёт на стол их предложения. Комитету понадобится их согласие, и они намерены обсуждать обещания, даваемые от его имени. Остальные делегаты подвигают стулья ближе.\n\nСреди возможных шагов звучит и имя Мишеля. Примирение с изгнанным герцогом всё ещё потребует приглашения и согласованных условий. Пока клубам предстоит решить, с кем они смогут договориться об общей программе."
 HSM_AQR.410.rev:0 "Клубы собираются в зале, где на окнах ещё остались бумажные полосы времён боёв. Посыльные приносят прошения с улиц, поддержавших революцию: жители спрашивают, когда обещания со стен дойдут до их домов.\n\nОдин из делегатов произносит имя изгнанного Мишеля. В зале становится тихо. Примирение с герцогом потребует приглашения и условий, приемлемых для собрания; пока никто не вернул его в Рилу.\n\nПредседатель призывает выступающих к порядку. Прежде чем участвовать в общем споре о будущем Аквелии, рильским революционерам предстоит договориться о том, чего они потребуют от правительства."
 HSM_AQR.410.royal:0 "Капитаны Мишеля принесли во дворец донесения. Представительница города кладёт рядом пачку расписок о реквизициях и ждёт, пока дочитают последний отчёт о победе роялистов. Герцог просит секретаря развязать пачку.\n\nНа первой расписке стоит подпись, которой никто за столом не узнаёт. Ответственный капитан обещает разобраться; делегатка спрашивает, куда её соседям нести остальные бумаги.\n\nМишель оставляет расписки перед собой. Рила удержалась на стороне короны. Теперь её правительству предстоит дать пережившим бои жителям основания доверять наступившему миру."
 HSM_AQR.410.t:0 "Рильское собрание"
 HSM_AQR.410.unprepared:0 "Делегаты приносят прошения, но общей программы для собрания у них нет. Людей, передававших сообщения во время боёв, всё ещё просят разрешать споры, на которые у них нет полномочий.\n\nПисарь оставляет заголовок соглашения пустым. Каждая группа может объяснить, с чем хотела покончить; договориться о будущем оказывается труднее. Председатель предлагает начать с жалоб тех, кто ждёт за дверью.\n\nИм предстоит найти партнёров, готовых разделить ответственность за мирную жизнь. Для переговоров с прежним противником потребуются условия, приемлемые для собственных сторонников."
 HSM_AQR.411.JRR_absolutist:0 "Обсудить возвращение Жанны с собранием роялистов."
 HSM_AQR.411.JRR_coalition:0 "Обсудить возвращение Жанны на основе коалиции."
 HSM_AQR.411.JRR_colette:0 "Определить гражданские обязательства командования Колетт."
 HSM_AQR.411.later:0 "Продолжить переговоры позднее."
 HSM_AQR.411.rev:0 "Гражданская организаторка приходит в штаб Колетт со списком недоставленных грузов муки. Часовой помнит её по восстанию, но писарь направляет к офицеру, уже уехавшему на станцию. Она садится и отказывается уходить.\n\nЗакончив утренние доклады, Колетт застаёт её всё ещё в ожидании. Армия сохранила командование после победы; теперь её гражданские союзники хотят знать, кто будет отвечать за мирную работу.\n\nПолковница велит адъютанту найти стулья для делегатов. Их предложения должны дать городам голос, который услышат в штабе."
 HSM_AQR.411.royal:0 "После контрпереворота лоялистов комендатура остаётся в руках офицеров Бассо. Сегодня посланники Жанны принесли прошения, уже дважды прошедшие через гарнизон без ответа. Офицер тянется за привычной военной печатью. Его просят подождать.\n\nМаркиза хочет создать гражданскую администрацию, способную принимать такие жалобы от собственного имени. Командование по-прежнему принадлежит Бассо, и её сторонникам предстоит договориться о полномочиях, которые она получит.\n\nНа стол кладут два экземпляра предложенных условий: один командующему, другой Жанне. Прежде чем ставить подписи, обеим сторонам придётся определить свои обязательства."
 HSM_AQR.411.t:0 "За стенами казарм"
 HSM_AQR.411.unprepared:0 "Сторонники Жанны приходят в кабинет Бассо с разными проектами. Контрпереворот лоялистов обеспечил контроль над маркой, но никто не может предъявить соглашение о будущей гражданской власти. Секретарь командующего ставит ещё один стул.\n\nСтарый союзник двора спрашивает, кто будет отвечать перед маркизой. Представитель города спрашивает, кто будет отвечать перед горожанами. Оба принесли жалобы на военные учреждения, через которые по-прежнему проходят их прошения.\n\nПока они спорят, командование остаётся у Бассо. Прежде чем Жанна вернётся к управлению, её сторонникам предстоит договориться о полномочиях, которых они будут для неё добиваться, и об обязательствах, которые примут на себя."
 HSM_AQR.412.JFT_communes:0 "Коммуны держат слово"
 HSM_AQR.412.JFT_dennis:0 "Город адмирала"
 HSM_AQR.412.JFT_enfants:0 "Забытые дети Аквелии"
 HSM_AQR.412.JFT_fja:0 "Коалиция перед избирателями"
 HSM_AQR.412.later:0 "Продолжить переговоры позднее."
 HSM_AQR.412.rev:0 "Собрание у гавани начинается прежде, чем ночная смена успевает разойтись по домам. Представители организаций, поднявших восстание, приносят сложенные прошения и записки, которыми мастерские обменивались во время боёв. Двери оставляют открытыми для опоздавших.\n\nМоряк спрашивает, кто будет говорить от имени экипажей. Рабочий с причала задаёт тот же вопрос о людях на берегу. Организаторы добились права быть услышанными, но обещания военных дней оставили немало поводов для спора.\n\nНа столе освобождают место для первого проекта. Вклад Придеи в новую Аквелию начнётся здесь — с программы, которую её сторонники готовы защищать сообща."
 HSM_AQR.412.royal:0 "Над гаванью Придеи развевается королевское знамя, но мастера верфей пришли к Деннису с перечнем незаконченных ремонтов и вопросами экипажей о возвращении домой. Ветераны освобождают места вокруг стола, ещё покрытого морской картой.\n\nСтарый морской пехотинец начинает с обороны причалов. Мастер отвечает именами семей, живущих рядом. Деннис сворачивает край карты, чтобы расправить прошение.\n\nАдмирал удержал гавань. Тем, кто в ней работает, нужны условия мирной жизни после ухода патрулей. Его сторонникам предстоит решить, с какими обещаниями они начнут переговоры."
 HSM_AQR.412.t:0 "Собрание у причалов"
 HSM_AQR.412.unprepared:0 "Делегаты приносят прошения, но общей программы для собрания у них нет. Людей, передававших сообщения во время боёв, всё ещё просят разрешать споры, на которые у них нет полномочий.\n\nПисарь оставляет заголовок соглашения пустым. Каждая группа может объяснить, с чем хотела покончить; договориться о будущем оказывается труднее. Председатель предлагает начать с жалоб тех, кто ждёт за дверью.\n\nИм предстоит найти партнёров, готовых разделить ответственность за мирную жизнь. Для переговоров с прежним противником потребуются условия, приемлемые для собственных сторонников."
 HSM_AQR.413.VIN_abc:0 "Les Amis des ABC"
 HSM_AQR.413.VIN_chevaliers:0 "Рыцари верности"
 HSM_AQR.413.VIN_gadiffer:0 "Верное герцогство Гадиффера"
 HSM_AQR.413.VIN_sis:0 "Общество студентов-интеллектуалов"
 HSM_AQR.413.later:0 "Продолжить переговоры позднее."
 HSM_AQR.413.rev:0 "Делегаты прислонили знамёна своих обществ к стене, освобождая место для писем из округов. Сельская учительница приехала послушать, как прочтут её письмо: курьер не смог сказать, какое учреждение на него ответит.\n\nПеред движениями, поддержавшими революцию, теперь стоят соседи, ожидающие от них умения управлять. Один оратор предлагает общую декларацию. Другой разворачивает прошение: подписавшиеся хотят знать, кого можно призвать к ответу за нарушенное обещание.\n\nУчительница ждёт, пока в первый абзац вносят поправки. Прежде чем предложить Аквелии свою программу, её сторонникам в Виновии предстоит ответить этой женщине."
 HSM_AQR.413.royal:0 "Секретарь Гадиффера приносит письма, задержавшиеся, пока дороги были небезопасны. Герцог узнаёт первую печать: добровольцы этого округа выступили под его знамёнами. Местный совет просит вернуть одолженные подводы.\n\nСоветник начинает объяснять, во сколько обошлась победа. Гадиффер просит дочитать письмо. Подводы нужны для урожая, который не станет ждать казначейство.\n\nЗа столом сторонники герцога переходят от поздравлений к предложениям. Служить короне Дискре теперь означает определить обязательства, которые смогут исполнить и Виновия, и её правитель."
 HSM_AQR.413.t:0 "Письма из округов"
 HSM_AQR.413.unprepared:0 "Делегаты приносят прошения, но общей программы для собрания у них нет. Людей, передававших сообщения во время боёв, всё ещё просят разрешать споры, на которые у них нет полномочий.\n\nПисарь оставляет заголовок соглашения пустым. Каждая группа может объяснить, с чем хотела покончить; договориться о будущем оказывается труднее. Председатель предлагает начать с жалоб тех, кто ждёт за дверью.\n\nИм предстоит найти партнёров, готовых разделить ответственность за мирную жизнь. Для переговоров с прежним противником потребуются условия, приемлемые для собственных сторонников."
 HSM_AQR.450.t:0 "Прежнее прошение"
 HSM_AQR.451.t:0 "Прежнее прошение"
 HSM_AQR.452.t:0 "Прежнее прошение"
 HSM_AQR.453.t:0 "Прежнее прошение"
 HSM_AQR.454.t:0 "Прежнее прошение"
 HSM_AQR.455.t:0 "Прежнее прошение"
 HSM_AQR.456.t:0 "Послевоенные делегации"
 HSM_AQR.480.a:0 "Аквелией будет править наше движение."
 HSM_AQR.480.b:0 "Вернуть печать законным Дискре."
 HSM_AQR.480.c:0 "Вернуться к общереспубликанскому движению."
 HSM_AQR.480.d:0 "Столица удержана, но победа оставила без ответа давнее обещание. Одни делегаты всю войну несли знамёна общегосударственного движения; другие ожидали, что именно их провинция даст новое правительство всей стране. Больше нельзя скрывать это различие за общим врагом. Печать лежит на столе. Получивший её будет править Аквелией, а делегатам предстоит решить, состояла ли их задача в восстановлении власти или в её замене."
 HSM_AQR.480.t:0 "Кому передать государственную печать?"
 HSM_AQR.500.a:0 "Начнём с домов и семей."
 HSM_AQR.500.d:0 "У министерства ещё висят победные прокламации. Внутри первая общая ведомость перечисляет семьи в железнодорожных сараях, солдат, ожидающих увольнения, и города, покупающие хлеб на армейских складах. Правительство пережило борьбу; теперь ему предстоит сделать страну пригодной для жизни. Писари оставили на столе три папки: жильё, возвращение со службы и поставки продовольствия."
 HSM_AQR.500.t:0 "Первая мирная ведомость"
 HSM_AQR.501.a:0 "Мы сохраним отдельное правительство."
 HSM_AQR.501.b:0 "Подписать статьи о присоединении."
 HSM_AQR.501.d:0 "[From.GetName] направляет делегацию с предложением о присоединении. Муниципальные суды и местные учреждения продолжат работу в соответствии с основополагающими статьями, а казна, внешняя политика и вооружённые силы станут общегосударственными. Наше отдельное правительство прекратит существование. Делегаты привезли два экземпляра договора, но от нашего имени ещё никто не подписался."
 HSM_AQR.501.t:0 "Статьи из Аквелии"
 HSM_AQR.502.a:0 "Опубликовать оба экземпляра."
 HSM_AQR.502.d:0 "Делегаты вернулись с подписанными статьями. В областных учреждениях экземпляр положат рядом с основополагающим соглашением, чтобы ни министр, ни местный судья не мог незаметно переписать гарантии. Теперь территориальные реестры должны последовать за договором."
 HSM_AQR.502.t:0 "Два экземпляра, две печати"
 HSM_AQR.503.a:0 "Примем их ответ."
 HSM_AQR.503.b:0 "Потребовать полномочий для осуществления притязания."
 HSM_AQR.503.d:0 "[From.GetName] отказывается от присоединения. Ответ признаёт состоявшуюся конференцию, но сохраняет власть за собственными учреждениями. Кабинет может на этом закрыть вопрос. Сторонникам принуждения придётся отдельно добиваться полномочий и объяснить, почему притязание оправдывает новую войну."
 HSM_AQR.503.t:0 "Письменный отказ"
 HSM_AQR.504.a:0 "Пусть это станет обыденностью."
 HSM_AQR.504.d:0 "В последней министерской сводке нет победной речи. Утренний поезд с хлебом прибыл, отдел демобилизации закрыл последнюю временную казарму, а отремонтированная улица приняла жильцов. В стране ещё остаются бедные округа и школы, которые предстоит построить. Эти обязанности сохраняются за учреждениями, созданными основополагающим соглашением; теперь чрезвычайное положение не мешает им работать."
 HSM_AQR.504.t:0 "Обычное утро"
 HSM_AQR.600.0:0 "Потребовать отчёта поручителя перед мастерами."
 HSM_AQR.600.1:0 "Оплатить эту поставку средствами герцогского двора."
 HSM_AQR.600.d:0 "Мишель приходит в новую инструментальную мастерскую и видит бархатное кресло рядом с недостроенным прессом. Мастер оставил его для купца, поручившегося за поставку железа. Купец прислал слугу с требованием: прежде чем отправлять следующую партию, он хочет подтверждения прежних ярмарочных льгот.\n\nКазначей называет уступку незначительной. Колёсный мастер раскрывает книгу счетов: он исправно платил сборы даже в самые голодные сезоны, а обещанный пресс нужен и его соседям. Мишель проводит когтем по шероховатой отливке. Пока железо не привезено, королевская печать над дверью охраняет пустое помещение. За окнами ждут подмастерья, которых уже успели нанять, но которым пока нечего поручить.\n\nУ этого спора есть два ближайших решения. Герцог может вызвать поручителя и потребовать исполнения подписанного обязательства перед собравшимися ремесленниками. Можно также оплатить спорную партию из средств собственного двора, оставив большой спор о привилегиях для отдельного разбирательства. Казначей придвигает расходную книгу к краю стола. Колёсный мастер не закрывает свою. Оба ждут ответа, который на следующей ярмарке будут пересказывать далеко за пределами этой мастерской."
 HSM_AQR.600.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.600.t:0 "Пустое место покровителя"
 HSM_AQR.601.0:0 "Пройти сорванный маршрут и разобрать ошибки офицеров."
 HSM_AQR.601.1:0 "Провести задержавшийся груз оружия."
 HSM_AQR.601.d:0 "Бо Гарне останавливает учебную колонну на деревенском перекрёстке. Передовая рота пришла с начищенным снаряжением, но продовольственная повозка осталась за сломанным мостом. Капитан просит разрешить реквизицию хлеба. Пекарь отвечает, что уже обещал утреннюю выпечку окрестным фермам, и показывает записанные заказы.\n\nМишель приехал наблюдать за учениями. Несколько офицеров поглядывают на него, ожидая простого приказа, который избавит полк от неловкости. Гарне вместо этого просит капитана объяснить, как прошёл бы такой марш без герцога рядом. Капитан расстилает карту на перевёрнутом ящике, а пекарь указывает на отсутствующую в чертеже просёлочную дорогу. Возчик узнаёт её и говорит, что утром там прошла тяжёлая телега.\n\nУчение можно приостановить: офицеры проверят путь снабжения с местными возчиками и разберут допущенную ошибку. Другой выход — провести по найденной дороге задержавшийся военный груз и доставить исправные винтовки на склады. Капитан ждёт решения с раскрытой картой. Ни для одного дела не потребуется забирать хлеб, уже обещанный соседним хозяйствам, и пекарь наконец возвращается к своей печи."
 HSM_AQR.601.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.601.t:0 "Хлеб до парада"
 HSM_AQR.602.0:0 "Предоставить слово ожидающим семьям."
 HSM_AQR.602.1:0 "Объяснить собравшимся обязанности добровольцев."
 HSM_AQR.602.d:0 "На собрании общегосударственного монархического движения Мишель ждёт окончания гимна. Его делегация привезла прошение рильских семей, чьи сыновья не вернулись из-под ареста. Придворный распорядитель предлагает передать его частным образом после верноподданнических речей. Герцог спрашивает, приглашены ли сами семьи на эту встречу. Оказывается, нет.\n\nРаспорядитель не возражает против милосердия. Он боится, что каждое королевское собрание превратится в перечень обид, пока короне ещё нужны защитники. Мишель хорошо знает этот довод: прежде он и сам говорил подобное. Рядом с прошением лежит список добровольцев, готовых служить, если их домашние смогут узнать, где находятся пропавшие родственники. В списке есть подписи, сделанные неровным, непривычным к письму когтем.\n\nДелегация может устроить открытый приём семей и добиться, чтобы представители короны сегодня выслушали их требования. Можно посвятить отведённую речь разъяснению ограниченных обязанностей добровольцев, а прошение вручить сразу после неё. Рила должна выбрать, как использовать эту встречу. Верность династии не заставила исчезнуть раны, и стоящие у дверей посетители ждут ответа именно на принесённые ими вопросы."
 HSM_AQR.602.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.602.t:0 "Гимн и прошение"
 HSM_AQR.603.0:0 "Потребовать открытого объяснения до утверждения."
 HSM_AQR.603.1:0 "Свести кредиторов и подрядчика за одним столом."
 HSM_AQR.603.d:0 "Мишель задерживается над заявками на строительство мастерской. На одной стоит имя поставщика, работавшего для его двора до бегства из Рилы. Цена разумна, чертежи убедительны. Делегатка собрания кладёт рядом неоплаченный счёт печатника. Та же фирма, говорит она, не может ссылаться на бедность перед прежними кредиторами и одновременно просить новый общественный аванс.\n\nМинистр просит время на проверку. Отказаться от полезной мастерской потому, что у подрядчика есть враги, было бы легко. Объяснить особое снисхождение к знакомому герцога будет труднее. Мишель закрывает папку и оставляет её на стороне стола, где сидят делегаты. Печатник ждёт у стены; он пришёл за ответом, а не за новой рекомендацией.\n\nКомитет может немедленно вызвать поставщика для открытого объяснения, чтобы собрание получило ясный ответ до утверждения заказа. Другой путь — пригласить пострадавших мастеров сверить спорные счета с подрядчиком под наблюдением представителей. Оба решения относятся к этому договору. Подпись Мишеля под хартией не даёт ему права заранее выбрать за остальных способ разрешения спора."
 HSM_AQR.603.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.603.t:0 "Знакомое имя в заявке"
 HSM_AQR.604.0:0 "Повторить учение с ясной ответственностью."
 HSM_AQR.604.1:0 "Проверить и выдать исправное резервное оружие."
 HSM_AQR.604.d:0 "Анна-Жозефина де Мерикур приходит в собрание с учебным приказом, на котором стоят три визы, но нет выполнимого указания. Резервная рота ждала у закрытого склада, пока капитан поочерёдно добивался разрешения каждого подписавшего. Мишель узнаёт почерк дворцового секретаря. Знакомая рука ничего не объясняет: кто всё-таки мог открыть ворота?\n\nДепутат-ветеран считает ответ очевидным: командиру нужна свобода действий. Другой помнит, как такая свобода позволяла входить в чужие дома без спроса. Мерикур кладёт между ними карту учений. Здесь речь о складе, уже переданном армии, а не о жилом доме; разница должна быть видна в самом приказе. Несколько депутатов наклоняются над отметкой у ворот.\n\nОфицеры могут вернуться в поле и повторить упражнение с прямо назначенным дежурным командиром. Можно провести остаток дня на складе вместе с оружейниками, отобрав исправное резервное оружие, пока министерство исправляет указание. Хартии нужны и способное командование, и границы полномочий, понятные солдату без юриста у каждых ворот. Мерикур оставляет спорный лист на столе и ждёт решения."
 HSM_AQR.604.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.604.t:0 "Кто вправе открыть ворота?"
 HSM_AQR.605.0:0 "Уступить слово автору провинциальной поправки."
 HSM_AQR.605.1:0 "Зафиксировать границы мандата Мишеля."
 HSM_AQR.605.d:0 "На общегосударственной конституционной встрече один из гостей обращается к Мишелю так, словно рильскому герцогу естественно возглавлять Аквелию. В комнате становится тихо. Напротив провинциальная делегатка придвигает к себе предложенную поправку. Она приехала обсуждать правительство, отвечающее перед представителями, а не присутствовать при объявлении престолонаследия через любезное обращение.\n\nМишель просит секретаря сохранить в протоколе его герцогский титул и ничего больше. Примирение с Рилой дало ему место под её хартией. Оно не определило судьбу общегосударственной короны и не предоставило власти над присутствующими представителями. Гость извиняется, но отозванная поправка остаётся под когтем её автора. Секретарь перестаёт писать и смотрит на председательствующего.\n\nДо конца заседания осталось время для одного выступления. Мишель может уступить его делегатке, позволив открыто оспорить рильский проект. Можно вместо этого внести в протокол точное и ограниченное изложение собственного мандата, закрыв недоразумение перед следующими переговорами. Любой шаг должен сделать согласие видимым там, где лестный титул едва его не заслонил. Никто не убирает бумаги со стола, ожидая выбора."
 HSM_AQR.605.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.605.t:0 "Корона — не поправка"
 HSM_AQR.606.0:0 "Принять проверенные винтовки в счёт долга."
 HSM_AQR.606.1:0 "Потребовать открытого признания соглашения поручителями."
 HSM_AQR.606.d:0 "Де Бекинье предоставил комнату для участников машинного зала, и встреча почти закончилась, когда носильщик вносит длинный деревянный ящик. Торговец, задолжавший ремесленникам, предлагает расплатиться винтовками. Они остались от поспешных закупок клубов за границей, когда само прибытие оружия уже казалось победой и исправность каждой детали проверяли далеко не сразу.\n\nПечатник хочет получить расчёт, на который можно купить бумагу. Инструктор добровольцев просит осмотреть замки, прежде чем отвергать предложение. Торговец принёс и письменное признание долга: по его словам, открытое поручительство товарищей позволит вскоре рассчитаться обычными товарами. Несколько участников знают этих поручителей и резко расходятся во мнениях об их надёжности. Старые знакомства вновь делят собравшихся сильнее, чем размеры внесённых взносов.\n\nУмеренный комитет может принять только оружие, выдержавшее проверку, и передать его окружным складам в счёт спорного долга. Можно вызвать поручителей перед собранием вкладчиков и добиться признанного соглашения о расчёте. Де Бекинье отодвигает собственное кресло, чтобы люди, которым должны деньги, могли подойти к столу. Печатник берёт счёт и первым поднимается с места."
 HSM_AQR.606.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.606.t:0 "Долг в незнакомом ящике"
 HSM_AQR.607.0:0 "Повторить смену и разобрать ошибку с обоими отделениями."
 HSM_AQR.607.1:0 "Дождаться часовых и выслушать их в зале."
 HSM_AQR.607.d:0 "Анна-Жозефина де Мерикур входит в клубный зал с караульным расписанием. Часовые западных складов всё ещё стоят на постах, хотя смена должна была прийти до начала собрания. Внутри соседи спорят о назначениях в окружной резерв. Пустое кресло у первого ряда принадлежит капралу, чьё имя уже обсуждают без него.\n\nПредседатель предлагает зачитать мнения отсутствующих по записке. Мерикур спрашивает, понравилась бы ему такая любезность, если бы кто-то другой определял смысл его слов. Спор затихает, и посыльный успевает объяснить задержку: заступающее отделение отправили не к тем воротам. На полях расписания обнаруживается старая отметка, которую никто не исправил после переноса поста.\n\nОфицеры могут посвятить остаток вечера повторной передаче караула, чтобы оба отделения вместе разобрали ошибку. Клуб может вместо этого отложить обсуждение до возвращения часовых и выслушать их рассказ перед соседями. Расписание придётся исправить в любом случае. Сейчас решается, где именно будет усвоен урок. Мерикур кладёт лист на пустующее кресло и просит не принимать решение о капрале до его появления."
 HSM_AQR.607.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.607.t:0 "Пустое кресло часового"
 HSM_AQR.608.0:0 "Отправить посыльных с объявлениями и защитить собрание."
 HSM_AQR.608.1:0 "Потребовать открытого ответа от организаторов срыва."
 HSM_AQR.608.d:0 "Печатник приходит в Комитет общественной безопасности с помятой связкой объявлений. Его клуб проиграл последние прения внутри общегосударственного республиканского движения, и несколько победителей решили, что его собрание больше не заслуживает огласки. Газету они не запрещали, уверяют они. Просто убедили разносчиков оставить её лежать.\n\nДе Бекинье узнаёт печатника. Его станок когда-то служил клубам, которые не могли безопасно объявить место встречи. Умеренный представитель говорит, что одного этого воспоминания достаточно. Другой спрашивает, кто доставит сегодняшние объявления, если все останутся здесь восхвалять вчерашнюю храбрость. Печатник кладёт связку между ними: собрание начинается до заката, а за окнами уже заметно темнеет.\n\nКомитет может поручить своим посыльным разнести этот выпуск и открыто защитить право проигравшего клуба собраться. Можно вызвать организаторов срыва распространения и потребовать публичного признания решения комитета. Ни один ответ не изменит отклонённого предложения. Сторонникам республики предстоит выяснить, оставляет ли поражение в одном споре место в следующем. Печатник ждёт практического решения и время от времени поправляет бечёвку, которую успели порвать на улице."
 HSM_AQR.608.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.608.t:0 "Типография после поражения"
 HSM_AQR.609.0:0 "Вернуть установленное жалованье при рабочих."
 HSM_AQR.609.1:0 "Открыто передать учтённые детали оружейникам."
 HSM_AQR.609.d:0 "Комитет общественной безопасности получает две описи одной захваченной каретной. В первой перечислены инструменты для новой насосной мастерской. Во второй — запертый сундук, который патруль кокардьеров унёс до прихода ремесленников. Делегатка «Фанала» сама приносит его на заседание. Внутри лежат оружейные детали, хозяйственные бумаги и деньги, отложенные для жалованья усадебным слугам.\n\nУчастник патруля говорит, что всё принадлежало дворянину, а значит, принадлежит революции. Делегатка кладёт на стол расчётную записку прислуги. Мастер осматривает металлические части: некоторые позволят восстановить оружие на окружных складах. Остальное содержимое сундука невозможно переплавить в удобный ответ. За дверью ждут работники, чьи имена встречаются в найденных бумагах.\n\nКомитет может начать открытое разбирательство в спорной мастерской с возврата установленного жалованья, передав деньги при ожидающих рабочих. Можно первым делом отправить пригодные детали оружейникам и показать, куда поступило изъятое патрулём имущество. Бумаги в обоих случаях останутся для расследования; никто не получает права присвоить остальное. Делегатка держит сундук открытым, пока секретарь записывает всё его содержимое и решение собравшихся."
 HSM_AQR.609.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.609.t:0 "Замок в захваченном сундуке"
 HSM_AQR.610.0:0 "Повторить учение после общей сверки снабжения."
 HSM_AQR.610.1:0 "Обучить и зачислить ожидающие добровольческие команды снабжения."
 HSM_AQR.610.d:0 "Бореас Бабеф подаёт сигнал к началу учения, но рота слева не открывает огонь. Добровольцы показывают пустые патронные сумки. Справа у другой роты достаточно боеприпасов на весь день. Оба интенданта предъявляют распоряжения с печатью Комитета общественной безопасности и уверяют, что их клуб добросовестно исполнил полученный приказ.\n\nБабеф требует немедленно продолжить марш. Новобранец спрашивает, можно ли взять запасную сумку у обеспеченного соседа или нужно ждать одобрения собственного комитета. Вопрос раздражает офицеров: он показывает именно то, что упражнение должно было скрыть. Общая армия всё ещё живёт частными привычками, а правильные печати не заставляют патроны попадать в пустые сумки.\n\nКомандование может остановить марш, заставить интендантов вместе распределить и записать боеприпасы, а затем повторить сигналы. Другой путь — привлечь ожидающие группы добровольцев к подноске припасов и зачислить прошедших практическое обучение. Урок остаётся прежним, но день можно посвятить исправлению штабной работы или расширению службы. Бабеф смотрит на часы и опускает поднятое крыло: прежде следующего сигнала придётся выбрать, кто именно будет учиться."
 HSM_AQR.610.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.610.t:0 "Учение Бабефа без выстрелов"
 HSM_AQR.611.0:0 "Выслушать защитников, по-прежнему готовых служить."
 HSM_AQR.611.1:0 "Потребовать от делегатов ответа по этой реквизиции."
 HSM_AQR.611.d:0 "Анна-Жозефина де Мерикур стоит рядом с ораторами Комитета общественной безопасности на встрече делегатов других провинций. Кокардьеры выставили свидетельства защиты улиц и освобождения заключённых. Рабочий в зале поднимает реквизицию с их печатью и спрашивает, почему инструменты, забранные у его соседей, так и не попали в общественную мастерскую.\n\nВетеран называет вмешательство подарком монархистам. Мерикур просит дать рабочему договорить. Посетитель всё выступление носил республиканскую кокарду: он хочет применить обещание революции к людям, которые говорят от её имени. Несколько провинциальных делегатов откладывают подготовленные приветствия и начинают слушать. Рабочий разглаживает лист, чтобы подписи были видны с другого конца стола.\n\nКомитет может предоставить следующее выступление свидетелям общей обороны клубов, предложив объяснить, почему они по-прежнему считают республику достойной службы. Можно оставить просителя за столом и потребовать ответа от делегатов, отвечавших за реквизицию, прямо перед собранием. Ни один выбор не отменяет общегосударственную революционную программу. Меняется свидетельство, которое её сторонники предъявят первым. Мерикур отступает от стола, освобождая место тому, кого сейчас вызовут."
 HSM_AQR.611.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.611.t:0 "Свидетель под кокардой"
 HSM_AQR.612.0:0 "Прочесть поручительство перед собравшимися дворянами."
 HSM_AQR.612.1:0 "Принять ремонт и пропустить деревенское зерно."
 HSM_AQR.612.d:0 "Землемер Жанны кладёт кусок гнилого бруса на ковёр приёмной. Дворянин, чьё поручительство обеспечивало ремонт переправы, сначала возмущается грязью и лишь затем представленным доказательством. Управляющий уверяет, что поместье доставило всё обещанное. Сельский возчик отвечает: подводы остановились у господского дома и до ручья так и не добрались.\n\nЖанна просит книгу поставок. На расписке стоит знакомая родовая печать, но подписи дорожной артели нет. Дворянин предлагает уладить дело без огласки и завтра же прислать работников. Землемер хочет прочесть расписку перед другими владельцами: несколько поместий пользуются точно таким же удобным бланком, и их дороги тоже ещё ждут ремонта.\n\nМост можно восстановить при любом решении. Публичный разбор покажет, что вызов маркизы обязателен даже для её старейших сторонников. Немедленное соглашение позволит вывезти деревенское зерно до следующего дождя. Жанна кладёт обломок поверх спорной расписки. Союзник больше не сможет назвать случившееся недоразумением между слугами. За дверью ждут возчики, которым придётся объяснить, когда они снова смогут отправиться в путь."
 HSM_AQR.612.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.612.t:0 "Камень под печатью"
 HSM_AQR.613.0:0 "Собрать совместимые винтовки из усадебных запасов."
 HSM_AQR.613.1:0 "Повторить смену смешанными ротами."
 HSM_AQR.613.d:0 "Учебный обоз достиг последнего склада, но перед воротами стоят две роты. Уходящий капитан отказывается передавать патроны, купленные его покровителем. Сменщик привёл солдат с винтовками другого образца и всё равно не может ими воспользоваться. Инструкторы докладывают об удачно завершённом переходе, за которым последовала совершенно неудачная передача поста.\n\nЖанна вызывает капитанов вместе с оружейниками. Один предлагает собрать исправные винтовки из усадебных запасов, чтобы склад выдавал совместимое оружие. Другой просит повторить учения смешанными ротами, пока офицеры не научатся проверять каждый ящик перед выходом. Обоим неприятно, что придворный писарь записывает объяснения и уточняет фамилии ответственных за погрузку.\n\nДо возвращения рот на посты времени хватит на одно срочное исправление. Сбор подходящих винтовок позволит сразу вооружить охрану. Ещё один полевой выход научит офицеров понимать, почему полная повозка не всегда означает полезный груз. Жанна потребует содействия покровителей при любом решении. Их частный спор уже достаточно задержал обоз, а возчики стоят у ворот с утра и рассчитывают получить ясное распоряжение до темноты."
 HSM_AQR.613.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.613.t:0 "Охрана, которая не уходила"
 HSM_AQR.614.0:0 "Проводить добровольцев к королевскому сбору."
 HSM_AQR.614.1:0 "Провезти королевскую клятву по марке."
 HSM_AQR.614.d:0 "Секретарь королевской делегации спрашивает Жанну, куда следует доставить клятву марки. Один дворянин называет её резиденцию. Жанна поправляет его: адрес должен принадлежать признанному аквелийскому двору. В комнате становится достаточно тихо, чтобы услышать, как секретарь затачивает карандаш. Его вопрос неожиданно напомнил собравшимся, кому именно они собираются предложить службу.\n\nСторонники маркизы подготовили два дара к торжеству. Ветераны и добровольцы из поместий готовы сопровождать делегацию и поступить на службу короне. Посыльные от приходов и рынков предлагают вместо этого провезти текст по Весткипу, созывая собрания в поддержку королевского устройства и объясняя обязанности марки перед общей страной.\n\nНа этой неделе Жанна не может выделить одну и ту же охрану для обеих поездок. Первая доставит желающих служить туда, где корона сможет принять их. Вторая превратит частное заверение знатных домов в обязательство, услышанное общинами, которым предстоит его поддерживать. Маркиза просит секретаря оставить под её подписью место для выбранных распоряжений. Никто больше не предлагает отправить клятву обратно к её собственным воротам."
 HSM_AQR.614.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.614.t:0 "Клятва с адресом"
 HSM_AQR.615.0:0 "Закрепить прецедент открытым судебным решением."
 HSM_AQR.615.1:0 "Сегодня вернуть станок по договору о ремонте."
 HSM_AQR.615.d:0 "Хозяин мастерской приходит на слушание с реквизиционной распиской. Гарнизонный писарь приносит другую бумагу, объявляющую тот же станок незаменимым для военного ремонта. Никто не оспаривает, что до появления солдат машина принадлежала мастерской. Спорят о другом: сохраняет ли силу обещание вернуть её, когда офицер продолжает настаивать, что она ему нужна.\n\nЖанна слушает, пока юрист коалиции читает первоначальные условия. Военная контора пропустила срок, который назначила сама. Владелец требует публичного решения; соседи готовы выступить свидетелями. Старший мастер предпочёл бы немедленное соглашение: станок возвращается сегодня, а гражданский договор отводит гарнизону оговорённые часы ремонта. Тогда работники смогут наконец снова приступить к обычным заказам.\n\nОба решения признают право собственности мастерской. Судебное постановление даст коалиции прецедент для других просроченных реквизиций. Практическое соглашение откроет верстак, у которого рабочие ждут с утра. Жанна спрашивает владельца, какие бумаги он хочет подписать первыми, затем обращается к собравшимся представителям. Гарнизонному писарю придётся поставить подпись под их решением, хотя прежний начальник велел ему просто забрать обе папки обратно."
 HSM_AQR.615.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.615.t:0 "Станок с двумя владельцами"
 HSM_AQR.616.0:0 "Принять добровольцев, свободных на полные учебные дни."
 HSM_AQR.616.1:0 "Научить младших командиров соблюдать расписание."
 HSM_AQR.616.d:0 "В полдень инструктор распускает резервную роту и обнаруживает, что несколько солдат уже ушли. Наниматели отпустили их на утро, но занятие затянулось. Городской глава утверждает, что офицеры знали условия; капитан отвечает, что рота не освоит сложный манёвр, если будет останавливаться по каждому удару рыночного колокола. Оставшиеся солдаты ждут во дворе, не понимая, закончена ли служба.\n\nЖанна требует принести расписание. В нём указано продолжительное занятие, о котором мастерским никто не сообщил. Муниципальные делегаты предлагают набрать новый отряд из тех, чьи наниматели гарантируют полные учебные дни. Инструкторы хотят посвятить следующий сбор подготовке младших командиров: научить их делить работу на надёжные занятия и вернуть нынешних резервистов к уже согласованным условиям.\n\nНи одно предложение не оправдывает самовольный уход. Первое приведёт новых добровольцев, не увеличивая чужих обязанностей. Второе поможет лучше обучить существующую роту. Прежде чем рассматривать решения, Жанна просит капитана убрать обвинение в гражданском саботаже из своего рапорта. Коалиция не сможет научить точной службе по расписанию, которое забыла опубликовать."
 HSM_AQR.616.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.616.t:0 "Пустое место в полдень"
 HSM_AQR.617.0:0 "Выслушать республиканских подписантов до отъезда."
 HSM_AQR.617.1:0 "Выступить с ветеранами в защиту общего соглашения."
 HSM_AQR.617.d:0 "Писарь общенациональной делегации подготовил чистовой текст обращения Весткипа. В нём каждый подписант признаётся в пожизненной преданности короне. Городской республиканец возвращает лист через стол. Он обещал соблюдать королевское соглашение коалиции, говорит делегат, но не собирается приобретать детство, которого у него никогда не было. Его товарищи молча придвигают свои неподписанные экземпляры следом.\n\nЖанна читает спорную строку и вычёркивает её. Писарь тревожится, что честное разногласие испортит публичную церемонию. Снаружи собрались ветераны, готовые сопровождать делегацию; рядом стоят жители, желающие узнать, позволено ли республиканцам по-прежнему высказывать претензии при новом соглашении. Они пришли услышать ответ до отъезда представителей, а не после их возвращения.\n\nДо отправления маркиза успеет выступить только перед одним собранием. Она может открыть слушание с несогласными партнёрами, показав, что подпись не требует молчания. Либо присоединиться к ветеранам и объяснить, почему разные убеждения допускают общую защиту принятого устройства. Ни одно собрание не решает судьбу аквелийского престола. Они покажут горожанам, что имели в виду их представители, ставя имена рядом с именем Жанны."
 HSM_AQR.617.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.617.t:0 "Республиканец подписывает рядом с маркизой"
 HSM_AQR.618.0:0 "Закончить затворы и вернуть винтовки в строй."
 HSM_AQR.618.1:0 "Выполнить обещанную на сегодня гражданскую поставку."
 HSM_AQR.618.d:0 "Колетт приходит, когда ночная смена ещё спорит с интендантом. Его приказ требует винтовочных затворов; старший мастер уже обещал подшипники для остановившейся развозной повозки. Обе работы требуют одного станка. Интендант называет задержку нелояльностью. Рабочий указывает на выцветший вербовочный плакат над его головой и спрашивает, предполагалось ли, что призванные им союзники отрастят ещё одну пару когтей.\n\nКолетт велит офицеру взять обвинение назад и положить оба заказа на верстак. За согласованную смену можно закончить одну партию. Готовые затворы вернут в строй отремонтированные винтовки. Подшипники позволят отправить повозку с обычными припасами для семей, которые уже ждут её прибытия. Возчик оставил у ворот список адресов и обещал прийти за ответом вечером.\n\nНикто не предлагает заставлять измотанную бригаду работать ещё одну ночь. Спор идёт о том, чья срочная нужда получит место в уже обещанных часах. Колетт может настоять на военной поставке или признать гражданское обязательство. В любом случае мастер просит записать решение, чтобы следующий офицер не объявил незавершённый заказ просто забытым."
 HSM_AQR.618.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.618.t:0 "Один станок, два срочных заказа"
 HSM_AQR.619.0:0 "Поручить разведчикам и штабу совместный приказ."
 HSM_AQR.619.1:0 "Через местные связи собрать винтовки из тайников."
 HSM_AQR.619.d:0 "Разведчик отказывается идти по маршруту штаба. Поперёк него стоит изгородь, говорит он, а дальше почва не выдержит обозных повозок. Инструктор отвечает, что упражнение посвящено исполнению приказов. Колетт спрашивает, сообщили ли повозкам об этом различии. Несколько солдат отворачиваются, пока офицер пытается объяснить, почему условное препятствие не должно останавливать учебную колонну.\n\nНа местности ошибки обнаруживаются у обеих сторон. На карте нет преграды, а обходной путь разведчика проходит через двор, жители которого никогда не соглашались принимать военный обоз. Знание окрестностей требует проверки не меньше печатной схемы. Рота возвращается с поцарапанными повозками и полезным набором взаимных претензий.\n\nКолетт может поручить следующее занятие смешанным группам разведчиков и штабистов, потребовав приказ, который сумеет выполнить другая рота. Либо интендант потратит свободный день на сбор исправных винтовок из ближайших тайников, чьих хранителей ещё знают дозорные. Первый выбор развивает офицерское суждение; второй превращает уцелевшие подпольные связи в пригодное снаряжение. Ни один не позволяет инструктору снова вычеркнуть изгородь из объяснения произошедшего на учениях."
 HSM_AQR.619.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.619.t:0 "На карте не хватает изгороди"
 HSM_AQR.620.0:0 "Начать с претензий гражданских делегатов."
 HSM_AQR.620.1:0 "Вместе выступить в защиту республики."
 HSM_AQR.620.d:0 "Офицер, готовящий делегацию Весткипа, записал гражданских организаторов помощниками военных представителей. Колетт узнаёт бывшего связного, разглядывающего свою карточку. Он показывает на слово под именем и спрашивает, не нашла ли национальная революция наконец вежливый способ велеть ему подождать за дверью. Несколько товарищей достают собственные карточки: там напечатано то же самое.\n\nОна приказывает исправить записи. Республиканские связи MPA обеспечили встречу, но не заменили всех, кто поддерживал жизнь Весткипа. Офицеры принимают изменение и спрашивают, какое послание должна привезти делегация. Гражданские организаторы подготовили рассказы о сотрудничестве и жалобы на реквизиции. Ветераны, ожидающие на станции, хотят услышать призыв служить республике.\n\nВступительное обращение допускает любой из этих акцентов. Колетт может поручить делегатам публично изложить претензии, показав, что гражданское участие имеет содержание. Либо попросить их выступить вместе с ветеранами в поддержку защиты общенационального республиканского устройства. Ни один выбор не назначает её на высший пост Аквелии. Он определяет, что услышат союзники, когда она заговорит от их имени перед собравшимися представителями других провинций."
 HSM_AQR.620.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.620.t:0 "На карточке делегата нет шифра"
 HSM_AQR.621.0:0 "Сохранить обещанное место зерновозу."
 HSM_AQR.621.1:0 "Обучить команду на ремонте корабля охранения."
 HSM_AQR.621.d:0 "Деннис узнаёт капитана раньше, чем портовый писарь успевает его представить. Они обмениваются морской историей, а у нового стапеля ждёт плотник каботажного судна, держащий треснувшую доску под крылом. Капитан просит пропустить вперёд корабль охранения. Плотнику уже обещали место для его зерновоза.\n\nФлёр кладёт оба заказа на стол. Механизмы корабля охранения можно осмотреть на плаву, объясняет она, но это займёт флотскую ремонтную бригаду. Если первым останется зерновоз, купцы увидят, что опубликованному расписанию можно доверять и знакомство с адмиралом не отменяет очередь. Если принять военный корабль, его команда пройдёт весь ремонт вместе с верфяными рабочими и освоит незнакомые операции. Одновременно поставить оба корпуса на стапель невозможно.\n\nДеннис обрывает воспоминание на середине. Старый товарищ выглядит оскорблённым, когда плотника приглашают подойти ближе. Тот молча кладёт свою доску рядом с двумя заказами. На улице крановщики ждут единственного номера судна, которое следует подтянуть к берегу. Адмирал тянется к книге, где его подпись будет видна каждому мастеру."
 HSM_AQR.621.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.621.t:0 "Первый корпус на стапеле"
 HSM_AQR.622.0:0 "Деннис повторит сигнальное учение."
 HSM_AQR.622.1:0 "Флёр отработает снабжение десанта."
 HSM_AQR.622.d:0 "Из утреннего тумана выходит катер с чужим десантным отрядом. Капитан последовал сигналу, который помнил по прежней службе у Денниса; береговой пост использовал недавно согласованный код. Никто не пострадал, но Флёр обнаруживает пропавшие медицинские сумки на другом судне.\n\nКапитан предлагает повторить переход со своими сигналами. Деннис уже собирается согласиться, когда Флёр кладёт рядом две сигнальные книги. Она спрашивает, какую из них должен знать следующий молодой лейтенант. Капитан умолкает. Его опыт вполне настоящий, но ошибка от этого не исчезает. Матросы ждут у причала, стараясь не смотреть в сторону адмирала.\n\nДо возвращения к обычной службе лодки успеют провести ещё одно большое учение. Деннис может снова провести сигнальщиков через залив, заставляя оба берега повторять запросы и подтверждения. Флёр предлагает оставить десант на суше: вместе выгрузить разбросанное снаряжение, разобраться в нём и перенести его к условному месту сбора. Туман обнаружил две разные слабости. Дневного света хватит только на один подробный урок, и командиры должны выбрать его сейчас."
 HSM_AQR.622.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.622.t:0 "Катер в тумане"
 HSM_AQR.623.0:0 "Прочитать соглашение перед жителями гавани."
 HSM_AQR.623.1:0 "Пусть Деннис представит резерв на королевской службе."
 HSM_AQR.623.d:0 "Представитель короны просит положить портовый ключ рядом с новой общегосударственной картой перевозок. Деннис слышит требование сдаться и накрывает ключ когтями ещё до конца фразы. Флёр молча разворачивает карту. На ней отмечены совместные рейсы и флотские склады, а передачи его дома кому-либо здесь нет.\n\nПредставителю нужен публичный знак того, что обещаниям адмирала можно доверять за пределами Придеи. Деннис настаивает: капитанов обязаны выслушивать, когда далёкие канцелярии обещают перевезти больше, чем способны вместить корабли. Оба возражения серьёзны, хотя ожидающие писари уже предпочитают изучать пол.\n\nНа причале можно собрать купцов и моряков, прочитать настоящее соглашение и принять жалобы до того, как ключ выставят перед публикой. Другой путь — смотр портового резерва, который Деннис проведёт лично, показав свою службу короне через знакомые ему команды. Флёр не пытается выбрать за него. Она только убирает край карты из-под ключа, чтобы названия городов снова были видны. Адмирал наконец разжимает когти. Теперь этот жест ещё предстоит объяснить жителям гавани."
 HSM_AQR.623.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.623.t:0 "Ключ на карте"
 HSM_AQR.624.0:0 "Закончить работу у печи и укрепить общее дело."
 HSM_AQR.624.1:0 "Сегодня вернуть собранию его зал."
 HSM_AQR.624.d:0 "Пьер доставляет к литейной одолженный кран и обнаруживает два собрания, которые его ждут. Одно обещало поднять дверцу печи; другому нужно убрать брёвна, перегородившие повреждённый зал заседаний. У каждого хранителя есть бумага с подписью того, кто действительно вправе выдать машину.\n\nЛуи начинает с вопроса, какое обещание было первым. Рабочий литейной отвечает, что от этого ни одна работа не исчезнет. В комнате становится тихо, и Пьер разворачивает записи крановой бригады. Поднятая дверца позволит закончить партию отливок и вместе разобраться в неполадках оборудования. Освобождённый зал вернёт второй коммуне своё место для встреч прежде, чем очередной вечерний спор снова выплеснется на улицу.\n\nНикто не предлагает забрать кран навсегда. Трудность гораздо обыденнее: чья срочная работа может подождать до завтра. Луи кладёт обе бумаги перед бригадами и просит принять решение, которое каждый сумеет объяснить дома. Пьер перестаёт держать ключ в когтях и оставляет его рядом с записями. До начала смены ещё есть немного времени для ответа."
 HSM_AQR.624.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.624.t:0 "Кран и два обещания"
 HSM_AQR.625.0:0 "Обучить соседей, готовых выйти в дозор."
 HSM_AQR.625.1:0 "Отработать передачу службы с действующим ополчением."
 HSM_AQR.625.d:0 "Связной находит Пьера возле колонны ополчения, чей делегат только что отозван. Замена от собрания прибудет вечером. Пока никто не уверен, остаётся ли в силе прежнее поручение сменить соседний дозор. Усталый доброволец спрашивает, означает ли право отзыва ещё и право наконец пойти домой.\n\nЛуи приносит настоящее сообщение собрания. Оно оспаривает поведение делегата, но не обещание помочь соседям. Это различие решает вопрос с ближайшим приказом, однако добровольцы остаются у карты. Несколько жителей предлагают временно выйти в дозор, если им покажут дорогу. Опытные ополченцы могли бы обучить смену и принять новых добровольцев, которым прежде не находилось проводника.\n\nПьер предлагает другой вариант: посвятить день передаче обязанностей между нынешними отрядами, включая случай, когда один из связных намеренно не приходит. Оба решения сохраняют силу отзыва. Первое распределяет службу между большим числом согласных соседей. Второе учит тех, кто уже несёт её, менять представителя, не оставляя пустым перекрёсток. Ожидающие караульные просят только передать им выбранный ответ до наступления темноты."
 HSM_AQR.625.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.625.t:0 "Отзыв на перекрёстке"
 HSM_AQR.626.0:0 "Выслушать коммуны, прежде чем ждать ответа."
 HSM_AQR.626.1:0 "Созвать готовых защищать друг друга."
 HSM_AQR.626.d:0 "Приехавшая коммуна поставила украшенный стул во главе длинного федерального стола. Её делегат называет это знаком уважения к Луи, чья речь против королей и президентов разошлась дальше, чем успел доехать сам оратор. Луи переставляет стул в круг и спрашивает, кто расскажет о заседании отсутствующей ночной смене.\n\nСначала все смеются, затем возникает трудный вопрос. Сельская коммуна просит время, чтобы объяснить новое обязательство взаимной обороны прежде, чем приглашать добровольцев. Другие опасаются, что отсрочки оставят соседей неподготовленными. Ни почётный стул, ни вдохновляющая речь не решат за отсутствующих жителей, на что именно они согласны.\n\nФедерация может отправить выступающих на открытые собрания и дождаться ответов, показывая, что общее обязательство не отнимает голоса у вступившей общины. Можно также провести в Придее добровольный оборонный сбор, предложив уже согласным публично заявить о готовности помогать соседям. Луи готов выступить в обоих случаях. Подписывать ответ за остальных он не станет. Перед ним освобождают место для записей следующего ведущего заседания."
 HSM_AQR.626.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.626.t:0 "Пустой стул для Луи"
 HSM_AQR.627.0:0 "Собрать винтовки для немедленной выдачи."
 HSM_AQR.627.1:0 "Научить новобранцев обслуживать оружие."
 HSM_AQR.627.d:0 "Бородатый оратор с чёрной повязкой стоит под революционным знаменем, пока механики вскрывают ящик из занятого склада. На крышке мелом написано название иностранного банка: кто-то счёл его доказательством вражеской связи. Внутри лежат винтовочные детали, купленные через обычного посредника, и расписки, которые группа безопасности даже не развернула.\n\nОратор спрашивает, работают ли детали. Механик собирает затвор и передаёт его через стол. Исправные винтовки можно закончить сейчас и отправить новым батальонам. Другой вариант — использовать тот же запас на занятиях, чтобы новобранцы научились разбирать, распознавать и чинить оружие прежде, чем получат его для службы. Сегодня мастерская не успеет выполнить обе задачи.\n\nОрганизатор снова начинает говорить о банке. Пожилой грифон прерывает его и показывает на собранный затвор. Аквелии нужны защитники, понимающие, что они держат в когтях. Как бы ни распределили детали, расписки сначала должен прочитать тот, кто способен их объяснить. Механики раскладывают инструменты и ждут, будет ли следующая смена собирать оружие или учить будущих солдат."
 HSM_AQR.627.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.627.t:0 "Ящик под знаменем"
 HSM_AQR.628.0:0 "Отработать пехотный проход и взаимное прикрытие."
 HSM_AQR.628.1:0 "Отработать воздушное наблюдение и передачу донесений."
 HSM_AQR.628.d:0 "Берти Альбатрос перестаёт рисовать наступление там, где портовые склады скрывают следующую улицу. Организатор спрашивает, почему стрелка не доходит до цели. Альбатрос отвечает вопросом: кто видел пространство за зданиями? Выясняется, что дважды переписанное донесение восходит к одному непроверенному наблюдателю.\n\nОрганизатор напоминает, что промедление тоже стоит жизней. Альбатрос соглашается и кладёт рядом с донесением пехотное расписание. Колонна, ожидающая вслепую, уязвима; то же верно для колонны, которую отправили вперёд ради красивого лозунга. До освобождения учебного участка хватит света ещё на одно дополнительное занятие.\n\nПехота может отработать захват и удержание прохода между складами, проверяя, как соседние роты прикрывают невидимые углы. Лётчики предлагают разведывательный вылет с передачей наблюдений наземным отрядам, чтобы скрытая улица наконец появилась в общем плане. У обоих решений есть исполнители, уже ожидающие приказа у выхода. Альбатрос оставляет стрелку незаконченной, пока организаторы не решат, какую неизвестность следует устранить первой. Начинать упражнение только ради уверенного вида законченной карты он отказывается."
 HSM_AQR.628.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.628.t:0 "Альбатрос не дорисовал стрелку"
 HSM_AQR.629.0:0 "Пусть Аквелия услышит обещание резерва."
 HSM_AQR.629.1:0 "Отправить добровольцев к раненым и потерявшим близких."
 HSM_AQR.629.d:0 "Пожилой грифон с повязкой подготовил прежнее предупреждение, когда-то звучавшее в комнате за закрытыми ставнями: у Аквелии есть враги, и её забытые дети должны быть готовы. Теперь перед ним заводские смены, сельские делегаты и ветераны, чьи пустые рукава колышет морской ветер. Рабочий спрашивает, когда готовность оставит вечер для посещения раненых.\n\nОратор смотрит на национальное знамя. Отказываться от предупреждения он не собирается. Но понимает и другое: очередной парад не поднимет еду по лестнице в комнату ветерана. Местные организаторы собрали добровольцев, которых на этой неделе хватит на одно большое общее дело.\n\nМожно превратить встречу в патриотический сбор резерва, сделав защиту революционного государства публичным обязательством за пределами старых ячеек. Можно повести добровольцев в больницы и дома потерявших близких, показывая, что движение помнит людей после их ухода из строя. На площади ждут и желающие записаться, и те, кто принёс адреса нуждающихся. Оратор складывает последнюю страницу выступления и ждёт ответа организаторов, прежде чем снова подойти к краю трибуны."
 HSM_AQR.629.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.629.t:0 "Знамя и пустые рукава"
 HSM_AQR.630.0:0 "Сегодня разобрать требование жильцов прямо в доме."
 HSM_AQR.630.1:0 "Сделать это дело общенациональным требованием коалиции."
 HSM_AQR.630.d:0 "Пьер приводит Луи к дому, отремонтированному муниципальной бригадой. Крыша больше не течёт, но жильцам выставили новую плату, словно оплаченные обществом работы были личным улучшением владельца. Представитель МАФ приходит с ремонтным соглашением и обнаруживает, что именно этот вопрос в нём не решён.\n\nЛуи требует ответа перед жильцами. Он помнит, как легко большие обещания исчезали на пути от собрания до чужой двери. Представитель согласен разобраться с требованием, однако видит такое же упущение в нескольких ожидающих договорах. Местное соглашение сразу успокоит пострадавшие семьи; тщательно подготовленное дело даст национальной партии конкретное предложение для законодательной работы.\n\nСтроители ждут следующего назначения, и ни один союзник не хочет оставлять их без дела, пока спор распространяется по городу. Пьер освобождает место для бумаг на починенной лестнице. Сегодня придётся сосредоточить усилия либо на разговоре с жильцами и владельцем, либо на обращении к более широкому партийному кругу. Луи просит записать выбранный ответ здесь, где семьи смогут увидеть его, возвращаясь домой с работы."
 HSM_AQR.630.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.630.t:0 "Плата под новой крышей"
 HSM_AQR.631.0:0 "Провести полное санитарное учение с ротами."
 HSM_AQR.631.1:0 "Принять и обучить новых добровольцев."
 HSM_AQR.631.d:0 "Пейн Леве ждёт у узкого моста, пока гражданский комитет измеряет санитарную повозку. Молодой доброволец бормочет, что Придея уже видела достаточно пони, указывающих грифонам, где стоять. Пьер, несущий задний конец носилок, просит его взять передний, прежде чем продолжать жалобу. Вместе они обнаруживают, что безопасно повернуть здесь невозможно.\n\nЛеве не требует извинений. Он просит комитет наметить лучший подход и объясняет, почему носильщикам нужно пройти его с настоящей нагрузкой. Несколько наблюдателей вызываются помочь. Прежде они не решались вступать в силы, которые, как они опасались, унаследуют прежние городские разделения и подозрения.\n\nОстаток дня можно посвятить полноценному санитарному учению нынешних рот, превратив замечание комитета в общий практический урок. Можно устроить открытое вводное занятие для новых добровольцев, поручив ветеранам показать настоящие обязанности будущей службы. Пьер опускает носилки на траву и разминает затёкшее плечо. Следующая группа уже ждёт задания, а измеренная повозка остаётся у моста напоминанием о том, с чего начался сегодняшний спор."
 HSM_AQR.631.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.631.t:0 "Леве ждёт комитет"
 HSM_AQR.632.0:0 "Провести общее собрание и вместе отвечать на вопросы."
 HSM_AQR.632.1:0 "Рассказать новым избирателям о работе коалиции."
 HSM_AQR.632.d:0 "Луи находит у коалиционного зала две листовки. Одна призывает поддержать общенациональную программу МАФ; другая требует сохранить за производственными советами полномочия, которые парламентское большинство не должно легко отменять. Партийный организатор предлагает раздавать листовки в разные дни. Луи спрашивает, зачем скрывать разногласие от тех, кому предстоит голосовать.\n\nПьер выносит стулья к собирающимся жителям. Одни рабочие хотят задать вопросы обеим сторонам вместе. Другие пришли помочь коалиции рассказать о соглашениях по жалованью и муниципальных ремонтах в кварталах, где её знают лишь по старым обвинениям. Сегодня невозможно провести обстоятельное обсуждение и отправить тех же добровольцев обходить весь город.\n\nСовместное собрание позволит услышать спор, не принимая разногласие за конец союза. Общий обход донесёт результаты работы до новых избирателей, сохраняя за каждой стороной собственную листовку. Ни один вариант не решает исход следующих выборов и не запрещает дальнейшего спора. Двери остаются открытыми, пока партнёры выбирают, куда направить усилия. Луи кладёт оба листка рядом, чтобы вошедшие могли прочитать их самостоятельно."
 HSM_AQR.632.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.632.t:0 "Две листовки у одной двери"
 HSM_AQR.633.0:0 "Отправить зерно в рыночные кухни."
 HSM_AQR.633.1:0 "Обеспечить добровольцев и отпустить их батраков."
 HSM_AQR.633.d:0 "Купец переворачивает серебряное блюдо Гадиффера и рассматривает родовое клеймо, прежде чем назвать цену. Рядом арендаторша держит мешок посевного зерна: она принесла его показать, чем деревни не могут пожертвовать. Управляющий возражает, что продажа блюда накормит округ лишь однажды. Заём под будущий урожай позволит сохранить положение герцогского дома и обращаться за помощью снова.\n\nГадиффер спрашивает, чьё положение уцелеет, если урожай погибнет. Купец отвечает, что продаёт зерно, а не уверенность. Он отпустит телеги под любой из предложенных залогов, но герцогу придётся решить, куда отправить их прежде всего.\n\nОдна партия позволит вновь открыть рыночные кухни уже к вечеру. Другая обеспечит добровольцев, ожидающих у казарм, и даст возможность вернуть домой занятых при них батраков. На обоих прошениях стоят знакомые герцогу имена. Он придвигает блюдо к купцу и спрашивает арендаторшу, какая дорога ещё проходима. Та ставит мешок на пол и просит принести карту: дворцовый писарь отметил мост, которого больше нет."
 HSM_AQR.633.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.633.t:0 "Последнее серебряное блюдо"
 HSM_AQR.634.0:0 "Отправить офицеров вместе с телегами."
 HSM_AQR.634.1:0 "Набрать деревенскую обозную команду."
 HSM_AQR.634.d:0 "Роберт Ниверолле застаёт полковника возле пустого хлебного ящика, пока деревенские возчики разгружаются у другого склада. На расписании подвоза стоит подпись самого полковника. Он признаёт, что перевёл полевые кухни ради парада и не предупредил тех, кто вёз муку. Теперь он хочет, чтобы Гадиффер распорядился немедленно взять продовольствие у ближайших крестьян.\n\nГерцог приезжает с возчиком, который уже дважды проделал этот путь. Ниверолле кладёт расписание на хлебный ящик. Кому-то придётся сопровождать телеги, проверить разгрузку и сообщить об изменившемся маршруте; одна подпись этой работы не сделает.\n\nПолковник предлагает отправить младших офицеров. Возчик советует дать им в спутники местных жителей, знающих каждый двор и способных собрать соседей для постоянного подвоза. Гадиффер может устроить практические занятия для офицеров либо поддержать гражданскую обозную команду. Оба решения наполнят ящик. Вопрос в том, кто научится не допускать новой задержки. Ниверолле поднимает испачканное расписание и просит полковника самому показать дорогу к новому складу."
 HSM_AQR.634.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.634.t:0 "Пустой хлебный ящик полковника"
 HSM_AQR.635.0:0 "Привезти обе делегации в королевскую канцелярию."
 HSM_AQR.635.1:0 "Добиться общего слушания через разъездных поверенных."
 HSM_AQR.635.d:0 "Гадиффер узнаёт почерк своего виновийского управляющего прежде, чем замечает второе прошение под первым. Оба касаются семей солдат, служивших короне. Первое скреплено печатью герцогства и снабжено обстоятельной рекомендацией. Второе пришло из другой провинции: свидетельские показания обёрнуты вокруг детского рисунка с изображением пропавшего родителя.\n\nКоролевская канцелярия предлагает открытое слушание, но второй делегации не по средствам ещё одна долгая поездка. Секретарь советует сначала заняться виновийским делом: герцог знает свидетелей и быстро разберётся. Другое прошение потребует неудобных вопросов об обещаниях королевского офицера, которого пока никто не вызвал для объяснений.\n\nГадиффер кладёт бумаги рядом. Родство помогло ему внести их в эту комнату, но не позволяет решить, какая семья больше заслуживает ответа. Он может оплатить приезд обеих делегаций в королевскую канцелярию. Либо добьётся полномочий для разъездных поверенных, которые соберут показания в обоих округах и представят дела вместе. Герцог велит пока оставить оба прошения у него, чтобы ни одно не вернулось обратно без ответа."
 HSM_AQR.635.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.635.t:0 "Прошение без нашей печати"
 HSM_AQR.636.0:0 "Выплатить задолженность и отпустить смену домой."
 HSM_AQR.636.1:0 "Оплатить добровольцам завершение оружейного заказа."
 HSM_AQR.636.d:0 "Гийом Букарле приходит в кооператив за отремонтированными винтовками и застаёт спор о заработке ученика. Студент, ведущий книги, записал мальчика в расходы на обучение. Машинист рядом спрашивает, почему эти расходы вчера оставили в одиночестве заканчивать срочный заказ, когда остальные уже ушли домой.\n\nБукарле кладёт накладную на верстак. Его солдатам нужно оружие, но распределять заработок мастерской он не вправе. Ученик объясняет, что семья берёт ужин в долг, пока кооператив поздравляет себя с тем, что теперь принадлежит всем своим работникам.\n\nСобрание может досрочно закрыть счета, выплатить задолженность и отменить вечернюю смену. Можно также выдать заработанное и пригласить оплачиваемых добровольцев закончить винтовки ночью, использовав запас денег для следующего гражданского заказа. Ни одно предложение не возвращает ученика на прежнюю строку книги. Студент зачёркивает заголовок и оставляет место для его имени. Машинист подвигает мальчику стул: сегодня решение будут принимать вместе с ним, а не просто объявят после очередного окончания работы."
 HSM_AQR.636.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.636.t:0 "Место ученика в книге"
 HSM_AQR.637.0:0 "Дать нынешнему классу время подготовить инструкторов."
 HSM_AQR.637.1:0 "Открыть начальный курс ожидающим добровольцам."
 HSM_AQR.637.d:0 "Жан-Батист Жюль Желинот-де-Буа приходит в вечерний класс, когда новый инструктор объясняет отход взвода. Маршал спрашивает, кто проверяет последнюю комнату. Ответ вызывает сразу три возражения ветеранов, сидящих среди учеников. Он отправляет спорящих во двор показать предложенные варианты на практике, используя школьные двери вместо нарисованных проходов.\n\nУпражнение затягивается, и смотритель выносит лампу. Один студент пропустил последний трамвай, другому утром выходить в первую смену. Инструктор спрашивает, действительно ли армия намерена учить граждан командованию или лишь восхищается самой этой мыслью, пока занятия ничего от неё не требуют.\n\nМаршал предлагает небольшую группу опытных преподавателей. Они могут несколько недель заниматься с нынешним классом, пока выпускники не смогут учить других. Либо они откроют начальный курс для рабочих, ожидающих за воротами; некоторые уже просятся на службу. Организаторам ABC предстоит выбрать между углублённой подготовкой немногих командиров и приёмом большего числа соседей в регулярные части. У ворот всё ещё видны огоньки сигарет ожидающих."
 HSM_AQR.637.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.637.t:0 "Маршал и вечерний класс"
 HSM_AQR.638.0:0 "Дать рабочим семьям возможность участвовать."
 HSM_AQR.638.1:0 "Обсудить обращение семей в казармах и мастерских."
 HSM_AQR.638.d:0 "Гийом Букарле приходит на собрание ABC с прошением солдатских семей. Он ещё не успевает прочесть его, когда делегатка мастерской поднимается со стула у самой двери. Ей пора уходить: соседка, присматривающая за детьми, вскоре выходит на работу. Между тем половину предложений пока даже не начали обсуждать.\n\nОдин из основателей советует доверить голос товарищу. Делегатка отвечает, что республика наконец дала ей голос и немедленно попросила передать его кому-нибудь ещё. Букарле складывает прошение. Солдаты написали его именно потому, что их семьи не всегда могут присутствовать на таких собраниях; сейчас их жалоба уже прозвучала вслух.\n\nДобровольцев хватает лишь на одно дополнительное начинание. Организаторы могут устроить присмотр за детьми и повторные встречи рядом с вечерними сменами, обеспечив делегатам постоянное место на съезде. Или они вместе объедут казармы и рабочие кварталы, объясняя, как социальная республика намерена защищать семьи, несущие тяготы службы. Букарле оставляет прошение на столе, чтобы оно не исчезло вместе с уходящими."
 HSM_AQR.638.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.638.t:0 "Стул у самой двери"
 HSM_AQR.639.0:0 "Дать семье место среди признанных мастеров."
 HSM_AQR.639.1:0 "Купить проверенные винтовки для гвардии."
 HSM_AQR.639.d:0 "Изабель де Пье-Грийеш заходит на ярмарку проверить предложенную оружейником партию и находит его лавку за мусорными телегами. Он привёз винтовки, отремонтированные семьёй, недавно поселившейся в Виновии. Устроитель объясняет, что лучшие места оставлены ремёслам с местными корнями. Оружейник спрашивает, сколько поколений должны ждать его дети, прежде чем такие корни появятся у их собственной работы.\n\nПовариха из соседней лавки узнаёт знакомый вопрос. С её блюдами поступали так же, когда она продавала их в других местах под виновийскими названиями. Она предлагает перенести стол к оружейнику, хотя тогда оба окажутся в стороне от главного потока посетителей.\n\nУправляющие рыцарей верности могут переставить лавки и открыто принять новоприбывших среди признанных мастеров. Либо они направят сегодняшний закупочный фонд на проверенные винтовки для гвардии, обеспечив семью оплаченным заказом и покупателем, готовым поставить своё имя рядом с её именем. Изабель ждёт ответа, положив осмотренную винтовку на прилавок перед хозяином."
 HSM_AQR.639.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.639.t:0 "Лавка без покровителя"
 HSM_AQR.640.0:0 "Поручить офицерам учения с деревенскими хозяевами."
 HSM_AQR.640.1:0 "Нанять возчиков на постоянную обозную службу."
 HSM_AQR.640.d:0 "Изабель де Пье-Грийеш приносит обозникам карту снабжения гвардии и просит отметить вчерашний учебный переход. Их путь далеко отклоняется от поместий, указанных как склады. Капитан объясняет, что поместья принадлежат надёжным покровителям. Изабель спрашивает, поможет ли надёжность доставить телегу до темноты, если выбранная дорога требует ещё целого дня пути.\n\nХозяин неотмеченного деревенского амбара предлагает место при условии, что гвардия заплатит за взятое и оставит соседям доступ к собственным запасам. Покровителю не нравится доверять припасы человеку, которого нет в благотворительном комитете. Капитан негромко признаётся, что именно этот крестьянин накормил его отставший дозор.\n\nРыцари верности могут отправить офицеров учиться открывать склады вместе с деревенскими хозяевами, лично разбираясь в условиях. Или они наберут оплачиваемую обозную команду из возчиков, уже знающих эти дороги. Усадьба останется полезным хранилищем. Просто она перестанет быть единственным местом, которое помнит карта. Изабель передаёт карандаш обознику и просит отметить остальные пропущенные дворы."
 HSM_AQR.640.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.640.t:0 "Дорога мимо усадьбы"
 HSM_AQR.641.0:0 "Разучить обе песни перед общей трапезой."
 HSM_AQR.641.1:0 "Пусть отряды обещают взаимную защиту своими песнями."
 HSM_AQR.641.d:0 "Делегация другой провинции предлагает песню для федеративной церемонии. Нескольким покровителям рыцарей верности непривычен её ритм; один спрашивает, не придал бы виновийский марш торжеству больше достоинства. Изабель де Пье-Грийеш, пришедшая согласовать почётный караул, интересуется, какую песню гости обещали своим землякам услышать на этом празднике.\n\nДелегат достаёт лист, протёртый на сгибах. Он привёз его потому, что федеративная гарантия убедила его город: участие в общей Аквелии не потребует отказаться от собственной гражданской памяти. Покровитель читает перевод и обнаруживает, что странная песня тоже вспоминает соседей, погибших при защите своих улиц.\n\nУстроители могут пригласить горожан разучить обе песни перед общей трапезой. Либо марш прибывшего отряда станет частью публичного обещания взаимной защиты, на которое виновийская гвардия ответит своей песней. Оба решения требуют, чтобы хозяева сначала выслушали гостей. Изабель оставляет в церемониальном порядке свободную строку и ждёт, какую последовательность выступлений согласуют делегаты, сидящие за одним столом."
 HSM_AQR.641.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.641.t:0 "Песня, которую выбрали гости"
 HSM_AQR.642.0:0 "Опубликовать неудачу и включить смотрителя в ремонтную группу."
 HSM_AQR.642.1:0 "Обучить инженеров и солдат на временном снабжении."
 HSM_AQR.642.d:0 "Гийом Букарле привозит на открытое испытание казарменную водовозку. Инженер запускает новый насос, комиссия готовится аплодировать, и поток прекращается с громким стуком. Смотритель колодца указывает на водозаборник. Вчера он предупреждал экзаменатора общества о песке, но на утверждённом чертеже вода была чистой и ничто не мешало работе.\n\nЭкзаменатор знаком с инженером по старому кружку ОСИ. Он предлагает отложить отчёт, пока не прибудет запасная деталь. Смотритель спрашивает, может ли очередь за дверью тоже отложить свою жажду. Букарле велит вознице начать раздачу воды из бочки, пока остальные продолжают обсуждение возле сломанного насоса.\n\nКомиссия может немедленно опубликовать сведения о неудаче и пригласить смотрителя наблюдать за ремонтом, приняв публичное смущение ради доверия жителей. Либо испытание продолжится как практическое занятие: инженеры вместе с обозниками Букарле организуют временное снабжение. При любом решении сломанная деталь останется на столе. Смотритель кладёт рядом горсть песка, которую вчера принёс показать проверяющему."
 HSM_AQR.642.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.642.t:0 "Насос замолчал раньше аплодисментов"
 HSM_AQR.643.0:0 "Повторить переход с транспортными офицерами."
 HSM_AQR.643.1:0 "Отработать воздушные донесения вместе с картографами."
 HSM_AQR.643.d:0 "Гийом Букарле кладёт перед штабным классом общества два донесения. Первое сообщает, что обоз вовремя достиг места назначения. Второе пришло от возницы, всё ещё стоящего возле сада, обозначенного на карте как открытое пространство. Оба документа подписаны выпускниками одного и того же курса, причём каждый уверен в правильности своего отчёта.\n\nПреподаватель объясняет, что упражнение предполагало свободную дорогу. Букарле спрашивает, должны ли солдаты поужинать этим предположением. Воздушный наблюдатель предлагает зарисовку сада и узкого объезда; квартирмейстер замечает, что обозники знали этот переулок ещё до начала занятий.\n\nИнструкторов хватает, чтобы как следует повторить одну часть учений. Общество может заняться транспортными офицерами, заставив их пройти и исправить маршрут колонны. Либо оно соберёт наблюдателей вместе с картографами и отработает передачу поправок до отправления первой телеги. Преподаватель снимает первоначальную схему и оставляет доску чистой. Возница уже прислал ещё одно сообщение: нужно решить, куда ему двигаться, пока не стемнело."
 HSM_AQR.643.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.643.t:0 "Сад, которого нет на карте"
 HSM_AQR.644.0:0 "Опубликовать независимую проверку экзамена."
 HSM_AQR.644.1:0 "Провести открытую демонстрацию перед солдатами и мастерами."
 HSM_AQR.644.d:0 "Газетная статья обвиняет общество в том, что общегосударственную техническую должность берегут для знакомого кандидата. Тот выдержал экзамен, однако газета печатает рядом ответ другого соискателя и спрашивает, почему более точный расчёт получил низшую оценку. Участники ОСИ узнают экзаменатора: этот коллега когда-то читал лекции о республиканском равенстве.\n\nГийома Букарле пригласили потому, что должность связана с военными приборами. Он приносит неисправный калибр и просит кандидатов объяснить поломку. Оба справляются, затем расходятся в способе ремонта. Экзаменатор начинает говорить за бывшего ученика; редактор просит дать соискателям закончить собственное объяснение, прежде чем объявлять, кто убедительнее.\n\nОбщество может поручить независимую проверку письменных работ и опубликовать её доводы, приняв необходимые исправления. Либо оно устроит открытое техническое слушание, на котором оба кандидата покажут работу солдатам и гражданским мастерам. Республика получит ответ. Обществу предстоит решить, как сделать этот ответ убедительным для тех, кто не учился вместе с экзаменатором."
 HSM_AQR.644.lapsed:0 "Подшить отчёт к бумагам прежнего правительства."
 HSM_AQR.644.t:0 "Проверка экзаменатора"
 HSM_AQR.acknowledge:0 "Работа продолжается."
 HSM_AQR_CAM_JEB_cocardiers_c1:0 "«Фанал» читает свои требования"
 HSM_AQR_CAM_JEB_cocardiers_c1_desc:0 "Рабочие «Фанала» годами разносили по Риле листовки других клубов. Теперь чтец запинается над реквизицией, которая будто бы выражает их волю. Кокардьеры откроют занятия на основе настоящих мастерских объявлений и бумаг собраний. Те, кто носил революционные воззвания, должны уметь читать обещания, оспаривать поддельные распоряжения и узнавать собственные слова в печати, не полагаясь каждый раз на объяснение другого."
 HSM_AQR_CAM_JEB_cocardiers_c2:0 "Революция выслушивает свидетелей"
 HSM_AQR_CAM_JEB_cocardiers_c2_desc:0 "Делегаты за пределами Рилы спрашивают кокардьеров, почему их комитету следует доверить широкую революционную ответственность. Защитники приносят свидетельства храбрости, критики — рассказы о конфискациях и напуганных соседях. Общегосударственная кампания выслушает обе стороны, прежде чем объявить, что нужно сохранить. Движение, решившее не допустить новой реставрации, должно объяснить, какие победы принадлежат республике, а какие только обогатили отдельный клуб."
 HSM_AQR_CAM_JEB_cocardiers_e1:0 "Учесть склады богатеев"
 HSM_AQR_CAM_JEB_cocardiers_e1_desc:0 "Кокардьеры приносят в Комитет общественной безопасности ключи от захваченных складов. Внутри лежат товары, изъятые именем революции: одни ещё пригодны, другие уже расходятся по частным рукам. Движение обещало сломить богатство, поддерживавшее реставрацию. Теперь припасы должны послужить общественной работе, начиная с описей, которые даже победивший клуб не сможет незаметно переписать в пользу собственных влиятельных товарищей."
 HSM_AQR_CAM_JEB_cocardiers_e2:0 "Насосы вместо экипажей"
 HSM_AQR_CAM_JEB_cocardiers_e2_desc:0 "В конфискованной каретной ещё пахнет начищенной кожей, пока соседние мастерские ждут насосов и ремонтного инструмента. Кокардьеры зовут прежних мастеров установить верстаки под опустевшими стойками упряжи. Превращение усадебной роскоши в полезный труд проверит революционные притязания строже очередного налёта: машины должны служить людям, которые не могут просто захватить замену, если обещанное изделие сломается после первой недели работы."
 HSM_AQR_CAM_JEB_cocardiers_e3:0 "Один заказ для литейной"
 HSM_AQR_CAM_JEB_cocardiers_e3_desc:0 "Литейная получила требования изготовить детали машин, оружейную фурнитуру и парадный революционный колокол; разные клубы пометили каждый заказ срочным. Рабочие спрашивают комитет, что плавить первым. Кокардьеры сведут реквизиции в общий производственный план. Революционная решимость не позволит трижды расплавить одно железо, как бы громко заказчики ни произносили имя республики и какими заслугами ни подкрепляли свои настойчивые требования."
 HSM_AQR_CAM_JEB_cocardiers_e4:0 "Грузы вслед за воззванием"
 HSM_AQR_CAM_JEB_cocardiers_e4_desc:0 "Аквелийские клубы отвечают на общегосударственное обращение кокардьеров просьбами об инструментах, а не только об ораторах. В диспетчерской обнаруживают, что обещанные грузы ждут по нескольким несогласованным расписаниям. Делегаты отправятся с железнодорожниками связать эти поездки. Движение, обещающее защищать всю республику, должно добраться до мастерских за пределами Рилы, прежде чем просить их доверять приказам далёкого революционного комитета."
 HSM_AQR_CAM_JEB_cocardiers_e5:0 "Оружие общественных мастерских"
 HSM_AQR_CAM_JEB_cocardiers_e5_desc:0 "Воспоминание о деньгах, отданных контрабандистам за ненадёжные винтовки, до сих пор злит ветеранов-кокардьеров. Общегосударственная революционная программа не может опираться на новую отчаянную закупку. Комитет выделит мастерскую для военного производства, используя общие образцы литейной и опыт оружейников. Со станка оружие должно выходить готовым к проверке новобранцами, которым предстоит нести его и отвечать за исправность в строю."
 HSM_AQR_CAM_JEB_cocardiers_economy1:0 "Опись захваченного склада"
 HSM_AQR_CAM_JEB_cocardiers_economy1_desc:0 "Кокардьеры превращают конфискованные привилегии в рабочие запасы, а описи оспаривают частные притязания, предъявляемые от имени революции."
 HSM_AQR_CAM_JEB_cocardiers_economy2:0 "Общий график плавок"
 HSM_AQR_CAM_JEB_cocardiers_economy2_desc:0 "Соперничающие клубные реквизиции уступают место графику литейной, понятному рабочим без догадок о том, чья печать важнее."
 HSM_AQR_CAM_JEB_cocardiers_economy3:0 "Действующие арсеналы республики"
 HSM_AQR_CAM_JEB_cocardiers_economy3_desc:0 "Общественные мастерские связывают изъятые запасы, общие образцы и оружейное производство. Революционные притязания теперь должны давать пригодные изделия."
 HSM_AQR_CAM_JEB_cocardiers_m1:0 "Клуб выходит на сбор"
 HSM_AQR_CAM_JEB_cocardiers_m1_desc:0 "Добровольцы-кокардьеры приходят по клубам, ожидая сохранить собственные пароли и командиров. Бореас Бабеф считает промежутки между группами столь же внимательно, как самих новобранцев. Комитет предложит каждому клубу направить полный отряд на общую службу. Революционная армия должна уметь стоять вместе, когда знакомый зал собраний останется далеко позади и ближайшим соседом окажется грифон из прежде соперничавшего клуба."
 HSM_AQR_CAM_JEB_cocardiers_m2:0 "Уроки контрабандных винтовок"
 HSM_AQR_CAM_JEB_cocardiers_m2_desc:0 "В Дилвене инструктор раскладывает старое привозное оружие на верстаке. Одни винтовки устарели ещё до покупки, другие никогда толком не работали. Новобранцы смеются, пока он не спрашивает, какую взяли бы при отступлении. Кокардьеры превратят горькую коллекцию в практический урок: распознавать неисправности, беречь исправное оружие и отвергать опасную импровизацию, которую слишком легко выдать за революционную смелость."
 HSM_AQR_CAM_JEB_cocardiers_m3:0 "Бабеф считает пустые повозки"
 HSM_AQR_CAM_JEB_cocardiers_m3_desc:0 "Бабеф назначает быстрое учение и обнаруживает, что три клуба отправили патроны одной роте, оставив другую без снабжения. У всех посыльных действительные печати комитета. Революционное командование будет обучать диспетчеров и интендантов вместе с солдатами. Общему делу нужен путь снабжения, выдерживающий соперничество привязанностей; иначе самый быстрый марш лишь соберёт голодных добровольцев там, где уже нечем поделиться."
 HSM_AQR_CAM_JEB_cocardiers_m4:0 "Расчёт за пределами своего клуба"
 HSM_AQR_CAM_JEB_cocardiers_m4_desc:0 "Орудия прибывают с расчётами, служившими только рядом со своими товарищами. Бабеф ставит на полигоне наблюдателей другой части и велит им запросить поддержку. Первая попытка рассыпается из-за несовместимых сигналов. Революционная армия, претендующая на общегосударственную роль, должна освоить терпеливый язык общих огневых планов, где знакомый лозунг не подскажет наводчику, куда целиться и кто находится перед выбранной позицией."
 HSM_AQR_CAM_JEB_cocardiers_m5:0 "Армия, способная уйти с баррикады"
 HSM_AQR_CAM_JEB_cocardiers_m5_desc:0 "Прежние бойцы баррикад знают каждый подъезд своего квартала. За его пределами нужны повара, ремонтные повозки и посыльные, способные найти незнакомую дорогу. Кокардьеры построят общую службу вокруг этих неприметных обязанностей. Обещание защищать республику по всей Аквелии требует войск, умеющих двигаться дальше, не заставляя каждую деревню отдавать всё, чем её жители собирались кормиться после ухода проходящей колонны."
 HSM_AQR_CAM_JEB_cocardiers_military1:0 "Общий сбор клубов"
 HSM_AQR_CAM_JEB_cocardiers_military1_desc:0 "Добровольцы-кокардьеры осваивают общую службу за пределами привычек собственных клубных залов."
 HSM_AQR_CAM_JEB_cocardiers_military2:0 "Патроны независимо от клубной печати"
 HSM_AQR_CAM_JEB_cocardiers_military2_desc:0 "Общие учения диспетчеров учат революционные части направлять припасы туда, где они нужны, а не туда, где ждёт старый товарищ."
 HSM_AQR_CAM_JEB_cocardiers_military3:0 "Походная служба революции"
 HSM_AQR_CAM_JEB_cocardiers_military3_desc:0 "Клубные отряды уносят общие навыки, ремонтные команды и порядок снабжения за пределы улиц, где впервые собрались."
 HSM_AQR_CAM_JEB_constitutional_c1:0 "Прошение без покровителя"
 HSM_AQR_CAM_JEB_constitutional_c1_desc:0 "Посетители собрания всё ещё спрашивают, чьё влиятельное имя нужно поставить над собственным. Мишель слышит объяснение слуги: до хартии именно так прошения попадали к нему. Открытая приёмная будет приглашать просителей по очереди, включая совершенно незнакомых палате. Соглашение должно изменить жизнь тех, кто ждёт за дверью, так же заметно, как жизнь тех, кто выступает внутри."
 HSM_AQR_CAM_JEB_constitutional_c2:0 "Герцог ждёт своей очереди"
 HSM_AQR_CAM_JEB_constitutional_c2_desc:0 "Конституционная делегация Рилы привозит хартию на общегосударственное собрание, где другие провинции предъявляют собственные требования. Мишель просит список выступающих вместо председательского кресла. Его возвращение разрешили представители Рилы; любое более широкое положение нужно обосновывать заново. Доверие к движению теперь зависит от того, примет ли его самый известный сторонник поправки, которые предложил кто-то другой и которых он не ожидал."
 HSM_AQR_CAM_JEB_constitutional_e1:0 "Печать рядом с решением собрания"
 HSM_AQR_CAM_JEB_constitutional_e1_desc:0 "После возвращения Мишеля на условиях хартии прежние поставщики по-прежнему несут счета во дворец. Собрание направляет их к министру, разместившему заказы. Теперь герцогское обещание должно опираться на расходы, открыто одобренные представителями. Первые договоры покажут, способны ли старые знакомые работать в рамках соглашения, не проскальзывая между подписями, каждая из которых раньше казалась достаточным разрешением."
 HSM_AQR_CAM_JEB_constitutional_e2:0 "Подряд на столе читальни"
 HSM_AQR_CAM_JEB_constitutional_e2_desc:0 "Предложение построить механическую мастерскую проходит через рильские читальни, прежде чем собрание выберет подрядчика. Мишель узнаёт одного участника; печатники помнят другого по неоплаченным военным счетам. Ни одно знакомство не решает вопрос. Делегаты сравнят чертежи и выслушают будущих работников, чтобы хартия обрела первое большое дело за стенами зала, где до сих пор обсуждали главным образом её формулировки."
 HSM_AQR_CAM_JEB_constitutional_e3:0 "У калибра нет титула"
 HSM_AQR_CAM_JEB_constitutional_e3_desc:0 "Мастер отвергает поставку с внушительным гербом: детали не соответствуют заказу. Поставщик обращается к Мишелю, а тот передаёт спорные изделия испытателям мастерской. Конституционному соглашению Рилы нужны места, где доказательства способны поставить влиятельного покровителя в неудобное положение. Общая испытательная комната позволит ремесленникам решать подобные споры измерениями, которые обе стороны могут повторить самостоятельно и в присутствии друг друга."
 HSM_AQR_CAM_JEB_constitutional_e4:0 "Вопросы по проводам"
 HSM_AQR_CAM_JEB_constitutional_e4_desc:0 "Представители за пределами Рилы жалуются: ответы министров приходят, когда обсуждаемая работа уже началась. Конституционная делегация предлагает связать провинциальные учреждения и технические школы надёжным телеграфом. Инженер кладёт схемы цепей рядом с письмами без ответа. Ответственное правительство должно быть доступно не только из того коридора, где министры узнают каждого посетителя в лицо и знают, кто его рекомендовал."
 HSM_AQR_CAM_JEB_constitutional_e5:0 "Заказ переживёт покровителя"
 HSM_AQR_CAM_JEB_constitutional_e5_desc:0 "Подрядчик спрашивает, что станет с провинциальным заказом, если поддержавший его министр утратит доверие собрания. Мишель не предлагает личного поручительства. Сторонники хартии поставят одобренное дело под ответственность самой палаты и оставят документы, понятные преемнику. Их общегосударственная программа должна обещать преемственность работы, не предоставляя ни одному чиновнику права навсегда остаться на месте только ради сохранения начатого проекта."
 HSM_AQR_CAM_JEB_constitutional_economy1:0 "Заказы с ответственной подписью"
 HSM_AQR_CAM_JEB_constitutional_economy1_desc:0 "Новые рильские договоры требуют одобренных расходов и ответственного министра: у ремесленников появляется обещание, с которым можно обратиться за пределы дворца."
 HSM_AQR_CAM_JEB_constitutional_economy2:0 "Испытательные комнаты собрания"
 HSM_AQR_CAM_JEB_constitutional_economy2_desc:0 "В общественных мастерских Рилы измерения и записанные требования постепенно заменяют рекомендацию знакомого покровителя."
 HSM_AQR_CAM_JEB_constitutional_economy3:0 "Договоры под защитой хартии"
 HSM_AQR_CAM_JEB_constitutional_economy3_desc:0 "Технические обоснования сопровождают общественные заказы, а утверждённая работа переживает смену министров. Рильская хартия обретает практическую жизнь в промышленности."
 HSM_AQR_CAM_JEB_constitutional_m1:0 "Присяга без пропущенных строк"
 HSM_AQR_CAM_JEB_constitutional_m1_desc:0 "Новобранцы собираются у хартии, вывешенной рядом со столом записи. Одни ожидают присяги Мишелю, другие опасаются частного войска очередного клуба. Анна-Жозефина де Мерикур читает текст вслух, прежде чем позвать добровольцев. Служить предстоит законным учреждениям, созданным совместно. Солдат должен понимать, чьи распоряжения обязательны для полка и кто вправе потребовать отчёта о приказах, отданных от имени новой власти."
 HSM_AQR_CAM_JEB_constitutional_m2:0 "Повышение при свидетелях"
 HSM_AQR_CAM_JEB_constitutional_m2_desc:0 "Опытный инструктор и молодой писарь приходят на один офицерский экзамен. Первый знает местность; второй без помощи читает любое наставление. Мерикур предлагает обоим провести отделение через незнакомое упражнение. Конституционной армии нужны школы, где можно передавать опыт и проверять знания, не позволяя семейным связям решать, чьи ошибки простительны и кого признают неспособным после первой же неудачной попытки."
 HSM_AQR_CAM_JEB_constitutional_m3:0 "У чрезвычайного приказа есть автор"
 HSM_AQR_CAM_JEB_constitutional_m3_desc:0 "На мобилизационных учениях обнаруживается приказ, подписанный только названием комитета. Начальник станции не может узнать, кто вправе его изменить, и две роты ждут у загруженного поезда. Мерикур приносит распоряжение в министерство. Хартия должна допускать срочные действия, но оставлять конкретного офицера, обязанного объяснить, что было приказано и почему железная дорога остановилась перед отправкой давно готового состава."
 HSM_AQR_CAM_JEB_constitutional_m4:0 "Арсенал, открытый для проверки"
 HSM_AQR_CAM_JEB_constitutional_m4_desc:0 "Собранию предлагают расширить оружейное производство по закрытому соглашению. Военные делегаты признают необходимость охранять чертежи, но спрашивают, почему нужно скрывать ещё и счета. Подотчётный арсенал даст конституционной программе практический ответ. Рабочие, проверяющие и офицеры будут знать, какую дверь вправе открыть, не добиваясь милости покровителя и не оправдывая каждый обычный вопрос подозрением в измене."
 HSM_AQR_CAM_JEB_constitutional_m5:0 "Штаб, отвечающий перед палатой"
 HSM_AQR_CAM_JEB_constitutional_m5_desc:0 "Карты нескольких провинций покрывают министерский стол. Каждая делегация по-своему помнит, что когда-то позволяла чрезвычайная власть. Мерикур предлагает общие штабные учения с последующим разбором донесений гражданскими представителями. Конституционное движение должно показать, что согласованная армия способна выполнять ясные приказы, сохраняя за обществом право задавать неудобные вопросы правительству, от чьего имени эти приказы были отданы."
 HSM_AQR_CAM_JEB_constitutional_military1:0 "Хартия в казарме"
 HSM_AQR_CAM_JEB_constitutional_military1_desc:0 "Присяга новобранца указывает законные учреждения над полком. Личной верности предстоит найти место внутри общего обязательства."
 HSM_AQR_CAM_JEB_constitutional_military2:0 "Подписанные срочные донесения"
 HSM_AQR_CAM_JEB_constitutional_military2_desc:0 "У срочных приказов теперь есть авторы, которых можно найти и расспросить. Офицеры готовятся совместно, сохраняя ясную ответственность."
 HSM_AQR_CAM_JEB_constitutional_military3:0 "Конституционный генеральный штаб"
 HSM_AQR_CAM_JEB_constitutional_military3_desc:0 "Общий штаб согласует действия провинциальных частей, а министры отвечают за предоставленные ему полномочия."
 HSM_AQR_CAM_JEB_moderate_c1:0 "Прочесть предложение самому"
 HSM_AQR_CAM_JEB_moderate_c1_desc:0 "Посыльные «Фанала» когда-то разносили печатные слова рабочим, которые не умели их читать. В вечерних комнатах умеренных клубов наборщик кладёт короткое предложение для собрания рядом с упражнением по чтению. Ученики смогут оспорить фразу, как только разберут её смысл. Республика получит граждан, которым не нужны ни землевладелец, ни доброжелательный оратор, объясняющий, что написано на листе."
 HSM_AQR_CAM_JEB_moderate_c2:0 "Клубы, проигравшие голосование"
 HSM_AQR_CAM_JEB_moderate_c2_desc:0 "Умеренная делегация возвращается с общегосударственного республиканского собрания, не победив во всех спорах. Дома нетерпеливый сторонник требует больше не пускать отвергнутых ораторов в общественный зал. Société Justice отклоняет предложение. Клубы вошли в широкое движение, чьи решения порой будут их разочаровывать; достойное место в нём требует сделать разногласия переносимыми и для соседей, проигравших сегодняшнее голосование."
 HSM_AQR_CAM_JEB_moderate_e1:0 "Прилавок без покровителя"
 HSM_AQR_CAM_JEB_moderate_e1_desc:0 "Умеренные клубы находят одни и те же имена во всех списках привилегированных торговцев. За воротами плетельщица корзин ждёт рекомендации важного лица. Société Justice выслушает таких продавцов перед составлением новых рыночных правил. Республика, которую защищали небольшие мастерские, должна позволить их владельцам добираться до покупателя, не обзаводясь сначала приятелем среди людей, распоряжающихся местами у торговых рядов."
 HSM_AQR_CAM_JEB_moderate_e2:0 "Машинный зал на общие взносы"
 HSM_AQR_CAM_JEB_moderate_e2_desc:0 "Печатнику токарный станок нужен изредка; тележный мастер вовсе не может его купить. На встрече у Де Бекинье ремесленники предлагают открыть машинный зал на общие взносы с доступом по записи. Умеренный комитет поможет превратить замысел в действующую мастерскую. Её станки должны быть доступны и соседям, чьи клубные значки отличаются от значков учредителей, первыми внесших деньги."
 HSM_AQR_CAM_JEB_moderate_e3:0 "Расписки пережили баррикады"
 HSM_AQR_CAM_JEB_moderate_e3_desc:0 "Мелкие поставщики приносят революционные расписки, которые никто не умеет погасить. Одни доставляли бумагу, другие хлеб или железо; многие теперь сами должны соседям. Умеренные клубы сверят требования в общей расчётной конторе. Возвращение к работе требует связать обещания с оплаченным ими трудом, не объявляя каждого неудобного кредитора врагом республики только за просьбу выполнить старое обязательство."
 HSM_AQR_CAM_JEB_moderate_e4:0 "Вагон для малого города"
 HSM_AQR_CAM_JEB_moderate_e4_desc:0 "Крупнейшие республиканские клубы легко заполняют вагон товарами своих сторонников. Маленький город не может, и его ящики остаются на платформе под речи об общегосударственной солидарности. Рильские умеренные предлагают собирать небольшие партии вдоль общего маршрута. Их вклад в общую республику оценят торговцы, которым расписание нужнее очередного приглашения аплодировать на собрании, пока груз мокнет под открытым небом."
 HSM_AQR_CAM_JEB_moderate_e5:0 "Цены за дверями клуба"
 HSM_AQR_CAM_JEB_moderate_e5_desc:0 "Торговец узнаёт о далёкой нехватке раньше рынка и скупает все свободные мешки. Клубные печатники предлагают публиковать регулярные цены из других провинций, сверяя сообщения с телеграфистами. Умеренные принесут в общую республиканскую политику эту скромную службу: сведения должны доходить до мелкого производителя прежде, чем осведомлённый покупатель закончит торг и увезёт весь товар, оставив остальным только слухи."
 HSM_AQR_CAM_JEB_moderate_economy1:0 "Прилавок без рекомендации"
 HSM_AQR_CAM_JEB_moderate_economy1_desc:0 "Мелкие рильские производители ищут покупателей, не одалживая сначала имя придворного или клубного руководителя."
 HSM_AQR_CAM_JEB_moderate_economy2:0 "Расчётная контора ремесленников"
 HSM_AQR_CAM_JEB_moderate_economy2_desc:0 "Общее оборудование и сверенные расписки позволяют самостоятельным мастерским браться за работу, непосильную каждой по отдельности."
 HSM_AQR_CAM_JEB_moderate_economy3:0 "Соглашение производителей и умеренных"
 HSM_AQR_CAM_JEB_moderate_economy3_desc:0 "Сборные грузы, общедоступные цены и надёжные расчёты связывают самостоятельных производителей Рилы с общереспубликанским хозяйством."
 HSM_AQR_CAM_JEB_moderate_m1:0 "У добровольца есть мастерская"
 HSM_AQR_CAM_JEB_moderate_m1_desc:0 "В мастерскую приносят караульный список: все опытные работники назначены на одну неделю. Хозяин и подмастерья вместе идут в умеренный комитет. Мерикур согласует службу с занятиями, которые поддерживают жизнь округа, предложив работодателям и добровольцам составить выполнимые смены. Гражданское войско должно оставаться узнаваемой частью общества, которое оно защищает, а не оставлять за собой закрытые двери нужных соседям мастерских."
 HSM_AQR_CAM_JEB_moderate_m2:0 "Проверить каждую подаренную винтовку"
 HSM_AQR_CAM_JEB_moderate_m2_desc:0 "Клубы гордо показывают оружие, собранное во время восстания, включая винтовки, которые заклинивает после нескольких выстрелов. Знакомый даритель просит оружейника не позорить его перед добровольцами. Умеренный комитет поддерживает проверку. Благодарность можно выразить в речи; новобранцам нужны инструкторы, способные отложить опасный подарок, не выясняя, кто его преподнёс и сколько хороших знакомых сидит у этого дарителя в ближайшем клубе."
 HSM_AQR_CAM_JEB_moderate_m3:0 "Смена приходит до голосования"
 HSM_AQR_CAM_JEB_moderate_m3_desc:0 "Вечернее собрание начинается, пока окружная стража ждёт смены. Соседи уже заняли лучшие места и определяют повестку. Мерикур приносит расписание клубным представителям. Обязанности должны надёжно переходить между подразделениями, чтобы служба не лишала гражданина голоса. Та же привычка пригодится, когда причиной сменить караул станет усталость, а не заседание, и рядом не окажется председателя, способного лично разыскать опоздавших."
 HSM_AQR_CAM_JEB_moderate_m4:0 "Ремонт без клубных цветов"
 HSM_AQR_CAM_JEB_moderate_m4_desc:0 "Офицеры из других провинций привозят повреждённое оружие и обнаруживают, что ремонтная очередь по-прежнему зависит от старой политической дружбы. Умеренные делегаты предлагают отдельную оружейную мастерскую, где порядок определят состояние изделий и нужда. Поддерживать общую республику значит принимать незнакомые части у того же верстака, даже когда их солдаты поют другой вариант революционной песни и носят непривычные кокарды."
 HSM_AQR_CAM_JEB_moderate_m5:0 "Место гражданина в резерве"
 HSM_AQR_CAM_JEB_moderate_m5_desc:0 "Вернувшийся доброволец знает место сбора своей части, но не знает, кто привезёт санитарные повозки и сменит уставших часовых. Умеренные клубы приглашают медиков и инструкторов резерва составить общий план. Их армия будет защищать республику силами округов, способных удерживать позицию, сменять соседей и принимать раненых домой, не теряя связи с общей службой после первых дней напряжения."
 HSM_AQR_CAM_JEB_moderate_military1:0 "График добровольцев из мастерских"
 HSM_AQR_CAM_JEB_moderate_military1_desc:0 "Местную службу согласуют с занятиями семей и ремесленников, поддерживающих жизнь округа. Гражданская стража знает места, которые должна защищать."
 HSM_AQR_CAM_JEB_moderate_military2:0 "Надёжная смена"
 HSM_AQR_CAM_JEB_moderate_military2_desc:0 "Стража учится передавать позиции до того, как усталость превратит добросовестного добровольца в невнимательного часового."
 HSM_AQR_CAM_JEB_moderate_military3:0 "Окружные резервы республики"
 HSM_AQR_CAM_JEB_moderate_military3_desc:0 "Медики, ремонтные мастерские и резервные роты поддерживают оборонительную службу, опирающуюся на повседневную жизнь республиканских округов."
 HSM_AQR_CAM_JEB_royal_c1:0 "Книги возвращаются на полки"
 HSM_AQR_CAM_JEB_royal_c1_desc:0 "Книготорговцы приносят Мишелю списки пропавших томов: одни забрала стража, другие успели спрятать перед обыском. Прежние гости герцога помнят обещание предоставить мысли убежище в Риле. Он выделяет комнаты для чтения и занятий, затем спрашивает библиотекарей, что нужно для открытия. Придворным не предлагают выбирать, с какими мирными суждениями разрешат знакомиться ученикам, пришедшим сюда после работы."
 HSM_AQR_CAM_JEB_royal_c2:0 "Голос верной Рилы"
 HSM_AQR_CAM_JEB_royal_c2_desc:0 "Делегация Мишеля везёт общегосударственному монархическому движению не только заверения в верности, но и жалобы. Провинциальные семьи теряли близких по обе стороны баррикад, и торжественная речь не отвечает на все вопросы. Герцог представит прошения представителям короны. Служба Рилы законной династии должна включать неудобную обязанность рассказывать союзникам, что приходится переживать подданным, от имени которых произносят верноподданнические слова."
 HSM_AQR_CAM_JEB_royal_e1:0 "Ярмарка герцога должна себя кормить"
 HSM_AQR_CAM_JEB_royal_e1_desc:0 "Казначей Мишеля помнит каждую дворянскую льготу, но почти ни одну не может объяснить. На ярмарке ремесленник платит за место, пока привилегированный торговец занимает целую улицу. Герцог требует обе книги сборов. Королевский рынок должен кормить окружающий город, и ради этого обещания двору придётся расстаться с некоторыми удобными привычками, которые давно считались совершенно естественными."
 HSM_AQR_CAM_JEB_royal_e2:0 "Инструменты под королевской печатью"
 HSM_AQR_CAM_JEB_royal_e2_desc:0 "Сломанный пресс и простаивающая пила говорят Мишелю о восстановлении больше придворных приветствий. Он приглашает рильских мастеров предложить заказы для общей инструментальной мастерской под герцогским покровительством. Дворец способен поручиться за заказ, но не определить качество режущей кромки. Проверять изделия будут ремесленники, которым предстоит ими работать, даже если поставщика давно и хорошо знают в дворцовой приёмной."
 HSM_AQR_CAM_JEB_royal_e3:0 "Дорога Фловерино на ярмарку"
 HSM_AQR_CAM_JEB_royal_e3_desc:0 "Крестьяне под Фловерино видят ярмарочные шатры задолго до приезда. Колеи и запущенная переправа отнимают утро, а лучшие места достаются торговцам с лёгкими повозками. Мишель отправляет дорожных мастеров со следующим обозом. Королевское попечение будут оценивать по всему пути, где сломанная ось способна погубить недельный труд, а встречный возчик полезнее парадного чиновника с красивой дорожной картой."
 HSM_AQR_CAM_JEB_royal_e4:0 "Стапель для Пелиса"
 HSM_AQR_CAM_JEB_royal_e4_desc:0 "Верфи Пелиса нужно место для нового корпуса, а рабочим — уверенность, что королевский праздник не поглотит их жалованье. Представители Мишеля привозят договор о строительстве вместо приказа готовить парад. Морское ремесло герцогства послужит короне Аквелии лучше, если корабельщик, закладывающий киль, знает, кто оплатит работу и куда обратиться, когда обещанные деньги снова задержатся в чьей-нибудь конторе."
 HSM_AQR_CAM_JEB_royal_e5:0 "Покровительство дольше праздника"
 HSM_AQR_CAM_JEB_royal_e5_desc:0 "Гости из Аквелии уже полюбовались рильскими ярмарками и кораблями; теперь Мишель приглашает их остаться на осмотр мастерских. Корона не может бесконечно жить благодарностью за прекрасный праздник. Герцогские инженеры поделятся чертежами с королевскими подрядчиками других провинций и передадут незаметные навыки, благодаря которым кран продолжает работать после того, как знамёна сняты, а почётные гости разъехались по домам."
 HSM_AQR_CAM_JEB_royal_economy1:0 "Счета самой ярмарки"
 HSM_AQR_CAM_JEB_royal_economy1_desc:0 "Покровительство Мишеля обретает обязательства: приближённые торговцы должны объяснить, какую пользу их привилегии приносят трудовой Риле."
 HSM_AQR_CAM_JEB_royal_economy2:0 "Дороги под королевскими знамёнами"
 HSM_AQR_CAM_JEB_royal_economy2_desc:0 "Ярмарка и её поставщики привыкают полагаться на исправную дорогу, подписанный заказ и мастерскую, которая открывается вовремя."
 HSM_AQR_CAM_JEB_royal_economy3:0 "Рильские поставщики короны"
 HSM_AQR_CAM_JEB_royal_economy3_desc:0 "От повозок Фловерино до стапелей Пелиса королевское покровительство опирается на мастеров, чья работа должна оправдывать печать над их дверями."
 HSM_AQR_CAM_JEB_royal_m1:0 "Гарне осматривает гарнизоны"
 HSM_AQR_CAM_JEB_royal_m1_desc:0 "Бо Гарне встречает гарнизон, который гордится знамёнами и небрежно хранит припасы. Он спрашивает молодого часового, что случится, если прибрежную дорогу перережут. Ответ заставляет капитана спешиться. Верные полки Рилы начнут с того, что внушает солдату доверие: своевременной смены, надёжных позиций и офицеров, знающих местность лучше, чем порядок построения перед очередным визитом высокого начальства."
 HSM_AQR_CAM_JEB_royal_m2:0 "Винтовка по единому образцу"
 HSM_AQR_CAM_JEB_royal_m2_desc:0 "Ящики от королевских поставщиков не всегда подходят к оружию на полковых стойках. Гарне приглашает оружейников в казармы и велит солдатам положить винтовки рядом с запасными деталями. О престижных контрактах придворные могут спорить в другом месте. Здесь спор заканчивается, когда сменный затвор подходит, а рота может выступить, не одалживая нужные инструменты у соседей перед самым выходом."
 HSM_AQR_CAM_JEB_royal_m3:0 "Повозка за знаменем"
 HSM_AQR_CAM_JEB_royal_m3_desc:0 "Полковое знамя появляется в деревне раньше хлебной повозки, и приветствия вскоре сменяются спором о реквизициях. Гарне отправляется по следу отставшего обоза. Войско законной короны не вправе требовать, чтобы каждая деревня исправляла его ошибки. Интендантам придётся договариваться о поставках до выступления, а капитанам — соблюдать договорённости, даже когда проще всего просто войти в ближайший амбар."
 HSM_AQR_CAM_JEB_royal_m4:0 "Береговая стража короны"
 HSM_AQR_CAM_JEB_royal_m4_desc:0 "Из Пелиса торговый капитан замечает незнакомый силуэт задолго до того, как о нём узнают в штабе. Королевской службе пригодится этот опыт, но каждый выход на рыбалку не должен превращаться в допрос. Морские офицеры встретятся с лоцманами за их столами и согласуют сигналы и места встречи, чтобы жители побережья помогали укрывать суда и предупреждать корабли сопровождения."
 HSM_AQR_CAM_JEB_royal_m5:0 "Полки, достойные своей присяги"
 HSM_AQR_CAM_JEB_royal_m5_desc:0 "Гарне раскладывает отчёты рильских учений перед офицерами других королевских частей. У них разные привычки и общий вопрос: что должен сохранять солдат, когда приказы противоречат друг другу? Гарне начинает с пути снабжения и участка каждой роты. Мишель хочет укреплять законную корону службой Рилы, качество которой смогут признать и полки, никогда прежде не подчинявшиеся его герцогской власти."
 HSM_AQR_CAM_JEB_royal_military1:0 "Гарнизонные обходы Гарне"
 HSM_AQR_CAM_JEB_royal_military1_desc:0 "Верность удерживает знамёна на древках; Гарне требует, чтобы подготовленные позиции и внимательные офицеры сохраняли жизнь стоящим под ними солдатам."
 HSM_AQR_CAM_JEB_royal_military2:0 "Обеспеченные королевские гарнизоны"
 HSM_AQR_CAM_JEB_royal_military2_desc:0 "Хлебная повозка занимает в планах капитана место рядом с ротным знаменем. Королевские части учатся удерживать позиции, не разоряя принимающие их селения."
 HSM_AQR_CAM_JEB_royal_military3:0 "Рильский образец службы"
 HSM_AQR_CAM_JEB_royal_military3_desc:0 "Рила предлагает короне надёжную оборонительную службу, в которой прибрежные склады и походные колонны опираются на согласованное снабжение."
 HSM_AQR_CAM_JFT_communes_c1:0 "Прочитать предложение вслух"
 HSM_AQR_CAM_JFT_communes_c1_desc:0 "Бумаги собрания передают быстрее, чем некоторые рабочие успевают их прочесть. Луи замечает соседа, поддержавшего предложение после вопроса, который явно касается другого дела. Вечерние кружки чтения займутся настоящими объявлениями мастерских и проектами коммун. Никому не должен требоваться покровитель, чтобы узнать, что именно выдвинуто от его имени и под чем ему предлагают поставить собственную подпись."
 HSM_AQR_CAM_JFT_communes_c2:0 "За длинным столом нет президента"
 HSM_AQR_CAM_JFT_communes_c2_desc:0 "Делегаты со всей Аквелии спрашивают, кто возглавляет федерацию, когда её коммуны спорят. Луи показывает пустое место, приготовленное для ведущего от следующего собрания. Общее поручение требует того, кто проведёт заседание, но никому не отдаёт стол в собственность. Теперь Придее предстоит соблюдать среди незнакомых общин ту свободу, которую она впервые обещала своим ближайшим соседям."
 HSM_AQR_CAM_JFT_communes_e1:0 "Ключи остаются у мастерских"
 HSM_AQR_CAM_JFT_communes_e1_desc:0 "Мастерские выбрали делегатов, но за запертыми дверями по-прежнему лежат инструменты, нужные для одной общей работы. Луи просит каждое собрание прислать хранителя, способного разрешить выдачу и отвечать за возврат. Общая собственность обретёт смысл, когда соседняя мастерская сможет одолжить приспособление для станка без долгого состязания ораторов и без опасения, что её собственный заказ останется невыполненным."
 HSM_AQR_CAM_JFT_communes_e2:0 "Литейная, принадлежащая её сменам"
 HSM_AQR_CAM_JFT_communes_e2_desc:0 "Коммунальным мастерским нужны отливки, а очередная декларация о труде не заменит металла. Пустующая литейная годится для общего предприятия, если смены договорятся, кто починит печь и кому достанется первая плавка. Пьер носит предложения между собраниями. Каждый вечер он возвращается с копотью на тех самых страницах, где аккуратно записаны возражения соседей и их обещания прислать работников."
 HSM_AQR_CAM_JFT_communes_e3:0 "Чертежи без хозяйской печати"
 HSM_AQR_CAM_JFT_communes_e3_desc:0 "Подмастерье скопировал полезный литейный образец и обнаружил, что оригинал до сих пор охраняют как тайну прежнего владельца. Собрание литейной откроет шкаф с чертежами соседним мастерским. Опытным формовщикам придётся объяснять обозначения, а ученикам позволят спрашивать, почему старый способ иногда подводит. Общее знание начинается там, где никто не требует хозяйской печати за право понять собственную работу."
 HSM_AQR_CAM_JFT_communes_e4:0 "Дорога по согласию коммун"
 HSM_AQR_CAM_JFT_communes_e4_desc:0 "Присоединившиеся коммуны принесли федерации простой на вид спор: кратчайшая грузовая дорога проходит через поля, владельцы которых не согласны на новую реквизицию. Делегаты обходят маршрут вместе с земледельцами и возчиками. На исправленный план уйдёт больше времени, зато каждая деревня будет знать, какую работу она обещала выполнить и где начинается ответственность соседей, которым тоже нужна эта дорога."
 HSM_AQR_CAM_JFT_communes_e5:0 "Провод между общими складами"
 HSM_AQR_CAM_JFT_communes_e5_desc:0 "Утром коммуна обещает лишние подшипники, а до возвращения связного обнаруживает сломанный насос. Мастерские федерации хотят обмениваться сообщениями напрямую, сохраняя ответственность каждого собрания за отправленные обещания. Починенная телефонная станция позволит говорить с далёкими соседями. Тогда известие о возникшем споре успеет дойти раньше пустой подводы, напрасно проделавшей весь путь ради деталей, которые уже потребовались на месте."
 HSM_AQR_CAM_JFT_communes_economy1:0 "Общие инструменты и труд"
 HSM_AQR_CAM_JFT_communes_economy1_desc:0 "Собрания мастерских передают инструменты через хранителей, отвечающих за возврат. Ремонт больше не останавливается на границе квартала в ожидании влиятельного покровителя."
 HSM_AQR_CAM_JFT_communes_economy2:0 "Открытые чертежи литейной"
 HSM_AQR_CAM_JFT_communes_economy2_desc:0 "Общие литейные образцы связывают коммунальные мастерские. Опытные рабочие учат соседей делать детали, которые прежде поступали за печатью владельца."
 HSM_AQR_CAM_JFT_communes_economy3:0 "Федерация работающих мастерских"
 HSM_AQR_CAM_JFT_communes_economy3_desc:0 "Дорожные соглашения и прямые сообщения обеспечивают обмен инструментами, отливками и трудом. Склады коммун по-прежнему отвечают перед своими собраниями."
 HSM_AQR_CAM_JFT_communes_m1:0 "Оружейный сундук собрания"
 HSM_AQR_CAM_JFT_communes_m1_desc:0 "Оружие ополчения разошлось по домам: одни кварталы обеспечены, другим приходится просить об одолжении при каждой тревоге. Пьер предлагает общие оружейные сундуки под надзором хранителей, избранных собраниями. Добровольцы будут знать, где лежат их винтовки, а возможность защитить свою улицу перестанет зависеть от знакомства с нужным ветераном и его готовности открыть дверь поздно ночью."
 HSM_AQR_CAM_JFT_communes_m2:0 "Баррикады с проходом"
 HSM_AQR_CAM_JFT_communes_m2_desc:0 "Ветераны помнят, где держались защитники первой коммуны. Молодые добровольцы копируют прежние баррикады вместе с ошибками, из-за которых раненые оказывались заперты за собственной мебелью. Ополчение изучит улицы вместе с жителями, носившими по ним носилки. Позиция должна укрывать защитников и оставлять путь к соседям, чтобы помощь не застряла там же, где когда-то остановилось отступление."
 HSM_AQR_CAM_JFT_communes_m3:0 "Общий дозор, сменяемое командование"
 HSM_AQR_CAM_JFT_communes_m3_desc:0 "Два собрания отозвали делегатов ополчения в один день, оставив сменную колонну без распоряжений. Луи не согласен освобождать военную службу от контроля коммун. Соседние дозоры отработают передачу обязанностей: маршрут и снабжение должны сохраниться, пока новый делегат занимает место прежнего над картой. Право сменить представителя не должно заставлять караульных гадать, когда к ним наконец придёт помощь."
 HSM_AQR_CAM_JFT_communes_m4:0 "Общие склады обороны"
 HSM_AQR_CAM_JFT_communes_m4_desc:0 "Патрули федерации уходят за пределы улиц, где их знает каждый пекарь. Снабжение должно следовать соглашениям коммун, а не аппетиту первой прибывшей колонны. Хранители подготовят подписанные грузы для соседних отрядов и сами сопроводят первые перевозки. Ополчению, защищающему общую свободу, придётся научиться проходить через деревню, оставляя её зимнее зерно там, где жители договорились его хранить."
 HSM_AQR_CAM_JFT_communes_m5:0 "Арсенал с окнами для собраний"
 HSM_AQR_CAM_JFT_communes_m5_desc:0 "Общая литейная может изготовлять детали для отдельной оружейной мастерской. Её делегаты настаивают: военные заказы должны оставаться открытыми для работников, чьи вечера они занимают. Федерация создаст арсенал, где ремонтники работают вместе с избранными хранителями. Общая оборона получит нужное оружие, а ключи от него не окажутся у командира, которому больше не нужно отвечать перед собранием."
 HSM_AQR_CAM_JFT_communes_military1:0 "Винтовки, доверенные улицей"
 HSM_AQR_CAM_JFT_communes_military1_desc:0 "Коммунальные хранители выдают оружие для местной обороны. Добровольцы знают улицы, которые охраняют, и соседей, доверивших им винтовки."
 HSM_AQR_CAM_JFT_communes_military2:0 "Дозор переживёт смену делегата"
 HSM_AQR_CAM_JFT_communes_military2_desc:0 "Отработанная передача обязанностей позволяет сменять военных представителей, не оставляя общий дозор. Соседние отряды знают, где искать друг друга."
 HSM_AQR_CAM_JFT_communes_military3:0 "Оборона по взаимному обязательству"
 HSM_AQR_CAM_JFT_communes_military3_desc:0 "Общие склады и подотчётный арсенал снабжают ополчение за пределами родных улиц. Поход больше не требует отнимать у деревни зимние запасы."
 HSM_AQR_CAM_JFT_dennis_c1:0 "Домашние адреса вспомогательных частей"
 HSM_AQR_CAM_JFT_dennis_c1_desc:0 "У пони из вспомогательных частей есть семьи на улицах, где их форма напоминает об обысках и облавах. Флёр приносит Деннису жалобы на его солдат и на тех, кто угрожает их детям. Она просит отличать службу от всеобщего оправдания, а обиду — от обвинения целого народа. Ещё один марш через эти кварталы не разрешит накопившиеся противоречия."
 HSM_AQR_CAM_JFT_dennis_c2:0 "Место моряка рядом с короной"
 HSM_AQR_CAM_JFT_dennis_c2_desc:0 "Общегосударственное соглашение даёт адмиралу Придеи возможность защищать интересы гавани. Деннис прибывает с картами, жалобами перевозчиков и стойким подозрением, что кто-то намерен забрать его ключи. Служба короне по-прежнему связывает его с династией. Чтобы приносить ей пользу, придётся говорить от имени своих моряков, не обращаясь при этом с каждым аквелийским берегом как с личным владением."
 HSM_AQR_CAM_JFT_dennis_e1:0 "Ремонтная книга адмирала"
 HSM_AQR_CAM_JFT_dennis_e1_desc:0 "Деннис помнит, какой капитан обязан ему услугой, но воспоминаниями корпус судна не починишь. Верфяные мастера завели книгу повреждений, обещанных поставок леса и незаконченных работ. Адмирал хочет поскорее помочь старым знакомым. Теперь им придётся принести плотнику кое-что полезнее известного имени: точный заказ и сведения о том, где взять дерево для очередного ремонта."
 HSM_AQR_CAM_JFT_dennis_e2:0 "Место для каботажных судов"
 HSM_AQR_CAM_JFT_dennis_e2_desc:0 "Крупные военные корабли занимают все удобные места, пока небольшие каботажные суда ждут с треснувшими досками и разошедшимися швами. Именно их капитаны доставляют товары на рынки Придеи. Отдельный ремонтный стапель станет проверкой морских связей Денниса: смогут ли они помочь всей гавани, включая суда, чьих офицеров никогда не приглашали к адмиральскому столу на торжественный ужин."
 HSM_AQR_CAM_JFT_dennis_e3:0 "Образцы корабельных мастеров"
 HSM_AQR_CAM_JFT_dennis_e3_desc:0 "На каждой верфи хранят собственные лекала и учат подмастерьев, почему соседи всё делают неправильно. Деннис велел мастерам разложить образцы возле разобранной лебёдки. Договориться трудно: вокруг деталей разгораются споры и звучит ругань. Когда одна запасная часть подойдёт механизмам на обоих причалах, адмирал наконец сможет отправить другим королевским портам полезный образец вместе с привычным дружеским письмом."
 HSM_AQR_CAM_JFT_dennis_e4:0 "Королевский груз для внутренних областей"
 HSM_AQR_CAM_JFT_dennis_e4_desc:0 "Общее соглашение о перевозках унесло обещания Денниса дальше от моря, чем способен пройти любой его корабль. Теперь подводы должны связать причалы с городами, где никто не знает адмиральских капитанов. С первыми грузами отправятся дорожные землемеры. Там, где разбитый мост мог поглотить всё обещанное снабжение, появится зримое свидетельство того, что Придея приносит пользу короне."
 HSM_AQR_CAM_JFT_dennis_e5:0 "Заказы за пределами палубы"
 HSM_AQR_CAM_JFT_dennis_e5_desc:0 "Общие образцы корабельных мастеров заинтересовали мельников и владельцев складов. Мастерская возле гавани сможет выполнять их заказы, не задерживая морской ремонт. Деннису нравится мысль, что внутренние области будут нуждаться в Придее. Ремесленники, однако, убеждают его: исправные поставки принесут больше заказов, чем ещё одно приглашение выпить с адмиралом и вспомнить давние походы за его столом."
 HSM_AQR_CAM_JFT_dennis_economy1:0 "Книга корабельных мастеров"
 HSM_AQR_CAM_JFT_dennis_economy1_desc:0 "Придейские мастера начали записывать обещанный ремонт. Даже старому товарищу адмирала приходится объяснять, что именно нужно его судну."
 HSM_AQR_CAM_JFT_dennis_economy2:0 "Общие лекала причалов"
 HSM_AQR_CAM_JFT_dennis_economy2_desc:0 "Корабельные мастера обмениваются лекалами и принимают работу, которую соседи не успевают закончить. Портовые споры начали приносить пригодные детали."
 HSM_AQR_CAM_JFT_dennis_economy3:0 "Морское предприятие Придеи"
 HSM_AQR_CAM_JFT_dennis_economy3_desc:0 "Адмиральская гавань связывает ремонтные стапели с заказчиками внутренних областей. Её обещания несут не только капитаны, но и мастера с дорожными рабочими."
 HSM_AQR_CAM_JFT_dennis_m1:0 "Собрать старые шлюпочные команды"
 HSM_AQR_CAM_JFT_dennis_m1_desc:0 "Старые моряки Денниса знают каждое место высадки в заливе, но годы на берегу разбросали их по тавернам, мастерским и рыбацким лодкам. Сбор покажет, кто ещё способен служить, а кому лучше учить молодых. Адмиралу нужны и те и другие. Никто из них, однако, больше не согласен довольствоваться обещанием жалованья, которое помнит только собственный капитан."
 HSM_AQR_CAM_JFT_dennis_m2:0 "Погрузочные таблицы Флёр"
 HSM_AQR_CAM_JFT_dennis_m2_desc:0 "Флёр Блум разложила припасы в том порядке, в каком они понадобятся солдатам на берегу. Морские пехотинцы жалуются, что её таблицы оставляют меньше места любимому снаряжению. Она предлагает пронести раненого через укладку, которую они считают правильной. Деннис наблюдает за попыткой и велит боцманам сохранить меловую разметку: на этот раз привычка уступит место проверке делом."
 HSM_AQR_CAM_JFT_dennis_m3:0 "Сигналы через залив"
 HSM_AQR_CAM_JFT_dennis_m3_desc:0 "Береговые наблюдатели сразу узнают флагман Денниса, но не всегда понимают приказ, переданный его огнями. Торговому охранению и десантным отрядам нужен язык, который выдержит туман и смену офицеров. Флёр соберёт сигнальщиков для совместных занятий. Адмирал приведёт нетерпеливых капитанов, которым тоже предстоит учиться: прежде чем отправляться вперёд, нужно убедиться, что на берегу приняли сообщение."
 HSM_AQR_CAM_JFT_dennis_m4:0 "Морская пехота на незнакомой земле"
 HSM_AQR_CAM_JFT_dennis_m4_desc:0 "Короне нужна придейская морская пехота и за пределами причалов Денниса. На учениях вдали от моря десантная колонна быстро теряет ориентиры, когда берег исчезает из виду. Мари-Анн д'Армонд снова собирает офицеров над картой. Им предстоит объяснить, как привычное к высадкам подразделение удержит деревню до подхода поддержки и по какой дороге доставит туда необходимые припасы."
 HSM_AQR_CAM_JFT_dennis_m5:0 "Припасы для королевской колонны"
 HSM_AQR_CAM_JFT_dennis_m5_desc:0 "На портовых складах скопилось столько разномастного оружия, что любому снабженцу стыдно показать свои расписки. Флёр нужен резерв, пригодный для прибывающей колонны. Деннис велит капитанам открыть и личные запасы, прежде считавшиеся неприкосновенными. Теперь давняя морская верность будет измеряться тем, что получат солдаты на дороге, а громкие приветствия владельцев тайников уже не заменят исправных винтовок."
 HSM_AQR_CAM_JFT_dennis_military1:0 "Вернувшиеся шлюпочные команды"
 HSM_AQR_CAM_JFT_dennis_military1_desc:0 "Старые моряки учат молодые команды порядкам, которые помогали держаться вместе в море. Знакомые голоса помогают потрёпанной вахте вернуться к службе."
 HSM_AQR_CAM_JFT_dennis_military2:0 "Ответить на береговой сигнал"
 HSM_AQR_CAM_JFT_dennis_military2_desc:0 "Таблицы Флёр и общие сигналы связывают морскую пехоту с перевозящими её командами. Придейские офицеры учатся ждать ответа перед движением."
 HSM_AQR_CAM_JFT_dennis_military3:0 "Служебная эскадра адмирала"
 HSM_AQR_CAM_JFT_dennis_military3_desc:0 "Старые портовые связи поддерживают силы, способные перевозить и снабжать королевские войска за пределами знакомых вод. Резервные сундуки наконец открыты."
 HSM_AQR_CAM_JFT_enfants_c1:0 "Свидетель рядом с обвинением"
 HSM_AQR_CAM_JFT_enfants_c1_desc:0 "Остановку мастерской записали в дела безопасности как саботаж прежде, чем кто-либо осмотрел сломанный приводной вал. Следователи движения приложат объяснение механика к донесению обвинителя. Les Enfants Terribles по-прежнему ждут удара по революции. Им нельзя полагаться на службу, которая принимает неудобного свидетеля за ту опасность, которую ей поручили найти, оставляя настоящую причину остановки без проверки и ремонта."
 HSM_AQR_CAM_JFT_enfants_c2:0 "Дети обращаются к Аквелии"
 HSM_AQR_CAM_JFT_enfants_c2_desc:0 "Революционное знамя теперь висит над трибуной для слушателей из всех провинций. Les Enfants Terribles получили возможность вынести национальную программу за пределы Придеи. Ораторам придётся объяснить требования выживания тем, кто не бывал на прежних подпольных встречах. Нужно убедить их разделить бремя защиты Аквелии, а не просто повторить слова, с которыми когда-то соглашались тесным кругом товарищей."
 HSM_AQR_CAM_JFT_enfants_e1:0 "Металл для забытых детей"
 HSM_AQR_CAM_JFT_enfants_e1_desc:0 "Les Enfants Terribles обещали, что Аквелия больше не станет беспомощно ждать чужого благоволения. Их сборщикам досталось менее торжественное дело: сортировать старые котлы, сломанные рельсы и портовый лом. Мастерским движения нужен пригодный металл. Патриотические речи будут сопровождать подводы, но последнее слово останется за литейщиками, которым предстоит решить, что можно отправить в печь, а что только испортит плавку."
 HSM_AQR_CAM_JFT_enfants_e2:0 "Превратить склад в машинный зал"
 HSM_AQR_CAM_JFT_enfants_e2_desc:0 "В реквизированном складе стоит оборудование, собранное разными революционными ячейками; многое ещё упаковано для поездок, которые так и не состоялись. Движение соберёт под одной крышей разрозненных механиков. Каждому исправному станку потребуются ответственный мастер и настоящая работа. Слишком долго владение запертым складом принимали за власть над производством, хотя за его дверями никто не слышал шума работающих машин."
 HSM_AQR_CAM_JFT_enfants_e3:0 "Единый калибр для всех ячеек"
 HSM_AQR_CAM_JFT_enfants_e3_desc:0 "Тайна подполья прежде защищала мастерские, а теперь скрывает несовместимые детали и повторяющуюся работу. Les Enfants Terribles соберут калибры и чертежи в машинном зале. Старым организаторам неприятно открывать свои методы соперникам, однако революционное государство не вооружить деталями, чьей единственной гарантией служит преданность изготовившей их ячейки. Мастерам придётся доказать пригодность каждой партии перед теми, кто будет её использовать."
 HSM_AQR_CAM_JFT_enfants_e4:0 "Приборы, которые должна делать Аквелия"
 HSM_AQR_CAM_JFT_enfants_e4_desc:0 "Обещание самостоятельности из общенациональной программы дошло до шкафа с привозными электрическими приборами. Некоторые из них никто в машинном зале не умеет чинить без зарубежной инструкции. Техники начнут с простейших устройств, прослеживая соединения прежде, чем делать замену. Подозрительность движения к иностранным поставщикам должна обернуться терпеливым трудом, иначе за громкими словами так и останутся неработающие приборы."
 HSM_AQR_CAM_JFT_enfants_e5:0 "Заказ национальному арсеналу"
 HSM_AQR_CAM_JFT_enfants_e5_desc:0 "Заказы со всей Аквелии приходят в машинный зал, где прежде стояли нераспакованные ящики соперничающих ячеек. Отдельное оружейное предприятие превратит общие образцы в постоянное производство. Les Enfants Terribles видят в арсенале воплощение революции, способной защитить себя. Его руководителям придётся отвечать за переданное войскам оружие: одних обещаний, выкрикнутых под знаменем перед собравшимися товарищами, больше не хватит."
 HSM_AQR_CAM_JFT_enfants_economy1:0 "Обозы металла для движения"
 HSM_AQR_CAM_JFT_enfants_economy1_desc:0 "Ячейки собирают пригодный металл для мастерских. Сортировка грузов дала обещанию национальной стойкости материальное начало."
 HSM_AQR_CAM_JFT_enfants_economy2:0 "Общие калибры революции"
 HSM_AQR_CAM_JFT_enfants_economy2_desc:0 "Бывшие подпольные мастерские делают детали по общим образцам. Соперничающим организаторам труднее скрыть плохую работу за тайной собственных ячеек."
 HSM_AQR_CAM_JFT_enfants_economy3:0 "Собственный машинный зал Аквелии"
 HSM_AQR_CAM_JFT_enfants_economy3_desc:0 "Национальный арсенал переносит знания мастерских в постоянное производство. Требование самостоятельности обретает форму машин, понятных собственным механикам движения."
 HSM_AQR_CAM_JFT_enfants_m1:0 "Сбор под революционным знаменем"
 HSM_AQR_CAM_JFT_enfants_m1_desc:0 "Ораторы движения призывают выйти вперёд всех, кто готов защищать Аквелию. За столами сбора пыл сталкивается с вопросами о ремесле, опыте и семье, оставшейся дома. Les Enfants Terribles превратят заявления в назначенные обязанности: новобранцы получат место явки, ветераны — тех, кого нужно учить, прежде чем очередное шествие закончится обычным разбродом по домам и повторением прежних обещаний."
 HSM_AQR_CAM_JFT_enfants_m2:0 "За пределами улицы своей ячейки"
 HSM_AQR_CAM_JFT_enfants_m2_desc:0 "Революционная ячейка знает каждую дверь на собственной улице и почти ничего о подразделении, которое движется рядом. Новые батальоны будут вместе проходить складской район. Инструкторам предстоит сохранить инициативу и научить новобранцев замечать, когда стремительный рывок лишь подставляет соседа. Мужеству необходимо общее направление, прежде чем оно сможет защищать целую страну, а не один знакомый перекрёсток возле своего дома."
 HSM_AQR_CAM_JFT_enfants_m3:0 "План, дошедший до последней роты"
 HSM_AQR_CAM_JFT_enfants_m3_desc:0 "Берти Альбатрос видел, как учение остановилось из-за того, что последняя рота получила вчерашнее распоряжение. Организаторы винят небрежного связного; он спрашивает, почему никто не проверил, что поняли солдаты. Силы движения будут передавать приказы обратно по цепочке, прослеживая каждый задуманный манёвр до исполнителей. Лишь после этого командиры смогут назвать план законченным и отправить людей на исходные позиции."
 HSM_AQR_CAM_JFT_enfants_m4:0 "Глаза над побережьем страны"
 HSM_AQR_CAM_JFT_enfants_m4_desc:0 "Революционное руководство получает береговые донесения быстрее, чем успевает отличать рыбацкие лодки от воображаемых вторжений. Лётчики и наблюдатели сверят сообщения над общими картами. Les Enfants Terribles не доверяют миру за пределами Аквелии. Наблюдение за тем, что действительно движется над её водами, даст этой настороженности более трудное занятие, чем бесконечное повторение слухов с каждого сторожевого поста."
 HSM_AQR_CAM_JFT_enfants_m5:0 "Снаряды по огневому плану"
 HSM_AQR_CAM_JFT_enfants_m5_desc:0 "Арсенал способен делать снаряды, которыми батареи ещё не научились уверенно пользоваться вместе. Артиллеристы вернут мастерским повреждённые взрыватели и записи стрельб, затем испытают исправленные партии рядом с пехотой, которую поддерживают. Движению нужна армия с несомненной решимостью. Батареи выразят её продуманным огнём, отвечая за каждый обещанный залп перед солдатами, которым под этим огнём предстоит идти вперёд."
 HSM_AQR_CAM_JFT_enfants_military1:0 "У сбора есть адрес"
 HSM_AQR_CAM_JFT_enfants_military1_desc:0 "Новобранцы прибывают в назначенные части, ветераны готовят обучение. Военные обещания движения начинают подчиняться общему расписанию."
 HSM_AQR_CAM_JFT_enfants_military2:0 "Приказы приняты и поняты"
 HSM_AQR_CAM_JFT_enfants_military2_desc:0 "Батальоны проверяют распоряжения по всей цепочке. Теперь их решимость следует плану, понятному не только за столом его составителя."
 HSM_AQR_CAM_JFT_enfants_military3:0 "Продуманная оборона революции"
 HSM_AQR_CAM_JFT_enfants_military3_desc:0 "Наблюдение, отработанные приказы и проверенные огневые планы превращают настороженность движения в согласованную оборону. Оно говорит языком патриотизма; подготовка придаёт этим словам вес."
 HSM_AQR_CAM_JFT_fja_c1:0 "Лечебница сохраняет своё место"
 HSM_AQR_CAM_JFT_fja_c1_desc:0 "Работница лечебницы, когда-то просившая у коалиции муку, возвращается с семьями, которым нечем платить за лечение. Сборы в мастерских помогали, но прекращались вместе с работой предприятия. Муниципальная помощь свяжет разрозненные усилия с социальными обязательствами коалиции. Заболевшим будет куда обратиться без партийной рекомендации у дверей и без необходимости доказывать, что их прежние товарищи ещё способны собрать деньги."
 HSM_AQR_CAM_JFT_fja_c2:0 "Лесное соглашение перед голосованием"
 HSM_AQR_CAM_JFT_fja_c2_desc:0 "Партнёры, когда-то отложившие ссоры в виновийском лесу, теперь несут их на общенациональные предвыборные собрания. Придейские делегаты МАФ остаются частью своей партии; коммунары не забыли причин недоверия к ней. Коалиции предстоит дать место этому спору и одновременно предложить избирателям оценить общий опыт соглашений о жалованье, помощи больным и общественных работ, за который отвечают оба движения."
 HSM_AQR_CAM_JFT_fja_e1:0 "Жалованье рядом с заказами"
 HSM_AQR_CAM_JFT_fja_e1_desc:0 "Коалиция получает заказы мастерским с аккуратными сроками поставки и обещаниями жалованья, оставленными на полях. Представители МАФ и их коммунарские союзники соберут работодателей и делегатов смен за одним столом. Возобновление производства должно сопровождаться соглашением, которое рабочие смогут прочитать в день расчёта. Иначе союз, родившийся в лесу, встретит следующий спор возле запертых ворот предприятия."
 HSM_AQR_CAM_JFT_fja_e2:0 "Строители на муниципальном заказе"
 HSM_AQR_CAM_JFT_fja_e2_desc:0 "Строительные бригады Придеи переходят от одного повреждённого дома к другому, ожидая хозяев, которым нечем платить. Муниципальный строительный двор соберёт инструменты и даст достаточно ремонтных заказов для постоянной работы. Партнёры коалиции согласны с самой задачей. Спор идёт о первой улице в очереди и о том, что получат жильцы от улучшений, которые они тоже помогают оплачивать."
 HSM_AQR_CAM_JFT_fja_e3:0 "Инспектор идёт вместе со сменой"
 HSM_AQR_CAM_JFT_fja_e3_desc:0 "Инспектор приходит после несчастного случая и узнаёт, что рабочие предупреждали о ремне несколько недель назад. Коалиция соединит технический осмотр с рассказами тех, кто стоит возле станков. Производственным советам нужно быть услышанными, а законодателям МАФ — получить сведения для исполнимых правил. Очередной спор о том, кто сильнее любит трудящихся, не остановит опасный привод перед следующей сменой."
 HSM_AQR_CAM_JFT_fja_e4:0 "Общенациональное прошение носильщиков"
 HSM_AQR_CAM_JFT_fja_e4_desc:0 "Носильщики из других провинций принесли национальной коалиции рассказы о тех же разбитых подъездах и затопленных погрузочных дворах. Придейские бригады могут предложить методы, которые их представители уже защищали публично. Прошение станет программой связанных между собой ремонтов. Свидетельства жителей будут сопровождать каждый договор за пределами утвердившей его канцелярии, напоминая подрядчикам, для кого именно открывают дорогу."
 HSM_AQR_CAM_JFT_fja_e5:0 "Вечерний стол для техников"
 HSM_AQR_CAM_JFT_fja_e5_desc:0 "В отчётах инспекторов описаны электрические неисправности, которые местные техники поодиночке устраняли после смены. Коалиция предоставит им общий рабочий стол и время для сравнения решений. Делегатам МАФ нужны практические выводы для общенациональных законов, коммунарским союзникам — участие рабочих в опытах. Первая демонстрация должна ответить на оба требования и показать мастерам, зачем они принесли сюда свои записи."
 HSM_AQR_CAM_JFT_fja_economy1:0 "Подписанное жалованье мастерских"
 HSM_AQR_CAM_JFT_fja_economy1_desc:0 "Заказы сопровождаются соглашениями о жалованье, заключёнными партнёрами коалиции. Работа возобновляется на условиях, понятных сменам."
 HSM_AQR_CAM_JFT_fja_economy2:0 "Проверка с рабочего места"
 HSM_AQR_CAM_JFT_fja_economy2_desc:0 "Технические инспекторы слушают рабочих, знакомых с каждым опасным станком. Ремонт и безопасный порядок входят в промышленную практику коалиции."
 HSM_AQR_CAM_JFT_fja_economy3:0 "Работающий пример коалиции"
 HSM_AQR_CAM_JFT_fja_economy3_desc:0 "Муниципальные ремонты и совместная техническая работа дают национальному МАФ программу, которую придейские партнёры защищают собственным опытом. Рабочие продолжают участвовать в её исполнении."
 HSM_AQR_CAM_JFT_fja_m1:0 "Обратный билет резервиста"
 HSM_AQR_CAM_JFT_fja_m1_desc:0 "Добровольцы спрашивают, означает ли вступление в резерв потерю места в мастерской, которое удалось вернуть совсем недавно. Коалиция обсудит условия службы с работодателями и рабочими делегатами до открытия записи. Гражданской армии нужны люди, способные оставить семьи без страха, что надетая форма лишит их заработка после возвращения и превратит обещанную службу в бессрочное расставание с домом."
 HSM_AQR_CAM_JFT_fja_m2:0 "Винтовки ополчения на общих складах"
 HSM_AQR_CAM_JFT_fja_m2_desc:0 "Военные союзники коалиции принесли на резервные склады разное оружие и разные воспоминания. Оружейники починят пригодные винтовки и запишут, где они хранятся. Организаторам МАФ нужны силы, которые парламент сможет снабжать. Коммунарские делегаты хотят уверенности, что передача оружия не отдаёт каждый будущий спор тому, кто командует стражей у складских ворот и решает, кого пропускать внутрь."
 HSM_AQR_CAM_JFT_fja_m3:0 "Санитарный маршрут Леве"
 HSM_AQR_CAM_JFT_fja_m3_desc:0 "Пейн Леве проследил учебный маршрут резерва до моста, слишком узкого для санитарных повозок. Он приглашает гражданский комитет снабжения пройти дорогой вместе с инструкторами. По таким встречам будут судить о военном устройстве коалиции: способен ли офицер получить практическую помощь и вправе ли гражданские оспорить его план до того, как по этому мосту повезут первого раненого."
 HSM_AQR_CAM_JFT_fja_m4:0 "Подготовка, переживающая выборы"
 HSM_AQR_CAM_JFT_fja_m4_desc:0 "Резервные офицеры нескольких провинций спрашивают, отменит ли смена парламентского большинства установленный порядок подготовки. Коалиция представит общую программу избранным депутатам, позволяя возражать и не превращая каждую роту в партийный клуб. Солдатам предстоит вместе удерживать позиции даже тогда, когда отправившие их граждане спорят о следующем кабинете. Учебная площадка не должна заново делиться после каждого подсчёта голосов."
 HSM_AQR_CAM_JFT_fja_m5:0 "Арсенал в открытом бюджете"
 HSM_AQR_CAM_JFT_fja_m5_desc:0 "Общенациональному резерву нужен надёжный источник оружия, но будущий арсенал соперничает с гражданскими заказами тем же строителям. Коалиция защитит заказ перед избранным собранием и допустит осмотр готового предприятия. Рабочие представители требуют безопасных смен, офицеры — исправных поставок. И тем и другим придётся объяснить расходы семьям, которые оплачивают их и ждут выполнения других обещаний общего бюджета."
 HSM_AQR_CAM_JFT_fja_military1:0 "Служба с правом вернуться"
 HSM_AQR_CAM_JFT_fja_military1_desc:0 "Условия резерва сохраняют связь новобранца с гражданской работой. Инструкторы могут планировать занятия для добровольцев, понимающих условия своего отсутствия."
 HSM_AQR_CAM_JFT_fja_military2:0 "Маршрутная карта гражданского комитета"
 HSM_AQR_CAM_JFT_fja_military2_desc:0 "Офицеры и гражданские снабженцы вместе прошли резервными маршрутами. Подготовка связала обучение с перевозками, медицинской помощью и ясной ответственностью."
 HSM_AQR_CAM_JFT_fja_military3:0 "Резерв, отвечающий перед собранием"
 HSM_AQR_CAM_JFT_fja_military3_desc:0 "Общая подготовка и проверяемые договоры снабжения поддерживают национальный резерв во время парламентских споров. Офицеры могут служить, не решая, кто достоин править."
 HSM_AQR_CAM_JRR_absolutist_c1:0 "Вдовы у дверей аудиенции"
 HSM_AQR_CAM_JRR_absolutist_c1_desc:0 "Семьи погибших выучили дорогу между поместной конторой и военным казначеем, однако никто не принимает окончательной ответственности. Жанна отводит отдельную аудиенцию для их требований и связывает помощь с обязанностями, обещанными её сторонниками. У придворного покровительства появляются неудобные просители: они хорошо помнят каждое заверение, знают имена давших его господ и готовы снова прийти к дверям маркизы за ответом."
 HSM_AQR_CAM_JRR_absolutist_c2:0 "Маркиза перед короной"
 HSM_AQR_CAM_JRR_absolutist_c2_desc:0 "Общенациональное провозглашение даёт Жанне место среди сторонников короны. Её дворяне хотели бы скрыть все провинциальные жалобы за одной торжественной клятвой. Маркиза возьмёт их обязательства с собой. Она предлагает службу законному монарху и приносит в общее королевское устройство заслуженное положение Весткипа. Титул маркизы не превращается от этого в наследственное право на аквелийский престол, а местные обещания сохраняют силу."
 HSM_AQR_CAM_JRR_absolutist_e1:0 "Поместья обязаны поставить"
 HSM_AQR_CAM_JRR_absolutist_e1_desc:0 "Дворяне, поддержавшие Жанну, обещают лес, камень и подводы. Управляющий уже принимает эти обещания так, словно материалы лежат за воротами. Маркиза возвращает бумаги. Каждое поместье должно указать двор, откуда действительно можно забрать обещанное. Дворянская служба оставит после себя не только печать: каменщикам нужны целые блоки, возчикам нужны исправные колёса, а деревням надоело ждать исполнения торжественных заверений."
 HSM_AQR_CAM_JRR_absolutist_e2:0 "Поручительства за усадебные дороги"
 HSM_AQR_CAM_JRR_absolutist_e2_desc:0 "Усадебная дорога в прекрасном состоянии доведена до господского дома, а перед деревнями арендаторов превращается в канаву. Землемеры Жанны потребуют поручительства владельца за весь путь, которым вывозят его урожай. Двор способен добиться исполнения этой обязанности собственными распоряжениями. Ему незачем возвращать дело гарнизонам, которые прежде сами решали, чья жалоба заслуживает внимания и кому положен вооружённый сопровождающий."
 HSM_AQR_CAM_JRR_absolutist_e3:0 "Образцы под придворной печатью"
 HSM_AQR_CAM_JRR_absolutist_e3_desc:0 "Три усадебные мастерские поставили для одного моста три несовместимых крепления. Каждый мастер уверяет, что за его работой стоит многолетний обычай. Закупочная контора Жанны будет хранить проверенные образцы и выдавать их подрядчикам двора. Доброе имя поможет ремесленнику получить заказ, но готовая деталь всё равно должна соответствовать чертежу инженера, которому предстоит отвечать за переправу перед маркизой."
 HSM_AQR_CAM_JRR_absolutist_e4:0 "Кредит Весткипа при дворе"
 HSM_AQR_CAM_JRR_absolutist_e4_desc:0 "После провозглашения общенационального устройства Жанна представляет при дворе договоры марки. Она добивается гарантий для полезных предприятий, связывая своё дело с законной аквелийской короной. Кредиторы требуют, чтобы её дворянские сторонники соблюдали условия поставок, принятые дома. Провинциальная репутация поможет заслужить более широкое доверие лишь тогда, когда её обладатели продолжают отвечать за собственные подписи и вдали от Весткипа."
 HSM_AQR_CAM_JRR_absolutist_e5:0 "Мастерские на королевском тракте"
 HSM_AQR_CAM_JRR_absolutist_e5_desc:0 "Заказы двора теперь поступают из мест, которых усадебные мастерские не могут обслужить. Жанна покровительствует созданию постоянного предприятия у тракта, по которому идут поставки Весткипа в Аквелию. Учредители приносят поместные капиталы и королевские договоры, мастера — проверенные образцы. Над воротами появится имя покровительницы, а в счетах останутся её обязательства перед теми, кто доверил этому начинанию труд и деньги."
 HSM_AQR_CAM_JRR_absolutist_economy1:0 "Обещанные поместные поставки"
 HSM_AQR_CAM_JRR_absolutist_economy1_desc:0 "Жанна превратила дворянские обещания в обязательные поставки. Дорожные артели наконец знают, какое поместье отвечает за камень, которого они ждут."
 HSM_AQR_CAM_JRR_absolutist_economy2:0 "Утверждённые придворные образцы"
 HSM_AQR_CAM_JRR_absolutist_economy2_desc:0 "Общие образцы и обязательные поручительства связывают поместные мастерские с закупочной конторой Жанны. Покровительство теперь сопровождается проверкой."
 HSM_AQR_CAM_JRR_absolutist_economy3:0 "Королевские заказы через Весткип"
 HSM_AQR_CAM_JRR_absolutist_economy3_desc:0 "Поместные капиталы, проверенное мастерство и признанные при дворе обязательства поддерживают предприятия Весткипа. Королевская служба Жанны обрела мастерские и сроки поставок."
 HSM_AQR_CAM_JRR_absolutist_m1:0 "Служба за пределами усадьбы"
 HSM_AQR_CAM_JRR_absolutist_m1_desc:0 "Верные офицеры приводят роты, чья первая верность по-прежнему принадлежит снарядившим их домам. Жанна требует составить списки службы, которую несут перед маркой, а через неё перед короной. Поместье может рекомендовать новобранца, но не вправе отзывать его всякий раз, когда хозяин поссорится с офицером соседнего участка дороги. Воинские обязанности должны переживать личные обиды тех, кто обещал их исполнять."
 HSM_AQR_CAM_JRR_absolutist_m2:0 "Расписка придворного оружейника"
 HSM_AQR_CAM_JRR_absolutist_m2_desc:0 "Знатный даритель приносит красивый оружейный ящик и просит капитанский чин для сына. Жанна предлагает оружейнику проверить винтовки прежде, чем начнётся разговор о назначении. Покровительство двора должно обеспечивать исправным оружием роты, несущие службу. Благодарность дарителям найдётся в книге аудиенций, но из неё не следует право назначать командиров тем, кто будет пользоваться полученным даром на настоящем посту."
 HSM_AQR_CAM_JRR_absolutist_m3:0 "Смена у последнего склада"
 HSM_AQR_CAM_JRR_absolutist_m3_desc:0 "Обоз пересекает половину марки и обнаруживает, что охрана очередного поместья считает службу законченной. Жанна приказывает верным офицерам отрабатывать смену непосредственно у складов. Прибывший командир должен увидеть, как его преемник принимает груз. Честь дворянского дома станут оценивать по завершённым поставкам, а не по тому, насколько быстро рота вернулась к хозяйским воротам, оставив подводы и возчиков без сопровождения."
 HSM_AQR_CAM_JRR_absolutist_m4:0 "Посты в королевской линии"
 HSM_AQR_CAM_JRR_absolutist_m4_desc:0 "Служебные обязательства Весткипа теперь соприкасаются с обязанностями соседних провинций. Защищённая переправа мало значит, если ближайший пост ждёт смену совсем с другой стороны. Жанна направляет офицеров с письменными поручениями согласовать запасы, сигналы и ответственность с королевским командованием. Марка будет удерживать порученные рубежи, не превращая каждый спор о провианте в состязание родовитости между владельцами соседних поместий."
 HSM_AQR_CAM_JRR_absolutist_m5:0 "Весткипский арсенал короны"
 HSM_AQR_CAM_JRR_absolutist_m5_desc:0 "Старые усадебные оружейные не способны содержать роты, служащие по всей Аквелии. Жанна объединяет их ремонтные заказы в постоянном арсенале, где придворные инспекторы проследят путь от заготовки до готового оружия. Дворяне сохранят почёт поставщиков короны. Им придётся согласиться, что оружие отправляют по нуждам службы, даже когда собственные дружинники ожидают снаряжения у ворот и напоминают о заслугах своего господина."
 HSM_AQR_CAM_JRR_absolutist_military1:0 "Служебный список марки"
 HSM_AQR_CAM_JRR_absolutist_military1_desc:0 "Верные роты несут службу за пределами ворот своих покровителей. Определённые обязанности позволяют собирать припасы и пресекать уклонение от похода."
 HSM_AQR_CAM_JRR_absolutist_military2:0 "Смены под печатью маркизы"
 HSM_AQR_CAM_JRR_absolutist_military2_desc:0 "Роты научились сдавать склад смене прежде, чем возвращаться домой. Припасы и защита переправ больше не зависят от ссоры между дворянскими домами."
 HSM_AQR_CAM_JRR_absolutist_military3:0 "Весткип в королевском строю"
 HSM_AQR_CAM_JRR_absolutist_military3_desc:0 "Корона может положиться на посты Весткипа, исправное оружие и назначенные смены. Дворянская служба стала обязанностью, на которую рассчитывают соседние части."
 HSM_AQR_CAM_JRR_coalition_c1:0 "Прочесть соглашение после работы"
 HSM_AQR_CAM_JRR_coalition_c1_desc:0 "Напечатанное обещание коалиции висит над дверью мастерской, хотя некоторые работники, которых оно должно защищать, не умеют его прочесть. Добровольцы-республиканцы и приходские учителя предлагают вечерние занятия с обсуждением. Жанна предоставляет залы для собраний. Научиться читать обещание означает также заметить статью, которую судейский чиновник удобно пропустил в объяснениях, и суметь самостоятельно найти её в выданном домой листке."
 HSM_AQR_CAM_JRR_coalition_c2:0 "Республиканцы в королевской делегации"
 HSM_AQR_CAM_JRR_coalition_c2_desc:0 "Муниципальные союзники Жанны выходят в общенациональную политику рядом с маркизой, не притворяясь убеждёнными монархистами. Соглашение связывает их с королевским устройством, исполнения обещаний которого они намерены требовать. Делегация привезёт подписи несогласных вместе с подписями верных короне. Сотрудничеству предстоит выдержать честное представление участников, прежде чем оно сможет предложить Аквелии нечто большее, чем очередную временную сделку против власти военных."
 HSM_AQR_CAM_JRR_coalition_e1:0 "Подряд на городской площади"
 HSM_AQR_CAM_JRR_coalition_e1_desc:0 "Старые поставщики двора знают, в какую приёмную следует заглянуть. Города, поддержавшие коалицию Жанны, требуют места, где незнакомая мастерская предложит работу без рекомендации покровителя. Условия подрядов вывешивают рядом с рыночными объявлениями, образцы проверяют при свидетелях. Подпись остаётся за маркизой, но теперь ей предстоит объяснять, почему она поставлена под одним предложением, а соседний мастер со своей работой получил отказ."
 HSM_AQR_CAM_JRR_coalition_e2:0 "Суд по реквизициям"
 HSM_AQR_CAM_JRR_coalition_e2_desc:0 "Мастерская не может принять гражданский заказ, пока гарнизон считает её токарный станок своим. Муниципальные юристы разберут спорные расписки вместе с представителями двора и поставщиков. Коалиция Жанны обещала жизнь без постоянного военного разрешения. Решение о том, кто сможет пользоваться станком завтра, проверит это обещание серьёзнее очередного воззвания, которое печатник вывесит на стене среди уже пожелтевших листов."
 HSM_AQR_CAM_JRR_coalition_e3:0 "Мерки для соседних мастерских"
 HSM_AQR_CAM_JRR_coalition_e3_desc:0 "Небольшие поставщики получили первые заказы и обнаружили, что соседи по-разному измеряют одну и ту же деталь. Городские делегаты коалиции предлагают выдавать общие мерки и устроить проверочный верстак для спорных изделий. Опытные мастера смогут обучать согласованным приёмам, сохраняя собственные мастерские. Закупщики Жанны будут принимать утверждённые размеры даже тогда, когда старый придворный поставщик потребует исключения для своей привычной работы."
 HSM_AQR_CAM_JRR_coalition_e4:0 "Договор для других городов"
 HSM_AQR_CAM_JRR_coalition_e4_desc:0 "Общенациональное устройство открыло рынки за пределами Весткипа, но его города не могут жить привилегиями, выговоренными для одной марки. Коалиция Жанны предлагает другим городам королевства свои правила подрядов и порядок обжалования. Партнёры присоединятся через договоры, которые смогут защитить перед собственными жителями. Первый требовательный заказчик окажется для соглашения полезнее целой комнаты любезных почитателей, согласных хвалить каждый его пункт."
 HSM_AQR_CAM_JRR_coalition_e5:0 "Общий двор мастерских"
 HSM_AQR_CAM_JRR_coalition_e5_desc:0 "Несколько мастерских способны вместе построить машину, но ни одна не может приобрести тяжёлое оборудование для окончательной обработки. Коалиция устраивает общий промышленный двор на средства участвующих городов и частных подписчиков. Жанна открывает его рядом с муниципальными делегатами. Заказы распределят по опубликованному договору, сохранив место для небольших поставщиков, которые первыми добивались этих правил и теперь рассчитывают ими воспользоваться."
 HSM_AQR_CAM_JRR_coalition_economy1:0 "Подряды за пределами приёмной"
 HSM_AQR_CAM_JRR_coalition_economy1_desc:0 "Опубликованные условия позволяют небольшим мастерским Весткипа бороться за заказы коалиции. Работа приходит на верстаки, которые прежде обходило придворное покровительство."
 HSM_AQR_CAM_JRR_coalition_economy2:0 "Общие мерки городов"
 HSM_AQR_CAM_JRR_coalition_economy2_desc:0 "Общие мерки и гражданский разбор спорных расписок помогают самостоятельным мастерским выполнять обязательства друг перед другом."
 HSM_AQR_CAM_JRR_coalition_economy3:0 "Соглашение городских поставщиков"
 HSM_AQR_CAM_JRR_coalition_economy3_desc:0 "Общий двор открывает небольшим подрядчикам доступ к тяжёлому оборудованию, а опубликованные условия позволяют сотрудничать вопреки разногласиям городов."
 HSM_AQR_CAM_JRR_coalition_m1:0 "Сбор с датой возвращения"
 HSM_AQR_CAM_JRR_coalition_m1_desc:0 "Муниципальные делегаты приносят списки желающих служить в резерве и задают неприятный для вербовщика вопрос: когда они вернутся? Коалиция Жанны закрепит сроки, соблюдения которых смогут требовать и города, и командиры. Добровольцам предстоят настоящая подготовка и настоящая служба. Их нанимателям и семьям нужно нечто прочнее заверения, что гарнизон когда-нибудь вспомнит об обещанном возвращении и отпустит людей домой."
 HSM_AQR_CAM_JRR_coalition_m2:0 "Оружие под гражданскую расписку"
 HSM_AQR_CAM_JRR_coalition_m2_desc:0 "Городской оружейник готов снабжать резерв, но отказывается принимать очередную реквизицию с подписью офицера, которого потом невозможно найти. Жанна поручает закупочной конторе подтверждать каждую поставку и указывать получающую часть. Гражданские могут вооружать солдат, сохраняя право на оплату труда. Первое правило дисциплины для нового резерва начинается с обещаний, данных поставщикам, которым завтра снова придётся открывать свои мастерские."
 HSM_AQR_CAM_JRR_coalition_m3:0 "Учения между рыночными днями"
 HSM_AQR_CAM_JRR_coalition_m3_desc:0 "Резерв не научится действовать подразделением, если каждая мастерская отпускает учеников в разные дни. Городские делегаты и инструкторы согласуют сборы с местной работой, а затем потребуют соблюдения договорённости от всех участников. Непродолжительные учения при полном составе дадут больше, чем великолепный парад, на котором пустые места в строю оправдывают неизбежными неудобствами гражданской жизни и занятостью чужих работников."
 HSM_AQR_CAM_JRR_coalition_m4:0 "Служебное предписание в пути"
 HSM_AQR_CAM_JRR_coalition_m4_desc:0 "Королевское командование теперь просит резервистов Весткипа для службы за пределами родных городов. Согласованные условия не должны исчезать на провинциальной границе. Офицеры Жанны и муниципальные представители подготовят порядок смены, медицинской помощи и отправки вестей домой. Коалиция сможет ответить на общенациональный призыв, ясно установив, кто отвечает за добровольцев после того, как их поезд уйдёт со знакомой станции."
 HSM_AQR_CAM_JRR_coalition_m5:0 "Арсенал с открытыми счетами"
 HSM_AQR_CAM_JRR_coalition_m5_desc:0 "Резерву коалиции нужны регулярные поставки, которых отдельные ремонтные мастерские обещать не могут. Муниципальные подписчики и двор оплатят арсенал с отчётностью, доступной представителям, утвердившим заказ. Управляющим придётся соблюдать военные требования к оружию и гражданские сроки расчётов. Жанна рассчитывает на надёжное вооружение; её партнёры хотят знать, как оплачены обещания и кто ответит перед рабочими, если очередной платёж задержится."
 HSM_AQR_CAM_JRR_coalition_military1:0 "Место, сохранённое резервисту"
 HSM_AQR_CAM_JRR_coalition_military1_desc:0 "Согласованные условия позволяют добровольцам возвращаться в части без опасения, что каждый новый вызов лишит их гражданского заработка."
 HSM_AQR_CAM_JRR_coalition_military2:0 "Города соблюдают дни учений"
 HSM_AQR_CAM_JRR_coalition_military2_desc:0 "Наниматели и инструкторы соблюдают общее расписание. Резерв занимается вместе и восстанавливается между выходами, не торгуясь каждый раз за присутствие солдат."
 HSM_AQR_CAM_JRR_coalition_military3:0 "Подотчётный резерв коалиции"
 HSM_AQR_CAM_JRR_coalition_military3_desc:0 "Регулярная подготовка, гражданская отчётность и порядок смены позволяют городским добровольцам служить по всей Аквелии, сохраняя объединившее их соглашение."
 HSM_AQR_CAM_JRR_colette_c1:0 "Читать без шифра"
 HSM_AQR_CAM_JRR_colette_c1_desc:0 "Некоторые бывшие связные узнавали условный знак на плакате, не умея прочесть обычное объявление вокруг него. Рабочие группы предлагают занятия по приказам, которые теперь определяют жизнь мастерских. Колетт разрешает открыть помещения, понимая, что грамотные читатели принесут более точные возражения. Гражданские, помогавшие нести её революцию, намерены разобраться в оставленных ею распоряжениях и самостоятельно проверять то, что им объясняют офицеры."
 HSM_AQR_CAM_JRR_colette_c2:0 "Делегаты без тайного послания"
 HSM_AQR_CAM_JRR_colette_c2_desc:0 "Колетт направляет представителей Весткипа в общенациональное республиканское движение через двери, к которым MPA прежде подходила тайно. Офицеры ждут дисциплинированной делегации; гражданские союзники намерены говорить от собственного имени. Ей предстоит перенести сотрудничество в более широкую политику, не объявляя местную победу правом назначить лидера Аквелии. Прежняя сеть поможет устроить встречи, однако не сможет заранее написать ответы за всех приглашённых участников."
 HSM_AQR_CAM_JRR_colette_e1:0 "Мастерские за плакатами"
 HSM_AQR_CAM_JRR_colette_e1_desc:0 "Вербовочные плакаты Колетт когда-то несли послания, понятные только подполью. Мастерские, скрывавшиеся за этими сообщениями, теперь получают обычные заказы с печатями офицеров, торопящих поставки. Она пригласит старших мастеров в комнату планирования. Военная сеть способна руководить производством, однако прежде очередного неотложного требования ей придётся выяснить, что действительно можно изготовить на имеющихся верстаках и кто будет выполнять эту работу."
 HSM_AQR_CAM_JRR_colette_e2:0 "Смена после горна"
 HSM_AQR_CAM_JRR_colette_e2_desc:0 "Гарнизонный приказ велит мастерской работать до завершения задания. Рабочий делегат спрашивает, какого именно и кто сменит измотанную ночную бригаду. Колетт требует расписание, в котором указаны и поставки, и сменщики. Командование сохраняет право торопить работу, однако офицеру, скрывшему невыполнимую продолжительность труда, придётся самому объяснять пустые верстаки. Бывшие подпольщики уже знают, насколько дорого обходятся обещания людей, не знакомых с мастерской."
 HSM_AQR_CAM_JRR_colette_e3:0 "Разобрать лом революции"
 HSM_AQR_CAM_JRR_colette_e3_desc:0 "Захваченные склады снабдили мастерские металлом сомнительного происхождения и качества. Инженеры Колетт отделят пригодные запасы от материала, который внушительно выглядит только в реквизиционном бланке. Рабочие, тайно чинившие оружие, знают, какие замены выдерживают службу. Этим знаниям место у испытательного верстака, даже когда они противоречат рапорту интенданта об изобилии припасов. Ведомость с красивым итогом ещё не сделает испорченную деталь прочнее."
 HSM_AQR_CAM_JRR_colette_e4:0 "Республиканская ремонтная сеть"
 HSM_AQR_CAM_JRR_colette_e4_desc:0 "Связи MPA, которые Колетт помогала создавать вместе с Родье, теперь передают между провинциями списки повреждённых машин. Весткип предложит ремонтные бригады и проверенные детали общему республиканскому делу. Вместе с офицерами, договаривающимися о поставках, отправятся представители мастерских. Им предстоит согласовать выполнимую работу прежде, чем военное рвение обещает один и тот же станок трём далёким заказчикам, каждому из которых уже назначен срок."
 HSM_AQR_CAM_JRR_colette_e5:0 "Из разборочного двора в механический завод"
 HSM_AQR_CAM_JRR_colette_e5_desc:0 "Ремонтные бригады поддерживали машины в работе, но восстановленные детали не покрывают каждый новый заказ. Колетт создаёт постоянное механическое предприятие вокруг лучших уцелевших верстаков и специалистов, сохранивших их. Военные закупщики приносят общенациональные договоры, гражданские представители — согласованные условия труда. Первой проверкой завода станет способность обеих сторон выполнять обещания, не требуя молчания партнёра при каждом неудобном вопросе о сроках или сменах."
 HSM_AQR_CAM_JRR_colette_economy1:0 "Приказы, услышанные у верстака"
 HSM_AQR_CAM_JRR_colette_economy1_desc:0 "Офицеры Колетт выслушивают мастеров перед составлением расписаний. Срочные требования начинают соответствовать работе, которую действительно можно выполнить."
 HSM_AQR_CAM_JRR_colette_economy2:0 "Проверенный лом, согласованные смены"
 HSM_AQR_CAM_JRR_colette_economy2_desc:0 "Проверка восстановленных материалов и назначение сменщиков помогают революционным мастерским работать при нехватке припасов, не пряча трудности в интендантских рапортах."
 HSM_AQR_CAM_JRR_colette_economy3:0 "Республиканские механические предприятия Весткипа"
 HSM_AQR_CAM_JRR_colette_economy3_desc:0 "Ремонтная сеть превратилась в постоянное производство. Военные заказы и организованный гражданский труд сходятся в вопросах качества материалов, сроков поставок и спорных рабочих часов."
 HSM_AQR_CAM_JRR_colette_m1:0 "Через главные ворота гарнизона"
 HSM_AQR_CAM_JRR_colette_m1_desc:0 "Гарнизонные капитаны, прежде тайно принимавшие связных партизан, теперь встречают добровольцев, требующих признанной службы. Колетт впустит опытных бойцов через главные ворота и проверит, чему они способны научить регулярные части. Подпольная храбрость не решает вопросов командования. Она даёт право быть выслушанным прежде, чем кадровый офицер отвергнет всех, кто не может предъявить академическое свидетельство и назвать привычного ему наставника."
 HSM_AQR_CAM_JRR_colette_m2:0 "Тайники выходят на свет"
 HSM_AQR_CAM_JRR_colette_m2_desc:0 "Оружие, спрятанное для восстания, остаётся за ложными стенами, пока соседние роты жалуются на нехватку. Бывшие связные знают адреса, но не доверяют требованиям, не оставляющим подтверждения. Колетт приказывает принимающим офицерам записывать каждую передачу и возвращать подписанную расписку. Революционные запасы поступят на регулярную службу через тех, кто их охранял. Иначе очередной слух о конфискации снова закроет двери, которые едва удалось открыть."
 HSM_AQR_CAM_JRR_colette_m3:0 "Засада становится приказом"
 HSM_AQR_CAM_JRR_colette_m3_desc:0 "Бывший партизан объясняет удачную засаду жестами, которые штаб не умеет нанести на карту. Офицеры отвечают знаками, незнакомыми его разведчикам. Колетт выводит обе группы на местность, о которой они спорят. Им предстоит превратить опыт в приказ, понятный другому подразделению, сохранив инициативу дозоров. Каждый патруль должен видеть свою задачу в общем замысле, а не вести собственный бой по личному воспоминанию."
 HSM_AQR_CAM_JRR_colette_m4:0 "Донесения, способные изменить план"
 HSM_AQR_CAM_JRR_colette_m4_desc:0 "Офицеры Весткипа теперь действуют вместе с республиканскими соединениями за пределами марки. Предупреждение разведчика должно пройти через штабы, не превратившись в вежливую записку к неизменённому приказу. Колетт организует совместную работу связных, специалистов связи и составителей планов. Её требование единого командования мало значит, если оно не способно услышать то, что передовые подразделения уже выяснили на местности собственными силами."
 HSM_AQR_CAM_JRR_colette_m5:0 "Арсенал для республиканского фронта"
 HSM_AQR_CAM_JRR_colette_m5_desc:0 "Республиканским частям нужно оружие, детали которого можно заменить без спора между мастерскими. Колетт объединяет военные ремонтные заказы в арсенале с образцами, принятыми получающими штабами. Бывшие подпольные оружейники будут работать рядом с армейскими инспекторами. Их общая задача — отправлять на общенациональную службу надёжное снаряжение, сохраняя за гражданскими представителями возможность спрашивать, сколько труда требуют поставки и кто согласовал очередную смену."
 HSM_AQR_CAM_JRR_colette_military1:0 "Опыт, принятый в гарнизоне"
 HSM_AQR_CAM_JRR_colette_military1_desc:0 "Опытные бойцы нерегулярных отрядов помогают офицерам готовить выполнимые приказы. Единое командование Колетт получило знания, которых не даст одна военная школа."
 HSM_AQR_CAM_JRR_colette_military2:0 "Разведчики на штабной карте"
 HSM_AQR_CAM_JRR_colette_military2_desc:0 "Разведчики и кадровые офицеры освоили общий язык приказов. Знание местности доходит до стола планирования, не теряя смысла по пути."
 HSM_AQR_CAM_JRR_colette_military3:0 "Командование, которое слышит дозор"
 HSM_AQR_CAM_JRR_colette_military3_desc:0 "Республиканские части Весткипа связывают разведку, приказы и надёжное снабжение. Единое командование способно изменить план, когда дозор приносит более точные сведения."
 HSM_AQR_CAM_VIN_abc_c1:0 "Чтение после фабричного гудка"
 HSM_AQR_CAM_VIN_abc_c1_desc:0 "Ученик узнаёт любой инструмент в мастерской, но не может прочитать соглашение, которое кооператив просит его одобрить. Добровольцы ABC подстраивают занятия под смены, дополняя буквари расчётными листками, письмами и газетами. Движению, обещающему уничтожить наследственные привилегии, следует открыть собственные собрания. Никому не должно требоваться шепотком спрашивать студента о смысле решения, за которое сейчас предстоит голосовать."
 HSM_AQR_CAM_VIN_abc_c2:0 "Республика за порогом кафе"
 HSM_AQR_CAM_VIN_abc_c2_desc:0 "Общегосударственное собрание ABC принимает людей, никогда не бывавших в любимом кафе движения и не понимающих шуток его основателей. Делегаты просят присмотр за детьми и места для рабочих со сменным графиком. Движение предложило Аквелии социальную республику. Первым испытанием станет способность её собрания принять граждан, чей повседневный уклад совсем не похож на жизнь устроителей этого заседания."
 HSM_AQR_CAM_VIN_abc_e1:0 "Ключи остаются у мастерской"
 HSM_AQR_CAM_VIN_abc_e1_desc:0 "Хозяин уехал, но рабочие помнят, какой подшипник перегревается и кто задолжал за прошлогодний ремонт. Организаторы ABC предлагают передать мастерскую выборному управлению её работников. Первому собранию предстоит решить, кто закупает материалы и кто отвечает за испорченный заказ. Снять старую вывеску проще, чем обеспечить работу завтра, когда за дверью снова появятся заказчики с поломанными инструментами."
 HSM_AQR_CAM_VIN_abc_e2:0 "Заработок из кооперативной кассы"
 HSM_AQR_CAM_VIN_abc_e2_desc:0 "Студент гордо показывает первые кооперативные счета, пока машинист не спрашивает, где учтены неоплаченные ученики. Они пережили все авралы, но заработка не получили. Комитет ABC включит их в обсуждение выплат и запасов. Равенству предстоит выдержать вечер, когда справедливое вознаграждение одному работнику означает отсрочку покупки, которой ждут все остальные, включая тех, кто громче всего призывал делиться."
 HSM_AQR_CAM_VIN_abc_e3:0 "Станок, купленный сообща"
 HSM_AQR_CAM_VIN_abc_e3_desc:0 "Несколько небольших кооперативов могут позволить себе современный станок, только купив его сообща. Каждый хочет поставить машину в своей мастерской, поближе к знакомым работникам. Делегаты ABC собирают коллективы за одним столом, чтобы договориться о сменах и ремонте. Доводы в пользу общественной собственности обретут работающий шпиндель либо разобьются о спор, через чью дверь следует внести покупку."
 HSM_AQR_CAM_VIN_abc_e4:0 "Делегаты от станков"
 HSM_AQR_CAM_VIN_abc_e4_desc:0 "На общегосударственном хозяйственном совещании предусмотрены места для кооперативов, но основатели ABC не могут занять их одними университетскими друзьями. Мастерские направят делегатов с собственными предложениями об общих закупках и кредите. Пример Виновии должен стать доступным для чужих поправок. Студентам предстоит защищать расчёты перед рабочими, которые уже знают цену сорванной поставке и не согласны снова оплачивать её последствия."
 HSM_AQR_CAM_VIN_abc_e5:0 "Лаборатория после смены"
 HSM_AQR_CAM_VIN_abc_e5_desc:0 "Вечерние посетители кооператива приносят в университетскую лабораторию треснувшие отливки и замасленные тетради. Их вопросы пережили несколько пренебрежительных ответов учёных, которые никогда не видели эти машины в работе. Организаторы ABC добиваются постоянного места для таких исследований. Знание, созданное вместе с рабочими, сможет выйти за пределы Виновии, не превращаясь в очередную лекцию о том, как им следует жить."
 HSM_AQR_CAM_VIN_abc_economy1:0 "Ключи в руках рабочих"
 HSM_AQR_CAM_VIN_abc_economy1_desc:0 "Выборные коллективы мастерских отвечают за заказы, которыми прежде распоряжались отсутствующие хозяева."
 HSM_AQR_CAM_VIN_abc_economy2:0 "Кооперативный машинный зал"
 HSM_AQR_CAM_VIN_abc_economy2_desc:0 "Общие машины приучают соседние коллективы вместе решать вопросы ремонта и производства."
 HSM_AQR_CAM_VIN_abc_economy3:0 "Знание из цеха"
 HSM_AQR_CAM_VIN_abc_economy3_desc:0 "Рабочие приносят в лабораторию нерешённые производственные задачи и возвращаются к станкам с проверенными ответами."
 HSM_AQR_CAM_VIN_abc_m1:0 "Баррикада становится ротой"
 HSM_AQR_CAM_VIN_abc_m1_desc:0 "Добровольцы ABC помнят товарищей по баррикаде, но в ротных списках по-прежнему стоят прозвища из кафе и покинутые адреса. Гийом Букарле просит организаторов распределить уцелевших бойцов по настоящим обязанностям. Товарищество сохранит значение в новой армии. Оно должно также помочь новобранцу понять, куда обращаться, если привычного лица рядом не окажется и прежние устные договорённости перестанут работать."
 HSM_AQR_CAM_VIN_abc_m2:0 "Занятия у ящика с песком"
 HSM_AQR_CAM_VIN_abc_m2_desc:0 "Лектор ABC описывает блестящее наступление на песчаном макете, пока ветеран не спрашивает, куда понесут раненых. Букарле заставляет повторить упражнение с санитарами и уставшими связными. Тем, кто научился храбрости на улицах, предстоит освоить терпеливую пехотную работу. Лучший урок вполне может дать товарищ, который не окончил даже одного учебного года, зато вынес раненого из настоящего боя."
 HSM_AQR_CAM_VIN_abc_m3:0 "Командиры из каждой смены"
 HSM_AQR_CAM_VIN_abc_m3_desc:0 "Вечерние занятия посещают машинисты, грузчики и студенты, которым нельзя надолго оставить работу ради казарменного курса. Жан-Батист Жюль Желинот-де-Буа привозит инструкторов выяснить, чему их можно научить на месте. Совет ABC хочет открыть путь способным людям независимо от происхождения. Теперь кандидатам нужна практика, благодаря которой незнакомый взвод доверится им, даже когда учебный замысел начнёт разваливаться."
 HSM_AQR_CAM_VIN_abc_m4:0 "Выборный комитет арсенала"
 HSM_AQR_CAM_VIN_abc_m4_desc:0 "Общегосударственный оружейный заказ приходит в кооператив, участники которого прежде ремонтировали баррикадное оружие в чужих комнатах. Они избирают комитет для расширенного арсенала и просят проверяющих Букарле объяснять брак перед всей сменой. Рабочий контроль не исправит опасный затвор сам по себе. Зато изготовитель услышит жалобу солдата без хозяина, который привык говорить от имени их обоих."
 HSM_AQR_CAM_VIN_abc_m5:0 "Гражданский инструктор возвращается"
 HSM_AQR_CAM_VIN_abc_m5_desc:0 "Первые рабочие, подготовленные как инструкторы, возвращаются в округа с потрёпанными тетрадями. Совет ABC просит их обучать пополнение рядом с ветеранами, прежде сомневавшимися в успехе затеи. Гражданская армия сохранится благодаря навыкам, которые передают друг другу обычные семьи. Её офицерам придётся учиться командовать людьми, с которыми потом можно встретиться на кооперативном собрании и услышать открытое возражение."
 HSM_AQR_CAM_VIN_abc_military1:0 "Товарищи в ротном списке"
 HSM_AQR_CAM_VIN_abc_military1_desc:0 "Добровольцы с баррикад осваивают порядок, позволяющий новобранцам занять своё место в строю."
 HSM_AQR_CAM_VIN_abc_military2:0 "Вечерняя командирская школа"
 HSM_AQR_CAM_VIN_abc_military2_desc:0 "Рабочие и студенты учатся командовать на занятиях, согласованных с повседневной жизнью добровольцев."
 HSM_AQR_CAM_VIN_abc_military3:0 "Гражданская армия, умеющая учить"
 HSM_AQR_CAM_VIN_abc_military3_desc:0 "Опытные добровольцы возвращаются инструкторами, передавая соседям знания, приобретённые на общей службе."
 HSM_AQR_CAM_VIN_chevaliers_c1:0 "Ученики читают своё наследие"
 HSM_AQR_CAM_VIN_chevaliers_c1_desc:0 "Старинную книгу ремесленных рецептов ежегодно чествуют, но за пределами старших цеховых семей её почти никто не читает. Рыцари верности просят местных учителей подготовить понятные копии на языке, которым ученики пользуются дома. Сохранение виновийской культуры не может зависеть от недоступности её слов. Новые читатели, возможно, обнаружат на полях вопросы, которых покровители прежде никогда не задавали."
 HSM_AQR_CAM_VIN_chevaliers_c2:0 "Праздник другой провинции"
 HSM_AQR_CAM_VIN_chevaliers_c2_desc:0 "Партнёры рыцарей верности просят защитить гражданский праздник, совсем не похожий на виновийские церемонии. Некоторые покровители опасаются, что признание любого обычая лишит федерацию общего облика. Ответ содержится в их собственной хартии, которую теперь предстоит отстаивать. Гарантия, сохраняющая песни Виновии, должна оставить место соседям с совсем другими голосами, даже когда их слова сначала кажутся чужими и непонятными."
 HSM_AQR_CAM_VIN_chevaliers_e1:0 "Общая касса благотворителей"
 HSM_AQR_CAM_VIN_chevaliers_e1_desc:0 "Покровители рыцарей верности содержат собственные кухни и приюты, порой на противоположных сторонах одной улицы. Их управляющие сравнят, на что действительно хватает пожертвований. Общая касса сохранит историю каждого учреждения, позволяя направлять припасы туда, где длиннее очередь. Землевладельческой щедрости придётся выслушать вопросы тех, кто каждое утро готовит на её средства еду для ожидающих у дверей."
 HSM_AQR_CAM_VIN_chevaliers_e2:0 "Ярмарка на нашем языке"
 HSM_AQR_CAM_VIN_chevaliers_e2_desc:0 "Виновийские ремесленники хотят ярмарку, где товару не требуется модное аквелийское название, чтобы найти покупателя. Рыцари верности предлагают место и покровительство, торговцы просят проезжие подъезды и честные меры. Гордость соберёт праздничное шествие. Вернутся ли покупатели снова, зависит от того, встретят ли незнакомого купца так же приветливо, как управляющего соседним поместьем, привычного к почётному месту."
 HSM_AQR_CAM_VIN_chevaliers_e3:0 "Хартия ремесленного двора"
 HSM_AQR_CAM_VIN_chevaliers_e3_desc:0 "Пустующее поместное здание вместит несколько мастерских, но владелец ждёт, что старейшие цеховые семьи выберут всех арендаторов. Рыцари верности предлагают ремесленную хартию, сохраняющую местные приёмы и допускающую учеников без наследственного места. Покровители предоставят крышу. Мастерам предстоит решить, как сделать традицию источником заработка, доступным следующему поколению, даже если его представители родились за пределами привычного цехового круга."
 HSM_AQR_CAM_VIN_chevaliers_e4:0 "Ярмарки, признающие друг друга"
 HSM_AQR_CAM_VIN_chevaliers_e4_desc:0 "Общая федерация приносит приглашения на ярмарки, чьи обычаи виновийским покровителям незнакомы. Рыцари верности отправляют мастеров сравнить меры, поручительства и ученические свидетельства с соседскими. Общая торговля сохранит местное ремесло, если признание будет взаимным. Клеймо, принятое за пределами родной провинции, обязывает наших торговцев признавать чужое у себя, даже когда покупатель прежде никогда не видел такого изделия."
 HSM_AQR_CAM_VIN_chevaliers_e5:0 "Пожертвования за пределами знакомых улиц"
 HSM_AQR_CAM_VIN_chevaliers_e5_desc:0 "Провинциальное общество просит виновийских покровителей поддержать мастерскую для переселившихся семей. Её приёмы отличаются от ремесленного двора, а подопечные не знают любимых стихов рыцарей верности. Федерация позволяет выслушать просьбу. Расширение помощи покажет, заслуживают ли местные учреждения защиты лишь потому, что они виновийские, или потому, что любой общине нужны места, которые жители могут с полным правом считать своими."
 HSM_AQR_CAM_VIN_chevaliers_economy1:0 "Общий стол покровителей"
 HSM_AQR_CAM_VIN_chevaliers_economy1_desc:0 "Благотворительные учреждения согласуют закупки, сохраняя местное доверие, на котором держится их работа."
 HSM_AQR_CAM_VIN_chevaliers_economy2:0 "Соглашение ремесленного двора"
 HSM_AQR_CAM_VIN_chevaliers_economy2_desc:0 "Покровители предоставляют помещения, а мастера устраивают совместные мастерские на основе исполнимых соглашений."
 HSM_AQR_CAM_VIN_chevaliers_economy3:0 "Взаимный кредит провинций"
 HSM_AQR_CAM_VIN_chevaliers_economy3_desc:0 "Взаимно признанные гарантии позволяют провинциальным ремесленным учреждениям сотрудничать, сохраняя приёмы, которыми дорожат их общины."
 HSM_AQR_CAM_VIN_chevaliers_m1:0 "Открыть родовые оружейные"
 HSM_AQR_CAM_VIN_chevaliers_m1_desc:0 "В домах рыцарей верности оружие дедов хранится рядом с винтовками, купленными для недавней борьбы. Местной гвардии нужны именно винтовки, какими бы чувствами ни окружали старые клинки. Покровители откроют оружейные для проверки вместе с действующими солдатами. Воинское наследие принесёт пользу, если владельцы сумеют отличить почитаемую реликвию от оружия, которое другой грифон сможет безопасно взять на службу."
 HSM_AQR_CAM_VIN_chevaliers_m2:0 "Рыцарь учится искать укрытие"
 HSM_AQR_CAM_VIN_chevaliers_m2_desc:0 "Инструктор хвалит храбрость добровольцев рыцарей верности, затем предлагает пересечь учебное поле под наблюдением. Яркий ротный вымпел замечают раньше, чем начинает движение первый дозор. Гвардия сохранит церемонии и освоит маскировку вдали от парадной трибуны. Защита виновийской воинской традиции требует, чтобы её наследники прожили достаточно долго и успели передать опыт тем, кто придёт служить после них."
 HSM_AQR_CAM_VIN_chevaliers_m3:0 "Амбары на пути гвардии"
 HSM_AQR_CAM_VIN_chevaliers_m3_desc:0 "Капитаны гвардии наметили остановки у поместий, чьи хозяева встречаются на одних благотворительных обедах. Изабель де Пье-Грийеш спрашивает, что случится, если колонна пойдёт другой дорогой. Рыцари верности договорятся о складах с согласными городами и деревнями за пределами знакомого круга. Местной обороне необходимо знать всю местность, включая дворы, куда никогда не приносили приглашения от влиятельного покровителя."
 HSM_AQR_CAM_VIN_chevaliers_m4:0 "Общие детали, провинциальные цвета"
 HSM_AQR_CAM_VIN_chevaliers_m4_desc:0 "Федеративные гвардейцы привозят винтовки разных мастеров и обнаруживают, что запасные части не подходят друг к другу. Рыцари верности поддержат оружейную мастерскую общего образца, сохранив цвета каждого отряда. Совместное производство не обязано стирать полковую память. Однако гордым капитанам придётся перестать считать несовместимый винт древней вольностью, которую необходимо защищать даже ценой исправности оружия у соседнего подразделения."
 HSM_AQR_CAM_VIN_chevaliers_m5:0 "Каждая провинция снабжает соседнюю"
 HSM_AQR_CAM_VIN_chevaliers_m5_desc:0 "Совместные учения проводят виновийскую гвардию через соседнюю провинцию и поручают нашим складам снабжать прибывший оттуда отряд. Рыцари верности утверждали, что взаимные обязанности защищают местные свободы. Теперь квартирмейстерам предстоит доказать это, доставляя обычные припасы солдатам в непривычной форме. Учения закончатся, когда оба отряда смогут вернуться, не оставив вдоль дорог дворов, которым так и не заплатили."
 HSM_AQR_CAM_VIN_chevaliers_military1:0 "Припасы для местных знамён"
 HSM_AQR_CAM_VIN_chevaliers_military1_desc:0 "Оружейные и склады гвардии начинают служить действующим отрядам, а не престижу знатных домов."
 HSM_AQR_CAM_VIN_chevaliers_military2:0 "Расширенный круг гвардии"
 HSM_AQR_CAM_VIN_chevaliers_military2_desc:0 "Склады за пределами покровительских поместий дают местной гвардии надёжную поддержку более широкого круга жителей."
 HSM_AQR_CAM_VIN_chevaliers_military3:0 "Взаимная стража федерации"
 HSM_AQR_CAM_VIN_chevaliers_military3_desc:0 "Провинциальные отряды сохраняют традиции, учась снабжать и сменять друг друга."
 HSM_AQR_CAM_VIN_gadiffer_c1:0 "Вдовы у ворот поместья"
 HSM_AQR_CAM_VIN_gadiffer_c1_desc:0 "Семьи королевских добровольцев приносят во дворец письма тех, кто уже не вернётся домой. Управляющий Гадиффера узнаёт подписи, но не находит никаких распоряжений о детях, ожидающих рядом с матерями. Герцог отводит часть поместных доходов на их содержание. Его дому предстоит признать обязательство, которое сохраняется и после того, как имя солдата исчезает из полкового списка."
 HSM_AQR_CAM_VIN_gadiffer_c2:0 "Голос Виновии рядом с короной"
 HSM_AQR_CAM_VIN_gadiffer_c2_desc:0 "Место Гадиффера в общих совещаниях приводит к нему посетителей, никогда не плативших ренту его дому. Они хотят знать, зависит ли защита от этой связи. Герцог просит представить жалобы рядом с виновийскими. Он намерен отстаивать интересы своей провинции при короне, однако родство с государем не должно превращать все остальные области в просителей у его ворот."
 HSM_AQR_CAM_VIN_gadiffer_e1:0 "Рентные расписки под герцогской печатью"
 HSM_AQR_CAM_VIN_gadiffer_e1_desc:0 "Арендаторы Гадиффера приносят расписки, которых управляющие его владений не внесли в книги. Одни платили зерном, другие вместо ренты чинили мельницу. Герцог велит сверить обязательства прежде, чем из его дома отправится очередное требование. Верность короне обретёт более прочные корни, если имя Дискретов на расписке будет означать, что долг действительно погашен и его не потребуют снова."
 HSM_AQR_CAM_VIN_gadiffer_e2:0 "Зерно под залог дворцового серебра"
 HSM_AQR_CAM_VIN_gadiffer_e2_desc:0 "Купцы готовы отпустить зерно в долг Гадифферу, однако управляющий предлагает заложить будущий урожай арендаторов. Герцог вместо этого выкладывает дворцовое серебро. Высокое происхождение способно открыть купеческий амбар, но риск неурожая всё равно должен принять кто-то определённый. Хозяйству виновийских поместий предстоит выяснить, насколько далеко отеческая забота распространяется на собственное имущество герцога и привычный достаток его придворных."
 HSM_AQR_CAM_VIN_gadiffer_e3:0 "Аренда для мельничных мастеров"
 HSM_AQR_CAM_VIN_gadiffer_e3_desc:0 "Старой поместной мельнице нужны механизмы, которые её потомственный смотритель не может купить. Гадиффер приглашает мастеров арендовать мастерскую на условиях, признающих ремонт вложением, а не бесплатной повинностью. Смотритель возражает: чужаки займут место его отца. Письменная аренда должна сохранить ремесло, не обрекая всех соседей пользоваться сломанным колесом только потому, что оно принадлежит хорошо знакомому семейству."
 HSM_AQR_CAM_VIN_gadiffer_e4:0 "Закупочная книга короны"
 HSM_AQR_CAM_VIN_gadiffer_e4_desc:0 "Провинциальные поставщики привыкли не доверять заказам, чья пышная печать надёжнее платёжных обещаний заказчика. Гадиффер приносит сверенные виновийские счета в общегосударственную закупочную контору и просит корону обязать покупателей соблюдать тот же порядок. Родовое имя открывает ему дверь. Поставщики, ожидающие снаружи, оценят результат по тому, оплатят ли следующий счёт, не заставляя их снова искать влиятельного заступника."
 HSM_AQR_CAM_VIN_gadiffer_e5:0 "Дом, отвечающий за своё слово"
 HSM_AQR_CAM_VIN_gadiffer_e5_desc:0 "Прежде богатство поместья измеряли числом гостей, которых оно могло накормить. Гадиффер хочет, чтобы его дом знали по обязательствам, исполняемым даже в трудный год. Землемеры и строители возвращаются к работам, оставленным после прежних нарушенных обещаний. Пример герцога дойдёт до короны вместе с завершёнными постройками, подкрепляя его авторитет убедительнее, чем очередной роскошный пир для придворных."
 HSM_AQR_CAM_VIN_gadiffer_economy1:0 "Сверенные счета герцога"
 HSM_AQR_CAM_VIN_gadiffer_economy1_desc:0 "Признанные расписки позволяют поместным мастерским планировать работу без опасения, что старое требование вернётся."
 HSM_AQR_CAM_VIN_gadiffer_economy2:0 "Серебро за обещанием"
 HSM_AQR_CAM_VIN_gadiffer_economy2_desc:0 "Дом Гадиффера поручается за соглашения, позволяющие арендаторам и мельничным мастерам продолжать работу."
 HSM_AQR_CAM_VIN_gadiffer_economy3:0 "Кредит дома Дискретов"
 HSM_AQR_CAM_VIN_gadiffer_economy3_desc:0 "Репутацию герцога поддерживают оплаченные поставки и завершённые постройки: личное покровительство обязывает выполнять обещания."
 HSM_AQR_CAM_VIN_gadiffer_m1:0 "Служба под родовым знаменем"
 HSM_AQR_CAM_VIN_gadiffer_m1_desc:0 "Герцогское знамя привлекает добровольцев, которым имя Дискретов знакомо лучше солдатских обязанностей. Гадиффер просит Роберта Ниверолле превратить привязанность к роду в надёжную службу. В списках рядом с именами появятся прежний опыт и ремесло новобранцев. Верному полку нужен возчик, способный обеспечить движение обоза, не меньше, чем дворянин, которому доверят нести его знамя перед строем."
 HSM_AQR_CAM_VIN_gadiffer_m2:0 "Проверить орудийные расчёты"
 HSM_AQR_CAM_VIN_gadiffer_m2_desc:0 "Ниверолле наблюдает великолепный салют батареи, после которого расчёты с трудом увозят орудия. Следующий смотр он назначает на обычной дороге, вместе с зарядными повозками. Офицерам Гадиффера придётся показать, как пушки достигнут позиций, которые они обещают защитить. Зрители могут подождать: прежде чем устраивать новое представление, расчётам следует научиться доводить до конца самый обыкновенный переход."
 HSM_AQR_CAM_VIN_gadiffer_m3:0 "Хлеб прежде парада"
 HSM_AQR_CAM_VIN_gadiffer_m3_desc:0 "Маршрут полкового парада проходит через округ, который уже снабжает его полевые кухни. Ниверолле предлагает регулярный подвоз вместо внезапных приездов офицеров к опустевшим складам. Гадиффер требует учитывать уборку урожая, которую арендаторы не могут отложить. Новому порядку предстоит выдержать встречу с голодными солдатами, усталыми возчиками и полковником, привыкшим неизменно получать всё необходимое раньше остальных."
 HSM_AQR_CAM_VIN_gadiffer_m4:0 "Герцогская батарея на общей службе"
 HSM_AQR_CAM_VIN_gadiffer_m4_desc:0 "Общее командование просит батареи, способные обмениваться боеприпасами и донесениями, сохраняя свою верность. Гадиффер предлагает виновийскую мастерскую для изготовления деталей по общему образцу. Ниверолле приносит мастерам изношенные части орудий. Служба короне за пределами герцогства теперь требует признать, что изделиями наших оружейников будет пользоваться расчёт из другой провинции, которому незнакомы местные привычки и названия деталей."
 HSM_AQR_CAM_VIN_gadiffer_m5:0 "Офицеры перед своими солдатами"
 HSM_AQR_CAM_VIN_gadiffer_m5_desc:0 "Гадиффер выслушал достаточно споров об обозах, чтобы узнать знакомые оправдания в полковой жалобе. Ниверолле соберёт офицеров для совместного разбора сбоев снабжения и командования. Патент остаётся честью, дарованной от имени короны, однако его обладателю придётся объяснить, что произошло с доверенными ему солдатами, когда письменные распоряжения перестали действовать и решение нужно было принимать на месте."
 HSM_AQR_CAM_VIN_gadiffer_military1:0 "Герцогский сбор"
 HSM_AQR_CAM_VIN_gadiffer_military1_desc:0 "Верные добровольцы учатся служить рядом с незнакомцами под привычным родовым знаменем."
 HSM_AQR_CAM_VIN_gadiffer_military2:0 "Книга полкового довольствия"
 HSM_AQR_CAM_VIN_gadiffer_military2_desc:0 "Порядок Ниверолле обязывает офицеров рассчитывать на поставки, которые снабжающие полк деревни действительно могут обеспечить."
 HSM_AQR_CAM_VIN_gadiffer_military3:0 "Честно исполненные патенты"
 HSM_AQR_CAM_VIN_gadiffer_military3_desc:0 "Герцогские офицеры поддерживают честь королевской службы, отвечая за доверенных им солдат и припасы."
 HSM_AQR_CAM_VIN_sis_c1:0 "Экзамен без рекомендателей"
 HSM_AQR_CAM_VIN_sis_c1_desc:0 "Выпускники общества узнают друг друга на собеседованиях, пока незнакомый соискатель ждёт с более сильной письменной работой. ОСИ уберёт имена и рекомендации с первого этапа проверки кандидатов. Сеть помогла республиканским идеям выжить; теперь государственная служба должна выйти за её пределы. Старым учебным кружкам придётся признать, что незнакомец может оказаться лучше подготовленным к поручаемой работе, чем их товарищ."
 HSM_AQR_CAM_VIN_sis_c2:0 "Республика вправе поправить учителей"
 HSM_AQR_CAM_VIN_sis_c2_desc:0 "Старый преподаватель общества слышит собственные доводы против общегосударственного назначения, которое он рекомендовал. Выступающий усвоил их на открытых занятиях самого общества. ОСИ предстоит осмыслить обещание политических перемен внутри существующей республики. Самой полезной службой общему делу может оказаться защита права гражданина ставить в неудобное положение тех, кто его учил, даже если среди них находятся давние друзья и уважаемые коллеги."
 HSM_AQR_CAM_VIN_sis_e1:0 "Одинаковая гиря на каждом прилавке"
 HSM_AQR_CAM_VIN_sis_e1_desc:0 "Выпускник общества покупает одинаковое количество муки в трёх лавках и возвращается с тремя разными отвесами. Торговцы не доверяют будущим проверяющим, многие из которых никогда не обслуживали покупателей. ОСИ соберёт продавцов и обученных измерителей за открытым испытательным столом. Доверие к республике может начаться с покупателя, лично наблюдающего проверку, от которой зависит содержимое его покупки."
 HSM_AQR_CAM_VIN_sis_e2:0 "Насос должен работать при свидетелях"
 HSM_AQR_CAM_VIN_sis_e2_desc:0 "Инженер, рекомендованный старым знакомым общества, обещает насос, который изменит городское водоснабжение. Чертежи впечатляют комиссию; смотритель колодца просит показать машину в работе. ОСИ потребует испытания с местными служителями прежде приёмки установки. Профессиональное знание должно выдерживать неудобные вопросы тех, кому предстоит ежедневно пользоваться машиной, устранять неполадки и отвечать соседям, когда из трубы перестаёт поступать вода."
 HSM_AQR_CAM_VIN_sis_e3:0 "Приборы, достойные свидетельства"
 HSM_AQR_CAM_VIN_sis_e3_desc:0 "Испытательному столу общества стало тесно в заимствованной комнате. Приборные мастера готовы открыть рядом производство калибров и электрических измерителей, если проверяющие опубликуют точный смысл своих свидетельств. Мастерская даст виновийским производителям нечто полезнее внушительной печати. Её собственные изделия пройдут такие же открытые испытания, как чужие, и мастера не смогут ссылаться на дружбу с теми, кто подписывает заключение."
 HSM_AQR_CAM_VIN_sis_e4:0 "Одинаковый сигнал по всей Аквелии"
 HSM_AQR_CAM_VIN_sis_e4_desc:0 "Технические делегаты обнаруживают, что оборудование, принятое одной провинцией, не всегда связывается с приборами, одобренными другой. ОСИ предоставляет записи испытаний для совместной проверки электрических стандартов. Республиканской сети общества предстоит обмениваться поправками так же охотно, как манифестами. Цепь, работающая за пределами Виновии, станет более убедительным доводом в пользу сотрудничества, чем очередная прославленная речь перед собравшимися сторонниками."
 HSM_AQR_CAM_VIN_sis_e5:0 "Корреспонденты с открытыми тетрадями"
 HSM_AQR_CAM_VIN_sis_e5_desc:0 "Корреспонденты общества прежде присылали рассказы о политических переменах за рубежом. Теперь в письмах встречаются неудачные опыты, цеховые измерения и просьбы проверить выводы. ОСИ создаст постоянное исследовательское место для такого обмена. Общая республика получит полезное учреждение, если сеть сумеет принять убедительную поправку от человека, который никогда не состоял в её старейших учебных кружках и не знаком с руководителями."
 HSM_AQR_CAM_VIN_sis_economy1:0 "Открытый испытательный стол"
 HSM_AQR_CAM_VIN_sis_economy1_desc:0 "Торговцы и проверяющие устанавливают стандарты, смысл которых покупатель может увидеть сам."
 HSM_AQR_CAM_VIN_sis_economy2:0 "Свидетельства с открытыми методами"
 HSM_AQR_CAM_VIN_sis_economy2_desc:0 "Приборные мастера и проверяющие публикуют методы испытаний, помогая выявлять и исправлять недостатки."
 HSM_AQR_CAM_VIN_sis_economy3:0 "Технический обмен корреспондентов"
 HSM_AQR_CAM_VIN_sis_economy3_desc:0 "Сеть общества передаёт полезные производственные находки между мастерскими, готовыми открывать собственные ошибки."
 HSM_AQR_CAM_VIN_sis_m1:0 "Землемер рядом с сержантом"
 HSM_AQR_CAM_VIN_sis_m1_desc:0 "Добровольцы ОСИ приходят в казармы с картами, на изящных горизонталях которых отсутствует мостик, знакомый каждому местному дозору. Гийом Букарле прикрепляет землемеров к сержантам прежде приёмки работ. Армии нужны образованные специалисты, готовые пройти описанную местность. Общая карта начинается там, где выпускник перестаёт поправлять солдата и даёт ему рассказать, по каким дорогам тот ходил на самом деле."
 HSM_AQR_CAM_VIN_sis_m2:0 "Таблицы дальности на местности"
 HSM_AQR_CAM_VIN_sis_m2_desc:0 "Артиллерийский класс быстро решает задачи, однако два наблюдателя возвращаются с разными расстояниями до одной цели. Математики общества вместе с расчётами выяснят, где измерение уступило место предположению. Исправленные таблицы должны читаться под дождём и при тусклом свете. Решающее доказательство придёт от батареи, которая воспользуется ими без авторов рядом, когда уточнить смысл записи немедленно будет невозможно."
 HSM_AQR_CAM_VIN_sis_m3:0 "Штабное учение выходит из библиотеки"
 HSM_AQR_CAM_VIN_sis_m3_desc:0 "Семинар общества подготовил превосходный план снабжения по дорогам, где его участники никогда не бывали. Букарле приглашает авторов провести учения с настоящими телегами и связными. Их расчёты столкнутся с задержками и противоречивыми донесениями. Республиканскому штабу предстоит научиться пересматривать стройный ответ прежде, чем солдаты в другом месте заплатят за его нежелание признать собственную неуверенность в непроверенных сведениях."
 HSM_AQR_CAM_VIN_sis_m4:0 "Оптика для общей армии"
 HSM_AQR_CAM_VIN_sis_m4_desc:0 "Общая армия просит виновийских приборных мастеров выпускать прицелы с одинаковыми обозначениями независимо от провинциального заказчика. ОСИ устраивает производственную мастерскую рядом с испытательными помещениями и настаивает на прямых жалобах солдат. Специалистам, служащим республике, придётся принять проверку со стороны пользователей. Прицел готов лишь тогда, когда наводчик может ему доверять, какие бы дипломы ни предъявлял подписавший заключение экзаменатор."
 HSM_AQR_CAM_VIN_sis_m5:0 "Неудобная поправка наблюдателя"
 HSM_AQR_CAM_VIN_sis_m5_desc:0 "Воздушный наблюдатель возвращается с зарисовкой, противоречащей маршруту, который утвердил уважаемый штабной преподаватель. Общество соберёт наблюдателей, картографов и снабженцев в одном учебном помещении. Профессиональное суждение становится надёжнее, когда поправка доходит до нужного адресата. Армии следует выслушать неудобное донесение прежде, чем она снова направит колонну по неверной дороге и заставит солдат исправлять ошибку долгим обходом."
 HSM_AQR_CAM_VIN_sis_military1:0 "Карты с сержантскими поправками"
 HSM_AQR_CAM_VIN_sis_military1_desc:0 "Землемеры учитывают дороги и препятствия, знакомые действующим дозорам."
 HSM_AQR_CAM_VIN_sis_military2:0 "Расчёты, проверенные колонной"
 HSM_AQR_CAM_VIN_sis_military2_desc:0 "Штабные специалисты проверяют планы снабжения настоящими переходами и донесениями с дороги."
 HSM_AQR_CAM_VIN_sis_military3:0 "Штаб, принимающий поправки"
 HSM_AQR_CAM_VIN_sis_military3_desc:0 "Наблюдатели и снабженцы могут исправить общий план прежде, чем стройная ошибка превратится в приказ о выступлении."
 HSM_AQR_JEB_cocardiers:0 "Исполнительный комитет кокардистов"
 HSM_AQR_JEB_cocardiers_government_tt:0 "Правительство: Нейтралитет. Правитель: $HSM_AQR_JEB_cocardiers$. Поддержка правящей силы: §Y55%§!; остальных течений: по §Y15%§!. Общегосударственные выборы не назначаются."
 HSM_AQR_JEB_cocardiers_organise:0 "Созвать революционные трибуналы"
 HSM_AQR_JEB_cocardiers_organise_desc:0 "До трибунала дошло обвинение времён боёв, к которому не приложено ни одного свидетельства. Кокардьеры не могут обещать Аквелии защищённую республику, позволяя неподписанной бумаге решать судьбу соседа. Им предстоит собрать доказательства и выслушать защиту. Зал суда должен показать, что означает их революционная власть, когда толпа за дверями требует немедленного ответа и заранее уверена в виновности обвиняемого."
 HSM_AQR_JEB_cocardiers_organise_effect:0 "Политическая власть: §G+35§!."
 HSM_AQR_JEB_cocardiers_organise_req_tt:0 "Эта программа выбрана, областное управление продолжает работу."
 HSM_AQR_JEB_cocardiers_party:0 "Кокардисты"
 HSM_AQR_JEB_cocardiers_pledge:0 "Создать чрезвычайный комитет"
 HSM_AQR_JEB_cocardiers_pledge_desc:0 "После победы у кокардьеров остался комитет, привыкший получать тревожные донесения перед рассветом. Его посыльные всё ещё спешат по Риле, хотя баррикады уже разбирают. Движение намерено защищать республику по всей Аквелии. Сначала предстоит решить, какие чрезвычайные обязанности ещё нужны здесь и кто вправе оспорить приказ, отданный во имя опасности, которой больше никто не заметил."
 HSM_AQR_JEB_cocardiers_pledge_effect:0 "Принять послереволюционную программу."
 HSM_AQR_JEB_cocardiers_pledge_req_tt:0 "Победившее областное движение поддержало эту программу; другая программа не принята."
 HSM_AQR_JEB_cocardiers_programme_tt:0 "Изменение национального духа «§Y$HSM_AQR_compact$§!»:\n$MODIFIER_MOBILIZATION_SPEED$: §G+15.0%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+10.0%§!"
 HSM_AQR_JEB_cocardiers_ratify_again_req_tt:0 "Победившую программу можно утвердить; требуется 50 политической власти."
 HSM_AQR_JEB_cocardiers_resume_req_tt:0 "Выберите революционную программу кокардьеров. Её утверждение требует победы революции и мира в Риле."
 HSM_AQR_JEB_cocardiers_settle:0 "Объединить командование"
 HSM_AQR_JEB_cocardiers_settle_desc:0 "В одну мастерскую пришли два приказа с печатями разных комитетов. Кокардьеры решат, кто говорит от имени их правительства и кто отвечает, когда это решение ошибочно. Они намерены предложить свою программу всей республике. Сначала Рила должна показать, что общее руководство способно защитить победу, не оставляя граждан навсегда в положении жителей осаждённого города."
 HSM_AQR_JEB_cocardiers_settle_effect:0 "Будет созвано учредительное собрание. Утверждение требует §Y50§! политической власти и учреждает правительство с его программой."
 HSM_AQR_JEB_cocardiers_settle_req_tt:0 "Выбранная программа может учредить правительство в мирное время или во время нашей войны за Аквелию."
 HSM_AQR_JEB_constitutional_government_tt:0 "Правительство: Демократия / Гармония. Правитель: $JEB_duke_michel_discret$. Поддержка правящей силы: §Y55%§!; остальных течений: по §Y15%§!. Выборы разрешены."
 HSM_AQR_JEB_constitutional_organise:0 "Признать собрание"
 HSM_AQR_JEB_constitutional_organise_desc:0 "Мишель возвращается с письмом клубов во внутреннем кармане. На столе лежит хартия, позволяющая выборному собранию отклонять предложения министров. Прежний секретарь тянется за чистым экземпляром, но герцог просит сначала прочесть поправки. Приглашение положило конец изгнанию; лишь соглашение с собранием может дать ему место в правительстве Рилы, и подпись под ним теперь не заменяет согласия остальных."
 HSM_AQR_JEB_constitutional_organise_effect:0 "Политическая власть: §G+35§!."
 HSM_AQR_JEB_constitutional_organise_req_tt:0 "Эта программа выбрана, областное управление продолжает работу."
 HSM_AQR_JEB_constitutional_party:0 "Конституционный блок"
 HSM_AQR_JEB_constitutional_pledge:0 "Собрать двор и клубы"
 HSM_AQR_JEB_constitutional_pledge_desc:0 "Когда революция победила в Риле, Мишель бежал. Теперь бои закончились, и прежние союзники предлагают пригласить его на переговоры с победившими клубами. Письмо обещает безопасное возвращение, но не восстановление прежней власти. Если герцог согласится, первая встреча пройдёт в предоставленном для неё зале, где делегаты, разрешившие его приезд, смогут задать вопросы без придворных церемоний."
 HSM_AQR_JEB_constitutional_pledge_effect:0 "Принять послереволюционную программу."
 HSM_AQR_JEB_constitutional_pledge_req_tt:0 "Победившее областное движение поддержало эту программу; другая программа не принята."
 HSM_AQR_JEB_constitutional_programme_tt:0 "Изменение национального духа «§Y$HSM_AQR_compact$§!»:\n$MODIFIER_POLITICAL_POWER_FACTOR$: §G+10.0%§!\n$MODIFIER_STABILITY_FACTOR$: §G+5.0%§!"
 HSM_AQR_JEB_constitutional_ratify_again_req_tt:0 "Победившую программу можно утвердить; требуется 50 политической власти."
 HSM_AQR_JEB_constitutional_resume_req_tt:0 "Выберите конституционное соглашение в революционном лагере Рилы. Его утверждение требует победы революции и мира."
 HSM_AQR_JEB_constitutional_settle:0 "Ответственное министерство"
 HSM_AQR_JEB_constitutional_settle_desc:0 "В хартии, обсуждаемой после возвращения Мишеля, остаётся открытым вопрос: что вправе делать министры между заседаниями собрания? Делегаты приводят примеры первых мирных недель, когда промедление оставляло прошения без ответа. Соглашение должно доказать свою пригодность в Риле, прежде чем его сторонники представят проект всей Аквелии. Мишелю предстоит вместе с ними заслужить право быть выслушанным за пределами герцогства."
 HSM_AQR_JEB_constitutional_settle_effect:0 "Будет созвано учредительное собрание. Утверждение требует §Y50§! политической власти и учреждает правительство с его программой."
 HSM_AQR_JEB_constitutional_settle_req_tt:0 "Выбранная программа может учредить правительство в мирное время или во время нашей войны за Аквелию."
 HSM_AQR_JEB_moderate:0 "Рильский конституционный комитет"
 HSM_AQR_JEB_moderate_government_tt:0 "Правительство: Демократия / Гармония. Правитель: $HSM_AQR_JEB_moderate$. Поддержка правящей силы: §Y55%§!; остальных течений: по §Y15%§!. Выборы разрешены."
 HSM_AQR_JEB_moderate_organise:0 "Защитить голосование"
 HSM_AQR_JEB_moderate_organise_desc:0 "Печатник уже готовит бюллетени, однако вооружённый ветеран требует следить за каждым листом, выходящим из станка. Он называет это защитой. Умеренные помнят, как охотно этим словом оправдывали произвол до революции. Они найдут наблюдателей, которым доверяют за пределами клубов, а ветерана попросят оставить винтовку в другом месте, когда он придёт голосовать вместе с остальными жителями."
 HSM_AQR_JEB_moderate_organise_effect:0 "Политическая власть: §G+35§!."
 HSM_AQR_JEB_moderate_organise_req_tt:0 "Эта программа выбрана, областное управление продолжает работу."
 HSM_AQR_JEB_moderate_party:0 "Союз умеренных клубов"
 HSM_AQR_JEB_moderate_pledge:0 "Создать общий комитет"
 HSM_AQR_JEB_moderate_pledge_desc:0 "Клубы вместе отвоевали улицы, но теперь их посыльные разносят одно прошение по трём разным конторам. Вдова всё утро следует за одним из них, пытаясь узнать, кто вправе ей ответить. Умеренные объединят приёмные. Прежде чем участвовать в спорах о будущем Аквелии, им стоит дать хотя бы одной соседке адрес, по которому её действительно выслушают."
 HSM_AQR_JEB_moderate_pledge_effect:0 "Принять послереволюционную программу."
 HSM_AQR_JEB_moderate_pledge_req_tt:0 "Победившее областное движение поддержало эту программу; другая программа не принята."
 HSM_AQR_JEB_moderate_programme_tt:0 "Изменение национального духа «§Y$HSM_AQR_compact$§!»:\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §G-5.0%§!\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10.0%§!"
 HSM_AQR_JEB_moderate_ratify_again_req_tt:0 "Победившую программу можно утвердить; требуется 50 политической власти."
 HSM_AQR_JEB_moderate_resume_req_tt:0 "Выберите программу умеренных клубов. Её утверждение требует победы революционного лагеря Рилы и мира в стране."
 HSM_AQR_JEB_moderate_settle:0 "Амнистия через суд"
 HSM_AQR_JEB_moderate_settle_desc:0 "Приёмная комитета остаётся переполненной и после окончания боёв. Семьи разыскивают заключённых, бывшие противники предлагают сдать оружие, свидетели называют виновников убийств. Умеренным предстоит отличить политическое поражение от обвинения, которое должен рассмотреть суд. Когда их делегаты присоединятся к общему республиканскому движению, эти дела будут значить больше очередной речи о законности и покажут, чего стоят обещания клубов."
 HSM_AQR_JEB_moderate_settle_effect:0 "Будет созвано учредительное собрание. Утверждение требует §Y50§! политической власти и учреждает правительство с его программой."
 HSM_AQR_JEB_moderate_settle_req_tt:0 "Выбранная программа может учредить правительство в мирное время или во время нашей войны за Аквелию."
 HSM_AQR_JEB_royal_government_tt:0 "Правительство: Нейтралитет. Правитель: $JEB_duke_michel_discret$. Поддержка правящей силы: §Y55%§!; остальных течений: по §Y15%§!. Общегосударственные выборы не назначаются."
 HSM_AQR_JEB_royal_organise:0 "Выслушать умеренных"
 HSM_AQR_JEB_royal_organise_desc:0 "Во дворце снимают чехлы с кресел для гостей, не приходивших сюда во время боёв. Некоторые придворные возражают против приглашения критиков сразу после победы роялистов. Мишель спрашивает, собираются ли они управлять Рилой, не выслушав её жителей. Короне, пережившей революцию, нужны люди, готовые говорить правду под её крышей, в том числе и сторонники давно назревших реформ."
 HSM_AQR_JEB_royal_organise_effect:0 "Политическая власть: §G+35§!."
 HSM_AQR_JEB_royal_organise_req_tt:0 "Эта программа выбрана, областное управление продолжает работу."
 HSM_AQR_JEB_royal_party:0 "Рильские роялисты"
 HSM_AQR_JEB_royal_pledge:0 "Защитить улицы"
 HSM_AQR_JEB_royal_pledge_desc:0 "Роялисты удержали Рилу, но при появлении патруля ставни по-прежнему захлопываются. Мишель наблюдает, как лавочник ждёт ухода солдат, прежде чем открыть дверь. Герцог соберёт капитанов и спросит, что победа изменила для этой семьи. Теперь служба короне должна означать нечто большее, чем поиски очередного врага на улице, где жители наконец хотят вернуться к обычной жизни."
 HSM_AQR_JEB_royal_pledge_effect:0 "Принять послереволюционную программу."
 HSM_AQR_JEB_royal_pledge_req_tt:0 "Победившее областное движение поддержало эту программу; другая программа не принята."
 HSM_AQR_JEB_royal_programme_tt:0 "Изменение национального духа «§Y$HSM_AQR_compact$§!»:\n$MODIFIER_ARMY_ORG_FACTOR$: §G+5.0%§!\n$MODIFIER_STABILITY_FACTOR$: §G+5.0%§!"
 HSM_AQR_JEB_royal_ratify_again_req_tt:0 "Победившую программу можно утвердить; требуется 50 политической власти."
 HSM_AQR_JEB_royal_resume_req_tt:0 "Выберите лоялистскую программу Мишеля. Её утверждение требует победы монархистов и мира в стране."
 HSM_AQR_JEB_royal_settle:0 "Ограничить чрезвычайную власть"
 HSM_AQR_JEB_royal_settle_desc:0 "На столе Мишеля лежат военные приказы, составители которых затрудняются объяснить предоставленные полномочия. Капитаны требуют ясных распоряжений, судьи — прекращения обысков без ордера. Разрешив этот спор, Рила получит управление, пригодное для мирной жизни. Мишель намерен укрепить корону Дискретов делами своего правительства, начиная с доверия подданных к следующей королевской подписи под решением, касающимся их домов."
 HSM_AQR_JEB_royal_settle_effect:0 "Будет созвано учредительное собрание. Утверждение требует §Y50§! политической власти и учреждает правительство с его программой."
 HSM_AQR_JEB_royal_settle_req_tt:0 "Выбранная программа может учредить правительство в мирное время или во время нашей войны за Аквелию."
 HSM_AQR_JFT_communes:0 "Совет коммун"
 HSM_AQR_JFT_communes_government_tt:0 "Правительство: Коммунизм. Правитель: $HSM_AQR_JFT_communes$. Поддержка правящей силы: §Y55%§!; остальных течений: по §Y15%§!. Общегосударственные выборы не назначаются."
 HSM_AQR_JFT_communes_organise:0 "Ополчение отвечает перед собраниями"
 HSM_AQR_JFT_communes_organise_desc:0 "Патрули ополчения всё ещё исполняют военные приказы, задерживая хлебные подводы на перекрёстке, который больше не нужно защищать. Делегаты раскладывают план города на столе пекарни и спрашивают, какие обязанности сохранили смысл. Собрания должны договориться о надзоре за отрядами и смене командиров, игнорирующих их решения. Общая оборона федерации обязана отвечать перед общинами, которым служит. Пекарь просит освободить дорогу до выхода следующего обоза."
 HSM_AQR_JFT_communes_organise_effect:0 "Политическая власть: §G+35§!."
 HSM_AQR_JFT_communes_organise_req_tt:0 "Эта программа выбрана, областное управление продолжает работу."
 HSM_AQR_JFT_communes_party:0 "Федерация коммун"
 HSM_AQR_JFT_communes_pledge:0 "Собрания по кварталам"
 HSM_AQR_JFT_communes_pledge_desc:0 "Победа заполнила зал ещё до прихода последней смены. Старые коммунары настаивают: новый порядок нельзя поручать ораторам, которых никто не вправе сменить. Каждый квартал выберет делегатов, связанных поручениями своего собрания. Придея должна показать, как такая подотчётность сможет работать в федерации всей Аквелии. Начать предстоит с права голоса для ночной смены: без неё собрание представляет лишь тех, кому удобно прийти вовремя."
 HSM_AQR_JFT_communes_pledge_effect:0 "Принять послереволюционную программу."
 HSM_AQR_JFT_communes_pledge_req_tt:0 "Победившее областное движение поддержало эту программу; другая программа не принята."
 HSM_AQR_JFT_communes_programme_tt:0 "Изменение национального духа «§Y$HSM_AQR_compact$§!»:\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+10.0%§!\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §G-5.0%§!"
 HSM_AQR_JFT_communes_ratify_again_req_tt:0 "Победившую программу можно утвердить; требуется 50 политической власти."
 HSM_AQR_JFT_communes_resume_req_tt:0 "Коммунары стремятся к самоуправлению за пределами Придеи и Аквелии. Их продолжению предстоит показать, как общая оборона сможет служить общинам, не становясь властью над ними."
 HSM_AQR_JFT_communes_settle:0 "Хлеб из общих запасов"
 HSM_AQR_JFT_communes_settle_desc:0 "Мир вернул мучные обозы ополчения в кварталы с совершенно разными нуждами. Одно собрание требует вернуть запасы, другое лишилось печей. Делегатам предстоит определить порядок общего снабжения, прежде чем предложить такое устройство коммунам всей Аквелии. Придея станет отправной точкой более широкой федерации, а это голодное утро — её первым практическим испытанием. Нужно решить, кто вправе распорядиться мукой до очередного собрания в каждом квартале."
 HSM_AQR_JFT_communes_settle_effect:0 "Будет созвано учредительное собрание. Утверждение требует §Y50§! политической власти и учреждает правительство с его программой."
 HSM_AQR_JFT_communes_settle_req_tt:0 "Выбранная программа может учредить правительство в мирное время или во время нашей войны за Аквелию."
 HSM_AQR_JFT_dennis_government_tt:0 "Правительство: Нейтралитет. Правитель: $JFT_baron_dennis_discret$. Поддержка правящей силы: §Y55%§!; остальных течений: по §Y15%§!. Общегосударственные выборы не назначаются."
 HSM_AQR_JFT_dennis_organise:0 "Старые товарищи морской пехоты"
 HSM_AQR_JFT_dennis_organise_desc:0 "Ветераны узнают Денниса раньше, чем портовая стража объявляет о его приходе. Одни служили в море, другие сражались рядом со вспомогательными частями пони при падении первой коммуны. Ему нужны их знание причалов и влияние на молодых моряков. Обращение к прежней верности вернёт и старые требования о жалованье и помощи раненым, и воспоминания, которые рабочие никогда не считали общей славой города."
 HSM_AQR_JFT_dennis_organise_effect:0 "Политическая власть: §G+35§!."
 HSM_AQR_JFT_dennis_organise_req_tt:0 "Эта программа выбрана, областное управление продолжает работу."
 HSM_AQR_JFT_dennis_party:0 "Лоялисты Денниса"
 HSM_AQR_JFT_dennis_pledge:0 "Не закрывать гавань"
 HSM_AQR_JFT_dennis_pledge_desc:0 "Боевые действия закончились, но судно с мукой всё ещё ждёт перед Придеей, пока капитан спорит с патрульным катером. Деннис знает капитана и больше подозревает задержку, чем груз. Он даст портовой страже инструкции для мирного времени. Его притязание на руководство Аквелией должно начаться с гавани, способной кормить жителей без очередного личного вмешательства адмирала. Придея станет проверкой того, что он предлагает всей стране."
 HSM_AQR_JFT_dennis_pledge_effect:0 "Принять послереволюционную программу."
 HSM_AQR_JFT_dennis_pledge_req_tt:0 "Победившее областное движение поддержало эту программу; другая программа не принята."
 HSM_AQR_JFT_dennis_programme_tt:0 "Изменение национального духа «§Y$HSM_AQR_compact$§!»:\n$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$: §G+15.0%§!\n$MODIFIER_SUPPLY_CONSUMPTION_FACTOR$: §G-5.0%§!"
 HSM_AQR_JFT_dennis_ratify_again_req_tt:0 "Победившую программу можно утвердить; требуется 50 политической власти."
 HSM_AQR_JFT_dennis_resume_req_tt:0 "Деннис Дискрет решил удержать Придею за монархией. Морская пехота, вспомогательные части пони и давние флотские связи укрепляют его власть, но не разрешают городских противоречий."
 HSM_AQR_JFT_dennis_settle:0 "Условия для верфей"
 HSM_AQR_JFT_dennis_settle_desc:0 "Каждую смену на верфь всё ещё сопровождает патруль. Деннис получает прошение мастеров, которые не могут ремонтировать суда по правилам осады. Его ветераны боятся потерять гавань, рабочие требуют вернуть обычные условия труда. Прежде чем выдвинуть притязание на руководство Аквелией, адмиралу предстоит решить, какие части его командования уместны в гражданском правительстве. Придея должна стать основанием общегосударственной программы, способной действовать далеко за пределами порта."
 HSM_AQR_JFT_dennis_settle_effect:0 "Будет созвано учредительное собрание. Утверждение требует §Y50§! политической власти и учреждает правительство с его программой."
 HSM_AQR_JFT_dennis_settle_req_tt:0 "Выбранная программа может учредить правительство в мирное время или во время нашей войны за Аквелию."
 HSM_AQR_JFT_enfants:0 "Директория Les Enfants Terribles"
 HSM_AQR_JFT_enfants_government_tt:0 "Правительство: Превосходство. Правитель: $HSM_AQR_JFT_enfants$. Поддержка правящей силы: §Y55%§!; остальных течений: по §Y15%§!. Общегосударственные выборы не назначаются."
 HSM_AQR_JFT_enfants_organise:0 "Проверить каждую поставку"
 HSM_AQR_JFT_enfants_organise_desc:0 "Поставку, потерянную во время боёв, удалось проследить до продажи по поддельному распоряжению на выдачу. Портовые организаторы приводят свидетеля и приносят второй экземпляр купеческой расписки. Бывшим подпольным ячейкам теперь придётся открыто сотрудничать, чтобы установить случившееся. Общее бюро снабжения проверит записи прежде, чем выдвигать обвинения. Управление начинается с умения отличать подозрение от доказательства, даже когда среди подозреваемых оказываются знакомые участники движения."
 HSM_AQR_JFT_enfants_organise_effect:0 "Политическая власть: §G+35§!."
 HSM_AQR_JFT_enfants_organise_req_tt:0 "Эта программа выбрана, областное управление продолжает работу."
 HSM_AQR_JFT_enfants_party:0 "Les Enfants Terribles"
 HSM_AQR_JFT_enfants_pledge:0 "Вывести ячейки из подполья"
 HSM_AQR_JFT_enfants_pledge_desc:0 "Двое бывших связных приходят с противоречивыми распоряжениями; под каждым стоит подпись, которой доверяли во время боёв. Победа привела ячейки в публичные учреждения, не определив, кто вправе говорить от имени движения. Организаторы сверят записи и установят ответственность, прежде чем представить программу для Аквелии. Военная тайна больше не может оправдывать приказы, которые никто не готов защитить лично перед товарищами и гражданскими представителями."
 HSM_AQR_JFT_enfants_pledge_effect:0 "Принять послереволюционную программу."
 HSM_AQR_JFT_enfants_pledge_req_tt:0 "Победившее областное движение поддержало эту программу; другая программа не принята."
 HSM_AQR_JFT_enfants_programme_tt:0 "Изменение национального духа «§Y$HSM_AQR_compact$§!»:\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$: §G+10.0%§!\n$MODIFIER_MOBILIZATION_SPEED$: §G+15.0%§!"
 HSM_AQR_JFT_enfants_ratify_again_req_tt:0 "Победившую программу можно утвердить; требуется 50 политической власти."
 HSM_AQR_JFT_enfants_resume_req_tt:0 "Les Enfants Terribles ставят на первое место силу Аквелии и выживание революции. Их национальная программа отличается и от федерации коммунаров, и от парламентской коалиции МАФ."
 HSM_AQR_JFT_enfants_settle:0 "Проверить дела военного времени"
 HSM_AQR_JFT_enfants_settle_desc:0 "Бои закончились, и группа безопасности приносит временному собранию дела военного времени. Один подозреваемый помог продать исчезнувший груз, другой лишь оспаривал распоряжения организатора. Их имена стоят на одной странице. Прежде чем предложить свою программу Аквелии, движению предстоит определить, кто вправе расследовать действия противников и какие доказательства отличают несогласие от предательства. Без ответа на этот вопрос список продолжит расти и после победы."
 HSM_AQR_JFT_enfants_settle_effect:0 "Будет созвано учредительное собрание. Утверждение требует §Y50§! политической власти и учреждает правительство с его программой."
 HSM_AQR_JFT_enfants_settle_req_tt:0 "Выбранная программа может учредить правительство в мирное время или во время нашей войны за Аквелию."
 HSM_AQR_JFT_fja:0 "Коалиционное правительство МАФ"
 HSM_AQR_JFT_fja_government_tt:0 "Правительство: Демократия / Гармония. Правитель: $HSM_AQR_JFT_fja$. Поддержка правящей силы: §Y55%§!; остальных течений: по §Y15%§!. Выборы разрешены."
 HSM_AQR_JFT_fja_organise:0 "Гражданские комитеты снабжения"
 HSM_AQR_JFT_fja_organise_desc:0 "Организатор ополчения требует муку, выделенную его отрядам во время боёв. Работница лечебницы спрашивает, почему после возвращения мира больница всё ещё должна ждать. Совместные гражданские комитеты пересмотрят военное распределение и опубликуют порядок снабжения, согласованный с кварталами. Их работа должна придать социальной программе коалиции убедительность, прежде чем та обратится за более широкими полномочиями в Аквелии. Оставленный у лечебницы мешок станет первым подтверждением обещаний."
 HSM_AQR_JFT_fja_organise_effect:0 "Политическая власть: §G+35§!."
 HSM_AQR_JFT_fja_organise_req_tt:0 "Эта программа выбрана, областное управление продолжает работу."
 HSM_AQR_JFT_fja_party:0 "Коалиция МАФ"
 HSM_AQR_JFT_fja_pledge:0 "Подтвердить лесное соглашение"
 HSM_AQR_JFT_fja_pledge_desc:0 "Первая открытая встреча после победы начинается с бумаги, которую прежде несли в лес. Никто не записал, кто сможет говорить от имени квартальных групп после чрезвычайных обстоятельств. МАФ и коммунарам предстоит обновить соглашение для обычной политической жизни. Предложению для Аквелии нужны представители, способные спорить открыто и при этом создавать общую парламентскую программу. Прежних тайных договорённостей для такой работы уже недостаточно."
 HSM_AQR_JFT_fja_pledge_effect:0 "Принять послереволюционную программу."
 HSM_AQR_JFT_fja_pledge_req_tt:0 "Победившее областное движение поддержало эту программу; другая программа не принята."
 HSM_AQR_JFT_fja_programme_tt:0 "Изменение национального духа «§Y$HSM_AQR_compact$§!»:\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §G+5.0%§!\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §G-5.0%§!"
 HSM_AQR_JFT_fja_ratify_again_req_tt:0 "Победившую программу можно утвердить; требуется 50 политической власти."
 HSM_AQR_JFT_fja_resume_req_tt:0 "Придейские сторонники МАФ и коммунары договорились отложить разногласия до победы. Теперь парламентской социальной республике предстоит обсудить вопросы, оставшиеся без ответа."
 HSM_AQR_JFT_fja_settle:0 "Временный коалиционный кабинет"
 HSM_AQR_JFT_fja_settle_desc:0 "Мир лишил смысла привычку откладывать каждое разногласие. Коммунары приносят предложения о советах на предприятиях; МАФ — избирательный календарь и программу социальных законов. Обоим нужно правительство, способное открыть заводы и снабжать больницы. Временному кабинету предстоит установить, как принимать решения сейчас и как избиратели смогут сменить его участников позднее. Срок следующего обсуждения должен означать подготовку к голосованию, а не очередную отсрочку."
 HSM_AQR_JFT_fja_settle_effect:0 "Будет созвано учредительное собрание. Утверждение требует §Y50§! политической власти и учреждает правительство с его программой."
 HSM_AQR_JFT_fja_settle_req_tt:0 "Выбранная программа может учредить правительство в мирное время или во время нашей войны за Аквелию."
 HSM_AQR_JRR_absolutist_government_tt:0 "Правительство: Нейтралитет. Правитель: $HSM_AQR_jeanne_discret$. Поддержка правящей силы: §Y55%§!; остальных течений: по §Y15%§!. Общегосударственные выборы не назначаются."
 HSM_AQR_JRR_absolutist_organise:0 "Офицеры отвечают перед двором"
 HSM_AQR_JRR_absolutist_organise_desc:0 "Победа оставила Жанне офицеров, ожидающих превращения военных договорённостей в постоянные привилегии. Она созовёт их, чтобы определить, какие обязанности принадлежат двору, а какие требуют военного решения. Прежде чем предложить такое устройство Аквелии, необходимо подчинить офицерские полномочия государственной власти. Замена одного военного покровителя другим оставила бы маркизу зависимой. Их заслуги получат признание, но не право распоряжаться каждой должностью в мирное время."
 HSM_AQR_JRR_absolutist_organise_effect:0 "Политическая власть: §G+35§!."
 HSM_AQR_JRR_absolutist_organise_req_tt:0 "Эта программа выбрана, областное управление продолжает работу."
 HSM_AQR_JRR_absolutist_party:0 "Двор Жанны"
 HSM_AQR_JRR_absolutist_pledge:0 "Собственная канцелярия маркизы"
 HSM_AQR_JRR_absolutist_pledge_desc:0 "Сельское прошение попало к Жанне после трёх посещений военных учреждений. Мост, о котором в нём говорится, по-прежнему разрушен. Маркиза намерена назначить собственных служащих и лично принять просителей. У двора появится работа, о результатах которой смогут судить за его стенами. Канцелярия должна научиться отвечать за исполнение обещаний: одной красивой подписи на письме для возвращения власти недостаточно."
 HSM_AQR_JRR_absolutist_pledge_effect:0 "Принять послереволюционную программу."
 HSM_AQR_JRR_absolutist_pledge_req_tt:0 "Победившее областное движение поддержало эту программу; другая программа не принята."
 HSM_AQR_JRR_absolutist_programme_tt:0 "Изменение национального духа «§Y$HSM_AQR_compact$§!»:\n$MODIFIER_POLITICAL_POWER_FACTOR$: §G+10.0%§!\n$MODIFIER_ARMY_ORG_FACTOR$: §G+5.0%§!"
 HSM_AQR_JRR_absolutist_ratify_again_req_tt:0 "Победившую программу можно утвердить; требуется 50 политической власти."
 HSM_AQR_JRR_absolutist_resume_req_tt:0 "Жанна выбрала союз с дворянством и верными офицерами против Колетт. Их поддержка поможет вернуть ей власть, но у самих союзников есть свои ожидания."
 HSM_AQR_JRR_absolutist_settle:0 "Клятвы земельных собраний"
 HSM_AQR_JRR_absolutist_settle_desc:0 "Боевые действия закончились, и дворяне напоминают об обещаниях, данных Жанне. Некоторые ждут назначений раньше, чем помощь получат пострадавшие деревни. Маркиза созовёт представителей, чтобы определить обязательства своего правительства. Весткипу предстоит показать, что её монархическое руководство способно предложить Аквелии помимо родового имени. Начать придётся с обязанностей, связывающих собственных сторонников двора. Претендовать на более широкое доверие можно лишь после исполнения обещаний дома."
 HSM_AQR_JRR_absolutist_settle_effect:0 "Будет созвано учредительное собрание. Утверждение требует §Y50§! политической власти и учреждает правительство с его программой."
 HSM_AQR_JRR_absolutist_settle_req_tt:0 "Выбранная программа может учредить правительство в мирное время или во время нашей войны за Аквелию."
 HSM_AQR_JRR_coalition_government_tt:0 "Правительство: Демократия / Гармония. Правитель: $HSM_AQR_jeanne_discret$. Поддержка правящей силы: §Y55%§!; остальных течений: по §Y15%§!. Выборы разрешены."
 HSM_AQR_JRR_coalition_organise:0 "Суд за пределами казармы"
 HSM_AQR_JRR_coalition_organise_desc:0 "Лавочнику всё ещё нужно разрешение офицера, чтобы оспорить реквизицию военного времени. Юристы коалиции предлагают слушание вне гарнизона, где свидетели смогут говорить без согласия прежнего коменданта. Жанна обеспечит право суда собраться. Союзники помогли одержать победу; теперь королевское правительство должно заслужить их дальнейшую поддержку, принимая жалобы на собственных офицеров. Независимость суда начнётся с дела, неудобного для тех, кто ещё недавно требовал верности."
 HSM_AQR_JRR_coalition_organise_effect:0 "Политическая власть: §G+35§!."
 HSM_AQR_JRR_coalition_organise_req_tt:0 "Эта программа выбрана, областное управление продолжает работу."
 HSM_AQR_JRR_coalition_party:0 "Гражданская коалиция Весткипа"
 HSM_AQR_JRR_coalition_pledge:0 "Опубликовать соглашение коалиции"
 HSM_AQR_JRR_coalition_pledge_desc:0 "Победа монархистов привела республиканских союзников Жанны обратно к печатникам с первоначальным соглашением. Они просят поставить обещание мест для городских представителей прежде подписей. Пересмотренный договор сохранит маркизу во главе королевской коалиции и даст городам постоянный голос. Публикация условий покажет Аквелии, что способен предложить этот необычный союз. Теперь партнёрам предстоит отвечать за общее устройство после победы, а не только за прежние обещания."
 HSM_AQR_JRR_coalition_pledge_effect:0 "Принять послереволюционную программу."
 HSM_AQR_JRR_coalition_pledge_req_tt:0 "Победившее областное движение поддержало эту программу; другая программа не принята."
 HSM_AQR_JRR_coalition_programme_tt:0 "Изменение национального духа «§Y$HSM_AQR_compact$§!»:\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10.0%§!\n$MODIFIER_SUPPLY_CONSUMPTION_FACTOR$: §G-5.0%§!"
 HSM_AQR_JRR_coalition_ratify_again_req_tt:0 "Победившую программу можно утвердить; требуется 50 политической власти."
 HSM_AQR_JRR_coalition_resume_req_tt:0 "Жанна обратилась к умеренным республиканцам за поддержкой против власти военных. Их коалиция поставила вопрос о будущем устройстве, но ещё не разрешила его."
 HSM_AQR_JRR_coalition_settle:0 "Гражданские полномочия"
 HSM_AQR_JRR_coalition_settle_desc:0 "Мир восстановлен, но разрешения на городские собрания по-прежнему подписывает комендант. Делегаты приносят Жанне напечатанный договор коалиции и спрашивают, кто будет подписывать их завтра. Соглашение должно подчинить гарнизоны гражданской власти, сохранив её монархическое руководство. Прежде чем предложить это устройство общему аквелийскому движению, необходимо показать, как город сможет оспорить законный приказ. Для этого ему не должно требоваться нового тайного союза против собственного правительства."
 HSM_AQR_JRR_coalition_settle_effect:0 "Будет созвано учредительное собрание. Утверждение требует §Y50§! политической власти и учреждает правительство с его программой."
 HSM_AQR_JRR_coalition_settle_req_tt:0 "Выбранная программа может учредить правительство в мирное время или во время нашей войны за Аквелию."
 HSM_AQR_JRR_colette_government_tt:0 "Правительство: Превосходство. Правитель: $JRR_colonel_colette_solide$. Поддержка правящей силы: §Y55%§!; остальных течений: по §Y15%§!. Общегосударственные выборы не назначаются."
 HSM_AQR_JRR_colette_organise:0 "Связь с рабочими"
 HSM_AQR_JRR_colette_organise_desc:0 "Бывшие подпольные делегаты теперь приносят требования через парадный вход штаба. Им нужны представительство и ответ о продолжительности труда тех, кто снабжает восстанавливающиеся города. Офицеры Колетт по-прежнему предпочитают сперва обсуждать военные поставки. Постоянное гражданское представительство должно обеспечить обсуждение обоих вопросов, прежде чем программа восстановления сможет рассчитывать на поддержку за пределами гарнизонов. Делегаты намерены записывать ответы и передавать их товарищам на предприятиях."
 HSM_AQR_JRR_colette_organise_effect:0 "Политическая власть: §G+35§!."
 HSM_AQR_JRR_colette_organise_req_tt:0 "Эта программа выбрана, областное управление продолжает работу."
 HSM_AQR_JRR_colette_party:0 "Военно-гражданская коалиция"
 HSM_AQR_JRR_colette_pledge:0 "Расписание после победы"
 HSM_AQR_JRR_colette_pledge_desc:0 "Железнодорожник возвращается в штаб Колетт с расписанием, использованным во время восстания. На обороте записаны обещания гражданским организаторам, поддерживавшим движение поездов. Теперь, после окончания боёв, он спрашивает, какие из них выполнят. Колетт соберёт офицеров и представителей железных дорог, чтобы превратить военное сотрудничество в предложение по восстановлению Аквелии. Рабочий ждёт ответа для товарищей, которым предстоит обслуживать те же пути в мирное время."
 HSM_AQR_JRR_colette_pledge_effect:0 "Принять послереволюционную программу."
 HSM_AQR_JRR_colette_pledge_req_tt:0 "Победившее областное движение поддержало эту программу; другая программа не принята."
 HSM_AQR_JRR_colette_programme_tt:0 "Изменение национального духа «§Y$HSM_AQR_compact$§!»:\n$MODIFIER_ARMY_ORG_FACTOR$: §G+10.0%§!\n$MODIFIER_MAX_PLANNING_FACTOR$: §G+15.0%§!"
 HSM_AQR_JRR_colette_ratify_again_req_tt:0 "Победившую программу можно утвердить; требуется 50 политической власти."
 HSM_AQR_JRR_colette_resume_req_tt:0 "Колетт сплотила революционную военную сеть и обратилась к левому подполью. Общий противник ещё не определяет, кому достанется власть после победы."
 HSM_AQR_JRR_colette_settle:0 "Единое оперативное командование"
 HSM_AQR_JRR_colette_settle_desc:0 "После восстановления мира штаб впервые получает требование отменить заводскую реквизицию. Интенданту Колетт по-прежнему нужны станки, а рабочие хотят возобновить обычное производство. Импровизированному военному командованию необходимо политическое соглашение, прежде чем стороны согласятся уступить. Делегаты собираются определить, какие полномочия останутся у офицеров, а какие перейдут гражданским участникам революции. Завод не должен простаивать лишь потому, что победители ещё не договорились, кто вправе открыть его ворота."
 HSM_AQR_JRR_colette_settle_effect:0 "Будет созвано учредительное собрание. Утверждение требует §Y50§! политической власти и учреждает правительство с его программой."
 HSM_AQR_JRR_colette_settle_req_tt:0 "Выбранная программа может учредить правительство в мирное время или во время нашей войны за Аквелию."
 HSM_AQR_KINGDOM_communism:0 "Королевство Аквелия"
 HSM_AQR_KINGDOM_communism_ADJ:0 "Аквелийск"
 HSM_AQR_KINGDOM_communism_DEF:0 "Королевство Аквелия"
 HSM_AQR_KINGDOM_democratic:0 "Королевство Аквелия"
 HSM_AQR_KINGDOM_democratic_ADJ:0 "Аквелийск"
 HSM_AQR_KINGDOM_democratic_DEF:0 "Королевство Аквелия"
 HSM_AQR_KINGDOM_fascism:0 "Королевство Аквелия"
 HSM_AQR_KINGDOM_fascism_ADJ:0 "Аквелийск"
 HSM_AQR_KINGDOM_fascism_DEF:0 "Королевство Аквелия"
 HSM_AQR_KINGDOM_neutrality:0 "Королевство Аквелия"
 HSM_AQR_KINGDOM_neutrality_ADJ:0 "Аквелийск"
 HSM_AQR_KINGDOM_neutrality_DEF:0 "Королевство Аквелия"
 HSM_AQR_LOCAL_JEB_f1:0 "Промерить подходы к Пелису"
 HSM_AQR_LOCAL_JEB_f1_desc:0 "Капитаны торговых судов Пелиса знают, какие знаки на подходах к гавани сместились и где после дождя в причале вязнет колесо телеги. Обычно их жалобы доходят до Рилы поодиночке. Землемеры отправятся вместе с лоцманами, отметят опасные места и принесут чертежи докерам: с палубы даже опытному моряку видны далеко не все изъяны портового хозяйства."
 HSM_AQR_LOCAL_JEB_f2:0 "Весы на ярмарочной площади"
 HSM_AQR_LOCAL_JEB_f2_desc:0 "Крестьянин привозит зерно на рильскую ярмарку и обнаруживает, что мера покупателя отличается от портовой. На обеих ёмкостях стоят внушительные печати. Проверяющие сравнят гири перед торговыми рядами и оставят смотрителю образцовый набор. О цене будут по-прежнему спорить до хрипоты, зато продавцу больше не придётся гадать, сколько зерна покупатель подразумевает под одним и тем же мешком."
 HSM_AQR_LOCAL_JEB_f3:0 "Смазка для складских винтовок"
 HSM_AQR_LOCAL_JEB_f3_desc:0 "Оружейник вскрывает ящик с винтовками, которые по описи считаются исправными. Солёный воздух добрался до замков, а упаковочная солома отсырела. Прибрежным складам Рилы нужна тщательная проверка, прежде чем очередную партию примут по одной лишь надписи. Подмастерья вместе с опытными мастерами очистят пригодное оружие и отделят исправные детали от тех, которым уже нельзя возвращаться в строй."
 HSM_AQR_LOCAL_JEB_f4:0 "Донесение вдоль побережья"
 HSM_AQR_LOCAL_JEB_f4_desc:0 "Учение на побережье начинается с простого задания: доставить запечатанное донесение и гружёную повозку к одному месту встречи. Посыльный прибывает первым и ждёт, пока возчик ищет проезжую дорогу. После учений офицеры пройдут весь путь вместе с обозниками. План снабжения, составленный в Риле, должен выдерживать дорогу за городскими воротами, где ровные линии карты превращаются в грязные колеи."
 HSM_AQR_LOCAL_JFT_f1:0 "Портовые часы"
 HSM_AQR_LOCAL_JFT_f1_desc:0 "Рыбные телеги и зерновые подводы Придеи встречаются под одними портовыми часами, хотя их владельцы словно живут в разном времени. Лоцманы знают, когда судно сможет войти в залив, а носильщики — когда его груз нужен на рынке. Общее расписание избавит город от утра, когда у переполненного причала стоят пустые корзины, а покупатели напрасно ждут торговцев."
 HSM_AQR_LOCAL_JFT_f2:0 "От причала до зернохранилища"
 HSM_AQR_LOCAL_JFT_f2_desc:0 "Дорога между причалами Придеи и окрестными зернохранилищами важнее, чем можно заключить по портовой карте. После каждого ливня повреждённый водосток задерживает подводы, а моряки продолжают выгружать мешки, которые некуда везти. Дорожные рабочие начнут с этого переезда и пойдут дальше вместе с возчиками: те хорошо знают, где увязнет следующее колесо и какой объезд выдержит тяжёлый груз."
 HSM_AQR_LOCAL_JFT_f3:0 "Соль на оружейных стойках"
 HSM_AQR_LOCAL_JFT_f3_desc:0 "Морской воздух проникает в портовые оружейные склады так же легко, как добирается до корабельного такелажа. Оружейники собрали пригодные стволы под крышей, давно переставшей защищать их от сырости. Починив стойки и подобрав недостающие детали, они вернут забытое оружие на своё место. Тогда снабженцу не придётся вскрывать каждый проржавевший ящик, чтобы собрать нужную партию винтовок."
 HSM_AQR_LOCAL_JFT_f4:0 "Достаточно широкий трап"
 HSM_AQR_LOCAL_JFT_f4_desc:0 "На портовых учениях носильщики с ранеными застряли за тележками с боеприпасами у самого узкого трапа. В Придее хватает моряков, понимающих суда, и солдат, умеющих маршировать, но переход с берега на палубу требует согласованной работы. Совместная погрузка покажет каждому расчёту, где следует оставить свободный проход, прежде чем через него придётся нести кого-нибудь под обстрелом."
 HSM_AQR_LOCAL_JRR_f1:0 "Дорожная книга марки"
 HSM_AQR_LOCAL_JRR_f1_desc:0 "В военных конторах Весткипа хранятся подробные карты подступов к казармам, однако сельский возчик по-прежнему узнаёт о разрушенном водостоке, провалившись в него колесом. Дорожные смотрители и почтовые служащие составят общую книгу переправ, ремонтных запасов и надёжных мест для ночлега. Для обычной поездки через марку нужен путь, который существует не только на полевой карте очередного офицера."
 HSM_AQR_LOCAL_JRR_f2:0 "Проезд для почтовой повозки"
 HSM_AQR_LOCAL_JRR_f2_desc:0 "Военный фургон найдёт помощников в ближайшем гарнизоне. У повозки с письмами, лекарствами и запасными мельничными жерновами такой привилегии нет. Дорожные артели марки починят узкие переезды и обозначат места, где тяжёлым обозам следует уступать дорогу. Торговцы и сельские возчики смогут соразмерять поездки с временем года, а не с затором, который вчера оставила за собой чужая колонна."
 HSM_AQR_LOCAL_JRR_f3:0 "Что могут починить оружейники"
 HSM_AQR_LOCAL_JRR_f3_desc:0 "В арсеналах марки лежат винтовки, на ярлыках которых прежние владельцы указаны точнее, чем подходящие патроны. Оружейники отделят пригодное оружие от лома и соберут разбросанные запасные части на рабочих верстаках. Для этого нужны терпение, мерные инструменты и честная опись. Гарнизоны получат исправное снаряжение, а следующему начальнику склада не придётся обнаруживать, что из только что доставленного оружия невозможно стрелять."
 HSM_AQR_LOCAL_JRR_f4:0 "Обоз должен дойти до поля"
 HSM_AQR_LOCAL_JRR_f4_desc:0 "Весткип готовил офицеров для войн далеко за пределами своих деревень, однако безупречное занятие над картой не заменяет гружёную повозку на размытой дороге. Военные инструкторы выведут в поле писарей, возчиков и связных вместе. Им предстоит доставить учебный груз, сообщить о его прибытии и выяснить, какие кабинетные расчёты не выдержали настоящего пути между складом и местом назначения."
 HSM_AQR_LOCAL_VIN_f1:0 "Телеги до рассвета"
 HSM_AQR_LOCAL_VIN_f1_desc:0 "До открытия кафе телеги с мукой, овощами и лесом протискиваются мимо виновийских торговых рядов. Забитая водосточная труба способна задержать подвоз для половины округа. Дорожные смотрители знают, какие участки первыми становятся непроходимыми, но прежде их никогда не собирали вместе. Общий порядок ремонта позволит утреннему рынку открываться вовремя, прежде чем торговцы опять начнут спорить из-за опоздавшего товара."
 HSM_AQR_LOCAL_VIN_f2:0 "Оба названия улицы"
 HSM_AQR_LOCAL_VIN_f2_desc:0 "Письмо приезжего обошло весь город: указанная на конверте улица носит одно название в официальных книгах и другое в повседневной речи виновийцев. Почтмейстеры, повитухи и рыночные писари сопоставят названия, которыми действительно пользуются. Справочник с их поправками поможет посыльному найти нужную дверь, даже если поблизости не окажется никого, кто мог бы объяснить ему местное название переулка."
 HSM_AQR_LOCAL_VIN_f3:0 "Общий верстак оружейников"
 HSM_AQR_LOCAL_VIN_f3_desc:0 "Виновийские оружейники получают старое оружие так же часто, как их заказчики наследуют семейные предания. Рядом с винтовкой без пружины лежит другая, у которой уцелел только приклад. Гарнизонный мастер предлагает собрать ремонтопригодные детали из частных мастерских за общим верстаком. Опытные когти смогут вернуть оружие в строй, пока очередная новая партия ещё находится где-то в пути."
 HSM_AQR_LOCAL_VIN_f4:0 "Телега пройдёт в любые ворота"
 HSM_AQR_LOCAL_VIN_f4_desc:0 "Обозная телега проходит в казарменные ворота, но застревает под аркой деревенского амбара. Виновийские квартирмейстеры пройдут свои маршруты вместе с возчиками, которые наизусть помнят каждое препятствие. Учебная погрузка у настоящих мостов и складов выявит ошибки заранее, пока рассыпанный мешок означает лишь неловкость перед товарищами, а не потерю единственного ужина для целой роты, ожидающей подвоза вдали от казарм."
 HSM_AQR_REC_accession_tt:0 "Передать принадлежащие нам территории и вооружённые силы приглашающему аквелийскому правительству. Наша отдельная страна и игровая кампания прекратятся. Согласие действует лишь при сохранении условий приглашения обоими правительствами; чужие субъекты и иностранная оккупация исключены."
 HSM_AQR_REC_articles_req_tt:0 "Независимая Аквелия находится в мире и контролирует столицу; конференция окраин состоялась."
 HSM_AQR_REC_articles_tt:0 "Получить национальные территории только на первоначальных землях Помоварры, Фловены, Грайфвальда, Фезеры и Северных племён, принадлежащих нам и полностью контролируемых. Статьи распространяются и на последующие приобретения после восстановления мира и полного контроля. Чужие территории не передаются, субъекты автоматически не присоединяются."
 HSM_AQR_REC_claim_tt:0 "Получить цель войны на аннексию против правительства, отказавшегося от этого приглашения. Требуются мир, его независимость и отсутствие общего альянса, пакта о ненападении, перемирия и нашей гарантии. Война не объявляется."
 HSM_AQR_REC_conference_req_tt:0 "Независимая Аквелия находится в мире, владеет своим первоначальным ядром и четырьмя провинциями и полностью контролирует их. Чрезвычайное восстановление завершено. Областной претендент должен также завершить государственное устройство; сама Аквелия — начальный политический курс и революцию."
 HSM_AQR_REC_conference_tt:0 "Пригласить Помоварру, Фловену, Грайфвальд, Фезеру и Северные племена войти в единое государство. Каждое правительство вправе свободно отказаться. Приглашения не направляются воюющим странам, чужим субъектам и участникам чужих альянсов, правительствам с собственными субъектами и странам со спорным контролем территорий. Срок предложения — 60 дней."
 HSM_AQR_REC_crisis:0 "Миру негде жить"
 HSM_AQR_REC_crisis_desc:0 "Прокламацию прочли в городах, где крыши, продовольственные ведомости и мастерские были уничтожены задолго до приезда делегатов. Победа возложила их восстановление на одно правительство."
 HSM_AQR_REC_demobilisation:0 "Военные билеты и ключи от мастерских"
 HSM_AQR_REC_demobilisation_desc:0 "Приказы об увольнении должны сопровождаться признанными послужными списками и адресом для возвращения к гражданской работе. Армия сохранит подготовленный резерв; города получат своих мастеров, не ожидая удобного для каждого полковника срока."
 HSM_AQR_REC_demobilisation_req_tt:0 "Предыдущий этап восстановления завершён. Независимая Аквелия контролирует столицу и находится в мире. Кризис восстановления продолжается; требуется 50 политической власти."
 HSM_AQR_REC_food_networks:0 "Хлеб по расписанию"
 HSM_AQR_REC_food_networks_desc:0 "Урожай должен перевозиться по договорам, которые переживут очередной приказ о реквизиции. Торговые города, мельницы и железнодорожные конторы согласуют дни поставок и обязанности по хранению. Пустые вагоны больше не должны покидать полные амбары, пока соседний округ стоит в очереди за хлебом."
 HSM_AQR_REC_food_networks_req_tt:0 "Предыдущий этап восстановления завершён. Независимая Аквелия контролирует столицу и находится в мире. Кризис восстановления продолжается; требуется 50 политической власти."
 HSM_AQR_REC_peripheral_articles:0 "Права, внесённые в реестр"
 HSM_AQR_REC_peripheral_articles_desc:0 "Статьи о присоединении должны пережить торжественное чтение. Суды признают муниципальные записи, чиновники сверят послужные списки, а казна опубликует одинаковые обязательства для старых провинций и новых округов. Линия на министерской карте не даёт власти над городом, которым правительство в действительности не управляет."
 HSM_AQR_REC_peripheral_conference:0 "Места для окраин"
 HSM_AQR_REC_peripheral_conference_desc:0 "Соседи наблюдали, как новое правительство восстанавливает собственные города. Они вправе спросить, защитят ли основополагающие статьи и их города. Конференция определит суды и местные учреждения, сохраняемые при присоединении, и общегосударственную власть, которую признает подпись. Пустое кресло не будет считаться согласием."
 HSM_AQR_REC_postwar_housing:0 "Крыша для возвращающихся"
 HSM_AQR_REC_postwar_housing_desc:0 "Муниципальные землемеры отделят разрушенные дома от бесхозных участков. Дерево и кирпич прежде всего направят туда, где семьи смогут укрыться до зимы. В реестре отметят тех, кто получил помощь, и тех, кто ещё ждёт."
 HSM_AQR_REC_postwar_housing_req_tt:0 "Областной претендент создал общую гражданскую службу, либо Аквелия завершила начальный политический курс и революция окончилась. Независимая Аквелия контролирует столицу и находится в мире. Кризис восстановления продолжается; требуется 75 политической власти."
 HSM_AQR_REC_recall_conference:0 "Возобновить конференцию окраин"
 HSM_AQR_REC_recall_conference_desc:0 "Некоторые кресла пустовали, пока соседние правительства вели свои войны или не могли отвечать за собственные земли. Другие приглашения истекли, так и не получив ответа. Канцелярия направит статьи, когда эти препятствия исчезнут. Полученные ответы сохранятся в протоколе: новое заседание не отменяет отказа соседа."
 HSM_AQR_REC_recall_req_tt:0 "Объединённое аквелийское правительство независимо, находится в мире и контролирует столицу; конференция состоялась. У хотя бы одного подходящего правительства окраин нет действующего приглашения и оно не отказывало нам. Приглашение без ответа можно повторить через 60 дней. Получатель должен находиться в мире, быть независимым либо нашим субъектом, не состоять в чужом альянсе, не иметь субъектов и полностью контролировать принадлежащие ему земли."
 HSM_AQR_REC_returning_workers:0 "Работники без поставок"
 HSM_AQR_REC_returning_workers_desc:0 "Демобилизация вернула работников в мастерские. Их первая зарплата мало что изменит, пока продовольствие не начнёт регулярно поступать в города."
 HSM_AQR_REC_roofs:0 "Кров до наступления зимы"
 HSM_AQR_REC_roofs_desc:0 "У семей снова есть место для ночлега. Мастерским по-прежнему не хватает работников, а слишком многие солдаты ждут приказов, которые уже не придут."
 HSM_AQR_RESTORE_open_tt:0 "Собрание рассмотрит возвращение исходного общегосударственного движения или сохранение нашего аквелийского правительства. Само обсуждение не передаёт власть."
 HSM_AQR_RESTORE_req_tt:0 "Независимая Аквелия в мире; прежний центр прекратил существование. Нам доступен живой лидер победившего общегосударственного движения. Столица принадлежит нам и полностью контролируется; у нас остаётся другая область."
 HSM_AQR_RESTORE_transfer_tt:0 "Продолжить игру за Аквелию с её оригинальным политическим деревом. Все наши территории и вооружённые силы войдут в её состав. Общегосударственное движение сохранит собственное престолонаследие или республиканскую политическую борьбу; наше областное правительство прекратит существование. Чужие территории и персонажи не передаются."
 HSM_AQR_VIN_abc:0 "Гражданский совет ABC"
 HSM_AQR_VIN_abc_government_tt:0 "Правительство: Коммунизм. Правитель: $HSM_AQR_VIN_abc$. Поддержка правящей силы: §Y55%§!; остальных течений: по §Y15%§!. Общегосударственные выборы не назначаются."
 HSM_AQR_VIN_abc_organise:0 "Школы за пределами городов"
 HSM_AQR_VIN_abc_organise_desc:0 "Книги прибыли, но дождь протекает сквозь крышу деревенской школы. Добровольцы ABC, рассчитывавшие вести занятия, отправляются искать лестницы. Их доводы в пользу нового общественного устройства выслушают охотнее, если они вернутся закончить работу. Другие провинции будут судить о программе по тому, чему здесь учатся дети, а не по обещанию на плакате, прибитом у самой школьной двери."
 HSM_AQR_VIN_abc_organise_effect:0 "Политическая власть: §G+35§!."
 HSM_AQR_VIN_abc_organise_req_tt:0 "Эта программа выбрана, областное управление продолжает работу."
 HSM_AQR_VIN_abc_party:0 "Друзья ABC"
 HSM_AQR_VIN_abc_pledge:0 "Связать университет и мастерскую"
 HSM_AQR_VIN_abc_pledge_desc:0 "На первом собрании после победы оратор ABC объяснял будущее рабочим, спрашивавшим о завтрашнем заработке. На следующей встрече первыми выступят они. Студентам необходимо понять, чего требует управление Виновией, прежде чем предлагать Аквелии последовать их примеру. Хозяева могут многому их научить, начиная с устройства мастерской, владелец которой исчез и оставил людей без ответа о жалованье."
 HSM_AQR_VIN_abc_pledge_effect:0 "Принять послереволюционную программу."
 HSM_AQR_VIN_abc_pledge_req_tt:0 "Победившее областное движение поддержало эту программу; другая программа не принята."
 HSM_AQR_VIN_abc_programme_tt:0 "Изменение национального духа «§Y$HSM_AQR_compact$§!»:\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §G+10.0%§!\n$MODIFIER_MOBILIZATION_SPEED$: §G+10.0%§!"
 HSM_AQR_VIN_abc_ratify_again_req_tt:0 "Победившую программу можно утвердить; требуется 50 политической власти."
 HSM_AQR_VIN_abc_resume_req_tt:0 "Выберите программу ABC отдельным решением. Её утверждение требует победы революционного лагеря Виновии и возвращения мира."
 HSM_AQR_VIN_abc_settle:0 "Избрать местные советы"
 HSM_AQR_VIN_abc_settle_desc:0 "Соседи, переносившие донесения во время боёв, теперь приходят на собрание ABC со своими предложениями. Они хотят участвовать в формировании правительства. Советы, опирающиеся на эти улицы и деревни, могут дать движению программу, достойную обсуждения по всей Аквелии. Студентам следует начать с принятия поправок от людей, которые никогда не сидели рядом с ними в университетской аудитории."
 HSM_AQR_VIN_abc_settle_effect:0 "Будет созвано учредительное собрание. Утверждение требует §Y50§! политической власти и учреждает правительство с его программой."
 HSM_AQR_VIN_abc_settle_req_tt:0 "Выбранная программа может учредить правительство в мирное время или во время нашей войны за Аквелию."
 HSM_AQR_VIN_chevaliers:0 "Виновийский совет общин"
 HSM_AQR_VIN_chevaliers_government_tt:0 "Правительство: Нейтралитет. Правитель: $HSM_AQR_VIN_chevaliers$. Поддержка правящей силы: §Y55%§!; остальных течений: по §Y15%§!. Общегосударственные выборы не назначаются."
 HSM_AQR_VIN_chevaliers_organise:0 "Поддержать общинную помощь"
 HSM_AQR_VIN_chevaliers_organise_desc:0 "Рыцарь верности, помогающий в столовой, знакомится с семьёй переселенцев из другой провинции. Рассказ о разрушенной школе оказывается болезненно знакомым. Движение научилось защищать виновийские учреждения и способно признать ценность чужих. Следующий сбор помощи охватит и новоприбывших, дав организаторам конкретный ответ на вопрос, что они готовы сделать для остальной Аквелии и почему забота не должна заканчиваться у знакомых улиц."
 HSM_AQR_VIN_chevaliers_organise_effect:0 "Политическая власть: §G+35§!."
 HSM_AQR_VIN_chevaliers_organise_req_tt:0 "Эта программа выбрана, областное управление продолжает работу."
 HSM_AQR_VIN_chevaliers_party:0 "Рыцари верности"
 HSM_AQR_VIN_chevaliers_pledge:0 "Собрать местную гвардию"
 HSM_AQR_VIN_chevaliers_pledge_desc:0 "Добровольцы рыцарей верности вернулись с боёв с винтовками и противоречивыми приказами. Лавочница спрашивает, какой капитан может отдать ей ключ от реквизированного склада. Прежде чем представлять Виновию на общих переговорах, движению предстоит ответить ей. Гвардейцы должны защищать повседневную жизнь, которую прославляют их знамёна, и понимать, когда соседке больше не требуется разрешение солдата, чтобы открыть собственную дверь."
 HSM_AQR_VIN_chevaliers_pledge_effect:0 "Принять послереволюционную программу."
 HSM_AQR_VIN_chevaliers_pledge_req_tt:0 "Победившее областное движение поддержало эту программу; другая программа не принята."
 HSM_AQR_VIN_chevaliers_programme_tt:0 "Изменение национального духа «§Y$HSM_AQR_compact$§!»:\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+10.0%§!\n$MODIFIER_ARMY_ORG_FACTOR$: §G+5.0%§!"
 HSM_AQR_VIN_chevaliers_ratify_again_req_tt:0 "Победившую программу можно утвердить; требуется 50 политической власти."
 HSM_AQR_VIN_chevaliers_resume_req_tt:0 "Выберите программу виновийского самоуправления рыцарей верности. Её утверждение требует победы революции и мира, несмотря на консервативные взгляды движения."
 HSM_AQR_VIN_chevaliers_settle:0 "Подготовить федеративную программу"
 HSM_AQR_VIN_chevaliers_settle_desc:0 "Делегаты рыцарей верности кладут проект виновийской хартии рядом с письмами из других провинций. Соседи спрашивают, могут ли её гарантии действовать за пределами их родины. Федеративная программа для Аквелии потребует от движения принять обязанности вместе с правами. Сначала они сделают собственное областное правительство подотчётным, затем найдут партнёров, готовых предоставить друг другу такую же защиту."
 HSM_AQR_VIN_chevaliers_settle_effect:0 "Будет созвано учредительное собрание. Утверждение требует §Y50§! политической власти и учреждает правительство с его программой."
 HSM_AQR_VIN_chevaliers_settle_req_tt:0 "Выбранная программа может учредить правительство в мирное время или во время нашей войны за Аквелию."
 HSM_AQR_VIN_gadiffer_government_tt:0 "Правительство: Нейтралитет. Правитель: $VIN_duke_gadiffer_discret$. Поддержка правящей силы: §Y55%§!; остальных течений: по §Y15%§!. Общегосударственные выборы не назначаются."
 HSM_AQR_VIN_gadiffer_organise:0 "Встретиться с местными обществами"
 HSM_AQR_VIN_gadiffer_organise_desc:0 "Общество, которое прежде называли революционным кружком, не закрывало столовую на протяжении боёв. Его распорядительница приходит во дворец Гадиффера с неоплаченными счетами. Герцог выслушает её прежде чиновника, составившего донос. Если Виновия хочет убедительно говорить об общем устройстве королевства, её правительство должно знать, чьим трудом держались общины в те дни, когда обещаний помощи было особенно много."
 HSM_AQR_VIN_gadiffer_organise_effect:0 "Политическая власть: §G+35§!."
 HSM_AQR_VIN_gadiffer_organise_req_tt:0 "Эта программа выбрана, областное управление продолжает работу."
 HSM_AQR_VIN_gadiffer_party:0 "Двор Гадиффера"
 HSM_AQR_VIN_gadiffer_pledge:0 "Облегчить тяготы"
 HSM_AQR_VIN_gadiffer_pledge_desc:0 "Бои закончились, но экипаж Гадиффера по-прежнему проезжает мимо очереди за хлебом, где никто не приветствует герцогские цвета. Мельник уже отправил три письма о мосте, повреждённом во время волнений. Герцог требует принести четвёртое прямо ему. Возвращение доверия к короне начинается с доставки муки, а не с очередного призыва к терпению семей, которым сегодня снова нечем ужинать."
 HSM_AQR_VIN_gadiffer_pledge_effect:0 "Принять послереволюционную программу."
 HSM_AQR_VIN_gadiffer_pledge_req_tt:0 "Победившее областное движение поддержало эту программу; другая программа не принята."
 HSM_AQR_VIN_gadiffer_programme_tt:0 "Изменение национального духа «§Y$HSM_AQR_compact$§!»:\n$MODIFIER_LOCAL_RESOURCES_FACTOR$: §G+10.0%§!\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10.0%§!"
 HSM_AQR_VIN_gadiffer_ratify_again_req_tt:0 "Победившую программу можно утвердить; требуется 50 политической власти."
 HSM_AQR_VIN_gadiffer_resume_req_tt:0 "Выберите лоялистскую программу Гадиффера. Её утверждение требует победы монархистов и мира в Виновии."
 HSM_AQR_VIN_gadiffer_settle:0 "Установить предел реквизиций"
 HSM_AQR_VIN_gadiffer_settle_desc:0 "Победа роялистов не закрыла деревенские счета. Обозы по-прежнему привозят требования, составленные для армий, которым уже незачем выступать в поход. Гадиффер представит расписки советникам и определит, как Виновии отвечать на будущие запросы. Он намерен служить короне Дискретов, управляя провинцией, способной исполнять обещания, а не истощать её обязательствами, которые невозможно выполнить даже после возвращения мира."
 HSM_AQR_VIN_gadiffer_settle_effect:0 "Будет созвано учредительное собрание. Утверждение требует §Y50§! политической власти и учреждает правительство с его программой."
 HSM_AQR_VIN_gadiffer_settle_req_tt:0 "Выбранная программа может учредить правительство в мирное время или во время нашей войны за Аквелию."
 HSM_AQR_VIN_sis:0 "Совет права и образования"
 HSM_AQR_VIN_sis_government_tt:0 "Правительство: Демократия / Гармония. Правитель: $HSM_AQR_VIN_sis$. Поддержка правящей силы: §Y55%§!; остальных течений: по §Y15%§!. Выборы разрешены."
 HSM_AQR_VIN_sis_organise:0 "Защитить независимую печать"
 HSM_AQR_VIN_sis_organise_desc:0 "Редактор, прежде печатавший доводы общества, теперь публикует жалобу на одного из его организаторов. Некоторые коллеги требуют убрать статью. Другие напоминают, что после победы их слова обрели достаточно силы, чтобы заставить критика замолчать. Вклад Виновии в общее республиканское дело должен начаться с газеты, свободной ставить в неудобное положение именно тех, кто обещал её защищать."
 HSM_AQR_VIN_sis_organise_effect:0 "Политическая власть: §G+35§!."
 HSM_AQR_VIN_sis_organise_req_tt:0 "Эта программа выбрана, областное управление продолжает работу."
 HSM_AQR_VIN_sis_party:0 "Общество студентов-интеллектуалов"
 HSM_AQR_VIN_sis_pledge:0 "Собрать юристов и преподавателей"
 HSM_AQR_VIN_sis_pledge_desc:0 "После окончания боёв вновь приходят письма бывших студентов. Одно рассказывает о суде без архивов, другое — о школе, куда не вернулся учитель. Общество соберёт авторов, чтобы вместе разобраться с этими трудностями. Общей республике нужны от Виновии не только сочувственные речи, но и люди, способные придать её обещаниям смысл в обычных учреждениях, куда жители приходят каждый день."
 HSM_AQR_VIN_sis_pledge_effect:0 "Принять послереволюционную программу."
 HSM_AQR_VIN_sis_pledge_req_tt:0 "Победившее областное движение поддержало эту программу; другая программа не принята."
 HSM_AQR_VIN_sis_programme_tt:0 "Изменение национального духа «§Y$HSM_AQR_compact$§!»:\n$MODIFIER_POLITICAL_POWER_FACTOR$: §G+10.0%§!\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §G+5.0%§!"
 HSM_AQR_VIN_sis_ratify_again_req_tt:0 "Победившую программу можно утвердить; требуется 50 политической власти."
 HSM_AQR_VIN_sis_resume_req_tt:0 "Выберите республиканскую программу Общества студентов-интеллектуалов. Её утверждение требует победы революционного лагеря Виновии и возвращения мира."
 HSM_AQR_VIN_sis_settle:0 "Подготовить гражданское управление"
 HSM_AQR_VIN_sis_settle_desc:0 "Участники общества приходят в областные учреждения с проектами, исправленными за первые мирные недели. Писари спрашивают, как эти обещания изменят судьбу прошений, уже лежащих на столах. Ответ даст Виновии полезный опыт для участия в общей республиканской политике. Общество намерено поддержать это дело работающим управлением и чиновниками, готовыми признать ошибку перед гражданином, который пришёл добиваться справедливости."
 HSM_AQR_VIN_sis_settle_effect:0 "Будет созвано учредительное собрание. Утверждение требует §Y50§! политической власти и учреждает правительство с его программой."
 HSM_AQR_VIN_sis_settle_req_tt:0 "Выбранная программа может учредить правительство в мирное время или во время нашей войны за Аквелию."
 HSM_AQR_affairs:0 "Дела провинции"
 HSM_AQR_affairs_desc:0 "Собрание может вернуться к незавершённым государственным делам. Исход революции и отношения провинции со столицей определяют, какие программы ещё могут быть осуществлены."
 HSM_AQR_border:0 "Пограничные статьи"
 HSM_AQR_border_desc:0 "Гражданство нельзя передать, передвинув линию на штабной карте. Судам, школам и муниципальным советам необходимо знать, по какому закону они будут жить завтра. Пограничные делегаты подпишут статьи лишь после определения своего места в новом устройстве."
 HSM_AQR_border_req_tt:0 "Мир; зависимое герцландское правительство существует; хотя бы одна из четырёх пограничных областей принадлежит нам и полностью контролируется."
 HSM_AQR_border_tt:0 "Пограничные делегаты представят отчёт о новых статьях гражданства."
 HSM_AQR_break_resistance:0 "Осуществить общегосударственное притязание"
 HSM_AQR_break_resistance_desc:0 "Собрание рассмотрит доводы в пользу принуждения. Сторонники такого шага должны назвать правительство, которое собираются устранить, и объяснить, какие гарантии останутся у его подданных. Общегосударственная печать не оправдывает безымянную и бесконечную войну."
 HSM_AQR_break_resistance_tt:0 "Получить цели войны на аннексию независимых Рилы, Весткипа, Придеи или Виновии, отказавшихся присоединиться. Цели не выдаются против союзников и стран, с которыми действует пакт или перемирие. Война не объявляется автоматически."
 HSM_AQR_campaign_national_req_tt:0 "Наше правительство провозгласило Аквелию и контролирует её столицу."
 HSM_AQR_campaign_req_tt:0 "Наше утверждённое областное правительство сохраняет власть."
 HSM_AQR_common_market:0 "Дороги к еженедельной ярмарке"
 HSM_AQR_common_market_bonus_tt:0 "Изменение национального духа «§Y$HSM_AQR_compact$§!»:\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10.0%§!"
 HSM_AQR_common_market_desc:0 "В каждом округе знают мост, существующий только в министерских отчётах. Землемеры проедут по настоящим дорогам, распределят обязанности по ремонту и вновь свяжут мастерские с городами, которым нужны их изделия."
 HSM_AQR_compact:0 "Провинциальное устройство"
 HSM_AQR_compact_desc:0 "Основополагающая программа и учреждения, созданные после революции, определяют облик государства."
 HSM_AQR_constitution_a_tt:0 "Изменение национального духа «§Y$HSM_AQR_compact$§!»:\n$MODIFIER_STABILITY_FACTOR$: §G+5.0%§!\n$MODIFIER_POLITICAL_POWER_FACTOR$: §G+10.0%§!"
 HSM_AQR_constitution_b_tt:0 "Изменение национального духа «§Y$HSM_AQR_compact$§!»:\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+10.0%§!\n$MODIFIER_ARMY_ORG_FACTOR$: §G+5.0%§!\n$MODIFIER_STABILITY_FACTOR$: §R-5.0%§!"
 HSM_AQR_continue_centre_tt:0 "Продолжить игру за Аквелию. Наши территории и вооружённые силы войдут в её состав; её действующее руководство, политический курс и пройденные национальные фокусы сохранятся."
 HSM_AQR_defer:0 "Соберёмся вновь, когда казна будет готова."
 HSM_AQR_foundation_req_tt:0 "Областное управление продолжает работу."
 HSM_AQR_herzland_guarantees:0 "Договор с собственной подписью"
 HSM_AQR_herzland_guarantees_desc:0 "Герцландские министры получат собственное представительство на договорной конференции. Соглашение должно назвать обязательства перед Аквелией и встречные обязанности самой Аквелии. Без второй колонки зависимое правительство останется оккупационной канцелярией с другой вывеской."
 HSM_AQR_invite_regions:0 "Статьи для остальных провинций"
 HSM_AQR_invite_regions_desc:0 "В приглашении изложены те же статьи, которыми мы ограничили собственное областное правительство. Послам предстоит объяснить, что останется на местах, что перейдёт общему управлению и кто рассмотрит жалобу, если договор нарушат."
 HSM_AQR_invite_tt:0 "Направить предложения о присоединении другим независимым областям и нашим областным субъектам, находящимся в мире. Согласие передаст их территории и вооружённые силы; отказ допускает отдельный политический ответ."
 HSM_AQR_jeanne_discret:0 "Маркиза Жанна Дискре"
 HSM_AQR_local_credit:0 "Кредит без покровителей"
 HSM_AQR_local_credit_desc:0 "Неурожай не должен решать, какая семья будет владеть деревней при следующем поколении. Местные кредитные учреждения проверят счета и откроют восстановительные ссуды тем, у кого нет знакомых при дворе."
 HSM_AQR_merge_centre_tt:0 "Войти в состав Аквелии вместе с нашими территориями и вооружёнными силами. Её нынешнее руководство и общегосударственная кампания сохранятся."
 HSM_AQR_national_army:0 "Общие офицерские патенты"
 HSM_AQR_national_army_bonus_tt:0 "Изменение национального духа «§Y$HSM_AQR_compact$§!»:\n$MODIFIER_ARMY_ORG_FACTOR$: §G+5.0%§!\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+5.0%§!"
 HSM_AQR_national_army_desc:0 "Полк должен получать приказы по цепи подчинения, существующей на бумаге, а не только в памяти полковника. Областные ветераны сохранят послужные списки; их офицерам предстоит принять общую систему подготовки и снабжения."
 HSM_AQR_national_mandate:0 "Кто говорит от имени Аквелии?"
 HSM_AQR_national_mandate_desc:0 "Отношения со столицей разорваны. Областные делегаты утверждают, что государство следует восстановить на основе их соглашения. Такому притязанию мало громкой прокламации: необходимо объяснить, почему прежнее правительство утратило право повелевать."
 HSM_AQR_national_recovery:0 "Вновь открыть мастерские"
 HSM_AQR_national_recovery_desc:0 "Казна опубликует перечень мастерских, получивших восстановительный кредит, и основания выдачи ссуд. Министр, способный показать открытый цех или отремонтированную мельницу, ответит деревням убедительнее, чем очередной победной речью."
 HSM_AQR_national_req_tt:0 "Наше областное правительство провозгласило Аквелию и сохраняет независимость."
 HSM_AQR_national_schools:0 "Следующее поколение учителей"
 HSM_AQR_national_schools_desc:0 "Первые областные школы направили лучших учеников на подготовку преподавателей. Они говорят по-разному и помнят революцию с разных сторон. Их классы должны дать следующему поколению понятную страну, не требуя от каждой семьи забыть собственную историю."
 HSM_AQR_national_services:0 "Общая гражданская служба"
 HSM_AQR_national_services_bonus_tt:0 "Изменение национального духа «§Y$HSM_AQR_compact$§!»:\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+10.0%§!\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$: §G+10.0%§!"
 HSM_AQR_national_services_desc:0 "Областные писари привезли несовместимые бланки и весьма похожие жалобы. Общая служба признает их опыт и положит конец привычке взимать новую пошлину на каждой прежней границе."
 HSM_AQR_national_settlement:0 "Обещания за пределами провинции"
 HSM_AQR_national_settlement_bonus_tt:0 "Изменение национального духа «§Y$HSM_AQR_compact$§!»:\n$MODIFIER_STABILITY_FACTOR$: §G+5.0%§!\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §G-5.0%§!"
 HSM_AQR_national_settlement_desc:0 "Учредительные делегаты возвращаются в столицу с письмами своих округов. Они сопоставят первые статьи с учреждениями, теперь управляющими всей страной. Спор идёт уже не о том, кто выиграл революцию, а о том, что победа дала пережившим её людям."
 HSM_AQR_native_selection_tt:0 "Подтвердить программу, поддержанную во время революции. Откроется её ветка фокусов; правительство будет учреждено учредительным собранием."
 HSM_AQR_native_settlement_retry_JEB:0 "Возобновить переговоры об устройстве провинции"
 HSM_AQR_native_settlement_retry_JEB_desc:0 "Делегаты могут вернуться к незавершённому обсуждению. Основой переговоров останется первоначальная подготовка; позднейшие манёвры в комитетах не изменят её итогов."
 HSM_AQR_native_settlement_retry_JEB_tt:0 "Исход борьбы зафиксирован, наступил мир, послевоенное вступление завершено. Есть доступная программа для обсуждения; устройство власти ещё не утверждено и не выбрано, другое обсуждение не ожидает ответа."
 HSM_AQR_native_settlement_retry_JFT:0 "Возобновить переговоры об устройстве провинции"
 HSM_AQR_native_settlement_retry_JFT_desc:0 "Делегаты могут вернуться к незавершённому обсуждению. Основой переговоров останется первоначальная подготовка; позднейшие манёвры в комитетах не изменят её итогов."
 HSM_AQR_native_settlement_retry_JFT_tt:0 "Исход борьбы зафиксирован, наступил мир, послевоенное вступление завершено. Есть доступная программа для обсуждения; устройство власти ещё не утверждено и не выбрано, другое обсуждение не ожидает ответа."
 HSM_AQR_native_settlement_retry_JRR:0 "Возобновить переговоры об устройстве провинции"
 HSM_AQR_native_settlement_retry_JRR_desc:0 "Делегаты могут вернуться к незавершённому обсуждению. Основой переговоров останется первоначальная подготовка; позднейшие манёвры в комитетах не изменят её итогов."
 HSM_AQR_native_settlement_retry_JRR_tt:0 "Исход борьбы зафиксирован, наступил мир, послевоенное вступление завершено. Есть доступная программа для обсуждения; устройство власти ещё не утверждено и не выбрано, другое обсуждение не ожидает ответа."
 HSM_AQR_native_settlement_retry_VIN:0 "Возобновить переговоры об устройстве провинции"
 HSM_AQR_native_settlement_retry_VIN_desc:0 "Делегаты могут вернуться к незавершённому обсуждению. Основой переговоров останется первоначальная подготовка; позднейшие манёвры в комитетах не изменят её итогов."
 HSM_AQR_native_settlement_retry_VIN_tt:0 "Исход борьбы зафиксирован, наступил мир, послевоенное вступление завершено. Есть доступная программа для обсуждения; устройство власти ещё не утверждено и не выбрано, другое обсуждение не ожидает ответа."
 HSM_AQR_offer_req_tt:0 "Оба правительства существуют и находятся в мире; отправитель остаётся независимой Аквелией; мы независимы либо подчинены ему."
 HSM_AQR_opening:0 "После революции"
 HSM_AQR_opening_desc:0 "Борьба определила, кто удержал провинцию, но победившая сторона ещё должна дать ответ её жителям. Делегаты приносят за общий стол обещания, звучавшие в клубах, ратушах и офицерских собраниях. Теперь предстоит решить, какие из этих обещаний станут основой власти."
 HSM_AQR_opening_effect_tt:0 "Областное собрание рассмотрит послевоенные программы сохранившихся политических сил."
 HSM_AQR_opening_req_tt:0 "Выполняется автоматически после революции, если сохраняется местное управление."
 HSM_AQR_partition:0 "Правительство в Грифенхейме"
 HSM_AQR_partition_desc:0 "Оккупационные канцелярии не могут вечно управлять чужой страной. Представители герцландских городов соберутся в Грифенхейме, чтобы учредить зависимое правительство со своими чиновниками и письменным разграничением полномочий. Для пограничных областей потребуется отдельное соглашение."
 HSM_AQR_partition_req_tt:0 "Мир; независимая Аквелия; прежняя Империя больше не существует; мы или наш герцландский субъект владеем Грифенхеймом и полностью контролируем его. Герцланд отсутствует либо уже подчинён нам."
 HSM_AQR_partition_tt:0 "Передать зависимому правительству принадлежащие нам и полностью контролируемые земли Герцланда, сохранив $STATE_378$, $STATE_399$, $STATE_447$ и $STATE_497$. Его государственный строй будет соответствовать нашему устройству."
 HSM_AQR_peace_req_tt:0 "Страна находится в мире."
 HSM_AQR_postpone_tt:0 "Предложение останется в делах провинции. Политическая власть не расходуется."
 HSM_AQR_proclaim:0 "Аквелийское правительство"
 HSM_AQR_proclaim_desc:0 "Областная печать лежит рядом с печатью, найденной в столице. Сохранить обе несложно; убедить дальние города, что новое правительство принадлежит и им, будет труднее. Прокламация должна содержать обязательства, а не только новое имя."
 HSM_AQR_proclaim_req_tt:0 "Утверждённое правительство, независимость и мир; прежняя Аквелия больше не существует; Аквелия (377) принадлежит нам и полностью контролируется."
 HSM_AQR_proclaim_tt:0 "Принять название, флаг и цвет Аквелии, соответствующие нашему государственному устройству."
 HSM_AQR_provincial_schools:0 "Школа в каждом округе"
 HSM_AQR_provincial_schools_desc:0 "Учителя не могут жить обещаниями. Муниципальные советы отремонтируют классы, организуют подготовку преподавателей и договорятся об оплате тех, кто останется на месте после отъезда торжественных делегаций."
 HSM_AQR_ratify_again_JEB_cocardiers:0 "Собрать собрание: Кокардьеры"
 HSM_AQR_ratify_again_JEB_cocardiers_desc:0 "В одну мастерскую пришли два приказа с печатями разных комитетов. Кокардьеры решат, кто говорит от имени их правительства и кто отвечает, когда это решение ошибочно. Они намерены предложить свою программу всей республике. Сначала Рила должна показать, что общее руководство способно защитить победу, не оставляя граждан навсегда в положении жителей осаждённого города."
 HSM_AQR_ratify_again_JEB_constitutional:0 "Собрать собрание: Конституционный договор Мишеля"
 HSM_AQR_ratify_again_JEB_constitutional_desc:0 "В хартии, обсуждаемой после возвращения Мишеля, остаётся открытым вопрос: что вправе делать министры между заседаниями собрания? Делегаты приводят примеры первых мирных недель, когда промедление оставляло прошения без ответа. Соглашение должно доказать свою пригодность в Риле, прежде чем его сторонники представят проект всей Аквелии. Мишелю предстоит вместе с ними заслужить право быть выслушанным за пределами герцогства."
 HSM_AQR_ratify_again_JEB_moderate:0 "Собрать собрание: Умеренные клубы"
 HSM_AQR_ratify_again_JEB_moderate_desc:0 "Приёмная комитета остаётся переполненной и после окончания боёв. Семьи разыскивают заключённых, бывшие противники предлагают сдать оружие, свидетели называют виновников убийств. Умеренным предстоит отличить политическое поражение от обвинения, которое должен рассмотреть суд. Когда их делегаты присоединятся к общему республиканскому движению, эти дела будут значить больше очередной речи о законности и покажут, чего стоят обещания клубов."
 HSM_AQR_ratify_again_JEB_royal:0 "Собрать собрание: Лоялисты Мишеля"
 HSM_AQR_ratify_again_JEB_royal_desc:0 "На столе Мишеля лежат военные приказы, составители которых затрудняются объяснить предоставленные полномочия. Капитаны требуют ясных распоряжений, судьи — прекращения обысков без ордера. Разрешив этот спор, Рила получит управление, пригодное для мирной жизни. Мишель намерен укрепить корону Дискретов делами своего правительства, начиная с доверия подданных к следующей королевской подписи под решением, касающимся их домов."
 HSM_AQR_ratify_again_JFT_communes:0 "Собрать собрание: Коммуны держат слово"
 HSM_AQR_ratify_again_JFT_communes_desc:0 "Мир вернул мучные обозы ополчения в кварталы с совершенно разными нуждами. Одно собрание требует вернуть запасы, другое лишилось печей. Делегатам предстоит определить порядок общего снабжения, прежде чем предложить такое устройство коммунам всей Аквелии. Придея станет отправной точкой более широкой федерации, а это голодное утро — её первым практическим испытанием. Нужно решить, кто вправе распорядиться мукой до очередного собрания в каждом квартале."
 HSM_AQR_ratify_again_JFT_dennis:0 "Собрать собрание: Город адмирала"
 HSM_AQR_ratify_again_JFT_dennis_desc:0 "Каждую смену на верфь всё ещё сопровождает патруль. Деннис получает прошение мастеров, которые не могут ремонтировать суда по правилам осады. Его ветераны боятся потерять гавань, рабочие требуют вернуть обычные условия труда. Прежде чем выдвинуть притязание на руководство Аквелией, адмиралу предстоит решить, какие части его командования уместны в гражданском правительстве. Придея должна стать основанием общегосударственной программы, способной действовать далеко за пределами порта."
 HSM_AQR_ratify_again_JFT_enfants:0 "Собрать собрание: Забытые дети Аквелии"
 HSM_AQR_ratify_again_JFT_enfants_desc:0 "Бои закончились, и группа безопасности приносит временному собранию дела военного времени. Один подозреваемый помог продать исчезнувший груз, другой лишь оспаривал распоряжения организатора. Их имена стоят на одной странице. Прежде чем предложить свою программу Аквелии, движению предстоит определить, кто вправе расследовать действия противников и какие доказательства отличают несогласие от предательства. Без ответа на этот вопрос список продолжит расти и после победы."
 HSM_AQR_ratify_again_JFT_fja:0 "Собрать собрание: Коалиция перед избирателями"
 HSM_AQR_ratify_again_JFT_fja_desc:0 "Мир лишил смысла привычку откладывать каждое разногласие. Коммунары приносят предложения о советах на предприятиях; МАФ — избирательный календарь и программу социальных законов. Обоим нужно правительство, способное открыть заводы и снабжать больницы. Временному кабинету предстоит установить, как принимать решения сейчас и как избиратели смогут сменить его участников позднее. Срок следующего обсуждения должен означать подготовку к голосованию, а не очередную отсрочку."
 HSM_AQR_ratify_again_JRR_absolutist:0 "Собрать собрание: Власть маркизы"
 HSM_AQR_ratify_again_JRR_absolutist_desc:0 "Боевые действия закончились, и дворяне напоминают об обещаниях, данных Жанне. Некоторые ждут назначений раньше, чем помощь получат пострадавшие деревни. Маркиза созовёт представителей, чтобы определить обязательства своего правительства. Весткипу предстоит показать, что её монархическое руководство способно предложить Аквелии помимо родового имени. Начать придётся с обязанностей, связывающих собственных сторонников двора. Претендовать на более широкое доверие можно лишь после исполнения обещаний дома."
 HSM_AQR_ratify_again_JRR_coalition:0 "Собрать собрание: Провинциальное соглашение Жанны"
 HSM_AQR_ratify_again_JRR_coalition_desc:0 "Мир восстановлен, но разрешения на городские собрания по-прежнему подписывает комендант. Делегаты приносят Жанне напечатанный договор коалиции и спрашивают, кто будет подписывать их завтра. Соглашение должно подчинить гарнизоны гражданской власти, сохранив её монархическое руководство. Прежде чем предложить это устройство общему аквелийскому движению, необходимо показать, как город сможет оспорить законный приказ. Для этого ему не должно требоваться нового тайного союза против собственного правительства."
 HSM_AQR_ratify_again_JRR_colette:0 "Собрать собрание: Национальная революция Колетт"
 HSM_AQR_ratify_again_JRR_colette_desc:0 "После восстановления мира штаб впервые получает требование отменить заводскую реквизицию. Интенданту Колетт по-прежнему нужны станки, а рабочие хотят возобновить обычное производство. Импровизированному военному командованию необходимо политическое соглашение, прежде чем стороны согласятся уступить. Делегаты собираются определить, какие полномочия останутся у офицеров, а какие перейдут гражданским участникам революции. Завод не должен простаивать лишь потому, что победители ещё не договорились, кто вправе открыть его ворота."
 HSM_AQR_ratify_again_VIN_abc:0 "Собрать собрание: Les Amis des ABC"
 HSM_AQR_ratify_again_VIN_abc_desc:0 "Соседи, переносившие донесения во время боёв, теперь приходят на собрание ABC со своими предложениями. Они хотят участвовать в формировании правительства. Советы, опирающиеся на эти улицы и деревни, могут дать движению программу, достойную обсуждения по всей Аквелии. Студентам следует начать с принятия поправок от людей, которые никогда не сидели рядом с ними в университетской аудитории."
 HSM_AQR_ratify_again_VIN_chevaliers:0 "Собрать собрание: Рыцари верности"
 HSM_AQR_ratify_again_VIN_chevaliers_desc:0 "Делегаты рыцарей верности кладут проект виновийской хартии рядом с письмами из других провинций. Соседи спрашивают, могут ли её гарантии действовать за пределами их родины. Федеративная программа для Аквелии потребует от движения принять обязанности вместе с правами. Сначала они сделают собственное областное правительство подотчётным, затем найдут партнёров, готовых предоставить друг другу такую же защиту."
 HSM_AQR_ratify_again_VIN_gadiffer:0 "Собрать собрание: Верное герцогство Гадиффера"
 HSM_AQR_ratify_again_VIN_gadiffer_desc:0 "Победа роялистов не закрыла деревенские счета. Обозы по-прежнему привозят требования, составленные для армий, которым уже незачем выступать в поход. Гадиффер представит расписки советникам и определит, как Виновии отвечать на будущие запросы. Он намерен служить короне Дискретов, управляя провинцией, способной исполнять обещания, а не истощать её обязательствами, которые невозможно выполнить даже после возвращения мира."
 HSM_AQR_ratify_again_VIN_sis:0 "Собрать собрание: Общество студентов-интеллектуалов"
 HSM_AQR_ratify_again_VIN_sis_desc:0 "Участники общества приходят в областные учреждения с проектами, исправленными за первые мирные недели. Писари спрашивают, как эти обещания изменят судьбу прошений, уже лежащих на столах. Ответ даст Виновии полезный опыт для участия в общей республиканской политике. Общество намерено поддержать это дело работающим управлением и чиновниками, готовыми признать ошибку перед гражданином, который пришёл добиваться справедливости."
 HSM_AQR_regional_articles:0 "Статьи областного управления"
 HSM_AQR_regional_articles_bonus_tt:0 "Изменение национального духа «§Y$HSM_AQR_compact$§!»:\n$MODIFIER_POLITICAL_POWER_FACTOR$: §G+5.0%§!"
 HSM_AQR_regional_articles_desc:0 "Прошения собирали в комнатах, где всё ещё течёт крыша. Теперь из них предстоит составить правила: кто назначает судью, кто проверяет казну и куда деревня может обратиться, когда столица отказывается её слушать."
 HSM_AQR_resend:0 "Пригласить оставшихся делегатов"
 HSM_AQR_resend_desc:0 "Канцелярия сохраняет места для областей, которые не могли ответить во время войны. Их делегаты получат те же статьи и то же право отказаться."
 HSM_AQR_resend_req_tt:0 "Мир; другая независимая область или наш субъект может получить предложение и ещё не отказывался."
 HSM_AQR_resisting_req_tt:0 "Независимая область отказалась присоединиться; общая фракция, пакт или перемирие не препятствуют ответу."
 HSM_AQR_restore_national_movement:0 "Обещание, стоящее за победой"
 HSM_AQR_restore_national_movement_desc:0 "Делегаты, последовавшие за нами в столицу, давали разные клятвы. Общегосударственное управление должно выслушать их, прежде чем первые назначения превратят временный порядок в постоянный. И восстановление прежней власти, и создание новой требуют открытого ответа."
 HSM_AQR_resume_JEB_cocardiers:0 "Возобновить: Кокардьеры"
 HSM_AQR_resume_JEB_cocardiers_desc:0 "Программа может вернуться на рассмотрение собрания, сохранив результаты прежней работы."
