l_russian:
 HSM_VER_EVT_internal_protocol_tt:0 "Утвердить технический протокол. Получим указанный ниже дух на §Y730 дней§!; срок уже действующего протокола не продлевается."
 HSM_VER_EVT_foreign_protocol_tt:0 "Утвердить протокол. Мы получим указанный ниже дух на §Y730 дней§!; Эри получит такой же бонус после подписи своего первого партнёра."
 HSM_VER_EVT_decline_protocol_tt:0 "Отклонить приглашение. Бонус технического протокола не предоставляется."
 HSM_VER_EVT_mandate_tt:0 "Потратим §Y50 политической власти§! и начнём восстановительный мандат на §Y730 дней§! с указанным ниже духом. Война, потеря Гриффенхейма или распад общих учреждений досрочно прекращают мандат."
 HSM_VER_EVT_decline_mandate_tt:0 "Отказаться от мандата. Политическая власть не тратится; программа восстановления Гриффенхейма не откроется."
 HSM_VER_EVT_household_record_tt:0 "Зафиксировать подтверждённую судьбу Гровера VI и открыть архивную программу. Его двор не переезжает; регентство не учреждается."
 HSM_VER_EVT_city_factory_tt:0 "Гриффенхейм получит §G1 гражданскую фабрику§! и §G1 ячейку строительства§!. Если фабрика не помещается, вместо неё получим §G1 бонус исследования 100%§! для промышленности."
 HSM_VER_EVT_city_plans_tt:0 "Получим §G2 бонуса исследования по 75%§! для строительных технологий. Фабрика не строится."
 HSM_VER_EVT_audit_tt:0 "Опубликовать отчёт и открыть выбор: последний год восстановительных работ или возврат полномочий комиссии. Сама публикация не продлевает мандат."
 HSM_VER_EVT_estates_sign_tt:0 "Зафиксировать согласие этой провинции. Для учреждения или сохранения авианского соглашения нужно согласие и Эри, и Эйри. Голосование не передаёт территории."
 HSM_VER_EVT_void_pact_tt:0 "Отклонить соглашение. Авиан утратит совместное регентство либо гражданское соглашение и все национальные духи, зависящие от него."
 HSM_VER_EVT_propose_regency_tt:0 "Предложить Эри и Эйри регентство при живом несовершеннолетнем Гровере VI. Ответы действуют §Y45 дней§!; новое предложение возможно через §Y90 дней§! после этого. Только согласие обеих сторон даст Авиану указанный ниже дух."
 HSM_VER_EVT_propose_civil_tt:0 "Предложить Эри и Эйри гражданское соглашение без регента. Ответы действуют §Y45 дней§!; новое предложение возможно через §Y90 дней§! после этого. Только согласие обеих сторон даст Авиану указанный ниже дух."
 HSM_VER_EVT_school_tt:0 "Завершить посещение школы. Вместе с решением об обороне это откроет слушания прошений в совете. Если юный Гровер присутствует здесь, об этом вспомнят при его совершеннолетии."
 HSM_VER_EVT_logistics_tt:0 "Выбрать совместное снабжение вместо территориального резерва. Авиан получит указанный ниже дух на время действия общего соглашения."
 HSM_VER_EVT_reserves_tt:0 "Выбрать территориальный резерв вместо совместного снабжения. Авиан получит указанный ниже дух на время действия общего соглашения."
 HSM_VER_EVT_petitions_tt:0 "Завершить слушания прошений и открыть программы восстановления и закрепления прав. Если юный Гровер присутствует, об этом вспомнят при его совершеннолетии."
 HSM_VER_EVT_regency_sign_tt:0 "Согласиться с предложением Авиана. Регентство либо гражданское соглашение вступит в силу только с согласия и Эри, и Эйри. Наша территория и правительство сохраняются."
 HSM_VER_EVT_regency_decline_tt:0 "Отклонить предложение и завершить этот раунд переговоров. Общее соглашение не вступит в силу; Авиан сможет обратиться снова после текущего 90-дневного перерыва."
 HSM_VER_EVT_custody_transfer_tt:0 "Передать Гровера VI и его двор Авиану; мы утратим национальный дух юного императора. Это не коронация и не согласие на присоединение нашей страны."
 HSM_VER_EVT_custody_decline_tt:0 "Отказать в переезде. Гровер VI и его двор останутся у нас."
 HSM_VER_EVT_succession_tt:0 "Гровер VI станет конституционным монархом Авиана. Правительство будет нейтральным, без выборов; дух юного императора исчезнет. Другие страны не присоединяются."
 HSM_VER_EVT_decline_union_tt:0 "Отказаться от участия и сохранить независимость. Это председательство не сможет пригласить нас снова. Отказ Эри или Эйри закрывает конвент; выход Авиана не мешает объединению двух герцогств."
 HSM_VER_EVT_refuse_absorption_tt:0 "Отозвать согласие и сохранить независимость. Это председательство не сможет пригласить нас снова. Отказ Эри или Эйри закрывает конвент; Авиан может выйти, не препятствуя объединению двух герцогств."
