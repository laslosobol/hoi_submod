l_russian:
 HSM_VER_COOP_plan_name:0 "Веренийское соглашение"
 HSM_VER_COOP_plan_desc:0 "Дома завершают распрю и создают общие учреждения."
 HSM_VER_COOP_customs_union_available_tt:0 "Участники признали общее председательство, и конвент может продолжать работу."
 HSM_VER_COOP_common_works_available_tt:0 "Таможенный союз действует; общие работы ещё не получили финансирование конвента."
 HSM_VER_COOP_common_administration_available_tt:0 "Таможенный союз создан; председательствующая страна может выделить §Y100 политической власти§! на общую администрацию."
 HSM_VER_COOP_unified_command_available_tt:0 "Общие работы и администрация созданы. Оба переходных периода завершены; председательствующая страна может выделить §Y50 политической власти§! на единое командование."
 HSM_VER_COOP_customs_union_reward_tt:0 "Создаёт таможенное сотрудничество для всех участников и начинает §Y60-дневный§! переход."
 HSM_VER_COOP_common_works_reward_tt:0 "Каждый участвующий Дом получает общие работы, одну ячейку строительства и одну гражданскую фабрику при наличии места. Каждый Дом получает их один раз."
 HSM_VER_COOP_common_administration_reward_tt:0 "Председательствующая страна тратит §Y100 политической власти§!. Общая администрация служит всем участникам; переход занимает §Y90 дней§!."
 HSM_VER_COOP_unified_command_reward_tt:0 "Председательствующая страна тратит §Y50 политической власти§! на создание общего командования для всех участников."
 HSM_VER_COOP_customs_ready_tt:0 "Таможенный союз действует."
 HSM_VER_COOP_projects_ready_tt:0 "Общие работы и общая администрация созданы."
 HSM_VER_COOP_administration_open_tt:0 "Общая администрация ещё не создана."
 HSM_VER_COOP_transitions_done_tt:0 "Таможенный и административный переходы завершены; единое командование ещё не создано."
