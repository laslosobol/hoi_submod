l_russian:
 HSM_AVI_three_separate_seals:0 "Три печати, одна конституция"
 HSM_AVI_three_separate_seals_desc:0 "Интергигантес Катрины привёл дома от соперничества к дружбе. Теперь предстоит подготовить единую Верению. Начнём с отдельных подписей под общей хартией, чтобы суды, казначейства и канцелярии заслужили полномочия, необходимые единой стране. На первом этапе дома сохранят свои правительства; учредительное собрание определит передачу их полномочий общему государству."
 HSM_AVI_charter_without_submission:0 "Первая конституционная хартия"
 HSM_AVI_charter_without_submission_desc:0 "Представим хартию Эри и Эйри, а затем добьёмся её ратификации в Авиане. Общие суды и службы станут первыми учреждениями будущей Верении. Их нынешние полномочия должны быть точно определены, а обязанности приняты каждым домом. Такое временное распределение власти даст последующему учредительному собранию правовую основу для общего казначейства, гражданства и правительства."
 HSM_AVI_defence_without_a_master:0 "Оборона под гражданской властью"
 HSM_AVI_defence_without_a_master_desc:0 "Общему штабу нужны офицеры, способные работать вместе, и инженеры, обслуживающие единую систему обороны. Подготовим их под гражданским надзором, установленным хартией. Нынешние командования отвечают за свои войска, пока учредительное собрание готовит законы и ассигнования для единой армии. Опыт Авиана поможет превратить совместную работу в службу будущего государства."
 HSM_AVI_open_minutes_desc:0 "Опубликуем материалы спора о сборе, его решение и действующие обязательства. Прежде чем доверить единому правительству новые полномочия, города должны оценить работу первых общих учреждений. Эти документы наши делегаты возьмут на учредительное собрание."
 HSM_AVI_a_union_worth_keeping:0 "Мандат на единую Верению"
 HSM_AVI_a_union_worth_keeping_desc:0 "Хартия выдержала спор о деньгах и власти. Её суды могут обязать принимающую сторону соблюдать закон, канцелярии публикуют достоверные счета, а мастерские планируют работу на будущее. Завершим первый этап и откроем учредительное собрание. Следующие переговоры создадут общие учреждения и определят правительство, которое объединит дома в одну страну. Авиан может принять эту ответственность в рамках общей ратифицированной конституции."
 HSM_AVI_route_choice_tt:0 "Начинает §Yконституционное объединение Верении§!. Авиан становится наблюдателем и добивается отдельной ратификации хартии. Завершение первого этапа откроет §YУчредительное собрание§!, создание общих учреждений и правительства, а затем объединение в одну страну. Этот выбор закрывает исходную ветку §YВторого бала Зимнего праздника§!."
 HSM_AVI_full_integration_tt:0 "Завершает фокус §Y«Три печати, одна конституция»§! и открывает его конституционную ветку. Подписи под действующими договором и хартией сохраняют силу. Дома согласуют учреждения единой Верении; окончательная передача власти последует после учредительного собрания и ратификации."
 HSM_AVI_constituent_convention_tt:0 "Первый конституционный этап завершён. Открывает §YУчредительное собрание§! для дальнейших переговоров, ведущих к §Yединой Верении§!. Авиан может стать центром общего правительства. Новые обязательства потребуют предусмотренного собранием согласия."
 hsm_ver_avian.1.t:0 "Первая страница конституции"
 hsm_ver_avian.1.d:0 "Секретарь поставил печать Авиана над печатями Эри и Эйри. Катрина передвинула её в один ряд с остальными. Место общего правительства ещё предстояло определить; сегодня требовался документ, который смогут подписать все три правительства.\n\nОна приходилась тётей и Винсенту, и Иовинусу и провела немало приёмов, убеждая их оставаться в одном зале. Дружба сделала это возможным. Стране понадобится большее: суды, чьи решения переживут обиду герцога, счета, выдерживающие неудобный вопрос, и канцелярии, работающие после отъезда покровителей.\n\nКатрина попросила место наблюдателя на переговорах о хартии и отдельный акт её ратификации Авианом. Сначала каждый дом передаст общим учреждениям определённые полномочия. После их проверки учредительное собрание сможет решить вопросы гражданства, доходов и перехода к единому правительству. Три печати начнут эту работу. Три границы не обязаны стать её итогом."
 hsm_ver_avian.1.a:0 "Подготовить первую общую хартию."
 hsm_ver_avian.50.t:0 "От хартии к государству"
 hsm_ver_avian.50.d:0 "Секретарь принёс новую повестку с пустой строкой для места заседания. Эри предложил собственный зал; Эйри запросил копию решения по сбору, прежде чем назначать делегацию. Катрина велела внести оба письма в протокол.\n\nПервая хартия добилась того, чего не могло семейное обещание. Её суд потребовал ответа от принимающей стороны, счета отражали действительные обязательства, а города получили возможность оспорить взыскание. На таких учреждениях можно строить страну. Пока они оставались разделены между тремя администрациями, и каждое общее дело вновь проходило через это разделение.\n\nПоэтому новая повестка созывала учредительное собрание: предстояло создать казначейство с законными доходами, общее гражданство и правительство, ответственное за всю Верению. Авиан мог предложить разместить его у себя, но дома должны были ратифицировать его полномочия и окончательную передачу власти. Катрина подписала приглашение. Хартия дала им первое соглашение. Теперь можно было договориться об одной стране."
 hsm_ver_avian.50.a:0 "Созвать делегатов ради единой Верении."
 HSM_AVI_preserved_union:0 "Авиан выбрал конституционное объединение"
 HSM_AVI_settlement_completed:0 "Первый конституционный этап завершён"
 full_integration:0 "Подготовить конституционное объединение"
 full_integration_desc:0 "Общий рынок, коллегии и транспортные соглашения придали Интергигантесу практическое значение. Подготовим конституционное соглашение, которое направит это сотрудничество к единой Верении. Катрина откроет переговоры о хартии, испытает первые общие учреждения, а затем вынесет вопрос единого правительства на учредительное собрание. Передача власти домов должна пройти через согласованные законы и ратификацию."
