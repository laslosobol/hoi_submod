l_russian:
 HSM_EYR_DEV_common_curriculum_bonus:0 "Общая техническая программа"
 HSM_EYR_DEV_public_health_bonus:0 "Подготовка служб здравоохранения"
 HSM_EYR_borderland_reconstruction:0 "Восстановить пограничье"
 HSM_EYR_borderland_reconstruction_desc:0 "Восстановление Эйри начинается с дел, которые не могут ждать соглашений с соседями. Мы создадим местные ремонтные бригады, проверим состояние общественных зданий и дадим окружным властям полномочия для поддержания работы важнейших служб."
 HSM_EYR_fair_grain_markets:0 "Справедливая торговля зерном"
 HSM_EYR_fair_grain_markets_desc:0 "Неточные весы, испорченные запасы и произвольные сборы оставляют земледельцам лишь малую долю выручки. Общие правила торговли и совместные хранилища помогут сократить бедность и направить сельские сбережения в гражданскую промышленность."
 HSM_EYR_market_roads:0 "Дороги к рынкам"
 HSM_EYR_market_roads_desc:0 "От урожая мало пользы, если его нельзя довезти до мельницы. Перевозчики Верении и Эйри знают, какой мост не выдержит дождей и какая дорога исчезнет при оттепели. По их рассказам будут работать землекопы и строители мостов, чтобы земледелец мог обещать доставку, не гадая о погоде."
 HSM_EYR_rural_processing:0 "Переработка на местах"
 HSM_EYR_rural_processing_desc:0 "Помол, заготовка и упаковка должны давать квалифицированную работу рядом с полями. Слишком много урожая покидает деревни Эйри без обработки, а слишком большая доля выручки остаётся у дальних покупателей. Местные предприятия позволят сельским семьям продавать товары, которые выдержат долгую дорогу и зимнее хранение."
 HSM_EYR_equipment_cooperatives:0 "Кооперативные мастерские"
 HSM_EYR_equipment_cooperatives_desc:0 "Небольшое хозяйство не может в одиночку содержать дорогую мастерскую. Кооперативы объединят заказы, устроят общие склады запасных частей и займутся ремонтом инвентаря между уборками урожая. Сломанная машина должна приводить в хозяйство механика, а не кредитора."
 HSM_EYR_seasonal_work_schemes:0 "Работа между урожаями"
 HSM_EYR_seasonal_work_schemes_desc:0 "Сезонный труд не должен оборачиваться сезонным голодом. Окружные службы помогут желающим найти работу на перерабатывающих предприятиях и в ремонтных бригадах вне уборочной поры. Более устойчивые доходы вновь сократят бедность и укрепят доверие к программе восстановления."
 HSM_EYR_evening_classes:0 "Вечерние занятия"
 HSM_EYR_evening_classes_desc:0 "После рабочего дня школьные классы могут принимать взрослых. Новая программа чтения, счёта и технического черчения поможет тем, кого обошло обычное образование, и сделает прикладные знания частью повседневной жизни."
 HSM_EYR_practical_science:0 "Наука для повседневного труда"
 HSM_EYR_practical_science_desc:0 "Нашим новым классам и мастерским нужны преподаватели, умеющие испытать материал, объяснить электрическую схему и записать результаты опыта. Небольшие учебные лаборатории укрепят пока ещё скромную научную базу и подготовят почву для исследований в электротехнике."
 HSM_EYR_district_laboratories:0 "Окружные лаборатории"
 HSM_EYR_district_laboratories_desc:0 "Окружные школы стали брать приборы у мастерских, а мастера теперь сами приходят к преподавателям с вопросами. Общие лаборатории дадут этому обмену постоянный дом. Здесь можно будет испытывать материалы, собирать электрические цепи и сохранять записи неудачных опытов, чтобы каждому преподавателю не приходилось начинать с нуля."
 HSM_EYR_technical_fellowships:0 "Технические стипендии"
 HSM_EYR_technical_fellowships_desc:0 "Преподаватели не могут построить научное сообщество в часы, оставшиеся после проверки тетрадей. Оплачиваемые стипендии позволят способным исследователям посвятить себя сложной задаче и привлечь к работе учеников. Мастерские, поставляющие приборы, будут ждать полезных ответов, но должны научиться давать время на добросовестный опыт."
 HSM_EYR_defensive_service:0 "Служба обороны"
 HSM_EYR_defensive_service_desc:0 "Для защиты Эйри нужны ясные обязанности, надёжная подготовка и офицеры, знающие местность. Мы пересмотрим планы местной обороны и выработаем общий порядок службы на практических учениях."
 HSM_EYR_skilled_reserve:0 "Квалифицированный резерв"
 HSM_EYR_skilled_reserve_desc:0 "Вернувшиеся к мирному труду солдаты не должны выбирать между заработком и местом в резерве. Ученичество в мастерских даст им ремесло, а сборы помогут бывшим товарищам сохранить привычку служить вместе. Хозяевам предприятий и офицерам предстоит согласовать календарь, при котором работника не будут отзывать всякий раз, когда подходит срок сдачи заказа."
 HSM_EYR_engineer_corps:0 "Полевой инженерный корпус"
 HSM_EYR_engineer_corps_desc:0 "Водоотвод, укрытия и надёжные полевые укрепления важнее грандиозных планов, составленных вдали от границы. Постоянный инженерный состав научит части быстрее окапываться и направит разработку лучшего инженерного оснащения."
 HSM_EYR_repair_arsenals:0 "Ремонтные арсеналы"
 HSM_EYR_repair_arsenals_desc:0 "Винтовка, ожидающая мелкого ремонта, всё равно отсутствует в строю. Оружейникам нужны верстаки, измерительные инструменты и надёжные поставки запасных частей. Оснащённый арсенал позволит приводить оружие в порядок прежде, чем очередному полку придётся выступать с тем, что осталось на складах."
 HSM_EYR_supply_depots:0 "Порядок на складах снабжения"
 HSM_EYR_supply_depots_desc:0 "Интендант знает, что записано в книге; возница знает, что действительно прибыло на склад. Слишком часто они говорят о разных грузах. Постоянная складская служба сверит накладные, наладит перевозки и установит, кто отвечает за припасы, потерянные между хранилищем и ожидавшей их частью."
 HSM_EYR_infantry_drills:0 "Практическая подготовка пехоты"
 HSM_EYR_infantry_drills_desc:0 "Малые подразделения должны уметь удерживать позиции, прикрывать отход и грамотно применять оружие. Регулярные полевые занятия выявят недостатки пехотного оснащения и дадут инструкторам опыт, которым можно поделиться с новобранцами."
 HSM_EYR_observation_posts:0 "Пограничные наблюдатели"
 HSM_EYR_observation_posts_desc:0 "Знание местности полезно лишь тогда, когда донесение приходит вовремя и его можно понять. Подготовленные группы наблюдателей будут сопоставлять отчёты патрулей, вести точные схемы и совершенствовать разведку в интересах пограничных частей."
 HSM_EYR_signals_network:0 "Единая сеть связи"
 HSM_EYR_signals_network_desc:0 "Предупреждение патруля бесполезно, если штаб прочтёт его после того, как резерв уйдёт не в ту сторону. Наблюдатели, складские служащие и резервные офицеры будут учиться обмениваться донесениями через подготовленных связистов. Сообщение должно оставаться понятным на всём пути от полевой записной книжки до последней части, ожидающей приказа."
 HSM_EYR_DEV_public_works:0 "Окружные ремонтные бригады"
 HSM_EYR_DEV_public_works_desc:0 "Местные бригады и общий учёт ремонтных работ позволяют быстрее возвращать повреждённые здания в строй."
 HSM_EYR_DEV_rural_investment:0 "Сельские инвестиции"
 HSM_EYR_DEV_rural_investment_desc:0 "Более устойчивые доходы хозяйств поддерживают вложения в переработку и мастерские, ускоряя строительство гражданских фабрик."
 HSM_EYR_DEV_practical_education:0 "Прикладное образование"
 HSM_EYR_DEV_practical_education_desc:0 "Вечерние занятия связывают начальное образование с техническим трудом и дают исследователям больше способных помощников."
 HSM_EYR_DEV_skilled_reserve:0 "Квалифицированные резервисты"
 HSM_EYR_DEV_skilled_reserve_desc:0 "Работа в мастерских и учебные сборы сохраняют навыки, полезные и на производстве, и на военной службе."
 HSM_EYR_DEV_field_engineers:0 "Кадры полевых инженеров"
 HSM_EYR_DEV_field_engineers_desc:0 "Опытные инженеры учат части быстрее готовить оборонительные позиции."
 HSM_EYR_DEV_depot_service:0 "Окружная складская служба"
 HSM_EYR_DEV_depot_service_desc:0 "Точный учёт и налаженная доставка сокращают расход снабжения в войсках."
 HSM_EYR_DEV_observer_sections:0 "Подготовленные наблюдатели"
 HSM_EYR_DEV_observer_sections_desc:0 "Надёжные донесения патрулей и наблюдение на местах повышают эффективность армейской разведки."
 HSM_EYR_DEV_coordinated_signals:0 "Согласованная полевая связь"
 HSM_EYR_DEV_coordinated_signals_desc:0 "Единая система донесений сохраняет преимущество наблюдателей в разведке и повышает вероятность вступления резервов в бой."
 HSM_EYR_DEV_road_methods_bonus:0 "Изыскания пограничных дорог"
 HSM_EYR_DEV_workshop_methods_bonus:0 "Методы кооперативных мастерских"
 HSM_EYR_DEV_instrumentation_bonus:0 "Учебные приборы"
 HSM_EYR_DEV_material_testing_bonus:0 "Окружные испытания материалов"
 HSM_EYR_DEV_fellowship_bonus:0 "Исследования технических стипендиатов"
 HSM_EYR_DEV_engineer_bonus:0 "Полевые инженерные испытания"
 HSM_EYR_DEV_maintenance_bonus:0 "Испытания арсенального обслуживания"
 HSM_EYR_DEV_logistics_bonus:0 "Изучение складского снабжения"
 HSM_EYR_DEV_rail_supply_bonus:0 "Изучение железнодорожного снабжения"
 HSM_EYR_DEV_infantry_bonus:0 "Испытания пехотного оснащения"
 HSM_EYR_DEV_recon_bonus:0 "Донесения пограничной разведки"
 HSM_EYR_DEV_signals_bonus:0 "Единые правила связи"
 HSM_EYR_teacher_training:0 "Учителя для каждого округа"
 HSM_EYR_teacher_training_desc:0 "Сельская школа не может зависеть от того, найдётся ли у местного писаря свободный день. На учительских курсах будущие наставники научатся вести занятия и школьные записи, а затем вернутся в свои округа с опытом и коллегами, к которым можно обратиться за советом."
 HSM_EYR_public_libraries:0 "Книги за школьным порогом"
 HSM_EYR_public_libraries_desc:0 "Учёба не должна заканчиваться вместе со школой. В общественных читальнях можно будет брать практические руководства, газеты и рассказы, а разъездные библиотекари доставят книги в селения, которым пока не по силам собственное собрание."
 HSM_EYR_universal_schooling:0 "Место для каждого ученика"
 HSM_EYR_universal_schooling_desc:0 "Школа становится общей лишь тогда, когда открыта для каждой семьи. Учителя и окружные служащие договорятся с родителями и работодателями о возвращении детей за парты. Вечерние занятия примут и тех, чьё детство прошло без школьных книг."
 HSM_EYR_district_housing:0 "Достойное жильё"
 HSM_EYR_district_housing_desc:0 "Тесные комнаты и протекающие крыши съедают заработок, который должен обеспечивать семью. Окружные строители отремонтируют наёмное жильё и подготовят доступные дома рядом с мастерскими. Жильцы смогут требовать ремонта, не опасаясь выселения."
 HSM_EYR_social_insurance:0 "Опора в трудные дни"
 HSM_EYR_social_insurance_desc:0 "Болезнь или травма не должны отправлять семью трудящегося в богадельню. Взносы работников, нанимателей и казны поддержат страховую кассу, чьи местные отделения будут вовремя оплачивать обоснованные требования и открыто отчитываться о расходах."
 HSM_EYR_rural_credit:0 "Кредит для села"
 HSM_EYR_rural_credit_desc:0 "Земледельцам и сельским ремесленникам нужны займы, которые можно вернуть честным трудом. Местные кредитные товарищества разделят риски и опубликуют условия, чтобы срочная нужда в деньгах не оборачивалась пожизненной зависимостью."
 HSM_EYR_public_utilities:0 "Вода, свет и городское хозяйство"
 HSM_EYR_public_utilities_desc:0 "Растущим городам нужны надёжное водоснабжение, освещение и транспорт. Инженеры и выборные представители округов согласуют требования к службам, расширят сети и подготовят бригады, которым предстоит поддерживать их в любое время года."
 HSM_EYR_lasting_prosperity:0 "Благополучие в каждом доме"
 HSM_EYR_lasting_prosperity_desc:0 "Восстановление должно наконец дойти до семей, оставшихся в стороне. Надёжное жильё, постоянная работа и исправные службы станут привычной частью жизни. Местные власти ответят за то, чтобы благополучие не ограничивалось самыми оживлёнными улицами."
 HSM_EYR_DEV_electronics_bonus:0 "Исследования при публичных библиотеках"
 HSM_EYR_DEV_industry_bonus:0 "Вложения сельских товариществ"
 HSM_EYR_DEV_construction_bonus:0 "Городская инженерная служба"
