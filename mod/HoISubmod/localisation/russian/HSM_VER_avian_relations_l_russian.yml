l_russian:
 HSM_VER_AVR_routes_tt:0 "Наш подход зависит от действительного курса Авиана: §YIntergigantes§! позволяет договорное присоединение, §Yистинный нейтралитет§! открывает военную ветвь. Общее провозглашение нейтралитета ещё не определяет выбор."
 HSM_VER_AVR_offer_tt:0 "Приглашает Авиан к ассоциации на пути к общему веренийскому государству. Авиан может согласиться или отказать; аннексия требует отдельного соглашения."
 HSM_VER_AVR_customs_tt:0 "Потратить §Y75 политической власти§! на согласование таможни и управления Авиана с уже объединёнными герцогствами. Авиан должен прямо одобрить присоединение. Ратификация начинает §Y60-дневный§! переход; аннексия произойдёт только по итогам заключительного фокуса."
 HSM_VER_AVR_integrate_tt:0 "Завершить одобренное Авианом присоединение, передать его территории и войска, сделать его исходную область национальной. Заморские владения национальными не становятся."
 HSM_VER_AVR_annex_warning_tt:0 "§RЭто прямое согласие на аннексию Авиана объединённым веренийским правительством после переходного периода и завершающего фокуса, включая войска и владения. Авиан перестанет существовать как отдельная игровая страна.§!"
 HSM_VER_AVR_customs_bonus:0 "Общие правила веренийских перевозок"
 HSM_VER_AVR_colleges_bonus:0 "Коллегии объединённой Верении"
 HSM_VER_AVR_records_bonus:0 "Единый гражданский реестр"
 HSM_VER_AVR_authority_tt:0 "Наше независимое герцогское правительство опирается на действующую хартию Эри и Эйри, подтверждённое военное урегулирование либо созданное веренийское государство, контролирующее исходные земли обоих герцогств."
 HSM_VER_AVR_association_available_tt:0 "Урегулирование герцогств действует. Авиан следует Intergigantes при конституционном правительстве, независим, находится в мире, контролирует свою область и ещё не договорился с другим организатором. Нет несовместимого внешнего альянса, ожидающего ответа либо отклонённого предложения."
 HSM_VER_AVR_customs_available_tt:0 "Мы объединили и контролируем исходные земли обоих герцогств, сохраняем договор с Авианом и располагаем минимум 75 политической власти. Оба правительства независимы, находятся в мире и дипломатически совместимы; Авиан контролирует свою область."
 HSM_VER_AVR_accession_available_tt:0 "Авиан прямо одобрил присоединение к созданной нами Верении, таможенное согласование завершено и 60-дневный переходный срок истёк. Договор, правительства, мир и контроль над территориями сохраняются."
 HSM_VER_AVR_claim_available_tt:0 "Урегулирование герцогств действует. Независимый Авиан выбрал истинный нейтралитет и владеет своей исходной областью. Оба правительства находятся в мире; нет общей фракции, пакта о ненападении или ожидающего ответа соглашения. Обычные дипломатические правила позволяют войну."
 HSM_ERI_avian_association:0 "$HSM_ERI_invite_avian$"
 HSM_ERI_avian_association_desc:0 "$HSM_ERI_invite_avian_desc$"
 HSM_EYR_avian_association:0 "$HSM_EYR_a_seat_for_avian$"
 HSM_EYR_avian_association_desc:0 "$HSM_EYR_a_seat_for_avian_desc$"
 hsm_ver_avr.1.t:0 "Место Катрины за столом"
 hsm_ver_avr.1.d:0 "Intergigantes задумывался не для того, чтобы Авиан вечно балансировал между двумя враждующими соседями. Делегация из государства [From.GetName] привезла предложение, выходящее за пределы взаимной защиты: общие учреждения, а затем и общее государство.\n\nКатрина перекладывает страницы. Местные суды и коллегии идут первыми, председательство — последним. Сегодняшняя подпись разрешит переговоры, но не упразднит её правительство. Вторая подпись подождёт законченного акта о присоединении."
 hsm_ver_avr.1.a:0 "Сблизим дома; последнюю подпись пока оставим за собой."
 hsm_ver_avr.1.b:0 "Сотрудничество не требует присоединения."
 hsm_ver_avr.2.t:0 "Акт о присоединении"
 hsm_ver_avr.2.d:0 "Тарифы сопоставлены, гражданские реестры согласованы, офицеры решили, кто отдаёт приказы, когда две колонны встречаются на перекрёстке. Двух герцогств, между которыми мог бы посредничать Авиан, больше нет: [From.GetName] предлагает место в едином государстве.\n\nОкончательный текст сохраняет городские хартии и средства коллегий Авиана, но прекращает его отдельную внешнюю политику и военное командование. Катрина читает этот абзац вслух прежде, чем совет голосует. Перед ними не оборонный союз с громким названием."
 hsm_ver_avr.2.a:0 "Ратифицировать присоединение к государству [From.GetName]."
 hsm_ver_avr.2.b:0 "Сохраним договор, но оставим своё правительство."
 hsm_ver_avr.3.t:0 "Последняя таможенная застава"
 hsm_ver_avr.3.d:0 "Последняя книга сборов закрыта. Писарей не уволили: теперь они учитывают грузы на внешней границе. Во дворе солдаты меняют расписание дежурств, а не караул.\n\nКоллегии, города и полки Авиана вошли в общее государство. Споры о назначениях и расходах никуда не исчезнут. Но теперь они будут идти внутри одного правительства, а не через три границы."
 hsm_ver_avr.3.a:0 "Одна страна, но не одна память."
 hsm_ver_avr.obsolete:0 "Обстоятельства изменились."
 HSM_ERI_avian_question:0 "Авианский вопрос"
 HSM_ERI_avian_question_desc:0 "Урегулирование с другим герцогством ещё не решает будущего Авиана. Правительство Катрины на пути Intergigantes уже сделало сотрудничество своим курсом; сторонники истинного нейтралитета выбрали противоположное. Совет должен рассмотреть авианский вопрос отдельно, не превращая его в приложение к старой семейной ссоре."
 HSM_ERI_avian_customs:0 "От сближения к общему управлению"
 HSM_ERI_avian_customs_desc:0 "Герцогства уже объединили правительство. Для присоединения Авиана нужны рабочие правила: общие таможенные документы, признание городского права и место его коллегий в бюджете. Когда всё будет готово, совет Катрины получит акт, прекращающий отдельный суверенитет."
 HSM_ERI_avian_accession:0 "Закрыть третью границу"
 HSM_ERI_avian_accession_desc:0 "Согласие получено, переходный срок завершён. Полки Авиана войдут в общую армию, суды — в общую систему обжалования, а города — в одну политическую страну со своими соседями. Договор становится действующим государственным устройством."
 HSM_EYR_avian_question:0 "Авианский вопрос"
 HSM_EYR_avian_question_desc:0 "Урегулирование с другим герцогством ещё не решает будущего Авиана. Правительство Катрины на пути Intergigantes уже сделало сотрудничество своим курсом; сторонники истинного нейтралитета выбрали противоположное. Совет должен рассмотреть авианский вопрос отдельно, не превращая его в приложение к старой семейной ссоре."
 HSM_EYR_avian_customs:0 "От сближения к общему управлению"
 HSM_EYR_avian_customs_desc:0 "Герцогства уже объединили правительство. Для присоединения Авиана нужны рабочие правила: общие таможенные документы, признание городского права и место его коллегий в бюджете. Когда всё будет готово, совет Катрины получит акт, прекращающий отдельный суверенитет."
 HSM_EYR_avian_accession:0 "Закрыть третью границу"
 HSM_EYR_avian_accession_desc:0 "Согласие получено, переходный срок завершён. Полки Авиана войдут в общую армию, суды — в общую систему обжалования, а города — в одну политическую страну со своими соседями. Договор становится действующим государственным устройством."
