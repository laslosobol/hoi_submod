l_russian:
 hsm_ver_grover.1.romance.d:0 "Делегаты Герцланда приносят прошение на языке имперской канцелярии. Розалин кладёт аквилейский перевод рядом с подлинником и просит просителей объяснить спорную фразу. Монтаг запрашивает документы императорского двора и окружные отчёты, скрытые за лестным предисловием секретаря.\n\nПрежде чем кто-либо из правителей сможет обещать действовать от имени Гровера, необходимо установить его положение. Если законный мандат будет выдан, под ним окажутся обе подписи. Обоих он обяжет к одному исходу: независимая имперская власть в Герцланде, а Верения вновь управляет собственной страной."
 hsm_ver_grover.4.romance.d:0 "Розалин замечает, что аквилейский перевод называет просителя смутьяном, тогда как герцландский подлинник говорит о невыплаченных деньгах. Монтаг просит архивиста принести распоряжения, из-за которых возник спор. Они относятся к правлению отца Гровера, представленному в одобренной истории главным образом церемониями.\n\nГровер хочет увидеть бумаги. Наставники предлагают вместе выслушать переводчиков, инженеров и свидетелей; секретариат — отобранный рассказ и технические занятия. Розалин и Монтагу предстоит решить, сколько разногласий допустит их двор. Любовь к отцу ещё не определяет, кому позволено говорить о его правлении."
 hsm_ver_grover.5.romance.d:0 "Розалин выслушивает прошение мельника на обоих придворных языках. Монтаг сверяется с окружным реестром: хартия гарантирует разбирательство, но дом, владеющий мельницей, ссылается на более древнюю привилегию. Его представитель напоминает обоим правителям, сколь многим соглашение обязано поддержке его семьи.\n\nГровер узнаёт название дома по бумагам своего отца. Он спрашивает, где в хартии записано это исключение.\n\nОтветить должен общий двор. Допустить разбирательство — значит подчинить полезного сторонника закону; защитить его привилегию — заставить просителя расплатиться за чужую преданность."
 hsm_ver_grover.6.romance.d:0 "Монтаг приносит планы окружных офицеров, Розалин — жалобы на реквизированные повозки. Гровер спрашивает, как союзные армии могут выполнять обещания, если их офицеры даже не говорят на одном языке.\n\nОдна программа проведёт его через переводческие бюро, склады и госпитали. Другая предложит планирование территориальной обороны и ответственность за приказы местным войскам. В обеих найдётся работа и для штабных архивов Эйри, и для переводчиков Эри.\n\nРозалин и Монтагу предстоит выбрать, какую службу обеспечит их двор. Со временем Гровер будет отвечать за нужды независимой страны, в том числе за те, которых не видно на параде."
 hsm_ver_grover.7.romance.d:0 "Розалин сверяет статьи о передаче власти на обоих придворных языках, пока Монтаг проверяет окружные и военные ведомости. Секретарь предлагает сохранить за ними право утверждать имперские назначения. Гровер спрашивает, какая корона тогда будет править Герцландом.\n\nОкончательные статьи такого права не оставляют. Независимая Империя получит оговорённые ресурсы и станет союзницей Верении; Верения сохранит собственную страну, офицеров и флот.\n\nРозалин ставит подпись и передаёт перо Монтагу. Они вместе приняли мандат от имени общей короны. Теперь оба должны обязать её отказаться от власти, которую обещали считать временной."
 hsm_ver_grover.10.romance.d:0 "На коронации Гровера Розалин зачитывает заключительный акт на обоих придворных языках. Монтаг передаёт завершённые окружные и военные отчёты. Две подписи вместе закрывают мандат; ни для одной не оставлено места под будущими приказами императора.\n\nГерцланд и обещанные ресурсы теперь принадлежат независимой союзной Империи. Верения сохраняет свои земли, офицеров и флот, а на печать канцелярии возвращается её обычное имя.\n\nГровер принимает имперские бумаги. Розалин и Монтаг оставляют ему право править и увозят домой прошения, которым по-прежнему нужны обе их подписи."
