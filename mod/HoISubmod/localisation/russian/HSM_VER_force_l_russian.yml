l_russian:
 hsm_ver_force.1.t:0 "Сосед после войны"
 hsm_ver_force.1.d:0 "Посланник правительства [From.GetNameDef] ждал, пока министры Авиана изучали предложение. Победа над соперничающим домом изменила соотношение сил за нашей границей. Ответа с этой стороны она не дала.\n\nПредлагаемое соглашение установило бы предел притязаниям победителя: пакт о ненападении оставляет Авиану право управлять собой. Один министр приветствовал возможность сделать будущее границы спокойнее. Другой спрашивал, насколько можно доверять заверениям правительства, которое ещё разбирается с последствиями собственной войны. Рассказ посланника о победе не отвечал ни на один из этих вопросов.\n\nНаш ответ должен отражать обязательство, которое мы готовы принять. Мы можем подписать пакт или отклонить его. Посланник привёз документ с местом для подписи Авиана и должен позволить нам оставить его пустым."
 hsm_ver_force.1.a:0 "Подписать соглашение о ненападении."
 hsm_ver_force.1.b:0 "Отклонить соглашение."
 hsm_ver_force.2.t:0 "Где заканчивается победа"
 hsm_ver_force.2.d:0 "Авиан принял соглашение о ненападении. Офицер, доставивший ответ, ожидал торжества; вместо этого первый вопрос касался распоряжений, которые следует отправить на границу. Теперь ответ имел значение по обе её стороны.\n\nСоглашение с независимым соседом отличается от взятой позиции. Авиан обязался соблюдать пакт от собственного имени и ждёт от нас такой же сдержанности. Его правительство, земли и будущее остаются в его распоряжении.\n\nОтвет направляют офицерам, ответственным за границу. За время кампании они научились развивать преимущество. Теперь мир требует от них понять, где это преимущество заканчивается. Новые распоряжения должны быть столь же понятными, как прежние приказы о наступлении."
 hsm_ver_force.2.a:0 "Соблюдать согласованную границу."
 hsm_ver_force.3.t:0 "Собственный ответ Авиана"
 hsm_ver_force.3.d:0 "Авиан отклонил предложенное соглашение. Посланник возвращается с неподписанным экземпляром и неудобной обязанностью объяснить: соседнее правительство прекрасно поняло предложение. Оно решило его не принимать.\n\nПри дворе спрашивают, не следует ли считать отказ оскорблением. Посланник не находит такого заявления в ответе. Авиан не принял новых обязательств; это оставляет дипломатическую неопределённость, а не очередную победу, которую остаётся забрать.\n\nДела, оставленные нашей собственной войной, никуда не исчезли. Имущественные споры требуют решений, войска ждут приказов, а жителям побеждённых округов нужно знать, как ими будут управлять. Ответ Авиана не освобождает нас ни от одной из этих обязанностей. Соседняя граница не может стать оправданием для промедления дома."
 hsm_ver_force.3.a:0 "Признать решение Авиана."

 HSM_VER_FORCE_avian_offer_tt:0 "Открывает выбор: §Yпредложить соглашение о ненападении§! независимому Авиану, находящемуся в мире, либо §Yне давать обязательств§!. Пакт возникает только после принятия предложения. Параллельное военное продолжение остаётся доступным, но подписанный пакт сначала потребуется прекратить обычным дипломатическим способом; совместное членство во фракции также должно закончиться. Оба варианта позволяют завершить внутреннее урегулирование."

 HSM_ERI_FORCE_avian_claim:0 "Третье знамя"
 HSM_ERI_FORCE_avian_claim_desc:0 "Совет Авиана выбрал истинный нейтралитет, отказавшись от работы между гигантами. Урегулирование Винсента с Эйри оставляет эту границу за пределами общей страны. Командиры предлагают поход ради присоединения Авиана. Это новое враждебное требование, а не право, тайно полученное по семейному договору. Действующие пакты придётся соблюдать либо прекращать открыто."
 HSM_EYR_FORCE_avian_claim:0 "Последняя граница"
 HSM_EYR_FORCE_avian_claim_desc:0 "Авиан выбрал истинный нейтралитет вместо Intergigantes. Офицеры Иовинуса считают его границу последним разрывом в Верении; гражданские советники слышат опасное обещание ещё одного похода перед окончательным миром. Герцог потребует присоединения открыто. Это требование не отменяет ни урегулирования с Эри, ни обязательств по действующему пакту."
 HSM_ERI_FORCE_avian_articles:0 "Авианские статьи"
 HSM_ERI_FORCE_avian_articles_desc:0 "Авианский регистратор привозит старые оценочные ведомости и список семей, чью собственность уже пообещали двум разным офицерам. Винсенту знаком этот спор. Третий Дом должен получить порядок, при котором можно жить: защищённые местные суды и права собственности либо комиссию, за которую герцог отвечает лично. Победа сама по себе не выбирает между ними."
 HSM_EYR_FORCE_avian_articles:0 "Приказы после капитуляции"
 HSM_EYR_FORCE_avian_articles_desc:0 "Гарнизон способен удержать мост, но не разрешить каждый спор, который через него приносят. Авианские служащие спрашивают, кто рассмотрит жалобы, оплатит мастерские и вернёт реквизированные повозки. Иовинусу предстоит решить, будут ли местные учреждения ограничивать его офицеров или за всё ответит постоянная комиссия. Правительству зависимого Авиана предложат гарантии, а не второй ультиматум под видом согласия."
 HSM_ERI_FORCE_avian_integration:0 "Третье место за столом"
 HSM_ERI_FORCE_avian_integration_desc:0 "Первые авианские счета выдержали сверку с казначейскими книгами. Мастерские получили договоры, суды знают, куда направлять решения. Теперь Винсент может упразднить временную границу, закрепив эти обязательства в обычном порядке управления. Третье место за его столом представляет жителей, которыми предстоит управлять, а не ещё одно побеждённое имя."
 HSM_EYR_FORCE_avian_integration:0 "Область, а не гарнизон"
 HSM_EYR_FORCE_avian_integration_desc:0 "Последний временный пункт снабжения готов стать постоянной мастерской. Иовинус получает его смету вместе с реестром авианских жалоб. Солдаты сделали всё, чего можно добиться походом; теперь присоединение держится на оплате труда, праве и ремонте. Временное управление пора завершить, но его обязательства не исчезнут вместе с вывеской."
 HSM_VER_FORCE_avian_peace_tt:0 "Нет действующего пакта о ненападении, общей фракции или неотвеченного предложения соглашения с Авианом; обычные дипломатические правила позволяют объявить войну. §YСначала прекратите действующий пакт или совместное членство во фракции через обычную дипломатию§!: этот фокус не отменяет их и не объявляет войну."
 HSM_VER_FORCE_avian_victory_tt:0 "Сохраняется наша хартия герцогств, военное урегулирование либо объединённое веренийское правительство. Мы воевали с независимым Авианом, наша сторона победила его, а конференция закрепила §Yисходную область 470§! за нами либо нашим побеждённым авианским подданным. Оба государства находятся в мире, область полностью контролируется владельцем, после конференции прошло 30 дней. Оккупация, подаренные земли и чужие подданные не подходят."
 HSM_VER_FORCE_avian_terms_tt:0 "Однократно расходует §Y75 политической власти§! на подготовку послевоенных статей. Если Авиан аннексирован, можно выбрать местную хартию или герцогскую комиссию. Наш побеждённый авианский подданный получит предложение присоединиться с гарантиями местных прав и сможет отказать; дополнительные владения не мешают предложению. Ратификация начинает §Y90-дневный переходный период§!, после которого открывается завершающий фокус интеграции. Сорванная доставка возобновляется без повторной оплаты."
 HSM_VER_FORCE_avian_articles_tt:0 "Авианские статьи ратифицированы, их 90-дневный переходный период завершён. Сохранившийся Авиан остаётся нашим собственным побеждённым подданным и явно согласился на присоединение именно к нынешнему сюзерену. Интеграция ещё не завершена."
 HSM_VER_FORCE_avian_integration_tt:0 "Присоединяет согласившегося побеждённого авианского подданного вместе с войсками и текущими владениями либо завершает управление землями, уже аннексированными на конференции. §YТолько исходная область Авиана, регион 470, становится нашей национальной территорией§!. Строит там одну гражданскую фабрику и заменяет переходное бремя выбранной хартией или комиссией. Земли независимых государств и чужих подданных не передаются."
 HSM_VER_FORCE_avian_subject_consent_tt:0 "Согласие на последующую аннексию нынешним сюзереном вместе с вооружёнными силами и дополнительными владениями при сохранении обязательных местных гарантий. Сюзерену ещё предстоят 90-дневный переходный период и завершающий фокус. Национальной становится только область 470. Отказ сохраняет нынешнее положение подданного и блокирует эту сюжетную аннексию; обычная интеграция подданных остаётся отдельной процедурой."
 HSM_VER_FORCE_AVI_transition:0 "Временное управление Авианом"
 HSM_VER_FORCE_AVI_transition_desc:0 "Жалобы, общественные счета и реквизиции необходимо согласовать до упразднения временной границы. До завершения присоединения эта работа занимает чиновников и отвлекает строительные мощности."
 HSM_VER_FORCE_AVI_charter:0 "Хартия Авианского округа"
 HSM_VER_FORCE_AVI_charter_desc:0 "Местные суды и договоры мастерских сохраняются после присоединения. Восстановление становится надёжнее, но жалобы и апелляции остаются обязательствами, от которых центральная власть не может просто отмахнуться."
 HSM_VER_FORCE_AVI_commission:0 "Авианская герцогская комиссия"
 HSM_VER_FORCE_AVI_commission_desc:0 "Единая комиссия согласует работу мастерских и военное снабжение. Её приказы действенны; её отдалённость от жителей остаётся источником недовольства."
 hsm_ver_force.4.t:0 "Неотправленное письмо"
 hsm_ver_force.4.d:0 "Перед [Root.GetLeader] лежат два черновика. Первый обещает Авиану границу, которую ни одна сторона не пересечёт с оружием. Второй не содержит никаких заверений.\n\nИнтендант поддерживает первый: его повозкам нужен ремонт, а не новое направление. Офицер указывает на карту и спрашивает, окажутся ли три Дома когда-нибудь под одной властью. Никто не притворяется, будто черновики означают одно и то же.\n\nОбещание Авиану должно быть обещанием, которое мы намерены сдержать. Можно отправить письмо, а можно не давать соседнему двору обязательств, пока мы устраиваем собственную страну."
 hsm_ver_force.4.a:0 "Отправить предложение о ненападении."
 hsm_ver_force.4.b:0 "Не давать обязательств о границе."
 hsm_ver_force.10.t:0 "Требование у наших дверей"
 hsm_ver_force.10.d:0 "Требование от государства [From.GetName] доставили вместе с картой, на которой границу уже стёрли. Посланник говорил о завершении распри Домов. Авианский чиновник спросил, почему распря, якобы завершённая в другом месте, теперь требует упразднения нашей власти.\n\nОбъявления войны к документу не приложили. Ещё есть время подвезти припасы, поговорить с союзниками и решить, что можно удержать. В караульном помещении, однако, различие между требованием и ожидаемыми вслед за ним боями мало кого утешает."
 hsm_ver_force.10.a:0 "Мы не сдавали свою страну."
 hsm_ver_force.11.t:0 "Хартия и последняя печать"
 hsm_ver_force.11.d:0 "Мир подчинил наше правительство государству [From.GetName], но не упразднил его. Теперь проект присоединения требует передать оставшуюся государственную печать, вооружённые силы и управление владениями.\n\nДокумент сохраняет местные суды, существующие права собственности и возможность обжаловать реквизиции. Победители оплатят общее управление и общественные работы, но обязаны признать, что гарантии связывают и их собственных офицеров. Служащие настояли, чтобы все отдалённые владения были прямо перечислены в соглашении, а не переходили в чьи-то лапы неожиданным приложением.\n\nМожно подписать статьи или остаться подданным на нынешних условиях. Это меньше прежней независимости, но право удержать подпись всё ещё принадлежит нам."
 hsm_ver_force.11.a:0 "Подписать, сохранив местные гарантии."
 hsm_ver_force.11.b:0 "Сохранить правительство на условиях нынешнего мира."
 hsm_ver_force.12.t:0 "Кто выслушает авианскую жалобу?"
 hsm_ver_force.12.d:0 "Изъятая мельница породила три дела: военную расписку, старую купчую и прошение работников. Занявший её офицер просит решения столицы. Служащий, принёсший прошение, спрашивает, существует ли ещё местный суд.\n\n[Root.GetLeader] не может ответить обоим продлением временного управления. Окружная хартия сохранит местные суды и договоры, а их решения станут обязательными для победивших чиновников. Герцогская комиссия возьмёт промышленность и снабжение под прямое управление, приняв и недовольство жителей, лишившихся последней привычной власти.\n\nВыбор касается третьего Дома, но о нём узнает каждый округ."
 hsm_ver_force.12.a:0 "Признать суды и подчинить им наших офицеров."
 hsm_ver_force.12.b:0 "Передать управление и снабжение единой комиссии."
 hsm_ver_force.13.t:0 "Печать остаётся в Авиане"
 hsm_ver_force.13.d:0 "Авианское правительство отклонило статьи о присоединении. В ответе признаются мир и подчинённое положение, но оставшуюся государственную печать оно передавать не намерено.\n\nНаши чиновники снимают расписание присоединения. Отказ не возвращает независимость и не позволяет сделать вид, будто подпись всё-таки получена. Авиан остаётся подданным на прежних условиях. Если позднее присоединение будет проведено обычным порядком отношений сюзерена и подданного, у него появится собственное основание; неподписанная хартия такого основания не даёт."
 hsm_ver_force.13.a:0 "Записать отказ. Без подписи нет присоединения по хартии."
 hsm_ver_force.14.t:0 "Первый обычный месяц"
 hsm_ver_force.14.d_charter:0 "Авианская мастерская присылает первый регулярный счёт. Рядом лежит судебное решение, обязывающее нашего офицера вернуть реквизированную повозку. Оба документа следуют одной почтой в казначейство.\n\nСекретарь спрашивает, нужно ли уделить решению особое внимание. [Root.GetLeader] оставляет его среди обычных счетов. Хартия мало чего стоила бы, если бы каждый невыгодный приговор требовал нового проявления личного великодушия.\n\nГраница исчезла. Спор остался, но теперь ему есть место за пределами поля боя."
 hsm_ver_force.14.d_commission:0 "Комиссия сообщает, что авианская мастерская выполнила первый регулярный заказ. Служба снабжения довольна: единое расписание связало три бывшие границы.\n\nВ следующем конверте жалуются уже на саму комиссию. Местным представителям пришлось просить столицу разрешить спор с чиновником, назначенным той же столицей. [Root.GetLeader] кладёт оба отчёта рядом.\n\nНовое управление работает. Это не значит, что жители приняли действенность приказов за возможность быть услышанными. Оба отчёта принадлежат истории этой победы."
 hsm_ver_force.14.a:0 "Сохранить в отчёте и достижение, и обязательство."

 HSM_ERI_FORCE_the_price_of_victory:0 "Цена победы"
 HSM_ERI_FORCE_the_price_of_victory_desc:0 "Сторонники Винсента охотно говорят о наследии, которое принесёт победа. Реже вспоминают хозяйства, которым предстоит её обеспечить, и обещания, которые герцогу придётся исполнить потом. Выбор этой кампании означает отказ от договорного урегулирования с Эйри: Верению решено объединить силой, и Эри придётся управлять последствиями. Офицеры, поставщики и покровители должны назвать свои ожидания до выступления первого полка."
 HSM_ERI_FORCE_promises_in_writing:0 "Письменные обещания"
 HSM_ERI_FORCE_promises_in_writing_desc:0 "Кампания требует кредита не меньше, чем мужества. Перевозчики предоставляют повозки, поставщики придерживают запасы, а влиятельные семьи ожидают, что их службу вспомнят при раздаче наград. Винсент потребует ясных обязательств и службы снабжения, способной их выполнять. Верность заслуживает ответа, но не может сама определять безграничные права на имущество побеждённых."
 HSM_ERI_FORCE_not_a_dowry:0 "Не приданое"
 HSM_ERI_FORCE_not_a_dowry_desc:0 "Розалин Эри из Бентри обнаружила, что её имя удобно завершает чужие речи. Союз домов, говорят ей, можно было бы скрепить через неё. Она намерена говорить за себя. Винсент должен выслушать возражение прежде, чем кто-нибудь превратит личную переписку в брачный договор или представит чужое будущее частью военной добычи."
 HSM_ERI_FORCE_final_ultimatum:0 "Последний ультиматум"
 HSM_ERI_FORCE_final_ultimatum_desc:0 "Винсент подкрепит притязания Эри последним требованием к Эйри. Документ не сделает его наследственные права убедительнее прав Иовинуса, но подготовит основания, на которых он намерен сражаться. Действующие обещания мира по-прежнему должны соблюдаться. Отправка требования оставляет решение начать войну и ответственность за это решение за самим герцогом."
 HSM_ERI_FORCE_terms_for_the_defeated:0 "Условия для побеждённых"
 HSM_ERI_FORCE_terms_for_the_defeated_desc:0 "Военный исход определён. Теперь жителям побеждённых округов предстоит узнать, что означает победа Винсента у дверей мастерской или в споре о поле. Местные хартии могут защитить права, обязательные и для его сторонников. Герцогские комиссары могут вместо этого устроить управление под его прямой властью. Каждый путь потребует обязательств, которые торжественное воззвание способно скрыть лишь ненадолго."
 HSM_ERI_FORCE_district_charters:0 "Собственные права округов"
 HSM_ERI_FORCE_district_charters_desc:0 "Обещанными местными правами должен иметь возможность воспользоваться и противник Эри. Сохраним признанные порядки разрешения имущественных споров, общественных работ и жалоб, обязательные также для герцогских служащих. Согласование работ с местными учреждениями потребует терпения. Оно даст городу причину восстанавливать своё будущее без предварительного поиска покровителя при дворе Винсента."
 HSM_ERI_FORCE_ducal_commissioners:0 "Герцогские комиссары"
 HSM_ERI_FORCE_ducal_commissioners_desc:0 "Винсент поручит восстановление комиссарам, отвечающим прямо перед ним. Они смогут объединить разрозненные промышленные работы и быстрее доводить распоряжения до исполнителей. Их полномочия также сделают каждое вмешательство поступком самого герцога. Если жители не смогут влиять на решения комиссаров, одно лишь быстрое исполнение приказов не завоюет их доверия."
 HSM_ERI_FORCE_the_first_petition:0 "Первое прошение"
 HSM_ERI_FORCE_the_first_petition_desc:0 "Семья из побеждённых округов претендует на поместье, которого добивается один из военных покровителей Винсента. Покровитель может доказать свою службу; семья может представить свидетельства того, что её имущество никогда не предназначалось ему в награду. Первое трудное слушание покажет, способен ли новый порядок отличить долг герцога от долга, возложенного на другого."
 HSM_ERI_FORCE_reconstruction_contracts:0 "Работа после победного парада"
 HSM_ERI_FORCE_reconstruction_contracts_desc:0 "Решение о поместье разошлось дальше, чем ожидали его авторы. Строители и владельцы мастерских теперь судят о новых предложениях по тому, что узнали об установленном порядке. Подкрепим подряды гражданскими вложениями и дадим промышленным специалистам достойную работу. Прочному миру нужны люди, готовые рисковать сбережениями ради чего-то помимо благосклонности очередного победоносного офицера."
 HSM_ERI_FORCE_a_regular_levy:0 "Войско, которое можно содержать"
 HSM_ERI_FORCE_a_regular_levy_desc:0 "Военная служба не может навсегда остаться чередой личных сделок. Введём регулярную подготовку и надёжное вооружение войск, с обязанностями, понятными за пределами дома покровителя. Тем, кто сражался за Эри, нужно знать, чего требует нынешняя служба. Округам, которым предстоит их содержать, нужен ответ определённее вечного продолжения чрезвычайных обстоятельств."
 HSM_ERI_FORCE_the_third_house:0 "Сверить гражданские реестры"
 HSM_ERI_FORCE_the_third_house_desc:0 "Победивший двор не сможет управлять двумя герцогствами по несовместимым налоговым спискам и противоречащим друг другу записям о собственности. Землемеры, писари и инженеры сведут реестры прежде, чем новая администрация заговорит от имени каждого округа."
 HSM_ERI_FORCE_a_bound_duke:0 "Герцог, связанный своим словом"
 HSM_ERI_FORCE_a_bound_duke_desc:0 "Винсент сделает гарантии округам обязательными для собственной власти. Если он защитил передачу поместья своему покровителю, это исключение придётся отменить и вернуть спор на доказательное рассмотрение. Если он уже поддержал слушание, его принцип должен пережить отдельное дело. Хартии станут основой управления лишь тогда, когда их действие распространится на подписавшего их герцога."
 HSM_ERI_FORCE_a_single_chancery:0 "Единая канцелярия"
 HSM_ERI_FORCE_a_single_chancery_desc:0 "Объединим комиссаров в постоянную герцогскую администрацию. Промышленность и армия будут отвечать через общую вертикаль, давая Винсенту больше возможностей проводить решения в жизнь. Принятое решение о поместье останется частью этого порядка. Центральная власть способна защитить справедливое слушание или сохранить преимущество покровителя; она делает герцога ответственным за любой оставленный им прецедент."
 HSM_ERI_FORCE_inheritance_without_feud:0 "Наследство следующего поколения"
 HSM_ERI_FORCE_inheritance_without_feud_desc:0 "Дети, растущие при установленном Винсентом порядке, унаследуют больше, чем рассказ о сражении. Им достанутся ответ семье, потерявшей имущество, пределы дозволенного стороннику и привычки управляющих ими учреждений. Пусть старое военное соперничество окончится без притворства, будто победа стёрла его последствия или решила будущее Авиана."

 HSM_ERI_FORCE_war_obligations:0 "Обязательства кампании"
 HSM_ERI_FORCE_war_obligations_desc:0 "Ясные обязательства перед поставщиками и сторонниками ускоряют мобилизацию и планирование. Их соблюдение ограничивает политическую свободу Винсента: кампания расходует обещания так же, как припасы, и те, кто предоставляет и то и другое, рассчитывают остаться в памяти."
 HSM_ERI_FORCE_defeated_rights:0 "Права побеждённых"
 HSM_ERI_FORCE_defeated_rights_desc:0 "Местные гарантии дают побеждённым округам основания доверять восстановлению и возобновлять строительство. Соблюдение их прав укрепляет стабильность ценой части свободы действий герцога. Эти гарантии должны выдерживать требования победителей так же, как жалобы проигравших."
 HSM_ERI_FORCE_central_commissions:0 "Герцогские комиссии"
 HSM_ERI_FORCE_central_commissions_desc:0 "Комиссары Винсента согласуют военную организацию и промышленный выпуск посредством прямой власти. Их способность выполнять работу сопровождается недовольством тех, от кого ждут исполнения указаний без сопоставимого голоса в их составлении."
 HSM_ERI_FORCE_chartered_union:0 "Герцогское управление по хартиям"
 HSM_ERI_FORCE_chartered_union_desc:0 "Власть Винсента над устроенными округами связана их хартиями. Предсказуемые обязательства укрепляют стабильность, строительство и бережное снабжение армии, ограничивая политическое усмотрение герцога. Этот порядок касается Эри и его побеждённого соперника; власти над Авианом он не даёт."
 HSM_ERI_FORCE_ducal_administration:0 "Объединённая герцогская администрация"
 HSM_ERI_FORCE_ducal_administration_desc:0 "Постоянная центральная администрация сосредотачивает промышленную работу, военную организацию и политические полномочия в руках герцога. Винсент способен настойчивее проводить решения, но управляемые округа тревожит, как мало стоит между его благосклонностью и их судьбой."
 HSM_ERI_FORCE_patron_claims:0 "Награда покровителю"
 HSM_ERI_FORCE_patron_claims_desc:0 "Винсент наградил военную службу спорным поместьем. Его боевые сторонники черпают уверенность в этой верности. Остальные видят правительство, чьи обещания зависят от возможности попасть в нужную часть приёмного зала; это ослабляет стабильность и расходует политический авторитет."
 HSM_ERI_FORCE_equal_judgement:0 "Слушание даже против победителя"
 HSM_ERI_FORCE_equal_judgement_desc:0 "Притязание на поместье должно опираться на доказательства, даже когда оно оспаривает интересы герцогского покровителя. Уверенность в собственности и управлении укрепляет стабильность и рост эффективности производства. Служба Эри остаётся обязательством, за которое должен расплачиваться Эри, не превращая в плату другое хозяйство."
 HSM_ERI_FORCE_supply_bonus:0 "Обязательства снабжения кампании"
 HSM_ERI_FORCE_district_bonus:0 "Методы восстановления округов"
 HSM_ERI_FORCE_commission_bonus:0 "Промышленная программа комиссаров"
 HSM_ERI_FORCE_reconstruction_bonus:0 "Гражданские подряды на восстановление"
 HSM_ERI_FORCE_levy_bonus:0 "Вооружение регулярного войска"

 hsm_ver_eri_force.1.t:0 "Те, кто стоит рядом со знаменем"
 hsm_ver_eri_force.1.d:0 "Собрание в зале Винсента началось с тоста за его наследие. Первыми поднялись офицеры, за ними представители семей, снабжавших их роты. Купец в глубине зала задержался на стуле, чтобы закончить сложение столбца цифр.\n\nВинсент заметил это. Когда речи закончились, он спросил, что купец счёл более неотложным. Наём повозок, последовал ответ, и зерно, купленное под заверение, что службу Эри не забудут. Эта фраза встречалась в нескольких бумагах, которые теперь несли герцогу.\n\nВинсент слышал, как его дело называли долгом каждого присутствующего. Теперь он услышал, что присутствующие считали его долгом перед ними. Его права на Верению были не убедительнее прав Иовинуса. Сила могла решить вопрос владения, но эти ожидания останутся рядом с победителем. Он попросил купца задержаться."
 hsm_ver_eri_force.1.a:0 "Нужно понять и требования своих сторонников."
 hsm_ver_eri_force.2.t:0 "Чего стоит служба"
 hsm_ver_eri_force.2.d:0 "Покровитель армии принёс Винсенту перечень предоставленных повозок, припасов и кредитов. Итоговая сумма скромностью не отличалась. Под ней он написал название поместья за прежней границей.\n\nВинсент спросил, предлагал ли владелец продать его. Покровитель рассмеялся, затем понял, что вопрос серьёзен. Он полагал, что поддержка герцогского дела принесёт соответствующую награду. Поместье казалось соответствующей наградой.\n\nОжидавший следом поставщик просил другого: ясного обещания оплаты со сроками, которые можно показать собственным кредиторам. Интендант заметил, что такие обещания облегчат доставку грузов.\n\nВинсент велел записать обязательства. Поместья он не обещал. Сторонники заслуживали понимания того, что принесёт их служба; каждый из них не мог самостоятельно выбирать хозяйство, которому придётся за неё расплачиваться. Казне предстояло отвечать по долгам, которые действительно принял Эри."
 hsm_ver_eri_force.2.a:0 "Записать долг, а не разрешение забирать чужое."
 hsm_ver_eri_force.3.t:0 "Ответ Розалин"
 hsm_ver_eri_force.3.d:0 "Розалин обнаружила своё имя в середине проекта речи. Предложение начиналось примирением и заканчивалось браком, о котором её никто не просил подумать. Она прочла его Винсенту вслух, включая лестное описание её готовности.\n\nСоставитель сказал, что это лишь предложение. Розалин спросила, почему для предложения требуется описывать её согласие как уже полученное. Он начал объяснять значение союза домов. Она перебила: он может объяснить собственное понимание союза, не предлагая её в доказательство.\n\nЕё переписка с Монтагом принадлежала ей самой. Победоносный двор не мог обещать её продолжения, а имя на конверте не гарантировало выбора адресата. Винсент отправил речь на переработку. Розалин сохранила оскорбительную страницу. Она хотела, чтобы следующий составитель понял, почему её убрали."
 hsm_ver_eri_force.3.a:0 "Её будущее решать ей самой."
 hsm_ver_eri_force.4.t:0 "Дверь после стука"
 hsm_ver_eri_force.4.d:0 "В побеждённых округах пекарь открыл дверь герцогскому офицеру и спросил, можно ли по-прежнему пользоваться городскими гирями. Офицер знал, какое знамя развевается над площадью. Ответа о гирях он не знал.\n\nПодобные вопросы поступали Винсенту от землевладельцев, ремонтных бригад и служителей местных судов. В прошениях было мало восхищения победой и много интереса к тому, что произойдёт дальше. Сторонники убеждали его заменить ненадёжные власти комиссарами, обязанными должностью ему. Приказы пойдут быстрее; армия и её мастерские будут знать, кому подчиняться.\n\nДругой путь состоял в признании прав округов, обязательных и для победителей. Он обещал больше доверия к восстановлению, оставляя герцогу меньше свободы разрешать любую трудность приказом. Винсент получил власть над дверью. Теперь ему предстояло решить, как его офицеры будут в неё входить."
 hsm_ver_eri_force.4.a:0 "Сохранить права и учреждения округов."
 hsm_ver_eri_force.4.b:0 "Управлять через герцогских комиссаров."
 hsm_ver_eri_force.5.t:0 "Два притязания на один сад"
 hsm_ver_eri_force.5.d_rights:0 "В поместье был фруктовый сад. Заявители принесли договоры аренды, старые расписки и рисунок с указанием заменённых деревьев. Покровитель Винсента принёс отчёт о своей военной службе. Герцог узнал название владения прежде, чем заговорила любая из сторон.\n\nПредставитель округа попросил рассмотреть доказательства по гарантированным теперь правам. Поражение, утверждал он, не могло само по себе передать семейную собственность тому стороннику, которого удобнее всего наградить. Покровитель спросил Винсента, неужели солдат и поставщиков, поддержавших его дело, всегда будут отправлять прочь с назначением ещё одной встречи.\n\nОба смотрели на герцога. Он обещал сторонникам ответ, а округам права. Доказательное слушание защитит второе, не отрицая службы первых. Передача поместья вместо этого покажет покровителям, что их верность важнее защиты, предложенной всем остальным."
 hsm_ver_eri_force.5.d_central:0 "Комиссар ожидал простого дела. Военный покровитель хотел получить поместье в награду; Винсент разрешил прямое управление побеждёнными округами. Затем семья принесла договоры и расписки и спросила, какие из них перестали иметь значение.\n\nСад продолжал плодоносить. Работникам нужно было знать, кому платить и сохраняются ли договорённости о следующем урожае. Управляющий покровителя уже предложил указания. Комиссар ещё не давал ему права это делать.\n\nВинсент мог потребовать проверки соперничающих притязаний по доказательствам. Его комиссары узнали бы, что прямое правление тоже требует обоснованного суждения. Или он мог передать поместье за службу Эри, предоставив боевым сторонникам ожидаемую награду. Одна и та же центральная власть способна исполнить любое решение. Сделать их последствия одинаковыми она не может."
 hsm_ver_eri_force.5.a:0 "Потребовать слушания на основании доказательств."
 hsm_ver_eri_force.5.b:0 "Передать поместье нашему военному покровителю."
 hsm_ver_eri_force.6.t:0 "Что усвоили округа"
 hsm_ver_eri_force.6.d_court:0 "Место покровителя за ужином пустовало. Его управляющий прислал безупречно холодное подтверждение слушания по поместью и очередную просьбу исполнить оставшиеся обязательства герцога. Винсент не мог притворяться, будто решение ничего ему не стоило.\n\nВ другом месте владелец мастерской согласился заменить повреждённое оборудование. Окружной чиновник сообщил, что прежде вложения сбережений хозяин спрашивал о саде. Если доказательства можно выслушать против сторонника победившей армии, рассуждал он, значит, есть смысл сохранять и собственные расписки.\n\nСлушание не заставило побеждённые округа полюбить новую власть. Оно сделало одно обещание пригодным к использованию. Винсент велел без промедления проверить законные счета покровителя. Отказ расплачиваться чужим имуществом не стирал действительных долгов Эри. Этому различию предстояло пережить больше одного дела."
 hsm_ver_eri_force.6.d_patron:0 "Покровитель приехал с хорошими новостями от офицеров. Они увидели, что Винсент помнит стоявших рядом с его знаменем. Передачу сада называли доказательством того, что верная служба по-прежнему приносит весомую награду.\n\nДонесение из округа было менее радостным. Владелец мастерской отложил замену повреждённого оборудования, спросив, не сделает ли новая крыша его помещение более привлекательным вознаграждением. Прежние заявители продолжали подавать бумаги. Их настойчивость управляющий покровителя начинал описывать как нарушение порядка.\n\nВинсент прочёл оба донесения. Он приобрёл уверенность сторонников, чья сила оставалась полезной, и унаследовал их потребность защищать полученное. Каждый чиновник, отправленный объяснять награждение, теперь тратил герцогский авторитет на объяснение того, почему другие доказательства не возобладали. Поместье было одним владением. Урок расходился дальше."
 hsm_ver_eri_force.6.a:0 "Вот чему научило их наше решение."
 hsm_ver_eri_force.7.t:0 "Устройство власти Винсента"
 hsm_ver_eri_force.7.d_rights:0 "При чтении окружных хартий представитель спросил, можно ли вызвать для ответа на жалобу собственных чиновников герцога. Винсент сказал, что можно. Представитель попросил включить ответ в текст, чтобы чиновник нашёл его, не полагаясь на чужую память.\n\nСлушание по поместью показало, что может означать гарантия. Теперь хартии делали это обязательство частью постоянного устройства. Винсент будет править округами, но их признанные права ограничат способы награждать друга, требовать припасы или отклонять возражение.\n\nОн наблюдал, как представитель проверяет изменённое положение. В этом жесте не было благодарности, лишь внимательность человека, получающего защиту, которой намерен пользоваться. Винсент хотел наследство. Теперь он принимал, что для его сохранения иногда придётся давать ответ, которого хотелось бы избежать."
 hsm_ver_eri_force.7.d_reversed:0 "Покровитель узнал название поместья сразу после начала чтения нового распоряжения. Он спросил Винсента, стала ли его служба менее ценной. Герцог ответил, что хартии ничего не стоят, если эта служба позволяет находиться вне их действия.\n\nИсключительную награду отменили. Соперничающие притязания вернутся к доказательному слушанию, а законные военные счета покровителя будут рассматриваться как обязательства Эри. Он ушёл до конца чтения.\n\nПредставительница семьи не поблагодарила Винсента. Она спросила, останется ли прежнее решение в деле. Оно останется. Новые гарантии могут отныне связать герцога, но не способны превратить защищённую им передачу имущества в несправедливость, которой он никогда не совершал.\n\nКогда окружные хартии подписали, отмену приложили к ним. Каждый, кто полагается на обещание, сможет увидеть и его нарушение, и то, чем пришлось пожертвовать его автору."
 hsm_ver_eri_force.7.d_central:0 "Комиссары прибыли ко двору с делами, которые уже нельзя было считать временным поручением. Фабрикам требовались постоянные заказы, армии надёжный порядок, а округам понимание того, кто вправе отменить чьё решение. Винсент дал комиссиям постоянное место в единой герцогской администрации.\n\nРешение о поместье сохранилось. Новые ведомства будут исполнять выбранный исход, а не подменять его более удобной историей. Любой, кто захочет иного ответа, найдёт власть, ответственную за первый, во главе той же вертикали.\n\nТеперь подпись Винсента могла достигать более далёких мест и давать более последовательный результат. Он понимал, почему офицеры приветствуют это. Понимал и вопрос окружного представителя: как жалоба на этих офицеров вообще попадёт к нему? Централизация сделала вопрос настоятельнее и безусловно адресовала его самому герцогу."
 hsm_ver_eri_force.7.a:0 "Пусть наша власть несёт свои обязательства."
 hsm_ver_eri_force.8.t:0 "Цвета в школьном классе"
 hsm_ver_eri_force.8.d:0 "Учитель сохранил два лоскута мундирного сукна для урока о вражде. Ученик хотел знать, объясняют ли цвета, кому принадлежит сад. Учитель ответил: они объясняют, почему вопрос стал трудным, но не дают ответа.\n\nВинсент услышал эту историю во время поездки по округу. Годами его сторонники говорили так, словно обладание наследством определит его смысл. Теперь дети росли среди решений, принятых им после боёв: как слушают жалобу, чья награда важнее и чего вправе требовать офицеры.\n\nЭтот порядок отвечал за побеждённые округа и ничего не обещал от имени Авиана. Винсент мог закончить официальное соперничество, но не приказать следующему поколению вспоминать его правление добром. У них будут собственные доказательства, собранные много позже того дня, когда уберут знамёна."
 hsm_ver_eri_force.1.victory.d:0 "Победные знамёна уже убрали, когда сторонники Винсента вернулись в зал. Это собрание началось без тоста. Купец разложил счета за наём повозок, зерно и предоставленный армии кредит. Рядом покровитель спросил, когда рассмотрят награды за верную службу.\n\nВинсент добился военного результата. Мир не расплатился ни с одним из них. Во время кампании обещания позволяли офицерам получать то, чего они не могли сразу купить; теперь обещания явились вместе, каждое рассчитывая стать первым.\n\nГерцог попросил управляющего принести первоначальные обязательства. Его притязание победило силой, не сделав наследственные права соперника менее действительными. В округах, которыми предстояло управлять, жили семьи с собственными обязанностями и ожиданиями. Прежде чем решать, что победа даст сторонникам, ему придётся решить, чего она позволяет требовать от всех остальных."
 hsm_ver_eri_force.2.victory.d:0 "Покровитель снова принёс счёт, который вёл всю войну. Несколько поставок несли торопливую расписку интенданта. Обещанная плата за ними не последовала. Внизу страницы стояло название поместья в побеждённых округах.\n\nВинсент спросил, было ли владение заложено в каком-либо из обязательств. Покровитель ответил, что ожидал от герцога памяти о тех, кто сделал победу возможной. Он помнил. Это не устанавливало, кому принадлежит сад.\n\nПоставщик, ожидавший позади, просил сроков для своих кредиторов. Его дело пережило кампанию благодаря доверию к слову Эри, и победа начинала напоминать очередную отсрочку.\n\nВинсент велел сопоставить неисполненные обещания с поставками. Офицерам снабжения нужна служба, способная закрывать счета после войны. Нельзя оплачивать мир, позволяя каждому неоплаченному стороннику выбирать чужую землю."
 hsm_ver_eri_force.8.a:0 "Они унаследуют то, что мы сделаем обыденным."

 HSM_EYR_FORCE_the_last_campaign:0 "Последняя кампания"
 HSM_EYR_FORCE_the_last_campaign_desc:0 "Офицеры Иовинуса обещают кампанию, которая наконец сделает постоянную бдительность ненужной. Он понимает привлекательность этой мысли и знает, как охотно штаб находит причины оставаться незаменимым. Выбор их кампании закрывает договорный путь с Эри. Герцогу предстоит определить, чего Эйри добьётся силой и от чего собственному командованию придётся отказаться потом, чтобы победа стала чем-то большим, чем очередная мобилизация."
 HSM_EYR_FORCE_break_the_rival_line:0 "Прорвать позиции соперника"
 HSM_EYR_FORCE_break_the_rival_line_desc:0 "Притязание Эйри не убедило Эри уступить. Иовинус подготовит требование, подкреплённое возможностью войны, принимая ответственность за борьбу, которую не способна разрешить одна родословная. Действующий мир по-прежнему следует соблюдать. Подготовка даёт основания сражаться с соперничающим домом; решение отправить армию остаётся отдельным и сознательным поступком."
 HSM_EYR_FORCE_field_liaison:0 "Приказы доходят до колонны"
 HSM_EYR_FORCE_field_liaison_desc:0 "Хороший приказ, пришедший поздно, может оказаться менее полезным, чем плохой, но уже понятый. Подготовим офицеров связи, чтобы штаб, инженеры и походные колонны одинаково представляли обстановку. Практическая работа со связью поможет Иовинусу выяснить, где уверенность командования опережает его знания, и даст войскам больше шансов получить выполнимые указания."
 HSM_EYR_FORCE_supply_the_columns:0 "Снабжение походных колонн"
 HSM_EYR_FORCE_supply_the_columns_desc:0 "Интенданты не могут накормить колонну заверением, что другой округ должен был прислать повозки. Улучшим планы погрузки, обслуживание транспорта и способы сообщать о нехватке. Армейские требования проходят через деревни и мастерские прежде, чем достигают склада. Понимание этого пути пригодится, когда те же места спросят, что изменилось с окончанием кампании."
 HSM_EYR_FORCE_victory_and_the_garrison:0 "Победа и гарнизон"
 HSM_EYR_FORCE_victory_and_the_garrison_desc:0 "Армия соперника разбита, территориальные условия мира установлены. Офицеры Эйри всё ещё могут назвать причину сохранять чрезвычайное командование в каждом округе. Иовинусу предстоит решить, вернуть ли обычное управление и хозяйственную жизнь гражданским властям или сделать военную опеку основой нового порядка. Ни одно решение само по себе не устроит судьбы тех, кто ждёт за воротами штаба."
 HSM_EYR_FORCE_montagues_unsent_reply:0 "Неотправленный ответ Монтага"
 HSM_EYR_FORCE_montagues_unsent_reply_desc:0 "У Монтага есть незаконченный ответ на старое письмо Розалин и вопрос к Иовинусу: должны ли личные слова по-прежнему получать военное одобрение? Ответ коснётся не только этой переписки. Гражданская почта позволит передавать знания и вести обычные дела ценой постоянных административных усилий. Надзор командования сохранит полезность связи для штаба, напоминая каждому автору о возможном читателе в мундире."
 HSM_EYR_FORCE_publish_release_schedule:0 "Сроки возвращения домой"
 HSM_EYR_FORCE_publish_release_schedule_desc:0 "Прекращению чрезвычайного управления нужны сроки, на которые смогут опереться мастерские и семьи. Опубликуем график возвращения гражданских помещений и обязанностей и подготовим строительные работы, необходимые для их использования. Иовинусу придётся принимать просьбы без дисциплины военного донесения и отвечать тем, кто больше не ждёт его следующего приказа."
 HSM_EYR_FORCE_district_commands:0 "Окружные командования"
 HSM_EYR_FORCE_district_commands_desc:0 "Гарнизон останется учреждением власти. Поручим окружным командирам постоянные обязанности по согласованию работы, снабжению и боеготовности, подготовив для них штабных специалистов. Их компетентность может придать управлению надёжный ритм. Она также внесёт военную власть в решения, которые жители иначе принимали бы без просьбы о разрешении."
 HSM_EYR_FORCE_workshops_after_war:0 "Работа, ожидающая после войны"
 HSM_EYR_FORCE_workshops_after_war_desc:0 "Прошло достаточно времени, чтобы выбранный порядок столкнулся с обычными нуждами. При гражданской администрации возвращающимся резервистам нужны обучение и помещения, прежде чем служба превратится в ремесло. При военном управлении гражданский ремонт соперничает с армейскими заказами за станочное время. Выслушаем доклады мастерских и решим, кто понесёт цену перехода."
 HSM_EYR_FORCE_useful_trades:0 "Полезные ремёсла"
 HSM_EYR_FORCE_useful_trades_desc:0 "Бывший солдат может принести в мастерскую терпение, умение и уверенность, не зная, как обращаться с её станками. Расширим гражданское производство и необходимые ему промышленные знания. Программа должна опираться на ответ, уже данный возвращающимся резервистам; одно новое здание не заставит исчезнуть необеспеченное обещание обучения."
 HSM_EYR_FORCE_permanent_district_staff:0 "Постоянный окружной штаб"
 HSM_EYR_FORCE_permanent_district_staff_desc:0 "Военным округам нужно больше, чем череда временных отрядов. Создадим постоянные штабы и мастерские, способные обслуживать необходимое для их распоряжений снаряжение. Этот порядок сделает командование надёжнее, тесно связав промышленную работу с его нуждами. Гражданским контрактам, где они разрешены, всё ещё придётся искать место внутри этой иерархии."
 HSM_EYR_FORCE_avians_border:0 "Реестры для округов"
 HSM_EYR_FORCE_avians_border_desc:0 "Гарнизонный рапорт не заменяет гражданского реестра. Иовинус приказывает окружным управлениям согласовать записи о собственности, налоговые списки и транспортные карты: двумя герцогствами пора управлять как страной, а не временными владениями армии."
 HSM_EYR_FORCE_inspections_not_parades:0 "Проверить рабочий день"
 HSM_EYR_FORCE_inspections_not_parades_desc:0 "Подготовленный парад показывает Иовинусу, что округ способен устроить к его приезду. Обычный рабочий день расскажет больше о созданном им порядке. Изучим поставки и расписания мастерских, затем приедем, дав чиновникам время выполнить указания. Важно то, что происходит, когда никто не ожидает взгляда герцога."
 HSM_EYR_FORCE_road_that_stays_open:0 "Дорога остаётся открытой"
 HSM_EYR_FORCE_road_that_stays_open_desc:0 "Дорога, по которой шла кампания, теперь служит другим поездкам. Улучшим её будущее с помощью строительных знаний, собранных при устройстве мира, и посмотрим на привычки, складывающиеся вдоль неё. Иовинус хотел окончательной победы. Её смысл проявится в том, смогут ли путники оставить чрезвычайное положение позади или лишь переходить от одного разрешения к следующему."

 HSM_EYR_FORCE_civilian_release:0 "График возвращения к гражданской жизни"
 HSM_EYR_FORCE_civilian_release_desc:0 "Обычное управление и хозяйственные обязанности возвращаются в гражданские руки. Доверие укрепляет стабильность и строительство гражданских фабрик, а армия утрачивает часть организационных преимуществ постоянного чрезвычайного положения."
 HSM_EYR_FORCE_military_government:0 "Военная опека над округами"
 HSM_EYR_FORCE_military_government_desc:0 "Округами управляют постоянные командования. Они укрепляют организацию армии и планирование, но гражданская жизнь вынуждена содержать дорогостоящий военный аппарат. Нагрузка на производство потребительских товаров и потеря стабильности сопровождают порядок, который Иовинус решил сохранить."
 HSM_EYR_FORCE_open_correspondence:0 "Почта за пределами штаба"
 HSM_EYR_FORCE_open_correspondence_desc:0 "Частная гражданская переписка может обращаться без заверения командира. Знания распространяются свободнее, помогая исследованиям. Надёжная служба вне военного контроля требует постоянного политического внимания."
 HSM_EYR_FORCE_supervised_correspondence:0 "Подпись командира"
 HSM_EYR_FORCE_supervised_correspondence_desc:0 "Командование продолжает надзирать за перепиской. Знакомство с движением сведений помогает планированию, а знание о проверке личных слов усиливает общественное недоверие и ослабляет стабильность."
 HSM_EYR_FORCE_unplaced_reservists:0 "Резервисты без ремесла"
 HSM_EYR_FORCE_unplaced_reservists_desc:0 "Гражданские управы должны принять возвращающихся резервистов без обещанных центральных вложений в обучение и рабочие места. Неуверенность в заработке ослабляет стабильность и замедляет строительство гражданских фабрик. Приказ об увольнении освободил от одной обязанности, не дав средств начать другую жизнь."
 HSM_EYR_FORCE_military_production_priority:0 "Первое право армии на производство"
 HSM_EYR_FORCE_military_production_priority_desc:0 "Командование отводит станочное время военным заказам. Выпуск вооружения растёт, а строительство гражданских фабрик отстаёт. Правительство решило прежде всего обеспечить боеготовность, оставив обычному ремонту и вложениям борьбу за оставшиеся часы."
 HSM_EYR_FORCE_contracted_workshops:0 "Гражданские контракты при военном управлении"
 HSM_EYR_FORCE_contracted_workshops_desc:0 "Согласованные контракты дают гражданским мастерским определённое место в военном порядке. Надёжность снабжения сокращает потери и помогает росту эффективности производства. Поддержание договорённости требует постоянных политических усилий и не отменяет окружных командований."
