 hsm_ver_eyr_force.1.t:0 "Ещё одна последняя кампания"
 hsm_ver_eyr_force.1.d:0 "Офицер назвал её последней кампанией. Иовинус дал ему закончить, затем спросил, как штаб узнает, что она последняя. Ответ касался позиций, дорог и резервов Эри. О собственных чрезвычайных приказах Эйри он ничего не говорил.\n\nИз открытого окна доносился шум повозки, ожидавшей у военных ворот. Вознице требовалось разрешение забрать инструменты из реквизированной мастерской. Офицер объяснил, что задержки неизбежны, пока соперничающий дом представляет угрозу. Иовинус спросил, исчезнут ли ворота вместе с угрозой.\n\nПотребуется период необходимого надзора, сказал офицер. Насколько долгий, он пока ответить не мог.\n\nГерцог хотел наследство, на которое претендовал, и безопасность, которую обещали офицеры. Ему было проще представить преодоление сопротивления Эри, чем роспуск аппарата, созданного для его преодоления. Этой трудности стоило отвести место в плане."
 hsm_ver_eyr_force.1.victory.d:0 "Офицер назвал её последней кампанией, на этот раз убирая карты. Эри был побеждён, мир заключён. Иовинус спросил, какие чрезвычайные приказы теперь можно отменить. Офицер начал с причин сохранить каждый из них.\n\nНужно было защищать поставки, надзирать за повреждёнными переправами и мастерскими, чьи графики всё ещё обслуживали армию. Каждое объяснение звучало разумно. Вместе они описывали страну, способную бесконечно готовиться к законченной кампании.\n\nУ штабных ворот ждала повозка, пока возница просил разрешения забрать инструменты. Иовинус помнил, как охотно подобные задержки объясняли существованием соперничающего дома. Военный исход больше не давал этого ответа.\n\nОн выиграл борьбу, которую намеревался выиграть. Решение о том, что должны вернуть собственные офицеры, потребует иной решимости. Он велел адъютанту оставить чрезвычайные приказы на столе."
 hsm_ver_eyr_force.1.a:0 "Включить окончание чрезвычайного положения в наши планы."
 hsm_ver_eyr_force.2.t:0 "Когда гарнизон становится правительством"
 hsm_ver_eyr_force.2.d:0 "Хозяйка мастерской спросила о сроке. Комендант заверил, что гражданским нуждам уделят всестороннее внимание. Она снова спросила о сроке. Её работники не могли планировать сезон вокруг внимания.\n\nЗа штабным столом Иовинус нашёл военную причину сохранить каждое здание, отмеченное на карте округа. У согласованного управления были настоящие преимущества: войска быстро собирались, припасы направлялись туда, где штаб считал их нужнее, указания исполнялись по знакомой вертикали. Жители оплачивали эту готовность отложенной работой и решениями, принятыми в другом месте.\n\nГрафик возвращения к гражданскому порядку даст обычной администрации возможность возобновить работу. Он также ослабит непосредственную организованность командования и оставит советам задачи, которые офицер прежде разрешал приказом.\n\nИовинус перевёл взгляд с карты на ожидавшую хозяйку. Победа сделала это выбором устройства власти, и она имела право знать, что он намерен выбрать."
 hsm_ver_eyr_force.2.a:0 "Назначить сроки возвращения к гражданскому управлению."
 hsm_ver_eyr_force.2.b:0 "Сохранить военное управление округами."
 hsm_ver_eyr_force.3.t:0 "Место для чужих слов"
 hsm_ver_eyr_force.3.d:0 "Монтаг положил незаконченный ответ рядом со старым письмом Розалин. Бумага ничего не сообщала Иовинусу о её нынешнем положении, и Монтаг не делал вида, что сообщает. Он хотел знать, что потребуется, если он решит отправить свой ответ.\n\nПочтовый офицер указал на место для военного разрешения. Монтаг спросил, что офицер должен одобрить: маршрут или слова. Различие оказалось для штаба менее привычным, чем следовало бы.\n\nГражданской почте понадобятся служащие и политическая поддержка, но она сможет доставлять чертежи мастерских и личные вопросы, не превращая каждого автора в просителя перед командованием. Сохранение надзора оставит армии знание того, что движется по округам, вместе с недоверием, которое это знание вызывает.\n\nИовинус мог определить почтовый порядок. Написать ответ Монтага или обещать ответное письмо Розалин он не мог."
 hsm_ver_eyr_force.3.a:0 "Учредить частную гражданскую переписку."
 hsm_ver_eyr_force.3.b:0 "Сохранить надзор командования за перепиской."
 hsm_ver_eyr_force.4.t:0 "Станок после смотра"
 hsm_ver_eyr_force.4.civilian.d:0 "Резервист умел разбирать и чинить оборудование, которым пользовался на службе. В гражданской мастерской он стоял у незнакомого станка и ждал, когда покажут управление. У мастера были ещё трое вернувшихся солдат и один инструктор.\n\nС начала исполнения графика прошло несколько месяцев. Иовинус дал обычной жизни место; теперь ей требовались инструменты, помещения и заработок на время освоения ремесла. Местная управа обещала найти работу прежде, чем узнала, сколько рабочих мест существует.\n\nМастер просил вложений в обучение и производство. Добиться их означало потратить влияние среди тех, у кого были другие требования к правительству. Передача вопроса местным управам сбережёт эти усилия сейчас, но не устранит нехватку.\n\nРезервист поднял взгляд от станка. Он явился туда, куда его направили. Он всё ещё ждал возможности приносить пользу."
 hsm_ver_eyr_force.4.d:0 "Военные заказы мастерской аккуратно распределили по срочности. Под ними лежал насос, ожидавший ремонта для гражданского заказчика. Мастер мог назвать офицера, отвечавшего за каждую армейскую партию. Сказать заказчику, когда насос попадёт к станку, он не мог.\n\nВоенное управление облегчило руководство окружной работой. Дополнительных часов для исполнения всех просьб оно не создало. Иовинус выслушал представителя командования, объяснявшего первенство боеготовности, затем спросил, что будет с округом, чей обычный ремонт никогда не становится достаточно срочным.\n\nПредставитель предложил закрепить производство за командованием. Гражданский управляющий предложил контракты с надёжными поставками и определённым станочным временем. Их заключение и соблюдение потребуют политических усилий, но способны улучшить снабжение без отмены военной власти.\n\nНасос оставался на полу между ними: небольшой механизм без чина, который мог бы за него заступиться."
 hsm_ver_eyr_force.4.a:0 "Оплатить обучение и гражданские рабочие места."
 hsm_ver_eyr_force.4.b:0 "Оставить трудоустройство местным управам."
 hsm_ver_eyr_force.4.c:0 "Закрепить производство за военными заказами."
 hsm_ver_eyr_force.4.contracts:0 "Заключить надёжные гражданские контракты снабжения."
 hsm_ver_eyr_force.5.t:0 "Без встречающей делегации"
 hsm_ver_eyr_force.5.civilian.d:0 "Через месяц после начала проверок Иовинус приехал в мастерскую без подготовленного приёма. У ворот не было военного бюро пропусков. Сторож спросил, кого он ищет, узнал его и растерялся. Герцог попросил позвать ответственного за сегодняшнюю работу.\n\nИм оказался гражданский управляющий без готового торжественного доклада. Он рассказал о поставках, полезных навыках работников и трудностях, всё ещё мешающих другим найти место. Иовинусу пришлось задавать вопросы: перед ним не было строя для осмотра и адъютанта с правильным ответом.\n\nПеремена освободила место обычной инициативе. Она также не позволяла скрыть правительственное решение об обучении за общим заверением в готовности. Управляющий хотел ответа о работе. Иовинус слушал, пока станки продолжали движение, безразличные к тому, насколько обнадёживающим герцог считает услышанное."
 hsm_ver_eyr_force.5.d:0 "Окружной офицер смог объяснить каждую отправку, когда Иовинус приехал без предупреждения. Повозки грузили по очереди, запасы соответствовали дневным заказам, штаб знал, какая задержка требует внимания. Военное управление приобрело компетентность, обещанную его сторонниками.\n\nРядом с графиком стоял гражданский управляющий. Когда офицер описывал доступное время мастерских, управляющий начал говорить, затем подождал, пока герцог посмотрит на него. Возражение касалось часов, уже обещанных другим. Оно было практичным и точным; найти момент для него оказалось труднее, чем обнаружить расхождение.\n\nИовинус попросил офицера выслушать его до конца. Ответ должен учитывать действительно выбранный производственный порядок со всеми его обязанностями. Командование могло обеспечивать работу округа. Проверка также показала, как легко эта работа становится зависимой от понимания гражданскими того, когда им разрешено перебить."
 hsm_ver_eyr_force.5.a:0 "Запомнить рабочий день, который мы действительно увидели."
 hsm_ver_eyr_force.6.t:0 "Движение по старой походной дороге"
 hsm_ver_eyr_force.6.civilian.d:0 "Иовинус наблюдал, как повозка минует место, где прежде стоял командный пост. Возница замедлился на повреждённом участке и продолжил путь, не посмотрев на герцога. Стоявший рядом Монтаг заметил, что тот, кажется, куда-то опаздывает.\n\nГерцог чуть не отправил помощника узнать куда. Нужды не было. Поездка не обязана становиться частью его победы только потому, что он её заметил. Где-то впереди заказчик найдёт для возницы достаточно вопросов.\n\nГражданское управление не сделало каждую мастерскую процветающей и не обеспечило каждого вернувшегося солдата. Иовинус увидел, что дали его решения и чего не дали. Они позволили этим трудностям стать общественным делом без сохранения всей страны под командным постом.\n\nПовозка скрылась за поворотом. На этот раз полезного приказа не было. Позволить ей уехать потребовало больше внимания, чем он ожидал."
 hsm_ver_eyr_force.6.d:0 "Повозка остановилась у окружного поста, получила указание и перешла на разрешённую полосу. Следующая двинулась за ней прежде, чем первая достигла поворота. Иовинус наблюдал за порядком с удовлетворением командира, видящего работу сложного устройства.\n\nМонтаг спросил, что произойдёт, если путнику понадобится туда, куда расписание не предусматривало. Офицер указал на стол особых обращений. Ответ последует, заверил он, когда обстоятельства рассмотрят.\n\nВоенное устройство сделало этот стол обычной частью жизни. Его компетентность могла предотвращать потери, разрешать соперничающие требования и поддерживать снабжение. Его власть также требовала от граждан облекать свои нужды в вопросы, которые командование готово выслушать.\n\nИовинус хотел победы, которая переживёт следующую тревогу. Перед ним был порядок, который он решил сохранить: полезный, дисциплинированный и зависящий от постоянной готовности каждого у поста подчиняться."
 hsm_ver_eyr_force.6.a:0 "Таков мир, созданный нашей победой."

 HSM_VER_FORCE_settlement_tt:0 "Дом остаётся независимым и некапитулировавшим под властью своего первоначального герцога; победа над соперником подтверждена зафиксированными войной, поражением соперника и мирной конференцией, после которой завершился §Y30-дневный§! период ожидания. Собственные первоначальные провинции остаются во владении и под контролем дома; первоначальными провинциями соперника владеет и управляет победитель либо его действительно побеждённый подчинённый дом-соперник."
 HSM_VER_FORCE_settlement_started_tt:0 "Политическое урегулирование после победы началось."
 HSM_VER_FORCE_no_protected_peace_tt:0 "Дома не связаны друг с другом перемирием, ратифицированным договором о дружбе, пактом о ненападении или общей фракцией. Уже заключённая при участии Авиана дружба также учитывается; новое предложение, отклонённое Авианом, не учитывается."
 HSM_ERI_FORCE_story_tt:0 "Продолжает историю Винсента следующей сценой."
 HSM_ERI_FORCE_open_terms_tt:0 "Открывает определяющий дальнейший путь выбор между §Yсохранением местных окружных учреждений§! и §Yпрямым герцогским управлением§! побеждёнными округами."
 HSM_ERI_FORCE_petition_tt:0 "Выносит на рассмотрение прошение о поместье, проверяющее притязания военного покровителя Винсента против доказательств других заявителей."
 HSM_ERI_FORCE_bound_duke_tt:0 "Заменяет предварительные окружные гарантии §Yобязательными хартиями§!. Прежнее исключение о передаче поместья военному покровителю, если оно было сделано, §Yотменяется§!, возвращая доказательное слушание и его последствия."
 HSM_ERI_FORCE_chancery_tt:0 "Заменяет предварительные комиссии §Yединой герцогской администрацией§!. Ранее выбранное решение о поместье и его последствия остаются в силе."
 HSM_ERI_FORCE_rights_tt:0 "Винсент выбрал сохранение местных прав и окружных учреждений."
 HSM_ERI_FORCE_central_tt:0 "Винсент выбрал прямое герцогское управление."
 HSM_ERI_FORCE_claim_decided_tt:0 "По прошению о поместье принято решение."
 HSM_ERI_FORCE_consequence_tt:0 "Получен последующий доклад о решении по поместью; он становится доступен через §Y45 дней§! после решения."
 HSM_EYR_FORCE_campaign_tt:0 "Начинает рассказ Иовинуса о кампании и обязательствах, которые останутся после победы."
 HSM_EYR_FORCE_settlement_tt:0 "Начинает политическое урегулирование и предлагает выбор между §Yгражданской демобилизацией§! и §Yпостоянной военной опекой§!. Прекращает официальное соперничество для победителя и его действительно побеждённого подчинённого соперника без автоматической передачи территории или национальных регионов."
 HSM_EYR_FORCE_correspondence_tt:0 "Незаконченный ответ Монтага поднимает отдельный вопрос: учредить частную гражданскую переписку или сохранить военный надзор за ней. Ни один выбор не обещает ответного письма, брака или чужого согласия."
 HSM_EYR_FORCE_demobilisation_tt:0 "Начинает возвращение управления и хозяйственных обязанностей в гражданские руки. Через §Y120 дней§! рассмотрение положения мастерских позволит оценить практическую цену трудоустройства вернувшихся резервистов. Эта политика не расформировывает армейские дивизии."
 HSM_EYR_FORCE_tutelage_tt:0 "Сохраняет постоянное военное управление округами. Через §Y120 дней§! рассмотрение положения мастерских позволит оценить соперничество военных заказов с гражданским производством."
 HSM_EYR_FORCE_workshop_review_tt:0 "По истечении §Y120 дней§! после выбора устройства власти открывает рассмотрение положения мастерских: обучение и занятость при гражданской администрации либо производственные приоритеты и контракты при военной опеке."
 HSM_EYR_FORCE_inspection_tt:0 "Начинает проверку выбранного порядка. Через §Y30 дней§! последует посещение обычного рабочего дня, показывающее последствия уже принятых решений об управлении и мастерских."
 HSM_EYR_FORCE_order_chosen:0 "Иовинус выбрал послевоенное устройство власти"
 HSM_EYR_FORCE_civilian_order:0 "Иовинус выбрал гражданскую демобилизацию и администрацию"
 HSM_EYR_FORCE_military_order:0 "Иовинус выбрал постоянную военную опеку"
