l_russian:
 HSM_AET_compact:0 "Западное соглашение"
 HSM_AET_compact_desc:0 "Графство приняло обязательства, выходящие за его границы. Школы, суды и казначейство должны выполнять обещания, данные от его имени."
 HSM_AET_civic_council:0 "Совет соглашения"
 HSM_AET_imperial_compact:0 "Хартия восстановления"
 HSM_AET_imperial_compact_desc:0 "Вернувшаяся корона опирается на обязательства перед землями, которые её поддержали."
 HSM_AET_imperial_settlement:0 "Корона, связанная своим словом"
 HSM_AET_imperial_settlement_desc:0 "Учреждения мирного времени пережили первые разногласия. Государь и его министры теперь правят по правилам, которые некогда обещали соблюдать."
 HSM_AET_grover_desc:0 "Гровер VI возвращается в Грифенхейм с обязательствами, добровольно принятыми в Грайфвальде. За восстановленной короной стоят города, давшие приют его двору, служащие, спорившие о его расходах, и солдаты, ожидающие, что правительство исполнит обещанное за их службу. Он обещал им правительство, отвечающее за то, чего оно требует от своих подданных."
 HSM_AET_identity_pending_tt:0 "До разрешения кризиса «Западное соглашение» даёт §R−10%§! к стабильности; ратификация и передача власти приостановлены. Расследование, слушания и итоговая подпись снимут это ограничение."
 HSM_AET_western_compact:0 "Западный оборонный союз"
 HSM_AET_category:0 "Обязательства графства"
 HSM_AET_category_desc:0 "Курьеры привозят новости о дворах в изгнании и незавершённых соглашениях. Канцелярия может пересмотреть дело при изменении обстоятельств или завершить миссию, утратившую свою цель."
 HSM_AET_household_review:0 "Пересмотреть дело императорского двора"
 HSM_AET_household_review_desc:0 "Новый адрес, проверенный свидетель или смена правительства могут изменить возможности графства. Двор заслуживает ответа, соответствующего нынешним обстоятельствам."
 HSM_AET_review_tt:0 "Графство сохраняет возможность действовать; с предыдущего пересмотра прошло тридцать дней."
 HSM_AET_review_effect_tt:0 "Проверить местонахождение Гровера. Принять его из распущенного императорского двора можно лишь при владении Грифенхеймом и отсутствии живого государства, в котором он находится. Ранее отклонённый местный мандат можно рассмотреть заново."
 HSM_AET_end_mission:0 "Обсудить завершение миссии"
 HSM_AET_end_mission_desc:0 "Есть обещания, которые графство больше не может выполнить. Прежде чем закрыть дела, представители должны решить, искать ли новую возможность или отказаться от мандата."
 HSM_AET_end_mission_tt:0 "Страна находится в мире; действующего регентства и созданной унии нет."
 HSM_AET_close_tt:0 "Окончательно завершить эту кампанию и убрать её национальный модификатор. Гровер, если он находится здесь, остаётся защищённым частным гостем. Территории не передаются."
 HSM_AET_restored_government_tt:0 "Восстановленным независимым Герцландом правит Гровер VI."
 HSM_AET_alliance_accept_tt:0 "Восстановленная Империя вступает в наш существующий альянс."
