 HSM_AET_UNION_ADJ:0 "Грайфвальд-герцландск"
 HSM_AET_GRI_oath:0 "Собственная подпись короны"
 HSM_AET_GRI_oath_desc:0 "Печать регента возвращена. Теперь Гровер должен сам подписать обязательства, которые некогда защищали его. Старые ведомства требуют вернуть привилегии; вместо этого хартия определяет обязанности каждого министерства и требует открытого отчёта об их исполнении."
 HSM_AET_GRI_towns:0 "Открыть городские мастерские"
 HSM_AET_GRI_towns_desc:0 "Заказы на кровлю, инструменты и сельскохозяйственные машины дадут уцелевшим мастерским будущее за пределами военных реквизиций."
 HSM_AET_GRI_army:0 "Служба по хартии"
 HSM_AET_GRI_army_desc:0 "Офицеры получат назначения с определёнными обязанностями, регулярным жалованием и гражданским надзором."
 HSM_AET_GRI_schools:0 "Школа в каждом округе"
 HSM_AET_GRI_schools_desc:0 "Учителя, некогда искавшие убежища, теперь могут вернуться с книгами, коллегами и средствами для открытия классов."
 HSM_AET_GRI_debts:0 "Урегулировать счета двора"
 HSM_AET_GRI_debts_desc:0 "Приют, жалованье и продовольствие оплачивались задолго до открытия дворца. Кредиторы сохранили расписки. Самостоятельному правительству предстоит отделить долги, которые оно обязано вернуть, от покровительства, на продолжение которого рассчитывают кредиторы."
 HSM_AET_GRI_settlement:0 "Повседневная работа мира"
 HSM_AET_GRI_settlement_desc:0 "Суды открылись, а министры научились спорить, не вызывая армию. Эти тихие победы сохранят государство."
 HSM_AET_system.1.t:0 "Мандат изменился"
 HSM_AET_system.1.d:0 "Обстоятельства, на которых держалось регентство, изменились. Его временные территориальные полномочия прекращены. Прежде чем продолжить прежнюю работу, необходимо установить положение двора и дать землям законный ответ."
 HSM_AET_system.1.a:0 "Проверить оставшиеся обязательства."
 HSM_AET_system.2.t:0 "Знакомая подпись"
 HSM_AET_system.2.d:0 "Граф подписал очередное обычное письмо. Но служащий положил его рядом со старым распоряжением и тихо попросил журнал назначений. Тому, кто помнит стоявшее за этим распоряжением обещание, придётся высказаться."
 HSM_AET_system.2.a:0 "Сверить письма."
 HSM_AET_system.3.t:0 "Партнёр западного соглашения"
 HSM_AET_system.3.d:0 "Грайфвальд завершил восстановление независимого императорского правительства Гровера VI. Его представители просят принять это правительство в наш альянс. Их двусторонние гарантии сохранятся и в случае нашего отказа."
 HSM_AET_system.3.a:0 "Принять восстановленную Империю."
 HSM_AET_system.4.t:0 "Ключи Грифенхейма"
 HSM_AET_system.4.d:0 "Двор вернулся с соглашениями, заключёнными за время отсутствия. Теперь ключи у Гровера, но бумаги на его столе напоминают, сколько чужих судеб сделало это возвращение возможным. Придворные наставники и советники просят направлять прошения через канцелярию. Он соглашается на установленный порядок приёмов, но требует сохранять слова просителей рядом с пересказом служащих."
 HSM_AET_system.4.a:0 "Приступить к управлению."
 HSM_AET_system.5.t:0 "Совершеннолетний за столом совета"
 HSM_AET_system.5.d:0 "Двор больше не может обращаться с Гровером как с ребёнком. Подготовка согласованной передачи может продолжаться, а война способна задержать её исполнение, но теперь он участвует в совете как взрослый, чьё собственное согласие имеет значение."
 HSM_AET_system.5.a:0 "Он должен говорить от собственного имени."
 HSM_AET_system.6.t:0 "Дело императорского двора"
 HSM_AET_system.6.a:0 "Зафиксировать проверенные сведения."
 HSM_AET_system.7.t:0 "Завершить миссию?"
 HSM_AET_system.7.d:0 "Канцелярия подготовила окончательный отчёт. Завершение миссии прекратит политическую программу графства, хотя уже принятые гости сохранят его защиту. Представители ещё могут оставить дела открытыми."
 HSM_AET_system.7.a:0 "Завершить миссию."
 HSM_AET_system.8.t:0 "Присяга без карты"
 HSM_AET_system.8.d:0 "Последний проект церемонии обещает восстановить все прежние имперские границы. Гровер вычёркивает эту строку. Офицеры, служившие по личным договорам, хотят знать, сохранятся ли их назначения. Сохранятся, отвечает он, вместе с оговорённым жалованьем и новой присягой хартии. Один полковник просит письменного подтверждения. Гровер подписывает его до начала церемонии."
 HSM_AET_system.8.a:0 "Обещать то, что можем выполнить."
 HSM_AET_system.9.t:0 "Аудиенция кредиторов"
 HSM_AET_system.9.d:0 "Кредиторы принесли во дворец договоры, заключённые во время войны. Гровер признаёт документально подтверждённые долги, но личное расположение больше не освобождает кредитора от суда. Министры начинают переговоры об открытом порядке выплат."
 HSM_AET_system.9.a:0 "Ни один частный договор не выше закона."
 HSM_AET_system.3.b:0 "Сохранить нынешний состав альянса."
 HSM_AET_system.7.b:0 "Оставить дела открытыми."
 HSM_AET_system.6.dead:0 "Проверенные сведения подтверждают гибель Гровера. Графство не может установить опеку над пустым престолом. Требуется новое соглашение между управляемыми землями."
 HSM_AET_system.6.local:0 "Императорский двор находится здесь под нашей защитой. Его нынешнее положение позволяет пересмотреть мандат с учётом состояния земель и правительства."
 HSM_AET_system.6.foreign:0 "Гровер жив и находится в другом государстве. Это не даёт Грайфвальду полномочий над ним или его двором. Канцелярия записывает подтверждённый адрес и закрывает предложение о переезде: наши представители не могут учредить местный мандат, объявив своим подопечным чужого гостя или государя."
 HSM_AET_system.6.unknown:0 "Уцелевшие документы не позволяют установить, где находится императорский двор и можем ли мы законно принять его. Подтверждённых сведений о гибели Гровера нет. Служащие оставят дело открытым, не заменяя пробелы удобной историей."
 HSM_AET_system.4.open.d:0 "Двор возвращается со школьными журналами и прошениями, собранными во время посещений Гровером грайфвальдских городов. Учитель отметил на новом плане округа школу без крыши. Когда камергер предлагает убрать эти бумаги перед приёмом, Гровер оставляет план на столе. Чиновники, пришедшие его поздравить, могут для начала найти плотника."
 HSM_AET_system.8.law.d:0 "Офицер приносит хартию, по которой уже служил в Грайфвальде. Он спрашивает, меняет ли возвращение в Грифенхейм его присягу. Гровер переносит те же условия в императорское назначение: министерство утверждает расходы, суды принимают жалобы, чин не освобождает от ответственности. Обещание вернуть все прежние границы он вычёркивает. Офицер подписывает назначение с уже знакомыми пределами полномочий."
 HSM_AET_system.8.law_trimmel.d:0 "Новые назначения сохраняют гражданский надзор, установленный в Грайфвальде. Один министр возражает против ссылки на хартию, которую подписывал Триммель. Гровер спрашивает, какая её статья позволила вызвать того правителя на слушания, раскрыть подмену и обязать его править под собственным именем. Министр указывает на порядок слушаний. Он остаётся в итоговом тексте рядом с ограничениями военного командования. Присяга обещает законное управление этими землями, а не возвращение всех прежних границ."
 HSM_AET_system.8.contract_trimmel.d:0 "Офицеры, прежде полагавшиеся на личные договоры, требуют письменных гарантий, прежде чем принять гражданский надзор. Министр напоминает о слушаниях, заставивших Триммеля подписаться собственным именем: обещания устояли лишь тогда, когда нашлось кому требовать их исполнения. Гровер предлагает регулярное жалованье, право обжалования и назначения по хартии. Офицеры сохраняют службу; корона получает армию с открытыми условиями найма. Обещание безграничного отвоевания вычёркивают из присяги."
 HSM_AET_system.9.protected.d:0 "Финансист приходит с расписками и напоминает министрам, как прежде была отложена жалоба на него. Он ожидает, что новый дворец сохранит это покровительство. Гровер признаёт долг, а затем просит служащего вернуть оставленную без ответа жалобу. Исключение так и не было записано; теперь он отказывается вносить его в открытое соглашение о выплатах. Разрыв с прежним покровительством задерживает расчёты и вызывает гнев кредитора, но суд принимает жалобу до окончания аудиенции."
 HSM_AET_system.9.judged.d:0 "Кредиторы находят копию грайфвальдского судебного решения рядом с порядком выплат. Один спрашивает, не отменило ли его возвращение во дворец. Гровер передаёт вопрос тому же открытому суду, которому предстоит проверить спорные расписки. Решение сохраняет силу; законные долги будут выплачены без возвращения отменённых привилегий. На этот раз служащему не приходится ждать разрешения, чтобы зарегистрировать жалобу."
