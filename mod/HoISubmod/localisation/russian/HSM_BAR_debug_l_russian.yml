 HSM_BAR_debug_friendship_ending:0 "ОТЛАДКА: Вызвать концовку дружбы"
 HSM_BAR_debug_friendship_ending_desc:0 "Для тестирования: немедленно открывает существующее событие концовки дружбы с выбором между Коллегиумом и Республикой, ведущей к созданию Службы. Пропускает обычные требования отношений и фокусов. Требуется запуск игры с параметром -debug; доступно только игроку за Баррад до наступления концовки. Не тратит политическую власть. Используйте отдельное тестовое сохранение."
