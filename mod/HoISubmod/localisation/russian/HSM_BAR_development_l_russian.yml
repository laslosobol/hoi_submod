l_russian:
 HSM_BAR_food_cooperatives:0 "Сельские кооперативы"
 HSM_BAR_food_cooperatives_desc:0 "Семья, которой есть что продать, нередко возвращается с рынка без запасов на зиму. Сельские кооперативы позволят сообща закупать семена, нанимать подводы и содержать общий амбар под надзором самих участников. Республика поможет открыть первые склады. Никому не должно приходиться отдавать будущий урожай за возможность поесть сегодня."
 HSM_BAR_village_schools:0 "Школа рядом с домом"
 HSM_BAR_village_schools_desc:0 "Для многих детей ближайшая школа находится в дне пути. Советы предлагают пустующие комнаты, но одной крыши недостаточно. Нужны буквари, топливо и учитель, которому вовремя платят жалованье. Занятия начнутся там, куда семьи смогут добраться; за партами найдётся место и старшим ученикам, которых прежде никто не учил читать."
 HSM_BAR_teacher_training:0 "Учителя для деревень"
 HSM_BAR_teacher_training_desc:0 "Знать грамоту и уметь ей научить — не одно и то же. Опытные преподаватели подготовят новых учителей в небольших группах, а затем помогут им провести первые занятия в деревнях. Учительская семинария будет также сравнивать способы обучения и распространять удачные упражнения. Ошибке в букваре незачем кочевать из класса в класс."
 HSM_BAR_clean_water:0 "Чистые колодцы и водопровод"
 HSM_BAR_clean_water_desc:0 "Исправный насос мало утешает, если от воды болеет вся семья. Землемеры и медики обследуют городское водоснабжение, отделят стоки от питьевой воды и проложат трубы от проверенных источников. Колодцы, чьё загрязнение пока не удаётся объяснить, останутся закрытыми. Обычной работы достаточно и без заявлений о победе над всеми опасностями."
 HSM_BAR_power_grid:0 "Электричество для мастерских"
 HSM_BAR_power_grid_desc:0 "Каждая мастерская с трудом содержит собственный источник энергии, а поломка котла может остановить работу на целой улице. Городская электростанция и местные линии позволят нескольким предприятиям пользоваться общим надёжным снабжением. Прежде чем запустить станки, электрики проверят подключения. Первой сети не обязательно охватить каждую деревню, чтобы изменить жизнь целого города."
 HSM_BAR_machine_tools:0 "Станки для новых станков"
 HSM_BAR_machine_tools_desc:0 "Мастерские умеют чинить старый токарный станок, но для изготовления нового нужны чертежи, мерительный инструмент и материалы известного качества. Мы приобретём рабочие образцы, изучим их устройство и дадим опытным мастерам возможность испытывать усовершенствования вместе с подмастерьями. Нам нужен не выставочный образец, а оборудование, которое смогут изготовить и обслуживать в другой мастерской."
 HSM_BAR_workers_housing:0 "Жильё рядом с работой"
 HSM_BAR_workers_housing_desc:0 "Вслед за новыми рабочими местами семьи перебираются в сараи и переполненные съёмные комнаты. Советы выделят пригодную землю под застройку, организуют доступные ссуды и обяжут домовладельцев ремонтировать опасное жильё. Новым домам нужны водоотвод, отопление и дорога к месту работы. Жалованье должно кормить семью, а не целиком уходить за протекающую крышу."
 HSM_BAR_polytechnic:0 "Баррадский политехникум"
 HSM_BAR_polytechnic_desc:0 "Старшие ученики технического училища уже берутся за работы, которым тесно в его учебных комнатах. Инженеры, землемеры и преподаватели лабораторного дела объединят эти занятия в политехникуме с общими мастерскими. Первые выпускники должны уметь спроектировать мост, испытать материал и объяснить расчёты тому, кто не сидел с ними за одной партой."
 HSM_BAR_industrial_standards:0 "Единые меры и стандарты"
 HSM_BAR_industrial_standards_desc:0 "Запасная деталь должна вставать на место без целого дня подгонки, а покупатель — понимать, что означает указанный вес. Гражданская палата мер будет хранить эталоны и публиковать технические нормы, составленные вместе с мастерами. Проверка должна выявлять брак, а не становиться ещё одним побором у заводских ворот. Надёжные стандарты позволят небольшим производствам работать вместе над крупными заказами."
 HSM_BAR_regional_markets:0 "Торговля между округами"
 HSM_BAR_regional_markets_desc:0 "В одном округе урожай может пропадать без покупателей, пока в соседнем пустуют прилавки. Регулярные ярмарки, исправные склады и открытые тарифы на перевозку дадут земледельцам и торговцам повод искать покупателей дальше своего села. Советы займутся спорами об испорченных грузах и неоплаченных поставках. Продажа излишков не должна зависеть от единственного купца, согласного заехать в деревню."
 HSM_BAR_civil_laboratories:0 "Гражданские лаборатории"
 HSM_BAR_civil_laboratories_desc:0 "Проба воды, треснувшая ось и мешок испорченных семян не всегда требуют великого магического опыта. Гражданские лаборатории дадут химикам и инженерам место для изучения обычных неисправностей, от которых беднеют целые поселения. Образцы будут подписывать, результаты — записывать, спорные опыты — повторять. Республике нужны ответы, которые останутся полезными и после ухода исследователя."
 HSM_BAR_extension_schools:0 "Вечерние школы"
 HSM_BAR_extension_schools_desc:0 "Те, кто не учился в детстве, не всегда могут оставить поле или мастерскую ради школы теперь. Выездные учителя привезут уроки в отдалённые поселения, а обычные классы откроются по вечерам. Прочитать договор, вести счета и написать далёкому родственнику — уже достойные цели. Со взрослыми учениками не будут обращаться как с опоздавшими детьми."
 HSM_BAR_precision_industry:0 "Приборостроение"
 HSM_BAR_precision_industry_desc:0 "Лаборатории месяцами ждут запасную линзу или правильно выверенный измерительный прибор. Специализированный завод объединит стекольщиков и мастеров точной обработки с исследователями, которым нужны их изделия. Небольшие партии будут проверять до расширения заказов. Репутацию заводу принесут верные измерения, а не внушительный каталог."
 HSM_BAR_scholarships:0 "Республиканские стипендии"
 HSM_BAR_scholarships_desc:0 "Некоторые из лучших учеников исчезают из классов, как только семье становится нужен их заработок. Стипендии оплатят жильё, книги и скромное содержание; при назначении учтут способности и нужду. Выдвигать учеников смогут сельские учителя наравне с городскими школами. Хорошее образование не должно обрываться из-за расходов на следующий учебный срок."
 HSM_BAR_research_council:0 "Научный совет республики"
 HSM_BAR_research_council_desc:0 "Лаборатории не удержат сотрудников, если каждая работа зависит от личного интереса министра. Гражданский научный совет будет выделять средства по письменным заявкам, оплачивать оборудование и жалованье, а для проверки результатов приглашать независимых специалистов. Несколько групп смогут одновременно заниматься разными вопросами. Добросовестно полученный отрицательный результат тоже должен заслуживать отчёта."
 HSM_BAR_national_grid:0 "Единая электросеть"
 HSM_BAR_national_grid_desc:0 "Местные электростанции изменили жизнь городов, но одна поломка всё ещё может погрузить целый округ во тьму. Инженеры соединят совместимые сети, согласуют правила эксплуатации и подготовят резервы на время ремонта. Отдалённые поселения подключат там, где строительство уже признано безопасным. Надёжное снабжение больше не должно заканчиваться на окраине крупнейшего города."
 HSM_BAR_social_insurance:0 "Помощь в болезни и старости"
 HSM_BAR_social_insurance_desc:0 "Сломанная нога может поглотить семейные сбережения раньше, чем заживёт. Взносы работников, нанимателей и казначейства обеспечат пособия по болезни и пенсии. Местные учреждения займутся выплатами, а их решения можно будет обжаловать. Начинать следует с обязательств, которые удастся исполнить: семьям нужна надёжная помощь, а не щедрость, существующая только на бумаге."
 HSM_BAR_developed_republic:0 "Республика для жизни"
 HSM_BAR_developed_republic_desc:0 "Есть ещё деревни, ждущие ремонта, и поля, которые ни один добросовестный землемер не назовёт безопасными. Но школы уже готовят новых учителей, мастерские способны заменить своё оборудование, а лаборатории планируют работу дальше ближайшей беды. Министерства объединят их нужды в долгосрочную программу вложений. Республика наконец может заботиться о том, что ещё не стало катастрофой."

 HSM_BAR_development:0 "Программы развития республики"
 HSM_BAR_development_desc:0 "Министерство хозяйства и органы народного образования получают заявки от советов, кооперативов, школ и лабораторий. Одному селу прежде нового класса нужно жильё для учителя; другой мастерской прежде нового станка — надёжное снабжение. Каждая программа оплачивает определённый этап работ, а перед следующим проверяются местные нужды. Земля, на которой ещё опасно жить, не станет пригодной от строки в бюджете."
 HSM_BAR_development_living_standards:0 "Поддержать нуждающиеся хозяйства"
 HSM_BAR_development_living_standards_desc:0 "Сотрудники советов посетят семьи, которым грозит потеря дома или средств к существованию. Ссуды на ремонт, закупка семян и помощь во время болезни не дадут временной нужде стать постоянной нищетой. Каждый этап охватит следующую группу поселений; прежде чем выделять новые средства, расходы проверят."
 HSM_BAR_development_school_network:0 "Расширить сеть народных школ"
 HSM_BAR_development_school_network_desc:0 "Органы народного образования начнут со списков детей, которым не хватает мест, и взрослых, желающих учиться по вечерам. Новая учительская должность должна означать помещение, книги и жалованье, а не только письмо о назначении. На каждом этапе оборудуют очередную группу классов и подготовят тех, кто будет в них преподавать."
 HSM_BAR_development_industrial_program:0 "Оплатить очередную промышленную программу"
 HSM_BAR_development_industrial_program_desc:0 "Министерство хозяйства выяснит у производителей, что мешает работе: перебои энергии, изношенное оборудование, нехватка навыков или трудности со снабжением. Средства направят на согласованный круг связанных задач. Следующие программы смогут опираться на действующие мастерские, а не заново оплачивать прежние незавершённые заказы."
 HSM_BAR_development_research_grants:0 "Выделить средства на гражданские исследования"
 HSM_BAR_development_research_grants_desc:0 "Лаборатории представят заявки с ясным вопросом, способом его изучения и обоснованным перечнем недостающего оборудования. Комиссия оплатит новую группу работ и труд необходимых помощников. В отчёты войдут и неудавшиеся опыты, чтобы следующим исследователям не пришлось снова платить за ту же ошибку."
 HSM_BAR_unlock_living_standards_tt:0 "Открывает повторяемую программу §Y$HSM_BAR_development_living_standards$§! для сокращения бедности."
 HSM_BAR_unlock_school_network_tt:0 "Открывает повторяемую программу §Y$HSM_BAR_development_school_network$§! для сокращения неграмотности."
 HSM_BAR_unlock_industrial_program_tt:0 "Открывает повторяемую программу §Y$HSM_BAR_development_industrial_program$§! для развития промышленности."
 HSM_BAR_unlock_research_grants_tt:0 "Открывает повторяемую программу §Y$HSM_BAR_development_research_grants$§! для развития научной базы."
 HSM_BAR_development_interrupted_tt:0 "Программа прервана до завершения. §RУлучшение не получено.§!"

 hsm_bar_development.1.t:0 "Первый выпуск политехникума"
 hsm_bar_development.1.d:0 "В экзаменационной комнате ещё пахнет краской. На столе рядом с дипломами лежат чертёж насоса, образцы почвы и измерительный прибор, собранный в учебной мастерской. Преподаватели попросили выпускников не убирать их, пока гости не закончат задавать вопросы.\n\nДелегат одного из сёл узнаёт среди молодых инженеров бывшего подмастерья. Она спрашивает, приедет ли он осмотреть родную мельницу. Он уже написал, чтобы ему прислали обмеры. Рядом другая выпускница объясняет, почему водопровод придётся вести более длинным путём, чем хотел совет. Экзаменатор слушает и не вмешивается.\n\nСвободных должностей больше, чем выпускников. Но хотя бы часть республика теперь сможет заполнить, не дожидаясь специалиста из-за границы. Этажом выше уже занимается следующий курс."
 hsm_bar_development.1.a:0 "Работа их уже ждёт."
 hsm_bar_development.2.t:0 "Первые средства на исследования"
 hsm_bar_development.2.d:0 "Научный совет готов опубликовать первые решения о финансировании. Лаборатория материалов изучит повреждённые котельные листы; агроном сравнит посевы на участках, уже признанных пригодными для обработки. Другая группа получит деньги на проверку способа измерений, автор которого прямо признаёт: он может не сработать.\n\nПредставительница казначейства задерживается на последней заявке. Эксперт показывает ей, во что обходятся ошибочные замеры, а затем — план проверки. Она подписывает документ. Рядом с заказами оборудования записаны жалованье, расходные материалы и время на независимые испытания.\n\nЗа дверью молодой лаборант дважды перечитывает объявление. Его лаборатория сможет сохранить сотрудников на зиму. Он спешит сообщить им об этом до начала вечерней смены."
 hsm_bar_development.2.a:0 "Пусть группы приступают к работе."
