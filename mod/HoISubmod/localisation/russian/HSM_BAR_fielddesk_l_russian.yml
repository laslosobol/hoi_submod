 HSM_BAR_fielddesk_recon_cost:0 "20 полит. власти  /  14 дн.  /  Фабрики: 1"
 HSM_BAR_fielddesk_recon_tt:0 "$HSM_BAR_fielddesk_recon_title$\n$HSM_BAR_fielddesk_recon_cost$\n\nДокументированная зацепка региона, ещё требующая разведки. Место должно находиться под контролем выбранной страны; сама страна должна существовать и не капитулировать.\n\nФабрики заняты на весь срок. При потере зацепки, доступа к месту или разрешения на операцию группа отзывается: затраты на отправку возвращаются, фабрики освобождаются."
 HSM_BAR_fielddesk_recon_mission:0 "Разведка"
 HSM_BAR_fielddesk_recon_running:0 "$HSM_BAR_fielddesk_recon_title$: [?HSM_BAR_fielddesk_order_target.GetName]\nОсталось [?days_mission_timeout@HSM_BAR_fielddesk_recon_mission|0] дн.; занято фабрик: [?HSM_BAR_fielddesk_factories|0]."
 HSM_BAR_fielddesk_archive_cost:0 "30 полит. власти  /  21 дн.  /  Фабрики: 2"
 HSM_BAR_fielddesk_archive_tt:0 "$HSM_BAR_fielddesk_archive_title$\n$HSM_BAR_fielddesk_archive_cost$\n\nРазведанное направление с неизученными документами по известному делу. Место хранения должно оставаться под контролем выбранной страны; сама страна не должна капитулировать.\n\nФабрики заняты на весь срок. При потере зацепки, доступа к месту или разрешения на операцию группа отзывается: затраты на отправку возвращаются, фабрики освобождаются."
 HSM_BAR_fielddesk_archive_mission:0 "Поиск архивов"
 HSM_BAR_fielddesk_archive_running:0 "$HSM_BAR_fielddesk_archive_title$: [?HSM_BAR_fielddesk_order_target.GetName]\nОсталось [?days_mission_timeout@HSM_BAR_fielddesk_archive_mission|0] дн.; занято фабрик: [?HSM_BAR_fielddesk_factories|0]."
 HSM_BAR_fielddesk_relic_cost:0 "60 ПП  /  30 дн.  /  Фабрики: 3  /  ещё 20 ПП при изъятии"
 HSM_BAR_fielddesk_relic_tt:0 "$HSM_BAR_fielddesk_relic_title$\n$HSM_BAR_fielddesk_relic_cost$\n\nНужны завершённое исследование удержания и изученная реликвия, доступная к изъятию в установленном месте под контролем выбранной страны. Короны можно забирать только из музеев или запечатанных хранилищ; носимые короны и правителей не забирают. Успешное изъятие дополнительно стоит 20 политической власти и вызывает дипломатический инцидент.\n\nФабрики заняты на весь срок. При потере зацепки, доступа к месту или разрешения на операцию группа отзывается: затраты на отправку возвращаются, фабрики освобождаются."
 HSM_BAR_fielddesk_relic_mission:0 "Изъятие реликвии"
 HSM_BAR_fielddesk_relic_running:0 "$HSM_BAR_fielddesk_relic_title$: [?HSM_BAR_fielddesk_order_target.GetName]\nОсталось [?days_mission_timeout@HSM_BAR_fielddesk_relic_mission|0] дн.; занято фабрик: [?HSM_BAR_fielddesk_factories|0]."
 HSM_BAR_fielddesk_remains_cost:0 "60 ПП  /  21 дн.  /  Фабрики: 2  /  ещё 20 ПП при изъятии"
 HSM_BAR_fielddesk_remains_tt:0 "$HSM_BAR_fielddesk_remains_title$\n$HSM_BAR_fielddesk_remains_cost$\n\nНужны судебный мандат, завершённая экспертиза, изученное дело Гровера и подтверждённые доступные останки в месте под контролем выбранной страны. Если Гровер жив или воскрешён, операция невозможна. Успешное возвращение останков дополнительно стоит 20 политической власти и вызывает дипломатический инцидент.\n\nФабрики заняты на весь срок. При потере зацепки, доступа к месту или разрешения на операцию группа отзывается: затраты на отправку возвращаются, фабрики освобождаются."
 HSM_BAR_fielddesk_remains_mission:0 "Возвращение останков"
