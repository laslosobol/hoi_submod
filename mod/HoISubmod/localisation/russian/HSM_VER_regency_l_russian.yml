l_russian:
 HSM_VER_REG_after_defence:0 "Что остаётся после победы"
 HSM_VER_REG_after_defence_desc:0 "Империя напала на участника нашей хартии; Авиан вступился за него, и заключённый мир оставил Грифенхейм под нашим управлением. Катрина знает, как легко победитель превращается из защитника в нового господина. Прежде чем офицеры уберут карты, она спросит Иовинуса и Винсента, что соглашение о Герцланде должно обещать домам, пережившим войну."
 HSM_VER_REG_household_file:0 "Имя ещё не означает присутствия"
 HSM_VER_REG_household_file_desc:0 "Имя Гровера VI встречается в прошениях, описях и проектах воззваний. Ничто из этого не говорит Катрине, находится ли живой ребёнок на самом деле под её опекой. Прежде чем обсуждать регентство, установим его положение. Взрослому не нужен регент, у зарубежного дома есть собственные обязанности, а неизвестность не следует выдавать ни за извещение о смерти, ни за прибытие."
 HSM_VER_REG_civilian_contracts:0 "Заказы для города"
 HSM_VER_REG_civilian_contracts_desc:0 "Мастерская в Грифенхейме спрашивает, чем оплатят следующий заказ: деньгами или очередным обещанием национального спасения. Катрина велит принести гражданские сметы. Возобновление производства даст городу нечто надёжнее нового знамени; там, где нельзя открыть цех, инженеры всё равно смогут усовершенствовать методы восстановления."
 HSM_VER_REG_agreement_for_herzland:0 "Соглашение о Герцланде"
 HSM_VER_REG_agreement_for_herzland_desc:0 "Первоначальный мир домов должен пережить соглашение за пределами Верении. Если живой несовершеннолетний Гровер находится в Авиане, Катрина может предложить регентство до его совершеннолетия; другой путь открывает гражданское соглашение. Независимое правительство отвечает свободно. Законно присоединённый дом обсуждает текст через собственное сословное собрание внутри единого государства. Присоединение не означает автоматического согласия."
 HSM_VER_REG_schools_and_witnesses:0 "Место среди учеников"
 HSM_VER_REG_schools_and_witnesses_desc:0 "Техническим школам нужны инструменты, преподаватели и право усомниться в уверенном ответе. Принесём в классы опыт мастерских, а в промышленность вернём знания, полученные за партами. Если Гровер находится под нашей опекой как ребёнок, ему стоит увидеть эту работу самому. У народного образования есть собственная цель независимо от того, сидит ли в классе будущий монарх."
 HSM_VER_REG_defence_articles:0 "Цена готовности"
 HSM_VER_REG_defence_articles_desc:0 "Резервная система Катрины научила Авиан ценить знание того, кто явится по призыву. За пределами Верении совету предстоит решить, как содержать такую службу. Общее ведомство снабжения согласовывало бы нужды всего края; территориальные резервы опирались бы на местных офицеров и склады. Иовинус хочет знать, кто вправе их созвать; Винсент хочет знать, кто за это заплатит."
 HSM_VER_REG_petitions_to_the_council:0 "Выслушать жалобу"
 HSM_VER_REG_petitions_to_the_council_desc:0 "В совет поступило прошение против управления восстановления. Его автор не придворный и не удобный свидетель нашей щедрости. Проведём обычное разбирательство, даже если оно поставит администрацию Катрины в неловкое положение. Ребёнку, изучающему государственные дела, если он здесь присутствует, следует увидеть: почтительный поклон не обязывает отказываться от возражений."
 HSM_VER_REG_rebuilding_the_quarters:0 "Улицы, куда хочется вернуться"
 HSM_VER_REG_rebuilding_the_quarters_desc:0 "За отремонтированными фасадами общественных зданий семьи всё ещё теснятся в повреждённых комнатах, а мастерские ждут надёжных подъездов. Отправим строительных специалистов в жилые кварталы вместе с инженерами, освоившими ремесло на войне. Теперь их опыт должен помочь сделать лестницу прочной, улицу проезжей, а доставку обыденной."
 HSM_VER_REG_reserved_house_rights:0 "Что сохраняют дома"
 HSM_VER_REG_reserved_house_rights_desc:0 "Конституционные гарантии должны защищать учреждения Верении и тогда, когда соблюдать их неудобно. Независимые дома сохраняют правительства, а сословные собрания присоединённых домов сохраняют права по хартии внутри единого государства. Суды, согласованные обязательства и ограничения связывают администрацию Катрины в обоих случаях."
 HSM_VER_REG_a_finite_guardianship:0 "Дата на последней странице"
 HSM_VER_REG_a_finite_guardianship_desc:0 "У регентства есть конец, даже если у опекунов остались незавершённые дела. Совершеннолетие Гровера прекращает их власть над ребёнком. Согласно принятому соглашению, он может стать конституционным главой Авиан-Герцландского государства, связанным сохранёнными учреждениями Верении. Ни неоконченные уроки, ни неудобная дата рождения не позволяют продлевать детство указом."
 HSM_VER_REG_a_union_without_a_throne:0 "Союз без престола"
 HSM_VER_REG_a_union_without_a_throne_desc:0 "Гражданское соглашение опирается на согласие домов и обязательства, за которые они способны отвечать. Если смерть Гровера подтверждена, оно должно признать утрату, не выдумывая преемника. Если он уже взрослый, находится за границей или его судьба неизвестна, эти обстоятельства требуют иного отношения. Управление может продолжаться без притязаний на право говорить от его имени."
 HSM_VER_REG_the_settled_frontier:0 "Обычная граница"
 HSM_VER_REG_the_settled_frontier_desc:0 "Граница должна стать местом, где перевозчик сверяет адрес, а не местом, с которого начинается очередное воззвание. Завершим ограниченное урегулирование в Герцланде, сохранив согласованные конституционные отношения домов Верении. Конституционное или гражданское будущее должно дать местным жителям основания доверять обычным делам завтрашнего дня."

 HSM_VER_REG_joint_guardianship:0 "Ограниченное регентство"
 HSM_VER_REG_joint_guardianship_desc:0 "Эри и Эйри отдельно одобрили опеку над живым несовершеннолетним Гровером VI в Авиане. Независимый дом отвечает через правительство, законно присоединённый дом голосует через сословное собрание. Катрина правит в этих пределах. Совершеннолетие, смерть или утрата необходимых условий прекращают основание полномочий; одних старых подписей недостаточно для сохранения преимуществ."
 HSM_VER_REG_civil_settlement:0 "Гражданское соглашение о Герцланде"
 HSM_VER_REG_civil_settlement_desc:0 "Эри и Эйри отдельно согласились на гражданское устройство. Независимые правительства и сословные собрания законно присоединённых домов отвечают за собственные обязательства. Ремонт и инфраструктура получают поддержку, пока действуют хартия, суверенное владение родной землёй и настоящее согласие."
 HSM_VER_REG_reserved_rights:0 "Конституционные гарантии Верении"
 HSM_VER_REG_reserved_rights_desc:0 "Сохранённые учреждения домов связывают соглашение, в том числе взрослого конституционного монарха. Независимые партнёры сохраняют правительства, а сословные собрания присоединённых домов сохраняют оговорённый голос в едином государстве. Надёжные обязательства укрепляют стабильность и производство, но требуют политического влияния для их соблюдения."
 HSM_VER_REG_joint_logistics:0 "Общие службы снабжения"
 HSM_VER_REG_joint_logistics_desc:0 "Согласованные графики и порядок снабжения позволяют Авиану быстрее готовить планы и расходовать меньше припасов. Подотчётность этих служб участникам соглашения требует постоянных политических усилий. Их полномочия не дают права командовать армией независимого дома."
 HSM_VER_REG_territorial_reserves:0 "Положения о территориальных резервах"
 HSM_VER_REG_territorial_reserves_desc:0 "Резервы, организованные вокруг знакомой местности, укрепляют оборону национальной территории и помогают соединениям восстанавливаться. Планирование замедляется: местная готовность важнее удобства единого графика. Этот порядок развивает созданную Катриной систему резервистов в согласованных пределах."

 HSM_VER_REG_settlement_business:0 "Совет по делам Герцланда"
 HSM_VER_REG_settlement_business_desc:0 "Совет может возобновить переговоры и проверить достоверные сведения о доме Гровера. Каждый дом даёт согласие через независимое правительство либо, после законного присоединения, через собственное сословное собрание. Отказ позволяет вернуться с новым предложением после установленного срока, но не создаёт заменяющих полномочий."
 HSM_VER_REG_reconsider_agreement:0 "Возобновить переговоры о соглашении"
 HSM_VER_REG_reconsider_agreement_desc:0 "В экземпляре совета ещё видны возражения, из-за которых соглашение не состоялось. Катрина велит прочитать их рядом с новым проектом, прежде чем вновь пригласить Эри и Эйри. И в вопросе опеки над Гровером, и в гражданском соглашении домам следует предложить обязательства, за которые они смогут ответить перед собственными жителями."
 HSM_VER_REG_request_household:0 "Обратиться к дому, принявшему Гровера"
 HSM_VER_REG_request_household_desc:0 "Письмо Катрины ко двору, приютившему Гровера, начинается с его уроков и повседневного ухода. Прежде чем готовить встречу, заботящиеся о ребёнке родственники должны решить, доверят ли его Авиану. Их ответ определит, где он будет жить; право править от его имени домам ещё предстоит обсудить."
 HSM_VER_REG_reopen_household:0 "Вернуться к делу императорского дома"
 HSM_VER_REG_reopen_household_desc:0 "Императорский двор рассеялся вместе с падением своего правительства. Теперь чиновники Авиана могут проследить его путь по прежним имперским землям, сверяя домовые книги, дорожные распоряжения и показания оставшихся слуг. Прежде чем кто-либо пообещает привезти сюда ребёнка, Катрина хочет получить достоверные сведения о его судьбе."
 HSM_VER_REG_industry_bonus:0 "Уроки технических школ"
 HSM_VER_REG_reconstruction_bonus:0 "Методы восстановления Грифенхейма"
 HSM_VER_REG_custody_tt:0 "Семью Гровера можно вернуть из павшей Империи или принять с согласия приютившего её дома. Запрос не даёт ни опеки, ни регентства."
 HSM_VER_REG_consent_tt:0 "Предлагает ограниченное регентство или гражданское соглашение. Оба дома должны согласиться через свои правительства или законные местные собрания. Совершеннолетие Гровера завершает регентство."
 HSM_VER_REG_grover_desc:0 "Гровер VI достиг совершеннолетия при ограниченном соглашении о Герцланде. Он сменяет Катрину как конституционный глава Авиан-Герцландского государства, связанный сохранёнными учреждениями Верении. Независимые партнёры сохраняют правительства, сословные собрания присоединённых домов сохраняют права, подтверждённые собственными голосованиями. Его наследие несёт обязанности перед живущими по этой конституции, а не безграничные притязания на континент."

 hsm_ver_regency.1.t:0 "Когда смолкли орудия"
 hsm_ver_regency.1.d:0 "За окнами Грифенхейма работал каменщик. Каждый удар прерывал офицера, объяснявшего Катрине, как далеко позволяет зайти победа. Он принёс большую карту. Она принесла хартию.\n\nВ записке Иовинуса спрашивалось, кто будет судить спор между новой администрацией и веренийским домом. В записке Винсента спрашивалось, кто заплатит войскам после окончания чрезвычайного положения. Когда-то они находили достаточно причин воевать друг с другом; Катрина с облегчением отметила, что теперь они задают трудные вопросы ей. От этого ответы не становились дешевле.\n\nИмперия напала на их союз, и необходимость защищаться привела их сюда. Теперь Катрине предстояло объяснить, что будет означать их присутствие. Она положила обе записки рядом с городскими сметами и попросила офицера оставить карту. Каменщик ударил снова. В пределах этих границ было достаточно работы."
 hsm_ver_regency.1.a:0 "Начнём с наших обязательств перед этим миром."
 hsm_ver_regency.2.t:0 "Доклад об императорском доме"
 hsm_ver_regency.2.dead.d:0 "Доклад подтверждает смерть Гровера VI. Катрина дважды прочла эту фразу, затем отложила проект, называвший её будущим регентом. Подписи под ним не будет.\n\nСекретарь спросил, не следует ли сохранить титул ради преемственности. Она посмотрела на имя в докладе. Покойный государь не мог ни нуждаться в их опеке, ни освободить их от неё; должность, занимаемая от его имени, служила бы только своим обладателям.\n\nОна поручила совету сохранить доказательства и готовить решения от собственного имени. Дома по-прежнему могли взяться за восстановление вместе. Объяснять эту работу придётся живым, не ставя отсутствующего государя между собой и ответом. Те, кто распоряжается средствами и подписывает приказы, должны будут сами отвечать за их последствия."
 hsm_ver_regency.2.minor.d:0 "Доклад об императорском доме больше не представляет собой собрание противоречащих друг другу заявлений. Гровер жив, ещё несовершеннолетний и действительно находится под опекой Авиана. Катрина закрыла дело перед приёмом чиновников, желавших обсудить его будущее.\n\nОдин подготовил церемониальную программу. Другой хотел немедленного объявления. Она прежде всего спросила, кто устроил его занятия и объяснил ли ему кто-нибудь предлагаемые перемены. Ни одного из этих вопросов в программе не было.\n\nТеперь можно честно обсуждать опеку. Для регентства всё ещё потребуется независимое согласие Эри и Эйри, а также срок окончания, который опекуны не смогут передвигать ради собственного удобства. Сегодня она вернула церемониальную программу составителю. Установить, где находится ребёнок и кто отвечает за него, означало прежде всего принять ответственность."
 hsm_ver_regency.2.adult.d:0 "Гровер VI жив и находится в Авиане, но дата рядом с его именем разрешает один вопрос: он уже достиг совершеннолетия. Катрина вернула предложенные положения о регентстве, перечеркнув заголовок.\n\nЧиновник возразил, что подготовка заняла месяцы. Она ответила, что ни один из этих месяцев не принадлежал им и вернуть их они не вправе. Опоздание с решением не может снова сделать другого грифона ребёнком.\n\nСовет продолжит работу на условиях, которые действительно способен предложить. Гражданское соглашение может организовать восстановление и защитить права домов без назначения опекуна и обещания короны. Взрослое положение Гровера следует признать само по себе, а не подгонять под незавершённый проект. Составителям придётся изменить бумаги; изменить его возраст в их власти не было."
 hsm_ver_regency.2.foreign.d:0 "Достоверные сведения помещают живого Гровера VI под ответственность другой страны. Они не помещают его под опеку Катрины. Она отделила доклад от описи грифенхеймской резиденции, куда его подшил чересчур старательный писарь.\n\nЕсли ребёнка приютили Эри или Эйри, Катрина может обратиться ко двору, отвечающему за него. Письмо должно ответить на его заботы о безопасности и воспитании Гровера. Пока тот двор не согласится, здесь нельзя обещать встречу.\n\nПока здесь нет ребёнка, от имени которого можно учредить регентство. Катрина велела секретарю убрать предполагаемую встречу из своего расписания. Город может начать восстановление, пока на конституционных переговорах рассматривают гражданское соглашение; ни одному из этих дел не требуется воображаемый гость."
 hsm_ver_regency.2.unknown.d:0 "Дело императорского дома не устанавливает оснований для опеки. Одни записи оставляют вопросы без ответа; другие несовместимы с полномочиями, которые собирается принять совет. Катрина просит секретаря сохранить все известные факты прежде, чем делать вывод.\n\nОн подготовил общий заголовок для неразрешённых сведений. Она возвращает его. Недостаток доказательств, противоречивые записи и существующее положение, исключающее опеку, не могут означать одно и то же. Доклад должен сохранять эти различия, даже если они мешают дать удобную рекомендацию.\n\nНи нового прибытия, ни смерти не объявят лишь ради разрешения трудности. Достоверные сведения могут оправдать повторную проверку, но только при условиях, которые действительно её допускают. Гражданское соглашение позволит продолжить управление, пока совет признаёт пределы выводов из этого дела."
 hsm_ver_regency.2.a:0 "Записать лишь то, что известно."
 hsm_ver_regency.3.t:0 "Два предложения перед домами"
 hsm_ver_regency.3.d:0 "Катрина прочла предлагаемые полномочия вслух. Общий суд должен связывать главу государства; обязательства восстановления следует записать до военных обещаний. Представители домов не позволяли победе решить эти вопросы за них.\n\nОдин текст предлагал ограниченное регентство для живого несовершеннолетнего, действительно находящегося в Авиане. Другой поручал общую работу гражданскому соглашению. Оба сохраняли учреждения домов и требовали двух отдельных ответов.\n\nСекретарь приготовил дипломатические копии для сохранивших независимость правительств. Там, где дом законно вошёл в единое государство, те же положения получит местное сословное собрание. Его голос всё ещё необходим. Катрина выбрала предложение для обсуждения."
 hsm_ver_regency.3.a:0 "Предложить ограниченное регентство."
 hsm_ver_regency.3.b:0 "Предложить гражданское соглашение."
 hsm_ver_regency.4.t:0 "Ответ на грифельной доске"
 hsm_ver_regency.4.child.d:0 "Гровер ожидал, что при его появлении техническая школа прекратит работу. Вместо этого преподаватель поставил для него табурет рядом с ученицей мастерской и попросил переписать расчёт с доски. Ученица взглянула на ответ, помедлила, затем указала на пропущенный допуск на потери металла.\n\nГровер покраснел. Он посмотрел на Катрину, беседовавшую с мастером. Она подошла, изучила цифры и попросила ученицу объяснить. Исправление осталось.\n\nПозже Гровер признался, что считал знание правила достаточным. Катрина сказала, что тем, кому придётся подгонять деталь, ошибка откроется независимо от автора ответа. Он попросил чистый лист и проделал расчёт снова. На этот раз он проверил и ту строку, которую прежде счёл лишней.\n\nПосетители школы ушли с чертежами для мастерских. Гровер сохранил первый лист вместе с исправленным."
 hsm_ver_regency.4.d:0 "Преподаватель положил на стол две металлические детали. Каждая соответствовала чертежу своего ведомства; друг к другу они не подходили. Приехавшие чиновники ждали, когда назовут виновную мастерскую. Вместо этого ученица принесла оба чертежа.\n\nКатрина попросила её объяснить различие всем собравшимся. Это заняло больше времени, чем отводила программе показательная работа. К концу объяснения писари, отвечавшие за технические требования, уже задавали собственные вопросы, а один зачеркнул уверенную запись в инспекционной книге.\n\nТехнические школы будут передавать свои методы промышленности, а мастерские сообщать о трудностях применения. Этот урок принадлежит каждому, чья работа зависит от чужого ответа. Ему не требуется именитый ученик, чтобы заслуживать преподавания. В следующий раз детали должны будут подходить друг к другу ещё до приезда гостей."
 hsm_ver_regency.4.a:0 "Сохранить исправление вместе с уроком."
 hsm_ver_regency.5.t:0 "Кто будет готов?"
 hsm_ver_regency.5.d:0 "Катрина узнала доводы офицера резерва прежде, чем он закончил. В системе резервистов Авиана чувствовалась её работа: знакомые пункты сбора, офицеры, знающие свои округа, склады рядом с домами тех, кому понадобятся припасы. Он предлагал развить её в рамках соглашения.\n\nНапротив офицер снабжения разложил железнодорожное расписание. Местная готовность не заставит прибыть пропавшую партию. Он предложил общие склады и центральное ведомство, которое согласует заявки прежде, чем двум колоннам пообещают один поезд. Окружным командирам придётся принять его приоритеты, а совету придётся отвечать на их возражения.\n\nДелегация Иовинуса требовала записать пределы общей власти. Делегация Винсента хотела систему, которая продолжит работать после отставки нынешних офицеров. Резервист предостерегал от опустошения местных складов ради дальних планов; снабженец спрашивал, как местный порядок справится с угрозой нескольким округам сразу. Катрина оставила в протоколе оба вопроса."
 hsm_ver_regency.5.a:0 "Обеспечить работу общих служб снабжения."
 hsm_ver_regency.5.b:0 "Сделать ставку на территориальные резервы."
 hsm_ver_regency.6.t:0 "Просительница, которая не ушла"
 hsm_ver_regency.6.child.d:0 "Просительница поклонилась Гроверу и снова обратилась к совету. Склад управления восстановления перекрыл въезд в её мастерскую. Ей обещали другой подъезд; теперь ответственный чиновник уверял, что речь шла только о проходе пешком.\n\nГровер шепнул, что Катрина наверняка может приказать убрать повозки. Катрина попросила дослушать. Склад снабжал ремонт в других местах, а у его начальника были собственные распоряжения. Совету следовало услышать их прежде, чем решать, что должна администрация.\n\nЗакончив говорить, просительница оставалась недовольна. Служитель потянулся за следующим именем, но Гровер заметил, что её вопрос не внесли в протокол. Он попросил писаря прочесть запись вслух.\n\nКатрина позволила ему прервать порядок. Позже Гровер спросил, не накажут ли женщину за резкие слова. Она велела ему вспомнить этот вопрос, когда жалобы будут адресованы ему самому."
 hsm_ver_regency.6.d:0 "Просительница принесла небольшой рисунок въезда в свою мастерскую. Склад управления восстановления перекрыл дорогу повозкам, которые прежде свободно туда проезжали. Чиновник совета указал на приказ об устройстве склада; она указала на письменное обещание другого подъезда. Обе бумаги несли знак администрации.\n\nКатрина попросила писаря положить их рядом. Ремонт одного квартала не мог заставить исчезнуть ущерб, причинённый другому. Начальнику склада предстояло объяснить препятствие, а совету установить, что именно обещали мастерской.\n\nЖенщина ушла, не похвалив слушание. Её жалоба осталась открытой, с ведомством, ответственным за ответ. Катрина наблюдала, как писарь заносит это обязательство в протокол. Давать публике слово означало принимать, что некоторые посетители уйдут всё ещё в ожидании решения, а не с благодарностью за оказанный приём."
 hsm_ver_regency.6.a:0 "Записать жалобу и выслушать ответ."

 hsm_ver_regency.7.t:0 "Последний день опекунов"
 hsm_ver_regency.7.d:0 "Юридический советник придумал полезную формулировку: опека продолжится, пока совет не сочтёт переход завершённым. Катрина попросила прочесть её Гроверу. Советник внезапно нашёл несколько оговорок, заслуживающих упоминания.\n\nГровер хотел знать, считается ли завершением окончание учёбы, согласие с советом или просто ожидание, пока все останутся довольны. Советник не мог назвать дату. Катрина перечеркнула формулировку. Совершеннолетие уже давало ответ.\n\nУ неё ещё были уроки, которые она надеялась ему преподать, и ошибки, от которых хотела уберечь. Ни та ни другая надежда не позволяла удерживать его в детстве. Конституция предлагала ему возглавить Авиан-Герцландское государство; права Верении оставались обязательными для его правительства, а дома сохраняли полномочия, закреплённые за их правительствами или сословными собраниями.\n\nГровер изучил исправленную страницу. На этот раз он смог найти место, где заканчивались полномочия опекунов."
 hsm_ver_regency.7.after.d:0 "Секретарь совета нашёл старый план опеки среди бумаг к окончательному урегулированию. Несколько пунктов остались невыполненными. Он спросил, следует ли перенести их дальше на основании прежних полномочий.\n\nОтвет лежал на последней странице. Регентство больше не действовало, и незавершённая программа не могла его продлить. Обязательствами должны заниматься учреждения, имеющие право действовать теперь. Конституционное преемство принадлежит взрослому; прекращение опеки по иной причине требует собственного честного разбора. Прежняя печать не способна разрешить ни один из этих вопросов сама по себе.\n\nСекретарь перенёс оставшиеся дела в обычную повестку, сохранив прежнюю дату окончания. Ценность соглашения проверит способность отказаться от однажды полученной власти, в том числе тогда, когда её сохранение могло бы облегчить следующее заседание."
 hsm_ver_regency.7.a:0 "Окончание тоже входит в обещание."
 hsm_ver_regency.8.t:0 "Дома выступают от своего имени"
 hsm_ver_regency.8.dead.d:0 "В проекте церемонии оставалось пустое место для государя, от имени которого совет когда-то рассчитывал действовать. Смерть Гровера была подтверждена. Катрина попросила убрать это место из плана.\n\nДелегация Винсента хотела, чтобы соглашение признало утрату. Делегация Иовинуса хотела знать, кто будет отвечать за его решения. Она не видела противоречия. Документ мог сохранить имя Гровера, не делая его автором обязательств, которых он никогда не прочтёт.\n\nГражданское соглашение подписали от имени домов, принявших его условия. Ремонт, счета и сохранённые права домов будут опираться на их согласие. Преемника не объявили, и ни один регент не получил бессрочной власти над пустым креслом.\n\nКогда бумаги разложили для заседания, каждое место принадлежало тому, кому можно было задать вопрос."
 hsm_ver_regency.8.d:0 "Печатник оставил в заголовке соглашения место для монаршего титула. Катрина вернула корректуру, вписав туда названия согласившихся домов. Гражданское соглашение могло говорить от их имени.\n\nДаже присутствие ребёнка не назначало совет его опекуном без отдельного соглашения. Положение Гровера нельзя было свести к удобному отсутствию. Взрослого нельзя подчинить новому регентству; зарубежный дом нельзя объявлением перенести сюда; неразрешённый доклад не устанавливает смерти. Ни одно из этих обстоятельств не давало совету права управлять через него.\n\nПредставители Иовинуса и Винсента проверили положения о сохранении прав домов. Чиновники восстановления проверили, кто будет отвечать за их счета. Для настоящего соглашения между ответственными учреждениями работы было достаточно. Печатник мог убрать пробел, не выдумывая престола для его заполнения. Следующая строка уже называла обязанности, которые подписанты принимали на себя."
 hsm_ver_regency.8.a:0 "Пусть за соглашение отвечают подписанты."
 hsm_ver_regency.9.t:0 "Дорога за воротами"
 hsm_ver_regency.9.regency.d:0 "Выезжая из Грифенхейма, перевозчик остановился у ворот и спросил, какое ведомство разбирает спорную поставку через веренийскую границу. Стражник дал ему адрес. Речи о судьбе континента не последовало.\n\nКатрина услышала об этом вечером, между докладом о резервных порядках и бумагами по дому Гровера. Когда-то она тратила целые визиты, убеждая Иовинуса и Винсента подумать, с чем мог бы согласиться другой. Теперь их представители могли настаивать на принятых правах, а её администрация имела учреждения, обязанные отвечать.\n\nГровер оставался несовершеннолетним. Регентство оставалось обязанностью с определённым концом, а не титулом, увековеченным успешным восстановлением. За воротами жили соседи и заказчики, возникали трудные вопросы. Катрина надеялась, что унаследованное им государство научится ладить с соседями, работать с заказчиками и отвечать на вопросы без нового расширения границ."
 hsm_ver_regency.9.adult.d:0 "Донесение на имя Гровера VI касалось спора о поставке на веренийской границе. Оно прошло через ведомства, названные в хартии, прежде чем попасть к конституционному главе Авиан-Герцландского государства. Он прочёл приложенные заключения раньше просьбы обратить внимание на дело.\n\nСохранённые права домов оставались обязательными. Их представители приводили доводы, а не просили разрешения обладать собственными правами. В старой имперской столице теперь работало правительство, глава которого был связан соглашением, неотменимым ни наследованием, ни воззванием.\n\nСледующее донесение касалось ремонта жилой улицы. Гровер положил его рядом с первым. Соглашение отвело его должности определённое место в управлении. У него будет достаточно возможностей узнать, сколь многого требует это место, не приобретая ни одной новой провинции."
 hsm_ver_regency.9.d:0 "Объявление у грифенхеймских ворот указывало адрес для споров о доставке, ведомство по счетам восстановления и часы приёма прошений. Дождь размочил один угол. Привратный писарь попросил другой экземпляр, с буквами покрупнее.\n\nКатрина одобрила небольшой расход. Утром пришли донесения от домов: вопросы о согласованной работе, жалобы на задержки, предложения к следующему заседанию. Дома сохранили оговорённый голос, а гражданское соглашение обрело обычные дела, которым не требовалось имя государя для оправдания.\n\nСпоры о требованиях соглашения ещё будут возникать. Его суды, счета и сохранённые права давали этим спорам место. Границе больше не требовалось обещать очередное завоевание. Перевозчику, ожидавшему у ворот, нужен был адрес, который можно прочесть под дождём."
 hsm_ver_regency.9.a:0 "Хранить верность соглашению."
 hsm_ver_regency.10.t:0 "Авиан просит нашего согласия"
 hsm_ver_regency.10.regency.d:0 "Предложение Катрины касается живого несовершеннолетнего Гровера VI, находящегося сейчас под опекой Авиана. Она просит наш дом одобрить ограниченное регентство: во время его несовершеннолетия управлять продолжит она, а согласованная конституция предусмотрит его будущее положение во главе Авиан-Герцландского государства.\n\nНаши писари отметили положения, сохраняющие учреждения Верении и права Эри и Эйри. Предлагаемая верховная должность не присоединяет независимого партнёра. Она не позволяет менять наши обязанности лишь потому, что опекун считает более широкую власть полезной.\n\nСовет просит ответа нашего собственного правительства. Регентство начнёт действовать только после согласия обоих домов. Мы можем счесть гарантии достаточными или отказаться без ущерба для существующей хартии. Победа придаёт письму срочность; согласие ему может дать только наша подпись."
 hsm_ver_regency.10.d:0 "Авиан представил гражданское соглашение о Герцланде. Катрина предлагает общую работу над восстановлением и обороной в рамках действующей хартии, с защитой сохранённых учреждений Верении. Этот текст не предполагает ни опеки, ни монаршей власти.\n\nПредлагаемые обязательства всё равно заслуживают внимательного рассмотрения. Нашему правительству предстоит отвечать за принятое, а соглашение вступит в силу только после согласия и Эри, и Эйри. Гражданский заголовок не может превратить нашу подпись в формальность.\n\nПисари разложили положения рядом с первоначальной хартией. Мы можем подписать их, помогая дать восстановлению надёжную основу, или отказаться, сохранив нынешние права. Катрина получит ответ на это предложение, а не обещание соглашаться со всякой будущей просьбой. Именно этот документ будет определять объём принятой нами ответственности."
 hsm_ver_regency.10.a:0 "Дать самостоятельное согласие нашего дома."
 hsm_ver_regency.10.b:0 "Отклонить предложенное соглашение."
 hsm_ver_regency.11.t:0 "Ответы получены"
 hsm_ver_regency.11.d:0 "Второе согласие поступило с просьбой прислать рабочие бумаги. Катрина положила его рядом с первым. Эри и Эйри приняли предложение от собственного имени: через правительство либо сословное собрание, уполномоченное говорить за присоединённый дом.\n\nСекретарь предложил поздравления. Она попросила доставить копии до первого заседания. Представители теперь могли требовать от её администрации соблюдения сказанного; эти слова должны лежать перед ними."
 hsm_ver_regency.11.refused.d:0 "Ответ был отказом. Катрина прочла его совету, не смягчая смысла. Требовалось согласие обоих домов, и предложение его не получило.\n\nСоветник предложил сохранить полезные части под гражданским заголовком. Она спросила, где дома подписали такое соглашение. Подобного документа не существовало. После установленного интервала переговоры можно возобновить с другим предложением, но и для него потребуются отдельные ответы.\n\nДействующая хартия сохранялась. Отказавшийся дом не получил наказания, а заменяющего соглашения не провозгласили. Приглашение отправилось в дело с приложенным ответом."
 hsm_ver_regency.11.a:0 "Исходить из действительно полученных ответов."
 hsm_ver_regency.12.t:0 "Просьба о Гровере"
 hsm_ver_regency.12.d:0 "Гровер жив, ещё несовершеннолетний и находится в нашем доме; он не правитель, которого Авиан может отозвать. Катрина письменно спрашивает, согласимся ли мы поручить его заботам Авиана, пока обсуждается соглашение о Герцланде. Отвечать на эту просьбу нам.\n\nСлужащие дома спросили, что будет с его уроками и привычным распорядком. Это разумные вопросы о ребёнке, чьё будущее вызывает слишком много речей. Согласие позволит передать его; оно не станет нашей подписью под регентством или гражданским соглашением. Эти решения остаются отдельными.\n\nМы можем согласиться на переезд или сохранить нынешнюю ответственность. Отказ оставит его здесь и не лишит наш дом места в хартии. Письмо Катрины просит согласия, и дом должен иметь возможность полагаться на это различие."
 hsm_ver_regency.12.a:0 "Поручить Гровера заботам Авиана."
 hsm_ver_regency.12.b:0 "Оставить его в нашем доме."
 hsm_ver_regency.13.t:0 "Полномочия окончены"
 hsm_ver_regency.13.d:0 "Совет прекратил полномочия ограниченного регентства. Условия, на которых он принял опеку, больше не соблюдаются. Его печать не может обеспечить присутствие живого ребёнка под его заботой или сохранить правительство, переставшее отвечать соглашению.\n\nСекретарь собирает неисполненные распоряжения и отмечает те, что зависели от этих полномочий. Теперь каждое предстоит рассмотреть на действительных основаниях. Смерть, перемена опеки и политический разрыв означают разные обстоятельства; само прекращение регентства не позволяет ему выдумать ни одного из них.\n\nДома смогут обсудить новое гражданское соглашение, когда позволят условия, с новым согласием каждого. До тех пор бывшие опекуны не вправе превращать незавершённые обязанности в разрешение продолжать работу на прежнем основании. Папку с их поручениями придётся закрыть именно с такой записью."
 hsm_ver_regency.13.a:0 "Закрыть регентское поручение."
 hsm_ver_regency.14.t:0 "Теперь подпись принадлежит ему"
 hsm_ver_regency.14.memory.d:0 "Гровер принёс на конституционное заседание две старые бумаги. Одна содержала расчёт с пропущенным допуском на потери металла. Другая была его копией прошения мастерской, включая вопрос, который писарь едва не пропустил. Катрина узнала обе.\n\nОн помнил, как посмотрел на неё, когда ученица поправила его. Помнил и ожидание, что она освободит перекрытый въезд одним приказом. Ни одно воспоминание особенно ему не льстило. Он сохранил бумаги, потому что ответ оказался важнее того, как он выглядел, узнавая его.\n\nСовершеннолетие завершило регентство. Теперь он сменит Катрину как конституционный глава Авиан-Герцландского государства. Присяга обязывала его правительство соблюдать сохранённые учреждения Верении; дома сохраняли права, которых его корона не могла поглотить.\n\nКатрина передала перо. Гровер проверил, приложены ли гарантии к присяге, и подписал. Затем убрал старые бумаги к своим вещам. Они ещё понадобятся."
 hsm_ver_regency.14.d:0 "Служитель объявил Гровера VI, и Катрина поднялась с места, которое занимала во время регентства. Совершеннолетие завершило опеку. Конституционное заседание теперь передаст взрослому его собственную ответственность.\n\nГровер прочёл присягу прежде, чем взять перо. Ему предстояло сменить её во главе составного Авиан-Герцландского государства, подчиняясь учреждениям соглашения и сохранённым правам Верении. Представители Эри и Эйри пришли с полномочиями своих правительств или сословных собраний. Присяга не могла ни присоединить независимого партнёра, ни стереть права внутри единого государства.\n\nКатрина спросила, хочет ли он ещё что-нибудь услышать. Он попросил прочесть положения об общих учреждениях. Писарь прочёл их, не сокращая ограничений, возлагаемых на нового главу государства. Затем Гровер подписал.\n\nНа соседнем столе уже лежали бумаги, требовавшие его внимания. Первый день начинался с того государства, которое он действительно унаследовал."
 hsm_ver_regency.14.a:0 "Принести конституционную присягу."
 hsm_ver_regency.15.t:0 "Приглашение без двух ответов"
 hsm_ver_regency.15.d:0 "Срок предложения прошёл без двух действительных согласий, необходимых для его принятия. Секретарь не может сказать, каждое ли приглашение попало на нужный стол. Он может сказать, что у совета нет необходимых подписей.\n\nКатрина приказывает закрыть незавершённое предложение. Молчание не возложит обязательств ни на один дом, а неподписанное регентство не заменят гражданским соглашением. По истечении интервала между приглашениями можно будет рассмотреть новый проект, заново проверив обстоятельства.\n\nПока мерой взаимных обязательств домов и общей администрации остаётся действующая хартия."
 hsm_ver_regency.15.a:0 "Закрыть предложение без ответа."

