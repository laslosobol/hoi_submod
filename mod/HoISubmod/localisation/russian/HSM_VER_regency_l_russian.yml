 hsm_ver_regency.16.t:0 "Сословия Эри занимают места"
 hsm_ver_regency.16.d:0 "Представители Эри пришли без дипломатических грамот. Их дом законно вошёл в единое государство, и прежняя иностранная канцелярия больше не говорит от его имени. На столе лежат первоначальная хартия, акт основания и предлагаемые статьи о Герцланде.\n\nДелегат мастерской спрашивает, кто рассмотрит жалобу на управление восстановлением. Землевладелец спрашивает, можно ли расширить сохранённые обязательства без нового обсуждения. Писарь вносит ограничения в протокол. Теперь сословия должны дать собственный ответ. Присоединение не дало заранее голоса за это соглашение, а заседание не устанавливает ни местонахождение Гровера, ни чью-либо опеку над ним."
 hsm_ver_regency.16.a:0 "Записать голос сословий Эри за соглашение."
 hsm_ver_regency.16.b:0 "Не давать согласия Эри."
 hsm_ver_regency.17.t:0 "Сословия Эйри читают статьи"
 hsm_ver_regency.17.d:0 "Делегаты Эйри принесли экземпляр хартии с пометками. После законного присоединения их споры решаются в общем совете, но право спорить они не уступили. На полях одного положения о Герцланде стоят три разных замечания.\n\nПредседатель просит прочесть каждое возражение до голосования. Законная ограниченная опека должна завершиться совершеннолетием; гражданское соглашение должно отвечать за собственные счета. Ни одно нельзя оправдать мнимой подписью исчезнувшего правительства. Собрание вправе одобрить статьи или вернуть предложение. Ответ запишут здесь, в стране, чьё правительство обязано его уважать."
 hsm_ver_regency.17.a:0 "Записать голос сословий Эйри за соглашение."
 hsm_ver_regency.17.b:0 "Не давать согласия Эйри."
