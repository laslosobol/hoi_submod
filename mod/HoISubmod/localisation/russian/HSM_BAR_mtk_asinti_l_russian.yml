l_russian:
 HSM_BAR_mtk_ritual_brake_title:0 "Тормоз ритуала"
 HSM_BAR_mtk_ritual_brake_idea:0 "Начальная запись в тетради ритмов.\n\nРитуал порой продолжается, когда певец уже замолчал. Последняя фраза остаётся в круге и питает следующую, пока истощение не разорвёт цепь. Предлагаю окончание, которое намеренно убирает эту подпитку, не разрывая весь узор. Помощник должен суметь исполнить его даже тогда, когда я полностью поглощён слушанием. Я помню, как не мог прекратить начатое другим существом. Эта память не всегда облегчала попытки прервать меня самого. Первую схему проверим без призыва собеседника, на одном возвращающемся звуке.\n\nПодпись: Асинти.\nВиира, от руки: На первом чертеже знак остановки находится под твоим собственным копытом. Перенеси его туда, где дотянется кто-то другой."
 HSM_BAR_mtk_ritual_brake_theory:0 "Разбор возвращающейся фразы.\n\nРассмотрим круг как последовательность, где каждая завершённая фраза усиливает следующую. Простое прекращение вклада певца может оставить достаточно накопленной силы для нескольких оборотов. Предлагаемый тормоз вводит гасящий ритм и отводит остаток в безгласный глиняный резонатор. Измерять нужно поле после последней слышимой ноты, а не одну тишину. Сравним обычные окончания, оборванное пение и остановки помощником при разной начальной силе. Опыт касается ритуалов, всё ещё питаемых нашим контуром, а не любого присутствия, способного существовать независимо от него.\n\nПодпись: Асинти.\nЛеопольд, карандашом у резонатора: Глина трескается. Покажи, куда тогда уходит оставшаяся сила. Одной надежды на аккуратного помощника здесь недостаточно."
 HSM_BAR_mtk_ritual_brake_tests:0 "Проверки остановки при наблюдении извне круга.\n\nПервое оборванное пение оставило возвращающийся импульс ещё на семь ударов. После добавления глиняного отвода шестнадцать остановок помощником завершили измеряемый цикл без обратного всплеска; четыре были начаты, пока я продолжал вводную фразу. Наша помощница, олениха Хелла, разбила один резонатор при стендовой проверке; парный запасной принял остаток. На последнем испытании она остановила многообещающий отклик. Я начал возражать, затем посмотрел на успокоившиеся приборы. Остановка сработала без моего содействия, и новые колебания не появились.\n\nПодписи: Асинти; Хелла.\nПоправка Хеллы от руки: Он возражал целых два предложения. Оба внесены в мои записи времени. Прошу сохранить их и в чистовике."
 HSM_BAR_mtk_ritual_brake_conclusion:0 "Учебная копия завершённой каденции.\n\nТормоз надёжно завершает проверенные ритуалы, убирая поддерживающий ритм и отводя остаток. Парные резонаторы требуют осмотра; после прекращения голосов нужно продолжать наблюдение за полем. Это не заклинание для стирания независимого существа. Ученики уже завершили одно упражнение с тремя разными певцами, включая певицу, чьё чувство такта мне не нравится. Все три цикла остановились. Учебный барабан должен стоять на стороне помощника, а не руководителя. Копия нот остаётся рядом с ним.\n\nПодпись: Асинти.\nСильвер Стар, от руки: Ты поправлял её произношение прямо во время показа.\nОтвет Асинти: Произношение было плохим. Остановка была совершенно действенной. Внесите в отчёт оба обстоятельства."

 HSM_BAR_mtk_silent_witness_title:0 "Безмолвный свидетель"
 HSM_BAR_mtk_silent_witness_idea:0 "Заявка на разговор с отсутствующим свидетелем.\n\nНекоторые отвечающие голоса предлагают имена, воспоминания и уверенность прежде, чем задан вопрос. Когда-то я принимал такую щедрость от своего потустороннего покровителя Освананги, не спрашивая, чего ему стоил ответ. Здесь предлагаю проверить более узкое утверждение: способен ли мнимый свидетель сообщить независимо проверяемое сведение, которого слушатели ещё не знают? Прежде чем обращаться к скорбящей семье, следует воспользоваться подготовленными записями и скрытыми от ведущих предметами. Знакомый голос сам по себе не устанавливает личность говорящего.\n\nПодпись: Асинти.\nСильвер Стар, от руки: Последнее предложение ты написал очень твёрдо. Прочти его вслух, когда голос скажет то, что тебе хочется услышать."
 HSM_BAR_mtk_silent_witness_theory:0 "План отделения ответа от подсказки.\n\nЗаявленный свидетель должен различать четыре возможных знака в закрытой коробке, содержимое которой неизвестно всем ведущим сеанс. В отдельных испытаниях исторические подробности сравним с документами, хранящимися в другом месте. Формулировки вопросов должны совпадать; записывающий узнает верный знак лишь после закрепления ответа. Добавим пустые коробки и вымышленные имена. Если ответы следуют ожиданиям спрашивающего, источник остаётся неясным даже при убедительном голосе. Существование духа само по себе не доказывает ни его честности, ни хорошей памяти.\n\nПодпись: Асинти.\nВиира, от руки: Включай в расшифровку собственные паузы. Ты умеешь подсказать ответ, не произнося ни слова. Одних одинаковых вопросов для сравнения мало."
 HSM_BAR_mtk_silent_witness_tests:0 "Сравнение записей двадцати четырёх сеансов с коробками.\n\nШесть ответов совпали с целевыми знаками из четырёх возможных: ровно столько ожидается при угадывании. Пустые коробки получили уверенные описания предметов. При проверке документов вымышленный свидетель подробно рассказал о детстве, а смена подсказанной фамилии изменила предполагаемое воспоминание. Устранение моих наводящих пауз сократило рассказы, но не повысило точность. Ни одно историческое утверждение не выдержало независимой проверки как сведение, недоступное участникам. Мы не установили, кто отвечал и был ли вообще отдельный собеседник.\n\nПодписи: Асинти; Виира.\nАсинти, от руки под подписью: Один рассказ я отметил как убедительный, потому что он звучал доброжелательно. Виира заставила вынести это слово в отдельную графу."
 HSM_BAR_mtk_silent_witness_conclusion:0 "Итоговая оценка заявления о свидетеле.\n\nБезмолвный свидетель потерпел неудачу. Процедура не дала достоверных показаний, пригодного способа установить личность или надёжных сведений сверх знаний участников. Её голоса нельзя предлагать как доказательства, разведывательные данные или помощь скорбящим семьям. Практической пользы от этого метода нет. Записи остаются неудачными наблюдениями, а не беседами, которым задним числом удостоверили подлинность. Я не стану просить слушателей восполнить верой то, чего опыт не смог доказать. Повторять процедуру для посетителей клиники оснований нет.\n\nПодпись: Асинти.\nСильвер Стар, от руки: Ты всё ещё думаешь, что один голос тебя знал.\nОтвет Асинти: Да. Поэтому я попросил тебя подписать эту оценку вместе со мной."

 HSM_BAR_mtk_place_memory_title:0 "Память места"
 HSM_BAR_mtk_place_memory_idea:0 "Заявка на обследование, с кирпичом из старого зала.\n\nКомната иногда отвечает на чары спустя долгое время после ухода заклинателя. Я хочу выяснить, удерживает ли камень измеримое изменение и оставляют ли разные воздействия различимые следы. Привычное выражение память места соблазняет представить правдивую сцену, ожидающую повторного показа. Начинать следует с кирпичей, обработку которых записали мы сами. Нетронутый, выветренный и перемещённый камень должен войти в сравнение наряду с самой старой найденной стеной. Для каждого образца потребуется отдельная запись происхождения.\n\nПодпись: Асинти.\nЛеопольд, от руки: Ты принёс живописные руины к вопросу о свойствах материала. Принеси двадцать обыкновенных кирпичей и скажи, из какой они стены."
 HSM_BAR_mtk_place_memory_theory:0 "О следах без рассказчика.\n\nПредложенная модель рассматривает магическое воздействие как изменение отклика материала на последующее исследование. Разные камни могут удерживать разные составляющие, а вода, нагрев и новые чары способны их перезаписывать. След не обязан содержать изображение, имя или порядок событий. Подготовим парные кирпичи с известными последовательностями, включая одинаковые воздействия в обратном порядке. Исследователи зарисуют показания до получения списка обработок. Описанные сцены будем сравнивать между наблюдателями отдельно от отметок приборов. Совпадение рисунков само по себе не заменит измерения.\n\nПодпись: Асинти.\nВиира, от руки: Если прибор и наблюдатель расходятся, не называй наблюдателя более чувствительным по умолчанию. Когда-то ты делал это ради меня."
 HSM_BAR_mtk_place_memory_tests:0 "Серия кирпичей и повторный визит в зал.\n\nИсследователи обнаружили прежнюю магическую обработку в семнадцати из двадцати образцов с неизвестными им обозначениями. Иногда удавалось отличить нагревательные чары от связывающих, но перестановка двух воздействий давала неразличимые показания. Дождь ослаблял оба следа. В зале якобы древний отпечаток оказался связан с новым кирпичом, принесённым из мастерской месяц назад. Двое наблюдателей описали разные фигуры у одной отметки; ни один рисунок не совпал с записью показательного опыта. Отклик материала повторялся. Предполагаемая сцена не повторялась.\n\nПодписи: Асинти; Хелла.\nХелла, от руки: Он называл мой рисунок воображением, пока не заметил на собственной фигуре плащ, которого не носил никто из участников показа."
 HSM_BAR_mtk_place_memory_conclusion:0 "Заключение обследования, переданное каменщикам.\n\nНекоторые материалы удерживают обнаружимые магические следы. Они позволяют выбирать места дальнейших проб и устанавливать изменение поверхности с поправкой на выветривание и последующее использование. Буквальной, правдивой истории эти следы не дают. Нельзя установить виновника, произнесённое обещание или последовательность событий, просто попросив стену вспомнить. Перемещённый кирпич уносит свой след в другое место. Каменщики получили план изменённой кладки с неясными показаниями, отмеченными для повторной проверки. Дата ремонта внесена рядом с каждым заменённым участком.\n\nПодпись: Асинти.\nВиира, от руки: Твоя лекция всё ещё начинается с прекрасного видения.\nОтвет Асинти: Я перенёс новый кирпич на кафедру. Такое начало льстит мне гораздо меньше."

 HSM_BAR_mtk_threshold_compass_title:0 "Компас порога"
 HSM_BAR_mtk_threshold_compass_idea:0 "Заявка на прибор после обследования западной камеры.\n\nКомпас указывает куда-то; предлагаемый прибор должен сообщать, когда это куда-то перестаёт вести себя как здесь. У границы ритуала два одинаковых резонатора, возможно, начнут отвечать вразнобой, даже не усиливая звук. Если разницу удастся измерить, к краю можно будет приближаться по результатам съёмки, не доверяясь дрожи шамана. Рядом с намеренно поднятыми порогами проверим обычные чары и металлические крепления. Прибор должен отличать границу от простой магической силы. Первые проходы нанесём на план камеры независимо друг от друга.\n\nПодпись: Асинти.\nЛеопольд, от руки: Дай мне измеримую величину, а не очередной рисунок дверного проёма. В мастерской достаточно дверей."
 HSM_BAR_mtk_threshold_compass_theory:0 "Расчёт разности откликов резонаторов.\n\nДва одинаковых кристалла получают один пробный импульс: один открыт, другой заключён в опорное кольцо. Обычные изменения фоновой силы должны затрагивать оба. Граница, меняющая возврат импульса, может сдвигать время их ответа относительно друг друга. Поворачивая и перемещая пару, нанесём изменение на карту, затем повторим с переставленным кольцом. Близкая машина способна искажать показания; перед объявлением порога нужна калибровка рядом с ней. Уравнение ничего не говорит ни о месте назначения, ни о намерениях существ за границей.\n\nПодписи: Асинти; Леопольд.\nВиира, от руки: Полезное уравнение. Опорное кольцо пока остаётся гипотезой. Испытайте его там, где не ожидаете ничего интересного."
 HSM_BAR_mtk_threshold_compass_tests:0 "Журнал съёмки, восемнадцать проходов.\n\nЗа восемнадцать проходов через шесть подготовленных границ стрелка меняла направление в пределах ширины копыта от края, независимо нанесённого подвешенными пробными нитями. Поворот прибора сохранял линию на карте. Сильные обычные лампы повышали оба отклика, не создавая ложного порога. Рядом с питанием мастерской три показания стали неоднозначными; после местной калибровки повторные проходы восстановили известную границу. Стена с внушительным нарисованным проёмом отклика не дала. Хелла сохранила стену в серии после моего предложения её исключить.\n\nПодписи: Асинти; Хелла; Леопольд.\nХелла, от руки: Он сказал, что образованный наблюдатель не обманется. Прибор не образован. В этом и состоит немалая часть его пользы."
 HSM_BAR_mtk_threshold_compass_conclusion:0 "Заключение о приёмке измерительного прибора.\n\nКомпас обнаруживает и наносит на карту проверенные магические границы после местной калибровки. Другой наблюдатель теперь может проверить, где ритуал меняет окружающее поле, включая участки, на которых мои ощущения неясны. Прибор не называет дальнюю сторону, не гарантирует прохода и не оценивает собеседника. Машины всё ещё способны испортить показания, поэтому опорная проверка сопровождает каждое применение. Двое учеников независимо перерисовали край западной камеры и получили согласующиеся планы.\n\nПодпись: Асинти.\nЛеопольд, от руки: Стрелка моя; перестань рассказывать посетителям, что она следует твоему духовному сродству.\nОтвет Асинти: Стрелка твоя. Первые три непригодных корпуса тоже твои. Все три оставлены для сравнения."

 HSM_BAR_mtk_empty_vessel_title:0 "Пустой сосуд"
 HSM_BAR_mtk_empty_vessel_idea:0 "Заявка на незанятое место для собеседника.\n\nЯ пришёл в Касу беглым рабом; обещание общей свободы дало моей работе цель помимо выживания. Позднее меня изгнали за опыты, переносившие потусторонних существ в живые тела. Эта история не доказывает необходимости тела. Предлагаю керамический сосуд, чей временный магический узор позволит ответить, не занимая чужих чувств и конечностей. Освананга льстил моему исключительному духу, толкая других к зависимости; я больше не считаю предложенное им решение единственно возможным. Первый образец должен поддерживать лишь самый простой различимый знак.\n\nПодпись: Асинти.\nСильвер Стар, от руки: Тогда нарисуй сосуд, который не напоминает ожидающего пациента. Твоя первая схема слишком хорошо знает старую дорогу."
 HSM_BAR_mtk_empty_vessel_theory:0 "Модель временного внешнего проявления.\n\nВозможно, живой носитель предоставляет устойчивый узор, а не незаменимую душу. Тогда начертанная керамическая решётка могла бы поддерживать гораздо более простой способ общения: одну движущуюся отметку, одну смену тона. Гипотеза не требует полного тела или собеседника, остающегося после отключения питания. Сравним пустые сосуды, неактивные надписи и питаемые решётки, записывая каждую отметку независимо от впечатлений слушателя. Главная неизвестная: сохранит ли узор без живого поддержания связность достаточно долго, чтобы ответить. Длительность устойчивого состояния измеряется отдельно от силы отклика.\n\nПодпись: Асинти.\nЛеопольд, от руки: И не создаёт ли отметки сам прибор. Оставь в чертеже контроль обычной вибрации, даже если она кажется слишком скучной."
 HSM_BAR_mtk_empty_vessel_tests:0 "Испытания сосудов, одиннадцать попыток проявления.\n\nЧетыре питаемые решётки удерживали тёмную движущуюся нить над керамическим краем от двадцати до сорока секунд. Её движение не следовало измеренным колебаниям стола; в двух опытах после изменённого обращения появились отметки. Остальные семь решёток либо молчали, либо теряли связность до ответа. Над неактивными сосудами нить не возникала. Дополнительная мощность нагревала керамику и сокращала проявление вместо продления. Никто не служил живым носителем. Записи подтверждают краткое внешнее явление, но не установленную личность собеседника.\n\nПодписи: Асинти; Хелла.\nВиира, от руки: Ты написал обитатель. Он оставался меньше минуты. Напиши хотя бы посетитель; постоянного жильца нам ещё никто не предъявил."
 HSM_BAR_mtk_empty_vessel_conclusion:0 "Отчёт о незанятом сосуде.\n\nВ некоторых опытах возможно короткое проявление вне живого носителя. Сосуд не способен вместить устойчивую личность, сохранять посетителя бесконечно или воспроизводить все возможности телесного существования. Его узкий промежуток, возможно, пригоден для простого обмена; это предстоит проверять отдельно. Увеличение мощности уже ухудшило результат. Четвёртый треснувший сосуд остаётся на моём столе, потому что его изящной надписи мне особенно хотелось доверять. Трещина проходит именно через любимую часть узора.\n\nПодпись: Асинти.\nХелла, от руки: Нам нужен этот стол для следующих измерений.\nОтвет Асинти: Переставь на полку. Не называй реликвией. С собственными ошибками я уже достаточно часто поступал именно так."

 HSM_BAR_mtk_contact_title:0 "Контакт"
 HSM_BAR_mtk_contact_idea:0 "Заявка Magnum Opus: обмен через измеренную границу.\n\nТормоз ритуала даёт окончание; Безмолвный свидетель не оставляет достоверных показаний для опоры. Память места требует отличать старые следы от нынешнего ответа. Компас порога может найти границу обмена, а Пустой сосуд предлагает лишь короткое проявление вне живого носителя. Вместе эти пять уроков подсказывают разговор, в котором ответу позволено быть неприятным. Предлагаю обмениваться заново выбранными знаками, согласовывать их смысл и проверять, может ли каждая сторона попросить паузу. Никакое заявление о мудрости не заменит этой работы.\n\nПодпись: Асинти.\nСильвер Стар, от руки: Включи вопрос, на который тебе не понравилось бы услышать нет. И заранее оставь место для такого ответа."
 HSM_BAR_mtk_contact_theory:0 "Порядок составления небольшого общего словаря.\n\nТормоз ритуала прекращает наш вклад по сигналу остановки любой стороны. Безмолвный свидетель требует новых проверок и независимо записанных ответов. Память места требует чистого исходного замера перед каждым вызовом. Компас порога удерживает обмен в пределах измеренного края. Пустой сосуд задаёт краткий срок и исключает живого носителя. Начнём с совпадения, различия и повтора; менять знаки можно после демонстрации прежнего различия обеими сторонами. За видимым согласием ещё могут скрываться разные значения. Адрес и личность остаются отдельными вопросами.\n\nПодпись: Асинти.\nВиира, от руки: В твоём первом словаре есть повинуйся. Замени на спроси. Грамматика тоже часть опыта, а не украшение к нему."
 HSM_BAR_mtk_contact_tests:0 "Двенадцать вызовов с независимыми письменными записями.\n\nТормоз ритуала завершил каждый сеанс; Компас порога не обнаружил расширения границы. Исходная проверка Памяти места исключила остаточные отметки. Пустой сосуд поддержал пять кратких откликов; семь вызовов остались без ответа. При новых проверках, требуемых Безмолвным свидетелем, три беседы правильно воспроизвели изменённый порядок знаков и вернули просьбу повторить. Заявленные имена расходились между вызовами. Один голос предложил более долгую речь через живого носителя. Я отказал; следующий вопрос остался без ответа. Сосуд остыл без переноса в кого-либо из присутствующих.\n\nПодписи: Асинти; Хелла; Виира.\nХелла, от руки: Он ещё дважды спросил молчащий сосуд. Тормоз уже был опущен. Я увела его наружу."
 HSM_BAR_mtk_contact_conclusion:0 "Оценка Magnum Opus: ограниченный контакт, неполное понимание.\n\nКраткие взаимные обмены состоялись вне живого носителя. Тормоз ритуала обеспечил окончание; Безмолвный свидетель не позволил удостоверить имя одной убеждённостью. Память места отделила остаток от ответа; Компас порога проверил край; Пустой сосуд ограничил срок. Эти пять уроков остаются необходимыми вместе. У нас нет ни универсального портала, ни надёжного доступа к любому существу; общие знаки не гарантируют правдивости. Я отвергаю господство как цену ясной речи, включая господство с моей стороны.\n\nПодпись: Асинти.\nСильвер Стар, от руки: Ты разочарован?\nОтвет Асинти: Горько. Останься на чай. Завтра нужно выяснить, не означает ли их слово снова ещё и пожалуйста."
