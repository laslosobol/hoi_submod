l_russian:
 HSM_BAR_mtk_necrotic_suture_title:0 "Некротический шов"
 HSM_BAR_mtk_necrotic_suture_idea:0 "Заявка из хирургической тетради Сильвера Стара.\n\nПеререзанное сухожилие сохраняет своё строение, даже утратив тепло. Заклинания из моих старых книг заставляют это строение двигаться; возможно, более тихая команда удержит повреждённые волокна, пока работает хирург. Предлагаю некротический шов, который принимает нагрузку, но не приказывает конечности двигаться. На первый вопрос ответят свежие ткани, оставшиеся после операций. При дальнейшем применении у постели следует измерять кровообращение наряду с прочностью. Безукоризненно неподвижная нога всё ещё может погибать. Схему креплений прилагаю к заявке.\n\nПодпись: Сильвер Стар.\nЛеопольд, карандашом внизу: Ты нарисовал сустав без места для отёка. Оставь место пациенту, иначе твой прекрасный чертёж станет удавкой."
 HSM_BAR_mtk_necrotic_suture_theory:0 "Расчётный лист, исправленный после анатомического занятия.\n\nКоманда оживления обычно проходит вдоль всего запомненного контура. Предлагаемый стежок ограничивает её двумя опорными метками, словно коротким мостом между разорванными волокнами. Натяжение должно расти при расхождении краёв и ослабевать при их сближении. Мелкие сосуды между ними нельзя пережимать. Сравним одинаковые полоски ткани под обычной нитью, неактивной надписью и действующим швом; запишем разрывы, прохождение жидкости и сокращение после снятия. Чары дают опору, но не кровь и не новую ткань. Каждое измерение повторим после сгибания образца.\n\nПодпись: Сильвер Стар.\nВиира, на полях: Твой мост проводит ещё и магию. Измерь утечку в соседние мышцы, прежде чем хвалить его изящество."
 HSM_BAR_mtk_necrotic_suture_tests:0 "Стендовый журнал и первая клиническая серия.\n\nДесять пар полосок сухожилия подвергли повторному сгибанию. Восемь действующих швов держались до закрепления обычной нити; два соскользнули там, где опорные метки пересекали размятые волокна. Краситель проходил по мелким сосудам лишь при слабом натяжении. Затем шесть пациентов получили временную поддержку при перевозке или восстановлении, вместе с обычным лечением. Все поступили к хирургу с совмещёнными краями повреждения. У одного возник отёк; снятие чар уменьшило его ещё до смены повязки.\n\nПодписи: Сильвер Стар; Рада, палатная сестра, земная пони.\nПриписка Рады от копыта: Он назвал ногу мельника спасённой до второго осмотра. Я назначила этот осмотр. По лестнице мельник пока не поднимается."
 HSM_BAR_mtk_necrotic_suture_conclusion:0 "Письмо из клиники, через шесть недель после первого применения.\n\nВременный шов выполнил предложенную задачу: удерживал повреждённые ткани, пока их не принимал на себя хирург. У всех шести пациентов кровообращение сохранялось в течение применения. Пятеро уже опираются на конечность; шестому требуется новая операция из-за повреждения вне шва. После снятия никому не понадобилось дальнейшее оживление тканей. Болезненность, заражение и кровопотеря по-прежнему требуют отдельного лечения. В рабочем футляре рядом с писчим стержнем лежит обыкновенная хирургическая нить.\n\nПодпись: Сильвер Стар.\nЛеопольд, от руки: Удержанная рана ещё не зажившая рана.\nОтвет Сильвера: Согласен. Навестил мельника. Ему требовалось перенести муку, поэтому я переносил муку."

 HSM_BAR_mtk_tissue_bank_title:0 "Банк тканей"
 HSM_BAR_mtk_tissue_bank_idea:0 "Заявка на второй холодильный шкаф.\n\nХирургу порой не хватает материала для пересадки, пока подходящая донорская ткань портится через две улицы. Предлагаю хранить небольшие, тщательно описанные образцы на холоде под сдерживающими чарами сохранения. Кожа, сухожилие и целый орган должны идти в разных графах: неизменный вид ещё не означает пригодности. Сравним парные фрагменты после согревания, в том числе их способность приживаться в живой ране. Шкаф должен сохранять сведения о доноре столь же надёжно, как сам образец. Без этой записи подбор ткани невозможен.\n\nПодпись: Сильвер Стар.\nЛеопольд, рядом со сметой: Ты заказал полки, не указав температуру. Сначала я сделаю термометр. Нет, твой рог не термометр."
 HSM_BAR_mtk_tissue_bank_theory:0 "Рабочая модель сохранения тканей.\n\nНекромантическая фиксация, возможно, замедляет утрату внутреннего строения ткани, пока холод сдерживает обычный распад. Однако толстый орган содержит каналы, выделения и множество клеток, чьи ритмы могут по-разному переносить одни чары. Тонкий трансплантат позволяет начать с более простого сравнения. Разделим каждое пожертвование между холодом, фиксацией и их сочетанием. После согревания проверим гибкость, прохождение жидкости и выживание краёв на подготовленном ложе для пересадки. Цвет и магический отклик останутся вспомогательными наблюдениями.\n\nПодпись: Сильвер Стар.\nМелкая приписка Вииры: У тебя определение выживания всё ещё включает любое существо, которое тебе отвечает. Проверь, продолжит ли оно жить, когда ты перестанешь спрашивать."
 HSM_BAR_mtk_tissue_bank_tests:0 "Журнал холодильного шкафа, третья неделя.\n\nИз двенадцати образцов кожи, семь дней хранившихся на холоде под фиксацией, девять сохранили живые края после согревания. В группе одного лишь холода таких было четыре из двенадцати. Полоски сухожилий сохранили полезную прочность, хотя поверхностные клетки восстанавливались неравномерно. Все целые почки провалили проверку кровообращения. Некоторые выглядели превосходно, пока их мельчайшие каналы пропускали жидкость сквозь стенки. Позднее трём пациентам пересадили небольшие участки кожи из пригодных партий. Два прижились; третий пришлось заменить. Еженедельные осмотры продолжаются.\n\nПодписи: Сильвер Стар; Рада.\nЛеопольд, поперёк рисунка почки: Перестань выставлять самый красивый образец впереди остальных. Внутри он протекает ничуть не хуже."
 HSM_BAR_mtk_tissue_bank_conclusion:0 "Опись, прикреплённая к шкафу трансплантатов.\n\nНебольшой запас отобранной кожи и сухожилий можно содержать в пределах проверенного срока. Каждая партия всё равно требует осмотра после согревания: чары не превращают неподходящее пожертвование в подходящее. Универсального снабжения органами здесь нет. Целые почки непригодны; сохранность сердца или мозга не установлена вовсе. На четвёртом еженедельном осмотре оба прижившихся кожных лоскута оставались здоровыми. Пациент после повторной пересадки выздоравливает при обычном уходе. Для него заведена отдельная карточка дальнейших осмотров.\n\nПодпись: Сильвер Стар.\nРада, от руки: Расскажи на лекции и о неудачной пересадке.\nОтвет Сильвера: Она на первой странице. Пациент попросил указать, насколько болезненной оказалась вторая перевязка."

 HSM_BAR_mtk_ageless_sleep_title:0 "Сон без старости"
 HSM_BAR_mtk_ageless_sleep_idea:0 "Личная заявка, внесённая в лабораторную книгу.\n\nСлишком много ночей я прислушивался к шагам тех, кто однажды оборвёт мою жизнь. Если одновременно приостановить рост, голод и распад, возможно, спящий проживёт некоторый срок, не расходуя его телесно. Первыми образцами станут живые тканевые культуры с парными необработанными культурами рядом. Нам предстоит отличить остановленное старение от тела, слишком повреждённого, чтобы проявлять свой возраст. Нельзя поручать спящему отвечать на вопрос, с которым справится лабораторная чашка. Начальные измерения следует закончить до наложения чар.\n\nПодпись: Сильвер Стар.\nВиира, от руки: Ты написал имя Уайт Стар над предполагаемой группой сравнения. Твоя сестра не единица времени."
 HSM_BAR_mtk_ageless_sleep_theory:0 "О предполагаемой остановке жизненных процессов.\n\nГипотеза требует обратимой паузы: после освобождения ткань должна вернуться к прежней работе без накопленных повреждений. Редкий пульс, неподвижная поверхность или отсутствие морщин почти ничего не докажут. Парные культуры получат одинаковое питание до чар и после них. Измерим восстановление, деление и нарушения строения при повторных паузах, затем сравним с культурами, состарившимися за тот же общий срок. Любая видимость отсрочки, купленная повреждением, опровергает гипотезу. Отдельно запишем время до возобновления роста.\n\nПодпись: Сильвер Стар.\nТесная приписка Леопольда: Твоё уравнение останавливает расход и предполагает, что поддержание тканей продолжается. Укажи, чем оно оплачивается. Моё восхищение не заменит недостающего члена."
 HSM_BAR_mtk_ageless_sleep_tests:0 "Запись шести попыток приостановки.\n\nВо всех обработанных культурах чары остановили видимое движение. После снятия четыре не возобновили рост; две оставшиеся делились медленнее и содержали больше повреждённых клеток, чем парные контрольные образцы. Повторение усугубляло ущерб. Сравнение культур одного календарного возраста не выявило безопасной отсрочки старения. Второй наблюдатель получил тот же результат, исследуя образцы, чьи обозначения были скрыты от него на время подсчёта. Поэтому испытания на целом организме отменены. Из этой серии не получилось лечебной процедуры.\n\nПодписи: Сильвер Стар; Леопольд.\nСильвер, после полуночи: Я попросил его пересчитать.\nОтвет Леопольда: Пересчитал. Потом остался выпить чаю. Числа от этого не изменились."
 HSM_BAR_mtk_ageless_sleep_conclusion:0 "Закрывающая запись: гипотеза не подтверждена.\n\nСон без старости потерпел неудачу. Прекращение видимой активности не остановило старение безопасным образом и не сохранило способность восстанавливаться. Эти опыты не дали ни лечебного применения, ни безопасного срока сна, ни улучшенного способа хранения тканей. Повреждённые культуры не стали моложе. Их неподвижность была следствием травмы. Предложенную процедуру не будут применять ни к пациентам, ни ко мне самому. Нынешние пациенты продолжат обычные приёмы без обещания остановить для них время.\n\nПодпись: Сильвер Стар.\nАсинти, от руки: Не обязательно превращать эту страницу в исповедь.\nОтвет Сильвера: Как и в открытие. Я всё ещё боюсь смерти. От этого опыт тоже не излечил."

 HSM_BAR_mtk_spell_sterilisation_title:0 "Стерильные чары"
 HSM_BAR_mtk_spell_sterilisation_idea:0 "Записка из перевязочной.\n\nВымытый зажим способен переносить и живое загрязнение, и остаточные чары от прежнего применения. Кипячение надёжнее решает первую задачу, чем вторую. Предлагаю стерилизующее заклинание с отдельным проходом расплетения остаточных чар, предназначенное для инструментов до соприкосновения с раной. Проверка должна охватывать загрязнённые шарниры, закрытые поверхности и намеренно зачарованные принадлежности. Яркая вспышка над полированной сталью ещё не доказывает чистоты. Для каждого инструмента следует заранее записать места, откуда будут взяты пробы.\n\nПодпись: Сильвер Стар.\nРада, земная пони, медицинская сестра, карандашом: Ты показал всё на самом чистом нашем лотке. Возьми лоток со вчерашней поздней смены. Шарнир я оставила закрытым."
 HSM_BAR_mtk_spell_sterilisation_theory:0 "Двухпроходная формула обработки инструментов.\n\nПервый проход должен разрушать мелкие повторяющиеся структуры микробной жизни на вымытом металле; второй должен расплетать остаточное заклинание, не оставляя новой команды. Это разные действия, и свидетельства для них нужны разные. После обработки возьмём посевы и поднесём к инструменту незачарованный пробный кристалл. Парные инструменты получат обычную стерилизацию, только первый проход или оба прохода. Из шарниров и затенённых участков пробы берутся отдельно. Успех на металле ничего не скажет о живой коже.\n\nПодпись: Сильвер Стар.\nАсинти, чернилами у второго круга: Расплетение может освободить то, что было связано. Измеряй состояние лотка вокруг инструмента тоже, иначе не узнаешь, куда оно ушло."
 HSM_BAR_mtk_spell_sterilisation_tests:0 "Сравнение стерилизаторов, двадцать четыре набора инструментов.\n\nРанняя формула очищала открытые лезвия, но оставляла рост в четырёх закрытых шарнирах. Раскрытие сочленений устранило эту неудачу при повторении серии. После исправленной двухпроходной обработки посевы со всех двадцати четырёх проверенных наборов оставались отрицательными весь срок наблюдения; пробные кристаллы не обнаружили переноса чар. Кипячёные инструменты были чисты от выращиваемых микробов, но иногда сохраняли намеренно наложенное связывание. Одна зачарованная рукоять треснула при расплетении; её выбросили. Повязки на живых тканях не участвовали в испытании.\n\nПодписи: Сильвер Стар; Рада.\nРада, от руки: Он хотел назвать треснувшую рукоять посторонним дефектом. До заклинания рукоять была совершенно исправна."
 HSM_BAR_mtk_spell_sterilisation_conclusion:0 "Мастерская копия принятой процедуры обработки.\n\nСовместная обработка надёжно стерилизует проверенные инструменты и снимает остаточные чары при раскрытых сочленениях и завершённой предварительной очистке. Поломка рукояти требует отдельной проверки зачарованных креплений. Ткань, дерево и живые раны остаются за пределами доказанного применения. Клиника закончила четыре недели работы без положительной пробы с лотка. При этом заражение у пациента всё равно требует самостоятельного расследования по собственным признакам. Журнал посевов хранится рядом с аппаратом, а не в кабинете автора.\n\nПодпись: Сильвер Стар.\nЛеопольд, от руки: Возможно, это будет твоё самое часто используемое изобретение.\nОтвет Сильвера: Нелестный прогноз. Тем не менее я заказал ещё установку для ночной палаты. Рада говорит, давно пора."

 HSM_BAR_mtk_phantom_pain_title:0 "Фантомная боль"
 HSM_BAR_mtk_phantom_pain_idea:0 "Запись консультации, продиктованная при пациентке.\n\nПлотница-грифонка чувствует, как сжимается когтистая лапа, которой больше нет. Она описывает её положение точнее, чем я могу описать чары, которыми надеюсь помочь. Возможно, остаточное оживление следует старому контуру тела и усиливает сигнал, уже поддерживаемый повреждёнными нервами. До наложения встречного узора составим карту ощущений и сравним процедуру со спокойными приёмами той же длительности. Рассказ принадлежит пациентке, даже когда приборы молчат. Отдельно запишем, какие движения в работе вызывают наиболее сильную боль.\n\nПодпись: Сильвер Стар.\nЛеопольд, от руки: Не полагай, что каждая боль обязана быть призраком лишь потому, что ты занимаешься некромантией. Сначала выслушай её до конца."
 HSM_BAR_mtk_phantom_pain_theory:0 "Соперничающие объяснения отсутствующей конечности.\n\nВозможно, сохраняется магический контур; возможно, действуют оставшиеся нервы без всякого контура. Третья гипотеза допускает взаимное усиление обоих явлений. Слабый встречный узор должен изменять первый компонент, не лишая чувствительности целую ткань. Запишем место ощущаемого движения, боль в покое и при работе, чувствительность оставшейся конечности. Будем чередовать действующие и неактивные сеансы, не сообщая их порядок осматривающей сестре. Улучшения от одного ожидания помощи нельзя приписывать надписи. Сравнение требует одинаковой продолжительности бесед в обеих сериях.\n\nПодпись: Сильвер Стар.\nВиира, карандашом внизу: И неизмеренный магический след не должен становиться твоим объяснением всякого неудобного результата. Такая теория слишком легко оказывается права."
 HSM_BAR_mtk_phantom_pain_tests:0 "Дневники боли восьми добровольцев за четыре недели.\n\nТрое участников сообщали о более коротких приступах при действующих чарах и после сеанса дольше спали. К следующему вечеру облегчение исчезало. Двое чувствовали улучшение одинаково при действующих и неактивных посещениях; трое не заметили перемен. Ощущаемая лапа плотницы разжалась на час, но оставшееся плечо по-прежнему болело во время работы. Утраченная конечность не вернулась; шрам и обычная чувствительность не изменились. Дневники заполнялись и между визитами, когда исследователей рядом не было.\n\nПодписи: Сильвер Стар; Рада.\nЛеопольд, от руки: Ты изобразил на графике лучший час. Ей приходится жить и остальные двадцать три.\nОтвет Сильвера: Теперь рядом стоят суточные итоги."
 HSM_BAR_mtk_phantom_pain_conclusion:0 "Письмо в восстановительную палату.\n\nУ трёх из восьми участников подтверждено ограниченное и временное уменьшение фантомной боли. Мы не умеем надёжно предсказывать отклик, а сравнения не позволяют считать всякое улучшение магическим. Дальнейшие сеансы следует предлагать тем, кто сам отмечает существенную пользу; обычное обезболивание, подгонка приспособлений и отдых остаются доступны. На позднем осмотре двое откликнувшихся ещё просили сеансы, а третья предпочла реже ездить в клинику. Её выбор не меняет прежних измерений и не требует оправданий перед исследователем.\n\nПодпись: Сильвер Стар.\nКарандашная поправка плотницы: Я просила держать чашку без страха перед болью. Вы всё спрашивали, чувствую ли я себя целой. Пожалуйста, спросите про чашку."

 HSM_BAR_mtk_last_minute_title:0 "Последняя минута"
 HSM_BAR_mtk_last_minute_idea:0 "Заявка Magnum Opus, перенесённая из палаты в мастерскую.\n\nНекротический шов даёт временную опору; Банк тканей даёт лишь отобранные трансплантаты. Сон без старости провалился, поэтому новая схема должна поддерживать жизнь, а не приостанавливать её. Стерильные чары обеспечивают чистые инструменты без посторонних заклинаний; Фантомная боль требует отличать облегчение от восстановления. Позволят ли эти пять уроков выиграть короткий промежуток для неотложной операции? Я хочу ответа, которого не смогла бы написать моя сестра. Ещё я хочу, чтобы следующие носилки прибыли вовремя. Оба желания мои.\n\nПодпись: Сильвер Стар.\nРада, от руки: Тогда оставь рядом со своей подписью графу прибытия хирурга. Заклинание эту часть работы не выполнит."
 HSM_BAR_mtk_last_minute_theory:0 "Чертёж некромантической поддержки с ограниченным сроком действия.\n\nНекротический шов закрепляет повреждённые структуры, пока внешний ритм помогает угасающему движению. Банк тканей ограничивает материал проверенными трансплантатами. Неудача Сна без старости исключает мнимую паузу обмена: кровообращение и поступление воздуха должны продолжаться. Стерильные чары снимают посторонние команды со всех соприкасающихся инструментов. Фантомная боль требует независимо проверять кровообращение и реакцию, поскольку одного облегчения недостаточно. Контур должен постепенно отключаться при возвращении обычной функции либо немедленно уступать врачу. Он не способен восстановить разрушенный мозг или призвать обратно отсутствующую личность.\n\nПодпись: Сильвер Стар.\nЛеопольд, от руки: Нарисуй состояние отказа столь же тщательно, как триумфальное. Особенно то, что остаётся при отключении питания."
 HSM_BAR_mtk_last_minute_tests:0 "Неотложная серия, девять поступлений.\n\nНекротический шов удерживал повреждённые структуры; Банк тканей предоставил проверенную кожу для двух операций. После неудачи Сна без старости дыхание и кровообращение поддерживались непрерывно. Стерильные чары очищали инструменты; урок Фантомной боли требовал записывать облегчение отдельно от измеренного кровотока. Семь пациентов добрались до основного лечения с сохранённым кровообращением. Шестеро дожили до выписки; один умер после операции, двоих не удалось стабилизировать. Ни одну смерть не обратили вспять. Контур поддерживал угасающее тело, пока врачи лечили повреждения.\n\nПодписи: Сильвер Стар; Рада; Леопольд.\nРада, от руки: Он остался и с теми, кого не спасли. Первый черновик всё равно считал лишь семерых. Этот считает девятерых."
 HSM_BAR_mtk_last_minute_conclusion:0 "Отчёт Magnum Opus с шестью карточками последующих осмотров.\n\nНеотложная некромантическая стабилизация выполнила поставленную задачу. Пятеро выписанных справляются с повседневной работой; шестой продолжает восстановление. Временная опора Некротического шва, отбор Банка тканей, провал Сна без старости, два прохода Стерильных чар и разделение облегчения с восстановлением из Фантомной боли остаются обязательными пределами метода. Лечение должно последовать без промедления. Это не бессмертие и не всеобщее воскрешение; умерших метод не возвращает. Я всё ещё проверяю собственный пульс, когда палата затихает.\n\nПодпись: Сильвер Стар.\nВиира, от руки: Ты обещал отдохнуть после обхода.\nОтвет Сильвера: Сначала одно письмо. Уайт Стар должна узнать, что мельник поднялся по своей лестнице."
