l_russian:
 HSM_BAR_investigation_rock_doc_1:0 "Показание каменщика / выписка врача"
 HSM_BAR_investigation_rock_fragment_1_1:0 "Обломка при показании нет. Свидетель отказался возвращаться за инструментами."
 HSM_BAR_investigation_rock_fragment_1_2:0 "Свидетель описал, как след зубила затянулся после того, как камень подался. Обвала рыхлого щебня он не описывал."
 HSM_BAR_investigation_rock_fragment_1_3:0 "Кшемень сохранила последний вопрос: заставит ли Республика закончить раскопки?"
 HSM_BAR_investigation_rock_doc_2:0 "Хозяйственная часть / предварительная запись"
 HSM_BAR_investigation_rock_fragment_2_1:0 "План храма приложен. Данные свидетеля передаются под номером £HSM_BAR_redact_short£."
 HSM_BAR_investigation_rock_fragment_2_2:0 "Под просьбой вновь открыть проход нет подписи осмотревшего его специалиста."
 HSM_BAR_investigation_rock_fragment_2_3:0 "В черновике стоит «осадка в месте касания инструмента». Место указал писарь, а не проводивший осмотр специалист."
 HSM_BAR_investigation_rock_hypothesis:0 "Черновик превратил показание в точное указание места, которого никто не измерял. Ольха требует отдельно отмечать место нажима и последующее движение, оставляя в поле наблюдения нетронутый участок. Затягивание скола, осыпание и смещение рядом дадут разные записи. Прежнего отверстия достаточно; новый проход вскрывать нельзя."
 HSM_BAR_investigation_rock_mismatch:0 "Эти строки помогают проследить путь жалобы, но не проверить предложенное объяснение. Существенное расхождение касается увиденного свидетелем и того, что черновик выдаёт за результат замера. Врона не отправит группу обратно лишь ради подтверждения формулировки писаря."
 HSM_BAR_investigation_rock_status:0 "[GetHSMBARInvestigationStatus_rock]"
 HSM_BAR_investigation_rock_1_title:0 "Парные отметки"
 HSM_BAR_investigation_rock_1_brief:0 "Нанять обмерную группу для короткого выезда под наблюдением. Раздельно отметить прежний скол и соседний участок. Ограниченно нажать щупом с рукоятью; второй наблюдатель следит за обеими отметками. При первом смещении остановиться."
 HSM_BAR_investigation_rock_1_report:0 "ВРОНА / размеченный лист приложен\nНажим произведён у старого скола. Второй наблюдатель отметил движение под соседней меткой, не под щупом. Нетронутая контрольная отметка осталась различимой. Отделившиеся крупинки из прежнего скола помещены в подписанный конверт; проход не вскрывали.\nХозяйственная копия снова пришла с одной меткой. Врона вернула её без подписи. Теперь к полевой описи приложены обе. Установлено смещение, которое следует исследовать, а не пригодность камня для строительства."
 HSM_BAR_investigation_rock_1_price:0 "35 политвласти / 14 дн."
 HSM_BAR_investigation_rock_1_remaining:0 "ЭКСПЕДИЦИЯ / осталось [?days_mission_timeout@HSM_BAR_investigation_rock_1_mission|0] дн."
 HSM_BAR_investigation_rock_1_mission:0 "$HSM_BAR_investigation_rock_1_title$"
 HSM_BAR_investigation_rock_2_title:0 "Наблюдение без вмешательства"
 HSM_BAR_investigation_rock_2_brief:0 "Оставить проход закрытым и снимать поверхность через равные промежутки, не касаясь её. Небольшой пост проверит движение без раскопок, но не сможет сопоставить нажим со смещением."
 HSM_BAR_investigation_rock_2_report:0 "ЖУРНАЛ ПОСТА / касания не было\nСнимки с неподвижной точки не показывают измеримого изменения за время наблюдения. Это исключает непрерывную осадку в данном промежутке, но ничего не говорит о случившемся под зубилом. Показание каменщика начиналось с касания, которое здесь намеренно исключили.\nКонтрольные снимки сохранены. Для следующего выезда нужны размеченный опыт с нажимом и присутствие обмерщика; продление прежнего наблюдения не ответит на оставшийся вопрос. Разрешение открыть проход не подписано."
 HSM_BAR_investigation_rock_2_price:0 "20 политвласти / 21 дн."
 HSM_BAR_investigation_rock_2_remaining:0 "ЭКСПЕДИЦИЯ / осталось [?days_mission_timeout@HSM_BAR_investigation_rock_2_mission|0] дн."
 HSM_BAR_investigation_rock_2_mission:0 "$HSM_BAR_investigation_rock_2_title$"
 HSM_BAR_investigation_rock_3_title:0 "Дистанционная запись касания"
 HSM_BAR_investigation_rock_3_brief:0 "Соединить щуп с одолженным механическим самописцем, а размеченную поверхность снимать от входа. Калибровка и контрольные снимки потребуют времени, зато наблюдателям не придётся долго стоять у скола."
 HSM_BAR_investigation_rock_3_report:0 "ОЛЬХА / лента касания и снимки\nСамописец отмечает касание у одной метки; последовательные снимки показывают смещение под соседней. Холостой ход щупа такого изменения не дал. После ограниченной пробы прибор убрали.\nВрона собрала лишь крупинки, уже отделившиеся в старом сколе. На конверте стоят номера снимков, включая внешне пустой контрольный. Нового отверстия не делали. Полевой обмер сохраняет два места там, где черновик указывал одно; поведение отделённого материала предстоит проверить в лаборатории."
 HSM_BAR_investigation_rock_3_price:0 "25 политвласти / 28 дн."
 HSM_BAR_investigation_rock_3_remaining:0 "ЭКСПЕДИЦИЯ / осталось [?days_mission_timeout@HSM_BAR_investigation_rock_3_mission|0] дн."
 HSM_BAR_investigation_rock_3_mission:0 "$HSM_BAR_investigation_rock_3_title$"
 HSM_BAR_investigation_titan_doc_1:0 "Журнал раскопок / отдельный лист"
 HSM_BAR_investigation_titan_fragment_1_1:0 "Перед записью о конструкте стоят канат, масло и три лампы. После неё записана замена каната."
 HSM_BAR_investigation_titan_fragment_1_2:0 "Сохранившиеся записи не упоминают отливку старого корпуса. Имя прежнего создателя отсутствует."
 HSM_BAR_investigation_titan_fragment_1_3:0 "Пометка Ольхи: Леопольд нашёл машину. Поздняя переделка не может служить исходным чертежом найденного сочленения."
 HSM_BAR_investigation_titan_doc_2:0 "Мастерская / проект сводного чертежа"
 HSM_BAR_investigation_titan_fragment_2_1:0 "Чертёжник перенёс размер из поправки Леопольда на все сочленения. Старые линии предлагается стереть как повторные."
 HSM_BAR_investigation_titan_fragment_2_2:0 "Несколько листов вырезано у переплёта. Ни чистовик, ни сопроводительная записка не сообщают их содержания."
 HSM_BAR_investigation_titan_fragment_2_3:0 "Кшемень спрашивает, помогут ли чертежи поднять обвалившуюся крышу. Восстановления самой машины она не просила."
 HSM_BAR_investigation_titan_hypothesis:0 "Чистовик предполагает единство там, где журнал раскопок требует различать слои. Прежде чем сводить размеры, нужно сравнить сочленения и обозначения: поправка может описывать добавление Леопольда, а не древний механизм под ним. Последовательность и пропуски следует сохранить. Оснований назвать первого создателя или собрать целого Титана здесь нет."
 HSM_BAR_investigation_titan_mismatch:0 "Пропавшие листы и закупки показывают неполноту журнала раскопок, но не подтверждают восстановленные размеры. Спорный шаг состоит в переносе поздней поправки на старые части. Убедительный силуэт машины не заменит проверки этого шага."
 HSM_BAR_investigation_titan_status:0 "[GetHSMBARInvestigationStatus_titan]"
 HSM_BAR_investigation_titan_1_title:0 "Модель по сводному чертежу"
 HSM_BAR_investigation_titan_1_brief:0 "Собрать небольшую неподвижную модель по предложенному чистовику. Она проверит совместимость начерченных узлов без перемещения найденных частей, но будет опираться на спорный пересчёт размеров."
 HSM_BAR_investigation_titan_1_report:0 "ОТВЕТ МАСТЕРСКОЙ / модель сохранена\nУзлы сходятся лишь там, где чертёжник добавил прокладки, отсутствующие на уцелевших листах. Без добавлений модель не замыкается. Обнаружено допущение в сводной реконструкции, а не доказанный изъян исходной машины.\nДобавленные части подписаны; модель оставлена для сравнения. Новое задание должно проверить исходные замеры либо установить порядок чертежей. Дальнейшая работа над тем же силуэтом лишь аккуратнее скроет недостающие сведения."
 HSM_BAR_investigation_titan_1_price:0 "20 политвласти / 21 дн."
 HSM_BAR_investigation_titan_1_remaining:0 "ЭКСПЕДИЦИЯ / осталось [?days_mission_timeout@HSM_BAR_investigation_titan_1_mission|0] дн."
 HSM_BAR_investigation_titan_1_mission:0 "$HSM_BAR_investigation_titan_1_title$"
 HSM_BAR_investigation_titan_2_title:0 "Обмер сохранившихся сочленений"
 HSM_BAR_investigation_titan_2_brief:0 "Отправить к доступным остаткам обмерщиков и специалиста по подъёмным работам. Измерить наружные сочленения без запуска и сборки; сопоставить каждый размер с его чертежом, не смешивая переделанные и исходные части."
 HSM_BAR_investigation_titan_2_report:0 "ТЕХНИЧЕСКАЯ ОПИСЬ / приложение к обмеру\nСтарые сочленения не соответствуют поздним обозначениям Леопольда. Вторая система мер объясняет размеры, которые чистовик счёл испорченными цифрами. Каждой доступной части теперь соответствуют ссылка на чертёж и запись о состоянии.\nСнимки разобранных и целых участков хранятся раздельно. Ничего не запускали и не собирали. Пропавшие листы всё ещё не позволяют восстановить машину целиком, но уцелевшие размеры можно передать для ограниченного расчёта нагрузки. Леопольд указан автором переделок, не первым создателем."
 HSM_BAR_investigation_titan_2_price:0 "35 политвласти / 14 дн."
 HSM_BAR_investigation_titan_2_remaining:0 "ЭКСПЕДИЦИЯ / осталось [?days_mission_timeout@HSM_BAR_investigation_titan_2_mission|0] дн."
 HSM_BAR_investigation_titan_2_mission:0 "$HSM_BAR_investigation_titan_2_title$"
 HSM_BAR_investigation_titan_3_title:0 "Восстановить порядок чертежей"
 HSM_BAR_investigation_titan_3_brief:0 "Сопоставить переплёты, поправки и снимки раскопок, затем выборочно проверить наружные размеры на месте. Работать с отдельными листами, не со сводным чертежом. Архивная работа сократит наём подъёмного оборудования, но займёт больше времени."
 HSM_BAR_investigation_titan_3_report:0 "ОЛЬХА / упорядоченная опись чертежей\nПоправки Леопольда образуют поздний слой. Исходные чертежи сочленений используют иную меру; выборочная проверка доступных частей подтверждает необходимость сохранить обе системы, а не усреднять их. Вырезанные страницы остались пропусками, не восстановленными листами.\nВрона приложила к каждому уцелевшему этапу отдельные снимки состояния. Опись пригодна для предложения расчёта нагрузки по записанным размерам. Ни целого Титана, ни имени создателя его древнейших частей она не даёт."
 HSM_BAR_investigation_titan_3_price:0 "25 политвласти / 28 дн."
 HSM_BAR_investigation_titan_3_remaining:0 "ЭКСПЕДИЦИЯ / осталось [?days_mission_timeout@HSM_BAR_investigation_titan_3_mission|0] дн."
 HSM_BAR_investigation_titan_3_mission:0 "$HSM_BAR_investigation_titan_3_title$"
 HSM_BAR_investigation_entity_doc_1:0 "Лист свидетельницы / исходные слова"
 HSM_BAR_investigation_entity_fragment_1_1:0 "Она сказала «не один», числа не назвала, затем написала одно слово буквами разного размера. Читать вслух отказалась."
 HSM_BAR_investigation_entity_fragment_1_2:0 "Кшемень разрешает новую беседу лишь с её согласия. Отказ говорить должен остаться в записи."
 HSM_BAR_investigation_entity_fragment_1_3:0 "Толкование переводчика приложено отдельно. Религиозный заголовок не устанавливает личность говорившего."
 HSM_BAR_investigation_entity_doc_2:0 "Указатель донесений / неподписанная запись"
 HSM_BAR_investigation_entity_fragment_2_1:0 "Рукописный лист указан под номером £HSM_BAR_redact_short£. В указатель его не переписывали."
 HSM_BAR_investigation_entity_fragment_2_2:0 "В запись внесён один говоривший, поскольку показание одно. Журнала прослушивания, подтверждающего такой подсчёт, нет."
 HSM_BAR_investigation_entity_fragment_2_3:0 "Пустая строка требует промежуток между обращением и ответом. В беседе измеренной задержки не получено."
 HSM_BAR_investigation_entity_hypothesis:0 "Указатель посчитал показания вместо говоривших. Ни почерк, ни наложение речи не дают надёжного числа. Ольха предлагает независимые журналы постов: отдельно записывать контрольный сигнал, промежуток и ответ, не дополняя одного наблюдателя за другого. При изменении ответа прекратить опыт. Услышанный ответ ещё не устанавливает имени, соглашения или источника энергии."
 HSM_BAR_investigation_entity_mismatch:0 "Эти строки касаются обращения с показанием, а не числа или природы услышанных внизу. Изъятое имя не доказывает присутствия определённого существа. Сначала нужно проверить, не подменил ли указатель числом документов то, чего свидетельница прямо не смогла сосчитать."
 HSM_BAR_investigation_entity_status:0 "[GetHSMBARInvestigationStatus_entity]"
 HSM_BAR_investigation_entity_1_title:0 "Независимые посты прослушивания"
 HSM_BAR_investigation_entity_1_brief:0 "Оснастить две группы у подходов к разным шахтам сверенными часами. Один оператор подаёт короткую условленную серию; группы запечатывают записи до сравнения. Ольха следит за отходом при изменении ответа. Без спуска и повторного воздействия на свидетельницу."
 HSM_BAR_investigation_entity_1_report:0 "ВРОНА / две обложки, без общей стенограммы\nНезависимые журналы одинаково описывают первые ответы. После третьего сигнала ответ изменился; Ольха приказал обеим группам отойти. Надёжного числа говоривших нет ни в одной записи. Порядок сигналов сохранён, содержание последнего хранится под £HSM_BAR_redact_long£.\nЗамеры времени не сводили насильно к одной задержке. Их предстоит сравнить с обычным акустическим контролем. Старая стенограмма Пентархии обрывается сходным образом. Полевое дело фиксирует контакт и отход, а не установленное существо под нашим контролем."
 HSM_BAR_investigation_entity_1_price:0 "35 политвласти / 14 дн."
 HSM_BAR_investigation_entity_1_remaining:0 "ЭКСПЕДИЦИЯ / осталось [?days_mission_timeout@HSM_BAR_investigation_entity_1_mission|0] дн."
 HSM_BAR_investigation_entity_1_mission:0 "$HSM_BAR_investigation_entity_1_title$"
 HSM_BAR_investigation_entity_2_title:0 "Разделить сигнал и ответ"
 HSM_BAR_investigation_entity_2_brief:0 "Подготовить короткую серию с неравными паузами, сперва проверив запись вдали от выработок. У двух охраняемых постов провести только согласованную серию. Лист времени оператора хранить отдельно от описаний слушателей; при перемене ответа отойти."
 HSM_BAR_investigation_entity_2_report:0 "ОЛЬХА / три листа хранить раздельно\nЛист оператора отличает заданные паузы от записанного слушателями. Первые описания совпадают. На третий сигнал ответ изменился, и опыт закончился по приказу Ольхи, не в назначенный час.\nЗаписи не обосновывают ни точного числа, ни объяснения постоянной задержкой. Сравнение с обычным возвращающимся звуком ещё необходимо. Врона нашла сходный обрыв в старых бумагах Пентархии и приложила ссылку, не восстанавливая пропущенных слов. Аппаратуры для отбора энергии вниз не доставляли."
 HSM_BAR_investigation_entity_2_price:0 "25 политвласти / 28 дн."
 HSM_BAR_investigation_entity_2_remaining:0 "ЭКСПЕДИЦИЯ / осталось [?days_mission_timeout@HSM_BAR_investigation_entity_2_mission|0] дн."
 HSM_BAR_investigation_entity_2_mission:0 "$HSM_BAR_investigation_entity_2_title$"
 HSM_BAR_investigation_entity_3_title:0 "Слушать без обращения"
 HSM_BAR_investigation_entity_3_brief:0 "Оставить охраняемый пост записи у верхнего подхода, не подавая сигналов. Так можно установить время наложения звуков без начала контакта. Само наблюдение не покажет, отвечает ли какой-либо звук наблюдателю."
 HSM_BAR_investigation_entity_3_report:0 "ПАССИВНЫЙ ПОСТ / лист времени сохранён\nВ записи есть наложение звуков, но нет условленного обращения, с которым можно проверить ответ. Два расшифровщика по-разному делят один отрывок; ни один не удостоверяет числа говоривших. Расхождение приложено, а не устранено выбором более аккуратной стенограммы.\nНаблюдение выделило материал для контрольного сравнения. Новому выезду нужны запись сигнала, независимые слушатели и правило отхода. Прослушивание ленты до появления знакомого имени не заменит отсутствующего контроля."
 HSM_BAR_investigation_entity_3_price:0 "20 политвласти / 21 дн."
 HSM_BAR_investigation_entity_3_remaining:0 "ЭКСПЕДИЦИЯ / осталось [?days_mission_timeout@HSM_BAR_investigation_entity_3_mission|0] дн."
 HSM_BAR_investigation_entity_3_mission:0 "$HSM_BAR_investigation_entity_3_title$"
 HSM_BAR_investigation_amulet_doc_1:0 "Письмо поселения / приложенный рассказ"
 HSM_BAR_investigation_amulet_fragment_1_1:0 "Жители просят перенести межевые колья, не защиту. Яношик купил амулет до появления растений."
 HSM_BAR_investigation_amulet_fragment_1_2:0 "Вспоминают, как растения отступали у края поселения. Другой отражённой угрозы автор не называет."
 HSM_BAR_investigation_amulet_fragment_1_3:0 "Адрес: £HSM_BAR_redact_long£. Просьба заканчивается словами: «Не забирайте то, благодаря чему мы остались живы»."
 HSM_BAR_investigation_amulet_doc_2:0 "Обещание торговца / собранные версии"
 HSM_BAR_investigation_amulet_fragment_2_1:0 "Три пересказа по-разному объясняют покупку. Ни один не подписан самим торговцем."
 HSM_BAR_investigation_amulet_fragment_2_2:0 "Ольха запросил точные слова. Один свидетель согласен говорить лишь с врачом; это условие сохранено."
 HSM_BAR_investigation_amulet_fragment_2_3:0 "Одна версия обещает защиту «от всего рождённого под Баррадом». Наблюдений помимо растений она не приводит."
 HSM_BAR_investigation_amulet_hypothesis:0 "Обещание шире запомнившегося события. Нужно нанести на план места наблюдаемой защиты и то, от чего она защищала, отделив общее заверение торговца. Сопоставить рассказы с постоянными ориентирами, не трогая амулет и не приводя угрозу. Выживание деревни требует сохранить её защиту, а не испытывать её до разрушения."
 HSM_BAR_investigation_amulet_mismatch:0 "Покупка и отказ жителей объясняют недопустимость изъятия, но не устанавливают границ защиты. Нужно отделить наблюдавшееся защитное действие от обещания о тех угрозах, с которыми в этих записях никто не сталкивался."
 HSM_BAR_investigation_amulet_status:0 "[GetHSMBARInvestigationStatus_amulet]"
 HSM_BAR_investigation_amulet_1_title:0 "Обследовать границу на месте"
 HSM_BAR_investigation_amulet_1_brief:0 "Нанять обмерщиков для записи существующей границы растений и ориентиров поселения при жителях. Сравнить точки по обе стороны предполагаемой линии, ничего через неё не перенося. Не трогать ни амулет, ни колья."
 HSM_BAR_investigation_amulet_1_report:0 "ВРОНА / лист границы\nНаблюдения удалось привязать к краю поселения. Жители сходятся в том, где отступали растения; рассказы об иных угрозах оставлены отдельно и расходятся. На плане записанная линия отделена от общего обещания торговца.\nНи подопытных существ, ни опасного материала не вводили. Распоряжения об изъятии амулета нет. В полевое дело поступили замеры и показания, не защита поселения. Запрос Ольхи о точных словах торговца остаётся открытым."
 HSM_BAR_investigation_amulet_1_price:0 "35 политвласти / 14 дн."
 HSM_BAR_investigation_amulet_1_remaining:0 "ЭКСПЕДИЦИЯ / осталось [?days_mission_timeout@HSM_BAR_investigation_amulet_1_mission|0] дн."
 HSM_BAR_investigation_amulet_1_mission:0 "$HSM_BAR_investigation_amulet_1_title$"
 HSM_BAR_investigation_amulet_2_title:0 "Проследить обещание торговца"
 HSM_BAR_investigation_amulet_2_brief:0 "Отправить писаря и переводчика для сравнения трёх рассказов о покупке, не заходя на защищённую межу. Записать, кто слышал торговца, а кто пересказывал. Это проверит передачу обещания, не саму границу."
 HSM_BAR_investigation_amulet_2_report:0 "СВЕРКА ПЕРЕПИСКИ / без замеров границы\nСамую широкую версию не удалось связать с самостоятельным наблюдением помимо растений. Различия формулировок оставлены в таблице; свидетеля, согласного говорить лишь с врачом, не принуждали отказаться от этого условия.\nУточнено, что допустимо цитировать как показание. Место действия защиты и её пределы не измерены. Новый выезд требует оплаты обмера либо восстановления границы по ориентирам вместе с жителями. Амулет не изъят и не объявлен бесполезным."
 HSM_BAR_investigation_amulet_2_price:0 "20 политвласти / 21 дн."
 HSM_BAR_investigation_amulet_2_remaining:0 "ЭКСПЕДИЦИЯ / осталось [?days_mission_timeout@HSM_BAR_investigation_amulet_2_mission|0] дн."
 HSM_BAR_investigation_amulet_2_mission:0 "$HSM_BAR_investigation_amulet_2_title$"
 HSM_BAR_investigation_amulet_3_title:0 "Восстановить прежнюю границу"
 HSM_BAR_investigation_amulet_3_brief:0 "Попросить жителей отметить первые встречи с растениями на отдельных копиях плана. Небольшой группой неторопливо проверить ориентиры на месте, добавив текущие замеры без испытания защиты нападением. Сохранить разногласия о прочих угрозах."
 HSM_BAR_investigation_amulet_3_report:0 "КШЕМЕНЬ / планы возвращены владельцам\nНезависимые воспоминания о растениях сходятся у края поселения, даже когда объяснения покупки расходятся. Ориентиры проверены обходом, текущие замеры приложены. Подобного согласия насчёт защиты от всего под Баррадом нет.\nМатериал достаточен для дела о границе; спорные показания не скрыты. Амулет остался на месте, выбранном хранителями. Последующее сравнительное исследование может использовать замеры, но не забирать защиту поселения в качестве образца."
 HSM_BAR_investigation_amulet_3_price:0 "25 политвласти / 28 дн."
 HSM_BAR_investigation_amulet_3_remaining:0 "ЭКСПЕДИЦИЯ / осталось [?days_mission_timeout@HSM_BAR_investigation_amulet_3_mission|0] дн."
 HSM_BAR_investigation_amulet_3_mission:0 "$HSM_BAR_investigation_amulet_3_title$"
 HSM_BAR_investigation_plants_doc_1:0 "Лазарет / три отдельных приёма"
 HSM_BAR_investigation_plants_fragment_1_1:0 "К трём рассказам приложены разные листья. Все пациенты называли заросли одним местным именем."
 HSM_BAR_investigation_plants_fragment_1_2:0 "Двое пациентов сообщили о касании растений. Образцы оставлены при соответствующих показаниях."
 HSM_BAR_investigation_plants_fragment_1_3:0 "Третий пациент сжёг связку, собранную другим. В записи не сказано, что он касался живого растения."
 HSM_BAR_investigation_plants_doc_2:0 "Расчистная бригада / черновик сводки"
 HSM_BAR_investigation_plants_fragment_2_1:0 "Карта отмечает места поражений. Общее название растений переписано у нескольких отдельных меток."
 HSM_BAR_investigation_plants_fragment_2_2:0 "Сводка относит все три обращения к поражениям от касания. Один заголовок заменил отдельные записи об обстоятельствах."
 HSM_BAR_investigation_plants_fragment_2_3:0 "Старая запись о границе приложена под БР-004. Указания выжечь межи при ней нет."
 HSM_BAR_investigation_plants_hypothesis:0 "Сводка смешивает касание с воздействием горящего материала; общее имя может обозначать разные растения. Нужно установить, кто с чем столкнулся, каким способом и где. Золу хранить отдельно от листьев, каждый образец при своём рассказе. Для исправления спорной классификации не требуется повторно подвергать пациентов воздействию."
 HSM_BAR_investigation_plants_mismatch:0 "Общее имя или соседняя защитная граница не устанавливают, как пострадали эти пациенты. Сравнение должно сохранить различие, стёртое сводкой. Иначе средство для кожи могут назначить тому, кто подвергся воздействию дыма."
 HSM_BAR_investigation_plants_status:0 "[GetHSMBARInvestigationStatus_plants]"
 HSM_BAR_investigation_plants_1_title:0 "Раздельные маршруты сбора"
 HSM_BAR_investigation_plants_1_brief:0 "Ботаник и охраняемая полевая группа с защитным снаряжением пройдут указанные места. Каждый образец упаковать по месту и обстоятельствам; обожжённый материал отдельно. Перед подходом к неизвестным зарослям сверять метки с маршрутом расчистки."
 HSM_BAR_investigation_plants_1_report:0 "ГЕРБАРИЙ / маршрутные ярлыки сохранены\nМестное имя больше не принимается за название вида. Знакомые раздражающие растения отделены от образцов с необъяснёнными реакциями; обожжённому материалу выделены свой контейнер и исходное показание. Добровольцев воздействию не подвергали.\nНа одном участке метки перестали совпадать с маршрутом рабочих. Врона остановила там расчистку и сохранила обе карты. Полевая опись позволяет раздельно изучать касание, дым и перевозку. Запрос Ольхи о пропущенном листе графика выращивания остаётся без ответа."
 HSM_BAR_investigation_plants_1_price:0 "30 политвласти / 21 дн."
 HSM_BAR_investigation_plants_1_remaining:0 "ЭКСПЕДИЦИЯ / осталось [?days_mission_timeout@HSM_BAR_investigation_plants_1_mission|0] дн."
 HSM_BAR_investigation_plants_1_mission:0 "$HSM_BAR_investigation_plants_1_title$"
 HSM_BAR_investigation_plants_2_title:0 "Проследить происхождение образцов"
 HSM_BAR_investigation_plants_2_brief:0 "Начать с образцов лазарета и отдельно опросить собиравших их. Восстановить пути сбора и сжигания, затем взять небольшие контрольные образцы, не повторяя поражений. Медленная работа пары сотрудников сократит наём полевой группы ради тщательной проверки происхождения."
 HSM_BAR_investigation_plants_2_report:0 "КШЕМЕНЬ / приёмные листы и карта сбора\nУ сожжённой связки и двух образцов, связанных с касанием, разная история сбора. Её разделение выявило обычные раздражающие растения среди материала, который сводка считала одной угрозой. Иные образцы остаются необъяснёнными и изолированными.\nВосстановленный маршрут также не совпал с частью обмера. Врона остановила расчистку этого участка до исправления. Полевой гербарий снабжён раздельными ярлыками и контейнерами; новых опытов со сжиганием и намеренным касанием не проводили."
 HSM_BAR_investigation_plants_2_price:0 "25 политвласти / 28 дн."
 HSM_BAR_investigation_plants_2_remaining:0 "ЭКСПЕДИЦИЯ / осталось [?days_mission_timeout@HSM_BAR_investigation_plants_2_mission|0] дн."
 HSM_BAR_investigation_plants_2_mission:0 "$HSM_BAR_investigation_plants_2_title$"
 HSM_BAR_investigation_plants_3_title:0 "Сначала разобрать листья"
 HSM_BAR_investigation_plants_3_brief:0 "Попросить приезжего ботаника разобрать коллекцию лазарета по внешнему строению, не выходя из лаборатории. Сохранить исходные ярлыки. Так можно проверить названия, но сожжённую связку нельзя восстановить по одним целым листьям."
 HSM_BAR_investigation_plants_3_report:0 "БОТАНИЧЕСКИЙ РАЗБОР / воздействие не установлено\nОбщее деревенское имя покрывает внешне разный материал. Разложенные лотки исправляют эту ошибку. Но они не показывают, какой компонент сожжённой связки воздействовал на третьего пациента; совпадение ярлыков не связывает целый лист с поражением дымом.\nКоллекция сохранена раздельно. Для завершения нужны рассказы собиравших и места сбора, с отдельной проверкой обожжённого материала. Следующее задание оплачивает недостающую полевую работу, не новую перекладку тех же листьев."
 HSM_BAR_investigation_plants_3_price:0 "20 политвласти / 14 дн."
 HSM_BAR_investigation_plants_3_remaining:0 "ЭКСПЕДИЦИЯ / осталось [?days_mission_timeout@HSM_BAR_investigation_plants_3_mission|0] дн."
 HSM_BAR_investigation_plants_3_mission:0 "$HSM_BAR_investigation_plants_3_title$"
 HSM_BAR_investigation_echo_doc_1:0 "Показание бригадира / первый экземпляр"
 HSM_BAR_investigation_echo_fragment_1_1:0 "По его словам, ниже отмеченной площадки никто не работал. Это сведения о смене, не результат осмотра шахты."
 HSM_BAR_investigation_echo_fragment_1_2:0 "Он называет запоздавший звук ответом и помнит иные слова, чем рабочий. В оценке задержки они сходятся."
 HSM_BAR_investigation_echo_fragment_1_3:0 "Его просьба касается следующей смены. План вентиляции ещё разыскивают."
 HSM_BAR_investigation_echo_doc_2:0 "Показание рабочего / медицинская копия"
 HSM_BAR_investigation_echo_fragment_2_1:0 "Он услышал собственные слова спустя промежуток, указанный бригадиром. Иного ответа не помнит."
 HSM_BAR_investigation_echo_fragment_2_2:0 "План заканчивается у стены, которую рабочие считают полой. Свидетель не видел, что находится за ней."
 HSM_BAR_investigation_echo_fragment_2_3:0 "Кшемень сохранила отказ от следующей смены. Имя и запись о найме: £HSM_BAR_redact_long£."
 HSM_BAR_investigation_echo_hypothesis:0 "Свидетели сходятся во времени, но расходятся в смысле. Нужно заменить речь узнаваемым неречевым сигналом и записать задержку вместе с направлением из безопасных точек. Звук, вернувшийся неизвестным путём, могли принять за ответ; пока путь не обследован, это лишь предположение. Спуск ниже проверенной площадки не разрешён."
 HSM_BAR_investigation_echo_mismatch:0 "Пустая сменная ведомость и неполный план оставляют неизвестным путь звука, но не доказывают другого говорившего. Существеннее сравнить несовпадающие описания слов при одинаковой задержке. Проверять следует воспроизводимое, не требуя от свидетелей более удобного воспоминания."
 HSM_BAR_investigation_echo_status:0 "[GetHSMBARInvestigationStatus_echo]"
 HSM_BAR_investigation_echo_1_title:0 "Вернуться к показаниям"
 HSM_BAR_investigation_echo_1_brief:0 "С согласия рабочих опросить их отдельно и сравнить ранние показания с поздними пересказами. Так можно понять, откуда в записи появился «ответ», но не измерить акустический путь шахты."
 HSM_BAR_investigation_echo_1_report:0 "СВЕРКА БЕСЕД / оригиналы сохранены\nПервоначальные показания по-прежнему ближе во времени задержки, чем в словах. Поздние пересказы заимствуют выражения друг у друга и не считаются новым подтверждением. Ни одного свидетеля не просили вернуться вниз.\nПовторение показаний отделено от независимого свидетельства, но сам звук не проверен. Новому выезду нужны контрольный сигнал и точки на плане вентиляции. Беседы приложат к нему; ещё один одинаковый вопрос не заменит обмера."
 HSM_BAR_investigation_echo_1_price:0 "20 политвласти / 21 дн."
 HSM_BAR_investigation_echo_1_remaining:0 "ЭКСПЕДИЦИЯ / осталось [?days_mission_timeout@HSM_BAR_investigation_echo_1_mission|0] дн."
 HSM_BAR_investigation_echo_1_mission:0 "$HSM_BAR_investigation_echo_1_title$"
 HSM_BAR_investigation_echo_2_title:0 "Свисток и обмер направлений"
 HSM_BAR_investigation_echo_2_brief:0 "Нанять акустическую обмерную группу. Заменить вопрос свистком и сравнить возврат звука с площадки и проверенного бокового хода. Обследовать путь поэтапно; в непроверенный проём наблюдателей не отправлять."
 HSM_BAR_investigation_echo_2_report:0 "АКУСТИЧЕСКИЙ ЛИСТ / трасса исправлена\nСвисток вернулся через промежуток, описанный рабочими. В проверенном боковом ходе он пришёл сзади. Проверка измеренного направления выявила камеру, отсутствовавшую на плане, без спуска людей в открытую шахту.\nВрона отметила обратный путь и оставила под исправлением прежний чертёж. Полевой отчёт даёт воспроизводимое акустическое сравнение; окончательное закрытие требует полных замеров. Кшемень оставила ограду шахты в перечне ремонта."
 HSM_BAR_investigation_echo_2_price:0 "35 политвласти / 14 дн."
 HSM_BAR_investigation_echo_2_remaining:0 "ЭКСПЕДИЦИЯ / осталось [?days_mission_timeout@HSM_BAR_investigation_echo_2_mission|0] дн."
 HSM_BAR_investigation_echo_2_mission:0 "$HSM_BAR_investigation_echo_2_title$"
 HSM_BAR_investigation_echo_3_title:0 "Проследить возврат по записям"
 HSM_BAR_investigation_echo_3_brief:0 "Одолжить записывающую аппаратуру для длительного поэтапного обмера. Засекать свисток у источника и на проверенных постах, сравнивая направление без воспоминаний о словах. Перед переносом аппаратуры осматривать указанные звуком ходы."
 HSM_BAR_investigation_echo_3_report:0 "РЕЕСТР ЗАПИСЕЙ / сопоставленные сигналы\nСвисток с отметкой времени даёт ту же задержку на площадке и приходит сзади в боковом ходе. Повторные сравнения прослеживают путь через камеру, отсутствовавшую на старом чертеже. Самостоятельного речевого ответа в этих пробах не записано.\nИсправленная трасса и неразрезанные контрольные записи приложены к делу. Их ценность в воспроизводимом пути, не в приговоре всем голосам Баррада. Пропущенная камера относится к этому вентиляционному обмеру; открытая шахта остаётся местом опасного падения."
 HSM_BAR_investigation_echo_3_price:0 "25 политвласти / 28 дн."
 HSM_BAR_investigation_echo_3_remaining:0 "ЭКСПЕДИЦИЯ / осталось [?days_mission_timeout@HSM_BAR_investigation_echo_3_mission|0] дн."
 HSM_BAR_investigation_echo_3_mission:0 "$HSM_BAR_investigation_echo_3_title$"
 HSM_BAR_investigation_compass_doc_1:0 "Предложение о покупке / два маршрута"
 HSM_BAR_investigation_compass_fragment_1_1:0 "Продавец утверждает, что стрелка ищет погребённое святилище. Цитируемой надписи на рисунке прибора нет."
 HSM_BAR_investigation_compass_fragment_1_2:0 "Мастер указан как неизвестный. Имя торговца хранится под £HSM_BAR_redact_long£."
 HSM_BAR_investigation_compass_fragment_1_3:0 "Два нарисованных маршрута подходят с разных направлений, но оба заканчиваются у склада продавца."
 HSM_BAR_investigation_compass_doc_2:0 "Условия показа / экземпляр Вроны"
 HSM_BAR_investigation_compass_fragment_2_1:0 "Ольха требует контрольный прибор, которого продавец не касался. Сравнения при наблюдателях ещё не было."
 HSM_BAR_investigation_compass_fragment_2_2:0 "Предложенный показ сохраняет прибор в его футляре и ремнях. Проверки маршрута без футляра продавец не предлагает."
 HSM_BAR_investigation_compass_fragment_2_3:0 "Врона запрашивает футляр вместе с прибором. Ни святилище, ни надпись не подтверждены."
 HSM_BAR_investigation_compass_hypothesis:0 "Маршруты меняются, но цель и предложенный продавцом способ переноски остаются. Прежде чем приписывать отклонение святилищу, нужно разделить прибор, футляр, носильщика и направление. Менять по одному условию, не сообщая носильщику, что проверяют. Предложение может быть ошибочным или обманным; ни то ни другое заранее не устанавливает физической причины."
 HSM_BAR_investigation_compass_mismatch:0 "Неподтверждённая надпись ослабляет рассказ продавца, но не объясняет поворот стрелки. Полезная связь соединяет повторяющуюся цель с условиями, которые продавец сохраняет неизменными. Проверить нужно их, не превращая сомнительную историю ни в доказательство реликвии, ни в доказательство обмана."
 HSM_BAR_investigation_compass_status:0 "[GetHSMBARInvestigationStatus_compass]"
 HSM_BAR_investigation_compass_1_title:0 "Слепая смена приборов"
 HSM_BAR_investigation_compass_1_brief:0 "Нанять вторую обмерную группу и незаметно для носильщика менять предложенный компас на контрольный. Повторить путь с футляром и без него, отдельно записывая направление и носильщика. Всю фурнитуру оставить для дальнейшего осмотра."
 HSM_BAR_investigation_compass_1_report:0 "ЗЕМЛЕМЕРНАЯ СЕКЦИЯ / лист замен запечатан\nПри заменах отклонение следовало за футляром, не за носильщиком или направлением пути. Когда футляр оставили, предполагаемый маршрут исчез. Врона сохранила застёжку из подкладки в отдельном конверте для осмотра.\nПродавец попросил ещё один показ со своими ремнями; просьба отклонена. Полевая запись определяет требующий проверки узел, не святилище. До закрытия дела исследование материала должно объяснить роль застёжки."
 HSM_BAR_investigation_compass_1_price:0 "35 политвласти / 14 дн."
 HSM_BAR_investigation_compass_1_remaining:0 "ЭКСПЕДИЦИЯ / осталось [?days_mission_timeout@HSM_BAR_investigation_compass_1_mission|0] дн."
 HSM_BAR_investigation_compass_1_mission:0 "$HSM_BAR_investigation_compass_1_title$"
 HSM_BAR_investigation_compass_2_title:0 "Стендовое сравнение и обход"
 HSM_BAR_investigation_compass_2_brief:0 "В землемерной мастерской поворачивать футляр вокруг двух неподвижных компасов, меняя по одной детали. Затем проверить возникшее предположение коротким слепым обходом. Одолженные приборы сократят наём, но потребуют более долгого ожидания."
 HSM_BAR_investigation_compass_2_report:0 "МАСТЕРСКАЯ И ОБХОД / связанные записи\nПри неподвижных компасах перемещение футляра меняло отклонение. Последующая слепая замена на маршруте повторила зависимость от футляра, не от носильщика. Без футляра обещанное направление исчезло.\nЗастёжка из подкладки хранится отдельно с порядком проб. Её физические свойства предстоит исследовать в лаборатории; мастерская не удостоверяет ни надписи торговца, ни его намерений. Врона подшила стендовые замеры рядом с маршрутным листом, чтобы ни один не приняли за путешествие к тайному святилищу."
 HSM_BAR_investigation_compass_2_price:0 "25 политвласти / 28 дн."
 HSM_BAR_investigation_compass_2_remaining:0 "ЭКСПЕДИЦИЯ / осталось [?days_mission_timeout@HSM_BAR_investigation_compass_2_mission|0] дн."
 HSM_BAR_investigation_compass_2_mission:0 "$HSM_BAR_investigation_compass_2_title$"
 HSM_BAR_investigation_compass_3_title:0 "Проверить заявленное происхождение"
 HSM_BAR_investigation_compass_3_brief:0 "Сравнить рисунки продавца и рассказ о покупке с уцелевшими каталогами мастерских. Запросить проверяемую копию заявленной надписи. Это проверит предлагаемую историю компаса, не его поведение на местности."
 HSM_BAR_investigation_compass_3_report:0 "ПРОВЕРКА ПРОИСХОЖДЕНИЯ / атрибуция отложена\nВ истории прибора нет проверяемой копии цитируемой надписи. Представленные бумаги не устанавливают ни мастера, ни святилища. Покупка остаётся неподтверждённой; отсутствие записи не объясняет отклонения стрелки и не доказывает, что его нет.\nПереписка сохранена. Новому заданию нужны прибор, его футляр и независимый контроль в одной пробе. Дальнейший поиск по каталогам не заменит сравнения; надпись ни к одному древнему языку не отнесена."
