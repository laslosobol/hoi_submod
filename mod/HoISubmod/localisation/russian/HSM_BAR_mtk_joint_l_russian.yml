l_russian:
 HSM_BAR_mtk_sensate_prosthesis_title:0 "Заёмное осязание"
 HSM_BAR_mtk_sensate_prosthesis_idea:0 "Совместная заявка из комнаты восстановления.\n\nПротез Леопольда удерживает чашку, но владельцу приходится следить за каждым движением. Сеансы Сильвера иногда делают это движение терпимым; они не подсказывают, насколько сильно сжата чашка. Столяр спросил, нельзя ли проводить оба приёма в одной комнате. Мы предлагаем приспособление, передающее давление через отдельный участок здоровой кожи. Оно займёт уже существующее ощущение, а не вернёт утраченное. До начала работы нужны законченные отчёты о протезировании и сравнительных испытаниях лечения фантомной боли.\n\nЛеопольд отвечает за устройство. Сильвер решает вопросы допуска пациентов и прекращения сеансов. Столяр оставляет за собой право не любить чашку, которую мы ему предложим."
 HSM_BAR_mtk_sensate_prosthesis_theory:0 "Чертёж Леопольда с замечаниями Сильвера.\n\nИзменение давления в искусственной конечности может сдвигать мягкую накладку на неповреждённой коже. Носителю предстоит выучить этот сигнал; чертёж не даёт оснований называть его ощущением отсутствующей конечности. Малый кристалл сглаживает резкие движения, но не переносит личность или память. Сильвер предлагает раздельные сравнения с обратной связью, без неё и с намеренной задержкой, только при удобной нагрузке. Облегчение боли будут записывать отдельно от успешного обращения с предметами.\n\nСильвер: Более тихий пациент не доказывает, что прибор стал лучше.\nЛеопольд: Значит, отключение принадлежит носителю.\nСильвер: Оно и так ему принадлежало. Нарисуй рычаг там, где до него можно добраться, не глядя."
 HSM_BAR_mtk_sensate_prosthesis_tests:0 "Общий журнал мастерской и клиники.\n\nШесть добровольцев получили индивидуально подогнанные устройства. Четверо научились различать обычные сигналы давления и реже смотрели на протез, переставляя лёгкие предметы. Двое сочли дополнительное ощущение отвлекающим и вернулись к прежней конструкции. При сравнении с задержанным сигналом один участник усилил захват вместо того, чтобы ослабить; приспособление немедленно сняли. Повреждений не было, но все последующие образцы сохранили жёсткий ограничитель хода и обычное механическое отключение. Фантомная боль уменьшилась только у двоих; надёжно связать улучшение с новой деталью не удалось.\n\nСтоляр выбрал незачарованную накладку. Леопольд приготовил речь о кристалле. Сильвер вывел его в коридор раньше, чем он успел её произнести."
 HSM_BAR_mtk_sensate_prosthesis_conclusion:0 "Совместное заключение: ограниченное применение при восстановлении.\n\nПриспособление даёт некоторым носителям полезную, освоенную через упражнения обратную связь по давлению. Оно не возвращает естественное осязание, не лечит фантомную боль и не отменяет подгонку и повторные осмотры. Гражданские мастерские могут воспроизводить описанные образцы вместе с курсом восстановления; медицинские бригады могут использовать тот же прибор для возвращения опытных пациентов к подходящим обязанностям. Ни одно применение не допускает принуждения или предположения, будто неудобство означает сопротивление прогрессу. Отвергнутая деталь не делает пациента неудачей.\n\nПодписано: Леопольд и Сильвер Стар.\nДополнение столяра: Я уронил вашу чашку от смеха. Запишите, пожалуйста, что прибор работал.\nЛеопольд: Записано. Заказал чашки подешевле."
 HSM_BAR_mtk_interrupt_notation_title:0 "Знак остановки"
 HSM_BAR_mtk_interrupt_notation_idea:0 "Совместная заявка Вииры и Асинти.\n\nСхемы Вииры позволяют повторить простое заклинание тому, кто его не записывал. Тормоз Асинти позволяет помощнику завершить поддерживаемый ритуал, не побеждая его руководителя в споре. Пока это два отдельных урока, и помощник должен угадывать, где один соединяется с другим. Мы предлагаем нотацию с отмеченными точками прерывания: не всеобщий запрет магии, а порядок работы, в котором выход можно прочитать до входа. Нужны оба законченных отчёта, о нотации и о тормозе.\n\nВиира согласует письменные формы. Асинти настаивает, что пауза на рисунке должна стать паузой в комнате. Он принёс учебный барабан и положил его со стороны помощника, подальше от авторского кресла."
 HSM_BAR_mtk_interrupt_notation_theory:0 "Прозрачные схемы поверх листа с ритмом.\n\nКаждую проверяемую последовательность разделяют в точках, где поддерживающий рисунок можно прервать, не передав остаточный заряд наблюдателю. Нотация указывает нужный промежуток разрядки и то, за чем следует наблюдать после него. Асинти отвергает первый символ Вииры: он похож на завершённую остановку, хотя означает только требование остановиться. Они заменяют его двумя знаками, для требования и для измеренного возвращения к исходному состоянию.\n\nВиира: Следовало различать это с самого начала.\nАсинти: Мы различали. В разных комнатах.\nВ переработанном упражнении помощник, незнакомый с любимым ритмом автора, должен найти точку завершения, потребовать остановку и самостоятельно проверить, что она действительно произошла."
 HSM_BAR_mtk_interrupt_notation_tests:0 "Отчёт из учебной камеры.\n\nТри преподавателя обменялись схемами, не присутствуя при подготовке друг друга. Помощники правильно нашли точки прерывания в простых последовательностях и завершили их тормозом. Намеренно изменённый знак разрядки вызвал разногласие до начала ритуала; преподаватели разрешили его сравнением с образцовым листом. Упражнение не продолжали, пока обе копии не совпали. Незнакомый составной ритуал не удалось перевести в нотацию без новых измерений, поэтому его исключили из этой серии.\n\nАсинти прервал демонстрацию Вииры посреди объяснения. Поле успокоилось за записанный промежуток. Она спросила зачем. Он указал на просьбу помощника. Она подписала отчёт, а уже потом попросила вернуть ей недосказанную фразу."
 HSM_BAR_mtk_interrupt_notation_conclusion:0 "Нотация принята для обучения и работы.\n\nПроверенная запись связывает воспроизводимые магические указания с независимо проверяемым завершением. В обученных магических подразделениях она сокращает ненужные перерывы и повторную подготовку; в гражданском преподавании делает общие упражнения удобнее для проверки и безопаснее для повторения. Область применения ограничена измеренными семействами поддерживаемых ритуалов. Нотация не изгоняет самостоятельную сущность, не гасит незнакомое зачарование и не делает опасный порядок действий безвредным оттого, что рядом нарисован знак остановки. Новым последовательностям нужны собственные испытания.\n\nПодписано: Виира и Асинти.\nСильвер просит копию для класса, не для операционной. Леопольд спрашивает, нельзя ли этими знаками различать команду остановить машину и доказательство её остановки. Открыта отдельная заявка."
 HSM_BAR_mtk_revolver_howitzer_tests_instrumented:0 "Приборный протокол: макет обслуживания и отдельные нагрузочные стенды.\n\nВыделенная мастерская позволила раздельно измерять усилие при перевозке, доступ для осмотра и прерывание рабочего цикла на инертных установках. Измерения поступили раньше, чем при последовательной проверке во дворе. Пушку они не спасли. Перемещение макета барабана требовало больше помощников, чем обычное орудие для сравнения; каждая условная задержка по-прежнему останавливала всю последовательность. Смена позиции и подготовка съедали обещанный выигрыш. Разрешения на стрельбу не выдавали; все установки оставались инертными.\n\nЛеопольд: Мы заплатили за более ранний ответ, не за другой.\nСильвер: Напиши это над заказом второго прототипа.\nЛеопольд отменил заказ. Неудачный отчёт сохранён среди подготовительных работ Мануфактуры; практического применения у образца не появилось."
