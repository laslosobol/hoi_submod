 HSM_VER_WS_ERI_header:0 "Дом Эри — наследство распри"
 HSM_VER_WS_EYR_header:0 "Дом Эйри — цена бдительности"
 HSM_VER_WS_region_header:0 "Верения — три Дома, одна земля"
 HSM_VER_WS_ERI_intro:0 "§YДом Эри в 1007 году§!\nГерцог Винсент унаследовал не только титул. Распря с домом Эйри живёт в пограничных претензиях, семейной памяти и счетах деревень, которым снова предстоит кормить патрули. При дворе отказ от старого притязания сочтут слабостью; за его воротами верность этому притязанию означает ещё один неотремонтированный мост и ещё одну школу без учителя.\n\nЗдесь сильно аквелийское влияние, но подданные герцогства говорят на разных языках. Власти, желающей восстановить страну, придётся решить, как будут обращаться к ним школы и учреждения. Между тем переписка Розалин Эри и Монтага Эйри открывает перед их семьями непривычную возможность: будущее, в котором не обязательно повторять прошлое.\n\n§YВаша кампания§!\nНачните с фокуса §Y«$HSM_ERI_cost_of_feud$»§! и выберите договорное или военное объединение. Это взаимоисключающие политические пути. Дипломатия ведёт от гарантий к общим учреждениям; военная победа потребует устройства покорённых земель.\n\nШколам, благосостоянию и промышленности нужна собственная программа наряду с политическим выбором. Культурная ветка Эри предлагает аквелийское направление либо двуязычное устройство; реформы остаются доступны после мирного объединения и смены правителей. На вкладке §Y«Регион»§! описаны общая кампания и место Авиана в ней."
 HSM_VER_WS_EYR_intro:0 "§YДом Эйри в 1007 году§!\nГерцог Иовинус строит свою власть на бдительности. Для его офицеров граница с Эри — долг, унаследованный вместе с чином; для живущих за ней семей — постоянная потребность в работниках, припасах и сыновьях. Готовность к войне помогла Дому устоять, но не наполнила школьные классы и не избавила деревни от бедности.\n\nГерцландские традиции определяют жизнь двора и армии. Их будущее теперь зависит от того, сумеет ли герцогство обратить дисциплину в прочные гражданские учреждения. Письма Монтага Эйри к Розалин Эри пересекают границу, которую старшее поколение всё ещё считает рубежом соперничества. Эта связь может выйти за пределы частной переписки — если оба Дома найдут для неё место.\n\n§YВаша кампания§!\nНачните с фокуса §Y«$HSM_EYR_the_price_of_vigilance$»§! и выберите соглашение с Эри или военное объединение. Это взаимоисключающие политические пути. Дипломатии нужны гарантии и общие учреждения; победившей армии предстоит решить, как управлять страной после окончания боёв.\n\nГражданское развитие улучшает благосостояние, образование и производство параллельно политической кампании. Культурная ветка Эйри предлагает герцландское направление либо двуязычное устройство; объединение под властью общего двора не отменяет эти реформы. На вкладке §Y«Регион»§! — сотрудничество Домов, постепенное объединение и отношения с Авианом."
 HSM_VER_WS_region_intro:0 "§YМежду Герцландом и Аквелией§!\nЭри и Эйри делят наследство, пока Авиан пытается сохранить своё место между крупными державами. Их дороги, рынки и деревни уже принадлежат одному краю. Чтобы превратить эту общность в государство, придётся ответить на старый вопрос: чью власть признают три Дома?\n\n§YОт договора к объединению§!\nДипломатическая кампания закрепляет гарантии и хартию, после чего конвент начинает интеграцию. Таможня, общие работы, администрация и командование — §Yсовместные фокусы§!: Дом-участник может выполнять проект для партнёров. Работы и администрацию можно вести параллельно. Учреждениям нужно время для начала полноценной работы; окончательное присоединение требует отдельного согласия каждого сохранившегося участника. Общее государство возглавит Дом, председательствующий на конвенте.\n\n§YАвианский вопрос§!\nУ Авиана собственный выбор. §YIntergigantes§! допускает договорное присоединение. §YИстинный нейтралитет§! закрывает этот путь: Эри или Эйри тогда остаётся отдельная ветка завоевания и послевоенного включения Авиана, даже после мирного объединения двух герцогств. Нейтралитет Авиана не мешает Эри и Эйри сначала объединиться между собой.\n\n§YПосле объединения§!\nВерении по-прежнему нужны школы, общественные службы и действующая власть. Мирное объединение герцогств может дать Розалин и Монтагу общее будущее при дворе. Отдельная герцландская кампания посвящена судьбе Гровера и Веренскому регентству; воцарение взрослого Гровера позволит восстановить независимую союзную Империю, а Верения сохранит свои земли."
