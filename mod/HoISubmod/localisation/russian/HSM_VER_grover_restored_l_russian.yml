l_russian:
 HSM_VER_GRO_restored_empire:0 "Восстановленная империя"
 HSM_VER_GRO_restored_oath:0 "Публичная клятва императора"
 HSM_VER_GRO_restored_oath_desc:0 "Гровер возвращается в страну, чьё будущее нельзя определить одним лишь его происхождением. Перед депутатами и свидетелями из своего прежнего дома он обязуется соблюдать соглашение, благодаря которому смог вернуться."
 HSM_VER_GRO_restored_reconstruction:0 "Открыть бюро восстановления"
 HSM_VER_GRO_restored_reconstruction_desc:0 "Первые прошения касаются крыш, жалованья и мастерских, закрытых ещё во время боёв. Местным инженерам и избранным советам предстоит превратить эти просьбы в работу, результаты которой семьи увидят на своих улицах."
 HSM_VER_GRO_restored_charter:0 "Хартия для короны"
 HSM_VER_GRO_restored_charter_desc:0 "Императорская подпись должна занять своё место в законе, а закон должен оставаться понятным и без неё. Министры, депутаты и монарх определят, кто отвечает за каждое решение и как гражданин может его оспорить."
 HSM_VER_GRO_restored_embassies:0 "По обе стороны веренской границы"
 HSM_VER_GRO_restored_embassies_desc:0 "Верения была домом Гровера прежде, чем стала его соседом. Постоянные посланники и приезжие учёные помогут сохранить близость между двумя независимыми правительствами, каждое из которых отвечает перед своим народом."
 HSM_VER_GRO_restored_workshops:0 "Мастерские вновь открываются"
 HSM_VER_GRO_restored_workshops_desc:0 "Восстановленному заводу нужно больше, чем новая вывеска над воротами. Ученики, мастера и инженеры сопоставят методы, пережившие войну, и подготовят поколение, способное их усовершенствовать."
 HSM_VER_GRO_restored_courts:0 "Прошения прежде привилегий"
 HSM_VER_GRO_restored_courts_desc:0 "Обычной семье не должны требоваться знакомства при дворе, чтобы добиться слушания. Провинциальные судьи и государственные служащие проложат путь от самого скромного прошения к обоснованному ответу, даже если противная сторона носит влиятельное имя."
 HSM_VER_GRO_restored_defence:0 "Присяга на службе"
 HSM_VER_GRO_restored_defence_desc:0 "Гровер помнит офицеров, учивших его тому, что командование начинается с ответственности. Новые положения о службе подчинят оборону страны законной гражданской власти и ясно определят долг солдат перед жителями, которых они защищают."
 HSM_VER_GRO_restored_university:0 "Университет нового согласия"
 HSM_VER_GRO_restored_university_desc:0 "Восстановленные аудитории примут студентов, чьи семьи во время войны оказались по разные стороны. Государственные лаборатории и открытый отбор преподавателей сделают университет общим делом, которое переживёт торжества по случаю восстановления империи."
 HSM_VER_GRO_restored_arsenals:0 "Снабжение армии обороны"
 HSM_VER_GRO_restored_arsenals_desc:0 "Интенданты принесли в министерство практический список: надёжные инструменты, исправное снаряжение и мастерские, способные его обслуживать. Армия получит всё необходимое для защиты достигнутого соглашения и живущих под его защитой людей."
 HSM_VER_GRO_restored_peace:0 "Повседневный труд монарха"
 HSM_VER_GRO_restored_peace_desc:0 "Корона вернулась в повседневную жизнь. Её ценность будут измерять проведёнными слушаниями, открытыми классами и обещаниями, исполненными даже тогда, когда они стали неудобны. Теперь Гроверу предстоит научиться править в рамках учреждений, которые он помог создать."
 HSM_VER_GRO_restored_government_tt:0 "Восстановленная империя независима, и Гровер VI является её правящим монархом."
 HSM_VER_GRO_restored_partner_tt:0 "Веренский партнёр, восстановивший империю, существует и находится с нами в мире."
 HSM_VER_GRO_restored_construction_bonus:0 "Методы бюро восстановления"
 HSM_VER_GRO_restored_exchange_bonus:0 "Веренский научный обмен"
 HSM_VER_GRO_restored_industry_bonus:0 "Стандарты мастерских Герцланда"
 HSM_VER_GRO_restored_defence_bonus:0 "Исследования обороны страны"
 HSM_VER_GRO_restored_university_bonus:0 "Государственные исследовательские лаборатории"
 HSM_VER_GRO_restored_arsenal_bonus:0 "Разработка оружия"
 HSM_VER_GRO_restored_arsenal_site_tt:0 "Другой свой подконтрольный регион: §G+1§! ячейка и §G1§! военный завод."
 hsm_ver_grover_restored.1.t:0 "Имя под клятвой"
 hsm_ver_grover_restored.1.d:0 "Писарь оставил под клятвой место для подписи Гровера. С детства он видел своё имя на прокламациях, обычно под словами, которые выбирал кто-то другой. На этот раз он прочитал вслух всю страницу.\n\nКогда он закончил, депутаты встали. С галереи донеслись неровные аплодисменты: некоторые присоединились к ним чуть позже остальных. Гровер дождался тишины и только тогда взял перо.\n\nСнаружи просители всё ещё ждали открытия канцелярий. Он попросил камергера впустить их."
 hsm_ver_grover_restored.1.a:0 "Пусть каждое прошение достигает трона."
 hsm_ver_grover_restored.1.b:0 "Пусть министры готовят каждую аудиенцию."
 hsm_ver_grover_restored.2.t:0 "Исправленный пункт"
 hsm_ver_grover_restored.2.d:0 "Комитет вернул хартию с вычеркнутым предложением. Гровер предлагал дать ему право приостанавливать решения министров в чрезвычайных обстоятельствах. На полях депутат написал: кто решает, когда эти обстоятельства закончились?\n\nОни работали до зажжения ламп, добавляя слушание, срок и обязанность объяснить причины. Представители домов, поддержавших восстановление империи, принесли другой проект: закрепить должности и исключения за семьями, чьи офицеры обеспечили возвращение короны.\n\nПисарь положил перед Гровером оба текста. Комитет хотел установить правило, обязательное для каждого дома; покровители требовали признать обязательства, которые, по их мнению, корона уже приняла."
 hsm_ver_grover_restored.2.a:0 "Внесите текст комитета."
 hsm_ver_grover_restored.2.b:0 "Закрепим место за домами основателей."
 hsm_ver_grover_restored.3.t:0 "По другую сторону стола"
 hsm_ver_grover_restored.3.d:0 "Веренский посланник привёз положенные верительные грамоты, а под ними письмо из дома, где когда-то приютили Гровера. Император положил письмо возле чашки. Он прочитает его после встречи.\n\nПредстояло договориться о посещениях лабораторий и признании дипломов. Посланник не согласился с предложенным сроком; Гровер попросил министра назвать другой. Ни одной из делегаций не требовалось делать вид, будто дружба избавляет от переговоров.\n\nПозже, оставшись на несколько минут один, он открыл письмо. Кто-то спрашивал, достаточно ли он спит."
 hsm_ver_grover_restored.3.a:0 "Один ответ посланнику, другой домой."
 hsm_ver_grover_restored.4.t:0 "Обычное утро"
 hsm_ver_grover_restored.4.d:0 "Утренние газеты писали о споре вокруг договора с мастерской, именах новых университетских преподавателей и жалобе на армейский обоз, перегородивший рыночную улицу. Императору досталось место в середине второй страницы.\n\nГровер дважды прочитал жалобу и передал её ответственному министру. Секретарь спросил, желает ли дворец опубликовать ответ. Гровер сказал, что рынку нужна свободная улица.\n\nИз окна было видно, как движется очередь у канцелярии прошений. Впереди ещё будут трудные утра и решения, которых не упростит никакая клятва. Но сегодня служащие уже приступили к работе, не дожидаясь его появления."
 hsm_ver_grover_restored.4.a:0 "Передайте бумаги кабинету министров."
 hsm_ver_grover_restored.1.d_filtered:0 "Перед публичным слушанием камергер предложил Гроверу список подходящих вопросов. Знакомая любезность: когда-то наставники выбирали для него книги, посетителей и доводы, с которыми ему позволялось познакомиться.\n\nОдну из просительниц он узнал по прежней процессии. Её вопроса в списке не было. Камергер объяснил, что министры могут сначала разобраться и подготовить обоснованный ответ к следующей аудиенции. Просительница опасалась, что домовладелец получит ответ задолго до неё.\n\nГровер положил список рядом с только что подписанной клятвой. Обещание выслушивать подданных оставляло ему выбор: кому позволить говорить от их имени."
 hsm_ver_grover_restored.2.d_patron:0 "Рядом с предложенным комитетом правилом о государственных договорах появилось знакомое родовое имя. Много лет назад Гровер узнал, как легко репутация покровителя перевешивает доказательства просителя. Теперь тот же дом добивался исключения из нового порядка, установленного хартией.\n\nЕго представитель говорил об офицерах, займах и обещаниях, данных во время восстановления империи. Юрист комитета возражал: любое исключение станет прецедентом, когда придёт следующий дом.\n\nПросьба пролежала рядом с готовой хартией до вечера. Гровер мог подтвердить обязательства, унаследованные от опекунов, или потребовать от прежних защитников обосновать свои требования по общим правилам. Ни один ответ не останется частным делом."
 hsm_ver_grover_restored.3.d_eyrie:0 "Посланник Эйри положил верительные грамоты рядом с письмом из прежнего дома Гровера. Почерк напомнил голоса в тех комнатах яснее любой официальной печати. Гровер отложил письмо до конца встречи.\n\nДелегации провели утро за обсуждением поездок студентов, посещений мастерских и признания дипломов. В какой-то момент Гровер обратился к посланнику так, как обращался в детстве, затем замолчал и позволил своему министру закончить предложение.\n\nКогда двери закрылись, он открыл письмо. За всеми титулами и назначениями кто-то по-прежнему хотел знать, достаточно ли он спит."
 hsm_ver_grover_restored.4.d_command:0 "Офицеры представили годовой отчёт с точностью, которую Гровер помнил по собственной службе. Он знал, где искать сведения о боеготовности, и задал вопрос прежде, чем генерал дошёл до второй страницы.\n\nЗатем гражданский министр открыл другую папку: жалобы на реквизиции, задержанные выплаты и учения, во время которых повредили деревенский мост. Гровер вновь повернулся к генералу и попросил его остаться на время обсуждения.\n\nЗаседание продлилось дольше парада за окнами. К его завершению кабинет определил, кто отремонтирует мост и кто ответит перед сельским советом. Гровер подписал протокол под именем министра."
 HSM_VER_GRO_restored_public_service:0 "Провинциальная государственная служба"
 HSM_VER_GRO_restored_public_service_desc:0 "Местные суды и бюро восстановления ведут общий открытый реестр договоров, претензий и выполненных работ. За остановившийся проект отвечает конкретное ведомство, а проситель может следить за его судьбой и за пределами дворцовых ворот."
 HSM_VER_GRO_restored_civic_settlement:0 "Учреждения нового согласия"
 HSM_VER_GRO_restored_civic_settlement_desc:0 "Восстановленное государство опирается на работающие учреждения: мастерские, обучающие учеников, лаборатории, обменивающиеся открытиями, и министерства, способные исполнить решение, не дожидаясь новых торжеств."
