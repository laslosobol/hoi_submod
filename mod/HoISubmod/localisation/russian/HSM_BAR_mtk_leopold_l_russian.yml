l_russian:
 HSM_BAR_mtk_prosthetics_title:0 "Кристальные протезы"
 HSM_BAR_mtk_prosthetics_idea:0 "Ремонт собственного тела научил меня тому, каким убедительным становится устройство, когда отвечает на боль. Но он не объяснил, как его должно носить другое тело. Предлагаю протез с кристальной поддержкой, мастерские детали которого можно менять без переделки всего индивидуального крепления. Первый случай будет посвящён обычным движениям между стулом, верстаком и двором. Сильвер опишет сохранившуюся подвижность пациента прежде, чем я начну объяснять механизм. Виира попросила чертежи, понятные деревенскому кузнецу. На верстаке я освободил место и для такого читателя, и для самого устройства.\n\nЛеопольд, предложение мастерской."
 HSM_BAR_mtk_prosthetics_theory:0 "Рабочая гипотеза: подогнанная механическая опора может поддерживать нужное движение, а ограниченный отклик кристалла помогать ему, если пациент способен предвидеть и остановить этот отклик. Чертёж отделяет личное крепление от заменяемых мастерских деталей. Сравним обычные задачи с привычным вспомогательным средством пациента, проверим неприятные ощущения после отдыха и предложим незнакомому с устройством мастеру заменить учебную изношенную деталь по одному чертежу. Для копыта и когтей нужны отдельные образцы; ни один заранее не считается универсальным.\n\nЛеопольд. Сильвер запишет утомление и состояние кожи. Виира требует показывать на каждом чертеже движение, которое тот должен обеспечить."
 HSM_BAR_mtk_prosthetics_tests:0 "Подогнанный протез выдержал согласованную прогулку по двору и работу у верстака; носитель мог остановить поддерживаемое движение, не дожидаясь меня. Местный мастер заменил учебную деталь по чертежу и восстановил проверенное движение. При продолжительном ношении появилась болезненность у индивидуального крепления. Сильвер потребовал подгонки и повторного осмотра после отдыха, прежде чем принять результат. Для другой формы конечности понадобилось собственное крепление, а не потуже затянутая копия. В пределах проверенного образца мастерские детали остались взаимозаменяемыми.\n\nЛеопольд и Сильвер подписали запись подгонки. Виира добавила поправку носителя: Чертёж должен показывать, как садиться, а не только как стоять."
 HSM_BAR_mtk_prosthetics_conclusion:0 "Протез принят для движений и крепления, описанных в истории наблюдений. Его успех включает возможность заменить указанные детали в обычной мастерской. Он не означает восстановления чувствительности, отсутствия износа или права подгонять любое тело по одному чертежу. Повторные осмотры и местная подгонка остаются частью рабочего срока устройства. Я назвал их последующим уходом, словно инженерная работа закончилась при выдаче. Сильвер перенёс их в основное описание. Он прав: исправный механизм ещё не доказывает, что пациенту удобно им пользоваться.\n\nЛеопольд. Виира подписала исправленные чертежи, включая сидячую позу, которую мой красивый первый лист ухитрился обойти."

 HSM_BAR_mtk_self_repair_title:0 "Саморемонт"
 HSM_BAR_mtk_self_repair_idea:0 "Каждый вернувшийся механизм сопровождается рассказом о миге остановки и редко о тихих изменениях, которые ей предшествовали. Предлагаю машину, способную указывать на возникающую неисправность и переходить в определённое состояние обслуживания, прежде чем собственное движение скроет следы. На верстаке лежит честолюбивый заголовок: саморемонт. Под ним я нарисовал мастерскую, лотки запасных частей и место мастера. Любое правдоподобное предложение обязано объяснить, откуда возьмётся недостающий материал. Виира советует проверить предупреждение, прежде чем доверять восстановлению; эти вопросы получат отдельные записи.\n\nЛеопольд. Сильвер предложил приборы для наблюдения за нагревом во время обычной работы."
 HSM_BAR_mtk_self_repair_theory:0 "Гипотеза состоит из отдельных частей: повторяющийся износ может давать узнаваемое изменение, а остановленный механизм позволять заранее подготовленное обслуживание. Ни то ни другое не означает, что разрушенный материал восстановит себя. Внесём обычный износ в учебные узлы, сравним указатели с осмотром мастера и попробуем предусмотренное обслуживание только на верстаке. Незнакомые повреждения следует записывать отдельно от неисправностей, названных на чертеже. В журнал войдут израсходованные материалы и вся работа обслуживающей смены, даже если она кажется несущественной.\n\nЛеопольд. Пометка Вииры: Нарисуй мастера в последовательности действий. Иначе пропущенный шаг будет выглядеть как чудо."
 HSM_BAR_mtk_self_repair_tests:0 "Указатель неоднократно распознал знакомый ослабленный узел и перевёл учебную машину в остановку для обслуживания. На подготовленном верстаке приспособление помогло восстановить доступную регулировку, пока мастер проверял результат. Треснувшие детали остались треснувшими. Незнакомый перекос вызвал внешне обычное предупреждение, но машина не смогла определить необходимую замену. Пыль также мешала одному указателю до очистки. Виира сравнила чертежи с действительным порядком и обвела все незаписанные вмешательства смены. Их оказалось несколько, и без них опыт не завершался.\n\nЛеопольд. Сильвер подписал записи нагрева; мастерской журнал теперь указывает, кто осматривал, очищал, снабжал и запускал каждый узел."
 HSM_BAR_mtk_self_repair_conclusion:0 "Работа частично принята как порядок обслуживания в ремонтной мастерской. Знакомые предупреждения, доступные точки обслуживания и подготовленный запас деталей помогают ремонту, но машина не распознаёт произвольное повреждение и не изготовляет недостающие части. Мастер должен осмотреть неисправность и разрешить запуск. Поэтому на сервисном листе заголовок саморемонт зачёркнут и заменён обслуживанием с помощью приспособлений. Первоначальное предложение я оставил за ним, вместе с первым чрезмерно широким эскизом, чтобы пределы окончательного решения оставались понятны читателю.\n\nЛеопольд. Замечание Вииры: Твоя машина приобрела мастерскую, а не способность исцеляться. Согласен; мастерская заслуживает места на законченном чертеже."

 HSM_BAR_mtk_revolver_howitzer_title:0 "Револьверная гаубица"
 HSM_BAR_mtk_revolver_howitzer_idea:0 "Гаубица с револьверным барабаном. Я написал это на двери мастерской, потому что все спрашивали, зачем на чертеже такое огромное колесо. Спешить будет орудие, а не измученный расчёт; во всяком случае, таков замысел. Сильвер спросил, нарисовал ли я что-нибудь, способное протащить его по раскисшему полю. Пока нет. Прежде чем просить полигон, закажу учебный макет без возможности стрельбы и позволю обычному расчёту с ним поспорить.\n\nЛеопольд. Виира дописала на двери второе предложение: Колесо должно покинуть эту комнату без разборки стены. Полагаю, это тоже придётся включить в требования."
 HSM_BAR_mtk_revolver_howitzer_theory:0 "Замысел обещает короткую серию действий с последующей подготовкой, а не одинаковую остановку после каждого выстрела. Первый эскиз учитывал лишь промежуток, который мне хотелось сократить. Но всё орудие ещё нужно перевозить, осматривать и возвращать в работу после задержки. Увеличивая знакомый механизм, мы не сохраняем ни его привычный вес, ни удобство обращения. Сравним полные рабочие циклы на учебном макете, включая дорогу и обслуживание, прежде чем признавать выигрыш во времени.\n\nЛеопольд. Пометка Сильвера: Дорогу поставь на первую страницу, а не среди оговорок в конце. Хорошо; там она сразу портит красивую схему, что, вероятно, и требуется."
 HSM_BAR_mtk_revolver_howitzer_tests:0 "Макет добрался до двора после того, как мы сняли дверь. До противоположной стороны без дополнительной помощи он не добрался. Излишний вес превращал каждую смену места в отдельную работу, а тесный механизм оставлял слишком мало пространства для обычного осмотра. При проверке обращения одна условная задержка остановила всю последовательность. Подготовка после неё съела время, которое чертёж обещал сберечь. Расчёт предпочёл обычное орудие для сравнения: его остановки оказались короче наших и значительно менее впечатляющими. Испытания стрельбой не разрешены.\n\nЛеопольд. Виира навесила дверь обратно. Сильвер дождался ухода уставших участников и только потом попросил мою подпись."
 HSM_BAR_mtk_revolver_howitzer_conclusion:0 "Работа над револьверной гаубицей закрыта без принятия образца. Ни пригодного оружия, ни отдельного полезного применения из него не получилось. Вес, неудобное обслуживание и общие задержки уничтожают обещанный выигрыш. Сохраним отчёт; мастерская не обязана придумывать занятие неудачной машине. Я хотел получить последовательность без пауз, а получил последовательность, в которой каждая пауза останавливала всё. Это различие должно стоять в начале моего следующего предложения.\n\nЛеопольд. Виира: Стереть надпись с двери? Оставь до завтра. Я могу признать ошибку и всё ещё не любить на неё смотреть."

 HSM_BAR_mtk_crystal_drive_title:0 "Кристальный привод"
 HSM_BAR_mtk_crystal_drive_idea:0 "Яркий кристалл впечатляет посетителей; мастерская спрашивает, можно ли заставить его вращать инструмент, не пугая следующего работника. Предлагаю ограниченный привод для обычного станка, с отдельными обозначениями источника, нагрузки и остановки на чертеже. Виира согласилась описывать ощущаемые изменения прежде, чем я решу, что должен показывать указатель. Первая работа будет посвящена безобидному полировальному кругу при меняющемся сопротивлении. Меня интересует надёжное движение, доступное проверке мастера, а не зрелище, возле которого постоянно требуется изобретатель. Описание должно позволить другому оператору самостоятельно провести назначенную пробу.\n\nЛеопольд, предложение привода; спектральные наблюдения поручены Виире."
 HSM_BAR_mtk_crystal_drive_theory:0 "Рабочая гипотеза: магическую отдачу кристалла можно согласовать с обычной мастерской нагрузкой, не принимая яркость за доказательство полезного движения. В испытании запишем поведение круга, изменения источника и последствия снятия нагрузки. Сопоставим действующее регулирование с тем же прибором в покое, затем повторим опыт с другим оператором. Истощение источника должно приводить к понятной остановке. Виира составит отдельную спектральную запись, чтобы внешне спокойный указатель не скрыл изменения кристалла. Все несовпадения наблюдений сохранятся до общего разбора.\n\nЛеопольд. Сильвер просит предусмотреть отдых наблюдателей: повторяющееся движение позволяет усталому свидетелю легко пропустить перемену."
 HSM_BAR_mtk_crystal_drive_tests:0 "Привод поддерживал согласованное движение полировального круга при проверенных изменениях сопротивления. Сменившийся оператор выполнил письменные проверки и остановил его без моего вмешательства. Когда источник ослаб, круг предсказуемо остановился, не забирая силу у соседних приборов. Спектральные листы Вииры соответствовали записанному изменению кристалла, однако длительная работа нагревала корпус и требовала перерыва для охлаждения. Повреждённые образцы отвечали неровно; их исключили из принятого набора источников. Осмотр источника сохранили как отдельную обязательную запись.\n\nЛеопольд и Виира подписали сопоставленные журналы. Сильвер отметил, что смена наблюдателей сохраняла качество записей, даже когда само колесо казалось однообразно надёжным."
 HSM_BAR_mtk_crystal_drive_conclusion:0 "Кристальный привод принят для описанных мастерских нагрузок, с осмотром источника, перерывами для охлаждения и проверенной остановкой. Он даёт управляемое движение от подготовленных кристаллов, но не создаёт собственный запас, не исправляет повреждённый источник и не оправдывает подключение всех станков к одному устройству. В журнале оператора спектральный лист Вииры теперь лежит рядом с моим механическим чертежом. При расхождении показаний каждый позволяет проверить другой. Тихий демонстрационный круг остаётся на верстаке, поскольку посетители всё ещё просят показать нечто более впечатляющее.\n\nЛеопольд. Подпись Вииры: Пусть посмотрят на остановку. Она тоже часть изобретения."

 HSM_BAR_mtk_sorting_engine_title:0 "Сортировочная машина"
 HSM_BAR_mtk_sorting_engine_idea:0 "В мастерских лотках лежат детали, кажущиеся одинаковыми, пока мастер не попробует их установить. Предлагаю машину, которая сравнивает поступающие части с именованными образцами и направляет в подготовленные лотки. Соблазнительное слово здесь суждение; на первом чертеже операция названа сравнением. Начнём со знакомых мастерских деталей, принятую форму которых можно проверить независимо. Незнакомые предметы должны оставаться на виду, а не исчезать в ближайшей удобной категории. Виира вызвалась приносить вещи, нарушающие стройность моих примеров. Подозреваю, она уже начала собирать коллекцию.\n\nЛеопольд. Лотки с образцами будут подписаны до первого испытания."
 HSM_BAR_mtk_sorting_engine_theory:0 "Рабочая гипотеза: ограниченный набор повторяемых измерений позволяет различать известные классы деталей. Машина будет выполнять установленную последовательность сравнений с мастерскими образцами; ей не поручается открывать назначение предмета. Испытательные лотки смешают обычные примеры, изношенные части и незнакомые формы. Независимый мастер проверит каждое место назначения, включая лоток неопределённых предметов. Верное совпадение должно оставаться верным после смены порядка подачи. Все сомнительные решения запишем до исправления настроек, чтобы последующая подгонка не стёрла первоначальную ошибку.\n\nЛеопольд. Дополнение Вииры: Предъявить ту же форму из обманчивого материала. Узнавание контура ещё не объясняет, что именно получила машина."
 HSM_BAR_mtk_sorting_engine_tests:0 "Чистые примеры подготовленных классов попадали в назначенные лотки даже при изменении порядка подачи. Изношенные части иногда совпадали с неверным образцом. Подменённый Виирой материал прошёл сравнение контура, хотя не годился для той же задачи. Машина не вывела назначения: она повторяла заданные нами сравнения. Направление сомнительных показаний в неопределённый лоток уменьшило число уверенных ошибок, но оставило смене немало проверочной работы. Новые классы потребовали новых образцов и отдельного проверенного испытания.\n\nЛеопольд. Виира с заметным удовольствием подписала список неудобных предметов. Приёмщик подписал журнал распределения прежде, чем мы изменили хотя бы одну метку."
 HSM_BAR_mtk_sorting_engine_conclusion:0 "Сортировочная машина сохраняется для предварительного разделения чистых деталей из испытанных семейств. Её частичный успех зависит от ухода за образцами и настоящего места для неопределённых предметов. Она не распознаёт произвольные вещи, не выводит замысел изготовителя и не обучается новому ремеслу. Окончательная приёмка остаётся за мастером, особенно когда материал важнее контура. Неудобные примеры Вииры останутся возле обычных лотков: каждую перенастройку следует проверять и на них, а не только на послушных образцах.\n\nЛеопольд. Из приглашения на следующий показ убрано название мыслящая машина. Виира говорит, что сравнение вполне достойное занятие, если называть его точно."

 HSM_BAR_mtk_manufactory_title:0 "Мануфактура"
 HSM_BAR_mtk_manufactory_idea:0 "Предлагаю мастерскую, способную повторять утверждённую последовательность изготовления, пока смена занимается подготовкой, осмотром и ремонтом. Первыми изделиями станут простые корпуса и крепления; каждая операция будет видна из прохода обслуживания. Строительство должно дождаться завершённых исследований Кристальных протезов, Саморемонта, Револьверной гаубицы, Кристального привода и Сортировочной машины. Рассмотреть следует каждый отчёт, включая отвергнутые предложения. Ни одна работа не служит необязательным украшением окончательного чертежа. Смогут ли их выводы сосуществовать в действующей линии, пока остаётся вопросом.\n\nЛеопольд. Виира проверит указатели, Сильвер рабочие записи смены, Асинти последовательность действий; их замечания войдут в описание испытания."
 HSM_BAR_mtk_manufactory_theory:0 "Гипотеза Мануфактуры предполагает последовательность ограниченных операций под наблюдением. Кристальные протезы дают взаимозаменяемые образцы без признания всех креплений одинаковыми. Саморемонт требует настоящей ремонтной мастерской, запасных частей и проверенного запуска. Неудача Револьверной гаубицы запрещает считать, что объединение задач устраняет перерывы: посты должны останавливаться отдельно. Кристальный привод даёт ограниченное движение с охлаждением и осмотром источника. Сортировочная машина принимает лишь известные классы и отправляет сомнительные детали мастеру. Все эти завершённые исследования обязательны. Движение обеспечивают механизмы и сила кристаллов; мыслящего разума или связанной души в устройстве нет.\n\nЛеопольд; Виира, Сильвер и Асинти подписали предложенный лист испытания."
 HSM_BAR_mtk_manufactory_tests:0 "Мануфактура повторила утверждённое изготовление корпусов и выдала изделия, принятые мастером. Кристальные протезы дали проверенные образцы взаимозаменяемости; незнакомое крепление всё же потребовало нового чертежа. Пост обслуживания Саморемонта восстановил обычные регулировки, а треснувшие части ждали замены. Урок неудачной Револьверной гаубицы проверили остановкой поста: соседние посты завершили текущие операции и затем запускались по отдельности. Кристальный привод держал назначенную нагрузку и проходил перерывы охлаждения. Сортировочная машина распределяла известные заготовки, направляя сомнительные на осмотр. Ни один пост не придумал задачу по отсутствующему в списке распоряжению.\n\nЛеопольд подписал выпуск; Виира проверила указатели, Сильвер усталость смены, Асинти прерванные последовательности."
 HSM_BAR_mtk_manufactory_conclusion:0 "Мануфактура принята для ограниченного автоматизированного изготовления под надзором мастерской. Кристальные протезы задают утверждённые образцы, а не универсальное крепление. Саморемонт обеспечивает обслуживание мастерами, а не исцеление машин. Револьверная гаубица остаётся неудачей без практической пользы; её отвергнутый довод объясняет отдельные остановки этой линии. Кристальный привод требует подготовленных источников и охлаждения. Сортировочная машина требует известных образцов и решения мастера по сомнительным частям. Все предшествующие исследования обязательны в рабочем досье. Механизмы не мыслят и не содержат порабощённых душ; новой работе нужны новые чертежи и испытания.\n\nЛеопольд. Виира, Сильвер и Асинти подписывают общий лист приёмки, затем мастер, проверивший изделия."
