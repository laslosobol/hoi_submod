l_russian:
 HSM_VER_CW_first_budget:0 "Первая общая смета"
 HSM_VER_CW_first_budget_desc:0 "На карте граница исчезла раньше, чем в расходных книгах. Одну школу оплачивают два ведомства, а соседнюю не считает своей ни одно. Правительству предстоит решить, кто распоряжается общими средствами и кто отвечает перед теми, кто их внес."
 HSM_VER_CW_citizens:0 "Гражданство без старых печатей"
 HSM_VER_CW_citizens_desc:0 "Подданный соседнего Дома больше не иностранец, но писарь всё ещё требует с него особую пошлину. Старые суды по-разному признают наследство, долги и право на ремесло. Одного общего герба недостаточно: жителям нужна понятная защита по обе стороны прежней границы."
 HSM_VER_CW_housing:0 "Кварталы за бывшей границей"
 HSM_VER_CW_housing_desc:0 "Наёмные работники ночуют в пристройках к мастерским, а пустующие усадебные дома годами стоят с заколоченными окнами. Муниципальные строители получат заказы на жильё, колодцы и стоки. Возвращение к мирной жизни должно быть заметно не только на главной площади."
 HSM_VER_CW_clinics:0 "Приём без гербовой справки"
 HSM_VER_CW_clinics_desc:0 "В приёмной спрашивают, откуда прибыл больной, и отправляют его за подтверждением в другой округ. Медики предлагают иной порядок: общие санитарные правила, взаимное признание обучения и снабжение сельских лечебниц из одного перечня. Болезни не признавали границ даже тогда, когда их признавали герцоги."
 HSM_VER_CW_market_roads:0 "Дороги к общему рынку"
 HSM_VER_CW_market_roads_desc:0 "Дороги строили к заставам и гарнизонам, а не к соседним городам. Теперь перевозчики отмечают на одной карте разбитые мосты, опасные спуски и места, где обоз вынужден делать крюк. Эти отметки станут первым общим дорожным планом."
 HSM_VER_CW_machine_shops:0 "Станки вместо таможен"
 HSM_VER_CW_machine_shops_desc:0 "Бывшие таможенные склады стоят у удобных дорог, но хранят лишь обломки шлагбаумов. Ремесленники предлагают разместить здесь станки и ремонтные мастерские. Заказы должны связать поставщиков из разных округов, чтобы закрытие старой границы стало началом новой работы."
 HSM_VER_CW_standards:0 "Один чертёж для разных мастерских"
 HSM_VER_CW_standards_desc:0 "Болт, изготовленный в одном округе, не подходит к гайке из другого. Мастера привыкли считать собственные меры частью достоинства своего ремесла. Общая палата образцов не отнимет их клейма, но потребует, чтобы детали подходили друг к другу без напильника."
 HSM_VER_CW_evening_classes:0 "Вечерние классы"
 HSM_VER_CW_evening_classes_desc:0 "Новая школа не поможет взрослому прочитать договор, если её дверь открыта только в рабочие часы. Учителя и мастерские договорятся о вечерних занятиях. За партами окажутся ученики с уставшими когтями и слишком большим опытом, чтобы стыдиться первой прочитанной страницы."
 HSM_VER_CW_institute:0 "Веренский прикладной институт"
 HSM_VER_CW_institute_desc:0 "У каждой бывшей столицы есть свой учитель, мастерская и собрание приборов. По отдельности они просят одни и те же книги и не могут закончить одни и те же опыты. Общий институт начнётся с обмена оборудованием, открытого набора учеников и права спорить с коллегой из другого Дома."
 HSM_VER_CW_common_service:0 "Служить одной стране"
 HSM_VER_CW_common_service_desc:0 "Полковые списки всё ещё помнят, против кого прежде собиралось ополчение. Общая служба потребует большего, чем новая кокарда: единых правил назначения, подготовки и ответственности перед гражданской властью. Офицерам предстоит выбрать, на чём будет держаться оборона небольшой страны."
 HSM_VER_CW_reserve_depots:0 "Запасы общей страны"
 HSM_VER_CW_reserve_depots_desc:0 "Прежние арсеналы рассчитаны на короткий поход через соседний холм. Общей стране нужны ремонтные запасы, распределённые склады и мастерские, способные заменить потерянную поставку. Мы не станем великой державой одним приказом, но перестанем зависеть от одной дороги."
 HSM_VER_CW_public_accounts:0 "Отчёт перед всей Веренией"
 HSM_VER_CW_public_accounts_desc:0 "Первые общие стройки закончены. Теперь в столицу приходят не только благодарности: подрядчики спорят о ценах, общины — об очереди, казначеи — о пропавших квитанциях. Опубликованный отчёт должен назвать и исполненные обещания, и тех, кто получил деньги за невыполненные."
 HSM_VER_CW_ordinary_country:0 "Страна на следующий день"
 HSM_VER_CW_ordinary_country_desc:0 "Объединение запомнят по речам и поднятому флагу. Его прочность определится позже: дойдёт ли лекарство до деревни, признают ли диплом в соседнем городе, будет ли суд слушать жалобу на собственного чиновника. Нам нужна страна, которая продолжает работать после того, как закончился праздник."
 HSM_VER_CW_ready_tt:0 "Верения независима, находится в мире и контролирует свои основные земли; общие учреждения уже устроены."
 HSM_VER_CW_budget_agreed_tt:0 "Принята первая общая смета."
 HSM_VER_CW_citizens_agreed_tt:0 "Утверждены общие гражданские гарантии."
 HSM_VER_CW_service_agreed_tt:0 "Определён порядок общей военной службы."
 HSM_VER_CW_civilian_space_tt:0 "В полностью контролируемой национальной области есть место для двух гражданских фабрик."
 HSM_VER_CW_military_space_tt:0 "В полностью контролируемой национальной области есть место для военного завода."
 HSM_VER_CW_treasury:0 "Общая казна"
 HSM_VER_CW_treasury_desc:0 "Общая казна направляет средства туда, где работы важнее для всей страны, а не только для прежнего владельца дороги."
 HSM_VER_CW_district_credit:0 "Окружные кредитные товарищества"
 HSM_VER_CW_district_credit_desc:0 "Местные товарищества кредитуют мастерские и поставщиков под общие правила отчётности."
 HSM_VER_CW_common_courts:0 "Единая гражданская юстиция"
 HSM_VER_CW_common_courts_desc:0 "Одинаковое дело рассматривается по одному закону, независимо от герба над входом в суд."
 HSM_VER_CW_local_guarantees:0 "Гарантии окружного самоуправления"
 HSM_VER_CW_local_guarantees_desc:0 "Округа сохраняют свои учреждения, но общие права жителей стоят выше местного обычая."
 HSM_VER_CW_housing_service:0 "Муниципальное жильё и водоснабжение"
 HSM_VER_CW_housing_service_desc:0 "Города и сельские общины содержат жильё, колодцы и стоки по общим санитарным правилам."
 HSM_VER_CW_interchangeable_parts:0 "Взаимозаменяемые детали"
 HSM_VER_CW_interchangeable_parts_desc:0 "Производственные чертежи больше не заканчиваются у порога собственной мастерской."
 HSM_VER_CW_professional_service:0 "Постоянная веренская армия"
 HSM_VER_CW_professional_service_desc:0 "Общий офицерский корпус готовит постоянные части и ведёт единые списки назначений."
 HSM_VER_CW_territorial_service:0 "Окружная служба резерва"
 HSM_VER_CW_territorial_service_desc:0 "Резервистов обучают рядом с домом, а общие склады и инструкторы связывают округа в единую систему обороны."
 HSM_VER_CW_accounts_office:0 "Веренская счётная палата"
 HSM_VER_CW_accounts_office_desc:0 "Проверка общих расходов больше не зависит от вежливого согласия того, кто подписал платёж."
 HSM_VER_CW_clinical_training:0 "Общие клинические протоколы"
 HSM_VER_CW_public_works:0 "Общий дорожный план"
 HSM_VER_CW_precision_tools:0 "Палата производственных образцов"
 HSM_VER_CW_technical_training:0 "Вечернее техническое обучение"
 HSM_VER_CW_joint_research:0 "Веренский прикладной институт"
 HSM_VER_CW_reserve_supply:0 "Распределённые склады"
 hsm_ver_cw.1.t:0 "Чья подпись под сметой?"
 hsm_ver_cw.1.d:0 "Первую общую смету принесли в трёх переплётах. Цифры внутри различались. Каждый казначей включил ремонт своей дороги, каждый надеялся, что сосед оплатит мост между ними. Когда писарь положил книги рядом, выяснилось, что мосту обещано меньше, чем двум канцелярским каретам.\n\nПредставители общин требуют общей казны, которая сможет перенаправлять средства между округами. Мастерские возражают: столица получит деньги раньше, чем узнает местные нужды. Они предлагают сеть кредитных товариществ под единым надзором. Ни один порядок не избавит от споров; он лишь определит, где их будут решать."
 hsm_ver_cw.1.a:0 "Общие деньги должны служить общему плану."
 hsm_ver_cw.1.b:0 "Пусть кредит начинается с местной мастерской."
 hsm_ver_cw.2.t:0 "Дело о двух свидетельствах"
 hsm_ver_cw.2.d:0 "Вдова явилась в суд с двумя свидетельствами на один дом. В её родном округе наследство признавали за ней; по старому праву мужа требовалось согласие родственника, который теперь жил за соседней улицей. Прежняя граница проходила как раз по этой улице.\n\nСудьи сумели договориться по этому делу, но канцелярию завалили похожие прошения. Одни предлагают общий гражданский кодекс и единый порядок обжалования. Другие хотят оставить окружные суды, обязав их признавать основные права и решения соседей. Прежде всего придётся признать, что ни один житель не становится чужаком, перейдя мост."
 hsm_ver_cw.2.d.military:0 "В прошении из присоединённого округа нет ни слова о старой династии. Его автор спрашивает, почему налог с него берут как с веренца, а иск против военного поставщика принимают как от чужеземца. Внизу стоят подписи соседей, среди которых есть семьи наших солдат.\n\nПобеда дала правительству власть, но не ответила на этот вопрос. Общий гражданский кодекс подчинит округа одним судам. Защищённое самоуправление оставит местные учреждения, обязав их соблюдать общие права. В обоих случаях придётся отказаться от удобной привычки считать законным всё, что удобно победителю."
 hsm_ver_cw.2.a:0 "Один гражданский закон и общий суд."
 hsm_ver_cw.2.b:0 "Общие права, окружные учреждения."
 hsm_ver_cw.3.t:0 "Без справки о происхождении"
 hsm_ver_cw.3.d:0 "Первой пациенткой новой сельской лечебницы стала прачка, приехавшая с ребёнком из соседнего округа. Она приготовила справку и мелкие монеты за чужеземный приём. Фельдшер велел убрать и то и другое: прежнюю пошлину отменили, а свидетельство о рождении не помогло бы сбить жар.\n\nВечером он записал в отчёте, что перевязочный материал пришёл вовремя, но дорога до дальних деревень всё ещё слишком длинна. В столице эту строку сначала хотели вычеркнуть из праздничной заметки. Врач настоял, чтобы она осталась."
 hsm_ver_cw.3.a:0 "Следующую лечебницу откроют ближе к ним."
 hsm_ver_cw.4.t:0 "Прибор без владельца"
 hsm_ver_cw.4.d:0 "В первой лаборатории института спорили о латунном измерительном приборе. Его оплатил один округ, доставил второй, а исправил ученик из третьей мастерской. На табличке предлагали перечислить всех благотворителей; для названия самого прибора места уже не оставалось.\n\nПрофессор снял табличку и положил рядом журнал опытов. На первой странице он написал имена тех, кто будет отвечать за измерения. Позже табличку вернули, но уже над входом, где она никому не мешала. Общая наука началась не с открытия, а с права пользоваться чужим инструментом."
 hsm_ver_cw.4.a:0 "Пусть спорят о результатах, а не о печатях."
 hsm_ver_cw.5.t:0 "После последнего перекличного списка"
 hsm_ver_cw.5.d:0 "На совместных занятиях инструктор вызвал резервистов по старым полковым спискам. Половина строя повернула не в ту сторону: одинаковые команды означали разные движения. Смешно было только до тех пор, пока обоз не перегородил дорогу санитарной повозке.\n\nШтаб предлагает постоянную армию с единым обучением и назначениями. Окружные представители предпочитают обученный резерв, который не забирает лучших работников из мастерских на весь год. Обе стороны согласны в одном: следующая перекличка должна собирать подразделения одной страны, а не соседей по временному соглашению."
 hsm_ver_cw.5.a:0 "Общий постоянный корпус."
 hsm_ver_cw.5.b:0 "Подготовленный окружной резерв."
 hsm_ver_cw.6.t:0 "Счета после открытия моста"
 hsm_ver_cw.6.d.treasury:0 "При проверке дорожной сметы обнаружились два платежа за один и тот же камень. Подрядчик уверял, что второй счёт относится к доставке; возчик показал собственную, уже оплаченную квитанцию. Чиновник просил не омрачать первое общее строительство судебным разбирательством.\n\nСчётная палата передала дело в суд и напечатала исправленную смету. Общая казна оказалась способна не только собирать средства, но и спрашивать со своих распорядителей. В следующем письме сельский староста приложил жалобу уже без привычного извинения за беспокойство."
 hsm_ver_cw.6.d.districts:0 "Первое кредитное товарищество отчиталось о новой мастерской и исправных платежах. Второе годами кредитовало родственников председателя под залог пустующего амбара. До объединения эти истории остались бы в двух разных книгах. Теперь счета лежали на одном столе.\n\nОбщий надзор потребовал раскрыть поручителей и вернуть средства за несделанную работу. Исправно работавшие товарищества продолжили выдавать ссуды. Самостоятельность округов сохранилась, но удобная привычка называть любой вопрос вмешательством извне закончилась."
 hsm_ver_cw.6.a:0 "Этот отчёт напечатают целиком."
 hsm_ver_cw.7.t:0 "Утро без торжеств"
 hsm_ver_cw.7.d:0 "Старую пограничную будку снесли не сразу. Сначала в ней хранили инструменты дорожников, затем торговец ставил под навесом тележку. Теперь на её месте остановка, и школьники спорят, кто первым займёт скамью.\n\nВ правительстве ещё спорят о расходах и назначениях. Жалобы не исчезли, а строительство не сделало все деревни одинаково богатыми. Но письмо из соседнего города больше не считают иностранным, диплом не приходится подтверждать на каждом мосту, а чиновник не может отправить просителя к несуществующей границе.\n\nВерения пережила не только день своего основания. Она научилась встречать следующий."
 hsm_ver_cw.7.d.three:0 "В общей канцелярии хранят три старые печати. Раньше каждая могла остановить обоз, отменить свидетельство соседа или потребовать нового сбора. Теперь ими заверяют музейную опись. Новую жалобу регистрируют одной печатью, и это кажется гораздо менее торжественным событием, чем провозглашение единства.\n\nВсе три Дома оставили стране и мастерские, и привычки, и старые обиды. Общие учреждения не заставили жителей забыть происхождение. Они сделали так, чтобы происхождение перестало решать, где человеку позволено учиться, лечиться и искать справедливость.\n\nНаутро не будет нового праздника. Откроются школы, мастерские и приёмные. Именно ради этого всё и начиналось."
 hsm_ver_cw.7.a:0 "И всё же это наша страна."

