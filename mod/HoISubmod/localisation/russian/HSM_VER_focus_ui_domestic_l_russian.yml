l_russian:
 HSM_VER_UI_DOM_eligible_tt:0 "Независимый дом не капитулировал и остаётся под властью своего законного герцога."
 HSM_VER_UI_DOM_prepare_tt:0 "При нашем независимом герцоге военный путь открыт: соперник не защищён мирным договором, война домов продолжается или победа закреплена миром."
 HSM_VER_UI_DOM_military_open_tt:0 "Путь дипломатического урегулирования не выбран."
 HSM_VER_UI_DOM_issue_goal_tt:0 "Оба независимых дома в мире; прежней войны домов и защищающего мир договора нет; наш герцог может объявить войну сопернику."
 HSM_VER_UI_DOM_settlement_context_tt:0 "После подтверждённой победы наступил мир; земли домов надёжно удерживаются нами или побеждённым вассалом; прошло 30 дней после войны."
 HSM_VER_UI_DOM_settlement_active_tt:0 "Послевоенная власть учреждена; наш герцог и территориальное урегулирование сохраняют силу после 30-дневного послевоенного периода."
 HSM_VER_UI_DOM_rival_bypass_tt:0 "Война с домом-соперником уже идёт либо его поражение и территориальный мир подтверждены."
 HSM_VER_UI_DOM_claim_avian_tt:0 "Наша герцогская власть законна; независимый нейтральный Авиан владеет родиной; обе стороны в мире; войне не мешают пакт, общий альянс или ожидающий ответа договор."
 HSM_VER_UI_DOM_avian_bypass_tt:0 "Наш признанный поход против Авиана продолжается либо его послевоенное территориальное урегулирование завершено."
 HSM_VER_UI_DOM_accession_context_tt:0 "Земли обоих домов объединены и контролируются; ассоциация с Авианом, мир и совместимость альянсов сохраняются."
 HSM_VER_UI_DOM_accession_ready_tt:0 "Авиан согласен на присоединение; таможенное сближение и 60-дневный переход завершены; ассоциация и контроль объединённых земель сохраняются."
 HSM_VER_UI_DOM_absorbed_tt:0 "Авиан уже вошёл в наше объединённое государство, полностью контролирующее его родину."
 HSM_VER_UI_DOM_not_balanced_tt:0 "Двуязычная учебная программа не принята."
 HSM_VER_UI_DOM_not_aquileian_tt:0 "Аквилейская учебная программа не принята."
 HSM_VER_UI_DOM_not_herzland_tt:0 "Герцландская учебная программа не принята."
 HSM_VER_UI_DOM_balanced_tt:0 "Двуязычная учебная программа принята."
 HSM_VER_UI_DOM_aquileian_tt:0 "Аквилейская учебная программа принята."
 HSM_VER_UI_DOM_herzland_tt:0 "Герцландская учебная программа принята."
 HSM_VER_UI_DOM_civ_space_tt:0 "В принадлежащей нам и полностью контролируемой национальной области есть место для гражданской фабрики, включая закрытые ячейки."
 HSM_VER_UI_DOM_mil_space_tt:0 "В принадлежащей нам и полностью контролируемой национальной области есть место для военного завода, включая закрытые ячейки."
 HSM_VER_UI_DOM_military_route_tt:0 "Выбирает военное объединение и закрывает ветвь дипломатического урегулирования."
 HSM_VER_UI_DOM_eri_intro_tt:0 "Событие: §Y$hsm_ver_eri_force.1.t$§!. До начала урегулирования действуют военные обязательства."
 HSM_VER_UI_DOM_eri_promises_tt:0 "Событие: §Y$hsm_ver_eri_force.2.t$§!. Один бонус §G100%§! к исследованиям логистики."
 HSM_VER_UI_DOM_eri_rosaline_tt:0 "Событие: §Y$hsm_ver_eri_force.3.t$§! о самостоятельном решении Розалины."
 HSM_VER_UI_DOM_goal_eyr_tt:0 "Даёт цель войны на аннексию Эйри, если цели войны ещё нет."
 HSM_VER_UI_DOM_goal_eri_tt:0 "Даёт цель войны на аннексию Эри, если цели войны ещё нет."
 HSM_VER_UI_DOM_eri_terms_tt:0 "Событие: §Y$hsm_ver_eri_force.4.t$§!. Выбор местных прав или прямого правления герцога. Убирает дух соперничества у победителя и его побеждённого вассала."
 HSM_VER_UI_DOM_construction_100_tt:0 "Один бонус §G100%§! к исследованиям строительства."
 HSM_VER_UI_DOM_industry_100_tt:0 "Один бонус §G100%§! к исследованиям промышленности."
 HSM_VER_UI_DOM_eri_petition_tt:0 "Событие: §Y$hsm_ver_eri_force.5.t$§!. Выбор суда по доказательствам или передачи имения военному покровителю."
 HSM_VER_UI_DOM_eri_reconstruction_tt:0 "§Y[401.GetName]§!: §G+1§! ячейка строительства и §G1§! гражданская фабрика. Два бонуса §G75%§! к исследованиям промышленности."
 HSM_VER_UI_DOM_eri_levy_tt:0 "§G+25§! опыта армии. Два бонуса §G100%§! к исследованиям пехотного вооружения."
 HSM_VER_UI_DOM_eri_bound_tt:0 "Заменяет временное правление обязательными хартиями и судом по доказательствам; отменяет пожалование покровителю. Событие: §Y$hsm_ver_eri_force.7.t$§!."
 HSM_VER_UI_DOM_eri_chancery_tt:0 "Заменяет временные комиссии герцогской администрацией; сохраняет решение по имению. Событие: §Y$hsm_ver_eri_force.7.t$§!."
 HSM_VER_UI_DOM_eri_ending_tt:0 "Событие: §Y$hsm_ver_eri_force.8.t$§!, завершение истории урегулирования Винсента."
 HSM_VER_UI_DOM_eyr_intro_tt:0 "Событие: §Y$hsm_ver_eyr_force.1.t$§! о походе Иовинуса и его последствиях."
 HSM_VER_UI_DOM_eyr_liaison_tt:0 "§G+25§! опыта армии. Один бонус §G100%§! к исследованиям электроники."
 HSM_VER_UI_DOM_logistics_2_100_tt:0 "Два бонуса §G100%§! к исследованиям логистики."
 HSM_VER_UI_DOM_eyr_terms_tt:0 "Событие: §Y$hsm_ver_eyr_force.2.t$§!. Выбор гражданской власти или военной опеки. Убирает дух соперничества у победителя и его побеждённого вассала."
 HSM_VER_UI_DOM_eyr_post_tt:0 "Событие: §Y$hsm_ver_eyr_force.3.t$§!. Выбор частной гражданской почты или военного надзора."
 HSM_VER_UI_DOM_eyr_districts_tt:0 "§G+25§! опыта армии. Один бонус §G100%§! к исследованиям технологий обеспечения."
 HSM_VER_UI_DOM_eyr_review_tt:0 "Через §Y120 дней§! выбранного правления событие §Y$hsm_ver_eyr_force.4.t$§! предлагает выбор по гражданскому обучению или военным производственным контрактам."
 HSM_VER_UI_DOM_eyr_trades_tt:0 "Даёт §G1§! гражданскую фабрику и §G1§! ячейку на контролируемой собственной земле с местом; иначе один бонус §G100%§! к промышленности. Также даёт два бонуса §G75%§! к ней."
 HSM_VER_UI_DOM_eyr_staff_tt:0 "Даёт §G1§! военный завод и §G1§! ячейку на контролируемой собственной земле с местом; иначе один бонус §G100%§! к технологиям обеспечения. Также даёт два бонуса §G75%§! к ним."
 HSM_VER_UI_DOM_eyr_inspection_tt:0 "Событие: §Y$hsm_ver_eyr_force.5.t$§! через §Y30 дней§!: отчёт о последствиях выбранной политики."
 HSM_VER_UI_DOM_eyr_ending_tt:0 "Два бонуса §G75%§! к исследованиям строительства. Событие: §Y$hsm_ver_eyr_force.6.t$§!, завершение урегулирования Иовинуса."
 HSM_VER_UI_DOM_avian_goal_tt:0 "Даёт цель войны на аннексию Авиана, если цели ещё нет. Авиан получает событие §Y$hsm_ver_force.10.t$§!."
 HSM_VER_UI_DOM_avian_terms_tt:0 "§Y75 политической власти§! однократно. Выбор местной хартии или герцогской комиссии; вассальный Авиан получает предложение присоединиться и может отказать."
 HSM_VER_UI_DOM_avian_transition_tt:0 "Ратификация начинает §Y90-дневный переход§! с духом «$HSM_VER_FORCE_AVI_transition$». Для интеграции нужен заключительный фокус."
 HSM_VER_UI_DOM_avian_integration_tt:0 "Присоединяет Авиан, включая войска и владения согласившегося вассала. Только §Y[470.GetName]§! становится национальной областью: §G+1 фабрика§!, §G+1 ячейка§!."
 HSM_VER_UI_DOM_avian_spirit_tt:0 "Заменяет переходное бремя хартией или комиссией. Событие §Y«$hsm_ver_force.14.t$»§! через §Y60 дней§!, при отсутствии войны."
 HSM_VER_UI_DOM_avian_routes_tt:0 "Курс Авиана §YIntergigantes§! открывает ассоциацию и присоединение; §Yистинный нейтралитет§! открывает военную претензию."
 HSM_VER_UI_DOM_avian_customs_tt:0 "Однократно стоит §Y75 политической власти§!; даёт один бонус §G100%§! к исследованиям логистики."
 HSM_VER_UI_DOM_avian_accession_tt:0 "Аннексирует согласившегося Авиана с войсками и владениями; только §Y[470.GetName]§! становится национальной областью. Два бонуса §G100%§! к электронике. Событие: §Y$hsm_ver_avr.3.t$§!."
 HSM_VER_UI_DOM_survey_tt:0 "Завершает языковое обследование: §G+25§! политической власти."
 HSM_VER_UI_DOM_literacy_tt:0 "Снижает неграмотность на §G1 уровень§!, если она ещё не устранена."
