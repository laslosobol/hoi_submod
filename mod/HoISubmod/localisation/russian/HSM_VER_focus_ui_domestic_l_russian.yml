 HSM_VER_UI_DOM_education_2_50_tt:0 "Два бонуса §G50%§! к исследованиям электроники или промышленности."
 HSM_VER_UI_DOM_histories_tt:0 "§G+3%§! стабильности и §G+25§! политической власти."
