 HSM_VER_UI_DOM_science_improve_tt:0 "Улучшает научную базу на §G1 уровень§!, вплоть до §Y«$proper_science_base$»§!."
 HSM_VER_UI_DOM_research_slot_tt:0 "Даёт §G1 ячейку исследований§!, если на момент завершения их меньше §Y5§!."
 HSM_VER_UI_DOM_civ_factory_tt:0 "Даёт §G1 гражданскую фабрику§! и §G1 ячейку строительства§! в случайной контролируемой собственной национальной области с местом для фабрики."
 HSM_VER_UI_DOM_mil_factory_tt:0 "Даёт §G1 военный завод§! и §G1 ячейку строительства§! в случайной контролируемой собственной национальной области с местом для завода."
 HSM_VER_UI_DOM_eri_roads_tt:0 "Даёт §G1 инфраструктуру§! в каждой собственной контролируемой национальной области из §Y[401.GetName], [500.GetName], [673.GetName]§!, где её уровень ниже §Y5§!."
