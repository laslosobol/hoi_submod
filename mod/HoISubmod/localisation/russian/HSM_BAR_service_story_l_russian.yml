l_russian:
 hsm_bar_service.1.t:0 "Имена под клятвой"
 hsm_bar_service.1.d:0 "Врач Марта Кшемень, земная пони, принесла имена первых больных с полей, вновь открытых для пахоты. Рядом лежат листы, которые Северин Ольха вынес из лабораторий Пентархии. На нескольких сохранились его собственные исправления. Эти страницы он перевернул.\n\nНовой Службе нужен устав. Ядвига Врона требует, чтобы за каждым приказом стояло имя. Она помнит открытые во время восстания камеры и узников, которые не могли назвать ни одного из своих надзирателей. Ольха спрашивает, что случится, если список попадёт не к тому читателю.\n\nВсе согласны, что кабинет его не получит. Должен ли он вообще существовать, решить труднее. Наверху Марта выводит полное название: Служба сдерживания и сохранения. Место для подписей пока пусто."
 hsm_bar_service.1.a:0 "Сохранить имена в запечатанном подлиннике."
 hsm_bar_service.1.b:0 "Записывать разрешения только под шифрами."
 hsm_bar_service.2.t:0 "Три удара под полом"
 hsm_bar_service.2.d:0 "Деревенский плотник пишет о трёх ударах под кроватью дочери. Он поднял доски: внизу только утрамбованная земля. Девочка теперь спит на кухне, и стук переместился туда. Мать узнала промежутки между ударами. Так стучал её пропавший брат, когда возвращался поздно.\n\nПервое письмо плотника осталось без ответа. На второе прислали совет осушить фундамент. У Марты третье, с горстью земли, завёрнутой в ткань. Земля выглядит совершенно обыкновенно. Врачебная сумка уже собрана.\n\nОльха просит дождаться сообщения из другого дома. Врона готова ехать вместе с Мартой, но на время поездки придётся найти ей замену в ближайшем медпункте."
 hsm_bar_service.2.a:0 "Обеспечить замену в медпункте. Ехать к семье."
 hsm_bar_service.2.b:0 "Поддерживать связь; дождаться другого свидетеля."
 hsm_bar_service.3.t:0 "Лишний зуб"
 hsm_bar_service.3.d:0 "Из заброшенной операционной вынесли две запечатанные пробирки. Врона видела по одному зубу в каждой. На столе для осмотра их оказалось три, а воск на обеих пробках выглядел нетронутым.\n\nПомощник, нёсший пробирки, помнит, что заходил умыться. Ольха помнит, что оставил его одного. Ни тот ни другой не может сказать, был ли лишний зуб на столе до вскрытия. Первые измерения, сделанные в спешке, уже могут относиться к разным образцам.\n\nМарта откладывает инструменты. Прежде чем делать выводы, она требует восстановить весь путь и опросить каждого отдельно. Ольха боится упустить единственную возможность сравнения. Он предлагает продолжить под временным номером, отмечая расхождение при каждом результате."
 hsm_bar_service.3.a:0 "Приостановить измерения. Восстановить ход событий."
 hsm_bar_service.3.b:0 "Продолжить под временным обозначением."
 hsm_bar_service.4.t:0 "Последний спуск"
 hsm_bar_service.4.d:0 "Лестница обрушилась во время второго спуска Вроны. Носильщик провалился сквозь площадку; грифоница вцепилась когтями в его страховочную сбрую, но падающий ящик прижал ему ногу к стене. Внизу лампа ещё освещала запечатанную нишу, ради которой они пришли.\n\nВрона перерезала ремень ящика. К тому времени, когда группа выбралась, проход завалило. Носильщик жив. Материал остался внизу.\n\nОльха третью ночь восстанавливает утраченные измерения. Он не обвиняет Врону в трусости. Он спрашивает, вправе ли любой руководитель группы отказаться от изъятия, даже если промедление сделает его невозможным. Марта отвечает, меняя повязку на сломанной ноге: нужны запасное снаряжение и приказ об отходе, который лаборатория не сможет отменить."
 hsm_bar_service.4.a:0 "Дать руководителям групп право и средства для отхода."
 hsm_bar_service.4.b:0 "Изъятие остаётся приоритетом, несмотря на риск."
 hsm_bar_service.5.t:0 "Почерк на полях"
 hsm_bar_service.5.d:0 "На странице из тетрадей Пентархии изображён тот же прибор, что и на следующей, но свинцовый экран перенесён наружу, за кабину наблюдателя. Опубликованный результат стал лучше. В заметках под ним упоминаются головные боли, затем бессонница, затем ничего.\n\nОльха узнаёт переделку раньше, чем Марта успевает спросить. Единорог касается бледного шрама под рогом. Он был помощником, предложившим её. Ему казалось, что экран искажает показания.\n\nПоследняя страница прилипла к обложке. Врона отделяет её над паром. Под приказом повторить опыт кто-то написал на полях: «Показание верно. Толкование ошибочно». Имя наблюдателя выскоблено.\n\nОльха просит оставить тетрадь целой."
 hsm_bar_service.5.a:0 "Хранить неудачные опыты вместе с рабочими чертежами."
 hsm_bar_service.6.t:0 "Комната на чертеже"
 hsm_bar_service.6.d:0 "Первая камера готова. Двери плотно закрываются, вентиляция тянет наружу, наблюдатель может дотянуться до сигнала тревоги, не подходя к внутренней стене. Внутри ничего нет.\n\nПри последнем осмотре Марта замечает на чертеже из хранилищ Пентархии вторую дверь. Строители её не поставили: за ней сплошная порода. Ольха находит подпись под наклеенным исправлением. «Обратный проход. См. приложение: ИЗЪЯТО».\n\nВрона предлагает сначала испытать помещение, оставив приборы снаружи. Начальник участка возражает: пустая камера уже требует персонала и электричества. Марта передаёт ему старый чертёж. Больше он не спрашивает, когда её заполнят."
 hsm_bar_service.6.a:0 "Не помещать ничего внутрь, пока не установлены пределы защиты."
 hsm_bar_service.7.t:0 "За что платит Республика"
 hsm_bar_service.7.d:0 "Михал Завиша запросил у провинциальных лечебниц перечень лекарств, которых им не хватает. До зимы он хочет наладить общие закупки. Марта помогала составлять запрос; теперь жалеет, что не спросила, где будут сравнивать ответы.\n\nИзоляторам Службы нужно то же редкое успокоительное, что и трём обычным больницам. Заказы всё ещё проходят через эти больницы под именами пациентов, которые никогда не занимали их коек. Добросовестному служащему достаточно принести Завише три списка.\n\nОтдельный поставщик избавит изоляторы от этой зависимости. Его заказы больше не будут связаны со списками больничных пациентов. Ольха предлагает сохранить общие закупки, поставив между именами ещё одного посредника."
 hsm_bar_service.7.a:0 "Организовать отдельное снабжение изоляторов."
 hsm_bar_service.7.b:0 "Сохранить общие закупки через посредника."
 hsm_bar_service.8.t:0 "Один вопрос незнакомцу"
 hsm_bar_service.8.d:0 "На столе два рисунка защитного круга. Первый найден в заброшенной баррадской лечебнице. Второй скопирован из зарубежного медицинского журнала. Разрыв оставлен в одном и том же месте, хотя авторы объясняют его по-разному.\n\nОльха хочет расспросить иностранного исследователя. Марта напоминает, что его рисунок, возможно, годами спасал пациентов. Не будет ни внезапного обыска, ни попытки купить подлинник через перепуганного помощника.\n\nПосредник спросит о разрыве и предложит взамен баррадские измерения. В сопроводительной записке нет ни адреса лаборатории, ни названия Службы. Зато перечислены повреждения, наблюдавшиеся при замыкании круга."
 hsm_bar_service.8.a:0 "Спросить о разрыве. Передать необходимое предупреждение."
 hsm_bar_service.9.t:0 "Аудиенция, которой не просили"
 hsm_bar_service.9.d:0 "Врона дважды читает задание. Его фигурант занимает престол, но приложенный план словно составлен для выноса образца из пустого дома. Есть путь внутрь, путь наружу и ни слова о том, что случится с теми, кто окажется между ними.\n\nОльха написал поперёк плана: «Осмотр невозможен». Марта просит объяснить. Он имеет в виду, что свидетельства описывают власть над страной, но не показывают, что посетитель сможет потрогать, измерить или безопасно унести.\n\nВрона закрывает командировочное предписание. Начинать придётся со свидетелей и возможности законного обращения, сколько бы времени это ни заняло. Фигурант остаётся в деле. Приказа о задержании там больше нет."
 hsm_bar_service.9.a:0 "Вместо плана захвата установить возможность доступа."
 hsm_bar_service.10.t:0 "Пропущенная седьмая минута"
 hsm_bar_service.10.d:0 "В экземпляре для иностранной лаборатории описан устойчивый отклик в течение шести минут. Марта помнит седьмую. Сигнальный звонок не прозвучал; все за стеклом повернулись к стене, на которой ничего не двигалось. Ольха до сих пор не может объяснить следующие тридцать секунд.\n\nВ исходящей копии этот промежуток стал чёрным прямоугольником. Адрес лаборатории остался под ним. Кто-то тщательнее оберегал репутацию исследования, чем его сотрудников.\n\nМарта диктует замену: «Не продлевать воздействие сверх указанного предела. Отход должен инициировать наблюдатель вне камеры». Место опыта и имена свидетелей останутся в запечатанном подлиннике."
 hsm_bar_service.10.a:0 "Восстановить предупреждение. Скрыть имена свидетелей."
 hsm_bar_service.11.t:0 "Могила без имени"
 hsm_bar_service.11.d:0 "В пакете снимок разрушенного двора и сообщение о гибели его прежнего хозяина. Карандашная стрелка указывает на светлое пятно у ступеней. Один корреспондент называет его телом, другой обломком статуи. Ни один не делал снимка.\n\nВрона откладывает увеличительное стекло. Под стрелкой изображение подправлено. Ольха всё равно просит сохранить его: у нетронутого края виден знак, упомянутый в более раннем свидетельстве. Номер того дела закрыт для общего доступа.\n\nПрежде чем посылать кого-либо, нужны фотограф, неисправленный негатив и свидетель, который видел, что осталось во дворе. Марта отказывается освобождать стол в прозекторской."
 hsm_bar_service.11.a:0 "Установить происхождение сведений до разрешения на изъятие."
 hsm_bar_service.12.t:0 "Вода для верхней улицы"
 hsm_bar_service.12.d:0 "Насос в мастерской выдержал испытание: крепления не разболтались. Переделка Ольхи невелика: другая опора и способ заметить вибрацию прежде, чем она дойдёт до корпуса. Измерения взяты из расследования, остальные страницы которого никогда не покинут архив.\n\nМарта приносит план села над старым каналом. На верхнюю улицу всё ещё носят воду в вёдрах: насос там ломается каждые несколько недель. Мастерская готова разослать чертежи сейчас. Другой инженер просит повторить опыт на изношенной машине, похожей на ту, что действительно стоит в селе.\n\nВрона видела этот подъём. Она спрашивает, сколько ещё ему ждать."
 hsm_bar_service.12.a:0 "Передать проверенные чертежи деревенским мастерским."
 hsm_bar_service.12.b:0 "Сначала повторить испытание в независимой мастерской."
 hsm_bar_service.13.t:0 "Возвращение носильщика"
 hsm_bar_service.13.d:0 "Носильщик с обрушившейся лестницы вернулся за снаряжением. Прежде чем выписать его, Марта заставляет пройти через всю комнату. Он бережёт сросшуюся ногу, хотя уверяет, что ей уже ничего не делается.\n\nВрона сохранила обрезок сбруи, который перерезала под землёй. Он просит показать его, ощупывает разрез и оставляет на столе. Затем просит прочитать приказ, по которому пройдёт следующий спуск. Никто из них не упоминает ящик, оставшийся в завале.\n\nПеред их уходом Марта прикладывает копию приказа к истории болезни."
 hsm_bar_service.13.a:0 "Сохранить приказ рядом с историей лечения."
 hsm_bar_service.14.t:0 "Три пациента министра"
 hsm_bar_service.14.d:0 "Завиша нашёл трёх пациентов с одинаковыми назначениями, поступивших в разные больницы в один день. Больницы не подтверждают, что лечили их. Он подозревает, что лекарства для провинциальных палат перепродают на сторону.\n\nМарта получает запрос с личной запиской: он доверяет ей и просит сказать прямо, если созданная им служба закупок дала сбой. Она узнаёт три вымышленных имени. Под ними настоящие дозировки для изоляторов Службы.\n\nМожно сверить больничные записи и перевести изоляторы на отдельное финансирование. Ольха предлагает быстрее сменить закупщика. Лекарства продолжат поступать, но вопрос Завиши останется без ответа."
 hsm_bar_service.14.a:0 "Сверить записи и отделить снабжение изоляторов."
 hsm_bar_service.14.b:0 "Сменить закупщика; оставить запрос без ответа."
 hsm_bar_service.15.t:0 "Насос на рассвете"
 hsm_bar_service.15.d:0 "Независимая мастерская вернула чертежи с поправкой. Ольха оставил слишком маленький зазор у изношенного подшипника. Второй инженер исправил его, гонял насос до утра и пригласил сельского механика посмотреть, как тот запустится снова.\n\nМарта идёт на верхнюю улицу без врачебной сумки. Новое крепление уже стоит. У водоразборной колонки кобыла говорит ей, что сначала приходится немного подождать, пока вода станет чистой, но теперь она хотя бы доходит. Кто сделал первые измерения, она не знает.\n\nПо дороге домой Марта покупает чистую тетрадь. На первой странице будут места, где установили переделку, а не адреса очередных больных."
 hsm_bar_service.15.a:0 "Разослать исправленные чертежи."
 hsm_bar_service.20.t:0 "Эквус: незамкнутый круг"
 hsm_bar_service.20.d:0 "Первая эквусская резидентура снимает комнаты над врачебным кабинетом. Медицинский корреспондент прислал оттиск старой защитной надписи. Владелец дома считает её украшением; пожилая целительница не позволила строителям вынуть камень.\n\nМарта узнаёт разрыв круга из баррадской тетради. На обороте корреспондент написал: «Она говорила о надписи, пока я не спросил, к чему та обращена. Тогда она спросила, кто меня послал».\n\nЦелительница готова принять одного посетителя без приборов. Врона велит согласиться на условия. Ольха просит также заметить, в какую комнату старая пони отказывается заходить."
 hsm_bar_service.20.a:0 "Послать того, кто сначала выслушает."
 hsm_bar_service.21.t:0 "Земли Грифонов: вычеркнутое поступление"
 hsm_bar_service.21.d:0 "В музейном каталоге, приобретённом грифонской резидентурой, есть портрет прежнего хранителя. За ним стоит шкаф, отсутствующий на всех планах залов. Часть списка поступлений под фотографией заклеена узкой полоской.\n\nБиблиотекарь помнит, что шкаф перенесли после жалоб ночных сторожей. Она может назвать столяра, но не даст адрес, пока ей не пообещают прийти днём.\n\nВрона кладёт каталог рядом с копией покупок Пентархии. Описания слишком расплывчаты для уверенного совпадения. Зато в обоих встречается клеймо одного продавца. Местному сотруднику разрешают поговорить со столяром, но не проникать в музей после закрытия."
 hsm_bar_service.21.a:0 "Начать с рассказа столяра."
 hsm_bar_service.22.t:0 "Север: свет над водой"
 hsm_bar_service.22.d:0 "Первый доклад начальницы северной резидентуры Ирмы Кальк пришёл с картой, нарисованной рыбаком. На ней отмечен свет, три ночи подряд появлявшийся на другом берегу. Каждое утро берег оказывался пуст. Другой свидетель называет часовню, которую, по словам рыбака, снесли ещё до его рождения.\n\nКальк сняла комнату с видом на тот берег. Она просит тёплую одежду и полный текст приложения к старому баррадскому свидетельству о свете под запечатанной дверью. На приложении прежний лабораторный номер Ольхи.\n\nОн разрешает выдать копию без двух фрагментов. Кальк подтверждает получение, затем спрашивает, почему пропуски в точности соответствуют длине описания свидетеля."
 hsm_bar_service.22.a:0 "Оставить Кальк на берегу. Сохранить её вопросы."
 hsm_bar_service.23.t:0 "Речные земли: против течения"
 hsm_bar_service.23.d:0 "Изыскатель, работающий с речной резидентурой, отметил излучину, где лодочники перестают доверять компасам. Объяснения разнятся. Один не возит мимо неё железо, другой никогда не замечал ничего необычного. Изыскатель просит разрешения провести измерения с обоих берегов.\n\nПредварительный рисунок интересует Ольху больше рассказов. Отклонение может вызывать порода под руслом. Похожее искажение сделало ненадёжными несколько баррадских съёмок: восстановительные бригады боятся пересекать собственные межевые отметки.\n\nМарта просит взять вторую стрелку и записывать погоду. На полях она добавляет практический вопрос: не берёт ли кто-нибудь с лодочников плату за безопасный проход?"
 hsm_bar_service.23.a:0 "Обследовать оба берега вторым прибором."
 hsm_bar_service.24.t:0 "Зебрика: свидетель оказался песней"
 hsm_bar_service.24.d:0 "Первое интервью зебриканской резидентуры касается места, где, по словам переводчика, поколениями принимают одного и того же путника. На вопрос об имени рассказчица поёт куплет. Когда её спрашивают, когда путник приходил в последний раз, она повторяет его с другим окончанием.\n\nИнтервьюер трижды подчеркнул слова «одного и того же». Переводчик зачёркивает подчёркивание. Речь может идти о личности, наследуемой обязанности или роли, которую каждый гость получает на церемонии. Никто из присутствующих не указывает ни на могилу, ни на дом.\n\nВрона возвращает черновик без предложенного заголовка. Резидентуре поручено узнать, кто научил рассказчицу куплету, и попросить разрешения услышать его снова в положенном месте. Первую запись запечатывают вместе с переводом."
 hsm_bar_service.24.a:0 "Сохранить запись. Добиться второй беседы."
 HSM_BAR_archive_open_tt:0 "Открывает местное бюро дел и закрытый архив. Слухи, полевые расследования и завершённые исследования остаются разными этапами."
 HSM_BAR_courier_chain_tt:0 "Разрешает расследование цепочки курьеров и перенаправление конвоя. Заговор будет раскрыт только после операций и отчётов."
 HSM_BAR_research_not_discovery_tt:0 "Разрешает лабораторию подавления, но не даёт знаний или готового проекта. Требуются указанные исследования аномалий и последующий научный проект."
 HSM_BAR_careful_retrieval:0 "Право вернуться"
 HSM_BAR_careful_retrieval_desc:0 "Группы Вроны берут запасную верёвку и оставляют резерв на поверхности. Руководитель вправе прервать изъятие, не убеждая сначала лабораторию в реальности опасности."
 HSM_BAR_expedited_retrieval:0 "Изъятие любой ценой"
 HSM_BAR_expedited_retrieval_desc:0 "Лаборатории быстрее получают материал. В лечебнице Марта ведёт второй список: тех, кого снова отправили вниз раньше, чем она разрешила бы."
 HSM_BAR_applied_findings:0 "Знания возвращаются в сёла"
 HSM_BAR_applied_findings_desc:0 "Происхождение измерений остаётся под грифом. Исправленные чертежи открыты: сельские механики поддерживают с их помощью насосы и изношенные машины."
 HSM_BAR_replicate_bulletin:0 "Повторить испытание насоса"
 HSM_BAR_replicate_bulletin_desc:0 "У деревенской машины изношены подшипники и залатан корпус. Независимая мастерская повторит опыт Ольхи в условиях, для которых действительно нужны чертежи. Марта хочет, чтобы при запуске присутствовал сельский механик."
 HSM_BAR_review_retrieval_order:0 "Пересмотреть приказ об изъятии"
 HSM_BAR_review_retrieval_order_desc:0 "Марта приложила ограничения по здоровью носильщика к действующему приказу. Врона предлагает резервные группы и право на отход. До следующего спуска руководителей нужно подготовить к работе по новым правилам."
 HSM_BAR_returned_findings:0 "Полезные проверенные выводы переданы через гражданских подрядчиков"
 HSM_BAR_replication_pending:0 "Независимое повторение ожидает финансирования"
 HSM_BAR_selective_suppression:0 "Испытательная площадка физически изолирована"
 HSM_BAR_extended_test:0 "Для испытания выбрана соединённая галерея"
 HSM_BAR_secure_storage:0 "Защищённые помещения готовы; магическое удержание ещё требует исследований"
 HSM_BAR_project_containment_done:0 "Научный проект удержания завершён"
 HSM_BAR_project_suppression_done:0 "Научный проект установки подавления завершён"
 hsm_bar_service.13.d_careful:0 "Носильщик с обрушившейся лестницы входит в снаряжальню без костылей. Врона показывает новую сбрую, запасную верёвку и сигнал, которым любой участник группы может потребовать остановки. Он дважды проверяет застёжку.\n\nОн спрашивает, что будет, если лаборатория прикажет продолжать. Врона раскрывает приказ об отходе на странице со своей подписью. Возвращение не обязывает его снова спускаться: для него есть место на поверхности. Он выбирает его.\n\nМарта смотрит, как он выносит во двор лёгкий ящик. Хромота ещё заметна. В истории болезни она отмечает: в следующей группе будет второй носильщик."
 hsm_bar_service.13.d_priority:0 "Носильщик с обрушившейся лестницы вернулся раньше, чем хотелось бы Марте. Следующее изъятие уже назначено, и его имя стоит в составе группы. Он читает требование поднять материал на поверхность до отхода. Потом перечитывает.\n\nВрона говорит, что займёт его место у ящика. Он замечает, что, если лестница снова рухнет, кому-то всё равно придётся нести раненых. Дополнительного носильщика у неё нет.\n\nМарта разрешает ему только лёгкую работу и прикладывает ограничение к приказу. Ольхе приносят оба листа. Старый ящик всё ещё лежит под завалом; впервые он спрашивает, чего будет стоить пересмотр действующего порядка."
