 HSM_BAR_archive_copy_1:0 "Выданная копия"
 HSM_BAR_archive_copy_2:0 "Закрытая копия"
 HSM_BAR_archive_copy_3:0 "Особая папка"
 HSM_BAR_archive_copy_1_tt:0 "S.C.P. / ОБЩАЯ РАССЫЛКА\nВыездные группы; хозяйственные части. Сокращённый текст. Приложения по отдельной описи."
 HSM_BAR_archive_copy_2_tt:0 "S.C.P. / ЗАКРЫТАЯ РАССЫЛКА\nСледственная группа; врачебная часть. Исправленные фрагменты и пометки на полях сохранены."
 HSM_BAR_archive_copy_3_tt:0 "S.C.P. / ОТДЕЛЬНОЕ ХРАНЕНИЕ\nПодписавшие документ; хранители закрытых приложений. Пропуски в нумерации листов. Неполный комплект."
 HSM_BAR_archive_rock_intake_restricted:0 "ПОКАЗАНИЕ 6 / врачебный дубликат\n«Смещение поверхности» в выездной выписке заменяет слова каменщика о том, что стена подалась, а затем затянула след зубила. Марта Кшемень восстановила здесь эту последовательность. Обломка он не принёс, за инструментами возвращаться отказался.\nИмя: £HSM_BAR_redact_long£. Передняя нога и молоток были обёрнуты одинаковой тканью. Место внутри храма: £HSM_BAR_redact_short£.\nОн спросил, заставит ли Республика закончить раскопки. В записи беседы нет ни ответа стены, ни заверения Республики, что ему не придётся вернуться к оставленным инструментам."
 HSM_BAR_archive_rock_intake_sealed:0 "ПОДЛИННИК БЕСЕДЫ / при листах исправлений\nВ рассылке отказ каменщика сокращён до «перерыва в раскопках». Полная запись помещает его после рассказа о затянувшемся следе зубила под храмом Асинти. Инструменты остались там. Обломка при показании нет.\nМарта закрыла имя £HSM_BAR_redact_long£ по просьбе свидетеля; опознавательные подробности остаются под £HSM_BAR_redact_short£.\n£HSM_BAR_redact_cut£ §gАдресный лист отсутствует в этом дубликате.§!\nПередняя нога и оставленный молоток были обёрнуты одинаковой тканью. Марта оставила вопрос о возвращении внизу показания. На месте ответа комиссии пусто. В записи остался отказ идти за инструментами."
 HSM_BAR_archive_rock_field_restricted:0 "ВРОНА / дубликат размеченного плана\nХозяйственная «местная осадка» опускает существенное различие: нажим у одной отметки вызвал движение под соседней. Группа собрала крупинки из старого скола, не открывая прохода. Отметки необходимо сохранять при переписывании. Ссылка на обмер: £HSM_BAR_redact_short£.\nОльха узнал знак на каменщиковой копии храмового плана и зачеркнул его перед возвратом листа.\n£HSM_BAR_redact_cut£ §gУзнанный знак скрыт; оригинал хранится отдельно.§!\nПометка Вроны при исправлении: «Вернуть объяснение вместе с планом». В конверте лежит перечёркнутый лист. Сопроводительного ответа Ольхи нет; на размеченном обмере по-прежнему стоят обе отметки, касания и движения."
 HSM_BAR_archive_rock_field_sealed:0 "КОНВЕРТ С ПЛАНОМ / исправление Ольхи\nПод чертой Ольхи находится знак £HSM_BAR_redact_long£. Рассылочный чертёж его скрывает. В хозяйственной выписке стоит «местная осадка»; на размеченном плане: касание у одной отметки, движение под соседней.\nНомер образца: £HSM_BAR_redact_short£. Крупинки взяты из старого скола; нового отверстия не делали.\n£HSM_BAR_redact_cut£ §gФрагмент плана отсутствует в этом дубликате.§!\nОльха вернул план с зачёркнутым знаком. На конверте осталось «ОТДЕЛЬНЫЙ ДОПУСК». Полевой лист Вроны заканчивается крупинками из старого скола; запрошенного при исправлении объяснения в конверте нет. Обе отметки обмера сохранены."
 HSM_BAR_archive_rock_study_restricted:0 "СЕВЕРИН ОЛЬХА / лабораторный дубликат\nХозяйственное «затруднение при обращении» означает, что отделённые крупинки сохраняют реакцию на давление вне храма. Запечатанный контрольный образец неподвижен. Поэтому расстояние от святилища нельзя внести в перечень защитных мер. Записанное давление: £HSM_BAR_redact_short£.\nОпора Кшемень остаётся предложением до проверки предела на втором образце. Сравнительная запись спрашивает о сходстве с БР-002.\n£HSM_BAR_redact_cut£ §gРабочий лист сравнения хранится отдельно.§!\nИз хозяйственной копии вместе со ссылкой исчез вопросительный знак. Если ссылку вернут при следующем переписывании, знак следует вернуть на прежнее место вместе с ней."
 HSM_BAR_archive_rock_study_sealed:0 "ЛАБОРАТОРНЫЙ ОРИГИНАЛ / просьба об опоре\nКшемень нужна опора для деревенского колодца. Уцелевшие измерения Ольхи, £HSM_BAR_redact_short£, описывают подвижные крупинки вне храма и неподвижный запечатанный контроль. Требование второго образца остаётся в силе.\nРассылочная сводка скрывает сравнение с БР-002. Здесь сохранён вопросительный знак: сходство не стало общим происхождением.\n£HSM_BAR_redact_cut£ §gСравнительного листа в этом комплекте нет.§!\nАдрес колодца: £HSM_BAR_redact_long£. Просьба Кшемень об опоре осталась рядом с таблицей давления. Поперёк строки для подписи Ольха написал: «Второй образец». Место повторного измерения всё ещё пустует."
 HSM_BAR_archive_entity_intake_restricted:0 "ЛИСТ СВИДЕТЕЛЬНИЦЫ / медицинский дубликат\n«Затруднение при подсчёте» принадлежит писарю рассылки. Свидетельница сказала, что внизу говорил не один; числа она не назвала. После повторного вопроса написала одно слово буквами разной величины и отказалась произнести его вслух.\nСлово: £HSM_BAR_redact_short£. Имя: £HSM_BAR_redact_long£. Толкование переводчика приложено отдельно, рядом с листом, написанным рукой свидетельницы.\nМарта Кшемень написала «только с её согласия» рядом с просьбой о новой беседе. Строка религиозного наименования оставлена пустой."
 HSM_BAR_archive_entity_intake_sealed:0 "ЗАПЕЧАТАННОЕ ПОКАЗАНИЕ / почерк сохранён\nПовторённое слово, £HSM_BAR_redact_short£, занимает чистый лист, который попросила свидетельница. Размер букв меняется; ключа к этим переменам в записи нет. Она сказала «не один», что в рассылке смягчено до затруднения при подсчёте.\nТолкование переводчика остаётся под £HSM_BAR_redact_long£. Место религиозного имени в заголовке оставлено пустым.\n£HSM_BAR_redact_cut£ §gОпознавательные подробности беседы изъяты.§!\nМарта оставила в показании отказ читать вслух. У строки следующей беседы: «Только с её согласия». Лист свидетельницы лежит сложенным внутри; приложение переводчика значится в описи, но его текст закрыт."
 HSM_BAR_archive_entity_field_restricted:0 "ЖУРНАЛ КОНТАКТА / дубликат постов\nУход не был плановым. Это выражение внесено в рассылочную выписку там, где журнал записывает приказ Ольхи отвести обе группы после перемены ответа на третий сигнал. Прежние ответы в письменных записях разных постов совпадали. Содержание сигнала: £HSM_BAR_redact_long£.\nСтенограмма Пентархии обрывается сходным образом. Пометка продавила два следующих листа; её содержание скрыто под £HSM_BAR_redact_short£.\n£HSM_BAR_redact_cut£ §gСтенограмма ответа хранится вне этой копии.§!\nНа сравнительном листе Вроны стоит ссылка БР-015. Два журнала постов хранятся раздельно; оба обрываются на приказе отойти. У приложения с ответом собственный номер, ещё различимый под отметкой об изъятии."
 HSM_BAR_archive_entity_field_sealed:0 "ПАПКА СРАВНЕНИЙ / прерванный контакт\nПентархическое «не один» исключено из рассылки. Слова продавили два следующих листа; там они сохранились без чернил. Та же выписка называет последующий отход плановым. Письменные журналы постов помещают приказ Ольхи после третьего сигнала, £HSM_BAR_redact_long£, изменившего общий ответ.\nОбозначения постов: £HSM_BAR_redact_short£.\n£HSM_BAR_redact_cut£ §gТекст ответа отсутствует в закрытом дубликате.§!\nВрона оставила старые листы рядом с двумя журналами постов. Вдавленные строки продолжаются на втором листе, где чернил уже нет. Приложение с ответом отсутствует; его номер остался между сравнением и приказом отойти."
 HSM_BAR_archive_entity_study_restricted:0 "ПОРЯДОК КОНТАКТА / медицинская копия\nСводка о снабжении опускает возражение Ольхи: один голос не может дать согласие за целое. Ответ отличается от постоянной задержки в контрольном опыте с вентиляцией; его можно отделить от вернувшегося звука. Личности всех отвечающих остаются неустановленными. Слушатель: £HSM_BAR_redact_short£.\nКшемень сохранила исключённый вопрос под £HSM_BAR_redact_long£, поскольку он испугал слушателя. Обстоятельства приложены для врачебного разбора.\nОтбор энергии не разрешён. Решение Ольхи заканчивается вопросом о согласии. Следующей строкой идёт медицинская ссылка Кшемень; приложение к ней хранится под другой печатью, отдельно от сводки о снабжении."
 HSM_BAR_archive_entity_study_sealed:0 "ОЛЬХА / полное решение, неполные приложения\nМы распознаём ответ, не зная всех участников. В контрольном опыте с вентиляцией звук возвращается с постоянной задержкой. Здесь мы получили ответ, но не смогли различить всех отвечавших. Сводка о снабжении заменяет эти строки словами «непригодное соглашение».\nСлушатель: £HSM_BAR_redact_long£; исключённый вопрос остаётся под £HSM_BAR_redact_short£.\n£HSM_BAR_redact_cut£ §gМедицинская стенограмма оставлена в другой папке.§!\nПометка Марты: «Нам нужно знать, что испугало слушателя». Ниже Ольха оставил решение целиком: «Обещание одного голоса не считать согласием целого». Разрешение на отбор энергии осталось без подписи."
 HSM_BAR_archive_reactor_intake_restricted:0 "ИНЖЕНЕРНАЯ ОБЛОЖКА / дубликат Ольхи\nФраза, скрытая под «прежним состоянием площадки», гласит: «Здесь уже что-то было». Она стоит рядом с первой таблицей нагрузки. У камеры есть имя, £HSM_BAR_redact_short£; машина названа только установкой.\nСтроительные бумаги необходимо отделить от записей контакта. Другая печать: £HSM_BAR_redact_long£. Ссылка ведёт к приложению о контакте.\nСтроительное дело заканчивается здесь без акта завершения. Запрос Ольхи о бумагах контакта остался внутри. У фразы рядом с таблицей нагрузки нет соответствующей строки в графике строительства; отдельное приложение в комплект не вложено."
 HSM_BAR_archive_reactor_intake_sealed:0 "НАЙДЕННАЯ ОБЛОЖКА / пометка сохранена\nК фразе «Здесь уже что-то было» нет подписанного объяснения. Выездная выписка скрывает её под прежним состоянием площадки. Дубликат сохраняет слова рядом с первой таблицей нагрузки, но имя автора остаётся под £HSM_BAR_redact_long£.\nНазвание камеры: £HSM_BAR_redact_short£.\n£HSM_BAR_redact_cut£ §gСсылка на отдельно запечатанные записи контакта изъята.§!\nВ сопроводительном запросе Ольхи СТРОИТЕЛЬСТВО отделено от КОНТАКТА. Акта осмотра при обложке нет. Таблица нагрузки сохранилась; отдельно запечатанные бумаги в комплект не попали. Рядом с фразой на полях место объяснения пустует."
 HSM_BAR_archive_reactor_field_restricted:0 "ЯДВИГА ВРОНА / дубликат осмотра\nУстановка присутствовала на площадке. Обвод, пропущенный в чистовой схеме охлаждения, отмечен без поворота вентилей. В ремонтной выписке пропуск назван «расхождением чертежей». Ссылка на вентили: £HSM_BAR_redact_short£.\nСтарая запись велит рабочим уйти до перемены нагрузки. Промежуток эвакуации сохранён под £HSM_BAR_redact_long£; причины нет. Список смены остаётся под £HSM_BAR_redact_short£.\nОтметки осмотра Вроны идут вдоль обвода, пропущенного в чистовом чертеже. Ниже переписано распоряжение об эвакуации. Указанный в нём промежуток сохранился тщательнее объяснения, которое должно было стоять перед ним."
 HSM_BAR_archive_reactor_field_sealed:0 "СРАВНЕНИЕ ЧЕРТЕЖЕЙ / размеченный оригинал\nОбвод отсутствует в чистовой копии, имеется на найденной схеме охлаждения и отмечен группой осмотра. Врона не записала ни одного поворота вентилей. Их обозначения остаются под £HSM_BAR_redact_long£.\nРаспоряжение об обслуживании сохраняет промежуток эвакуации, £HSM_BAR_redact_short£, перед переменой нагрузки. Уцелевшего объяснения нет.\n£HSM_BAR_redact_cut£ §gИмена дежуривших изъяты из дубликата.§!\n«Расхождение чертежей» стоит только в рассылочной выписке. На размеченной схеме Вроны обвод сохранён. Промежуток эвакуации остался рядом с пропуском на месте причины. Повторного пуска в журнале осмотра нет."
 HSM_BAR_archive_reactor_study_restricted:0 "ТАБЛИЦА ОСТАНОВКИ / инженерный дубликат\nРассылочный «временной резерв» скрывает опасную последовательность: отвод тепла нарушается раньше, чем сдаёт отмеченная граница удержания. Ожидание сигнала с границы оставляет слишком малый запас. Пересмотренные настройки остановки Ольхи: £HSM_BAR_redact_long£.\nКшемень настаивает на сохранении прежнего распоряжения об эвакуации при таблице. Оно показывает, что кто-то действовал до перемены нагрузки, хотя объяснения нет. Автор: £HSM_BAR_redact_short£.\nСтарое распоряжение и новая таблица скреплены вместе. Пометка Кшемень: «Оставить запись об эвакуации рядом». Первое требует выхода до перемены нагрузки; вторая ставит остановку раньше сигнала с границы."
 HSM_BAR_archive_reactor_study_sealed:0 "РАЗБОР ОСТАНОВКИ / возражение сохранено\nСохранённая записка Кшемень: «Составитель распоряжения об эвакуации понимал хотя бы одну опасность, скрытую окончательным проектом». Слово «скрытую» подчёркнуто. Имя: £HSM_BAR_redact_short£.\nОтвод тепла нарушается раньше границы удержания. Таблица Ольхи отвечает на эту последовательность; настройки остаются под £HSM_BAR_redact_long£.\n£HSM_BAR_redact_cut£ §gЭксплуатационные подробности из дубликата изъяты.§!\nИнженерный оригинал сохраняет порядок отказов под рассылочным «временным резервом». Кшемень оставила рядом старую запись об эвакуации. Место подписи под предложением повторного пуска пустует; прежний промежуток выхода переписан на поля."
 HSM_BAR_archive_crown_intake_restricted:0 "ПЕРЕХВАЧЕННОЕ ПИСЬМО / дубликат Вроны\nРассылочный «вопрос о верности» скрывает вопрос автора: можно ли измерить верность числом подданных, отказавшихся выполнить приказ? Он следует за рассказом о найденной в пещере короне. Врона подчеркнула смену темы.\nОтправитель: £HSM_BAR_redact_long£. Адрес находки: £HSM_BAR_redact_short£. Находчика и нынешнего носителя ещё предстоит установить до любого сближения.\nДругие места остаются в других конвертах. Здесь рассказ о пещере заканчивается прямо над подчёркиванием Вроны. Следующий абзац спрашивает о непокорных подданных; ни имён, ни числа при вопросе нет."
 HSM_BAR_archive_crown_intake_sealed:0 "ОРИГИНАЛ ПИСЬМА / отдельный конверт находки\nПодчёркивание Вроны начинается там, где автор оставляет пещеру и принимается считать непокорных подданных. Выездная выписка сохраняет верность и убирает предложенную меру. После такого изъятия абзац выглядит вопросом совсем другого рода.\nОтправитель: £HSM_BAR_redact_long£; предполагаемый адресат: £HSM_BAR_redact_short£.\n£HSM_BAR_redact_cut£ §gОбратный адрес удалён из дубликата.§!\nСтроки находчика и нынешнего носителя остаются пустыми. Подчёркивание Вроны идёт от рассказа о пещере к вопросу о непокорности. Конверты других находок перечислены отдельно; ни один к этому письму не приложен."
 HSM_BAR_archive_crown_field_restricted:0 "ДЕЛО ИЗЪЯТИЯ / сравнение показаний\n«Устойчивое исполнение» подставлено редактором рассылки вместо свидетельств о влиянии. Эти свидетельства описывают предел расстояния и числа затронутых. Музейные записи и акты запечатывания сопоставлены с сообщениями об использовании; последовательность передач скрыта под £HSM_BAR_redact_long£.\nВрона оспорила слово «исцеление» в сводке показаний. Остаток её возражения на полях скрыт под £HSM_BAR_redact_short£. Имя соответствующего свидетеля: £HSM_BAR_redact_short£.\nПриказа в отношении носителя не приложено. Номер описи проходит через сравнение музейных записей и актов запечатывания. Возражение Вроны осталось на обороте, под словом, которое предпочёл редактор рассылки."
 HSM_BAR_archive_crown_field_sealed:0 "ВРОНА / владение и возражение\nМузейные записи, акты запечатывания и сообщения об использовании сохранены при собственных датах. Рассылочная выписка скрывает полную последовательность владения, £HSM_BAR_redact_long£, и убирает возражение Вроны: «Соблазн в том, как быстро свидетели начинают называть послушание исцелением». Обе правки редакторские; ни одна не восстанавливает недостающего звена.\nИмя источника: £HSM_BAR_redact_short£.\n£HSM_BAR_redact_cut£ §gПодробности передачи изъяты из этого комплекта.§!\nПоказания сохраняют предел расстояния и числа. Возражение Вроны занимает поле рядом со сравнением свидетелей; врачебная формулировка под ним ещё читается. Пронумерованная карточка экземпляра вложена. Приказа в отношении его носителя нет."
 HSM_BAR_archive_crown_study_restricted:0 "ИССЛЕДОВАНИЕ ВОЗДЕЙСТВИЯ / врачебное возражение\nОтклонённое в рассылочной сводке «клиническое продолжение» предполагало опыты на пациентах, неспособных дать согласие. Кшемень их запрещает. Заявитель: £HSM_BAR_redact_long£. Отклонённая заявка оставлена при деле под этим именем.\nНикто из исследователей не надевал изолированную корону. Показания и наблюдения снаружи поддерживают модель с пределами расстояния и числа; рабочие значения: £HSM_BAR_redact_short£.\nНомер образца повторён на листах наблюдений и отклонённой заявке. Кшемень оставила заявительское «улучшение» читаемым под своим решением. Отказ подписан её рукой и подшит вместе с заявкой, под тем же номером."
 HSM_BAR_archive_crown_study_sealed:0 "КШЕМЕНЬ / отклонённая заявка сохранена\nЗаявитель, £HSM_BAR_redact_long£, назвал послушание улучшением и предложил пациентов, которые не могли согласиться. Рассылочная сводка сводит это к отклонённому продолжению. Отказ Кшемень написан поперёк заявки.\n£HSM_BAR_redact_cut£ §gПредложенный порядок воздействия изъят.§!\nНикто из исследователей не надевал образец. Наблюдения снаружи изолятора и показания сохраняют пределы расстояния и числа, £HSM_BAR_redact_short£. Номер описи проходит через эти листы и отклонённое предложение. Под отказом стоит подпись Кшемень. У предложенного опыта с пациентами нет листа наблюдений: его не проводили."
 HSM_BAR_archive_echo_intake_restricted:0 "ПОКАЗАНИЯ РАБОЧИХ / медицинский дубликат\nРемонтное «затруднение при общении» заменяет два испуганных рассказа: бригадир услышал ответ из пустой шахты, младший рабочий услышал собственные вернувшиеся слова. Задержку они описывают одинаково, слова различаются. Имена: £HSM_BAR_redact_short£; £HSM_BAR_redact_long£.\nВрона запросила план вентиляции. Он заканчивается у предположительно полой стены; ни одно показание не сообщает, что за ней.\nКшемень сохранила отказ от следующей смены при показании. Над ним лежит запрос плана вентиляции. Ограничение Вроны проходит по отмеченной площадке; место записи об осмотре шахты пока не заполнено."
 HSM_BAR_archive_echo_intake_sealed:0 "ПЕРВЫЕ ПОКАЗАНИЯ / имена отдельно\nМладшему рабочему показалось, что его собственные слова вернулись из шахты. Бригадир называет звук ответом. Время задержки совпадает. В выездной копии различие сжато до «затруднения при общении»; ни один из первоначальных рассказов его не разрешает.\nСвидетели: £HSM_BAR_redact_long£; £HSM_BAR_redact_short£.\n£HSM_BAR_redact_cut£ §gЛичные сведения о найме изъяты.§!\nПлан заканчивается у стены, которую рабочие называют полой. Запрос Вроны о проверке приложен к отказу младшего рабочего от следующей смены. Его неявка и рассказ бригадира остались на раздельных листах."
 HSM_BAR_archive_echo_field_restricted:0 "АКУСТИЧЕСКИЙ ЖУРНАЛ / личная беседа сохранена\nСвисток вернулся через тот же промежуток, что вопрос. В боковом ходе звук пришёл сзади; пропущенная на старом плане камера объяснила перемену направления. Отметка обмера: £HSM_BAR_redact_short£.\nИзъятая из ремонтной копии беседа касалась работы. Бригадир спросил, потеряет ли младший рабочий место. Ответ Кшемень в этом дубликате скрыт под £HSM_BAR_redact_short£. Имя: £HSM_BAR_redact_long£.\nЛичная беседа осталась за исправленным чертежом вентиляции. Ремонтная копия заканчивается измерениями; этот дубликат сохраняет вопрос бригадира о работе и место, где закрыт ответ Кшемень. Имя рабочего хранится отдельно."
 HSM_BAR_archive_echo_field_sealed:0 "ВРОНА / измерения с личной пометкой\nРемонтная копия удаляет вопрос бригадира после пробы со свистком. Он слушал молча, затем спросил, потеряет ли младший рабочий место. Марта ответила: нет. Имена остаются под £HSM_BAR_redact_long£; ссылка на запись о найме: £HSM_BAR_redact_short£.\nЗвук вернулся с прежней задержкой и достиг бокового хода сзади. Пропущенная камера объяснила направление.\n£HSM_BAR_redact_cut£ §gОпознавательные подробности изъяты; измерения сохранены.§!\nРемонтная копия заканчивается измерениями. Этот лист продолжается вопросом бригадира и однословным ответом Марты. Исправленный чертёж приложен за беседой; на нём читаются прежний путь и поправка Вроны."
 HSM_BAR_archive_echo_study_restricted:0 "ЗАКРЫТИЕ / копия с защитой свидетелей\nНеотмеченная камера образует обычный путь возврата звука. Независимого голоса не записано. Показания запечатаны ради защиты рабочих, £HSM_BAR_redact_long£, а исправленный чертёж передан ремонтникам.\nОльха запросил контрольную методику для сравнения под £HSM_BAR_redact_short£. Адресат на сопроводительном листе закрыт.\nПолное указание Кшемень сохраняет ограду: падение всё ещё смертельно. Предупреждение о голосах вычеркнуто в ремонтном экземпляре; ограждение осталось в перечне обязательных работ. Исправленный план приложен к тому же листу."
 HSM_BAR_archive_echo_study_sealed:0 "ЗАКРЫТОЕ ДЕЛО / исходное указание\nКамера объясняет звук, контроль поддерживает объяснение, исправленный чертёж передан для ремонта. Из рассылки исключены свидетели, £HSM_BAR_redact_long£, и перекрёстная ссылка, £HSM_BAR_redact_short£.\n£HSM_BAR_redact_cut£ §gЛичные показания сохранены вне этого комплекта.§!\nЗапрос Ольхи: «Приложить контрольную методику к БР-003 для отдельного сравнения». Следом ремонтное указание Марты: «Снять предупреждение о голосах, а не ограду». Исправленный чертёж приложен. Подпись закрывает акустическое расследование этой шахты; ограждение осталось в перечне работ."
 HSM_BAR_archive_marsh_intake_restricted:0 "ПОКАЗАНИЕ ПУТНИКА / ранний текст сохранён\nПервый рассказ отмечает свет и потерю поклажи. Фигура с фонарём появляется к утру. Рассылочное «уточнённое воспоминание» является редакторским выбором; Врона запросила исправления именно потому, что перемена не объяснена.\nСвидетель: £HSM_BAR_redact_short£. Корреспондент, предлагающий воду и осадок, живёт по адресу £HSM_BAR_redact_long£. Исследованного материала предложение ещё не дало.\nОба варианта отмечают потерянную поклажу. Врона запросила первый лист со всеми исправлениями. Предложение корреспондента прислать воду и осадок вложено; строка приёма проб пока пустует, рядом оставлено место для квитанции."
 HSM_BAR_archive_marsh_intake_sealed:0 "РЕЧНОЙ КОНВЕРТ / неисправленная последовательность\nПозднейшей фигуры в самом раннем показании путника нет. Рассылочное «уточнённое воспоминание» скрывает эту неопределённость, не разрешая её. Врона требует хранить первый лист вместе с исправлениями. Отправитель: £HSM_BAR_redact_long£.\n£HSM_BAR_redact_cut£ §gУказания к дому корреспондента изъяты.§!\nПредложенные вода и осадок должны поступить из £HSM_BAR_redact_short£. Банок при этих бумагах ещё нет. В первом рассказе поклажа потеряна после ухода с дороги; носитель фонаря появляется на позднейшем листе. Запрос Вроны о неисправленном показании остался внутри конверта."
 HSM_BAR_archive_marsh_field_restricted:0 "ПРИЁМ ОБРАЗЦОВ / показание перевозчика\n«Пожелание при обращении» в рассылочной квитанции было страхом: перевозчику сказали о духе в банке, и он просил не открывать её при нём. Имя: £HSM_BAR_redact_short£. Кшемень внесла просьбу рядом с именем перевозчика.\nВода и осадок прибыли в отдельных помеченных банках. Этикетки совпали с погодными записями корреспондента, подшитыми под £HSM_BAR_redact_long£. Фигуры не было ни в одной.\nКвитанция поставщика перечисляет воду и осадок раздельно. Кшемень оставила за ней просьбу перевозчика, погодные записи и этикетки банок. На квитанции стоит отметка покупки и номера проб, сверенные при получении."
 HSM_BAR_archive_marsh_field_sealed:0 "КШЕМЕНЬ / квитанция с рассказом перевозчика\nЗдесь сохранена просьба перевозчика: не открывать банку при нём. Кто-то назвал содержимое духом. Рассылочная квитанция превращает просьбу в пожелание.\nПеревозчик: £HSM_BAR_redact_short£. Адрес поставщика: £HSM_BAR_redact_long£.\n£HSM_BAR_redact_cut£ §gЛичные подробности доставки изъяты.§!\nРаздельно помеченные вода и осадок сопоставлены с погодными записями. Фигуры не появилось ни в одной банке. Квитанция покупки вложена под показанием перевозчика. Кшемень сохранила его просьбу целиком, включая слова «пока я в комнате»."
 HSM_BAR_archive_marsh_study_restricted:0 "КОНТРОЛЬНЫЙ ОПЫТ / проект указаний поселениям\nОбычная химическая реакция воспроизвела свет при записанных условиях и прекратилась при их перемене. Перемещающегося носителя не выявлено. Подробные условия, £HSM_BAR_redact_long£, исключены из поселкового циркуляра, чтобы полезные указания не стали рецептом повторения опыта.\nКшемень вычеркнула «Деревенское суеверие». Свидетель: £HSM_BAR_redact_short£. Потерянная поклажа остаётся в рассказе и после объяснения свечения.\nУказания по хранению и очистке воды вошли в поселковую копию. Условия опыта остались на лабораторном листе. Черта Кшемень проходит через предложенный заголовок; запись о потерянной поклаже под ним не тронута."
 HSM_BAR_archive_marsh_study_sealed:0 "ЛАБОРАТОРНАЯ ЗАПИСЬ / отвергнутый заголовок\nСвет прекратился после перемены записанных условий. Его воспроизвели обычной химической реакцией; перемещающегося носителя не выявлено. Условия остаются под £HSM_BAR_redact_long£ в этом дубликате.\n£HSM_BAR_redact_cut£ §gПодробности опыта сохранены на отдельном листе.§!\nЗаголовок «Деревенское суеверие» остался под чертой Кшемень. Путник: £HSM_BAR_redact_short£. Её пометка: «Он потерял поклажу в опасном месте». Химическое заключение подписано под записью опыта. Указания по хранению и очистке воды приложены к поселковой копии; перечёркнутый проект оставлен здесь."
