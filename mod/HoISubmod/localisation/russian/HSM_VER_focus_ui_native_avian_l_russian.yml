l_russian:
 HSM_VER_UI_NATIVE_AVI_armistice_or_treaty_tt:0 "У домов есть перемирие или договор, либо посредничество ещё не началось."
 HSM_VER_UI_NATIVE_AVI_houses_at_peace_tt:0 "Эри и Эйри не воюют друг с другом."
 HSM_VER_UI_NATIVE_AVI_three_recipients_tt:0 "Авиан, Эри и Эйри получают:"
 HSM_VER_UI_NATIVE_AVI_treaty_or_native_tt:0 "Договорный мир действует, либо посредничество ещё не началось."
 HSM_VER_UI_NATIVE_AVI_houses_allied_tt:0 "Эри и Эйри состоят в одном альянсе с Авианом."
 HSM_VER_UI_NATIVE_AVI_charter_active_tt:0 "Все три дома ратифицировали хартию; она сохраняет силу."
 HSM_VER_UI_NATIVE_AVI_faction_position_tt:0 "Авиан вне альянса, возглавляет свой альянс либо состоит в альянсе Эри."
 HSM_VER_UI_NATIVE_AVI_at_peace_tt:0 "Авиан не участвует в войне."
 HSM_VER_UI_NATIVE_AVI_constitution_started_tt:0 "Конституционное объединение уже началось."
 HSM_VER_UI_NATIVE_AVI_constitution_entry_tt:0 "Конституционное правительство, курс Интергигантес и мир трёх домов позволяют начать объединение."
 HSM_VER_UI_NATIVE_AVI_constitution_unchosen_tt:0 "Конституционное объединение ещё не выбрано."
 HSM_VER_UI_NATIVE_AVI_winterfest_context_tt:0 "Мирное объединение доступно, либо оба дома являются союзными подданными Авиана."
 HSM_VER_UI_NATIVE_AVI_armistice_effect_tt:0 "Переговорный путь: предлагает перемирие при подходящих условиях; можно принять, запросить инспекции или отказаться.\nИсходный путь: завершает войну Эри и Эйри и устанавливает перемирие на 365 дней."
 HSM_VER_UI_NATIVE_AVI_treaty_effect_tt:0 "Переговорный путь: предлагает договор при подходящих условиях; можно принять, запросить арбитраж или отказаться.\nИсходный путь: прекращает соперничество, улучшает отношения, устанавливает перемирие на 60 дней и снимает статус национальных со спорных областей."
 HSM_VER_UI_NATIVE_AVI_tripartite_effect_tt:0 "Создаёт Интергигантес, если Авиан вне альянса. Как лидер альянса приглашает подходящие Эри и Эйри: каждый может принять (+50 политической власти Авиану) или отказаться (-50)."
 HSM_VER_UI_NATIVE_AVI_integration_effect_tt:0 "Завершает «Три печати, одна конституция» и начинает объединение по согласию. Подписи сохраняются; Авиан может принять действующую хартию или отказаться. Признание исходного мира даёт Эри и Эйри +15% к строительству инфраструктуры и железных дорог."
 HSM_VER_UI_NATIVE_AVI_winterfest_effect_tt:0 "Начинает политический кризис Зимнего праздника и закрывает конституционное объединение. Дальнейшие решения в боях поддержат лоялистов, коммунистов или фашистов."
 HSM_VER_UI_NATIVE_AVI_intelligence_effect_tt:0 "Всем трём домам: +1.5% к стабильности, +15% к защите от смены идеологии, -15% к стоимости подрывной деятельности и -10% к риску обнаружения агентов.\nС La Resistance: +1 к шифрованию, +10% к мощности дешифрования. Без дополнения: +10% к шифрованию и дешифрованию."
