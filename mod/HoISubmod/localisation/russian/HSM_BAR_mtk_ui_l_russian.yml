 HSM_BAR_mtk_sensate_prosthesis_rig_question:0 "Какую лёгкую задачу поддержит освоенный сигнал давления?"
 HSM_BAR_mtk_sensate_prosthesis_prepare_rig_a:0 "Удержание чашки"
 HSM_BAR_mtk_sensate_prosthesis_prepare_rig_a_tt:0 "Использовать подогнанный протез для удержания лёгкой чашки, передавая давление мягкой накладкой на неповреждённую кожу. Обычный механический сброс остаётся доступным: это изучаемый сигнал, а не восстановленное естественное осязание отсутствующей части тела."
 HSM_BAR_mtk_sensate_prosthesis_prepare_rig_b:0 "Постановка предмета"
 HSM_BAR_mtk_sensate_prosthesis_prepare_rig_b_tt:0 "Попросить носителя поставить лёгкий предмет с индивидуально подогнанной накладкой. Записать зрительные проверки и удобство движения отдельно от боли, чтобы более плавное действие не подменяло улучшение фантомных ощущений во время упражнения."
 HSM_BAR_mtk_sensate_prosthesis_control_question:0 "Какое сравнение обратной связи проверит видимое улучшение?"
 HSM_BAR_mtk_sensate_prosthesis_prepare_control_a:0 "Накладка отключена"
 HSM_BAR_mtk_sensate_prosthesis_prepare_control_a_tt:0 "Сравнить ту же удобную задачу с отключённой накладкой давления. Сохранить выбор пациента остановиться или отказаться от детали: дополнительное ощущение способно отвлекать даже тогда, когда механизм передаёт технически правильный сигнал о давлении."
 HSM_BAR_mtk_sensate_prosthesis_prepare_control_b:0 "Задержанный сигнал"
 HSM_BAR_mtk_sensate_prosthesis_prepare_control_b_tt:0 "Использовать описанное сравнение задержанного сигнала только при удобной нагрузке и доступном немедленном снятии. Следить за усилением хвата вместо коррекции, записывая реакцию как ограничение накладки, а не возлагая вину на её носителя."
 HSM_BAR_mtk_sensate_prosthesis_observation_0:0 "Чашку удаётся удержать, но новый кожный сигнал ещё требует сознательного внимания. Отключённая связь оставляет сравнение, которое нужно отделить от обычной тренировки. Креплению нужен проверенный сигнал или дополнительные упражнения с отдыхом до принятия."
 HSM_BAR_mtk_sensate_prosthesis_experiment_report_a_0:0 "УСТАНОВКА: Удержание чашки. Накладка отключена.\n\nЧашку удаётся удержать, но новый кожный сигнал ещё требует сознательного внимания. Отключённая связь оставляет сравнение, которое нужно отделить от обычной тренировки. Креплению нужен проверенный сигнал или дополнительные упражнения с отдыхом до принятия.\n\nДополнение к журналу испытаний\nНастроенная накладка чашки дала ясный освоенный сигнал давления. Сравнение с отключением отделило полезный освоенный сигнал от обычного упражнения. Добровольное средство помогает некоторым. Нужны подгонка Протезов и сравнение Фантомной боли; естественного осязания и излечения фантомной боли нет."
 HSM_BAR_mtk_sensate_prosthesis_verification_a_0:0 "Чашку удаётся удержать, но новый кожный сигнал ещё требует сознательного внимания. Отключённая связь оставляет сравнение, которое нужно отделить от обычной тренировки. Креплению нужен проверенный сигнал или дополнительные упражнения с отдыхом до принятия.\n\nНАЗНАЧЕНА ПРОВЕРКА: Настроить накладку\nОплатить проверенную настройку накладки и сверить немедленный сигнал с носителем. Это быстрее разбирает постановку предмета, но требует дополнительной подгонки; удержание чашки может установить освоенный сигнал через более долгую удобную практику с нынешней деталью."
 HSM_BAR_mtk_sensate_prosthesis_experiment_report_b_0:0 "УСТАНОВКА: Удержание чашки. Накладка отключена.\n\nЧашку удаётся удержать, но новый кожный сигнал ещё требует сознательного внимания. Отключённая связь оставляет сравнение, которое нужно отделить от обычной тренировки. Креплению нужен проверенный сигнал или дополнительные упражнения с отдыхом до принятия.\n\nДополнение к журналу испытаний\nУпражнения с чашкой и отдыхом научили некоторых носителей отдельному кожному сигналу. Сравнение с отключением отделило полезный освоенный сигнал от обычного упражнения. Полезная связь частична и добровольна, требует подгонки и осмотров. Некоторые отказываются; освоенное давление не возвращает естественного осязания и не избавляет от фантомной боли."
 HSM_BAR_mtk_sensate_prosthesis_verification_b_0:0 "Чашку удаётся удержать, но новый кожный сигнал ещё требует сознательного внимания. Отключённая связь оставляет сравнение, которое нужно отделить от обычной тренировки. Креплению нужен проверенный сигнал или дополнительные упражнения с отдыхом до принятия.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить упражнения\nСохранить принятую немедленную накладку и продлить упражнения с отдыхом, раздельно ведя дневники боли и движения. Это экономит новую подгонку, но дольше занимает постановку предмета; неподвижная чашка даёт более простой рисунок давления для освоения."
 HSM_BAR_mtk_sensate_prosthesis_observation_1:0 "Чашку удаётся удержать, но новый кожный сигнал ещё требует сознательного внимания. Задержанный сигнал вызывает усиление хвата; накладку немедленно снимают. Креплению нужен проверенный сигнал или дополнительные упражнения с отдыхом до принятия."
 HSM_BAR_mtk_sensate_prosthesis_experiment_report_a_1:0 "УСТАНОВКА: Удержание чашки. Задержанный сигнал.\n\nЧашку удаётся удержать, но новый кожный сигнал ещё требует сознательного внимания. Задержанный сигнал вызывает усиление хвата; накладку немедленно снимают. Креплению нужен проверенный сигнал или дополнительные упражнения с отдыхом до принятия.\n\nДополнение к журналу испытаний\nНастроенная накладка чашки дала ясный освоенный сигнал давления. Задержку исключили; последующие крепления сохранили ограничитель хода и механический сброс. Добровольное средство помогает некоторым. Нужны подгонка Протезов и сравнение Фантомной боли; естественного осязания и излечения фантомной боли нет."
 HSM_BAR_mtk_sensate_prosthesis_verification_a_1:0 "Чашку удаётся удержать, но новый кожный сигнал ещё требует сознательного внимания. Задержанный сигнал вызывает усиление хвата; накладку немедленно снимают. Креплению нужен проверенный сигнал или дополнительные упражнения с отдыхом до принятия.\n\nНАЗНАЧЕНА ПРОВЕРКА: Настроить накладку\nОплатить проверенную настройку накладки и сверить немедленный сигнал с носителем. Это быстрее разбирает постановку предмета, но требует дополнительной подгонки; удержание чашки может установить освоенный сигнал через более долгую удобную практику с нынешней деталью."
 HSM_BAR_mtk_sensate_prosthesis_experiment_report_b_1:0 "УСТАНОВКА: Удержание чашки. Задержанный сигнал.\n\nЧашку удаётся удержать, но новый кожный сигнал ещё требует сознательного внимания. Задержанный сигнал вызывает усиление хвата; накладку немедленно снимают. Креплению нужен проверенный сигнал или дополнительные упражнения с отдыхом до принятия.\n\nДополнение к журналу испытаний\nУпражнения с чашкой и отдыхом научили некоторых носителей отдельному кожному сигналу. Задержку исключили; последующие крепления сохранили ограничитель хода и механический сброс. Полезная связь частична и добровольна, требует подгонки и осмотров. Некоторые отказываются; освоенное давление не возвращает естественного осязания и не избавляет от фантомной боли."
 HSM_BAR_mtk_sensate_prosthesis_verification_b_1:0 "Чашку удаётся удержать, но новый кожный сигнал ещё требует сознательного внимания. Задержанный сигнал вызывает усиление хвата; накладку немедленно снимают. Креплению нужен проверенный сигнал или дополнительные упражнения с отдыхом до принятия.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить упражнения\nСохранить принятую немедленную накладку и продлить упражнения с отдыхом, раздельно ведя дневники боли и движения. Это экономит новую подгонку, но дольше занимает постановку предмета; неподвижная чашка даёт более простой рисунок давления для освоения."
 HSM_BAR_mtk_sensate_prosthesis_observation_2:0 "Лёгкий предмет поставлен с меньшим числом взглядов, тогда как сообщённая боль не изменилась. Отключённая связь оставляет сравнение, которое нужно отделить от обычной тренировки. Креплению нужен проверенный сигнал или дополнительные упражнения с отдыхом до принятия."
 HSM_BAR_mtk_sensate_prosthesis_experiment_report_a_2:0 "УСТАНОВКА: Постановка предмета. Накладка отключена.\n\nЛёгкий предмет поставлен с меньшим числом взглядов, тогда как сообщённая боль не изменилась. Отключённая связь оставляет сравнение, которое нужно отделить от обычной тренировки. Креплению нужен проверенный сигнал или дополнительные упражнения с отдыхом до принятия.\n\nДополнение к журналу испытаний\nНастроенная накладка постановки отделила обратную связь движения от записи боли. Сравнение с отключением отделило полезный освоенный сигнал от обычного упражнения. Добровольное средство помогает некоторым. Нужны подгонка Протезов и сравнение Фантомной боли; естественного осязания и излечения фантомной боли нет."
 HSM_BAR_mtk_sensate_prosthesis_verification_a_2:0 "Лёгкий предмет поставлен с меньшим числом взглядов, тогда как сообщённая боль не изменилась. Отключённая связь оставляет сравнение, которое нужно отделить от обычной тренировки. Креплению нужен проверенный сигнал или дополнительные упражнения с отдыхом до принятия.\n\nНАЗНАЧЕНА ПРОВЕРКА: Настроить накладку\nОплатить проверенную настройку накладки и сверить немедленный сигнал с носителем. Это быстрее разбирает постановку предмета, но требует дополнительной подгонки; удержание чашки может установить освоенный сигнал через более долгую удобную практику с нынешней деталью."
 HSM_BAR_mtk_sensate_prosthesis_experiment_report_b_2:0 "УСТАНОВКА: Постановка предмета. Накладка отключена.\n\nЛёгкий предмет поставлен с меньшим числом взглядов, тогда как сообщённая боль не изменилась. Отключённая связь оставляет сравнение, которое нужно отделить от обычной тренировки. Креплению нужен проверенный сигнал или дополнительные упражнения с отдыхом до принятия.\n\nДополнение к журналу испытаний\nУпражнения постановки сократили зрительные проверки у некоторых, не приписав облегчение обратной связи. Сравнение с отключением отделило полезный освоенный сигнал от обычного упражнения. Полезная связь частична и добровольна, требует подгонки и осмотров. Некоторые отказываются; освоенное давление не возвращает естественного осязания и не избавляет от фантомной боли."
 HSM_BAR_mtk_sensate_prosthesis_verification_b_2:0 "Лёгкий предмет поставлен с меньшим числом взглядов, тогда как сообщённая боль не изменилась. Отключённая связь оставляет сравнение, которое нужно отделить от обычной тренировки. Креплению нужен проверенный сигнал или дополнительные упражнения с отдыхом до принятия.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить упражнения\nСохранить принятую немедленную накладку и продлить упражнения с отдыхом, раздельно ведя дневники боли и движения. Это экономит новую подгонку, но дольше занимает постановку предмета; неподвижная чашка даёт более простой рисунок давления для освоения."
