 HSM_BAR_mtk_field_atlas_respond_b_tt:0 "Оставить прежнюю стойку и повторять маршрут вслед за перемещаемыми чарами. Это экономит расходы на новые накладки, но дольше занимает наблюдателей возле работающих приборов; маршрут учебной комнаты позволит разобраться с положением источника за меньшее число встреч.\n\n[GetHSMBARMtkResponseBudget_field_atlas_b]"
 HSM_BAR_mtk_shared_senses_rig_question:0 "На чём сосредоточится отправитель?"
 HSM_BAR_mtk_shared_senses_prepare_rig_a:0 "Неподвижный контур"
 HSM_BAR_mtk_shared_senses_prepare_rig_a_tt:0 "Предъявить простую карточку, неподвижную в течение сеанса. Обычный обзор получателя остаётся открытым, чтобы передаваемый контур можно было рисовать отдельно от комнаты, окружающей его собственное место за столом."
 HSM_BAR_mtk_shared_senses_prepare_rig_b:0 "Движущийся контур"
 HSM_BAR_mtk_shared_senses_prepare_rig_b_tt:0 "Медленно перемещать ту же карточку перед отправителем. Проверяется, передаётся ли вместе с контуром направление; получатель сохраняет отдельное средство прерывания и может закончить обмен, если тот становится неприятным."
 HSM_BAR_mtk_shared_senses_control_question:0 "С чем сравнить передаваемый образ?"
 HSM_BAR_mtk_shared_senses_prepare_control_a:0 "Неактивная связь"
 HSM_BAR_mtk_shared_senses_prepare_control_a_tt:0 "Чередовать сеансы с неактивной связью, скрывая порядок от проверяющего рисунки. Правдоподобный контур важен лишь тогда, когда активная передача отличается от догадок при том же наборе предъявляемых карточек."
 HSM_BAR_mtk_shared_senses_prepare_control_b:0 "Воображаемая карточка"
 HSM_BAR_mtk_shared_senses_prepare_control_b_tt:0 "В отдельных сравнениях отправитель только воображает карточку. Эти рисунки хранятся отдельно от рисунков видимых карточек, чтобы уверенность или воспоминание о цвете не заменили незаметно действительно переданный зрительный признак."
 HSM_BAR_mtk_shared_senses_observation_0:0 "Неподвижная карточка оставляет узнаваемый контур на рисунке получателя, хотя её бледный цвет приходит только как яркость. Неактивные сеансы тоже дают уверенные рисунки, поэтому активные записи ещё предстоит сравнить без раскрытия их подписей. Связи нужен более узкий передаваемый признак или более длительное сравнение, прежде чем эти впечатления можно будет считать пригодным обменом."
 HSM_BAR_mtk_shared_senses_experiment_report_a_0:0 "УСТАНОВКА: Неподвижный контур. Неактивная связь.\n\nНеподвижная карточка оставляет узнаваемый контур на рисунке получателя, хотя её бледный цвет приходит только как яркость. Неактивные сеансы тоже дают уверенные рисунки, поэтому активные записи ещё предстоит сравнить без раскрытия их подписей. Связи нужен более узкий передаваемый признак или более длительное сравнение, прежде чем эти впечатления можно будет считать пригодным обменом.\n\nДополнение к журналу испытаний\nНеподвижная маска сохранила контур карточки, а цвет был исключён из утверждения о надёжно передаваемых признаках. Неактивное сравнение не воспроизвело согласия, достигнутого при активной передаче простых неподвижных контуров карточек. Сохраняется краткий местный обмен намеренно предложенными контурами. Необходимы независимые остановки и обычный обзор. Цвет, движение и целостный опыт лежат за пределами результата; связь не превращает уверенность другого наблюдателя в надёжное измерение его впечатлений."
 HSM_BAR_mtk_shared_senses_verification_a_0:0 "Неподвижная карточка оставляет узнаваемый контур на рисунке получателя, хотя её бледный цвет приходит только как яркость. Неактивные сеансы тоже дают уверенные рисунки, поэтому активные записи ещё предстоит сравнить без раскрытия их подписей. Связи нужен более узкий передаваемый признак или более длительное сравнение, прежде чем эти впечатления можно будет считать пригодным обменом.\n\nНАЗНАЧЕНА ПРОВЕРКА: Ограничить образ\nПодготовить неподвижную контурную маску и заново настроить передаваемый признак. Дополнительная работа с прибором позволяет скорее устранить расхождение движущейся карточки; место с уже неподвижным образцом может прийти к той же ограниченной процедуре дешевле через сравнение."
 HSM_BAR_mtk_shared_senses_experiment_report_b_0:0 "УСТАНОВКА: Неподвижный контур. Неактивная связь.\n\nНеподвижная карточка оставляет узнаваемый контур на рисунке получателя, хотя её бледный цвет приходит только как яркость. Неактивные сеансы тоже дают уверенные рисунки, поэтому активные записи ещё предстоит сравнить без раскрытия их подписей. Связи нужен более узкий передаваемый признак или более длительное сравнение, прежде чем эти впечатления можно будет считать пригодным обменом.\n\nДополнение к журналу испытаний\nПовторные рисунки неподвижной карточки согласовались по очертанию, но продолжали расходиться в переданном оттенке цвета. Неактивное сравнение не воспроизвело согласия, достигнутого при активной передаче простых неподвижных контуров карточек. Сравнение подтверждает передачу отдельных неподвижных признаков, а не общего сознания. Сеансы остаются короткими и местными, с возможностью выхода каждого участника. Несогласующиеся рисунки хранятся раздельно; сводное изображение не должно скрывать пределы частично успешного опыта."
 HSM_BAR_mtk_shared_senses_verification_b_0:0 "Неподвижная карточка оставляет узнаваемый контур на рисунке получателя, хотя её бледный цвет приходит только как яркость. Неактивные сеансы тоже дают уверенные рисунки, поэтому активные записи ещё предстоит сравнить без раскрытия их подписей. Связи нужен более узкий передаваемый признак или более длительное сравнение, прежде чем эти впечатления можно будет считать пригодным обменом.\n\nНАЗНАЧЕНА ПРОВЕРКА: Сопоставить рисунки\nПродлить сеансы с отдыхом и поручить Леопольду сравнить отдельные рисунки до раскрытия подписей. Новых приспособлений потребуется меньше, но после опытов с движением работа займёт дольше: неприятное ощущение завершает сеанс, а не оправдывает его продолжение."
 HSM_BAR_mtk_shared_senses_observation_1:0 "Неподвижная карточка оставляет узнаваемый контур на рисунке получателя, хотя её бледный цвет приходит только как яркость. Воображаемые карточки вызывают особенно уверенные названия цветов, но расходятся с контурами, нарисованными при непосредственном взгляде. Связи нужен более узкий передаваемый признак или более длительное сравнение, прежде чем эти впечатления можно будет считать пригодным обменом."
 HSM_BAR_mtk_shared_senses_experiment_report_a_1:0 "УСТАНОВКА: Неподвижный контур. Воображаемая карточка.\n\nНеподвижная карточка оставляет узнаваемый контур на рисунке получателя, хотя её бледный цвет приходит только как яркость. Воображаемые карточки вызывают особенно уверенные названия цветов, но расходятся с контурами, нарисованными при непосредственном взгляде. Связи нужен более узкий передаваемый признак или более длительное сравнение, прежде чем эти впечатления можно будет считать пригодным обменом.\n\nДополнение к журналу испытаний\nНеподвижная маска сохранила контур карточки, а цвет был исключён из утверждения о надёжно передаваемых признаках. Воображаемые карточки остались ненадёжными и были исключены из принятой процедуры передачи непосредственно видимого. Сохраняется краткий местный обмен намеренно предложенными контурами. Необходимы независимые остановки и обычный обзор. Цвет, движение и целостный опыт лежат за пределами результата; связь не превращает уверенность другого наблюдателя в надёжное измерение его впечатлений."
 HSM_BAR_mtk_shared_senses_verification_a_1:0 "Неподвижная карточка оставляет узнаваемый контур на рисунке получателя, хотя её бледный цвет приходит только как яркость. Воображаемые карточки вызывают особенно уверенные названия цветов, но расходятся с контурами, нарисованными при непосредственном взгляде. Связи нужен более узкий передаваемый признак или более длительное сравнение, прежде чем эти впечатления можно будет считать пригодным обменом.\n\nНАЗНАЧЕНА ПРОВЕРКА: Ограничить образ\nПодготовить неподвижную контурную маску и заново настроить передаваемый признак. Дополнительная работа с прибором позволяет скорее устранить расхождение движущейся карточки; место с уже неподвижным образцом может прийти к той же ограниченной процедуре дешевле через сравнение."
 HSM_BAR_mtk_shared_senses_experiment_report_b_1:0 "УСТАНОВКА: Неподвижный контур. Воображаемая карточка.\n\nНеподвижная карточка оставляет узнаваемый контур на рисунке получателя, хотя её бледный цвет приходит только как яркость. Воображаемые карточки вызывают особенно уверенные названия цветов, но расходятся с контурами, нарисованными при непосредственном взгляде. Связи нужен более узкий передаваемый признак или более длительное сравнение, прежде чем эти впечатления можно будет считать пригодным обменом.\n\nДополнение к журналу испытаний\nПовторные рисунки неподвижной карточки согласовались по очертанию, но продолжали расходиться в переданном оттенке цвета. Воображаемые карточки остались ненадёжными и были исключены из принятой процедуры передачи непосредственно видимого. Сравнение подтверждает передачу отдельных неподвижных признаков, а не общего сознания. Сеансы остаются короткими и местными, с возможностью выхода каждого участника. Несогласующиеся рисунки хранятся раздельно; сводное изображение не должно скрывать пределы частично успешного опыта."
 HSM_BAR_mtk_shared_senses_verification_b_1:0 "Неподвижная карточка оставляет узнаваемый контур на рисунке получателя, хотя её бледный цвет приходит только как яркость. Воображаемые карточки вызывают особенно уверенные названия цветов, но расходятся с контурами, нарисованными при непосредственном взгляде. Связи нужен более узкий передаваемый признак или более длительное сравнение, прежде чем эти впечатления можно будет считать пригодным обменом.\n\nНАЗНАЧЕНА ПРОВЕРКА: Сопоставить рисунки\nПродлить сеансы с отдыхом и поручить Леопольду сравнить отдельные рисунки до раскрытия подписей. Новых приспособлений потребуется меньше, но после опытов с движением работа займёт дольше: неприятное ощущение завершает сеанс, а не оправдывает его продолжение."
 HSM_BAR_mtk_shared_senses_observation_2:0 "Движущаяся карточка вызывает противоположные отметки направления; получатель прерывает сеанс, когда переданное движение начинает противоречить видимой комнате. Неактивные сеансы тоже дают уверенные рисунки, поэтому активные записи ещё предстоит сравнить без раскрытия их подписей. Связи нужен более узкий передаваемый признак или более длительное сравнение, прежде чем эти впечатления можно будет считать пригодным обменом."
 HSM_BAR_mtk_shared_senses_experiment_report_a_2:0 "УСТАНОВКА: Движущийся контур. Неактивная связь.\n\nДвижущаяся карточка вызывает противоположные отметки направления; получатель прерывает сеанс, когда переданное движение начинает противоречить видимой комнате. Неактивные сеансы тоже дают уверенные рисунки, поэтому активные записи ещё предстоит сравнить без раскрытия их подписей. Связи нужен более узкий передаваемый признак или более длительное сравнение, прежде чем эти впечатления можно будет считать пригодным обменом.\n\nДополнение к журналу испытаний\nЗамена движущейся карточки неподвижной маской прекратила противоречивые сообщения о направлении передаваемого движения у получателя. Неактивное сравнение не воспроизвело согласия, достигнутого при активной передаче простых неподвижных контуров карточек. Сохраняется краткий местный обмен намеренно предложенными контурами. Необходимы независимые остановки и обычный обзор. Цвет, движение и целостный опыт лежат за пределами результата; связь не превращает уверенность другого наблюдателя в надёжное измерение его впечатлений."
 HSM_BAR_mtk_shared_senses_verification_a_2:0 "Движущаяся карточка вызывает противоположные отметки направления; получатель прерывает сеанс, когда переданное движение начинает противоречить видимой комнате. Неактивные сеансы тоже дают уверенные рисунки, поэтому активные записи ещё предстоит сравнить без раскрытия их подписей. Связи нужен более узкий передаваемый признак или более длительное сравнение, прежде чем эти впечатления можно будет считать пригодным обменом.\n\nНАЗНАЧЕНА ПРОВЕРКА: Ограничить образ\nПодготовить неподвижную контурную маску и заново настроить передаваемый признак. Дополнительная работа с прибором позволяет скорее устранить расхождение движущейся карточки; место с уже неподвижным образцом может прийти к той же ограниченной процедуре дешевле через сравнение."
 HSM_BAR_mtk_shared_senses_experiment_report_b_2:0 "УСТАНОВКА: Движущийся контур. Неактивная связь.\n\nДвижущаяся карточка вызывает противоположные отметки направления; получатель прерывает сеанс, когда переданное движение начинает противоречить видимой комнате. Неактивные сеансы тоже дают уверенные рисунки, поэтому активные записи ещё предстоит сравнить без раскрытия их подписей. Связи нужен более узкий передаваемый признак или более длительное сравнение, прежде чем эти впечатления можно будет считать пригодным обменом.\n\nДополнение к журналу испытаний\nПосле прерванных сеансов с движением отдельные повторы с неподвижной карточкой восстановили согласие только по контуру. Неактивное сравнение не воспроизвело согласия, достигнутого при активной передаче простых неподвижных контуров карточек. Сравнение подтверждает передачу отдельных неподвижных признаков, а не общего сознания. Сеансы остаются короткими и местными, с возможностью выхода каждого участника. Несогласующиеся рисунки хранятся раздельно; сводное изображение не должно скрывать пределы частично успешного опыта."
 HSM_BAR_mtk_shared_senses_verification_b_2:0 "Движущаяся карточка вызывает противоположные отметки направления; получатель прерывает сеанс, когда переданное движение начинает противоречить видимой комнате. Неактивные сеансы тоже дают уверенные рисунки, поэтому активные записи ещё предстоит сравнить без раскрытия их подписей. Связи нужен более узкий передаваемый признак или более длительное сравнение, прежде чем эти впечатления можно будет считать пригодным обменом.\n\nНАЗНАЧЕНА ПРОВЕРКА: Сопоставить рисунки\nПродлить сеансы с отдыхом и поручить Леопольду сравнить отдельные рисунки до раскрытия подписей. Новых приспособлений потребуется меньше, но после опытов с движением работа займёт дольше: неприятное ощущение завершает сеанс, а не оправдывает его продолжение."
 HSM_BAR_mtk_shared_senses_observation_3:0 "Движущаяся карточка вызывает противоположные отметки направления; получатель прерывает сеанс, когда переданное движение начинает противоречить видимой комнате. Воображаемые карточки вызывают особенно уверенные названия цветов, но расходятся с контурами, нарисованными при непосредственном взгляде. Связи нужен более узкий передаваемый признак или более длительное сравнение, прежде чем эти впечатления можно будет считать пригодным обменом."
 HSM_BAR_mtk_shared_senses_experiment_report_a_3:0 "УСТАНОВКА: Движущийся контур. Воображаемая карточка.\n\nДвижущаяся карточка вызывает противоположные отметки направления; получатель прерывает сеанс, когда переданное движение начинает противоречить видимой комнате. Воображаемые карточки вызывают особенно уверенные названия цветов, но расходятся с контурами, нарисованными при непосредственном взгляде. Связи нужен более узкий передаваемый признак или более длительное сравнение, прежде чем эти впечатления можно будет считать пригодным обменом.\n\nДополнение к журналу испытаний\nЗамена движущейся карточки неподвижной маской прекратила противоречивые сообщения о направлении передаваемого движения у получателя. Воображаемые карточки остались ненадёжными и были исключены из принятой процедуры передачи непосредственно видимого. Сохраняется краткий местный обмен намеренно предложенными контурами. Необходимы независимые остановки и обычный обзор. Цвет, движение и целостный опыт лежат за пределами результата; связь не превращает уверенность другого наблюдателя в надёжное измерение его впечатлений."
