 HSM_BAR_mtk_empty_vessel_rig_question:0 "Какое простое внешнее проявление запишет сосуд?"
 HSM_BAR_mtk_empty_vessel_prepare_rig_a:0 "След над краем"
 HSM_BAR_mtk_empty_vessel_prepare_rig_a_tt:0 "Подготовить керамическую решётку для записи движущейся отметки над краем. Сосуд остаётся незанятым, наблюдение ведётся снаружи; первый вопрос касается короткого внешнего явления, а не постоянного пребывания в нём устойчивой личности собеседника."
 HSM_BAR_mtk_empty_vessel_prepare_rig_b:0 "Смена запроса"
 HSM_BAR_mtk_empty_vessel_prepare_rig_b_tt:0 "Подготовить изменённый запрос, независимо записывая отметки у края. Разнице после запроса нужно сравнение с обычным поведением прибора, прежде чем она сможет поддержать утверждение даже о простом обмене с неизвестным собеседником."
 HSM_BAR_mtk_empty_vessel_control_question:0 "Какой обычный источник проверит кажущийся ответ?"
 HSM_BAR_mtk_empty_vessel_prepare_control_a:0 "Неактивная надпись"
 HSM_BAR_mtk_empty_vessel_prepare_control_a_tt:0 "Держать парный сосуд с неактивной надписью рядом с работающей решёткой. Записывать оба независимо от впечатлений слушателя, чтобы ожидаемый ответ не засчитывался лишь потому, что активный сосуд должен был ответить по замыслу опыта."
 HSM_BAR_mtk_empty_vessel_prepare_control_b:0 "Колебания стола"
 HSM_BAR_mtk_empty_vessel_prepare_control_b_tt:0 "Измерять обычные колебания под сосудом одновременно с отметками над краем. Сравнение проверяет следование движения прибору, сохраняя тихие промежутки столь же тщательно, как немногочисленные появления, кажущиеся отзывчивыми на предъявленный во время сеанса запрос."
 HSM_BAR_mtk_empty_vessel_observation_0:0 "Работающая решётка ненадолго даёт движущуюся нить, затем теряет связность. Неактивный сосуд остаётся тихим рядом с коротким активным проявлением. Серии нужен проверенный короткий промежуток, без признания дополнительной мощности доказательством большей устойчивости проявления."
 HSM_BAR_mtk_empty_vessel_experiment_report_a_0:0 "УСТАНОВКА: След над краем. Неактивная надпись.\n\nРаботающая решётка ненадолго даёт движущуюся нить, затем теряет связность. Неактивный сосуд остаётся тихим рядом с коротким активным проявлением. Серии нужен проверенный короткий промежуток, без признания дополнительной мощности доказательством большей устойчивости проявления.\n\nДополнение к журналу испытаний\nИсправленный промежуток записал короткую нить, не продлив её пребывания. Неактивные надписи не дали соответствующей нити в принятом сравнении сосудов. Короткие проявления возникают лишь иногда, без живых носителей. Постоянное пребывание и личность не подтверждены; лишняя мощность нагревает сосуд и ухудшает связность."
 HSM_BAR_mtk_empty_vessel_verification_a_0:0 "Работающая решётка ненадолго даёт движущуюся нить, затем теряет связность. Неактивный сосуд остаётся тихим рядом с коротким активным проявлением. Серии нужен проверенный короткий промежуток, без признания дополнительной мощности доказательством большей устойчивости проявления.\n\nНАЗНАЧЕНА ПРОВЕРКА: Уточнить время питания\nЗаказать более ясные начало и снятие питания керамической решётки, сохранив сдержанную мощность. Стендовая подготовка дороже, зато ускоряет сравнение запросов; простые движущиеся отметки можно исследовать более длительной серией при нынешнем расположении сосудов и измерителей."
 HSM_BAR_mtk_empty_vessel_experiment_report_b_0:0 "УСТАНОВКА: След над краем. Неактивная надпись.\n\nРаботающая решётка ненадолго даёт движущуюся нить, затем теряет связность. Неактивный сосуд остаётся тихим рядом с коротким активным проявлением. Серии нужен проверенный короткий промежуток, без признания дополнительной мощности доказательством большей устойчивости проявления.\n\nДополнение к журналу испытаний\nРазнесённые опыты сохранили короткие появления среди многих тихих и распавшихся попыток. Неактивные надписи не дали соответствующей нити в принятом сравнении сосудов. Результат краток и частичен, без живых носителей. Лишняя мощность ухудшила его; Контакт может проверять обмен, не предполагая воплощения или личности."
 HSM_BAR_mtk_empty_vessel_verification_b_0:0 "Работающая решётка ненадолго даёт движущуюся нить, затем теряет связность. Неактивный сосуд остаётся тихим рядом с коротким активным проявлением. Серии нужен проверенный короткий промежуток, без признания дополнительной мощности доказательством большей устойчивости проявления.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить охлаждённую серию\nСохранить расположение сосудов и разнести дальнейшие сравнения полным охлаждением между попытками. Это требует меньше новых приспособлений, но дольше занимает изменённые запросы; простые появления нуждаются в меньшей подготовке перед сравнением неактивных записей и колебаний стола."
 HSM_BAR_mtk_empty_vessel_observation_1:0 "Работающая решётка ненадолго даёт движущуюся нить, затем теряет связность. Записанные колебания стола пока не объясняют движения возникшей нити. Серии нужен проверенный короткий промежуток, без признания дополнительной мощности доказательством большей устойчивости проявления."
 HSM_BAR_mtk_empty_vessel_experiment_report_a_1:0 "УСТАНОВКА: След над краем. Колебания стола.\n\nРаботающая решётка ненадолго даёт движущуюся нить, затем теряет связность. Записанные колебания стола пока не объясняют движения возникшей нити. Серии нужен проверенный короткий промежуток, без признания дополнительной мощности доказательством большей устойчивости проявления.\n\nДополнение к журналу испытаний\nИсправленный промежуток записал короткую нить, не продлив её пребывания. Короткое движение не следовало измеренным обычным колебаниям стола под сосудом. Короткие проявления возникают лишь иногда, без живых носителей. Постоянное пребывание и личность не подтверждены; лишняя мощность нагревает сосуд и ухудшает связность."
 HSM_BAR_mtk_empty_vessel_verification_a_1:0 "Работающая решётка ненадолго даёт движущуюся нить, затем теряет связность. Записанные колебания стола пока не объясняют движения возникшей нити. Серии нужен проверенный короткий промежуток, без признания дополнительной мощности доказательством большей устойчивости проявления.\n\nНАЗНАЧЕНА ПРОВЕРКА: Уточнить время питания\nЗаказать более ясные начало и снятие питания керамической решётки, сохранив сдержанную мощность. Стендовая подготовка дороже, зато ускоряет сравнение запросов; простые движущиеся отметки можно исследовать более длительной серией при нынешнем расположении сосудов и измерителей."
 HSM_BAR_mtk_empty_vessel_experiment_report_b_1:0 "УСТАНОВКА: След над краем. Колебания стола.\n\nРаботающая решётка ненадолго даёт движущуюся нить, затем теряет связность. Записанные колебания стола пока не объясняют движения возникшей нити. Серии нужен проверенный короткий промежуток, без признания дополнительной мощности доказательством большей устойчивости проявления.\n\nДополнение к журналу испытаний\nРазнесённые опыты сохранили короткие появления среди многих тихих и распавшихся попыток. Короткое движение не следовало измеренным обычным колебаниям стола под сосудом. Результат краток и частичен, без живых носителей. Лишняя мощность ухудшила его; Контакт может проверять обмен, не предполагая воплощения или личности."
 HSM_BAR_mtk_empty_vessel_verification_b_1:0 "Работающая решётка ненадолго даёт движущуюся нить, затем теряет связность. Записанные колебания стола пока не объясняют движения возникшей нити. Серии нужен проверенный короткий промежуток, без признания дополнительной мощности доказательством большей устойчивости проявления.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить охлаждённую серию\nСохранить расположение сосудов и разнести дальнейшие сравнения полным охлаждением между попытками. Это требует меньше новых приспособлений, но дольше занимает изменённые запросы; простые появления нуждаются в меньшей подготовке перед сравнением неактивных записей и колебаний стола."
 HSM_BAR_mtk_empty_vessel_observation_2:0 "Изменённый запрос предшествует новой отметке, но промежуток заканчивается до повтора. Неактивный сосуд остаётся тихим рядом с коротким активным проявлением. Серии нужен проверенный короткий промежуток, без признания дополнительной мощности доказательством большей устойчивости проявления."
 HSM_BAR_mtk_empty_vessel_experiment_report_a_2:0 "УСТАНОВКА: Смена запроса. Неактивная надпись.\n\nИзменённый запрос предшествует новой отметке, но промежуток заканчивается до повтора. Неактивный сосуд остаётся тихим рядом с коротким активным проявлением. Серии нужен проверенный короткий промежуток, без признания дополнительной мощности доказательством большей устойчивости проявления.\n\nДополнение к журналу испытаний\nИсправленный промежуток позволил сравнить отдельные отметки запросов до распада. Неактивные надписи не дали соответствующей нити в принятом сравнении сосудов. Короткие проявления возникают лишь иногда, без живых носителей. Постоянное пребывание и личность не подтверждены; лишняя мощность нагревает сосуд и ухудшает связность."
 HSM_BAR_mtk_empty_vessel_verification_a_2:0 "Изменённый запрос предшествует новой отметке, но промежуток заканчивается до повтора. Неактивный сосуд остаётся тихим рядом с коротким активным проявлением. Серии нужен проверенный короткий промежуток, без признания дополнительной мощности доказательством большей устойчивости проявления.\n\nНАЗНАЧЕНА ПРОВЕРКА: Уточнить время питания\nЗаказать более ясные начало и снятие питания керамической решётки, сохранив сдержанную мощность. Стендовая подготовка дороже, зато ускоряет сравнение запросов; простые движущиеся отметки можно исследовать более длительной серией при нынешнем расположении сосудов и измерителей."
 HSM_BAR_mtk_empty_vessel_experiment_report_b_2:0 "УСТАНОВКА: Смена запроса. Неактивная надпись.\n\nИзменённый запрос предшествует новой отметке, но промежуток заканчивается до повтора. Неактивный сосуд остаётся тихим рядом с коротким активным проявлением. Серии нужен проверенный короткий промежуток, без признания дополнительной мощности доказательством большей устойчивости проявления.\n\nДополнение к журналу испытаний\nРазнесённые запросы сохранили редкие отметки, не установив постоянного собеседника. Неактивные надписи не дали соответствующей нити в принятом сравнении сосудов. Результат краток и частичен, без живых носителей. Лишняя мощность ухудшила его; Контакт может проверять обмен, не предполагая воплощения или личности."
