 HSM_BAR_mtk_interrupt_notation_rig_question:0 "Какая письменная последовательность получит собственное завершение?"
 HSM_BAR_mtk_interrupt_notation_prepare_rig_a:0 "Начальная световая схема"
 HSM_BAR_mtk_interrupt_notation_prepare_rig_a_tt:0 "Добавить точки прерывания к воспроизведённому начальному световому упражнению. Поместить нужный промежуток отвода рядом с просьбой остановки: понятное указание должно отличать разрешение остановиться от доказательства того, что поле действительно вернулось к покою."
 HSM_BAR_mtk_interrupt_notation_prepare_rig_b:0 "Обмен ритуальной схемой"
 HSM_BAR_mtk_interrupt_notation_prepare_rig_b_tt:0 "Передать другому преподавателю измеренную поддерживаемую последовательность без устных объяснений автора. Сохранить независимое прерывание помощника, проверяя, переносит ли запись завершение при различиях учебного ритма и личной привычки исполнения чар новым участником."
 HSM_BAR_mtk_interrupt_notation_control_question:0 "Какая копия проверит чтение помощника?"
 HSM_BAR_mtk_interrupt_notation_prepare_control_a:0 "Проверенные знаки отвода"
 HSM_BAR_mtk_interrupt_notation_prepare_control_a_tt:0 "Выдать опорную копию с отдельными знаками просьбы остановки и измеренного возврата к исходному уровню. Помощник определяет оба до исполнения, связывая читаемые условия Вииры с независимо проверяемым завершением по методу Асинти."
 HSM_BAR_mtk_interrupt_notation_prepare_control_b:0 "Изменённый знак"
 HSM_BAR_mtk_interrupt_notation_prepare_control_b_tt:0 "Изменить знак отвода на явно обозначенной сравнительной копии и сверить до начала. Разногласие останавливает подготовку до согласования страниц, не позволяя заклинателю молча исправить нотацию по собственной памяти о правильном исполнении."
 HSM_BAR_mtk_interrupt_notation_observation_0:0 "Световой лист называет просьбу остановки, но оставляет возврат к исходному уровню неясным. Опорные знаки требуют от помощника различить просьбу и измеренное завершение. Странице нужно однозначное завершение, которое другой читатель сможет проверить независимо от автора."
 HSM_BAR_mtk_interrupt_notation_experiment_report_a_0:0 "УСТАНОВКА: Начальная световая схема. Проверенные знаки отвода.\n\nСветовой лист называет просьбу остановки, но оставляет возврат к исходному уровню неясным. Опорные знаки требуют от помощника различить просьбу и измеренное завершение. Странице нужно однозначное завершение, которое другой читатель сможет проверить независимо от автора.\n\nДополнение к журналу испытаний\nИсправленные световые знаки отделили просьбу от проверенного завершения. Раздельные опорные знаки отличили запрошенную остановку от измеренного возврата поля. Нотация соединена с Тормозом для измеренных ритуалов. Незнакомым последовательностям нужны опыты; знаки не изгоняют независимых существ и не обезвреживают опасных процедур."
 HSM_BAR_mtk_interrupt_notation_verification_a_0:0 "Световой лист называет просьбу остановки, но оставляет возврат к исходному уровню неясным. Опорные знаки требуют от помощника различить просьбу и измеренное завершение. Странице нужно однозначное завершение, которое другой читатель сможет проверить независимо от автора.\n\nНАЗНАЧЕНА ПРОВЕРКА: Перерисовать завершение\nЗаказать отдельные знаки завершения и согласовать их с измеренным промежутком отвода. Это требует больших расходов на схемы, зато быстрее проясняет переданную партитуру; начальное упражнение может проверить знакомую последовательность через более долгий обмен учебными копиями."
 HSM_BAR_mtk_interrupt_notation_experiment_report_b_0:0 "УСТАНОВКА: Начальная световая схема. Проверенные знаки отвода.\n\nСветовой лист называет просьбу остановки, но оставляет возврат к исходному уровню неясным. Опорные знаки требуют от помощника различить просьбу и измеренное завершение. Странице нужно однозначное завершение, которое другой читатель сможет проверить независимо от автора.\n\nДополнение к журналу испытаний\nОбмен световыми копиями сделал проверенное завершение помощника воспроизводимым. Раздельные опорные знаки отличили запрошенную остановку от измеренного возврата поля. Письменное завершение успешно в измеренных семействах ритуалов. Незнакомым последовательностям нужны испытания; знаки не подавляют всю магию и не дают власти над независимыми существами."
 HSM_BAR_mtk_interrupt_notation_verification_b_0:0 "Световой лист называет просьбу остановки, но оставляет возврат к исходному уровню неясным. Опорные знаки требуют от помощника различить просьбу и измеренное завершение. Странице нужно однозначное завершение, которое другой читатель сможет проверить независимо от автора.\n\nНАЗНАЧЕНА ПРОВЕРКА: Обменяться копиями\nСохранить знаки и продлить независимые уроки со сбором вопросов до исполнения. Это экономит новую чертёжную работу, но дольше занимает незнакомую поддерживаемую схему; начальная световая последовательность уже даёт проверенное упражнение для сравнения просьбы и завершения."
 HSM_BAR_mtk_interrupt_notation_observation_1:0 "Световой лист называет просьбу остановки, но оставляет возврат к исходному уровню неясным. Изменённый знак расходится с опорным; подготовка останавливается до исполнения. Странице нужно однозначное завершение, которое другой читатель сможет проверить независимо от автора."
 HSM_BAR_mtk_interrupt_notation_experiment_report_a_1:0 "УСТАНОВКА: Начальная световая схема. Изменённый знак.\n\nСветовой лист называет просьбу остановки, но оставляет возврат к исходному уровню неясным. Изменённый знак расходится с опорным; подготовка останавливается до исполнения. Странице нужно однозначное завершение, которое другой читатель сможет проверить независимо от автора.\n\nДополнение к журналу испытаний\nИсправленные световые знаки отделили просьбу от проверенного завершения. Изменённую копию исправили до возобновления какого-либо принимаемого исполнения упражнения. Нотация соединена с Тормозом для измеренных ритуалов. Незнакомым последовательностям нужны опыты; знаки не изгоняют независимых существ и не обезвреживают опасных процедур."
 HSM_BAR_mtk_interrupt_notation_verification_a_1:0 "Световой лист называет просьбу остановки, но оставляет возврат к исходному уровню неясным. Изменённый знак расходится с опорным; подготовка останавливается до исполнения. Странице нужно однозначное завершение, которое другой читатель сможет проверить независимо от автора.\n\nНАЗНАЧЕНА ПРОВЕРКА: Перерисовать завершение\nЗаказать отдельные знаки завершения и согласовать их с измеренным промежутком отвода. Это требует больших расходов на схемы, зато быстрее проясняет переданную партитуру; начальное упражнение может проверить знакомую последовательность через более долгий обмен учебными копиями."
 HSM_BAR_mtk_interrupt_notation_experiment_report_b_1:0 "УСТАНОВКА: Начальная световая схема. Изменённый знак.\n\nСветовой лист называет просьбу остановки, но оставляет возврат к исходному уровню неясным. Изменённый знак расходится с опорным; подготовка останавливается до исполнения. Странице нужно однозначное завершение, которое другой читатель сможет проверить независимо от автора.\n\nДополнение к журналу испытаний\nОбмен световыми копиями сделал проверенное завершение помощника воспроизводимым. Изменённую копию исправили до возобновления какого-либо принимаемого исполнения упражнения. Письменное завершение успешно в измеренных семействах ритуалов. Незнакомым последовательностям нужны испытания; знаки не подавляют всю магию и не дают власти над независимыми существами."
 HSM_BAR_mtk_interrupt_notation_verification_b_1:0 "Световой лист называет просьбу остановки, но оставляет возврат к исходному уровню неясным. Изменённый знак расходится с опорным; подготовка останавливается до исполнения. Странице нужно однозначное завершение, которое другой читатель сможет проверить независимо от автора.\n\nНАЗНАЧЕНА ПРОВЕРКА: Обменяться копиями\nСохранить знаки и продлить независимые уроки со сбором вопросов до исполнения. Это экономит новую чертёжную работу, но дольше занимает незнакомую поддерживаемую схему; начальная световая последовательность уже даёт проверенное упражнение для сравнения просьбы и завершения."
 HSM_BAR_mtk_interrupt_notation_observation_2:0 "Переданная схема выявляет сигнал остановки, иначе понятый незнакомым преподавателем. Опорные знаки требуют от помощника различить просьбу и измеренное завершение. Странице нужно однозначное завершение, которое другой читатель сможет проверить независимо от автора."
 HSM_BAR_mtk_interrupt_notation_experiment_report_a_2:0 "УСТАНОВКА: Обмен ритуальной схемой. Проверенные знаки отвода.\n\nПереданная схема выявляет сигнал остановки, иначе понятый незнакомым преподавателем. Опорные знаки требуют от помощника различить просьбу и измеренное завершение. Странице нужно однозначное завершение, которое другой читатель сможет проверить независимо от автора.\n\nДополнение к журналу испытаний\nИсправленные знаки схемы позволили новому преподавателю определить то же завершение. Раздельные опорные знаки отличили запрошенную остановку от измеренного возврата поля. Нотация соединена с Тормозом для измеренных ритуалов. Незнакомым последовательностям нужны опыты; знаки не изгоняют независимых существ и не обезвреживают опасных процедур."
 HSM_BAR_mtk_interrupt_notation_verification_a_2:0 "Переданная схема выявляет сигнал остановки, иначе понятый незнакомым преподавателем. Опорные знаки требуют от помощника различить просьбу и измеренное завершение. Странице нужно однозначное завершение, которое другой читатель сможет проверить независимо от автора.\n\nНАЗНАЧЕНА ПРОВЕРКА: Перерисовать завершение\nЗаказать отдельные знаки завершения и согласовать их с измеренным промежутком отвода. Это требует больших расходов на схемы, зато быстрее проясняет переданную партитуру; начальное упражнение может проверить знакомую последовательность через более долгий обмен учебными копиями."
 HSM_BAR_mtk_interrupt_notation_experiment_report_b_2:0 "УСТАНОВКА: Обмен ритуальной схемой. Проверенные знаки отвода.\n\nПереданная схема выявляет сигнал остановки, иначе понятый незнакомым преподавателем. Опорные знаки требуют от помощника различить просьбу и измеренное завершение. Странице нужно однозначное завершение, которое другой читатель сможет проверить независимо от автора.\n\nДополнение к журналу испытаний\nОбмен поддерживаемыми схемами установил завершение без ритма первоначального автора. Раздельные опорные знаки отличили запрошенную остановку от измеренного возврата поля. Письменное завершение успешно в измеренных семействах ритуалов. Незнакомым последовательностям нужны испытания; знаки не подавляют всю магию и не дают власти над независимыми существами."
 HSM_BAR_mtk_interrupt_notation_verification_b_2:0 "Переданная схема выявляет сигнал остановки, иначе понятый незнакомым преподавателем. Опорные знаки требуют от помощника различить просьбу и измеренное завершение. Странице нужно однозначное завершение, которое другой читатель сможет проверить независимо от автора.\n\nНАЗНАЧЕНА ПРОВЕРКА: Обменяться копиями\nСохранить знаки и продлить независимые уроки со сбором вопросов до исполнения. Это экономит новую чертёжную работу, но дольше занимает незнакомую поддерживаемую схему; начальная световая последовательность уже даёт проверенное упражнение для сравнения просьбы и завершения."
