 HSM_BAR_mtk_tissue_bank_experiment_report_b_2:0 "УСТАНОВКА: Сравнение целой почки. Только холод.\n\nЦелые почки выглядят сохранными, но после согревания жидкость уходит через мельчайшие каналы. Образцы только на холоде показывают ненадёжность внешнего вида для оценки последующей пригодности. Шкафу нужна приёмка после согревания с раздельным учётом классов тканей на всём протяжении проверки.\n\nДополнение к журналу испытаний\nПродлённое наблюдение не восстановило почки; принятый запас остался ограничен тонкими трансплантатами. Сравнение только с холодом подтвердило ограниченный вклад совместных холода и фиксации. Отобранные кожа и сухожилия хранятся в проверенный срок, без универсального запаса органов. Записи доноров и осмотр партий неотделимы от хранения. Последняя минута получит проверенные трансплантаты, а не предположение, что красивая сохранная ткань жива."
 HSM_BAR_mtk_tissue_bank_verification_b_2:0 "Целые почки выглядят сохранными, но после согревания жидкость уходит через мельчайшие каналы. Образцы только на холоде показывают ненадёжность внешнего вида для оценки последующей пригодности. Шкафу нужна приёмка после согревания с раздельным учётом классов тканей на всём протяжении проверки.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить осмотр тканей\nСохранить шкафы и наблюдать те же партии при согревании и последующих осмотрах. Это экономит новые приспособления проверки, но дольше исключает целые органы с обещающим видом; тонкие трансплантаты раньше дают более ясное ограниченное сравнение."
 HSM_BAR_mtk_tissue_bank_observation_3:0 "Целые почки выглядят сохранными, но после согревания жидкость уходит через мельчайшие каналы. Образцы только с фиксацией ещё отвечают чарам там, где обычная живая функция сомнительна. Шкафу нужна приёмка после согревания с раздельным учётом классов тканей на всём протяжении проверки."
 HSM_BAR_mtk_tissue_bank_experiment_report_a_3:0 "УСТАНОВКА: Сравнение целой почки. Только фиксация.\n\nЦелые почки выглядят сохранными, но после согревания жидкость уходит через мельчайшие каналы. Образцы только с фиксацией ещё отвечают чарам там, где обычная живая функция сомнительна. Шкафу нужна приёмка после согревания с раздельным учётом классов тканей на всём протяжении проверки.\n\nДополнение к журналу испытаний\nОтдельная проверка органов подтвердила провал кровообращения почек вопреки привлекательному виду образцов. Сравнение только с фиксацией показало, почему магический ответ не заменяет осмотра после согревания. Банк остаётся частичным успехом для отобранных кожи и сухожилий в проверенный срок. Каждой партии нужен осмотр после согревания; целые почки провалились. Сердца и мозг не входят в доказанный запас, неудачный трансплантат остаётся в учёте."
 HSM_BAR_mtk_tissue_bank_verification_a_3:0 "Целые почки выглядят сохранными, но после согревания жидкость уходит через мельчайшие каналы. Образцы только с фиксацией ещё отвечают чарам там, где обычная живая функция сомнительна. Шкафу нужна приёмка после согревания с раздельным учётом классов тканей на всём протяжении проверки.\n\nНАЗНАЧЕНА ПРОВЕРКА: Пересобрать приёмку\nЗаказать раздельные проверки согревания и проходимости каждого класса тканей. Осмотр дороже, зато быстрее проясняет обманчивый вид органов; партии тонких трансплантатов могут установить ограниченный срок через более длительную серию хранения с имеющимся оборудованием шкафа."
 HSM_BAR_mtk_tissue_bank_experiment_report_b_3:0 "УСТАНОВКА: Сравнение целой почки. Только фиксация.\n\nЦелые почки выглядят сохранными, но после согревания жидкость уходит через мельчайшие каналы. Образцы только с фиксацией ещё отвечают чарам там, где обычная живая функция сомнительна. Шкафу нужна приёмка после согревания с раздельным учётом классов тканей на всём протяжении проверки.\n\nДополнение к журналу испытаний\nПродлённое наблюдение не восстановило почки; принятый запас остался ограничен тонкими трансплантатами. Сравнение только с фиксацией показало, почему магический ответ не заменяет осмотра после согревания. Отобранные кожа и сухожилия хранятся в проверенный срок, без универсального запаса органов. Записи доноров и осмотр партий неотделимы от хранения. Последняя минута получит проверенные трансплантаты, а не предположение, что красивая сохранная ткань жива."
 HSM_BAR_mtk_tissue_bank_verification_b_3:0 "Целые почки выглядят сохранными, но после согревания жидкость уходит через мельчайшие каналы. Образцы только с фиксацией ещё отвечают чарам там, где обычная живая функция сомнительна. Шкафу нужна приёмка после согревания с раздельным учётом классов тканей на всём протяжении проверки.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить осмотр тканей\nСохранить шкафы и наблюдать те же партии при согревании и последующих осмотрах. Это экономит новые приспособления проверки, но дольше исключает целые органы с обещающим видом; тонкие трансплантаты раньше дают более ясное ограниченное сравнение."
