 HSM_BAR_mtk_prosthetics_rig_question:0 "Какое движение первым проверит требования к креплению?"
 HSM_BAR_mtk_prosthetics_prepare_rig_a:0 "Прогулка по двору"
 HSM_BAR_mtk_prosthetics_prepare_rig_a_tt:0 "Подогнать протез для согласованного маршрута по двору рядом с прежней опорой носителя. Отмечать изменения поддержки при повороте и остановке, не принимая прямой показ за полную проверку повседневного движения."
 HSM_BAR_mtk_prosthetics_prepare_rig_b:0 "Работа сидя"
 HSM_BAR_mtk_prosthetics_prepare_rig_b_tt:0 "Начать с посадки и работы за верстаком. Чертёж должен учитывать настоящую позу носителя: опора, правильно выглядящая стоя, может иначе давить при сгибании крепления во время обычного рабочего движения."
 HSM_BAR_mtk_prosthetics_control_question:0 "Кто проверит, выдержит ли результат обычное использование?"
 HSM_BAR_mtk_prosthetics_prepare_control_a:0 "Осмотр после отдыха"
 HSM_BAR_mtk_prosthetics_prepare_control_a_tt:0 "Сильвер сравнит усталость и состояние кожи до движения и после отдыха. В запись входит самостоятельная остановка носителя, чтобы выполненная задача не скрывала неудобства или зависимости от помощи самого изобретателя."
 HSM_BAR_mtk_prosthetics_prepare_control_b:0 "Незнакомый мастер"
 HSM_BAR_mtk_prosthetics_prepare_control_b_tt:0 "Попросить другого мастера заменить учебную деталь только по чертежу. Отделить сменную часть от личного крепления, которое нельзя незаметно затягивать ради видимости универсального соответствия образца любому телу нового носителя."
 HSM_BAR_mtk_prosthetics_observation_0:0 "Маршрут по двору пройден, однако поворот нагружает личное крепление иначе, чем прямой участок этой же прогулки. После отдыха Сильвер находит болезненное место контакта, хотя носитель мог самостоятельно остановить движение с магической помощью. Крепление и его инструкции требуют исправления, прежде чем воспроизводимое движение можно будет признать пригодным для последующего обслуживания в обычной местной мастерской."
 HSM_BAR_mtk_prosthetics_experiment_report_a_0:0 "УСТАНОВКА: Прогулка по двору. Осмотр после отдыха.\n\nМаршрут по двору пройден, однако поворот нагружает личное крепление иначе, чем прямой участок этой же прогулки. После отдыха Сильвер находит болезненное место контакта, хотя носитель мог самостоятельно остановить движение с магической помощью. Крепление и его инструкции требуют исправления, прежде чем воспроизводимое движение можно будет признать пригодным для последующего обслуживания в обычной местной мастерской.\n\nДополнение к журналу испытаний\nПрогулочное крепление ослабили в месте контакта при повороте, после чего маршрут по двору успешно повторили. Осмотры после отдыха подтвердили исправленное прилегание, сохранив повторные посещения обязательной частью принятого описания протеза. Протез успешен для записанных крепления и движений; сменные детали может поставить обычная мастерская. Чувствительность не восстановлена, износ сохраняется. Другим формам конечности нужны отдельные образцы; посещения для подгонки остаются частью устройства, а не необязательным уходом."
 HSM_BAR_mtk_prosthetics_verification_a_0:0 "Маршрут по двору пройден, однако поворот нагружает личное крепление иначе, чем прямой участок этой же прогулки. После отдыха Сильвер находит болезненное место контакта, хотя носитель мог самостоятельно остановить движение с магической помощью. Крепление и его инструкции требуют исправления, прежде чем воспроизводимое движение можно будет признать пригодным для последующего обслуживания в обычной местной мастерской.\n\nНАЗНАЧЕНА ПРОВЕРКА: Подогнать крепление\nПеределать личное прилегание и повторить указанное движение. Это оплачивает быструю мастерскую подгонку, особенно сидячего края; прогулочный образец, уже близкий к чертежу, можно вместо этого проверить через более длительную последовательность осмотров крепления."
 HSM_BAR_mtk_prosthetics_experiment_report_b_0:0 "УСТАНОВКА: Прогулка по двору. Осмотр после отдыха.\n\nМаршрут по двору пройден, однако поворот нагружает личное крепление иначе, чем прямой участок этой же прогулки. После отдыха Сильвер находит болезненное место контакта, хотя носитель мог самостоятельно остановить движение с магической помощью. Крепление и его инструкции требуют исправления, прежде чем воспроизводимое движение можно будет признать пригодным для последующего обслуживания в обычной местной мастерской.\n\nДополнение к журналу испытаний\nПовторные прогулочные осмотры выявили давление при повороте и закрепили проверенную местную подгонку в рабочем чертеже. Осмотры после отдыха подтвердили исправленное прилегание, сохранив повторные посещения обязательной частью принятого описания протеза. Принят обслуживаемый механический помощник для согласованных задач. Другому телу по-прежнему требуется собственное крепление, а неудобство может потребовать новой подгонки. Из успешной замены мастерской детали не следуют ни естественное осязание, ни свобода от последующего износа протеза."
 HSM_BAR_mtk_prosthetics_verification_b_0:0 "Маршрут по двору пройден, однако поворот нагружает личное крепление иначе, чем прямой участок этой же прогулки. После отдыха Сильвер находит болезненное место контакта, хотя носитель мог самостоятельно остановить движение с магической помощью. Крепление и его инструкции требуют исправления, прежде чем воспроизводимое движение можно будет признать пригодным для последующего обслуживания в обычной местной мастерской.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить примерки\nСохранить нынешние детали и дополнить запись движений осмотрами после отдыха. Это уменьшает расходы на переделку, но требует больше времени при давлении сидя; знакомому маршруту прогулки нужно меньше исправлений, прежде чем его воспроизведёт другой мастер."
 HSM_BAR_mtk_prosthetics_observation_1:0 "Маршрут по двору пройден, однако поворот нагружает личное крепление иначе, чем прямой участок этой же прогулки. Незнакомый мастер заменяет мастерскую деталь, но не может подтвердить предполагаемую позу по имеющемуся у него чертежу. Крепление и его инструкции требуют исправления, прежде чем воспроизводимое движение можно будет признать пригодным для последующего обслуживания в обычной местной мастерской."
