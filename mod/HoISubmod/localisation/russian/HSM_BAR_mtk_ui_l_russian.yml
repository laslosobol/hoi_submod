 HSM_BAR_mtk_shared_senses_experiment_report_b_3:0 "УСТАНОВКА: Движущийся контур. Воображаемая карточка.\n\nДвижущаяся карточка вызывает противоположные отметки направления; получатель прерывает сеанс, когда переданное движение начинает противоречить видимой комнате. Воображаемые карточки вызывают особенно уверенные названия цветов, но расходятся с контурами, нарисованными при непосредственном взгляде. Связи нужен более узкий передаваемый признак или более длительное сравнение, прежде чем эти впечатления можно будет считать пригодным обменом.\n\nДополнение к журналу испытаний\nПосле прерванных сеансов с движением отдельные повторы с неподвижной карточкой восстановили согласие только по контуру. Воображаемые карточки остались ненадёжными и были исключены из принятой процедуры передачи непосредственно видимого. Сравнение подтверждает передачу отдельных неподвижных признаков, а не общего сознания. Сеансы остаются короткими и местными, с возможностью выхода каждого участника. Несогласующиеся рисунки хранятся раздельно; сводное изображение не должно скрывать пределы частично успешного опыта."
 HSM_BAR_mtk_shared_senses_verification_b_3:0 "Движущаяся карточка вызывает противоположные отметки направления; получатель прерывает сеанс, когда переданное движение начинает противоречить видимой комнате. Воображаемые карточки вызывают особенно уверенные названия цветов, но расходятся с контурами, нарисованными при непосредственном взгляде. Связи нужен более узкий передаваемый признак или более длительное сравнение, прежде чем эти впечатления можно будет считать пригодным обменом.\n\nНАЗНАЧЕНА ПРОВЕРКА: Сопоставить рисунки\nПродлить сеансы с отдыхом и поручить Леопольду сравнить отдельные рисунки до раскрытия подписей. Новых приспособлений потребуется меньше, но после опытов с движением работа займёт дольше: неприятное ощущение завершает сеанс, а не оправдывает его продолжение."
 HSM_BAR_mtk_shared_senses_respond_a:0 "Ограничить образ"
 HSM_BAR_mtk_shared_senses_respond_a_tt:0 "Подготовить неподвижную контурную маску и заново настроить передаваемый признак. Дополнительная работа с прибором позволяет скорее устранить расхождение движущейся карточки; место с уже неподвижным образцом может прийти к той же ограниченной процедуре дешевле через сравнение.\n\n[GetHSMBARMtkResponseBudget_shared_senses_a]"
