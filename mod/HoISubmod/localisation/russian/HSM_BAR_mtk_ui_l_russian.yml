 HSM_BAR_mtk_field_atlas_accounting:0 "ТЕХНИЧЕСКАЯ СВОДКА\n\n[GetHSMBARMtkEffects]\n\nНовый этап исследования: 25 политической власти; 28 дн.; 1 фабр..\n\n[GetHSMBARMtkTrialBudget_field_atlas]\n\nПосле первой серии потребуется выбрать дополнительную проверку. Её стоимость и срок указаны в подсказке соответствующего действия. Фабрики остаются заняты до завершения или отмены."
