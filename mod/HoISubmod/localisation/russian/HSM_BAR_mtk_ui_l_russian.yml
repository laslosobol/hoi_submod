 HSM_BAR_mtk_ageless_sleep_rig_question:0 "На какой серии культур проверить обратимую паузу?"
 HSM_BAR_mtk_ageless_sleep_prepare_rig_a:0 "Одна наблюдаемая пауза"
 HSM_BAR_mtk_ageless_sleep_prepare_rig_a_tt:0 "Применить предполагаемую паузу к парным живым культурам и наблюдать после снятия. Питание до и после остаётся одинаковым, чтобы неподвижную поверхность не приняли за сохранённую способность расти и восстанавливаться."
 HSM_BAR_mtk_ageless_sleep_prepare_rig_b:0 "Повторные паузы"
 HSM_BAR_mtk_ageless_sleep_prepare_rig_b_tt:0 "Проследить культуры через повторные паузы, сохраняя все записи восстановления. Гипотеза требует сохранённой функции после каждого снятия; накапливающееся повреждение должно оставаться видимым, даже если обработанные образцы внешне кажутся совсем неизменными."
 HSM_BAR_mtk_ageless_sleep_control_question:0 "Чем проверить видимость остановленного старения?"
 HSM_BAR_mtk_ageless_sleep_prepare_control_a:0 "Культуры того же возраста"
 HSM_BAR_mtk_ageless_sleep_prepare_control_a_tt:0 "Сохранить необработанные культуры на тот же общий срок и сравнить рост после снятия. Их обычное старение даёт нужное сравнение вместо красивого снимка обработанной чашки в самый неподвижный момент опыта."
 HSM_BAR_mtk_ageless_sleep_prepare_control_b:0 "Скрытые подписи проб"
 HSM_BAR_mtk_ageless_sleep_prepare_control_b_tt:0 "Передать другому наблюдателю восстанавливающиеся образцы без подписей обработки. Отдельно запросить повреждения и возобновление функции, чтобы личность предпочтительной пробы не меняла критериев успешного восстановления после предполагаемой остановки её живых процессов."
 HSM_BAR_mtk_ageless_sleep_observation_0:0 "После одной паузы неподвижные культуры не показывают уверенного роста при снятии чар. Необработанные культуры продолжают расти на протяжении того же срока. Восстановление нужно проверить, прежде чем неподвижность станет основанием для утверждения о безопасно отложенном старении."
 HSM_BAR_mtk_ageless_sleep_experiment_report_a_0:0 "УСТАНОВКА: Одна наблюдаемая пауза. Культуры того же возраста.\n\nПосле одной паузы неподвижные культуры не показывают уверенного роста при снятии чар. Необработанные культуры продолжают расти на протяжении того же срока. Восстановление нужно проверить, прежде чем неподвижность станет основанием для утверждения о безопасно отложенном старении.\n\nДополнение к журналу испытаний\nПовторный осмотр подтвердил нарушение роста после единственной паузы. Сравнение по общему сроку не показало безопасной отсрочки старения. Гипотеза провалилась: повреждённые культуры не дали лечения или улучшенного хранения. Опыты на целом организме отменены; Последняя минута должна поддерживать живые процессы."
 HSM_BAR_mtk_ageless_sleep_verification_a_0:0 "После одной паузы неподвижные культуры не показывают уверенного роста при снятии чар. Необработанные культуры продолжают расти на протяжении того же срока. Восстановление нужно проверить, прежде чем неподвижность станет основанием для утверждения о безопасно отложенном старении.\n\nНАЗНАЧЕНА ПРОВЕРКА: Проверить восстановление\nЗаказать второй осмотр освобождённых культур и записей повреждений. Это требует больших текущих расходов, зато быстрее проясняет повторные паузы; серию с одной паузой можно вместо этого дольше наблюдать в прежних чашках теми же силами."
 HSM_BAR_mtk_ageless_sleep_experiment_report_b_0:0 "УСТАНОВКА: Одна наблюдаемая пауза. Культуры того же возраста.\n\nПосле одной паузы неподвижные культуры не показывают уверенного роста при снятии чар. Необработанные культуры продолжают расти на протяжении того же срока. Восстановление нужно проверить, прежде чем неподвижность станет основанием для утверждения о безопасно отложенном старении.\n\nДополнение к журналу испытаний\nПродлённое наблюдение не восстановило нормального роста после единственной паузы. Сравнение по общему сроку не показало безопасной отсрочки старения. Сон без старости провалился без лечебного применения или способа хранения. Неподвижность оказалась повреждением, а не молодостью. Пациентам процедуру не предложат."
 HSM_BAR_mtk_ageless_sleep_verification_b_0:0 "После одной паузы неподвижные культуры не показывают уверенного роста при снятии чар. Необработанные культуры продолжают расти на протяжении того же срока. Восстановление нужно проверить, прежде чем неподвижность станет основанием для утверждения о безопасно отложенном старении.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить наблюдение\nПоддерживать обычное питание и дольше наблюдать культуры после снятия чар. Прежние чашки уменьшают расходы, но повторное повреждение дольше приходится отличать от задержанного роста; одна пауза оставляет более простой для наблюдения ход восстановления."
 HSM_BAR_mtk_ageless_sleep_observation_1:0 "После одной паузы неподвижные культуры не показывают уверенного роста при снятии чар. Второй наблюдатель записывает повреждения, ещё не зная, какие образцы подвергались обработке. Восстановление нужно проверить, прежде чем неподвижность станет основанием для утверждения о безопасно отложенном старении."
 HSM_BAR_mtk_ageless_sleep_experiment_report_a_1:0 "УСТАНОВКА: Одна наблюдаемая пауза. Скрытые подписи проб.\n\nПосле одной паузы неподвижные культуры не показывают уверенного роста при снятии чар. Второй наблюдатель записывает повреждения, ещё не зная, какие образцы подвергались обработке. Восстановление нужно проверить, прежде чем неподвижность станет основанием для утверждения о безопасно отложенном старении.\n\nДополнение к журналу испытаний\nПовторный осмотр подтвердил нарушение роста после единственной паузы. Скрытые подписи дали ту же неблагоприятную оценку последующего восстановления культур. Гипотеза провалилась: повреждённые культуры не дали лечения или улучшенного хранения. Опыты на целом организме отменены; Последняя минута должна поддерживать живые процессы."
 HSM_BAR_mtk_ageless_sleep_verification_a_1:0 "После одной паузы неподвижные культуры не показывают уверенного роста при снятии чар. Второй наблюдатель записывает повреждения, ещё не зная, какие образцы подвергались обработке. Восстановление нужно проверить, прежде чем неподвижность станет основанием для утверждения о безопасно отложенном старении.\n\nНАЗНАЧЕНА ПРОВЕРКА: Проверить восстановление\nЗаказать второй осмотр освобождённых культур и записей повреждений. Это требует больших текущих расходов, зато быстрее проясняет повторные паузы; серию с одной паузой можно вместо этого дольше наблюдать в прежних чашках теми же силами."
 HSM_BAR_mtk_ageless_sleep_experiment_report_b_1:0 "УСТАНОВКА: Одна наблюдаемая пауза. Скрытые подписи проб.\n\nПосле одной паузы неподвижные культуры не показывают уверенного роста при снятии чар. Второй наблюдатель записывает повреждения, ещё не зная, какие образцы подвергались обработке. Восстановление нужно проверить, прежде чем неподвижность станет основанием для утверждения о безопасно отложенном старении.\n\nДополнение к журналу испытаний\nПродлённое наблюдение не восстановило нормального роста после единственной паузы. Скрытые подписи дали ту же неблагоприятную оценку последующего восстановления культур. Сон без старости провалился без лечебного применения или способа хранения. Неподвижность оказалась повреждением, а не молодостью. Пациентам процедуру не предложат."
 HSM_BAR_mtk_ageless_sleep_verification_b_1:0 "После одной паузы неподвижные культуры не показывают уверенного роста при снятии чар. Второй наблюдатель записывает повреждения, ещё не зная, какие образцы подвергались обработке. Восстановление нужно проверить, прежде чем неподвижность станет основанием для утверждения о безопасно отложенном старении.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить наблюдение\nПоддерживать обычное питание и дольше наблюдать культуры после снятия чар. Прежние чашки уменьшают расходы, но повторное повреждение дольше приходится отличать от задержанного роста; одна пауза оставляет более простой для наблюдения ход восстановления."
 HSM_BAR_mtk_ageless_sleep_observation_2:0 "Повторные паузы оставляют всё больше повреждений, хотя внешний вид культур почти не меняется. Необработанные культуры продолжают расти на протяжении того же срока. Восстановление нужно проверить, прежде чем неподвижность станет основанием для утверждения о безопасно отложенном старении."
 HSM_BAR_mtk_ageless_sleep_experiment_report_a_2:0 "УСТАНОВКА: Повторные паузы. Культуры того же возраста.\n\nПовторные паузы оставляют всё больше повреждений, хотя внешний вид культур почти не меняется. Необработанные культуры продолжают расти на протяжении того же срока. Восстановление нужно проверить, прежде чем неподвижность станет основанием для утверждения о безопасно отложенном старении.\n\nДополнение к журналу испытаний\nПовторный осмотр подтвердил усиление повреждений культур при повторении пауз. Сравнение по общему сроку не показало безопасной отсрочки старения. Гипотеза провалилась: повреждённые культуры не дали лечения или улучшенного хранения. Опыты на целом организме отменены; Последняя минута должна поддерживать живые процессы."
 HSM_BAR_mtk_ageless_sleep_verification_a_2:0 "Повторные паузы оставляют всё больше повреждений, хотя внешний вид культур почти не меняется. Необработанные культуры продолжают расти на протяжении того же срока. Восстановление нужно проверить, прежде чем неподвижность станет основанием для утверждения о безопасно отложенном старении.\n\nНАЗНАЧЕНА ПРОВЕРКА: Проверить восстановление\nЗаказать второй осмотр освобождённых культур и записей повреждений. Это требует больших текущих расходов, зато быстрее проясняет повторные паузы; серию с одной паузой можно вместо этого дольше наблюдать в прежних чашках теми же силами."
 HSM_BAR_mtk_ageless_sleep_experiment_report_b_2:0 "УСТАНОВКА: Повторные паузы. Культуры того же возраста.\n\nПовторные паузы оставляют всё больше повреждений, хотя внешний вид культур почти не меняется. Необработанные культуры продолжают расти на протяжении того же срока. Восстановление нужно проверить, прежде чем неподвижность станет основанием для утверждения о безопасно отложенном старении.\n\nДополнение к журналу испытаний\nПродлённое наблюдение оставило культуры после повторных пауз более повреждёнными, чем сравнительные. Сравнение по общему сроку не показало безопасной отсрочки старения. Сон без старости провалился без лечебного применения или способа хранения. Неподвижность оказалась повреждением, а не молодостью. Пациентам процедуру не предложат."
 HSM_BAR_mtk_ageless_sleep_verification_b_2:0 "Повторные паузы оставляют всё больше повреждений, хотя внешний вид культур почти не меняется. Необработанные культуры продолжают расти на протяжении того же срока. Восстановление нужно проверить, прежде чем неподвижность станет основанием для утверждения о безопасно отложенном старении.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить наблюдение\nПоддерживать обычное питание и дольше наблюдать культуры после снятия чар. Прежние чашки уменьшают расходы, но повторное повреждение дольше приходится отличать от задержанного роста; одна пауза оставляет более простой для наблюдения ход восстановления."
 HSM_BAR_mtk_ageless_sleep_observation_3:0 "Повторные паузы оставляют всё больше повреждений, хотя внешний вид культур почти не меняется. Второй наблюдатель записывает повреждения, ещё не зная, какие образцы подвергались обработке. Восстановление нужно проверить, прежде чем неподвижность станет основанием для утверждения о безопасно отложенном старении."
 HSM_BAR_mtk_ageless_sleep_experiment_report_a_3:0 "УСТАНОВКА: Повторные паузы. Скрытые подписи проб.\n\nПовторные паузы оставляют всё больше повреждений, хотя внешний вид культур почти не меняется. Второй наблюдатель записывает повреждения, ещё не зная, какие образцы подвергались обработке. Восстановление нужно проверить, прежде чем неподвижность станет основанием для утверждения о безопасно отложенном старении.\n\nДополнение к журналу испытаний\nПовторный осмотр подтвердил усиление повреждений культур при повторении пауз. Скрытые подписи дали ту же неблагоприятную оценку последующего восстановления культур. Гипотеза провалилась: повреждённые культуры не дали лечения или улучшенного хранения. Опыты на целом организме отменены; Последняя минута должна поддерживать живые процессы."
 HSM_BAR_mtk_ageless_sleep_verification_a_3:0 "Повторные паузы оставляют всё больше повреждений, хотя внешний вид культур почти не меняется. Второй наблюдатель записывает повреждения, ещё не зная, какие образцы подвергались обработке. Восстановление нужно проверить, прежде чем неподвижность станет основанием для утверждения о безопасно отложенном старении.\n\nНАЗНАЧЕНА ПРОВЕРКА: Проверить восстановление\nЗаказать второй осмотр освобождённых культур и записей повреждений. Это требует больших текущих расходов, зато быстрее проясняет повторные паузы; серию с одной паузой можно вместо этого дольше наблюдать в прежних чашках теми же силами."
