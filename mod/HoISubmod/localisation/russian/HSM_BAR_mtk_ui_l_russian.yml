 HSM_BAR_mtk_place_memory_rig_question:0 "Какой камень получит известную последовательность воздействий?"
 HSM_BAR_mtk_place_memory_prepare_rig_a:0 "Кирпичи на стенде"
 HSM_BAR_mtk_place_memory_prepare_rig_a_tt:0 "Подготовить пронумерованные кирпичи с записанными последовательностями нагрева и связывания до осмотра читателями. Отклик материала и воображаемые сцены получают отдельные листы: повторяемый след не обязан содержать связный рассказ о прошедшем воздействии."
 HSM_BAR_mtk_place_memory_prepare_rig_b:0 "Перенесённый кирпич"
 HSM_BAR_mtk_place_memory_prepare_rig_b_tt:0 "Сравнить документированный заменённый кирпич с окружающей кладкой зала. Сохранить мастерское происхождение в закрытом списке обработки: кажущийся древним след мог прибыть вместе с недавно перенесённым камнем и не принадлежать истории этой стены."
 HSM_BAR_mtk_place_memory_control_question:0 "Чем проверить историческое толкование следа?"
 HSM_BAR_mtk_place_memory_prepare_control_a:0 "Обратный порядок чар"
 HSM_BAR_mtk_place_memory_prepare_control_a_tt:0 "Применить те же воздействия в обратном порядке к парному материалу, скрыв подписи. Читатели должны различить последовательность до исторического вывода, а не считать обнаружение любых чар доказательством порядка произошедших на этом камне событий."
 HSM_BAR_mtk_place_memory_prepare_control_b:0 "Сравнение после дождя"
 HSM_BAR_mtk_place_memory_prepare_control_b_tt:0 "Подвергнуть парный камень дождю, сохранив рядом невыветренное сравнение. Записать ослабление следов до вопросов о сценах: погода может удалить часть материального отклика, не выбирая для сохранения правдивое воспоминание о якобы виденном прошлом."
 HSM_BAR_mtk_place_memory_observation_0:0 "Пронумерованные кирпичи повторяют материальный отклик, пока наблюдатели описывают разные сцены. Обратный порядок чар оставляет показания, пока неразличимые между собой. Группе нужно установить материальный след, не превращая его в ничем не подтверждённый рассказ о событиях."
 HSM_BAR_mtk_place_memory_experiment_report_a_0:0 "УСТАНОВКА: Кирпичи на стенде. Обратный порядок чар.\n\nПронумерованные кирпичи повторяют материальный отклик, пока наблюдатели описывают разные сцены. Обратный порядок чар оставляет показания, пока неразличимые между собой. Группе нужно установить материальный след, не превращая его в ничем не подтверждённый рассказ о событиях.\n\nДополнение к журналу испытаний\nИсправленная опись связала стендовый отклик с обработкой, а не со сценами наблюдателей. Обратные воздействия остались неразличимыми как последовательность, хотя прежнюю обработку обнаружить удалось. Обнаружен изменённый материал, а не история. Виновник, обещания и порядок событий по отметкам неизвестны; Контакт должен отделять остаток от ответа."
 HSM_BAR_mtk_place_memory_verification_a_0:0 "Пронумерованные кирпичи повторяют материальный отклик, пока наблюдатели описывают разные сцены. Обратный порядок чар оставляет показания, пока неразличимые между собой. Группе нужно установить материальный след, не превращая его в ничем не подтверждённый рассказ о событиях.\n\nНАЗНАЧЕНА ПРОВЕРКА: Уточнить опись камней\nЗаказать проверенную опись, связывающую каждую пробу с настоящей обработкой и перемещением. Документальная работа дороже, зато быстрее проясняет заменённый кирпич; стендовые образцы уже имеют простую историю, допускающую проверку более длительными независимыми чтениями следов."
 HSM_BAR_mtk_place_memory_experiment_report_b_0:0 "УСТАНОВКА: Кирпичи на стенде. Обратный порядок чар.\n\nПронумерованные кирпичи повторяют материальный отклик, пока наблюдатели описывают разные сцены. Обратный порядок чар оставляет показания, пока неразличимые между собой. Группе нужно установить материальный след, не превращая его в ничем не подтверждённый рассказ о событиях.\n\nДополнение к журналу испытаний\nНезависимые стендовые чтения повторили отметки, не согласовав изображённых фигур. Обратные воздействия остались неразличимыми как последовательность, хотя прежнюю обработку обнаружить удалось. Материальные следы остаются частичным результатом, ограниченным погодой и позднейшим использованием. Съёмка отмечает изменённый камень и неясность, а не подтверждённую историю."
 HSM_BAR_mtk_place_memory_verification_b_0:0 "Пронумерованные кирпичи повторяют материальный отклик, пока наблюдатели описывают разные сцены. Обратный порядок чар оставляет показания, пока неразличимые между собой. Группе нужно установить материальный след, не превращая его в ничем не подтверждённый рассказ о событиях.\n\nНАЗНАЧЕНА ПРОВЕРКА: Повторить чтения\nСохранить пробы и предложить новым читателям зарисовать отклик до открытия списков обработки. Это экономит новую опись, но дольше разбирает перенесённую кладку; пронумерованный стендовый материал позволяет прямо сравнивать повторяемые отметки с воображаемыми сценами наблюдателей."
 HSM_BAR_mtk_place_memory_observation_1:0 "Пронумерованные кирпичи повторяют материальный отклик, пока наблюдатели описывают разные сцены. Дождь неравномерно ослабляет отметку, затрудняя сравнение с защищённой поверхностью камня. Группе нужно установить материальный след, не превращая его в ничем не подтверждённый рассказ о событиях."
 HSM_BAR_mtk_place_memory_experiment_report_a_1:0 "УСТАНОВКА: Кирпичи на стенде. Сравнение после дождя.\n\nПронумерованные кирпичи повторяют материальный отклик, пока наблюдатели описывают разные сцены. Дождь неравномерно ослабляет отметку, затрудняя сравнение с защищённой поверхностью камня. Группе нужно установить материальный след, не превращая его в ничем не подтверждённый рассказ о событиях.\n\nДополнение к журналу испытаний\nИсправленная опись связала стендовый отклик с обработкой, а не со сценами наблюдателей. Дождь ослабил след, не открыв под ним достоверной сцены прошлого. Обнаружен изменённый материал, а не история. Виновник, обещания и порядок событий по отметкам неизвестны; Контакт должен отделять остаток от ответа."
 HSM_BAR_mtk_place_memory_verification_a_1:0 "Пронумерованные кирпичи повторяют материальный отклик, пока наблюдатели описывают разные сцены. Дождь неравномерно ослабляет отметку, затрудняя сравнение с защищённой поверхностью камня. Группе нужно установить материальный след, не превращая его в ничем не подтверждённый рассказ о событиях.\n\nНАЗНАЧЕНА ПРОВЕРКА: Уточнить опись камней\nЗаказать проверенную опись, связывающую каждую пробу с настоящей обработкой и перемещением. Документальная работа дороже, зато быстрее проясняет заменённый кирпич; стендовые образцы уже имеют простую историю, допускающую проверку более длительными независимыми чтениями следов."
 HSM_BAR_mtk_place_memory_experiment_report_b_1:0 "УСТАНОВКА: Кирпичи на стенде. Сравнение после дождя.\n\nПронумерованные кирпичи повторяют материальный отклик, пока наблюдатели описывают разные сцены. Дождь неравномерно ослабляет отметку, затрудняя сравнение с защищённой поверхностью камня. Группе нужно установить материальный след, не превращая его в ничем не подтверждённый рассказ о событиях.\n\nДополнение к журналу испытаний\nНезависимые стендовые чтения повторили отметки, не согласовав изображённых фигур. Дождь ослабил след, не открыв под ним достоверной сцены прошлого. Материальные следы остаются частичным результатом, ограниченным погодой и позднейшим использованием. Съёмка отмечает изменённый камень и неясность, а не подтверждённую историю."
 HSM_BAR_mtk_place_memory_verification_b_1:0 "Пронумерованные кирпичи повторяют материальный отклик, пока наблюдатели описывают разные сцены. Дождь неравномерно ослабляет отметку, затрудняя сравнение с защищённой поверхностью камня. Группе нужно установить материальный след, не превращая его в ничем не подтверждённый рассказ о событиях.\n\nНАЗНАЧЕНА ПРОВЕРКА: Повторить чтения\nСохранить пробы и предложить новым читателям зарисовать отклик до открытия списков обработки. Это экономит новую опись, но дольше разбирает перенесённую кладку; пронумерованный стендовый материал позволяет прямо сравнивать повторяемые отметки с воображаемыми сценами наблюдателей."
 HSM_BAR_mtk_place_memory_observation_2:0 "Заменённый кирпич несёт самый сильный кажущийся древним след в зале. Обратный порядок чар оставляет показания, пока неразличимые между собой. Группе нужно установить материальный след, не превращая его в ничем не подтверждённый рассказ о событиях."
 HSM_BAR_mtk_place_memory_experiment_report_a_2:0 "УСТАНОВКА: Перенесённый кирпич. Обратный порядок чар.\n\nЗаменённый кирпич несёт самый сильный кажущийся древним след в зале. Обратный порядок чар оставляет показания, пока неразличимые между собой. Группе нужно установить материальный след, не превращая его в ничем не подтверждённый рассказ о событиях.\n\nДополнение к журналу испытаний\nИсправленная опись связала сильнейшую отметку зала с перенесённой заменой. Обратные воздействия остались неразличимыми как последовательность, хотя прежнюю обработку обнаружить удалось. Обнаружен изменённый материал, а не история. Виновник, обещания и порядок событий по отметкам неизвестны; Контакт должен отделять остаток от ответа."
 HSM_BAR_mtk_place_memory_verification_a_2:0 "Заменённый кирпич несёт самый сильный кажущийся древним след в зале. Обратный порядок чар оставляет показания, пока неразличимые между собой. Группе нужно установить материальный след, не превращая его в ничем не подтверждённый рассказ о событиях.\n\nНАЗНАЧЕНА ПРОВЕРКА: Уточнить опись камней\nЗаказать проверенную опись, связывающую каждую пробу с настоящей обработкой и перемещением. Документальная работа дороже, зато быстрее проясняет заменённый кирпич; стендовые образцы уже имеют простую историю, допускающую проверку более длительными независимыми чтениями следов."
 HSM_BAR_mtk_place_memory_experiment_report_b_2:0 "УСТАНОВКА: Перенесённый кирпич. Обратный порядок чар.\n\nЗаменённый кирпич несёт самый сильный кажущийся древним след в зале. Обратный порядок чар оставляет показания, пока неразличимые между собой. Группе нужно установить материальный след, не превращая его в ничем не подтверждённый рассказ о событиях.\n\nДополнение к журналу испытаний\nНезависимые чтения зала следовали перенесённому кирпичу, а не предполагаемому прошлому комнаты. Обратные воздействия остались неразличимыми как последовательность, хотя прежнюю обработку обнаружить удалось. Материальные следы остаются частичным результатом, ограниченным погодой и позднейшим использованием. Съёмка отмечает изменённый камень и неясность, а не подтверждённую историю."
