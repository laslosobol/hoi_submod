 HSM_BAR_mtk_interrupt_notation_verification_b_3:0 "Переданная схема выявляет сигнал остановки, иначе понятый незнакомым преподавателем. Изменённый знак расходится с опорным; подготовка останавливается до исполнения. Странице нужно однозначное завершение, которое другой читатель сможет проверить независимо от автора.\n\nНАЗНАЧЕНА ПРОВЕРКА: Обменяться копиями\nСохранить знаки и продлить независимые уроки со сбором вопросов до исполнения. Это экономит новую чертёжную работу, но дольше занимает незнакомую поддерживаемую схему; начальная световая последовательность уже даёт проверенное упражнение для сравнения просьбы и завершения."
