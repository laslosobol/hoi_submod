 HSM_BAR_mtk_spell_sterilisation_rig_question:0 "Какая поверхность инструмента проверит два прохода?"
 HSM_BAR_mtk_spell_sterilisation_prepare_rig_a:0 "Раскрытые шарниры"
 HSM_BAR_mtk_spell_sterilisation_prepare_rig_a_tt:0 "Начать с очищенных инструментов с раскрытыми шарнирами. Брать пробы с открытых лезвий и внутренних поверхностей отдельно: чистый с виду лоток не доказывает одинаковой обработки всех прежде закрытых участков инструмента."
 HSM_BAR_mtk_spell_sterilisation_prepare_rig_b:0 "Закрытые шарниры"
 HSM_BAR_mtk_spell_sterilisation_prepare_rig_b_tt:0 "Оставить отдельный сравнительный набор закрытым при обработке, затем взять внутренние пробы. Проверяется доступ к скрытому загрязнению, а не способность более яркой вспышки заменить исследование закрытого шарнира после двух проходов."
 HSM_BAR_mtk_spell_sterilisation_control_question:0 "Какой остаток требует независимой проверки?"
 HSM_BAR_mtk_spell_sterilisation_prepare_control_a:0 "Пробы на рост"
 HSM_BAR_mtk_spell_sterilisation_prepare_control_a_tt:0 "Взять пробы после обработки, включая шарниры, а не только полированные лезвия. Сохранить сравнение с обычной стерилизацией: отсутствие видимой грязи отличается от отсутствия последующего роста на взятых с инструмента пробах."
 HSM_BAR_mtk_spell_sterilisation_prepare_control_b:0 "Незачарованный кристалл"
 HSM_BAR_mtk_spell_sterilisation_prepare_control_b_tt:0 "Поднести незачарованный кристалл к намеренно зачарованным инструментам после расплетения. Проверить и окружающий лоток: снятие привязки не должно всего лишь переносить её остаток на следующую поверхность, соприкасающуюся с обработанным инструментом."
 HSM_BAR_mtk_spell_sterilisation_observation_0:0 "Раскрытые шарниры открывают поверхность, однако каждый из двух проходов ещё нуждается в отдельной проверке. Сравнение проб пока не подтвердило чистоту каждого обследованного шарнира. Процедуре нужны подтверждённый доступ и раздельные проверки загрязнений до принятия её рабочего описания."
 HSM_BAR_mtk_spell_sterilisation_experiment_report_a_0:0 "УСТАНОВКА: Раскрытые шарниры. Пробы на рост.\n\nРаскрытые шарниры открывают поверхность, однако каждый из двух проходов ещё нуждается в отдельной проверке. Сравнение проб пока не подтвердило чистоту каждого обследованного шарнира. Процедуре нужны подтверждённый доступ и раздельные проверки загрязнений до принятия её рабочего описания.\n\nДополнение к журналу испытаний\nПриспособление сохранило доступность раскрытых поверхностей на протяжении обоих проходов. Повторные пробы подтвердили исправленную процедуру с раскрытыми шарнирами на испытанных инструментах. Стерилизация успешна на очищенных раскрытых инструментах. Крепления требуют осмотра; ткань, дерево и живые раны остаются неисследованными."
 HSM_BAR_mtk_spell_sterilisation_verification_a_0:0 "Раскрытые шарниры открывают поверхность, однако каждый из двух проходов ещё нуждается в отдельной проверке. Сравнение проб пока не подтвердило чистоту каждого обследованного шарнира. Процедуре нужны подтверждённый доступ и раздельные проверки загрязнений до принятия её рабочего описания.\n\nНАЗНАЧЕНА ПРОВЕРКА: Открыть доступ\nЗаказать приспособление, удерживающее шарниры открытыми, и разделить проверки двух проходов. Это дороже при подготовке, зато быстрее устраняет неудачи закрытых шарниров; уже открытый набор может установить процедуру через более долгое сравнение на прежних лотках."
 HSM_BAR_mtk_spell_sterilisation_experiment_report_b_0:0 "УСТАНОВКА: Раскрытые шарниры. Пробы на рост.\n\nРаскрытые шарниры открывают поверхность, однако каждый из двух проходов ещё нуждается в отдельной проверке. Сравнение проб пока не подтвердило чистоту каждого обследованного шарнира. Процедуре нужны подтверждённый доступ и раздельные проверки загрязнений до принятия её рабочего описания.\n\nДополнение к журналу испытаний\nПовторные сравнения открытого набора разделили действие каждого из двух проходов. Повторные пробы подтвердили исправленную процедуру с раскрытыми шарнирами на испытанных инструментах. Исправленная процедура очищает испытанные инструменты от загрязнений и чар. Последняя минута получает проверенные инструменты, а не лечение живых ран."
 HSM_BAR_mtk_spell_sterilisation_verification_b_0:0 "Раскрытые шарниры открывают поверхность, однако каждый из двух проходов ещё нуждается в отдельной проверке. Сравнение проб пока не подтвердило чистоту каждого обследованного шарнира. Процедуре нужны подтверждённый доступ и раздельные проверки загрязнений до принятия её рабочего описания.\n\nНАЗНАЧЕНА ПРОВЕРКА: Повторить пробы\nСохранить лотки и продлить парные сравнения, раскрывая неудачный шарнир перед повтором обработки. Это экономит приспособления, но дольше занимает закрытые инструменты; открытые поверхности уже дают яснее запись для разделения результатов посева и остаточного зачарования."
 HSM_BAR_mtk_spell_sterilisation_observation_1:0 "Раскрытые шарниры открывают поверхность, однако каждый из двух проходов ещё нуждается в отдельной проверке. Зачарованное крепление трескается при расплетении и требует проверки за пределами лезвия. Процедуре нужны подтверждённый доступ и раздельные проверки загрязнений до принятия её рабочего описания."
 HSM_BAR_mtk_spell_sterilisation_experiment_report_a_1:0 "УСТАНОВКА: Раскрытые шарниры. Незачарованный кристалл.\n\nРаскрытые шарниры открывают поверхность, однако каждый из двух проходов ещё нуждается в отдельной проверке. Зачарованное крепление трескается при расплетении и требует проверки за пределами лезвия. Процедуре нужны подтверждённый доступ и раздельные проверки загрязнений до принятия её рабочего описания.\n\nДополнение к журналу испытаний\nПриспособление сохранило доступность раскрытых поверхностей на протяжении обоих проходов. Проверочный кристалл не показал перенесённых чар; треснувшее крепление было исключено из использования. Стерилизация успешна на очищенных раскрытых инструментах. Крепления требуют осмотра; ткань, дерево и живые раны остаются неисследованными."
 HSM_BAR_mtk_spell_sterilisation_verification_a_1:0 "Раскрытые шарниры открывают поверхность, однако каждый из двух проходов ещё нуждается в отдельной проверке. Зачарованное крепление трескается при расплетении и требует проверки за пределами лезвия. Процедуре нужны подтверждённый доступ и раздельные проверки загрязнений до принятия её рабочего описания.\n\nНАЗНАЧЕНА ПРОВЕРКА: Открыть доступ\nЗаказать приспособление, удерживающее шарниры открытыми, и разделить проверки двух проходов. Это дороже при подготовке, зато быстрее устраняет неудачи закрытых шарниров; уже открытый набор может установить процедуру через более долгое сравнение на прежних лотках."
 HSM_BAR_mtk_spell_sterilisation_experiment_report_b_1:0 "УСТАНОВКА: Раскрытые шарниры. Незачарованный кристалл.\n\nРаскрытые шарниры открывают поверхность, однако каждый из двух проходов ещё нуждается в отдельной проверке. Зачарованное крепление трескается при расплетении и требует проверки за пределами лезвия. Процедуре нужны подтверждённый доступ и раздельные проверки загрязнений до принятия её рабочего описания.\n\nДополнение к журналу испытаний\nПовторные сравнения открытого набора разделили действие каждого из двух проходов. Проверочный кристалл не показал перенесённых чар; треснувшее крепление было исключено из использования. Исправленная процедура очищает испытанные инструменты от загрязнений и чар. Последняя минута получает проверенные инструменты, а не лечение живых ран."
 HSM_BAR_mtk_spell_sterilisation_verification_b_1:0 "Раскрытые шарниры открывают поверхность, однако каждый из двух проходов ещё нуждается в отдельной проверке. Зачарованное крепление трескается при расплетении и требует проверки за пределами лезвия. Процедуре нужны подтверждённый доступ и раздельные проверки загрязнений до принятия её рабочего описания.\n\nНАЗНАЧЕНА ПРОВЕРКА: Повторить пробы\nСохранить лотки и продлить парные сравнения, раскрывая неудачный шарнир перед повтором обработки. Это экономит приспособления, но дольше занимает закрытые инструменты; открытые поверхности уже дают яснее запись для разделения результатов посева и остаточного зачарования."
 HSM_BAR_mtk_spell_sterilisation_observation_2:0 "Закрытые шарниры выглядят чистыми снаружи, тогда как их скрытые внутренние поверхности остаются под сомнением. Сравнение проб пока не подтвердило чистоту каждого обследованного шарнира. Процедуре нужны подтверждённый доступ и раздельные проверки загрязнений до принятия её рабочего описания."
 HSM_BAR_mtk_spell_sterilisation_experiment_report_a_2:0 "УСТАНОВКА: Закрытые шарниры. Пробы на рост.\n\nЗакрытые шарниры выглядят чистыми снаружи, тогда как их скрытые внутренние поверхности остаются под сомнением. Сравнение проб пока не подтвердило чистоту каждого обследованного шарнира. Процедуре нужны подтверждённый доступ и раздельные проверки загрязнений до принятия её рабочего описания.\n\nДополнение к журналу испытаний\nРаскрытие сравнительных шарниров устранило скрытое загрязнение, оставшееся в первых опытах. Повторные пробы подтвердили исправленную процедуру с раскрытыми шарнирами на испытанных инструментах. Стерилизация успешна на очищенных раскрытых инструментах. Крепления требуют осмотра; ткань, дерево и живые раны остаются неисследованными."
 HSM_BAR_mtk_spell_sterilisation_verification_a_2:0 "Закрытые шарниры выглядят чистыми снаружи, тогда как их скрытые внутренние поверхности остаются под сомнением. Сравнение проб пока не подтвердило чистоту каждого обследованного шарнира. Процедуре нужны подтверждённый доступ и раздельные проверки загрязнений до принятия её рабочего описания.\n\nНАЗНАЧЕНА ПРОВЕРКА: Открыть доступ\nЗаказать приспособление, удерживающее шарниры открытыми, и разделить проверки двух проходов. Это дороже при подготовке, зато быстрее устраняет неудачи закрытых шарниров; уже открытый набор может установить процедуру через более долгое сравнение на прежних лотках."
 HSM_BAR_mtk_spell_sterilisation_experiment_report_b_2:0 "УСТАНОВКА: Закрытые шарниры. Пробы на рост.\n\nЗакрытые шарниры выглядят чистыми снаружи, тогда как их скрытые внутренние поверхности остаются под сомнением. Сравнение проб пока не подтвердило чистоту каждого обследованного шарнира. Процедуре нужны подтверждённый доступ и раздельные проверки загрязнений до принятия её рабочего описания.\n\nДополнение к журналу испытаний\nПовторные сравнения шарниров потребовали раскрытия, прежде чем пробы подтвердили чистоту. Повторные пробы подтвердили исправленную процедуру с раскрытыми шарнирами на испытанных инструментах. Исправленная процедура очищает испытанные инструменты от загрязнений и чар. Последняя минута получает проверенные инструменты, а не лечение живых ран."
 HSM_BAR_mtk_spell_sterilisation_verification_b_2:0 "Закрытые шарниры выглядят чистыми снаружи, тогда как их скрытые внутренние поверхности остаются под сомнением. Сравнение проб пока не подтвердило чистоту каждого обследованного шарнира. Процедуре нужны подтверждённый доступ и раздельные проверки загрязнений до принятия её рабочего описания.\n\nНАЗНАЧЕНА ПРОВЕРКА: Повторить пробы\nСохранить лотки и продлить парные сравнения, раскрывая неудачный шарнир перед повтором обработки. Это экономит приспособления, но дольше занимает закрытые инструменты; открытые поверхности уже дают яснее запись для разделения результатов посева и остаточного зачарования."
 HSM_BAR_mtk_spell_sterilisation_observation_3:0 "Закрытые шарниры выглядят чистыми снаружи, тогда как их скрытые внутренние поверхности остаются под сомнением. Зачарованное крепление трескается при расплетении и требует проверки за пределами лезвия. Процедуре нужны подтверждённый доступ и раздельные проверки загрязнений до принятия её рабочего описания."
 HSM_BAR_mtk_spell_sterilisation_experiment_report_a_3:0 "УСТАНОВКА: Закрытые шарниры. Незачарованный кристалл.\n\nЗакрытые шарниры выглядят чистыми снаружи, тогда как их скрытые внутренние поверхности остаются под сомнением. Зачарованное крепление трескается при расплетении и требует проверки за пределами лезвия. Процедуре нужны подтверждённый доступ и раздельные проверки загрязнений до принятия её рабочего описания.\n\nДополнение к журналу испытаний\nРаскрытие сравнительных шарниров устранило скрытое загрязнение, оставшееся в первых опытах. Проверочный кристалл не показал перенесённых чар; треснувшее крепление было исключено из использования. Стерилизация успешна на очищенных раскрытых инструментах. Крепления требуют осмотра; ткань, дерево и живые раны остаются неисследованными."
 HSM_BAR_mtk_spell_sterilisation_verification_a_3:0 "Закрытые шарниры выглядят чистыми снаружи, тогда как их скрытые внутренние поверхности остаются под сомнением. Зачарованное крепление трескается при расплетении и требует проверки за пределами лезвия. Процедуре нужны подтверждённый доступ и раздельные проверки загрязнений до принятия её рабочего описания.\n\nНАЗНАЧЕНА ПРОВЕРКА: Открыть доступ\nЗаказать приспособление, удерживающее шарниры открытыми, и разделить проверки двух проходов. Это дороже при подготовке, зато быстрее устраняет неудачи закрытых шарниров; уже открытый набор может установить процедуру через более долгое сравнение на прежних лотках."
