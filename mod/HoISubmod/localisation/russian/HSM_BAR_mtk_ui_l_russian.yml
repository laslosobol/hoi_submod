 HSM_BAR_mtk_phantom_pain_experiment_report_b_1:0 "УСТАНОВКА: Покой отсутствующей лапы. Дневник между визитами.\n\nВ покое воспринимаемый коготь ненадолго расслабляется, хотя рубец остаётся без изменений. Дневник отмечает возвращение боли после обещающего часа в клинике. Нужно разделить временное облегчение, ожидание и обычную функцию, прежде чем предлагать дальнейшие сеансы.\n\nДополнение к журналу испытаний\nБолее долгие сравнения покоя сохранили краткое облегчение лишь у части участников. Дневники сохранили возвращение боли и предпочтение пациента относительно дальнейших посещений клиники. Облегчение ограниченно и временно. Дальнейшие посещения зависят от пользы и выбора пациента; ни общего излечения, ни надёжного прогноза нет."
 HSM_BAR_mtk_phantom_pain_verification_b_1:0 "В покое воспринимаемый коготь ненадолго расслабляется, хотя рубец остаётся без изменений. Дневник отмечает возвращение боли после обещающего часа в клинике. Нужно разделить временное облегчение, ожидание и обычную функцию, прежде чем предлагать дальнейшие сеансы.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить сравнение\nСохранить узор и дольше сравнивать активные встречи, тихие посещения и дневник пациента. Это сокращает новую подготовку, но требует больше времени при наложении рабочей боли на фантом; спокойные сеансы содержат меньше одновременных изменений для разбора."
 HSM_BAR_mtk_phantom_pain_observation_2:0 "Держать чашку ненадолго становится проще, однако оставшееся плечо по-прежнему болит при работе. Неактивный визит тоже приносит облегчение, оставляя вклад узора неясным. Нужно разделить временное облегчение, ожидание и обычную функцию, прежде чем предлагать дальнейшие сеансы."
 HSM_BAR_mtk_phantom_pain_experiment_report_a_2:0 "УСТАНОВКА: Работа и чашка. Неактивные сеансы.\n\nДержать чашку ненадолго становится проще, однако оставшееся плечо по-прежнему болит при работе. Неактивный визит тоже приносит облегчение, оставляя вклад узора неясным. Нужно разделить временное облегчение, ожидание и обычную функцию, прежде чем предлагать дальнейшие сеансы.\n\nДополнение к журналу испытаний\nИсправленная карта задачи отделила боль плеча от ненадолго расслабленного фантома. Неактивные сравнения показали, что часть улучшений одинаково сопровождала оба вида посещений. Подтверждено лишь временное облегчение у некоторых. Отклик непредсказуем; обычный уход продолжается. Конечность не возвращается, комфорт не означает восстановления."
 HSM_BAR_mtk_phantom_pain_verification_a_2:0 "Держать чашку ненадолго становится проще, однако оставшееся плечо по-прежнему болит при работе. Неактивный визит тоже приносит облегчение, оставляя вклад узора неясным. Нужно разделить временное облегчение, ожидание и обычную функцию, прежде чем предлагать дальнейшие сеансы.\n\nНАЗНАЧЕНА ПРОВЕРКА: Уточнить противоузор\nПотратить дополнительную клиническую работу на разделение воспринимаемой позы и боли оставшейся конечности. Это быстрее проясняет рабочую задачу, но спокойный отдых уже даёт простую карту; более долгие парные посещения там потребуют меньше новой подготовки."
 HSM_BAR_mtk_phantom_pain_experiment_report_b_2:0 "УСТАНОВКА: Работа и чашка. Неактивные сеансы.\n\nДержать чашку ненадолго становится проще, однако оставшееся плечо по-прежнему болит при работе. Неактивный визит тоже приносит облегчение, оставляя вклад узора неясным. Нужно разделить временное облегчение, ожидание и обычную функцию, прежде чем предлагать дальнейшие сеансы.\n\nДополнение к журналу испытаний\nБолее долгие сравнения задач сохранили различие между удобным движением и болью плеча. Неактивные сравнения показали, что часть улучшений одинаково сопровождала оба вида посещений. Облегчение ограниченно и временно. Дальнейшие посещения зависят от пользы и выбора пациента; ни общего излечения, ни надёжного прогноза нет."
