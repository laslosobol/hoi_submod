 HSM_BAR_mtk_contact_rig_question:0 "Какое различие проверить в коротком обмене?"
 HSM_BAR_mtk_contact_prepare_rig_a:0 "Совпадение и различие"
 HSM_BAR_mtk_contact_prepare_rig_a_tt:0 "Начать с совпадения и различия новых выбранных знаков. Сохранить короткий промежуток сосуда и независимо измеренную границу, запрашивая только показанное различение, а не принимая беглый голос за уже готовый общий язык общения."
 HSM_BAR_mtk_contact_prepare_rig_b:0 "Просьба повторить"
 HSM_BAR_mtk_contact_prepare_rig_b_tt:0 "Предложить установленные знаки в изменённом порядке и допустить просьбу повторить. Сохранить паузу для обеих сторон: продолжение речи нельзя покупать преодолением отказа или заменой сосуда живым носителем, присутствующим в комнате наблюдения."
 HSM_BAR_mtk_contact_control_question:0 "Какая проверка должна сопровождать кажущийся ответ?"
 HSM_BAR_mtk_contact_prepare_control_a:0 "Чистый исходный след"
 HSM_BAR_mtk_contact_prepare_control_a_tt:0 "Записывать исходный след сосуда перед каждым вызовом, затем выбирать новые знаки. Старые следы должны отличаться от нынешних ответов: провал свидетеля и исследование памяти материала учитываются до обсуждения любого предложенного в беседе имени."
 HSM_BAR_mtk_contact_prepare_control_b:0 "Независимая просьба паузы"
 HSM_BAR_mtk_contact_prepare_control_b_tt:0 "Поручить помощнику записать и исполнить просьбу паузы независимо от желания Асинти продолжать. Проверить завершение поля вместе с границей: приятный обмен ещё неприемлем, если нельзя показать работу его заранее подготовленной остановки."
 HSM_BAR_mtk_contact_observation_0:0 "Краткий ответ различает предложенные знаки, но заявленное имя не подтверждено независимо. Чистый исходный след оставляет новую отметку ожидающей нового проверочного задания. Группе нужно проверить взаимность, не продлевая промежуток и не соглашаясь на живого носителя."
 HSM_BAR_mtk_contact_experiment_report_a_0:0 "УСТАНОВКА: Совпадение и различие. Чистый исходный след.\n\nКраткий ответ различает предложенные знаки, но заявленное имя не подтверждено независимо. Чистый исходный след оставляет новую отметку ожидающей нового проверочного задания. Группе нужно проверить взаимность, не продлевая промежуток и не соглашаясь на живого носителя.\n\nДополнение к журналу испытаний\nСовпадение сохранило показанные различия. Новые задания исключили остаток. Контакт частичен: Тормоз завершает, провал Свидетеля требует проверки, Память места исключает остатки, Компас очерчивает край, Сосуд ограничивает время. Имена не удостоверены; нет универсального портала или подчинения."
 HSM_BAR_mtk_contact_verification_a_0:0 "Краткий ответ различает предложенные знаки, но заявленное имя не подтверждено независимо. Чистый исходный след оставляет новую отметку ожидающей нового проверочного задания. Группе нужно проверить взаимность, не продлевая промежуток и не соглашаясь на живого носителя.\n\nНАЗНАЧЕНА ПРОВЕРКА: Уточнить обмен знаками\nЗаказать меньший, явно проверенный словарь до следующего короткого вызова. Подготовка дороже, зато быстрее проясняет просьбу повторения; простое совпадение можно проверить через дополнительные вызовы после охлаждения с прежними знаками и независимыми записями наблюдателей."
 HSM_BAR_mtk_contact_experiment_report_b_0:0 "УСТАНОВКА: Совпадение и различие. Чистый исходный след.\n\nКраткий ответ различает предложенные знаки, но заявленное имя не подтверждено независимо. Чистый исходный след оставляет новую отметку ожидающей нового проверочного задания. Группе нужно проверить взаимность, не продлевая промежуток и не соглашаясь на живого носителя.\n\nДополнение к журналу испытаний\nСовпадающие ответы остались редкими. Новые задания исключили остаток. Тормоз, провал Свидетеля, Память места, Компас и Сосуд вместе ограничивают частичный обмен. Общие знаки не доказывают истины или личности; живые носители и подчинение исключены."
 HSM_BAR_mtk_contact_verification_b_0:0 "Краткий ответ различает предложенные знаки, но заявленное имя не подтверждено независимо. Чистый исходный след оставляет новую отметку ожидающей нового проверочного задания. Группе нужно проверить взаимность, не продлевая промежуток и не соглашаясь на живого носителя.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить серию вызовов\nСохранить словарь и сравнить дополнительные короткие вызовы после охлаждения сосуда. Это уменьшает новую подготовку, но дольше разбирает просьбы повторения; опыты совпадения дают проще сравнимое различие, не позволяя считать молчание разрешением продолжать разговор дальше."
 HSM_BAR_mtk_contact_observation_1:0 "Краткий ответ различает предложенные знаки, но заявленное имя не подтверждено независимо. Помощник записывает просьбу паузы до возможного продолжения обмена. Группе нужно проверить взаимность, не продлевая промежуток и не соглашаясь на живого носителя."
 HSM_BAR_mtk_contact_experiment_report_a_1:0 "УСТАНОВКА: Совпадение и различие. Независимая просьба паузы.\n\nКраткий ответ различает предложенные знаки, но заявленное имя не подтверждено независимо. Помощник записывает просьбу паузы до возможного продолжения обмена. Группе нужно проверить взаимность, не продлевая промежуток и не соглашаясь на живого носителя.\n\nДополнение к журналу испытаний\nСовпадение сохранило показанные различия. Независимые паузы завершили поле. Контакт частичен: Тормоз завершает, провал Свидетеля требует проверки, Память места исключает остатки, Компас очерчивает край, Сосуд ограничивает время. Имена не удостоверены; нет универсального портала или подчинения."
 HSM_BAR_mtk_contact_verification_a_1:0 "Краткий ответ различает предложенные знаки, но заявленное имя не подтверждено независимо. Помощник записывает просьбу паузы до возможного продолжения обмена. Группе нужно проверить взаимность, не продлевая промежуток и не соглашаясь на живого носителя.\n\nНАЗНАЧЕНА ПРОВЕРКА: Уточнить обмен знаками\nЗаказать меньший, явно проверенный словарь до следующего короткого вызова. Подготовка дороже, зато быстрее проясняет просьбу повторения; простое совпадение можно проверить через дополнительные вызовы после охлаждения с прежними знаками и независимыми записями наблюдателей."
 HSM_BAR_mtk_contact_experiment_report_b_1:0 "УСТАНОВКА: Совпадение и различие. Независимая просьба паузы.\n\nКраткий ответ различает предложенные знаки, но заявленное имя не подтверждено независимо. Помощник записывает просьбу паузы до возможного продолжения обмена. Группе нужно проверить взаимность, не продлевая промежуток и не соглашаясь на живого носителя.\n\nДополнение к журналу испытаний\nСовпадающие ответы остались редкими. Независимые паузы завершили поле. Тормоз, провал Свидетеля, Память места, Компас и Сосуд вместе ограничивают частичный обмен. Общие знаки не доказывают истины или личности; живые носители и подчинение исключены."
 HSM_BAR_mtk_contact_verification_b_1:0 "Краткий ответ различает предложенные знаки, но заявленное имя не подтверждено независимо. Помощник записывает просьбу паузы до возможного продолжения обмена. Группе нужно проверить взаимность, не продлевая промежуток и не соглашаясь на живого носителя.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить серию вызовов\nСохранить словарь и сравнить дополнительные короткие вызовы после охлаждения сосуда. Это уменьшает новую подготовку, но дольше разбирает просьбы повторения; опыты совпадения дают проще сравнимое различие, не позволяя считать молчание разрешением продолжать разговор дальше."
 HSM_BAR_mtk_contact_observation_2:0 "Изменённый порядок знаков вызывает просьбу повторить, после чего сосуд замолкает. Чистый исходный след оставляет новую отметку ожидающей нового проверочного задания. Группе нужно проверить взаимность, не продлевая промежуток и не соглашаясь на живого носителя."
 HSM_BAR_mtk_contact_experiment_report_a_2:0 "УСТАНОВКА: Просьба повторить. Чистый исходный след.\n\nИзменённый порядок знаков вызывает просьбу повторить, после чего сосуд замолкает. Чистый исходный след оставляет новую отметку ожидающей нового проверочного задания. Группе нужно проверить взаимность, не продлевая промежуток и не соглашаясь на живого носителя.\n\nДополнение к журналу испытаний\nПовторение сохранило ограниченный смысл. Новые задания исключили остаток. Контакт частичен: Тормоз завершает, провал Свидетеля требует проверки, Память места исключает остатки, Компас очерчивает край, Сосуд ограничивает время. Имена не удостоверены; нет универсального портала или подчинения."
