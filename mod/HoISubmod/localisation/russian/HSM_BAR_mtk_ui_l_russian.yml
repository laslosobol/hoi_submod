 HSM_BAR_mtk_field_atlas_experiment_report_a_3:0 "УСТАНОВКА: Стена мастерской. Паузы без чар.\n\nСъёмка мастерской даёт второй яркий выступ возле зачарованного инструмента; его след сливается с краем исследуемых световых чар. В скрытые промежутки без чар остаётся слабая отметка, источник которой ещё не отделён от самой комнаты. Следующая съёмка должна отделить движение источника от восприятия и помех, прежде чем кто-либо перенесёт достоверную границу на чистовой лист атласа.\n\nДополнение к журналу испытаний\nОтключение соседнего инструмента позволило отнести выступ мастерской к собственной съёмной накладке с отмеченными помехами. Скрытые пустые пробы больше не давали ложных границ после отдельного учёта обнаруженной помехи. Атлас теперь позволяет повторять местные съёмки в записанных условиях. Дождь и перемены оборудования по-прежнему оставляют неясные края; они сохраняются как неуверенные отметки общей системы отсчёта, а не превращаются в якобы измеренные впечатления."
 HSM_BAR_mtk_field_atlas_verification_a_3:0 "Съёмка мастерской даёт второй яркий выступ возле зачарованного инструмента; его след сливается с краем исследуемых световых чар. В скрытые промежутки без чар остаётся слабая отметка, источник которой ещё не отделён от самой комнаты. Следующая съёмка должна отделить движение источника от восприятия и помех, прежде чем кто-либо перенесёт достоверную границу на чистовой лист атласа.\n\nНАЗНАЧЕНА ПРОВЕРКА: Разделить накладки\nПересобрать накладки источника и помех при помощи мастерской. Это требует дополнительных расходов на чертежи и выверку, зато сокращает повторную съёмку мастерской; в тихой учебной комнате прямое прослеживание источника потребует меньшей переделки."
 HSM_BAR_mtk_field_atlas_experiment_report_b_3:0 "УСТАНОВКА: Стена мастерской. Паузы без чар.\n\nСъёмка мастерской даёт второй яркий выступ возле зачарованного инструмента; его след сливается с краем исследуемых световых чар. В скрытые промежутки без чар остаётся слабая отметка, источник которой ещё не отделён от самой комнаты. Следующая съёмка должна отделить движение источника от восприятия и помех, прежде чем кто-либо перенесёт достоверную границу на чистовой лист атласа.\n\nДополнение к журналу испытаний\nПовторные проходы по мастерской отделили перемещаемые чары от неподвижного следа расположенного рядом зачарованного инструмента. Скрытые пустые пробы больше не давали ложных границ после отдельного учёта обнаруженной помехи. Принятый атлас описывает источник, который может найти другая группа, отдельно отмечая помехи и восприятие. Листы сохраняют сведения о погоде и оборудовании при съёмке. Слабые границы остаются неопределёнными, если эти условия больше не соблюдаются."
 HSM_BAR_mtk_field_atlas_verification_b_3:0 "Съёмка мастерской даёт второй яркий выступ возле зачарованного инструмента; его след сливается с краем исследуемых световых чар. В скрытые промежутки без чар остаётся слабая отметка, источник которой ещё не отделён от самой комнаты. Следующая съёмка должна отделить движение источника от восприятия и помех, прежде чем кто-либо перенесёт достоверную границу на чистовой лист атласа.\n\nНАЗНАЧЕНА ПРОВЕРКА: Проследить источник\nОставить прежнюю стойку и повторять маршрут вслед за перемещаемыми чарами. Это экономит расходы на новые накладки, но дольше занимает наблюдателей возле работающих приборов; маршрут учебной комнаты позволит разобраться с положением источника за меньшее число встреч."
 HSM_BAR_mtk_field_atlas_respond_a:0 "Разделить накладки"
 HSM_BAR_mtk_field_atlas_respond_a_tt:0 "Пересобрать накладки источника и помех при помощи мастерской. Это требует дополнительных расходов на чертежи и выверку, зато сокращает повторную съёмку мастерской; в тихой учебной комнате прямое прослеживание источника потребует меньшей переделки.\n\n[GetHSMBARMtkResponseBudget_field_atlas_a]"
