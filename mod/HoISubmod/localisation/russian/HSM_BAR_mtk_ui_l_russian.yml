 HSM_BAR_mtk_crystal_memory_respond_b_tt:0 "Использовать прежние лотки для разнесённых по времени чтений в обоих условиях. Это экономит новые приспособления хранения, но при наложении старого и нового изображений потребует больше времени; чистая экспозиция позволит быстрее закончить сравнение угасания.\n\n[GetHSMBARMtkResponseBudget_crystal_memory_b]"
 HSM_BAR_mtk_spell_notation_rig_question:0 "Какой способ исполнения описать в световом упражнении?"
 HSM_BAR_mtk_spell_notation_prepare_rig_a:0 "Движение заклинателя"
 HSM_BAR_mtk_spell_notation_prepare_rig_a_tt:0 "Описать движение, которое Виира прежде опускала в уроке. Рядом с телесным действием записать требуемое магическое условие, чтобы читатель мог проверить, действительно ли копирование её позы обеспечивает заявленный эффект."
 HSM_BAR_mtk_spell_notation_prepare_rig_b:0 "Внешний регулятор"
 HSM_BAR_mtk_spell_notation_prepare_rig_b_tt:0 "Записать то же требуемое условие для внешнего регулятора. Механизм предлагает другой путь к начальному упражнению, однако чертёж должен объяснять подготовку, внимание и остановку без опоры на показ Вииры."
 HSM_BAR_mtk_spell_notation_control_question:0 "Какую копию получит незнакомый с показом преподаватель?"
 HSM_BAR_mtk_spell_notation_prepare_control_a:0 "Полная рабочая копия"
 HSM_BAR_mtk_spell_notation_prepare_control_a_tt:0 "Передать преподавателю весь черновик без показа чар. Собрать вопросы до исполнения, считая необъяснённое действие пробелом страницы, а не недостатком нового читателя, который должен самостоятельно провести безвредное начальное упражнение."
 HSM_BAR_mtk_spell_notation_prepare_control_b:0 "Пропущенное указание"
 HSM_BAR_mtk_spell_notation_prepare_control_b_tt:0 "Удалить указание из отмеченной сравнительной копии безвредного упражнения. Проверить, остановится ли преподаватель перед пробелом или добавит неписаную привычку; восстановить страницу до показа, который будет принят как подтверждение."
 HSM_BAR_mtk_spell_notation_observation_0:0 "Лист движений даёт короткое свечение, однако новый преподаватель пока не может объяснить, какое условие поддерживает его. Полный черновик оставляет вопрос на полях там, где подготовка должна перейти в удержание внимания заклинателя. Странице требуется яснее описанное соответствие или ещё один независимый урок, прежде чем удачное свечение можно будет считать воспроизводимым письменным указанием."
 HSM_BAR_mtk_spell_notation_experiment_report_a_0:0 "УСТАНОВКА: Движение заклинателя. Полная рабочая копия.\n\nЛист движений даёт короткое свечение, однако новый преподаватель пока не может объяснить, какое условие поддерживает его. Полный черновик оставляет вопрос на полях там, где подготовка должна перейти в удержание внимания заклинателя. Странице требуется яснее описанное соответствие или ещё один независимый урок, прежде чем удачное свечение можно будет считать воспроизводимым письменным указанием.\n\nДополнение к журналу испытаний\nИсправленный лист движений отделил привычную позу Вииры от условия, которое преподаватель мог проверить самостоятельно. Полная копия позволила объяснить и удержание света, и способ завершения начального упражнения заклинателем. Нотация успешна для воспроизведённых начальных упражнений. Она описывает проверяемые действия, не обещая равной магической силы и перевода всех телесных привычек. Сложные чары остаются черновиками. Хор сможет проверять вклады по страницам без невысказанных суждений автора."
 HSM_BAR_mtk_spell_notation_verification_a_0:0 "Лист движений даёт короткое свечение, однако новый преподаватель пока не может объяснить, какое условие поддерживает его. Полный черновик оставляет вопрос на полях там, где подготовка должна перейти в удержание внимания заклинателя. Странице требуется яснее описанное соответствие или ещё один независимый урок, прежде чем удачное свечение можно будет считать воспроизводимым письменным указанием.\n\nНАЗНАЧЕНА ПРОВЕРКА: Перерисовать условия\nЗаказать отдельные схемы действия, условия и остановки. Пользователи регулятора быстрее воспользуются исправленным чертежом, а перевод телесных привычек займёт больше времени; дополнительная подготовка схем обойдётся дороже очередного обмена уроками по имеющимся страницам."
 HSM_BAR_mtk_spell_notation_experiment_report_b_0:0 "УСТАНОВКА: Движение заклинателя. Полная рабочая копия.\n\nЛист движений даёт короткое свечение, однако новый преподаватель пока не может объяснить, какое условие поддерживает его. Полный черновик оставляет вопрос на полях там, где подготовка должна перейти в удержание внимания заклинателя. Странице требуется яснее описанное соответствие или ещё один независимый урок, прежде чем удачное свечение можно будет считать воспроизводимым письменным указанием.\n\nДополнение к журналу испытаний\nВторой преподаватель выделил необъяснённое движение и записал проверку, которую другой читатель смог повторить по странице. Полная копия позволила объяснить и удержание света, и способ завершения начального упражнения заклинателем. Другой учитель теперь воспроизводит начальное световое упражнение и его остановку. Приняты именно проверенные страницы; сложные чары и непереведённые привычки ещё требуют показов. Хор получает читаемые вклады, а не право считать каждое указание доступным любому участнику."
 HSM_BAR_mtk_spell_notation_verification_b_0:0 "Лист движений даёт короткое свечение, однако новый преподаватель пока не может объяснить, какое условие поддерживает его. Полный черновик оставляет вопрос на полях там, где подготовка должна перейти в удержание внимания заклинателя. Странице требуется яснее описанное соответствие или ещё один независимый урок, прежде чем удачное свечение можно будет считать воспроизводимым письменным указанием.\n\nНАЗНАЧЕНА ПРОВЕРКА: Обменяться уроками\nДать другому преподавателю провести урок по спорным страницам и вернуть копию с пометками. Это экономит заказ новых схем, но занимает учебное время, особенно для незнакомых регуляторов; уже объяснённое движение быстрее проверяется через второго читателя."
 HSM_BAR_mtk_spell_notation_observation_1:0 "Лист движений даёт короткое свечение, однако новый преподаватель пока не может объяснить, какое условие поддерживает его. Сравнительная копия останавливается на пропущенном указании; преподаватель отметил пробел, не пытаясь придумать ответ вместо автора. Странице требуется яснее описанное соответствие или ещё один независимый урок, прежде чем удачное свечение можно будет считать воспроизводимым письменным указанием."
 HSM_BAR_mtk_spell_notation_experiment_report_a_1:0 "УСТАНОВКА: Движение заклинателя. Пропущенное указание.\n\nЛист движений даёт короткое свечение, однако новый преподаватель пока не может объяснить, какое условие поддерживает его. Сравнительная копия останавливается на пропущенном указании; преподаватель отметил пробел, не пытаясь придумать ответ вместо автора. Странице требуется яснее описанное соответствие или ещё один независимый урок, прежде чем удачное свечение можно будет считать воспроизводимым письменным указанием.\n\nДополнение к журналу испытаний\nИсправленный лист движений отделил привычную позу Вииры от условия, которое преподаватель мог проверить самостоятельно. Пропущенное указание обнаружили и восстановили до того, как исправленное упражнение удалось воспроизвести по странице. Нотация успешна для воспроизведённых начальных упражнений. Она описывает проверяемые действия, не обещая равной магической силы и перевода всех телесных привычек. Сложные чары остаются черновиками. Хор сможет проверять вклады по страницам без невысказанных суждений автора."
 HSM_BAR_mtk_spell_notation_verification_a_1:0 "Лист движений даёт короткое свечение, однако новый преподаватель пока не может объяснить, какое условие поддерживает его. Сравнительная копия останавливается на пропущенном указании; преподаватель отметил пробел, не пытаясь придумать ответ вместо автора. Странице требуется яснее описанное соответствие или ещё один независимый урок, прежде чем удачное свечение можно будет считать воспроизводимым письменным указанием.\n\nНАЗНАЧЕНА ПРОВЕРКА: Перерисовать условия\nЗаказать отдельные схемы действия, условия и остановки. Пользователи регулятора быстрее воспользуются исправленным чертежом, а перевод телесных привычек займёт больше времени; дополнительная подготовка схем обойдётся дороже очередного обмена уроками по имеющимся страницам."
 HSM_BAR_mtk_spell_notation_experiment_report_b_1:0 "УСТАНОВКА: Движение заклинателя. Пропущенное указание.\n\nЛист движений даёт короткое свечение, однако новый преподаватель пока не может объяснить, какое условие поддерживает его. Сравнительная копия останавливается на пропущенном указании; преподаватель отметил пробел, не пытаясь придумать ответ вместо автора. Странице требуется яснее описанное соответствие или ещё один независимый урок, прежде чем удачное свечение можно будет считать воспроизводимым письменным указанием.\n\nДополнение к журналу испытаний\nВторой преподаватель выделил необъяснённое движение и записал проверку, которую другой читатель смог повторить по странице. Пропущенное указание обнаружили и восстановили до того, как исправленное упражнение удалось воспроизвести по странице. Другой учитель теперь воспроизводит начальное световое упражнение и его остановку. Приняты именно проверенные страницы; сложные чары и непереведённые привычки ещё требуют показов. Хор получает читаемые вклады, а не право считать каждое указание доступным любому участнику."
 HSM_BAR_mtk_spell_notation_verification_b_1:0 "Лист движений даёт короткое свечение, однако новый преподаватель пока не может объяснить, какое условие поддерживает его. Сравнительная копия останавливается на пропущенном указании; преподаватель отметил пробел, не пытаясь придумать ответ вместо автора. Странице требуется яснее описанное соответствие или ещё один независимый урок, прежде чем удачное свечение можно будет считать воспроизводимым письменным указанием.\n\nНАЗНАЧЕНА ПРОВЕРКА: Обменяться уроками\nДать другому преподавателю провести урок по спорным страницам и вернуть копию с пометками. Это экономит заказ новых схем, но занимает учебное время, особенно для незнакомых регуляторов; уже объяснённое движение быстрее проверяется через второго читателя."
 HSM_BAR_mtk_spell_notation_observation_2:0 "Регулятор достигает нарисованного положения, но читатель спрашивает, доказывает ли стрелка выполнение требуемого магического условия этого упражнения. Полный черновик оставляет вопрос на полях там, где подготовка должна перейти в удержание внимания заклинателя. Странице требуется яснее описанное соответствие или ещё один независимый урок, прежде чем удачное свечение можно будет считать воспроизводимым письменным указанием."
 HSM_BAR_mtk_spell_notation_experiment_report_a_2:0 "УСТАНОВКА: Внешний регулятор. Полная рабочая копия.\n\nРегулятор достигает нарисованного положения, но читатель спрашивает, доказывает ли стрелка выполнение требуемого магического условия этого упражнения. Полный черновик оставляет вопрос на полях там, где подготовка должна перейти в удержание внимания заклинателя. Странице требуется яснее описанное соответствие или ещё один независимый урок, прежде чем удачное свечение можно будет считать воспроизводимым письменным указанием.\n\nДополнение к журналу испытаний\nЧертёж регулятора получил отдельную проверку поля вместо признания положения стрелки достаточным доказательством выполнения условия. Полная копия позволила объяснить и удержание света, и способ завершения начального упражнения заклинателем. Нотация успешна для воспроизведённых начальных упражнений. Она описывает проверяемые действия, не обещая равной магической силы и перевода всех телесных привычек. Сложные чары остаются черновиками. Хор сможет проверять вклады по страницам без невысказанных суждений автора."
 HSM_BAR_mtk_spell_notation_verification_a_2:0 "Регулятор достигает нарисованного положения, но читатель спрашивает, доказывает ли стрелка выполнение требуемого магического условия этого упражнения. Полный черновик оставляет вопрос на полях там, где подготовка должна перейти в удержание внимания заклинателя. Странице требуется яснее описанное соответствие или ещё один независимый урок, прежде чем удачное свечение можно будет считать воспроизводимым письменным указанием.\n\nНАЗНАЧЕНА ПРОВЕРКА: Перерисовать условия\nЗаказать отдельные схемы действия, условия и остановки. Пользователи регулятора быстрее воспользуются исправленным чертежом, а перевод телесных привычек займёт больше времени; дополнительная подготовка схем обойдётся дороже очередного обмена уроками по имеющимся страницам."
 HSM_BAR_mtk_spell_notation_experiment_report_b_2:0 "УСТАНОВКА: Внешний регулятор. Полная рабочая копия.\n\nРегулятор достигает нарисованного положения, но читатель спрашивает, доказывает ли стрелка выполнение требуемого магического условия этого упражнения. Полный черновик оставляет вопрос на полях там, где подготовка должна перейти в удержание внимания заклинателя. Странице требуется яснее описанное соответствие или ещё один независимый урок, прежде чем удачное свечение можно будет считать воспроизводимым письменным указанием.\n\nДополнение к журналу испытаний\nПоследовательные уроки с регулятором установили требуемое условие отдельно от внешнего сходства механизма с движениями заклинателя. Полная копия позволила объяснить и удержание света, и способ завершения начального упражнения заклинателем. Другой учитель теперь воспроизводит начальное световое упражнение и его остановку. Приняты именно проверенные страницы; сложные чары и непереведённые привычки ещё требуют показов. Хор получает читаемые вклады, а не право считать каждое указание доступным любому участнику."
 HSM_BAR_mtk_spell_notation_verification_b_2:0 "Регулятор достигает нарисованного положения, но читатель спрашивает, доказывает ли стрелка выполнение требуемого магического условия этого упражнения. Полный черновик оставляет вопрос на полях там, где подготовка должна перейти в удержание внимания заклинателя. Странице требуется яснее описанное соответствие или ещё один независимый урок, прежде чем удачное свечение можно будет считать воспроизводимым письменным указанием.\n\nНАЗНАЧЕНА ПРОВЕРКА: Обменяться уроками\nДать другому преподавателю провести урок по спорным страницам и вернуть копию с пометками. Это экономит заказ новых схем, но занимает учебное время, особенно для незнакомых регуляторов; уже объяснённое движение быстрее проверяется через второго читателя."
 HSM_BAR_mtk_spell_notation_observation_3:0 "Регулятор достигает нарисованного положения, но читатель спрашивает, доказывает ли стрелка выполнение требуемого магического условия этого упражнения. Сравнительная копия останавливается на пропущенном указании; преподаватель отметил пробел, не пытаясь придумать ответ вместо автора. Странице требуется яснее описанное соответствие или ещё один независимый урок, прежде чем удачное свечение можно будет считать воспроизводимым письменным указанием."
 HSM_BAR_mtk_spell_notation_experiment_report_a_3:0 "УСТАНОВКА: Внешний регулятор. Пропущенное указание.\n\nРегулятор достигает нарисованного положения, но читатель спрашивает, доказывает ли стрелка выполнение требуемого магического условия этого упражнения. Сравнительная копия останавливается на пропущенном указании; преподаватель отметил пробел, не пытаясь придумать ответ вместо автора. Странице требуется яснее описанное соответствие или ещё один независимый урок, прежде чем удачное свечение можно будет считать воспроизводимым письменным указанием.\n\nДополнение к журналу испытаний\nЧертёж регулятора получил отдельную проверку поля вместо признания положения стрелки достаточным доказательством выполнения условия. Пропущенное указание обнаружили и восстановили до того, как исправленное упражнение удалось воспроизвести по странице. Нотация успешна для воспроизведённых начальных упражнений. Она описывает проверяемые действия, не обещая равной магической силы и перевода всех телесных привычек. Сложные чары остаются черновиками. Хор сможет проверять вклады по страницам без невысказанных суждений автора."
