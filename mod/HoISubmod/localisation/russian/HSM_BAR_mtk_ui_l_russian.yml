 HSM_BAR_mtk_revolver_howitzer_rig_question:0 "Какая учебная установка проверит замысел барабана?"
 HSM_BAR_mtk_revolver_howitzer_prepare_rig_a:0 "Целый макет во дворе"
 HSM_BAR_mtk_revolver_howitzer_prepare_rig_a_tt:0 "Провести макет без стрельбы по обычному дворовому маршруту. Включить повороты и подготовку: обещание относится к рабочему циклу, а не к короткому промежутку, который первоначальный чертёж предпочитал учитывать."
 HSM_BAR_mtk_revolver_howitzer_prepare_rig_b:0 "Раздельные стенды"
 HSM_BAR_mtk_revolver_howitzer_prepare_rig_b_tt:0 "Разнести учебную работу расчёта и осмотр на отдельные стенды. Так проще наблюдать тесный доступ, однако каждую измеренную задачу придётся вернуть в полный цикл перед сравнением с обычным орудием."
 HSM_BAR_mtk_revolver_howitzer_control_question:0 "Что обязательно включить в сравнение?"
 HSM_BAR_mtk_revolver_howitzer_prepare_control_a:0 "Путь обычного орудия"
 HSM_BAR_mtk_revolver_howitzer_prepare_control_a_tt:0 "Засечь путь и подготовку обычного сравнительного орудия на том же маршруте. Записать требуемую помощь, чтобы быстрая работа расчёта на одном этапе не скрывал работы, необходимой для достижения исходной позиции перед началом цикла."
 HSM_BAR_mtk_revolver_howitzer_prepare_control_b:0 "Общая задержка"
 HSM_BAR_mtk_revolver_howitzer_prepare_control_b_tt:0 "Ввести имитированную задержку в учебную последовательность работы расчёта. Наблюдать, какие задачи продолжаются, а какие ждут, затем включить осмотр и подготовку повторного начала; весь опыт проводится без стрельбы из орудия."
 HSM_BAR_mtk_revolver_howitzer_observation_0:0 "Дворовому макету нужна дополнительная помощь для поворота; кажущийся выигрыш в работе расчёта не включает это движение. Обычное орудие уже достигло позиции, пока барабанный макет ещё готовят к началу сравнения. Леопольду нужен учёт полного цикла, прежде чем решать, сохраняется ли хоть какое-нибудь обещанное преимущество."
 HSM_BAR_mtk_revolver_howitzer_experiment_report_a_0:0 "УСТАНОВКА: Целый макет во дворе. Путь обычного орудия.\n\nДворовому макету нужна дополнительная помощь для поворота; кажущийся выигрыш в работе расчёта не включает это движение. Обычное орудие уже достигло позиции, пока барабанный макет ещё готовят к началу сравнения. Леопольду нужен учёт полного цикла, прежде чем решать, сохраняется ли хоть какое-нибудь обещанное преимущество.\n\nДополнение к журналу испытаний\nВосстановленный дворовой цикл сохранил затраты на перемещение полного макета. Обычному образцу потребовалось меньше помощи на протяжении полного пути и подготовки к работе. Гаубица провалилась и закрыта без принятия или практической пользы. Вес, доступ и общие задержки уничтожают обещание. Стрельбы не было; Мануфактура должна сохранить этот отвергнутый довод об устранении пауз."
 HSM_BAR_mtk_revolver_howitzer_verification_a_0:0 "Дворовому макету нужна дополнительная помощь для поворота; кажущийся выигрыш в работе расчёта не включает это движение. Обычное орудие уже достигло позиции, пока барабанный макет ещё готовят к началу сравнения. Леопольду нужен учёт полного цикла, прежде чем решать, сохраняется ли хоть какое-нибудь обещанное преимущество.\n\nНАЗНАЧЕНА ПРОВЕРКА: Восстановить весь цикл\nЗаказать единый журнал учебных упражнений без стрельбы, явно учитывая перенос и осмотр. Анализ обойдётся дороже, зато быстрее сведёт раздельные стенды; полный дворовой макет может дать тот же учёт через ещё один, более длительный проход маршрута."
 HSM_BAR_mtk_revolver_howitzer_experiment_report_b_0:0 "УСТАНОВКА: Целый макет во дворе. Путь обычного орудия.\n\nДворовому макету нужна дополнительная помощь для поворота; кажущийся выигрыш в работе расчёта не включает это движение. Обычное орудие уже достигло позиции, пока барабанный макет ещё готовят к началу сравнения. Леопольду нужен учёт полного цикла, прежде чем решать, сохраняется ли хоть какое-нибудь обещанное преимущество.\n\nДополнение к журналу испытаний\nЕщё один дворовой маршрут подтвердил, что подготовка поглощает якобы сэкономленное время работы расчёта. Обычному образцу потребовалось меньше помощи на протяжении полного пути и подготовки к работе. Ни пригодного оружия, ни полезных самостоятельных узлов не получилось. Макет снят без стрельбы. Его узлы не дали пригодного применения; отчёт остаётся при Мануфактуре, поскольку объединение операций не устраняет их остановок."
 HSM_BAR_mtk_revolver_howitzer_verification_b_0:0 "Дворовому макету нужна дополнительная помощь для поворота; кажущийся выигрыш в работе расчёта не включает это движение. Обычное орудие уже достигло позиции, пока барабанный макет ещё готовят к началу сравнения. Леопольду нужен учёт полного цикла, прежде чем решать, сохраняется ли хоть какое-нибудь обещанное преимущество.\n\nНАЗНАЧЕНА ПРОВЕРКА: Повторить цикл\nСохранить учебное оборудование и повторить полностью наблюдаемый рабочий цикл. Заказных расчётов потребуется меньше, но объединение раздельных стендов дольше займёт работников; для дворового макета маршрут уже готов и допускает прямое сравнение полного рабочего цикла."
 HSM_BAR_mtk_revolver_howitzer_observation_1:0 "Дворовому макету нужна дополнительная помощь для поворота; кажущийся выигрыш в работе расчёта не включает это движение. Имитированная задержка удерживает всю последовательность, оставляя работников ждать возле остальных доступных операций. Леопольду нужен учёт полного цикла, прежде чем решать, сохраняется ли хоть какое-нибудь обещанное преимущество."
 HSM_BAR_mtk_revolver_howitzer_experiment_report_a_1:0 "УСТАНОВКА: Целый макет во дворе. Общая задержка.\n\nДворовому макету нужна дополнительная помощь для поворота; кажущийся выигрыш в работе расчёта не включает это движение. Имитированная задержка удерживает всю последовательность, оставляя работников ждать возле остальных доступных операций. Леопольду нужен учёт полного цикла, прежде чем решать, сохраняется ли хоть какое-нибудь обещанное преимущество.\n\nДополнение к журналу испытаний\nВосстановленный дворовой цикл сохранил затраты на перемещение полного макета. Имитированная задержка по-прежнему не позволяла частям всей последовательности независимо вернуться к работе. Гаубица провалилась и закрыта без принятия или практической пользы. Вес, доступ и общие задержки уничтожают обещание. Стрельбы не было; Мануфактура должна сохранить этот отвергнутый довод об устранении пауз."
 HSM_BAR_mtk_revolver_howitzer_verification_a_1:0 "Дворовому макету нужна дополнительная помощь для поворота; кажущийся выигрыш в работе расчёта не включает это движение. Имитированная задержка удерживает всю последовательность, оставляя работников ждать возле остальных доступных операций. Леопольду нужен учёт полного цикла, прежде чем решать, сохраняется ли хоть какое-нибудь обещанное преимущество.\n\nНАЗНАЧЕНА ПРОВЕРКА: Восстановить весь цикл\nЗаказать единый журнал учебных упражнений без стрельбы, явно учитывая перенос и осмотр. Анализ обойдётся дороже, зато быстрее сведёт раздельные стенды; полный дворовой макет может дать тот же учёт через ещё один, более длительный проход маршрута."
 HSM_BAR_mtk_revolver_howitzer_experiment_report_b_1:0 "УСТАНОВКА: Целый макет во дворе. Общая задержка.\n\nДворовому макету нужна дополнительная помощь для поворота; кажущийся выигрыш в работе расчёта не включает это движение. Имитированная задержка удерживает всю последовательность, оставляя работников ждать возле остальных доступных операций. Леопольду нужен учёт полного цикла, прежде чем решать, сохраняется ли хоть какое-нибудь обещанное преимущество.\n\nДополнение к журналу испытаний\nЕщё один дворовой маршрут подтвердил, что подготовка поглощает якобы сэкономленное время работы расчёта. Имитированная задержка по-прежнему не позволяла частям всей последовательности независимо вернуться к работе. Ни пригодного оружия, ни полезных самостоятельных узлов не получилось. Макет снят без стрельбы. Его узлы не дали пригодного применения; отчёт остаётся при Мануфактуре, поскольку объединение операций не устраняет их остановок."
 HSM_BAR_mtk_revolver_howitzer_verification_b_1:0 "Дворовому макету нужна дополнительная помощь для поворота; кажущийся выигрыш в работе расчёта не включает это движение. Имитированная задержка удерживает всю последовательность, оставляя работников ждать возле остальных доступных операций. Леопольду нужен учёт полного цикла, прежде чем решать, сохраняется ли хоть какое-нибудь обещанное преимущество.\n\nНАЗНАЧЕНА ПРОВЕРКА: Повторить цикл\nСохранить учебное оборудование и повторить полностью наблюдаемый рабочий цикл. Заказных расчётов потребуется меньше, но объединение раздельных стендов дольше займёт работников; для дворового макета маршрут уже готов и допускает прямое сравнение полного рабочего цикла."
 HSM_BAR_mtk_revolver_howitzer_observation_2:0 "Раздельные стенды выявляют неудобный доступ для осмотра, но короткие записи скрывают промежутки между операциями. Обычное орудие уже достигло позиции, пока барабанный макет ещё готовят к началу сравнения. Леопольду нужен учёт полного цикла, прежде чем решать, сохраняется ли хоть какое-нибудь обещанное преимущество."
 HSM_BAR_mtk_revolver_howitzer_experiment_report_a_2:0 "УСТАНОВКА: Раздельные стенды. Путь обычного орудия.\n\nРаздельные стенды выявляют неудобный доступ для осмотра, но короткие записи скрывают промежутки между операциями. Обычное орудие уже достигло позиции, пока барабанный макет ещё готовят к началу сравнения. Леопольду нужен учёт полного цикла, прежде чем решать, сохраняется ли хоть какое-нибудь обещанное преимущество.\n\nДополнение к журналу испытаний\nОбъединённый журнал стендов вернул пропущенные переносы и подготовку в расчёт обещанного выигрыша. Обычному образцу потребовалось меньше помощи на протяжении полного пути и подготовки к работе. Гаубица провалилась и закрыта без принятия или практической пользы. Вес, доступ и общие задержки уничтожают обещание. Стрельбы не было; Мануфактура должна сохранить этот отвергнутый довод об устранении пауз."
 HSM_BAR_mtk_revolver_howitzer_verification_a_2:0 "Раздельные стенды выявляют неудобный доступ для осмотра, но короткие записи скрывают промежутки между операциями. Обычное орудие уже достигло позиции, пока барабанный макет ещё готовят к началу сравнения. Леопольду нужен учёт полного цикла, прежде чем решать, сохраняется ли хоть какое-нибудь обещанное преимущество.\n\nНАЗНАЧЕНА ПРОВЕРКА: Восстановить весь цикл\nЗаказать единый журнал учебных упражнений без стрельбы, явно учитывая перенос и осмотр. Анализ обойдётся дороже, зато быстрее сведёт раздельные стенды; полный дворовой макет может дать тот же учёт через ещё один, более длительный проход маршрута."
