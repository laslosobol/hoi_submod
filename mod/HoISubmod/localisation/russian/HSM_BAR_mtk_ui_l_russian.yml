 HSM_BAR_mtk_contact_experiment_report_b_2:0 "УСТАНОВКА: Просьба повторить. Чистый исходный след.\n\nИзменённый порядок знаков вызывает просьбу повторить, после чего сосуд замолкает. Чистый исходный след оставляет новую отметку ожидающей нового проверочного задания. Группе нужно проверить взаимность, не продлевая промежуток и не соглашаясь на живого носителя.\n\nДополнение к журналу испытаний\nПовторение не удостоверило говорящего. Новые задания исключили остаток. Тормоз, провал Свидетеля, Память места, Компас и Сосуд вместе ограничивают частичный обмен. Общие знаки не доказывают истины или личности; живые носители и подчинение исключены."
