 HSM_BAR_mtk_crystal_drive_rig_question:0 "Какую перемену нагрузки задать приводу полировального круга?"
 HSM_BAR_mtk_crystal_drive_prepare_rig_a:0 "Растущее сопротивление"
 HSM_BAR_mtk_crystal_drive_prepare_rig_a_tt:0 "Повышать сопротивление в пределах предложенной мастерской задачи, записывая круг отдельно от кристалла. Яркий источник или устойчивая стрелка не доказывают полезного движения, когда сама нагрузка меняется во время проверки."
 HSM_BAR_mtk_crystal_drive_prepare_rig_b:0 "Снятая нагрузка"
 HSM_BAR_mtk_crystal_drive_prepare_rig_b_tt:0 "Убрать обычную полировальную нагрузку в отдельном прогоне и наблюдать остановку. Соседние приборы отмечаются на своём листе, чтобы привод не казался надёжным за счёт незаписанного источника питания поблизости."
 HSM_BAR_mtk_crystal_drive_control_question:0 "Какое состояние источника сопоставить с механической записью?"
 HSM_BAR_mtk_crystal_drive_prepare_control_a:0 "Проверенный кристалл"
 HSM_BAR_mtk_crystal_drive_prepare_control_a_tt:0 "Использовать проверенный образец со спектральным листом Вииры рядом с механической записью. Включить постепенное ослабление и охлаждение: короткий устойчивый прогон ещё не устанавливает неограниченный источник движения для работающего механизма."
 HSM_BAR_mtk_crystal_drive_prepare_control_b:0 "Повреждённый образец"
 HSM_BAR_mtk_crystal_drive_prepare_control_b_tt:0 "Оставить повреждённый образец в отдельном сравнении, не отбрасывая неудобный источник молча. Записывать нерегулярный отклик и прекращать прогон при необходимости; принятое описание привода должно указывать, какие кристаллы исключены из использования."
 HSM_BAR_mtk_crystal_drive_observation_0:0 "Рост сопротивления оставляет круг внешне устойчивым, пока корпус постепенно нагревается. Спектр проверенного источника меняется постепенно, но промежуток охлаждения пока записан недостаточно ясно. Осмотр источника, регулирование и запись остановки должны согласоваться до передачи круга другому оператору."
 HSM_BAR_mtk_crystal_drive_experiment_report_a_0:0 "УСТАНОВКА: Растущее сопротивление. Проверенный кристалл.\n\nРост сопротивления оставляет круг внешне устойчивым, пока корпус постепенно нагревается. Спектр проверенного источника меняется постепенно, но промежуток охлаждения пока записан недостаточно ясно. Осмотр источника, регулирование и запись остановки должны согласоваться до передачи круга другому оператору.\n\nДополнение к журналу испытаний\nНастройка согласовала указатель нагруженного круга с записью источника и потребовала паузы охлаждения. Проверенный источник при ослаблении давал предсказуемую остановку, не заимствуя питание у соседних приборов. Привод успешен для описанных нагрузок при проверенных источниках и охлаждении. Другой оператор повторил остановку. Привод не создаёт кристаллов или универсального питания; Мануфактура должна сохранить эти рабочие ограничения."
 HSM_BAR_mtk_crystal_drive_verification_a_0:0 "Рост сопротивления оставляет круг внешне устойчивым, пока корпус постепенно нагревается. Спектр проверенного источника меняется постепенно, но промежуток охлаждения пока записан недостаточно ясно. Осмотр источника, регулирование и запись остановки должны согласоваться до передачи круга другому оператору.\n\nНАЗНАЧЕНА ПРОВЕРКА: Настроить остановку\nОплатить совместную механическую и спектральную настройку остановки. Расхождение при снятой нагрузке так устраняется быстрее; нагретый нагруженный корпус всё равно требует наблюдения, поэтому длительная серия охлаждений здесь становится менее дорогим способом завершить проверку."
 HSM_BAR_mtk_crystal_drive_experiment_report_b_0:0 "УСТАНОВКА: Растущее сопротивление. Проверенный кристалл.\n\nРост сопротивления оставляет круг внешне устойчивым, пока корпус постепенно нагревается. Спектр проверенного источника меняется постепенно, но промежуток охлаждения пока записан недостаточно ясно. Осмотр источника, регулирование и запись остановки должны согласоваться до передачи круга другому оператору.\n\nДополнение к журналу испытаний\nПовторы под нагрузкой установили промежуток охлаждения до того, как нагрев мешал надёжному движению. Проверенный источник при ослаблении давал предсказуемую остановку, не заимствуя питание у соседних приборов. Принятый привод даёт ограниченное, проверяемое движение и испытанную остановку. Подготовленные кристаллы и охлаждение обязательны. Регулирование не исправляет повреждения; результат не оправдывает соединения всех мастерских машин с одним источником."
 HSM_BAR_mtk_crystal_drive_verification_b_0:0 "Рост сопротивления оставляет круг внешне устойчивым, пока корпус постепенно нагревается. Спектр проверенного источника меняется постепенно, но промежуток охлаждения пока записан недостаточно ясно. Осмотр источника, регулирование и запись остановки должны согласоваться до передачи круга другому оператору.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить охлаждение\nСохранить регулятор и наблюдать прогоны с отдыхом через нагрев, охлаждение и истощение источника. Это экономит новую настройку, но дольше занимает работу после снятия нагрузки; при постоянной нагрузке нужная температурная запись уже собирается наблюдателями."
 HSM_BAR_mtk_crystal_drive_observation_1:0 "Рост сопротивления оставляет круг внешне устойчивым, пока корпус постепенно нагревается. Повреждённый сравнительный источник отвечает нерегулярно, поэтому механическая стрелка недостаточно описывает его состояние. Осмотр источника, регулирование и запись остановки должны согласоваться до передачи круга другому оператору."
 HSM_BAR_mtk_crystal_drive_experiment_report_a_1:0 "УСТАНОВКА: Растущее сопротивление. Повреждённый образец.\n\nРост сопротивления оставляет круг внешне устойчивым, пока корпус постепенно нагревается. Повреждённый сравнительный источник отвечает нерегулярно, поэтому механическая стрелка недостаточно описывает его состояние. Осмотр источника, регулирование и запись остановки должны согласоваться до передачи круга другому оператору.\n\nДополнение к журналу испытаний\nНастройка согласовала указатель нагруженного круга с записью источника и потребовала паузы охлаждения. Повреждённые образцы остались нерегулярными и были исключены; принятое сравнение выполнено на проверенных заменах. Привод успешен для описанных нагрузок при проверенных источниках и охлаждении. Другой оператор повторил остановку. Привод не создаёт кристаллов или универсального питания; Мануфактура должна сохранить эти рабочие ограничения."
