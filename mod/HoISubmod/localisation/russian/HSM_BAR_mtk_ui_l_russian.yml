 HSM_BAR_mtk_manufactory_verification_b_1:0 "Последовательность корпусов повторяет движения, но передаточный лист пропускает регулировку, сделанную работником. Спорная заготовка ждёт без подписанного назначения, отчего ровный журнал выпуска остаётся неполным. Линии нужны явные передачи между операциями, прежде чем повторение можно будет признать поднадзорным изготовлением изделий.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить прогон\nПовторять утверждённую последовательность с записью каждой выдачи, проверки и запуска работниками. Это экономит новое оснащение станций, но дольше разбирает незнакомые заказы креплений; устойчивая последовательность корпусов уже даёт большую часть нужных для сравнения повторов."
 HSM_BAR_mtk_manufactory_observation_2:0 "Последовательность креплений достигает проверенного образца, но возле заказа лежит незнакомый чертёж. Остановка станции оставляет соседних работников в сомнении, можно ли передавать законченные задачи. Линии нужны явные передачи между операциями, прежде чем повторение можно будет признать поднадзорным изготовлением изделий."
 HSM_BAR_mtk_manufactory_experiment_report_a_2:0 "УСТАНОВКА: Линия креплений. Остановка одной станции.\n\nПоследовательность креплений достигает проверенного образца, но возле заказа лежит незнакомый чертёж. Остановка станции оставляет соседних работников в сомнении, можно ли передавать законченные задачи. Линии нужны явные передачи между операциями, прежде чем повторение можно будет признать поднадзорным изготовлением изделий.\n\nДополнение к журналу испытаний\nИсправленные передачи креплений исключили незаявленный чертёж до отдельных испытаний. Отдельные остановки позволили соседним станциям закончить задачи и запуститься без общего затора. Мануфактура успешна под надзором. Протезы дают проверенные образцы; Саморемонт требует работников и запасов; провал Гаубицы обосновывает отдельные остановки; Привод требует источников и охлаждения; Сортировка оставляет неясности мастеру. Механизмы не мыслят и не содержат связанных душ; новой работе нужны испытания."
 HSM_BAR_mtk_manufactory_verification_a_2:0 "Последовательность креплений достигает проверенного образца, но возле заказа лежит незнакомый чертёж. Остановка станции оставляет соседних работников в сомнении, можно ли передавать законченные задачи. Линии нужны явные передачи между операциями, прежде чем повторение можно будет признать поднадзорным изготовлением изделий.\n\nНАЗНАЧЕНА ПРОВЕРКА: Переделать передачи\nЗаказать ясные границы станций и подписываемые передаточные листы. Расходы мастерской быстрее разрешат исключения креплений; повторяемая последовательность корпусов может выявить пропущенные вмешательства через более долгий поднадзорный прогон при нынешнем расположении рабочих мест линии."
 HSM_BAR_mtk_manufactory_experiment_report_b_2:0 "УСТАНОВКА: Линия креплений. Остановка одной станции.\n\nПоследовательность креплений достигает проверенного образца, но возле заказа лежит незнакомый чертёж. Остановка станции оставляет соседних работников в сомнении, можно ли передавать законченные задачи. Линии нужны явные передачи между операциями, прежде чем повторение можно будет признать поднадзорным изготовлением изделий.\n\nДополнение к журналу испытаний\nПрогон креплений принял только указанный образец и вернул незнакомый заказ. Отдельные остановки позволили соседним станциям закончить задачи и запуститься без общего затора. Принятое изготовление ограничено всеми исследованиями: образцами Протезов, обслуживаемым Саморемонтом, отдельными остановками после провала Гаубицы, охлаждаемым Приводом и поднадзорной Сортировкой. Неудачное орудие не получает практической пользы. Выпуск требует осмотра; неизвестные заказы не рождают новой задачи или самостоятельной мысли."
