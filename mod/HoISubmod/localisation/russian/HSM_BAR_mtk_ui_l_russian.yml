 HSM_BAR_mtk_self_repair_experiment_report_a_2:0 "УСТАНОВКА: Незнакомый перекос. Чистый стенд.\n\nНезнакомый перекос вызывает обычное предупреждение, которое не указывает конкретную замену или регулировку для остановленного учебного узла. На чистом стенде осмотр обнаруживает больше работы, чем записано в аккуратном машинном описании этого предупреждения. Последовательности нужны явный осмотр мастером и учёт материалов, прежде чем вспомогательную регулировку можно будет отличить от обещанного самостоятельного ремонта машины.\n\nДополнение к журналу испытаний\nЛист перекоса направляет неопределённое предупреждение на осмотр вместо догадки о необходимом способе ремонта узла. Независимый осмотр сохранил за мастером решение о необходимости регулировки или замены повреждённой детали. Частичный результат представляет обслуживание с подготовленными запасами и доступными точками ремонта. Треснувшие детали требуют замены; машина не распознаёт произвольных повреждений и не создаёт материал. Мануфактуре понадобится мастерская с работниками, а не необъяснённый этап исцеления механизмов."
 HSM_BAR_mtk_self_repair_verification_a_2:0 "Незнакомый перекос вызывает обычное предупреждение, которое не указывает конкретную замену или регулировку для остановленного учебного узла. На чистом стенде осмотр обнаруживает больше работы, чем записано в аккуратном машинном описании этого предупреждения. Последовательности нужны явный осмотр мастером и учёт материалов, прежде чем вспомогательную регулировку можно будет отличить от обещанного самостоятельного ремонта машины.\n\nНАЗНАЧЕНА ПРОВЕРКА: Переписать обслуживание\nЗаказать явный порядок обслуживания с точками осмотра и замены. Чертёж обойдётся дороже, зато быстрее разберёт незнакомое предупреждение; знакомый люфт можно проследить с нынешним приспособлением, потратив больше времени на подробный журнал работы мастера."
 HSM_BAR_mtk_self_repair_experiment_report_b_2:0 "УСТАНОВКА: Незнакомый перекос. Чистый стенд.\n\nНезнакомый перекос вызывает обычное предупреждение, которое не указывает конкретную замену или регулировку для остановленного учебного узла. На чистом стенде осмотр обнаруживает больше работы, чем записано в аккуратном машинном описании этого предупреждения. Последовательности нужны явный осмотр мастером и учёт материалов, прежде чем вспомогательную регулировку можно будет отличить от обещанного самостоятельного ремонта машины.\n\nДополнение к журналу испытаний\nЖурнал перекоса зафиксировал осмотр и выданные замены, которые первоначальная последовательность самостоятельного ремонта оставляла за скобками. Независимый осмотр сохранил за мастером решение о необходимости регулировки или замены повреждённой детали. Сохранённая процедура помогает работникам обслуживать знакомые узлы. Предупреждения ограниченны, каждый запуск разрешает мастер. Ни одна сломанная деталь не восстановилась сама. Для Мануфактуры важны явно указанные труд обслуживания и запасы, а не способность машины к самостоятельному исцелению."
 HSM_BAR_mtk_self_repair_verification_b_2:0 "Незнакомый перекос вызывает обычное предупреждение, которое не указывает конкретную замену или регулировку для остановленного учебного узла. На чистом стенде осмотр обнаруживает больше работы, чем записано в аккуратном машинном описании этого предупреждения. Последовательности нужны явный осмотр мастером и учёт материалов, прежде чем вспомогательную регулировку можно будет отличить от обещанного самостоятельного ремонта машины.\n\nНАЗНАЧЕНА ПРОВЕРКА: Учесть работу мастеров\nПродлить наблюдения стенда и записывать каждую регулировку, очистку и выданную деталь. Имеющиеся инструменты уменьшают счёт, но незнакомое повреждение дольше занимает стенд; привычный износ можно проследить без предварительного заказа полностью переработанного чертежа обслуживания."
 HSM_BAR_mtk_self_repair_observation_3:0 "Незнакомый перекос вызывает обычное предупреждение, которое не указывает конкретную замену или регулировку для остановленного учебного узла. Пыль глушит указатель, пока мастер не протирает его; это вмешательство отсутствует на рисунке предполагаемого обслуживания. Последовательности нужны явный осмотр мастером и учёт материалов, прежде чем вспомогательную регулировку можно будет отличить от обещанного самостоятельного ремонта машины."
