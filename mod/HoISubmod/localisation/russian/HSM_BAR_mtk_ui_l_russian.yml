 HSM_BAR_mtk_crystal_memory_verification_b_3:0 "Повторно записанные кристаллы возвращают лишнюю дугу, которая больше похожа на прежнюю экспозицию, чем на новый рисунок. На тёплой полке внешние отметки расплываются раньше, отчего порча при хранении напоминает ошибку в исходном рисунке. Следу нужны история экспозиций и проверенное сравнение условий хранения, прежде чем его можно будет подшить как временную запись проведённого опыта.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить хранение\nИспользовать прежние лотки для разнесённых по времени чтений в обоих условиях. Это экономит новые приспособления хранения, но при наложении старого и нового изображений потребует больше времени; чистая экспозиция позволит быстрее закончить сравнение угасания."
 HSM_BAR_mtk_crystal_memory_respond_a:0 "Разделить записи"
 HSM_BAR_mtk_crystal_memory_respond_a_tt:0 "Заказать отдельные лотки и сравнить каждое воспроизведение с обеими исходными схемами. Учёт потребует больших расходов, зато быстрее распутает повторные записи; новым образцам без прежнего изображения восстановление истории экспозиций поможет в меньшей степени.\n\n[GetHSMBARMtkResponseBudget_crystal_memory_a]"
