 HSM_BAR_mtk_phantom_pain_rig_question:0 "Какая повседневная ситуация станет опорой дневника боли?"
 HSM_BAR_mtk_phantom_pain_prepare_rig_a:0 "Покой отсутствующей лапы"
 HSM_BAR_mtk_phantom_pain_prepare_rig_a_tt:0 "Отметить воспринимаемую отсутствующую лапу в покое до противоузора. Обычную чувствительность оставшейся конечности записать отдельно, чтобы затихший фантом не скрыл онемение или другой источник боли, требующий собственного внимания при осмотре."
 HSM_BAR_mtk_phantom_pain_prepare_rig_b:0 "Работа и чашка"
 HSM_BAR_mtk_phantom_pain_prepare_rig_b_tt:0 "Записывать выбранную лёгкую задачу рядом с воспринимаемой позой отсутствующей лапы. Спрашивать о чашке и плече отдельно: более простое движение не доказывает изменения каждой составляющей боли, испытываемой пациентом во время работы."
 HSM_BAR_mtk_phantom_pain_control_question:0 "Чем проверить сообщённое облегчение?"
 HSM_BAR_mtk_phantom_pain_prepare_control_a:0 "Неактивные сеансы"
 HSM_BAR_mtk_phantom_pain_prepare_control_a_tt:0 "Чередовать активные и неактивные встречи, скрывая порядок от осматривающей сестры. Сохранять рассказ пациента в обоих случаях: улучшение, связанное с самим посещением, нельзя автоматически приписывать нанесённому узору без дальнейшего сравнения."
 HSM_BAR_mtk_phantom_pain_prepare_control_b:0 "Дневник между визитами"
 HSM_BAR_mtk_phantom_pain_prepare_control_b_tt:0 "Продолжать дневник за пределами лучшего часа в клинике, включая дни без исследователя. Записывать возвращение боли и практическое решение пациента о новой встрече, вместо того чтобы терять эти подробности при усреднении."
 HSM_BAR_mtk_phantom_pain_observation_0:0 "В покое воспринимаемый коготь ненадолго расслабляется, хотя рубец остаётся без изменений. Неактивный визит тоже приносит облегчение, оставляя вклад узора неясным. Нужно разделить временное облегчение, ожидание и обычную функцию, прежде чем предлагать дальнейшие сеансы."
 HSM_BAR_mtk_phantom_pain_experiment_report_a_0:0 "УСТАНОВКА: Покой отсутствующей лапы. Неактивные сеансы.\n\nВ покое воспринимаемый коготь ненадолго расслабляется, хотя рубец остаётся без изменений. Неактивный визит тоже приносит облегчение, оставляя вклад узора неясным. Нужно разделить временное облегчение, ожидание и обычную функцию, прежде чем предлагать дальнейшие сеансы.\n\nДополнение к журналу испытаний\nИсправленная карта покоя отделила расслабление фантома от обычной чувствительности. Неактивные сравнения показали, что часть улучшений одинаково сопровождала оба вида посещений. Подтверждено лишь временное облегчение у некоторых. Отклик непредсказуем; обычный уход продолжается. Конечность не возвращается, комфорт не означает восстановления."
 HSM_BAR_mtk_phantom_pain_verification_a_0:0 "В покое воспринимаемый коготь ненадолго расслабляется, хотя рубец остаётся без изменений. Неактивный визит тоже приносит облегчение, оставляя вклад узора неясным. Нужно разделить временное облегчение, ожидание и обычную функцию, прежде чем предлагать дальнейшие сеансы.\n\nНАЗНАЧЕНА ПРОВЕРКА: Уточнить противоузор\nПотратить дополнительную клиническую работу на разделение воспринимаемой позы и боли оставшейся конечности. Это быстрее проясняет рабочую задачу, но спокойный отдых уже даёт простую карту; более долгие парные посещения там потребуют меньше новой подготовки."
 HSM_BAR_mtk_phantom_pain_experiment_report_b_0:0 "УСТАНОВКА: Покой отсутствующей лапы. Неактивные сеансы.\n\nВ покое воспринимаемый коготь ненадолго расслабляется, хотя рубец остаётся без изменений. Неактивный визит тоже приносит облегчение, оставляя вклад узора неясным. Нужно разделить временное облегчение, ожидание и обычную функцию, прежде чем предлагать дальнейшие сеансы.\n\nДополнение к журналу испытаний\nБолее долгие сравнения покоя сохранили краткое облегчение лишь у части участников. Неактивные сравнения показали, что часть улучшений одинаково сопровождала оба вида посещений. Облегчение ограниченно и временно. Дальнейшие посещения зависят от пользы и выбора пациента; ни общего излечения, ни надёжного прогноза нет."
 HSM_BAR_mtk_phantom_pain_verification_b_0:0 "В покое воспринимаемый коготь ненадолго расслабляется, хотя рубец остаётся без изменений. Неактивный визит тоже приносит облегчение, оставляя вклад узора неясным. Нужно разделить временное облегчение, ожидание и обычную функцию, прежде чем предлагать дальнейшие сеансы.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить сравнение\nСохранить узор и дольше сравнивать активные встречи, тихие посещения и дневник пациента. Это сокращает новую подготовку, но требует больше времени при наложении рабочей боли на фантом; спокойные сеансы содержат меньше одновременных изменений для разбора."
 HSM_BAR_mtk_phantom_pain_observation_1:0 "В покое воспринимаемый коготь ненадолго расслабляется, хотя рубец остаётся без изменений. Дневник отмечает возвращение боли после обещающего часа в клинике. Нужно разделить временное облегчение, ожидание и обычную функцию, прежде чем предлагать дальнейшие сеансы."
 HSM_BAR_mtk_phantom_pain_experiment_report_a_1:0 "УСТАНОВКА: Покой отсутствующей лапы. Дневник между визитами.\n\nВ покое воспринимаемый коготь ненадолго расслабляется, хотя рубец остаётся без изменений. Дневник отмечает возвращение боли после обещающего часа в клинике. Нужно разделить временное облегчение, ожидание и обычную функцию, прежде чем предлагать дальнейшие сеансы.\n\nДополнение к журналу испытаний\nИсправленная карта покоя отделила расслабление фантома от обычной чувствительности. Дневники сохранили возвращение боли и предпочтение пациента относительно дальнейших посещений клиники. Подтверждено лишь временное облегчение у некоторых. Отклик непредсказуем; обычный уход продолжается. Конечность не возвращается, комфорт не означает восстановления."
