 HSM_BAR_mtk_last_minute_rig_question:0 "Какую передачу помощи отработает экстренный контур?"
 HSM_BAR_mtk_last_minute_prepare_rig_a:0 "Поддержка до операции"
 HSM_BAR_mtk_last_minute_prepare_rig_a_tt:0 "Отработать временную поддержку структур до передачи врачу. Кровообращение и дыхание сохраняются непрерывно: провал Сна без старости не позволяет утверждать, будто неподвижный пациент безопасно вышел за пределы обычных потребностей живого тела."
 HSM_BAR_mtk_last_minute_prepare_rig_b:0 "Передача обычному уходу"
 HSM_BAR_mtk_last_minute_prepare_rig_b_tt:0 "Отработать постепенное снятие по мере возвращения обычной функции с доступным немедленным врачебным отключением. Контур должен уступать лечению, а запись сохраняет неудачные случаи рядом с теми, которые дошли до окончательной помощи."
 HSM_BAR_mtk_last_minute_control_question:0 "Какая независимая запись проверит видимую устойчивость?"
 HSM_BAR_mtk_last_minute_prepare_control_a:0 "Кровоток и реакция"
 HSM_BAR_mtk_last_minute_prepare_control_a_tt:0 "Записывать кровообращение и реакцию отдельно от сообщённого комфорта. Фантомная боль показала реальность облегчения без восстановления; экстренный промежуток поэтому оценивается по живой функции при сохраняющейся возможности оказать необходимое окончательное лечение."
 HSM_BAR_mtk_last_minute_prepare_control_b:0 "Проверка материалов"
 HSM_BAR_mtk_last_minute_prepare_control_b_tt:0 "Проверить каждый трансплантат после согревания и инструмент после обоих проходов. Банк тканей и Стерильные чары дают ограниченные проверенные материалы; внешне полный экстренный лоток не должен незаметно расширять принятые пределы этих исследований."
 HSM_BAR_mtk_last_minute_observation_0:0 "Поддержка держит повреждённые структуры, но запись передачи ещё не определяет момент вступления хирурга. Комфорт улучшается раньше, чем независимая запись кровообращения становится устойчивой. Контуру нужна проверенная передача помощи, прежде чем экстренный промежуток можно будет принять."
 HSM_BAR_mtk_last_minute_experiment_report_a_0:0 "УСТАНОВКА: Поддержка до операции. Кровоток и реакция.\n\nПоддержка держит повреждённые структуры, но запись передачи ещё не определяет момент вступления хирурга. Комфорт улучшается раньше, чем независимая запись кровообращения становится устойчивой. Контуру нужна проверенная передача помощи, прежде чем экстренный промежуток можно будет принять.\n\nДополнение к журналу испытаний\nПоддержка передана хирургу. Кровоснабжение оценивалось отдельно от комфорта. Шов поддерживает; Банк ограничивает трансплантаты; провал Сна запрещает приостановку; Стерильные чары очищают инструменты; Фантомная боль отличает комфорт. Стабилизация требует срочного лечения, не воскрешает."
 HSM_BAR_mtk_last_minute_verification_a_0:0 "Поддержка держит повреждённые структуры, но запись передачи ещё не определяет момент вступления хирурга. Комфорт улучшается раньше, чем независимая запись кровообращения становится устойчивой. Контуру нужна проверенная передача помощи, прежде чем экстренный промежуток можно будет принять.\n\nНАЗНАЧЕНА ПРОВЕРКА: Уточнить передачу помощи\nЗаказать согласованный лист передачи между контуром, врачом и независимыми проверками. Подготовка дороже, зато быстрее проясняет снятие; промежуток поддержки, уже заканчивающийся операцией, можно проверить более долгими поднадзорными репетициями при нынешнем расположении рабочих мест."
 HSM_BAR_mtk_last_minute_experiment_report_b_0:0 "УСТАНОВКА: Поддержка до операции. Кровоток и реакция.\n\nПоддержка держит повреждённые структуры, но запись передачи ещё не определяет момент вступления хирурга. Комфорт улучшается раньше, чем независимая запись кровообращения становится устойчивой. Контуру нужна проверенная передача помощи, прежде чем экстренный промежуток можно будет принять.\n\nДополнение к журналу испытаний\nРепетиции проверили передачу хирургу. Кровоснабжение оценивалось отдельно от комфорта. Шов, выборочный Банк, провал Сна, Стерильные чары и Фантомная боль ограничивают поддержку, запасы, обмен, инструменты и оценку. Стабилизация успешна; разрушенный мозг и смерть необратимы."
 HSM_BAR_mtk_last_minute_verification_b_0:0 "Поддержка держит повреждённые структуры, но запись передачи ещё не определяет момент вступления хирурга. Комфорт улучшается раньше, чем независимая запись кровообращения становится устойчивой. Контуру нужна проверенная передача помощи, прежде чем экстренный промежуток можно будет принять.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить репетиции\nСохранить расположение и репетировать всю передачу со всеми независимыми записями. Это экономит новые приспособления, но дольше занимает группу при спорном снятии; определённое прибытие хирурга уже даёт более ясный конец для репетиции временной поддержки."
 HSM_BAR_mtk_last_minute_observation_1:0 "Поддержка держит повреждённые структуры, но запись передачи ещё не определяет момент вступления хирурга. В лотке есть материал, ещё ожидающий положенной независимой проверки. Контуру нужна проверенная передача помощи, прежде чем экстренный промежуток можно будет принять."
 HSM_BAR_mtk_last_minute_experiment_report_a_1:0 "УСТАНОВКА: Поддержка до операции. Проверка материалов.\n\nПоддержка держит повреждённые структуры, но запись передачи ещё не определяет момент вступления хирурга. В лотке есть материал, ещё ожидающий положенной независимой проверки. Контуру нужна проверенная передача помощи, прежде чем экстренный промежуток можно будет принять.\n\nДополнение к журналу испытаний\nПоддержка передана хирургу. Допускались только проверенные материалы. Шов поддерживает; Банк ограничивает трансплантаты; провал Сна запрещает приостановку; Стерильные чары очищают инструменты; Фантомная боль отличает комфорт. Стабилизация требует срочного лечения, не воскрешает."
 HSM_BAR_mtk_last_minute_verification_a_1:0 "Поддержка держит повреждённые структуры, но запись передачи ещё не определяет момент вступления хирурга. В лотке есть материал, ещё ожидающий положенной независимой проверки. Контуру нужна проверенная передача помощи, прежде чем экстренный промежуток можно будет принять.\n\nНАЗНАЧЕНА ПРОВЕРКА: Уточнить передачу помощи\nЗаказать согласованный лист передачи между контуром, врачом и независимыми проверками. Подготовка дороже, зато быстрее проясняет снятие; промежуток поддержки, уже заканчивающийся операцией, можно проверить более долгими поднадзорными репетициями при нынешнем расположении рабочих мест."
 HSM_BAR_mtk_last_minute_experiment_report_b_1:0 "УСТАНОВКА: Поддержка до операции. Проверка материалов.\n\nПоддержка держит повреждённые структуры, но запись передачи ещё не определяет момент вступления хирурга. В лотке есть материал, ещё ожидающий положенной независимой проверки. Контуру нужна проверенная передача помощи, прежде чем экстренный промежуток можно будет принять.\n\nДополнение к журналу испытаний\nРепетиции проверили передачу хирургу. Допускались только проверенные материалы. Шов, выборочный Банк, провал Сна, Стерильные чары и Фантомная боль ограничивают поддержку, запасы, обмен, инструменты и оценку. Стабилизация успешна; разрушенный мозг и смерть необратимы."
 HSM_BAR_mtk_last_minute_verification_b_1:0 "Поддержка держит повреждённые структуры, но запись передачи ещё не определяет момент вступления хирурга. В лотке есть материал, ещё ожидающий положенной независимой проверки. Контуру нужна проверенная передача помощи, прежде чем экстренный промежуток можно будет принять.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить репетиции\nСохранить расположение и репетировать всю передачу со всеми независимыми записями. Это экономит новые приспособления, но дольше занимает группу при спорном снятии; определённое прибытие хирурга уже даёт более ясный конец для репетиции временной поддержки."
 HSM_BAR_mtk_last_minute_observation_2:0 "Снятие начинается при возвращении обычного движения, однако передача врачу остаётся неясной. Комфорт улучшается раньше, чем независимая запись кровообращения становится устойчивой. Контуру нужна проверенная передача помощи, прежде чем экстренный промежуток можно будет принять."
 HSM_BAR_mtk_last_minute_experiment_report_a_2:0 "УСТАНОВКА: Передача обычному уходу. Кровоток и реакция.\n\nСнятие начинается при возвращении обычного движения, однако передача врачу остаётся неясной. Комфорт улучшается раньше, чем независимая запись кровообращения становится устойчивой. Контуру нужна проверенная передача помощи, прежде чем экстренный промежуток можно будет принять.\n\nДополнение к журналу испытаний\nСнятие осталось решением врача. Кровоснабжение оценивалось отдельно от комфорта. Шов поддерживает; Банк ограничивает трансплантаты; провал Сна запрещает приостановку; Стерильные чары очищают инструменты; Фантомная боль отличает комфорт. Стабилизация требует срочного лечения, не воскрешает."
 HSM_BAR_mtk_last_minute_verification_a_2:0 "Снятие начинается при возвращении обычного движения, однако передача врачу остаётся неясной. Комфорт улучшается раньше, чем независимая запись кровообращения становится устойчивой. Контуру нужна проверенная передача помощи, прежде чем экстренный промежуток можно будет принять.\n\nНАЗНАЧЕНА ПРОВЕРКА: Уточнить передачу помощи\nЗаказать согласованный лист передачи между контуром, врачом и независимыми проверками. Подготовка дороже, зато быстрее проясняет снятие; промежуток поддержки, уже заканчивающийся операцией, можно проверить более долгими поднадзорными репетициями при нынешнем расположении рабочих мест."
 HSM_BAR_mtk_last_minute_experiment_report_b_2:0 "УСТАНОВКА: Передача обычному уходу. Кровоток и реакция.\n\nСнятие начинается при возвращении обычного движения, однако передача врачу остаётся неясной. Комфорт улучшается раньше, чем независимая запись кровообращения становится устойчивой. Контуру нужна проверенная передача помощи, прежде чем экстренный промежуток можно будет принять.\n\nДополнение к журналу испытаний\nРепетиции проверили врачебное снятие. Кровоснабжение оценивалось отдельно от комфорта. Шов, выборочный Банк, провал Сна, Стерильные чары и Фантомная боль ограничивают поддержку, запасы, обмен, инструменты и оценку. Стабилизация успешна; разрушенный мозг и смерть необратимы."
