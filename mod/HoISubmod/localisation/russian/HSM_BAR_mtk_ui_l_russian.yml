 HSM_BAR_mtk_manufactory_verification_a_3:0 "Последовательность креплений достигает проверенного образца, но возле заказа лежит незнакомый чертёж. Спорная заготовка ждёт без подписанного назначения, отчего ровный журнал выпуска остаётся неполным. Линии нужны явные передачи между операциями, прежде чем повторение можно будет признать поднадзорным изготовлением изделий.\n\nНАЗНАЧЕНА ПРОВЕРКА: Переделать передачи\nЗаказать ясные границы станций и подписываемые передаточные листы. Расходы мастерской быстрее разрешат исключения креплений; повторяемая последовательность корпусов может выявить пропущенные вмешательства через более долгий поднадзорный прогон при нынешнем расположении рабочих мест линии."
 HSM_BAR_mtk_manufactory_experiment_report_b_3:0 "УСТАНОВКА: Линия креплений. Неопределённая заготовка.\n\nПоследовательность креплений достигает проверенного образца, но возле заказа лежит незнакомый чертёж. Спорная заготовка ждёт без подписанного назначения, отчего ровный журнал выпуска остаётся неполным. Линии нужны явные передачи между операциями, прежде чем повторение можно будет признать поднадзорным изготовлением изделий.\n\nДополнение к журналу испытаний\nПрогон креплений принял только указанный образец и вернул незнакомый заказ. Мастер удерживал сомнительные заготовки вне принятого выпуска до решения об их назначении. Принятое изготовление ограничено всеми исследованиями: образцами Протезов, обслуживаемым Саморемонтом, отдельными остановками после провала Гаубицы, охлаждаемым Приводом и поднадзорной Сортировкой. Неудачное орудие не получает практической пользы. Выпуск требует осмотра; неизвестные заказы не рождают новой задачи или самостоятельной мысли."
 HSM_BAR_mtk_manufactory_verification_b_3:0 "Последовательность креплений достигает проверенного образца, но возле заказа лежит незнакомый чертёж. Спорная заготовка ждёт без подписанного назначения, отчего ровный журнал выпуска остаётся неполным. Линии нужны явные передачи между операциями, прежде чем повторение можно будет признать поднадзорным изготовлением изделий.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить прогон\nПовторять утверждённую последовательность с записью каждой выдачи, проверки и запуска работниками. Это экономит новое оснащение станций, но дольше разбирает незнакомые заказы креплений; устойчивая последовательность корпусов уже даёт большую часть нужных для сравнения повторов."
 HSM_BAR_mtk_manufactory_respond_a:0 "Переделать передачи"
 HSM_BAR_mtk_manufactory_respond_a_tt:0 "Заказать ясные границы станций и подписываемые передаточные листы. Расходы мастерской быстрее разрешат исключения креплений; повторяемая последовательность корпусов может выявить пропущенные вмешательства через более долгий поднадзорный прогон при нынешнем расположении рабочих мест линии.\n\n[GetHSMBARMtkResponseBudget_manufactory_a]"
