 HSM_BAR_mtk_threshold_compass_rig_question:0 "Где парным резонаторам впервые измерить границу?"
 HSM_BAR_mtk_threshold_compass_prepare_rig_a:0 "Граница в камере"
 HSM_BAR_mtk_threshold_compass_prepare_rig_a_tt:0 "Пересечь подготовленную ритуальную границу рядом с независимо размеченной линией нитей. Поворачивать прибор, не меняя края, отделяя разницу времён парных резонаторов от ожидания наблюдателя о том, где должна находиться предполагаемая дверь."
 HSM_BAR_mtk_threshold_compass_prepare_rig_b:0 "Граница у питания"
 HSM_BAR_mtk_threshold_compass_prepare_rig_b_tt:0 "Подойти к размеченному краю возле питания мастерской, сохраняя лист местной калибровки. Соседние машины способны искажать показания, поэтому смещённую стрелку нельзя сразу считать доказательством того, что сама ритуальная граница переместилась в пространстве."
 HSM_BAR_mtk_threshold_compass_control_question:0 "С чем сравнить границу, чтобы отделить её от ожиданий?"
 HSM_BAR_mtk_threshold_compass_prepare_control_a:0 "Сильная обычная лампа"
 HSM_BAR_mtk_threshold_compass_prepare_control_a_tt:0 "Поставить рядом обычную зачарованную лампу и сравнить оба резонатора вместе. Совместный рост показаний проверяет силу фона; заявленному порогу нужна разница, которая продолжает следовать независимо обследованной границе при повторном проходе прибора."
 HSM_BAR_mtk_threshold_compass_prepare_control_b:0 "Нарисованная дверь"
 HSM_BAR_mtk_threshold_compass_prepare_control_b_tt:0 "Оставить нарисованную дверь в сравнительном маршруте, даже если наблюдатели считают её неубедительной. Прибор проверяют там, где границу не готовили, с теми же поворотами и обменом опорного кольца, что при настоящем проходе."
 HSM_BAR_mtk_threshold_compass_observation_0:0 "У подготовленного края стрелка поворачивает возле нитей, но требуется подтверждение после поворота прибора. Лампа повышает оба показания, осложняя первый предполагаемый сигнал порога. Поведение местной опоры нужно установить, прежде чем другой землемер сможет доверять нанесённой линии."
 HSM_BAR_mtk_threshold_compass_experiment_report_a_0:0 "УСТАНОВКА: Граница в камере. Сильная обычная лампа.\n\nУ подготовленного края стрелка поворачивает возле нитей, но требуется подтверждение после поворота прибора. Лампа повышает оба показания, осложняя первый предполагаемый сигнал порога. Поведение местной опоры нужно установить, прежде чем другой землемер сможет доверять нанесённой линии.\n\nДополнение к журналу испытаний\nНастроенная опора камеры сохранила отмеченный нитями край при повороте. Обычная лампа повысила оба показания, не создав ложного порога. Компас успешен после местной калибровки и измеряет лишь испытанные границы. Он не определяет назначения, не гарантирует прохода и не судит собеседника."
 HSM_BAR_mtk_threshold_compass_verification_a_0:0 "У подготовленного края стрелка поворачивает возле нитей, но требуется подтверждение после поворота прибора. Лампа повышает оба показания, осложняя первый предполагаемый сигнал порога. Поведение местной опоры нужно установить, прежде чем другой землемер сможет доверять нанесённой линии.\n\nНАЗНАЧЕНА ПРОВЕРКА: Настроить опору\nЗаказать местное сравнение опорного кольца возле искажённого прохода. Приборная работа дороже, зато быстрее разбирает мастерскую помеху; подготовленная камера может подтвердить линию более длительной серией поворотов, используя уже имеющуюся в ней измерительную опору."
 HSM_BAR_mtk_threshold_compass_experiment_report_b_0:0 "УСТАНОВКА: Граница в камере. Сильная обычная лампа.\n\nУ подготовленного края стрелка поворачивает возле нитей, но требуется подтверждение после поворота прибора. Лампа повышает оба показания, осложняя первый предполагаемый сигнал порога. Поведение местной опоры нужно установить, прежде чем другой землемер сможет доверять нанесённой линии.\n\nДополнение к журналу испытаний\nПовторные обходы камеры восстановили тот же край при разных ориентациях прибора. Обычная лампа повысила оба показания, не создав ложного порога. Компас даёт проверенную местную границу, а не известное назначение или гарантированный проход. Контакт наследует ограниченное измерение и требование калибровки."
 HSM_BAR_mtk_threshold_compass_verification_b_0:0 "У подготовленного края стрелка поворачивает возле нитей, но требуется подтверждение после поворота прибора. Лампа повышает оба показания, осложняя первый предполагаемый сигнал порога. Поведение местной опоры нужно установить, прежде чем другой землемер сможет доверять нанесённой линии.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить обходы\nСохранить прибор и повторять проходы с переносом и поворотом относительно независимой нити. Это экономит новую калибровку, но дольше занимает область возле питания мастерской; подготовленная камера уже предлагает более чистую серию для сравнения двух резонаторов."
 HSM_BAR_mtk_threshold_compass_observation_1:0 "У подготовленного края стрелка поворачивает возле нитей, но требуется подтверждение после поворота прибора. Нарисованная дверь вызывает ожидание края, которого опорная запись не подтверждает. Поведение местной опоры нужно установить, прежде чем другой землемер сможет доверять нанесённой линии."
 HSM_BAR_mtk_threshold_compass_experiment_report_a_1:0 "УСТАНОВКА: Граница в камере. Нарисованная дверь.\n\nУ подготовленного края стрелка поворачивает возле нитей, но требуется подтверждение после поворота прибора. Нарисованная дверь вызывает ожидание края, которого опорная запись не подтверждает. Поведение местной опоры нужно установить, прежде чем другой землемер сможет доверять нанесённой линии.\n\nДополнение к журналу испытаний\nНастроенная опора камеры сохранила отмеченный нитями край при повороте. Нарисованная дверь не дала отклика границы в проверенном сравнении. Компас успешен после местной калибровки и измеряет лишь испытанные границы. Он не определяет назначения, не гарантирует прохода и не судит собеседника."
 HSM_BAR_mtk_threshold_compass_verification_a_1:0 "У подготовленного края стрелка поворачивает возле нитей, но требуется подтверждение после поворота прибора. Нарисованная дверь вызывает ожидание края, которого опорная запись не подтверждает. Поведение местной опоры нужно установить, прежде чем другой землемер сможет доверять нанесённой линии.\n\nНАЗНАЧЕНА ПРОВЕРКА: Настроить опору\nЗаказать местное сравнение опорного кольца возле искажённого прохода. Приборная работа дороже, зато быстрее разбирает мастерскую помеху; подготовленная камера может подтвердить линию более длительной серией поворотов, используя уже имеющуюся в ней измерительную опору."
 HSM_BAR_mtk_threshold_compass_experiment_report_b_1:0 "УСТАНОВКА: Граница в камере. Нарисованная дверь.\n\nУ подготовленного края стрелка поворачивает возле нитей, но требуется подтверждение после поворота прибора. Нарисованная дверь вызывает ожидание края, которого опорная запись не подтверждает. Поведение местной опоры нужно установить, прежде чем другой землемер сможет доверять нанесённой линии.\n\nДополнение к журналу испытаний\nПовторные обходы камеры восстановили тот же край при разных ориентациях прибора. Нарисованная дверь не дала отклика границы в проверенном сравнении. Компас даёт проверенную местную границу, а не известное назначение или гарантированный проход. Контакт наследует ограниченное измерение и требование калибровки."
 HSM_BAR_mtk_threshold_compass_verification_b_1:0 "У подготовленного края стрелка поворачивает возле нитей, но требуется подтверждение после поворота прибора. Нарисованная дверь вызывает ожидание края, которого опорная запись не подтверждает. Поведение местной опоры нужно установить, прежде чем другой землемер сможет доверять нанесённой линии.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить обходы\nСохранить прибор и повторять проходы с переносом и поворотом относительно независимой нити. Это экономит новую калибровку, но дольше занимает область возле питания мастерской; подготовленная камера уже предлагает более чистую серию для сравнения двух резонаторов."
 HSM_BAR_mtk_threshold_compass_observation_2:0 "Возле питания мастерской стрелка уходит от независимо размеченного края. Лампа повышает оба показания, осложняя первый предполагаемый сигнал порога. Поведение местной опоры нужно установить, прежде чем другой землемер сможет доверять нанесённой линии."
 HSM_BAR_mtk_threshold_compass_experiment_report_a_2:0 "УСТАНОВКА: Граница у питания. Сильная обычная лампа.\n\nВозле питания мастерской стрелка уходит от независимо размеченного края. Лампа повышает оба показания, осложняя первый предполагаемый сигнал порога. Поведение местной опоры нужно установить, прежде чем другой землемер сможет доверять нанесённой линии.\n\nДополнение к журналу испытаний\nМестная настройка восстановила край у мастерской среди помех питания. Обычная лампа повысила оба показания, не создав ложного порога. Компас успешен после местной калибровки и измеряет лишь испытанные границы. Он не определяет назначения, не гарантирует прохода и не судит собеседника."
 HSM_BAR_mtk_threshold_compass_verification_a_2:0 "Возле питания мастерской стрелка уходит от независимо размеченного края. Лампа повышает оба показания, осложняя первый предполагаемый сигнал порога. Поведение местной опоры нужно установить, прежде чем другой землемер сможет доверять нанесённой линии.\n\nНАЗНАЧЕНА ПРОВЕРКА: Настроить опору\nЗаказать местное сравнение опорного кольца возле искажённого прохода. Приборная работа дороже, зато быстрее разбирает мастерскую помеху; подготовленная камера может подтвердить линию более длительной серией поворотов, используя уже имеющуюся в ней измерительную опору."
 HSM_BAR_mtk_threshold_compass_experiment_report_b_2:0 "УСТАНОВКА: Граница у питания. Сильная обычная лампа.\n\nВозле питания мастерской стрелка уходит от независимо размеченного края. Лампа повышает оба показания, осложняя первый предполагаемый сигнал порога. Поведение местной опоры нужно установить, прежде чем другой землемер сможет доверять нанесённой линии.\n\nДополнение к журналу испытаний\nПовторные обходы мастерской установили местную поправку до возобновления съёмки. Обычная лампа повысила оба показания, не создав ложного порога. Компас даёт проверенную местную границу, а не известное назначение или гарантированный проход. Контакт наследует ограниченное измерение и требование калибровки."
