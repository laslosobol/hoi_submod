 HSM_BAR_mtk_prosthetics_verification_b_3:0 "Движение у верстака получается стоя, но при посадке край крепления прижимается к участку, прежде не испытывавшему нагрузки. Незнакомый мастер заменяет мастерскую деталь, но не может подтвердить предполагаемую позу по имеющемуся у него чертежу. Крепление и его инструкции требуют исправления, прежде чем воспроизводимое движение можно будет признать пригодным для последующего обслуживания в обычной местной мастерской.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить примерки\nСохранить нынешние детали и дополнить запись движений осмотрами после отдыха. Это уменьшает расходы на переделку, но требует больше времени при давлении сидя; знакомому маршруту прогулки нужно меньше исправлений, прежде чем его воспроизведёт другой мастер."
