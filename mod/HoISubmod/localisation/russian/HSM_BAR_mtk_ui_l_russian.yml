 HSM_BAR_mtk_sleep_lecture_experiment_report_b_2:0 "УСТАНОВКА: Повтор ряда знаков. Тихая ночь.\n\nПосле повторённой последовательности спавшие узнают ритм и жалуются на усталость; объяснения предъявленных знаков остаются противоречивыми. Отчёты тихой ночи тоже содержат узнавание, а экзаменатор ещё не заменял карточки во время утренней проверки. Сильвер требует проверки после отдыха, отделяющей знакомое звучание от применимого знания, прежде чем выделять для этого замысла ещё одну ночь наблюдений.\n\nДополнение к журналу испытаний\nПовторная запись оказалась полной, однако дополнительные предъявления дали усталость вместо пригодного к применению знания. Узнавание после тихой ночи исчезло, когда экзаменатор заменил карточки, сохранив само проверяемое правило. Гипотеза закрыта как неудачная: подтверждённого обучения и практической пользы нет. После отдыха ученики возвращаются к обычным занятиям. Полная запись хранится рядом с ошибочными ответами, чтобы при работе над Хором передачу не принимали за понимание."
