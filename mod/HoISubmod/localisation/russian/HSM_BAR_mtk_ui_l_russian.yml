 HSM_BAR_mtk_self_repair_rig_question:0 "Какую неисправность задать учебному узлу?"
 HSM_BAR_mtk_self_repair_prepare_rig_a:0 "Знакомый люфт"
 HSM_BAR_mtk_self_repair_prepare_rig_a_tt:0 "Задать описанный на чертеже люфт и наблюдать предупреждение до работы с сервисным приспособлением. Записывать действия мастера рядом с действиями машины, включая осмотр, расходные материалы и разрешение на запуск."
 HSM_BAR_mtk_self_repair_prepare_rig_b:0 "Незнакомый перекос"
 HSM_BAR_mtk_self_repair_prepare_rig_b_tt:0 "Задать перекос за пределами описанного порядка обслуживания. Знакомое предупреждение всё же может появиться, однако опыт проверяет определение нужной работы, а не простое сообщение о том, что состояние изменилось."
 HSM_BAR_mtk_self_repair_control_question:0 "Чем проверить толкование предупреждения?"
 HSM_BAR_mtk_self_repair_prepare_control_a:0 "Чистый стенд"
 HSM_BAR_mtk_self_repair_prepare_control_a_tt:0 "Содержать указатель чистым и поручить мастеру независимый осмотр остановленного узла. Сравнение покажет, различает ли кажущееся точным предупреждение обычную регулировку и необходимость замены повреждённой детали в данном механизме."
 HSM_BAR_mtk_self_repair_prepare_control_b:0 "Пыль на указателе"
 HSM_BAR_mtk_self_repair_prepare_control_b_tt:0 "Допустить обычную мастерскую пыль на указателе в отдельном учебном прогоне. Сохранить независимый осмотр мастером: молчание закрытого предупреждения нельзя принимать за доказательство исправности узла, работающего под наблюдением на стенде."
 HSM_BAR_mtk_self_repair_observation_0:0 "Знакомый люфт вызывает предупреждение и остановку для обслуживания, однако восстановление всё ещё ожидает вмешательства мастера у стенда. На чистом стенде осмотр обнаруживает больше работы, чем записано в аккуратном машинном описании этого предупреждения. Последовательности нужны явный осмотр мастером и учёт материалов, прежде чем вспомогательную регулировку можно будет отличить от обещанного самостоятельного ремонта машины."
 HSM_BAR_mtk_self_repair_experiment_report_a_0:0 "УСТАНОВКА: Знакомый люфт. Чистый стенд.\n\nЗнакомый люфт вызывает предупреждение и остановку для обслуживания, однако восстановление всё ещё ожидает вмешательства мастера у стенда. На чистом стенде осмотр обнаруживает больше работы, чем записано в аккуратном машинном описании этого предупреждения. Последовательности нужны явный осмотр мастером и учёт материалов, прежде чем вспомогательную регулировку можно будет отличить от обещанного самостоятельного ремонта машины.\n\nДополнение к журналу испытаний\nЛист люфта теперь указывает мастера, выполняющего регулировку и разрешающего дальнейшую работу восстановленного учебного узла. Независимый осмотр сохранил за мастером решение о необходимости регулировки или замены повреждённой детали. Частичный результат представляет обслуживание с подготовленными запасами и доступными точками ремонта. Треснувшие детали требуют замены; машина не распознаёт произвольных повреждений и не создаёт материал. Мануфактуре понадобится мастерская с работниками, а не необъяснённый этап исцеления механизмов."
 HSM_BAR_mtk_self_repair_verification_a_0:0 "Знакомый люфт вызывает предупреждение и остановку для обслуживания, однако восстановление всё ещё ожидает вмешательства мастера у стенда. На чистом стенде осмотр обнаруживает больше работы, чем записано в аккуратном машинном описании этого предупреждения. Последовательности нужны явный осмотр мастером и учёт материалов, прежде чем вспомогательную регулировку можно будет отличить от обещанного самостоятельного ремонта машины.\n\nНАЗНАЧЕНА ПРОВЕРКА: Переписать обслуживание\nЗаказать явный порядок обслуживания с точками осмотра и замены. Чертёж обойдётся дороже, зато быстрее разберёт незнакомое предупреждение; знакомый люфт можно проследить с нынешним приспособлением, потратив больше времени на подробный журнал работы мастера."
 HSM_BAR_mtk_self_repair_experiment_report_b_0:0 "УСТАНОВКА: Знакомый люфт. Чистый стенд.\n\nЗнакомый люфт вызывает предупреждение и остановку для обслуживания, однако восстановление всё ещё ожидает вмешательства мастера у стенда. На чистом стенде осмотр обнаруживает больше работы, чем записано в аккуратном машинном описании этого предупреждения. Последовательности нужны явный осмотр мастером и учёт материалов, прежде чем вспомогательную регулировку можно будет отличить от обещанного самостоятельного ремонта машины.\n\nДополнение к журналу испытаний\nПродлённый журнал люфта отнёс восстановление к приспособлению и мастеру, а не к самостоятельному ремонту машины. Независимый осмотр сохранил за мастером решение о необходимости регулировки или замены повреждённой детали. Сохранённая процедура помогает работникам обслуживать знакомые узлы. Предупреждения ограниченны, каждый запуск разрешает мастер. Ни одна сломанная деталь не восстановилась сама. Для Мануфактуры важны явно указанные труд обслуживания и запасы, а не способность машины к самостоятельному исцелению."
 HSM_BAR_mtk_self_repair_verification_b_0:0 "Знакомый люфт вызывает предупреждение и остановку для обслуживания, однако восстановление всё ещё ожидает вмешательства мастера у стенда. На чистом стенде осмотр обнаруживает больше работы, чем записано в аккуратном машинном описании этого предупреждения. Последовательности нужны явный осмотр мастером и учёт материалов, прежде чем вспомогательную регулировку можно будет отличить от обещанного самостоятельного ремонта машины.\n\nНАЗНАЧЕНА ПРОВЕРКА: Учесть работу мастеров\nПродлить наблюдения стенда и записывать каждую регулировку, очистку и выданную деталь. Имеющиеся инструменты уменьшают счёт, но незнакомое повреждение дольше занимает стенд; привычный износ можно проследить без предварительного заказа полностью переработанного чертежа обслуживания."
 HSM_BAR_mtk_self_repair_observation_1:0 "Знакомый люфт вызывает предупреждение и остановку для обслуживания, однако восстановление всё ещё ожидает вмешательства мастера у стенда. Пыль глушит указатель, пока мастер не протирает его; это вмешательство отсутствует на рисунке предполагаемого обслуживания. Последовательности нужны явный осмотр мастером и учёт материалов, прежде чем вспомогательную регулировку можно будет отличить от обещанного самостоятельного ремонта машины."
 HSM_BAR_mtk_self_repair_experiment_report_a_1:0 "УСТАНОВКА: Знакомый люфт. Пыль на указателе.\n\nЗнакомый люфт вызывает предупреждение и остановку для обслуживания, однако восстановление всё ещё ожидает вмешательства мастера у стенда. Пыль глушит указатель, пока мастер не протирает его; это вмешательство отсутствует на рисунке предполагаемого обслуживания. Последовательности нужны явный осмотр мастером и учёт материалов, прежде чем вспомогательную регулировку можно будет отличить от обещанного самостоятельного ремонта машины.\n\nДополнение к журналу испытаний\nЛист люфта теперь указывает мастера, выполняющего регулировку и разрешающего дальнейшую работу восстановленного учебного узла. Опыт с пылью сделал очистку явным этапом обслуживания перед доверием к показаниям самого указателя. Частичный результат представляет обслуживание с подготовленными запасами и доступными точками ремонта. Треснувшие детали требуют замены; машина не распознаёт произвольных повреждений и не создаёт материал. Мануфактуре понадобится мастерская с работниками, а не необъяснённый этап исцеления механизмов."
