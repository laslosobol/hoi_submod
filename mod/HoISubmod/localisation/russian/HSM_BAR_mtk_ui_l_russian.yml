l_russian:
 HSM_BAR_mtk_field_atlas_rig_question:0 "Где поставить стойку для первой съёмки атласа?"
 HSM_BAR_mtk_field_atlas_prepare_rig_a:0 "Учебная комната"
 HSM_BAR_mtk_field_atlas_prepare_rig_a_tt:0 "Поставить кристальную стойку возле знакомых световых чар. На отдельных листах отмечаются положение источника и направление взгляда наблюдателя, чтобы яркое впечатление незаметно не превратилось в границу на общей карте."
 HSM_BAR_mtk_field_atlas_prepare_rig_b:0 "Стена мастерской"
 HSM_BAR_mtk_field_atlas_prepare_rig_b_tt:0 "Выполнить съёмку возле работающих приборов, отметив их расположение на съёмной накладке. Помеха обнаружится сразу, однако для проведения границы придётся отличить исследуемые чары от соседних зачарованных инструментов мастерской."
 HSM_BAR_mtk_field_atlas_control_question:0 "Что менять при неподвижной измерительной стойке?"
 HSM_BAR_mtk_field_atlas_prepare_control_a:0 "Сменить наблюдателей"
 HSM_BAR_mtk_field_atlas_prepare_control_a_tt:0 "Предложить новым наблюдателям зарисовать то же возмущение без прежних листов. Различия в яркости остаются особенностями восприятия, пока смена читателей не подтвердит общую границу на независимо составленных схемах."
 HSM_BAR_mtk_field_atlas_prepare_control_b:0 "Паузы без чар"
 HSM_BAR_mtk_field_atlas_prepare_control_b_tt:0 "Сильвер скроет порядок промежутков без световых чар. Стойка и соседнее оборудование остаются на месте: остаточная отметка может принадлежать другому источнику, а не ожиданиям участника, составляющего очередную карту."
 HSM_BAR_mtk_field_atlas_observation_0:0 "Лист учебной комнаты показывает узкий край световых чар, однако слабая сторона контура на последовательных рисунках заметно расходится. Сменившиеся наблюдатели расходятся в оценке яркости, хотя ставят отметки возле одной и той же стороны стойки. Следующая съёмка должна отделить движение источника от восприятия и помех, прежде чем кто-либо перенесёт достоверную границу на чистовой лист атласа."
 HSM_BAR_mtk_field_atlas_experiment_report_a_0:0 "УСТАНОВКА: Учебная комната. Сменить наблюдателей.\n\nЛист учебной комнаты показывает узкий край световых чар, однако слабая сторона контура на последовательных рисунках заметно расходится. Сменившиеся наблюдатели расходятся в оценке яркости, хотя ставят отметки возле одной и той же стороны стойки. Следующая съёмка должна отделить движение источника от восприятия и помех, прежде чем кто-либо перенесёт достоверную границу на чистовой лист атласа.\n\nДополнение к журналу испытаний\nОтдельные листы выделили край в учебной комнате, не включая оценки яркости наблюдателей в проведённую линию. Новые наблюдатели восстановили исправленную границу, хотя различия в воспринимаемой яркости между ними сохранились. Атлас теперь позволяет повторять местные съёмки в записанных условиях. Дождь и перемены оборудования по-прежнему оставляют неясные края; они сохраняются как неуверенные отметки общей системы отсчёта, а не превращаются в якобы измеренные впечатления."
 HSM_BAR_mtk_field_atlas_verification_a_0:0 "Лист учебной комнаты показывает узкий край световых чар, однако слабая сторона контура на последовательных рисунках заметно расходится. Сменившиеся наблюдатели расходятся в оценке яркости, хотя ставят отметки возле одной и той же стороны стойки. Следующая съёмка должна отделить движение источника от восприятия и помех, прежде чем кто-либо перенесёт достоверную границу на чистовой лист атласа.\n\nНАЗНАЧЕНА ПРОВЕРКА: Разделить накладки\nПересобрать накладки источника и помех при помощи мастерской. Это требует дополнительных расходов на чертежи и выверку, зато сокращает повторную съёмку мастерской; в тихой учебной комнате прямое прослеживание источника потребует меньшей переделки."
 HSM_BAR_mtk_field_atlas_experiment_report_b_0:0 "УСТАНОВКА: Учебная комната. Сменить наблюдателей.\n\nЛист учебной комнаты показывает узкий край световых чар, однако слабая сторона контура на последовательных рисунках заметно расходится. Сменившиеся наблюдатели расходятся в оценке яркости, хотя ставят отметки возле одной и той же стороны стойки. Следующая съёмка должна отделить движение источника от восприятия и помех, прежде чем кто-либо перенесёт достоверную границу на чистовой лист атласа.\n\nДополнение к журналу испытаний\nПеремещение чар через учебную комнату сдвигало нанесённый край, хотя измерительная стойка оставалась на прежнем месте. Новые наблюдатели восстановили исправленную границу, хотя различия в воспринимаемой яркости между ними сохранились. Принятый атлас описывает источник, который может найти другая группа, отдельно отмечая помехи и восприятие. Листы сохраняют сведения о погоде и оборудовании при съёмке. Слабые границы остаются неопределёнными, если эти условия больше не соблюдаются."
 HSM_BAR_mtk_field_atlas_verification_b_0:0 "Лист учебной комнаты показывает узкий край световых чар, однако слабая сторона контура на последовательных рисунках заметно расходится. Сменившиеся наблюдатели расходятся в оценке яркости, хотя ставят отметки возле одной и той же стороны стойки. Следующая съёмка должна отделить движение источника от восприятия и помех, прежде чем кто-либо перенесёт достоверную границу на чистовой лист атласа.\n\nНАЗНАЧЕНА ПРОВЕРКА: Проследить источник\nОставить прежнюю стойку и повторять маршрут вслед за перемещаемыми чарами. Это экономит расходы на новые накладки, но дольше занимает наблюдателей возле работающих приборов; маршрут учебной комнаты позволит разобраться с положением источника за меньшее число встреч."
 HSM_BAR_mtk_field_atlas_observation_1:0 "Лист учебной комнаты показывает узкий край световых чар, однако слабая сторона контура на последовательных рисунках заметно расходится. В скрытые промежутки без чар остаётся слабая отметка, источник которой ещё не отделён от самой комнаты. Следующая съёмка должна отделить движение источника от восприятия и помех, прежде чем кто-либо перенесёт достоверную границу на чистовой лист атласа."
