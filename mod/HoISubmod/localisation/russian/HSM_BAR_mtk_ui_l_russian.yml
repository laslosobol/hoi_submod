 HSM_BAR_mtk_necrotic_suture_respond_a_tt:0 "Переделать расположение меток и повторить сравнение при сдержанном натяжении. Подготовка дороже, зато быстрее устраняет скольжение ушибленных краёв; ровные парные края могут установить пределы отпускания более длительной серией с уже нанесёнными рабочими метками.\n\n[GetHSMBARMtkResponseBudget_necrotic_suture_a]"
