 HSM_BAR_mtk_chorus_origins:0 "Переплётная записка Вииры: атлас даёт общий ориентир, обмен ощущениями узкий канал, а спящая лекция необходимый отказ. Кристаллические следы гаснут; нотация позволяет участнику исправить автора. Хор начинается на пересечении этих границ, а не с их исчезновения.\n\n1. $HSM_BAR_mtk_field_atlas_title$\n[GetHSMBARMtkPrep_field_atlas]\n\n2. $HSM_BAR_mtk_shared_senses_title$\n[GetHSMBARMtkPrep_shared_senses]\n\n3. $HSM_BAR_mtk_sleep_lecture_title$\n[GetHSMBARMtkPrep_sleep_lecture]\n\n4. $HSM_BAR_mtk_crystal_memory_title$\n[GetHSMBARMtkPrep_crystal_memory]\n\n5. $HSM_BAR_mtk_spell_notation_title$\n[GetHSMBARMtkPrep_spell_notation]"
 HSM_BAR_mtk_manufactory_origins:0 "Сборочная записка Леопольда: проверенные чертежи протезов, обслуживаемый ремонт и неудачная пушка, в которой всё останавливалось разом. Затем привод с надёжной остановкой и сортировщик, которому позволено сомневаться. Линия наследует все пять заключений, особенно то, которое никто не хотел подписывать.\n\n1. $HSM_BAR_mtk_prosthetics_title$\n[GetHSMBARMtkPrep_prosthetics]\n\n2. $HSM_BAR_mtk_self_repair_title$\n[GetHSMBARMtkPrep_self_repair]\n\n3. $HSM_BAR_mtk_revolver_howitzer_title$\n[GetHSMBARMtkPrep_revolver_howitzer]\n\n4. $HSM_BAR_mtk_crystal_drive_title$\n[GetHSMBARMtkPrep_crystal_drive]\n\n5. $HSM_BAR_mtk_sorting_engine_title$\n[GetHSMBARMtkPrep_sorting_engine]"
 HSM_BAR_mtk_last_minute_origins:0 "Сопроводительное письмо Сильвера: поддержка не равна исцелению, запас тканей не равен неисчерпаемому телу, а неподвижность не равна молодости. Чистый инструмент и облегчение боли важны потому, что пациенту предстоит вернуться к обычной жизни. Последняя минута даёт время для лечения; эти пять журналов определяют её пределы.\n\n1. $HSM_BAR_mtk_necrotic_suture_title$\n[GetHSMBARMtkPrep_necrotic_suture]\n\n2. $HSM_BAR_mtk_tissue_bank_title$\n[GetHSMBARMtkPrep_tissue_bank]\n\n3. $HSM_BAR_mtk_ageless_sleep_title$\n[GetHSMBARMtkPrep_ageless_sleep]\n\n4. $HSM_BAR_mtk_spell_sterilisation_title$\n[GetHSMBARMtkPrep_spell_sterilisation]\n\n5. $HSM_BAR_mtk_phantom_pain_title$\n[GetHSMBARMtkPrep_phantom_pain]"
 HSM_BAR_mtk_contact_origins:0 "Передаточная записка Асинти: завершение, отвергнутый свидетель, след, который не является историей, измеримая граница и сосуд, который не может удержать гостя. Контакту нужны все пять. Молчание неудачного исследования нельзя заполнять обещаниями другого.\n\n1. $HSM_BAR_mtk_ritual_brake_title$\n[GetHSMBARMtkPrep_ritual_brake]\n\n2. $HSM_BAR_mtk_silent_witness_title$\n[GetHSMBARMtkPrep_silent_witness]\n\n3. $HSM_BAR_mtk_place_memory_title$\n[GetHSMBARMtkPrep_place_memory]\n\n4. $HSM_BAR_mtk_threshold_compass_title$\n[GetHSMBARMtkPrep_threshold_compass]\n\n5. $HSM_BAR_mtk_empty_vessel_title$\n[GetHSMBARMtkPrep_empty_vessel]"
