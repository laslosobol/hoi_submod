 HSM_BAR_mtk_manufactory_prepare_rig_a_tt:0 "Собрать утверждённую последовательность корпусов с обзором каждой операции из прохода обслуживания. Отделить сменные образцы от личных креплений и сохранить место осмотра, прежде чем изделие будет признано окончательно готовым."
 HSM_BAR_mtk_manufactory_prepare_rig_b:0 "Линия креплений"
 HSM_BAR_mtk_manufactory_prepare_rig_b_tt:0 "Повторять описанный мастерской образец крепления, оставляя незнакомое крепление вне принятого заказа. Общие детали не означают универсального прилегания; линия не должна сама придумывать чертёж для изделия, отсутствующего в списке."
 HSM_BAR_mtk_manufactory_control_question:0 "Какую остановку линия должна обработать на виду?"
 HSM_BAR_mtk_manufactory_prepare_control_a:0 "Остановка одной станции"
 HSM_BAR_mtk_manufactory_prepare_control_a_tt:0 "Остановить станцию во время принятой последовательности, наблюдая соседние. Их текущие задачи и запуск должны оставаться раздельными: это учитывает отвергнутый довод гаубицы, не объявляя её неудачный механизм полезной машиной."
 HSM_BAR_mtk_manufactory_prepare_control_b:0 "Неопределённая заготовка"
 HSM_BAR_mtk_manufactory_prepare_control_b_tt:0 "Ввести спорную заготовку перед сравнением эталонов и оставить мастера возле неопределённого лотка. Опыт проверяет, остаётся ли неясность видимой, вместо того чтобы исчезнуть внутри внешне плавной последовательности изготовления изделий."
 HSM_BAR_mtk_manufactory_observation_0:0 "Последовательность корпусов повторяет движения, но передаточный лист пропускает регулировку, сделанную работником. Остановка станции оставляет соседних работников в сомнении, можно ли передавать законченные задачи. Линии нужны явные передачи между операциями, прежде чем повторение можно будет признать поднадзорным изготовлением изделий."
 HSM_BAR_mtk_manufactory_experiment_report_a_0:0 "УСТАНОВКА: Линия корпусов. Остановка одной станции.\n\nПоследовательность корпусов повторяет движения, но передаточный лист пропускает регулировку, сделанную работником. Остановка станции оставляет соседних работников в сомнении, можно ли передавать законченные задачи. Линии нужны явные передачи между операциями, прежде чем повторение можно будет признать поднадзорным изготовлением изделий.\n\nДополнение к журналу испытаний\nИсправленные передачи корпусов назвали регулировку работника до выпуска изделия. Отдельные остановки позволили соседним станциям закончить задачи и запуститься без общего затора. Мануфактура успешна под надзором. Протезы дают проверенные образцы; Саморемонт требует работников и запасов; провал Гаубицы обосновывает отдельные остановки; Привод требует источников и охлаждения; Сортировка оставляет неясности мастеру. Механизмы не мыслят и не содержат связанных душ; новой работе нужны испытания."
 HSM_BAR_mtk_manufactory_verification_a_0:0 "Последовательность корпусов повторяет движения, но передаточный лист пропускает регулировку, сделанную работником. Остановка станции оставляет соседних работников в сомнении, можно ли передавать законченные задачи. Линии нужны явные передачи между операциями, прежде чем повторение можно будет признать поднадзорным изготовлением изделий.\n\nНАЗНАЧЕНА ПРОВЕРКА: Переделать передачи\nЗаказать ясные границы станций и подписываемые передаточные листы. Расходы мастерской быстрее разрешат исключения креплений; повторяемая последовательность корпусов может выявить пропущенные вмешательства через более долгий поднадзорный прогон при нынешнем расположении рабочих мест линии."
 HSM_BAR_mtk_manufactory_experiment_report_b_0:0 "УСТАНОВКА: Линия корпусов. Остановка одной станции.\n\nПоследовательность корпусов повторяет движения, но передаточный лист пропускает регулировку, сделанную работником. Остановка станции оставляет соседних работников в сомнении, можно ли передавать законченные задачи. Линии нужны явные передачи между операциями, прежде чем повторение можно будет признать поднадзорным изготовлением изделий.\n\nДополнение к журналу испытаний\nПродлённый прогон корпусов превратил пропущенную регулировку в записанную операцию обслуживания. Отдельные остановки позволили соседним станциям закончить задачи и запуститься без общего затора. Принятое изготовление ограничено всеми исследованиями: образцами Протезов, обслуживаемым Саморемонтом, отдельными остановками после провала Гаубицы, охлаждаемым Приводом и поднадзорной Сортировкой. Неудачное орудие не получает практической пользы. Выпуск требует осмотра; неизвестные заказы не рождают новой задачи или самостоятельной мысли."
 HSM_BAR_mtk_manufactory_verification_b_0:0 "Последовательность корпусов повторяет движения, но передаточный лист пропускает регулировку, сделанную работником. Остановка станции оставляет соседних работников в сомнении, можно ли передавать законченные задачи. Линии нужны явные передачи между операциями, прежде чем повторение можно будет признать поднадзорным изготовлением изделий.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить прогон\nПовторять утверждённую последовательность с записью каждой выдачи, проверки и запуска работниками. Это экономит новое оснащение станций, но дольше разбирает незнакомые заказы креплений; устойчивая последовательность корпусов уже даёт большую часть нужных для сравнения повторов."
 HSM_BAR_mtk_manufactory_observation_1:0 "Последовательность корпусов повторяет движения, но передаточный лист пропускает регулировку, сделанную работником. Спорная заготовка ждёт без подписанного назначения, отчего ровный журнал выпуска остаётся неполным. Линии нужны явные передачи между операциями, прежде чем повторение можно будет признать поднадзорным изготовлением изделий."
 HSM_BAR_mtk_manufactory_experiment_report_a_1:0 "УСТАНОВКА: Линия корпусов. Неопределённая заготовка.\n\nПоследовательность корпусов повторяет движения, но передаточный лист пропускает регулировку, сделанную работником. Спорная заготовка ждёт без подписанного назначения, отчего ровный журнал выпуска остаётся неполным. Линии нужны явные передачи между операциями, прежде чем повторение можно будет признать поднадзорным изготовлением изделий.\n\nДополнение к журналу испытаний\nИсправленные передачи корпусов назвали регулировку работника до выпуска изделия. Мастер удерживал сомнительные заготовки вне принятого выпуска до решения об их назначении. Мануфактура успешна под надзором. Протезы дают проверенные образцы; Саморемонт требует работников и запасов; провал Гаубицы обосновывает отдельные остановки; Привод требует источников и охлаждения; Сортировка оставляет неясности мастеру. Механизмы не мыслят и не содержат связанных душ; новой работе нужны испытания."
