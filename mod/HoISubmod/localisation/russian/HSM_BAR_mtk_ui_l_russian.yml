 HSM_BAR_mtk_field_atlas_verification_b_1:0 "Лист учебной комнаты показывает узкий край световых чар, однако слабая сторона контура на последовательных рисунках заметно расходится. В скрытые промежутки без чар остаётся слабая отметка, источник которой ещё не отделён от самой комнаты. Следующая съёмка должна отделить движение источника от восприятия и помех, прежде чем кто-либо перенесёт достоверную границу на чистовой лист атласа.\n\nНАЗНАЧЕНА ПРОВЕРКА: Проследить источник\nОставить прежнюю стойку и повторять маршрут вслед за перемещаемыми чарами. Это экономит расходы на новые накладки, но дольше занимает наблюдателей возле работающих приборов; маршрут учебной комнаты позволит разобраться с положением источника за меньшее число встреч."
 HSM_BAR_mtk_field_atlas_observation_2:0 "Съёмка мастерской даёт второй яркий выступ возле зачарованного инструмента; его след сливается с краем исследуемых световых чар. Сменившиеся наблюдатели расходятся в оценке яркости, хотя ставят отметки возле одной и той же стороны стойки. Следующая съёмка должна отделить движение источника от восприятия и помех, прежде чем кто-либо перенесёт достоверную границу на чистовой лист атласа."
 HSM_BAR_mtk_field_atlas_experiment_report_a_2:0 "УСТАНОВКА: Стена мастерской. Сменить наблюдателей.\n\nСъёмка мастерской даёт второй яркий выступ возле зачарованного инструмента; его след сливается с краем исследуемых световых чар. Сменившиеся наблюдатели расходятся в оценке яркости, хотя ставят отметки возле одной и той же стороны стойки. Следующая съёмка должна отделить движение источника от восприятия и помех, прежде чем кто-либо перенесёт достоверную границу на чистовой лист атласа.\n\nДополнение к журналу испытаний\nОтключение соседнего инструмента позволило отнести выступ мастерской к собственной съёмной накладке с отмеченными помехами. Новые наблюдатели восстановили исправленную границу, хотя различия в воспринимаемой яркости между ними сохранились. Атлас теперь позволяет повторять местные съёмки в записанных условиях. Дождь и перемены оборудования по-прежнему оставляют неясные края; они сохраняются как неуверенные отметки общей системы отсчёта, а не превращаются в якобы измеренные впечатления."
 HSM_BAR_mtk_field_atlas_verification_a_2:0 "Съёмка мастерской даёт второй яркий выступ возле зачарованного инструмента; его след сливается с краем исследуемых световых чар. Сменившиеся наблюдатели расходятся в оценке яркости, хотя ставят отметки возле одной и той же стороны стойки. Следующая съёмка должна отделить движение источника от восприятия и помех, прежде чем кто-либо перенесёт достоверную границу на чистовой лист атласа.\n\nНАЗНАЧЕНА ПРОВЕРКА: Разделить накладки\nПересобрать накладки источника и помех при помощи мастерской. Это требует дополнительных расходов на чертежи и выверку, зато сокращает повторную съёмку мастерской; в тихой учебной комнате прямое прослеживание источника потребует меньшей переделки."
