 HSM_BAR_mtk_silent_witness_rig_question:0 "Какое утверждение предложить проверить мнимому свидетелю?"
 HSM_BAR_mtk_silent_witness_prepare_rig_a:0 "Закрытая коробка"
 HSM_BAR_mtk_silent_witness_prepare_rig_a_tt:0 "Спросить о подготовленном знаке в закрытой коробке, содержимого которой участники не знают. Записать ответ до раскрытия цели, отделяя убедительный голос от утверждения, которое допускает независимую проверку по известному предмету."
 HSM_BAR_mtk_silent_witness_prepare_rig_b:0 "Удалённая запись"
 HSM_BAR_mtk_silent_witness_prepare_rig_b_tt:0 "Спросить о подготовленной исторической детали, проверочная запись которой хранится отдельно. Сохранить формулировку вопроса: подсказанная фамилия или наводящая пауза способны дать рассказ без получения сведений сверх того, что уже знают слушатели."
 HSM_BAR_mtk_silent_witness_control_question:0 "Чем обнаружить уверенность без знания?"
 HSM_BAR_mtk_silent_witness_prepare_control_a:0 "Пустая цель"
 HSM_BAR_mtk_silent_witness_prepare_control_a_tt:0 "Включить пустую цель серии: пустую коробку или запись без заявленной детали. Свидетелю разрешено не дать ответа, иначе согласие можно получить одним продолжением речи, вовсе не располагая знанием о проверяемом предмете."
 HSM_BAR_mtk_silent_witness_prepare_control_b:0 "Выдуманное имя"
 HSM_BAR_mtk_silent_witness_prepare_control_b_tt:0 "Использовать выдуманное имя, сохранив цель и форму вопроса. Сравнить закреплённый протокол до обсуждения правдоподобия: убедительное детство или знакомый голос не удостоверяют личность, которую подсказал сам заданный во время сеанса вопрос."
 HSM_BAR_mtk_silent_witness_observation_0:0 "Коробка получает уверенное описание прежде, чем раскрыт её спрятанный знак. Пустая цель получает столь же уверенный и подробный ответ. Рассказу нужны неизменные вопросы и независимая сверка, прежде чем кто-либо примет заявленный источник его сведений."
 HSM_BAR_mtk_silent_witness_experiment_report_a_0:0 "УСТАНОВКА: Закрытая коробка. Пустая цель.\n\nКоробка получает уверенное описание прежде, чем раскрыт её спрятанный знак. Пустая цель получает столь же уверенный и подробный ответ. Рассказу нужны неизменные вопросы и независимая сверка, прежде чем кто-либо примет заявленный источник его сведений.\n\nДополнение к журналу испытаний\nНеизменные вопросы о коробках не улучшили ответы сверх угадывания. Пустые цели выявили уверенные описания без соответствующих им фактов. Безмолвный свидетель провалился: нет надёжных показаний, личности или новых сведений. Он непригоден следователям и скорбящим семьям. Контакту нужны новые задания."
 HSM_BAR_mtk_silent_witness_verification_a_0:0 "Коробка получает уверенное описание прежде, чем раскрыт её спрятанный знак. Пустая цель получает столь же уверенный и подробный ответ. Рассказу нужны неизменные вопросы и независимая сверка, прежде чем кто-либо примет заявленный источник его сведений.\n\nНАЗНАЧЕНА ПРОВЕРКА: Убрать подсказки\nЗаказать неизменное предъявление вопросов вместе с паузами перед повтором сравнений. Подготовка дороже, зато быстрее распутывает рассказы о записях; закрытые коробки уже имеют простую цель, которую можно проверить через более длительную сверку имеющихся протоколов."
 HSM_BAR_mtk_silent_witness_experiment_report_b_0:0 "УСТАНОВКА: Закрытая коробка. Пустая цель.\n\nКоробка получает уверенное описание прежде, чем раскрыт её спрятанный знак. Пустая цель получает столь же уверенный и подробный ответ. Рассказу нужны неизменные вопросы и независимая сверка, прежде чем кто-либо примет заявленный источник его сведений.\n\nДополнение к журналу испытаний\nСверка протоколов обнаружила ответы о коробках не лучше ожидаемых догадок. Пустые цели выявили уверенные описания без соответствующих им фактов. Заявление о свидетеле провалилось без надёжных показаний или удостоверенной личности. Рассказы остаются неудачными наблюдениями, непригодными для расследований или скорбящих посетителей."
 HSM_BAR_mtk_silent_witness_verification_b_0:0 "Коробка получает уверенное описание прежде, чем раскрыт её спрятанный знак. Пустая цель получает столь же уверенный и подробный ответ. Рассказу нужны неизменные вопросы и независимая сверка, прежде чем кто-либо примет заявленный источник его сведений.\n\nНАЗНАЧЕНА ПРОВЕРКА: Сверить протоколы\nПоручить независимым читателям сравнить записанные ответы со всеми скрытыми целями и внешними записями. Это экономит новую организацию вопросов, но дольше разбирает исторические рассказы; коробки со знаками позволяют быстрее закончить сравнение без обсуждения убедительности голоса."
 HSM_BAR_mtk_silent_witness_observation_1:0 "Коробка получает уверенное описание прежде, чем раскрыт её спрятанный знак. Выдуманное имя получает биографию, подлинность которой вопрос ничем не устанавливал. Рассказу нужны неизменные вопросы и независимая сверка, прежде чем кто-либо примет заявленный источник его сведений."
 HSM_BAR_mtk_silent_witness_experiment_report_a_1:0 "УСТАНОВКА: Закрытая коробка. Выдуманное имя.\n\nКоробка получает уверенное описание прежде, чем раскрыт её спрятанный знак. Выдуманное имя получает биографию, подлинность которой вопрос ничем не устанавливал. Рассказу нужны неизменные вопросы и независимая сверка, прежде чем кто-либо примет заявленный источник его сведений.\n\nДополнение к журналу испытаний\nНеизменные вопросы о коробках не улучшили ответы сверх угадывания. Выдуманные личности меняли рассказы, не удостоверяя того, кто говорил. Безмолвный свидетель провалился: нет надёжных показаний, личности или новых сведений. Он непригоден следователям и скорбящим семьям. Контакту нужны новые задания."
 HSM_BAR_mtk_silent_witness_verification_a_1:0 "Коробка получает уверенное описание прежде, чем раскрыт её спрятанный знак. Выдуманное имя получает биографию, подлинность которой вопрос ничем не устанавливал. Рассказу нужны неизменные вопросы и независимая сверка, прежде чем кто-либо примет заявленный источник его сведений.\n\nНАЗНАЧЕНА ПРОВЕРКА: Убрать подсказки\nЗаказать неизменное предъявление вопросов вместе с паузами перед повтором сравнений. Подготовка дороже, зато быстрее распутывает рассказы о записях; закрытые коробки уже имеют простую цель, которую можно проверить через более длительную сверку имеющихся протоколов."
 HSM_BAR_mtk_silent_witness_experiment_report_b_1:0 "УСТАНОВКА: Закрытая коробка. Выдуманное имя.\n\nКоробка получает уверенное описание прежде, чем раскрыт её спрятанный знак. Выдуманное имя получает биографию, подлинность которой вопрос ничем не устанавливал. Рассказу нужны неизменные вопросы и независимая сверка, прежде чем кто-либо примет заявленный источник его сведений.\n\nДополнение к журналу испытаний\nСверка протоколов обнаружила ответы о коробках не лучше ожидаемых догадок. Выдуманные личности меняли рассказы, не удостоверяя того, кто говорил. Заявление о свидетеле провалилось без надёжных показаний или удостоверенной личности. Рассказы остаются неудачными наблюдениями, непригодными для расследований или скорбящих посетителей."
 HSM_BAR_mtk_silent_witness_verification_b_1:0 "Коробка получает уверенное описание прежде, чем раскрыт её спрятанный знак. Выдуманное имя получает биографию, подлинность которой вопрос ничем не устанавливал. Рассказу нужны неизменные вопросы и независимая сверка, прежде чем кто-либо примет заявленный источник его сведений.\n\nНАЗНАЧЕНА ПРОВЕРКА: Сверить протоколы\nПоручить независимым читателям сравнить записанные ответы со всеми скрытыми целями и внешними записями. Это экономит новую организацию вопросов, но дольше разбирает исторические рассказы; коробки со знаками позволяют быстрее закончить сравнение без обсуждения убедительности голоса."
 HSM_BAR_mtk_silent_witness_observation_2:0 "Вопрос о записи вызывает подробный рассказ, ещё ожидающий сверки с независимым архивом. Пустая цель получает столь же уверенный и подробный ответ. Рассказу нужны неизменные вопросы и независимая сверка, прежде чем кто-либо примет заявленный источник его сведений."
 HSM_BAR_mtk_silent_witness_experiment_report_a_2:0 "УСТАНОВКА: Удалённая запись. Пустая цель.\n\nВопрос о записи вызывает подробный рассказ, ещё ожидающий сверки с независимым архивом. Пустая цель получает столь же уверенный и подробный ответ. Рассказу нужны неизменные вопросы и независимая сверка, прежде чем кто-либо примет заявленный источник его сведений.\n\nДополнение к журналу испытаний\nУстранение наводящих пауз сократило рассказы, не сделав архивные утверждения точными. Пустые цели выявили уверенные описания без соответствующих им фактов. Безмолвный свидетель провалился: нет надёжных показаний, личности или новых сведений. Он непригоден следователям и скорбящим семьям. Контакту нужны новые задания."
 HSM_BAR_mtk_silent_witness_verification_a_2:0 "Вопрос о записи вызывает подробный рассказ, ещё ожидающий сверки с независимым архивом. Пустая цель получает столь же уверенный и подробный ответ. Рассказу нужны неизменные вопросы и независимая сверка, прежде чем кто-либо примет заявленный источник его сведений.\n\nНАЗНАЧЕНА ПРОВЕРКА: Убрать подсказки\nЗаказать неизменное предъявление вопросов вместе с паузами перед повтором сравнений. Подготовка дороже, зато быстрее распутывает рассказы о записях; закрытые коробки уже имеют простую цель, которую можно проверить через более длительную сверку имеющихся протоколов."
 HSM_BAR_mtk_silent_witness_experiment_report_b_2:0 "УСТАНОВКА: Удалённая запись. Пустая цель.\n\nВопрос о записи вызывает подробный рассказ, ещё ожидающий сверки с независимым архивом. Пустая цель получает столь же уверенный и подробный ответ. Рассказу нужны неизменные вопросы и независимая сверка, прежде чем кто-либо примет заявленный источник его сведений.\n\nДополнение к журналу испытаний\nВнешние записи не подтвердили сведений, недоступных первоначальным участникам сеансов. Пустые цели выявили уверенные описания без соответствующих им фактов. Заявление о свидетеле провалилось без надёжных показаний или удостоверенной личности. Рассказы остаются неудачными наблюдениями, непригодными для расследований или скорбящих посетителей."
