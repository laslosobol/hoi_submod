 HSM_BAR_mtk_tissue_bank_rig_question:0 "Какой материал включить в сравнение сохранности?"
 HSM_BAR_mtk_tissue_bank_prepare_rig_a:0 "Кожа и сухожилие"
 HSM_BAR_mtk_tissue_bank_prepare_rig_a_tt:0 "Держать небольшие подписанные образцы кожи и сухожилия в отдельных графах. Разделить каждое пожертвование между условиями шкафа: пригодный тонкий трансплантат не доказывает, что целый орган выдерживает такую же обработку."
 HSM_BAR_mtk_tissue_bank_prepare_rig_b:0 "Сравнение целой почки"
 HSM_BAR_mtk_tissue_bank_prepare_rig_b_tt:0 "Включить целые почки как отдельную проверку пределов рядом с тонкими трансплантатами. После согревания исследовать внутренние каналы, не принимая неизменный цвет или отзывчивый магический рисунок за доказательство сохранённой живой функции."
 HSM_BAR_mtk_tissue_bank_control_question:0 "Каким условием шкафа проверить вклад сохранения?"
 HSM_BAR_mtk_tissue_bank_prepare_control_a:0 "Только холод"
 HSM_BAR_mtk_tissue_bank_prepare_control_a_tt:0 "Хранить парную часть только на холоде с сохранением записи донора. После согревания сравнить гибкость, проходимость и живые края, считая внешний вид вторичным перед способностью продолжать работу без сохраняющих чар."
 HSM_BAR_mtk_tissue_bank_prepare_control_b:0 "Только фиксация"
 HSM_BAR_mtk_tissue_bank_prepare_control_b_tt:0 "Хранить парную часть под фиксацией без холода шкафа. Сохранить одинаковый последующий осмотр: привлекательный образец не должен менять определение выживания лишь потому, что продолжает отвечать заклинателю при очередной проверке сохранности."
 HSM_BAR_mtk_tissue_bank_observation_0:0 "Тонкие трансплантаты сохраняют очертания, но после согревания их живые края различаются. Образцы только на холоде показывают ненадёжность внешнего вида для оценки последующей пригодности. Шкафу нужна приёмка после согревания с раздельным учётом классов тканей на всём протяжении проверки."
 HSM_BAR_mtk_tissue_bank_experiment_report_a_0:0 "УСТАНОВКА: Кожа и сухожилие. Только холод.\n\nТонкие трансплантаты сохраняют очертания, но после согревания их живые края различаются. Образцы только на холоде показывают ненадёжность внешнего вида для оценки последующей пригодности. Шкафу нужна приёмка после согревания с раздельным учётом классов тканей на всём протяжении проверки.\n\nДополнение к журналу испытаний\nПартийная проверка оставила только осмотренные тонкие трансплантаты с пригодными живыми краями. Сравнение только с холодом подтвердило ограниченный вклад совместных холода и фиксации. Банк остаётся частичным успехом для отобранных кожи и сухожилий в проверенный срок. Каждой партии нужен осмотр после согревания; целые почки провалились. Сердца и мозг не входят в доказанный запас, неудачный трансплантат остаётся в учёте."
 HSM_BAR_mtk_tissue_bank_verification_a_0:0 "Тонкие трансплантаты сохраняют очертания, но после согревания их живые края различаются. Образцы только на холоде показывают ненадёжность внешнего вида для оценки последующей пригодности. Шкафу нужна приёмка после согревания с раздельным учётом классов тканей на всём протяжении проверки.\n\nНАЗНАЧЕНА ПРОВЕРКА: Пересобрать приёмку\nЗаказать раздельные проверки согревания и проходимости каждого класса тканей. Осмотр дороже, зато быстрее проясняет обманчивый вид органов; партии тонких трансплантатов могут установить ограниченный срок через более длительную серию хранения с имеющимся оборудованием шкафа."
 HSM_BAR_mtk_tissue_bank_experiment_report_b_0:0 "УСТАНОВКА: Кожа и сухожилие. Только холод.\n\nТонкие трансплантаты сохраняют очертания, но после согревания их живые края различаются. Образцы только на холоде показывают ненадёжность внешнего вида для оценки последующей пригодности. Шкафу нужна приёмка после согревания с раздельным учётом классов тканей на всём протяжении проверки.\n\nДополнение к журналу испытаний\nПовторные осмотры после согревания отделили пригодные тонкие партии от неудач, требующих замены. Сравнение только с холодом подтвердило ограниченный вклад совместных холода и фиксации. Отобранные кожа и сухожилия хранятся в проверенный срок, без универсального запаса органов. Записи доноров и осмотр партий неотделимы от хранения. Последняя минута получит проверенные трансплантаты, а не предположение, что красивая сохранная ткань жива."
 HSM_BAR_mtk_tissue_bank_verification_b_0:0 "Тонкие трансплантаты сохраняют очертания, но после согревания их живые края различаются. Образцы только на холоде показывают ненадёжность внешнего вида для оценки последующей пригодности. Шкафу нужна приёмка после согревания с раздельным учётом классов тканей на всём протяжении проверки.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить осмотр тканей\nСохранить шкафы и наблюдать те же партии при согревании и последующих осмотрах. Это экономит новые приспособления проверки, но дольше исключает целые органы с обещающим видом; тонкие трансплантаты раньше дают более ясное ограниченное сравнение."
 HSM_BAR_mtk_tissue_bank_observation_1:0 "Тонкие трансплантаты сохраняют очертания, но после согревания их живые края различаются. Образцы только с фиксацией ещё отвечают чарам там, где обычная живая функция сомнительна. Шкафу нужна приёмка после согревания с раздельным учётом классов тканей на всём протяжении проверки."
