 HSM_BAR_mtk_ritual_brake_rig_question:0 "Кто начнёт завершение поддерживаемого ритуала?"
 HSM_BAR_mtk_ritual_brake_prepare_rig_a:0 "Певец замолкает"
 HSM_BAR_mtk_ritual_brake_prepare_rig_a_tt:0 "Начать с прекращения вступительной фразы певцом, пока наблюдатели следят за остаточным полем. Так слышимое окончание отделяется от накопленного ритма, способного продолжаться после того, как голос уже полностью затих."
 HSM_BAR_mtk_ritual_brake_prepare_rig_b:0 "Помощник прерывает"
 HSM_BAR_mtk_ritual_brake_prepare_rig_b_tt:0 "Дать помощнику включить тормоз, пока певец продолжает вступительную фразу. Барабан остаётся в пределах его досягаемости: независимое прерывание не может зависеть от предварительного согласия увлечённого руководителя прекратить начатое им исполнение."
 HSM_BAR_mtk_ritual_brake_control_question:0 "Какое условие отвода проверит завершение?"
 HSM_BAR_mtk_ritual_brake_prepare_control_a:0 "Проверенная пара"
 HSM_BAR_mtk_ritual_brake_prepare_control_a_tt:0 "Осмотреть оба глиняных резонатора и измерить поле после последнего слышимого удара. Сравнение касается удаления поддерживающей силы, а не тишины в комнате или уверенности певца в том, что ритуал закончен."
 HSM_BAR_mtk_ritual_brake_prepare_control_b:0 "Стенд с поломкой"
 HSM_BAR_mtk_ritual_brake_prepare_control_b_tt:0 "Проверить сломанный разрядный резонатор на стенде с доступной парной заменой. Наблюдать, куда уходит остаточная сила: знак остановки на бумаге не доказывает способности треснувшей глины принять оставшийся заряд поддерживаемого ритуала."
 HSM_BAR_mtk_ritual_brake_observation_0:0 "Певец замолкает, но в круге сохраняется возвращающийся импульс. Проверенная пара принимает остаток, который нужно проследить до исходного уровня. Завершению нужен измеренный отвод, а не только слышимый признак наступившей тишины."
 HSM_BAR_mtk_ritual_brake_experiment_report_a_0:0 "УСТАНОВКА: Певец замолкает. Проверенная пара.\n\nПевец замолкает, но в круге сохраняется возвращающийся импульс. Проверенная пара принимает остаток, который нужно проследить до исходного уровня. Завершению нужен измеренный отвод, а не только слышимый признак наступившей тишины.\n\nДополнение к журналу испытаний\nИсправленная каденция убрала импульс, переживший молчание певца. Проверенная пара отвела остаток без измеренного возвратного импульса в поле. Тормоз успешен для испытанных ритуалов. Резонаторы осматривают, после тишины наблюдают поле; прекращение питаемого ритма не стирает независимых существ."
 HSM_BAR_mtk_ritual_brake_verification_a_0:0 "Певец замолкает, но в круге сохраняется возвращающийся импульс. Проверенная пара принимает остаток, который нужно проследить до исходного уровня. Завершению нужен измеренный отвод, а не только слышимый признак наступившей тишины.\n\nНАЗНАЧЕНА ПРОВЕРКА: Выверить каденцию\nОплатить согласование ритма и отвода вокруг прерывания помощника. Это быстрее разбирает продолжающееся пение, но требует дополнительных расходов стенда; уже замолчавший певец оставляет более простой остаточный цикл, который можно изучить через более долгие повторы."
 HSM_BAR_mtk_ritual_brake_experiment_report_b_0:0 "УСТАНОВКА: Певец замолкает. Проверенная пара.\n\nПевец замолкает, но в круге сохраняется возвращающийся импульс. Проверенная пара принимает остаток, который нужно проследить до исходного уровня. Завершению нужен измеренный отвод, а не только слышимый признак наступившей тишины.\n\nДополнение к журналу испытаний\nПовторные тихие завершения отделили остаточный импульс от выполненной остановки. Проверенная пара отвела остаток без измеренного возвратного импульса в поле. Тормоз надёжно завершает испытанные ритмы независимой остановкой помощника. Контакт наследует проверенный отвод, а не власть стирать независимых существ."
 HSM_BAR_mtk_ritual_brake_verification_b_0:0 "Певец замолкает, но в круге сохраняется возвращающийся импульс. Проверенная пара принимает остаток, который нужно проследить до исходного уровня. Завершению нужен измеренный отвод, а не только слышимый признак наступившей тишины.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить сравнение\nПовторять обычные завершения и остановки помощником при нынешнем отводе. Это уменьшает расходы оборудования, но дольше занимает наблюдателей при продолжающемся пении; тишина оставляет меньше перекрывающихся вкладов, которые нужно разделить перед оценкой остатка в поле."
 HSM_BAR_mtk_ritual_brake_observation_1:0 "Певец замолкает, но в круге сохраняется возвращающийся импульс. Сломанный резонатор оставляет путь отвода через запасной ещё непроверенным. Завершению нужен измеренный отвод, а не только слышимый признак наступившей тишины."
 HSM_BAR_mtk_ritual_brake_experiment_report_a_1:0 "УСТАНОВКА: Певец замолкает. Стенд с поломкой.\n\nПевец замолкает, но в круге сохраняется возвращающийся импульс. Сломанный резонатор оставляет путь отвода через запасной ещё непроверенным. Завершению нужен измеренный отвод, а не только слышимый признак наступившей тишины.\n\nДополнение к журналу испытаний\nИсправленная каденция убрала импульс, переживший молчание певца. Парный запасной резонатор принял остаток при отказе повреждённого. Тормоз успешен для испытанных ритуалов. Резонаторы осматривают, после тишины наблюдают поле; прекращение питаемого ритма не стирает независимых существ."
 HSM_BAR_mtk_ritual_brake_verification_a_1:0 "Певец замолкает, но в круге сохраняется возвращающийся импульс. Сломанный резонатор оставляет путь отвода через запасной ещё непроверенным. Завершению нужен измеренный отвод, а не только слышимый признак наступившей тишины.\n\nНАЗНАЧЕНА ПРОВЕРКА: Выверить каденцию\nОплатить согласование ритма и отвода вокруг прерывания помощника. Это быстрее разбирает продолжающееся пение, но требует дополнительных расходов стенда; уже замолчавший певец оставляет более простой остаточный цикл, который можно изучить через более долгие повторы."
 HSM_BAR_mtk_ritual_brake_experiment_report_b_1:0 "УСТАНОВКА: Певец замолкает. Стенд с поломкой.\n\nПевец замолкает, но в круге сохраняется возвращающийся импульс. Сломанный резонатор оставляет путь отвода через запасной ещё непроверенным. Завершению нужен измеренный отвод, а не только слышимый признак наступившей тишины.\n\nДополнение к журналу испытаний\nПовторные тихие завершения отделили остаточный импульс от выполненной остановки. Парный запасной резонатор принял остаток при отказе повреждённого. Тормоз надёжно завершает испытанные ритмы независимой остановкой помощника. Контакт наследует проверенный отвод, а не власть стирать независимых существ."
 HSM_BAR_mtk_ritual_brake_verification_b_1:0 "Певец замолкает, но в круге сохраняется возвращающийся импульс. Сломанный резонатор оставляет путь отвода через запасной ещё непроверенным. Завершению нужен измеренный отвод, а не только слышимый признак наступившей тишины.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить сравнение\nПовторять обычные завершения и остановки помощником при нынешнем отводе. Это уменьшает расходы оборудования, но дольше занимает наблюдателей при продолжающемся пении; тишина оставляет меньше перекрывающихся вкладов, которые нужно разделить перед оценкой остатка в поле."
 HSM_BAR_mtk_ritual_brake_observation_2:0 "Прерывание помощника встречает продолжающуюся фразу, поэтому его действие пока трудно выделить. Проверенная пара принимает остаток, который нужно проследить до исходного уровня. Завершению нужен измеренный отвод, а не только слышимый признак наступившей тишины."
 HSM_BAR_mtk_ritual_brake_experiment_report_a_2:0 "УСТАНОВКА: Помощник прерывает. Проверенная пара.\n\nПрерывание помощника встречает продолжающуюся фразу, поэтому его действие пока трудно выделить. Проверенная пара принимает остаток, который нужно проследить до исходного уровня. Завершению нужен измеренный отвод, а не только слышимый признак наступившей тишины.\n\nДополнение к журналу испытаний\nИсправленная каденция позволила помощнику завершить цикл при продолжающемся пении. Проверенная пара отвела остаток без измеренного возвратного импульса в поле. Тормоз успешен для испытанных ритуалов. Резонаторы осматривают, после тишины наблюдают поле; прекращение питаемого ритма не стирает независимых существ."
 HSM_BAR_mtk_ritual_brake_verification_a_2:0 "Прерывание помощника встречает продолжающуюся фразу, поэтому его действие пока трудно выделить. Проверенная пара принимает остаток, который нужно проследить до исходного уровня. Завершению нужен измеренный отвод, а не только слышимый признак наступившей тишины.\n\nНАЗНАЧЕНА ПРОВЕРКА: Выверить каденцию\nОплатить согласование ритма и отвода вокруг прерывания помощника. Это быстрее разбирает продолжающееся пение, но требует дополнительных расходов стенда; уже замолчавший певец оставляет более простой остаточный цикл, который можно изучить через более долгие повторы."
 HSM_BAR_mtk_ritual_brake_experiment_report_b_2:0 "УСТАНОВКА: Помощник прерывает. Проверенная пара.\n\nПрерывание помощника встречает продолжающуюся фразу, поэтому его действие пока трудно выделить. Проверенная пара принимает остаток, который нужно проследить до исходного уровня. Завершению нужен измеренный отвод, а не только слышимый признак наступившей тишины.\n\nДополнение к журналу испытаний\nПовторные остановки помощником подтвердили завершение без необходимости содействия певца. Проверенная пара отвела остаток без измеренного возвратного импульса в поле. Тормоз надёжно завершает испытанные ритмы независимой остановкой помощника. Контакт наследует проверенный отвод, а не власть стирать независимых существ."
