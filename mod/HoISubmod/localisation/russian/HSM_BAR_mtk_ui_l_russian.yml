 HSM_BAR_mtk_sorting_engine_rig_question:0 "Какие сравнительные образцы подать на сортировку?"
 HSM_BAR_mtk_sorting_engine_prepare_rig_a:0 "Чистые знакомые детали"
 HSM_BAR_mtk_sorting_engine_prepare_rig_a_tt:0 "Подавать чистые образцы известных мастерских семейств рядом с подписанными эталонами. Оставить открытым лоток неопределённого: проверяется ограниченное сравнение, поэтому нельзя предполагать принадлежность каждого поступившего предмета к одной из подготовленных групп."
 HSM_BAR_mtk_sorting_engine_prepare_rig_b:0 "Изношенные детали"
 HSM_BAR_mtk_sorting_engine_prepare_rig_b_tt:0 "Смешать изношенные примеры с известными эталонами и записать все назначения до настройки. Износ может придать знакомому изделию сходство с другой группой, проверяя границу сравнения, а не настоящее назначение предмета."
 HSM_BAR_mtk_sorting_engine_control_question:0 "Чем проверить правдоподобное совпадение?"
 HSM_BAR_mtk_sorting_engine_prepare_control_a:0 "Другой порядок подачи"
 HSM_BAR_mtk_sorting_engine_prepare_control_a_tt:0 "Переставить те же образцы, не меняя эталонных лотков. Независимый мастер проверяет назначения: сохраняется ли каждое верное совпадение при другой последовательности, а не только при привычном расположении демонстрационного набора деталей."
 HSM_BAR_mtk_sorting_engine_prepare_control_b:0 "Контур, другой материал"
 HSM_BAR_mtk_sorting_engine_prepare_control_b_tt:0 "Добавить образец с подходящим контуром, но непригодным для задачи материалом. Записать узнавание формы отдельно от приёмки, чтобы мастер мог прямо проверить кажущуюся уверенной классификацию предмета, которую предлагает сортировочная машина."
 HSM_BAR_mtk_sorting_engine_observation_0:0 "Чистые примеры достигают подписанных лотков, хотя машина не приводит оснований помимо заданных сравнений. Перемена подачи оставляет кажущееся совпадение, ещё ожидающее независимой проверки назначения мастером. Сомнительным совпадениям нужны видимый лоток или исправленные эталоны, чтобы предварительную сортировку можно было отделить от окончательной приёмки."
 HSM_BAR_mtk_sorting_engine_experiment_report_a_0:0 "УСТАНОВКА: Чистые знакомые детали. Другой порядок подачи.\n\nЧистые примеры достигают подписанных лотков, хотя машина не приводит оснований помимо заданных сравнений. Перемена подачи оставляет кажущееся совпадение, ещё ожидающее независимой проверки назначения мастером. Сомнительным совпадениям нужны видимый лоток или исправленные эталоны, чтобы предварительную сортировку можно было отделить от окончательной приёмки.\n\nДополнение к журналу испытаний\nНовые эталоны подтвердили узкие чистые семейства, не дав машине представления о назначении предметов. Перемена подачи сохранила проверенные совпадения в пределах известных чистых семейств деталей. Частичный результат даёт предварительную сортировку знакомых чистых деталей. Неясности решает мастер, новым группам нужны испытания. Машина не выводит назначение и не учится ремеслу; Мануфактура должна сохранить лоток неопределённого."
 HSM_BAR_mtk_sorting_engine_verification_a_0:0 "Чистые примеры достигают подписанных лотков, хотя машина не приводит оснований помимо заданных сравнений. Перемена подачи оставляет кажущееся совпадение, ещё ожидающее независимой проверки назначения мастером. Сомнительным совпадениям нужны видимый лоток или исправленные эталоны, чтобы предварительную сортировку можно было отделить от окончательной приёмки.\n\nНАЗНАЧЕНА ПРОВЕРКА: Пересобрать эталоны\nЗаказать проверенные эталоны возле спорной границы групп. Подготовка мастерской обойдётся дороже, зато быстрее прояснит изношенные детали; чистым семействам с вопросом порядка обычно нужно меньше переделки, их можно проверить продлённым осмотром назначений каждого образца."
 HSM_BAR_mtk_sorting_engine_experiment_report_b_0:0 "УСТАНОВКА: Чистые знакомые детали. Другой порядок подачи.\n\nЧистые примеры достигают подписанных лотков, хотя машина не приводит оснований помимо заданных сравнений. Перемена подачи оставляет кажущееся совпадение, ещё ожидающее независимой проверки назначения мастером. Сомнительным совпадениям нужны видимый лоток или исправленные эталоны, чтобы предварительную сортировку можно было отделить от окончательной приёмки.\n\nДополнение к журналу испытаний\nПродлённый осмотр чистых деталей подтвердил повторяемые предварительные назначения при имеющемся наборе эталонов. Перемена подачи сохранила проверенные совпадения в пределах известных чистых семейств деталей. Приёмка остаётся частичной и поднадзорной. Эталоны требуют ухода, спорные предметы требуют осмотра, материал бывает важнее контура. Машина не узнаёт замысла предмета и не судит самостоятельно; она повторяет сравнения мастерской."
