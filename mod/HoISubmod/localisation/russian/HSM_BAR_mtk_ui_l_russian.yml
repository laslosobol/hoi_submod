 HSM_BAR_mtk_necrotic_suture_rig_question:0 "Какие края ткани проверят временный шов?"
 HSM_BAR_mtk_necrotic_suture_prepare_rig_a:0 "Ровные края"
 HSM_BAR_mtk_necrotic_suture_prepare_rig_a_tt:0 "Сравнить парные полоски ткани под временным швом и обычной нитью. Проверяется поддержка при восстановлении, поэтому отпускание и прохождение жидкости записываются столь же тщательно, как прочность удержания соединённых краёв."
 HSM_BAR_mtk_necrotic_suture_prepare_rig_b:0 "Ушибленные края"
 HSM_BAR_mtk_necrotic_suture_prepare_rig_b_tt:0 "Расположить сравнительные метки на ушибленных волокнах удалённой хирургической ткани. Проверяется, не скрывает ли кажущееся натяжение слабое закрепление; удачная тяга на стенде сама по себе не подтверждает последующего восстановления пациента."
 HSM_BAR_mtk_necrotic_suture_control_question:0 "Чем проверить кажущийся прочным шов?"
 HSM_BAR_mtk_necrotic_suture_prepare_control_a:0 "Обычная нить"
 HSM_BAR_mtk_necrotic_suture_prepare_control_a_tt:0 "Применить обычную нить на парной полоске, сравнивая сгибание и отпускание. Отмечать, какая поддержка удерживает ткань в каждый момент: магический шов предназначен для передачи повреждения обычному хирургическому лечению после доставки."
 HSM_BAR_mtk_necrotic_suture_prepare_control_b:0 "Прохождение жидкости"
 HSM_BAR_mtk_necrotic_suture_prepare_control_b_tt:0 "Наблюдать прохождение жидкости через поддерживаемую ткань рядом с натяжением. Жёсткое соединение способно перекрыть мелкие сосуды; сравнение должно обнаружить конфликт, прежде чем более прочное удержание назовут лучшим результатом для пациента."
 HSM_BAR_mtk_necrotic_suture_observation_0:0 "Ровные края выдерживают сгибание, однако самое сильное натяжение необычно тесно стягивает поддерживаемые участки. Обычная нить допускает видимую передачу поддержки, которой магическое отпускание пока не соответствует. Поддержку необходимо отделить от сдавления, прежде чем клиническая запись получит основание для принятия."
 HSM_BAR_mtk_necrotic_suture_experiment_report_a_0:0 "УСТАНОВКА: Ровные края. Обычная нить.\n\nРовные края выдерживают сгибание, однако самое сильное натяжение необычно тесно стягивает поддерживаемые участки. Обычная нить допускает видимую передачу поддержки, которой магическое отпускание пока не соответствует. Поддержку необходимо отделить от сдавления, прежде чем клиническая запись получит основание для принятия.\n\nДополнение к журналу испытаний\nПеренесённые ровные метки удержали края без самого тугого режима. Обычная нить приняла поддержку после снятия временного магического шва с повреждённых краёв. Шов успешен как временная поддержка до лечения. Кровообращение и снятие обязательны для проверки; заражение, кровопотеря и повреждения вне шва требуют собственного лечения. Поддержанная ткань ещё не является зажившей."
 HSM_BAR_mtk_necrotic_suture_verification_a_0:0 "Ровные края выдерживают сгибание, однако самое сильное натяжение необычно тесно стягивает поддерживаемые участки. Обычная нить допускает видимую передачу поддержки, которой магическое отпускание пока не соответствует. Поддержку необходимо отделить от сдавления, прежде чем клиническая запись получит основание для принятия.\n\nНАЗНАЧЕНА ПРОВЕРКА: Перенести метки\nПеределать расположение меток и повторить сравнение при сдержанном натяжении. Подготовка дороже, зато быстрее устраняет скольжение ушибленных краёв; ровные парные края могут установить пределы отпускания более длительной серией с уже нанесёнными рабочими метками."
 HSM_BAR_mtk_necrotic_suture_experiment_report_b_0:0 "УСТАНОВКА: Ровные края. Обычная нить.\n\nРовные края выдерживают сгибание, однако самое сильное натяжение необычно тесно стягивает поддерживаемые участки. Обычная нить допускает видимую передачу поддержки, которой магическое отпускание пока не соответствует. Поддержку необходимо отделить от сдавления, прежде чем клиническая запись получит основание для принятия.\n\nДополнение к журналу испытаний\nПовторные проверки снятия установили рабочий промежуток поддержки ровных краёв. Обычная нить приняла поддержку после снятия временного магического шва с повреждённых краёв. Принятый шов удерживает повреждённые структуры при переноске или восстановлении и не требует оживления после снятия. Обычный уход и осмотры необходимы. Для Последней минуты это конечный переход к лечению, а не исцеление жёсткостью."
 HSM_BAR_mtk_necrotic_suture_verification_b_0:0 "Ровные края выдерживают сгибание, однако самое сильное натяжение необычно тесно стягивает поддерживаемые участки. Обычная нить допускает видимую передачу поддержки, которой магическое отпускание пока не соответствует. Поддержку необходимо отделить от сдавления, прежде чем клиническая запись получит основание для принятия.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить проверку снятия\nСохранить узор и сравнивать сдержанное натяжение с обычной поддержкой при повторных снятиях. Это экономит новые надписи, но дольше занимает ушибленные метки; ровные края уже дают наиболее ясное сравнение удержания, проходимости и передачи нити."
 HSM_BAR_mtk_necrotic_suture_observation_1:0 "Ровные края выдерживают сгибание, однако самое сильное натяжение необычно тесно стягивает поддерживаемые участки. Прохождение жидкости ослабевает при самом тугом режиме вопреки убедительной прочности шва. Поддержку необходимо отделить от сдавления, прежде чем клиническая запись получит основание для принятия."
 HSM_BAR_mtk_necrotic_suture_experiment_report_a_1:0 "УСТАНОВКА: Ровные края. Прохождение жидкости.\n\nРовные края выдерживают сгибание, однако самое сильное натяжение необычно тесно стягивает поддерживаемые участки. Прохождение жидкости ослабевает при самом тугом режиме вопреки убедительной прочности шва. Поддержку необходимо отделить от сдавления, прежде чем клиническая запись получит основание для принятия.\n\nДополнение к журналу испытаний\nПеренесённые ровные метки удержали края без самого тугого режима. Меньшее натяжение сохранило проходимость; кажущаяся жёсткость была отвергнута как мера успешной поддержки. Шов успешен как временная поддержка до лечения. Кровообращение и снятие обязательны для проверки; заражение, кровопотеря и повреждения вне шва требуют собственного лечения. Поддержанная ткань ещё не является зажившей."
 HSM_BAR_mtk_necrotic_suture_verification_a_1:0 "Ровные края выдерживают сгибание, однако самое сильное натяжение необычно тесно стягивает поддерживаемые участки. Прохождение жидкости ослабевает при самом тугом режиме вопреки убедительной прочности шва. Поддержку необходимо отделить от сдавления, прежде чем клиническая запись получит основание для принятия.\n\nНАЗНАЧЕНА ПРОВЕРКА: Перенести метки\nПеределать расположение меток и повторить сравнение при сдержанном натяжении. Подготовка дороже, зато быстрее устраняет скольжение ушибленных краёв; ровные парные края могут установить пределы отпускания более длительной серией с уже нанесёнными рабочими метками."
 HSM_BAR_mtk_necrotic_suture_experiment_report_b_1:0 "УСТАНОВКА: Ровные края. Прохождение жидкости.\n\nРовные края выдерживают сгибание, однако самое сильное натяжение необычно тесно стягивает поддерживаемые участки. Прохождение жидкости ослабевает при самом тугом режиме вопреки убедительной прочности шва. Поддержку необходимо отделить от сдавления, прежде чем клиническая запись получит основание для принятия.\n\nДополнение к журналу испытаний\nПовторные проверки снятия установили рабочий промежуток поддержки ровных краёв. Меньшее натяжение сохранило проходимость; кажущаяся жёсткость была отвергнута как мера успешной поддержки. Принятый шов удерживает повреждённые структуры при переноске или восстановлении и не требует оживления после снятия. Обычный уход и осмотры необходимы. Для Последней минуты это конечный переход к лечению, а не исцеление жёсткостью."
 HSM_BAR_mtk_necrotic_suture_verification_b_1:0 "Ровные края выдерживают сгибание, однако самое сильное натяжение необычно тесно стягивает поддерживаемые участки. Прохождение жидкости ослабевает при самом тугом режиме вопреки убедительной прочности шва. Поддержку необходимо отделить от сдавления, прежде чем клиническая запись получит основание для принятия.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить проверку снятия\nСохранить узор и сравнивать сдержанное натяжение с обычной поддержкой при повторных снятиях. Это экономит новые надписи, но дольше занимает ушибленные метки; ровные края уже дают наиболее ясное сравнение удержания, проходимости и передачи нити."
 HSM_BAR_mtk_necrotic_suture_observation_2:0 "Ушибленные края скользят под меткой, хотя оставшийся промежуток выглядит прочно поддержанным. Обычная нить допускает видимую передачу поддержки, которой магическое отпускание пока не соответствует. Поддержку необходимо отделить от сдавления, прежде чем клиническая запись получит основание для принятия."
 HSM_BAR_mtk_necrotic_suture_experiment_report_a_2:0 "УСТАНОВКА: Ушибленные края. Обычная нить.\n\nУшибленные края скользят под меткой, хотя оставшийся промежуток выглядит прочно поддержанным. Обычная нить допускает видимую передачу поддержки, которой магическое отпускание пока не соответствует. Поддержку необходимо отделить от сдавления, прежде чем клиническая запись получит основание для принятия.\n\nДополнение к журналу испытаний\nПеренос меток с ушибленных волокон устранил скольжение при временной поддержке. Обычная нить приняла поддержку после снятия временного магического шва с повреждённых краёв. Шов успешен как временная поддержка до лечения. Кровообращение и снятие обязательны для проверки; заражение, кровопотеря и повреждения вне шва требуют собственного лечения. Поддержанная ткань ещё не является зажившей."
 HSM_BAR_mtk_necrotic_suture_verification_a_2:0 "Ушибленные края скользят под меткой, хотя оставшийся промежуток выглядит прочно поддержанным. Обычная нить допускает видимую передачу поддержки, которой магическое отпускание пока не соответствует. Поддержку необходимо отделить от сдавления, прежде чем клиническая запись получит основание для принятия.\n\nНАЗНАЧЕНА ПРОВЕРКА: Перенести метки\nПеределать расположение меток и повторить сравнение при сдержанном натяжении. Подготовка дороже, зато быстрее устраняет скольжение ушибленных краёв; ровные парные края могут установить пределы отпускания более длительной серией с уже нанесёнными рабочими метками."
 HSM_BAR_mtk_necrotic_suture_experiment_report_b_2:0 "УСТАНОВКА: Ушибленные края. Обычная нить.\n\nУшибленные края скользят под меткой, хотя оставшийся промежуток выглядит прочно поддержанным. Обычная нить допускает видимую передачу поддержки, которой магическое отпускание пока не соответствует. Поддержку необходимо отделить от сдавления, прежде чем клиническая запись получит основание для принятия.\n\nДополнение к журналу испытаний\nПовторные сравнения исключили ушибленное закрепление до принятия поддерживаемой клинической последовательности. Обычная нить приняла поддержку после снятия временного магического шва с повреждённых краёв. Принятый шов удерживает повреждённые структуры при переноске или восстановлении и не требует оживления после снятия. Обычный уход и осмотры необходимы. Для Последней минуты это конечный переход к лечению, а не исцеление жёсткостью."
 HSM_BAR_mtk_necrotic_suture_verification_b_2:0 "Ушибленные края скользят под меткой, хотя оставшийся промежуток выглядит прочно поддержанным. Обычная нить допускает видимую передачу поддержки, которой магическое отпускание пока не соответствует. Поддержку необходимо отделить от сдавления, прежде чем клиническая запись получит основание для принятия.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить проверку снятия\nСохранить узор и сравнивать сдержанное натяжение с обычной поддержкой при повторных снятиях. Это экономит новые надписи, но дольше занимает ушибленные метки; ровные края уже дают наиболее ясное сравнение удержания, проходимости и передачи нити."
 HSM_BAR_mtk_necrotic_suture_observation_3:0 "Ушибленные края скользят под меткой, хотя оставшийся промежуток выглядит прочно поддержанным. Прохождение жидкости ослабевает при самом тугом режиме вопреки убедительной прочности шва. Поддержку необходимо отделить от сдавления, прежде чем клиническая запись получит основание для принятия."
 HSM_BAR_mtk_necrotic_suture_experiment_report_a_3:0 "УСТАНОВКА: Ушибленные края. Прохождение жидкости.\n\nУшибленные края скользят под меткой, хотя оставшийся промежуток выглядит прочно поддержанным. Прохождение жидкости ослабевает при самом тугом режиме вопреки убедительной прочности шва. Поддержку необходимо отделить от сдавления, прежде чем клиническая запись получит основание для принятия.\n\nДополнение к журналу испытаний\nПеренос меток с ушибленных волокон устранил скольжение при временной поддержке. Меньшее натяжение сохранило проходимость; кажущаяся жёсткость была отвергнута как мера успешной поддержки. Шов успешен как временная поддержка до лечения. Кровообращение и снятие обязательны для проверки; заражение, кровопотеря и повреждения вне шва требуют собственного лечения. Поддержанная ткань ещё не является зажившей."
 HSM_BAR_mtk_necrotic_suture_verification_a_3:0 "Ушибленные края скользят под меткой, хотя оставшийся промежуток выглядит прочно поддержанным. Прохождение жидкости ослабевает при самом тугом режиме вопреки убедительной прочности шва. Поддержку необходимо отделить от сдавления, прежде чем клиническая запись получит основание для принятия.\n\nНАЗНАЧЕНА ПРОВЕРКА: Перенести метки\nПеределать расположение меток и повторить сравнение при сдержанном натяжении. Подготовка дороже, зато быстрее устраняет скольжение ушибленных краёв; ровные парные края могут установить пределы отпускания более длительной серией с уже нанесёнными рабочими метками."
 HSM_BAR_mtk_necrotic_suture_experiment_report_b_3:0 "УСТАНОВКА: Ушибленные края. Прохождение жидкости.\n\nУшибленные края скользят под меткой, хотя оставшийся промежуток выглядит прочно поддержанным. Прохождение жидкости ослабевает при самом тугом режиме вопреки убедительной прочности шва. Поддержку необходимо отделить от сдавления, прежде чем клиническая запись получит основание для принятия.\n\nДополнение к журналу испытаний\nПовторные сравнения исключили ушибленное закрепление до принятия поддерживаемой клинической последовательности. Меньшее натяжение сохранило проходимость; кажущаяся жёсткость была отвергнута как мера успешной поддержки. Принятый шов удерживает повреждённые структуры при переноске или восстановлении и не требует оживления после снятия. Обычный уход и осмотры необходимы. Для Последней минуты это конечный переход к лечению, а не исцеление жёсткостью."
 HSM_BAR_mtk_necrotic_suture_verification_b_3:0 "Ушибленные края скользят под меткой, хотя оставшийся промежуток выглядит прочно поддержанным. Прохождение жидкости ослабевает при самом тугом режиме вопреки убедительной прочности шва. Поддержку необходимо отделить от сдавления, прежде чем клиническая запись получит основание для принятия.\n\nНАЗНАЧЕНА ПРОВЕРКА: Продлить проверку снятия\nСохранить узор и сравнивать сдержанное натяжение с обычной поддержкой при повторных снятиях. Это экономит новые надписи, но дольше занимает ушибленные метки; ровные края уже дают наиболее ясное сравнение удержания, проходимости и передачи нити."
