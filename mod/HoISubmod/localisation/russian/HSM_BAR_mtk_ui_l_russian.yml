 HSM_BAR_mtk_shared_senses_respond_b_tt:0 "Продлить сеансы с отдыхом и поручить Леопольду сравнить отдельные рисунки до раскрытия подписей. Новых приспособлений потребуется меньше, но после опытов с движением работа займёт дольше: неприятное ощущение завершает сеанс, а не оправдывает его продолжение.\n\n[GetHSMBARMtkResponseBudget_shared_senses_b]"
 HSM_BAR_mtk_sleep_lecture_rig_question:0 "Как предъявить незнакомые знаки во время наблюдаемого сна?"
 HSM_BAR_mtk_sleep_lecture_prepare_rig_a:0 "Устный урок знаков"
 HSM_BAR_mtk_sleep_lecture_prepare_rig_a_tt:0 "Воспроизвести объяснение незнакомых знаков после наступления сна. Запись предъявления отделяется от утреннего воспоминания: услышанный голос или сон о классе ещё не подтверждают, что правило действительно удалось усвоить."
 HSM_BAR_mtk_sleep_lecture_prepare_rig_b:0 "Повтор ряда знаков"
 HSM_BAR_mtk_sleep_lecture_prepare_rig_b_tt:0 "Повторить ту же незнакомую последовательность в наблюдаемый промежуток. Сохранить запись для проверки и отметить нарушения отдыха, прежде чем трактовать знакомое звучание как понимание порядка предъявленных ученику знаков."
 HSM_BAR_mtk_sleep_lecture_control_question:0 "С чем экзаменатор сравнит результат ночного урока?"
 HSM_BAR_mtk_sleep_lecture_prepare_control_a:0 "Тихая ночь"
 HSM_BAR_mtk_sleep_lecture_prepare_control_a_tt:0 "Оставить прибор неактивным в сравнительную ночь и скрыть расписание от экзаменатора. Узнавание, объяснение и новая расстановка получают отдельные записи, а не единую оценку предполагаемого улучшения после ночи."
 HSM_BAR_mtk_sleep_lecture_prepare_control_b:0 "Урок наяву"
 HSM_BAR_mtk_sleep_lecture_prepare_control_b_tt:0 "Обучить бодрствующий класс сходному набору знаков. Экзаменатор просит применить правило в новых расстановках, сравнивая гипотезу обучения во сне с действительным пониманием, а не с простым узнаванием прежних карточек."
 HSM_BAR_mtk_sleep_lecture_observation_0:0 "После устного урока спавшие описывают голос в классе, но затрудняются объяснить значение предложенного незнакомого знака. Отчёты тихой ночи тоже содержат узнавание, а экзаменатор ещё не заменял карточки во время утренней проверки. Сильвер требует проверки после отдыха, отделяющей знакомое звучание от применимого знания, прежде чем выделять для этого замысла ещё одну ночь наблюдений."
 HSM_BAR_mtk_sleep_lecture_experiment_report_a_0:0 "УСТАНОВКА: Устный урок знаков. Тихая ночь.\n\nПосле устного урока спавшие описывают голос в классе, но затрудняются объяснить значение предложенного незнакомого знака. Отчёты тихой ночи тоже содержат узнавание, а экзаменатор ещё не заменял карточки во время утренней проверки. Сильвер требует проверки после отдыха, отделяющей знакомое звучание от применимого знания, прежде чем выделять для этого замысла ещё одну ночь наблюдений.\n\nДополнение к журналу испытаний\nНовые карточки устранили кажущееся узнавание после устного урока, хотя запись подтвердила его полное предъявление. Узнавание после тихой ночи исчезло, когда экзаменатор заменил карточки, сохранив само проверяемое правило. Лекция во сне провалилась. Рассказы о снах не подтверждают обучения или пригодной замены преподаванию; возмещающей практической пользы не получено. Ночное обучение прекращено. Отвергнутая предпосылка остаётся в материалах Хора: приём сигнала ещё не доказывает понимания."
 HSM_BAR_mtk_sleep_lecture_verification_a_0:0 "После устного урока спавшие описывают голос в классе, но затрудняются объяснить значение предложенного незнакомого знака. Отчёты тихой ночи тоже содержат узнавание, а экзаменатор ещё не заменял карточки во время утренней проверки. Сильвер требует проверки после отдыха, отделяющей знакомое звучание от применимого знания, прежде чем выделять для этого замысла ещё одну ночь наблюдений.\n\nНАЗНАЧЕНА ПРОВЕРКА: Заменить карточки\nЗаказать новые сопоставимые карточки и повторить проверку после отдыха. Подготовка обойдётся дороже, зато простая запись позволит быстрее проверить узнавание; после повторённых последовательностей потребуется дополнительное время, чтобы отделить усталость от полученных ответов."
 HSM_BAR_mtk_sleep_lecture_experiment_report_b_0:0 "УСТАНОВКА: Устный урок знаков. Тихая ночь.\n\nПосле устного урока спавшие описывают голос в классе, но затрудняются объяснить значение предложенного незнакомого знака. Отчёты тихой ночи тоже содержат узнавание, а экзаменатор ещё не заменял карточки во время утренней проверки. Сильвер требует проверки после отдыха, отделяющей знакомое звучание от применимого знания, прежде чем выделять для этого замысла ещё одну ночь наблюдений.\n\nДополнение к журналу испытаний\nУстная запись содержала все предусмотренные отрывки; отсутствие предъявления не могло объяснить, почему правило не усвоено. Узнавание после тихой ночи исчезло, когда экзаменатор заменил карточки, сохранив само проверяемое правило. Гипотеза закрыта как неудачная: подтверждённого обучения и практической пользы нет. После отдыха ученики возвращаются к обычным занятиям. Полная запись хранится рядом с ошибочными ответами, чтобы при работе над Хором передачу не принимали за понимание."
 HSM_BAR_mtk_sleep_lecture_verification_b_0:0 "После устного урока спавшие описывают голос в классе, но затрудняются объяснить значение предложенного незнакомого знака. Отчёты тихой ночи тоже содержат узнавание, а экзаменатор ещё не заменял карточки во время утренней проверки. Сильвер требует проверки после отдыха, отделяющей знакомое звучание от применимого знания, прежде чем выделять для этого замысла ещё одну ночь наблюдений.\n\nНАЗНАЧЕНА ПРОВЕРКА: Сверить запись и ответы\nПоручить Леопольду проверку записи, а Сильверу сравнение объяснений после отдыха с прежним экзаменом. Заказ новых карточек не потребуется, но читатели будут заняты дольше; повторная запись уже содержит удобные промежутки для проверки предъявленного материала."
 HSM_BAR_mtk_sleep_lecture_observation_1:0 "После устного урока спавшие описывают голос в классе, но затрудняются объяснить значение предложенного незнакомого знака. Бодрствующий класс объясняет своё отдельное правило, однако его ответы ещё нужно проверить на иначе расставленных карточках. Сильвер требует проверки после отдыха, отделяющей знакомое звучание от применимого знания, прежде чем выделять для этого замысла ещё одну ночь наблюдений."
 HSM_BAR_mtk_sleep_lecture_experiment_report_a_1:0 "УСТАНОВКА: Устный урок знаков. Урок наяву.\n\nПосле устного урока спавшие описывают голос в классе, но затрудняются объяснить значение предложенного незнакомого знака. Бодрствующий класс объясняет своё отдельное правило, однако его ответы ещё нужно проверить на иначе расставленных карточках. Сильвер требует проверки после отдыха, отделяющей знакомое звучание от применимого знания, прежде чем выделять для этого замысла ещё одну ночь наблюдений.\n\nДополнение к журналу испытаний\nНовые карточки устранили кажущееся узнавание после устного урока, хотя запись подтвердила его полное предъявление. Бодрствующий класс применил своё правило к новым расстановкам, а спавшие ученики этого не смогли. Лекция во сне провалилась. Рассказы о снах не подтверждают обучения или пригодной замены преподаванию; возмещающей практической пользы не получено. Ночное обучение прекращено. Отвергнутая предпосылка остаётся в материалах Хора: приём сигнала ещё не доказывает понимания."
 HSM_BAR_mtk_sleep_lecture_verification_a_1:0 "После устного урока спавшие описывают голос в классе, но затрудняются объяснить значение предложенного незнакомого знака. Бодрствующий класс объясняет своё отдельное правило, однако его ответы ещё нужно проверить на иначе расставленных карточках. Сильвер требует проверки после отдыха, отделяющей знакомое звучание от применимого знания, прежде чем выделять для этого замысла ещё одну ночь наблюдений.\n\nНАЗНАЧЕНА ПРОВЕРКА: Заменить карточки\nЗаказать новые сопоставимые карточки и повторить проверку после отдыха. Подготовка обойдётся дороже, зато простая запись позволит быстрее проверить узнавание; после повторённых последовательностей потребуется дополнительное время, чтобы отделить усталость от полученных ответов."
 HSM_BAR_mtk_sleep_lecture_experiment_report_b_1:0 "УСТАНОВКА: Устный урок знаков. Урок наяву.\n\nПосле устного урока спавшие описывают голос в классе, но затрудняются объяснить значение предложенного незнакомого знака. Бодрствующий класс объясняет своё отдельное правило, однако его ответы ещё нужно проверить на иначе расставленных карточках. Сильвер требует проверки после отдыха, отделяющей знакомое звучание от применимого знания, прежде чем выделять для этого замысла ещё одну ночь наблюдений.\n\nДополнение к журналу испытаний\nУстная запись содержала все предусмотренные отрывки; отсутствие предъявления не могло объяснить, почему правило не усвоено. Бодрствующий класс применил своё правило к новым расстановкам, а спавшие ученики этого не смогли. Гипотеза закрыта как неудачная: подтверждённого обучения и практической пользы нет. После отдыха ученики возвращаются к обычным занятиям. Полная запись хранится рядом с ошибочными ответами, чтобы при работе над Хором передачу не принимали за понимание."
 HSM_BAR_mtk_sleep_lecture_verification_b_1:0 "После устного урока спавшие описывают голос в классе, но затрудняются объяснить значение предложенного незнакомого знака. Бодрствующий класс объясняет своё отдельное правило, однако его ответы ещё нужно проверить на иначе расставленных карточках. Сильвер требует проверки после отдыха, отделяющей знакомое звучание от применимого знания, прежде чем выделять для этого замысла ещё одну ночь наблюдений.\n\nНАЗНАЧЕНА ПРОВЕРКА: Сверить запись и ответы\nПоручить Леопольду проверку записи, а Сильверу сравнение объяснений после отдыха с прежним экзаменом. Заказ новых карточек не потребуется, но читатели будут заняты дольше; повторная запись уже содержит удобные промежутки для проверки предъявленного материала."
 HSM_BAR_mtk_sleep_lecture_observation_2:0 "После повторённой последовательности спавшие узнают ритм и жалуются на усталость; объяснения предъявленных знаков остаются противоречивыми. Отчёты тихой ночи тоже содержат узнавание, а экзаменатор ещё не заменял карточки во время утренней проверки. Сильвер требует проверки после отдыха, отделяющей знакомое звучание от применимого знания, прежде чем выделять для этого замысла ещё одну ночь наблюдений."
 HSM_BAR_mtk_sleep_lecture_experiment_report_a_2:0 "УСТАНОВКА: Повтор ряда знаков. Тихая ночь.\n\nПосле повторённой последовательности спавшие узнают ритм и жалуются на усталость; объяснения предъявленных знаков остаются противоречивыми. Отчёты тихой ночи тоже содержат узнавание, а экзаменатор ещё не заменял карточки во время утренней проверки. Сильвер требует проверки после отдыха, отделяющей знакомое звучание от применимого знания, прежде чем выделять для этого замысла ещё одну ночь наблюдений.\n\nДополнение к журналу испытаний\nОтдых и замена карточек убрали догадки по знакомому ритму из утренних ответов после повторённого ряда. Узнавание после тихой ночи исчезло, когда экзаменатор заменил карточки, сохранив само проверяемое правило. Лекция во сне провалилась. Рассказы о снах не подтверждают обучения или пригодной замены преподаванию; возмещающей практической пользы не получено. Ночное обучение прекращено. Отвергнутая предпосылка остаётся в материалах Хора: приём сигнала ещё не доказывает понимания."
