 HSM_BAR_mtk_crystal_memory_rig_question:0 "На какие кристаллы записать светящийся рисунок?"
 HSM_BAR_mtk_crystal_memory_prepare_rig_a:0 "Новые образцы"
 HSM_BAR_mtk_crystal_memory_prepare_rig_a_tt:0 "Пронумеровать ещё не использованные кристаллы до отбора прозрачных образцов. Восстановленные следы сравниваются с бумажными оригиналами, чтобы привлекательный вид оставался отдельным признаком, не подменяющим способность удержать простой рисунок."
 HSM_BAR_mtk_crystal_memory_prepare_rig_b:0 "Повторная запись"
 HSM_BAR_mtk_crystal_memory_prepare_rig_b_tt:0 "Записать новый простой рисунок поверх документированной прежней экспозиции. Сохранить обе исходные схемы: кажущаяся дополнительной деталь может оказаться старым следом, а не достоверной частью нового восстановленного изображения кристалла."
 HSM_BAR_mtk_crystal_memory_control_question:0 "В каких условиях хранения сравнить воспроизведение?"
 HSM_BAR_mtk_crystal_memory_prepare_control_a:0 "Прохладный лоток"
 HSM_BAR_mtk_crystal_memory_prepare_control_a_tt:0 "Держать пронумерованные образцы вдали от тёплой стены мастерской. Записывать порядок и промежутки хранения, затем предлагать незнакомым с оригиналом наблюдателям зарисовать каждый восстановленный след до открытия сравнительной схемы."
 HSM_BAR_mtk_crystal_memory_prepare_control_b:0 "Тёплая полка"
 HSM_BAR_mtk_crystal_memory_prepare_control_b_tt:0 "Поставить сравнительный лоток возле тёплой стены, не меняя исходной схемы. Температура проверяет именно хранение, а не уверенность читателя; чёткое немедленное воспроизведение ещё не показывает, как долго удержится запись."
 HSM_BAR_mtk_crystal_memory_observation_0:0 "Новые кристаллы возвращают общее расположение рисунка, однако независимые зарисовки уже расходятся в изображении самых тонких краёв. В прохладном лотке последовательные воспроизведения выглядят настолько похожими, что скорость угасания пока трудно определить по ним. Следу нужны история экспозиций и проверенное сравнение условий хранения, прежде чем его можно будет подшить как временную запись проведённого опыта."
 HSM_BAR_mtk_crystal_memory_experiment_report_a_0:0 "УСТАНОВКА: Новые образцы. Прохладный лоток.\n\nНовые кристаллы возвращают общее расположение рисунка, однако независимые зарисовки уже расходятся в изображении самых тонких краёв. В прохладном лотке последовательные воспроизведения выглядят настолько похожими, что скорость угасания пока трудно определить по ним. Следу нужны история экспозиций и проверенное сравнение условий хранения, прежде чем его можно будет подшить как временную запись проведённого опыта.\n\nДополнение к журналу испытаний\nРаздельно учтённые новые образцы сохранили общие рисунки, но не обеспечили надёжного воспроизведения их мелких деталей. Прохладное хранение замедлило видимую потерю деталей, но не сохранило тонкие края на неограниченный срок. Память кристалла остаётся временной записью простых видимых рисунков рядом с бумажными оригиналами и историей хранения. Она не сохраняет личность или полный опыт. Хор может обращаться к этим следам только при наличии долговечного независимого образца."
 HSM_BAR_mtk_crystal_memory_verification_a_0:0 "Новые кристаллы возвращают общее расположение рисунка, однако независимые зарисовки уже расходятся в изображении самых тонких краёв. В прохладном лотке последовательные воспроизведения выглядят настолько похожими, что скорость угасания пока трудно определить по ним. Следу нужны история экспозиций и проверенное сравнение условий хранения, прежде чем его можно будет подшить как временную запись проведённого опыта.\n\nНАЗНАЧЕНА ПРОВЕРКА: Разделить записи\nЗаказать отдельные лотки и сравнить каждое воспроизведение с обеими исходными схемами. Учёт потребует больших расходов, зато быстрее распутает повторные записи; новым образцам без прежнего изображения восстановление истории экспозиций поможет в меньшей степени."
 HSM_BAR_mtk_crystal_memory_experiment_report_b_0:0 "УСТАНОВКА: Новые образцы. Прохладный лоток.\n\nНовые кристаллы возвращают общее расположение рисунка, однако независимые зарисовки уже расходятся в изображении самых тонких краёв. В прохладном лотке последовательные воспроизведения выглядят настолько похожими, что скорость угасания пока трудно определить по ним. Следу нужны история экспозиций и проверенное сравнение условий хранения, прежде чем его можно будет подшить как временную запись проведённого опыта.\n\nДополнение к журналу испытаний\nРазнесённые чтения показали потерю деталей у новых образцов при сохранении лишь общего расположения светящегося рисунка. Прохладное хранение замедлило видимую потерю деталей, но не сохранило тонкие края на неограниченный срок. Частичный результат допускает недолговечные зрительные образцы, а не точный архив. Каждый принятый кристалл сопровождают исходный рисунок, отметка прежнего использования и условия хранения. При дрейфе воспроизведения решает бумага, в том числе при сравнении вкладов в Хоре."
