 HSM_BAR_mtk_chorus_rig_question:0 "Где разместить независимые станции Хора?"
 HSM_BAR_mtk_chorus_prepare_rig_a:0 "Внутри съёмки"
 HSM_BAR_mtk_chorus_prepare_rig_a_tt:0 "Разместить станции внутри границы Атласа полей, с отдельными контурами и остановками. Это даёт известную пространственную опору, оставляя согласование вкладов самостоятельным предметом проверки при первом совместном световом упражнении."
 HSM_BAR_mtk_chorus_prepare_rig_b:0 "У края мастерской"
 HSM_BAR_mtk_chorus_prepare_rig_b_tt:0 "Разместить станции вдоль обследованного края возле мастерской. Сохранить слой помех атласа: нарушение общего рисунка может происходить от соседних приборов, а не от разногласия между участниками совместного светового упражнения."
 HSM_BAR_mtk_chorus_control_question:0 "Какой образец каждый бодрствующий участник объяснит перед включением?"
 HSM_BAR_mtk_chorus_prepare_control_a:0 "Бумажные вклады"
 HSM_BAR_mtk_chorus_prepare_control_a_tt:0 "Разобрать письменный вклад с каждым участником до включения. Отдельные рисунки остаются рядом с общим световым узором: после неудачной Лекции во сне приём сигнала не может подменять понимание задачи."
 HSM_BAR_mtk_chorus_prepare_control_b:0 "Кристальные образцы"
 HSM_BAR_mtk_chorus_prepare_control_b_tt:0 "Репетировать наяву по временным кристальным следам рядом с бумажными оригиналами. Воспроизведение даёт изменяемый образец, но участники должны объяснить нотацию и видеть точки остановки, даже когда кристалл начинает искажать рисунок."
 HSM_BAR_mtk_chorus_observation_0:0 "Внутри обследованной комнаты отдельные станции ненадолго удерживают общий контур, но перекрывающиеся предложения затрудняют различение индивидуальных вкладов. Участники объясняют бумажные указания, однако одновременное начало скрывает, чей знак остановки следует проверять в первую очередь. Группе нужна более ясная граница или разнесённые вклады, прежде чем устойчивый световой узор сможет подтвердить совместную работу наблюдателей, сохраняющих независимость."
 HSM_BAR_mtk_chorus_experiment_report_a_0:0 "УСТАНОВКА: Внутри съёмки. Бумажные вклады.\n\nВнутри обследованной комнаты отдельные станции ненадолго удерживают общий контур, но перекрывающиеся предложения затрудняют различение индивидуальных вкладов. Участники объясняют бумажные указания, однако одновременное начало скрывает, чей знак остановки следует проверять в первую очередь. Группе нужна более ясная граница или разнесённые вклады, прежде чем устойчивый световой узор сможет подтвердить совместную работу наблюдателей, сохраняющих независимость.\n\nДополнение к журналу испытаний\nПереставленные внутренние станции сделали каждый предложенный контур и каждый выход отдельно различимыми для наблюдателей. Объяснения наяву и раздельные бумажные листы позволили отличить понимание задачи от простого приёма сигнала. Местный Хор успешен при независимых остановках. Атлас полей задаёт границы; Общие чувства допускают неподвижные контуры; провал Лекции во сне требует понимания наяву; Память кристалла нуждается в бумаге; Нотация чар делает вклады читаемыми. Тесный обмен утомляет; отсутствующие разумы и объединённое сознание недоступны."
 HSM_BAR_mtk_chorus_verification_a_0:0 "Внутри обследованной комнаты отдельные станции ненадолго удерживают общий контур, но перекрывающиеся предложения затрудняют различение индивидуальных вкладов. Участники объясняют бумажные указания, однако одновременное начало скрывает, чей знак остановки следует проверять в первую очередь. Группе нужна более ясная граница или разнесённые вклады, прежде чем устойчивый световой узор сможет подтвердить совместную работу наблюдателей, сохраняющих независимость.\n\nНАЗНАЧЕНА ПРОВЕРКА: Переставить станции\nЗаказать новое расположение с отдельной проверкой связей. Перенос крайних станций внутрь требует больших расходов мастерской, зато быстрее убирает известную помеху; уже защищённая группа получит меньше преимуществ и может наладить согласование более длительными репетициями."
 HSM_BAR_mtk_chorus_experiment_report_b_0:0 "УСТАНОВКА: Внутри съёмки. Бумажные вклады.\n\nВнутри обследованной комнаты отдельные станции ненадолго удерживают общий контур, но перекрывающиеся предложения затрудняют различение индивидуальных вкладов. Участники объясняют бумажные указания, однако одновременное начало скрывает, чей знак остановки следует проверять в первую очередь. Группе нужна более ясная граница или разнесённые вклады, прежде чем устойчивый световой узор сможет подтвердить совместную работу наблюдателей, сохраняющих независимость.\n\nДополнение к журналу испытаний\nРазнесённые внутренние вклады удержали рисунок, пока каждый участник отдельно показывал возможность собственного выхода из обмена. Объяснения наяву и раздельные бумажные листы позволили отличить понимание задачи от простого приёма сигнала. Принятый Хор остаётся местным. Атлас полей даёт границу, Общие чувства ограничивают обмен, провал Лекции во сне требует понимания, Память кристалла даёт неточные образцы, Нотация чар проверяет вклады. Усталость и дальность сохраняют пределы; никто не объединяет разумы и не получает чужой полный опыт."
 HSM_BAR_mtk_chorus_verification_b_0:0 "Внутри обследованной комнаты отдельные станции ненадолго удерживают общий контур, но перекрывающиеся предложения затрудняют различение индивидуальных вкладов. Участники объясняют бумажные указания, однако одновременное начало скрывает, чей знак остановки следует проверять в первую очередь. Группе нужна более ясная граница или разнесённые вклады, прежде чем устойчивый световой узор сможет подтвердить совместную работу наблюдателей, сохраняющих независимость.\n\nНАЗНАЧЕНА ПРОВЕРКА: Разнести вклады\nПродлить репетиции наяву, вводя каждый предложенный контур по записанному порядку. Это экономит переделку защищённых станций, но дольше занимает кафедру возле помех; паузы и бумажные сравнения придётся повторять при потере опоры у крайнего вклада."
 HSM_BAR_mtk_chorus_observation_1:0 "Внутри обследованной комнаты отдельные станции ненадолго удерживают общий контур, но перекрывающиеся предложения затрудняют различение индивидуальных вкладов. Участники объясняют указания с кристальным образцом, но стареющий след вносит форму, отсутствующую на его бумажном оригинале. Группе нужна более ясная граница или разнесённые вклады, прежде чем устойчивый световой узор сможет подтвердить совместную работу наблюдателей, сохраняющих независимость."
 HSM_BAR_mtk_chorus_experiment_report_a_1:0 "УСТАНОВКА: Внутри съёмки. Кристальные образцы.\n\nВнутри обследованной комнаты отдельные станции ненадолго удерживают общий контур, но перекрывающиеся предложения затрудняют различение индивидуальных вкладов. Участники объясняют указания с кристальным образцом, но стареющий след вносит форму, отсутствующую на его бумажном оригинале. Группе нужна более ясная граница или разнесённые вклады, прежде чем устойчивый световой узор сможет подтвердить совместную работу наблюдателей, сохраняющих независимость.\n\nДополнение к журналу испытаний\nПереставленные внутренние станции сделали каждый предложенный контур и каждый выход отдельно различимыми для наблюдателей. Бумажные оригиналы исправили дрейф кристальных образцов без признания временного воспроизведения окончательным доказательством правильности рисунка. Местный Хор успешен при независимых остановках. Атлас полей задаёт границы; Общие чувства допускают неподвижные контуры; провал Лекции во сне требует понимания наяву; Память кристалла нуждается в бумаге; Нотация чар делает вклады читаемыми. Тесный обмен утомляет; отсутствующие разумы и объединённое сознание недоступны."
 HSM_BAR_mtk_chorus_verification_a_1:0 "Внутри обследованной комнаты отдельные станции ненадолго удерживают общий контур, но перекрывающиеся предложения затрудняют различение индивидуальных вкладов. Участники объясняют указания с кристальным образцом, но стареющий след вносит форму, отсутствующую на его бумажном оригинале. Группе нужна более ясная граница или разнесённые вклады, прежде чем устойчивый световой узор сможет подтвердить совместную работу наблюдателей, сохраняющих независимость.\n\nНАЗНАЧЕНА ПРОВЕРКА: Переставить станции\nЗаказать новое расположение с отдельной проверкой связей. Перенос крайних станций внутрь требует больших расходов мастерской, зато быстрее убирает известную помеху; уже защищённая группа получит меньше преимуществ и может наладить согласование более длительными репетициями."
 HSM_BAR_mtk_chorus_experiment_report_b_1:0 "УСТАНОВКА: Внутри съёмки. Кристальные образцы.\n\nВнутри обследованной комнаты отдельные станции ненадолго удерживают общий контур, но перекрывающиеся предложения затрудняют различение индивидуальных вкладов. Участники объясняют указания с кристальным образцом, но стареющий след вносит форму, отсутствующую на его бумажном оригинале. Группе нужна более ясная граница или разнесённые вклады, прежде чем устойчивый световой узор сможет подтвердить совместную работу наблюдателей, сохраняющих независимость.\n\nДополнение к журналу испытаний\nРазнесённые внутренние вклады удержали рисунок, пока каждый участник отдельно показывал возможность собственного выхода из обмена. Бумажные оригиналы исправили дрейф кристальных образцов без признания временного воспроизведения окончательным доказательством правильности рисунка. Принятый Хор остаётся местным. Атлас полей даёт границу, Общие чувства ограничивают обмен, провал Лекции во сне требует понимания, Память кристалла даёт неточные образцы, Нотация чар проверяет вклады. Усталость и дальность сохраняют пределы; никто не объединяет разумы и не получает чужой полный опыт."
 HSM_BAR_mtk_chorus_verification_b_1:0 "Внутри обследованной комнаты отдельные станции ненадолго удерживают общий контур, но перекрывающиеся предложения затрудняют различение индивидуальных вкладов. Участники объясняют указания с кристальным образцом, но стареющий след вносит форму, отсутствующую на его бумажном оригинале. Группе нужна более ясная граница или разнесённые вклады, прежде чем устойчивый световой узор сможет подтвердить совместную работу наблюдателей, сохраняющих независимость.\n\nНАЗНАЧЕНА ПРОВЕРКА: Разнести вклады\nПродлить репетиции наяву, вводя каждый предложенный контур по записанному порядку. Это экономит переделку защищённых станций, но дольше занимает кафедру возле помех; паузы и бумажные сравнения придётся повторять при потере опоры у крайнего вклада."
 HSM_BAR_mtk_chorus_observation_2:0 "У края мастерской общий контур колеблется возле отметки помех атласа, тогда как внутренние станции остаются заметно устойчивее. Участники объясняют бумажные указания, однако одновременное начало скрывает, чей знак остановки следует проверять в первую очередь. Группе нужна более ясная граница или разнесённые вклады, прежде чем устойчивый световой узор сможет подтвердить совместную работу наблюдателей, сохраняющих независимость."
 HSM_BAR_mtk_chorus_experiment_report_a_2:0 "УСТАНОВКА: У края мастерской. Бумажные вклады.\n\nУ края мастерской общий контур колеблется возле отметки помех атласа, тогда как внутренние станции остаются заметно устойчивее. Участники объясняют бумажные указания, однако одновременное начало скрывает, чей знак остановки следует проверять в первую очередь. Группе нужна более ясная граница или разнесённые вклады, прежде чем устойчивый световой узор сможет подтвердить совместную работу наблюдателей, сохраняющих независимость.\n\nДополнение к журналу испытаний\nПеренос крайних станций внутрь обследованной границы устранил вклад помехи, приходившей из расположенной рядом мастерской. Объяснения наяву и раздельные бумажные листы позволили отличить понимание задачи от простого приёма сигнала. Местный Хор успешен при независимых остановках. Атлас полей задаёт границы; Общие чувства допускают неподвижные контуры; провал Лекции во сне требует понимания наяву; Память кристалла нуждается в бумаге; Нотация чар делает вклады читаемыми. Тесный обмен утомляет; отсутствующие разумы и объединённое сознание недоступны."
