l_russian:
 HSM_VER_ID_eligible_tt:0 "Страна независима, не капитулировала и находится под властью своего герцога либо законных соправителей Розалин и Монтага."
 HSM_VER_ID_ERI_language_question:0 "Язык школьного класса"
 HSM_VER_ID_ERI_language_question_desc:0 "Школьный инспектор приносит ко двору три тетради: сочинение на аквилейском, арифметику на грифонском и местную песню, записанную со слов исполнителя. Всё это принадлежит Эри. Языковой спор в Авиане показывает, к чему приводит попытка принять речь двора за язык образования всей страны. Сначала наши учителя должны выяснить, сколько детей не понимают их уроков."
 HSM_VER_ID_ERI_aquileian_classrooms:0 "Аквилейская школьная программа"
 HSM_VER_ID_ERI_aquileian_classrooms_desc:0 "Аквилейское наследие Эри не ограничивается придворными манерами. Доступные буквари и единая письменная норма свяжут деревенские уроки с богатой научной и исторической литературой. Правительство оплатит подготовку учителей на аквилейском языке, сохранив место для местной речи в классе. Культурное родство определит направление обучения, а управление школами останется делом Эри."
 HSM_VER_ID_ERI_two_living_languages:0 "Два живых языка"
 HSM_VER_ID_ERI_two_living_languages_desc:0 "Ребёнку из аквилеязычной семьи незачем забывать родную речь ради изучения грифонского, а грифоноязычным детям должно быть открыто участие в общественной жизни Эри. Параллельные учебники и учителя, владеющие обоими языками, сделают первые уроки понятными, а второй язык доступным. Дополнительные расходы позволят большему числу семей доверять школе."
 HSM_VER_ID_ERI_translated_journals:0 "Журналы за пределами двора"
 HSM_VER_ID_ERI_translated_journals_desc:0 "Аквилейские научные журналы слишком часто заканчивают свой путь на полке у аристократа. Государственное бюро переводов оформит подписки, объяснит незнакомые термины и разошлёт полезные статьи техническим училищам. Теория радиосвязи и электрические измерения станут предметами самостоятельного исследования наших студентов, а не чудесами из рассказов о далёких академиях."
 HSM_VER_ID_ERI_district_teacher_colleges:0 "Окружные учительские училища"
 HSM_VER_ID_ERI_district_teacher_colleges_desc:0 "Две версии учебника не заменят учителя, понимающего обе. Окружные училища подготовят преподавателей, способных объяснять арифметику, механику и опыты с электричеством на разных языках. Стипендии для выходцев из деревень помогут распространить новые методы, а единые экзамены позволят ученику продолжить образование за пределами родного округа."
 HSM_VER_ID_ERI_local_histories:0 "Место для местной истории"
 HSM_VER_ID_ERI_local_histories_desc:0 "Школьная норма не должна определять язык каждого рассказа. Городские библиотеки начнут собирать песни, семейные записи и свидетельства на тех наречиях, на которых они сохранились, размещая рядом переводы. Когда жители увидят историю своей деревни на общедоступной полке, культурное соглашение станет делом, в котором они сами приняли участие."
 HSM_VER_ID_ERI_public_scholarships:0 "Общественный стипендиальный фонд"
 HSM_VER_ID_ERI_public_scholarships_desc:0 "Способному ученику не нужны родственники при дворе, чтобы попасть в лабораторию. Постоянный фонд будет назначать стипендии по результатам открытых экзаменов и обяжет получателей преподавать или работать в государственных учреждениях. Культурный выбор Эри оставит прочное наследие: подготовленных учителей, доступные знания и исследователей, служащих своей стране."
 HSM_VER_ID_EYR_language_question:0 "Язык общественной службы"
 HSM_VER_ID_EYR_language_question_desc:0 "Канцелярия получает прошение от приходского учителя: его ученики заучивают имперский учебник, но не могут объяснить прочитанное своими словами. В учреждениях Эйри с той же трудностью сталкиваются новобранцы и писцы. Языковой спор Авиана касается и нас: дому предстоит решить, как превратить герцландское наследие в образование, доступное всему населению."
 HSM_VER_ID_EYR_herzland_classrooms:0 "Герцландская школьная традиция"
 HSM_VER_ID_EYR_herzland_classrooms_desc:0 "Имперская письменная традиция открывает Эйри доступ к трудам многих поколений учёных. Грифонская программа, современные буквари и подготовленные учителя свяжут приходские школы с этим наследием. Правительство поддержит интеллектуальную традицию Герцланда через самостоятельную систему образования, обеспечив понятные объяснения там, где дома по-прежнему говорят на местном наречии."
 HSM_VER_ID_EYR_two_living_languages:0 "Два живых языка"
 HSM_VER_ID_EYR_two_living_languages_desc:0 "Грифоноязычные учреждения Эйри могут принять аквилеязычных соседей, сохранив собственное наследие. Двуязычные учебники и равный доступ к государственным экзаменам укрепят доверие семей к школе. Учителя начнут с языка, знакомого ребёнку, и обучат второму как дополнительному навыку, объединяя жителей многоязычного пограничья общей общественной жизнью."
 HSM_VER_ID_EYR_technical_lexicon:0 "Единый технический словарь"
 HSM_VER_ID_EYR_technical_lexicon_desc:0 "От мастерского руководства мало пользы, если каждый наставник по-своему называет одну и ту же деталь. Инженеры и учителя подготовят грифонские справочники по технической литературе Герцланда, включив в указатели привычные местные названия. Единые определения и проверенные примеры помогут мастерским Эйри применять школьные знания в производстве."
 HSM_VER_ID_EYR_interpreters_college:0 "Училище переводчиков"
 HSM_VER_ID_EYR_interpreters_college_desc:0 "Нашему двуязычному порядку нужны специалисты, умеющие точно передавать смысл между языками. Новое училище подготовит учителей, технических переводчиков и переводчиков для государственных учреждений, используя практические занятия с машинами и приборами. Выпускники сделают промышленные руководства и исследования электричества доступными по обе стороны языковой границы, начиная со школ самого Эйри."
 HSM_VER_ID_EYR_parish_archives:0 "Открыть приходские архивы"
 HSM_VER_ID_EYR_parish_archives_desc:0 "Реестры и летописи рассказывают более полную историю, чем официальные труды канцелярии. Приходские архивы получат средства на сохранение документов, открытые каталоги и переводы записей, которые уже непонятны молодым читателям. Доступность этих свидетельств поможет жителям Эйри увидеть место своих общин в культурном устройстве страны."
 HSM_VER_ID_EYR_civic_fellowships:0 "Стипендии для общественной службы"
 HSM_VER_ID_EYR_civic_fellowships_desc:0 "Правительство учредит стипендии для талантливых учеников из всех округов, назначаемые по итогам открытых экзаменов. Получатели вернутся учителями, исследователями и подготовленными государственными служащими. Учились ли они по герцландской программе или по двуязычному букварю, их объединит обязанность сделать знания полезными стране, оплатившей их образование."
 HSM_VER_ID_aquileian_curriculum:0 "Аквилейская учёная традиция"
 HSM_VER_ID_aquileian_curriculum_desc:0 "Школы Эри используют аквилейскую письменную норму, связывающую начальное обучение с научной литературой. Подготовка учителей и доступные книги дают местным ученикам прочную основу для дальнейшей учёбы."
 HSM_VER_ID_herzland_curriculum:0 "Герцландская учёная традиция"
 HSM_VER_ID_herzland_curriculum_desc:0 "Грифонская программа Эйри опирается на научное наследие Герцланда. Понятные учебники и подготовленные преподаватели открывают путь от приходской школы к техническому и научному образованию."
 HSM_VER_ID_bilingual_curriculum:0 "Двуязычное народное образование"
 HSM_VER_ID_bilingual_curriculum_desc:0 "Аквилейский и грифонский языки занимают своё место в народном образовании. Подготовка двуязычных учителей требует средств, но укрепляет доверие семей к школам и открывает большему числу учеников путь к дальнейшей учёбе."
 HSM_VER_ID_public_endowment:0 "Государственный стипендиальный фонд"
 HSM_VER_ID_public_endowment_desc:0 "Стипендии по результатам открытых экзаменов обеспечивают постоянную подготовку учителей, исследователей и государственных служащих. Обязанность работать в общественных учреждениях превращает образовательные возможности в устойчивое развитие страны."
