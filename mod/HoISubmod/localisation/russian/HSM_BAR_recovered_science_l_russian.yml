 HSM_BAR_recovered_science_access_tt:0 "Служба создана, а уцелевшие архивы Пентархии изучены."
 HSM_BAR_recovered_science_unlocked_tt:0 "Вновь доступны исследования из исходного дерева Баррада: алхимия, военная теория, материаловедение и описанные Виирой диковины. Технологии по-прежнему требуют обычного исследования и предшествующих технологий; взаимоисключающие направления сохраняются. Архивы не воскрешают пентархов и не открывают их личные способности и особые тела."
