l_russian:
 HSM_BAR_anomalies:0 "Тайный реестр дел"
 HSM_BAR_anomalies_desc:0 "Сеть управляет кабинетом Баррада через подставные организации, без ведома правительства. В её делах разделены свидетельства, текущее хранение и непроверенные версии. Полевые группы действуют под гражданским прикрытием, оберегают жителей и учитывают нынешнего хранителя."
 HSM_BAR_case_local_survey:0 "Обследовать уцелевшие объекты Баррада"
 HSM_BAR_case_local_survey_desc:0 "Под видом обычных проверок опросить жителей и сопоставить документы Пентархии с уцелевшими объектами. Открыть пять местных дел, сохранив сеть в тайне от правительства."
 HSM_BAR_case_rock_investigate:0 "Расследование: Живой камень"
 HSM_BAR_case_rock_investigate_desc:0 "Отобрать образцы обнажённой породы, не расширяя храм Асинти. Зафиксировать реакции и установить безопасную границу для рабочих."
 HSM_BAR_case_rock_protect:0 "Охранять выход живого камня"
 HSM_BAR_case_rock_restrict:0 "Закрыть раскопки"
 HSM_BAR_case_rock_protect_desc:0 "На границе участка будут дежурить наблюдатели. Ольха получит время проверить опоры, а жители смогут чинить колодцы за отмеченной линией. Ни одного нового прохода без подписи Марты."
 HSM_BAR_case_rock_restrict_desc:0 "Врона закроет подходы и выведет рабочих из нижних выработок. Кшемень сохранит безопасно отобранные образцы; приказ не требует ещё раз спускаться за оставленным инструментом."
 HSM_BAR_case_rock_protect_tt:0 "$HSM_BAR_outcome_rock_protect_tt$"
 HSM_BAR_case_rock_restrict_tt:0 "$HSM_BAR_outcome_rock_restrict_tt$"
 HSM_BAR_case_titan_investigate:0 "Расследование: Погребённый Титан"
 HSM_BAR_case_titan_investigate_desc:0 "На старых планах Леопольда расходятся размеры одной и той же камеры. Группа проверит уцелевшие выработки и сопоставит отметки с чертежами. Ольха просит не подавать питание ни на один найденный контакт."
 HSM_BAR_case_titan_protect:0 "Охранять место Титана"
 HSM_BAR_case_titan_restrict:0 "Запечатать выработки Титана"
 HSM_BAR_case_titan_protect_desc:0 "Смотрители останутся у раскопок. Записи о нагрузке передадут мастерским, но сами выработки не станут источником дешёвого металла. На дежурстве будут проверять не только замки, но и положение старых отметок."
 HSM_BAR_case_titan_restrict_desc:0 "Последнюю опись составят снаружи. После установки заграждений нижние выработки останутся без смены; за ними будут следить с верхнего поста. Врона вычеркнула предложение снять крепления перед уходом."
 HSM_BAR_case_titan_protect_tt:0 "$HSM_BAR_outcome_titan_protect_tt$"
 HSM_BAR_case_titan_restrict_tt:0 "$HSM_BAR_outcome_titan_restrict_tt$"
 HSM_BAR_case_entity_investigate:0 "Расследование: Подземное сознание"
 HSM_BAR_case_entity_investigate_desc:0 "Расставить приёмники на разной глубине и записать ответы раздельно. Дежурным выдадут разные вопросы. Марта не разрешает заранее показывать им стенограмму предыдущей смены."
 HSM_BAR_case_entity_protect:0 "Создать защищённую зону контакта"
 HSM_BAR_case_entity_restrict:0 "Закрыть нижние проходы"
 HSM_BAR_case_entity_protect_desc:0 "Марта согласилась на наблюдение, но отказалась назначать бессменного слушателя. Каждый контакт будут сопровождать независимый свидетель и готовая команда подъёма. Запрещено обещать ответившему то, чего Служба не вправе дать."
 HSM_BAR_case_entity_restrict_desc:0 "Нижние проходы перекроют, а пост перенесут выше. Слуховые трубы оставят разомкнутыми. Ольха просит не отмечать дело как завершённое только потому, что теперь ответов не слышно."
 HSM_BAR_case_entity_protect_tt:0 "$HSM_BAR_outcome_entity_protect_tt$"
 HSM_BAR_case_entity_restrict_tt:0 "$HSM_BAR_outcome_entity_restrict_tt$"
 HSM_BAR_case_amulet_investigate:0 "Расследование: Защитный амулет Яношика"
 HSM_BAR_case_amulet_investigate_desc:0 "Собрать свидетельства жителей и сохранившиеся записи об амулете хранителя. Сопоставить описанную защитную границу с обследованием местности, не отнимая у поселений их защиту."
 HSM_BAR_case_amulet_protect:0 "Оставить амулет у хранителя"
 HSM_BAR_case_amulet_restrict:0 "Установить надзор за амулетом"
 HSM_BAR_case_amulet_protect_desc:0 "Марта предлагает хранителям обмен наблюдениями, не ставя помощь в зависимость от передачи амулета. У межевых знаков появятся мерные вехи. Их можно снять по просьбе жителей; саму границу трогать запрещено."
 HSM_BAR_case_amulet_restrict_desc:0 "Прекратить испытания на границе поселения. Уже полученные измерения останутся в лаборатории, но новые проверки перенесут на отдельную площадку. Марта требует письменно подтвердить, что приказ не касается защиты жителей."
 HSM_BAR_case_amulet_protect_tt:0 "$HSM_BAR_outcome_amulet_protect_tt$"
 HSM_BAR_case_amulet_restrict_tt:0 "$HSM_BAR_outcome_amulet_restrict_tt$"
 HSM_BAR_case_plants_investigate:0 "Расследование: Растительность Баррада"
 HSM_BAR_case_plants_investigate_desc:0 "Кшемень просит привезти не самые странные растения, а образцы по обе стороны границы заброшенного поля. Врона опросит жителей отдельно. На мешках отметят место сбора и время появления первых симптомов."
 HSM_BAR_case_plants_protect:0 "Защитить поселения линиями оберегов"
 HSM_BAR_case_plants_restrict:0 "Ограничить доступ к опасным рощам"
 HSM_BAR_case_plants_protect_desc:0 "Охранные полосы пройдут между жильём и опасными зарослями. За пределами полос останутся отмеченные участки наблюдения. Марта не разрешает выжигать растения, на которые у жителей нет жалоб и для которых лаборатория не установила опасности."
 HSM_BAR_case_plants_restrict_desc:0 "Закрыть отмеченные участки для выпаса и сбора. Семьи получат новые маршруты к воде; костры у границы запретят до проверки дыма. Врона оставит наблюдателей: ограда не объясняет того, что растёт за ней."
 HSM_BAR_case_plants_protect_tt:0 "$HSM_BAR_outcome_plants_protect_tt$"
 HSM_BAR_case_plants_restrict_tt:0 "$HSM_BAR_outcome_plants_restrict_tt$"
 HSM_BAR_case_recon_expedition:0 "Собрать сведения в [FROM.GetName]"
 HSM_BAR_case_recon_expedition_desc:0 "Незаметно проверить существующую зацепку на территории под контролем [FROM.GetName]. В реестр попадут лишь дела с текущими свидетельствами. Новые данные могут стать основанием для повторного визита."
 HSM_BAR_case_archive_expedition:0 "Изучить архивы в [FROM.GetName]"
 HSM_BAR_case_archive_expedition_desc:0 "Изучить сохранившиеся материалы и установить ход событий. Неясная судьба умерших допускает лишь документальные исследования."
 HSM_BAR_case_relic_expedition:0 "Изъять установленные реликвии из [FROM.GetName]"
 HSM_BAR_case_relic_expedition_desc:0 "Тайно перевезти установленные артефакты с подтверждённым местонахождением в скрытое хранилище. Носимые короны и живые правители исключены. Следы, указывающие на Баррад, ухудшат отношения с нынешним хранителем; их сокрытие потребует ещё 20 политической власти."
 HSM_BAR_case_remains_expedition:0 "Изъять подтверждённые останки из [FROM.GetName]"
 HSM_BAR_case_remains_expedition_desc:0 "Изъять только физически подтверждённые кости Гровера II до воскрешения. Следы, указывающие на Баррад, ухудшат отношения с нынешним хранителем; их сокрытие потребует ещё 20 политической власти."
 HSM_BAR_case_chalice_investigate:0 "Установить местонахождение: Чаша Крови"
 HSM_BAR_case_chalice_investigate_desc:0 "Экспедиция обнаружила древнюю чашу. Проследить её доставку в Мейджхолд и отличить этот артефакт от филактерия Розы."
 HSM_BAR_case_chalice_investigated_tt:0 "Экспедиция обнаружила древнюю чашу. Проследить её доставку в Мейджхолд и отличить этот артефакт от филактерия Розы."
 HSM_BAR_case_chalice_secure_local:0 "Принять под охрану: Чаша Крови"
 HSM_BAR_case_chalice_secure_local_desc:0 "Полевой отряд перевозит подтверждённый артефакт с контролируемой нами территории в скрытое хранилище в столице Баррада. Прежние превращения не отменяются."
 HSM_BAR_case_chalice_seal:0 "Запечатать для изучения: Чаша Крови"
 HSM_BAR_case_chalice_seal_desc:0 "Чаша запечатана для контролируемого изучения. Её изоляция не отменяет уже произошедшее превращение Розы."
 HSM_BAR_case_chalice_seal_tt:0 "$HSM_BAR_outcome_chalice_sealed_tt$"
 HSM_BAR_case_phylactery_investigate:0 "Установить местонахождение: Филактерий Розы"
 HSM_BAR_case_phylactery_investigate_desc:0 "Сопоставить сведения о ритуале лича и разыскать тайник в Мейджхолде по изъятым документам. Эта криминалистическая зацепка является расследованием сети, а не утверждением, что сосуд существовал до изготовления."
 HSM_BAR_case_phylactery_investigated_tt:0 "Сопоставить сведения о ритуале лича и разыскать тайник в Мейджхолде по изъятым документам. Эта криминалистическая зацепка является расследованием сети, а не утверждением, что сосуд существовал до изготовления."
 HSM_BAR_case_phylactery_secure_local:0 "Принять под охрану: Филактерий Розы"
 HSM_BAR_case_phylactery_secure_local_desc:0 "Полевой отряд перевозит подтверждённый артефакт с контролируемой нами территории в скрытое хранилище в столице Баррада. Прежние превращения не отменяются."
 HSM_BAR_case_phylactery_seal:0 "Запечатать для изучения: Филактерий Розы"
 HSM_BAR_case_phylactery_seal_desc:0 "Скрытый сосуд души изолирован. У сети нет проверенного способа безопасно уничтожить его; запечатывание не объявляется убийством Розы."
 HSM_BAR_case_phylactery_seal_tt:0 "$HSM_BAR_outcome_phylactery_sealed_tt$"
 HSM_BAR_case_darkheart_investigate:0 "Установить местонахождение: Темное Сердце"
 HSM_BAR_case_darkheart_investigate_desc:0 "Проследить выращивание умбрум-кристалла и ритуал возвращения. Политическое восстановление без подтверждения сохранности артефакта оставляет лишь архивную зацепку."
 HSM_BAR_case_darkheart_investigated_tt:0 "Проследить выращивание умбрум-кристалла и ритуал возвращения. Политическое восстановление без подтверждения сохранности артефакта оставляет лишь архивную зацепку."
 HSM_BAR_case_darkheart_secure_local:0 "Принять под охрану: Темное Сердце"
 HSM_BAR_case_darkheart_secure_local_desc:0 "Полевой отряд перевозит подтверждённый артефакт с контролируемой нами территории в скрытое хранилище в столице Баррада. Прежние превращения не отменяются."
 HSM_BAR_case_darkheart_seal:0 "Запечатать для изучения: Темное Сердце"
 HSM_BAR_case_darkheart_seal_desc:0 "Темное Сердце запечатано. Кристальное Сердце остаётся на месте; историческая личность Сомбры и его возвращённое тело не считаются взаимозаменяемыми артефактами."
 HSM_BAR_case_darkheart_seal_tt:0 "$HSM_BAR_outcome_darkheart_sealed_tt$"
 HSM_BAR_case_rosa_review:0 "Пересмотреть досье: Роза Маледикта"
 HSM_BAR_case_rosa_review_desc:0 "Заказать проверенную сводку дела. Первый завершённый пересмотр заменит предварительную исследовательскую политику окончательным вкладом досье. Последующие пересмотры открывают отчёт без новой награды."
 HSM_BAR_case_grover_review:0 "Пересмотреть досье: Гровер II"
 HSM_BAR_case_grover_review_desc:0 "Заказать проверенную сводку дела. Первый завершённый пересмотр заменит предварительную исследовательскую политику окончательным вкладом досье. Последующие пересмотры открывают отчёт без новой награды."
 HSM_BAR_case_herald_review:0 "Пересмотреть досье: Провозвестник Борея"
 HSM_BAR_case_herald_review_desc:0 "Заказать проверенную сводку дела. Первый завершённый пересмотр заменит предварительную исследовательскую политику окончательным вкладом досье. Последующие пересмотры открывают отчёт без новой награды."
 HSM_BAR_case_sombra_review:0 "Пересмотреть досье: Сомбра"
 HSM_BAR_case_sombra_review_desc:0 "Заказать проверенную сводку дела. Первый завершённый пересмотр заменит предварительную исследовательскую политику окончательным вкладом досье. Последующие пересмотры открывают отчёт без новой награды."
 HSM_BAR_case_crown_review:0 "Проверить ведомость хранения Корон"
 HSM_BAR_case_crown_review_desc:0 "Каждая страна, обнаружившая корону, имеет отдельный экземпляр в реестре. Ведомость раздельно учитывает известные музейные, запечатанные, носимые и потерянные экземпляры."
 HSM_BAR_case_crown_secure_local:0 "Принять под охрану установленные местные Короны"
 HSM_BAR_case_crown_secure_local_desc:0 "Перевезти изученные музейные или запечатанные короны с контролируемой территории. Корона, которую носит лидер, исключена; её носитель не является целью изъятия."
 HSM_BAR_case_grover_secure_local:0 "Принять под охрану подтверждённые кости Гровера II"
 HSM_BAR_case_grover_secure_local_desc:0 "Опись Гамии подтверждает наличие костей до успеха «Ауферштеунг». Изъятие не позволит назначенному эксперименту использовать их. Воскрешение не проводится."
 HSM_BAR_case_grover_inter:0 "Захоронить изъятые кости после изучения"
 HSM_BAR_case_grover_inter_desc:0 "Завершить криминалистическое описание без повреждения костей и поместить их в охраняемую усыпальницу. Уважение к умершим не требует повторения «Ауферштеунг»."
 HSM_BAR_case_grover_interred_tt:0 "Кости описаны и захоронены. Они недоступны для воскрешения."
 HSM_BAR_case_occupied_archives:0 "Проверить архивы на контролируемой территории"
 HSM_BAR_case_occupied_archives_desc:0 "Изучить местные документы о Коронах и уцелевшие архивы Гамии, Йеля, Мейджхолда либо Кристального города. Документы подтверждают историю, но не наличие пригодного для изъятия тела."
 HSM_BAR_case_expired_tt:0 "Цель больше не удовлетворяет условиям достоверности или доступа. Артефакт, тело, исследовательская награда и дипломатический инцидент не засчитываются."
 HSM_BAR_case_survey_tt:0 "Зафиксировать текущие подтверждённые зацепки на территории цели. Сведения не передают предметы во владение; позднейшие открытия требуют новых свидетельств."
 HSM_BAR_case_archives_tt:0 "Материалы дел изучены. Это даёт сведения, но не передаёт артефакт или личность во владение."
 HSM_BAR_case_incident_tt:0 "Следы хищения ухудшают отношения нынешнего хранителя с Баррадом. Потратить 20 политической власти на сокрытие следов через посредников; правительство Баррада не узнаёт о сети."
 HSM_BAR_case_relic_tt:0 "Установленные реликвии перевезены в охраняемое хранилище в нашей столице. Дальнейший доступ требует фактического контроля над этим местом."
 HSM_BAR_case_remains_tt:0 "Подтверждённые кости изъяты. Живой правитель не похищен; назначенный эксперимент «Ауферштеунг» больше не сможет использовать эти кости."
 HSM_BAR_case_bones_missing_tt:0 "Кости вывезены из Гамии. Эксперимент не может состояться."
 HSM_BAR_case_sealed_research:0 "Изучение реликвии под охраной"
 hsm_bar_anomaly.bones_missing:0 "Плита пуста."
 hsm_bar_anomaly.file_report:0 "Внести результаты в материалы дела."
 hsm_bar_anomaly.3.t:0 "Необъяснимое исчезновение"
 hsm_bar_anomaly.3.d:0 "Наши хранители сообщают об исчезновении установленных реликвий либо исторических останков с подконтрольного нам объекта. Транспортные документы ведут к посредникам из Баррада, но организаторы остаются неизвестными. Наши чиновники не доверяют опровержениям Баррада; его правительство, похоже, само не может объяснить перевозки. Живой правитель не был похищен."
 hsm_bar_anomaly.3.a:0 "Проследить за посредниками."
 hsm_bar_anomaly.10.t:0 "Что осталось после Пентархии"
 hsm_bar_anomaly.10.d:0 "Первое полевое обследование открыло дела о живом камне, раскопках Титана, подземном сознании, амулете Яношика и местной растительности. Это зацепки для расследования. Сохранившееся место не доказывает завершение реактора, целостность разобранного конструкта или возвращение погибшего Пентарха."
 hsm_bar_anomaly.11.t:0 "Камень, который уже был живым"
 hsm_bar_anomaly.11.d:0 "Обнажённая порода реагирует ещё до начала новых работ. Старые строители обнаружили её, а не создали. Малые образцы и документы раскопок позволяют установить охраняемую границу исследований. Связи с растительностью и подземным разумом остаются проверяемыми гипотезами."
 hsm_bar_anomaly.12.t:0 "Опись Титана"
 hsm_bar_anomaly.12.d:0 "Документы и обследование указывают на древний погребённый конструкт. Подтверждённой разборки не зафиксировано. Сеть размечает выработки и запрещает активацию при обследовании. Охрана или запечатывание места не создаёт второго Титана и не дарует Леопольду новое тело."
 hsm_bar_anomaly.12.spent:0 "Документы подтверждают поражение или разборку Титана. Дело касается места и уцелевших сведений; материал, уже использованный мастерскими или телом Леопольда, нельзя изъять повторно. Обследование не восстанавливает конструкт."
 hsm_bar_anomaly.13.t:0 "Голоса под Баррадом"
 hsm_bar_anomaly.13.d:0 "Подземные отклики предшествуют сети. Опросы и измерения указывают на составное сознание, а не на устройство наших исследователей. Действующего реактора на месте нет. Можно создать защищённую зону контакта либо закрыть проход, не строя реактор."
 hsm_bar_anomaly.13.reactor:0 "На месте существует здание реактора, однако история сознания древнее. Инженеры описывают установку отдельно от сущности. Эта находка не создаёт реактор и не доказывает, что все поздние опыты Пентархов состоялись."
 hsm_bar_anomaly.14.t:0 "Амулет хранителя"
 hsm_bar_anomaly.14.d:0 "Амулет Яношика известен с давних пор. Свидетельства жителей и сохранившиеся наблюдения описывают защиту от местной растительности. Отчёт фиксирует защитную границу, а не передачу амулета Службе. Утверждения, будто он отпугивает всё созданное местным богом, остаются недоказанными. Дальнейшая работа должна сохранять доступ жителей к защите и различать архивные записи и фактическое владение."
 hsm_bar_anomaly.15.t:0 "Растительность и свидетельства"
 hsm_bar_anomaly.15.d:0 "Группа нанесла подозрительную растительность на карту и проверила меры предосторожности. Независимого подтверждения нападения нет. Поэтому дело касается наблюдения и защиты поселений; авторы отчёта отказываются выдавать непроверенные рассказы за установленное нашествие."
 hsm_bar_anomaly.15.manifested:0 "Сохранившиеся свидетельства подтверждают нападение и защитное применение амулета. Они не устанавливают момент оживления всех растений Баррада. Жителям нужны обереги и правила доступа; досье не объявляет всю магическую растительность враждебной."
 hsm_bar_anomaly.20.t:0 "Разные свидетельства о Розе"
 hsm_bar_anomaly.20.d:0 "Ранняя деятельность Розы как некромантки подтверждена. В этом деле не подтверждено завершённое превращение в лича или вампира. Её должность, военное поражение и исчезновение Лиги Ужаса не заменяют физических доказательств смерти. Архивное исследование возможно, изъятие тела — нет."
 hsm_bar_anomaly.20.lich:0 "Запись ритуала подтверждает форму лича и изготовление скрытого филактерия. Это не Чаша Крови. Изменённая правительница остаётся личностью; ни отстранение от власти, ни изъятие сосуда не подтверждают обычного трупа или её уничтожения."
 hsm_bar_anomaly.20.vampire:0 "Документы подтверждают превращение Розы в вампира. Это не подтверждает одновременно форму лича и изготовленный филактерий. Сеть может изучать архивы и отдельно установленные реликвии. Правящую личность нельзя объявить перевозимыми останками."
 hsm_bar_anomaly.20.dead:0 "Имеющиеся свидетельства сообщают о казни в Мейджхолде либо окончательном покое Розы. Они не подтверждают сохранного тела, пригодного для изъятия, особенно после превращения в лича. Дело классифицировано как документальное свидетельство. Ни эти сообщения, ни капитуляция Лиги Ужаса не устанавливают местонахождение доступных останков."
 hsm_bar_anomaly.21.t:0 "Гровер II: кости, возвращение и отставка"
 hsm_bar_anomaly.21.d:0 "Первая смерть императора относится к историческому прошлому. Его давняя смерть не доказывает, что Йель сейчас располагает доступными костями. Дело остаётся архивным до документального подтверждения изъятия. Гровер VI — другая личность."
 hsm_bar_anomaly.21.bones:0 "Экспедиция Гамии физически доставила кости Гровера II из Грифонстоуна. Опись прямо подтверждает наличие доступных останков в Гамии. Эта возможность исчезает после успеха «Ауферштеунг». Отряд, прибывший после воскрешения, обязан вернуться с пустыми руками."
 hsm_bar_anomaly.21.returned:0 "«Ауферштеунг» завершился успехом: древние кости стали вернувшимся Гровером II. Доритуальная опись останков закрыта. Сеть может изучать документы и публичные действия, но не похищать правителя и не превращать последующее поражение в неподтверждённый труп."
 hsm_bar_anomaly.21.retired:0 "Свидетельство описывает, как Гровер II входит в горную резиденцию с жилыми помещениями и обещает оставаться доступным потомку. Его отставка не является смертью. Ни отставка, ни саркофаг не подтверждают доступных останков."
 hsm_bar_anomaly.21.secured:0 "Подтверждённые кости вывезены до эксперимента по воскрешению. Теперь они имеют запись о физическом хранении; доступ зависит от контроля над хранилищем. Сеть не воскресил Гровера II и не заполучил живого императора."
 hsm_bar_anomaly.22.t:0 "Провозвестник и пустой престол"
 hsm_bar_anomaly.22.d:0 "Теории «Вайэ» и связанные с ними религиозные утверждения доступны для изучения, однако завершённое превращение в Провозвестника не подтверждено. Открытие досье не создаёт воплощение."
 hsm_bar_anomaly.22.transformed:0 "Инцидент в хранилище связывает изменённого грифона с жидкостью «Вайэ» и фиксирует необычное свечение и движения. Это подтверждает превращение, но не божественную природу. Допустима документальная оценка; правящего Провозвестника нельзя похищать."
 hsm_bar_anomaly.22.vanished:0 "Свидетели описывают, как Провозвестник побледнел и исчез во вспышке на коронации Гровера VI. Тело в этом рассказе не остаётся. Изъятие недоступно; свидетельства коронации сохраняются для архивного исследования."
 hsm_bar_anomaly.23.t:0 "Сомбра по обе стороны завесы"
 hsm_bar_anomaly.23.d:0 "Прежняя история Сомбры известна, но новое возвращение не подтверждено. Лимб не является складом с доступным телом, а план Темного Сердца не является готовым артефактом."
 hsm_bar_anomaly.23.returned:0 "Независимые свидетельства подтверждают телесное возвращение Сомбры. Его нынешняя должность проверяется отдельно от прошлого превращения. Ни поражение, ни потеря власти не доказывают наличия доступных останков. Для Темного Сердца нужны отдельные свидетельства создания и хранения."
 hsm_bar_anomaly.23.removed:0 "Восстановление власти устранило Сомбру с политических и военных постов. Оно не подтвердило тело, пригодное для изъятия; изгнание или неясная судьба его не предоставляют. Темное Сердце без подтверждённого хранения также считается потерянным. Расследование сохраняет только архивы."
 hsm_bar_anomaly.24.t:0 "Ведомость отдельных Корон"
 hsm_bar_anomaly.24.d:0 "Известных музейных экземпляров: [?HSM_BAR_case_crown_museum_count|0]\nИзвестных запечатанных экземпляров: [?HSM_BAR_case_crown_sealed_count|0]\nИзвестных носимых экземпляров: [?HSM_BAR_case_crown_leader_count|0]\nЭкземпляров с неустановленным местонахождением: [?HSM_BAR_case_crown_missing_count|0]\nИзъятых экземпляров сейчас под нашим контролем: [?HSM_BAR_case_crown_vault_count|0]\n\nКаждая запись относится к собственной цепочке находки. Музейный или запечатанный экземпляр остаётся на учтённом месте при смене власти. Носимая корона исключена из изъятия, а исчезновение носителя не переносит её автоматически в музей."
 hsm_bar_anomaly.2.t:0 "След потерян"
 hsm_bar_anomaly.2.d:0 "Группа не может завершить задание: изменились доступ, свидетельства или объём оставшейся работы. Новое расследование, артефакт, останки, исследовательская награда и инцидент хищения не засчитаны. Сеть прекращает эту попытку и сохраняет прежнее дело."
 hsm_bar_anomaly.16.t:0 "След Чаши"
 hsm_bar_anomaly.16.d:0 "Криминалисты сопоставили опись экспедиции и сведения о хранении Чаши. Дело теперь позволяет подготовить изъятие, когда будут готовы меры сдерживания, завершится её прежнее использование и появится доступ к нынешнему хранителю. Само расследование не переместило Чашу."
 hsm_bar_anomaly.17.t:0 "Сосуд за ритуалом"
 hsm_bar_anomaly.17.d:0 "Документы о завершённом ритуале лича и его тайнике подтверждают зацепку к филактерию Розы. Сеть внесла криминалистическое заключение в дело. Изъятие по-прежнему требует мер сдерживания и доступа к нынешнему хранилищу; сосуд остаётся на месте, судьба Розы не меняется."
 hsm_bar_anomaly.18.t:0 "След хранения Тёмного сердца"
 hsm_bar_anomaly.18.d:0 "Группа проверила документы о создании Тёмного сердца и его установленном местонахождении. Криминалистическое дело завершено. Изъятие требует мер сдерживания, состоявшегося возвращения Сомбры и доступа к нынешнему месту хранения. Кристальное сердце остаётся нетронутым."
 HSM_BAR_case_local_survey_result_tt:0 "Через 14 дней, если доступ к объектам сохранится: открыть пять местных дел и получить отчёт обследования. Станут доступны отдельные расследования."
 HSM_BAR_case_recon_expedition_result_tt:0 "Через 14 дней, если у цели сохранится подтверждённая зацепка: записать текущие сведения и обследовать территорию. Станет доступна оставшаяся работа с подтверждёнными архивными материалами; реликвии не перемещаются."
 HSM_BAR_case_archive_expedition_result_tt:0 "Через 21 день, если свидетельства и доступ сохранятся: изучить подтверждённые документы и экземпляры Корон. Станет доступен обзор дел о личностях; для найденных реликвий может потребоваться отдельное криминалистическое расследование."
 HSM_BAR_case_relic_expedition_result_tt:0 "Через 30 дней, если свидетельства, меры сдерживания и текущее хранение по-прежнему допускают изъятие: перевезти подходящие реликвии в скрытое хранилище в столице Баррада. Отношения нынешнего хранителя с Баррадом ухудшатся; сокрытие следов потребует ещё 20 политической власти."
 HSM_BAR_case_remains_expedition_result_tt:0 "Через 21 день, если подтверждённые кости останутся доступны и воскрешение не состоится: изъять их и исключить использование в «Ауферштеунге». Отношения с нынешним хранителем ухудшатся; сокрытие следов потребует ещё 20 политической власти."
 HSM_BAR_case_rock_investigate_result_tt:0 "Через 21 день, если доступ к объекту сохранится: завершить расследование дела «Живой камень» и получить отчёт. Откроются меры защиты либо ограничения доступа при выполнении требований исследований и доктрины. Артефакты не перемещаются."
 HSM_BAR_case_titan_investigate_result_tt:0 "Через 21 день, если доступ к объекту сохранится: завершить расследование дела «Опись Титана» и получить отчёт. Откроются меры защиты либо ограничения доступа при выполнении требований исследований и доктрины. Артефакты не перемещаются."
 HSM_BAR_case_entity_investigate_result_tt:0 "Через 21 день, если доступ к объекту сохранится: завершить расследование дела «Подземное сознание» и получить отчёт. Откроются меры защиты либо ограничения доступа при выполнении требований исследований и доктрины. Артефакты не перемещаются."
 HSM_BAR_case_amulet_investigate_result_tt:0 "Через 21 день, если доступ к объекту сохранится: завершить расследование дела «Защитный амулет» и получить отчёт. Откроются меры защиты либо ограничения доступа при выполнении требований исследований и доктрины. Артефакты не перемещаются."
 HSM_BAR_case_plants_investigate_result_tt:0 "Через 21 день, если доступ к объекту сохранится: завершить расследование дела «Растительность» и получить отчёт. Откроются меры защиты либо ограничения доступа при выполнении требований исследований и доктрины. Артефакты не перемещаются."
 HSM_BAR_case_chalice_investigate_result_tt:0 "Через 21 день, если документы, криминалистические возможности и установленный артефакт сохранятся: завершить расследование Чаши и получить отчёт. Изъятие станет возможным лишь при выполнении отдельных условий сдерживания, хранения и произошедших событий."
 HSM_BAR_case_phylactery_investigate_result_tt:0 "Через 21 день, если документы, криминалистические возможности и установленный артефакт сохранятся: завершить расследование филактерия и получить отчёт. Изъятие станет возможным лишь при выполнении отдельных условий сдерживания, хранения и произошедших событий."
 HSM_BAR_case_darkheart_investigate_result_tt:0 "Через 21 день, если документы, криминалистические возможности и установленный артефакт сохранятся: завершить расследование Тёмного сердца и получить отчёт. Изъятие станет возможным лишь при выполнении отдельных условий сдерживания, хранения и произошедших событий."
