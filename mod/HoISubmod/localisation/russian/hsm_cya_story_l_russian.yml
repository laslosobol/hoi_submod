 hsm_cya_story.1.t:0 "Экземпляр для просителя"
 hsm_cya_story.1.d:0 "Паромщик не принёс прошения. Он положил на стол графини сложенный экземпляр провинциального соглашения, аккуратно обойдя след от чайной чашки. Всю зиму его лодка перевозила солдат. Теперь начальство склада требовало разобрать её на доски для ремонта.\n\n«Губернатор говорит, соглашение это разрешает».\n\n«Оно разрешает реквизицию», — ответила она.\n\n«И обжалование. Но жаловаться, говорит, надо ему».\n\nГрафиня посмотрела на собственную подпись. Обещать законное управление было легко, пока все за столом хотели окончания войны. Паромщик приехал узнать, что стоит за этим обещанием. За его спиной секретарь ждал ответа на тот же вопрос."
 hsm_cya_story.1.a:0 "Это обещание связывает и мою казну."
 hsm_cya_story.1.b:0 "Пересмотреть реквизицию, но сохранить свободу бюджета короны."
 hsm_cya_story.2.t:0 "Переправа"
 hsm_cya_story.2.settled.d:0 "С провинциальной почтой доставили маленькую деревянную лодку. Дочь паромщика вырезала её, пока отец чинил настоящее судно. Его жалобу удовлетворили ещё до пересмотра бюджета отстройки.\n\nГрафиня поставила модель рядом с новым соглашением. Провинции приняли иное распределение средств, но не согласились просто забыть её прежнюю подпись. Добиться их согласия оказалось труднее, чем издать приказ.\n\n«Лодку оставьте», — сказала она писцу, убиравшему стол.\n\nПусть напоминает, что изменить договорённость и сделать вид, будто её никогда не было, — не одно и то же."
 hsm_cya_story.2.bound.d:0 "С провинциальной почтой доставили маленькую деревянную лодку. Это была грубо вырезанная модель; реку изображала полоска синей ткани. Дочь паромщика сделала её, пока отец чинил настоящее судно.\n\nЖалобу удовлетворили. Поиски другого способа починить склад потребовали трёх совещаний и ссоры с интендантом. Теперь министр финансов хотел знать, вправе ли каждый округ рассчитывать на такое же отношение.\n\nГрафиня поставила лодку рядом с картами. «Если там предъявят такую же подпись».\n\nМинистр не улыбнулся. Она тоже. Когда принесли следующий бюджет, модель осталась на столе."
 hsm_cya_story.2.discretion.d:0 "Расписка паромщика вернулась раньше него самого. Реквизицию отменили личным распоряжением; внизу губернатор предусмотрительно приписал, что решение не создаёт прецедента.\n\n«Лодка у него осталась», — сказал секретарь.\n\n«А у следующего паромщика?»\n\n«Ему тоже придётся добраться сюда».\n\nГрафиня некоторое время не подписывала расписку. Она сохранила свободу направлять средства туда, где они нужнее. Но между обещанием провинции и чиновником, способным его проигнорировать, теперь стояла только она сама. Наконец графиня подписала. За дверью уже ждал новый проситель."
 hsm_cya_story.2.a:0 "Оставьте этот экземпляр у меня на столе."
 hsm_cya_story.3.t:0 "После последнего похода"
 hsm_cya_story.3.d:0 "Донкло обнаружил полковника у своего кабинета уже после полуночи. Доклад был сдан несколько часов назад. Оставалось письмо от полка, написанное тем осторожным языком, которым солдаты пользуются, когда боятся выдать свой страх.\n\nИм обещали, что после войны их служба будет что-то значить. Пенсию и место в резерве — или только медаль и железнодорожный билет?\n\n«Вы просите гарантировать назначения, когда я ещё не знаю, чего потребует следующая война».\n\n«Я спрашиваю, что будет, если следующей войны не окажется».\n\nВпервые за весь вечер Донкло не мог указать на карту. Он придвинул письмо к себе."
 hsm_cya_story.3.a:0 "Гарантировать финансирование мест в послевоенном резерве."
 hsm_cya_story.3.b:0 "Служба заслуживает признания, но не пожизненных назначений."
 hsm_cya_story.4.t:0 "Просьба об отпуске"
 hsm_cya_story.4.settled.d:0 "В следующем письме полковника вместо списка потерь стоял домашний адрес. Назначение в резерв заменили условиями демобилизационного соглашения. Прежде чем перевезти семью, он просил Донкло подтвердить их письменно.\n\nГенерал едва не направил его в комиссию. Затем под поздними бумагами нашлось первое обещание. Полковник не забыл, на чьё слово рассчитывал.\n\nДонкло подписал подтверждение. Постоянного места в гарнизоне не будет, но офицер не уедет с одним лишь советом обратиться к кому-нибудь ещё. Впервые за долгое время письмо на его столе касалось исполненного обязательства, а не новой службы, которую требовалось нести."
 hsm_cya_story.4.bound.d:0 "Следующее письмо полковника оказалось короче. Получив обещание должности в резерве, он просил отпуск, чтобы перевезти семью поближе к гарнизону. Впервые к письму прилагался адрес, а не список потерь.\n\nДонкло разрешил отпуск. Под письмом обнаружилось возражение финансового ведомства: все подобные назначения уже ложились на будущий гражданский бюджет. В штабе начали говорить об обещании как о приобретённом праве.\n\nОн помнил, зачем его дал. Эти офицеры не ушли, когда повиноваться было опасно. Счёт от этого меньше не становился. Донкло вернул возражение, не вычеркнув назначения."
 hsm_cya_story.4.term.d:0 "В плане мирного времени полковник оставил пустую строку напротив собственной фамилии. Донкло спросил почему.\n\n«Вы сказали, что полномочия заканчиваются вместе с кампанией. Пусть кто-нибудь другой решит, нужен ли я ещё».\n\nИменно этого требовал приказ. И впервые генерал услышал такой ответ от офицера, которому доверял. Несколько секунд он обдумывал исключение. Потом передал дело комиссии по назначениям.\n\nАрмия, повинующаяся лишь до тех пор, пока он защищает каждую карьеру, никогда не станет государственной. Довод был понятен. Донкло не нравилось, как пусто от него становилось в кабинете."
 hsm_cya_story.4.a:0 "Подшить письмо к первоначальному приказу."
 hsm_cya_story.5.t:0 "Переправа, которой нет на карте"
 hsm_cya_story.5.d:0 "Для урока Гроверу принесли чистую карту. Прямые дороги, отчётливые границы, города, обозначенные аккуратными кружками. Рядом лежала транспортная сводка с упоминанием деревни, которой на карте не было.\n\n«Где они переправляются через реку?» — спросил он.\n\nНаставник сверился с условными обозначениями. «Для такого масштаба это несущественно».\n\n«Но в сводке сказано, что они не могут добраться до мельницы».\n\nМальчик нарисовал на полях лодку. Наставник мог бы велеть убрать неопрятное дополнение. Вместо этого он отнёс оба листа в канцелярию двора и спросил, какую именно страну должен изучать юный император."
 hsm_cya_story.5.a:0 "Давать ему сводки без изъятия неудобных подробностей."
 hsm_cya_story.5.b:0 "Пусть наставник сначала подготовит пояснения."
 hsm_cya_story.6.t:0 "Вопрос на полях"
 hsm_cya_story.6.open.d:0 "Следующая пачка сводок вернулась из комнаты Гровера с вопросами на полях. Некоторые были детскими. Почему мост дороже школы? Может ли армия одолжить лодки? Другие заставляли писцов ёрзать: кто решил, что переправа подождёт?\n\nНаставник ожидал выговора. Но мальчик спросил, следует ли вложить вопросы без ответа в сводку следующего месяца.\n\n«Да», — после паузы сказал наставник.\n\nГровер пронумеровал их. Он ещё не знал, как чинить мосты. Зато узнал, что ответ может задержаться — и кто-то должен это заметить."
 hsm_cya_story.6.filtered.d:0 "Объяснение наставника было безупречным. Переправу не отметили, потому что округ обслуживал большой мост; мельницу — потому что подвоз зерна можно было устроить иначе. Гровер старательно переписал ответ.\n\nПозже он спросил, зачем деревня прислала ещё одно письмо, если её затруднение уже объяснили. Наставник начал повторять сказанное, но остановился.\n\n«Понять, почему что-то случилось, не всегда значит это исправить».\n\nМальчик не стёр ответ. Под ним он оставил место для другого. После урока карту убрали в футляр; маленькая лодка по-прежнему оставалась на полях."
 hsm_cya_story.6.a:0 "Сохранить экземпляр с пометками."
 hsm_cya_story.7.t:0 "Не его подпись"
 hsm_cya_story.7.d:0 "Коронация изменила имя в заголовках бумаг. Сами бумаги остались прежними. Первое спорное распределение средств ожидало Гровера рядом с завтраком. Министр пометил его: «Продолжение установившегося порядка».\n\n[Root.GetHSMCyaStoryInheritance]\n\n«Тогда зачем нужна моя подпись?»\n\nМинистр заговорил о преемственности. Гровер дослушал. Он не спрашивал, существовало ли вчерашнее правительство. Он хотел понять, означает ли наследование власти запрет пересматривать оставленные ею решения.\n\nИмператор положил перо. Какой бы ответ он ни выбрал, объясняться придётся и с теми, кто поверил прежним обещаниям."
 hsm_cya_story.7.a:0 "Сохранить обязательства. Менять курс в рамках договорённостей."
 hsm_cya_story.7.b:0 "Созвать представителей и открыто пересмотреть договорённости."
 hsm_cya_story.8.t:0 "Дверь, оставшаяся открытой"
 hsm_cya_story.8.d:0 "Последний проситель ушёл, но камергер ещё не закрыл двери. Гровер сидел за небольшим столом у окна и читал письмо без поздравлений и ссылок на славных предков. Окружной писец просил ответить на вопрос, переживший уже три администрации.\n\n[Root.GetHSMCyaStoryChildhood]\n\n[Root.GetHSMCyaStorySettlement]\n\nКамергер спросил, сохранить ли завтра тот же порядок приёма.\n\n«Да. И принесите вопросы, на которые мы сегодня не ответили».\n\nОб этом распоряжении не объявят с балкона. К утру кто-нибудь за пределами дворца узнает, было ли оно исполнено."
 hsm_cya_story.8.a:0 "На завтра остаётся работа."
 hsm_cya_story.9.t:0 "Письмо без указа"
 hsm_cya_story.9.civil.d:0 "Через гражданскую приёмную Гроверу передали прошение вдовы. Она просила исправить фамилию в извещении о гибели, чтобы дети могли получать пенсию отца. Имперской политики в просьбе не было; возможно, поэтому охрана позволила оставить её у него.\n\nОн попросил ответ из полка. Секретарь напомнил: ответ можно запросить, но нельзя приказать прислать.\n\n«Я знаю».\n\nГровер написал короткое письмо и подписался своим именем. Копию отправили в канцелярию Донкло ещё до того, как оригинал покинул дворец. Император смотрел, как письмо исчезает в почтовой сумке, и гадал, что придёт раньше: просьба или указание, как на неё отвечать."
 hsm_cya_story.9.staff.d:0 "В отчёте о приёме одной строкой упоминались вдова и спорное извещение о гибели. Гровер попросил само прошение. Секретарь объяснил, что штабная канцелярия уже направила его по назначению.\n\n«Куда именно?»\n\nСекретарь не знал. Чтобы выяснить это, требовался новый запрос.\n\nГровер написал его. Подписать разрешили, отправить без проверки — нет. На оставленном себе экземпляре он приписал на полях имя просительницы. Корона в верхней части листа была великолепна. Куда уйдёт письмо, она не подсказывала."
 hsm_cya_story.9.a:0 "Оставить её имя в списке следующего приёма."
 hsm_cya_story.10.t:0 "Ответ"
 hsm_cya_story.10.civil.d:0 "Исправленное извещение вернулось с короткой распиской. Вдова получила выплату. Гровер прочитал письмо дважды и спросил, можно ли ответить ей самому. Секретарь взглянул на охранника и кивнул.\n\nОн не назначил министра, не уволил офицера и не изменил закон. Завтра те же двери останутся запертыми, а штаб по-прежнему будет решать, какие бумаги до него дойдут.\n\nИ всё же ему написали, и что-то удалось исправить. Гровер положил письмо в ящик к прошениям без ответа. Это не доказывало, что он правит. Но давало повод снова открыть ящик."
 hsm_cya_story.10.staff.d:0 "В ответе сообщалось, что дело вдовы рассмотрено по установленному порядку. Исправили ли фамилию, выплатили ли пенсию — не говорилось. Гровер спросил секретаря, о каком порядке идёт речь.\n\n«Это всё, что прислали, Ваше Величество».\n\nДобиться парада оказалось бы проще, чем честного ответа. На мгновение ему захотелось разорвать отчёт. Вместо этого он поставил дату рядом с именем женщины и велел снова передать вопрос.\n\nЗа дверью сменилась охрана. Во дворце ничего не изменилось. На императорском столе остался список, который не отправили в корзину."
 hsm_cya_story.10.a:0 "Спросить снова."
 hsm_cya_story.11.t:0 "Присяга без имени"
 hsm_cya_story.11.executed.d:0 "Первое пополнение мирного времени ожидало во дворе. Адъютант принёс текст присяги и спросил, что поставить на месте, где прежде стояло имя императора.\n\nДонкло вспомнил приказ, не потребовавший таких колебаний. Гровер погиб потому, что он это выбрал. Ни один победный рапорт не превратит решение в случайность, а титул будущего преемника не сделает его временным.\n\n«Государству», — сказал он.\n\nАдъютант подождал продолжения. Его не последовало. Под окном новобранцы учили слова, с которыми поступят на службу. Когда пала старая корона, большинство ещё были детьми. Им достанутся его учреждения — без возможности выслушать все его оправдания."
 hsm_cya_story.11.absent.d:0 "Первое пополнение мирного времени ожидало во дворе. Адъютант принёс текст присяги и спросил, чем заменить имя императора.\n\nГровер погиб в чужих владениях. Генерал не отдавал этого приказа и не смог его предотвратить. Годами судьба отсутствующего наследника оставалась вопросом, который решат после следующего похода. Походы закончились. Вопрос остался.\n\n«Государству», — сказал он.\n\nПодходящее имя не появится на полях само собой. Совету предстоит решить дело о престолонаследии, а армии — служить, пока он это делает. Донкло смотрел на строй новобранцев и думал, насколько его власть держалась на том, что им никогда не приходилось ждать чужого решения."
 hsm_cya_story.11.a:0 "Пусть следующая присяга переживёт своего составителя."
 hsm_cya_story.12.t:0 "Кресло у окна"
 hsm_cya_story.12.d:0 "Комнаты, приготовленные для императора, наконец понадобились для другого дела. Писец спросил графиню, можно ли передать мебель провинциальной делегации. Она согласилась, а затем остановила его у двери.\n\n«Небольшой стол оставьте».\n\nСуществовали планы уроков, приёмов, первой зимы с меньшим числом часовых. Не все они успели стать воспоминаниями. Гровер погиб; пустая комната не почтит его вернее, чем забота о стране, оставшейся без него.\n\nОна села у окна и открыла переписку совета по престолонаследию. Корона осталась на своём месте. Прежде чем отвечать юристам, графиня взяла прошение из речного округа. Там по-прежнему ждали исполнения обещания."
 hsm_cya_story.12.a:0 "Пригласите просителя."
 HSM_CYA_story_circumstances_changed:0 "Двору придётся отложить это дело."
 HSM_CYA_story_provincial_guarantee_tt:0 "Корона гарантирует приоритет провинциальной отстройки, повышая скорость роста подчинения на 3%. Выбор центрального исследовательского бюджета отменит этот бонус и потребует урегулирования за 75 политической власти, если Гровер заранее не пересмотрит эту гарантию."
 HSM_CYA_story_revocable_mandate_tt:0 "Эту реквизицию рассмотрят отдельно. Новый обязательный приоритет в послевоенном бюджете не устанавливается; ранее предоставленные права провинций сохраняются."
 HSM_CYA_story_officer_guarantee_tt:0 "Гарантированные назначения в резерв сохраняют опытных инструкторов, сокращая время подготовки дивизий на 5%. Гражданская демобилизация отменит этот бонус и потребует урегулирования за 75 политической власти, если Гровер заранее не пересмотрит эту гарантию."
 HSM_CYA_story_term_commissions_tt:0 "По окончании кампании назначения подлежат пересмотру. Дополнительного урегулирования для гражданской демобилизации не потребуется."
 HSM_CYA_story_inherited_mandates_tt:0 "Унаследованные бюджетные гарантии сохраняют силу. Выбор противоречащей им послевоенной программы по-прежнему потребует указанного урегулирования. Другие права провинций и награды фокусов не меняются."
 HSM_CYA_story_reviewed_mandates_tt:0 "Открытые переговоры снимают унаследованные гарантии отстройки и назначений в резерв, отменяя связанные с ними бонусы к подчинению и подготовке дивизий. Если хотя бы одна ещё действует, переговоры стоят 50 политической власти сейчас вместо последующего урегулирования за 75. Существующая автономия и прочие бонусы программ сохраняются."
 HSM_CYA_story_officer_settlement_tt:0 "Перед передачей средств на гражданскую демобилизацию необходимо урегулировать обещанные назначения в резерв."
 HSM_CYA_story_provincial_settlement_tt:0 "Провинции должны согласиться на передачу гарантированных им средств отстройки в центральный исследовательский бюджет."
 HSM_CYA_story_memory_open:0 "Он вспомнил лодку, нарисованную на учебной карте, и первую пачку сводок, вернувшуюся с вопросами без ответа."
 HSM_CYA_story_memory_filtered:0 "Он вспомнил наставника, безупречно объяснившего исчезновение переправы, а затем признавшего: объяснение никого не перевезёт через реку."
 HSM_CYA_story_memory_adult:0 "После вступления во власть он научился не доверять чистым полям. Нередко это означало, что чей-то вопрос просто убрали."
 HSM_CYA_story_inheritance_provinces:0 "Распределение средств провинциям было скреплено гарантией графини. Делегаты строили на ней планы отстройки и не считали смену правителя её отменой."
 HSM_CYA_story_inheritance_officers:0 "Назначения в резерв были скреплены гарантией Донкло. Офицеры строили на ней планы семейной жизни. Новая печать не освобождала корону от данного слова."
 HSM_CYA_story_inheritance_unpledged:0 "Дело ссылалось на установившийся порядок, а не на особую личную гарантию. И всё же служившие при нём чиновники хотели знать, что сохранится после смены правителя."
 HSM_CYA_story_settlement_reviewed:0 "Открытые переговоры не сделали каждую делегацию дружелюбной. Зато министрам стало труднее объявлять прежние договорённости тем, что императору не положено обсуждать."
 HSM_CYA_story_settlement_adjusted:0 "Послевоенное соглашение изменило часть унаследованных гарантий. Согласие потребовало времени и уступок: прежнюю подпись можно было пересмотреть, но не заставить исчезнуть."
 HSM_CYA_story_settlement_inherited:0 "Он сохранил унаследованные обязательства. Их ограничения по-прежнему раздражали его, но подпись мало стоила бы, если бы связывала только того, кто держал перо в тот день."
 HSM_CYA_story_provincial_guarantee:0 "Провинциальной отстройке гарантирован приоритет"
 HSM_CYA_story_officer_guarantee:0 "Гарантировано финансирование назначений в резерв"
 HSM_CYA_story_reviewed_mandates:0 "Гровер открыто пересмотрел унаследованные гарантии"
 HSM_CYA_story_provinces_compensated:0 "Бюджетная гарантия провинциям урегулирована"
 HSM_CYA_story_officers_compensated:0 "Гарантия назначений в резерв урегулирована"
 HSM_CYA_story_provincial_support_active:0 "Гарантия отстройки обеспечивает сотрудничество провинций"
 HSM_CYA_story_officer_support_active:0 "Гарантия назначений в резерв сохраняет опытных инструкторов"
