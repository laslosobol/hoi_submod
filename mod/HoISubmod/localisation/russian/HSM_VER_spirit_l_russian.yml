 HSM_VER_SP_united_verenia:0 "Единая Верения"
 HSM_VER_SP_united_verenia_desc:0 "Печати Домов теперь стоят под общим законом. Их мастерские, школы и штабы не исчезли вместе со старыми границами: они стали учреждениями единой страны. Унаследованные обязательства принадлежат Верении в той же мере, что и прежние достижения."
