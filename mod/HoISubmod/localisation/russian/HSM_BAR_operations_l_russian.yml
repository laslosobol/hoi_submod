l_russian:
 HSM_BAR_operations_recon_valid_tt:0 "Требуются действующий Директорат Баррада, разрешение полевых исследований, работающая разведслужба, La Resistance, отсутствие гражданской войны и капитуляции. Целью должна быть другая существующая страна, отвечающая текущим условиям реестра дел."
 HSM_BAR_operations_archive_valid_tt:0 "Требуются действующий Директорат Баррада, разрешение полевых исследований, работающая разведслужба, La Resistance, отсутствие гражданской войны и капитуляции. Целью должна быть другая существующая страна, отвечающая текущим условиям реестра дел."
 HSM_BAR_operations_relic_valid_tt:0 "Требуются действующий Директорат Баррада, разрешение полевых исследований, работающая разведслужба, La Resistance, отсутствие гражданской войны и капитуляции. Целью должна быть другая существующая страна, отвечающая текущим условиям реестра дел. Проект «Многоуровневое сдерживание аномалий» должен быть завершён."
 HSM_BAR_operations_remains_valid_tt:0 "Требуются действующий Директорат Баррада, разрешение полевых исследований, работающая разведслужба, La Resistance, отсутствие гражданской войны и капитуляции. Целью должна быть другая существующая страна, отвечающая текущим условиям реестра дел. Проект «Экспертиза остаточной магии» должен быть завершён."
 HSM_BAR_operations_recon:0 "Разведка магической обстановки"
 HSM_BAR_operations_recon_desc:0 "Составить досье по наблюдениям, свидетельствам и открытым документам в государстве [From.GetName]. Разведка выявляет зацепки, но не передаёт реликвии, не заключает магов под стражу и не устанавливает факт чьей-либо смерти."
 HSM_BAR_operations_recon_result_tt:0 "Зарегистрировать подтверждённые зацепки в делах Баррада. Учитываются лишь сведения, остающиеся действительными к завершению операции."
 HSM_BAR_operations_archive:0 "Добыть магические архивы"
 HSM_BAR_operations_archive_desc:0 "Скопировать документы выявленного архива или исследовать записи об известной реликвии в государстве [From.GetName]. Операция добывает сведения и исследовательские записи, но не людей, о которых в них говорится."
 HSM_BAR_operations_archive_result_tt:0 "Получить доступные архивные сведения или продвинуть расследование известной реликвии после проверки её нынешнего хранителя и местоположения."
 HSM_BAR_operations_relic:0 "Изъять опознанную реликвию"
 HSM_BAR_operations_relic_desc:0 "Изъять доступную и исследованную реликвию из государства [From.GetName] по протоколу сдерживания института. Правитель, носящий или воплощающий предмет, не является целью похищения. При изменении условий хранения или доступа группа отступит."
 HSM_BAR_operations_relic_result_tt:0 "Передать на зарегистрированное хранение Баррада только исследованный предмет, доступный для изъятия в данный момент. Его состояние проверяется повторно при возвращении группы."
 HSM_BAR_operations_remains:0 "Изъять подтверждённые магические останки"
 HSM_BAR_operations_remains_desc:0 "Экспертная группа может изъять лишь опознанные останки с известным местоположением, существование которых после поражения подтверждено реестром дел. Капитуляции, пустого трона или непроверенного сообщения о смерти недостаточно. Возвращение к жизни немедленно делает операцию недопустимой."
 HSM_BAR_operations_remains_result_tt:0 "Изъять ранее подтверждённые останки, только пока сведения о личности, местоположении и состоянии после поражения остаются верными. Живые правители не захватываются и не устраняются."
 HSM_BAR_operations_phase_approach:0 "Открыть незаметный полевой пункт"
 HSM_BAR_operations_phase_approach_desc:0 "Небольшая группа арендует рабочее помещение и устанавливает защищённую связь с институтом."
 HSM_BAR_operations_phase_approach_outcome:0 "Группа открыла полевой пункт и проверила условия доступа."
 HSM_BAR_operations_phase_recon:0 "Сопоставить сообщения и наблюдения"
 HSM_BAR_operations_phase_recon_desc:0 "Опросить свидетелей по отдельности и сопоставить показания с датированными документами. Отделять предположения от наблюдавшейся магии."
 HSM_BAR_operations_phase_recon_outcome:0 "Наблюдатели составили датированное досье и отметили сомнительные сведения для дальнейшей проверки."
 HSM_BAR_operations_phase_archive:0 "Скопировать и проверить документы"
 HSM_BAR_operations_phase_archive_desc:0 "Добыть нужные страницы, печати и записи о происхождении документов. Копии без надёжно установленного источника останутся непроверенными зацепками."
 HSM_BAR_operations_phase_archive_outcome:0 "Группа подготовила проверенные копии для архивистов института."
 HSM_BAR_operations_phase_relic:0 "Проверить хранение и изолировать реликвию"
 HSM_BAR_operations_phase_relic_desc:0 "Сопоставить предмет с делом, прежде чем опечатать контейнер. Прекратить изъятие, если он недоступен, уничтожен, ещё не создан или неотделим от живого носителя."
 HSM_BAR_operations_phase_relic_outcome:0 "Перед перевозкой группа сверила предмет и условия его хранения с действующим делом."
 HSM_BAR_operations_phase_remains:0 "Подтвердить личность и цепочку хранения"
 HSM_BAR_operations_phase_remains_desc:0 "Сопоставить вещественные доказательства с записью о подтверждённых останках. Проверить все признаки воскрешения или выживания до опечатывания образцов."
 HSM_BAR_operations_phase_remains_outcome:0 "Эксперты задокументировали место и проверили личность и нынешнее состояние учтённых останков."
 HSM_BAR_operations_phase_return:0 "Вернуться по защищённому курьерскому маршруту"
 HSM_BAR_operations_phase_return_desc:0 "Доставить документы и допустимый опечатанный груз в институт. Реестр примет передачу только после окончательной проверки текущего состояния предмета."
 HSM_BAR_operations_phase_return_outcome:0 "Группа передала отчёт для окончательной сверки с реестром."
 HSM_BAR_operations_phase_return_failed:0 "Курьерский маршрут был раскрыт. Сохранившиеся материалы требуют полной проверки происхождения, прежде чем их выводы будут приняты."
 HSM_BAR_operations_invalid_title:0 "Обстоятельства дела изменились"
 HSM_BAR_operations_invalid_desc:0 "Окончательная проверка больше не подтверждает полномочия группы или допустимость цели. Пока шла операция, изменились доступ, хранитель либо фактическое состояние объекта. Институт не превратит устаревший отчёт в открытие или передачу. Реестр остаётся без изменений."
 HSM_BAR_operations_invalid_option:0 "Закрыть отчёт без передачи."
