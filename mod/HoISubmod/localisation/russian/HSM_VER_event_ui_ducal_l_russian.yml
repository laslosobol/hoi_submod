l_russian:
 HSM_VER_EUI_ducal_hearings_tt:0 "Эри обязуется проводить открытые слушания и нести постоянные расходы на гражданские нужды. Действует национальный дух обязательств перед просителями:"
 HSM_VER_EUI_ducal_private_petitions_tt:0 "Прошения будут рассматриваться при дворе в частном порядке. Оплачивается политическая цена этого решения."
 HSM_VER_EUI_ducal_rosaline_tt:0 "Отмечает, что Розалину выслушали по поводу её переписки с Монтегю."
 HSM_VER_EUI_ducal_armistice_tt:0 "Подписывает перемирие, прекращая пограничные бои и взаимные цели завоевания. Согласованные проверки действуют до заключения договора о дружбе."
 HSM_VER_EUI_ducal_ask_inspections_tt:0 "Направляет предложившему перемирие Дому встречное требование совместных пограничных инспекций. Для подписания перемирия он должен согласиться с этими условиями."
 HSM_VER_EUI_ducal_refuse_armistice_tt:0 "Отклоняет поступившее предложение о перемирии и завершает этот раунд переговоров. Перемирие и соглашение об инспекциях не заключаются."
 HSM_VER_EUI_ducal_accept_inspections_tt:0 "Принимает совместные проверки и подписывает перемирие. Договорное урегулирование действует до войны или договора о дружбе."
 HSM_VER_EUI_ducal_exchange_tt:0 "Завершает обмен пленными: освобождённые возвращаются в людские резервы обоих Домов. Эри получает отчёт об обмене. Повторно провести этот обмен нельзя."
 HSM_VER_EUI_ducal_treaty_tt:0 "Ратифицирует дружбу, прекращает проверки и снимает спорные притязания домов на чужие земли. Оба дома сохраняют независимость."
 HSM_VER_EUI_ducal_ask_arbitration_tt:0 "Возвращает проект договора дружбы с требованием арбитража имущественных споров. Предложивший договор Дом должен принять встречные условия, прежде чем договор будет заключён."
 HSM_VER_EUI_ducal_refuse_treaty_tt:0 "Отклоняет предложенный договор дружбы и завершает этот раунд переговоров. Предусмотренные договором хозяйственные преимущества и территориальные уступки не вступают в силу."
 HSM_VER_EUI_ducal_accept_arbitration_tt:0 "Принимает имущественный арбитраж и ратифицирует дружбу."
 HSM_VER_EUI_ducal_civic_delegates_tt:0 "Назначает гражданских делегатов. Ратификация равноправной хартии учредит общественный совет."
 HSM_VER_EUI_ducal_household_delegates_tt:0 "Назначает делегатов дома. Ратификация равноправной хартии учредит общие суды."
 HSM_VER_EUI_ducal_observer_tt:0 "Принимает статус наблюдателя на Веренийском конгрессе и уведомляет Дома. Если их хартия уже действует, Авиан получит отдельное предложение о ратификации; само наблюдение не даёт преимуществ хартии."
 HSM_VER_EUI_ducal_refuse_observer_tt:0 "Отклоняет приглашение на конгресс и уведомляет Дома. Авиан остаётся вне конгресса; этот ответ не предоставляет участия в хартии."
 HSM_VER_EUI_ducal_offer_equal_tt:0 "Предлагает Эйри равноправную хартию с его согласия. После ратификации подходящие наблюдатели Авиана получают отдельное приглашение."
 HSM_VER_EUI_ducal_offer_presidency_tt:0 "Предлагает ограниченное председательство герцога Эри. Эйри может согласиться, потребовать равноправия или отказать."
 HSM_VER_EUI_ducal_ratify_chosen_tt:0 "Ратифицирует согласованную хартию. Подходящие наблюдатели Авиана получают отдельное приглашение; неурегулированные нарушения хартии приостанавливают общие учреждения."
 HSM_VER_EUI_ducal_equal_counteroffer_tt:0 "Требует от Эри отказаться от герцогского председательства и принять равноправные институты хартии. Эри должен ответить на встречное предложение до ратификации."
 HSM_VER_EUI_ducal_refuse_charter_tt:0 "Отклоняет предложенную хартию и завершает этот раунд переговоров. Общие институты этим ответом не создаются; договор дружбы остаётся отдельным соглашением."
 HSM_VER_EUI_ducal_ratify_equal_tt:0 "Ратифицирует равноправную хартию. Подходящие наблюдатели Авиана получают отдельное приглашение; неурегулированные нарушения хартии приостанавливают общие учреждения."
 HSM_VER_EUI_ducal_avian_ratify_tt:0 "Авиан присоединяется к хартии и её действующим учреждениям. Неурегулированные споры приостанавливают преимущества."
 HSM_VER_EUI_ducal_avian_refuse_charter_tt:0 "Отклоняет вступление в хартию и прекращает участие Авиана в конгрессе в качестве наблюдателя. Эри отмечает отказ; преимущества общих судов, штаба и служб не предоставляются."
 HSM_VER_EUI_ducal_honour_judgement_tt:0 "Исполняет решение суда и разрешает первый спор Эри в рамках хартии, позволяя продолжить урегулирование. Эйри получает уведомление об исполнении решения."
 HSM_VER_EUI_ducal_ducal_exception_tt:0 "Объявляет герцогское исключение и приостанавливает преимущества хартии для обоих Домов и подписавшего её Авиана, включая суды, штаб, службы и общий бюджет. Военные союзы сохраняются. Эри получает дух герцогского исключения:"
 HSM_VER_EUI_ducal_erie_league_tt:0 "Принимает оборонительный союз. Новый союз возглавит Эри; существующий сохранит лидера. Дома объединяются, если это допускает их нынешнее членство. Подходящий Авиан-участник хартии получает отдельное приглашение и может отказаться."
 HSM_VER_EUI_ducal_refuse_league_tt:0 "Отклоняет предложенный оборонительный союз и уведомляет предложивший его Дом. Этот ответ не создаёт альянс и не меняет членство в нём; хартия остаётся отдельным соглашением."
 HSM_VER_EUI_ducal_avian_league_tt:0 "Принимает приглашение и вводит Авиан в существующий оборонительный союз Домов под нынешним руководством Эри или Эйри. Авиан сохраняет собственное правительство."
 HSM_VER_EUI_ducal_avian_refuse_league_tt:0 "Отклоняет приглашение в оборонительный союз. Авиан остаётся вне альянса; участие в хартии этим решением не отменяется."
 HSM_VER_EUI_ducal_resist_avian_tt:0 "Отклоняет требование Авиана о верховенстве и уведомляет его правительство. Даёт пограничную охрану на 180 дней; через 90 дней возможна оценка положения на границе, если враждебные отношения сохраняются."
 HSM_VER_EUI_ducal_negotiate_avian_tt:0 "Предлагает Авиану соглашение о гражданском транзите с его согласия. Ратификация учреждает пакт о ненападении."
 HSM_VER_EUI_ducal_submit_avian_tt:0 "Принимает верховенство Авиана: наша страна становится его марионеткой. Убирает пограничную охрану и преимущества гражданского транзита, если условия соглашения больше не выполняются."
 HSM_VER_EUI_ducal_accountable_muster_tt:0 "Завершает проверку ополчения под гражданским надзором. Оплачивает проверку и даёт подотчётное ополчение: быстрее мобилизация и выше стабильность с политическими издержками."
 HSM_VER_EUI_ducal_officers_muster_tt:0 "Поручает проверку ополчения офицерам и окончательно определяет порядок надзора. Даёт опыт армии и дух доверия офицерам, улучшающий подготовку и организацию ценой стабильности."
 HSM_VER_EUI_ducal_civic_command_tt:0 "Заменяет профессиональное командование гражданским надзором."
 HSM_VER_EUI_ducal_professional_command_tt:0 "Заменяет гражданский надзор профессиональным командованием."
 HSM_VER_EUI_ducal_ask_presidency_tt:0 "Запрашивает согласие Эйри на ограниченное председательство Эри. Хартия ожидает ответа Эйри."
 HSM_VER_EUI_ducal_ratify_presidency_tt:0 "Ратифицирует ограниченное председательство Эри и общие суды Эйри. Подходящие наблюдатели Авиана получают отдельное приглашение."
 HSM_VER_EUI_ducal_eyrie_league_tt:0 "Принимает оборонительный союз. Новый союз возглавит Эйри; существующий сохранит лидера. Дома объединяются, если это допускает их нынешнее членство. Подходящий Авиан-участник хартии получает отдельное приглашение и может отказаться."
 HSM_VER_EUI_ducal_return_workshops_tt:0 "Возвращает реквизированные мастерские и разрешает спор о полномочиях командования Эйри. Эри получает уведомление об исполнении судебного решения, позволяющего продолжить урегулирование в рамках хартии."
 HSM_VER_EUI_ducal_keep_requisitions_tt:0 "Сохраняет военные реквизиции и приостанавливает преимущества хартии для обоих Домов и подписавшего её Авиана, включая суды, штаб, службы и общий бюджет. Военные союзы сохраняются. Эйри получает чрезвычайные реквизиции:"
 HSM_VER_EUI_ducal_conference_inspections_tt:0 "Выбирает совместные пограничные проверки. Они начинаются с перемирия и завершаются ратификацией дружбы."
 HSM_VER_EUI_ducal_conference_arbitration_tt:0 "Выбирает имущественный арбитраж вместо совместных пограничных проверок."
 HSM_VER_EUI_ducal_defeated_rights_tt:0 "Признаёт права побеждённого Дома в урегулировании Эри. До принятия окончательного конституционного порядка действует указанное ниже управление с гарантиями прав:"
 HSM_VER_EUI_ducal_central_commissions_tt:0 "Передаёт побеждённые территории центральным комиссиям. До принятия окончательного конституционного порядка комиссии усиливают армию и промышленное производство ценой стабильности:"
 HSM_VER_EUI_ducal_equal_judgement_tt:0 "Поддерживает судебное решение и равное рассмотрение прошения. Заменяет дух притязаний покровителей равным правосудием; отчёт о последствиях возможен через 45 дней, если урегулирование сохраняется."
 HSM_VER_EUI_ducal_patron_claims_tt:0 "Присуждает спорное имущество покровителям герцога, заменяя равное правосудие их притязаниями. Отчёт о последствиях возможен через 45 дней, если урегулирование сохраняется."
 HSM_VER_EUI_ducal_campaign_read_tt:0 "Подтверждает ознакомление с запиской Иовинуса о кампании и закрывает этот отчёт."
 HSM_VER_EUI_ducal_civilian_release_tt:0 "Выбирает гражданскую демобилизацию и начинает переход на 120 дней. После этого мастерские можно рассмотреть, когда определена политика переписки и завершён нужный фокус. Пока урегулирование сохраняется, действует дух возвращения к гражданской жизни:"
 HSM_VER_EUI_ducal_military_order_tt:0 "Сохраняет военное управление. Начинает переход на 120 дней; затем мастерские доступны после решения о переписке и нужного фокуса. Пока урегулирование действует, предоставляет дух военного правительства:"
 HSM_VER_EUI_ducal_open_post_tt:0 "Разрешает частную переписку и определяет почтовую политику. Дух открытой переписки поддерживает исследования с ежедневными политическими издержками, пока действует послевоенное урегулирование Эйри:"
 HSM_VER_EUI_ducal_supervised_post_tt:0 "Сохраняет военное визирование частной переписки и определяет почтовую политику. Поднадзорная переписка улучшает планирование ценой стабильности, пока урегулирование остаётся в силе:"
 HSM_VER_EUI_ducal_fund_training_tt:0 "Финансирует гражданское переобучение и строительство мастерских при наличии места."
 HSM_VER_EUI_ducal_unfunded_training_tt:0 "Оставляет переподготовку местным комиссиям без нового финансирования. Нерешённое трудоустройство резервистов снижает стабильность и скорость строительства гражданских фабрик, пока урегулирование остаётся в силе:"
 HSM_VER_EUI_ducal_arms_priority_tt:0 "Резервирует мощности мастерских для военного производства. Этот приоритет повышает выпуск фабрик, но замедляет строительство гражданских фабрик, пока урегулирование остаётся в силе:"
 HSM_VER_EUI_ducal_civilian_contracts_tt:0 "Финансирует гражданские контракты и утверждает программу мастерских."
 HSM_VER_EUI_ducal_inspection_read_tt:0 "Отмечает завершение инспекции, позволяя получить заключительный отчёт после финального фокуса. Выбранный гражданский или военный порядок и политика мастерских продолжают действовать."
 HSM_VER_EUI_ducal_ending_read_tt:0 "Подтверждает ознакомление с заключительным отчётом. Выбранные послевоенные меры продолжают действовать на прежних условиях."
 HSM_VER_EUI_ducal_approach_avian_tt:0 "Добивается соглашения о ненападении с Авианом. Предложение отправляется, только пока урегулирование сохраняется, а Авиан независим, идёт путём Intergigantes и находится в мире. Решение о согласии принимает Авиан."
 HSM_VER_EUI_ducal_leave_avian_tt:0 "Завершает рассмотрение обращения к Авиану без отправки предложения о ненападении. Это решение не создаёт новых дипломатических обязательств перед Авианом."
 HSM_VER_EUI_ducal_accept_pact_tt:0 "Подписывает пакт о ненападении с государством [FROM.GetNameDef] и уведомляет его правительство. Авиан принимает двустороннее соглашение, сохраняя собственные правительство и территорию."
 HSM_VER_EUI_ducal_refuse_pact_tt:0 "Отклоняет предложение о ненападении и уведомляет государство [FROM.GetNameDef]. Этот раунд переговоров завершается без заключения пакта."
 HSM_VER_EUI_ducal_subject_consent_tt:0 "Даёт согласие на последующую аннексию державой [FROM.GetNameDef] и начинает переход на 90 дней. Объединение по-прежнему требует мира, контроля исконных земель и действующего урегулирования."
 HSM_VER_EUI_ducal_subject_refusal_tt:0 "Отказывает в согласии на аннексию и уведомляет государство [FROM.GetNameDef]. Предложенная интеграция останавливается на согласовании условий; Авиан сохраняет существующее положение подчинённого государства."
 HSM_VER_EUI_ducal_avian_local_charter_tt:0 "Выбирает местную хартию и начинает переход на 90 дней. Её учреждения вступят в силу после объединения:"
 HSM_VER_EUI_ducal_avian_commission_tt:0 "Выбирает прямые комиссии и начинает переход на 90 дней. Их учреждения вступят в силу после объединения:"
 HSM_VER_EUI_ducal_association_accept_tt:0 "Принимает ассоциацию с государством [FROM.GetNameDef]. Если хартия Домов действует, Авиан также становится наблюдателем конгресса и подписантом. Этот ответ не даёт немедленного национального духа; последующая аннексия требует отдельного соглашения о присоединении."
 HSM_VER_EUI_ducal_association_refuse_tt:0 "Отклоняет ассоциацию с государством [FROM.GetNameDef] и закрывает поступившее предложение. Этот ответ не вводит Авиан в конгресс или хартию."
 HSM_VER_EUI_ducal_accession_accept_tt:0 "Даёт согласие на аннексию государством [FROM.GetNameDef] и начинает переход на 60 дней. Аннексия выполняется позднее: территория и войска Авиана перейдут инициатору, только если сохранятся ассоциация, независимость, мир и необходимый контроль родных территорий."
 HSM_VER_EUI_ducal_accession_refuse_tt:0 "Отказывается от аннексии государством [FROM.GetNameDef] и закрывает предложение о присоединении. Существующая ассоциация сохраняется; Авиан не даёт согласия на передачу территории или войск."
 HSM_VER_EUI_ducal_exchange_open_tt:0 "Оба Дома свободны и не воюют друг с другом; перемирие или договор действует, обмен пленными ещё не проведён."
 HSM_VER_EUI_ducal_muster_open_tt:0 "Иовинус правит свободным Эйри; проверка ополчения ещё не завершена."
 HSM_VER_EUI_ducal_command_policy_open_tt:0 "Иовинус правит свободным Эйри; мирный договор действует, политика командования ещё не выбрана."
 HSM_VER_EUI_ducal_judgement_open_tt:0 "Судебный спор Эри ещё ожидает решения в рамках действующей хартии."
 HSM_VER_EUI_ducal_requisitions_open_tt:0 "Спор о реквизициях Эйри ещё ожидает решения в рамках действующей хартии."
