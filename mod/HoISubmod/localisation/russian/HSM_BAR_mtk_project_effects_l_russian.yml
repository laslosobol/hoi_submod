 HSM_BAR_mtk_sensate_prosthesis_effects:0 "Потери опыта: -5%; Скорость восстановления дивизий: +5%."
 HSM_BAR_mtk_sensate_prosthesis_start_theory_tt:0 "Стоимость: 35 политической власти. Срок: 35 дн. Занятые фабрики: 1. Требуется: Баррад; действующий коллегиум; завершённый фокус $HSM_BAR_collegium_oath$; отсутствие капитуляции; владение и контроль над $STATE_624$. Кафедра свободна; $BAR_leopold_schmeller$ жив и присутствует. Проект ещё не завершён. Теория ещё не завершена. Совместная работа: обе кафедры свободны; присутствует также $BAR_silver_star$. Завершены: $HSM_BAR_mtk_prosthetics_title$, $HSM_BAR_mtk_phantom_pain_title$. Обе кафедры заняты до конца этапа. Протокол ведущей кафедры; одна оплата, одна мастерская. При отмене этап не засчитывается, затраты не возвращаются. Повторный запуск оплачивается заново."
 HSM_BAR_mtk_sensate_prosthesis_theory_mission:0 "$HSM_BAR_mtk_sensate_prosthesis_title$: теория"
 HSM_BAR_mtk_sensate_prosthesis_theory_mission_desc:0 "35 дн. По завершении кафедра представит подписанный теоретический отчёт и сможет приступить к испытаниям. Потеря доступа или руководителя отменяет текущий этап. Подписанные отчёты хранятся в архиве, пока коллегиум существует."
 HSM_BAR_mtk_sensate_prosthesis_start_trials_tt:0 "[GetHSMBARMtkTrialBudget_sensate_prosthesis] Требуется: Баррад; действующий коллегиум; завершённый фокус $HSM_BAR_collegium_oath$; отсутствие капитуляции; владение и контроль над $STATE_624$. Кафедра свободна; $BAR_leopold_schmeller$ жив и присутствует. Проект ещё не завершён. Теория завершена. Совместная работа: обе кафедры свободны; присутствует также $BAR_silver_star$. Завершены: $HSM_BAR_mtk_prosthetics_title$, $HSM_BAR_mtk_phantom_pain_title$. Обе кафедры заняты до конца этапа. Протокол ведущей кафедры; одна оплата, одна мастерская. Запрет на новые клинические испытания снят. Требуются утверждённая теория, выбранные установка и контрольная проба. Первая серия завершится записью наблюдений и ожиданием решения о продолжении; заключение и результат появятся только после последующей проверки. Кафедры и мастерские остаются заняты во время ожидания и проверки. При отмене этап не засчитывается, затраты не возвращаются. Повторный запуск оплачивается заново.\nТекущий протокол: [GetHSMBARMtkMethod_leopold]. Метод фиксируется при запуске."
