 HSM_BAR_mtk_spell_notation_start_theory_tt:0 "Стоимость: 20 политической власти. Срок: 28 дн. Занятые фабрики: 1. Требуется: Баррад; действующий коллегиум; завершённый фокус $HSM_BAR_collegium_oath$; отсутствие капитуляции; владение и контроль над $STATE_624$. Кафедра свободна; $BAR_viira_lehtola$ жив и присутствует. Проект ещё не завершён. Теория ещё не завершена. При отмене этап не засчитывается, затраты не возвращаются. Повторный запуск оплачивается заново."
 HSM_BAR_mtk_spell_notation_theory_mission:0 "$HSM_BAR_mtk_spell_notation_title$: теория"
 HSM_BAR_mtk_spell_notation_theory_mission_desc:0 "28 дн. По завершении кафедра представит подписанный теоретический отчёт и сможет приступить к испытаниям. Потеря доступа или руководителя отменяет текущий этап. Подписанные отчёты хранятся в архиве, пока коллегиум существует."
 HSM_BAR_mtk_spell_notation_start_trials_tt:0 "[GetHSMBARMtkTrialBudget_spell_notation] Требуется: Баррад; действующий коллегиум; завершённый фокус $HSM_BAR_collegium_oath$; отсутствие капитуляции; владение и контроль над $STATE_624$. Кафедра свободна; $BAR_viira_lehtola$ жив и присутствует. Проект ещё не завершён. Теория завершена. Требуются утверждённая теория, выбранные установка и контрольная проба. Первая серия завершится записью наблюдений и ожиданием решения о продолжении; заключение и результат появятся только после последующей проверки. Кафедры и мастерские остаются заняты во время ожидания и проверки. При отмене этап не засчитывается, затраты не возвращаются. Повторный запуск оплачивается заново.\nТекущий протокол: [GetHSMBARMtkMethod_viira]. Метод фиксируется при запуске."
