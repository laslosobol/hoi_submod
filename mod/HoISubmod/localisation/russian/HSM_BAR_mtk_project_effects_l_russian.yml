l_russian:
 HSM_BAR_mtk_projects_missions:0 "Исследования коллегиума"
 HSM_BAR_mtk_projects_missions_desc:0 "Текущие теоретические исследования и испытания кафедр."
 HSM_BAR_mtk_research:0 "Результаты исследований коллегиума"
 HSM_BAR_mtk_research_desc:0 "Проверенные разработки кафедр: от клинических процедур до промышленной автоматики. Результаты внедряются без разделения на гражданское и ведомственное применение. Фабрики заняты только на время исследования или испытаний; постоянного содержания нет."
 HSM_BAR_mtk_method_replication:0 "последовательные испытания"
 HSM_BAR_mtk_method_instrumentation:0 "приборные испытания"
 HSM_BAR_mtk_viira_choose_replication:0 "$BAR_viira_lehtola$: последовательные испытания"
 HSM_BAR_mtk_viira_choose_replication_desc:0 "Виира может сопоставлять последовательные наблюдения или занять мастерскую параллельной сетью чувствующих кристаллов. Приборы сокращают расписание замеров, но не делают два разума одинаковыми.\n\nПоследовательный протокол занимает одну фабрику (Magnum Opus: две). Приборный сокращает испытания на 7 дней (Magnum Opus: 21), но требует на одну фабрику и на 15 политической власти больше (Magnum Opus: 35). Мастерские освобождаются при завершении или отмене. Метод фиксируется при оплате и не меняет исход проекта."
 HSM_BAR_mtk_viira_choose_instrumentation:0 "$BAR_viira_lehtola$: приборные испытания"
 HSM_BAR_mtk_viira_choose_instrumentation_desc:0 "Виира может сопоставлять последовательные наблюдения или занять мастерскую параллельной сетью чувствующих кристаллов. Приборы сокращают расписание замеров, но не делают два разума одинаковыми.\n\nПоследовательный протокол занимает одну фабрику (Magnum Opus: две). Приборный сокращает испытания на 7 дней (Magnum Opus: 21), но требует на одну фабрику и на 15 политической власти больше (Magnum Opus: 35). Мастерские освобождаются при завершении или отмене. Метод фиксируется при оплате и не меняет исход проекта."
 HSM_BAR_mtk_leopold_choose_replication:0 "$BAR_leopold_schmeller$: последовательные испытания"
 HSM_BAR_mtk_leopold_choose_replication_desc:0 "Леопольд может поочерёдно перестраивать стенд или заказать отдельные измерители и дублирующие установки. Занятая мастерская быстрее выдаст замеры, но не обещание, что машина заработает.\n\nПоследовательный протокол занимает одну фабрику (Magnum Opus: две). Приборный сокращает испытания на 7 дней (Magnum Opus: 21), но требует на одну фабрику и на 15 политической власти больше (Magnum Opus: 35). Мастерские освобождаются при завершении или отмене. Метод фиксируется при оплате и не меняет исход проекта."
 HSM_BAR_mtk_leopold_choose_instrumentation:0 "$BAR_leopold_schmeller$: приборные испытания"
 HSM_BAR_mtk_leopold_choose_instrumentation_desc:0 "Леопольд может поочерёдно перестраивать стенд или заказать отдельные измерители и дублирующие установки. Занятая мастерская быстрее выдаст замеры, но не обещание, что машина заработает.\n\nПоследовательный протокол занимает одну фабрику (Magnum Opus: две). Приборный сокращает испытания на 7 дней (Magnum Opus: 21), но требует на одну фабрику и на 15 политической власти больше (Magnum Opus: 35). Мастерские освобождаются при завершении или отмене. Метод фиксируется при оплате и не меняет исход проекта."
 HSM_BAR_mtk_silver_choose_replication:0 "$BAR_silver_star$: последовательные испытания"
 HSM_BAR_mtk_silver_choose_replication_desc:0 "Сильвер Стар может вести клинические серии по очереди или оснастить параллельные диагностические бригады. Дополнительная аппаратура сокращает задержки между наблюдениями, а не помощь отдельному пациенту.\n\nПоследовательный протокол занимает одну фабрику (Magnum Opus: две). Приборный сокращает испытания на 7 дней (Magnum Opus: 21), но требует на одну фабрику и на 15 политической власти больше (Magnum Opus: 35). Мастерские освобождаются при завершении или отмене. Метод фиксируется при оплате и не меняет исход проекта."
 HSM_BAR_mtk_silver_choose_instrumentation:0 "$BAR_silver_star$: приборные испытания"
 HSM_BAR_mtk_silver_choose_instrumentation_desc:0 "Сильвер Стар может вести клинические серии по очереди или оснастить параллельные диагностические бригады. Дополнительная аппаратура сокращает задержки между наблюдениями, а не помощь отдельному пациенту.\n\nПоследовательный протокол занимает одну фабрику (Magnum Opus: две). Приборный сокращает испытания на 7 дней (Magnum Opus: 21), но требует на одну фабрику и на 15 политической власти больше (Magnum Opus: 35). Мастерские освобождаются при завершении или отмене. Метод фиксируется при оплате и не меняет исход проекта."
 HSM_BAR_mtk_asinti_choose_replication:0 "$BAR_asinti$: последовательные испытания"
 HSM_BAR_mtk_asinti_choose_replication_desc:0 "Асинти может повторять наблюдение в каждый ритуальный промежуток или подготовить приборную камеру для совместной записи нескольких циклов. Более ясный след ещё не обязательно является ответом с другой стороны.\n\nПоследовательный протокол занимает одну фабрику (Magnum Opus: две). Приборный сокращает испытания на 7 дней (Magnum Opus: 21), но требует на одну фабрику и на 15 политической власти больше (Magnum Opus: 35). Мастерские освобождаются при завершении или отмене. Метод фиксируется при оплате и не меняет исход проекта."
 HSM_BAR_mtk_asinti_choose_instrumentation:0 "$BAR_asinti$: приборные испытания"
 HSM_BAR_mtk_asinti_choose_instrumentation_desc:0 "Асинти может повторять наблюдение в каждый ритуальный промежуток или подготовить приборную камеру для совместной записи нескольких циклов. Более ясный след ещё не обязательно является ответом с другой стороны.\n\nПоследовательный протокол занимает одну фабрику (Magnum Opus: две). Приборный сокращает испытания на 7 дней (Magnum Opus: 21), но требует на одну фабрику и на 15 политической власти больше (Magnum Opus: 35). Мастерские освобождаются при завершении или отмене. Метод фиксируется при оплате и не меняет исход проекта."
