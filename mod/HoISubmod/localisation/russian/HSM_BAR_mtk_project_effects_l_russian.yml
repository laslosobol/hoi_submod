 HSM_BAR_mtk_tissue_bank_start_theory_tt:0 "Стоимость: 35 политической власти. Срок: 42 дн. Занятые фабрики: 1. Требуется: Баррад; действующий коллегиум; завершённый фокус $HSM_BAR_collegium_oath$; отсутствие капитуляции; владение и контроль над $STATE_624$. Кафедра свободна; $BAR_silver_star$ жив и присутствует. Проект ещё не завершён. Теория ещё не завершена. При отмене этап не засчитывается, затраты не возвращаются. Повторный запуск оплачивается заново."
 HSM_BAR_mtk_tissue_bank_theory_mission:0 "$HSM_BAR_mtk_tissue_bank_title$: теория"
 HSM_BAR_mtk_tissue_bank_theory_mission_desc:0 "42 дн. По завершении кафедра представит подписанный теоретический отчёт и сможет приступить к испытаниям. Потеря доступа или руководителя отменяет текущий этап. Подписанные отчёты хранятся в архиве, пока коллегиум существует."
 HSM_BAR_mtk_tissue_bank_start_trials_tt:0 "[GetHSMBARMtkTrialBudget_tissue_bank] Требуется: Баррад; действующий коллегиум; завершённый фокус $HSM_BAR_collegium_oath$; отсутствие капитуляции; владение и контроль над $STATE_624$. Кафедра свободна; $BAR_silver_star$ жив и присутствует. Проект ещё не завершён. Теория завершена. Запрет на новые клинические испытания снят. Требуются утверждённая теория, выбранные установка и контрольная проба. Первая серия завершится записью наблюдений и ожиданием решения о продолжении; заключение и результат появятся только после последующей проверки. Кафедры и мастерские остаются заняты во время ожидания и проверки. При отмене этап не засчитывается, затраты не возвращаются. Повторный запуск оплачивается заново.\nТекущий протокол: [GetHSMBARMtkMethod_silver]. Метод фиксируется при запуске."
