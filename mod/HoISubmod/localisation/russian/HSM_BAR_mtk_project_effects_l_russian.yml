 HSM_BAR_mtk_interrupt_notation_start_theory_tt:0 "Стоимость: 40 политической власти. Срок: 42 дн. Занятые фабрики: 1. Требуется: Баррад; действующий коллегиум; завершённый фокус $HSM_BAR_collegium_oath$; отсутствие капитуляции; владение и контроль над $STATE_624$. Кафедра свободна; $BAR_viira_lehtola$ жив и присутствует. Проект ещё не завершён. Теория ещё не завершена. Совместная работа: обе кафедры свободны; присутствует также $BAR_asinti$. Завершены: $HSM_BAR_mtk_spell_notation_title$, $HSM_BAR_mtk_ritual_brake_title$. Обе кафедры заняты до конца этапа. Протокол ведущей кафедры; одна оплата, одна мастерская. При отмене этап не засчитывается, затраты не возвращаются. Повторный запуск оплачивается заново."
 HSM_BAR_mtk_interrupt_notation_theory_mission:0 "$HSM_BAR_mtk_interrupt_notation_title$: теория"
 HSM_BAR_mtk_interrupt_notation_theory_mission_desc:0 "42 дн. По завершении кафедра представит подписанный теоретический отчёт и сможет приступить к испытаниям. Потеря доступа или руководителя отменяет текущий этап. Подписанные отчёты хранятся в архиве, пока коллегиум существует."
 HSM_BAR_mtk_interrupt_notation_start_trials_tt:0 "[GetHSMBARMtkTrialBudget_interrupt_notation] Требуется: Баррад; действующий коллегиум; завершённый фокус $HSM_BAR_collegium_oath$; отсутствие капитуляции; владение и контроль над $STATE_624$. Кафедра свободна; $BAR_viira_lehtola$ жив и присутствует. Проект ещё не завершён. Теория завершена. Совместная работа: обе кафедры свободны; присутствует также $BAR_asinti$. Завершены: $HSM_BAR_mtk_spell_notation_title$, $HSM_BAR_mtk_ritual_brake_title$. Обе кафедры заняты до конца этапа. Протокол ведущей кафедры; одна оплата, одна мастерская. Требуются утверждённая теория, выбранные установка и контрольная проба. Первая серия завершится записью наблюдений и ожиданием решения о продолжении; заключение и результат появятся только после последующей проверки. Кафедры и мастерские остаются заняты во время ожидания и проверки. При отмене этап не засчитывается, затраты не возвращаются. Повторный запуск оплачивается заново.\nТекущий протокол: [GetHSMBARMtkMethod_viira]. Метод фиксируется при запуске."
 HSM_BAR_mtk_interrupt_notation_trials_mission:0 "$HSM_BAR_mtk_interrupt_notation_title$: испытания"
 HSM_BAR_mtk_interrupt_notation_trials_mission_desc:0 "49 дн. По завершении кафедра представит подписанный отчёт об испытаниях и заключение. Потеря доступа или руководителя отменяет текущий этап. Подписанные отчёты хранятся в архиве, пока коллегиум существует."
