 HSM_BAR_mtk_manufactory_start_theory_tt:0 "Стоимость: 60 политической власти. Срок: 63 дн. Занятые фабрики: 2. Требуется: Баррад; действующий коллегиум; завершённый фокус $HSM_BAR_collegium_oath$; отсутствие капитуляции; владение и контроль над $STATE_624$. Кафедра свободна; $BAR_leopold_schmeller$ жив и присутствует. Проект ещё не завершён. Теория ещё не завершена. Завершены все пять подготовительных проектов кафедры, включая неудачные. При отмене этап не засчитывается, затраты не возвращаются. Повторный запуск оплачивается заново."
