 HSM_BAR_mtk_manufactory_theory_mission_desc:0 "63 дн. По завершении кафедра представит подписанный теоретический отчёт и сможет приступить к испытаниям. Потеря доступа или руководителя отменяет текущий этап. Подписанные отчёты хранятся в архиве, пока коллегиум существует."
 HSM_BAR_mtk_manufactory_start_trials_tt:0 "[GetHSMBARMtkTrialBudget_manufactory] Требуется: Баррад; действующий коллегиум; завершённый фокус $HSM_BAR_collegium_oath$; отсутствие капитуляции; владение и контроль над $STATE_624$. Кафедра свободна; $BAR_leopold_schmeller$ жив и присутствует. Проект ещё не завершён. Теория завершена. Завершены все пять подготовительных проектов кафедры, включая неудачные. Требуются утверждённая теория, выбранные установка и контрольная проба. Первая серия завершится записью наблюдений и ожиданием решения о продолжении; заключение и результат появятся только после последующей проверки. Кафедры и мастерские остаются заняты во время ожидания и проверки. При отмене этап не засчитывается, затраты не возвращаются. Повторный запуск оплачивается заново.\nТекущий протокол: [GetHSMBARMtkMethod_leopold]. Метод фиксируется при запуске."
