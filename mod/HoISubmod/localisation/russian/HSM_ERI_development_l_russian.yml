l_russian:
 HSM_ERI_DEV_common_curriculum_bonus:0 "Общая техническая программа"
 HSM_ERI_DEV_public_health_bonus:0 "Подготовка служб здравоохранения"
 HSM_ERI_reconstruction:0 "Работа по восстановлению"
 HSM_ERI_reconstruction_desc:0 "Обветшавшие мосты, протекающие крыши и прошения без ответа стали привычной частью жизни в Эри. Мы создадим небольшое бюро восстановления, которое оценит ущерб, наладит поставки и будет помогать местным ремонтным бригадам. Доверие к нему придётся заслужить выполненной работой."
 HSM_ERI_restore_public_services:0 "Восстановить местные службы"
 HSM_ERI_restore_public_services_desc:0 "Чистая вода, работающие лечебницы и доступные местные учреждения нужны семьям уже сейчас. Ремонтные бригады начнут с них, а регулярные осмотры помогут избежать нового запустения. Жители не должны тратить последние сбережения на устранение неполадок, которые могла предотвратить администрация."
 HSM_ERI_reopen_roads:0 "Привести дороги в порядок"
 HSM_ERI_reopen_roads_desc:0 "Дороги Эри, Пылающего дола и Комрика должны пропускать обозы с зерном и инструментами в любое время года. Восстановленные мосты, водоотводные канавы и прочное покрытие вновь свяжут отдалённые поселения с рынками. Инженерные обследования пригодятся и для следующих строек."
 HSM_ERI_civilian_industry:0 "Основа мирной промышленности"
 HSM_ERI_civilian_industry_desc:0 "Строителям нужны надёжные поставки древесины, крепежа и деталей машин. Расширение гражданского производства обеспечит местным предприятиям постоянные заказы и позволит выполнять больше работ своими силами. Это первый шаг к промышленной экономике, которой ещё предстоит вырасти."
 HSM_ERI_workshop_network:0 "Сеть мастерских"
 HSM_ERI_workshop_network_desc:0 "Мастерская может перерасти дело одного ремесленника, если ей доступны стандартные детали и обученные подмастерья. Мы расширим производственные помещения и предложим мастерским общие меры, правила проверки и порядок размещения заказов. Небольшие предприятия смогут сохранить своё ремесло и выйти на более широкий рынок."
 HSM_ERI_veterans_to_work:0 "Ремесло после службы"
 HSM_ERI_veterans_to_work_desc:0 "Вернувшиеся солдаты обладают полезными навыками, но послужной список сам по себе не даёт заработка. Новая программа трудоустройства поможет им найти ученические места, работу в мастерских и ремонтных бригадах. Для раненых подберут посильное занятие, а желающие ветераны смогут участвовать в подготовке новобранцев."
 HSM_ERI_village_schools:0 "Доступные сельские школы"
 HSM_ERI_village_schools_desc:0 "Дети не должны лишаться образования лишь потому, что ближайшая школа находится в дне пути. Мы откроем заброшенные классы, доставим учебники и организуем вечерние занятия для взрослых. Чтение, счёт и основы естествознания дадут большему числу жителей возможность учиться дальше."
 HSM_ERI_teacher_training:0 "Подготовка учителей"
 HSM_ERI_teacher_training_desc:0 "Открыть класс проще, чем найти подготовленного учителя. Новые педагогические курсы соединят учебную практику с арифметикой, делопроизводством и основами технических знаний. Выпускники вернутся в местные школы с подходящими пособиями и смогут обращаться за советом к коллегам."
 HSM_ERI_technical_college:0 "Открыть техническое училище"
 HSM_ERI_technical_college_desc:0 "Развитие школ и гражданских мастерских позволяет нам основать небольшое техническое училище. В первых лабораториях будут преподавать механику и электрические измерения, а производственная практика свяжет занятия с повседневными задачами. Это новое учреждение поможет растущему научному сообществу Эри подготовить следующее поколение специалистов."
 HSM_ERI_applied_research:0 "От учёбы к исследованиям"
 HSM_ERI_applied_research_desc:0 "Училище уже способно содержать небольшую группу, которая займётся задачами за пределами учебной программы. Развитая гражданская промышленность и освоение электротехники позволят создавать приборы, испытывать конструкции и записывать результаты. Постоянным исследованиям нужны средства, оборудование и время."
 HSM_ERI_research_council:0 "Согласовать научную работу"
 HSM_ERI_research_council_desc:0 "Растущая промышленность и подготовленные специалисты позволяют расширить научную программу. Мы создадим небольшой исследовательский совет, который распределит время работы в лабораториях, разместит практические заказы и обеспечит публикацию полезных результатов. Освоение основных станков и строительных методов даст основу для второй постоянной исследовательской группы."
 HSM_ERI_army_for_a_country:0 "Армия для страны"
 HSM_ERI_army_for_a_country_desc:0 "Армия должна уметь защищать вверенные ей поселения, дороги и труд жителей. Проверка списков личного состава, запасов и подготовки покажет, на что действительно способны наши части. Эти сведения помогут создать войско, обязанности которого выходят за рамки церемоний и личной преданности."
 HSM_ERI_professional_officers:0 "Подготовленный офицерский корпус"
 HSM_ERI_professional_officers_desc:0 "Офицерский чин означает ответственность за снабжение, подготовку и жизнь подчинённых. Регулярные штабные курсы и учения дадут командирам общую основу для выполнения этих обязанностей. Продвижение по службе должно учитывать знания и умение поддерживать боеготовность части."
 HSM_ERI_modern_infantry:0 "Современное снаряжение пехоты"
 HSM_ERI_modern_infantry_desc:0 "Пехота не может бесконечно обходиться разнородным оружием и самодельными запасными частями. Сравнительные испытания помогут выбрать надёжные винтовки и снаряжение, которые смогут обслуживать наши мастерские. Результаты лягут в основу закупок и учебных наставлений."
 HSM_ERI_support_companies:0 "Сапёры и полевые медики"
 HSM_ERI_support_companies_desc:0 "Разрушенная переправа или необработанная рана способны сорвать поход не хуже вражеского огня. Мы организуем специальную подготовку сапёров и медицинских подразделений, а также испытаем необходимое им оснащение. Эти части должны передвигаться и действовать вместе с пехотой."
 HSM_ERI_arsenal_workshops:0 "Расширить арсенал"
 HSM_ERI_arsenal_workshops_desc:0 "Надёжному арсеналу нужны измерительные инструменты, проверочные стенды и рабочие, знающие своё дело. Новые военные мастерские позволят выпускать и ремонтировать больше вооружения. Артиллерийские испытания помогут согласовать будущие заказы с потребностями армии, которую мы способны содержать."
 HSM_ERI_supply_service:0 "Постоянная служба снабжения"
 HSM_ERI_supply_service_desc:0 "Каждая часть должна знать, откуда придёт следующая поставка и как её запросить. Постоянная служба снабжения введёт единый учёт запасов, графики погрузки и правила обслуживания транспорта. Испытания автомобилей и специального снаряжения помогут применить эти порядки в полевых условиях."
 HSM_ERI_integrated_staff:0 "Слаженная штабная работа"
 HSM_ERI_integrated_staff_desc:0 "Пехотные командиры, сапёры, медики и интенданты должны готовиться к одной и той же операции. Совместные учения покажут, как согласуются их действия и где приказы перестают доходить до нужных частей. Общая система штабной работы сохранит этот опыт для следующей мобилизации."

 HSM_ERI_DEV_reconstruction_service:0 "Бюро восстановления"
 HSM_ERI_DEV_reconstruction_service_desc:0 "Недавно созданное бюро согласует обследования, поставки материалов и работу ремонтных бригад. Общий план помогает направлять ограниченные средства туда, где они нужнее всего."
 HSM_ERI_DEV_public_services:0 "Налаженные местные службы"
 HSM_ERI_DEV_public_services_desc:0 "Регулярные осмотры и надёжные ремонтные бригады поддерживают колодцы, лечебницы и общественные здания в рабочем состоянии. Местные службы устраняют повседневные неполадки до того, как они станут бедствием."
 HSM_ERI_DEV_workshop_standards:0 "Общие производственные стандарты"
 HSM_ERI_DEV_workshop_standards_desc:0 "Единые меры, проверки и подготовка подмастерьев позволяют небольшим мастерским выполнять крупные заказы с меньшим числом дорогостоящих ошибок."
 HSM_ERI_DEV_veteran_placements:0 "Ветераны за мирным трудом"
 HSM_ERI_DEV_veteran_placements_desc:0 "Новая программа трудоустройства помогает бывшим солдатам освоить подходящее ремесло. Их практический опыт полезен в мастерских, а желающие ветераны передают свои навыки новобранцам."
 HSM_ERI_DEV_technical_education:0 "Практическое образование"
 HSM_ERI_DEV_technical_education_desc:0 "Педагогические курсы и доступные занятия дают большему числу учеников основу для технического образования. Исследователи получают всё больше подготовленных помощников."
 HSM_ERI_DEV_officer_corps:0 "Подготовленный офицерский корпус"
 HSM_ERI_DEV_officer_corps_desc:0 "Регулярные курсы и полевые учения дают офицерам общий подход к подготовке, управлению и командованию."
 HSM_ERI_DEV_supply_service:0 "Постоянная служба снабжения"
 HSM_ERI_DEV_supply_service_desc:0 "Точный учёт запасов и надёжные графики перевозок сокращают потери и облегчают снабжение войск в полевых условиях."
 HSM_ERI_DEV_integrated_staff:0 "Единая штабная система"
 HSM_ERI_DEV_integrated_staff_desc:0 "Командиры и специальные службы планируют действия вместе, проверяют свои методы на совместных учениях и передают накопленный опыт через регулярную подготовку."

 HSM_ERI_DEV_construction_bonus:0 "Инженерные обследования округов"
 HSM_ERI_DEV_industry_bonus:0 "Исследования училища и мастерских"
 HSM_ERI_DEV_electronics_bonus:0 "Практические занятия по электротехнике"
 HSM_ERI_DEV_infantry_bonus:0 "Испытания пехотного снаряжения"
 HSM_ERI_DEV_engineers_bonus:0 "Курсы полевых инженеров"
 HSM_ERI_DEV_medical_bonus:0 "Курсы полевой медицины"
 HSM_ERI_DEV_artillery_bonus:0 "Артиллерийские испытания арсенала"
 HSM_ERI_DEV_logistics_bonus:0 "Испытания службы снабжения"
 HSM_ERI_DEV_motorization_bonus:0 "Испытания и обслуживание транспорта"
 HSM_ERI_DEV_support_bonus:0 "Совместные учения служб обеспечения"
 HSM_ERI_public_libraries:0 "Книги за школьным порогом"
 HSM_ERI_public_libraries_desc:0 "Учёба не должна заканчиваться вместе со школой. В общественных читальнях можно будет брать практические руководства, газеты и рассказы, а разъездные библиотекари доставят книги в селения, которым пока не по силам собственное собрание."
 HSM_ERI_universal_schooling:0 "Место для каждого ученика"
 HSM_ERI_universal_schooling_desc:0 "Школа становится общей лишь тогда, когда открыта для каждой семьи. Учителя и окружные служащие договорятся с родителями и работодателями о возвращении детей за парты. Вечерние занятия примут и тех, чьё детство прошло без школьных книг."
 HSM_ERI_district_housing:0 "Достойное жильё"
 HSM_ERI_district_housing_desc:0 "Тесные комнаты и протекающие крыши съедают заработок, который должен обеспечивать семью. Окружные строители отремонтируют наёмное жильё и подготовят доступные дома рядом с мастерскими. Жильцы смогут требовать ремонта, не опасаясь выселения."
 HSM_ERI_social_insurance:0 "Опора в трудные дни"
 HSM_ERI_social_insurance_desc:0 "Болезнь или травма не должны отправлять семью трудящегося в богадельню. Взносы работников, нанимателей и казны поддержат страховую кассу, чьи местные отделения будут вовремя оплачивать обоснованные требования и открыто отчитываться о расходах."
 HSM_ERI_rural_credit:0 "Кредит для села"
 HSM_ERI_rural_credit_desc:0 "Земледельцам и сельским ремесленникам нужны займы, которые можно вернуть честным трудом. Местные кредитные товарищества разделят риски и опубликуют условия, чтобы срочная нужда в деньгах не оборачивалась пожизненной зависимостью."
 HSM_ERI_public_utilities:0 "Вода, свет и городское хозяйство"
 HSM_ERI_public_utilities_desc:0 "Растущим городам нужны надёжное водоснабжение, освещение и транспорт. Инженеры и выборные представители округов согласуют требования к службам, расширят сети и подготовят бригады, которым предстоит поддерживать их в любое время года."
 HSM_ERI_lasting_prosperity:0 "Благополучие в каждом доме"
 HSM_ERI_lasting_prosperity_desc:0 "Восстановление должно наконец дойти до семей, оставшихся в стороне. Надёжное жильё, постоянная работа и исправные службы станут привычной частью жизни. Местные власти ответят за то, чтобы благополучие не ограничивалось самыми оживлёнными улицами."
