l_russian:
 HSM_ERI_cost_of_feud:0 "Цена нашего наследства"
 HSM_ERI_cost_of_feud_desc:0 "Винсент Эри унаследовал притязания на Верению, долги поставщикам и границу, где каждый восстановленный мост завтра может стать полем боя. Родословная Иовинуса Эйри обосновывает его права не хуже собственной. Прежде чем выбрать соглашение с кузеном или поход против него, Винсент должен понять, чего каждый путь потребует от страны, которой предстоит за него платить."
 HSM_ERI_hear_petitions:0 "Выслушать живых"
 HSM_ERI_hear_petitions_desc:0 "К прошениям прикладывают купчие, похоронные извещения и счета, которые никто уже не надеется взыскать. Их авторы задают вполне определённые вопросы: когда повозка сможет пересечь границу, кто восстановит мастерскую, где пропавший брат? Публичное слушание не позволит двору легко забыть эти просьбы. Частные приёмы оставят больше свободы при согласовании обязательств."
 HSM_ERI_family_letters:0 "Родство вопреки вражде"
 HSM_ERI_family_letters_desc:0 "Розалин Эри из Бентри и Монтаг Эйри, граф Верении, сохранили личную связь там, где старшие видят лишь соперничающие притязания. Леди Катрина приходится тётей обоим герцогам; семья знает, как обратиться к соседнему двору без ультиматума. Винсент защитит эту возможность, не покупая её обещанием брака. Первые, кому позволят пересечь границу, должны говорить от собственного имени."
 HSM_ERI_offer_armistice:0 "Тишина на границе"
 HSM_ERI_offer_armistice_desc:0 "Жалобы выслушаны, родственники поговорили, гарантии выбраны. Теперь Винсент должен сделать сдержанность приказом, который капитаны не примут за передышку перед новым набегом. Патрули перестанут переходить границу ради чужого скота или старого оскорбления. Перемирие даст домам время для окончательного урегулирования, без годовщины, напоминающей офицерам, что пора возобновлять вражду."
 HSM_ERI_open_roads:0 "Первая повозка через границу"
 HSM_ERI_open_roads_desc:0 "Разобрать заграждение можно за один день. Починить водопропускную трубу, решить спор о пошлине и убедить перевозчика, уже потерявшего три повозки, гораздо сложнее. Пока действует перемирие, инженеры и местные чиновники займутся дорогами на нашей территории. Каждый благополучно завершённый рейс сделает следующее соглашение чуть более убедительным."
 HSM_ERI_reciprocal_guarantees:0 "Цена сдержанности"
 HSM_ERI_reciprocal_guarantees_desc:0 "Просителям мало обещания, что нынешний сезон будет другим. Земледелец спрашивает, кто остановит следующий патруль; разорённая семья хочет знать, кто ответит за прошлый. Выслушав их и восстановив связь между родственниками, Винсент должен подкрепить мир собственными обязательствами. Совместные патрули поставят его офицеров под наблюдение. Фонд возмещения заставит двор признать ущерб, нанесённый от его имени. Нельзя требовать уступок, отказываясь самому нести хоть какие-то издержки."
 HSM_ERI_friendship_treaty:0 "Договор о дружбе"
 HSM_ERI_friendship_treaty_desc:0 "Открытая переправа дала обоим дворам то, чего не могли дать родословные: пример жизни без вражды. Договор закрепит этот опыт. Винсент и Иовинус откажутся от притязаний на земли друг друга и отменят порядки, питавшие распрю. Ни один не получит покорности побеждённого кузена. Каждый получит соседа, чья независимость больше не считается незаконченной войной."
 HSM_ERI_mandate_for_peace:0 "Кто выступит на конгрессе?"
 HSM_ERI_mandate_for_peace_desc:0 "Двор может назначить делегатов, безупречно знающих титулы и порядок старшинства. Города и общины могут прислать представителей, знающих, какому мосту всё ещё нужны доски. Их участие потребует политических усилий и усложнит переговоры, зато равноправный совет сможет заниматься общими нуждами, выходящими за пределы соглашения двух династий."
 HSM_ERI_invite_avian:0 "Сближение через Intergigantes"
 HSM_ERI_invite_avian_desc:0 "Совет Катрины решил действовать между гигантами, а не закрыть двери. Предложим договор, превращающий сотрудничество в первый шаг к общей стране. Городские хартии и коллегии Авиана должны найти место в будущем устройстве. Первая подпись открывает эту работу; передать суверенитет сможет лишь отдельный акт о присоединении."
 HSM_ERI_common_statute:0 "Хартия согласованных полномочий"
 HSM_ERI_common_statute_desc:0 "Договор успокоил границу, но ещё не определил, кто будет отвечать за общий суд, совместные мастерские и следующий спор между домами. Делегаты назначены, Авиану предложено место; Винсенту пора представить конгрессу устройство будущего союза. Равноправный совет даёт участникам одинаковый голос. Ограниченное председательство герцога обещает преемственность, но требует от кузена признать особое место за Винсентом. Мир уже существует. Осталось решить, что на нём построить."
 HSM_ERI_joint_staff:0 "Приказы, понятные соседу"
 HSM_ERI_joint_staff_desc:0 "Интенданты обнаружили, что записывают одни и те же недостачи в несовместимых ведомостях. Общий штаб соберёт отчёты, карты и планы учений за одним столом. Офицерам придётся научиться просить другой дом о сотрудничестве, не принимая подпись коллеги за право распоряжаться его войсками."
 HSM_ERI_shared_services:0 "Стандарты по обе стороны границы"
 HSM_ERI_shared_services_desc:0 "Запасная деталь должна подходить независимо от того, какой дом её оплатил. Инженеры сравнят чертежи, проверят чужие измерения и вернут спорные изделия в мастерские. Общим техническим ведомствам предстоит заслужить авторитет у верстака, где печать не скроет плохо нарезанную резьбу."
 HSM_ERI_first_judgement:0 "Решение против герцога"
 HSM_ERI_first_judgement_desc:0 "В общий суд поступил иск об имении, обещанном одному из ветеранов и покровителей Винсента. Законные владельцы принадлежат к семье, разделённой прежними линиями фронта. Их документы убедительны. Хартия мало чего стоит, если судебное решение не может затронуть того, кому герцог лично дал слово."
 HSM_ERI_common_defence:0 "Договориться о совместной защите"
 HSM_ERI_common_defence_desc:0 "Штабное сотрудничество помогает подготовить оборону, но обязательства военного союза требуют отдельного согласия. Мы разработаем методы обеспечения войск и предложим Эйри оборонительное партнёрство, если прежние обязательства это позволяют. Дом Авиан, если он присоединился к хартии, получит собственное приглашение. Каждый участник должен сам принять новые обязанности."
 HSM_ERI_keep_our_word:0 "Завершить обещанное"
 HSM_ERI_keep_our_word_desc:0 "Первые просители говорили о заработке и жилье, а не о конституционных схемах. Нам предстоит завершить обещанные работы и наладить новое гражданское производство там, где мы по-прежнему владеем и управляем своей землёй. Тогда программу обязательств можно будет закрыть. Люди, просившие герцога о помощи, заслужили нечто более весомое, чем копию хартии."
 HSM_ERI_generation_without_feud:0 "Поколение без вражды"
 HSM_ERI_generation_without_feud_desc:0 "О союзе будут судить по тому, что станет обыденным: исполненное решение суда, доставленный груз, спор, разрешённый без призыва резервистов. Винсент не забыл о наследстве. Он узнаёт, какой становится власть, когда другие признают её полномочия и могут потребовать исполнения данного слова. Пусть именно такой порядок достанется следующему поколению."
 HSM_ERI_peace_without_union:0 "Страна, которую мы можем восстановить"
 HSM_ERI_peace_without_union_desc:0 "Общее урегулирование сорвалось: на первых гарантиях или на последней статье хартии. Отказ нельзя отменить своей подписью, а исчезнувшее правительство соседа не исполнит обещаний прежнего правителя. Винсент всё ещё может сдержать собственное слово: школы, мастерские и дороги не станут ждать нового конгресса. Сохранившиеся соглашения будут соблюдены; незаключённые не будут выдуманы. Мы выбрали переговоры, а не вторжение, отложенное до неудобного ответа."

 HSM_VER_petition_commitments:0 "Обещания, внесённые в реестр"
 HSM_VER_petition_commitments_desc:0 "Герцог публично выслушал просителей. Их надежды укрепляют спокойствие в стране, но исполнение обещаний требует гражданских ресурсов, которые нельзя бесконечно направлять на другие цели. Реестр останется открытым до завершения работ или закрытия программы в рамках самостоятельного мирного урегулирования."
 HSM_VER_frontier_inspections:0 "Совместные пограничные инспекции"
 HSM_VER_frontier_inspections_desc:0 "Смешанные патрули объединяют офицеров обоих домов на одной границе. Ни одно командование не может отмахнуться от происшествия лишь потому, что о нём сообщил сосед. Сопровождение, разбирательства и жалобы требуют постоянного внимания обоих дворов. Этот порядок действует при перемирии и прекращается с заменой его постоянным договором либо с прекращением самого перемирия. Присутствие проверяющего не даёт прав на чужую землю."
 HSM_VER_peace_dividend:0 "Дороги, которые стоит чинить"
 HSM_VER_peace_dividend_desc:0 "Договор позволил инженерам и железнодорожным строителям планировать дальше следующей тревоги. Развитие инфраструктуры и железных дорог идёт быстрее, пока оба дома независимы и соблюдают мир. Эти преимущества основаны на договоре о дружбе и сохраняются даже при разногласиях вокруг хартии."
 HSM_VER_common_courts:0 "Общие суды"
 HSM_VER_common_courts_desc:0 "Хартия устанавливает согласованный порядок разрешения споров между домами. Соблюдение процедуры ограничивает свободу политического манёвра, зато решения, обязательные для обоих дворов, делают жизнь предсказуемее. Эти преимущества требуют независимости участников, действующей хартии и уважения к судебным постановлениям."
 HSM_VER_limited_presidency:0 "Председательство в пределах хартии"
 HSM_VER_limited_presidency_desc:0 "Винсент ведёт согласованные дела совета в пределах полномочий, предоставленных участниками. Должность укрепляет устойчивость и авторитет управления, но не даёт власти над Эйри или наследственного права повелевать его правителем. Этот порядок заменяет обычную систему общих судов; его преимущества приостанавливаются при нарушении хартии."
 HSM_VER_public_council:0 "Общественный совет"
 HSM_VER_public_council_desc:0 "Представители городов и общин участвуют в равноправном совете, включая местные нужды в общую повестку. Их контроль замедляет накопление политической власти, зато доверие и согласованные гражданские работы укрепляют стабильность и ускоряют строительство. Совет заменяет обычную систему общих судов; его преимущества требуют соблюдения хартии самими правителями."
 HSM_VER_joint_staff:0 "Совместный штаб планирования"
 HSM_VER_joint_staff_desc:0 "Офицеры участвующих домов согласуют расчёты снабжения и оперативные планы. Совместимые процедуры улучшают организацию и снижают расход припасов, сохраняя самостоятельность национальных армий. Преимущества штаба исчезают при приостановке хартии или нарушении условий её действия."
 HSM_VER_shared_services:0 "Общие технические службы"
 HSM_VER_shared_services_desc:0 "Единые спецификации, доступные технические архивы и регулярный обмен опытом между мастерскими повышают выпуск продукции и темпы роста эффективности производства. Службы работают на независимых участников совместно. Их преимущества зависят от действующей хартии."
 HSM_VER_ducal_exception:0 "Герцогское исключение"
 HSM_VER_ducal_exception_desc:0 "Винсент поставил личное обещание выше решения общего суда. Его непосредственная свобода действий выросла, но доверие к его слову пошатнулось. Все преимущества хартии приостановлены до отмены исключения и исполнения решения. Договор о дружбе сохраняет силу, пока соблюдаются его собственные условия."

 HSM_VER_diplomatic_business:0 "Обязательства мира"
 HSM_VER_diplomatic_business_desc:0 "Урегулирование проходит проверку после конгресса: пленные должны вернуться домой, судебное решение должно затронуть влиятельного покровителя, а военное обязательство требует согласия партнёра. Это дела, которые нужно довести до конца, а не поводы начинать переговоры заново. Даже если об общих учреждениях договориться не удалось, дома остаётся незавершённая работа."
 HSM_VER_reopen_armistice:0 "Условия спокойной границы"
 HSM_VER_reopen_armistice_desc:0 "Пограничный приказ должен связывать наших офицеров столь же твёрдо, как офицеров другого дома. Допуск проверяющих и рассмотрение жалоб относятся к условиям перемирия; ещё один посланник не заменит решения по существу."
 HSM_VER_renew_armistice:0 "Патрули соблюдают дистанцию"
 HSM_VER_renew_armistice_desc:0 "Стража привыкла сначала сообщать о происшествии, а не отвечать на него набегом. Чтобы сохранить эту сдержанность, на каждом посту должны понимать действующий приказ. Границе нужно надёжное правило, а не дата, с которой вражда снова станет допустимой."
 HSM_VER_reopen_treaty:0 "Разобрать оставшиеся притязания"
 HSM_VER_reopen_treaty_desc:0 "Постоянное урегулирование касается земель и хозяйств, которые переживут любой патруль. Домам предстоит отличить частные требования возмещения от притязания герцога управлять соседом."
 HSM_VER_return_to_congress:0 "Пределы общей власти"
 HSM_VER_return_to_congress_desc:0 "Договор о дружбе и общая власть требуют разных обязательств. Хартия должна определить полномочия, приемлемые обоим домам. Без такого согласия договор может действовать самостоятельно, а каждое правительство отвечает за собственную страну."
 HSM_VER_invite_avian_again:0 "Место Авиана среди домов"
 HSM_VER_invite_avian_again_desc:0 "Наблюдатель вправе оспаривать положения хартии, не становясь её участником. Участие Авиана зависит от его собственного решения; пустое кресло не отменяет уже принятых обязательств Эри и Эйри."
 HSM_VER_obey_judgement:0 "Отменить исключение и исполнить решение"
 HSM_VER_obey_judgement_desc:0 "Решение суда остаётся в реестре, а лишённая имущества семья всё ещё не получила ответа, которым могла бы воспользоваться. Винсент отзовёт исключение и встретится с покровителем, считавшим, что военное обещание избавляет его от обычного разбирательства. Общие ведомства должны увидеть герцогскую печать под распоряжением, возвращающим суду его власть."
 HSM_VER_exchange_prisoners:0 "Предложить обмен пленными"
 HSM_VER_exchange_prisoners_desc:0 "В списках пленных по пятьсот имён от каждого дома; за многими стоят годы оставшихся без ответа семейных писем. Наши писари сверят их с записями Эйри и договорятся о встрече у переправы. Правительства должны согласовать освобождение, а семьи заслуживают даты, которой смогут верить."
 HSM_VER_propose_defence:0 "Вновь предложить оборонительный союз"
 HSM_VER_propose_defence_desc:0 "Подготовительная работа остаётся полезной, хотя союз пока не заключён. Когда обязательства обоих домов позволят, предложим Эйри вернуться к вопросу общей обороны. Согласие создаст военное партнёрство; отказ оставит хартию в силе."

 HSM_VER_armistice_offer_tt:0 "Предлагает Эйри перемирие. Эйри может подписать его, потребовать совместных проверок или отказать. Договорное урегулирование действует до войны или договора о дружбе; временное перемирие вне этого пути длится 365 дней."
 HSM_VER_guarantees_tt:0 "Созывает пограничную конференцию для обсуждения совместных проверок или фонда возмещения. Подготовка гарантий не заключает перемирие; другой дом может потребовать новых условий или отказать."
 HSM_VER_treaty_offer_tt:0 "Предлагает Эйри дружбу. Эйри может подписать договор, потребовать имущественного арбитража или отказать. Ратификация прекращает соперничество, проверки и взаимные территориальные притязания; оба дома сохраняют независимость."
 HSM_VER_avian_offer_tt:0 "Приглашает дом Авиан на конгресс в качестве §Yнаблюдателя§!. Авиан самостоятельно решает, присутствовать ли на переговорах и присоединяться ли затем к ратифицированной хартии. Соглашение Эри и Эйри возможно без его участия."
 HSM_VER_charter_offer_tt:0 "Предлагает равноправный совет или ограниченное председательство герцога. Эйри может согласиться, потребовать равноправия или отказать. Согласованные условия учреждают хартию; при равноправии гражданские делегаты могут образовать общественный совет."
 HSM_VER_defence_offer_tt:0 "Предлагает военный союз, если действующие обязательства допускают его создание. Получатель вправе отказать. Вступление Авиана требует отдельного согласия."
 HSM_VER_charter_suspended_tt:0 "§RВсе преимущества хартии приостановлены§!: её учреждения, совместный штаб и общие технические службы. Договор о дружбе и его строительные преимущества сохраняются при соблюдении их условий. Эри может восстановить хартию, отменив исключение и исполнив решение суда."
 HSM_VER_common_standards_bonus:0 "Общие промышленные спецификации"
 HSM_VER_defence_bonus:0 "Совместное планирование обеспечения"
 HSM_VER_peaceful_development_bonus:0 "Строительство после вражды"
 HSM_VER_defensive_league:0 "Оборонительный союз Верении"
 HSM_VER_keep_equal_union:0 "Наше сотрудничество основано на равноправии домов."

 hsm_verenia.1.t:0 "Наследство на столе"
 hsm_verenia.1.d:0 "Винсент велел сначала принести счета, а уже потом карту. Управляющий разложил ведомости отложенного ремонта дорог, закупок зерна по чрезвычайным ценам и пособий семьям, сыновья которых больше не возвращались домой. Рядом легла родословная, обосновывавшая права герцога на Верению.\n\nОснования были вескими. У Иовинуса Эйри они были ничуть не хуже. Дом Эри происходил от дома Эйри; леди Катрина приходилась тётей обоим соперникам. Самое внимательное изучение предков не могло заставить второго племянника исчезнуть.\n\nВинсент положил коготь на карту. Он по-прежнему хотел получить наследство, которое считал своим. Но обладание каждой разорённой деревней едва ли оправдало бы годы, потраченные на их разорение. Герцог приказал оставить счета на виду у советников. Завтра им предстояло обсудить, чего мирное соглашение потребует от тех, кто поставит под ним свои подписи."
 hsm_verenia.1.a:0 "Выясним, что мы задолжали этой стране."
 hsm_verenia.2.t:0 "Скамья для просителей"
 hsm_verenia.2.d:0 "Столяр принёс сломанную дверную петлю. Она осталась от мастерской, сгоревшей во время набега. Он взял её с собой, потому что на три письменных прошения получил три уведомления о приёме. За ним ждали перевозчик, чей маршрут теперь обрывался у заграждения, и женщина с двумя противоречащими друг другу извещениями о пленном брате.\n\nКамергер предложил частные аудиенции. Обстоятельства можно проверить без огласки, а трудные обещания не обязательно превращать в публичные обязательства. Сидевший рядом писарь уже раскрыл реестр, оставив место для свидетелей и срока ответа.\n\nГерцог мог выслушать всех перед собравшимся двором, приняв гражданские расходы программы, за исполнением которой будут следить другие. Или заплатить политическую цену закрытых переговоров и поручить своему двору разбирать каждое дело отдельно. В любом случае столяр хотел получить ответ прежде, чем отправится домой."
 hsm_verenia.2.a:0 "Откройте реестр. Выслушаем их при свидетелях."
 hsm_verenia.2.b:0 "Устроим частные приёмы и разберём каждый иск."
 hsm_verenia.3.t:0 "Письмо без брачного договора"
 hsm_verenia.3.d:0 "Розалин Эри из Бентри дождалась, пока секретарь закончит читать официальную переписку. Затем положила рядом с бумагами Винсента другое, гораздо более короткое письмо. Монтаг Эйри, граф Верении, спрашивал, наступит ли время, когда поездка между домами потребует меньше приготовлений, чем военная экспедиция.\n\nИх взаимный интерес едва ли нуждался в изобретательности канцелярии. Оба принадлежали к знатным родам и уже имели достаточно обязанностей. Розалин не собиралась позволять ретивому писарю превращать дружескую переписку в брачный договор ради красивого известия о примирении.\n\nВинсент прочитал письмо дважды. Его тётя Катрина была тётей и Иовинусу, однако много лет семья заставляла родство служить ссоре. Теперь можно было позволить ему послужить разговору. Розалин просила обеспечить безопасную доставку ответа и дать ей написать его самой. Герцог вернул письмо, не продиктовав ни строчки."
 hsm_verenia.3.a:0 "Пусть говорят собственными голосами."
 hsm_verenia.4.t:0 "Повозка у переправы"
 hsm_verenia.4.d:0 "Первый перевозчик на открытой дороге остановился перед пустыми гнёздами убранного шлагбаума. Он вёз муку, две запасные оси и старое разрешение с печатью, которую никто из дежурных теперь не хотел признавать. Офицер изучал бумагу, пока рабочие стояли рядом с лопатами.\n\nНаконец писарь принёс новые инструкции. Оси требовалось взвесить, муку следовало внести в ведомость. Для этого не нужно было искать в мешках спрятавшихся солдат. К полудню повозка снова тронулась, осторожно переезжая через водосток, который дорожная бригада чинила всё утро.\n\nИз своей кареты Винсент наблюдал, как возница проверяет ход колёс на твёрдом участке. Никто не приветствовал его криками. Остальные просто начали доставать бумаги и выстраиваться в очередь. Герцог слышал и более торжественные выражения доверия. Это обязывало его обеспечить открытый проезд и на следующий день."
 hsm_verenia.4.a:0 "Проследите, чтобы завтра здесь было так же спокойно."

 hsm_verenia.20.t:0 "Приказы о прекращении набегов"
 hsm_verenia.20.d:0 "Посланники Эри привезли согласованные приказы о прекращении набегов. Иовинус изучает ограничения для пограничных патрулей прежде подписей: он знает, как легко честолюбивый офицер принимает молчание за разрешение. Предложенное перемирие даст домам возможность подготовить постоянное урегулирование. Мы можем согласиться, потребовать совместных проверок или отказать. Обязательства Винсента не освобождают нас от ответственности за собственную границу."
 hsm_verenia.20.a:0 "Отдать встречные приказы. Принять перемирие."
 hsm_verenia.20.b:0 "Потребовать совместных проверок на границе."
 hsm_verenia.20.c:0 "Этих заверений недостаточно. Отказать."
 hsm_verenia.21.t:0 "Две подписи под актом проверки"
 hsm_verenia.21.d:0 "Иовинус требует, чтобы офицеры обоих домов совместно разбирали предполагаемые нарушения. Капитаны Винсента возражают против чужих вопросов к своим донесениям; такое же право проверять донесения Эйри их мало утешает. Согласие потребует от герцога политических усилий дома и позволит заключить перемирие. Проверки будут действовать при нём до замены постоянным договором или прекращения самого перемирия. Отказ оставит предложение неподписанным."
 hsm_verenia.21.a:0 "Принять взаимные проверки и подписать."
 hsm_verenia.21.b:0 "Мы не можем принять это условие."
 hsm_verenia.22.t:0 "Приказы доходят до границы"
 hsm_verenia.22.d:0 "Подписанные приказы поступили в оба штаба. Участников пограничных стычек отзывают, а заставы получают распоряжения, запрещающие привычные оправдания для набегов. Личная договорённость герцогов мало помогла бы часовому под дождём. Соперничающие наследственные притязания ещё предстоит разрешить постоянным договором; сегодня ни одно командование не вправе оправдать ими отправку очередного патруля за границу."
 hsm_verenia.22.a:0 "Пусть на границе сохранится тишина."
 hsm_verenia.23.t:0 "Экземпляр без подписи"
 hsm_verenia.23.d:0 "Посланник Эйри вернул проект без подписи. За столом совета требуют, чтобы Винсент ответил на отказ войсками. Герцог обещал иной путь. Объявлять о перемирии нельзя, границу придётся охранять. Но деньги и рабочие руки, выделенные на восстановление, не обязаны ждать, пока Иовинус передумает. Слушания дома породили обязательства, которые не отменяются отказом чужого двора."
 hsm_verenia.23.a:0 "Наша страна не может зависеть от этого ответа."
 hsm_verenia.24.t:0 "Имена в обоих списках"
 hsm_verenia.24.d:0 "Делегация Эри привезла список пятисот пленных, которых готова освободить в обмен на такое же число наших заключённых. Писарь узнаёт имена из прошений, всё ещё лежащих в его ящике. Офицеры требуют проверить списки и провести обмен одновременно, под наблюдением. Мы можем разрешить взаимное возвращение или отказать. Сам проект соглашения не открывает ни одной тюремной двери."
 hsm_verenia.24.a:0 "Проверить списки и вернуть пленных."
 hsm_verenia.24.b:0 "Мы не разрешим этот обмен."
 hsm_verenia.25.t:0 "Пятьсот мест за домашним столом"
 hsm_verenia.25.d:0 "На переправе каждое имя называли дважды: сначала сверяясь со списком, затем ожидая живого ответа. Пятьсот человек направились к Эри, столько же вернулись к Эйри. Одни семьи принесли одежду, другие еду, о которой все тут же забыли. Последние подписи подтверждали завершение обмена. Они ничего не могли сказать о годах, которые ушли на его устройство."
 hsm_verenia.25.a:0 "Вычеркните их из списков пропавших."
 hsm_verenia.29.t:0 "Предложение о перемирии истекло"
 hsm_verenia.29.d:0 "Посланники вернулись без подписанного перемирия. На границе стража продолжает исполнять действительно действующие распоряжения: предложение так и не стало приказом. Совету предстоит решить, что он способен сделать без общего урегулирования. Дороги, школы и мастерские не теряют значения оттого, что встреча закончилась неудачей."
 hsm_verenia.29.a:0 "Закрыть конференцию. Исполнить обещанное дома."

 hsm_verenia.30.t:0 "Конец вражды?"
 hsm_verenia.30.d:0 "Винсент предлагает договор о дружбе, прекращающий соперничество и взаимные территориальные притязания. Иовинус видит пользу для дорог, рынков и измученных деревень. Советники вспоминают купчие, владельцы которых бежали через прежнюю линию фронта. Мы можем принять взаимное урегулирование, потребовать согласованного имущественного арбитража или сохранить только действующие договорённости. Ни один вариант не передаёт наше управление дому Эри."
 hsm_verenia.30.a:0 "Ратифицировать взаимное урегулирование."
 hsm_verenia.30.b:0 "Сначала гарантировать разбор имущественных споров."
 hsm_verenia.30.c:0 "Мы пока не готовы подписать этот договор."
 hsm_verenia.31.t:0 "Что делать со старыми купчими?"
 hsm_verenia.31.d:0 "Эйри подпишет договор, если имущественные споры получат согласованный порядок рассмотрения. Несколько сторонников Винсента обеспокоены: их военные награды расположены на земле, которую другие семьи продолжают считать своей. Согласие потребует обеспечить работу комиссии и потратить политическое влияние, признав пределы герцогского покровительства. Отказ сохранит свободу действий, но лишит нас этой возможности заключить договор. Иовинус дал определённый ответ и ждёт такого же."
 hsm_verenia.31.a:0 "Обеспечить работу арбитража и ратифицировать."
 hsm_verenia.31.b:0 "Такие условия для нас неприемлемы."
 hsm_verenia.32.t:0 "Две печати, два правительства"
 hsm_verenia.32.d:0 "Стороны обменялись экземплярами договора. Каждый дом отказался от территориальных притязаний к другому и официальной враждебности, делавшей любые переговоры исключением. Инженеры могут увереннее планировать дороги и железнодорожные работы. Печать Винсента стоит рядом с печатью Иовинуса, на одной высоте. Договор завершает вражду взаимными обязательствами; для создания общих органов управления понадобится новое обсуждение и новое согласие."
 hsm_verenia.32.a:0 "Пусть мир начнёт оправдывать оказанное доверие."
 hsm_verenia.33.t:0 "Договор возвращён без ратификации"
 hsm_verenia.33.d:0 "Иовинус отклонил договор о дружбе. Советники Винсента кладут отвергнутые статьи рядом с отчётами о восстановленных дорогах. Они не могут объявить соперничество оконченным или приписать другому дому непринятые уступки. Существующее перемирие, если оно есть, сохраняется на собственных условиях. Но восстановление Эри по-прежнему в их силах. Неудача договора не обязывает Винсента отказаться ни от своей страны, ни от обещания не завоёвывать соседа."
 hsm_verenia.33.a:0 "Восстановим то, за что отвечаем сами."
 hsm_verenia.39.t:0 "Договор без ратификации"
 hsm_verenia.39.d:0 "Конференция завершилась без ратификации договора. Соперничество и спорные территориальные притязания не исчезли. Сохранившиеся прежние соглашения следует соблюдать на их собственных условиях; оставшийся без ответа проект ничего к ним не добавляет. Делегация возвращается с полезными разработками для дорог и строительства, но без права говорить за другой дом. С этого честного признания и начнётся восстановление дома."
 hsm_verenia.39.a:0 "Не называйте проект договором."

 hsm_verenia.40.t:0 "Место для городов"
 hsm_verenia.40.d:0 "Список делегатов, составленный камергером, был безупречен. Каждый придворный занимал положенное место, каждый советник носил титул, достаточно длинный для заполнения полей. Писарь, ведший реестр прошений, спросил, где будет сидеть представитель перевозчиков. Для него места не предусмотрели.\n\nВинсент мог назначить гражданских делегатов от городов и общин вместе с придворными переговорщиками. Их поручения касались бы дорог, мастерских и отчётности о расходах. Согласование интересов потребовало бы политических усилий; равноправный совет с их участием должен был бы уделять гражданским работам серьёзное внимание. Ограниченное председательство герцога, напротив, сосредоточило бы руководство в его должности.\n\nПридворная делегация обещала более тихий торг и меньше соперничающих требований. Ни один список не менял чьих-либо убеждений за одну ночь. Выбор был практическим: кто сможет внести вопрос в повестку, кто будет обязан ответить и чьё отсутствие герцог готов оправдывать."
 hsm_verenia.40.a:0 "Найти места для гражданских делегатов."
 hsm_verenia.40.b:0 "Поручить переговоры представителям двора."

 hsm_verenia.50.t:0 "Место наблюдателя на конгрессе"
 hsm_verenia.50.d:0 "Эри и Эйри заключили мир и приглашают дом Авиан наблюдать за конгрессом. Катрина знает гордость обоих племянников и понимает, сколько терпеливой работы может уничтожить неосторожная фраза. Наше присутствие поможет обсудить спорные статьи и оценить предлагаемые учреждения. Участие в заседаниях не означает подписания хартии. Мы можем принять эту ограниченную роль или оставить двум домам их собственные дела."
 hsm_verenia.50.a:0 "Отправить наблюдателей с поручением выслушать стороны."
 hsm_verenia.50.b:0 "Наш дом останется за пределами переговоров."
 hsm_verenia.51.t:0 "Авиан примет участие"
 hsm_verenia.51.d:0 "Дом Авиан согласился присутствовать в качестве наблюдателя. Секретарь добавляет делегацию в план рассадки и спрашивает, какие бумаги ей передать. Винсент велит приложить спорные статьи к уже согласованным. Наблюдатель, которому показывают только торжественный экземпляр, мало чем поможет. Решение о членстве остаётся за Авианом: его следует принимать по действительным условиям хартии, после знакомства со всеми обязательствами."
 hsm_verenia.51.a:0 "Передайте им рабочие документы."
 hsm_verenia.52.t:0 "Третье место остаётся пустым"
 hsm_verenia.52.d:0 "Дом Авиан отклонил приглашение. Некоторые придворные рассчитывали, что знакомый голос смягчит трудные разговоры; теперь посланникам придётся справляться самим. Договор Эри и Эйри сохраняет силу, а конгресс может продолжаться с двумя делегациями. Мы предложили соседу участие. Его решение остаться в стороне не отменяет того, что уже решили и приняли на себя другие дома."
 hsm_verenia.52.a:0 "Продолжить переговоры с Эйри."
 hsm_verenia.59.t:0 "Наблюдатель не прибыл"
 hsm_verenia.59.d:0 "Наблюдатель дома Авиан не прибыл. Секретарь убирает предварительно отведённое место и передаёт спорные статьи двум присутствующим делегациям. Молчание Авиана не означает согласия и не оправдывает незавершённую работу. Эри и Эйри должны сами определить полномочия, которыми готовы поделиться, не присваивая голос третьего дома."
 hsm_verenia.59.a:0 "Продолжать с присутствующими делегациями."

 hsm_verenia.60.t:0 "Кто займёт председательское место?"
 hsm_verenia.60.d:0 "В проекте хартии не решён вопрос руководства советом. Равноправное устройство позволит гражданским делегатам, если они назначены, усилить внимание к местным нуждам ценой политической свободы действий. Винсент может предложить ограниченное председательство герцога, укрепляющее авторитет и устойчивость управления. Эта должность не даёт власти над Эйри или наследственного права приказывать его правителю. Любой вариант требует согласия Эйри."
 hsm_verenia.60.a:0 "Равноправный совет с назначенными делегатами."
 hsm_verenia.60.b:0 "Председательство герцога в пределах хартии."
 hsm_verenia.61.t:0 "Проект общей хартии"
 hsm_verenia.61.d:0 "Делегация Эри предлагает равноправный совет и общие учреждения с согласованными полномочиями. Советники Иовинуса разбирают проект по статьям: юрисдикция, совместные дела, обязанности каждого участника. Хартия сделает сотрудничество прочнее, сохраняя наше правительство. Мы вправе ратифицировать её или решить, что договор о дружбе уже обозначил предел партнёрства, которое наш дом готов принять на себя."
 hsm_verenia.61.ducal.d:0 "Винсент просит председательствовать в общем совете в пределах хартии. Эта должность не даст ему власти над Эйри, однако Иовинус сомневается, что будущие споры о полномочиях всегда разрешатся легко. Мы можем принять ограниченное председательство, потребовать равноправного совета или отвергнуть хартию. Существующий мир не обязывает нас одобрять конституционное устройство, предпочитаемое домом Эри."
 hsm_verenia.61.a:0 "Ратифицировать хартию на этих условиях."
 hsm_verenia.61.b:0 "Мы подпишем её при равноправном совете."
 hsm_verenia.61.c:0 "Сохранить договор, отклонить хартию."
 hsm_verenia.62.t:0 "Встречное предложение Иовинуса"
 hsm_verenia.62.d:0 "Эйри присоединится к хартии при равноправном совете. Посланники вычеркнули герцогское председательство, оставив общие учреждения. Винсент изучает поправку дольше любой другой статьи. Он может принять союз, в котором наследственные притязания не дают особого кресла, или завершить конгресс без хартии. Иовинус предложил сотрудничество на условиях, которые готов соблюдать сам, и теперь ожидает ответа."
 hsm_verenia.62.a:0 "Принять равноправный совет и ратифицировать."
 hsm_verenia.62.b:0 "О таком устройстве мы договориться не можем."
 hsm_verenia.63.t:0 "Собственная подпись Авиана"
 hsm_verenia.63.d:0 "Два дома ратифицировали хартию. Наблюдая за переговорами, Авиан видел компромиссы за окончательным текстом и теперь должен решить, примет ли те же обязанности. Вступление даст место в общих учреждениях и доступ к уже созданным службам, одновременно связывая нас их ограничениями. Мы можем подписать документ как третий независимый участник или оставить соглашение нынешним членам."
 hsm_verenia.63.a:0 "Присоединиться на равных, сохраняя независимость."
 hsm_verenia.63.b:0 "Завершить наблюдение без вступления."
 hsm_verenia.64.t:0 "Хартия вступает в силу"
 hsm_verenia.64.d:0 "Эри и Эйри обменялись ратифицированными экземплярами хартии. Писари распределяют первые дела, заводят архив совета и ищут помещения для совместной работы. Согласованные учреждения начинают действовать; другие формы сотрудничества появятся по мере создания. Участие Авиана потребует его собственного согласия. Двух подписей уже достаточно, чтобы связать обязательствами два правительства, которые поставили их на этой странице."
 hsm_verenia.64.a:0 "Пусть согласованные учреждения приступают к работе."
 hsm_verenia.65.t:0 "Мир пережил конгресс"
 hsm_verenia.65.d:0 "Эйри отказался от общей хартии. Его посланники подтверждают действие договора о дружбе, но ни одна делегация не может обещать общий совет. Винсенту предстоит признать разницу между сохранением мира и получением всего, чего он от мира хотел. Конгресс окончен. Дома по-прежнему ждут работ, обещанных ещё до того, как делегатам распределили места."
 hsm_verenia.65.a:0 "Соблюдать договор, который удалось заключить."
 hsm_verenia.69.t:0 "Конгресс завершает заседания"
 hsm_verenia.69.d:0 "Последнее заседание завершилось без согласованной хартии. Ни общий суд, ни совет не могут выводить полномочия из незаконченного текста. Прежний договор, если он сохраняет силу, остаётся обязательным на собственных условиях. Делегации уезжают порознь; каждая отвечает за то, что может выполнить её правительство. Неудача общей власти не должна становиться поводом для войны следующего поколения."
 hsm_verenia.69.a:0 "Сохранить мир и протоколы переговоров."

 hsm_verenia.70.t:0 "Имение, обещанное Винсентом"
 hsm_verenia.70.d:0 "Ветеран поднялся при появлении Винсента. Когда-то он привёл людей и вложил деньги в дело Эри; взамен герцог обещал ему имение. Он починил крышу и рассчитался с работниками. Теперь семья, родственники которой оказались по разные стороны прежнего фронта, предъявила купчие.\n\nОбщий суд выслушал обе стороны. Имение следовало вернуть либо выплатить законным владельцам компенсацию по условиям решения. Служба дому Эри не уничтожала их прав. Ветеран спросил лишь одно: имеет ли ещё значение слово герцога?\n\nСлово Винсента стояло за обоими документами: обещанием награды и хартией, учредившей суд. Принятие решения обойдётся ему во влияние и доверие верного покровителя. Монаршее исключение защитит этого сторонника, но приостановит все преимущества хартии, поставив герцога над правилами, которым он сам призывал доверять. Ответ должен был показать, какое из обещаний определит дальнейшую жизнь страны."
 hsm_verenia.70.a:0 "Исполнить решение. Политическую цену заплачу я."
 hsm_verenia.70.b:0 "Даровать моему покровителю монаршее исключение."
 hsm_verenia.71.t:0 "Решение, обязательное для сильных"
 hsm_verenia.71.d:0 "Иовинус прочитал судебное решение, затем подтверждение Эри и вызвал секретаря суда. Он хотел знать, приложил ли Винсент дополнительные условия. Никаких условий не было. Возврат имущества или компенсация состоятся вопреки личному обещанию герцога тому, кто получил имение.\n\nСемья потратила годы, доказывая, что вообще имеет право где-то жить. В одной канцелярии родство за линией фронта делало её подозрительной; в другой перемещение родственников превращало законное владение в неудобство. Теперь писарь мог сослаться на решение, не выясняя, какой покровитель согласится выступить за просителей.\n\nУ Иовинуса не появилось причин забывать о честолюбии Винсента. Зато появилась причина серьёзно относиться к его обязательствам. Совет приказал внести дело в общий архив вместе с согласием Эри. Когда следующий влиятельный проситель оспорит власть суда, перед чиновниками будет прецедент, который стоит прочитать вслух целиком."
 hsm_verenia.71.a:0 "Подшить согласие рядом с решением."
 hsm_verenia.72.t:0 "Печать выше закона"
 hsm_verenia.72.d:0 "Ответ Эри прибыл с печатью Винсента. Покровитель герцога сохранит обещанное имение благодаря монаршему исключению. Судебное решение осталось в реестре, лишённое силы, которую должна была обеспечивать хартия.\n\nИовинус спросил советников, какие гарантии они теперь дадут просителю без герцогского расположения. Убедительного ответа не нашлось. Работа общих учреждений была приостановлена; офицеры совместного штаба и технические писари больше не знали, какие обязательства их правительства будут соблюдать. Последствия почувствует каждый участник, независимо от того, имел ли он отношение к спорному имению и его владельцам.\n\nДоговор о дружбе сохранился. Дорогам не требовалась новая ссора, а обездоленной семье не требовалась новая война от её имени. Поэтому ответ Эйри называл ясный способ исправить нарушение: отменить исключение и исполнить решение. Пока Винсент этого не сделает, его подпись не сможет поддерживать учреждения, которые сама помогла создать."
 hsm_verenia.72.a:0 "Сохранить мир. Приостановить преимущества хартии."
 hsm_verenia.73.t:0 "Исключение отменено"
 hsm_verenia.73.d:0 "Винсент подписал отмену в той же комнате, где обещал имение. Покровителя не было. Секретарь подготовил заявление о восстановленном доверии; герцог попросил начать с судебного решения.\n\nВозврат имущества или компенсация состоятся на установленных судом условиях. Исключение отменено, а цену разочарования тех, кто на него полагался, заплатит правительство, которое его даровало. В документе ничто не намекало, будто семья обязана благодарить за получение того, что суд уже признал её правом.\n\nКопии отправились в Эйри и участвующие учреждения. После окончания приостановки они смогут возобновить работу, включая службы, созданные до нарушения. Доверие восстановится менее стройно. Пока в архиве стояли рядом решение, попытка его обойти и исправление. Изменить порядок этих бумаг Винсент не мог. Он мог лишь позаботиться о том, чтобы к ним не пришлось подшивать четвёртую."
 hsm_verenia.73.a:0 "Пусть учреждения возвращаются к работе."

 hsm_verenia.80.t:0 "Союз для общей обороны"
 hsm_verenia.80.d:0 "Эри предлагает военный союз на основе сотрудничества по хартии. Наш штаб уже научился работать с соседями, однако союз добавит дипломатические обязательства, которых техническое взаимодействие само по себе не создаёт. Иовинус может согласиться на общую оборону или сохранить хартию без новых военных обязательств. Решение принадлежит нашему правительству; приглашённый Авиан также будет решать самостоятельно."
 hsm_verenia.80.a:0 "Принять оборонительное партнёрство."
 hsm_verenia.80.b:0 "Сохранить отдельные военные обязательства."
 hsm_verenia.81.t:0 "Сотрудничество без военного союза"
 hsm_verenia.81.d:0 "Подготовка пока не привела к оборонительному союзу. Соглашению может недоставать согласия, а прежние обязательства домов могут не оставлять для него места. Практическая работа по хартии сохраняет собственную ценность. Штабные офицеры не забудут приобретённых знаний; правительство сможет вернуться к предложению, когда оба дома окажутся готовы и способны принять на себя новые обязанности."
 hsm_verenia.81.a:0 "Сохранить хартию и результаты подготовки."
 hsm_verenia.82.t:0 "Авиан и оборонительный союз"
 hsm_verenia.82.d:0 "Эри и Эйри договорились об общей обороне и приглашают присоединившийся к хартии дом Авиан вступить в союз. Это предложение отличается от уже подписанной хартии. Нашему правительству предстоит сопоставить военные обязательства со свободой нынешней политики. Мы вправе вступить в оборонительный союз и принять его обязанности либо продолжить сотрудничество по хартии без этого дополнительного шага."
 hsm_verenia.82.a:0 "Вступить в оборонительный союз."
 hsm_verenia.82.b:0 "Остаться участником хартии вне военного союза."

 hsm_verenia.90.t:0 "Просители возвращаются"
 hsm_verenia.90.public.d:0 "Писарь раскрыл тот самый реестр, который лежал перед участниками первого публичного слушания. У некоторых записей стояли даты исполнения, у других поля заполняли длинные пояснения. Столяр вернулся без сломанной петли. На этот раз он принёс первый счёт из мастерской, способной снова принимать заказы.\n\nОбщественная программа требовала ресурсов, пока министры находили иное применение каждой свободной монете. Теперь обязательства можно было считать выполненными. За обещаниями стояла гражданская работа, а просители могли сравнить результат со словами, произнесёнными при свидетелях.\n\nВинсент слушал перевозчика, жаловавшегося на разбитый участок за отремонтированной переправой. Камергер выглядел оскорблённым: торжественный приём портили новой просьбой. Герцог велел писарю записать место. В стране, оправляющейся от вражды, ещё останутся плохие дороги. Её жители должны иметь возможность пожаловаться на них, не объясняя прежде, какому дому они служили."
 hsm_verenia.90.d:0 "Камергер расставил вернувшихся просителей по порядку их частных соглашений. Публичного реестра для чтения вслух не было, но столяр сохранил первое уведомление канцелярии в кармане. Он положил его рядом со счётом из мастерской, наконец способной снова принимать заказы.\n\nЗакрытые переговоры позволили двору уладить неудобные вопросы без огласки. Они же поставили успех в зависимость от памяти об именах, редко звучавших во дворце. Винсент попросил принести все незакрытые дела, включая обращения тех, кто уже перестал писать.\n\nОбещанную программу теперь можно было завершить: за соглашениями стояла настоящая работа. Перевозчик всё же рассказал о разбитом участке за починенной переправой. Винсент велел отметить место рядом с исполненным обязательством. Подпись закрывала одно дело. Она не заставляла исчезнуть людей, которые рассчитывали на данное слово и продолжали жить среди результатов этих решений."
 hsm_verenia.90.a:0 "Держите исполненные обещания у нас на виду."
 hsm_verenia.91.t:0 "Что унаследует следующее поколение"
 hsm_verenia.91.d:0 "Заседание совета началось со спора о технических требованиях к мастерским. Делегат Эйри возражал против формулировки, писарь Эри искал предыдущее соглашение. За дверью перевозчик ждал, какой бланк выдадут для следующего груза. Никто не собирался вызывать полк.\n\nВинсент смотрел через стол на союз, которого не сумели бы составить его знатоки родословных. Притязания на Верению оставались частью его представления о себе. Столь же обоснованные права Иовинуса оставались частью порядка, который они научились поддерживать вместе. Ни один не передал другому своё правительство.\n\nДва дома связывали суд, согласованные службы и обещания, проверенные неудобными обстоятельствами. В общем архиве спорные счета лежали рядом с решениями, придавшими этому порядку вес. Писари обоих домов знали, где их искать. Успех союза покажет, насколько редко их детям понадобится узнавать, почему каждая статья когда-то давалась так трудно."
 hsm_verenia.91.three.d:0 "На обычное заседание совета прибыли три делегации. Представитель Авиана попросил исправить протокол, прежде чем Эри и Эйри вернутся к спору о технических требованиях. Писарь нашёл нужный отрывок и прочитал его вслух. Подпись третьего дома никто не считал украшением.\n\nВинсент следил за бумагами, переходившими через стол. Наследственные притязания по-прежнему имели для него значение; столь же обоснованные права Иовинуса никуда не исчезли, а Авиан присоединился по собственному решению. Хартия дала правительствам общие дела и пределы полномочий, которые каждому надлежало соблюдать.\n\nСуд проверил эти обязательства на деле влиятельного покровителя. Службы сделали сотрудничество полезным за пределами зала заседаний. Теперь союз принадлежал трём независимым участникам, способным выступать, возражать и получать ответ. Наследство следующего поколения зависело от того, сохранятся ли эти привычки, когда подписание хартии перестанет считаться новостью."
 hsm_verenia.91.a:0 "Пусть унаследуют соглашение и продолжают его улучшать."
 hsm_verenia.92.t:0 "Работа после конференции"
 hsm_verenia.92.d:0 "Винсент обнаружил проект общей хартии под чертежами школьной крыши. Управляющий извинился за беспорядок. Герцог велел оставить крышу сверху.\n\nОбщее урегулирование не выдержало переговоров и перемен за границей. Его бумаги не могли обещать ничего за другое правительство. Сохранившиеся соглашения будут соблюдены; церемонии в честь никогда не существовавшего договора не будет.\n\nВосстановление Эри оставалось другим обязательством. Двор мог нанять строителей, выполнить собственные обещания и применить знания, привезённые делегацией. Винсент хотел занять место в более широком союзе. Пока крыша, способная выдержать зиму, была делом, за которое он действительно мог ответить."
 hsm_verenia.92.a:0 "Начните с крыши."
 hsm_verenia.95.t:0 "Авиан требует новых отношений"
 hsm_verenia.95.d:0 "Переворот в Авиане сменил знакомые заверения требованием признать его верховенство. Прежнее сотрудничество не позволяет новым властям отменить нашу независимость собственным заявлением. Мы можем отвергнуть требование и сохранить суверенное правительство. Другой путь состоит в добровольном признании сюзеренитета Авиана и передаче Холлхаусу права решать дела, которыми наше правительство прежде распоряжалось само. Такое подчинение требует нашего решения и не вытекает из прежнего приглашения или хартии."
 hsm_verenia.95.a:0 "Защитить независимость. Отклонить требование."
 hsm_verenia.95.b:0 "Добровольно признать сюзеренитет Авиана."

