l_russian:
 HSM_VER_DEC_free_houses_peace_tt:0 "Оба Дома независимы, не капитулировали и находятся в мире."
 HSM_VER_DEC_obey_tt:0 "Отменяет герцогское исключение и признаёт решение суда. Преимущества хартии вернутся, когда все участники устранят свои нарушения. Завтра придёт отчёт."
 HSM_VER_DEC_prisoners_tt:0 "Предлагает Эйри обмен пленными. При согласии каждый Дом однократно получает §G500 людских ресурсов§!. Эйри может отказаться; повторить решение нельзя даже после отказа."
 HSM_VER_DEC_defence_ready_tt:0 "Хартия действует; независимые Дома в мире и могут объединиться, не выходя из другого альянса. Нет ожидающего ответа предложения; с предыдущего прошло не менее 90 дней."
 HSM_VER_DEC_defence_ERI_tt:0 "Предлагает Эйри оборонительный союз с его согласия. Новый союз возглавит Эри; прежний лидер сохраняет полномочия. Авиан получает отдельное приглашение."
 HSM_VER_DEC_defence_EYR_tt:0 "Предлагает Эри оборонительный союз с его согласия. Новый союз возглавит Эйри; прежний лидер сохраняет полномочия. Авиан получает отдельное приглашение."
 HSM_VER_DEC_requisitions_tt:0 "Прекращает чрезвычайные реквизиции и спор с командованием Эйри. Преимущества хартии вернутся, когда остальные участники тоже исполнят обязательства. Завтра придёт отчёт."
 HSM_VER_DEC_charter_ready_tt:0 "Конституционный мир Авиана сохраняется. Эри ещё не ратифицировало хартию; ожидающего ответа предложения нет. Обращение первое либо прошло 120 дней с предыдущего."
 HSM_VER_DEC_charter_tt:0 "Возобновляет переговоры Домов о хартии. Авиан отдельно решит, ратифицировать ли заключённый договор; посредничество само по себе не даёт членства и не принуждает герцогства к согласию."
 HSM_VER_DEC_membership_wait_tt:0 "Нет ожидающего ответа предложения ратификации; запрос о членстве направляется впервые либо прошло 90 дней с предыдущего."
 HSM_VER_DEC_membership_tt:0 "Снова предлагает Авиану ратифицировать хартию или отказаться. Ратификация вернёт полное членство, но не приведёт к аннексии. Неустранённые нарушения всё ещё приостанавливают преимущества."
 HSM_VER_DEC_budget_ready_tt:0 "Хартия трёх Домов действует. Хотя бы у одного неподписавшегося Дома нет ожидающего ответа предложения и за последние 90 дней ему не предлагали общий бюджет."
 HSM_VER_DEC_budget_tt:0 "Приглашает ещё не подписавшие соглашение дома к общему бюджету. Каждый может внести вклад или отказать; Авиану нужен хотя бы один партнёр."
 HSM_VER_DEC_levy_tt:0 "Отменяет исключительный сбор Авиана и его национальный дух. Хартия возобновится, когда все участники устранят свои нарушения. Завтра придёт отчёт."
 HSM_VER_DEC_contact_ready_tt:0 "Возможен мирный контакт с Авианом; наш Дом не выбрал военное объединение. Есть 35 политической власти; нет ожидаемого ответа, действующего соглашения или срока ожидания."
 HSM_VER_DEC_contact_tt:0 "При отправке расходует §Y35 политической власти§!. Предлагает Авиану гражданский проезд и пакт о ненападении; он может отказать. Без ответа предложение закроется через §Y30 дней§!; повторить можно через §Y90 дней§! после отправки."
 HSM_VER_DEC_integration_ready_tt:0 "Хотя бы одно свободное союзное герцогство может пересмотреть первоначальное предложение Авиана. Конституционный путь не выбран; срок повторного приглашения истёк."
 HSM_VER_DEC_integration_tt:0 "Снова предлагает подходящим союзным герцогствам интеграцию. Каждое может отказаться; согласие на это первоначальное устройство делает герцогство подданным Авиана. Повторное приглашение через §Y90 дней§!."
 HSM_VER_DEC_regency_ready_tt:0 "Урегулирование Герцланда действует; соглашение, ожидаемый ответ, назначенное обсуждение или передача власти не препятствуют переговорам. Обращение первое либо прошло 90 дней с предыдущего."
 HSM_VER_DEC_regency_tt:0 "Завтра предложит выбрать гражданское соглашение либо ограниченное регентство при малолетнем Гровере под опекой Авиана. Для вступления в силу нужно согласие обоих Домов."
 HSM_VER_DEC_custody_wait_tt:0 "С прежнего запроса о передаче двора прошло 90 дней либо запрос направляется впервые."
 HSM_VER_DEC_custody_request_tt:0 "Просит приютивший Гровера Дом передать его двор Авиану. Нужно согласие хозяев. Запрос истекает через §Y45 дней§!; повторить можно через §Y90 дней§! после отправки."
 HSM_VER_DEC_custody_recover_ready_tt:0 "Малолетний Гровер остался при павшей Империи, а не у иностранного покровителя. Авиан удерживает все исконные имперские земли; гражданское соглашение или прежняя передача не препятствуют возвращению."
 HSM_VER_DEC_custody_recover_tt:0 "Переводит уцелевший императорский двор и Гровера в Авиан; завтра придёт новый отчёт. Не возводит его на престол и не учреждает регентство без согласия Домов."
 HSM_VER_DEC_coronation_ready_tt:0 "Независимый Трубах удерживает Герцланд и не воюет. Церемония не ожидается; с прежнего переноса прошло 60 дней."
 HSM_VER_DEC_coronation_tt:0 "Вновь созывает императорскую коронацию. Двор может принять корону или отложить церемонию на 60 дней."
 HSM_VER_DEC_congress_ready_tt:0 "Коронованное правительство удерживает Грифенхейм; условия выбраны и подходящему династическому подданному можно направить новое приглашение."
 HSM_VER_DEC_congress_tt:0 "Приглашает подходящих династических вассалов к избранному соглашению. Каждый вправе отказать; прежние пожалования не повторяются."
 HSM_VER_DEC_frontiers_ready_tt:0 "Коронованное правительство Трубаха не воюет. На открытом неурегулированном направлении есть новый подходящий противник; 90-дневное ожидание окончено."
 HSM_VER_DEC_frontiers_tt:0 "Обновляет цели войны на первом открытом неурегулированном направлении, исключая дружественные страны и их подданных. Войну не объявляет. Повторное рассмотрение через §Y90 дней§!."
 HSM_VER_DEC_no_ducal_peace_tt:0 "Дом-соперник существует; признанный мир или герцогское перемирие не защищают его от военных действий."
 HSM_VER_DEC_border_tt:0 "Начинает пограничное столкновение Эри и Эйри без передачи территории. Незавершённый бой прекратится через §Y15 дней§!; новый набег недоступен §Y90 дней§!."
 HSM_VER_DEC_border_timeout_tt:0 "Прекращает незавершённое пограничное столкновение без передачи территории."
 HSM_VER_DEC_wargoal_tt:0 "Если через §Y130 дней§! сохранятся соперничество и свобода действий, даст цель войны против соперника: §Y50% аннексия / 50% подчинение§!. Мир или уже состоявшаяся война могут отменить результат."
 HSM_VER_DEC_white_peace_tt:0 "Предлагает сопернику белый мир; он может отказаться. Начинает двухлетнее ограничение на новый поход против соперника, даже если предложение будет отклонено."
