 HSM_CYA_campaign_frontier_secured_tt:0 "Исходные территории грифонского Фронтира и государств Эви в Грифонии принадлежат нам или нашим субъектам и находятся под нашим контролем либо контролем наших субъектов."
 HSM_CYA_claim_frontier_tt:0 "Получить цели войны на аннексию против нынешних независимых владельцев территорий грифонского Фронтира и государств Эви, включая государства, ранее завоевавшие эти земли. Наши субъекты, текущие противники и страны, против которых уже есть цель войны, исключены."
 HSM_CYA_integrate_frontier_tt:0 "Открыть обычную механику EaW для интеграции исходных грифонских провинций грифонского Фронтира и государств Эви через подчинение. Немедленная национализация не происходит. Астерион и земли поней исключены."
 HSM_CYA_campaign_river_secured_tt:0 "Исходные территории Речных земель в Грифонии принадлежат нам или нашим субъектам и находятся под нашим контролем либо контролем наших субъектов."
 HSM_CYA_claim_river_tt:0 "Получить цели войны на аннексию против нынешних независимых владельцев территорий Речных земель, включая государства, ранее завоевавшие эти земли. Наши субъекты, текущие противники и страны, против которых уже есть цель войны, исключены."
 HSM_CYA_campaign_hills_secured_tt:0 "Исходные территории Беоргфордаса в Грифонии принадлежат нам или нашим субъектам и находятся под нашим контролем либо контролем наших субъектов."
