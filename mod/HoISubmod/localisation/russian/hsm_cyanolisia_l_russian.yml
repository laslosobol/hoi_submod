 # Imperial reconstruction, regional institutions and the peace settlement.
 HSM_CYA_imperial_settlement:0 "Имперское устройство"
 HSM_CYA_imperial_settlement_desc:0 "Завоевание не разрешает всех споров о границах и обязательствах. При смене владельцев земель можно возобновить требования, союзникам предложить вступление в империю, а после объединения Грифонии заняться мирным устройством. Земли поней остаются в рамках существующей системы имперских комиссариатов; эти меры не дают национальных территорий."
 HSM_CYA_renew_north_claims:0 "Возобновить требования к северным провинциям"
 HSM_CYA_renew_north_claims_desc:0 "Старые приказы уже не соответствуют карте. Причины войны будут выданы против нынешних владельцев исходных территорий региона, кроме наших субъектов и стран, уже воюющих с нами. Существующие причины войны не дублируются. Требования не отменяют союзов и перемирий."
 HSM_CYA_renew_central_claims:0 "Возобновить требования к Центральной Грифонии"
 HSM_CYA_renew_central_claims_desc:0 "Старые приказы уже не соответствуют карте. Причины войны будут выданы против нынешних владельцев исходных территорий региона, кроме наших субъектов и стран, уже воюющих с нами. Существующие причины войны не дублируются. Требования не отменяют союзов и перемирий."
 HSM_CYA_renew_west_claims:0 "Возобновить требования к Западной Грифонии"
 HSM_CYA_renew_west_claims_desc:0 "Старые приказы уже не соответствуют карте. Причины войны будут выданы против нынешних владельцев исходных территорий региона, кроме наших субъектов и стран, уже воюющих с нами. Существующие причины войны не дублируются. Требования не отменяют союзов и перемирий."
 HSM_CYA_renew_south_claims:0 "Возобновить требования к Южной Грифонии"
 HSM_CYA_renew_south_claims_desc:0 "Старые приказы уже не соответствуют карте. Причины войны будут выданы против нынешних владельцев исходных территорий региона, кроме наших субъектов и стран, уже воюющих с нами. Существующие причины войны не дублируются. Требования не отменяют союзов и перемирий."
 HSM_CYA_renew_frontier_claims:0 "Возобновить требования к грифонскому Фронтиру"
 HSM_CYA_renew_frontier_claims_desc:0 "Старые приказы уже не соответствуют карте. Причины войны будут выданы против нынешних владельцев исходных территорий региона, кроме наших субъектов и стран, уже воюющих с нами. Существующие причины войны не дублируются. Требования не отменяют союзов и перемирий."
 HSM_CYA_renew_river_claims:0 "Возобновить требования к Речным землям"
 HSM_CYA_renew_river_claims_desc:0 "Старые приказы уже не соответствуют карте. Причины войны будут выданы против нынешних владельцев исходных территорий региона, кроме наших субъектов и стран, уже воюющих с нами. Существующие причины войны не дублируются. Требования не отменяют союзов и перемирий."
 HSM_CYA_renew_hills_claims:0 "Возобновить требования к Холмистым землям"
 HSM_CYA_renew_hills_claims_desc:0 "Старые приказы уже не соответствуют карте. Причины войны будут выданы против нынешних владельцев исходных территорий региона, кроме наших субъектов и стран, уже воюющих с нами. Существующие причины войны не дублируются. Требования не отменяют союзов и перемирий."
 HSM_CYA_renew_continental_claims:0 "Возобновить континентальные требования"
 HSM_CYA_renew_continental_claims_desc:0 "Часть территорий сменила владельца или осталась за пределами региональных соглашений. Требования будут обращены к их нынешним владельцам. Непроходимые земли, заморские владения и наши субъекты исключены. Союзы и перемирия сохраняют силу."
 HSM_CYA_offer_imperial_accession:0 "Предложить государству [From.GetName] имперский договор"
 HSM_CYA_offer_imperial_accession_desc:0 "Предложить независимому союзнику войти в империю на правах автономного субъекта. Его правительство вправе отказаться. Обе стороны должны находиться в мире; лидер альянса не может стать нашим субъектом, продолжая возглавлять союз. После отказа переговоры можно повторить через 180 дней. Пока мы остаёмся союзниками, территориальные требования не позволяют объявить войну."
 HSM_CYA_accession_refused_tt:0 "Союзник сохраняет независимость. После перерыва можно возобновить переговоры либо урегулировать союзные отношения и территориальные требования обычными дипломатическими средствами. Территории и статус субъекта не навязываются."
 HSM_CYA_peace_settlement_unlocked_tt:0 "Открывает три этапа мирного устройства: демобилизацию, восстановление и распределение имперских полномочий. Для каждого этапа нужны мир и сохранение контроля над Грифонией."
 HSM_CYA_peace_demobilization:0 "Созвать комиссию по демобилизации"
 HSM_CYA_peace_demobilization_desc:0 "За тридцать дней переговоров комиссия подготовит решение, а не очередную торжественную декларацию. Война или утрата имперских территорий прервёт её работу; после восстановления мира и контроля комиссию можно созвать снова. Итоговое решение принимается только один раз."
 HSM_CYA_peace_reconstruction:0 "Утвердить бюджет восстановления"
 HSM_CYA_peace_reconstruction_desc:0 "За тридцать дней переговоров комиссия подготовит решение, а не очередную торжественную декларацию. Война или утрата имперских территорий прервёт её работу; после восстановления мира и контроля комиссию можно созвать снова. Итоговое решение принимается только один раз."
 HSM_CYA_peace_constitution:0 "Определить имперские полномочия"
 HSM_CYA_peace_constitution_desc:0 "За тридцать дней переговоров комиссия подготовит решение, а не очередную торжественную декларацию. Война или утрата имперских территорий прервёт её работу; после восстановления мира и контроля комиссию можно созвать снова. Итоговое решение принимается только один раз."
 hsm_cyanolisia.54.t:0 "Кто поддержит порядок на Севере?"
 hsm_cyanolisia.54.countess.d:0 "Северные дворы приняли наших судей, но управлять каждым городом из Грифенхейма невозможно. Местные советы готовы собирать налоги и поддерживать порядок при условии сохранения своих хартий. Чиновники короны предлагают иной порядок: прямое управление, казённые мастерские и жалованье из центра. Соглашение Тейлоу должно определить, какие обязательства перейдут к следующему правительству."
 hsm_cyanolisia.54.dawnclaw.d:0 "Северная кампания окончена; гарнизонам нужны офицеры, знакомые с дорогами, складами и жителями. Донкло может оставить местных офицеров на имперской службе либо передать округ командирам, назначенным штабом. В первом случае армия получит опытных посредников, во втором ставка выстроит единую систему командования."
 hsm_cyanolisia.54.a:0 "Признать городские хартии и налоговые обязательства."
 hsm_cyanolisia.54.b:0 "Учредить постоянные учреждения короны."
 hsm_cyanolisia.54.c:0 "Принять местных офицеров на имперскую службу."
 hsm_cyanolisia.54.d:0 "Поручить штабу назначение командиров."
 hsm_cyanolisia.55.t:0 "Устройство озёрных земель"
 hsm_cyanolisia.55.countess.d:0 "По восстановленным дорогам едут купцы, просители и представители озёрных домов. Они готовы признать корону и платить установленные налоги, но рассчитывают участвовать в местном управлении. Канцелярия предлагает прислать оплачиваемых магистратов, подотчётных столице, а не наследственным покровителям. Оба проекта восстановят управление; спор идёт о том, кто сможет требовать от него отчёта."
 hsm_cyanolisia.55.dawnclaw.d:0 "Озёрные пути снабжают восточные армии. Местная знать предлагает склады, служащих и транспортные договоры в обмен на место в новой администрации. Армейские инспекторы предлагают заменить эту сеть военными управлениями и постоянным арсеналом. Донкло предстоит решить: использовать существующие учреждения или создать такие, которые обязаны своим появлением только его приказу."
 hsm_cyanolisia.55.a:0 "Подтвердить права домов в обмен на регулярные налоги."
 hsm_cyanolisia.55.b:0 "Назначить магистратов, ответственных перед короной."
 hsm_cyanolisia.55.c:0 "Связать местную знать обязательствами по снабжению."
 hsm_cyanolisia.55.d:0 "Передать пути военной администрации."
 hsm_cyanolisia.56.t:0 "Промышленное соглашение на Западе"
 hsm_cyanolisia.56.countess.d:0 "Аквилейские промышленники готовы вновь открыть предприятия, если договоры и права собственности сохранят силу. Казна может гарантировать эти условия и вложиться в новые мастерские либо оставить государственные заказы под более строгим контролем, направив средства в промышленные исследования. Ни один путь не отменяет последствий войны. Теперь важно, будут ли новые заказы результатом соглашения или распоряжения."
 hsm_cyanolisia.56.dawnclaw.d:0 "Западные заводы пережили войну по-разному. Одни владельцы предлагают выполнять армейские заказы в обмен на разрешение продолжать работу; инспекторы требуют изъять часть предприятий и учредить казённые арсеналы. Донкло нужна не очередная декларация о победе. Ему предстоит решить, кто будет подписывать платёжные ведомости и отвечать за сорванные сроки."
 hsm_cyanolisia.56.a:0 "Гарантировать промышленное соглашение."
 hsm_cyanolisia.56.b:0 "Оставить государственные заказы под надзором казны."
 hsm_cyanolisia.56.c:0 "Разрешить работу заводов под обязательства перед армией."
 hsm_cyanolisia.56.d:0 "Изъять предприятия для имперского арсенала."
 hsm_cyanolisia.53.b:0 "Подчинить генеральный штаб контролю короны."
 hsm_cyanolisia.53.c:0 "Проверить положение в провинциях и поддержать восстановление."
 hsm_cyanolisia.57.t:0 "Прошения вне расписания"
 hsm_cyanolisia.57.d:0 "У императорской поездки появились участники, которых не предусматривало расписание Донкло. Провинциальные делегаты хотят передавать жалобы непосредственно Гроверу. Небольшая канцелярия гражданских прошений дала бы императору ограниченную, но настоящую публичную роль; штабное управление оставит каждое обращение внутри военной системы. Ни один вариант не передаёт ему правительство.\n\n[Root.GetHSMCyaEducation]"
 hsm_cyanolisia.57.a:0 "Разрешить канцелярию гражданских прошений."
 hsm_cyanolisia.57.b:0 "Передавать все прошения через штаб."
 hsm_cyanolisia.58.t:0 "Армия после войны"
 hsm_cyanolisia.58.d:0 "Последние фронты затихли, но мобилизационные распоряжения по-прежнему определяют жизнь мастерских и семей. Один проект предлагает направить возвращающихся специалистов в гражданскую промышленность. Другой предусматривает меньшую постоянную армию, обученный резерв и регулярную программу подготовки. Первого ассигнования не хватит на обе системы сразу."
 hsm_cyanolisia.58.a:0 "Вернуть специалистов в гражданское производство."
 hsm_cyanolisia.58.b:0 "Создать профессиональную армию и обученный резерв."
 hsm_cyanolisia.59.t:0 "Первый мирный бюджет"
 hsm_cyanolisia.59.d:0 "В ведомостях восстановления вместо фронтов перечислены города. Провинциальные делегаты просят открыть мастерские рядом с рабочими и рынками. Столичные институты предлагают общую программу промышленных исследований, результаты которой появятся позднее. Спор идёт не о необходимости восстановления, а о том, с чего начать первый мирный бюджет."
 hsm_cyanolisia.59.a:0 "Строить в северных, озёрных и западных провинциях."
 hsm_cyanolisia.59.b:0 "Оплатить общую программу промышленных исследований."
 hsm_cyanolisia.60.t:0 "Что переживёт военные походы"
 hsm_cyanolisia.60.living.d:0 "Грифония вошла в имперское устройство. Короне ещё предстоит определить, какие полномочия принадлежат провинциальным учреждениям, а какие останутся у центрального правительства. Если Гровер ещё не начал личное правление, эти положения связывают регентство, не отменяя его обязанности передать власть. Если он уже правит, они определят устройство унаследованного государства.\n\n[Root.GetHSMCyaNorthSettlement]\n[Root.GetHSMCyaLakeSettlement]\n[Root.GetHSMCyaWestSettlement]\n\n[Root.GetHSMCyaCrownPolicy]"
 hsm_cyanolisia.60.puppet.d:0 "Гровер носит корону, но управляют по-прежнему учреждения Донкло. Мир лишает их возможности откладывать любой вопрос до следующего похода. Теперь военный порядок можно закрепить постоянным распределением обязанностей, прямо определив ограниченную публичную роль престола. Это устройство власти, а не вторая коронация.\n\n[Root.GetHSMCyaCrownPolicy]"
 hsm_cyanolisia.60.dead.d:0 "Гровер мёртв. Ни победа, ни правовая формула не вернут его, а общепризнанного преемника нет. Провинциальным делегатам и высшим чиновникам предстоит определить порядок назначений, утверждения бюджета и будущей передачи исполнительной власти без него. Гражданские хартии, постоянная служебная администрация или совет, составляющий правила преемства, могут обеспечить государству непрерывность; ни один из этих путей не создаст наследника."
 hsm_cyanolisia.60.a:0 "Гарантировать место провинциальных учреждений в империи."
 hsm_cyanolisia.60.b:0 "Установить полномочия постоянной служебной администрации."
 hsm_cyanolisia.60.c:0 "Поручить совету составить правила преемства, не назначая наследника."
 hsm_cyanolisia.58.defer:0 "Обстоятельства изменились; вернёмся к вопросу после кризиса."
 hsm_cyanolisia.59.defer:0 "Обстоятельства изменились; вернёмся к вопросу после кризиса."
 hsm_cyanolisia.60.defer:0 "Обстоятельства изменились; вернёмся к вопросу после кризиса."
 hsm_cyanolisia.61.t:0 "Имперский договор"
 hsm_cyanolisia.61.d:0 "[From.GetName] предлагает превратить союз в официальное вхождение в империю. Мы сохраним территорию и внутреннюю администрацию, но станем автономным субъектом и откажемся от самостоятельной внешней политики. Согласие добровольно. Если дипломатическая обстановка изменилась, мы можем отказаться, не уступая земель."
 hsm_cyanolisia.61.a:0 "Принять положение субъекта по имперскому договору."
 hsm_cyanolisia.61.b:0 "Сохранить независимость."
 hsm_cyanolisia.62.t:0 "Договор принят"
 hsm_cyanolisia.62.d:0 "[From.GetName] принимает положение субъекта империи. Территории остаются под местным управлением, а внешняя политика переходит в ведение имперской власти. Новые национальные территории не создаются."
 hsm_cyanolisia.62.a:0 "Занести соглашение в реестр."
 hsm_cyanolisia.63.t:0 "Договор отклонён"
 hsm_cyanolisia.63.d:0 "[From.GetName] не намерено менять независимость на место в империи. Отказ не расторгает союз и не передаёт территорий. Дальнейшее давление должно учитывать дипломатические обязательства, которые продолжают нас связывать."
 hsm_cyanolisia.63.a:0 "Территориальный вопрос остаётся открытым."
