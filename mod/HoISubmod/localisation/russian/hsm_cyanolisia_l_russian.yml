 HSM_CYA_industrial_program_dynamic_modifier:0 "Цианолисийская промышленная программа"
 HSM_CYA_industrial_program_dynamic_modifier_desc:0 "Фабрики, железные дороги, мастерские и советы восстановления Цианолисии сводятся в одну долгую программу модернизации."
 HSM_CYA_industrial_program_dynamic_modifier_dummy_idea:0 "Цианолисийская промышленная программа"
 HSM_CYA_military_program_dynamic_modifier:0 "Цианолисийская военная программа"
 HSM_CYA_military_program_dynamic_modifier_desc:0 "Армия перестраивается через штабные школы, фронтирную логистику, мобилизационные советы и уроки, принесенные завоеваниями."
 HSM_CYA_military_program_dynamic_modifier_dummy_idea:0 "Цианолисийская военная программа"
 HSM_CYA_imperial_legitimacy_dynamic_modifier:0 "Имперская легитимность"
 HSM_CYA_imperial_legitimacy_dynamic_modifier_desc:0 "Притязание Цианолисии на власть над Грифонией опирается на суды, оккупационные канцелярии и династические символы. Налаженное управление снижает сопротивление и ускоряет рост подчинения на землях, занятых Цианолисией."
 HSM_CYA_imperial_legitimacy_dynamic_modifier_dummy_idea:0 "Имперская легитимность"
 HSM_CYA_exiled_imperial_strategist:0 "Имперский стратег в изгнании"
 HSM_CYA_all_evi_territory_owned_tt:0 "Владеть всеми историческими землями долины Эви"
 HSM_CYA_all_asterion_territory_owned_tt:0 "Владеть всеми историческими землями Астериона"
 HSM_CYA_all_sicameon_territory_owned_tt:0 "Владеть всеми историческими землями Сикамеона"
 HSM_CYA_imperial_administration_diplomacy:0 "Имперская администрация"
 HSM_CYA_imperial_administration_diplomacy_desc:0 "Временный кабинет может искать защиты Гриффенхейма, если наши государства стали соседями."
 HSM_CYA_enter_griffonian_imperial_alliance:0 "Вступить в альянс Грифонской империи"
 HSM_CYA_enter_griffonian_imperial_alliance_desc:0 "Принять место во фракции Империи, пока ее граница соприкасается с нашей."
 HSM_CYA_countess_union_mandate:0 "Мандат на единую Грифонию"
 HSM_CYA_countess_union_mandate_desc:0 "Графиня превращает притязания регентства в континентальную программу снабжения, судов и провинциальной верности."
 HSM_CYA_countess_northern_charters:0 "Хартии северных герцогств"
 HSM_CYA_countess_northern_charters_desc:0 "Северные короны и озерные страны должны принять имперские хартии или встретить армию регентства."
 HSM_CYA_countess_western_concord:0 "Западное согласие"
 HSM_CYA_countess_western_concord_desc:0 "Преемников Аквелии и западные княжества призовут к новому имперскому соглашению."
 HSM_CYA_countess_southern_compacts:0 "Южные соглашения"
 HSM_CYA_countess_southern_compacts_desc:0 "Торговые гарантии и провинциальные сеймы сопровождают продвижение регентства на юге Грифонии."
 HSM_CYA_countess_river_missions:0 "Миссии за рекой"
 HSM_CYA_countess_river_missions_desc:0 "Восточные державы, Речные земли и горные пони не останутся вне единой Грифонии."
 HSM_CYA_countess_continental_rail_board:0 "Континентальное железнодорожное управление"
 HSM_CYA_countess_continental_rail_board_desc:0 "Новые мастерские Гриффенхейма согласуют железные дороги и грузовые перевозки для дальних провинций регентства."
 HSM_CYA_countess_regency_general_staff:0 "Генштаб регентства"
 HSM_CYA_countess_regency_general_staff_desc:0 "Офицеры графини собирают региональные части в одну снабжаемую армию для имперского урегулирования."
 HSM_CYA_countess_western_circuits:0 "Западные округа регентства"
 HSM_CYA_countess_western_circuits_desc:0 "Провинциальные сеймы и гражданские суды заменяют временную оккупацию на западе Грифонии."
 HSM_CYA_countess_eastern_circuits:0 "Восточные округа регентства"
 HSM_CYA_countess_eastern_circuits_desc:0 "Грифонские земли получат место в имперской администрации. Для Речных земель и пагорбовых пони будут доступны имперские комиссариаты, а не интеграция в ядро."
 HSM_CYA_one_griffonia_under_the_crown:0 "Одна Грифония для короны"
 HSM_CYA_one_griffonia_under_the_crown_desc:0 "Регентство объединило континент. Теперь его труд должен завершиться обещанной передачей короны."
 HSM_CYA_grover_first_council:0 "Первый совет Гровера"
 HSM_CYA_grover_first_council_desc:0 "Гровер VI принимает представителей провинций, пока графиня передает его правительству чрезвычайные полномочия."
 HSM_CYA_grover_imperial_academies:0 "Вновь открыть имперские академии"
 HSM_CYA_grover_imperial_academies_desc:0 "Новый император направляет средства университетам и офицерским школам вместо очередного круга придворных назначений."
 HSM_CYA_countess_memorial_regency:0 "Регентство без Гровера"
 HSM_CYA_countess_memorial_regency_desc:0 "Гровер погиб от чужой руки. Графиня сохранит созданные для него учреждения, но не назовет себя императрицей."
 HSM_CYA_countess_succession_council:0 "Совет имперского престолонаследия"
 HSM_CYA_countess_succession_council_desc:0 "Делегаты провинций и юристы поддерживают единую державу, пока не решен вопрос законного наследования."
 HSM_CYA_grover_lost_to_others:0 "Гровер погиб от чужой руки"
 HSM_CYA_grover_lost_to_others_desc:0 "Наследник уже мертв. Донкло получит механизмы пустого трона, не приписывая себе его убийство."
 HSM_CYA_memorial_imperial_council:0 "Имперский поминальный совет"
 HSM_CYA_memorial_imperial_council_desc:0 "Старым лоялистам предлагают место в правительстве, не превращая имя погибшего императора в повод для новых расправ."
 HSM_CYA_heirless_provincial_compact:0 "Соглашение провинций без наследника"
 HSM_CYA_heirless_provincial_compact_desc:0 "Письменный договор дает провинциям представительство в империи, которую династия больше не может объединять."
 hsm_cyanolisia.40.adult.d:0 "Гровер VI уже носил корону в другой державе. Графиня не устраивает повторную коронацию ребенка: перед провинциями она передает объединенную страну и свои чрезвычайные полномочия живому императору."
 hsm_cyanolisia.42.adult.d:0 "Гровер VI уже правил от собственного имени. Теперь Донкло возвращает его в Гриффенхейм под охраной, сохраняя власть в правительстве, а императора превращая в символ под надзором."
 hsm_cyanolisia.43.adult.d:0 "Гровер VI уже правил прежде. Донкло отступает, и объединенная Империя вновь принимает императора; гражданские суды и армейские канцелярии продолжают работу."
 hsm_cyanolisia.45.t:0 "Унаследованный пустой трон"
 hsm_cyanolisia.45.d:0 "Гровер VI погиб до того, как Донкло смог решить его судьбу. Объединенная Империя не может назвать это чисткой династии: власть придется строить вокруг утраты, нанесенной чужой рукой."
 hsm_cyanolisia.45.a:0 "Пусть совет удержит страну."
 hsm_cyanolisia.46.t:0 "Графиня хранит доверенную корону"
 hsm_cyanolisia.46.d:0 "Графиня готовила империю для Гровера VI. Его смерть лишила ее возможности исполнить обещание, но не сделала корону ее собственностью. Она созывает провинции в поминальное регентство до законного решения о престолонаследии."
 hsm_cyanolisia.46.a:0 "Доверие пережило наследника."
