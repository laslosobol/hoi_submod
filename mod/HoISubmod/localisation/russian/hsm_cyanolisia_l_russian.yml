 HSM_CYA_industrial_program_dynamic_modifier:0 "Цианолизийская промышленная программа"
 HSM_CYA_industrial_program_dynamic_modifier_desc:0 "Портовые вкладчики, провинциальные мастерские и государственные инженеры спорят над одним планом. Его сила в том, что пути и фабрики работают сообща, служат ли они регентству или походам Донкло."
 HSM_CYA_industrial_program_dynamic_modifier_dummy_idea:0 "Цианолизийская промышленная программа"
 HSM_CYA_military_program_dynamic_modifier:0 "Цианолизийская военная программа"
 HSM_CYA_military_program_dynamic_modifier_desc:0 "Армия переросла береговые гарнизоны. Штабные школы и службы снабжения дают ей общий порядок; борьба при дворе решает, чьей власти он будет служить."
 HSM_CYA_military_program_dynamic_modifier_dummy_idea:0 "Цианолизийская военная программа"
 HSM_CYA_imperial_legitimacy_dynamic_modifier:0 "Имперская легитимность"
 HSM_CYA_imperial_legitimacy_dynamic_modifier_desc:0 "Захваченная столица сама по себе не рождает верности. Суды, договоры с провинциями и имя Гровера там, где оно еще имеет силу, придают притязанию вес; на занятых землях понятные правила помогают ослабить сопротивление и заслужить сотрудничество."
 HSM_CYA_imperial_legitimacy_dynamic_modifier_dummy_idea:0 "Имперская легитимность"
 HSM_CYA_exiled_imperial_strategist:0 "Имперский стратег в изгнании"
 HSM_CYA_all_evi_territory_owned_tt:0 "Владеть всеми историческими землями долины Эви"
 HSM_CYA_all_asterion_territory_owned_tt:0 "Владеть всеми историческими землями Астериона"
 HSM_CYA_all_sicameon_territory_owned_tt:0 "Владеть всеми историческими землями Сикамеона"
 HSM_CYA_imperial_administration_diplomacy:0 "Имперская администрация"
 HSM_CYA_imperial_administration_diplomacy_desc:0 "Временный кабинет может искать защиты Грифенхейма, если наши государства стали соседями."
 HSM_CYA_enter_griffonian_imperial_alliance:0 "Вступить в альянс Грифонской империи"
 HSM_CYA_enter_griffonian_imperial_alliance_desc:0 "Принять место во фракции Империи, пока ее граница соприкасается с нашей."
 HSM_CYA_countess_union_mandate:0 "Мандат на единую Грифонию"
 HSM_CYA_countess_union_mandate_desc:0 "Взятие Грифенхейма исполнило лишь первую часть обещания Тэйллоу. Теперь она зовет провинциальные суды, железнодорожников и армию к труднейшей задаче: собрать державу, которую можно передать, не разрушив."
 HSM_CYA_countess_northern_charters:0 "Хартии северных герцогств"
 HSM_CYA_countess_northern_charters_desc:0 "Северные князья спрашивают, какие права переживут возвращение императора. Тэйллоу предлагает хартии с местными законами, за которыми стоит армия, готовая разрешить спор, неподвластный писарям."
 HSM_CYA_countess_western_concord:0 "Западное согласие"
 HSM_CYA_countess_western_concord_desc:0 "Западные дворы не признают южную регентшу лишь потому, что она держит Грифенхейм. Послам придется считаться с притязаниями Аквелии, прежде чем армия закрепит сколько-нибудь прочный договор."
 HSM_CYA_countess_southern_compacts:0 "Южные соглашения"
 HSM_CYA_countess_southern_compacts_desc:0 "Южные порты могут дорого обойтись завоевателю и после окончания войны. Графиня предлагает торговые гарантии и провинциальные сеймы, связывая морских купцов с короной, которой они не думали служить."
 HSM_CYA_countess_river_missions:0 "Миссии за рекой"
 HSM_CYA_countess_river_missions_desc:0 "Графиня отправляет землемеров и послов за реку. Грифонские соседи могут стать провинциями регентства; поньим державам понадобятся зависимые администрации с собственными местными правителями."
 HSM_CYA_countess_continental_rail_board:0 "Континентальное железнодорожное управление"
 HSM_CYA_countess_continental_rail_board_desc:0 "Новые мастерские Грифенхейма согласуют железные дороги и грузовые перевозки для дальних провинций регентства."
 HSM_CYA_countess_regency_general_staff:0 "Генштаб регентства"
 HSM_CYA_countess_regency_general_staff_desc:0 "Офицеры графини собирают региональные части в одну снабжаемую армию для имперского урегулирования."
 HSM_CYA_countess_western_circuits:0 "Западные округа регентства"
 HSM_CYA_countess_western_circuits_desc:0 "Западная знать знает, как быстро победоносная армия превращается в постоянных оккупантов. Регентство предлагает провинциальные сеймы и гражданские суды в обмен на присягу Грифенхейму."
 HSM_CYA_countess_eastern_circuits:0 "Восточные округа регентства"
 HSM_CYA_countess_eastern_circuits_desc:0 "Восточные грифонские суды войдут в имперскую канцелярию. За рекой и в холмах местные власти сохранятся под комиссариатами Грифенхейма, а их земли не станут частью имперского ядра."
 HSM_CYA_one_griffonia_under_the_crown:0 "Одна Грифония для короны"
 HSM_CYA_one_griffonia_under_the_crown_desc:0 "От берега, приютившего изгнанника, до судов западной Грифонии провинции теперь отвечают одной столице. Тэйллоу построила обещанную державу; сможет ли Гровер принять ее или нет, себе она корону не присвоит."
 HSM_CYA_grover_first_council:0 "Первый совет Гровера"
 HSM_CYA_grover_first_council_desc:0 "Гровер VI принимает представителей провинций, пока графиня передает его правительству чрезвычайные полномочия."
 HSM_CYA_grover_imperial_academies:0 "Вновь открыть имперские академии"
 HSM_CYA_grover_imperial_academies_desc:0 "Новый император направляет средства университетам и офицерским школам вместо очередного круга придворных назначений."
 HSM_CYA_countess_memorial_regency:0 "Регентство без Гровера"
 HSM_CYA_countess_memorial_regency_desc:0 "Гровер погиб от чужой руки. Графиня сохранит созданные для него учреждения, но не назовет себя императрицей."
 HSM_CYA_countess_succession_council:0 "Совет имперского престолонаследия"
 HSM_CYA_countess_succession_council_desc:0 "Делегаты провинций и юристы поддерживают единую державу, пока не решен вопрос законного наследования."
 HSM_CYA_grover_lost_to_others:0 "Гровер погиб от чужой руки"
 HSM_CYA_grover_lost_to_others_desc:0 "Наследник уже мертв. Донкло получит механизмы пустого трона, не приписывая себе его убийство."
 HSM_CYA_memorial_imperial_council:0 "Имперский поминальный совет"
 HSM_CYA_memorial_imperial_council_desc:0 "Старым лоялистам предлагают место в правительстве, не превращая имя погибшего императора в повод для новых расправ."
 HSM_CYA_heirless_provincial_compact:0 "Соглашение провинций без наследника"
 HSM_CYA_heirless_provincial_compact_desc:0 "Письменный договор дает провинциям представительство в империи, которую династия больше не может объединять."
 hsm_cyanolisia.40.adult.d:0 "Гровер VI уже носил корону; новая церемония, изображающая его подопечным, оскорбила бы и его, и провинции, помнящие его правление. Перед двором в Грифенхейме Тэйллоу отдает ему государственные печати и освобождает армию от присяги регентству. Одни делегаты аплодируют. Другие ждут первого приказа, который будет принадлежать только Гроверу."
 hsm_cyanolisia.42.adult.d:0 "Когда-то Гровер VI правил, не спрашивая позволения Донкло. В Грифенхейме его встречают с почестями императора и распорядком узника. Двор называет это возвращением на престол; офицеры, утверждающие каждую аудиенцию, знают цену этому слову."
 hsm_cyanolisia.43.adult.d:0 "Гровер VI уже правил и понимает вес печатей, которые Донкло возвращает ему. Армия и суды остаются, но их чиновникам теперь придется отвечать перед императором, а не прежним покровителем. Церемония заканчивается; настоящая передача власти начинается на первом заседании кабинета."
 hsm_cyanolisia.45.t:0 "Унаследованный пустой трон"
 hsm_cyanolisia.45.d:0 "Гровер VI погиб вне власти Донкло. Никакой приказ из Грифенхейма не отменит его смерти, и честное воззвание не назовет ее необходимой жертвой режима. Офицеры требуют ясного порядка престолонаследия; делегаты провинций спрашивают, кто теперь выслушает их, когда имя, должное объединить Империю, осталось лишь памятью."
 hsm_cyanolisia.45.a:0 "Пусть совет удержит страну."
 hsm_cyanolisia.46.t:0 "Графиня хранит доверенную корону"
 hsm_cyanolisia.46.d:0 "Тэйллоу готовила империю для Гровера и дожила до известия, что он никогда ее не получит. Провинциальные послы ждут, что она возьмет корону; графиня оставляет ее нетронутой. Совет будет править в память о Гровере и искать законного преемника, пока Тэйллоу удерживает державу от распада."
 hsm_cyanolisia.46.a:0 "Доверие пережило наследника."
