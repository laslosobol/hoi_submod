l_russian:
 hsm_cyanolisia.1.t:0 "Беглец из Грифенхейма"
 hsm_cyanolisia.1.d:0 "Чистка в Грифенхейме рассеяла офицеров и осведомителей по всему Герцланду. Один путник добирается до двора графини под чужим именем; бумаги под его плащом выдают Фердинанда Донкло. Он просит убежища и предлагает взамен сведения об имперской армии и связи с ее поставщиками. Укрыть его - навлечь гнев Грифенхейма. Отослать - потерять свидетеля, знающего слабости его командования."
 hsm_cyanolisia.1.a:0 "Спрятать его как помощника графини."
 hsm_cyanolisia.1.b:0 "Отослать его, пока Империя ничего не заметила."
 HSM_CYA_ferdinand_dawnclaw:0 "Фердинанд Донкло"
 HSM_CYA_ferdinand_dawnclaw_desc:0 "Изгнанный имперский командующий одинаково внимательно изучает дороги, вражеские порядки и придворные слухи. Графиня держит его при штабе: планы Донкло полезны, а за его амбициями лучше наблюдать вблизи."
 HSM_CYA_dawnclaw_country_leader_desc:0 "Изгнанник сменил чужую комнату на министерства и генеральный штаб. Месть привела Донкло в Цианолизию; созданные им учреждения могут исполнять его приказы и после падения Грифенхейма."
 HSM_CYA_dawnclaw_assistant_appointed_tt:0 "Фердинанд Донкло будет назначен политическим советником, и его нельзя будет заменить."
 HSM_CYA_lowenstein_motor_pool:0 "Автомастерские Левенштайна в изгнании"
 HSM_CYA_lowenstein_motor_pool_desc:0 "Инженеры Левенштайна следуют за Донкло и налаживают производство армейского транспорта."
 HSM_CYA_reichswaffen_fieldworks:0 "Полевые мастерские Рейхсваффен"
 HSM_CYA_reichswaffen_fieldworks_desc:0 "Группа снабженцев из Грифенхейма открывает в Цианолизии мастерские дополнительного снаряжения."
 HSM_CYA_dawnclaw_fascism_party:0 "Герцландская ставка"
 HSM_CYA_dawnclaw_fascism_party_long:0 "Герцландская ставка Донкло"
 HSM_CYA_dawnclaw_griffonian_files:0 "Грифенхеймские досье Донкло"
 HSM_CYA_dawnclaw_griffonian_files_desc:0 "В его гриффенхеймских папках расписания поездов лежат рядом с именами офицеров, которым он когда-то доверял. Для графини это разведданные; для Донкло - дорога обратно в столицу."
 hsm_cyanolisia.2.t:0 "Цена убежища"
 hsm_cyanolisia.2.d:0 "Донкло пережил первые дни в укрытии. Его имя не появляется в книгах учета, его комнаты записаны как склад, а прислуга графини уже научилась не спрашивать, почему младший помощник получает военные доклады. Теперь двор должен решить, чем на самом деле станет этот опасный гость."
 hsm_cyanolisia.2.a:0 "Он советник, и не более."
 hsm_cyanolisia.2.b:0 "Привязать его ко двору."
 hsm_cyanolisia.2.c:0 "Передать его бумаги администрации."
 hsm_cyanolisia.3.t:0 "Брак по расчету"
 hsm_cyanolisia.3.d:0 "Никакой публичный роман не смог бы объяснить этот союз, да он, возможно, и не нужен. Графиня получает солдата, знающего слабости Грифенхейма. Донкло получает крышу, имя и двор, который он может попытаться склонить к мести."
 hsm_cyanolisia.3.a:0 "Пусть двор шепчется."
 hsm_cyanolisia.4.t:0 "Ставка Донкло"
 hsm_cyanolisia.4.d:0 "Дворцовая стража больше не ждет распоряжений гражданских клерков. Доклады проходят через оперативный штаб Донкло прежде, чем попасть к графине, а офицеры все чаще говорят о безопасности, дисциплине и внутренних врагах."
 hsm_cyanolisia.4.a:0 "Он знает, как навести порядок."
 hsm_cyanolisia.5.t:0 "Графиня главенствует"
 hsm_cyanolisia.5.d:0 "Тэйллоу позволила Донкло советовать, но не командовать. Брак остается политически полезным, его досье ценны, его ярость сдержана, а двор усвоил: изгнанник жив лишь потому, что графиня это дозволяет."
 hsm_cyanolisia.5.a:0 "Двор помнит, кто правит."
 hsm_cyanolisia.10.t:0 "Ножи из Грифенхейма"
 hsm_cyanolisia.10.d:0 "Легенда вокруг Донкло начала расползаться. Один курьер исчез, слугу подкупили, а дворцовая стража перехватила признаки движения имперских агентов через порт. Кто-то в Грифенхейме решил, что изгнанный генерал не должен прожить достаточно долго, чтобы стать полезным."
 hsm_cyanolisia.10.a:0 "Перевезти его до удара."
 hsm_cyanolisia.10.b:0 "Агенты находят свою цель."
 hsm_cyanolisia.11.t:0 "Прикрытие рушится"
 hsm_cyanolisia.11.d:0 "Слишком много писем сожжено, слишком много офицеров приходило после темноты, и слишком много слуг видело, как помощник графини читает военные депеши. Тайна больше не удерживается внутри дворца."
 hsm_cyanolisia.11.a:0 "Грифенхейм об этом услышит."
 hsm_cyanolisia.12.t:0 "Имперский кабинет для Цианолизии"
 hsm_cyanolisia.12.d:0 "Смерть Донкло оставила двор с трупом, скандалом и без фракции, способной спокойно удержать власть. Грифенхейм действует быстро. Советники прибывают под дипломатическими печатями, торговые чиновники принимают фабричные книги, а новый кабинет собирают из тех, кто готов назвать зависимость стабильностью. Цианолизия сохраняет знамена и графиню, но механизм под ними теперь отвечает имперским рукам."
 hsm_cyanolisia.12.a:0 "Порядок имеет цену."
 HSM_CYA_frontier_march_path_tt:0 "Донкло будет советовать пограничному командованию, не вмешиваясь в придворную политику."
 HSM_CYA_marriage_path_tt:0 "Брак откроет борьбу за влияние при дворе, исход которой определят решения."
 HSM_CYA_imperial_admin_path_tt:0 "Временная администрация получит бумаги Донкло и ограничит его полномочия."
 HSM_CYA_proxy_rule_trade:0 "Прокси-торговая администрация"
 HSM_CYA_power_struggle_unlocked_tt:0 "Борьбу при дворе между Донкло и графиней теперь можно менять решениями."
 HSM_CYA_dawnclaw_dominance_tt:0 "Донкло доминирует при дворе. Его открытое влияние на безопасность будет быстрее повышать раскрытость."
 HSM_CYA_countess_dominance_tt:0 "Графиня доминирует при дворе. Донкло остается скрытым дольше."
 HSM_CYA_assassination_prevented_tt:0 "Донкло на время перевозят в более надежное убежище."
 HSM_CYA_exposure_minus_2_tt:0 "Раскрытость Донкло уменьшится на §G2§!."
 HSM_CYA_exposure_minus_3_tt:0 "Раскрытость Донкло уменьшится на §G3§!."
 HSM_CYA_exposure_minus_4_tt:0 "Раскрытость Донкло уменьшится на §G4§!."
 HSM_CYA_exposure_minus_5_tt:0 "Раскрытость Донкло уменьшится на §G5§!."
 HSM_CYA_advisor_role_confirmed_tt:0 "Роль Донкло сведена к заметной советнической работе. Имперские агенты больше не будут вести цепочку покушений."
 HSM_CYA_hide_the_fugitive:0 "Спрятать беглеца"
 HSM_CYA_hide_the_fugitive_desc:0 "Чужое имя, запертая комната и несколько удачно потерянных записей могут скрыть Фердинанда Донкло достаточно надолго, чтобы двор графини решил, чем он на самом деле станет."
 HSM_CYA_an_unlikely_marriage:0 "Невероятный брак"
 HSM_CYA_an_unlikely_marriage_desc:0 "Связать Донкло с двором графини браком, превратив скрытого изгнанника в постоянный кризис власти внутри дома."
 HSM_CYA_frontier_march_plan:0 "План пограничной марки"
 HSM_CYA_frontier_march_plan_desc:0 "Оставить Донкло тихим оборонительным советником и превратить уязвимое приграничье Цианолизии в дисциплинированную марку."
 HSM_CYA_reorganise_border_forces:0 "Реорганизация и рестандартизация"
 HSM_CYA_reorganise_border_forces_desc:0 "Позволить Донкло тихо проверить учебные уставы, снабженческие таблицы и полевые порядки, пока пограничные силы не начнут походить на современную армию."
 HSM_CYA_modernise_internal_intelligence:0 "Модернизировать внутреннюю разведку"
 HSM_CYA_modernise_internal_intelligence_desc:0 "Встроить методы Донкло в скромное бюро внутренней разведки, доказывая наблюдателям из Грифенхейма, что он советник, а не претендент."
 HSM_CYA_frontier_drill_standards:0 "Пограничные стандарты учений"
 HSM_CYA_frontier_drill_standards_desc:0 "Превратить первые замечания Донкло в повторяемые пограничные учения, проверки снабжения и полевые порядки."
 HSM_CYA_frontier_signals_network:0 "Пограничная сеть связи"
 HSM_CYA_frontier_signals_network_desc:0 "Связать внутреннюю разведку с пограничными постами, курьерами и комнатами прослушивания, не превращая Донкло в явного претендента."
 HSM_CYA_local_supply_depots:0 "Местные склады снабжения"
 HSM_CYA_local_supply_depots_desc:0 "Развернуть в марке местные склады и ремонтные запасы, чтобы пограничные силы могли сражаться без ожидания столицы."
 HSM_CYA_fortify_against_minotauria:0 "Укрепиться против Минотаврии"
 HSM_CYA_fortify_against_minotauria_desc:0 "Превратить южные подходы в подготовленные позиции, склады снабжения и отмеченные на картах линии отхода."
 HSM_CYA_watch_sicameon:0 "Наблюдать за Сикамеоном"
 HSM_CYA_watch_sicameon_desc:0 "Протянуть сеть связи к побережью и сделать Сикамеон наблюдаемым рубежом, а не забытым соседом."
 HSM_CYA_defensive_victory_claims:0 "Претензии оборонительной победы"
 HSM_CYA_defensive_victory_claims_desc:0 "Подготовить юридические бумаги и военные карты, которые позволят Цианолизии требовать компенсацию после успешной оборонительной войны."
 HSM_CYA_proclaim_cyanolisian_march:0 "Цианолизийская марка"
 HSM_CYA_proclaim_cyanolisian_march_desc:0 "Дать пограничной системе публичное имя, цепочку командования и достаточно местной гордости, чтобы она выжила, не став троном Донкло."
 HSM_CYA_civilian_liaison_offices:0 "Гражданские бюро связи"
 HSM_CYA_civilian_liaison_offices_desc:0 "Дать клеркам графини постоянное место в делах безопасности, сохраняя полезность Донкло, но окружая его гражданскими процедурами."
 HSM_CYA_codify_household_compact:0 "Кодифицировать дворцовый договор"
 HSM_CYA_codify_household_compact_desc:0 "Закрепить новую иерархию двора в титулах, подписях и цепочках командования, пока офицеры не решили, что это временно."
 HSM_CYA_the_hidden_assistant:0 "Скрытый помощник"
 HSM_CYA_the_hidden_assistant_desc:0 "Держать Донкло достаточно близко для советов и достаточно тихо, чтобы графиня оставалась единственным видимым центром власти."
 HSM_CYA_the_countess_alone:0 "Графиня главенствует"
 HSM_CYA_the_countess_alone_desc:0 "Сохранить брак и дать двору понять, что Донкло защищен графиней, полезен графине и политически меньше графини."
 HSM_CYA_recognise_outback_councils:0 "Признать советы глубинки"
 HSM_CYA_recognise_outback_councils_desc:0 "Превратить местных минотаврийских посредников в зарегистрированные советы, обменивая автономию на окраинах на более спокойное управление."
 HSM_CYA_palace_security_directorate:0 "Директорат дворцовой безопасности"
 HSM_CYA_palace_security_directorate_desc:0 "Позволить Донкло формализовать дворцовую стражу, курьерский надзор и досье, которые решают, кто может стоять рядом с графиней."
 HSM_CYA_field_security_battalions:0 "Полевые батальоны безопасности"
 HSM_CYA_field_security_battalions_desc:0 "Сформировать дисциплинированные отряды безопасности для полевых штабов и железнодорожных узлов до открытой провинциальной полицейщины Донкло."
 HSM_CYA_the_colonels_household:0 "Ставка Донкло"
 HSM_CYA_the_colonels_household_desc:0 "Превратить частный аппарат дворцовой безопасности в личную ставку Донкло, пусть формально она все еще служит двору графини."
 HSM_CYA_the_revealed_exile:0 "Раскрытый изгнанник"
 HSM_CYA_the_revealed_exile_desc:0 "Роль Донкло больше нельзя считать безобидной канцелярской должностью. Если он правит из тени, тень должна стать дисциплинированной."
 HSM_CYA_cabinet_procurement_board:0 "Кабинетский совет снабжения"
 HSM_CYA_cabinet_procurement_board_desc:0 "Передать заказы мастерских кабинетскому совету, чтобы военное производство восстановилось, но не ушло из-под имперского надзора."
 HSM_CYA_rationalise_proxy_quotas:0 "Упорядочить прокси-квоты"
 HSM_CYA_rationalise_proxy_quotas_desc:0 "Договориться с Грифенхеймом о предсказуемых фабричных квотах: все еще болезненных, но менее хаотичных для цианолизийских книг."
 HSM_CYA_dawnclaw_hiding:0 "Прикрытие Донкло"
 HSM_CYA_dawnclaw_hiding_desc:0 "§YТекущая раскрытость§!: §R[?Root.HSM_CYA_dawnclaw_exposure|0]§!/§Y10§!\n\nРаскрытость растет на §R1§! каждую неделю, пока Донкло скрывается. Оборонительный путь не добавляет дополнительного давления. Доминирование графини добавляет §R+1§! в неделю, а доминирование Донкло добавляет §R+2§! в неделю.\n\nПри §Y7§! раскрытости агенты Грифенхейма начинают приближаться. Если раскрытость достигнет §R10§!, покушение сработает. Решения графини опираются на бумаги и придворные алиби; решения Донкло быстрее и жестче, но политически опаснее."
 HSM_CYA_griffenheim_agents_closing_in:0 "Агенты Грифенхейма приближаются"
 HSM_CYA_griffenheim_agents_closing_in_desc:0 "Имперские агенты собрали достаточно обрывков, чтобы начать выслеживать передвижения Донкло. Опустите его раскрытость ниже §Y7§!, чтобы сбить их со следа."
 HSM_CYA_maintain_dawnclaw_cover:0 "Поддерживать прикрытие Донкло"
 HSM_CYA_maintain_dawnclaw_cover_desc:0 "Обновить фальшивые бумаги, переставить слуг и убедиться, что помощник графини остается помощником хотя бы на бумаге."
 HSM_CYA_counterintelligence_sweep:0 "Контрразведывательная зачистка"
 HSM_CYA_counterintelligence_sweep_desc:0 "Поручить верным офицерам отследить утечки, изолировать подозрительных курьеров и скрыть признаки того, что Донкло действует изнутри двора."
 HSM_CYA_stage_loyalist_raids:0 "Устроить рейды лоялистов"
 HSM_CYA_stage_loyalist_raids_desc:0 "Лоялисты Донкло могут ударить по подозреваемым имперским контактам до того, как те отправят доклад, но такое насилие потрясет двор."
 HSM_CYA_disappear_compromised_witnesses:0 "Убрать скомпрометированных свидетелей"
 HSM_CYA_disappear_compromised_witnesses_desc:0 "Несколько слуг, курьеров и младших офицеров знают слишком много. Люди Донкло могут решить эту проблему, хотя тишину заметят."
 HSM_CYA_rotate_palace_servants:0 "Переставить дворцовую прислугу"
 HSM_CYA_rotate_palace_servants_desc:0 "Перевести горничных, клерков, стражу и кухонных работников между домами, чтобы ни один свидетель не мог описать распорядок Донкло."
 HSM_CYA_courtly_alibi_network:0 "Сеть придворных алиби"
 HSM_CYA_courtly_alibi_network_desc:0 "Дом графини может похоронить Донкло под приглашениями, приемами и ложными свидетелями, из-за которых имперские отчеты будут противоречить друг другу."
 HSM_CYA_false_griffenheim_leak:0 "Ложная утечка в Грифенхейм"
 HSM_CYA_false_griffenheim_leak_desc:0 "Подбросить имперским агентам убедительный след к неверному подвалу, неверному курьеру и неверному офицеру, покупая Донкло время ценой нового публичного беспокойства."
 HSM_CYA_integrate_minotaur_outback:0 "Закрепить автономию глубинки"
 HSM_CYA_integrate_minotaur_outback_desc:0 "Умиротворить глубинку через зарегистрированные местные привилегии, ограниченное самоуправление и предсказуемые обязательства, а не прямую ассимиляцию."
 HSM_CYA_police_minotaur_outback:0 "Патрули минотаврийской глубинки"
 HSM_CYA_police_minotaur_outback_desc:0 "Донкло отвергает сделку с советами глубинки. Патрули нанесут дороги на карту, осведомители назовут старейшин, а каждый поселок узнает, чья печать теперь нужна для проезда."
 CYA_policed_outback:0 "Патрулируемая минотаврийская глубинка"
 CYA_policed_outback_desc:0 "Значительные силы направлены на контроль внутренних минотаврийских районов. Патрули, регистрация и силовое давление ослабляют местную автономию, но позволяют государству выполнять новые требования."
 CYA_opened_outback:0 "Открытая минотаврийская глубинка"
 CYA_opened_outback_desc:0 "Внутренние минотаврийские районы получили больше легальных каналов для торговли, местных советов и сотрудничества с цианолизийской администрацией."
 CYA_ignored_outback:0 "Заброшенная минотаврийская глубинка"
 CYA_ignored_outback_desc:0 "Внутренние минотаврийские районы оставлены без достаточного надзора и реформ, что сохраняет старые проблемы на южной периферии."
 HSM_CYA_delegate_security_to_dawnclaw:0 "Передать безопасность Донкло"
 HSM_CYA_delegate_security_to_dawnclaw_desc:0 "Графиня может передать Донкло охрану, архивы и право допрашивать собственных офицеров. Узнав, кто входит во дворец, он вскоре поймет, кто в нем действительно правит."
 HSM_CYA_expand_countess_cabinet:0 "Расширить кабинет графини"
 HSM_CYA_expand_countess_cabinet_desc:0 "Усилить гражданскую администрацию до того, как офицеры изгнанника станут единственной организованной фракцией при дворе."
 HSM_CYA_install_imperial_cabinet:0 "Учредить Имперский кабинет"
 HSM_CYA_install_imperial_cabinet_desc:0 "Принять гриффенхеймских клерков, инспекторов и торговых чиновников как цену восстановления порядка после смерти Донкло."
 HSM_CYA_regularise_minotaur_administration:0 "Упорядочить минотаврийскую администрацию"
 HSM_CYA_regularise_minotaur_administration_desc:0 "Заменить чрезвычайные патрули зарегистрированными советами, контролируемыми разрешениями и предсказуемыми налоговыми конторами в глубинке."
 HSM_CYA_reopen_military_workshops:0 "Открыть военные мастерские"
 HSM_CYA_reopen_military_workshops_desc:0 "Восстановить несколько простаивающих мастерских под надзором кабинета, достаточно для стабилизации производства, но недостаточно для независимости армии."
 HSM_CYA_consolidate_proxy_cabinet:0 "Укрепить прокси-кабинет"
 HSM_CYA_consolidate_proxy_cabinet_desc:0 "Превратить временный имперский комитет в рабочую администрацию, внутри которой цианолизийские чиновники смогут выжить."
 HSM_CYA_frontier_march_policy:0 "Политика Цианолизийской марки"
 HSM_CYA_frontier_march_policy_desc:0 "Донкло может осматривать пограничные укрепления и исправлять планы, но не командовать двором. Марка должна защищать Цианолизию, а не стать армией будущего претендента."
 HSM_CYA_reorganised_border_forces:0 "Реорганизованные пограничные силы"
 HSM_CYA_reorganised_border_forces_desc:0 "Пограничные силы рестандартизированы скучными уставами, повторяющимися учениями и беспощадным вниманием Донкло к мелким ошибкам."
 HSM_CYA_frontier_drill_standards_idea:0 "Пограничные стандарты учений"
 HSM_CYA_frontier_drill_standards_idea_desc:0 "Каждая пограничная рота теперь использует одинаковые учения, проверки снабжения и оборонительные порядки."
 HSM_CYA_internal_intelligence_modernisation:0 "Модернизированная внутренняя разведка"
 HSM_CYA_internal_intelligence_modernisation_desc:0 "Знания Донкло теперь служат ограниченному бюро внутренней разведки. Устройство достаточно открыто, чтобы казаться безобидным, и достаточно полезно, чтобы его сохранить."
 HSM_CYA_frontier_signals_network_idea:0 "Пограничная сеть связи"
 HSM_CYA_frontier_signals_network_idea_desc:0 "Доклады из марки теперь идут через тихую сеть курьеров, постов наблюдения и гражданских разведывательных клерков."
 HSM_CYA_local_supply_depots_idea:0 "Местные склады снабжения"
 HSM_CYA_local_supply_depots_idea_desc:0 "Пограничные запасы Цианолизии малы, рассредоточены и скучно учтены, и именно поэтому они работают."
 HSM_CYA_minotaurian_border_works:0 "Минотаврийские пограничные укрепления"
 HSM_CYA_minotaurian_border_works_desc:0 "Южные подходы подготовлены бункерами, складами, полевыми картами и упрямыми местными гарнизонами."
 HSM_CYA_sicameon_watch_posts:0 "Посты наблюдения за Сикамеоном"
 HSM_CYA_sicameon_watch_posts_desc:0 "Цианолизийские наблюдатели следят за западными подходами через курьеров, станции связи и тихую подозрительность."
 HSM_CYA_proclaimed_cyanolisian_march:0 "Провозглашенная Цианолизийская марка"
 HSM_CYA_proclaimed_cyanolisian_march_desc:0 "Пограничью дали имя и задачу: выдерживать давление, отвечать на рейды и удерживать границу графини."
 HSM_CYA_unlikely_marriage:0 "Невероятный брак"
 HSM_CYA_unlikely_marriage_desc:0 "Клятвы не разрешили ни одного придворного страха. Тэйллоу дала изгнаннику свое имя, а Донкло ей - силу своего штаба. Каждое назначение теперь показывает, чей дар весомее."
 HSM_CYA_dawnclaw_dominant_court:0 "Донкло доминирует при дворе"
 HSM_CYA_dawnclaw_dominant_court_desc:0 "Графиня все еще подписывает приказы, но канцелярия Донкло решает, что попадет к ней на стол."
 HSM_CYA_security_directorate_court:0 "Двор директората безопасности"
 HSM_CYA_security_directorate_court_desc:0 "Графиня по-прежнему принимает просителей, но каждую бумагу до нее читает сотрудник безопасности. Донкло незачем запрещать приказ, если его ведомство решает, что попадет на стол."
 HSM_CYA_colonels_household:0 "Ставка Донкло"
 HSM_CYA_colonels_household_desc:0 "Дворцовая стража, курьерские комнаты и клерки безопасности все чаще отвечают ставке Донкло раньше всех прочих."
 HSM_CYA_countess_dominant_court:0 "Графиня доминирует при дворе"
 HSM_CYA_countess_dominant_court_desc:0 "Офицеры Донкло вправе советовать, но больше не решают, кого допустить к графине. Печати, назначения и скучная повседневная власть снова в руках чиновников Тэйллоу."
 HSM_CYA_countess_civilian_court:0 "Гражданский двор связи"
 HSM_CYA_countess_civilian_court_desc:0 "Гражданские клерки сидят рядом с офицерами безопасности, превращая полезность Донкло в бумаги, которыми управляет графиня."
 HSM_CYA_household_compact:0 "Дворцовый договор"
 HSM_CYA_household_compact_desc:0 "Новое соглашение двора делает Донкло инструментом власти графини, а не соперничающим центром силы."
 HSM_CYA_hidden_assistant_court:0 "Скрытый помощник"
 HSM_CYA_hidden_assistant_court_desc:0 "Работа Донкло полезна, узка и публично отрицаема. Именно таким его предпочитает видеть графиня."
 HSM_CYA_countess_alone_court:0 "Графиня главенствует"
 HSM_CYA_countess_alone_court_desc:0 "Брак остается полезным, но двор усвоил таланты Донкло, не разделив с ним суверенитет."
 HSM_CYA_revealed_exile_regime:0 "Раскрытый изгнанник"
 HSM_CYA_revealed_exile_regime_desc:0 "Донкло больше не просто скрывается при дворе. Его враги подозревают правду, а его сторонники начинают вести себя как режим."
 HSM_CYA_imperial_administration:0 "Имперская администрация"
 HSM_CYA_imperial_administration_desc:0 "Бумаги Донкло пережили его влияние при дворе. Временный кабинет разбирает его связи и долги, надеясь не дать присутствию изгнанника обернуться новым кризисом."
 HSM_CYA_gri_proxy_rule:0 "Прокси-правление Грифенхейма"
 HSM_CYA_gri_proxy_rule_desc:0 "Советники Грифенхейма сводят цианолизийские счета, отводя заводы и заказы Империи. Взамен кабинет получает порядок и доступ к рынку, но уже не может свободно распоряжаться благополучием, которое считает своим."
 HSM_CYA_imperial_cabinet_direct_rule:0 "Прямое управление из Таймштадта"
 HSM_CYA_imperial_cabinet_direct_rule_desc:0 "Старый аппарат прямого управления теперь подчиняется Таймштадту через имперских инспекторов, местных писарей и тщательно проверяемых цианолизийских администраторов."
 HSM_CYA_consolidated_direct_rule:0 "Укрепленное прямое правление кабинета"
 HSM_CYA_consolidated_direct_rule_desc:0 "Прокси-кабинет стал достаточно скучным, чтобы работать, что, возможно, является высшей похвалой для такой администрации."
 HSM_CYA_imperial_workshop_program:0 "Имперская программа мастерских"
 HSM_CYA_imperial_workshop_program_desc:0 "Ограниченная программа восстановления производства поддерживает работу цианолизийских мастерских под надзором кабинета."
 HSM_CYA_cabinet_procurement_board_idea:0 "Кабинетский совет снабжения"
 HSM_CYA_cabinet_procurement_board_idea_desc:0 "Военные закупки теперь проходят через книги, устраивающие и цианолизийские мастерские, и имперских инспекторов."
 HSM_CYA_rationalised_proxy_quotas:0 "Упорядоченные прокси-квоты"
 HSM_CYA_rationalised_proxy_quotas_desc:0 "Фабричные уступки Грифенхейму остаются болезненными, но квоты достаточно предсказуемы, чтобы Цианолизия могла планировать вокруг них."
 HSM_CYA_dawnclaw_asylum_scheduled:0 "Событие убежища Донкло назначено"
 HSM_CYA_dawnclaw_asylum_resolved:0 "Вопрос убежища Донкло решен"
 HSM_CYA_dawnclaw_hidden_in_court:0 "Донкло скрывается при дворе графини"
 HSM_CYA_dawnclaw_branch_unlocked:0 "Цианолизийская ветка Донкло открыта"
 HSM_CYA_dawnclaw_path_chosen:0 "Для Донкло выбрана роль"
 HSM_CYA_dawnclaw_married_countess:0 "Донкло женился на графине"
 HSM_CYA_dawnclaw_dead:0 "Донкло мертв"
 HSM_CYA_dawnclaw_advisor_role_confirmed:0 "Донкло сведен к роли советника"
 HSM_CYA_dawnclaw_identity_secured:0 "Личность Донкло защищена"
 HSM_CYA_dawnclaw_revealed_to_empire:0 "Донкло раскрыт Грифенхейму"
 HSM_CYA_dawnclaw_assassination_pending:0 "Агенты Грифенхейма приближаются"
 HSM_CYA_dawnclaw_assassination_launched:0 "Агенты Грифенхейма перешли к удару"
 HSM_CYA_dawnclaw_assassination_risk_ended:0 "Риск покушения на Донкло завершен"
 HSM_CYA_path_frontier_march:0 "Цианолизия выбрала путь пограничной марки"
 HSM_CYA_path_marriage:0 "Цианолизия выбрала путь брака"
 HSM_CYA_path_imperial_administration:0 "Цианолизия выбрала путь Имперской администрации"
 HSM_CYA_countess_dominant:0 "Графиня доминирует при дворе"
 HSM_CYA_dawnclaw_dominant:0 "Донкло доминирует при дворе"
 HSM_CYA_frontier_march_formed:0 "Цианолизийская марка сформирована"
 HSM_CYA_border_claims_prepared:0 "Пограничные претензии подготовлены"
 HSM_CYA_gri_proxy_rule_installed:0 "Прокси-правление Грифенхейма установлено"
 HSM_CYA_blackrock_wasteland_surveys:0 "Исследования пустошей Блэкрока"
 HSM_CYA_blackrock_wasteland_surveys_desc:0 "Нанести на карты дороги, колодцы и руины северных пустошей до попытки восстановить там порядок."
 HSM_CYA_restore_frontier_county:0 "Восстановить пограничное графство"
 HSM_CYA_restore_frontier_county_desc:0 "Пустошами Блэкрока нельзя управлять из далекой столицы. Новое графское управление, землемеры и постоянный гарнизон дадут северной границе власть, чья печать дотянется дальше большой дороги."
 HSM_CYA_frontier_county_garrisons:0 "Гарнизоны пограничного графства"
 HSM_CYA_frontier_county_garrisons_desc:0 "Восстановленной администрации нужны солдаты, способные отвечать на рейды и уважать местные книги учета."
 HSM_CYA_countess_border_modernisation:0 "Модернизация границы"
 HSM_CYA_countess_border_modernisation_desc:0 "Регентство графини начинается с дорог, складов, клерков и оборонительных расписаний, а не с громких деклараций."
 HSM_CYA_aristocratic_credit_lines:0 "Аристократические кредитные линии"
 HSM_CYA_aristocratic_credit_lines_desc:0 "Землевладельцы и старые семьи профинансируют первую волну реформ, если их место в новом порядке будет уважено."
 HSM_CYA_countess_minotaur_charter:0 "Минотаврийская хартия"
 HSM_CYA_countess_minotaur_charter_desc:0 "Умиротворение при графине означает контролируемую автономию: местные советы, зарегистрированные привилегии и понятные обязательства."
 HSM_CYA_prepare_asterion_protectorate:0 "Подготовить протекторат Астериона"
 HSM_CYA_prepare_asterion_protectorate_desc:0 "Минотаврия демократична, милитаризована, дружит с Сикамеоном и угрожает южной границе. План протектората должен быть готов."
 HSM_CYA_subdue_asterion:0 "Подчинить Астерион"
 HSM_CYA_subdue_asterion_desc:0 "Независимость Астериона стала стратегической угрозой. Графиня обернет войну в законную защиту и создание зависимого протектората."
 HSM_CYA_countess_sicameon_settlement:0 "Документы сикамеонского урегулирования"
 HSM_CYA_countess_sicameon_settlement_desc:0 "Антимонархическая республика Сикамеона не должна угрожать побережью. Нужно подготовить урегулирование, связывающее его порты с Цианолизией."
 HSM_CYA_claim_sicameon_coast:0 "Претензия на побережье Сикамеона"
 HSM_CYA_claim_sicameon_coast_desc:0 "Западное побережье должно быть обеспечено до того, как фронтир станет дорогой к Грифусу и Герцланду."
 HSM_CYA_frontier_aristocratic_league:0 "Пограничная аристократическая лига"
 HSM_CYA_frontier_aristocratic_league_desc:0 "Связать земельные дома, торговый кредит и верных офицеров в консервативную лигу управления фронтиром."
 HSM_CYA_evi_valley_protectorates:0 "Протектораты долины Эви"
 HSM_CYA_evi_valley_protectorates_desc:0 "Грифус, Бродфельд и Луши нельзя оставить для враждебных коалиций, пока Цианолизия готовится к имперскому вопросу."
 HSM_CYA_regency_prepares_for_herzland:0 "Подготовить наступление на Герцланд"
 HSM_CYA_regency_prepares_for_herzland_desc:0 "Графиня не требует трон для себя. Она готовит штаб, склады и политическую легенду регентства, способного вернуть Гровера VI в Грифенхейм."
 HSM_CYA_countess_herzland_reconstruction:0 "Бюро восстановления Герцланда"
 HSM_CYA_countess_herzland_reconstruction_desc:0 "После взятия Грифенхейма и заявления имперской преемственности регентству придется заменить разруху едой, железными дорогами, налоговыми книгами и местным порядком."
 HSM_CYA_restore_imperial_provinces:0 "Восстановить имперские провинции"
 HSM_CYA_restore_imperial_provinces_desc:0 "Грифенхейм и княжества Герцланда должны перейти под власть Цианолизии, прежде чем регентство сможет заявить об имперской преемственности."
 HSM_CYA_countess_regency_for_grover:0 "Хранительница имперской короны"
 HSM_CYA_countess_regency_for_grover_desc:0 "Графиня хранит корону до объединения Грифонии. Живой Гровер получит ее; если его больше нет, она удержит державу, не присваивая его имя."
 HSM_CYA_dawnclaw_corporate_rearmament:0 "Корпоративное перевооружение"
 HSM_CYA_dawnclaw_corporate_rearmament_desc:0 "Донкло раздает контракты фабрикам и фирмам, готовым принять дисциплину, секретность и ускоренные квоты."
 HSM_CYA_imperial_officer_cells:0 "Ячейки имперских офицеров"
 HSM_CYA_imperial_officer_cells_desc:0 "Офицеры-изгнанники, националисты и старые армейские контакты организуются в ячейки для будущего похода на Герцланд."
 HSM_CYA_security_districts:0 "Округа безопасности"
 HSM_CYA_security_districts_desc:0 "Тайная полиция Донкло делит страну на наблюдаемые округа, где документы, поездки и лояльность больше не являются личным делом."
 HSM_CYA_operation_against_asterion:0 "Операция против Астериона"
 HSM_CYA_operation_against_asterion_desc:0 "Астерион не сосед для переговоров. Это фланг, который нужно сломать и превратить в зависимый протекторат."
 HSM_CYA_military_governorate_asterion:0 "Командование протектората Астерион"
 HSM_CYA_military_governorate_asterion_desc:0 "Когда Астерион подчинен, его правительство останется на карте как буфер, но дороги, гавани и штабные решения будут зависеть от цианолизийских офицеров."
 HSM_CYA_sicameon_security_corridor:0 "Коридор безопасности Сикамеона"
 HSM_CYA_sicameon_security_corridor_desc:0 "Порты и милиции Сикамеона слишком опасны, чтобы оставлять их в покое. Донкло прорубит коридор к побережью."
 HSM_CYA_frontier_military_governorates:0 "Удар по долине Эви"
 HSM_CYA_frontier_military_governorates_desc:0 "Грифус, Бродфельд, Луши и окружающие государства фронтира будут вскрыты силой до того, как Донкло повернет всю марку к Грифенхейму."
 HSM_CYA_nationalist_frontier_mobilisation:0 "Националистическая мобилизация фронтира"
 HSM_CYA_nationalist_frontier_mobilisation_desc:0 "Националисты, ветераны и имперские лоялисты поведут Цианолизию от войны на фронтире к войне за Герцланд."
 HSM_CYA_prepare_herzland_offensive:0 "Подготовить наступление на Герцланд"
 HSM_CYA_prepare_herzland_offensive_desc:0 "Возвращение Донкло потребует карт, коллаборационистов, складов и государства, готового тратить себя."
 HSM_CYA_herzland_reconstruction_authority:0 "Управление восстановления Герцланда"
 HSM_CYA_herzland_reconstruction_authority_desc:0 "Только после падения Грифенхейма и провозглашения Цианолизии наследницей Империи Донкло сможет заменить разруху пайковыми бюро, полицейскими реестрами и обязательными контрактами."
 HSM_CYA_march_on_imperial_provinces:0 "Поход на имперские провинции"
 HSM_CYA_march_on_imperial_provinces_desc:0 "Старые имперские провинции либо признают командование Донкло, либо станут вражеской территорией."
 HSM_CYA_question_of_grover:0 "Вопрос Гровера"
 HSM_CYA_question_of_grover_desc:0 "Грифенхейм пал, но имя Гровера VI по-прежнему связывает многие земли. Он может быть воспитанником под опекой, правителем, уже носившим корону, или воспоминанием, недосягаемым для Донкло. Новому государству предстоит решить, что теперь значит его право на престол."
 HSM_CYA_execute_the_child_emperor:0 "Казнить Гровера VI"
 HSM_CYA_execute_the_child_emperor_desc:0 "Донкло может покончить с притязанием Гровера одним приказом. Соперника не станет, но каждый прежний сторонник Империи будет знать, чьей кровью оплачена его власть."
 HSM_CYA_the_puppet_emperor:0 "Марионеточный император"
 HSM_CYA_the_puppet_emperor_desc:0 "Живой Гровер может освятить завоевания, не командуя ими. Донкло сохранит ему жизнь, назначит его окружение и сам решит, какие указы скрепить императорской печатью."
 HSM_CYA_the_child_may_rule:0 "Гровер может править"
 HSM_CYA_the_child_may_rule_desc:0 "Донкло завершит завоевание именем Гровера, а затем уступит ему трон. Император получит объединенную державу, но ее армия и ведомства отвыкли действовать без Донкло."
 HSM_CYA_empty_throne_proclamation:0 "Государство пережило династию"
 HSM_CYA_empty_throne_proclamation_desc:0 "У объединенной державы нет Гровера на троне. Донкло должен сохранить имперские учреждения, независимо от того, убил ли он наследника сам или застал двор уже в трауре."
 HSM_CYA_purge_groverite_clergy:0 "Сломать гроверистские кафедры"
 HSM_CYA_purge_groverite_clergy_desc:0 "Священники и придворные лоялисты, все еще говорящие о праве крови, могут превратить скорбь в мятеж. Их сети нужно учесть, расколоть и заставить молчать."
 HSM_CYA_boreas_without_bloodline:0 "Борей без родословной"
 HSM_CYA_boreas_without_bloodline_desc:0 "Юристы Донкло утверждают, что Борей благословил Империю, а не беспомощную линию крови. Новое государство священно потому, что оно победило."
 HSM_CYA_caged_coronation:0 "Трон под замком"
 HSM_CYA_caged_coronation_desc:0 "Корона Гровера может быть новой или возвращенной после прежнего правления. Канцелярии Донкло по-прежнему определяют двор и пределы власти императора."
 HSM_CYA_court_of_supervised_oaths:0 "Двор контролируемых клятв"
 HSM_CYA_court_of_supervised_oaths_desc:0 "Знать, офицеры, епископы и бургомистры присягнут Гроверу, а штаб Донкло отметит каждое промедление. Верность короне станут оценивать те, кто контролирует ее двор."
 HSM_CYA_puppet_imperial_tours:0 "Имперские поездки под охраной"
 HSM_CYA_puppet_imperial_tours_desc:0 "Гровера повезут по Грифонии под охраной солдат, а речи для него напишут в ведомствах Донкло. Толпа может приветствовать императора, но расписание принадлежит другому."
 HSM_CYA_grover_restoration_ceremony:0 "Первые указы Гровера"
 HSM_CYA_grover_restoration_ceremony_desc:0 "Гровер VI получил корону и государство, выкованное Донкло. Его первые указы покажут, станет ли он хозяином унаследованной машины или только ее самым высоким чиновником."
 HSM_CYA_steel_regency_statutes:0 "Стальные статуты регентства"
 HSM_CYA_steel_regency_statutes_desc:0 "Гровер может сидеть на троне, но восстановленная армия, полиция и бюро реконструкции останутся достаточно близко, чтобы предотвратить новый крах."
 HSM_CYA_reconciled_imperial_oaths:0 "Примиренные имперские клятвы"
 HSM_CYA_reconciled_imperial_oaths_desc:0 "Бывшим врагам, испуганным лоялистам и фронтирным коллаборационистам предлагают окончательную формулу: служить Гроверу, принять новый порядок и выжить."
 HSM_CYA_empire_after_grover:0 "Империя за пределами Грифенхейма"
 HSM_CYA_empire_after_grover_desc:0 "Грифенхейм взят, но столица еще не континент. Жив ли Гровер под опекой, предназначен ли ему трон или он уже потерян, Донкло должен направить южную державу ко всем границам, которых пока не достигла Империя."
 HSM_CYA_cross_the_river_frontier:0 "Перейти речной фронтир"
 HSM_CYA_cross_the_river_frontier_desc:0 "Река была границей старой Империи, но не карт Донкло. Генералы готовят переправы, а канцелярия составляет планы зависимого управления для земель, которые не станут частью грифоньего ядра."
 HSM_CYA_the_northern_submission:0 "Подчинение севера"
 HSM_CYA_the_northern_submission_desc:0 "Северные дворы выживали, сталкивая великие державы между собой. Донкло не оставит им этой возможности: сдать армию, сохранить администрацию под надзором или встретить его штаб на дороге к югу."
 HSM_CYA_break_the_lake_countries:0 "Сломить Озерные земли"
 HSM_CYA_break_the_lake_countries_desc:0 "Грифонстоун и озерные княжества не могут оставаться независимым центром легитимности, пока Донкло претендует на всю Грифонию."
 HSM_CYA_crush_the_western_crowns:0 "Сокрушить западные короны"
 HSM_CYA_crush_the_western_crowns_desc:0 "Корона Аквелии и западные парламенты помнят собственную независимость. Донкло намерен разбить их армии, а затем лишить силы старые законы, вокруг которых могла бы собраться новая коалиция."
 HSM_CYA_claim_the_southern_crowns:0 "Заявить права на южные короны"
 HSM_CYA_claim_the_southern_crowns_desc:0 "Вингбардия и южные короны торгуют через моря, которые армия не перейдет маршем. Донкло все равно называет их потерянными провинциями и приказывает флоту сделать эту выдумку законом."
 HSM_CYA_subdue_the_hillponies:0 "Подчинить Беоргфордас"
 HSM_CYA_subdue_the_hillponies_desc:0 "Пони холмов могут быть отдаленными, раздробленными или объединенными под одним знаменем. На карте Донкло их родина все равно остается частью Грифонии."
 HSM_CYA_western_imperial_circuits:0 "Западные имперские округа"
 HSM_CYA_western_imperial_circuits_desc:0 "Военные районы должны уступить место судам, железнодорожным управлениям, налоговым бюро и провинциальным командованиям, способным удержать западную Грифонию."
 HSM_CYA_eastern_imperial_circuits:0 "Восточные имперские округа"
 HSM_CYA_eastern_imperial_circuits_desc:0 "Грифонские округа подчинятся судам и железным дорогам Грифенхейма. Речным землям и стране пагорбовых пони нужен иной порядок: зависимые администрации под имперским надзором, а не включение в ядро."
 HSM_CYA_one_griffonia_under_claw:0 "Одна Грифония под одной лапой"
 HSM_CYA_one_griffonia_under_claw_desc:0 "Последние независимые знамена пали или принесли зависимую присягу. Изгнанник, прибывший под чужим именем, теперь повелевает континентом; сделанный им выбор о судьбе Гровера должен стать порядком, по которому этот континент будет жить."
 HSM_CYA_western_griffonia_secured_tt:0 "Все государства северной, озерной, западной и южной Грифонии уничтожены или являются нашими субъектами"
 HSM_CYA_eastern_griffonia_secured_tt:0 "Все государства Речных земель и Беоргфордаса уничтожены или являются нашими субъектами"
 HSM_CYA_regency_coronation_preparations:0 "Комиссия по передаче короны"
 HSM_CYA_regency_coronation_preparations_desc:0 "Герольды, юристы и делегаты провинций готовят законную передачу объединенной державы Гроверу VI."
 HSM_CYA_crown_in_trust:0 "Корона на хранении"
 HSM_CYA_crown_in_trust_desc:0 "У регентства осталось последнее обещание: Империя не принадлежит графине, и корона должна перейти к Гроверу VI."
 HSM_CYA_groverite_reconciliation:0 "Примирение гроверистов"
 HSM_CYA_groverite_reconciliation_desc:0 "Старых имперских лоялистов возвращают через помилования, придворные назначения и осторожные приглашения служить восстановленному императору."
 HSM_CYA_regency_constitution:0 "Конституция регентства"
 HSM_CYA_regency_constitution_desc:0 "Короткое конституционное урегулирование определит чрезвычайные полномочия регентства, наследование императора и права провинций."
 HSM_CYA_frontier_county_administration:0 "Администрация пограничного графства"
 HSM_CYA_frontier_county_administration_desc:0 "Пустоши Блэкрока управляются через восстановленное пограничное графство, связанное с Цианолизийской маркой."
 HSM_CYA_countess_frontier_reforms:0 "Пограничные реформы графини"
 HSM_CYA_countess_frontier_reforms_desc:0 "Тэйллоу финансирует дороги и склады, которые местные советы смогут содержать после ухода войск. Границу следует защищать как место, где живут люди, а не просто черту на штабной карте."
 HSM_CYA_aristocratic_credit_network:0 "Аристократическая кредитная сеть"
 HSM_CYA_aristocratic_credit_network_desc:0 "Помещичьи семьи дают регентству деньги под будущие сборы и урожаи. Их кредиты помогут восстановить фронтир, но записи в книгах напомнят Тэйллоу, кто ждет слова в его управлении."
 HSM_CYA_countess_mit_protectorate:0 "Планы протектората Астериона"
 HSM_CYA_countess_mit_protectorate_desc:0 "Тэйллоу называет южную кампанию установлением протектората, а не завоеванием. Ее послы обещают местные собрания и безопасные дороги, пока армия составляет условия этих обещаний."
 HSM_CYA_countess_sicameon_mandate:0 "Документы мандата Сикамеона"
 HSM_CYA_countess_sicameon_mandate_desc:0 "Цианолизия готовится связать побережье Сикамеона торговлей, портовым надзором и консервативным управлением."
 HSM_CYA_frontier_aristocratic_league_idea:0 "Пограничная аристократическая лига"
 HSM_CYA_frontier_aristocratic_league_idea_desc:0 "Земельные дома дают связи, купцы кредиты, а офицеры силу. Лига удержит фронтир вместе, пока никто из участников не примет сотрудничество за капитуляцию."
 HSM_CYA_regency_claim:0 "Претензия регентства"
 HSM_CYA_regency_claim_desc:0 "Тэйллоу не требует короны для себя. Она просит офицеров и провинциальную знать следовать за регентом, обещающим сохранить имперскую преемственность, пока разорванную державу собирают заново."
 HSM_CYA_herzland_reconstruction:0 "Восстановление Герцланда"
 HSM_CYA_herzland_reconstruction_desc:0 "Падение столицы не открыло рынки и не накормило провинции. Восстановление начинается со спорной собственности, разрушенных путей и чиновников, готовых работать на победивших их правителей."
 HSM_CYA_grover_regency:0 "Регентство для Гровера VI"
 HSM_CYA_grover_regency_desc:0 "Имя Гровера стоит на воззваниях регентства, но приказы о хлебе и охране подписывает Тэйллоу. Ее власть держится на обещании вернуть то, что так легко было бы оставить себе."
 HSM_CYA_regency_coronation_commission:0 "Коронационная комиссия"
 HSM_CYA_regency_coronation_commission_desc:0 "Герольды, юристы, епископы и верные офицеры готовят законный и церемониальный путь к коронации Гровера VI."
 HSM_CYA_crown_in_trust_idea:0 "Корона на хранении"
 HSM_CYA_crown_in_trust_idea_desc:0 "Регентство считает корону доверенной ему обязанностью, а не трофеем. С каждой провинцией, возвращенной Грифенхейму, передача власти Гроверу становится и неизбежнее, и труднее."
 HSM_CYA_groverite_reconciliation_idea:0 "Примирение гроверистов"
 HSM_CYA_groverite_reconciliation_idea_desc:0 "Старые имперские семьи возвращаются на должности при условии верности регентству. Помилования приводят их ко двору, где доверие еще предстоит заслужить."
 HSM_CYA_regency_constitution_idea:0 "Конституция регентства"
 HSM_CYA_regency_constitution_idea_desc:0 "Полномочия регентства, наследование короны и обязанности провинций теперь записаны в компактном консервативном урегулировании."
 HSM_CYA_corporate_rearmament:0 "Корпоративное перевооружение"
 HSM_CYA_corporate_rearmament_desc:0 "Заводы получают твердые заказы и жесткие сроки от ведомства Донкло. Директора, прежде торговавшиеся с министрами, теперь видят офицеров у бухгалтерских книг и станков."
 HSM_CYA_imperial_officer_cells_idea:0 "Ячейки имперских офицеров"
 HSM_CYA_imperial_officer_cells_idea_desc:0 "Офицеры-изгнанники хранят адреса, пароли и связи с поставщиками под гражданскими именами. Каждая ячейка может помочь следующему походу, не выдав остальных раньше времени."
 HSM_CYA_security_districts_idea:0 "Округа безопасности"
 HSM_CYA_security_districts_idea_desc:0 "Окружные управления сверяют пропуска, письма и списки домохозяйств. Режим с каждым месяцем знает о подданных больше, хотя знать, где живет недовольство, еще не значит покончить с ним."
 HSM_CYA_military_governorates:0 "Военные губернаторства"
 HSM_CYA_military_governorates_desc:0 "За наступающей армией остаются коменданты, переписи и приказы о реквизициях. Гражданские ведомства придут позже; пока каждый занятый округ подчиняется офицеру, который держит его дороги."
 HSM_CYA_nationalist_frontier_mobilisation_idea:0 "Националистическая мобилизация фронтира"
 HSM_CYA_nationalist_frontier_mobilisation_idea_desc:0 "Клубы ветеранов становятся призывными пунктами, на площадях вновь поют старые имперские песни. Донкло может направить этот пыл на Грифенхейм, но не решить за сторонников, чего они потребуют потом."
 HSM_CYA_herzland_reconstruction_authority_idea:0 "Управление наступления на Герцланд"
 HSM_CYA_herzland_reconstruction_authority_idea_desc:0 "Одно управление теперь отвечает за рельсы, пайки и замену чиновников. Его служащие готовятся к походу, победа в котором ничего не даст, если потом не удастся прокормить Грифенхейм."
 HSM_CYA_child_emperor_executed:0 "Гровер VI казнен"
 HSM_CYA_child_emperor_executed_desc:0 "Донкло убил Гровера, чье имя еще недавно связывало Империю. Вопрос престолонаследия решен силой, но каждому двору и храму теперь предстоит решить, что значит верность мертвому."
 HSM_CYA_empty_throne_proclamation_idea:0 "Пустой трон"
 HSM_CYA_empty_throne_proclamation_idea_desc:0 "Трон остается в зале, но ни один Гровер его не займет. Донкло требует присяги самому государству, зная, что гибель династии не заставит верных ей забыть покойных."
 HSM_CYA_purged_groverite_clergy:0 "Очищенное гроверистское духовенство"
 HSM_CYA_purged_groverite_clergy_desc:0 "Двор отстраняет жрецов, продолжающих проповедовать права династии, и следит за оставленными ими храмами. Проповеди стали тише, но это молчание нельзя принимать за согласие."
 HSM_CYA_boreas_without_bloodline_idea:0 "Борей без родословной"
 HSM_CYA_boreas_without_bloodline_idea_desc:0 "Режим учит, что Борей благословил законы и победы Империи, а не одну династию. Жрецов, отвергающих это различие, лишают кафедр."
 HSM_CYA_empty_throne_state_idea:0 "Государство пустого трона"
 HSM_CYA_empty_throne_state_idea_desc:0 "Империя прошла год коронации без Гровера VI. Теперь имперскую преемственность определяет команда Донкло, а не династическое наследование."
 HSM_CYA_puppet_emperor:0 "Марионеточный император"
 HSM_CYA_puppet_emperor_desc:0 "Гровер VI появляется на церемониях, но не участвует в решениях. Его печать успокаивает провинции, а офицеры Донкло выбирают, под чем ее поставить."
 HSM_CYA_caged_coronation_idea:0 "Коронация в клетке"
 HSM_CYA_caged_coronation_idea_desc:0 "Церемония отрепетирована, стража выбрана, путь императора согласован заранее. Грифония увидит корону на голове Гровера; лишь двор узнает, кто написал дозволенные ему слова."
 HSM_CYA_supervised_oaths_idea:0 "Контролируемые имперские клятвы"
 HSM_CYA_supervised_oaths_idea_desc:0 "Каждую присягу Гроверу копируют в архивы службы безопасности. Знать, прежде вольная выбирать слова, теперь узнает, какие обороты Донкло считает верными."
 HSM_CYA_puppet_imperial_tours_idea:0 "Имперские поездки под охраной"
 HSM_CYA_puppet_imperial_tours_idea_desc:0 "Провинции видят Гровера на охраняемых вокзалах и слышат речи, приготовленные директоратом. Его присутствие дает новому государству знакомое лицо, но поездки показывают, как тщательно им распоряжаются."
 HSM_CYA_caged_emperor_1021_idea:0 "Император в клетке"
 HSM_CYA_caged_emperor_1021_idea_desc:0 "Гровер VI коронован, но каждый двор, каждый караул и каждое публичное появление подчинены государству Донкло."
 HSM_CYA_restored_grover_supervised:0 "Гровер восстановлен под надзором"
 HSM_CYA_restored_grover_supervised_desc:0 "Теперь Гровер сам отдает приказы, но унаследовал армию и канцелярию, привыкшие сперва слушать Донкло. Каждое назначение проверяет, насколько далеко власть трона проникает в этот механизм."
 HSM_CYA_grover_restoration_ceremony_idea:0 "Церемония восстановления Гровера"
 HSM_CYA_grover_restoration_ceremony_idea_desc:0 "Герольды готовят передачу власти как последний акт правления Донкло. Офицеры разучивают новую присягу, а министры гадают, сколько прежних распоряжений Гровер оставит в силе."
 HSM_CYA_steel_regency_statutes_idea:0 "Стальные статуты регентства"
 HSM_CYA_steel_regency_statutes_idea_desc:0 "Восстановленный трон защищен статутами, удерживающими армию, полицию и бюро реконструкции верными новому порядку."
 HSM_CYA_reconciled_imperial_oaths_idea:0 "Примиренные имперские клятвы"
 HSM_CYA_reconciled_imperial_oaths_idea_desc:0 "Чиновники провинций присягают Гроверу, сохраняя учреждения, собравшие державу воедино. Формула обещает преемственность, но каждое назначение покажет, какая ее часть важнее."
 HSM_CYA_restored_grover_1021_idea:0 "Восстановленная Империя Гровера VI"
 HSM_CYA_restored_grover_1021_idea_desc:0 "Гровер VI правит из Грифенхейма, но восстановленная Империя все еще несет институты, пережившие завоевание и реконструкцию."
 HSM_CYA_river_frontier_war_plan:0 "План войны на речном фронтире"
 HSM_CYA_river_frontier_war_plan_desc:0 "Речная Федерация рассматривается как следующий стратегический рубеж восстановленной Империи."
 HSM_CYA_blackrock_wasteland_mapped:0 "Пустоши Блэкрока нанесены на карту"
 HSM_CYA_field_security_battalions_raised:0 "Полевые батальоны безопасности сформированы"
 HSM_CYA_question_of_grover_opened:0 "Вопрос Гровера VI открыт"
 HSM_CYA_grover_executed:0 "Гровер VI казнен"
 HSM_CYA_grover_puppet:0 "Гровер VI стал марионеточным императором"
 HSM_CYA_grover_restored:0 "Гровер VI восстановлен под надзором"
 HSM_CYA_countess_crown_prepared:0 "Регентство подготовило коронацию Гровера VI"
 HSM_CYA_grover_reigned_elsewhere:0 "Гровер VI уже правил в другом государстве"
 HSM_CYA_grover_absent:0 "Гровер VI недоступен новой Империи"
 HSM_CYA_imperial_cabinet_installed:0 "Имперский кабинет сформирован"
 HSM_CYA_1021_crown_in_trust:0 "Гровер VI коронован при регентстве графини"
 HSM_CYA_1021_memorial_regency:0 "Графиня провозгласила мемориальное регентство"
 HSM_CYA_1021_empty_throne:0 "Империя прошла 1021 год без Гровера VI"
 HSM_CYA_1021_caged_coronation:0 "Гровер VI коронован под охраной"
 HSM_CYA_1021_grover_restored:0 "Гровер VI восстановлен на троне"
 HSM_CYA_controls_imperial_centres_tt:0 "Контролирует Грифенхейм и Гриффонстоун"
 HSM_CYA_frontier_war_games:0 "Пограничные военные игры"
 HSM_CYA_frontier_war_games_desc:0 "Цианолизийская марка отрабатывает оборону против Астериона и Сикамеона, оставляя Донкло намеренно второстепенную роль."
 HSM_CYA_evi_border_embassies:0 "Пограничные посольства Эви"
 HSM_CYA_evi_border_embassies_desc:0 "Пограничный путь держится на разведчиках, посланниках и торговых клерках, которые знают, когда спор на границе дешевле войны."
 HSM_CYA_blackrock_autonomy_statute:0 "Статут автономии Блэкрока"
 HSM_CYA_blackrock_autonomy_statute_desc:0 "Восстановленное пограничное графство будет связано с Цианолизией, но местным обычаям и советам пустошей нужно достаточно свободы, чтобы север оставался спокойным."
 HSM_CYA_countess_evosmoshafen_ministries:0 "Министерства Эвосмошафена"
 HSM_CYA_countess_evosmoshafen_ministries_desc:0 "Графиня расширяет гражданские министерства перед поворотом на юг, давая реформам клерков, книги учета и более спокойное правовое лицо."
 HSM_CYA_countess_mit_customs_zone:0 "Таможенная зона Астериона"
 HSM_CYA_countess_mit_customs_zone_desc:0 "Если Минотаврия должна быть подчинена, ее дороги и рынки сперва нужно описать как будущие таможенные коридоры."
 HSM_CYA_countess_sicameon_port_authority:0 "Портовая администрация Сикамеона"
 HSM_CYA_countess_sicameon_port_authority_desc:0 "Консервативная портовая администрация подготовит правовой механизм для подчинения побережья Сикамеона Цианолизии."
 HSM_CYA_countess_integrate_south:0 "Статуты Сикамеонской интеграции"
 HSM_CYA_countess_integrate_south_desc:0 "Астерион должен остаться зависимым протекторатом, но Сикамеонское побережье можно постепенно включить в Цианолизию через порты, приходские советы и торговое право."
 HSM_CYA_countess_southern_provincial_diets:0 "Южные провинциальные сеймы"
 HSM_CYA_countess_southern_provincial_diets_desc:0 "Графиня предлагает южным провинциям контролируемые собрания: достаточно автономии для управления, но недостаточно для отделения."
 HSM_CYA_countess_merchant_arbitration:0 "Купеческие арбитражные суды"
 HSM_CYA_countess_merchant_arbitration_desc:0 "Торговые споры на юге будут решаться судами, удобными аристократам, землевладельцам и цианолизийским портовым интересам."
 HSM_CYA_countess_frontier_conference:0 "Пограничная конференция"
 HSM_CYA_countess_frontier_conference_desc:0 "Аристократы, купцы, офицеры и сословные представители фронтира собираются, чтобы превратить южное урегулирование в платформу для долины Эви."
 HSM_CYA_countess_integrate_evi_valley:0 "Интеграция долины Эви"
 HSM_CYA_countess_integrate_evi_valley_desc:0 "Государства долины не будут управляться как разграбленные земли. Они станут будущими провинциями, когда лояльность и местные соглашения сделают это возможным."
 HSM_CYA_evi_civic_modernisation:0 "Гражданская модернизация Эви"
 HSM_CYA_evi_civic_modernisation_desc:0 "Долину нельзя удержать одними старыми хартиями. Дороги, налоговые бюро, землемеры и общественные работы сделают цианолизийскую власть достаточно полезной, чтобы она закрепилась."
 HSM_CYA_evi_frontier_schools:0 "Школьные советы фронтира"
 HSM_CYA_evi_frontier_schools_desc:0 "Учителей и технических клерков отправляют в города Эви, чтобы превратить интеграцию фронтира в школы, книги учета и новый язык управления."
 HSM_CYA_countess_capital_restoration_plan:0 "План восстановления столицы"
 HSM_CYA_countess_capital_restoration_plan_desc:0 "Прежде чем регентство восстановит Грифенхейм, ему нужны инженеры, налоговые бюро, зерновые книги и верные администраторы."
 HSM_CYA_dawnclaw_war_room:0 "Оперативный штаб Донкло"
 HSM_CYA_dawnclaw_war_room_desc:0 "Донкло превращает дворцовые кабинеты в постоянный оперативный штаб, где офицеры, информаторы, железнодорожные планировщики и лояльные промышленники готовят южные кампании."
 HSM_CYA_minotaurian_logistics_board:0 "Минотаврийский совет логистики"
 HSM_CYA_minotaurian_logistics_board_desc:0 "Южная операция будет выиграна складами и железнодорожными расписаниями до того, как будет предъявлен первый ультиматум."
 HSM_CYA_sicameon_informant_ports:0 "Информаторы в портах"
 HSM_CYA_sicameon_informant_ports_desc:0 "Побережье Сикамеона полно профсоюзов, республиканцев и контрабандистов. Донкло хочет купить имена до того, как покупать пули."
 HSM_CYA_dawnclaw_integrate_south:0 "Кодексы Сикамеонской оккупации"
 HSM_CYA_dawnclaw_integrate_south_desc:0 "Астерион будет удерживаться как марионеточный протекторат. Сикамеон же станет территорией реестров, портовых чисток и будущей интеграции через покорность."
 HSM_CYA_minotaurian_security_registry:0 "Минотаврийский реестр безопасности"
 HSM_CYA_minotaurian_security_registry_desc:0 "Семьи, союзы, ветераны и местные вожди вносятся в реестр безопасности, где мятеж легче предвидеть и труднее скрыть."
 HSM_CYA_port_purge_lists:0 "Портовые списки чисток"
 HSM_CYA_port_purge_lists_desc:0 "Доковые сети Сикамеона будут проверены на республиканских организаторов, контрабандистов и всех, кто еще верен старому побережью."
 HSM_CYA_frontier_security_census:0 "Перепись безопасности фронтира"
 HSM_CYA_frontier_security_census_desc:0 "Каждый город, железнодорожный узел, цеховая контора и казарма на фронтире Эви учитываются как будущая проблема безопасности."
 HSM_CYA_evi_governorate_codes:0 "Кодексы губернаторств Эви"
 HSM_CYA_evi_governorate_codes_desc:0 "Долина Эви сможет стать имперской территорией только после того, как ее оккупационные администрации будут сведены к кодексам, разрешениям и порогам покорности. Донкло закрепит новый порядок названием и флагом директората."
 HSM_CYA_frontier_registry_modernisation:0 "Модернизация реестров"
 HSM_CYA_frontier_registry_modernisation_desc:0 "Оккупационные дела превращаются в налоговые списки, трудовые книги и железнодорожные расписания. Даже жесткому фронтирному государству Донкло нужна современная бюрократия под ордерами."
 HSM_CYA_security_polytechnic_cells:0 "Политехнические ячейки безопасности"
 HSM_CYA_security_polytechnic_cells_desc:0 "Технические школы оккупированной долины сперва будут служить армии: радисты, механики, оружейные инспекторы и инженеры учатся под полицейским надзором."
 HSM_CYA_dawnclaw_capital_restoration_plan:0 "План восстановления Грифенхейма"
 HSM_CYA_dawnclaw_capital_restoration_plan_desc:0 "После провозглашения имперской преемственности Донкло готовит инженеров, полицейские кадры и реквизиционные бюро для разрушенной столицы."
 HSM_CYA_evosmoshafen_ministries:0 "Министерства Эвосмошафена"
 HSM_CYA_evosmoshafen_ministries_desc:0 "Расширенные гражданские министерства дают графине больше контроля над реформами, не отдавая каждый документ армии."
 HSM_CYA_countess_mit_customs_zone_idea:0 "Таможенная зона Астериона"
 HSM_CYA_countess_mit_customs_zone_idea_desc:0 "Планирование южных таможен привязывает будущую торговлю Астериона к цианолизийскому праву."
 HSM_CYA_countess_port_authority:0 "Портовая администрация Сикамеона"
 HSM_CYA_countess_port_authority_desc:0 "Портовый надзор готовит побережье к консервативному урегулированию и торговому контролю."
 HSM_CYA_frontier_conference_idea:0 "Пограничная конференция"
 HSM_CYA_frontier_conference_idea_desc:0 "Рабочий союз аристократов, купцов и офицеров координирует следующий этап фронтира."
 HSM_CYA_capital_restoration_plan:0 "План восстановления столицы"
 HSM_CYA_capital_restoration_plan_desc:0 "Инженеры, налоговые бюро и администраторы готовятся к тому дню, когда Цианолизия войдет в Грифенхейм."
 HSM_CYA_herzland_devastation:0 "Разруха Герцланда"
 HSM_CYA_herzland_devastation_desc:0 "Грифенхейм пал, но доставшийся победителям город голоден и изранен. Пока рынки, суды и железные дороги не заработают, всякое имперское воззвание будет соперничать с ценой хлеба."
 HSM_CYA_dawnclaw_war_room_idea:0 "Оперативный штаб Донкло"
 HSM_CYA_dawnclaw_war_room_idea_desc:0 "Офицеры, информаторы и лояльные промышленники координируют кампании через новый оперативный штаб при дворе."
 HSM_CYA_minotaurian_logistics_board_idea:0 "Минотаврийский совет логистики"
 HSM_CYA_minotaurian_logistics_board_idea_desc:0 "Южные дороги и склады готовятся к кампании против Астериона."
 HSM_CYA_sicameon_informant_ports_idea:0 "Портовые информаторы Сикамеона"
 HSM_CYA_sicameon_informant_ports_idea_desc:0 "Оплаченные информаторы и портовые досье дают Цианолизии более ясный взгляд на побережье Сикамеона."
 HSM_CYA_frontier_security_census_idea:0 "Перепись безопасности фронтира"
 HSM_CYA_frontier_security_census_idea_desc:0 "Фронтир Эви каталогизируется как проблема оккупации еще до начала самой оккупации."
 HSM_CYA_can_claim_empire_descendant:0 "Цианолизия может заявить имперскую преемственность"
 HSM_CYA_empire_descendant_declared:0 "Цианолизия провозгласила себя наследницей Империи"
 HSM_CYA_empire_descendant_reconstruction_tt:0 "§YФокусы восстановления Герцланда§! станут доступны. Бывшие имперские земли будут отмечены для будущей интеграции через покорность."
 HSM_CYA_controls_south_capitals_tt:0 "§YАстерион§! является нашим субъектом или мы контролируем §YАстерскую Гавань§!, а также контролируем §YМидорию§!."
 HSM_CYA_controls_evi_capitals_tt:0 "Контролирует §YКивессин§! и §YКаив§!."
 HSM_CYA_kivessin_compromise:0 "Кивессинский компромисс"
 HSM_CYA_kivessin_compromise_desc:0 "Кивессин слишком важен, чтобы обращаться с ним как с очередным занятым городом. Графиня договорится с храмами, землевладельцами и городскими семьями до включения долины в Цианолизию."
 HSM_CYA_kaiv_autonomy_promise:0 "Пообещать автономию Каиву"
 HSM_CYA_kaiv_autonomy_promise_desc:0 "Казацкую память Каива нельзя растворить указом. Лояльная автономная хартия успокоит город, не отдавая фронтир."
 HSM_CYA_break_the_kivessin_estates:0 "Сломать кивессинские поместья"
 HSM_CYA_break_the_kivessin_estates_desc:0 "Донкло не будет торговаться с землевладельцами, пережившими каждую империю сменой знамен. Поместья Кивессина будут проверены, разоружены и сделаны полезными."
 HSM_CYA_tame_the_kaiv_rada:0 "Укротить каивскую раду"
 HSM_CYA_tame_the_kaiv_rada_desc:0 "Каивская рада может сохранить свои ритуалы, но за ее голосами будут наблюдать офицеры, а казацкие старшины узнают, кто контролирует фронтир."
 hsm_cyanolisia.20.t:0 "Кивессинский компромисс"
 hsm_cyanolisia.20.d:0 "Кивессин встречает цианолизийских чиновников закрытыми ставнями и полными храмами. Старые поместья боятся конфискаций, купцы боятся нового голода, а храмовые семьи боятся власти чужаков с юга. Посланники графини предлагают более тихую сделку: держать книги открытыми, снабжать дороги, и старый город сохранит достаточно достоинства, чтобы подчиняться без унижения."
 hsm_cyanolisia.20.a:0 "Пусть Кивессин сохранит достоинство."
 hsm_cyanolisia.20.b:0 "Передать счетные палаты купцам."
 hsm_cyanolisia.21.t:0 "Хартия для Каива"
 hsm_cyanolisia.21.d:0 "Каив - не Кивессин. Его гордость живет в раде, казацких песнях и мифе о том, что никакой внешний правитель по-настоящему не держит Зафз. Хартия графини обещает местные ритуалы, пограничные советы и место казацким офицерам в новом порядке. Цианолизия будет править, но через формы, которые город признает."
 hsm_cyanolisia.21.a:0 "Автономия послужит регентству."
 hsm_cyanolisia.21.b:0 "Поставить казачьих офицеров на границу."
 hsm_cyanolisia.22.t:0 "Поместья Кивессина"
 hsm_cyanolisia.22.d:0 "Офицеры Донкло входят в Кивессин с бухгалтерскими книгами, ордерами и списками, переписанными у напуганных клерков. Поместья не отменяют одной речью. Их вызывают по одному, облагают по одному, обыскивают по одному, пока город не понимает: старая привилегия может продолжаться только как делегированная служба."
 hsm_cyanolisia.22.a:0 "Теперь привилегия подчиняется приказу."
 hsm_cyanolisia.22.b:0 "Сначала забрать их книги, потом титулы."
 hsm_cyanolisia.23.t:0 "Укрощенная рада"
 hsm_cyanolisia.23.d:0 "Рада собирается под наблюдаемыми балконами. Казацкие старшины говорят о старых свободах; связной Донкло говорит о железных дорогах, заложниках и разрешениях на боеприпасы. Голосование формально свободное. Все присутствующие понимают форму приемлемого ответа."
 hsm_cyanolisia.23.a:0 "Пусть проголосуют правильно."
 hsm_cyanolisia.23.b:0 "Дать коменданту право вето."
 HSM_CYA_kivessin_compromise_accepted:0 "Кивессинский компромисс принят"
 HSM_CYA_kivessin_merchant_compact:0 "Купцы Кивессина получили торговое соглашение"
 HSM_CYA_kaiv_autonomy_promised:0 "Каиву обещана контролируемая автономия"
 HSM_CYA_kaiv_cossack_guard:0 "Казачьи офицеры Каива охраняют границу"
 HSM_CYA_kivessin_estates_broken:0 "Кивессинские поместья сломлены"
 HSM_CYA_kivessin_tax_ledgers_seized:0 "Счетные книги поместий Кивессина изъяты"
 HSM_CYA_kaiv_rada_tamed:0 "Каивская рада укрощена"
 HSM_CYA_kaiv_commandant_veto:0 "Комендант Каива может наложить вето на решение рады"
 HSM_CYA_asterion_assembly_compact:0 "Договор с астерионским собранием"
 HSM_CYA_asterion_assembly_compact_desc:0 "Астерская Гавань помнит старую материковую республику и не забудет ее лишь потому, что графиня попросит вежливо. Поднадзорное собрание даст местным семьям комнату для споров, а Цианолизии - список тех, кого придется слушать."
 HSM_CYA_midoria_parish_board:0 "Приходской совет Мидории"
 HSM_CYA_midoria_parish_board_desc:0 "Приходы Сикамеона привыкли к хартиям, береговому праву и ревнивым местным привилегиям. Приходской совет превратит эту привычку в инструмент цианолизийского порядка."
 HSM_CYA_lushland_border_commission:0 "Пограничная комиссия Лашленда"
 HSM_CYA_lushland_border_commission_desc:0 "Фронтир Лашленда - это клубок полей, святынь, застав и испуганных городских советов. Пограничная комиссия заменит слухи картами и торгом."
 HSM_CYA_gryphus_company_charter:0 "Хартия грифусской компании"
 HSM_CYA_gryphus_company_charter_desc:0 "Вольные города Грифуса выживали благодаря советам, компаниям и торговым привилегиям. Графиня обновит то, что полезно, и привяжет Южноконтинентальную компанию к регентству."
 HSM_CYA_evi_notables_council:0 "Сословный совет Эви"
 HSM_CYA_evi_notables_council_desc:0 "Кивессин, Каив, Лашленд и Грифус отправят полезные семьи, цеховых клерков и фронтирных офицеров в единый совет. Это не будет демократией, но этим можно будет управлять."
 HSM_CYA_asterion_hostage_bureau:0 "Астерионское бюро заложников"
 HSM_CYA_asterion_hostage_bureau_desc:0 "Астерионский республиканизм пережил аннексию, изгнание и имперскую полицию. Донкло ответит этой традиции семейными списками, офицерскими поручительствами и заложниками, названными без эвфемизмов."
 HSM_CYA_midoria_dockyard_command:0 "Командование верфей Мидории"
 HSM_CYA_midoria_dockyard_command_desc:0 "Доками Мидории кормятся приходы, корсары, торговцы и революционеры. При Донкло гавань сперва будет отвечать перед реквизиционными офицерами."
 HSM_CYA_lushland_reprisals:0 "Репрессалии в Лашленде"
 HSM_CYA_lushland_reprisals_desc:0 "Тихие пограничные города Лашленда могут укрывать мятежников так же легко, как и беженцев. Донкло создаст выборочные примеры, а затем заставит выживших объяснить дороги."
 HSM_CYA_gryphus_company_audit:0 "Аудит грифусской компании"
 HSM_CYA_gryphus_company_audit_desc:0 "Южноконтинентальная компания, советы вольных городов и капитулы Опиникуса все заявляют о древних исключениях. Аудиторы Донкло выяснят, какие исключения можно обложить налогом, а какие придется сломать."
 HSM_CYA_frontier_auxiliary_legions:0 "Вспомогательные легионы фронтира"
 HSM_CYA_frontier_auxiliary_legions_desc:0 "На фронтире есть солдаты, знающие дороги лучше любой цианолизийской штабной карты. Желающих служить сведут во вспомогательные легионы; нежелающих занесут в списки рядом с ними."
 HSM_CYA_evi_notables_council_idea:0 "Сословный совет Эви"
 HSM_CYA_evi_notables_council_idea_desc:0 "Отобранные местные семьи, цеховые клерки и офицеры дают Цианолизии консервативный канал управления в недавно покоренной долине Эви."
 HSM_CYA_frontier_auxiliary_legions_idea:0 "Вспомогательные легионы фронтира"
 HSM_CYA_frontier_auxiliary_legions_idea_desc:0 "Местные вспомогательные части усиливают фронтирные армии Донкло, хотя их дисциплина держится на страхе, плате и тщательном надзоре."
 HSM_CYA_port_purge_network_idea:0 "Сеть портовых чисток"
 HSM_CYA_port_purge_network_idea_desc:0 "Доковые книги, информаторы и таможенная полиция делают южные порты безопаснее для цианолизийских конвоев и опаснее для республиканских организаторов."
 HSM_CYA_kivessin_estate_audits_idea:0 "Аудиты кивессинских поместий"
 HSM_CYA_kivessin_estate_audits_idea_desc:0 "Кивессинские поместья сохраняют ворота, но теперь за каждыми воротами стоят офицер, ордер и налоговое дело."
 HSM_CYA_kaiv_supervised_rada_idea:0 "Рада Каива под надзором"
 HSM_CYA_kaiv_supervised_rada_idea_desc:0 "Местные формы Каива сохраняются, но офицеры превращают каждое голосование в очередную меру лояльности."
 HSM_CYA_lushland_reprisals_idea:0 "Репрессалии в Лашленде"
 HSM_CYA_lushland_reprisals_idea_desc:0 "Выборочные наказания заставляют дороги фронтира открыться, но каждая деревня запоминает, кто отдал приказ."
 HSM_CYA_gryphus_audit_board_idea:0 "Аудиторский совет Грифуса"
 HSM_CYA_gryphus_audit_board_idea_desc:0 "Книги компаний, счета вольных городов и привилегии капитулов превращаются в налоговые иски и дела безопасности."
 HSM_CYA_evi_governorate_codes_idea:0 "Кодексы губернаторств Эви"
 HSM_CYA_evi_governorate_codes_idea_desc:0 "Проверки, переписи и подконтрольные советы теперь ставят одну печать. На бумаге долиной управлять легче, но ее жители помнят, как были добыты эти бумаги."
 HSM_CYA_evi_civic_modernisation_idea:0 "Гражданская модернизация Эви"
 HSM_CYA_evi_civic_modernisation_idea_desc:0 "Общественные работы, дорожные бюро и налоговые обследования связывают долину Эви с Цианолизией через практическое управление."
 HSM_CYA_evi_frontier_schools_idea:0 "Школьные советы фронтира"
 HSM_CYA_evi_frontier_schools_idea_desc:0 "Школы и клеркские курсы долины приводятся в соответствие с цианолизийским правом и техническими нуждами."
 HSM_CYA_frontier_registry_modernisation_idea:0 "Модернизированные реестры фронтира"
 HSM_CYA_frontier_registry_modernisation_idea_desc:0 "Оккупационные записи переводятся в современные реестры для налогов, рабочих команд и полицейского надзора."
 HSM_CYA_security_polytechnic_cells_idea:0 "Политехнические ячейки безопасности"
 HSM_CYA_security_polytechnic_cells_idea_desc:0 "Техническое образование на фронтире контролируется офицерами и направляется на нужды арсеналов, радиосвязи и дорог режима."
 hsm_cyanolisia.24.t:0 "Астерская Гавань спорит"
 hsm_cyanolisia.24.d:0 "Старый зал собрания в Астерской Гавани меньше легенд вокруг него. Минотаврийские городские представители приходят под цианолизийской охраной и ворчат о материковых правах, имперской краже и республиканской памяти. Посланник графини предлагает договор: обсуждайте налоги, дороги, школы и петиции, но внешняя политика, армия и протекторат остаются вне зала."
 hsm_cyanolisia.24.a:0 "Восстановить собрание под нашей печатью."
 hsm_cyanolisia.24.b:0 "Губернатор сам выслушает петиции."
 hsm_cyanolisia.25.t:0 "Приходы Мидории"
 hsm_cyanolisia.25.d:0 "Приходские старейшины Мидории говорят сухим языком хартий и портовых обычаев. Они ненавидят беспорядок, но ненавидят и управление как завоеванной казармой. Графиня может уважить приходскую привычку и использовать ее, либо связать город более строгим таможенным советом."
 hsm_cyanolisia.25.a:0 "Защитить приходские хартии."
 hsm_cyanolisia.25.b:0 "Привязать порты к нашему таможенному совету."
 hsm_cyanolisia.26.t:0 "Линии через Лашленд"
 hsm_cyanolisia.26.d:0 "Граница Лашленда не является аккуратным фронтиром. Святыня платит десятину одному городу, дорожный сбор - другому, а за защитой обращается к тому, кто проходил последним. Цианолизийские землемеры предлагают два пути: терпеливо арбитрировать границу или превратить комиссию в железнодорожную и снабженческую разведку будущих кампаний."
 hsm_cyanolisia.26.a:0 "Арбитрировать пограничные города."
 hsm_cyanolisia.26.b:0 "Сначала обследовать дороги."
 hsm_cyanolisia.27.t:0 "Грифусская хартия"
 hsm_cyanolisia.27.d:0 "Грифус меньше похож на провинцию, чем на узел компаний, вольных городов, старых контрактов и рыцарских привычек. Южноконтинентальная компания предлагает сотрудничество за привилегии. Городские советы предлагают налоги за гарантии. Графиня должна решить, какую дверь регентство откроет первой."
 hsm_cyanolisia.27.a:0 "Даровать компании хартию под нашей печатью."
 hsm_cyanolisia.27.b:0 "Гарантировать вольные города."
 hsm_cyanolisia.28.t:0 "Имена в Астерионе"
 hsm_cyanolisia.28.d:0 "Бюро Донкло начинает с фамилий, ветеранских клубов, школьных учителей и каждого дома, когда-либо поднимавшего республиканские цвета. Одни офицеры требуют заложников из самых заметных родов. Другие считают, что местные вспомогательные офицеры удержат город тише, чем камеры, полные сыновей."
 hsm_cyanolisia.28.a:0 "Зарегистрировать знатные семьи."
 hsm_cyanolisia.28.b:0 "Набирать офицеров из покорных."
 hsm_cyanolisia.29.t:0 "Мидория под командованием"
 hsm_cyanolisia.29.d:0 "Докмейстеры Мидории умеют задерживать войну, ни разу не подняв знамя. Коменданты Донкло предлагают реквизиции, графики патрулей и портовую книгу, написанную солдатами. Некоторые предлагают амнистию корсарским экипажам, готовым охотиться на врагов режима."
 hsm_cyanolisia.29.a:0 "Реквизировать верфи."
 hsm_cyanolisia.29.b:0 "Предложить корсарскую амнистию."
 hsm_cyanolisia.30.t:0 "Лашлендский пример"
 hsm_cyanolisia.30.d:0 "Железнодорожный клерк исчезает. Курьера находят в канаве. Пограничные деревни отрицают все с одинаковыми лицами. Офицеры Донкло могут ответить репрессалиями, достаточно быстрыми, чтобы испугом открыть дороги, или построить сеть информаторов, которая будет отравлять деревни медленнее."
 hsm_cyanolisia.30.a:0 "Разрешить выборочные репрессалии."
 hsm_cyanolisia.30.b:0 "Создать сеть информаторов."
 hsm_cyanolisia.31.t:0 "Счета Грифуса"
 hsm_cyanolisia.31.d:0 "Вольные города Грифуса сохраняли независимость в бухгалтерских книгах не меньше, чем в крепостях. Аудиторы Донкло изымают книги из офисов компании и требуют списки у Ордена Опиникуса. Каждый скрытый контракт может стать налоговым иском или делом безопасности."
 hsm_cyanolisia.31.a:0 "Проверить книги компании."
 hsm_cyanolisia.31.b:0 "Скомпрометировать капитулы."
 HSM_CYA_asterion_assembly_restored:0 "Астерионское собрание восстановлено под цианолизийской печатью"
 HSM_CYA_asterion_governor_petitions:0 "Астерионские петиции переданы губернатору"
 HSM_CYA_midoria_parish_charters:0 "Приходские хартии Мидории защищены"
 HSM_CYA_midoria_customs_board:0 "Мидория привязана к таможенному совету"
 HSM_CYA_lushland_border_commissioned:0 "Пограничная комиссия Лашленда создана"
 HSM_CYA_lushland_rail_survey:0 "Железнодорожное обследование Лашленда стало приоритетом"
 HSM_CYA_gryphus_company_chartered:0 "Хартия грифусской компании обновлена"
 HSM_CYA_gryphus_free_towns_protected:0 "Вольным городам Грифуса даны гарантии"
 HSM_CYA_asterion_hostage_rolls:0 "Астерионские списки заложников подготовлены"
 HSM_CYA_asterion_auxiliary_officers:0 "Астерионские вспомогательные офицеры набраны"
 HSM_CYA_midoria_dockyards_requisitioned:0 "Верфи Мидории реквизированы"
 HSM_CYA_midoria_corsair_amnesty:0 "Мидорийским корсарам предложена амнистия"
 HSM_CYA_lushland_reprisals_authorized:0 "Репрессалии в Лашленде разрешены"
 HSM_CYA_lushland_informant_net:0 "Сеть информаторов в Лашленде создана"
 HSM_CYA_gryphus_company_audited:0 "Грифусская компания прошла аудит"
 HSM_CYA_gryphus_order_compromised:0 "Капитулы Грифуса скомпрометированы"
 HSM_CYA_southern_amnesty_registers:0 "Южные реестры амнистии"
 HSM_CYA_southern_amnesty_registers_desc:0 "Юг нельзя вечно удерживать страхом перед последней кампанией. Графиня решит, кого можно простить, за кем нужно наблюдать, а кто останется вне закона."
 HSM_CYA_frontier_school_missions:0 "Школьные миссии фронтира"
 HSM_CYA_frontier_school_missions_desc:0 "Учителя, священники и верные клерки отправляются на фронтир Эви, чтобы заменить слухи букварями, картами и языком регентства."
 HSM_CYA_princely_lesson_books:0 "Учебники для принца"
 HSM_CYA_princely_lesson_books_desc:0 "После Грифенхейма регентство наконец может заняться воспитанием императора, которого собирается восстановить."
 HSM_CYA_frontier_tribunals:0 "Трибуналы фронтира"
 HSM_CYA_frontier_tribunals_desc:0 "Фронтир Донкло будет обучен через суды, списки и приговоры. Долина должна понять, что сопротивление не романтично, а лишь документировано."
 HSM_CYA_hostage_cadet_schools:0 "Кадетские школы заложников"
 HSM_CYA_hostage_cadet_schools_desc:0 "Сыновья скомпрометированных семей могут сгнить заложниками, а могут быть переделаны в офицеров, чью лояльность обучат до того, как проверят."
 HSM_CYA_grover_black_files:0 "Черные файлы Гровера"
 HSM_CYA_grover_black_files_desc:0 "После взятия Грифенхейма штаб Донкло превращает дворцовых слуг, наставников, охрану и старые привычки в оперативное досье на Гровера VI."
 HSM_CYA_southern_amnesty_registers_idea:0 "Южные реестры амнистии"
 HSM_CYA_southern_amnesty_registers_idea_desc:0 "Южные помилования превращаются в политическую книгу учета: кому можно доверять, кого купить, а за кем наблюдать."
 HSM_CYA_frontier_school_missions_idea:0 "Школьные миссии фронтира"
 HSM_CYA_frontier_school_missions_idea_desc:0 "Школы и миссионерские клерки несут язык регентства на фронтир Эви."
 HSM_CYA_grover_tutelage_notes_idea:0 "Записки о воспитании Гровера"
 HSM_CYA_grover_tutelage_notes_idea_desc:0 "Отчеты, учебники и тщательно отобранные истории готовятся для императора, которого регентство надеется восстановить."
 HSM_CYA_frontier_tribunals_idea:0 "Трибуналы фронтира"
 HSM_CYA_frontier_tribunals_idea_desc:0 "Оккупированный фронтир дисциплинируется трибуналами, которые в равной мере создают примеры и дела."
 HSM_CYA_hostage_cadet_schools_idea:0 "Кадетские школы заложников"
 HSM_CYA_hostage_cadet_schools_idea_desc:0 "Семьи заложников привязываются к армии через превращение их сыновей в кадетов нового порядка."
 HSM_CYA_grover_black_files_idea:0 "Черные файлы Гровера"
 HSM_CYA_grover_black_files_idea_desc:0 "Штаб Донкло хранит закрытое оперативное досье о привычках, наставниках и будущей полезности Гровера VI."
 HSM_CYA_development_board_idea:0 "Совет развития Цианолизии"
 HSM_CYA_development_board_idea_desc:0 "Политика развития централизуется через совет, который отслеживает фабрики, школы, дороги и долги фронтира."
 HSM_CYA_public_works_relief_idea:0 "Общественные работы"
 HSM_CYA_public_works_relief_idea_desc:0 "Общественные работы смягчают бедность и привязывают труд к государственным проектам."
 HSM_CYA_polytechnic_exchange_idea:0 "Политехнический обмен"
 HSM_CYA_polytechnic_exchange_idea_desc:0 "Инженеры, студенты и военные техники переводятся между институтами и мастерскими под государственным надзором."
 HSM_CYA_frontier_railway_corps_idea:0 "Железнодорожный корпус фронтира"
 HSM_CYA_frontier_railway_corps_idea_desc:0 "Железнодорожные бригады и армейские логисты поддерживают снабжение и ремонтопригодность фронтира."
 HSM_CYA_frontier_defense_industry_idea:0 "Оборонная промышленность фронтира"
 HSM_CYA_frontier_defense_industry_idea_desc:0 "Рассредоточенные мастерские поддерживают пограничную оборону без обещаний невозможного промышленного чуда."
 HSM_CYA_regency_land_credit_idea:0 "Земельный кредит регентства"
 HSM_CYA_regency_land_credit_idea_desc:0 "Землевладельцы и портовые кредиторы финансируют осторожную модернизацию регентства."
 HSM_CYA_cabinet_industrial_plan_idea:0 "Кабинетский промышленный план"
 HSM_CYA_cabinet_industrial_plan_idea_desc:0 "Гражданский кабинет координирует промышленное восстановление и техническое планирование."
 HSM_CYA_corporate_mobilisation_plan_idea:0 "Корпоративная мобилизация"
 HSM_CYA_corporate_mobilisation_plan_idea_desc:0 "Избранные фирмы получают контракты и защиту в обмен на послушание мобилизационной программе Донкло."
 HSM_CYA_black_budget_arsenals_idea:0 "Арсеналы скрытого бюджета"
 HSM_CYA_black_budget_arsenals_idea_desc:0 "Тайные каналы снабжения питают военные мастерские вне обычной парламентской отчетности."
 HSM_CYA_frontier_doctrine_school_idea:0 "Доктринальная школа фронтира"
 HSM_CYA_frontier_doctrine_school_idea_desc:0 "Офицеров учат защищать фронтир через логистику, полевую дисциплину и внимательную работу с местностью."
 HSM_CYA_regency_general_staff_idea:0 "Генеральный штаб регентства"
 HSM_CYA_regency_general_staff_idea_desc:0 "Высший штаб армии привязан к регентству графини и его оборонительной политической линии."
 HSM_CYA_stratocratic_general_staff_idea:0 "Стратократический генеральный штаб"
 HSM_CYA_stratocratic_general_staff_idea_desc:0 "Армейский штаб Донкло соединяет командование, полицейский контроль и будущие наступательные планы в единое военное государство."
 HSM_CYA_admiralty_patrol_compact_idea:0 "Патрульный договор адмиралтейства"
 HSM_CYA_admiralty_patrol_compact_idea_desc:0 "Береговые патрули и таможенные донесения дают режиму более твердую власть над берегами Цианолизии."
 hsm_cyanolisia.32.t:0 "Столы амнистии"
 hsm_cyanolisia.32.d:0 "Имена приходят из Астериона, Мидории и малых прибрежных городов. Одни принадлежат контрабандистам, снабжавшим не ту армию. Другие - республиканцам, которые быстро сдались. Некоторые семьи виновны меньше, чем полезны. Графиня может превратить помилование в примирение или в реестр, достаточно острый, чтобы резать позже."
 hsm_cyanolisia.32.a:0 "Пусть лояльные семьи поручатся за своих."
 hsm_cyanolisia.32.b:0 "Каждому помилованию - дело."
 hsm_cyanolisia.33.t:0 "Школа на фронтире"
 hsm_cyanolisia.33.d:0 "Первая школа открывается в городке, чья лояльность меняется с каждым патрулем. Дети учат буквы рядом с картами нового фронтира. Родители смотрят на учителей с подозрением, но подозрение тоже означает присутствие."
 hsm_cyanolisia.33.a:0 "Учить их читать законы регентства."
 hsm_cyanolisia.33.b:0 "Начать с букварей лояльности."
 hsm_cyanolisia.34.t:0 "Уроки для императора"
 hsm_cyanolisia.34.d:0 "Из Эвосмошафена привозят учебники: историю династии, донесения с границы, притчи и военные карты. Страницы, изъятые перед переплетом, расскажут Гроверу о регентстве не меньше, чем оставленные. Графиня уже взяла его под защиту; теперь ей предстоит решить, каким правителем он вырастет под ее опекой."
 hsm_cyanolisia.34.a:0 "Учить его милосердию как дисциплине."
 hsm_cyanolisia.34.b:0 "Учить его власти как долгу."
 hsm_cyanolisia.34.c:0 "Сначала учить его фронтиру."
 hsm_cyanolisia.35.t:0 "Приговоры в долине"
 hsm_cyanolisia.35.d:0 "Трибуналы Донкло заседают под охраной и заемными печатями. Деревенский староста отрицает укрытие винтовок. Цеховой клерк приносит три книги учета и случайно четвертую. Вопрос не в том, будут ли судить фронтир, а в том, должен ли страх быть публичным или административным."
 hsm_cyanolisia.35.a:0 "Сделать приговоры видимыми."
 hsm_cyanolisia.35.b:0 "Пусть дела делают работу."
 hsm_cyanolisia.36.t:0 "Кадеты из домов заложников"
 hsm_cyanolisia.36.d:0 "Списки заложников полны сыновей, достаточно взрослых для строевой подготовки и достаточно молодых, чтобы их переделать. Одни офицеры хотят держать их под присмотром в казармах. Другие видят будущий корпус фронтирных вспомогательных частей, где каждая семейная связь привязана к цианолизийскому командованию."
 hsm_cyanolisia.36.a:0 "Записать их в кадеты."
 hsm_cyanolisia.36.b:0 "Связать их офицерскими обязательствами."
 hsm_cyanolisia.37.t:0 "Файл Гровера"
 hsm_cyanolisia.37.d:0 "Сначала файл тонок: школьный распорядок, имена наставников, сведения о настроении, старые дворцовые слуги, любимые молитвы. Донкло читает без сентиментальности. Ребенок может стать символом, заложником, марионеткой или проблемой. Разница в подготовке."
 hsm_cyanolisia.37.a:0 "Готовить его как марионетку."
 hsm_cyanolisia.37.b:0 "Готовиться к худшему ответу."
 hsm_cyanolisia.37.c:0 "Запечатать до Грифенхейма."
 HSM_CYA_southern_amnesty_notables:0 "Южные амнистии поручены лояльным семьям"
 HSM_CYA_herzland_ready_tt:0 "§YГерцланд§! должен быть объединен вокруг Грифенхейма, либо кампания должна дождаться §Y1013 года§!."
 HSM_CYA_blackrock_survey_corps_idea:0 "Разведочный корпус Блэкрока"
 HSM_CYA_blackrock_survey_corps_idea_desc:0 "Геодезисты и патрули наносят на карты колодцы, дороги, руины и удобные для обороны тропы до восстановления пограничного графства."
 HSM_CYA_southern_provincial_diets_idea:0 "Южные провинциальные сеймы"
 HSM_CYA_southern_provincial_diets_idea_desc:0 "Поднадзорные провинциальные сеймы дают графине консервативный канал для петиций и налоговых договоренностей на юге."
 HSM_CYA_merchant_arbitration_idea:0 "Купеческие арбитражные палаты"
 HSM_CYA_merchant_arbitration_idea_desc:0 "Портовые купцы и кредиторы поместий решают споры через палаты под надзором цианолизийских писарей."
 HSM_CYA_kivessin_compromise_idea:0 "Кивессинский компромисс"
 HSM_CYA_kivessin_compromise_idea_desc:0 "Храмы, поместья и городские семьи удерживаются в узком договоре послушания и достоинства."
 HSM_CYA_kaiv_autonomy_idea:0 "Хартия автономии Каива"
 HSM_CYA_kaiv_autonomy_idea_desc:0 "Каив сохраняет поднадзорные местные формы, пока регентство контролирует солдат, дороги и внешнюю политику."
 HSM_CYA_lushland_border_commission_idea:0 "Пограничная комиссия Лашленда"
 HSM_CYA_lushland_border_commission_idea_desc:0 "Землемеры и писари превращают запутанный фронтир Лашленда в дороги, реестры и закрепленные границы."
 HSM_CYA_gryphus_company_charter_idea:0 "Хартия грифусской компании"
 HSM_CYA_gryphus_company_charter_idea_desc:0 "Южноконтинентальная компания получает поднадзорную хартию в обмен на налоги, перевозки и лояльность."
 HSM_CYA_integrated_evi_valley_idea:0 "Интегрированная долина Эви"
 HSM_CYA_integrated_evi_valley_idea_desc:0 "Поместья Кивессина, рада Каива и свободные города приняли разные условия. Регентству придется сохранить эти обещания в пределах одной администрации, если оно хочет удержать мир в Эви."
 HSM_CYA_southern_amnesty_registers_flag:0 "Южные амнистии внесены в государственные реестры"
 HSM_CYA_frontier_school_missions_flag:0 "Школьные миссии фронтира открыты"
 HSM_CYA_frontier_loyalty_primers:0 "Буквари лояльности распространены на фронтире"
 HSM_CYA_grover_lesson_mercy:0 "Уроки Гровера делают акцент на дисциплинированном милосердии"
 HSM_CYA_grover_lesson_authority:0 "Уроки Гровера делают акцент на имперской власти"
 HSM_CYA_grover_lesson_frontier:0 "Уроки Гровера делают акцент на фронтире"
 HSM_CYA_frontier_public_tribunals:0 "Трибуналы фронтира используют публичные приговоры"
 HSM_CYA_frontier_paper_tribunals:0 "Трибуналы фронтира работают через административные дела"
 HSM_CYA_hostage_cadets_enrolled:0 "Кадеты-заложники записаны"
 HSM_CYA_hostage_officer_bonds:0 "Семьи заложников связаны офицерской службой"
 HSM_CYA_grover_puppet_education_file:0 "Файл Гровера готовит марионеточную коронацию"
 HSM_CYA_grover_liability_file:0 "Файл Гровера готовит его устранение"
 HSM_CYA_grover_sealed_file:0 "Файл Гровера остается запечатанным"
 hsm_cyanolisia.40.t:0 "Корона на хранении"
 hsm_cyanolisia.40.d:0 "Регентство собрало провинции и сдержало обещание, которое теперь опасно нарушить. Перед двором в Грифенхейме графиня отдает власть, которую могла оставить себе. Гровер VI принимает корону под старыми знаменами и новой охраной; лоялисты плачут, провинциальные делегаты подсчитывают уступки, а армия ждет, чья подпись появится на следующих приказах."
 hsm_cyanolisia.40.a:0 "Корона переходит к Гроверу VI."
 hsm_cyanolisia.41.t:0 "Год без коронации"
 hsm_cyanolisia.41.d:0 "Назначенный день наступает без коронации. Донкло убил Гровера VI, а трон объявлен должностью имперского командования. Офицеры приветствуют определенность; священники и старые лоялисты понимают ее цену."
 hsm_cyanolisia.41.a:0 "Нет императора, кроме Империи."
 hsm_cyanolisia.42.t:0 "Коронация под охраной"
 hsm_cyanolisia.42.d:0 "Гровера VI ведут через Грифенхейм под восстановленными знаменами и оружейными стволами. Корона настоящая, молитвы старые, а аплодисменты достаточно громкие, чтобы скрыть замки. Донкло стоит рядом с церемонией как необходимый защитник Империи. Лоялистам позволяют верить. Офицерам позволяют понимать."
 hsm_cyanolisia.42.a:0 "Пусть увидят своего императора."
 hsm_cyanolisia.43.t:0 "Гровер VI получает Империю"
 hsm_cyanolisia.43.d:0 "Церемония поставлена тщательно, но момент выходит за пределы сценария. Гровер VI принимает корону перед столицей, восстановленной солдатами, клерками, коллаборационистами и испуганными патриотами. Канцелярии Донкло остаются, его статуты остаются, и армия никуда не исчезает. Но у Империи снова есть император, а провинции слышат из Грифенхейма знакомое имя."
 hsm_cyanolisia.43.a:0 "За Гровера VI и за Империю."
 hsm_cyanolisia.44.t:0 "Графиня умолкает"
 hsm_cyanolisia.44.d:0 "К утру покои графини опечатаны, ее личная стража отстранена, а дворцовые врачи подписывают заключение, которое никто при дворе не решается читать вслух. Тэйллоу Зумпфкиль мертва. Офицеры Донкло говорят только о безопасности, преемственности и государственных необходимостях, а старый двор понимает: скорбеть теперь дозволено лишь в частном порядке."
 hsm_cyanolisia.44.a:0 "Двор все понял."
 HSM_CYA_regency_bread_offices:0 "Хлебные бюро регентства"
 HSM_CYA_regency_bread_offices_desc:0 "Грифенхеймом нельзя управлять одними знаменами. Регентство начнет с пайковых бюро, рыночных инспекторов и медленного восстановления обычных поставок еды."
 HSM_CYA_restore_imperial_courts:0 "Восстановить имперские суды"
 HSM_CYA_restore_imperial_courts_desc:0 "Если графиня намерена править ради Гровера, старый закон снова должен стать полезным: открытые суды, пересмотр конфискаций и судьи, помнящие, кто вернул им скамьи."
 HSM_CYA_emergency_griffenheim_command:0 "Чрезвычайная комендатура Грифенхейма"
 HSM_CYA_emergency_griffenheim_command_desc:0 "Донкло смотрит на столицу сперва как на штаб, и только потом как на город. Комендантский час, расквартирование, охрана складов и штабные офицеры удержат Грифенхейм в повиновении, пока начинается восстановление."
 HSM_CYA_purge_imperial_remainders:0 "Чистка имперских остатков"
 HSM_CYA_purge_imperial_remainders_desc:0 "Старые министерства полны людей, переживших все режимы благодаря правильной бумаге в правильное время. Донкло выяснит, кто из них все еще принадлежит мертвой Империи."
 HSM_CYA_countess_local_compacts_idea:0 "Местные договоры"
 HSM_CYA_countess_local_compacts_idea_desc:0 "Графиня стабилизирует новые территории через городские привилегии, зарегистрированные советы и согласованные обязанности."
 HSM_CYA_countess_trade_boards_idea:0 "Торговые советы"
 HSM_CYA_countess_trade_boards_idea_desc:0 "Таможенные советы и хартии купцов превращают завоевание в книги учета, которыми регентство действительно может управлять."
 HSM_CYA_dawnclaw_frontier_controls_idea:0 "Фронтирный контроль"
 HSM_CYA_dawnclaw_frontier_controls_idea_desc:0 "Офицеры Донкло опираются на реестры, патрули и подконтрольных местных командиров, чтобы держать фронтир в тишине."
 HSM_CYA_dawnclaw_security_files_idea:0 "Дела безопасности"
 HSM_CYA_dawnclaw_security_files_idea_desc:0 "Порты, компании и капитулы заносятся в дела, превращающие местное влияние в рычаг давления."
 HSM_CYA_frontier_loyalty_primers_idea:0 "Фронтирные буквари лояльности"
 HSM_CYA_frontier_loyalty_primers_idea_desc:0 "Школьные тексты на фронтире учат верности через карты, закон и тщательно подобранную имперскую историю."
 HSM_CYA_frontier_paper_tribunals_idea:0 "Бумажные трибуналы"
 HSM_CYA_frontier_paper_tribunals_idea_desc:0 "Трибуналы Донкло иногда карают формулярами вместо виселиц, создавая информаторов и обязательства вместо мучеников."
 HSM_CYA_hostage_officer_bonds_idea:0 "Офицерские узы заложников"
 HSM_CYA_hostage_officer_bonds_idea_desc:0 "Скомпрометированные семьи привязываются к армии через сыновей, чья карьера зависит от повиновения."
 HSM_CYA_regency_bread_offices_idea:0 "Хлебные бюро регентства"
 HSM_CYA_regency_bread_offices_idea_desc:0 "Пайковые бюро и рыночные инспекторы делают регентство заметным в повседневной жизни до того, как политика вернется на улицы."
 HSM_CYA_restored_imperial_courts_idea:0 "Восстановленные имперские суды"
 HSM_CYA_restored_imperial_courts_idea_desc:0 "Открытые суды дают регентству законное лицо и способ отделить коллаборационистов от полезных служащих."
 HSM_CYA_emergency_griffenheim_command_idea:0 "Чрезвычайная комендатура Грифенхейма"
 HSM_CYA_emergency_griffenheim_command_idea_desc:0 "Столица удерживается военными канцеляриями, охраной складов и штабными приказами, для которых беспорядок является логистической неисправностью."
 HSM_CYA_purge_imperial_remainders_idea:0 "Чистка имперских остатков"
 HSM_CYA_purge_imperial_remainders_idea_desc:0 "Старых чиновников проверяют, запугивают и выборочно сохраняют люди службы безопасности Донкло."
 HSM_CYA_grover_mercy_lesson_idea:0 "Урок Гровера: милосердие"
 HSM_CYA_grover_mercy_lesson_idea_desc:0 "Подготовленный образ юного императора делает акцент на примирении и восстановлении обычного мира."
 HSM_CYA_grover_authority_lesson_idea:0 "Урок Гровера: власть"
 HSM_CYA_grover_authority_lesson_idea_desc:0 "Подготовленный образ юного императора делает акцент на повиновении, иерархии и возвращении командования."
 HSM_CYA_grover_frontier_lesson_idea:0 "Урок Гровера: фронтир"
 HSM_CYA_grover_frontier_lesson_idea_desc:0 "Подготовленный образ юного императора связывает имперскую легитимность с суровыми окраинами, которые его восстановили."
 HSM_CYA_grover_liability_file_idea:0 "Досье об опасности Гровера"
 HSM_CYA_grover_liability_file_idea_desc:0 "Штаб Донкло сохраняет аргументы в пользу того, что Гровер опаснее как символ, чем полезен."
 HSM_CYA_puppet_education_file_idea:0 "Досье марионеточного воспитания"
 HSM_CYA_puppet_education_file_idea_desc:0 "Каждый урок, подготовленный для Гровера, одновременно становится поводком из манер, церемоний и тщательно подобранных наставников."
 HSM_CYA_revealed_exile_regime_secure:0 "Укрепленный режим изгнанника"
 HSM_CYA_revealed_exile_regime_secure_desc:0 "Захват власти Донкло выходит из стадии чрезвычайного заговора и превращается в вооруженное правительство с канцеляриями, охраной и распорядком."
 HSM_CYA_strained_minotaurian_indigenes:0 "Напряженные минотаврийские туземцы"
 HSM_CYA_strained_minotaurian_indigenes_desc:0 "Минотаврийская глубинка остается враждебной и плохо представленной, но режим Донкло начинает заменять старое имперское пренебрежение реестрами, принуждением и ограниченным военным торгом."
 HSM_CYA_policed_minotaurian_outback:0 "Патрулируемая минотаврийская глубинка"
 HSM_CYA_policed_minotaurian_outback_desc:0 "За глубинкой следят патрули, информаторы и дорожные посты. Эта система дорога и вызывает ненависть, но уже не истощает гарнизоны прибрежных городов так слепо, как раньше."
 HSM_CYA_registered_minotaurian_communities:0 "Зарегистрированные минотаврийские общины"
 HSM_CYA_registered_minotaurian_communities_desc:0 "После южной кампании местные минотаврийские общины загоняются в реестры и обязательства, уменьшающие сопротивление без притворства, будто примирение уже наступило."
 HSM_CYA_asterion_military_governorate:0 "Военное губернаторство Астериона"
 HSM_CYA_asterion_military_governorate_desc:0 "Астерион удерживается гарнизонами, списками вспомогательных частей и военными канцеляриями, пока Донкло разворачивает следующую кампанию к Сикамеону."
 HSM_CYA_southern_security_administration:0 "Южная администрация безопасности"
 HSM_CYA_southern_security_administration_desc:0 "Чрезвычайные южные командования свернуты в постоянную администрацию портов, дорог, вспомогательных частей и зарегистрированных местных властей."
 HSM_CYA_countess_southern_settlement:0 "Южное урегулирование"
 HSM_CYA_countess_southern_settlement_desc:0 "Графиня заменяет военные мандаты торговыми советами, местными договоренностями и консервативным урегулированием южного побережья."
 HSM_CYA_herzland_reconstruction_authority_settled:0 "Укрепленное управление Герцланда"
 HSM_CYA_herzland_reconstruction_authority_settled_desc:0 "Управление, созданное для похода на Грифенхейм, переустраивается в оккупационные канцелярии, советы восстановления и полицейский надзор."
