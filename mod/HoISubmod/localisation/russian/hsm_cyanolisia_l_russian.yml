l_russian:
 hsm_cyanolisia.1.t:0 "Беглец из Гриффенхейма"
 hsm_cyanolisia.1.d:0 "Чистка в Гриффенхейме заставила офицеров, осведомителей и перепуганных курьеров разбегаться по всему Херцланду. Один такой курьер прибывает ко двору графини под чужим именем, неся запечатанное признание и просьбу о убежище от самого Фердинанда Даункло. Дать ему приют - значит рискнуть гневом Империи, но его знания об армии могут оказаться полезными, если держать его тихо и рядом."
 hsm_cyanolisia.1.a:0 "Спрятать его как помощника графини."
 hsm_cyanolisia.1.b:0 "Отослать его, пока Империя ничего не заметила."
 HSM_CYA_ferdinand_dawnclaw:0 "Фердинанд Даункло"
 HSM_CYA_ferdinand_dawnclaw_desc:0 "Официально он всего лишь младший помощник при дворе графини. На деле Даункло остается опасным изгнанником с солдатской памятью на имена, формирования и старые обиды. Его присутствие укрепляет решимость против Гриффенхейма, но попытки скрывать его истощают политический капитал."
 HSM_CYA_dawnclaw_assistant_appointed_tt:0 "Фердинанд Даункло будет назначен политическим советником, и его нельзя будет заменить."
 HSM_CYA_dawnclaw_griffonian_files:0 "Гриффенхеймские досье Даункло"
 HSM_CYA_dawnclaw_griffonian_files_desc:0 "Даункло привез из Гриффенхейма имена, карты, походные таблицы и личные счеты. Даже в изгнании его знания делают Цианолисию опаснее для Империи."
 hsm_cyanolisia.2.t:0 "Три применения для беглеца"
 hsm_cyanolisia.2.d:0 "Даункло пережил первые дни в укрытии. Его имя не появляется в книгах учета, его комнаты записаны как склад, а прислуга графини уже научилась не спрашивать, почему младший помощник получает военные доклады. Теперь двор должен решить, чем на самом деле станет этот опасный гость."
 hsm_cyanolisia.2.a:0 "Он советник, и не более."
 hsm_cyanolisia.2.b:0 "Привязать его ко двору."
 hsm_cyanolisia.2.c:0 "Передать его бумаги администрации."
 hsm_cyanolisia.3.t:0 "Брак по расчету"
 hsm_cyanolisia.3.d:0 "Никакой публичный роман не смог бы объяснить этот союз, да он, возможно, и не нужен. Графиня получает солдата, знающего слабости Гриффенхейма. Даункло получает крышу, имя и двор, который он может попытаться склонить к мести."
 hsm_cyanolisia.3.a:0 "Пусть двор шепчется."
 hsm_cyanolisia.4.t:0 "Дом полковника"
 hsm_cyanolisia.4.d:0 "Дворцовая стража больше не ждет распоряжений гражданских клерков. Доклады проходят через стол Даункло прежде, чем попасть к графине, а офицеры все чаще говорят о безопасности, дисциплине и внутренних врагах."
 hsm_cyanolisia.4.a:0 "Он знает, как навести порядок."
 hsm_cyanolisia.5.t:0 "Графиня одна"
 hsm_cyanolisia.5.d:0 "Таиллоу позволила Даункло советовать, но не командовать. Его досье полезны, его ярость сдержана, а двор усвоил: изгнанник жив лишь потому, что графиня это дозволяет."
 hsm_cyanolisia.5.a:0 "Двор помнит, кто правит."
 hsm_cyanolisia.10.t:0 "Ножи из Гриффенхейма"
 hsm_cyanolisia.10.d:0 "Легенда вокруг Даункло начала расползаться. Один курьер исчез, слугу подкупили, а дворцовая стража перехватила признаки движения имперских агентов через порт. Кто-то в Гриффенхейме решил, что неудавшийся полковник не должен прожить достаточно долго, чтобы стать полезным."
 hsm_cyanolisia.10.a:0 "Перевезти его до удара."
 hsm_cyanolisia.10.b:0 "Агенты находят свою цель."
 hsm_cyanolisia.11.t:0 "Прикрытие рушится"
 hsm_cyanolisia.11.d:0 "Слишком много писем сожжено, слишком много офицеров приходило после темноты, и слишком много слуг видело, как помощник графини читает военные депеши. Тайна больше не удерживается внутри дворца."
 hsm_cyanolisia.11.a:0 "Гриффенхейм об этом услышит."
 HSM_CYA_blackrock_path_tt:0 "Открывает скелет решений оборонительного пути графства Блэкрок."
 HSM_CYA_marriage_path_tt:0 "Открывает скелет решений брака и борьбы за влияние при дворе."
 HSM_CYA_imperial_admin_path_tt:0 "Открывает короткий запасной путь Имперской администрации."
 HSM_CYA_power_struggle_unlocked_tt:0 "Баланс между Даункло и графиней теперь можно менять решениями."
 HSM_CYA_dawnclaw_dominance_tt:0 "Даункло доминирует при дворе. Его присутствие фактически раскрыто Империи."
 HSM_CYA_countess_dominance_tt:0 "Графиня доминирует при дворе. Даункло остается скрытым дольше."
 HSM_CYA_assassination_prevented_tt:0 "Даункло на время перевозят в более надежное убежище."
 HSM_CYA_dawnclaw_paths:0 "Даункло в Цианолисии"
 HSM_CYA_dawnclaw_paths_desc:0 "Присутствие Фердинанда Даункло дает Цианолисии возможности, угрозы и тихий кризис внутри двора графини."
 HSM_CYA_maintain_dawnclaw_cover:0 "Поддерживать прикрытие Даункло"
 HSM_CYA_maintain_dawnclaw_cover_desc:0 "Обновить фальшивые бумаги, переставить слуг и убедиться, что помощник графини остается помощником хотя бы на бумаге."
 HSM_CYA_form_blackrock_county:0 "Сформировать графство Блэкрок"
 HSM_CYA_form_blackrock_county_desc:0 "Создать оборонительную идентичность вокруг приграничья и подготовить Цианолисию к давлению со стороны Минотаврии и Сикамеона."
 HSM_CYA_prepare_border_claims:0 "Подготовить пограничные претензии"
 HSM_CYA_prepare_border_claims_desc:0 "Если соседи нападут и потерпят неудачу, двор графини будет готов потребовать цену."
 HSM_CYA_integrate_minotaur_outback:0 "Интегрировать минотаврийскую глубинку"
 HSM_CYA_integrate_minotaur_outback_desc:0 "Предложить местные уступки и административное признание, чтобы снизить долгосрочную нестабильность."
 HSM_CYA_police_minotaur_outback:0 "Полицейский контроль глубинки"
 HSM_CYA_police_minotaur_outback_desc:0 "Даункло предпочитает патрули, информаторов и силу вместо уступок."
 HSM_CYA_delegate_security_to_dawnclaw:0 "Передать безопасность Даункло"
 HSM_CYA_delegate_security_to_dawnclaw_desc:0 "Позволить Даункло перестроить дворцовую безопасность и внутреннюю дисциплину армии."
 HSM_CYA_expand_countess_cabinet:0 "Расширить кабинет графини"
 HSM_CYA_expand_countess_cabinet_desc:0 "Усилить гражданскую администрацию до того, как офицеры изгнанника станут единственной организованной фракцией при дворе."
 HSM_CYA_imperial_administration_cleanup:0 "Навести порядок в бумагах"
 HSM_CYA_imperial_administration_cleanup_desc:0 "Администрация сохраняет полезное из документов Даункло и тихо хоронит остальное."
 HSM_CYA_blackrock_county_policy:0 "Политика графства Блэкрок"
 HSM_CYA_blackrock_county_policy_desc:0 "Даункло остается советником, полезным главным образом для муштры на границах и подготовки Цианолисии к оборонительной войне."
 HSM_CYA_unlikely_marriage:0 "Невероятный брак"
 HSM_CYA_unlikely_marriage_desc:0 "Графиня и Даункло связаны удобством, расчетом и общей опасностью. Двор наблюдает, кто из них будет править на самом деле."
 HSM_CYA_dawnclaw_dominant_court:0 "Даункло доминирует при дворе"
 HSM_CYA_dawnclaw_dominant_court_desc:0 "Графиня все еще подписывает приказы, но канцелярия Даункло решает, что попадет к ней на стол."
 HSM_CYA_countess_dominant_court:0 "Графиня доминирует при дворе"
 HSM_CYA_countess_dominant_court_desc:0 "Даункло остается полезным, но сдержанным. Двор возвращается к гражданскому правлению и осторожной интеграции."
 HSM_CYA_integrative_minotaur_policy:0 "Интеграционная политика для минотавров"
 HSM_CYA_integrative_minotaur_policy_desc:0 "Глубинку постепенно включают в графство через уступки, признание и развитие."
 HSM_CYA_hardline_minotaur_policy:0 "Жесткая политика для минотавров"
 HSM_CYA_hardline_minotaur_policy_desc:0 "Глубинка рассматривается сначала как проблема безопасности, и лишь затем как политическая проблема."
 HSM_CYA_imperial_administration:0 "Имперская администрация"
 HSM_CYA_imperial_administration_desc:0 "Даункло мертв или отстранен, но его бумаги, контакты и враги остаются. Небольшая административная клика теперь занимается последствиями."
