 HSM_CYA_history_lake_crown_magistrates:0 "Озёрными провинциями управляют магистраты короны."
 HSM_CYA_history_lake_service_nobility:0 "Местная знать обслуживает озёрную сеть армейского снабжения."
 HSM_CYA_history_lake_military_administration:0 "Военные управления ведают озёрными путями и арсеналом."
 HSM_CYA_history_lake_unsettled:0 "Озёрные провинции ещё ожидают окончательного устройства."
 HSM_CYA_history_western_industrial_compacts:0 "Промышленная собственность Запада защищена заключёнными соглашениями."
 HSM_CYA_history_western_public_contracts:0 "Казна контролирует западные государственные заказы и исследования."
 HSM_CYA_history_western_licensed_industry:0 "Западные заводы работают по армейским разрешениям и договорам."
 HSM_CYA_history_western_sequestered_arsenals:0 "Часть западных предприятий обращена в казённые арсеналы."
 HSM_CYA_history_west_unsettled:0 "Промышленное устройство Запада ещё не определено."
 HSM_CYA_history_grover_lesson_mercy:0 "Гровер помнит уроки милосердия: власть несёт обязательства перед теми, кем управляет."
 HSM_CYA_history_grover_lesson_authority:0 "Гровера учили, что власть является обязанностью, а не одним лишь титулом."
 HSM_CYA_history_grover_lesson_frontier:0 "Донесения с границы приучили Гровера спрашивать, как решения столицы исполняются в провинциях."
 HSM_CYA_history_education_unsettled:0 "Это правительство не руководило прежним воспитанием Гровера; совету предстоит иметь дело с тем правителем, который перед ним."
 HSM_CYA_history_grover_guarantees_charters:0 "Гровер уже обещал соблюдать провинциальные хартии; новые положения должны учитывать это обязательство."
 HSM_CYA_history_grover_civilian_oversight:0 "Гровер потребовал гражданского надзора за штабом; постоянный порядок должен определить, кто обеспечит его исполнение."
 HSM_CYA_history_grover_provincial_inspections:0 "Гровер поставил восстановление провинций на первое место; министерства должны отчитываться о работе за пределами столицы."
 HSM_CYA_history_puppet_civil_audiences:0 "Канцелярии гражданских прошений Гровера отведена ограниченная признанная роль, хотя исполнительная власть остаётся у других."
 HSM_CYA_history_puppet_staff_audiences:0 "Прошения к престолу по-прежнему проходят через штаб; самостоятельной исполнительной канцелярии у императора нет."
 HSM_CYA_history_crown_policy_unsettled:0 "Это соглашение не определяет личную политику Гровера и не меняет установленного порядка передачи короны."

