 HSM_CYA_DIRECTORATE_communism_DEF:0 "Цианолизский директорат"
 HSM_CYA_DIRECTORATE_fascism_ADJ:0 "Цианолизск"
 HSM_CYA_DIRECTORATE_neutrality_ADJ:0 "Цианолизск"
 HSM_CYA_DIRECTORATE_democratic_ADJ:0 "Цианолизск"
 HSM_CYA_DIRECTORATE_communism_ADJ:0 "Цианолизск"
 hsm_cyanolisia.47.t:0 "Северные штандарты"
 hsm_cyanolisia.47.countess.d:0 "Посланники графини принесли на север хартии с печатью Грифенхейма. Одни дворы торгуются за права своих собраний, другие проверяют, сколько гарнизонов стоит за красивыми словами. Регентство должно оплатить работу переговорщиков и привести их обещания к единому закону."
 hsm_cyanolisia.47.dawnclaw.d:0 "Северные знамена не спешат склоняться перед Грифенхеймом. Донкло рассылает ультиматумы, но его штаб знает: каждая столица потребует отдельного соглашения или отдельной кампании. Военная победа еще не создаст работающую администрацию."
 hsm_cyanolisia.47.a:0 "Открыть канцелярию северных дел."
 hsm_cyanolisia.48.t:0 "На другом берегу"
 hsm_cyanolisia.48.countess.d:0 "За рекой нет пустой клетки на имперской карте. Федерация, местные короны и городские советы говорят от имени собственных жителей. Графиня велит заранее подготовить границы будущих комиссариатов: победа не должна обернуться аннексией каждой деревни."
 hsm_cyanolisia.48.dawnclaw.d:0 "Штаб Донкло прокладывает переправы и линии снабжения. К полевым картам уже приколоты проекты комиссариатов: после похода пони останутся под имперским надзором, но не станут провинциями Грифенхейма."
 hsm_cyanolisia.48.a:0 "Подготовить управление за рекой."
 hsm_cyanolisia.49.t:0 "Граница имперского ядра"
 hsm_cyanolisia.49.d:0 "Восточные грифонские округа можно связать с Грифенхеймом судами, налогами и железной дорогой. Но за рекой поньи советы и вожди холмов не превратятся в имперские провинции от одного росчерка пера. Канцелярия предлагает зависимые комиссариаты: местные чиновники останутся на местах под властью имперского наместника."
 hsm_cyanolisia.49.a:0 "Пусть канцелярия подготовит указы."
 hsm_cyanolisia.50.t:0 "Запад помнит свои короны"
 hsm_cyanolisia.50.countess.d:0 "Аквелийские представители и западные князья выслушали послов регентства порознь. Графиня предлагает каждому двору место в общей системе законов, но ни один договор не отменит старых притязаний. Для этого понадобятся судьи, архивы и терпение."
 hsm_cyanolisia.50.dawnclaw.d:0 "Штаб Донкло чертит стрелы на карте запада. Представители Аквелии и старых княжеств видят в них конец своей независимости, какой бы строй ни установился у них теперь. Чтобы удержать запад после победы, Грифенхейму понадобятся действующие суды, а не только гарнизоны."
 hsm_cyanolisia.50.a:0 "Открыть западные архивы."
 hsm_cyanolisia.51.t:0 "Южные договоры"
 hsm_cyanolisia.51.countess.d:0 "Южные короны торгуют через море и не собираются признавать Грифенхейм из одной лишь памяти об императорах. Графиня готовит договоры о портах и пошлинах вместе с планами кампании: империя должна суметь управлять тем, что завоюет."
 hsm_cyanolisia.51.dawnclaw.d:0 "Южный поход не закончится на последней сухопутной границе. Порты, острова и морские пути требуют отдельных гарнизонов и собственного штаба снабжения. Донкло отдает флоту и армии общие приказы перед кампанией."
 hsm_cyanolisia.51.a:0 "Подготовить южный штаб."
 HSM_CYA_reform_field_command:0 "Реформа полевого командования"
 HSM_CYA_reform_field_command_desc:0 "Береговые полки, пограничные гарнизоны и дворцовые офицеры слишком долго подчинялись разным ведомствам. Единое командование установит, чей приказ важнее, когда прозвучит первая тревога."
 HSM_CYA_standardise_field_equipment:0 "Единые стандарты снабжения"
 HSM_CYA_standardise_field_equipment_desc:0 "Каждый полк бережет собственные склады и привычные образцы оружия. Общие стандарты позволят снабжать батальон на севере не только тому интенданту, который когда-то его сформировал."
 HSM_CYA_officer_academy:0 "Цианолизийская офицерская академия"
 HSM_CYA_officer_academy_desc:0 "Опытные унтер-офицеры сядут над картами рядом с сыновьями придворных семейств. Академия не сотрет старые привязанности, но даст им общий язык прежде, чем армия перерастет своих командиров."
 HSM_CYA_frontier_supply_corps:0 "Корпус снабжения фронтира"
 HSM_CYA_frontier_supply_corps_desc:0 "Гарнизон держится столько, сколько проработает дорога за его спиной. Водители, механики и складские писари войдут в один корпус, чтобы командирам не приходилось собирать обоз заново при каждой тревоге."
 HSM_CYA_combined_arms_school:0 "Школа общевойскового боя"
 HSM_CYA_combined_arms_school_desc:0 "Пехота не раз уходила вперед без орудий, пока заводы работали по мирному графику. На учениях полки, батареи и арсеналы впервые спланируют одно и то же сражение."
 HSM_CYA_joint_general_staff:0 "Объединенный генеральный штаб"
 HSM_CYA_joint_general_staff_desc:0 "Комиссии по реформам можно распустить; генеральный штаб должен пережить назначивших его министров. На его картах появятся побережье, дороги Эви и дальний путь к Грифенхейму."
 HSM_CYA_crown_field_staff:0 "Полевой штаб Короны"
 HSM_CYA_crown_field_staff_desc:0 "Графиня не намерена оставлять после себя россыпь личных армий. Офицеры должны служить короне, а не ее дому; приказы будут храниться и при дворе, и в казармах."
 HSM_CYA_dawnclaw_operational_staff:0 "Оперативный штаб Донкло"
 HSM_CYA_dawnclaw_operational_staff_desc:0 "Донкло раскладывает старые имперские карты на цианолизийском столе. Его офицеры учатся мыслить железнодорожными расписаниями, резервами и походами, не заканчивающимися у ближайшей границы."
 HSM_CYA_border_defense_staff:0 "Штаб обороны границы"
 HSM_CYA_border_defense_staff_desc:0 "Марка не победит, копируя наступления великих держав. Ее штаб изучит перевалы, подготовит склады за ними и рассчитает, как меньшей армией заставить захватчика платить за каждую дорогу."
 HSM_CYA_coastal_reconstruction:0 "Восстановить прибрежную экономику"
 HSM_CYA_coastal_reconstruction_desc:0 "У оживленных причалов стоят закрытые мастерские, а молодые рабочие уезжают за заработком. Открыть фабрики вновь - первый способ доказать, что модернизация выйдет за пределы придворных отчетов."
 HSM_CYA_coastal_transport_authority:0 "Управление прибрежного транспорта"
 HSM_CYA_coastal_transport_authority_desc:0 "На одной станции груз простаивает, пока мимо другой идут пустые вагоны. Транспортное ведомство сведет порты, мастерские и пограничные склады в расписание, за которое кому-то придется отвечать."
 HSM_CYA_technical_institute:0 "Цианолизийский технический институт"
 HSM_CYA_technical_institute_desc:0 "Лучшие механики обучают учеников рядом со сломанными станками. Лаборатории, книги и оплачиваемое время для опытов позволят их работе пережить любого министра."
 HSM_CYA_port_foundries:0 "Портовые мастерские"
 HSM_CYA_port_foundries_desc:0 "Порт не может вечно жить на привозных деталях. Литейные и причальные мастерские поддержат флот, а купцам дадут причину вкладываться в те же набережные."
 HSM_CYA_arsenal_network:0 "Сеть арсеналов"
 HSM_CYA_arsenal_network_desc:0 "Один большой арсенал может остановить забастовка, пожар или налет. Сеть малых мастерских с общими стандартами продолжит вооружать армию, даже когда столица не сможет."
 HSM_CYA_national_development_plan:0 "Общегосударственный план развития"
 HSM_CYA_national_development_plan_desc:0 "Железнодорожники, учителя и фабриканты просят денег так, словно остальные не существуют. Общий план заставит их ответить на один вопрос: какую страну они строят?"
 HSM_CYA_crown_credit_authority:0 "Кредитное управление Короны"
 HSM_CYA_crown_credit_authority_desc:0 "Графиня просит старые семьи дать взаймы будущей короне, а не только собственным имениям. Их деньги поднимут города и цеха; двору предстоит следить, чтобы кредиторы не прибрали их к рукам."
 HSM_CYA_dawnclaw_procurement_office:0 "Закупочное ведомство Донкло"
 HSM_CYA_dawnclaw_procurement_office_desc:0 "Донкло помнит, какие фирмы снабжали Грифенхейм и какие директора примут тайный заказ. Единое закупочное ведомство превратит эти связи в винтовки, машины и обязательства."
 HSM_CYA_frontier_development_board:0 "Совет развития фронтира"
 HSM_CYA_frontier_development_board_desc:0 "Землемеры знают деревни, которые генералы обозначают на картах пустым местом. Собственный совет и бюджет позволят строить дороги и склады для тех, кому предстоит поддерживать их в порядке."
 HSM_CYA_southern_fleet_yards:0 "Верфи Южного флота"
 HSM_CYA_southern_fleet_yards_desc:0 "Старые стапели заняты ржавыми корпусами, а морякам месяцами не платили жалованье. Возвращение верфей даст южному берегу корабли, которые он способен чинить сам, а не флот на бумаге."
 HSM_CYA_coastal_patrols:0 "Прибрежные патрули"
 HSM_CYA_coastal_patrols_desc:0 "Контрабандисты и чужие разведчики знают бухты лучше Адмиралтейства. Регулярные патрули превратят берег из линии на штабной карте в воды, за которыми флот действительно наблюдает."
 HSM_CYA_naval_air_school:0 "Школа морской авиации"
 HSM_CYA_naval_air_school_desc:0 "Кораблей не хватит на каждую милю между портами. Летчики, обученные вместе с капитанами, заметят конвои, налетчиков и шторм раньше, чем запоздалые донесения дойдут до Адмиралтейства."
 HSM_CYA_dockyard_program:0 "Программа судостроения"
 HSM_CYA_dockyard_program_desc:0 "Строительство рывками оставляет опытных рабочих без дела между заказами. Постоянные контракты и новые стапели сделают судостроение ремеслом, которое порт передаст следующему поколению."
 HSM_CYA_raise_austernfischer:0 "Поднять «Аустернфишер»"
 HSM_CYA_raise_austernfischer_desc:0 "«Аустернфишер» столько лет пролежал в гавани, что старые моряки рассказывают о нем как легенду. Поднять его будет непросто, но экипаж, увидевший корабль снова на плаву, поверит в будущее флота."
 HSM_CYA_seaborne_corps:0 "Морской десантный корпус"
 HSM_CYA_seaborne_corps_desc:0 "Исход высадки решается до того, как первая шлюпка коснется берега. Морпехи должны тренироваться с экипажами, которые их везут, и уметь держаться, пока снабжение остается в море."
 HSM_CYA_admiralty_compact:0 "Соглашение Адмиралтейства"
 HSM_CYA_admiralty_compact_desc:0 "Капитаны, летчики и береговые командиры годами защищали каждый свой бюджет. Соглашение даст им общий план и заставит отвечать не только за собственные потери."
 HSM_CYA_imperial_supply_grid:0 "Имперская сеть снабжения"
 HSM_CYA_imperial_supply_grid_desc:0 "Распад империи оставил южные железные дороги и склады Грифенхейма под разным управлением. Тарифы, расписания и раздельные запасы разделяют сеть, когда-то служившую общей державе. Восстановить её связь менее славно, чем взять столицу, но без этого армия не сможет идти дальше."
 HSM_CYA_griffonian_armament_standard:0 "Грифонский стандарт вооружения"
 HSM_CYA_griffonian_armament_standard_desc:0 "В захваченных складах лежит оружие разных армий и разных правителей. Общий стандарт позволит провинциям снабжать единые войска, не закрывая мастерские, привыкшие делать нужные детали."
 HSM_CYA_quartermaster_service:0 "Интендантская служба"
 HSM_CYA_quartermaster_service_desc:0 "Грузовик без единственной детали не поможет марширующему полку. Интенданты станут считать топливо, ремонт и запасные колеса столь же внимательно, как офицеры считают винтовки."
 HSM_CYA_railway_battalions:0 "Железнодорожные батальоны"
 HSM_CYA_railway_battalions_desc:0 "Пути у границы чинят после каждого кризиса и забывают после каждого мира. Постоянные железнодорожные батальоны сохранят линию открытой еще до того, как она понадобится армии."
 HSM_CYA_signal_companies:0 "Роты связи"
 HSM_CYA_signal_companies_desc:0 "Обрыв провода может оставить батальон в сражении за вчерашний день. Роты связи проведут приказы сквозь непогоду и бездорожье, научившись понимать, когда молчание важнее скорости."
 HSM_CYA_field_hospitals:0 "Полевые госпитали"
 HSM_CYA_field_hospitals_desc:0 "Раненые слишком часто терялись между передовой и ближайшим городом. Медики, повозки и ясные пути эвакуации дадут солдатам причину доверять армии, которая послала их в бой."
 HSM_CYA_frontier_artillery:0 "Пограничная артиллерия"
 HSM_CYA_frontier_artillery_desc:0 "Пограничные полки не всегда могут ждать орудий, одолженных столицей. Собственные батареи изучат перевалы и займут позиции до появления первой вражеской колонны."
 HSM_CYA_engineer_brigades:0 "Инженерные бригады"
 HSM_CYA_engineer_brigades_desc:0 "Те же руки, что возводят оборонительную стену, должны уметь ее преодолеть. Саперные бригады освоят мосты, подрывы и терпеливый труд, без которого фронт не удержать."
 HSM_CYA_aerial_reconnaissance:0 "Воздушная разведка"
 HSM_CYA_aerial_reconnaissance_desc:0 "Карты прошлой войны не покажут новых дорог и вражеских лагерей. Летчики с передовых аэродромов доставят снимки и донесения прежде, чем штаб двинет резервы."
 HSM_CYA_motorised_reserves:0 "Моторизованный резерв"
 HSM_CYA_motorised_reserves_desc:0 "Континентальная армия не может просить каждый кризис подождать пешую пехоту. Механики и водители создадут резерв, способный быстро перейти от одной опасной железной дороги к другой."
 HSM_CYA_crown_military_colleges:0 "Военные училища короны"
 HSM_CYA_crown_military_colleges_desc:0 "Графине нужны офицеры, чья служба переживёт её правительство. Патенты должны связывать их с законными учреждениями, а не с личным двором. Тогда армия сможет служить будущему имперскому порядку, не требуя повторно покупать её верность."
 HSM_CYA_dawnclaw_war_college:0 "Военная академия Донкло"
 HSM_CYA_dawnclaw_war_college_desc:0 "Донкло не нужны офицеры, умеющие лишь восхищаться его победами. Ему нужен штаб, который снабдит три похода, скроет четвертый и не остановится в его отсутствие."
 HSM_CYA_imperial_officer_exchange:0 "Обмен имперскими офицерами"
 HSM_CYA_imperial_officer_exchange_desc:0 "Бывшие враги приезжают с разными уставами и памятью об одной войне. Переводы между частями заставят их понять чужой строй прежде, чем они вместе возглавят провинциальные войска."
 HSM_CYA_continental_ordnance:0 "Вооружение континента"
 HSM_CYA_continental_ordnance_desc:0 "Арсеналы старой столицы когда-то вооружали империю; завоевание наполнило их несовместимыми запасами. Общие допуски, правила приёмки и длительные производственные серии заменят привычку выдавать всё, что осталось на захваченном складе. Первые поставки обеспечат действующую армию стрелковым оружием текущего производственного стандарта, артиллерией и вспомогательным снаряжением."
 HSM_CYA_independent_air_service:0 "Воздушная служба Цианолизии"
 HSM_CYA_independent_air_service_desc:0 "Авиация должна не только сопровождать корабли вдоль побережья. Постоянная воздушная служба сухопутного базирования получит собственные аэродромы, склады и штаб, продолжая обмениваться разведданными с флотом. Её первая задача скромна: подготовленные экипажи и исправные машины должны быть готовы к вылету, когда они понадобятся армии."
 HSM_CYA_flight_instructors:0 "Подготовить инструкторов"
 HSM_CYA_flight_instructors_desc:0 "Несколько опытных лётчиков не могут обучать каждую новую эскадрилью в перерывах между боевыми вылетами. Постоянный инструкторский состав введёт общую программу, учёт аварий и обучение обслуживанию машин. Клара Моргенфлуг будет отстаивать эти практические нужды при распределении учебного бюджета."
 HSM_CYA_aircraft_workshops:0 "От мастерских к ангарам"
 HSM_CYA_aircraft_workshops_desc:0 "Прибрежные мастерские уже ремонтируют двигатели и точные механизмы. Специальные ангары, испытательные стенды и постоянные заказы позволят им заняться и авиационным производством. Службе нужны взаимозаменяемые детали и моторы, пригодные для ремонта в полевых условиях, а не только убедительный опытный образец."
 HSM_CYA_interceptor_contracts:0 "Защитить наше небо"
 HSM_CYA_interceptor_contracts_desc:0 "Вражеский бомбардировщик должен встретить наши истребители раньше, чем достигнет железнодорожного узла. Снабженцы и лётчики согласуют программу перехватчиков с надёжными двигателями, достаточным вооружением и дальностью полёта. Учения эскадрилий превратят эти требования в действующую систему обороны."
 HSM_CYA_battlefield_aircraft:0 "Самолёты для фронта"
 HSM_CYA_battlefield_aircraft_desc:0 "Сухопутным войскам нужны лётчики, способные найти движущуюся колонну и атаковать её, не подвергая опасности свои позиции. Новые заказы учтут требования воздушной разведки, бомбовую нагрузку и управляемость на малой высоте. Эти машины будут оценивать по работе над действующим фронтом, а не на параде."
 HSM_CYA_air_warning_network:0 "Сеть воздушного оповещения"
 HSM_CYA_air_warning_network_desc:0 "Пограничные наблюдатели не могут отвечать на каждый далёкий шум мотора звонком в столицу. Радиолокационные станции и посты наблюдения войдут в общую сеть, чтобы диспетчеры направляли истребители туда, где они нужны. Раннее предупреждение даст время укрыться и работникам мастерских и складов."
 HSM_CYA_air_ground_liaison:0 "Общая карта и радиосеть"
 HSM_CYA_air_ground_liaison_desc:0 "Армия и воздушная служба по-разному размечают карты и зачастую подчиняются разным штабам. Группы связи получат совместимые радиостанции, освоят обе системы и отработают вызов поддержки на полевых учениях. Лётчик должен получать ясную цель и свежие сведения, а не вчерашний приказ."
 HSM_CYA_unified_air_command:0 "Единое воздушное командование"
 HSM_CYA_unified_air_command_desc:0 "Истребительные патрули, поддержка войск и подготовка пополнений теперь нуждаются в общем оперативном расписании. Воздушный штаб согласует их работу, не поглощая специализированные эскадрильи флота. Расширенные ремонтные мощности и передовые аэродромы позволят продолжать операции после первой недели кампании."
 HSM_CYA_port_customs_houses:0 "Таможенные и грузовые конторы"
 HSM_CYA_port_customs_houses_desc:0 "Грузы исчезают между портовыми книгами и внутренними складами. Таможенники и экспедиторы сведут отчеты, превратив недостающие пошлины в заработок для новых мастерских."
 HSM_CYA_coastal_quarries:0 "Южные каменоломни"
 HSM_CYA_coastal_quarries_desc:0 "Каменоломни глубинки дают сырье, но руду увозят без обработки. Землемеры и металлурги оставят часть этой работы южным городам, откуда начинаются дороги к морю."
 HSM_CYA_electrify_the_workshops:0 "Электрификация мастерских"
 HSM_CYA_electrify_the_workshops_desc:0 "Старые мастерские закрываются с закатом даже при полной книге заказов. Надежное электричество и обученные электрики позволят станочникам жить по расписанию работы, а не солнца."
 HSM_CYA_apprenticeship_halls:0 "Ремесленные училища"
 HSM_CYA_apprenticeship_halls_desc:0 "Фабрика может ввезти станки, но не умение распознать их неисправность. Ремесленные училища сведут опытных мастеров с молодежью прежде, чем новый рост оставит цеха без специалистов."
 HSM_CYA_rural_cooperatives:0 "Сельские кооперативы"
 HSM_CYA_rural_cooperatives_desc:0 "Деревню просят кормить города и ждать, пока богатство вернется само. Кооперативы дадут селам инструменты, кредит и долю в промышленности, выросшей из их труда."
 HSM_CYA_industrial_standards_board:0 "Комитет промышленных стандартов"
 HSM_CYA_industrial_standards_board_desc:0 "Детали одного завода не подходят к машинам другого. Инспекторы, инженеры и хозяева договорятся об общих мерах прежде, чем армия и железные дороги вновь заплатят за их разногласия."
 HSM_CYA_crown_municipal_loans:0 "Муниципальные займы короны"
 HSM_CYA_crown_municipal_loans_desc:0 "Городские советы знают, какие мосты и мастерские требуют ремонта, но не могут занять на условиях графини. Её гарантии обеспечат средства в обмен на открытые счета и долю будущих доходов."
 HSM_CYA_dawnclaw_factory_contracts:0 "Заводские контракты Донкло"
 HSM_CYA_dawnclaw_factory_contracts_desc:0 "Контракты Донкло обещают постоянные заказы тем, кто откроет книги для проверки. Арсеналы получат уверенность в завтрашнем дне, а директора узнают политическую цену сорванной поставки."
 HSM_CYA_griffenheim_rail_hub:0 "Грифенхеймский железнодорожный узел"
 HSM_CYA_griffenheim_rail_hub_desc:0 "Пути в Грифенхейм прокладывали для столицы, которой подчинялся юг. Соединение их с цианолизийскими линиями поставит старую географию на службу новой власти."
 HSM_CYA_herzland_industrial_survey:0 "Промышленная перепись Герцланда"
 HSM_CYA_herzland_industrial_survey_desc:0 "Оккупационные офицеры умеют захватить фабрику, но не знают, работает ли ее печь. Инженеры опишут шахты, цеха и разбитые линии прежде, чем столица пообещает невозможный выпуск."
 HSM_CYA_evi_freight_corridor:0 "Грузовой коридор Эви"
 HSM_CYA_evi_freight_corridor_desc:0 "Дороги Эви служили армиям чаще, чем обычной торговле. Надежный коридор из Грифенхейма даст долине товары, не дожидаясь нового похода ради починки мостов."
 HSM_CYA_imperial_research_exchange:0 "Имперский научный обмен"
 HSM_CYA_imperial_research_exchange_desc:0 "Инженеры Цианолизии работали при нехватке средств, ученые Герцланда - под старым имперским покровительством. Пусть их институты обменяются трудами и проверят то, что прежде отвергали."
 HSM_CYA_convoy_escorts:0 "Охрана конвоев"
 HSM_CYA_convoy_escorts_desc:0 "Капитаны торговых судов не могут прокладывать курс по слухам о налетчиках. Расписание эскортов, карты и надежная заправка сохранят морские пути даже во время войны."
 HSM_CYA_naval_signals_school:0 "Школа флотской связи"
 HSM_CYA_naval_signals_school_desc:0 "Предупреждение, дошедшее до одного корабля, но не до эскадры, может погубить весь конвой. Связисты научатся передавать приказы сквозь шторм и привычки упрямых капитанов."
 HSM_CYA_seaplane_stations:0 "Базы гидросамолётов"
 HSM_CYA_seaplane_stations_desc:0 "Флоту нужны глаза за пределами гавани. Летчики гидросамолетов и береговые наблюдатели заметят движение у побережья до того, как о нем сообщит пропавшее судно."
 HSM_CYA_marine_training_ground:0 "Учебный лагерь морской пехоты"
 HSM_CYA_marine_training_ground_desc:0 "Первый десант не способен взять с собой всю армию. Морпехи будут учиться удерживать причал и дорогу, пока транспорты не вернутся за подкреплением."
 HSM_CYA_coastal_defence_batteries:0 "Батареи береговой обороны"
 HSM_CYA_coastal_defence_batteries_desc:0 "Порт можно взять не только с моря: дороги за его спиной столь же уязвимы. Батареи и внутренние укрепления сделают захват гавани дорогим с любого направления."
 HSM_CYA_bluewater_shipyards:0 "Верфи открытого моря"
 HSM_CYA_bluewater_shipyards_desc:0 "Патрульного флота хватит для охраны берега, но не для дальнего похода. Большие стапели и долгие заказы позволят строить корабли, способные оставаться в море месяцами."
 HSM_CYA_imperial_convoy_authority:0 "Имперское управление конвоями"
 HSM_CYA_imperial_convoy_authority_desc:0 "Новые провинции приносят порты с собственными хозяевами и несовместимыми расписаниями. Имперское управление подчинит их общему плану, не делая вид, будто море стало безопасным."
 HSM_CYA_expeditionary_fleet:0 "Экспедиционный флот"
 HSM_CYA_expeditionary_fleet_desc:0 "Южных корон и дальних островов не достичь указом из Грифенхейма. Флот дальнего плавания перевезет армию, прикроет ее возвращение и сохранит связь с землями после победы."
 HSM_CYA_imperial_sentence_title:0 "Приговор Донкло"
 HSM_CYA_imperial_sentence_option:0 "С переворотом покончено."
 HSM_CYA_imperial_escape_desc:0 "Переворот подавлен, но приговорённый генерал сбежал из-под конвоя. Сочувствующий офицер подменил приказ о перевозке; к тому времени, когда обман раскрыли, Фердинанд Донкло с несколькими сообщниками уже исчез по дороге к южным портам. Двор объявляет приговор и приказывает вести розыск без лишней огласки. Власть устояла. Её опаснейший враг до эшафота так и не дошёл."
 hsm_cyanolisia.1.left.d:0 "Побег Донкло из имперской тюрьмы расколол офицеров, связанных с Группой двадцати. Убеждённые революционеры требуют выслать врага их дела; менее преданные соратники видят в нём полезного организатора и возможность вернуть себе контроль над армией. Окружение графини предлагает им сделку: отказаться от революционной программы, восстановить её исполнительную власть там, где она уже утрачена, и укрыть Донкло в качестве военного помощника. Согласие означает контрпереворот, а не продолжение революции. Отказ сохранит прежний политический курс."
 HSM_CYA_court_countercoup_tt:0 "Офицеры отказываются от революционной программы. Исполнительная власть возвращается к графине; путь Донкло заменяет социалистический путь."
 HSM_CYA_grover_in_our_custody_tt:0 "Гровер VI жив и находится в нашей стране; решения не могут распоряжаться правителем независимого иностранного государства."
 hsm_cyanolisia.52.t:0 "Прибытие императорского двора"
 hsm_cyanolisia.52.d:0 "Сопровождающие Гровера привезли счета двора, небольшой конвой и письменное подтверждение прежних хранителей. Их государство теперь либо подчинено нашему, либо полностью покорено; передача стала следствием этого положения, а не одних притязаний на имя наследника. Мальчика разместили под охраной в Грифенхейме. Его судьба ещё не решена."
 hsm_cyanolisia.52.adult.d:0 "Гровер VI прибыл от двора, чьё государство теперь подчинено нашему или полностью покорено. Его сопровождающие передают официальные записи, но рядом с ними стоит не ребёнок, которому достаточно назначить наставника. Правил ли он прежде или годами ждал первого вступления на престол, теперь предстоит договариваться со взрослым претендентом и учитывать верность тех, кто пришёл вместе с ним."
 hsm_cyanolisia.52.a:0 "Разместить двор в Грифенхейме."
 HSM_CYA_grover_ruler_desc:0 "Гровер VI правит из Грифенхейма после цианолизийских походов и официальной передачи исполнительной власти. Его права пережили войны, соперничество хранителей короны и споры о будущем империи. Унаследованные учреждения были созданы до того, как он получил над ними власть. Его правление покажет, сумеет ли он заставить офицеров и министров отвечать перед короной, а не перед её прежними хранителями."
 hsm_cyanolisia.40.late.d:0 "Первое вступление Гровера на престол происходит уже после года его восемнадцатилетия. Перед двором в Грифенхейме Тэйллоу принимает взрослого государя, а не воспитанника. Она передаёт государственные печати и освобождает армию от присяги своей временной власти. Этой церемонией не вернуть упущенного детства; можно лишь исполнить запоздавшее обещание и отдать правительство в руки Гровера."
 hsm_cyanolisia.42.late.d:0 "Гровер достиг совершеннолетия, так и не получив верховной власти. Теперь Донкло даёт ему корону, охраняемую резиденцию и расписание, утверждённое офицерами. Двор называет церемонию вступлением на престол. Её действительные условия не оставляют сомнений: правительство по-прежнему подчиняется генералу."
 hsm_cyanolisia.43.late.d:0 "Гровер впервые вступает на престол уже взрослым. Донкло кладёт перед ним государственные печати и принимает сделку, которую прежде отвергал: государство должно пережить своего создателя, а офицеры должны служить власти, которую не смогут унаследовать силой. Гровер принимает печати, не обещая сохранить каждый приказ, изданный от его имени."
 hsm_cyanolisia.53.t:0 "Провинции помнят"
 hsm_cyanolisia.53.d:0 "Перед советом Гровера лежат прошения провинций. Их авторы спрашивают, какие обещания сохранили силу после передачи власти.\n\n[Root.GetHSMCyaKaivSettlement]\n\n[Root.GetHSMCyaMidoriaSettlement]\n\n[Root.GetHSMCyaGryphusSettlement]\n\n[Root.GetHSMCyaNorthSettlement]\n[Root.GetHSMCyaLakeSettlement]\n[Root.GetHSMCyaWestSettlement]\n\n[Root.GetHSMCyaEducation] Теперь император должен определить первую задачу своего правления. Воспитание помогает ему сделать выбор, но не предрешает его."
 hsm_cyanolisia.53.a:0 "Подтвердить провинциальные хартии."
 HSM_CYA_petitions_kaiv_charter:0 "Каив ссылается на хартию автономии, оспаривая несогласованный набор. Рада ждёт, что корона обеспечит обещанное ограничение."
 HSM_CYA_petitions_kaiv_officers:0 "Казачьи офицеры Каива спрашивают, сохранятся ли их патенты и местное командование. Их сделка касалась военной службы, а не гражданской хартии."
 HSM_CYA_petitions_kaiv_veto:0 "Рада Каива спрашивает, вправе ли комендант по-прежнему отменять любое местное решение теперь, когда император обещает выслушать провинции."
 HSM_CYA_petitions_kaiv_supervised:0 "Поднадзорная рада Каива прислала осторожное прошение: получат ли её голоса значение помимо одобрения решений гарнизона?"
 HSM_CYA_petitions_kaiv_unsettled:0 "В записях совета нет согласованного устройства Каива. Министерство не вправе отвечать на местные требования выдуманной задним числом хартией."
 HSM_CYA_petitions_midoria_charters:0 "Приходы Мидории защищают сборы и патрули, сохранённые хартиями. Флотская реквизиция впервые подвергла эту гарантию проверке."
 HSM_CYA_petitions_midoria_customs:0 "Портовые делегаты Мидории требуют отчёта от единого таможенного совета. Они уступили льготы, но не право знать, куда ушли сборы."
 HSM_CYA_petitions_midoria_amnesty:0 "Помилованные корсарские экипажи Мидории требуют письменной гарантии: после исполненной службы прежние обвинения не должны открываться заново."
 HSM_CYA_petitions_midoria_requisition:0 "Портовые мастера Мидории предъявляют неоплаченные реквизиционные расписки. Верфи работали при солдатах; теперь короне нужно решить, какие обязательства она признаёт."
 HSM_CYA_petitions_midoria_unsettled:0 "Особые условия для Мидории не закреплены. Её прошение требует соглашения, прежде чем министерство превратит военные порядки в постоянный закон."
 HSM_CYA_petitions_gryphus_company:0 "Грифусская компания требует соблюдать обновлённую хартию. Просители от вольных городов отвечают: торговые привилегии не освобождают её от общих обязательств."
 HSM_CYA_petitions_gryphus_towns:0 "Вольные города Грифуса ссылаются на муниципальные гарантии, полученные вместо привилегированной хартии компании. Они ждут прямого доступа к коронным судам."
 HSM_CYA_petitions_gryphus_audit:0 "Проверенные купцы Грифуса спрашивают, окончательны ли новые начисления. Нельзя планировать торговый сезон при бесконечно временных налоговых требованиях."
 HSM_CYA_petitions_gryphus_order:0 "Орден Опиника спрашивает, у кого теперь находятся охранные досье, изъятые из его капитулов. Присяга Гроверу не уничтожила эти средства давления."
 HSM_CYA_petitions_gryphus_unsettled:0 "Особая хартия Грифуса в записях отсутствует. Совету предстоит отличить принятые обязательства от привилегий, на которые претендуют, но которых никто не предоставлял."
 HSM_CYA_dawnclaw_departed:0 "Донкло покинул Цианолизию"
 HSM_CYA_dawnclaw_escaped_execution:0 "Донкло сбежал после провала переворота"
 HSM_CYA_court_countercoup:0 "От революционной программы отказались в пользу власти графини"
 hsm_cyanolisia.12.orphaned.d:0 "Империи, воспитавшей этих чиновников, больше нет, а Донкло больше не участвует в придворной борьбе. Оставшиеся без покровителя сотрудники прежней административной миссии предлагают опыт и уцелевшие торговые связи в обмен на постоянные должности. Защиты Грифенхейма они обеспечить не могут. Они могут создать кабинет, если графиня согласится на их влияние при назначениях, заключении контрактов и распоряжении казёнными счетами."

 # Regional reconquest and reconstruction
 HSM_CYA_countess_lake_charters:0 "Присяги озёрных домов"
 HSM_CYA_countess_lake_charters_desc:0 "Дома озёрного края привыкли решать свои споры без Грифенхейма. Теперь корона требует общей границы и отказа от частных таможен. О признании власти ещё можно договориться, но вооружённое сопротивление встретит армию раньше, чем имперского судью."
 HSM_CYA_countess_frontier_mandate:0 "Мандат восточных провинций"
 HSM_CYA_countess_frontier_mandate_desc:0 "Восстановленные озёрные пути обеспечивают тыл восточного похода. Грифонский Фронтир не следует путать с Речными землями: у Лонгсворда, Хеллквилла и государств долины Эви свои притязания, споры и дороги к морю. Посланники и командиры могут двинуться по этим дорогам, не дожидаясь устройства Запада."
 HSM_CYA_countess_hill_compacts:0 "Условия для Беоргфордаса"
 HSM_CYA_countess_hill_compacts_desc:0 "Пагорбовые страны нельзя считать придатком Речных земель. Их перевалы, общины и правители требуют отдельных переговоров и отдельного плана похода. Корона добивается подчинения; последующее местное управление останется комиссариатом."
 HSM_CYA_reclaim_the_griffon_frontier:0 "Вернуть грифонский Фронтир"
 HSM_CYA_reclaim_the_griffon_frontier_desc:0 "Озёрное транспортное управление способно снабжать восточную армию. Теперь Донкло может закрепить грифонский Фронтир перед наступлением в земли поней, не дожидаясь переустройства каждой западной провинции. Вслед за продвижением к Грифусу должны восстанавливаться порты и пути снабжения."
 HSM_CYA_countess_northern_assizes:0 "Вновь открыть северные суды"
 HSM_CYA_countess_northern_assizes_desc:0 "Признание Грифенхейма должно значить больше подписей побеждённых правительств. Провинциальные судьи разберут имущественные споры, мастерские вновь откроются, а корона возьмёт на себя содержание дорог. Северные земли смогут войти в обычный порядок имперской интеграции."
 HSM_CYA_northern_garrison_network:0 "Постоянный тыл на Севере"
 HSM_CYA_northern_garrison_network_desc:0 "Армия не может каждую весну заново завоёвывать одни и те же города. Постоянные гарнизоны прикроют восстановленные дороги и возобновивший работу северный арсенал. Гражданское управление вернётся под надзором, а провинции получат доступ к имперской интеграции."
 HSM_CYA_countess_lake_reconstruction:0 "Открыть озёрные дороги"
 HSM_CYA_countess_lake_reconstruction_desc:0 "Озёрные дома подчинились, но прежние заставы всё ещё отделяют хозяйства от рынков. Землемеры восстановят дороги через земли Авианов и Блэкхоллоу. Общая провинциальная администрация заменит соперничающих сборщиков пошлин и подготовит регион к интеграции."
 HSM_CYA_lake_transit_authority:0 "Управление центральных дорог"
 HSM_CYA_lake_transit_authority_desc:0 "Частные пошлины и разбитые дороги теперь задерживают наши обозы. Военные инженеры откроют пути через земли Авианов и Блэкхоллоу, а назначенные чиновники объединят их управление. Центральная Грифония должна стать надёжным тылом, а не набором захваченных застав."
 HSM_CYA_countess_western_reconstruction:0 "Хартии восстановления Запада"
 HSM_CYA_countess_western_reconstruction_desc:0 "Аквелейским мастерским нужны заказы, нефтепромыслам — оборудование и надёжные договоры. Корона восстановит производство, закрепив действительные местные имущественные права. Интеграция Запада пойдёт через работающие учреждения, а не через заявление, будто война сама всё исправила."
 HSM_CYA_western_reconstruction_office:0 "Управление восстановления Запада"
 HSM_CYA_western_reconstruction_office_desc:0 "Захваченные бухгалтерские книги мало стоят рядом с бездействующими станками. Управление восстановления Запада разместит заказы на аквелейских фабриках и возобновит добычу нефти. Местные администрации будут отвечать перед Грифенхеймом по мере включения региона в имперскую систему."
 HSM_CYA_countess_karthin_settlement:0 "Устройство Карфина"
 HSM_CYA_countess_karthin_settlement_desc:0 "После южного похода короне нужны рабочие места и урожаи не меньше, чем послушные чиновники. Мастерские Карфина и торговля каучуком станут основой восстановления. Грифонские провинции войдут в имперскую интеграцию; особое положение Астериона не будет отменено канцелярским распоряжением."
 HSM_CYA_karthin_war_industry:0 "Вернуть мастерские Карфина к работе"
 HSM_CYA_karthin_war_industry_desc:0 "Южные армии принесли территорию, но не действующий арсенал. Мастерские Карфина откроются под военные заказы, поставки каучука будут восстановлены. Грифонские провинции смогут начать интеграцию без распространения этого порядка на минотавров Астериона."
 HSM_CYA_countess_frontier_ports:0 "Грифус и восточные дороги"
 HSM_CYA_countess_frontier_ports_desc:0 "Восточным провинциям нужен путь к рынкам, который не заканчивается армейской заставой. Порт Грифуса будет расширен, дороги через Грифию восстановлены. Эти грифонские земли смогут войти в имперскую интеграцию ещё до решения судьбы лежащих дальше стран поней."
 HSM_CYA_frontier_supply_ports:0 "Восточное побережье снабжения"
 HSM_CYA_frontier_supply_ports_desc:0 "Грифус должен стать действующим портом снабжения, а не подписью на конце стрелки штабной карты. Новые верфи и восстановленные дороги через Грифию обеспечат следующий поход. Грифонский Фронтир войдёт в имперскую интеграцию прежде, чем армия двинется в земли поней."
 HSM_CYA_campaign_north_secured_tt:0 "Исходные территории Севера в Грифонии принадлежат нам или нашим субъектам и находятся под нашим контролем либо контролем наших субъектов."
 HSM_CYA_claim_north_tt:0 "Получить цели войны на аннексию против нынешних независимых владельцев территорий Севера, включая государства, ранее завоевавшие эти земли. Наши субъекты, текущие противники и страны, против которых уже есть цель войны, исключены."
 HSM_CYA_integrate_north_tt:0 "Открыть обычную механику EaW для интеграции исходных грифонских провинций Севера через подчинение. Немедленная национализация не происходит. Астерион и земли поней исключены."
 HSM_CYA_campaign_central_secured_tt:0 "Исходные территории Центральной Грифонии и озёрного края в Грифонии принадлежат нам или нашим субъектам и находятся под нашим контролем либо контролем наших субъектов."
 HSM_CYA_claim_central_tt:0 "Получить цели войны на аннексию против нынешних независимых владельцев территорий Центральной Грифонии и озёрного края, включая государства, ранее завоевавшие эти земли. Наши субъекты, текущие противники и страны, против которых уже есть цель войны, исключены."
 HSM_CYA_integrate_central_tt:0 "Открыть обычную механику EaW для интеграции исходных грифонских провинций Центральной Грифонии и озёрного края через подчинение. Немедленная национализация не происходит. Астерион и земли поней исключены."
 HSM_CYA_campaign_west_secured_tt:0 "Исходные территории Аквелии и западных стран в Грифонии принадлежат нам или нашим субъектам и находятся под нашим контролем либо контролем наших субъектов."
