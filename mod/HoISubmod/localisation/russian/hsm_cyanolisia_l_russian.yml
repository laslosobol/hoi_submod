 HSM_CYA_DIRECTORATE_neutrality_ADJ:0 "Цианолизск"
 HSM_CYA_DIRECTORATE_democratic_ADJ:0 "Цианолизск"
 HSM_CYA_DIRECTORATE_communism_ADJ:0 "Цианолизск"
 hsm_cyanolisia.47.t:0 "Северные штандарты"
 hsm_cyanolisia.47.countess.d:0 "Посланники графини принесли на север хартии с печатью Грифенхейма. Одни дворы торгуются за права своих собраний, другие проверяют, сколько гарнизонов стоит за красивыми словами. Регентство должно оплатить работу переговорщиков и привести их обещания к единому закону."
 hsm_cyanolisia.47.dawnclaw.d:0 "Северные знамена не спешат склоняться перед Грифенхеймом. Донкло рассылает ультиматумы, но его штаб знает: каждая столица потребует отдельного соглашения или отдельной кампании. Военная победа еще не создаст работающую администрацию."
 hsm_cyanolisia.47.a:0 "Открыть канцелярию северных дел."
 hsm_cyanolisia.48.t:0 "На другом берегу"
 hsm_cyanolisia.48.countess.d:0 "За рекой нет пустой клетки на имперской карте. Федерация, местные короны и городские советы говорят от имени собственных жителей. Графиня велит заранее подготовить границы будущих комиссариатов: победа не должна обернуться аннексией каждой деревни."
 hsm_cyanolisia.48.dawnclaw.d:0 "Штаб Донкло прокладывает переправы и линии снабжения. К полевым картам уже приколоты проекты комиссариатов: после похода пони останутся под имперским надзором, но не станут провинциями Грифенхейма."
 hsm_cyanolisia.48.a:0 "Подготовить управление за рекой."
 hsm_cyanolisia.49.t:0 "Граница имперского ядра"
 hsm_cyanolisia.49.d:0 "Восточные грифонские округа можно связать с Грифенхеймом судами, налогами и железной дорогой. Но за рекой поньи советы и вожди холмов не превратятся в имперские провинции от одного росчерка пера. Канцелярия предлагает зависимые комиссариаты: местные чиновники останутся на местах под властью имперского наместника."
 hsm_cyanolisia.49.a:0 "Пусть канцелярия подготовит указы."
 hsm_cyanolisia.50.t:0 "Запад помнит свои короны"
 hsm_cyanolisia.50.countess.d:0 "Аквелийские представители и западные князья выслушали послов регентства порознь. Графиня предлагает каждому двору место в общей системе законов, но ни один договор не отменит старых притязаний. Для этого понадобятся судьи, архивы и терпение."
 hsm_cyanolisia.50.dawnclaw.d:0 "В штабе Донкло запад рисуют стрелками наступления. Аквелия и старые княжества видят в этих картах конец собственных корон. Чтобы удержать их после победы, Грифенхейму понадобятся не только гарнизоны, но и действующие суды."
 hsm_cyanolisia.50.a:0 "Открыть западные архивы."
 hsm_cyanolisia.51.t:0 "Южные договоры"
 hsm_cyanolisia.51.countess.d:0 "Южные короны торгуют через море и не собираются признавать Грифенхейм из одной лишь памяти об императорах. Графиня готовит договоры о портах и пошлинах вместе с планами кампании: империя должна суметь управлять тем, что завоюет."
 hsm_cyanolisia.51.dawnclaw.d:0 "Южный поход не закончится на последней сухопутной границе. Порты, острова и морские пути требуют отдельных гарнизонов и собственного штаба снабжения. Донкло отдает флоту и армии общие приказы перед кампанией."
 hsm_cyanolisia.51.a:0 "Подготовить южный штаб."
 HSM_CYA_reform_field_command:0 "Реформа полевого командования"
 HSM_CYA_reform_field_command_desc:0 "Береговые полки, пограничные гарнизоны и дворцовые офицеры слишком долго подчинялись разным ведомствам. Единое командование установит, чей приказ важнее, когда прозвучит первая тревога."
 HSM_CYA_standardise_field_equipment:0 "Единые стандарты снабжения"
 HSM_CYA_standardise_field_equipment_desc:0 "Каждый полк бережет собственные склады и привычные образцы оружия. Общие стандарты позволят снабжать батальон на севере не только тому интенданту, который когда-то его сформировал."
 HSM_CYA_officer_academy:0 "Цианолизийская офицерская академия"
 HSM_CYA_officer_academy_desc:0 "Опытные унтер-офицеры сядут над картами рядом с сыновьями придворных семейств. Академия не сотрет старые привязанности, но даст им общий язык прежде, чем армия перерастет своих командиров."
 HSM_CYA_frontier_supply_corps:0 "Корпус снабжения фронтира"
 HSM_CYA_frontier_supply_corps_desc:0 "Гарнизон держится столько, сколько проработает дорога за его спиной. Водители, механики и складские писари войдут в один корпус, чтобы командирам не приходилось собирать обоз заново при каждой тревоге."
 HSM_CYA_combined_arms_school:0 "Школа общевойскового боя"
 HSM_CYA_combined_arms_school_desc:0 "Пехота не раз уходила вперед без орудий, пока заводы работали по мирному графику. На учениях полки, батареи и арсеналы впервые спланируют одно и то же сражение."
 HSM_CYA_joint_general_staff:0 "Объединенный генеральный штаб"
 HSM_CYA_joint_general_staff_desc:0 "Комиссии по реформам можно распустить; генеральный штаб должен пережить назначивших его министров. На его картах появятся побережье, дороги Эви и дальний путь к Грифенхейму."
 HSM_CYA_crown_field_staff:0 "Полевой штаб Короны"
 HSM_CYA_crown_field_staff_desc:0 "Графиня не намерена оставлять после себя россыпь личных армий. Офицеры должны служить короне, а не ее дому; приказы будут храниться и при дворе, и в казармах."
 HSM_CYA_dawnclaw_operational_staff:0 "Оперативный штаб Донкло"
 HSM_CYA_dawnclaw_operational_staff_desc:0 "Донкло раскладывает старые имперские карты на цианолизийском столе. Его офицеры учатся мыслить железнодорожными расписаниями, резервами и походами, не заканчивающимися у ближайшей границы."
 HSM_CYA_border_defense_staff:0 "Штаб обороны границы"
 HSM_CYA_border_defense_staff_desc:0 "Марка не победит, копируя наступления великих держав. Ее штаб изучит перевалы, подготовит склады за ними и рассчитает, как меньшей армией заставить захватчика платить за каждую дорогу."
 HSM_CYA_coastal_reconstruction:0 "Восстановить прибрежную экономику"
 HSM_CYA_coastal_reconstruction_desc:0 "У оживленных причалов стоят закрытые мастерские, а молодые рабочие уезжают за заработком. Открыть фабрики вновь - первый способ доказать, что модернизация выйдет за пределы придворных отчетов."
 HSM_CYA_coastal_transport_authority:0 "Управление прибрежного транспорта"
 HSM_CYA_coastal_transport_authority_desc:0 "На одной станции груз простаивает, пока мимо другой идут пустые вагоны. Транспортное ведомство сведет порты, мастерские и пограничные склады в расписание, за которое кому-то придется отвечать."
 HSM_CYA_technical_institute:0 "Цианолизийский технический институт"
 HSM_CYA_technical_institute_desc:0 "Лучшие механики обучают учеников рядом со сломанными станками. Лаборатории, книги и оплачиваемое время для опытов позволят их работе пережить любого министра."
 HSM_CYA_port_foundries:0 "Портовые мастерские"
 HSM_CYA_port_foundries_desc:0 "Порт не может вечно жить на привозных деталях. Литейные и причальные мастерские поддержат флот, а купцам дадут причину вкладываться в те же набережные."
 HSM_CYA_arsenal_network:0 "Сеть арсеналов"
 HSM_CYA_arsenal_network_desc:0 "Один большой арсенал может остановить забастовка, пожар или налет. Сеть малых мастерских с общими стандартами продолжит вооружать армию, даже когда столица не сможет."
 HSM_CYA_national_development_plan:0 "Общегосударственный план развития"
 HSM_CYA_national_development_plan_desc:0 "Железнодорожники, учителя и фабриканты просят денег так, словно остальные не существуют. Общий план заставит их ответить на один вопрос: какую страну они строят?"
 HSM_CYA_crown_credit_authority:0 "Кредитное управление Короны"
 HSM_CYA_crown_credit_authority_desc:0 "Графиня просит старые семьи дать взаймы будущей короне, а не только собственным имениям. Их деньги поднимут города и цеха; двору предстоит следить, чтобы кредиторы не прибрали их к рукам."
 HSM_CYA_dawnclaw_procurement_office:0 "Закупочное ведомство Донкло"
 HSM_CYA_dawnclaw_procurement_office_desc:0 "Донкло помнит, какие фирмы снабжали Грифенхейм и какие директора примут тайный заказ. Единое закупочное ведомство превратит эти связи в винтовки, машины и обязательства."
 HSM_CYA_frontier_development_board:0 "Совет развития фронтира"
 HSM_CYA_frontier_development_board_desc:0 "Землемеры знают деревни, которые генералы обозначают на картах пустым местом. Собственный совет и бюджет позволят строить дороги и склады для тех, кому предстоит поддерживать их в порядке."
 HSM_CYA_southern_fleet_yards:0 "Верфи Южного флота"
 HSM_CYA_southern_fleet_yards_desc:0 "Старые стапели заняты ржавыми корпусами, а морякам месяцами не платили жалованье. Возвращение верфей даст южному берегу корабли, которые он способен чинить сам, а не флот на бумаге."
 HSM_CYA_coastal_patrols:0 "Прибрежные патрули"
 HSM_CYA_coastal_patrols_desc:0 "Контрабандисты и чужие разведчики знают бухты лучше Адмиралтейства. Регулярные патрули превратят берег из линии на штабной карте в воды, за которыми флот действительно наблюдает."
 HSM_CYA_naval_air_school:0 "Школа морской авиации"
 HSM_CYA_naval_air_school_desc:0 "Кораблей не хватит на каждую милю между портами. Летчики, обученные вместе с капитанами, заметят конвои, налетчиков и шторм раньше, чем запоздалые донесения дойдут до Адмиралтейства."
 HSM_CYA_dockyard_program:0 "Программа судостроения"
 HSM_CYA_dockyard_program_desc:0 "Строительство рывками оставляет опытных рабочих без дела между заказами. Постоянные контракты и новые стапели сделают судостроение ремеслом, которое порт передаст следующему поколению."
 HSM_CYA_raise_austernfischer:0 "Поднять «Аустернфишер»"
 HSM_CYA_raise_austernfischer_desc:0 "«Аустернфишер» столько лет пролежал в гавани, что старые моряки рассказывают о нем как легенду. Поднять его будет непросто, но экипаж, увидевший корабль снова на плаву, поверит в будущее флота."
 HSM_CYA_seaborne_corps:0 "Морской десантный корпус"
 HSM_CYA_seaborne_corps_desc:0 "Исход высадки решается до того, как первая шлюпка коснется берега. Морпехи должны тренироваться с экипажами, которые их везут, и уметь держаться, пока снабжение остается в море."
 HSM_CYA_admiralty_compact:0 "Соглашение Адмиралтейства"
 HSM_CYA_admiralty_compact_desc:0 "Капитаны, летчики и береговые командиры годами защищали каждый свой бюджет. Соглашение даст им общий план и заставит отвечать не только за собственные потери."
 HSM_CYA_imperial_supply_grid:0 "Имперская сеть снабжения"
 HSM_CYA_imperial_supply_grid_desc:0 "Склады Грифенхейма и южные дороги строились для враждующих государств. Свести их расписания менее славно, чем взять столицу, но без этого армия не уйдет далеко за ее пределы."
 HSM_CYA_griffonian_armament_standard:0 "Грифонский стандарт вооружения"
 HSM_CYA_griffonian_armament_standard_desc:0 "В захваченных складах лежит оружие разных армий и разных правителей. Общий стандарт позволит провинциям снабжать единые войска, не закрывая мастерские, привыкшие делать нужные детали."
 HSM_CYA_quartermaster_service:0 "Интендантская служба"
 HSM_CYA_quartermaster_service_desc:0 "Грузовик без единственной детали не поможет марширующему полку. Интенданты станут считать топливо, ремонт и запасные колеса столь же внимательно, как офицеры считают винтовки."
 HSM_CYA_railway_battalions:0 "Железнодорожные батальоны"
 HSM_CYA_railway_battalions_desc:0 "Пути у границы чинят после каждого кризиса и забывают после каждого мира. Постоянные железнодорожные батальоны сохранят линию открытой еще до того, как она понадобится армии."
 HSM_CYA_signal_companies:0 "Роты связи"
 HSM_CYA_signal_companies_desc:0 "Обрыв провода может оставить батальон в сражении за вчерашний день. Роты связи проведут приказы сквозь непогоду и бездорожье, научившись понимать, когда молчание важнее скорости."
 HSM_CYA_field_hospitals:0 "Полевые госпитали"
 HSM_CYA_field_hospitals_desc:0 "Раненые слишком часто терялись между передовой и ближайшим городом. Медики, повозки и ясные пути эвакуации дадут солдатам причину доверять армии, которая послала их в бой."
 HSM_CYA_frontier_artillery:0 "Пограничная артиллерия"
 HSM_CYA_frontier_artillery_desc:0 "Пограничные полки не всегда могут ждать орудий, одолженных столицей. Собственные батареи изучат перевалы и займут позиции до появления первой вражеской колонны."
 HSM_CYA_engineer_brigades:0 "Инженерные бригады"
 HSM_CYA_engineer_brigades_desc:0 "Те же руки, что возводят оборонительную стену, должны уметь ее преодолеть. Саперные бригады освоят мосты, подрывы и терпеливый труд, без которого фронт не удержать."
 HSM_CYA_aerial_reconnaissance:0 "Воздушная разведка"
 HSM_CYA_aerial_reconnaissance_desc:0 "Карты прошлой войны не покажут новых дорог и вражеских лагерей. Летчики с передовых аэродромов доставят снимки и донесения прежде, чем штаб двинет резервы."
 HSM_CYA_motorised_reserves:0 "Моторизованный резерв"
 HSM_CYA_motorised_reserves_desc:0 "Континентальная армия не может просить каждый кризис подождать пешую пехоту. Механики и водители создадут резерв, способный быстро перейти от одной опасной железной дороги к другой."
 HSM_CYA_crown_military_colleges:0 "Военные училища короны"
 HSM_CYA_crown_military_colleges_desc:0 "Графине нужны офицеры, которые сохранят верность и после конца ее регентства, что бы ни случилось с Гровером. Их патенты носят ее печать, но присяга связывает их с короной, а не с ее домом."
 HSM_CYA_dawnclaw_war_college:0 "Военная академия Донкло"
 HSM_CYA_dawnclaw_war_college_desc:0 "Донкло не нужны офицеры, умеющие лишь восхищаться его победами. Ему нужен штаб, который снабдит три похода, скроет четвертый и не остановится в его отсутствие."
 HSM_CYA_imperial_officer_exchange:0 "Обмен имперскими офицерами"
 HSM_CYA_imperial_officer_exchange_desc:0 "Бывшие враги приезжают с разными уставами и памятью об одной войне. Переводы между частями заставят их понять чужой строй прежде, чем они вместе возглавят провинциальные войска."
 HSM_CYA_continental_ordnance:0 "Вооружение континента"
 HSM_CYA_continental_ordnance_desc:0 "Арсеналы старой столицы когда-то вооружали империю; завоевание наполнило их несовместимыми запасами. Переоснастим цеха и введем единый стандарт для армий, все еще идущих через Грифонию."
 HSM_CYA_port_customs_houses:0 "Таможенные и грузовые конторы"
 HSM_CYA_port_customs_houses_desc:0 "Грузы исчезают между портовыми книгами и внутренними складами. Таможенники и экспедиторы сведут отчеты, превратив недостающие пошлины в заработок для новых мастерских."
 HSM_CYA_coastal_quarries:0 "Южные каменоломни"
 HSM_CYA_coastal_quarries_desc:0 "Каменоломни глубинки дают сырье, но руду увозят без обработки. Землемеры и металлурги оставят часть этой работы южным городам, откуда начинаются дороги к морю."
 HSM_CYA_electrify_the_workshops:0 "Электрификация мастерских"
 HSM_CYA_electrify_the_workshops_desc:0 "Старые мастерские закрываются с закатом даже при полной книге заказов. Надежное электричество и обученные электрики позволят станочникам жить по расписанию работы, а не солнца."
 HSM_CYA_apprenticeship_halls:0 "Ремесленные училища"
 HSM_CYA_apprenticeship_halls_desc:0 "Фабрика может ввезти станки, но не умение распознать их неисправность. Ремесленные училища сведут опытных мастеров с молодежью прежде, чем новый рост оставит цеха без специалистов."
 HSM_CYA_rural_cooperatives:0 "Сельские кооперативы"
 HSM_CYA_rural_cooperatives_desc:0 "Деревню просят кормить города и ждать, пока богатство вернется само. Кооперативы дадут селам инструменты, кредит и долю в промышленности, выросшей из их труда."
 HSM_CYA_industrial_standards_board:0 "Комитет промышленных стандартов"
 HSM_CYA_industrial_standards_board_desc:0 "Детали одного завода не подходят к машинам другого. Инспекторы, инженеры и хозяева договорятся об общих мерах прежде, чем армия и железные дороги вновь заплатят за их разногласия."
 HSM_CYA_crown_municipal_loans:0 "Муниципальные займы короны"
 HSM_CYA_crown_municipal_loans_desc:0 "Городские советы знают, какие мосты и цеха им нужны, но не могут занять деньги на условиях графини. Гарантии короны дадут им строить, привязав счета к будущему регентству."
 HSM_CYA_dawnclaw_factory_contracts:0 "Заводские контракты Донкло"
 HSM_CYA_dawnclaw_factory_contracts_desc:0 "Контракты Донкло обещают постоянные заказы тем, кто откроет книги для проверки. Арсеналы получат уверенность в завтрашнем дне, а директора узнают политическую цену сорванной поставки."
 HSM_CYA_griffenheim_rail_hub:0 "Грифенхеймский железнодорожный узел"
 HSM_CYA_griffenheim_rail_hub_desc:0 "Пути в Грифенхейм прокладывали для столицы, которой подчинялся юг. Соединение их с цианолизийскими линиями поставит старую географию на службу новой власти."
 HSM_CYA_herzland_industrial_survey:0 "Промышленная перепись Герцланда"
 HSM_CYA_herzland_industrial_survey_desc:0 "Оккупационные офицеры умеют захватить фабрику, но не знают, работает ли ее печь. Инженеры опишут шахты, цеха и разбитые линии прежде, чем столица пообещает невозможный выпуск."
 HSM_CYA_evi_freight_corridor:0 "Грузовой коридор Эви"
 HSM_CYA_evi_freight_corridor_desc:0 "Дороги Эви служили армиям чаще, чем обычной торговле. Надежный коридор из Грифенхейма даст долине товары, не дожидаясь нового похода ради починки мостов."
 HSM_CYA_imperial_research_exchange:0 "Имперский научный обмен"
 HSM_CYA_imperial_research_exchange_desc:0 "Инженеры Цианолизии работали при нехватке средств, ученые Герцланда - под старым имперским покровительством. Пусть их институты обменяются трудами и проверят то, что прежде отвергали."
 HSM_CYA_convoy_escorts:0 "Охрана конвоев"
 HSM_CYA_convoy_escorts_desc:0 "Капитаны торговых судов не могут прокладывать курс по слухам о налетчиках. Расписание эскортов, карты и надежная заправка сохранят морские пути даже во время войны."
 HSM_CYA_naval_signals_school:0 "Школа флотской связи"
 HSM_CYA_naval_signals_school_desc:0 "Предупреждение, дошедшее до одного корабля, но не до эскадры, может погубить весь конвой. Связисты научатся передавать приказы сквозь шторм и привычки упрямых капитанов."
 HSM_CYA_seaplane_stations:0 "Базы гидросамолётов"
 HSM_CYA_seaplane_stations_desc:0 "Флоту нужны глаза за пределами гавани. Летчики гидросамолетов и береговые наблюдатели заметят движение у побережья до того, как о нем сообщит пропавшее судно."
 HSM_CYA_marine_training_ground:0 "Учебный лагерь морской пехоты"
 HSM_CYA_marine_training_ground_desc:0 "Первый десант не способен взять с собой всю армию. Морпехи будут учиться удерживать причал и дорогу, пока транспорты не вернутся за подкреплением."
 HSM_CYA_coastal_defence_batteries:0 "Батареи береговой обороны"
 HSM_CYA_coastal_defence_batteries_desc:0 "Порт можно взять не только с моря: дороги за его спиной столь же уязвимы. Батареи и внутренние укрепления сделают захват гавани дорогим с любого направления."
 HSM_CYA_bluewater_shipyards:0 "Верфи открытого моря"
 HSM_CYA_bluewater_shipyards_desc:0 "Патрульного флота хватит для охраны берега, но не для дальнего похода. Большие стапели и долгие заказы позволят строить корабли, способные оставаться в море месяцами."
 HSM_CYA_imperial_convoy_authority:0 "Имперское управление конвоями"
 HSM_CYA_imperial_convoy_authority_desc:0 "Новые провинции приносят порты с собственными хозяевами и несовместимыми расписаниями. Имперское управление подчинит их общему плану, не делая вид, будто море стало безопасным."
 HSM_CYA_expeditionary_fleet:0 "Экспедиционный флот"
 HSM_CYA_expeditionary_fleet_desc:0 "Южных корон и дальних островов не достичь указом из Грифенхейма. Флот дальнего плавания перевезет армию, прикроет ее возвращение и сохранит связь с землями после победы."
