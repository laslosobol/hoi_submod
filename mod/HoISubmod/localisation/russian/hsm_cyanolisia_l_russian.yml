 HSM_CYA_DIRECTORATE_neutrality_ADJ:0 "Цианолизск"
 HSM_CYA_DIRECTORATE_democratic_ADJ:0 "Цианолизск"
 HSM_CYA_DIRECTORATE_communism_ADJ:0 "Цианолизск"
 hsm_cyanolisia.47.t:0 "Северные штандарты"
 hsm_cyanolisia.47.countess.d:0 "Посланники графини принесли на север хартии с печатью Гриффенхейма. Одни дворы торгуются за права своих собраний, другие проверяют, сколько гарнизонов стоит за красивыми словами. Регентство должно оплатить работу переговорщиков и привести их обещания к единому закону."
 hsm_cyanolisia.47.dawnclaw.d:0 "Северные знамена не спешат склоняться перед Гриффенхеймом. Донкло рассылает ультиматумы, но его штаб знает: каждая столица потребует отдельного соглашения или отдельной кампании. Военная победа еще не создаст работающую администрацию."
 hsm_cyanolisia.47.a:0 "Открыть канцелярию северных дел."
 hsm_cyanolisia.48.t:0 "На другом берегу"
 hsm_cyanolisia.48.countess.d:0 "За рекой нет пустой клетки на имперской карте. Федерация, местные короны и городские советы говорят от имени собственных жителей. Графиня велит заранее подготовить границы будущих комиссариатов: победа не должна обернуться аннексией каждой деревни."
 hsm_cyanolisia.48.dawnclaw.d:0 "Штаб Донкло прокладывает переправы и линии снабжения. К полевым картам уже приколоты проекты комиссариатов: после похода пони останутся под имперским надзором, но не станут провинциями Гриффенхейма."
 hsm_cyanolisia.48.a:0 "Подготовить управление за рекой."
 hsm_cyanolisia.49.t:0 "Граница имперского ядра"
 hsm_cyanolisia.49.d:0 "Восточные грифонские округа связаны с Гриффенхеймом. Для земель Речных и пагорбовых пони имперская канцелярия предлагает иную форму власти: штатные решения о создании комиссариатов теперь позволят передать им управление вместо интеграции этих земель."
 hsm_cyanolisia.49.a:0 "Пусть канцелярия подготовит указы."
 hsm_cyanolisia.50.t:0 "Запад помнит свои короны"
 hsm_cyanolisia.50.countess.d:0 "Аквелийские представители и западные князья выслушали послов регентства порознь. Графиня предлагает каждому двору место в общей системе законов, но ни один договор не отменит старых притязаний. Для этого понадобятся судьи, архивы и терпение."
 hsm_cyanolisia.50.dawnclaw.d:0 "В штабе Донкло запад рисуют стрелками наступления. Аквелия и старые княжества видят в этих картах конец собственных корон. Чтобы удержать их после победы, Гриффенхейму понадобятся не только гарнизоны, но и действующие суды."
 hsm_cyanolisia.50.a:0 "Открыть западные архивы."
 hsm_cyanolisia.51.t:0 "Южные договоры"
 hsm_cyanolisia.51.countess.d:0 "Южные короны торгуют через море и не собираются признавать Гриффенхейм из одной лишь памяти об императорах. Графиня готовит договоры о портах и пошлинах вместе с планами кампании: империя должна суметь управлять тем, что завоюет."
 hsm_cyanolisia.51.dawnclaw.d:0 "Южный поход не закончится на последней сухопутной границе. Порты, острова и морские пути требуют отдельных гарнизонов и собственного штаба снабжения. Донкло отдает флоту и армии общие приказы перед кампанией."
 hsm_cyanolisia.51.a:0 "Подготовить южный штаб."
