 HSM_CYA_industrial_program_dynamic_modifier:0 "Цианолизийская промышленная программа"
 HSM_CYA_industrial_program_dynamic_modifier_desc:0 "Портовые инвесторы, провинциальные мастерские и государственные инженеры работают в рамках общей программы. Её учреждения обеспечивают работу заводов, дорог и системы заказов при Марке, имперском кабинете или дворах, стремящихся вновь объединить Грифонию."
 HSM_CYA_industrial_program_dynamic_modifier_dummy_idea:0 "Цианолизийская промышленная программа"
 HSM_CYA_military_program_dynamic_modifier:0 "Цианолизийская военная программа"
 HSM_CYA_military_program_dynamic_modifier_desc:0 "Штабные школы, реестры резервистов и службы снабжения придают армии общий порядок. Политический выбор определяет, будут ли эти учреждения защищать региональное устройство или обеспечивать более широкую кампанию."
 HSM_CYA_military_program_dynamic_modifier_dummy_idea:0 "Цианолизийская военная программа"
 HSM_CYA_imperial_legitimacy_dynamic_modifier:0 "Имперская легитимность"
 HSM_CYA_imperial_legitimacy_dynamic_modifier_desc:0 "Власть короны опирается на действующие суды, соблюдение соглашений и непрерывность государственной службы. Сначала ей нужно заслужить доверие провинций: ни титул, ни имперская печать, ни владение столицей сами по себе не обеспечивают повиновения."
 HSM_CYA_imperial_legitimacy_dynamic_modifier_dummy_idea:0 "Имперская легитимность"
 HSM_CYA_exiled_imperial_strategist:0 "Имперский стратег в изгнании"
 HSM_CYA_military_state_builder:0 "Архитектор военного государства"
 HSM_CYA_military_state_builder_desc:0 "Донкло переносит привычки генерального штаба в управление страной: мобилизационные графики, согласованное снабжение и тщательную подготовку операций. Успех своей администрации он измеряет армией, которую она способна содержать на фронте."
 HSM_CYA_otto_wagenfels:0 "Отто Вагенфельс"
 HSM_CYA_otto_wagenfels_desc:0 "Вагенфельс получил назначение, наладив перевозки между прибрежными складами и пограничными гарнизонами. По его убеждению, надёжное расписание и оборудованная ремонтная мастерская сберегают больше техники, чем очередной призыв к самопожертвованию."
 HSM_CYA_marta_eisenfeder:0 "Марта Айзенфедер"
 HSM_CYA_marta_eisenfeder_desc:0 "Начав карьеру в прибрежных машиностроительных мастерских, Айзенфедер добивается от арсеналов общих допусков, взаимозаменяемых деталей и согласованных заказов. Её цель: производство, которое можно расширять, не перестраивая заново под каждый контракт."
 HSM_CYA_klara_morgenflug:0 "Клара Моргенфлуг"
 HSM_CYA_klara_morgenflug_desc:0 "Моргенфлуг представляет инструкторов и наземные экипажи в гражданской администрации. Она требует постоянного финансирования обучения и расследования аварий: воздушную службу нельзя построить на одних показательных выступлениях."
 HSM_CYA_transport_commissioner:0 "Уполномоченный по военным перевозкам"
 HSM_CYA_armament_coordinator:0 "Организатор оружейного производства"
 HSM_CYA_aviation_organiser:0 "Организатор авиационной подготовки"
 HSM_CYA_all_evi_territory_owned_tt:0 "Владеть всеми историческими землями долины Эви"
 HSM_CYA_all_asterion_territory_owned_tt:0 "Владеть всеми историческими землями Астериона"
 HSM_CYA_all_sicameon_territory_owned_tt:0 "Владеть всеми историческими землями Сикамеона"
 HSM_CYA_imperial_administration_diplomacy:0 "Имперская администрация"
 HSM_CYA_imperial_administration_diplomacy_desc:0 "Временный кабинет может искать защиты Грифенхейма, если наши государства стали соседями."
 HSM_CYA_enter_griffonian_imperial_alliance:0 "Вступить в альянс Грифонской империи"
 HSM_CYA_enter_griffonian_imperial_alliance_desc:0 "Принять место во фракции Империи, пока ее граница соприкасается с нашей."
 HSM_CYA_countess_union_mandate:0 "Мандат на единую Грифонию"
 HSM_CYA_countess_union_mandate_desc:0 "Взятие Грифенхейма исполнило лишь первую часть обещания Тэйллоу. Провинциальным судам, железнодорожникам и армии предстоит более трудная задача: связать разделенный континент с имперской короной. Этот мандат принадлежит государству и сохранится после передачи власти Гроверу."
 HSM_CYA_countess_northern_charters:0 "Призвать северные правительства"
 HSM_CYA_countess_northern_charters_desc:0 "Северные республики, кланы и герцогства не исчезнут оттого, что в Грифенхейме сменилось правительство. Посланники потребуют признать имперскую власть; генеральный штаб подготовится к отказу. Переустройство местных судов и казначейств начнётся уже после похода."
 HSM_CYA_countess_western_concord:0 "Предъявить Западу условия"
 HSM_CYA_countess_western_concord_desc:0 "Притязания Аквелии и независимость западных торговых городов не исчезнут после восстановления дворца. Графиня предъявит их правительствам условия короны, подкрепив слова посланников армией. Портовые доходы и нефтяные концессии станут предметом послевоенного устройства, а не обещаний до победы."
 HSM_CYA_countess_southern_compacts:0 "Короны Юга"
 HSM_CYA_countess_southern_compacts_desc:0 "Восстановив управление западными провинциями, правительство может обратиться к Вингбардии и её соседям, не дожидаясь завершения северного урегулирования. Южные дворы должны войти в имперское устройство, не разрушая уже принятых решений о Сикамеоне и Астерионе."
 HSM_CYA_countess_river_missions:0 "Условия для Речных земель"
 HSM_CYA_countess_river_missions_desc:0 "Восточные порты и провинциальные дороги обеспечили нашим миссиям надёжный тыл. Речным землям предстоит ответить, признают ли они верховенство Империи. Даже после военной победы эти земли поней будут управляться через комиссариаты, а не превращены в обычные грифонские провинции."
 HSM_CYA_countess_continental_rail_board:0 "Континентальное железнодорожное управление"
 HSM_CYA_countess_continental_rail_board_desc:0 "Новые мастерские Грифенхейма согласуют железные дороги и грузовые перевозки для дальних провинций регентства."
 HSM_CYA_countess_regency_general_staff:0 "Генштаб регентства"
 HSM_CYA_countess_regency_general_staff_desc:0 "Офицеры графини собирают региональные части в одну снабжаемую армию для имперского урегулирования."
 HSM_CYA_countess_western_circuits:0 "Связать восстановленные провинции"
 HSM_CYA_countess_western_circuits_desc:0 "Северные суды, озёрные дороги и западная промышленность теперь служат одному правительству. Железнодорожное управление и генеральный штаб смогут связать их в общий тыл. Южные и восточные походы начнутся, не оставляя позади три разобщённые оккупационные зоны."
 HSM_CYA_countess_eastern_circuits:0 "Восточные комиссариаты"
 HSM_CYA_countess_eastern_circuits_desc:0 "Интеграция грифонских провинций заканчивается там, где начинаются страны поней. В Речных землях и Беоргфордасе корона воспользуется имперским порядком создания комиссариатов. Их правительства могут быть подчинены без объявления всех жителей грифонскими подданными одним указом."
 HSM_CYA_one_griffonia_under_the_crown:0 "Одна Грифония для короны"
 HSM_CYA_one_griffonia_under_the_crown_desc:0 "От берега, приютившего изгнанника, до судов западной Грифонии провинции теперь отвечают одной столице. Замысел регентства Тэйллоу воплотился в континентальную державу. Уже правит Гровер, еще ожидает короны или потерян для Империи, завоевание не делает эту корону собственностью графини."
 HSM_CYA_grover_first_council:0 "Первый совет Гровера"
 HSM_CYA_grover_first_council_desc:0 "Власть уже передана; теперь Гроверу предстоит ею воспользоваться. На первом провинциальном совете он требует от министров обнародовать обязательства, принятые при Тэйллоу, и отвечать на прошения от его имени. Она присутствует как бывшая хранительница короны, без права регентского вето."
 HSM_CYA_grover_imperial_academies:0 "Вновь открыть имперские академии"
 HSM_CYA_grover_imperial_academies_desc:0 "Новый император направляет средства университетам и офицерским школам вместо очередного круга придворных назначений."
 HSM_CYA_countess_memorial_regency:0 "Регентство без Гровера"
 HSM_CYA_countess_memorial_regency_desc:0 "Гровер погиб от чужой руки. Графиня сохранит созданные для него учреждения, но не назовет себя императрицей."
 HSM_CYA_countess_succession_council:0 "Совет имперского престолонаследия"
 HSM_CYA_countess_succession_council_desc:0 "Делегаты провинций и юристы поддерживают единую державу, пока не решен вопрос законного наследования."
 HSM_CYA_grover_lost_to_others:0 "Гровер погиб от чужой руки"
 HSM_CYA_grover_lost_to_others_desc:0 "Наследник уже мертв. Донкло получит механизмы пустого трона, не приписывая себе его убийство."
 HSM_CYA_memorial_imperial_council:0 "Имперский поминальный совет"
 HSM_CYA_memorial_imperial_council_desc:0 "Старым лоялистам предлагают место в правительстве, не превращая имя погибшего императора в повод для новых расправ."
 HSM_CYA_heirless_provincial_compact:0 "Провинциальное соглашение о междуцарствии"
 HSM_CYA_heirless_provincial_compact_desc:0 "Провинции признают временное междуцарствие, а не новое наследственное право графини или армии. Их делегаты и имперские правоведы рассмотрят кандидатуры преемников и закрепят условия признания. До законного соглашения совет сможет собирать налоги и содержать армию, но не распоряжаться короной как своей собственностью."
 hsm_cyanolisia.40.adult.d:0 "Гровер VI уже носил корону; новая церемония, изображающая его подопечным, оскорбила бы и его, и провинции, помнящие его правление. Перед двором в Грифенхейме Тэйллоу отдает ему государственные печати и освобождает армию от присяги регентству. Одни делегаты аплодируют. Другие ждут первого приказа, который будет принадлежать только Гроверу."
 hsm_cyanolisia.42.adult.d:0 "Когда-то Гровер VI правил, не спрашивая позволения Донкло. В Грифенхейме его встречают с почестями императора и распорядком узника. Двор называет это возвращением на престол; офицеры, утверждающие каждую аудиенцию, знают цену этому слову."
 hsm_cyanolisia.43.adult.d:0 "Гровер VI уже правил и понимает вес печатей, которые Донкло возвращает ему. Армия и суды остаются, но их чиновникам теперь придется отвечать перед императором, а не прежним покровителем. Церемония заканчивается; настоящая передача власти начинается на первом заседании кабинета."
 hsm_cyanolisia.45.t:0 "Унаследованный пустой трон"
 hsm_cyanolisia.45.d:0 "Гровер VI погиб вне досягаемости Донкло. Офицеры требуют непрерывности командования, провинциальные делегаты — законного основания для повиновения. Временный совет будет управлять державой, пока правоведы рассматривают кандидатуры и добиваются признания преемника провинциями. Это междуцарствие, а не доказательство существования безымянного родственника и не наследование династии генералом."
 hsm_cyanolisia.45.a:0 "Пусть совет удержит страну."
 hsm_cyanolisia.46.t:0 "Графиня хранит доверенную корону"
 hsm_cyanolisia.46.d:0 "Тэйллоу готовила империю для Гровера и дожила до известия, что он никогда ее не получит. Провинциальные послы ждут, что она возьмет корону; графиня оставляет ее нетронутой. Совет будет править в память о Гровере и искать законного преемника, пока Тэйллоу удерживает державу от распада."
 hsm_cyanolisia.46.a:0 "Наш долг не умер вместе с наследником."
 HSM_CYA_DIRECTORATE:0 "Цианолизский директорат"
 HSM_CYA_DIRECTORATE_DEF:0 "Цианолизский директорат"
 HSM_CYA_DIRECTORATE_ADJ:0 "Цианолизск"
 HSM_CYA_DIRECTORATE_fascism:0 "Цианолизский директорат"
 HSM_CYA_DIRECTORATE_neutrality:0 "Цианолизский директорат"
