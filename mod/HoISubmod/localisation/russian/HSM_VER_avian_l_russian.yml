l_russian:
 HSM_AVI_two_legible_copies:0 "Два понятных экземпляра"
 HSM_AVI_two_legible_copies_desc:0 "Соглашение мало помогает, если читатели по-разному понимают свои обязанности. Профессиональное бюро переводов обеспечит надёжные общие записи и доступность технических знаний ценой постоянной административной нагрузки. Назначенные на местах писари смогут опираться на знакомые голоса и сложившиеся связи. Ни одно решение не устранит всех культурных противоречий Авиана, но общие дела получат более понятный язык."
 HSM_AVI_hear_the_towns:0 "У городов есть свои вопросы"
 HSM_AVI_hear_the_towns_desc:0 "Повестка конгресса может дать место каждому дому, оставив города за дверью. Пригласим перевозчиков, представителей мастерских и местные власти рассказать, где сотрудничество изменило бы их рабочий день. Прошения помогут улучшить строительные методы и выявить обещания, за которые ещё не назначено ответственного учреждения. Мир должен приносить пользу за пределами приёмной."
 HSM_AVI_common_accounts:0 "Взносы по согласию"
 HSM_AVI_common_accounts_desc:0 "Казначей Авиана начертил три столбца, но пока лишь одно правительство может поручиться за суммы в первом. Катрина отправит Эри и Эйри проект счетов и спросит, какой вклад готов внести каждый дом. Общим дорогам и мастерским нужны надёжные средства: любезный ответ не оплатит поставку, а пустое место для подписи не станет долгом."
 HSM_AVI_roads_between_houses:0 "Работа между владениями"
 HSM_AVI_roads_between_houses_desc:0 "Дорога через границу объединяет разные спецификации, ремонтные ведомости и поставщиков в одном деле. Поручим техническим службам хартии разобраться с различиями и дадим инженерам Авиана возможность улучшить промышленные методы. Согласование сделает будущие стройки полезнее, не наделяя наши учреждения правом распоряжаться работами на чужой земле."
 HSM_AVI_limited_joint_staff:0 "Штаб с согласованными пределами"
 HSM_AVI_limited_joint_staff_desc:0 "Общий штаб должен знать, что офицеры могут согласовать сами, а что требует нового политического решения. Разовьём совместное планирование, улучшим обеспечение и дадим офицерам Авиана опыт работы с коллегами. Такая подготовка сама по себе не создаёт военного союза и не передаёт другие армии под наше командование."
 HSM_AVI_a_court_for_hosts:0 "Принимающая сторона перед судом"
 HSM_AVI_a_court_for_hosts_desc:0 "Устройство конгресса не освобождает Авиан от согласованных на нём правил. Катрина признает юрисдикцию общего суда в переданных ему вопросах, включая споры с собственной администрацией. Надёжные записи и связь помогут учреждениям работать. Их полномочия должны распространяться и на канцелярию, предоставляющую зал заседаний."
 HSM_AVI_the_first_common_budget:0 "Бюджет согласно подписям"
 HSM_AVI_the_first_common_budget_desc:0 "Казначею предстоит превратить ответы домов в программу, которую он сможет оплатить. Одни работы, возможно, придётся отложить; другие начнутся с меньшим числом участников. Катрина велит прочитать подписанные обязательства рядом со сметами. Доверие к хартии теперь зависит от счёта, который не скрывает отказов и не тратит никем не обещанных взносов."
 HSM_AVI_the_unauthorised_levy:0 "Сбор без разрешения"
 HSM_AVI_the_unauthorised_levy_desc:0 "Чрезвычайный циркуляр требует древесину, изделия из металла и транспорт сверх согласованных взносов домов. Там, где поставщики ожидали законное основание, его автор поставил печать конгресса. Катрине предстоит ответить за ведомство, действующее от её имени. Если хозяин конгресса вправе расширять обязательства всякий раз, когда пустеют склады, каждая подпись под хартией становится обещанием на чужих условиях."
 HSM_AVI_honour_the_exemptions:0 "Соблюдать освобождение от сборов"
 HSM_AVI_honour_the_exemptions_desc:0 "Поставщикам, рассчитывавшим на освобождение от сборов, нужно больше, чем исправленный циркуляр. Пусть строительные ведомства Авиана предложат заказы, для выполнения которых не придётся отбирать материалы, обещанные другим покупателям. Поддержим гражданскую промышленность и совершенствование строительных методов, обеспечив принятые обязательства собственными средствами. Мастерская должна планировать следующий сезон, не гадая, не заберёт ли принимающая сторона всё произведённое."
 HSM_AVI_common_workshops:0 "Мастерские могут строить планы"
 HSM_AVI_common_workshops_desc:0 "Надёжные заказы позволяют мастерским обмениваться методами, не гадая, изымут ли следующую партию как чрезвычайный взнос. Соберём инженеров и производственных специалистов для улучшения промышленных технологий. Исследования укрепят способность Авиана сотрудничать через практические знания и предсказуемую гражданскую работу."
 HSM_AVI_open_minutes:0 "Протоколы за пределами зала"
 HSM_AVI_neighbours_without_a_chair:0 "Соседи без общего председателя"
 HSM_AVI_neighbours_without_a_chair_desc:0 "Переговоры о хартии не создали общего управления, приемлемого для всех. Сохраним достигнутую дружбу и направим собранные на встречах практические знания на строительство. Катрина может оставаться посредницей между независимыми соседями, не считая отказ неблагодарностью. Новый конгресс ещё возможен; миру не требуется его дожидаться."

 HSM_AVI_translation_office:0 "Общее бюро переводов"
 HSM_AVI_translation_office_desc:0 "Профессиональные переводчики поддерживают согласованные версии общих записей и технических документов. Работа укрепляет доверие к администрации и ускоряет исследования, но постоянные нужды бюро требуют политических усилий. Его полномочия касаются совместных дел, а не разрешения всех языковых и культурных споров Авиана."
 HSM_AVI_local_clerks:0 "Писари, назначенные городами"
 HSM_AVI_local_clerks_desc:0 "Общие дела объясняют и записывают местные писари, знакомые своим общинам. Их связи укрепляют стабильность и облегчают организацию политической поддержки. Они обеспечивают практическое общение, пока более широкие культурные разногласия Авиана остаются предметом дальнейшей работы."
 HSM_AVI_common_budget:0 "Согласованный бюджетный протокол"
 HSM_AVI_common_budget_desc:0 "Присоединившиеся казначейства приняли общий порядок учёта. Согласованная работа ускоряет строительство инфраструктуры и рост эффективности производства ценой политических затрат участников. Авиану нужна хотя бы одна действительная подпись партнёра; другие дома получают преимущества только с собственного согласия. Протокол зависит от сохранённой хартии трёх домов при Катрине. Оккупация приостанавливает преимущества. Война между домами, смена Катрины у власти, Второй Зимний Бал или переход к коммунистическому, лоялистскому либо фашистскому правлению аннулирует подписи."
 HSM_AVI_exceptional_levy:0 "Неразрешённый чрезвычайный сбор"
 HSM_AVI_exceptional_levy_desc:0 "Катрина позволила администрации изымать припасы сверх согласованных обязанностей. Это увеличивает военный выпуск, но подрывает стабильность и повышает потребность в гражданских товарах. Все преимущества хартии, включая общий бюджет, приостановлены. Авиан должен отменить исключение; для возвращения общих преимуществ также необходимо устранить любые неурегулированные нарушения Эри и Эйри."

 HSM_AVI_congress_business:0 "Обязанности принимающей стороны"
 HSM_AVI_congress_business_desc:0 "Приёмные опустели, но в канцелярию конгресса всё ещё приходят спорные счета, неподписанные проекты и письма с вопросами о данных обещаниях. Писари Катрины должны хранить эти бумаги вместе с ответами. Обязанности хозяйки конгресса продолжаются и после отъезда гостей, особенно там, где её собственные чиновники предпочли бы закрыть дело."
 HSM_AVI_reconvene_charter:0 "Возобновить переговоры о хартии"
 HSM_AVI_reconvene_charter_desc:0 "После прошлого заседания делегаты оставили свои поправки. Катрина предложит вернуться к спорным статьям, предоставив обязательства самого Авиана такому же разбору. Зал и кресло дают хозяину место на переговорах, но не готовый ответ на их вопросы."
 HSM_AVI_reaffirm_membership:0 "Пересмотреть участие Авиана"
 HSM_AVI_reaffirm_membership_desc:0 "Вернёмся в качестве наблюдателя и вновь рассмотрим собственное согласие Авиана на хартию. Прежняя нерешительность не обязана определять каждый будущий ответ. Членство остаётся осознанным решением, а обязанности окончательного текста должны быть доступны для изучения."
 HSM_AVI_reopen_budget:0 "Вернуться к несогласованным бюджетным статьям"
 HSM_AVI_reopen_budget_desc:0 "Казначейство сохранило неподписанные проекты бюджета рядом с более скромными счетами, которые может оплатить. Новому предложению придётся ответить на действительные возражения Эри и Эйри. Прежние взносы остаются принятыми обязательствами; Катрине предстоит убедить сомневающиеся казначейства, что под новым начинанием стоит поставить подпись."
 HSM_AVI_withdraw_levy:0 "Отменить неразрешённый сбор"
 HSM_AVI_withdraw_levy_desc:0 "У поставщиков всё ещё лежит циркуляр с печатью Авиана. Его отмена потребует отозвать уже разосланные требования и объяснить собственным чиновникам, почему срочность не дала им права на запасы другого дома. Катрина вернёт спорные счета к согласованным условиям и предложит общим ведомствам судить хозяйку конгресса по той же мере, что и гостей."

 HSM_AVI_construction_bonus:0 "Строительство за пределами зала конгресса"
 HSM_AVI_industry_bonus:0 "Обмен производственными методами"
 HSM_AVI_support_bonus:0 "Обеспечение в пределах полномочий"
 HSM_AVI_electronics_bonus:0 "Надёжные записи и связь"
 HSM_AVI_engineers_bonus:0 "Инженерное дело для общей обороны"
 HSM_AVI_charter_offer_tt:0 "Помогает начать переговоры о хартии через действующее обсуждение Эри и Эйри. Оба дома должны согласовать условия. Авиан ратифицирует отдельно; содействие само по себе не даёт членства или власти над другим домом."
 HSM_AVI_budget_offer_tt:0 "Авиан вносит свой вклад и приглашает §YЭри и Эйри по отдельности§! присоединиться к бюджетному протоколу. Каждый может потратить §Y35 политической власти§! на принятие либо отказаться без наказания. Преимущества получают лишь согласившиеся партнёры; Авиану нужна хотя бы одна действительная подпись соседа. Отказы и истёкшие предложения не препятствуют продолжению кампании."
 HSM_AVI_levy_case_tt:0 "Катрина должна решить, соблюдать ли согласованные пределы взносов. Соблюдение стоит §Y75 политической власти§!. Защита сбора даёт §Y100 политической власти§! и дух §Y«Неразрешённый чрезвычайный сбор»§!, но §Rприостанавливает все преимущества хартии, включая общий бюджет§!. Исправление нарушения Авиана не устраняет отдельные исключения Эри или Эйри."

 hsm_ver_avian.2.t:0 "Одно обязательство разными словами"
 hsm_ver_avian.2.d:0 "Оба экземпляра совпадали в количестве леса. Они расходились в том, что означала его поставка. Один писарь употребил слово, обычно обозначавшее добровольный взнос; другой выбрал привычное название повинности. Оба уверяли, что читатель из его округа прекрасно всё поймёт.\n\nКатрина спросила, чьё толкование возьмёт верх, когда поставщик откажется. Наступившая тишина объяснила затруднение лучше, чем очередное рассуждение о грамматике.\n\nПрофессиональное бюро переводов могло бы поддерживать согласованные тексты, включая технические документы, которыми собирались обмениваться дома. Его учреждение потребовало бы политических усилий, а работа нуждалась бы в постоянном внимании. У местных писарей было иное преимущество: они знали, кого расспросить и как распоряжение услышат дома. Ни один вариант не мог устранить культурных противоречий Авиана. Но можно было хотя бы добиться, чтобы обещание не меняло смысла по дороге к тем, кому предстояло его исполнять."
 hsm_ver_avian.2.a:0 "Учредить профессиональное бюро переводов."
 hsm_ver_avian.2.b:0 "Пусть города назначат знакомых им писарей."
 hsm_ver_avian.3.t:0 "У дороги два конца"
 hsm_ver_avian.3.d:0 "Перевозчик развернул схему дороги на столе для прошений. На одном её конце строительное ведомство отметило отремонтированный подъезд. На другом мост по-прежнему ограничивал вес гружёной повозки. Успешный отчёт одного округа заставлял его дважды перегружать один и тот же товар.\n\nСледом представитель мастерской показал заказы, требования к которым менялись на границе. У местных чиновников нашлись другие примеры. Никто не просил Катрину решить вопрос о наследовании Верении. Они хотели знать, какое учреждение ответит на вопрос, выходящий за административные границы.\n\nПосле приёма она оставила схему у себя. Инженеры получат её вместе с прошением, а не только с рассказом о благодарности выслушанных горожан. Сотрудничество должно соединять настоящие пути и настоящую работу. Дорога, аккуратно проведённая до края собственной ответственности, всё ещё могла заканчиваться совсем не там, где нужно."
 hsm_ver_avian.3.a:0 "Пусть инженеры рассмотрят весь путь."
 hsm_ver_avian.4.t:0 "Прошение против принимающей стороны"
 hsm_ver_avian.4.d:0 "Поставщик принёс жалобу на канцелярию конгресса в Авиане. Согласованная поставка состоялась, но при регистрации документов появился дополнительный сбор. Принимавший прошение писарь предложил сначала решить дело с принимающей стороной частным порядком, избавив общий суд от неловкого начала.\n\nКатрина спросила, окажут ли такую же любезность тому, кто пожалуется на Эри или Эйри. Писарь начал объяснять особые обязанности хозяев конгресса, затем остановился.\n\nЮрисдикция суда распространялась на дела, которые дома ему доверили. В этих делах бумаги с печатью Авиана не могли давать неприкосновенности. Катрина велела передать прошение вместе с объяснением канцелярии и первоначальным соглашением. Она не указывала судьям, какое решение вынести. Поставщику предстояло доказать необоснованность сбора; её администрации предстояло защищать его не перед тем же чиновником, который этот сбор назначил."
 hsm_ver_avian.4.a:0 "Принимающая сторона отвечает по тем же правилам."

 hsm_ver_avian.10.t:0 "Графы, которые мы можем заполнить"
 hsm_ver_avian.10.both.d:0 "Казначей зачитал взносы по порядку: Авиан, Эри, Эйри. Оба приглашённых дома приняли протокол. Теперь их представители задавали вопросы, возникающие после подписания: когда будут разосланы счета, как отделят спорные расходы и кто вправе согласовать пересмотр.\n\nКатрина ожидала, что после достижения согласия заседание станет проще. Вместо этого у каждой суммы появился кто-то, имеющий право её проверить. Общее дело получило больше средств и более надёжные методы работы, но его устроителям придётся расстаться с удобной привычкой объяснять расходы лишь самим себе.\n\nКазначей предложил перенести небольшое расхождение на следующий квартал, округлив текущую сумму. Писарь Эйри попросил оставить разницу видимой. Представитель Эри поддержал просьбу. Катрина велела сохранить строку. Подписались все три дома; ни один не соглашался, что мелкое неудобство недостойно внимания тех, кому предстоит платить."
 hsm_ver_avian.10.one.d:0 "Казначей подготовил три графы. Согласованные взносы были лишь в двух: собственный взнос Авиана и взнос одного соседнего дома. Другая делегация оставалась участницей хартии, не присоединяясь к бюджетному протоколу. Её ответ был достаточно ясным, чтобы занести его в запись.\n\nОдин чиновник предложил назвать результат первым единогласным распределением, а отсутствующий взнос считать отсроченным. Катрина спросила, обещал ли кто-нибудь действительно внести его позднее. Никто не обещал. Она велела изменить заголовок и убрать предложенную сумму из итога.\n\nБолее скромная программа всё ещё давала участникам полезную совместную работу и возможность обмениваться методами. Она также требовала выбрать, что им по средствам. Отказавшийся представитель слушал, не получая счёта за чужие решения. Катрина надеялась со временем расширить соглашение. Пока ей предстояло честно показать, почему стоило рассмотреть даже его ограниченный вариант."
 hsm_ver_avian.10.d:0 "Предложенные взносы Эри и Эйри остались вне утверждённой суммы. Ни один соседний дом не присоединился к бюджетному протоколу. Подготовка Авиана дала набор расчётов, но не общее финансирование, на которое мог бы положиться его казначей.\n\nОдин советник предположил, что расходы на устройство переговоров дают Катрине основания взыскать что-нибудь с гостей. Она попросила найти такое обязательство в хартии. Он вернулся к проекту бюджета, где оно по-прежнему оставалось предложением.\n\nСуд, общие службы и работа, уже разрешённая хартией, имели собственные основания. От них не требовалось отказываться из-за неудачи следующего соглашения. Катрина поручила казначею сохранить отклонённые условия и подготовить более скромный внутренний план. Её племянники не обещали выполнять каждую просьбу. Признание их отказа законным сделает следующее приглашение убедительнее, чем попытка представить его неоплаченным счётом."
 hsm_ver_avian.10.a:0 "Записать только действительно принятые обязательства."

 hsm_ver_avian.20.t:0 "Авиан предлагает бюджетный протокол"
 hsm_ver_avian.20.d:0 "Авиан представил протокол общих счетов и взносов. Наша казна может присоединиться, затратив политическое влияние ради согласованной работы над инфраструктурой и промышленными методами, либо отказаться, сохранив место в хартии. В сопроводительной записке Катрина просит ответить на перечисленные обязательства. Наша подпись разрешит именно их, а не даст принимающей стороне неограниченного права на наши доходы."
 hsm_ver_avian.20.a:0 "Принять протокол и обеспечить наш взнос."
 hsm_ver_avian.20.b:0 "Остаться в хартии, не присоединяясь к бюджету."
 hsm_ver_avian.21.t:0 "Казначейство ответило"
 hsm_ver_avian.21.d:0 "Ответ на бюджетное предложение поступил в канцелярию Катрины. Секретарь кладёт его рядом с приглашением и отмечает соответствующую запись в счетах. Ответ может сократить программу так же легко, как расширить её. Следующая смета должна отражать достигнутое согласие, оставляя независимость другого дома неприкосновенной там, где заканчивается общее дело."
 hsm_ver_avian.21.a:0 "Пусть счета отражают полученный ответ."
 hsm_ver_avian.29.t:0 "Срок бюджетного предложения истёк"
 hsm_ver_avian.29.d:0 "Срок ответа на бюджетное предложение Авиана прошёл без нашей подписи. Казначейство подшивает приглашение к несогласованным делам. Одного молчания недостаточно, чтобы взыскать с нас взнос. Прежние обязанности по хартии сохраняются, а новое предложение можно будет рассмотреть на его собственных условиях, когда оно действительно поступит на обсуждение."
 hsm_ver_avian.29.a:0 "Отметить, что бюджетных обязательств мы не приняли."

 hsm_ver_avian.30.t:0 "Недостающее полномочие"
 hsm_ver_avian.30.d:0 "Чрезвычайный циркуляр перечислял лес, металлические изделия и перевозки, которые следовало предоставить без оплаты. Его составитель приложил печать конгресса и убедительное описание неотложных нужд. Соглашения, разрешающего эти требования, он не приложил.\n\nПисарь казначейства сравнил перечень с принятыми домами взносами. Несколько позиций выходили за их пределы. Поставщикам, строившим планы с учётом освобождения от сборов, сообщали, что общая необходимость отменяет это освобождение. Ответственный чиновник уверял, что Катрина сможет уладить бумаги, когда склады уже наполнятся.\n\nОна понимала соблазн. Изъятие сразу укрепит её администрацию и обеспечит военное производство припасами. Отказ означал разочаровать чиновников, уже обещавших результат, и потратить влияние на сдерживание собственной канцелярии. Защита сбора означала поставить удобство принимающей стороны выше хартии. Тогда каждое общее учреждение лишится уверенности, на которой держалась его работа, включая любые действительно согласованные бюджетные обязательства."
 hsm_ver_avian.30.a:0 "Соблюсти пределы. Отозвать неразрешённые требования."
 hsm_ver_avian.30.b:0 "Защитить чрезвычайный сбор вопреки согласованным пределам."
 hsm_ver_avian.31.t:0 "Принимающая сторона отвечает за сбор"
 hsm_ver_avian.31.d:0 "Администрация Авиана теперь связана согласованными пределами взносов. Наша казна получила подтверждение, что чрезвычайные требования не могут оставаться в силе. Принимающая сторона признала: общая необходимость сама по себе не даёт права взыскивать средства. Это разрешает часть спора, касающуюся Авиана, но не оправдывает отдельного нарушения, которое продолжает поддерживать другой дом."
 hsm_ver_avian.31.breach.d:0 "Катрина защитила чрезвычайный сбор, хотя соглашения о его требованиях не существует. Казначейство велело писарям удержать спорные взносы, а общие ведомства остановили работы, которые больше не могут обещать обеспечить. Печать Авиана не заменяет согласия, которого мы не давали. В ответе мы требуем от хозяйки конгресса отозвать исключение и соблюдать хартию наравне с другими связанными ею домами."
 hsm_ver_avian.31.a:0 "Хранить решение вместе с согласованными обязательствами."
 hsm_ver_avian.32.t:0 "Циркуляр отозван"
 hsm_ver_avian.32.d:0 "Катрина велела отозвать циркуляр о сборе, указав рядом с отменой первоначальную дату и основание его выпуска. Один чиновник предложил более аккуратную версию: дополнительные требования в ней представлялись ошибкой, замеченной прежде, чем она успела приобрести значение. Она спросила, узнают ли в таком изложении свой опыт поставщики, получившие требования.\n\nНовое распоряжение отменяло чрезвычайное изъятие и обязывало ведомства работать в пределах действительно принятых обязательств. Тем, кто рассчитывал на более широкие требования, придётся пересмотреть планы. Политическую цену этого сообщения Катрина брала на себя.\n\nЕё исправление могло устранить нарушение Авиана, но не простить исключения, сохраняющегося в Эри или Эйри. Каждое правительство по-прежнему отвечало за собственное поведение. Писарь, готовивший отправку, сохранил оба варианта циркуляра. Когда поставщик спросит, почему требование изменилось, администрации придётся дать тот ответ, который она внесла в запись."
 hsm_ver_avian.32.a:0 "Разослать отмену всем получателям первоначального циркуляра."
 hsm_ver_avian.41.t:0 "Протоколы покидают зал"
 hsm_ver_avian.41.d:0 "В опубликованные протоколы вошли предложенный сбор, возражения и отказ Катрины расширять согласованные взносы. Читавший их вслух писарь дошёл до спорного слова и остановился. Поставщик спросил, совпадает ли его смысл в другом экземпляре записи.\n\nПисари, отвечавшие за общие дела, объяснили, кто подготовил каждый текст и как можно потребовать исправления. Теперь выбранный порядок должен был работать перед теми, кому он служил. Знакомые голоса и тщательные формулировки значили мало, если ответ менялся после неудобного вопроса.\n\nКатрина слушала, пока поставщик сравнивал отрывок со своим освобождением от сборов. Решение о сборе его устраивало, а не связанная с ним задержка вызывала недовольство. Оба замечания вошли в запись встречи. Она хотела, чтобы публичный отчёт укрепил доверие. Это произойдёт лишь тогда, когда читатель сможет найти в нём место и для своего возражения."
 hsm_ver_avian.41.breach.d:0 "Опубликованные протоколы содержали три документа: предложение о сборе, решение Катрины защитить его и последующую отмену. Один советник предложил зачитать только исправленное распоряжение. Писарь, отвечавший за второй экземпляр, спросил, как тогда объяснить прежнее требование, всё ещё приколотое над столом поставщика.\n\nКатрина велела прочитать все три. Языковой порядок общих дел предстояло проверить на способности понятно изложить неудобную последовательность событий. Каждая версия должна была одинаково объяснять, кто разрешил изъятие и почему оно больше не действует.\n\nПоставщик спросил, какому распоряжению ему следовало подчиняться в промежутке. Ответ не мог устранить уже причинённых неудобств. Но он мог назвать ответственного и определить, что учреждения должны делать теперь. Катрина оставила этот разговор в протоколе. Признание, прозвучавшее лишь внутри совещательного зала, едва ли даст тем, кто остался за дверями, основания доверять исправлению."
 hsm_ver_avian.41.a:0 "Опубликовать отчёт вместе с возражениями."
 hsm_ver_avian.51.t:0 "Приглашения остаются в ящике"
 hsm_ver_avian.51.d:0 "Секретарь принёс Катрине бумаги о хартии, которая связала бы все три дома. Необходимого согласия они не принесли. Она попросила отделить уже принятые обязанности от тех, что ещё ожидали согласия. Первая стопка оказалась меньше, чем она надеялась, но не была пустой.\n\nДружба Эри и Эйри сохранялась. Авиан мог оставить собственное правительство, поддерживать отношения и применять дома строительные знания, собранные на переговорах. Ничто из этого не требовало представлять несостоявшееся конституционное предложение долгом перед принимающей стороной.\n\nКатрина оставила приглашения в ящике. Новая встреча могла состояться, если дома смогут прийти, не услышав, что их прежний ответ ничего не значит. Пока она отправила указания о работе, которую Авиан мог выполнить самостоятельно. Мир дал региону возможность выбирать. Общее председательство было одним из вариантов и должно было остаться именно выбором."
 hsm_ver_avian.51.a:0 "Соблюдать мир и оставить место для нового ответа."

