l_russian:
 HSM_VER_EVT_AVI_ack_tt:0 "Подтверждает получение доклада. Дополнительных последствий нет."
 HSM_VER_EVT_AVI_translation_tt:0 "Пока конституционная кампания продолжается и языковой вопрос не решён: -50 политической власти. Бюро переводов: +6% к стабильности, +3% к скорости исследований, -0.10 политической власти в день. Закрывает языковой вопрос."
 HSM_VER_EVT_AVI_clerks_tt:0 "Пока конституционная кампания продолжается и языковой вопрос не решён: местные писари дают +3% к стабильности и +8% к приросту политической власти. Закрывает языковой вопрос без затрат политической власти."
 HSM_VER_EVT_AVI_review_tt:0 "При действующей хартии трёх домов и завершённых ответах на бюджет фиксирует его рассмотрение и открывает фокус о спорном сборе. Новых участников и дополнительных бюджетных бонусов не даёт."
 HSM_VER_EVT_AVI_budget_accept_tt:0 "Присоединяется к общему бюджету. Пока соглашение действует, наш дом и Авиан получают:"
 HSM_VER_EVT_AVI_budget_decline_tt:0 "Пока предложение и хартия трёх домов действуют, отклоняет общий бюджет без затрат политической власти. Ваш дом не получает бюджетный дух; участие в хартии сохраняется. Авиан получит ответ через 1 день."
 HSM_VER_EVT_AVI_levy_settle_tt:0 "Урегулирует спор о сборе и позволяет продолжить конституционные преобразования."
 HSM_VER_EVT_AVI_levy_defy_tt:0 "Заявляет исключительное право на сбор и приостанавливает хартию трёх домов и общий бюджет до урегулирования нарушения."
 HSM_VER_EVT_AVI_convention_ack_tt:0 "Подтверждает завершённое урегулирование. Учредительное собрание уже доступно; этот ответ не даёт дополнительных эффектов."
 HSM_VER_EVT_AVI_border_tt:0 "Пока запрос о помощи открыт, выбирает охрану границы и закрывает этот выбор помощи. Без затрат политической власти, военных бонусов и влияния на борьбу в Авиане."
 HSM_VER_EVT_AVI_medics_tt:0 "Пока запрос о помощи открыт: -25 политической власти. Авиан получает полевые госпитали на 120 дней: +10% к восстановлению организации армии и +10% к возвращению потерь в строй. Уже действующий дух не продлевается. Не влияет на победителя."
 HSM_VER_EVT_AVI_loyalist_aid_tt:0 "Пока запрос о помощи открыт: -40 политической власти; +1 очко лоялистам в борьбе за власть. Поддержка позволяет им победить при равенстве наивысших результатов, но не гарантирует победу. Закрывает этот выбор помощи."
 HSM_VER_EVT_AVI_aid_report_tt:0 "Фиксирует доклад о прежней помощи Эри и Эйри. Помощь уже оказала своё действие; подтверждение доклада не даёт нового бонуса."
 HSM_VER_EVT_AVI_compact_available_tt:0 "Независимые Эри/Эйри и Авиан находятся в мире и не капитулировали; в Авиане установилось правительство вне чрезвычайного положения. У вашего дома более 34 политической власти; он не выбрал военный путь, не имеет соглашения, ожидающего ответа или 90-дневного запрета на повтор."
 HSM_VER_EVT_AVI_compact_offer_tt:0 "Предлагает Авиану гражданский транзит. Авиан может согласиться или отказать; согласие учреждает пакт о ненападении и транзитное соглашение."
 HSM_VER_EVT_AVI_compact_accept_tt:0 "Подписывает пакт о ненападении и прекращает пограничное дежурство отправителя. Пока соглашение действует, обе страны получают:"
 HSM_VER_EVT_AVI_compact_refuse_tt:0 "Если предложение ещё действует при этом правительстве, отклоняет его и уведомляет отправителя через 1 день. Дух транзита и пакт о ненападении не предоставляются; потраченные отправителем 35 политической власти не возвращаются."
 HSM_VER_EVT_AVI_no_compact_tt:0 "Фиксирует ответ без предложения соглашения о гражданском транзите. Без затрат политической власти и дополнительных бонусов."
 HSM_VER_EVT_AVI_elections_welcome_tt:0 "Фиксирует поддержку местных выборов в Авиане; она будет отражена в последующем докладе о транзите при лоялистах. Правитель, правящая партия и автономия не меняются; немедленных бонусов к показателям нет."
 HSM_VER_EVT_AVI_elections_reserve_tt:0 "Принимает к сведению местные выборы в Авиане без их одобрения. Правитель, правящая партия и автономия не меняются; немедленных бонусов к показателям нет."
 HSM_VER_EVT_AVI_crown_tt:0 "Если коронация ещё ожидается и Трубах удерживает Герцланд в мирное время: провозглашает его императором и даёт +7% к стабильности. Императорская канцелярия даёт ещё +5% к стабильности и +5% к приросту политической власти, пока коронованное правительство удерживает Грифенхейм."
 HSM_VER_EVT_AVI_crown_defer_tt:0 "Если Трубах ещё не коронован, откладывает коронацию как минимум на 60 дней. Новая церемония по-прежнему требует мира и контроля над Герцландом. Сейчас не даёт стабильности за коронацию или бонусов канцелярии."
 HSM_VER_EVT_AVI_policy_autonomous_tt:0 "Пока коронованное правительство действует и политика не выбрана, выбирает автономные соглашения для будущих приглашений династическим коронам. Каждая корона должна согласиться отдельно; сейчас соглашения не заключаются и автономия подданных не меняется."
 HSM_VER_EVT_AVI_policy_central_tt:0 "Пока коронованное правительство действует и политика не выбрана, выбирает общие министерства для будущих приглашений. Каждая династическая корона сможет согласиться, запросить автономные условия или отказать; сейчас соглашения не заключаются."
 HSM_VER_EVT_AVI_grover_ack_tt:0 "Принимает к сведению доклад о Гровере VI. Не перемещает его, не меняет опеку над ним или его положение."
 HSM_VER_EVT_AVI_works_tt:0 "Пока коронованное правительство Трубаха действует и вложения не выбраны: 1 фабрика и 1 ячейка в своей полностью контролируемой области со свободным местом, плюс один бонус 100% к строительным исследованиям. Без подходящей области вместо фабрики даётся второй бонус 100% к строительным исследованиям."
 HSM_VER_EVT_AVI_railways_tt:0 "Пока коронованное правительство Трубаха действует и вложения не выбраны: ведомство перевозок даёт -10% к потреблению снабжения и +15% к строительству инфраструктуры. Закрывает выбор вложений; дух сохраняется, пока его имперское правительство у власти."
 HSM_VER_EVT_AVI_professional_tt:0 "Пока коронованное правительство действует и порядок сбора войск не выбран: +30 опыта армии. Профессиональный состав даёт +8% к организации армии, +10% к скорости планирования и -4% к стабильности, пока имперское правительство Трубаха у власти."
 HSM_VER_EVT_AVI_limited_tt:0 "Пока коронованное правительство действует и порядок сбора войск не выбран: один бонус 100% к исследованию технологий обеспечения. Ограниченные ротации дают -10% к потреблению снабжения и -10% ко времени подготовки, пока имперское правительство Трубаха у власти."
 HSM_VER_EVT_AVI_central_offer_tt:0 "Верения предложила общие министерства."
 HSM_VER_EVT_AVI_autonomous_offer_tt:0 "Верения предложила автономные условия."
 HSM_VER_EVT_AVI_central_sign_tt:0 "Ратифицирует общие министерства. Вассальный статус сохраняется; соглашение должно оставаться действительным."
 HSM_VER_EVT_AVI_autonomous_sign_tt:0 "Ратифицирует автономные условия. Вассальный статус сохраняется; соглашение должно оставаться действительным."
 HSM_VER_EVT_AVI_counter_offer_tt:0 "Пока предложение общих министерств действует, запрашивает автономные условия. Верения получит встречное предложение через 1 день и должна согласиться в течение 30 дней. Пока нет соглашения, духа, исследовательского бонуса или изменения автономии."
 HSM_VER_EVT_AVI_dynastic_refuse_tt:0 "Пока династическое предложение действует, отклоняет его и уведомляет Верению через 1 день. Соглашения и бонусов нет; положение подданного не меняется. Новое приглашение возможно после истечения 90-дневного срока с исходного предложения."
 HSM_VER_EVT_AVI_counter_accept_tt:0 "Принимает автономные условия короны. Её вассальный статус сохраняется; соглашение должно оставаться действительным."
 HSM_VER_EVT_AVI_counter_refuse_tt:0 "Пока встречное предложение короны действует, закрывает его без соглашения и бонусов. Положение подданного не меняется; сохраняется исходный 90-дневный запрет на повторное приглашение."
 HSM_VER_EVT_AVI_faction_available_tt:0 "Исходное союзное правительство Авиана сохраняется вне кризисного, нейтрального и фондового путей и возглавляет альянс. Ваша страна независима, не воюет с Авианом и не состоит в другом альянсе."
 HSM_VER_EVT_AVI_faction_join_tt:0 "Если эти условия сохраняются, вступает в альянс Авиана и отправляет согласие. Независимость вашей страны сохраняется."
 HSM_VER_EVT_AVI_faction_refuse_tt:0 "Отклоняет приглашение в альянс и уведомляет Авиан. Стоимость: 200 политической власти, если ваша страна не подписала мирный договор или хартию; для подписантов отказ бесплатен."
 HSM_VER_EVT_AVI_integration_defer_tt:0 "Не даёт согласия на интеграцию и сохраняет независимость без затрат политической власти. Сохраняется 90-дневный запрет на повторное приглашение."
 HSM_VER_EVT_AVI_integration_accept_tt:0 "Если интеграция ещё допустима и согласие не дано ранее: +25 политической власти; принимает синие цвета Авиана и даёт согласие на 45 дней стать его интегрированной марионеткой. Авиан получит событие подтверждения; зависимость вводится только при подтверждении и сохранении условий."
 HSM_VER_EVT_AVI_integration_refuse_tt:0 "Если предложение интеграции ещё допустимо: -250 политической власти; отзывает согласие и отправляет отказ Авиану. Ваша страна остаётся независимой."
 HSM_VER_EVT_AVI_equal_available_tt:0 "Ваша страна подписала мирный договор или хартию."
 HSM_VER_EVT_AVI_equal_keep_tt:0 "Отзывает согласие на вассализацию и сохраняет независимость в равноправном союзе. Без затрат политической власти; сохраняется 90-дневный запрет на повторное приглашение."
 HSM_VER_EVT_AVI_integration_confirm_tt:0 "При действующем согласии, независимости обеих стран, отсутствии капитуляции, мире отправителя с Авианом, отсутствии у него другого альянса и сохранении союзного правительства Авиана: отправитель становится интегрированной марионеткой Авиана и получает +25 к мнению об Авиане; Авиан получает 50 политической власти. Согласие погашается даже при невыполнении условий."
 HSM_VER_EVT_AVI_battles_tt:0 "Назначает битву за радиостанцию через 14 дней, если она ещё не назначена. Этот ответ не определяет победителя."
 HSM_VER_EVT_AVI_military_victory_tt:0 "Трубах сменяет Катрину. Независимые дома отвечают на его требования отдельно. Авиан покидает хартию; общие бюджеты прекращаются. Пустой Интергигантес распускается."
 HSM_VER_EVT_AVI_loyalist_victory_tt:0 "Восстанавливает нейтральное правление, открывает ветку лоялистов и отправляет Трубаха в отставку. Авиан выходит из хартии и теряет её преимущества; все общие бюджеты прекращаются. Доклад о помощи через 14 дней; подходящие правительства Эри/Эйри получат обращение через 1 день."
 HSM_VER_EVT_AVI_technocrat_victory_tt:0 "Редтейл становится победоносным революционером; Катрина и Трубах уходят. Независимые дома отвечают отдельно. Авиан покидает хартию; общие бюджеты прекращаются, пустой Интергигантес распускается."
 HSM_VER_EVT_AVI_loyalist_wins_tt:0 "Лоялисты опережают обоих соперников либо делят наивысший результат после поддержки Эри или Эйри во время кризиса."
 HSM_VER_EVT_AVI_loyalist_result_tt:0 "Событие победы лоялистов последует через 4 часа."
