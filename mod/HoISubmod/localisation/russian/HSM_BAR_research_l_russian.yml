l_russian:
 HSM_BAR_research_clinic_eligible_tt:0 "Требуются действующая кампания Баррада, открытый институт, путь Коллегии и отсутствие капитуляции. Эта программа ещё не должна быть завершена."
 HSM_BAR_research_clinic_trials_open_tt:0 "Клинические испытания не приостановлены. Во время приостановки по-прежнему можно утверждать результаты завершённых исследований."
 HSM_BAR_research_grid_eligible_tt:0 "Требуются действующая кампания Баррада, открытый институт, путь Коллегии и отсутствие капитуляции; завершённый проект «Клиническая тауматургия». Эта программа ещё не должна быть завершена."
 HSM_BAR_research_wards_eligible_tt:0 "Требуются действующий Баррад, открытый институт и отсутствие капитуляции. Служба должна сначала изучить Живой камень, подземный ответ и эхо в шахте; программа Коллегии сохраняет свои условия. Эта программа ещё не должна быть завершена."
 HSM_BAR_research_containment_eligible_tt:0 "Требуются действующая Служба, открытый институт, отсутствие капитуляции и завершённая «Защита от ментального подчинения»; изучены Живой камень, подземный ответ и эхо в шахте. Эта программа ещё не должна быть завершена."
 HSM_BAR_research_forensics_eligible_tt:0 "Требуются действующая Служба, открытый институт, разрешение полевых исследований, отсутствие капитуляции и завершённое «Многоуровневое сдерживание аномалий». Изучены Живой камень, подземный ответ, эхо в шахте, механизмы Титана и причина ошибки компаса. Эта программа ещё не должна быть завершена."
 HSM_BAR_research_suppression_eligible_tt:0 "Требуются действующая Служба, открытый институт, разрешение полевых исследований и лаборатории подавления, отсутствие капитуляции, завершённая «Экспертиза остаточной магии»; нормализация без сосуществования. Изучены Живой камень, подземный ответ, эхо в шахте, механизмы Титана, причина ошибки компаса и амулет Яношика. Эта программа ещё не должна быть завершена."
 HSM_BAR_research_category:0 "Магический институт Баррада"
 HSM_BAR_research_category_desc:0 "Публичный институт Коллегии развивает медицину и гражданскую инфраструктуру. На пути Директората скрытые объекты служат тайной организации, которая управляет Баррадом через гражданское правительство, не знающее о её существовании. С Gotterdammerung исследования идут на существующем магическом объекте. Без дополнения оплаченная лабораторная программа занимает одну гражданскую фабрику и завершается тем же рассмотрением проекта. Завершённые результаты можно утвердить после перерыва."
 HSM_BAR_research_scientist_tt:0 "Нанять нового учёного с навыком магической специализации 2. Учёный и два магических прорыва предоставляются однократно."
 HSM_BAR_research_institute_tt:0 "Открыть технологию магического учреждения EaW. С Gotterdammerung построить одно учреждение в подходящем собственном регионе под полным контролем, по возможности в столице. Проект защиты от ментального подчинения не требует очков прорыва и доступен после назначения учёного. Если подходящего региона нет, верните его под контроль и восстановите институт решением."
 HSM_BAR_research_suspend:0 "Сохранить результаты до восстановления полномочий."
 HSM_BAR_research_restore_facility:0 "Восстановить магическое учреждение"
 HSM_BAR_research_restore_facility_desc:0 "Восстановить утраченный институт в подходящем регионе. Работы стоят 35 единиц политической власти, занимают одну гражданскую фабрику на 60 дней и не повторяют первоначальное предоставление учёного и прорывов."
 HSM_BAR_research_clinic:0 "Клиническая тауматургия"
 HSM_BAR_research_clinic_desc:0 "Отделить диагностику от эксперимента. Клиники Баррада испытают воспроизводимый протокол лечения и определят, кто распоряжается магией пациента."
 HSM_BAR_research_clinic_choice:0 "Чьё согласие?"
 HSM_BAR_research_clinic_choice_desc:0 "Первые испытания позволяют заживлять раны, не истощая пациента. Врачи требуют независимых свидетелей и права отказаться от процедуры; чрезвычайный комитет предлагает ускоренный приём больных. Оба протокола работают в лаборатории. Только один станет стандартом института."
 HSM_BAR_research_clinic_bonus:0 "Клиническая тауматургия: прикладные исследования"
 HSM_BAR_research_clinic_fallback:0 "Финансировать: Клиническая тауматургия"
 HSM_BAR_research_clinic_fallback_desc:0 "Отделить диагностику от эксперимента. Клиники Баррада испытают воспроизводимый протокол лечения и определят, кто распоряжается магией пациента.\n\nЛабораторная программа на 120 дней стоит 60 единиц политической власти и занимает одну гражданскую фабрику. Одновременно может идти лишь одна резервная программа. При публикации оплачивается отдельная стоимость внедрения выбранного прототипа. Потеря условий доступа отменяет программу без выдачи результатов."
 HSM_BAR_research_clinic_resume:0 "Утвердить: Клиническая тауматургия"
 HSM_BAR_research_clinic_resume_desc:0 "Рассмотреть уже завершённую программу, результаты которой ожидают разрешения или выбора проекта. Решение не выполняет исследование и не отменяет стоимость внедрения выбранного варианта."
 HSM_BAR_research_clinic_consent_choice:0 "Ввести информированное согласие и независимую проверку."
 HSM_BAR_research_clinic_consent_idea:0 "Клиники добровольного лечения"
 HSM_BAR_research_clinic_consent_idea_desc:0 "Независимые наблюдатели защищают пациентов и превращают достоверные истории болезни в медицинские знания."
 HSM_BAR_research_clinic_consent_tt:0 "После завершения: потратить 25 ед. политической власти, получить 3% стабильности; получить дух «Клиники добровольного лечения» на 540 дней (+100 еженедельные людские ресурсы, +1% скорость исследований). Программа также даёт один бонус 50% к исследованию технологии. Выбранная политика фиксируется навсегда; национальные модификаторы действуют ограниченный срок."
 HSM_BAR_research_clinic_expedience_choice:0 "Разрешить экстренное лечение без комиссии."
 HSM_BAR_research_clinic_expedience_idea:0 "Экстренные тауматургические палаты"
 HSM_BAR_research_clinic_expedience_idea_desc:0 "Ускоренное лечение охватывает больше раненых, но семьи не доверяют процедурам без независимого представителя пациента."
 HSM_BAR_research_clinic_expedience_tt:0 "После завершения: потратить 10 ед. политической власти, потерять 4% стабильности; получить дух «Экстренные тауматургические палаты» на 365 дней (+200 еженедельные людские ресурсы, +6% скорость восстановления дивизий). Программа также даёт один бонус 50% к исследованию технологии. Выбранная политика фиксируется навсегда; национальные модификаторы действуют ограниченный срок."
 HSM_BAR_research_grid:0 "Гражданская таумическая сеть"
 HSM_BAR_research_grid_desc:0 "Подключить кристаллические преобразователи к мастерским и коммунальным службам. Прототип должен определить, смогут ли районы отключать повреждённые участки самостоятельно или будут подчиняться единому диспетчеру."
 HSM_BAR_research_grid_choice:0 "Кто управляет рубильником?"
 HSM_BAR_research_grid_choice_desc:0 "Центральный преобразователь даёт наибольшую мощность на стенде. Малые местные станции теряют часть энергии, зато одна ошибка не погрузит все районы во тьму. Инженеры подготовили два жизнеспособных проекта и два разных способа взаимодействия института с городами."
 HSM_BAR_research_grid_bonus:0 "Гражданская таумическая сеть: прикладные исследования"
 HSM_BAR_research_grid_fallback:0 "Финансировать: Гражданская таумическая сеть"
 HSM_BAR_research_grid_fallback_desc:0 "Подключить кристаллические преобразователи к мастерским и коммунальным службам. Прототип должен определить, смогут ли районы отключать повреждённые участки самостоятельно или будут подчиняться единому диспетчеру.\n\nЛабораторная программа на 150 дней стоит 75 единиц политической власти и занимает одну гражданскую фабрику. Одновременно может идти лишь одна резервная программа. При публикации оплачивается отдельная стоимость внедрения выбранного прототипа. Потеря условий доступа отменяет программу без выдачи результатов."
 HSM_BAR_research_grid_resume:0 "Утвердить: Гражданская таумическая сеть"
 HSM_BAR_research_grid_resume_desc:0 "Рассмотреть уже завершённую программу, результаты которой ожидают разрешения или выбора проекта. Решение не выполняет исследование и не отменяет стоимость внедрения выбранного варианта."
 HSM_BAR_research_grid_distributed_choice:0 "Передать районам независимые местные сети."
 HSM_BAR_research_grid_distributed_idea:0 "Распределённая гражданская сеть"
 HSM_BAR_research_grid_distributed_idea_desc:0 "Местные ремонтные бригады снабжают мастерские энергией и отключают опасное оборудование, не дожидаясь столицы."
 HSM_BAR_research_grid_distributed_tt:0 "После завершения: потратить 35 ед. политической власти, получить 2% стабильности; получить дух «Распределённая гражданская сеть» на 730 дней (+6% скорость строительства, +2% выпуск заводов). Программа также даёт один бонус 50% к исследованию технологии. Выбранная политика фиксируется навсегда; национальные модификаторы действуют ограниченный срок."
 HSM_BAR_research_grid_central_choice:0 "Сосредоточить генерацию у центральной диспетчерской."
 HSM_BAR_research_grid_central_idea:0 "Центральная таумическая диспетчерская"
 HSM_BAR_research_grid_central_idea_desc:0 "Сосредоточенная генерация снабжает приоритетные заводы. Гражданские потребители оплачивают расширенную диспетчерскую и ремонтную службу."
 HSM_BAR_research_grid_central_tt:0 "После завершения: потратить 20 ед. политической власти, потерять 2% стабильности; получить дух «Центральная таумическая диспетчерская» на 730 дней (+8% выпуск заводов, -3% потребление снабжения, +3% множитель товаров народного потребления). Программа также даёт один бонус 50% к исследованию технологии. Выбранная политика фиксируется навсегда; национальные модификаторы действуют ограниченный срок."
 HSM_BAR_research_wards:0 "Защита от ментального подчинения"
 HSM_BAR_research_wards_desc:0 "Разработать проверяемые сигналы тревоги и помехи против принуждающей магии. Коллегия снабжает военных и гражданских через публичный институт; тайная служба защищает сотрудников и скрытые объекты, не раскрывая своего существования гражданскому правительству."
 HSM_BAR_research_wards_choice:0 "Защита или надзор?"
 HSM_BAR_research_wards_choice_desc:0 "Контур распознаёт навязанную команду лишь вблизи. Личные обереги оставляют сигналы на месте, а центральная сеть объединяет их в подробные записи. Для публичной Коллегии это вопрос частной жизни и доверия граждан. Внутри тайной службы личный оберег предупреждает самого владельца, а центральное бюро сопоставляет донесения и готовит инструкции полевым группам. Ни один вариант не гарантирует защиты от любой магии."
 HSM_BAR_research_wards_bonus:0 "Защита от ментального подчинения: прикладные исследования"
 HSM_BAR_research_wards_fallback:0 "Финансировать: Защита от ментального подчинения"
 HSM_BAR_research_wards_fallback_desc:0 "Разработать проверяемые сигналы тревоги и помехи против принуждающей магии. Коллегия снабжает военных и гражданских через публичный институт; тайная служба защищает сотрудников и скрытые объекты, не раскрывая своего существования гражданскому правительству.\n\nЛабораторная программа на 120 дней стоит 60 единиц политической власти и занимает одну гражданскую фабрику. Одновременно может идти лишь одна резервная программа. При утверждении оплачивается отдельная стоимость внедрения выбранного прототипа. Потеря условий доступа отменяет программу без выдачи результатов."
 HSM_BAR_research_wards_resume:0 "Утвердить: Защита от ментального подчинения"
 HSM_BAR_research_wards_resume_desc:0 "Рассмотреть уже завершённую программу, результаты которой ожидают разрешения или выбора проекта. Решение не выполняет исследование и не отменяет стоимость внедрения выбранного варианта."
 HSM_BAR_research_wards_personal_choice:0 "Выдать личные обереги с индивидуальной сигнализацией."
 HSM_BAR_research_wards_personal_idea:0 "Обереги личной воли"
 HSM_BAR_research_wards_personal_idea_desc:0 "Личные обереги Коллегии защищают военных и гражданских без постоянного наблюдения. В тайной службе местные сигналы защищают сотрудников, не оставляя записей, способных выдать скрытые объекты."
 HSM_BAR_research_wards_personal_tt:0 "После завершения: потратить 25 ед. политической власти. Коллегия: получить 3% стабильности; Директорат: без изменения стабильности; получить дух «Обереги личной воли» на 540 дней (+4% скорость восстановления дивизий, +15% защита от смены идеологии). Программа также даёт один бонус 50% к исследованию технологии. Выбранная политика фиксируется навсегда; национальные модификаторы действуют ограниченный срок."
 HSM_BAR_research_wards_monitoring_choice:0 "Подключить обереги к центральному бюро наблюдения."
 HSM_BAR_research_wards_monitoring_idea:0 "Централизованный надзор за контурами"
 HSM_BAR_research_wards_monitoring_idea_desc:0 "Общий журнал сигналов помогает разведке и планированию. Публичная программа Коллегии теряет доверие из-за навязчивого наблюдения; для тайной службы тот же журнал создаёт риск раскрытия скрытой сети."
 HSM_BAR_research_wards_monitoring_tt:0 "После завершения: потратить 15 ед. политической власти. Коллегия: потерять 3% стабильности; Директорат: без изменения стабильности; получить дух «Централизованный надзор за контурами» на 540 дней (+10% мощность дешифрования, +5% скорость планирования). Программа также даёт один бонус 50% к исследованию технологии. Выбранная политика фиксируется навсегда; национальные модификаторы действуют ограниченный срок."
 HSM_BAR_research_containment:0 "Многоуровневое сдерживание аномалий"
 HSM_BAR_research_containment_desc:0 "Испытать вложенные барьеры, дистанционные приборы и эвакуационные процедуры для опасных образцов на скрытых объектах службы. Раздельный доступ к записям и зашифрованные каналы приборов защищают объекты, пока специалисты изучают материалы."
 HSM_BAR_research_containment_choice:0 "Доступ к камере"
 HSM_BAR_research_containment_choice_desc:0 "Дистанционные приборы пережили первый отказ барьера в скрытой лаборатории. Исследовательская ячейка просит контролируемый доступ для поиска неисправности; ячейка хранения предлагает опечатать камеру и ограничить доступ к записям. Оба проекта остаются внутри тайной службы. Доступ сохраняет возможности исследований, а герметичное хранение снижает риск раскрытия объекта."
 HSM_BAR_research_containment_bonus:0 "Многоуровневое сдерживание аномалий: прикладные исследования"
 HSM_BAR_research_containment_fallback:0 "Финансировать: Многоуровневое сдерживание аномалий"
 HSM_BAR_research_containment_fallback_desc:0 "Испытать вложенные барьеры, дистанционные приборы и эвакуационные процедуры для опасных образцов на скрытых объектах службы. Раздельный доступ к записям и зашифрованные каналы приборов защищают объекты, пока специалисты изучают материалы.\n\nЛабораторная программа на 150 дней стоит 80 единиц политической власти и занимает одну гражданскую фабрику. Одновременно может идти лишь одна резервная программа. При утверждении оплачивается отдельная стоимость внедрения выбранного прототипа. Потеря условий доступа отменяет программу без выдачи результатов."
 HSM_BAR_research_containment_resume:0 "Утвердить: Многоуровневое сдерживание аномалий"
 HSM_BAR_research_containment_resume_desc:0 "Рассмотреть уже завершённую программу, результаты которой ожидают разрешения или выбора проекта. Решение не выполняет исследование и не отменяет стоимость внедрения выбранного варианта."
 HSM_BAR_research_containment_layered_choice:0 "Сохранить несколько барьеров и контролируемый доступ учёных."
 HSM_BAR_research_containment_layered_idea:0 "Лаборатории контролируемого сдерживания"
 HSM_BAR_research_containment_layered_idea_desc:0 "Независимые барьеры, зашифрованные каналы приборов и раздельный учёт образцов позволяют исследовать материалы в скрытых лабораториях. Оборудование и обслуживание продолжают расходовать гражданские ресурсы."
 HSM_BAR_research_containment_layered_tt:0 "После завершения: потратить 35 ед. политической власти; получить дух «Лаборатории контролируемого сдерживания» на 540 дней (+3% скорость исследований, +1 шифрование, +2% множитель товаров народного потребления). Программа также даёт один бонус 50% к исследованию технологии. Выбранная политика фиксируется навсегда; национальные модификаторы действуют ограниченный срок."
 HSM_BAR_research_containment_sealed_choice:0 "Опечатать хранилища и поставить безопасность выше исследований."
 HSM_BAR_research_containment_sealed_idea:0 "Опечатанные хранилища Директората"
 HSM_BAR_research_containment_sealed_idea_desc:0 "Герметичные камеры, зашифрованные записи и скрытные перевозки защищают секретные объекты. Ограничение физического доступа замедляет эксперименты, но снижает риск раскрытия места хранения."
 HSM_BAR_research_containment_sealed_tt:0 "После завершения: потратить 20 ед. политической власти; получить дух «Опечатанные хранилища Директората» на 730 дней (+2 шифрование, -2% скорость исследований, +2% множитель товаров народного потребления). Программа также даёт один бонус 50% к исследованию технологии. Выбранная политика фиксируется навсегда; национальные модификаторы действуют ограниченный срок."
 HSM_BAR_research_forensics:0 "Экспертиза остаточной магии"
 HSM_BAR_research_forensics_desc:0 "Откалибровать методы сопоставления следов, архивов и надёжно опознанных останков внутри тайной службы. Все дела остаются секретными. Поражение, исчезновение или капитуляция сами по себе не доказывают смерть и не создают доступного для изъятия тела."
 HSM_BAR_research_forensics_choice:0 "Заключение, которое можно оспорить"
 HSM_BAR_research_forensics_choice_desc:0 "Остаточные сигнатуры меняются под действием тепла, времени и загрязнения. Отдельная внутренняя ячейка может повторить контрольные измерения, не зная выводов оперативной группы, либо оперативная ячейка сохранит исключительный доступ к каталогу. Все дела остаются секретными внутри службы. Независимая внутренняя проверка снижает риск ошибок, способных выдать объект; непроверенный каталог ускоряет полевой анализ ценой надёжности."
 HSM_BAR_research_forensics_bonus:0 "Экспертиза остаточной магии: прикладные исследования"
 HSM_BAR_research_forensics_fallback:0 "Финансировать: Экспертиза остаточной магии"
 HSM_BAR_research_forensics_fallback_desc:0 "Откалибровать методы сопоставления следов, архивов и надёжно опознанных останков внутри тайной службы. Все дела остаются секретными. Поражение, исчезновение или капитуляция сами по себе не доказывают смерть и не создают доступного для изъятия тела.\n\nЛабораторная программа на 150 дней стоит 75 единиц политической власти и занимает одну гражданскую фабрику. Одновременно может идти лишь одна резервная программа. При утверждении оплачивается отдельная стоимость внедрения выбранного прототипа. Потеря условий доступа отменяет программу без выдачи результатов."
 HSM_BAR_research_forensics_resume:0 "Утвердить: Экспертиза остаточной магии"
 HSM_BAR_research_forensics_resume_desc:0 "Рассмотреть уже завершённую программу, результаты которой ожидают разрешения или выбора проекта. Решение не выполняет исследование и не отменяет стоимость внедрения выбранного варианта."
 HSM_BAR_research_forensics_reviewed_choice:0 "Поручить повторную проверку отдельной внутренней ячейке."
 HSM_BAR_research_forensics_reviewed_idea:0 "Проверяемая магическая экспертиза"
 HSM_BAR_research_forensics_reviewed_idea_desc:0 "Отдельная ячейка службы повторяет контрольные измерения и проверяет трактовку гражданских документов. Дела остаются секретными; исправление ненадёжных опознаний снижает риск ошибок, способных выдать сеть."
 HSM_BAR_research_forensics_reviewed_tt:0 "После завершения: потратить 35 ед. политической власти; получить дух «Проверяемая магическая экспертиза» на 540 дней (+4% скорость исследований, +10% гражданская разведка). Программа также даёт один бонус 50% к исследованию технологии. Выбранная политика фиксируется навсегда; национальные модификаторы действуют ограниченный срок."
 HSM_BAR_research_forensics_classified_choice:0 "Создать секретный каталог сигнатур для оперативных групп."
 HSM_BAR_research_forensics_classified_idea:0 "Секретный каталог сигнатур"
 HSM_BAR_research_forensics_classified_idea_desc:0 "Только оперативная ячейка ведёт секретный каталог для анализа перехватов и военной разведки. Без отдельной внутренней проверки ошибочно опознанные следы могут подтолкнуть группы к действиям, раскрывающим их прикрытие."
 HSM_BAR_research_forensics_classified_tt:0 "После завершения: потратить 20 ед. политической власти; получить дух «Секретный каталог сигнатур» на 540 дней (+15% мощность дешифрования, +10% армейская разведка). Программа также даёт один бонус 50% к исследованию технологии. Выбранная политика фиксируется навсегда; национальные модификаторы действуют ограниченный срок."
 HSM_BAR_research_suppression:0 "Устройство подавления магии"
 HSM_BAR_research_suppression_desc:0 "Разработать оборудование, прерывающее опасные чары на скрытых объектах. Программа нормализации должна выбрать между обратимым отключением и окончательным уничтожением чар в заражённых механизмах и образцах материалов."
 HSM_BAR_research_suppression_choice:0 "Обратный контур"
 HSM_BAR_research_suppression_choice_desc:0 "Гаситель способен остановить опасный зачарованный механизм, сохранив его ядро. Удаление обратного контура навсегда уничтожает обработанные чары и упрощает дальнейшее обращение, но лишает исследователей образцов и грозит травмами специалистам. Повторные отказы оборудования и срочные поставки затрудняют сокрытие объекта. Проект рассматривается только внутри службы; гражданские чиновники не знают о существовании программы."
 HSM_BAR_research_suppression_bonus:0 "Устройство подавления магии: прикладные исследования"
 HSM_BAR_research_suppression_fallback:0 "Финансировать: Устройство подавления магии"
 HSM_BAR_research_suppression_fallback_desc:0 "Разработать оборудование, прерывающее опасные чары на скрытых объектах. Программа нормализации должна выбрать между обратимым отключением и окончательным уничтожением чар в заражённых механизмах и образцах материалов.\n\nЛабораторная программа на 180 дней стоит 100 единиц политической власти и занимает одну гражданскую фабрику. Одновременно может идти лишь одна резервная программа. При утверждении оплачивается отдельная стоимость внедрения выбранного прототипа. Потеря условий доступа отменяет программу без выдачи результатов."
 HSM_BAR_research_suppression_resume:0 "Утвердить: Устройство подавления магии"
 HSM_BAR_research_suppression_resume_desc:0 "Рассмотреть уже завершённую программу, результаты которой ожидают разрешения или выбора проекта. Решение не выполняет исследование и не отменяет стоимость внедрения выбранного варианта."
 HSM_BAR_research_suppression_reversible_choice:0 "Сохранить обратимый контур гашения."
 HSM_BAR_research_suppression_reversible_idea:0 "Обратимые полевые гасители"
 HSM_BAR_research_suppression_reversible_idea_desc:0 "Контролируемое отключение оборудования защищает снабженцев и ускоряет восстановление. Обученные расчёты и регулярное обслуживание требуют ресурсов. Ремонтные записи остаются внутри службы; гражданские поставщики получают лишь обычные заказы на замену деталей."
 HSM_BAR_research_suppression_reversible_tt:0 "После завершения: потратить 40 ед. политической власти; получить дух «Обратимые полевые гасители» на 540 дней (-5% потребление снабжения, +6% скорость восстановления дивизий, +2% множитель товаров народного потребления). Программа также даёт один бонус 50% к исследованию технологии. Выбранная политика фиксируется навсегда; национальные модификаторы действуют ограниченный срок."
 HSM_BAR_research_suppression_permanent_choice:0 "Одобрить необратимую нормализацию опасных носителей."
 HSM_BAR_research_suppression_permanent_idea:0 "Программа необратимой нормализации"
 HSM_BAR_research_suppression_permanent_idea_desc:0 "Окончательное снятие опасных чар упрощает обращение с оборудованием и стандартизацию производства. Уничтожение образцов замедляет исследования; аварии травмируют специалистов, а следы срочных поставок угрожают прикрытию объектов."
 HSM_BAR_research_suppression_permanent_tt:0 "После завершения: потратить 50 ед. политической власти; получить дух «Программа необратимой нормализации» на 730 дней (-5% потребление снабжения, +8% выпуск заводов, -4% скорость исследований, -50 еженедельные людские ресурсы). Программа также даёт один бонус 50% к исследованию технологии. Выбранная политика фиксируется навсегда; национальные модификаторы действуют ограниченный срок."
