l_russian:
 HSM_BAR_normalization_network:0 "Последний контур"
 HSM_BAR_normalization_network_desc:0 "Местное испытание завершено. Прежде чем замкнуть поле, пять удалённых станций должны воспроизвести его измерения. У каждой станции отдельный ключ отключения. Пока никто не решил, у кого должны храниться все пять."
 HSM_BAR_normalization_crisis:0 "За последним светом"
 HSM_BAR_normalization_crisis_desc:0 "Станции продолжают работать. Самое страшное именно это: все приборы подтверждают успех операции. На картах вычёркивают места, прежде отмеченные как защищённые. В донесениях различают первые шаги, пустую линию, удерживающую землю, и тяжесть огня за ней. Это полевые обозначения: сами пришельцы не назвались.\n\n§YЧерез исходный разлом могут пройти три волны: 4 + 2 + 2 соединения, либо 6 + 3 + 3, если у первоначального защитника было не менее 40 дивизий. Подкрепления ожидаются через 28 и 56 дней после прорыва. Последняя волна несёт осадные соединения, если противник контролирует не менее двух регионов; иначе она усиливает удерживающую линию. Потеря полного контроля над разломом навсегда прекращает дальнейшие прибытия при обновлении ежедневной сводки. Уже прибывшие силы всё ещё необходимо разгромить. Обычный набор войск не входит в лимиты этих волн.§!"
 HSM_BAR_global_network_ready_tt:0 "Необходимы действующее разрешение, завершённое исследование подавления и знания по соответствующим делам, все пять региональных отделений и завершённая настройка их станций, а также контроль центральной установки в Барраде."
 HSM_BAR_normalization_grid_equus:0 "Эквус: линия тишины"
 HSM_BAR_normalization_grid_equus_desc:0 "Сверить поле со старыми охранными камнями. Записывать и показание прибора, и свечение камня: при прежнем испытании отмечали только первое."
 HSM_BAR_norm_grid_equus_done:0 "Эквус: линия тишины: настройка завершена"
 HSM_BAR_normalization_grid_griffonia:0 "Земли грифонов: под фундаментами"
 HSM_BAR_normalization_grid_griffonia_desc:0 "Установить вторую станцию под заброшенной обсерваторией. В её фундаменте найдено более старое каменное кольцо, которого нет на чертежах архитектора."
 HSM_BAR_norm_grid_griffonia_done:0 "Земли грифонов: под фундаментами: настройка завершена"
 HSM_BAR_normalization_grid_north:0 "Север: стража без хранителя"
 HSM_BAR_normalization_grid_north_desc:0 "Приборы должны выдержать полный цикл холода. Начальник станции уточняет, относится ли приказ не отвечать на голоса также к знакомым голосам."
 HSM_BAR_norm_grid_north_done:0 "Север: стража без хранителя: настройка завершена"
 HSM_BAR_normalization_grid_riverlands:0 "Речные земли: пятый берег"
 HSM_BAR_normalization_grid_riverlands_desc:0 "Завершить полевые измерения выше населённой долины. Проводники настаивают: один участок берега нельзя измерять со стороны воды."
 HSM_BAR_norm_grid_riverlands_done:0 "Речные земли: пятый берег: настройка завершена"
 HSM_BAR_normalization_grid_zebrica:0 "Зебрика: незамкнутый круг"
 HSM_BAR_normalization_grid_zebrica_desc:0 "Синхронизировать южную станцию, не трогая окружающие её межевые знаки. Директор отделения отказывается разрешить центру списать эти знаки как строительный мусор."
 HSM_BAR_norm_grid_zebrica_done:0 "Зебрика: незамкнутый круг: настройка завершена"
 HSM_BAR_normalization_activate:0 "Замкнуть пять контуров"
 HSM_BAR_normalization_activate_desc:0 "На последнем разрешении та же печать, что и на первом распоряжении об очистке земель. Тогда требовалось сделать одно поле пригодным для посева. Теперь на распределительном щите написаны названия континентов.\n\n§YВсе страны, включая Баррад, получат штрафы к магическому снаряжению, указанные в духе «Поле тишины». Они затрагивают отдельные типы магических винтовок, артиллерии и танков, но не обычные модели с магическим модулем.§!"
 HSM_BAR_normalization_restore:0 "Вернуть ключи хранителям"
 HSM_BAR_normalization_restore_desc:0 "Передать уцелевшие измерения тем, чьи обереги мы заглушили. В одиночку границу не восстановить, и в письмах придётся объяснить, что мы сделали.\n\n§YВосстанавливает магическое снаряжение во всём мире и прекращает новые волны вторжения. Уже появившиеся войска, захваченные земли и войны остаются. Выбор исключает продолжение нормализации.§!"
 HSM_BAR_normalization_press:0 "Удержать рубеж без света"
 HSM_BAR_normalization_press_desc:0 "Остались обычные орудия, инженеры и живые защитники. Командование предлагает не отключать станции и построить рубеж, которому не нужны обереги. В предложении нет сметы на годы после победы.\n\n§YСохраняет глобальные штрафы к магии и предоставляет «Железную стражу» на время вторжения. Для победы необходимо разгромить вторгшегося противника; завершение решения её не даёт. Выбор исключает восстановление барьеров.§!"
 HSM_BAR_normalization_arm_without_magic:0 "Выдать таблицы для обычных орудий"
 HSM_BAR_normalization_arm_without_magic_desc:0 "В экстренном циркуляре нет заклинаний и обещаний неуязвимости. В нём описаны дальномерные вехи, перекрёстный огонь и порядок действий расчёта, если цель не отбрасывает тени.\n\n§YПредоставляет «Железную стражу» до разгрома вторжения: обычное пехотное снаряжение получает +10% противопехотной атаки и защиты, обычная артиллерия +10% противопехотной атаки; выпуск военных заводов −8%, ежедневная политическая власть −0,15.§!"
 HSM_BAR_normalization_magic_failure:0 "Поле тишины"
 HSM_BAR_normalization_magic_failure_desc:0 "Кристаллы сохранили форму, надписи — смысл. Но ни те ни другие больше не отвечают с прежней силой. Поле подавления пересекает все границы, в том числе границу создавшей его страны.\n\n§YДействует только на отдельные типы магического снаряжения. Обычные самолёты, корабли и танковые шасси не получают штрафа за наличие магического модуля.§!"
 HSM_BAR_normalization_steel_defence:0 "Железная стража"
 HSM_BAR_normalization_steel_defence_desc:0 "То, что перешло границу, можно остановить обычным оружием. Содержание расчётов, сменные стволы и подготовленные позиции требуют ресурсов, которых уже не хватает на восстановление."
 HSM_BAR_normalization_beyond:0 "За ними нет очага"
 HSM_BAR_normalization_beyond_desc:0 "Первый патруль не увидел костров. Второй не нашёл брошенного продовольствия, подстилок или раненых. Третьего донесения не было."
 NML:0 "За последним светом"
 NML_DEF:0 "За последним светом"
