 NML_communism_ADJ:0 "Запредельн"
 HSM_BAR_beyond_leader:0 "Ответ без голоса"
 HSM_BAR_BEYOND_DIVISION:0 "Силуэты за светом"
 HSM_BAR_world_barriers_restored:0 "Барьеры мира восстановлены"
 HSM_BAR_world_normalization_victory:0 "Вторжение отражено без восстановления магии"
 hsm_bar_normalization.1.t:0 "Поле за окном"
 hsm_bar_normalization.1.d:0 "Перед демонстрацией Марта попросила показать ей очищенное поле. Под землёй больше никто не шептал. Рабочие сняли защитные повязки с ушей; один смеялся над шуткой, которой она не расслышала.\n\nНа станции побелели пять ламп. Техник положил рядом с распределительным щитом веточку с того поля. Северин дождался, пока стрелки успокоятся, и написал на полях одно слово: «Тихо».\n\nВпервые оно прозвучало как обещание."
 hsm_bar_normalization.1.a:0 "Пусть сеют."
 hsm_bar_normalization.2.t:0 "Стража, которой не ответили"
 hsm_bar_normalization.2.d:0 "Северная станция извинилась за упоминание народного обычая в донесении. Каждую зиму смотритель каменной арки оставлял под ней лампу. К утру фитиль выгорал, хотя пламени никто не видел. Вчера фитиль остался целым.\n\nЕщё три станции описали ту же неисправность другими словами. Показатели подавления были превосходными.\n\nСеверин вернул донесение, зачеркнув извинение. Ниже он написал: «Найдите остальные места, где мы назвали стражу суеверием»."
 hsm_bar_normalization.2.a:0 "Сохранить подлинники донесений."
 hsm_bar_normalization.3.t:0 "За последним светом"
 hsm_bar_normalization.3.d:0 "Патруль увидел огни за гребнем и решил, что возвращаются пропавшие жители. Когда подняли фонарь, огни остановились. Затем земля между ними потемнела, хотя рассвет уже достиг холма.\n\nПоследняя разборчивая строка указывает направление, а не описывает увиденное. Писавший так сильно давил на бумагу, что порвал её.\n\nК периметру подходят бронеколонны. На командном пункте никто не спрашивает, остаётся ли происходящее расследованием."
 hsm_bar_normalization.3.a:0 "Этот рубеж должен устоять."
 hsm_bar_normalization.4.t:0 "Имена на письмах"
 hsm_bar_normalization.4.d:0 "Письма отправили без прежних ограничений. Их адресатов называли хранителями опасных объектов, пособниками, препятствиями на пути восстановления. Теперь Служба просила их исправить то, что сама заглушила.\n\nПод северной аркой лампа зажглась прежде, чем к ней прикоснулись. Ирма записала это без комментариев. На следующей странице шёл список защитников, всё ещё пропавших за гребнем.\n\nМарта подписалась своим именем. Восстановление границы никого не вернуло."
 hsm_bar_normalization.4.a:0 "Живым мы ещё нужны."
 hsm_bar_normalization.5.t:0 "Без сметы на следующий год"
 hsm_bar_normalization.5.d:0 "В предложении для директоров были план огня, перечень заводов и номера частей, готовых удерживать прорыв. Под каждой графой стоял итог. Страница «Следующий год» оставалась пустой.\n\nЯдвига положила на стол патрон. «Это сработало. Я не стану говорить расчётам обратное».\n\nСеверин не возразил. Он спросил, кто будет стоять на страже, когда расчёты состарятся. Заседание закончилось раньше, чем ответ внесли в протокол."
 hsm_bar_normalization.5.a:0 "Не отключать станции."
 hsm_bar_normalization.11.t:0 "Линия через старые камни"
 hsm_bar_normalization.11.d:0 "Группа в Эквусе воспроизвела показатели местного испытания. Во время последнего замера один охранный камень перестал светиться; надпись оставалась тёплой до утра. Начальник станции приложил оттиск, отказавшись соскоблить образец.\n\nВ центре тепло пометили как «остаточное». Слово написано карандашом."
 hsm_bar_normalization.11.a:0 "Подшить оттиск к показаниям."
 hsm_bar_normalization.12.t:0 "Второй фундамент"
 hsm_bar_normalization.12.d:0 "Станция в землях грифонов стоит над кольцом, которое старше обсерватории. Все его стыки обращены внутрь. На вопрос, что находилось внутри, землемер ответил: возможно, строители пытались оставить нечто снаружи.\n\nГруппа настройки не использовала эту фразу в заключении."
 hsm_bar_normalization.12.a:0 "Сохранить записку землемера."
 hsm_bar_normalization.13.t:0 "Копия Ирмы"
 hsm_bar_normalization.13.d:0 "Ирма прислала два экземпляра северного испытания. В одном процедура завершилась без происшествий. В другом дежурный описал, как сестра просила впустить её за ворота.\n\nСведения о семье дежурного изъяли из рассылочного экземпляра. Ирма оставила подлинник в сейфе и отказалась заверить, что во втором случае было слышно эхо."
 hsm_bar_normalization.13.a:0 "Подлинник остаётся в деле."
 hsm_bar_normalization.14.t:0 "Берег, которого нет на карте"
 hsm_bar_normalization.14.d:0 "Приборы речной станции согласуются с остальными. Геодезические отметки — нет. Линия, измеренная с моста, выходит на западный берег; та же линия, измеренная с лодки, заканчивается под мостом.\n\nПроводник заверил донесение отпечатком копыта. Рядом он попросил не упоминать его деревню в последующих запросах. Местоположение из этого экземпляра изъято."
 hsm_bar_normalization.14.a:0 "Не переносить вехи."
 hsm_bar_normalization.15.t:0 "Оставленный проход"
 hsm_bar_normalization.15.d:0 "Южная станция готова. Её межевые знаки образуют неполное кольцо; монтажная группа несколько раз пыталась это исправить. Местная смотрительница возвращала каждый перенесённый знак до рассвета.\n\nНа вопрос, зачем оставлять проход, она ответила: «Чтобы тому, что уже здесь, не пришлось просить впустить его».\n\nВ пересланном донесении её имени нет."
 hsm_bar_normalization.15.a:0 "Оставить проход."
 hsm_bar_normalization.101.t:0 "Тишина поверх границ"
 hsm_bar_normalization.101.d:0 "Из нескольких стран поступают сообщения о внезапном ослаблении зачарованного оружия и кристаллических механизмов. О необычных отказах сообщают и гражданские учреждения; причины остаются предметом споров.\n\nВ Барраде газеты приветствуют возвращение рабочих на прежде опасные земли. Правительство не заявляло о связи между этими событиями."
 hsm_bar_normalization.101.a:0 "Это не единичные сообщения."
 hsm_bar_normalization.102.t:0 "Старые сторожевые огни"
 hsm_bar_normalization.102.d:0 "Хранители нескольких древних святилищ сообщают, что защитные обряды больше не действуют. Сначала это сочли ещё одним последствием недавних магических нарушений. Эвакуация началась после исчезновения патрулей на землях, которые поколениями считались безопасными.\n\nВ свидетельствах мало общего. Одно совпадает: перемена наступила после тишины."
 hsm_bar_normalization.102.a:0 "Некоторых границ не было на картах."
 hsm_bar_normalization.103.t:0 "Враг за периметром"
 hsm_bar_normalization.103.d:0 "Зона отчуждения стала фронтом. Вооружённые формирования неустановленного происхождения заняли земли за отказавшими оберегами; обороняющееся правительство ввело регулярные войска.\n\nОт вторгшихся не поступило ни заявления, ни требований. Описания свидетелей противоречивы. Военные донесения определённее: противника можно остановить, но для этого с ним придётся сражаться."
 hsm_bar_normalization.103.a:0 "Война настоящая."
 hsm_bar_normalization.104.t:0 "Граница отвечает"
 hsm_bar_normalization.104.d:0 "Уцелевшие хранители сообщают, что обереги вновь начали действовать. Зачарованное оружие возвращает прежнюю силу. Несколько правительств подтвердили получение ранее скрывавшихся измерений, но не опубликовали сопроводительные письма.\n\nВойска, сдерживающие вторжение, не отозваны. Всё, что успело перейти границу, осталось по эту сторону."
 hsm_bar_normalization.104.a:0 "Восстановление не означает прощения."
 hsm_bar_normalization.105.t:0 "Мир на плечах часовых"
 hsm_bar_normalization.105.d:0 "Вторжение отражено. Станции подавления не отключены. Обычные части охраняют места, где прежде действовала старая защита, а графики смен расписаны дальше любой объявленной программы восстановления.\n\nНа первых очищенных полях Баррада по-прежнему сеют. Дети, которым они достанутся, унаследуют и эту стражу."
 hsm_bar_normalization.105.a:0 "У этой победы нет конца дежурства."
 hsm_bar_normalization.106.t:0 "Рубеж устоял"
 hsm_bar_normalization.106.d:0 "Вторгшиеся формирования утратили опору как самостоятельная боевая сила. Поисковые группы возвращаются в покинутые поселения под вооружённой охраной. В некоторых домах на столах всё ещё стоит еда.\n\nВоенные объявили о завершении вторжения, но не объяснили его. Уцелевшие записи приказано сохранить."
 hsm_bar_normalization.106.a:0 "Посчитать тех, кто может вернуться."
 HSM_BAR_normalization_actor_tt:0 "Независимый и не капитулировавший Баррад основал Службу, разрешил глобальную нормализацию и завершил исследование подавления на основе необходимых знаний по делам; сосуществование не выбрано."
 HSM_BAR_normalization_responder_tt:0 "Руководит уполномоченной Службой либо контролирует центральную установку Баррада после того, как Служба утратила возможность действовать."
 HSM_BAR_normalization_choice_open_tt:0 "Вторжение началось; уполномоченное командование ещё не выбрало между восстановлением и продолжением нормализации."
 HSM_BAR_norm_grid_equus_working:0 "Идёт настройка станции в Эквусе"
 HSM_BAR_norm_grid_griffonia_working:0 "Идёт настройка станции в землях грифонов"
 HSM_BAR_norm_grid_north_working:0 "Идёт настройка северной станции"
 HSM_BAR_norm_grid_riverlands_working:0 "Идёт настройка речной станции"
 HSM_BAR_norm_grid_zebrica_working:0 "Идёт настройка станции в Зебрике"
 HSM_BAR_norm_activation_working:0 "Идёт соединение пяти контуров"
