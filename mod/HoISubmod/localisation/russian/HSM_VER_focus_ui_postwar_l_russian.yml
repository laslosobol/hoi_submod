l_russian:
 HSM_VER_FUI_imperial_institutions_tt:0 "Договорные учреждения Эри или их единый преемник независимы и находятся в мире."
 HSM_VER_FUI_mandate_not_decided_tt:0 "Решение о принятии мандата восстановления ещё не принято."
 HSM_VER_FUI_mandate_active_tt:0 "Мандат восстановления действует и не истёк; мирное урегулирование сохраняется."
 HSM_VER_FUI_household_recorded_tt:0 "Получен отчёт о положении Гровера VI."
 HSM_VER_FUI_contracts_awarded_tt:0 "Выбрана программа восстановления города."
 HSM_VER_FUI_audit_published_tt:0 "Отчёт комиссии опубликован."
 HSM_VER_FUI_city_contracts_effect_tt:0 "Событие: выбрать фабрику в Грифенхейме или два бонуса §G75%§! к строительным исследованиям. Если места для фабрики нет, первый вариант даст один бонус §G100%§! к промышленным исследованиям."
 HSM_VER_FUI_archive_effect_tt:0 "Два бонуса §G50%§! к исследованию промышленных технологий."
 HSM_VER_FUI_audit_effect_tt:0 "Событие: публикация отчёта комиссии. Откроет выбор между последним годом финансирования и немедленной передачей дел гражданским службам."
 HSM_VER_FUI_reg_context_tt:0 "Конституционный Авиан удерживает Герцланд после оборонительной победы; прошло 45 дней после мира. Веренские учреждения действуют."
 HSM_VER_FUI_reg_agreement_tt:0 "Соглашение о регентстве либо гражданском управлении действует с согласия обоих домов."
 HSM_VER_FUI_reg_prior_hearings_tt:0 "Завершены посещение школы и обсуждение оборонных статей."
 HSM_VER_FUI_reg_petitions_heard_tt:0 "Совет рассмотрел прошения."
 HSM_VER_FUI_reg_guardianship_tt:0 "Действует ограниченное регентство либо Гровер законно вступил в свои полномочия."
 HSM_VER_FUI_reg_civil_compact_tt:0 "Дома выбрали гражданское устройство вместо регентства."
 HSM_VER_FUI_reg_open_effect_tt:0 "Событие: дома обсуждают устройство побеждённого Герцланда. Начинает сюжет регентства либо гражданского соглашения."
 HSM_VER_FUI_reg_household_effect_tt:0 "Через два дня придёт отчёт о Гровере VI. При законной возможности запрашивает передачу его двора; сам по себе опеку или титул не даёт."
 HSM_VER_FUI_reg_city_effect_tt:0 "Фабрика и ячейка строительства в Грифенхейме. Если фабрика не помещается: вместо неё два бонуса §G100%§! к промышленным исследованиям."
 HSM_VER_FUI_reg_agreement_effect_tt:0 "Событие: предложить гражданское управление либо ограниченное регентство при находящемся у нас малолетнем Гровере. Нужно согласие обоих домов."
 HSM_VER_FUI_reg_schools_effect_tt:0 "Открывает доклад о посещении школы."
 HSM_VER_FUI_reg_defence_effect_tt:0 "Событие: выбрать общую логистику либо территориальные резервы. Выбор определит оборонный национальный дух."
 HSM_VER_FUI_reg_petitions_effect_tt:0 "Событие: приём просителей в совете. Открывает программы восстановления и гарантий прав домов."
 HSM_VER_FUI_reg_rebuilding_effect_tt:0 "§G25 опыта армии§! и два бонуса §G100%§! к строительным исследованиям."
 HSM_VER_FUI_reg_rights_effect_tt:0 "Закрепляет права домов на срок действия соглашения:"
 HSM_VER_FUI_reg_guardianship_effect_tt:0 "Событие завершает главу об ограниченной опеке с учётом действительного положения Гровера."
 HSM_VER_FUI_reg_civil_effect_tt:0 "Событие завершает главу о гражданском устройстве без учреждения регентства."
 HSM_VER_FUI_reg_final_effect_tt:0 "Итоговое событие: устроенная граница и последствия выбранного конституционного порядка."
 HSM_VER_FUI_uni_operational_tt:0 "Конвент действует; участники признали наше председательство и контролируют свои земли."
 HSM_VER_FUI_uni_works_done_tt:0 "Программа общих работ завершена."
 HSM_VER_FUI_uni_customs_wait_tt:0 "Прошли 60 дней таможенного перехода; общая администрация ещё не учреждена."
 HSM_VER_FUI_uni_admin_done_tt:0 "Общая администрация учреждена."
 HSM_VER_FUI_uni_admin_wait_tt:0 "Прошли 90 дней административного перехода; единое командование ещё не создано."
 HSM_VER_FUI_uni_preparations_tt:0 "Конституционный проект, подготовительные этапы и переходные сроки завершены."
 HSM_VER_FUI_uni_consents_tt:0 "Все участвующие правительства прямо согласились на присоединение."
 HSM_VER_FUI_uni_homeland_tt:0 "Созданное единое государство независимо и контролирует исконные земли Верении."
 HSM_VER_FUI_uni_budget_wait_tt:0 "С основания государства прошло 60 дней; первый обычный бюджет ещё не принят."
