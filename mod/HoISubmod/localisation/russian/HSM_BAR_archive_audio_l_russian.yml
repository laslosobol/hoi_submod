 HSM_BAR_archive_audio_echo_tt:0 "§YПрослушать фонограмму | 9 с§!\nВентиляция выработки; повторяющиеся стуки у контрольной точки. На конверте карандашом: «до ремонта заслонки». Фамилия записывавшего: £HSM_BAR_redact_short£."
 HSM_BAR_archive_audio_entity_tt:0 "§YПрослушать фонограмму | 9 с§!\nНижний пост прослушивания. Низкий гул и отдельные удары. В сохранившейся копии два обрыва; разборчивой речи нет. Инвентарные номера на конверте и сопроводительном акте не совпадают."
 HSM_BAR_archive_audio_reactor_tt:0 "§YПрослушать фонограмму | 9 с§!\nКорпус установки; неравномерная механическая вибрация. «Не использовать этот фрагмент для освидетельствования всей установки». Подпись: £HSM_BAR_redact_short£. Дата осмотра вырезана из конверта."
