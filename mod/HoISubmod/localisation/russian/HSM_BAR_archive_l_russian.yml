 HSM_BAR_archive_photo_rock_caption:0 "БР-001 | Архив на дату проверки. Обнажённый камень, следы давления; старая храмовая надпись изъята."
 HSM_BAR_archive_photo_titan_caption:0 "БР-002 | Архив на дату проверки. Найденный чертёж подъёмного шарнира; целый Титан не зафиксирован."
 HSM_BAR_archive_photo_entity_caption:0 "БР-003 | Архив на дату проверки. Пост прослушивания в шахте; дальний проём скрыт, сущность не видна."
 HSM_BAR_archive_photo_amulet_caption:0 "БР-004 | Архив на дату проверки. Копия плана границ поселения и схемы амулета. Амулет не изымался."
 HSM_BAR_archive_photo_reactor_caption:0 "БР-006 | Архив на дату проверки. Осмотр остановленной машины; обозначения органов управления изъяты."
 HSM_BAR_archive_photo_crown_caption:0 "БР-007 | Архив на дату проверки. Образец короны в защищённом изоляторе на стенде."
 HSM_BAR_archive_photo_chalice_caption:0 "БР-008 | Архив на дату проверки. Запечатанная Чаша Крови в защищённом изоляторе на стенде."
 HSM_BAR_archive_photo_darkheart_caption:0 "БР-010 | Архив на дату проверки. Тёмное Сердце (умбрум) за барьером; центр частично скрыт. Не исходное Кристальное Сердце."
 HSM_BAR_archive_photo_echo_caption:0 "БР-015 | Архив на дату проверки. Полевая аппаратура для проверки вентиляции и акустики."
 HSM_BAR_archive_photo_marsh_caption:0 "БР-016 | Архив на дату проверки. Пробы воды и осадка; свечение в средней банке. Условия опыта приложены."
 HSM_BAR_archive_photo_compass_caption:0 "БР-017 | Архив на дату проверки. Раскрытый купеческий футляр и снятая застёжка. Стенд для слепого сравнения компасов."
 HSM_BAR_archive_photo_plants_caption:0 "БР-005 | Архив на дату проверки. Изолированный ботанический образец местных растений."
 HSM_BAR_archive_results_tt:0 "Политика исследований и итоговое решение: точные текущие эффекты и учтённые затраты."
 HSM_BAR_archive_results_heading:0 "Результаты | Аномальные исследования"
 HSM_BAR_archive_results_note:0 "РЕЗУЛЬТАТЫ | Текущие эффекты, отдельно от архивных документов."
 HSM_BAR_archive_index_title:0 "Записка из-под обложки"
 HSM_BAR_archive_locked:0 "НЕДОСТАЮЩИЙ ЛИСТ\n\nВ уцелевшей папке нет приложения к этой записи. Номер в старой описи отмечает пропуск, но не восстанавливает текст и не объясняет его отсутствия.\n\nСохранилась пометка хранителя: «Сохранить пропуск нумерации. Не заменять листом из другого дела»."
 HSM_BAR_archive_inaugural:0 "УЧРЕДИТЕЛЬНАЯ ЗАПИСКА / М. Кшемень\nМы начали со списка колодцев для очистки и семей, которым пора вернуться домой. Под храмом нашлась работа, не закончившаяся со смертью её хозяев. Служба не даст ей незаметно добраться до следующей деревни.\n\nОльха хранит лабораторные оригиналы; Врона подписывает полевые копии. Их разногласия сохранять, а не примирять силами писаря. Имена источников в выездных копиях закрывать; изъятые листы оставлять в описи. Если ответа нет, так и записывать. Недостающие сведения не восстанавливать догадками.\n\nРабочие классы протоколов: Очаг, устойчивые меры защиты; Лунный круг, наблюдение за условиями; Зимняя стража, непрерывное вмешательство; Беззвездье, надёжное удержание не установлено. Оберег означает защитную функцию, а не меньшую опасность. Готовый отчёт не разрешает понижать класс.\n\nНаше первое обязательство всё ещё записано в списке колодцев."
 HSM_BAR_archive_index_empty:0 "На этой полке не найдены дела из описи. Осталась вложенная учредительная записка."
 HSM_BAR_archive_index_filed:0 "Найденная опись / на дубликатах разные штампы рассылки."
 HSM_BAR_archive_record_note:0 "НАЙДЕННАЯ КОПИЯ | Выводы на дату расследования."
 HSM_BAR_archive_status_unknown:0 "Не внесено"
 HSM_BAR_archive_status_intake:0 "Исходные сведения"
 HSM_BAR_archive_status_field:0 "Полевые записи"
 HSM_BAR_archive_status_studied:0 "Заключение подписано"
 HSM_BAR_archive_status_inconclusive:0 "Закрыто: не подтверждено"
 HSM_BAR_archive_closure_title:0 "Записка о закрытии"
 HSM_BAR_archive_rock_title:0 "БР-001 | Живой камень"
 HSM_BAR_archive_rock_intake:0 "КОМИССИЯ ПО ВОССТАНОВЛЕНИЮ / выездная выписка\nМарта Кшемень записала сообщение каменщика о смещении поверхности под храмом Асинти. По его словам, камень подался под зубилом; описание последовавшего подшито под номером £HSM_BAR_redact_short£. Обломка при показании нет. Передняя нога и молоток обёрнуты одинаковой тканью.\nСвидетель отказался забрать инструменты. Имя, £HSM_BAR_redact_long£, закрыто по его просьбе. Сводка для рассылки называет случившееся перерывом в раскопках. Последний вопрос свидетеля: заставит ли Республика закончить работу? Ответа в этой выписке не записано, как не записано и согласия вернуться к стене."
 HSM_BAR_archive_rock_field:0 "ОБНАЖЕНИЕ / копия для хозяйственной части\nГруппа Ядвиги Вроны отметила старый скол перед нажимом. Движение наблюдалось под соседней отметкой; хозяйственная выписка называет это местной осадкой. Отделившиеся крупинки собраны из прежнего скола. Дополнительного прохода не вскрывали.\nНа храмовом плане есть исправление Ольхи у £HSM_BAR_redact_short£. Первоначального знака в этой копии нет.\n£HSM_BAR_redact_cut£ §gДеталь плана изъята перед размножением.§!\nКонверт с образцом хранить вместе с размеченным планом. Чистый чертёж без отметок поместил бы движение туда, где никто его не наблюдал; для следующего осмотра такая аккуратность бесполезна."
 HSM_BAR_archive_rock_study:0 "ЛАБОРАТОРНАЯ СВОДКА / предложение об опоре\nОтделённые крупинки реагировали на давление вне храма; запечатанный контрольный образец оставался неподвижным. Выездная сводка называет это затруднением при обращении с материалом. Предел давления Северина Ольхи скрыт под £HSM_BAR_redact_short£ до повторной проверки на втором образце.\nКшемень просит опору для повреждённого деревенского колодца. Разрешение отложено. Сам вынос камня из святилища ещё не сделал его пригодным для этой работы.\n£HSM_BAR_redact_cut£ §gСравнительная ссылка исключена из хозяйственной копии.§!\nПод просьбой об опоре для колодца всё ещё нет подписи. У исключённой сравнительной ссылки Ольха оставил вопросительный знак. В лабораторном оригинале сохранились и просьба, и эта пометка."
 HSM_BAR_archive_rock_results:0 "[ROOT.GetHSMBAROutcome_rock]"
 HSM_BAR_archive_titan_title:0 "БР-002 | Титан"
 HSM_BAR_archive_titan_intake:0 "ВЫПИСКА ИЗ ЖУРНАЛА РАСКОПОК\nЗапись о конструкте начинается с середины страницы. Выше: канат, масло, три лампы; поставщик £HSM_BAR_redact_short£. Ниже: замена каната. Нет записи о закладке основания или изготовлении корпуса.\nПометка Ольхи на полях: Леопольд нашёл эту машину. Древнейшие её части построил не он. Лист, где могло быть имя прежнего создателя, не обнаружен."
 HSM_BAR_archive_titan_field:0 "ТЕХНИЧЕСКАЯ ОПИСЬ / копия для Вроны\nВ сохранившихся чертежах две системы мер. Поздние переделки выполнены в обозначениях Леопольда; исходные сочленения им не соответствуют. Несколько страниц вырезано вдоль переплёта.\nКаждому чертежу присвоено место в последовательности. Снимки целых и разобранных частей не соединять в одну реконструкцию.\n£HSM_BAR_redact_cut£ §gПриложение изъято из экземпляра.§!"
 HSM_BAR_archive_titan_study:0 "ИСПЫТАНИЯ НАГРУЗКИ / С. Ольха\nСохранившиеся размеры позволили рассчитать распределение нагрузки. Первое испытание проведено на подъёмной раме, без живого материала в подвижных частях. Рама выдерживает вес, указанный в старом журнале.\nКшемень: способ поднять обвалившуюся крышу стоит сохранить. Указание со следующей страницы не стоит.\n£HSM_BAR_redact_cut£ §gЛист изъят по решению комиссии.§!\n\nВосстановление Титана не разрешено."
 HSM_BAR_archive_titan_results:0 "[ROOT.GetHSMBAROutcome_titan]"
 HSM_BAR_archive_entity_title:0 "БР-003 | Под выработками"
 HSM_BAR_archive_entity_intake:0 "КОМИССИЯ ПО ВОССТАНОВЛЕНИЮ / выписка из беседы\nСвидетельница сообщила о наложении голосов под выработками. В этой копии отмечено затруднение при подсчёте говоривших. На вопрос о числе она попросила чистый лист и повторила одно слово буквами разной величины. Читать написанное вслух отказалась.\nИмя: £HSM_BAR_redact_long£. Толкование переводчика хранится отдельно под £HSM_BAR_redact_short£; религиозное имя в заголовок не внесено.\nМарта Кшемень: следующая беседа только с согласия свидетельницы. Дополнительный лист оставлен сложенным внутри показания. Ниже в описи указан отдельный перевод; на самом листе осталось слово, которое она отказалась читать."
 HSM_BAR_archive_entity_field:0 "ПОСТЫ ПРОСЛУШИВАНИЯ / полевая выписка\nВ письменных журналах наблюдателей у разных шахт описан одинаковый ответ. После третьего сигнала он изменился, и Ольха приказал обеим группам отойти. В рассылочной копии это названо плановым перерывом; порядок сигналов сохранён, содержание последнего скрыто под £HSM_BAR_redact_long£.\nВ старой стенограмме Пентархии есть сходный обрыв. Пометка, продавившая следующие листы, здесь опущена.\n£HSM_BAR_redact_cut£ §gСтенограмма ответа и пометка изъяты.§!\nВрона оставила журналы постов под разными обложками. Оба заканчиваются приказом отойти. Между ними вложено сравнение с Пентархией: оборванная строка лежит напротив незаполненного конца нового журнала."
 HSM_BAR_archive_entity_study:0 "СВОДКА О КОНТАКТЕ / ограниченная рассылка\nОтвет не подчинялся постоянной задержке из контрольного опыта с вентиляцией. Северин Ольха отличает ответ от вернувшегося звука; различать всех отвечающих он пока не умеет. Сокращённое решение называет результат непригодным для договора о снабжении. Отбор энергии не разрешён.\nИмя слушателя: £HSM_BAR_redact_short£. Вопрос, отсутствующий в выездной стенограмме, остался в медицинской копии.\n£HSM_BAR_redact_cut£ §gМедицинский фрагмент изъят.§!\nПометка Кшемень для врачебной части: «Сохранить исключённый вопрос. Нам нужно знать, что испугало слушателя». Медицинское приложение указано на обложке, но в этом комплекте его нет. На месте приложения оставлен номер."
 HSM_BAR_archive_entity_results:0 "[ROOT.GetHSMBAROutcome_entity]"
 HSM_BAR_archive_amulet_title:0 "БР-004 | Амулет Яношика"
 HSM_BAR_archive_amulet_intake:0 "ПИСЬМО ИЗ ПОСЕЛЕНИЯ / передано Кшемень\nЖители просят перенести межевые колья, а не защиту. В самом раннем рассказе названы Яношик и амулет, купленный ещё до появления растений. Объяснение торговца сохранилось в трёх разных версиях.\nВнизу другим почерком: «Вы убрали господ. Не забирайте то, благодаря чему мы остались живы».\nАдрес: £HSM_BAR_redact_long£."
 HSM_BAR_archive_amulet_field:0 "ОБСЛЕДОВАНИЕ ГРАНИЦЫ / Я. Врона\nПрежние наблюдения относят действие защиты к краю поселения. Свидетели согласны, что растения отступали; относительно других угроз показания расходятся.\nРаспоряжения об изъятии амулета не выдавали. В деле оставлены измерения и показания.\nОльха запросил точные слова торговца. Свидетель, который их помнит, £HSM_BAR_redact_long£, согласен говорить только с врачом."
 HSM_BAR_archive_amulet_study:0 "СРАВНИТЕЛЬНОЕ ЗАКЛЮЧЕНИЕ / М. Кшемень\nЗаписи замеров и рассказы жителей подтверждают ограниченное защитное действие. Обещание торговца о защите от всего рождённого под Баррадом ими не подтверждается.\nОпыт с барьером будет основан на записанной схеме, а не на изъятии защиты поселения.\nДополнительная отметка: ОБЕРЕГ. Защита других является функцией предмета, но не доказательством его безвредности.\nДело поставщика: £HSM_BAR_redact_short£."
 HSM_BAR_archive_amulet_results:0 "[ROOT.GetHSMBAROutcome_amulet]"
 HSM_BAR_archive_reactor_title:0 "БР-006 | Реактор"
 HSM_BAR_archive_reactor_intake:0 "ИНЖЕНЕРНАЯ ПЕРЕПИСКА / найденная обложка\nВ уцелевших указаниях камера названа по имени, а предполагаемая машина обозначена только как установка. При первой таблице нагрузки есть оговорка на полях. Выписка относит её к прежнему состоянию площадки; текст скрыт под £HSM_BAR_redact_long£.\nОльху просят отделить историю строительства от бумаг о контакте, несущих другую печать, £HSM_BAR_redact_short£. Акта осмотра при этом листе нет.\nПри строительной записи нет акта завершения работ. В сопроводительном запросе Ольхи два заголовка: СТРОИТЕЛЬСТВО и КОНТАКТ. Ссылка под вторым ведёт к отдельно запечатанным бумагам; самого приложения под обложкой нет."
 HSM_BAR_archive_reactor_field:0 "ОСМОТР УСТАНОВКИ / ремонтная копия\nГруппа Вроны обнаружила саму установку. Найденная схема охлаждения расходится с чистовой копией у £HSM_BAR_redact_short£. Выписка называет это расхождением чертежей. Группа отметила пропущенный путь, не трогая вентилей; их положения скрыты под £HSM_BAR_redact_short£.\nЗапись об обслуживании предписывает вывести рабочих до отмеченного изменения нагрузки. Промежуток для эвакуации указан, причина отсутствует. Имена смены: £HSM_BAR_redact_long£.\nОтметки Вроны у вентилей остались на экземпляре осмотра. Чистовой чертёж сложен за ним. Повторного пуска в журнале нет; распоряжение об эвакуации переписано целиком, вместе с сохранённым промежутком."
 HSM_BAR_archive_reactor_study:0 "ПЕРЕСМОТРЕННАЯ ТАБЛИЦА ОСТАНОВКИ / выписка\nБолее ранний эксплуатационный предел, £HSM_BAR_redact_short£, достигается прежде, чем сдаёт граница удержания. Эта сводка называет разницу временным резервом. Поправка Ольхи требует остановки до сигнала с границы; численные настройки скрыты под £HSM_BAR_redact_long£. Ожидать этого сигнала недопустимо.\nКшемень просит оставить старую запись об эвакуации рядом с поправкой. Имя составителя: £HSM_BAR_redact_short£. Прежняя запись сохраняет предупреждение, недостаточно ясно выраженное окончательным проектом.\nТаблица остановки подшита к старому распоряжению об эвакуации. На полях Кшемень подчеркнула слово «до». Строка повторного пуска остаётся без подписи; рядом сохранён прежний промежуток для выхода рабочих."
