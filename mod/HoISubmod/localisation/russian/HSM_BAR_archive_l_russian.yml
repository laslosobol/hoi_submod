 HSM_BAR_archive_plants_title:0 "БР-005 | Межевая полоса"
 HSM_BAR_archive_plants_intake:0 "ДЕРЕВЕНСКИЙ ЛАЗАРЕТ / М. Кшемень\nТрое пациентов принесли разные листья и назвали их одним именем. Двое касались растений; третий сжёг связку, собранную кем-то другим.\nВрач сохранила каждый рассказ с его образцом. Карта отмечает места поражений, а не народные названия зарослей.\nВ старой записи упомянута защита на границе поселения. Связанное дело БР-004."
 HSM_BAR_archive_plants_field:0 "ЗАПИСЬ ГЕРБАРИЯ / раздельное хранение\nОбычные раздражающие растения отделены от образцов с необъяснёнными реакциями. Обожжённый материал помещён отдельно. Врона остановила расчистку там, где отметки обследования перестали совпадать с маршрутом рабочих.\nОльха запросил пропущенную страницу графика выращивания Пентархии. Уцелевший заголовок: «ПОСЛЕ ТРЕТЬЕЙ ПЕРЕМЕНЫ».\n£HSM_BAR_redact_cut£ §gУказание вырезано из подлинника.§!"
 HSM_BAR_archive_plants_study:0 "ПОРЯДОК ОБРАЩЕНИЯ / М. Кшемень\nГербарий позволил разделить меры при касании, вдыхании дыма и перевозке. Общее имя нескольких растений не является диагнозом. Необъяснённые образцы остаются отдельно от проверенной коллекции.\nПервые указания деревням касаются защитных перчаток, промывания и того, что нельзя сжигать. Приказа уничтожить соседний лес к ним не приложено.\nВрона просит оставить копию у колодца, где рабочие действительно читают."
 HSM_BAR_archive_plants_results:0 "[ROOT.GetHSMBAROutcome_plants]"
 HSM_BAR_archive_zebrica_title:0 "БР-018 | Несостоявшаяся находка"
 HSM_BAR_archive_zebrica_intake:0 "ЮЖНАЯ ПЕРЕПИСКА / три предложения\nТри посредника предложили реликвию, якобы проходящую сквозь запечатанные стены. Каждый назвал другого владельца. Все трое повторили необычную ошибку в описании застёжки.\nВрона запросила свидетеля, видевшего содержимое, а не упаковку. В ответ прислали новые цены и ни одного свидетеля.\nПредполагаемое место происхождения помечено «НЕ ПРОВЕРЕНО»."
 HSM_BAR_archive_zebrica_closure:0 "ЗАПИСКА О ЗАКРЫТИИ / Я. Врона\nПредложения восходят к одному переписанному описанию. Последний посредник отказался от сделки, когда его попросили показать предмет без обёртки. Опознанного образца не поступило.\nНе установлено, описывал ли утраченный оригинал реликвию или обычный сосуд. Дальнейшие выплаты остановлены.\nКальк: сохранить повторённую ошибку. Если описание вернётся под другим именем, возможно, только по ней мы его и узнаем."
