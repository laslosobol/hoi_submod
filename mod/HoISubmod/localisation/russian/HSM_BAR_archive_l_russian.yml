 HSM_BAR_archive_phylactery_title:0 "БР-009 | Филактерий"
 HSM_BAR_archive_phylactery_intake:0 "ЗАКРЫТАЯ ВЫПИСКА / северная переписка\nВ показании говорится о вместилище, созданном для изменённого существования Розы и затем спрятанном. Свидетель описывает укрытие, а не комнату изготовления.\nКальк распорядилась убрать маршрут свидетеля, £HSM_BAR_redact_long£, из обычных копий. На полях она спрашивает, почему корреспондент назвал создательницу, но отказался назвать последнего, кто касался сосуда."
 HSM_BAR_archive_phylactery_field:0 "ОБЗОР ПОИСКА / И. Кальк\nЗапись о создании и сообщение об укрытии согласуются в назначении предмета. Адреса они не дают. Поступили рисунки трёх возможных сосудов; для проверки подлинности оставлена лишь запись с прослеживаемым происхождением.\nЗаголовок «уничтожить при обнаружении» вычеркнут Ольхой. Обоснование запечатано с ритуальным приложением и поисковой группе не выдано."
 HSM_BAR_archive_phylactery_study:0 "ЖУРНАЛ ИЗОЛЯЦИИ / опознанный сосуд\nПолученный сосуд сопоставили с записью хранилища до начала замеров изоляции. Разрушение не испытывали. Все предложения о вскрытии остаются без подписи.\nЗаписка Ольхи Кшемень: сосуд и то, что он содержит, не обязательно погибнут вместе. Я не подпишу приказ, пока не узнаю, кого мы освободим.\n£HSM_BAR_redact_cut£ §gСтрока изъята из копии отделения.§!"
