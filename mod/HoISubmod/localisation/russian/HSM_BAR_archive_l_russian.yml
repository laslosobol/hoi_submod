 HSM_BAR_archive_grover_title:0 "БР-011 | Гровер II"
 HSM_BAR_archive_grover_intake:0 "ЙЕЛЬСКОЕ ДЕЛО / историческое опознание\nВ имперской погребальной записи назван Гровер II. Позднейшая лабораторная ссылка повторяет имя рядом с последовательностью опытов восстановления. Между ними пробел, которого уцелевший каталог не объясняет.\nОльха запрашивает исходные даты вместе с исправлениями по ссылке каталога £HSM_BAR_redact_short£. Корона на полях не является опознавательным признаком.\nИсточник в Йеле: £HSM_BAR_redact_long£."
 HSM_BAR_archive_grover_field:0 "СОПОСТАВЛЕНИЕ ДОКУМЕНТОВ / Я. Врона\nЖурнал опытов ведёт от испытания на животном к останкам императора. Сообщения об императоре необходимо датировать относительно этой последовательности, а не одной погребальной записи.\nПриказа о захвате личности не выдавали. Любая передача материала требует отдельной описи и достоверного опознания.\nЛичная пометка Вроны: имя может пережить владельца. Именно поэтому одного имени недостаточно."
 HSM_BAR_archive_grover_study:0 "СУДЕБНО-МЕДИЦИНСКАЯ ЗАПИСКА / М. Кшемень\nХронология разделяет смерть, действия с останками и сообщения о возвращении. Спорные даты сохранены рядом с источниками. Настоящая записка не заявляет об осмотре тела.\nСпособ сравнения позволяет выявить подменённую запись, но не установить, какие воспоминания принадлежат историческому императору.\nПисьменный ответ Ольхи на последний вопрос хранится под отдельной печатью."
 HSM_BAR_archive_grover_results:0 "[ROOT.GetHSMBAROutcome_grover]"
 HSM_BAR_archive_rosa_title:0 "БР-012 | Роза Маледикта"
 HSM_BAR_archive_rosa_intake:0 "ИРМА КАЛЬК / обзор северных показаний\nКорреспонденты согласны в имени и расходятся почти во всём остальном. Один описывает церемонию; другой повторяет воззвание, которого сам не слышал.\nРассказы оставлены отдельно. Кальк отклонила требование составить единую законченную биографию.\nВ сопроводительной записке: «Связную историю легче распространять. Её также легче написать за нас её последователям»."
 HSM_BAR_archive_rosa_field:0 "ПРОВЕРКА ПРОИСХОЖДЕНИЯ / копия отделения\nКаждое сообщение о преображении поставлено рядом с подтверждающей ритуальной записью. Показания не взаимозаменяемы. Подтверждённые упоминания филактерия вынесены в отдельное приложение.\nСообщение о поражении не указывает, куда делись останки. Запрос на образец возвращён неисполненным.\nПоследний корреспондент перестал использовать условленную подпись. Дальнейшие письма запечатаны до проверки."
 HSM_BAR_archive_rosa_study:0 "СРАВНЕНИЕ РИТУАЛОВ / М. Кшемень и С. Ольха\nПрактический результат: способ проследить ритуальное утверждение через последовательность копий. Несколько уверенных заявлений оказались повторением одной повреждённой строки.\nКальк просит оставить отвергнутые сведения в приложении: возможно, кто-то распространяет их намеренно.\nАкта вскрытия в деле нет. Пустая графа образца должна остаться пустой.\n£HSM_BAR_redact_cut£ §gСписок источников изъят. Экземпляр директора.§!"
 HSM_BAR_archive_rosa_results:0 "[ROOT.GetHSMBAROutcome_rosa]"
 HSM_BAR_archive_herald_title:0 "БР-013 | Вестник Борея"
 HSM_BAR_archive_herald_intake:0 "ЙЕЛЬСКАЯ ПЕРЕПИСКА / закрытое показание\nСвидетель описывает голос, свет и фигуру, уже не опиравшуюся на пол. На вопрос, что произошло первым, он отвечает рассказом о том, как фигура назвала себя.\nВрона запросила второе показание из-за пределов комнаты. Ольха спрашивает о жидкости из более ранней экспериментальной записи.\nОтвет свидетеля помещён в приложение «НЕ ДЛЯ РЕЛИГИОЗНОГО РАСПРОСТРАНЕНИЯ»."
 HSM_BAR_archive_herald_field:0 "ХРОНОЛОГИЯ ОПЫТА / С. Ольха\nЛабораторная запись о жидкости предшествует сообщению о её следах на клюве испытуемого. Затем следуют проявления. Последовательность сохранена; заявленный титул в результаты опыта не внесён.\nВрона: стражники запомнили голос лучше сосуда. Найдите того, кто вёл учёт сосуда.\nКонтакт: £HSM_BAR_redact_long£. Хранилище: £HSM_BAR_redact_short£."
 HSM_BAR_archive_herald_study:0 "ОПТИЧЕСКОЕ ЗАКЛЮЧЕНИЕ / приборная секция\nПоказания сопоставлены с хронологией хранилища. Отчёт отделяет наблюдавшиеся проявления от личности, приписанной их источнику. Защиту приборов можно улучшить без повторения воздействия.\nКшемень не подпишет запрос на повторение случая с добровольцем.\n£HSM_BAR_redact_cut£ §gПредложенный порядок изъят из рассылочной копии.§!\nПриложенные сведения о перемещениях не указывают доступных останков. Последний абзац Ольхи посвящён пропущенному промежутку, а не телу; рассылка ограничена."
 HSM_BAR_archive_herald_results:0 "[ROOT.GetHSMBAROutcome_herald]"
 HSM_BAR_archive_sombra_title:0 "БР-014 | Сомбра"
 HSM_BAR_archive_sombra_intake:0 "КРИСТАЛЬНОЕ ДЕЛО / выдержка из показания\nСтаринная запись и новое сообщение называют одно имя. Новый автор описывает изменившиеся приказы, а не легенду. В конце он просит указаний, которые можно выполнить, не привлекая внимания.\nОкруг: £HSM_BAR_redact_long£. Полный адрес запечатан вместе с материалами проверки личности.\nВрона: не требовать встречи, пока не узнаем, кто читает его ответы."
 HSM_BAR_archive_sombra_field:0 "ХРОНОЛОГИЯ ВОЗВРАЩЕНИЯ / связь с БР-010\nКристальные записи связывают восстановление материального тела с Тёмным Сердцем. Последовательность касается возвращения Сомбры, а не создания новой личности.\nРассказы о других подо льдом приложены отдельно. Не все источники доступны для опроса.\nВ предложении искать останки нет проверенного места. Кальк написала поперёк: «Поражение не является адресом»."
 HSM_BAR_archive_sombra_study:0 "ЗАЩИТНЫЕ МЕРЫ / М. Кшемень\nПроверенная хронология и показания отделены от сводок допросов. Рекомендации касаются воздействия и защиты мирных жителей. Копия для связи содержит эти меры; личности источников остаются скрытыми.\nОльха сохранил отдельный вопрос: какая защита была смещена ради возвращения?\nИзъятие исходного Кристального Сердца не разрешено. Дальнейшее сравнение с делом £HSM_BAR_redact_short£ требует подписи директора."
 HSM_BAR_archive_sombra_results:0 "[ROOT.GetHSMBAROutcome_sombra]"
 HSM_BAR_archive_echo_title:0 "БР-015 | Второй голос"
 HSM_BAR_archive_echo_intake:0 "РЕМОНТНАЯ БРИГАДА / объяснение неявки\nБригадир сообщил о голосе из пустой вентиляционной шахты. Младший рабочий услышал вернувшиеся собственные слова и отказался от следующей смены. Показания сходятся в задержке и расходятся в словах. Сводка для рассылки называет это затруднением при общении.\nИмена: £HSM_BAR_redact_short£; £HSM_BAR_redact_long£. Врона запросила план вентиляции. Он заканчивается у стены, которую рабочие считают полой.\nКшемень оставила объяснение неявки при показаниях. Запрос Вроны о плане по-прежнему приложен. Спуск ниже отмеченной площадки запрещён до проверки шахты; бланк неявки остаётся под тем же номером."
 HSM_BAR_archive_echo_field:0 "АКУСТИЧЕСКАЯ ПРОВЕРКА / ремонтная копия\nВопрос заменили свистком; звук вернулся через тот же промежуток. В боковом ходе он достиг наблюдателя сзади. Камера, отсутствовавшая на старом плане, объяснила перемену направления. Исправленная трасса отмечена Вроной у £HSM_BAR_redact_short£.\nКопия сохраняет измерения, но опускает вопрос бригадира о работе.\n£HSM_BAR_redact_cut£ §gЛичная беседа исключена из хозяйственного приложения.§!\nБригадир слушал пробу со свистком молча. У его последующего вопроса на полях стоит ЛИЧНОЕ. В ремонтной копии остались исправленная трасса и отметка об изъятии; сама беседа хранится отдельно."
 HSM_BAR_archive_echo_study:0 "ЗАПИСКА О ЗАКРЫТИИ / ремонт вентиляции\nОбычный акустический путь через неотмеченную камеру объясняет возвращение звука. Независимого голоса не записано. Исправленный чертёж передан ремонтникам; показания остаются под печатью £HSM_BAR_redact_short£.\nИмена, £HSM_BAR_redact_long£, в записку не включены. Ольха запросил контрольную методику для сравнительного дела. Адресат в этой записке опущен.\nКшемень сохранила ограду в ремонтных указаниях. Предупреждение о голосах можно снять. Проём остаётся опасным местом для падения, даже когда на дне никого нет и некому окликнуть рабочего, решившего заглянуть вниз."
 HSM_BAR_archive_echo_results:0 "[ROOT.GetHSMBAROutcome_echo]"
 HSM_BAR_archive_marsh_title:0 "БР-016 | Болотные огни"
 HSM_BAR_archive_marsh_intake:0 "РЕЧНАЯ ПЕРЕПИСКА / сокращённый рассказ\nПутник пошёл за светом с дороги и потерял поклажу в топком грунте. Первое показание упоминает только свет. К утру появилась фигура с фонарём. Копия называет перемену уточнённым воспоминанием; Врона запросила самый ранний рассказ со всеми исправлениями.\nКорреспондент предлагает воду и осадок с места. Деревня отправителя: £HSM_BAR_redact_long£. Указания для сбора: £HSM_BAR_redact_short£.\nОбразцов при письме нет. Предложение воды и осадка всё ещё обёрнуто вокруг двух рассказов. На раннем листе отмечена потерянная поклажа; фигура с фонарём появляется на позднейшем."
 HSM_BAR_archive_marsh_field:0 "КУПЛЕННЫЙ МАТЕРИАЛ / выписка о приёме\nВода и осадок поступили в отдельно помеченных банках и сопоставлены с погодными записями корреспондента. Ссылка на место сбора: £HSM_BAR_redact_short£. Перевозчик попросил не открывать одну банку при нём. Указанная им причина скрыта под £HSM_BAR_redact_long£; копия отмечает пожелание при обращении с грузом.\nФигуры не обнаружено ни в одной банке.\n£HSM_BAR_redact_cut£ §gЛичное показание перевозчика исключено из квитанции.§!\nКшемень оставила погодные записи при этикетках банок. На квитанции поставщика стоит ОПЛАЧЕНО; в накладной те же номера проб. За купленным материалом подшиты два показания путника, раннее и позднейшее."
 HSM_BAR_archive_marsh_study:0 "ПОСЕЛЕНЧЕСКИЙ ЦИРКУЛЯР / меры при хранении воды\nОбразцы воспроизвели описанный свет обычной химической реакцией при записанных условиях. Изменение условий прекратило свечение. Перемещающегося носителя не выявлено. Подробности опыта скрыты под £HSM_BAR_redact_long£; циркуляр содержит рекомендации по хранению и очистке воды.\nИсправление Кшемень в заголовке проекта скрыто под £HSM_BAR_redact_short£. Имя путника, £HSM_BAR_redact_short£, для этих указаний не нужно.\nЦиркуляр заканчивается указаниями по хранению и очистке воды. Потерянная поклажа осталась в показании. Исправление Кшемень стоит на сопроводительном проекте рядом с рекомендацией поселениям; сам рассказ подшит следом."
