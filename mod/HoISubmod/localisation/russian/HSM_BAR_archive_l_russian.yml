 HSM_BAR_archive_chalice_title:0 "БР-008 | Чаша Крови"
 HSM_BAR_archive_chalice_intake:0 "СЕВЕРНОЕ ОТДЕЛЕНИЕ / фрагмент экспедиционного отчёта\nПовреждённая запись описывает сосуд, обнаруженный экспедицией Розы Маледикты. Путь автор излагает подробно, возвращение почти не описывает.\nИрма Кальк просит найти пропущенный конец, а не очередной рисунок чаши. Предмет существовал до экспедиции; у кого-то была причина оставить его именно там.\nАдрес хранилища: £HSM_BAR_redact_long£."
 HSM_BAR_archive_chalice_field:0 "ИРМА КАЛЬК / записка о подлинности\nСвидетельства относят сосуд к истории Розы до позднейших сообщений о её состоянии. Другой корреспондент называет вместилищем души любой связанный с ней сосуд. Его показание отделено от экспедиционной записи.\nИмя первого свидетеля, £HSM_BAR_redact_long£, оставлено только в оригинале отделения. Он просит не присылать одного и того же связного дважды."
 HSM_BAR_archive_chalice_study:0 "ОСМОТР ЗАПЕЧАТАННОГО СОСУДА / С. Ольха\nОстатки на поверхности полученного сосуда сопоставлены с уцелевшей ритуальной записью. Сравнение пригодно для обнаружения следов и безопасной перевозки. Пить из чаши для этого не требуется.\nКальк вернула запрос на живой опыт, не передавая его сотрудникам отделения.\nЕё пометка: «Экспедиция уже оставила предупреждение. Нам не нужно отправлять вторую»."
