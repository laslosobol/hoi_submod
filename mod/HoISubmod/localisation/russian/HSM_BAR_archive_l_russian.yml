 HSM_BAR_archive_crown_title:0 "БР-007 | Корона подчинения"
 HSM_BAR_archive_crown_intake:0 "ВЫПИСКА ИЗ ПИСЬМА / сообщение о находке\nАвтор описывает корону из пещеры, затем переходит от находки к послушанию подданных. Писарь озаглавил последний абзац вопросом о верности. Сам вопрос в рассылочную копию не попал.\nОтправитель: £HSM_BAR_redact_long£. Врона подчеркнула смену темы и потребовала установить находчика и нынешнего носителя до любого сближения. Адрес для переписки: £HSM_BAR_redact_short£.\nСообщения о других пещерах остаются в отдельных конвертах. На этом Врона оставила две строки: для находчика и нынешнего носителя. Обе пустуют; адрес для переписки записан отдельно."
 HSM_BAR_archive_crown_field:0 "ПОЛЕВАЯ ВЫПИСКА / переписка об изъятии\nПоказания описывают влияние, ограниченное расстоянием и числом затронутых разумов. Музейные записи и акты запечатывания сопоставлены с сообщениями об использовании. В этой копии описанное поведение названо исключительно устойчивым исполнением указаний. Возражение Вроны против такой формулировки удалено с полей.\nПоследовательность владения сохранена в копии группы изъятия; ссылка на передачу здесь: £HSM_BAR_redact_short£.\n£HSM_BAR_redact_cut£ §gСопоставление показаний и возражение на полях изъяты.§!\nК выписке прикреплена карточка экземпляра. Последовательность владения следует датированным музейным записям и актам запечатывания. Место приказа в отношении носителя пустует; отдельного листа с распоряжением в папке нет."
 HSM_BAR_archive_crown_study:0 "СВОДКА О ВОЗДЕЙСТВИИ / изолированный образец\nНикто из исследователей не надевал корону. Показания сопоставлены с наблюдениями снаружи изолятора. Модель сохраняет предел расстояния и числа затронутых существ; рабочие значения скрыты под £HSM_BAR_redact_short£.\nПредложение о клиническом продолжении отклонено. Имя заявителя: £HSM_BAR_redact_long£. Ограничение Кшемень остаётся в силе и там, где заявка называет послушание улучшением состояния.\nНомер этого образца стоит на каждом листе, включая отклонённую заявку. Заявительское «улучшение» сохранилось под отказом Кшемень. Листы наблюдений оставлены при записи об изоляторе, заявка подшита следом за ними."
