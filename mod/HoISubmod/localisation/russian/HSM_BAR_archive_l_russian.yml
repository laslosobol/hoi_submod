 HSM_BAR_archive_compass_title:0 "БР-017 | Ложный север"
 HSM_BAR_archive_compass_intake:0 "ПРЕДЛОЖЕНИЕ О ПОКУПКЕ / имя торговца £HSM_BAR_redact_long£\nКомпас якобы указывает на погребённое святилище. Продавец дважды нарисовал маршрут; оба рисунка заканчиваются у его собственного склада.\nВрона запросила прибор вместе с футляром. Ольха требует контрольный компас, которого продавец не касался.\nПредполагаемый мастер: «НЕИЗВЕСТЕН». Цитируемая надпись отсутствует на приложенном рисунке."
 HSM_BAR_archive_compass_field:0 "ПРОВЕРКА МАРШРУТА / землемерная секция\nПриборы меняли, не сообщая об этом носильщику. Маршрут сравнения: £HSM_BAR_redact_short£. Отклонение следовало за футляром, а не за носильщиком или направлением пути. Когда футляр оставили, предполагаемый маршрут исчез.\nПродавец попросил повторить показ с прежними ремнями. Отказано.\nВрона оставила застёжку из подкладки в отдельном конверте."
 HSM_BAR_archive_compass_study:0 "ЗАКЛЮЧЕНИЕ / намагниченная застёжка\nЗастёжка объясняет отклонение. Повторные слепые сравнения не выявили иных воздействий. Порядок проверки утверждён для землемеров; рассказ о святилище не подтверждён.\nОльха: сохранить футляр рядом с прибором. Если выставим одну стрелку, следующий исследователь унаследует ту же загадку.\nОбъяснение надписи продавцом подшито как «НЕ ПРОВЕРЕНО», а не как древний язык."
