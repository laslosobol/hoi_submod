 HSM_BAR_archive_darkheart_title:0 "БР-010 | Тёмное Сердце"
 HSM_BAR_archive_darkheart_intake:0 "КРИСТАЛЬНАЯ ПЕРЕПИСКА / личность защищена\nОсведомитель настаивает: замену вырастили. Он возражает против слова «ремонт» и вычёркивает его из каждого заданного вопроса.\nНа рисунке исходное Сердце и выращенный кристалл стоят на разных подставках. Местонахождение второй скрыто в этой копии: £HSM_BAR_redact_long£.\nОльха требует журнал роста, прежде чем толковать назначение замены."
 HSM_BAR_archive_darkheart_field:0 "ЗАПИСЬ О СОЗДАНИИ / аналитическая выписка\nИз умбрум-кристалла вырастили Тёмное Сердце. Уцелевший рассказ связывает его установку с возвращением Сомбры. Прежнее защитное Сердце является другим предметом.\nВрона просит вписать это различие в сам приказ о перевозке. Ошибка на ярлыке превратит изъятие защиты в мнимое устранение угрозы.\nСвязанное дело: БР-014; следующая ссылка: £HSM_BAR_redact_short£."
 HSM_BAR_archive_darkheart_study:0 "ОПЫТ С ПОМЕХАМИ / полученный артефакт\nСопоставление с журналом создания даёт порог предупреждения о помехах. Опыт воспроизводится без выращивания нового кристалла.\nКшемень возражает против слов «замена защиты» в проекте отчёта. Они удалены, исправление заверено.\nОльха: прибор сообщает о нарушении границы. Он не сообщает, что всё по другую сторону пытается войти."
