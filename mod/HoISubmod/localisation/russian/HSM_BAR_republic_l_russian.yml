l_russian:
 HSM_BAR_transition_republic:0 "Республика после Пентархии"
 HSM_BAR_transition_republic_desc:0 "На месте приказов графа остаются пустые кабинеты и толпа, которая больше не желает подчиняться. Собрание представителей сёл должно превратить победу восставших в власть, способную пережить следующую зиму."
 HSM_BAR_transition_councils:0 "Собрать сельские советы"
 HSM_BAR_transition_councils_desc:0 "Михал Завиша обходит поселения без охраны сборщиков податей. Каждому нужно назвать не нового хозяина, а того, кто сможет вернуться домой и ответить перед соседями за своё решение."
 HSM_BAR_transition_relief:0 "Открыть дома помощи"
 HSM_BAR_transition_relief_desc:0 "В помещениях бывшей дворцовой службы Марта Кшемень разворачивает палаты. Среди раненых и голодающих есть больные, чьи симптомы не исчезают даже после ухода из опасных мест."
 HSM_BAR_transition_survey:0 "Обойти заброшенные поля"
 HSM_BAR_transition_survey_desc:0 "Не все изгнанные крестьяне могут вернуться на свою землю. Межевые знаки стоят, а знакомые тропы иногда выводят совсем не туда. Землемеры начнут с участков, к которым жители ещё соглашаются подойти."
 HSM_BAR_transition_bread:0 "Посев под защитой Республики"
 HSM_BAR_transition_bread_desc:0 "Политические обещания не заменят семена и исправный плуг. Советы получат зерно и инструменты; спорные поля будут засеяны лишь после согласования с теми, кто на них живёт."
 HSM_BAR_transition_patients:0 "Те, кто вернулся другим"
 HSM_BAR_transition_patients_desc:0 "Из поселений у старых шахт в дома помощи приводят новых больных. Марта просит не объявлять их одержимыми: прежде она должна узнать, где каждый из них побывал."
 HSM_BAR_transition_cabinet:0 "Опечатанный кабинет"
 HSM_BAR_transition_cabinet_desc:0 "Номер на пластинке из поля приводит к запертому помещению в поместье. Пожар не добрался до шкафа с лабораторными тетрадями. Северин Ольха слишком быстро узнаёт его замок."
 HSM_BAR_transition_descent:0 "Вернуться в нижние выработки"
 HSM_BAR_transition_descent_desc:0 "На найденном плане указана камера под старой шахтой. Рабочие не спускались туда с последнего приказа графа. Врона готовит группу, а Ольха настаивает, чтобы подъёмник не глушили ни на минуту."
 HSM_BAR_transition_commission:0 "За закрытой дверью комиссии"
 HSM_BAR_transition_commission_desc:0 "После возвращения группы Марта перестаёт приносить на общие заседания все свои записи. Чтобы остановить оставшиеся опыты, нужны люди, готовые хранить их следы и отвечать за последствия. Четверо встречаются после закрытия палат."
 HSM_BAR_republic_tree:0 "Баррад: переходный период"
 HSM_BAR_directorate_tree:0 "Баррад: наследие под землёй"
 HSM_BAR_directorate_world_tree:0 "Баррад: за пределами очага"
 HSM_BAR_republic_recovery:0 "Возвращение земли"
 HSM_BAR_republic_recovery_desc:0 "Республика обещала вернуть жителям безопасные дома и пригодную для посева землю. Комиссия Кшемень обследует то, чего не объясняют старые карты."
 HSM_BAR_public_survey:0 "Обследовать поля у Ольхового Брода"
 HSM_BAR_public_survey_desc:0 "Землемеры проверят заброшенные участки и отметят места, куда нельзя пускать семьи до завершения обследования."
 HSM_BAR_decode_records:0 "Разобрать тетради запертого кабинета"
 HSM_BAR_decode_records_desc:0 "Ольха согласился прочесть обозначения на схемах. Марта будет присутствовать: часть страниц он уже пытался отложить в сторону."
 HSM_BAR_first_descent:0 "Отправить первую поисковую группу"
 HSM_BAR_first_descent_desc:0 "Врона соберёт рабочих, знающих старый подъёмник. Задача кажется простой: найти указанную в тетрадях камеру и вернуться до темноты."
 HSM_BAR_recover_science:0 "Восстановить исследовательский архив"
 HSM_BAR_recover_science_desc:0 "Подписи на полях и уцелевшие чертежи позволят отделить повторяемые опыты от личных тайн магократов. Научным группам предстоит проверить найденное своими силами."
 HSM_BAR_reclaim_fields:0 "Вернуть первые участки под посев"
 HSM_BAR_reclaim_fields_desc:0 "Наблюдения за породой и растениями позволили наметить безопасную полосу у Ольхового Брода. Работы будут идти от ручья к старым межевым камням."
 HSM_BAR_heal_homeland:0 "Завершить программу восстановления земли"
 HSM_BAR_heal_homeland_desc:0 "Речные образцы помогли исправить очистку воды, а исследования амулета и защитных контуров показали, как сохранить возвращённые участки. Теперь можно распространить проверенные меры на остальные подконтрольные земли Баррада."
 HSM_BAR_recovering_soil:0 "Земля под наблюдением"
 HSM_BAR_recovering_soil_desc:0 "Первые участки вновь пригодны для жизни, но за межевыми знаками сохраняются опасные явления."
 HSM_BAR_service_founded:0 "Учреждена Служба сдерживания и сохранения"
 HSM_BAR_republic_transition:0 "Продолжается переход к Республике"
 HSM_BAR_public_survey_open:0 "Комиссия разрешила обследование земли"
 HSM_BAR_survey_recorded:0 "Первая съёмка выявила след лаборатории"
 HSM_BAR_cabinet_open:0 "Запертый кабинет обследован"
 HSM_BAR_records_decoded:0 "Первичные записи расшифрованы"
 HSM_BAR_recovered_archives:0 "Научный архив Пентархии восстановлен и проверен"
 HSM_BAR_first_descent_open:0 "Подготовлена первая экспедиция под шахту"
 HSM_BAR_first_descent_returned:0 "Получено сообщение первой поисковой группы"
 HSM_BAR_first_incident_resolved:0 "Принято решение о спасении поисковой группы"
 HSM_BAR_land_partly_healed:0 "Завершено восстановление первых полей"
 HSM_BAR_land_healed:0 "Завершена программа восстановления подконтрольной родины"
 HSM_BAR_village_councils:0 "Созваны сельские советы"
 HSM_BAR_relief_houses:0 "Открыты дома помощи"
 HSM_BAR_global_authorized:0 "Разрешена подготовка глобальной нормализации"
 hsm_bar_republic.1.t:0 "Площадь после костра"
 hsm_bar_republic.1.d:0 "На площади ещё пахнет гарью. Кто-то предлагает разобрать ограду поместья на дрова; кто-то требует найти списки пропавших прежде, чем сгорит остальная бумага. Капитан Гасеница не приказывает расходиться. Впервые за долгие годы спорят не о том, как исполнить волю графа, а о том, кто вправе решать за остальных.\n\nМихал Завиша занимает стол в бывшей приёмной сборщика податей. На двери он оставляет старую табличку, перевернув её чистой стороной наружу. К вечеру там появляется слово «Республика». В соседней комнате Марта Кшемень принимает больных. За пределами площади страна всё ещё принадлежит голоду, разбитым дорогам и тому, что осталось под землёй."
 hsm_bar_republic.1.a:0 "Нужно пережить первую зиму."
 hsm_bar_republic.2.t:0 "Земля под межевым камнем"
 hsm_bar_republic.2.d:0 "Землемеры из Ольхового Брода не вернулись к ужину. Ядвига Врона нашла их у старого межевого камня: все трое стояли на коленях и слушали землю. Один утверждал, что слышит колесо отцовской мельницы; другой слышал собственное дыхание, хотя задерживал его.\n\nВрона отвела их за ручей. Звук оборвался. В мешке одного из землемеров лежала отколовшаяся крупица, обмотанная платком. Под тканью что-то медленно меняло форму. Прикреплённая к камню медная пластинка несла номер лаборатории графа."
 hsm_bar_republic.2.a:0 "Найти журнал этой лаборатории."
 hsm_bar_republic.3.t:0 "Чужая подпись"
 hsm_bar_republic.3.d:0 "Северин Ольха не сразу согласился разобрать тетради. На первой странице стояла подпись Амброзия; на последующих записи переходили в более мелкий почерк. Ольха сказал, что это рука давно умершего помощника. Марта заметила, как он ставит ту же редкую черту над сокращением.\n\nВнутри оказались не только способы воздействия. Между перечёркнутыми опытами был план остановки одного из них. Последняя страница вырвана. На полях уцелела фраза: «Если снизу ответят прежде вас, не…»"
 hsm_bar_republic.3.a:0 "Пока он нужен нам живым и за этим столом."
 hsm_bar_republic.4.t:0 "Третий голос"
 hsm_bar_republic.4.d:0 "Из нижней выработки ответили голосом Марты. Сама Марта стояла у подъёмника, прижав копыто ко рту. Врона дёрнула сигнальный трос: внизу оставались двое рабочих и ящик с единственным сохранившимся измерителем графа. Подъёмник мог взять всех, если оставить ящик.\n\nОльха смотрел на стрелку прибора наверху. Она двигалась в такт голосу снизу. Он попросил ещё минуту. Врона уже развязала страховочную петлю, чтобы спуститься самой."
 hsm_bar_republic.4.a:0 "Оставить прибор. Поднимать рабочих."
 hsm_bar_republic.4.b:0 "Ещё одно измерение, затем немедленно наверх."
 hsm_bar_republic.5.t:0 "Четверо в закрытой палате"
 hsm_bar_republic.5.d:0 "Завиша считает, что комиссия Кшемень занимается отравленными колодцами. Так написано в отчёте, который она подписала утром. Вечером в закрытой палате собираются четверо: врач, бывший помощник графа, командир поисковой группы и молчаливый смотритель шахт. За стеной спит рабочий, который всё ещё отвечает на вопросы раньше, чем их задают.\n\nОни договариваются не возвращать находки на обычные склады и не отдавать тетради тем, кто ищет новое оружие. На обложке первого общего дела Ольха пишет S.C.P. Марта просит сперва записать фамилии тех, кого они обещают вернуть домой."
 hsm_bar_republic.5.a:0 "Служба сдерживания и сохранения."
 hsm_bar_republic.6.t:0 "Первый хлеб"
 hsm_bar_republic.6.d:0 "В Ольховом Броде снова мелют своё зерно. Врона ломает ещё горячую корку и замечает, что Марта смотрит не на хлеб, а на детей у печи. Весной двое из них не могли выйти из дома без приступа кашля.\n\nЗа новым межевым знаком остаётся полоса серой травы. Работники соблюдают нанесённую по результатам опытов границу. Дальше тот же способ не действует. Ольха нашёл на обороте старого плана название иностранного места и чужую печать. Марта прячет лист, когда к столу подходит Завиша."
 hsm_bar_republic.6.a:0 "Найти того, кто поставил эту печать."
 hsm_bar_republic.7.t:0 "Открытые окна"
 hsm_bar_republic.7.d:0 "В школе Ольхового Брода сняли доски с окон. Учительница Зося принесла старый список учеников: некоторые имена придётся перенести на отдельную страницу. Возвращение земли не возвращает всех, кто на ней жил.\n\nПод порогом осталась защитная пластина, изготовленная по результатам исследований в Барраде и Речных землях. Её проверяют каждый месяц. Для Завиши это одна из инженерных мер восстановления. Для Марты это доказательство, что некоторые чудеса следует не уничтожать, а беречь. Ольха стоит у открытого окна и долго не решается войти."
 hsm_bar_republic.7.a:0 "Это и было нашей первой задачей."
 hsm_bar_republic.8.t:0 "Тетради, которые пережили хозяев"
 hsm_bar_republic.8.d:0 "Ольха разделил уцелевшие записи на четыре стопки. Алхимические таблицы Асинти покрыты поправками; схемы Леопольда иногда можно проверить обычным инструментом. В записях Вииры наблюдатель становится частью опыта. Там, где начинаются работы Сильвер Стара, Марта останавливает чтение и просит составить отдельный перечень погибших.\n\nАрхивисты не восстановили голоса своих учителей. Они восстановили достаточно записей, чтобы спорить с ними. На первых копиях нет герба графа."
 hsm_bar_republic.8.a:0 "Продолжить работу, сохранив имена погибших."
 hsm_bar_republic.9.t:0 "Кому принадлежит поле"
 hsm_bar_republic.9.d:0 "У Завиши две карты одного участка. На старой стоит имя семьи, изгнанной при графе. На новой другая семья, которую силой переселили туда десять лет назад. Обе пришли на собрание с детьми. Обе уверены, что Республика обещала вернуть им дом.\n\nГасеница отказывается решать спор приказом гарнизона. Можно дождаться разбирательства сельского совета или дать нынешним жителям временное право на посев, не закрывая требования прежних владельцев."
 hsm_bar_republic.9.a:0 "Совет должен выслушать обе семьи."
 hsm_bar_republic.9.b:0 "Разрешить посев до окончательного решения."
 hsm_bar_republic.10.t:0 "Пациент из пустого дома"
 hsm_bar_republic.10.d:0 "Марта принимает жеребёнка, которого привели из заброшенного дома у шахты. Он называет себя именем взрослого рабочего, пропавшего до его рождения. Мать просит никому об этом не говорить: сосед уже предложил позвать тех, кто недавно расправился с магократами.\n\nМарта оставляет ребёнка в обычной палате. В записи для комиссии указана лихорадка. В личной тетради она впервые оставляет место для другого диагноза."
 hsm_bar_republic.10.a:0 "Закрыть палату для посторонних, не для семьи."
