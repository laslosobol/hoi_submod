 HSM_CSS_Filter_tt:0 "§YEquestria at War: Expanded Stories§!\n\n\n\n\n\n\n£GFX_HSM_CSS_stories_intro\n\n\n\n\n\n\n\n§LЗа громкими именами императоров остаются истории тех, кто жил на окраинах их державы. В Цианолизии графиня правит чужой землёй, пока за проливом готовятся вернуть утраченное. В Верении Дома Эри и Эйри продолжают старую вражду, а Авиан ищет своё место между соседями. Их подданные ждут не новых притязаний, а школ, дорог и мира. Теперь, когда прежний порядок рушится, даже небольшому владению предстоит решить, каким будет его будущее. Одни границы исчезнут за столом переговоров, другие придётся пройти с оружием. Но последнюю страницу этой истории ещё никто не написал.§!"
 HSM_CSS_CYA_DESC:0 "\n\n\n\n\n\n\n\n£GFX_HSM_CSS_CYA_map\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nВдали от Грифенхейма графиня пытается удержать пограничную страну, разделённую завоеванием и недоверием. За проливом Астерион готовится вернуть утраченное. Старый имперский порядок уже мало кого способен защитить, но его крушение может привести на берега Цианолизии неожиданных гостей. Построит ли графиня собственную державу, доверится опасному союзнику или подарит Империи новое начало?"
 HSM_CSS_ERI_DESC:0 "\n\n\n\n\n\n\n\n£GFX_HSM_CSS_ERI_map\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nРеволюция расколола Верению, а вражда уцелевших Домов не позволила ей воссоединиться. Притязания герцога Винсента старше солдат, которые теперь охраняют его границу; деревни всё ещё ждут дорог, школ и мира. Эри предстоит решить, можно ли договориться о едином герцогстве или его придётся завоевать. Но убрать пограничные столбы недостаточно: страной по обе стороны старой границы ещё нужно научиться управлять."
 HSM_CSS_EYR_DESC:0 "\n\n\n\n\n\n\n\n£GFX_HSM_CSS_EYR_map\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nГерцог Иовинус привык не доверять обещаниям из-за границы. Солдаты Эйри защищают спорное наследство, но бдительность не наполнит амбары и не приведёт учителей в забытые деревни. Соглашение с Эри потребует гарантий, способных пережить очередную ссору; победа потребует решить судьбу побеждённых. Между этими путями остаётся надежда, что Верения снова станет страной, а не бесконечным спором её правителей."
 HSM_CSS_AVI_DESC:0 "\n\n\n\n\n\n\n\n£GFX_HSM_CSS_AVI_map\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nЛеди Катрина уберегла свои владения от распри Эри и Эйри, но обособление не устранило разногласий внутри Авиана. Города говорят на разных языках, старые привилегии сохраняются, а за границами возвышаются две великие державы. Остаться в стороне означает искать безопасность без гарантий. Открыть страну переменам значит допустить реформы и общее веренское будущее, если соседи научатся слушать прежде, чем приказывать."
