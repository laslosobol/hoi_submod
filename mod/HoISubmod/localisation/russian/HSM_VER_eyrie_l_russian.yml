l_russian:
 HSM_EYR_the_price_of_vigilance:0 "Цена бдительности"
 HSM_EYR_the_price_of_vigilance_desc:0 "Иовинус Эйри сделал постоянную готовность условием выживания. Но чрезвычайные приказы продлевают снова и снова, солдат дают одни и те же деревни, а ведомости обещают войска, которых проверка не всегда находит. Прежде чем выбрать соглашение с Эри или поход против его притязаний, герцог должен понять, чего стране стоила его бдительность и на что действительно способна армия."
 HSM_EYR_audit_the_muster:0 "Люди за цифрами"
 HSM_EYR_audit_the_muster_desc:0 "Имя в строевом списке может означать солдата, уволенного ветерана или отсутствие, которое никто не решился объяснить. Иовинусу предстоит определить, кто будет задавать вопросы. Местные представители захотят узнать судьбу людей, отправленных их деревнями; армейская комиссия будет настаивать, что проверка является делом службы. И тем и другим придётся начать с подсчёта тех, кто действительно в строю."
 HSM_EYR_montagues_correspondence:0 "Переход Монтага"
 HSM_EYR_montagues_correspondence_desc:0 "Монтаг Эйри, граф Верении, хочет навестить Розалин Эри из Бентри. Офицеры видят маршрут через враждебные позиции; он видит дорогу к той, общества которой ему не хватало. Иовинус может обеспечить проезд, не определяя цель встречи. Пусть они говорят за себя. Семейная связь способна открыть путь к соглашению, но не должна обернуться навязанным браком ради избавления герцогов от неудобного разговора."
 HSM_EYR_reciprocal_frontier:0 "Отозвать участников набегов"
 HSM_EYR_reciprocal_frontier_desc:0 "Войска проверены, Монтаг проложил личный путь через разделяющую дома границу, гарантии готовы. Теперь Иовинус может приказать офицерам отказаться от оправданий, превращающих любой набег в меру предосторожности. Такая же сдержанность свяжет Эри. Перемирие станет основанием постоянного урегулирования, а не годовым отпуском от вражды."
 HSM_EYR_inspect_both_sides:0 "Дороги между домами"
 HSM_EYR_inspect_both_sides_desc:0 "Инженеры годами отмечали мосты для подрыва. Теперь им предстоит выяснить, какие снова выдержат обычное движение. Нужно обследовать подъезды, сопоставить доступные материалы и сделать пограничные дороги проезжими без армии, заранее обеспечивающей проход. Полученные знания послужат и нашим дорогам, и урегулированию с Эри."
 HSM_EYR_publish_the_rules:0 "Гарантии и для нашего командования"
 HSM_EYR_publish_the_rules_desc:0 "Проверка войск показала Иовинусу возможности армии. Поездка Монтага напомнила, что не каждый переход границы должен быть операцией. До заключения перемирия нужно выбрать опору его обещаний: смешанные патрули с правом задавать вопросы обоим командованиям или фонд возмещения, признающий ущерб и рассматривающий имущественные требования. Оба пути потребуют от герцога сдержать собственных сторонников. Только после этого можно требовать того же от Винсента."
 HSM_EYR_friendship_with_safeguards:0 "Дружба с гарантиями"
 HSM_EYR_friendship_with_safeguards_desc:0 "Открытая переправа заставила усомниться в привычных пограничных порядках. Договор прекратит официальное соперничество и взаимные притязания, позволявшие обоим домам называть независимость соседа провокацией. Иовинус сохранит свою армию и правительство. Взамен он получит мир, которому больше не нужна перспектива победы, чтобы оправдать своё существование."
 HSM_EYR_limits_of_command:0 "Где кончается власть командования"
 HSM_EYR_limits_of_command_desc:0 "Надёжной армии нужен ясный перечень того, что она вправе требовать от защищаемой страны. Местные советы хотят иметь голос, когда реквизиция забирает последнюю повозку. Офицеры отвечают, что командование не может обсуждать каждый приказ на сельском сходе. Иовинусу предстоит установить, кто выслушает возражение и кто заставит армию уважать ответ."
 HSM_EYR_a_seat_for_avian:0 "Сближение через Intergigantes"
 HSM_EYR_a_seat_for_avian_desc:0 "Intergigantes вывел Авиан из изоляции. Иовинус может предложить больше, чем кресло наблюдателя: договорное место в объединённой Верении. Начнём с судов, коллегий и городских хартий. Кто будет управлять общей страной, определит отдельный акт о присоединении; Катрина должна прочитать его прежде, чем подписывать."
 HSM_EYR_a_charter_we_can_sign:0 "Хартия, которую мы можем подписать"
 HSM_EYR_a_charter_we_can_sign_desc:0 "Предложим Эри равноправный совет с определёнными обязанностями, общими судами и возможностями практического сотрудничества. Винсент может принять устройство, попросить строго ограниченное председательство или отказаться. Его должность потребует нашего прямого согласия и не даст власти над Эйри. Иовинусу предстоит решить, какие общие полномочия он сможет уважать после завершения конгресса."
 HSM_EYR_officers_at_one_table:0 "Офицеры за одним столом"
 HSM_EYR_officers_at_one_table_desc:0 "Общему штабу предстоит превратить привычные подозрения в вопросы, на которые можно ответить над картой. Интенданты сопоставят планы, а связисты будут учиться передавать донесения через прежнюю границу. Иовинус требует, чтобы каждый офицер знал, что вправе обещать сам и когда обязан обратиться к правительству, которому служит."
 HSM_EYR_shared_workshops:0 "Чертежи для общего дела"
 HSM_EYR_shared_workshops_desc:0 "Одна и та же запасная деталь не должна требовать разных чертежей по обе стороны границы. Поручим техническим службам хартии сопоставить спецификации и производственные методы. Общие службы помогут мастерским участников, а инженеры Эйри получат возможность развить промышленные знания. Полезное сотрудничество может начаться с детали, которая подходит на своё место."
 HSM_EYR_the_return_order:0 "Приказ вернуть"
 HSM_EYR_the_return_order_desc:0 "Гражданские мастерские, реквизированные для пограничной армии, получили распоряжения об освобождении. Командование отказалось их передать. Офицеры ссылаются на боеготовность, однако власть, разрешившая реквизиции, установила и их пределы. Иовинусу придётся обеспечить соблюдение этих пределов собственной армией либо защитить её ценой доверия к хартии."
 HSM_EYR_a_defence_agreement:0 "Оборона по соглашению"
 HSM_EYR_a_defence_agreement_desc:0 "Штаб может составить общий план, но не вправе обещать чужих солдат. Иовинус предложит Эри оборонительный союз с обязательствами, достаточно ясными для первой тревоги на границе. Прежние союзы должны соблюдаться, а за Авиан Катрине придётся ответить от собственного имени. Пока правительства обсуждают подписи, офицеры могут готовить карты."
 HSM_EYR_workshops_returned:0 "Мастерские возвращаются к работе"
 HSM_EYR_workshops_returned_desc:0 "Возвращённый ключ лишь начало. Гражданскому производству нужны пригодные помещения, исправное оборудование и рабочие, способные строить планы дольше, чем до следующей реквизиции. Строительное ведомство осмотрит возвращённые армией здания и выслушает сметы хозяев. Обещанная к возврату мастерская должна вновь стать местом, где можно заработать на жизнь."
 HSM_EYR_a_border_without_orders:0 "Граница без чрезвычайных приказов"
 HSM_EYR_a_border_without_orders_desc:0 "Армия продолжит защищать страну. Её задача станет яснее, когда каждый груз, мастерская и поездка перестанут постоянно находиться в её распоряжении. Надёжное урегулирование даст Иовинусу партнёров, чьё согласие имеет вес, и солдат, чьи полномочия ограничены договорённостью. Граница должна быть достаточно безопасной, чтобы обычные дела обходились без разрешения штаба."
 HSM_EYR_neighbours_without_a_council:0 "Собственные дела Эйри"
 HSM_EYR_neighbours_without_a_council_desc:0 "Общее урегулирование сорвалось. Отказ мог прозвучать до перемирия, перед договором или на последнем конгрессе; правительство за границей могло утратить возможность исполнить своё слово. Ничто из этого не починит дорогу в Эйри. Мы соблюдём сохранившиеся соглашения, не приписывая себе никогда не существовавших, и направим восстановление на собственную страну. Иовинус обещал искать безопасность без завоеваний. Неудобный ответ не отменяет его выбора."

 HSM_EYR_accountable_muster:0 "Подотчётный учёт личного состава"
 HSM_EYR_accountable_muster_desc:0 "Проверять списки теперь могут и за пределами казарм. Местные записи должны сходиться со служебными ведомостями, а пропуски требуют ответа. Достоверный учёт ускоряет мобилизацию и укрепляет стабильность, но его поддержание постоянно отнимает часть политических сил правительства."
 HSM_EYR_officers_confidence:0 "Доверие офицеров"
 HSM_EYR_officers_confidence_desc:0 "Армейская комиссия отвечает за исправление списков. Профессиональный разбор облегчает подготовку войск и улучшает организацию, укрепляя уверенность офицеров в службе. Однако закрытость проверки тревожит тех, чьи возражения остаются за воротами казарм, и ослабляет общественное спокойствие."
 HSM_EYR_civic_scrutiny:0 "Гражданский контроль обороны"
 HSM_EYR_civic_scrutiny_desc:0 "Местные представители получили признанное право проверять оборонные требования. Более обоснованные поставки снижают расход снабжения, а доверие к процедуре укрепляет стабильность. Регулярная отчётность требует политических усилий каждый день, даже когда непосредственной угрозы на границе нет."
 HSM_EYR_professional_command:0 "Командование с определёнными обязанностями"
 HSM_EYR_professional_command_desc:0 "Профессиональное командование поддерживает боеготовность в установленных пределах. Чёткое распределение ответственности ускоряет планирование и улучшает организацию армии. Офицеры должны учитывать, что военная компетентность включает понимание того, когда истекают чрезвычайные полномочия."
 HSM_EYR_exceptional_requisitions:0 "Реквизиции без срока возврата"
 HSM_EYR_exceptional_requisitions_desc:0 "Герцог защитил отказ командования вернуть гражданские мастерские. Сохранённые мощности повышают военный выпуск, но подрывают стабильность и увеличивают потребность в гражданских товарах. Все общие преимущества хартии приостановлены. Отмена приказа устранит нарушение Эйри; для восстановления преимуществ потребуется также отменить отдельное исключение Эри, если оно сохраняется."

 HSM_EYR_diplomatic_business:0 "Дела после урегулирования"
 HSM_EYR_diplomatic_business_desc:0 "Пограничное урегулирование не заканчивается подписями. Гражданские мастерские нужно вернуть, общие правила должны связывать командование, а военное сотрудничество требует согласных на него партнёров. Нашему правительству предстоит исполнить принятые обязательства. Неудачная конференция не требует новой череды оставшихся без ответа приглашений."
 HSM_EYR_reopen_armistice:0 "Взаимные пограничные условия"
 HSM_EYR_reopen_armistice_desc:0 "Сдержанность должна связывать обе армии. Условия определяют полномочия патруля и порядок рассмотрения жалоб, а не частоту отправки посланников за границу."
 HSM_EYR_reopen_treaty:0 "Имущество за притязаниями"
 HSM_EYR_reopen_treaty_desc:0 "Постоянное урегулирование должно отличать право семьи на возмещение от притязания правителя на чужую страну. Согласованные гарантии придают этому различию практический смысл."
 HSM_EYR_reopen_charter:0 "Полномочия, которыми можно поделиться"
 HSM_EYR_reopen_charter_desc:0 "Общему совету нужны полномочия, которые оба дома готовы передать. Если согласие невозможно, отдельные правительства всё ещё способны соблюдать тот мир, который они действительно заключили."
 HSM_EYR_invite_avian_again:0 "Самостоятельный голос Авиана"
 HSM_EYR_invite_avian_again_desc:0 "Наблюдатель Авиана должен свободно высказываться и свободно оставаться вне хартии. Ни его присутствие, ни пустое кресло не заменят согласия Эри и Эйри на собственное урегулирование."
 HSM_EYR_withdraw_requisitions:0 "Отменить чрезвычайные реквизиции"
 HSM_EYR_withdraw_requisitions_desc:0 "Владельцы мастерских вновь принесли распоряжения, которые командование отказалось исполнить. Иовинус потребует вернуть ключи и отчитаться за удержанные станки. Донесения о боеготовности не отменяют обещаний с его собственной печатью. Эйри должен ответить за это нарушение, прежде чем требовать от другого дома верности слову."
 HSM_EYR_propose_defence:0 "Вернуться к оборонительному соглашению"
 HSM_EYR_propose_defence_desc:0 "Офицеры сохранили общие планы, хотя правительства не договорились о союзе. Иовинус спросит Эри, какие обязательства тот теперь готов принять. Прежним соглашениям с другими союзниками тоже место за столом переговоров, а участие Авиана потребует письма Катрине, а не кресла, занятого без её ответа."

 HSM_EYR_inspection_bonus:0 "Инженерное обследование пограничья"
 HSM_EYR_support_bonus:0 "Опубликованные пограничные процедуры"
 HSM_EYR_signals_bonus:0 "Связь между штабами"
 HSM_EYR_industry_bonus:0 "Совместимые производственные стандарты"
 HSM_EYR_reconstruction_bonus:0 "Методы гражданского восстановления"
 HSM_EYR_armistice_offer_tt:0 "Предлагает Эри перемирие. Эри может подписать его, потребовать совместных проверок или отказать. Договорное урегулирование действует до войны или договора о дружбе; временное перемирие вне этого пути длится 365 дней."
 HSM_EYR_treaty_offer_tt:0 "Предлагает Эри дружбу. Эри может подписать договор, потребовать имущественного арбитража или отказать. Ратификация прекращает соперничество, проверки и взаимные территориальные притязания; оба дома сохраняют независимость."
 HSM_EYR_charter_offer_tt:0 "Предлагает Эри равноправный совет. Эри может согласиться, запросить ограниченное председательство или отказать. Встречное условие требует согласия Эйри; Авиан решает вопрос членства отдельно."
 HSM_EYR_defence_offer_tt:0 "Запрашивает согласие Эри на военное соглашение. Действующий союз домов сохраняет руководство; новый союз следует инициативе Эйри. Авиан должен согласиться отдельно."
 HSM_EYR_requisition_case_tt:0 "Иовинус должен ответить на отказ командования вернуть гражданские мастерские. Принуждение к возврату стоит политической власти. Защита отказа §Rприостанавливает все преимущества хартии§! до отмены реквизиционного исключения Эйри и любого самостоятельного исключения Эри."
 HSM_EYR_no_unresolved_exception_tt:0 "Не осталось ни неурегулированных чрезвычайных реквизиций Эйри, ни монаршего исключения Эри."

 hsm_ver_eyrie.1.t:0 "К чему мы готовы?"
 hsm_ver_eyrie.1.d:0 "Утренняя сводка объявляла границу готовой к любым испытаниям. Иовинус спросил, сколько это означает солдат. Адъютант назвал число, а затем другое, когда герцог уточнил, сколько удастся собрать до вечера. Интендант пояснил: разница включает прикомандированных, ожидающих снаряжения и записи, которые ещё предстоит исправить.\n\nЗа дверью перевозчик ждал возвращения повозки, взятой по чрезвычайному приказу. Приказ продлевали так часто, что писарь перестал указывать новую причину на полях.\n\nИовинус не собирался оставлять страну без защиты. Его права на Верению были ничуть не слабее прав Винсента, и он знал, чем привлекает чужое внимание слабость. Но командир обязан понимать собственные цифры. Герцог приказал принести исходные списки вместе с незакрытыми реквизициями. Прежде чем требовать очередного заверения в готовности, он проверит заверения, которые уже лежат у него на столе."
 hsm_ver_eyrie.1.a:0 "Принесите записи, на которых основаны эти цифры."
 hsm_ver_eyrie.2.t:0 "Пустое место в строю"
 hsm_ver_eyrie.2.d:0 "На смотре сержант выкрикнул имя и не получил ответа. Ротный писарь нашёл его в прошлой ведомости, затем в позапрошлой. Деревенская запись сообщала, что солдат уволен со службы. В другом месте между двумя счетами исчезли те, кто продолжал служить.\n\nОфицеры хотели армейскую комиссию. Её участники понимали бы переводы, прикомандирования и разницу между ложным донесением и опоздавшим. Такая проверка могла улучшить профессиональную работу, не превращая каждое военное объяснение в публичное выступление.\n\nГражданский писарь спросил, как деревня сможет оспорить повинность, если ей никогда не показывают список. Открытый разбор потребует политических усилий и обяжет службу отвечать на неудобные вопросы за пределами собственной вертикали. Иовинус снова посмотрел на пустое место в строю. Кому-то предстояло за него ответить; герцогу нужно было решить, перед кем именно придётся давать этот ответ."
 hsm_ver_eyrie.2.a:0 "Открыть списки для публичной проверки."
 hsm_ver_eyrie.2.b:0 "Поручить проверку ведомостей армейской комиссии."
 hsm_ver_eyrie.3.t:0 "Без указаний для ответа"
 hsm_ver_eyrie.3.d:0 "Монтаг Эйри, граф Верении, застал офицера охраны за размышлением, нужна ли личному письму вторая печать. Розалин Эри из Бентри спрашивала о поездке. Предлагаемый маршрут проходил через места, которые штаб по-прежнему описывал главным образом как подступы и сектора обстрела.\n\nИовинус заметил, что обмен между двумя представителями знатных родов мог бы оказаться полезным. Монтаг ответил осторожно: их интерес друг к другу уже принадлежал им самим. Переписка ради удовлетворения двух дворов скоро перестанет быть перепиской, которую хочется продолжать.\n\nГерцог понимал возражение лучше, чем был готов признать. Ему требовалась надёжная возможность сближения, но превращение письма в средство политики лишь заставит автора скрыть следующее. Он разрешил передачу без указаний для ответа. Офицеры могли обеспечить безопасность дороги. Решать, что путешественники должны значить друг для друга, им никто не поручал."
 hsm_ver_eyrie.3.a:0 "Обеспечьте проезд. Слова оставьте им самим."
 hsm_ver_eyrie.4.t:0 "Мост, который должен устоять"
 hsm_ver_eyrie.4.d:0 "На старом плане слабые места моста отмечались красным. На новом по тем же отметкам считали, где нужны дерево и камень. Офицер, когда-то готовивший подрыв, наблюдал, как инженер прикладывает линейку к чертежу.\n\nПеревозчик спросил, когда можно будет проехать по дальнему подъезду. Интендант начал объяснять его военное значение и осёкся. Вопрос касался гружёной повозки, а не наступающего полка. Они пересчитали балки и отправили рабочих проверить водопропускную трубу.\n\nПеремирие сделало поездку возможной. Чтобы сделать её обычной, требовалась работа. Впервые за много лет инженеров Эйри спрашивали, сколько простоит пограничный мост, а не как быстро они смогут его разрушить."
 hsm_ver_eyrie.4.a:0 "Передайте план строителям."
 hsm_ver_eyrie.10.t:0 "Кто объявит чрезвычайное положение оконченным?"
 hsm_ver_eyrie.10.d:0 "В проекте совета обнаружилась трудность, которую не разрешит пограничная карта. Армия имела право готовиться к опасности. Кто мог указать ей, что отдельное требование больше не служит этой цели?\n\nГражданский представитель принёс график работы мастерской, постоянно прерываемой реквизициями. Делегат командования принёс план снабжения, сроки которого зависели от тех же станков. Оба документа описывали необходимую работу. Привычный приоритет армии решил бы каждый спор раньше, чем другую сторону успели выслушать.\n\nИовинус мог учредить гражданский контроль обороны, дав местным представителям постоянный голос и приняв политический труд ответа на их вопросы. Или поручить определённые обязанности профессиональному командованию, возложив на офицеров ответственность за готовность в согласованных пределах. Ни одно устройство не отменяло защиты границы. Предстояло решить, будет ли страна участвовать в проверке военных требований или доверит службе самой поддерживать необходимую дисциплину."
 hsm_ver_eyrie.10.a:0 "Признать право на гражданский контроль."
 hsm_ver_eyrie.10.b:0 "Закрепить обязанности профессионального командования."

 hsm_ver_eyrie.30.t:0 "Ключи остаются в штабе"
 hsm_ver_eyrie.30.d:0 "Управляющий мастерской пришёл с приказом об освобождении здания и вернулся без ключей. Командование признало помещение незаменимым для боеготовности. Станки продолжали выпускать военную арматуру; офицеры утверждали, что замена мощностей займёт время, которого обстановка на границе может не дать.\n\nНикто не отрицал пользу мастерской для армии. Приказ касался её права удерживать помещение бессрочно. Гражданские заказы ждали, от их возобновления зависела плата работникам, а ограничения хартии должны были действовать и тогда, когда мешали службе.\n\nИовинус выслушал офицеров лично. Годами они считали предосторожность достаточным объяснением и ждали, что герцог признает эту привычку верностью. Он мог обеспечить возврат, потратив влияние на принятие армией установленных пределов. Или защитить чрезвычайную реквизицию, приостановив общие учреждения, чьи обязательства офицеры тем самым отказывались соблюдать. Решение покажет, связывает ли приказ само командование, когда требует уступить."
 hsm_ver_eyrie.30.a:0 "Обеспечить возврат, несмотря на политическую цену."
 hsm_ver_eyrie.30.b:0 "Защитить чрезвычайные реквизиции командования."
 hsm_ver_eyrie.32.t:0 "Расписка в получении ключей"
 hsm_ver_eyrie.32.d:0 "Новый приказ возлагал на штаб обязанность вместо очередной отсрочки. Чрезвычайная реквизиция отменялась. Мастерскую следовало освободить, оборудование сверить, а передачу подтвердить подписью гражданского управляющего вместе с подписью ответственного офицера.\n\nИовинус дважды перечитал последнее предложение. Когда-то он считал донесение подчинённого достаточным доказательством исполнения приказа. На этот раз получатель здания также должен был сообщить, что ему действительно вернули.\n\nИсправление устраняло нарушение Эйри. Оно не могло оправдать самостоятельное исключение, которое ещё сохранял бы Эри: общим ведомствам всё ещё требовались обещания обоих домов, которым можно доверять. Армия сохранит свои надлежащие задачи и найдёт иной порядок необходимых поставок. Когда ключи прибыли в мастерскую, управляющий пересчитал их по расписке. Власть командования остановилась у двери, которую оно наконец согласилось открыть. Для гражданского получателя это оказалось самым убедительным предложением во всём длинном документе."
 hsm_ver_eyrie.32.a:0 "Подшить гражданскую расписку к донесению командования."
 hsm_ver_eyrie.40.t:0 "Ворота открываются вовремя"
 hsm_ver_eyrie.40.d:0 "Ворота открылись в час, написанный на доске. Часовой проверял бумаги перевозчика, пока армейская повозка ждала своей очереди позади. Здесь по-прежнему были караул, дежурный офицер и порядок сообщения об опасности. Обычному движению больше не требовалось придумывать военное оправдание собственного существования.\n\nИовинус получил утреннюю ведомость без прежнего заверения, будто каждая мера предосторожности незаменима. Цифры можно было проверять. Ограничения связывали оба командования. Освобождённая мастерская оставалась гражданской, даже если штаб сожалел о потере её станков.\n\nЗа границей Винсент правил Эри, независимым участником соглашения, чьё согласие имело такой же вес, как согласие Эйри. Общие учреждения позволяли направить разногласие на разбор прежде, чем приказ достигнет казарм. Иовинус по-прежнему правил Эйри и командовал его армией. Он признал, что сила включает исполненный приказ, который велит остановиться тем, кто привык отдавать приказы другим."
 hsm_ver_eyrie.40.a:0 "Защищать границу и возможность обычной жизни."
 hsm_ver_eyrie.41.t:0 "Работа в наших границах"
 hsm_ver_eyrie.41.d:0 "В бумагах конференции не оказалось общего урегулирования, которого добивался Иовинус. Они не могли обещать и того, что за границей сохранится правительство, с которым встречались его посланники. Когда вошёл мастер, герцог отложил бумаги.\n\nМастеру требовалось решение о школе и дороге, обслуживающей её округ. Ни то ни другое не нуждалось в общем совете. Рабочие руки имелись; методы, разработанные во время переговоров, можно было применить. Не хватало разрешения начать.\n\nИовинус его дал. Существующие соглашения будут соблюдаться, пока сохраняют силу. Ни один офицер не получит новый поход лишь потому, что конгресс закончился неудачей. Безопасности Эйри по-прежнему нужна армия. Будущему нужна работа, которую армия за него не сделает."
 hsm_ver_eyrie.41.a:0 "Разрешить начало работ."

 hsm_ver_eyrie.110.t:0 "Эйри предлагает взаимную сдержанность"
 hsm_ver_eyrie.110.d:0 "Иовинус предлагает перемирие с одинаковыми приказами обоим пограничным командованиям. Винсент спрашивает офицеров, какие гарантии можно проверить, а не какие выражения кажутся им успокаивающими. Соглашение даст возможность подготовить постоянное урегулирование. Мы можем согласиться, настоять на совместных проверках или отказать. Обязательства Эйри не заменяют нашего решения связать собственные патрули."
 hsm_ver_eyrie.110.a:0 "Согласиться и отдать соответствующие приказы."
 hsm_ver_eyrie.110.b:0 "Потребовать совместных инспекций перед подписанием."
 hsm_ver_eyrie.110.c:0 "Эти условия пока не защищают наши интересы."
 hsm_ver_eyrie.111.t:0 "Винсент требует права проверки"
 hsm_ver_eyrie.111.d:0 "Винсент требует, чтобы проверяющие обоих домов совместно разбирали предполагаемые нарушения. Офицеры Эйри возражают против чужих вопросов к своим донесениям. Их собственные представители получат точно такое же право. Принятие условия требует политических усилий дома и позволит заключить перемирие. Оба двора будут поддерживать проверки при нём, до замены постоянным договором или прекращения самого перемирия. Отказ оставит предложение неподписанным."
 hsm_ver_eyrie.111.a:0 "Принять взаимные проверки и подписать."
 hsm_ver_eyrie.111.b:0 "Мы не можем принять это условие."
 hsm_ver_eyrie.112.t:0 "Согласованные инструкции"
 hsm_ver_eyrie.112.d:0 "Согласие Эри поступило в канцелярию. Копии перемирия направляются на заставы с одинаковыми распоряжениями для обоих командований. Офицеры должны объяснить ограничения каждому патрулю, а не полагаться на слухи о переговорах, услышанные часовым. Наследственный спор ещё предстоит разрешить постоянным договором. Теперь у патрулей есть приказ о том, чего нельзя делать от его имени."
 hsm_ver_eyrie.112.a:0 "Проследить, чтобы каждый пост получил экземпляр."
 hsm_ver_eyrie.113.t:0 "Нового соглашения о границе нет"
 hsm_ver_eyrie.113.d:0 "Предложение о перемирии не получило согласия Эри. Иовинус не может сказать часовым, что их защищает проект. Он может сказать собственным офицерам, что отказ не разрешает новый поход. Стране по-прежнему нужны обещанные правительством дороги и гражданские работы. Эти обязательства не требуют подписи Винсента."
 hsm_ver_eyrie.113.a:0 "Наши собственные обязательства остаются."
 hsm_ver_eyrie.119.t:0 "Срок переговоров о перемирии истёк"
 hsm_ver_eyrie.119.d:0 "Конференция закрылась без согласованного перемирия. Нельзя отправить проекты приказов на границу так, будто Эри их принял. Сохранившиеся прежние соглашения продолжают действовать на собственных условиях. Работа в границах Эйри может идти дальше без выдуманного успеха встречи."
 hsm_ver_eyrie.119.a:0 "Закрыть переговоры, не объявляя несуществующего согласия."
 hsm_ver_eyrie.120.t:0 "Иовинус предлагает дружбу с гарантиями"
 hsm_ver_eyrie.120.d:0 "Эйри предлагает завершить соперничество взаимными гарантиями и отказом от территориальных притязаний. Винсент видит ценность надёжной границы. Его советники спрашивают, что урегулирование даст семьям с купчими по другую её сторону. Мы вправе ратифицировать договор, потребовать обеспеченного средствами имущественного арбитража или отказать. Принятие даст Иовинусу обязанности, а не власть над домом Эри."
 hsm_ver_eyrie.120.a:0 "Ратифицировать взаимный договор о дружбе."
 hsm_ver_eyrie.120.b:0 "Потребовать согласованного разбора имущественных споров."
 hsm_ver_eyrie.120.c:0 "Мы не можем ратифицировать такое урегулирование."
 hsm_ver_eyrie.121.t:0 "Притязания, пережившие патруль"
 hsm_ver_eyrie.121.d:0 "Винсент подпишет договор, если согласованная комиссия сможет разбирать имущественные притязания. Наши офицеры привыкли считать владение у границы вопросом безопасности; гражданское право требует других доказательств. Согласие означает финансирование проверки и политические усилия для её поддержки. Отказ оставит договор незаключённым. Встречное условие Эри проверяет, способны ли наши гарантии защитить того, кто не носит мундира."
 hsm_ver_eyrie.121.a:0 "Обеспечить арбитраж и заключить договор."
 hsm_ver_eyrie.121.b:0 "Мы не можем принять такое обязательство."
 hsm_ver_eyrie.125.t:0 "Граница под защитой договора"
 hsm_ver_eyrie.125.d:0 "Договор ратифицирован. Дома отказались от взаимных территориальных притязаний и официальной враждебности, делавшей подозрительным обычное общение. Дороги и железнодорожные планы выигрывают от более надёжного мира. Иовинус по-прежнему отвечает за безопасность Эйри, а Винсент за управление Эри. Для любого общего учреждения потребуется ещё одно соглашение, которое обе стороны должны будут принять самостоятельно."
 hsm_ver_eyrie.125.a:0 "Сделать согласованные гарантии повседневной практикой."
 hsm_ver_eyrie.129.t:0 "Переговоры о договоре закончились без соглашения"
 hsm_ver_eyrie.129.d:0 "Переговоры о договоре завершились без ратификации. Сохраняющее силу перемирие действует на собственных условиях; неподписанный текст не позволяет объявить соперничество разрешённым. Иовинус выбрал путь, на котором неудобный ответ не становится основанием для завоевания. Теперь ему предстоит показать, что этот выбор даст своей стране: восстановление, полезные знания и гражданские работы, больше не ожидающие решения конференции."
 hsm_ver_eyrie.129.a:0 "Применим полезный опыт дома."
 hsm_ver_eyrie.130.t:0 "Эйри предлагает равноправный совет"
 hsm_ver_eyrie.130.d:0 "Иовинус предлагает общую хартию с равноправным советом. Винсент читает о полномочиях рядом с ограничениями их применения. Он может принять учреждения на этой основе, попросить для себя ограниченное председательство или отвергнуть хартию. Председательство потребует согласия Эйри и не даст наследственной власти над его правительством. Договор о дружбе не предрешает наш ответ."
 hsm_ver_eyrie.130.a:0 "Принять хартию и равноправный совет."
 hsm_ver_eyrie.130.b:0 "Попросить ограниченное председательство Эри."
 hsm_ver_eyrie.130.c:0 "Сохранить дружбу без этой хартии."
 hsm_ver_eyrie.131.t:0 "Председательское место для Винсента"
 hsm_ver_eyrie.131.d:0 "Эри подпишет хартию, если Винсент возглавит совет в пределах её ограниченных полномочий. Предложение не даёт власти над Эйри или наследственного права командовать Иовинусом. Однако один партнёр получит особую должность. Мы вправе принять такое устройство или завершить переговоры без хартии. Отказ в председательстве оставляет договор о дружбе в силе и сохраняет самостоятельность правительств."
 hsm_ver_eyrie.131.a:0 "Принять ограниченное председательство и ратифицировать."
 hsm_ver_eyrie.131.b:0 "Сохранить мир без согласия на эту хартию."
 hsm_ver_eyrie.132.t:0 "Полномочия согласованы, пределы записаны"
 hsm_ver_eyrie.132.d:0 "Под хартией стоят необходимые подписи. Чиновники начинают учреждать общие органы в соответствии с устройством, которое действительно приняли оба дома. Иовинус велел командованию получить копии ограничений вместе с положениями о сотрудничестве. Участие Авиана требует его собственного согласия. Соглашение уже связывает Эри и Эйри, не превращая одно правительство в подчинённого другого."
 hsm_ver_eyrie.132.a:0 "Разослать ограничения вместе с новыми обязанностями."
 hsm_ver_eyrie.139.t:0 "Конгресс не согласовал окончательный текст"
 hsm_ver_eyrie.139.d:0 "Конгресс завершился без общей хартии. Ни одна делегация не вправе превратить желаемые поправки во власть над другим домом. Прежние соглашения остаются обязательными лишь пока соблюдаются их собственные условия. Иовинусу предстоит строить будущее Эйри без общего совета и не делать его отсутствие оправданием новой войны."
 hsm_ver_eyrie.139.a:0 "Сохранить договор в силе, а проекты в архиве."
 hsm_ver_eyrie.140.t:0 "Эйри предлагает военные обязательства"
 hsm_ver_eyrie.140.d:0 "Иовинус предлагает оборонительный союз, расширяющий сотрудничество по хартии. В письме он спрашивает Винсента, кто ответит на призыв другого дома о помощи и какие обязанности готовы разделить армии. Статьи должны учитывать прежние союзные обязательства.\n\nШтабные офицеры приложили планы, но отвечать за них предстоит правительствам, чьи солдаты будут их исполнять. Винсент может принять приглашение Эйри или сохранить сотрудничество в пределах хартии."
 hsm_ver_eyrie.140.a:0 "Принять общие военные обязательства."
 hsm_ver_eyrie.140.b:0 "Сохранить хартию без этого военного соглашения."

 hsm_ver_eyrie.8.t:0 "Место Авиана на конгрессе"
 hsm_ver_eyrie.8.accepted.d:0 "Дом Авиан принял место наблюдателя. Иовинус просит включить порядок инспекций в бумаги для его делегации. Полезный наблюдатель должен видеть, как соглашение работает за пределами зала совета. Присутствие является одним решением; членство и дополнительные обязанности требуют собственного согласия Авиана. Эри и Эйри могут продолжать работу, теперь в присутствии ещё одного дома."
 hsm_ver_eyrie.8.d:0 "Наблюдатель Авиана не занимает места на этих переговорах. Секретарь убирает предварительную запись из списка и готовит бумаги для присутствующих делегаций. Иовинус надеялся, что ещё один знакомый голос поможет обсуждению. Однако двум домам предстоит самим ответить на взаимные возражения. Их договор и возможность согласовать хартию не зависят от участия Авиана."
 hsm_ver_eyrie.8.a:0 "Исходить из действительного согласия каждого дома."

 hsm_ver_eyrie.31.t:0 "Ответ Эйри собственному командованию"
 hsm_ver_eyrie.31.d:0 "Военный секретарь Винсента прочитал донесение Эйри вслух. Иовинус потребовал от офицеров исполнить приказ об освобождении гражданских мастерских. Возражение командования было выслушано, польза производства для обороны признана. Однако продлевать реквизицию одним повторением довода о её полезности ему не позволили.\n\nОфицер Эри спросил, не оставит ли это соседнюю армию без снабжения. Секретарь ответил, что её интендантам придётся пересмотреть расчёты. Правительство, принимающее ограничения, иногда вынуждено выполнять неудобную работу именно из-за них.\n\nВинсент запросил текст приказа для общего архива. Эйри представил свидетельство собственного соблюдения правил, не погасив никаких отдельных обязательств Эри. На следующих переговорах наши представители смогут обсуждать цену обещания, имея перед собой конкретный пример: командованию указали, где заканчиваются его полномочия. Для оценки надёжности соседа этот документ говорил больше, чем очередное уверение в том, что его офицеры всегда поступают разумно."
 hsm_ver_eyrie.31.dispute.d:0 "Донесение Эйри подтверждало сохранение мастерских под военной реквизицией. Иовинус защитил отказ офицеров освободить их. Доводы были знакомы и командованию Эри: снабжение необходимо, опасность сохраняется, а гражданский график не должен определять военную готовность.\n\nВинсент спросил, что тогда определяет окончание реквизиции. Секретарь не нашёл ответа в приказе. Без обязательного предела каждое заверение зависело от того, считает ли штаб его исполнение удобным в данный момент.\n\nОбщие ведомства остановили работы, гарантиями которых пренебрегло командование. Договор о дружбе сохраняет собственные условия; спор о полномочиях армии не обязан становиться новой пограничной кампанией. Наши делегаты требуют от Эйри отозвать исключение и признают, что Эри также должен ответить за собственные нарушения. Наш ответ отмечает нарушение и способ его исправить. Он предлагает Иовинусу условие, которое можно выполнить, вместо унижения, на которое пришлось бы отвечать."
 hsm_ver_eyrie.31.a:0 "Внести решение Эйри в общий архив."

 hsm_ver_eyrie.141.t:0 "Ответ Эри об общей обороне"
 hsm_ver_eyrie.141.accepted.d:0 "Эри принял военное соглашение. Правительства могут дополнить практическое взаимодействие штабов общими обязательствами. Подходящие объединения под руководством домов сохраняются; если нужен новый союз, его возглавляет Эйри. Авиан принимает решение об участии самостоятельно. Подпись определяет обязанности, которые действительно согласился принять Эри, а не поступки, которых мы хотели бы ожидать от каждого соседа."
 hsm_ver_eyrie.141.d:0 "Предложенное военное соглашение не получило согласия Эри. Правительство Винсента сохраняет собственные обязательства, а сотрудничество по хартии может продолжаться на прежних условиях. Иовинус приказал штабу сохранить подготовительные материалы. Полезный план не следует выбрасывать из-за неудачи политического соглашения; столь же недопустимо считать его разрешением связать обязательствами партнёра, который не пожелал их принять."
 hsm_ver_eyrie.141.a:0 "Передать штабу действительный итог переговоров."

