l_russian:
 HSM_BAR_service_capacity:0 "Незримая Служба"
 HSM_BAR_service_capacity_desc:0 "Республика открыто восстанавливает дороги и лечебницы. Её министры не знают, кто действует за этой работой. За обычными обследованиями стоят обученные агенты, шифровальщики и лаборатории, способные поддержать их далеко от Баррада. Это собственные навыки и учреждения Службы; знания о каждой аномалии добываются отдельно и остаются в материалах соответствующего дела. Одни сотрудники всё ещё лечат соседей, ради которых начинали. Другие уже мыслят совсем иными масштабами."
 HSM_BAR_common_reconstruction:0 "Страна за стенами дворца"
 HSM_BAR_common_reconstruction_desc:0 "Дворцовые описи перечисляют оснащённые лаборатории и полки книг. Они молчат о семьях, живущих на зерно в долг, и о селянах, которым нужен писарь, чтобы прочесть объявление. Прежде чем обещать новый Баррад, мы отправим учителей и сельских делегатов за стены дворца. Их сведения о продовольствии, жилье и школах заменят удобную выдумку, будто богатство и учёность Пентархии принадлежали всей стране."
 HSM_BAR_public_works:0 "Работа за плату"
 HSM_BAR_public_works_desc:0 "Первые дорожные бригады приходят с одолженными у соседей лопатами и едой на один день. На одних обещаниях страну не восстановить. Управление общественных работ наладит регулярную выплату жалованья, закупку местных материалов и ремонт переправ, без которых сёла отрезаны от рынков. Прежде чем отправить новую бригаду, каждый совет сможет проверить расходы."
 HSM_BAR_land_register:0 "Вернуть отнятые поля"
 HSM_BAR_land_register_desc:0 "Землю нельзя просто отдать тому, кто громче требует. Уцелевшие записи и свидетельства соседей помогут отделить конфискации от старых межевых споров. Землемеры отметят, какие участки пригодны для обработки, а какие ещё опасны. Признанное право на землю и возможность обжаловать решение позволят семьям сеять без страха, что очередной чиновник отнимет урожай."
 HSM_BAR_workshops:0 "Открыть деревенские мастерские"
 HSM_BAR_workshops_desc:0 "Первые заказы — на петли, насосы и лемехи. Пустующим кузницам нужно топливо, столярам — сухой лес, а тем и другим — платёжеспособные заказчики. Общая закупочная контора поможет небольшим мастерским встать на ноги. Первым признаком успеха станет деревня, которой больше не приходится неделями ждать ремонта сломанного насоса."
 HSM_BAR_neighbour_conference:0 "Письма за границу"
 HSM_BAR_neighbour_conference_desc:0 "Соседи знают Баррад по беженцам, набегам и слухам. Им нужны проверяемые гарантии. Но падение графа не должно стать приглашением разделить страну."
 HSM_BAR_technical_school:0 "Училище без посвящения"
 HSM_BAR_technical_school_desc:0 "Новое техническое училище будет обучать черчению, арифметике и поиску неисправностей в машинах, с которыми ученикам действительно предстоит работать. Для поступления не потребуются знак покровителя или тайная клятва. Подмастерья смогут учиться по вечерам, а преподаватели вместе со способными учениками займутся собственными опытами. Мастерским нужны те, кто понимает устройство машины, а не только помнит, какой рычаг нажать."
 HSM_BAR_border_watch:0 "Дозоры вместо набегов"
 HSM_BAR_border_watch_desc:0 "Офицеры должны знать, какую дорогу защищают и в каких сёлах нельзя проводить реквизиции. Ясные приказы помогут отличить пограничный инцидент от начала войны."
 HSM_BAR_magical_institute:0 "Гражданский институт магии"
 HSM_BAR_magical_institute_desc:0 "Повреждённая установка не станет безопасной оттого, что ей дадут благопристойное название. Институту нужны оборудованные помещения, подготовленные лаборанты и записи, по которым другой исследователь сумеет повторить опыт. Первые работы посвятят испорченной почве, загрязнённой воде и уцелевшим механизмам. Прежде чем разрешить возвращение на поле или открыть колодец, выводы придётся проверить."
 HSM_BAR_defence_stores:0 "Оборонный запас"
 HSM_BAR_defence_stores_desc:0 "Маленькая армия не может обнаруживать нехватку припасов уже во время вторжения. Военный завод наладит выпуск стандартных деталей и пополнение запасов, с которыми сельские мастерские не справятся в одиночку. Склады следует рассредоточить, а их содержимое — учесть. Солдатам нужно надёжное снаряжение, жителям окрестных сёл — порядок эвакуации на случай приближения фронта."
 HSM_BAR_reconstruction_accounts:0 "Отчёт о восстановлении"
 HSM_BAR_reconstruction_accounts_desc:0 "Одни обещания уже стали дорогами, другие остались строками в ведомости. Казначейство опубликует сведения о закупках, поставках и остановленных работах. Советы смогут оспорить невыплаченное жалованье и завышенные счета до заключения новых подрядов. Восстановление должно стать постоянным делом республики, а не чрезвычайным обстоятельством, оправдывающим любую неудачу."
 hsm_bar_core.1.t:0 "Палата без вывески"
 hsm_bar_core.1.d:0 "Кабинет Гасеницы одобрил ещё одно отделение для выздоравливающих. Гражданский администратор Михал Завиша хочет устроить его ближе к сёлам, чтобы больных могли навещать родные. Марта знает, почему Службе нужно другое здание: несколько пациентов отвечают на голоса из комнат, которые всем остальным кажутся пустыми.\n\nОна может найти отдельное помещение с собственным персоналом и снабжением, не проходящим через открытую больницу. Ольха предлагает приспособить комнаты, уже купленные министерством, скрыв их назначение за обычным ремонтом.\n\nЗавиша отметил на плане понравившийся участок. Рядом школа. Прежде чем ответить, Марта убирает план подальше от остальных бумаг."
 hsm_bar_core.1.a:0 "Организовать отдельное помещение и независимое снабжение."
 hsm_bar_core.1.b:0 "Незаметно приспособить пустующие комнаты министерства."
 hsm_bar_core.2.t:0 "Вернувшаяся пациентка"
 hsm_bar_core.2.d:0 "Пони, выведенная из разрушенной лечебницы, узнаёт сестру, но не комнату вокруг себя. Она всё спрашивает, зачем переставили окно. Марта завесила стекло: только так больная засыпает.\n\nРодные искали её несколько месяцев. Врона хочет сообщить им, что она жива, поселить поблизости и разрешить посещения под наблюдением, пока не выяснена причина её состояния. Для посещений понадобятся отдельная палата и правдоподобное объяснение ограничений.\n\nОльха просит пока не прерывать наблюдение. Женщина воспроизводит последовательность из повреждённой лабораторной тетради, но лишь когда думает, что рядом никого нет. Её сестра уже ждёт у открытой лечебницы."
 hsm_bar_core.2.a:0 "Обеспечить безопасные посещения и помощь семье."
 hsm_bar_core.2.b:0 "Продолжить наблюдение до допуска посетителей."
 hsm_bar_core.3.t:0 "За последней страницей"
 hsm_bar_core.3.d:0 "Недостающая половина лабораторного рисунка обнаружилась в каталоге иностранного антиквара. Размеры совпадают; совпадает и ожог, пересекающий поле страницы. На обороте прежний владелец перечислил места, где будто бы наблюдали то же явление.\n\nОльха узнаёт одно название и отказывается объяснять его в общей смотровой. Позже он передаёт Вроне запечатанный лист с заголовком «Наставление сопровождающему помощнику». Сведений о возвращении помощника нет.\n\nПервая внешняя ячейка получает каталог, копию рисунка и разрешение найти нынешнего владельца. Марта добавляет просьбу: если возле указанного места кто-то живёт, сначала спросить о здоровье, потом о земле."
 hsm_bar_core.3.a:0 "Передать задание внешним ячейкам."
 hsm_bar_core.4.t:0 "Реликварий меняет имя"
 hsm_bar_core.4.d:0 "У Вроны три фотографии реликвария. На каждой другой продавец поставил рядом новую табличку. Скол на краю выдаёт один и тот же сосуд. Последний продавец так и не забрал оплату.\n\nСтраховщик хочет знать, возмещать ли покупателю убыток. Врона хочет знать, почему за якобы пустой сосуд заплатили заранее. На увеличенном снимке внутри крышки видна процарапанная надпись. Ольха просит негатив и возвращает его с закрытой надписью. В записке: «Не воспроизводить вслух. Сравнение не закончено».\n\nСтраховщик может устроить встречу с курьером, сопровождавшим последнюю передачу. Пока курьер уверен, что спор идёт о повреждённой упаковке."
 hsm_bar_core.4.a:0 "Выйти на курьера через спор о выплате."
 hsm_bar_core.5.t:0 "Имена в списке конвоя"
 hsm_bar_core.5.d:0 "Курьер пришёл в съёмную комнату с закрытыми ставнями. С лестницы Врона слышит молитву Маару. Позже наблюдатель замечает рядом с описанием реликвария расписание перевозки заключённых. Три имени обведены.\n\nПакет вскоре должны передать дальше. Слежка может вывести на того, кому нужны эти узники, и показать, связан ли сосуд с тем же замыслом. Но у ячейки останется время на подготовку. Врона может подменить пакет на складе и забрать подлинник для изучения; если подмену обнаружат, след оборвётся.\n\nОна ждёт вместе с наблюдателями. В комнате наверху становится тихо."
 hsm_bar_core.5.a:0 "Проследить за пакетом до получателя."
 hsm_bar_core.5.b:0 "Подменить пакет на складе."
 hsm_bar_core.6.t:0 "Пустая дорога"
 hsm_bar_core.6.d:0 "Конвой пошёл восточной дорогой. У охраны настоящее извещение о ремонте моста, подписанное инженером, который не знает, почему работы перенесли. Заключённые добрались до места, не увидев тех, кто ждал над старой переправой.\n\nК вечеру съёмная комната пуста. Заговорщиков увела ложная инструкция, переданная через их же связного. У Вроны остались брошенные бумаги и возможность ответить ещё на одно сообщение.\n\nЗакрытие использованных каналов защитит помогавших ей свидетелей. Один оставленный посредник, возможно, выведет на тех, кто ждал заключённых. Посредник видел обведённые имена. Он просит не оставлять его без пути к отступлению."
 hsm_bar_core.6.a:0 "Закрыть каналы и защитить свидетелей."
 hsm_bar_core.6.b:0 "Оставить одного посредника под защитой и наблюдением."
 hsm_bar_core.7.t:0 "Поле за оградой"
 hsm_bar_core.7.d:0 "За старой межевой оградой выросла трава. Марта приносит на совещание ком земли и кладёт рядом с отчётами. На этой полосе восстановление удалось. Немного ниже по склону по-прежнему ничего не растёт.\n\nВрона принесла имена из перехваченного списка конвоя. Она спрашивает, сколько оград способна охранять Служба и сколько семей будут ждать за ними. Ольха раскладывает эскиз подавления самого поля. То же явление, которое повредило землю, возможно, поддерживает сохранившиеся защитные чары. Разницу он ещё не установил.\n\nМарта берёт эскиз, а не отодвигает его. Она тоже хочет сделать нижние поля безопасными. Прежде чем подписать приказ, она просит ответить, что они готовы уничтожить ради исцеления."
 hsm_bar_core.7.a:0 "До выбора выслушать каждый отдел."
 hsm_bar_core.8.t:0 "Место у печи"
 hsm_bar_core.8.d:0 "Письмо целительницы короткое. Ей нужна замена треснувшей линзы и кто-нибудь, кто осмотрит камни вокруг приёмной. Больные начали отказываться садиться у дальней стены.\n\nМарта читает письмо рядом с Ольхой. Комнату она знает: зимой целительница придвигает скамью к печи, чтобы ожидающим не приходилось сидеть в пальто. Просьба касается не новой доктрины. Ей нужна комната, где можно продолжать лечить.\n\nВ предписании Службы подозрительная стена будет отделена от работы целительницы. Врона заносит адрес в список выездов. Марта отвечает, что они приедут, и просит пока завернуть треснувшую линзу."
 hsm_bar_core.8.a:0 "Защитить её работу. Изучить то, что ей угрожает."
 hsm_bar_core.9.t:0 "Возражение голосом Ольхи"
 hsm_bar_core.9.d:0 "Врона предлагает программу, после которой следующему поколению останется меньше запечатанных дверей. Судя по эскизам, само воздействие можно подавить, а не сторожить бесконечно. Марта хочет знать, не замолчат ли вместе с ним приборы, поддерживающие жизнь её самых тяжёлых больных.\n\nОльха просит независимых измерений. Ответ, похожий на ответ Вроны, он уже слышал в лаборатории, где возражения убирали из итогового доклада. Он был помощником, переписавшим тот доклад.\n\nМожно сохранить его замечание и организовать отдельную проверку или немедленно выдать заказы на оборудование. Поставщики заметят внезапный спрос. Врона оставляет заявку неподписанной, пока остальные решают."
 hsm_bar_core.9.a:0 "Провести независимую проверку. Сохранить возражение."
 hsm_bar_core.9.b:0 "Разрешить срочные закупки для программы."
 hsm_bar_core.10.t:0 "Ключ с внутренней стороны"
 hsm_bar_core.10.d:0 "В журнале ночного наблюдателя записан посетитель изолятора. В списке дежурных такого нет. Начальник участка ссылается на ошибку во времени; Марта обнаруживает, что в тот же промежуток изменили назначения больному.\n\nВне участка никто не может восстановить события без разрешения начальника. Даже врачам нужен его допуск к записям. Врона узнаёт порядок, с которым столкнулась в домах, открытых во время восстания.\n\nВторой ключ получит отдельная проверочная группа с собственным снабжением и правом остановить работу. Её первое задание: поговорить с ночным наблюдателем раньше, чем к нему снова придёт начальник."
 hsm_bar_core.10.a:0 "Дать проверяющим независимый доступ."
 hsm_bar_core.11.t:0 "Два подземных плана"
 hsm_bar_core.11.d:0 "В заброшенных выработках достаточно сухо для опытной площадки. Ольха отметил все соединения, которые нужно перерезать до установки аппарата. Марта нанесла вторую границу за первой. Разрыв старых каналов обойдётся дорого.\n\nДругой вариант: служебная галерея ближе к сохранившимся машинам. Там уже есть питание и проходы, а опыт охватит большую площадь. Те же каналы уходят под обитаемую землю. Их планы заканчиваются у края последней съёмки Пентархии.\n\nВрона спрашивает, что находится дальше. Никто не может ответить. Начальнику стройки нужен участок, прежде чем он закажет первые фундаменты."
 hsm_bar_core.11.a:0 "Изолировать заброшенные выработки до строительства."
 hsm_bar_core.11.b:0 "Подготовить соединённую галерею для расширенного опыта."
 hsm_bar_core.12.t:0 "Печати замолчали"
 hsm_bar_core.12.d:0 "В испытательной камере становится тихо. Несколько мгновений приборы ведут себя в точности так, как предсказывал Ольха. Затем гаснет печать над дверью наблюдения, и по ту сторону начинает падать температура.\n\nВрона приказывает внутренней группе выходить. Из переговорной трубы один из наблюдателей спрашивает, должен ли проход становиться длиннее на обратном пути. Следующие слова неразборчивы. Марта приходит ко входу с одеялами и требует остановить аппарат.\n\nОператоры ещё могут ослабить поле, но для восстановления придётся привезти оборудование, не объясняя его назначения гражданским бригадам. Продолжение даст Ольхе показания, которых он никогда не видел. Он смотрит на дверь, а не на приборы."
 hsm_bar_core.12.a:0 "Отключить. Оплатить спасательные и восстановительные работы."
 hsm_bar_core.12.b:0 "Продолжить опыт, расширив прикрытие аварийных работ."
 hsm_bar_core.13.t:0 "Перед первым показанием"
 hsm_bar_core.13.d:0 "Аппарат готов к первому продолжительному испытанию. Наверху рабочие выставили предупреждения о ремонте тоннелей. Внизу Марта сверяет имена наблюдателей и заставляет каждого повторить сигнал эвакуации.\n\nОльха читает инструкцию, не поднимая головы. Врона замечает, что порядок отключения записан на отдельном листе, достаточно маленьком, чтобы вынести его из аппаратной. Она берёт копию для наружной группы.\n\nНикто на участке не вправе самостоятельно продлевать опыт. У отдельной группы останется возможность прервать его. Пока снимают первые показания, Марта слушает переговорную трубу, дожидаясь ответа с каждого поста."
 hsm_bar_core.13.a:0 "Сохранить независимую группу аварийного отключения."
 hsm_bar_core.14.t:0 "Скамья на солнце"
 hsm_bar_core.14.d:0 "Завиша приезжает на восстановленную полосу над каналом. Сельский совет просит ещё один насос, школа хочет получить окна до зимы. Он записывает обе просьбы и задерживается на скамье у дороги дольше, чем собирался. О новых больных никто не сообщает.\n\nМарта садится с другого края. Сквозь траву видны низкие камни защищённой границы. Жители знают, что их нельзя трогать, но не знают, кто проверяет их по ночам.\n\nЗавиша благодарит врача за то, что она осталась, когда столько других уехало. Она едва не рассказывает ему об остальных сотрудниках. Вместо этого просит поставить школу первой в списке.\n\nВечером под измерениями во внутреннем докладе появляется одно наблюдение: сегодня дети ходили верхней тропой."
 hsm_bar_core.14.a:0 "Оставить тропу открытой, а границу под наблюдением."
 hsm_bar_core.15.t:0 "Что прочтут другие лаборатории"
 hsm_bar_core.15.d:0 "Доклад об испытании раскрыт на свидетельстве из наблюдательного прохода. Ольха восстановил раздел, который собирались убрать из рассылки. Марта положила рядом истории лечения. В ремонтной сводке для кабинета нет ни того ни другого.\n\nВрона спрашивает, что они скажут полевым партнёрам, которым однажды придётся работать возле такого аппарата. Раньше ей казалось, что любой отход оставляет ту же опасность кому-то другому. Теперь у неё есть предупреждение, которое можно передать или оставить в этой комнате.\n\nМожно отказаться от сплошного подавления и направить программу на защиту от отдельных угроз. Можно разослать только успешные показания, сохранив более широкий замысел. Ольха не тянется к перу."
 hsm_bar_core.15.a:0 "Прекратить сплошное подавление. Перейти к сдерживанию."
 hsm_bar_core.15.b:0 "Скрыть предупреждения. Сохранить программу нормализации."
 HSM_BAR_core_fall_desc:0 "У дворцовых ворот о дружбе рассказывают выжившие. Семьи, собравшиеся снаружи, принесли другие рассказы: об отнятых полях, пустых кроватях, именах, исчезнувших из сельских списков. Амброзий мёртв. Четверо его гостей стоят перед толпой, которая больше не боится их обещаний.\n\nКто-то требует заставить их исцелить землю. Кто-то поднимает детское пальто. Сторонники Гасеницы пытаются сохранить проход, но не могут сделать этот выбор за пришедших. Выживут гости или погибнут, завтра всё равно придётся кормить голодных, открывать дома и решать, что делать с местами, где никто не смеет копать."
 HSM_BAR_core_fall_collegium:0 "Пощадить их. Отныне они ответят перед гражданской властью."
 HSM_BAR_core_fall_directorate:0 "Помилования не будет. Баррад будет править собой сам."
 HSM_BAR_COL_democratic:0 "Маготехнический коллегиум Баррада"
 HSM_BAR_COL_democratic_DEF:0 "Маготехнический коллегиум Баррада"
 HSM_BAR_COL_democratic_ADJ:0 "Баррадск"
 HSM_BAR_DIR_democratic:0 "Баррадская республика"
 HSM_BAR_DIR_democratic_DEF:0 "Баррадская республика"
 HSM_BAR_DIR_democratic_ADJ:0 "Баррадск"
 HSM_BAR_radio_bonus:0 "Программа полевой связи"
 HSM_BAR_service_affairs:0 "За закрытой дверью"
 HSM_BAR_service_affairs_desc:0 "У медпункта, изыскательской партии и лаборатории института больше общего, чем следует из их открытых отчётов. Приказы передаются под разными именами. В Службе истории лечения Марты читают рядом с полевыми донесениями Вроны. Кабинет получает сводку восстановления."
 HSM_BAR_trace_couriers:0 "Проследить курьеров с реликварием"
 HSM_BAR_trace_couriers_desc:0 "На фотографиях реликварий назван по-разному, но скол на краю остаётся тем же. Страховщик может познакомить нас с последним курьером. Врона хочет установить наблюдение за получателем прежде, чем кто-либо поймёт, что вопросы касаются не только возмещения."
 HSM_BAR_watched_transfer:0 "Изменить маршрут конвоя"
 HSM_BAR_watched_transfer_desc:0 "В расписании перевозки заключённых обведены три имени. Досрочный ремонт моста направит охрану другой дорогой. Заговорщики должны получить иное указание через связного, которому ещё доверяют."
 HSM_BAR_contact_smile:0 "Открыть канал связи против Сомбры"
 HSM_BAR_contact_smile_desc:0 "Власть Сомбры превратила вопрос о магическом подчинении в непосредственную угрозу. Марта хочет предложить защитные разработки тем, кто с ней столкнулся. Медицинский посредник может добиться внимания S.M.I.L.E.; Врона отделит первое обращение от остальных зарубежных контактов."
 HSM_BAR_share_wards:0 "Поделиться защитой от подчинения"
 HSM_BAR_share_wards_desc:0 "Ольха собрал опыты с защитными чарами, включая неудачные воздействия. Эквестрийским исследователям нужны эти неудачи, чтобы понять предел защиты. Марта подписала техническую копию, оставив имена первых свидетелей в запечатанном приложении."
 HSM_BAR_assist_against_sombra:0 "Развернуть совместную защитную миссию"
 HSM_BAR_assist_against_sombra_desc:0 "Эквестрийский связной просит инструкторов, способных заметить отказ защиты раньше солдат за ней. Врона отправит небольшую группу с запасными деталями и полными аварийными инструкциями. Методы, впервые испытанные в баррадских лечебницах, попадут на поле боя."
 HSM_BAR_sombra_volunteer_mission:0 "Разрешить отправку добровольцев в Эквестрию"
 HSM_BAR_sombra_volunteer_mission_desc:0 "Среди желающих служить в Эквестрии есть солдаты, которые помнят, почему пали прежние правители Баррада. Они отправятся добровольцами против Сомбры с обычными военными документами. Сопровождающие специалисты знают, какая часть их подготовки не должна попасть в открытый отчёт."
 HSM_BAR_volunteer_window_tt:0 "Отправка добровольцев разрешена на 90 дней через дипломатию с Эквестрией. При утрате условий новые отправки закроются, но уже отправленные дивизии автоматически не отзываются."
 HSM_BAR_abort_suppression:0 "Приказать аварийное отключение"
 HSM_BAR_abort_suppression_desc:0 "У группы отключения своя копия инструкции и прямой доступ к управлению. Марта требует закончить опыт до следующего воздействия. Врона выведет наблюдателей, пока оставшиеся сотрудники обезопасят аппарат."
 hsm_bar_smile.1.t:0 "Чертёж в медицинском конверте"
 hsm_bar_smile.1.d:0 "Приложение пришло в S.M.I.L.E. через медицинского корреспондента. На схеме защита, испытанная против навязанных реакций; неудачи отмечены теми же чернилами, что и успехи. Записка предлагает остальные измерения для работы против Сомбры.\n\nНаш эксперт узнаёт баррадские обозначения. Обратный контакт принадлежит врачу, но вместо свидетелей указаны номера. Кто-то тщательно сохранил сведения об опасности, убрав почти всё, что помогло бы найти лабораторию.\n\nМожно согласиться на ограниченный технический обмен. Прежде чем агент доверит этому методу жизнь, нам придётся воспроизвести его самим."
 hsm_bar_smile.1.a:0 "Согласовать закрытый технический обмен."
 hsm_bar_smile.1.b:0 "Отказать, пока свидетельств недостаточно."
 hsm_bar_smile.2.t:0 "Вопросы другого исследователя"
 hsm_bar_smile.2.d:0 "В ответе S.M.I.L.E. нет обещаний сверх предложенного обмена. Зато есть одиннадцать вопросов. Последний Ольха узнаёт, ещё не дочитав: эксперт просит полный рассказ о неудачном воздействии.\n\nМарта испытывает облегчение. По ту сторону кто-то прочитал дальше успешных результатов. Она готовит ответ через врача, устроившего знакомство, не указывая адрес лаборатории. Врона записывает единственный путь связи отдельно от полевых заданий.\n\nВпервые их работу против принуждения оценят коллеги, которых они сами не назначали."
 hsm_bar_smile.2.a:0 "Продолжать через согласованный медицинский контакт."
 hsm_bar_smile.3.t:0 "Страницы под кратким изложением"
 hsm_bar_smile.3.d:0 "Ольха положил перед Мартой два варианта опытов с защитой. Краткий объясняет принцип. Полный содержит остановки, симптомы и мгновения, когда будто бы защищённый наблюдатель повторял слова, которых никто в комнате не произносил.\n\nЭксперты S.M.I.L.E. запросили второй. Без него им придётся искать пределы рядом с собственными пациентами и полевыми сотрудниками. Полная запись раскроет значительную часть метода, хотя не выдаст место лаборатории и имена свидетелей.\n\nМарта оставляет обе копии открытыми. Краткую отправить легче."
 hsm_bar_smile.3.a:0 "Передать полный журнал опытов."
 hsm_bar_smile.3.b:0 "Пока передать только краткое изложение."
 hsm_bar_smile.4.t:0 "Вежливость, а не соглашение"
 hsm_bar_smile.4.d:0 "В ответе S.M.I.L.E. благодарит врача за материалы и отклоняет предложенный обмен. Эксперт не станет рекомендовать неизвестный метод по выборочному описанию. Последний абзац предлагает вернуться к разговору с более убедительными свидетельствами.\n\nОльха один раз читает письмо и кладёт его под неполные протоколы опытов. Марта просит посредника подтвердить получение, не настаивая на встрече. Адрес можно сохранить. Для доверия потребуется больше, чем ещё один конверт."
 hsm_bar_smile.4.a:0 "Сохранить контакт для следующего обращения."
 HSM_BAR_provisional_watch:0 "Оставшаяся работа"
 HSM_BAR_provisional_watch_desc:0 "Пентархии больше нет. Остались разбитые дороги, заброшенные лечебницы и перепуганные сёла. Новой гражданской власти Баррада предстоит создать учреждения, прежде существовавшие лишь по прихоти правителя."
 HSM_BAR_accountable_service:0 "Дозор продолжается"
 HSM_BAR_accountable_service_desc:0 "Служба решила защищать мир, который нельзя сделать совершенно безопасным. У исследователей, полевых групп и независимых проверяющих разные ключи. Закрытое дело не снимает ответственности за тех, кто живёт рядом с ним."
 HSM_BAR_normalization_service:0 "Программа нормализации"
 HSM_BAR_normalization_service_desc:0 "Запечатанной камеры и ночного дозора больше недостаточно. Программа должна погасить само воздействие. Сторонники помнят места, которые не смогли спасти; противники хранят записи о том, что то же воздействие сохранило."
 HSM_BAR_public_defence:0 "Общественный оборонный резерв"
 HSM_BAR_public_defence_desc:0 "Местные оборонные планы соединяют снабжение армии с эвакуацией и гражданским контролем."
 HSM_BAR_reconstruction_contract:0 "Договоры восстановления"
 HSM_BAR_reconstruction_contract_desc:0 "Открытые договоры направляют ресурсы в обычные мастерские, дороги и постоянную занятость."
 HSM_BAR_custody_charter:0 "Второй ключ"
 HSM_BAR_custody_charter_desc:0 "Начальник участка больше не хранит все ключи. Отдельная группа вправе говорить с пациентами, проверять ночные журналы и останавливать опыт без разрешения самой лаборатории."
 HSM_BAR_suppression_crisis:0 "Кризис подавления"
 HSM_BAR_suppression_crisis_desc:0 "Испытательное поле нарушило защитные чары вокруг участка. Наблюдатели дежурят у переговорных труб; наверху рабочим велели готовиться к ремонту старых тоннелей. Марта попросила собрать все одеяла, какие найдутся."
 HSM_BAR_anti_sombra:0 "Совместная защита от подчинения"
 HSM_BAR_anti_sombra_desc:0 "Группы защиты работают рядом с эквестрийскими солдатами, сражающимися с Сомброй. В их инструкциях следы баррадских опытов: когда прерывать контакт, каких признаков опасаться и как понять, что товарищ отвечает уже не своей волей."
 HSM_BAR_sombra_volunteers:0 "Добровольцы эквестрийского фронта"
 HSM_BAR_sombra_volunteers_desc:0 "Баррадские добровольцы получили предписания на эквестрийский фронт против Сомбры. Открытый отчёт расскажет о солдатах и медиках; инструкторы защитных групп ведут отдельный журнал."
 HSM_BAR_displaced_families:0 "Семьи за периметром"
 HSM_BAR_displaced_families_desc:0 "Семьям за оцеплением обещали возвращение домой. Они знают чиновников, которые их переселили, и комнаты, где теперь ждут. О тайном опыте, из-за которого дорога остаётся закрытой, им неизвестно."
 HSM_BAR_active:0 "В Барраде созданы учреждения после падения Пентархии"
 HSM_BAR_collegium:0 "Принят устав Коллегиума"
 HSM_BAR_directorate:0 "После падения Пентархии Баррад избрал республиканский путь"
 HSM_BAR_diplomacy_open:0 "Разрешены переговоры с соседями"
 HSM_BAR_institute_open:0 "Магический институт открыт"
 HSM_BAR_foreign_mandate:0 "Внешним ячейкам разрешено работать по документированным зацепкам"
 HSM_BAR_field_research_open:0 "Разрешены полевые исследования"
 HSM_BAR_liaison_open:0 "Разрешены закрытые зарубежные каналы"
 HSM_BAR_coexistence:0 "Служба защищает сосуществование с магией"
 HSM_BAR_normalization:0 "Выбрана доктрина нормализации"
 HSM_BAR_repressive_methods:0 "Служба применяет коллективные репрессии"
 HSM_BAR_countercult_open:0 "Разрешено расследование деятельности культов"
 HSM_BAR_cult_leads:0 "Обнаружен след курьеров"
 HSM_BAR_couriers_traced:0 "Курьеры найдены"
 HSM_BAR_cult_sting:0 "Разрешена перевозка под наблюдением"
 HSM_BAR_cult_mass_arrests:0 "Приказано провести массовые аресты"
 HSM_BAR_cult_network_broken:0 "Местная сеть торговцев и организаторов побега раскрыта"
 HSM_BAR_smile_partner:0 "Действует партнёрство со S.M.I.L.E. на оговорённых условиях"
 HSM_BAR_smile_contact_cooldown:0 "За последние полгода уже было обращение к S.M.I.L.E."
 HSM_BAR_wards_shared:0 "Переданы полные результаты исследования защиты"
 HSM_BAR_suppression_live:0 "Идёт испытание поля подавления"
 HSM_BAR_suppression_resolved:0 "По испытанию подавления принято решение"
 HSM_BAR_suppression_test_window:0 "Тридцатидневное испытание ещё не завершено"
 HSM_BAR_front_agency:0 "Ольховый меридиан"
 HSM_BAR_contact_smile_tt:0 "Предложить S.M.I.L.E. закрытый канал связи. При согласии можно передать результаты завершённого исследования защитных чар. Полный обмен откроет помощь против Сомбры во время войны Эквестрии с его режимом; само установление контакта боевых бонусов не даёт."
 HSM_BAR_smile_contact_relevant:0 "Сомбра правит Кристальной Империей и доступен мирный канал связи с гармонической Эквестрией"
 HSM_BAR_smile_compromised:0 "Сеть скрыла от S.M.I.L.E. опасности совместной работы"
 HSM_BAR_cult_intercept:0 "Пакет курьера тайно перехвачен"

