l_russian:
 HSM_VER_GRO_open_court:0 "Двор с оговорённым сроком"
 HSM_VER_GRO_open_court_desc:0 "Учреждения Герцланда теперь подчиняются Верении. Среди бумаг, поступающих в канцелярию, появились прошения об императорском дворе. Прежде чем предлагать правление от имени Гровера, нужно установить, где он находится и вправе ли мы отвечать за его благополучие. Обязательство защитить государя должно определять и предел нашей власти."
 HSM_VER_GRO_household_file:0 "Дело императорского двора"
 HSM_VER_GRO_household_file_desc:0 "Портрет, слух и старая ведомость содержания не говорят, кто живёт за дверью дворца. Служащие сверят свидетельства с уцелевшими записями и установят, что стало с Гровером. Они обязаны дать совету честный ответ, даже если предполагаемый регент останется без подопечного."
 HSM_VER_GRO_mandate:0 "Веренийское регентство"
 HSM_VER_GRO_mandate_desc:0 "Мандат должен отличать заботу о Гровере от права распоряжаться его будущим. Верения будет временно управлять Герцландом, пока статьи о престолонаследии готовят короне собственную власть. Если Гровер уже совершеннолетний, речь идёт о переходе к его правительству. Документ не может снова сделать его ребёнком."
 HSM_VER_GRO_lessons:0 "Кого позволено выслушать"
 HSM_VER_GRO_lessons_desc:0 "Двор учит своими дверями не меньше, чем книгами. Одни посетители приходят с отточенными речами, другие приносят свидетельства, противоречащие официальной истории. Нужно решить, услышит ли Гровер разногласия сам или получит изложение, которое советники сочтут подходящим."
 HSM_VER_GRO_petitions:0 "Неудобное прошение"
 HSM_VER_GRO_petitions_desc:0 "Проситель назвал того, чьей поддержкой дорожит наше правительство. Доказательства прошли через ту же канцелярию, которая записывала наши гарантии, и Гровер попросил выслушать дело. Решение покажет ему цену обещаний, когда исполнение становится невыгодно тому, кто их дал."
 HSM_VER_GRO_registers:0 "Столичные реестры"
 HSM_VER_GRO_registers_desc:0 "В архивах Грифенхейма хранятся противоречащие друг другу пожалования и обязательства. Сверим столичные записи с книгами окрестных округов, чтобы каждый дом знал, какое учреждение отвечает по его требованию. Регентству нужна администрация, способная работать и тогда, когда приказы будет подписывать другой государь."
 HSM_VER_GRO_districts:0 "Книги округов Герцланда"
 HSM_VER_GRO_districts_desc:0 "Столичный порядок должен выйти за городские ворота. Чиновники округов сверят реестры, разграничат полномочия и признают права жителей, которым призвана служить новая администрация. Их книги должны описывать страну, готовую управлять собой, а не собрание контор, зависящих от нашего двора."
 HSM_VER_GRO_home_workshops:0 "Работа для Верении"
 HSM_VER_GRO_home_workshops_desc:0 "Герцланд не может стать единственным занятием веренийского правительства. Нашим мастерским нужны помещения, оборудование и заказы, которые переживут регентство. Вложения на родине дадут возвращающейся администрации нечто полезнее воспоминаний об императорском дворе."
 HSM_VER_GRO_service:0 "Смысл службы"
 HSM_VER_GRO_service_desc:0 "Гровер попросил показать работу, стоящую за военным донесением. Интенданты предлагают начать со складов, госпиталей и пути грузового обоза. Территориальные офицеры предлагают командование и ответственность за отданный приказ. Любая из этих школ должна объяснить и тот день, когда закончатся наши собственные полномочия."
 HSM_VER_GRO_succession_articles:0 "Статьи о престолонаследии"
 HSM_VER_GRO_succession_articles_desc:0 "Обещанию уступить власть требуется больше, чем место в торжественной речи. Статьи определят страну, которой предстоит править Гроверу, средства её правительства и пределы дальнейших обязательств Верении. Подписанты должны быть готовы исполнить их, когда императорская печать перейдёт в другую руку."
 HSM_VER_GRO_prepared_crown:0 "Корона готова"
 HSM_VER_GRO_prepared_crown_desc:0 "Подготовить саму корону проще всего. Трудная работа ждёт в министерствах, армейских канцеляриях и счетах, за которые будет отвечать её обладатель. Завершим приготовления сейчас, чтобы совершеннолетие и надёжный мир позволили выполнить обещанное без новой отговорки с регентского стола."
 HSM_VER_GRO_civil_compact:0 "Гражданское урегулирование"
 HSM_VER_GRO_civil_compact_desc:0 "Жителям Герцланда нужны суды, мастерские и правительство, отвечающее от собственного имени. Совет может взяться за эту работу, не принимая императорского регентства. Защита Гровера, если он здесь, не обязательно превращает его будущее в государственное дело. Пусть гражданская администрация опирается на власть, которую мы готовы осуществлять сами."

 HSM_VER_GRO_can_start_tt:0 "Независимая единая Верения под властью Эри или Эйри находится в мире и владеет Герцландом и всеми пятью исконными землями герцогств; прежней Империи больше нет."
 HSM_VER_GRO_active_tt:0 "Веренийское урегулирование действует при учредившем его правительстве; Грифенхейм удерживается."
 HSM_VER_GRO_can_mandate_tt:0 "Живой Гровер находится под нашей защитой; правительство удерживает Герцланд и все пять исконных земель герцогств в мирное время и вправе принять мандат."
 HSM_VER_GRO_regency_live_tt:0 "Мандат действителен, живой Гровер по-прежнему находится здесь."
 HSM_VER_GRO_civil_available_tt:0 "Королевский мандат ещё не принят; гражданское урегулирование остаётся возможным."
 HSM_VER_GRO_herzland_held_tt:0 "Мы владеем и контролируем все 38 регионов Герцланда."
 HSM_VER_GRO_home_held_tt:0 "Мы владеем и контролируем регионы $STATE_391$ и $STATE_401$."
 HSM_VER_GRO_lessons_done_tt:0 "Порядок обучения при дворе выбран."
 HSM_VER_GRO_petition_done_tt:0 "По прошению вынесено решение."
 HSM_VER_GRO_service_done_tt:0 "Программа военной службы выбрана."
 HSM_VER_GRO_articles_done_tt:0 "Статьи о престолонаследии подписаны."
 HSM_VER_GRO_transfer_terms_tt:0 "Коронация взрослого Гровера восстановит §Yнезависимую союзную Грифонскую Империю§!: §Yвсе 38 регионов Герцланда§! и §Y25% сухопутных частей, авиации и запасов снаряжения§!. Иные земли и корабли не передаются; все офицеры остаются у Верении. Наше имя снова §YВерения§!; снимаются лишь национальные территории, полученные при этом регентстве."
 HSM_VER_GRO_open_court_tt:0 "Открывает урегулирование при условии присутствия живого Гровера. Предлагаемые условия:\n$HSM_VER_GRO_transfer_terms_tt$"
 HSM_VER_GRO_household_tt:0 "Устанавливает положение Гровера. Может принять его и его двор под нашу защиту после падения императорского правительства; не забирает его у действующего зарубежного двора."
 HSM_VER_GRO_mandate_tt:0 "Принимает временное название §YВеренийское регентство§!. Несовершеннолетний получает опеку; взрослый государь ожидает согласованной коронации при переходной администрации."
 HSM_VER_GRO_lessons_tt:0 "Открывает выбор между открытым двором и отобранным кругом наставников. Решение даёт награду и влияет на будущее правительство Гровера."
 HSM_VER_GRO_petitions_tt:0 "Открывает выбор между применением закона к своему стороннику и защитой его привилегии. Будущее правительство Гровера наследует этот прецедент."
 HSM_VER_GRO_registers_tt:0 "Столичные земли прежней Империи в пределах Герцланда становятся национальными. По окончании мандата снимаются только новые национальные территории; прежние сохраняются."
 HSM_VER_GRO_districts_tt:0 "Оставшиеся округа Герцланда становятся национальными территориями. По окончании мандата снимаются только национальные территории, полученные при этом регентстве."
 HSM_VER_GRO_home_workshops_tt:0 "Строительство ведётся в Верении. Если в регионе нет места для фабрики, он вместо неё даёт бонус к промышленным исследованиям."
 HSM_VER_GRO_service_tt:0 "Выбирает оборонное снабжение или территориальное командование. Гровер запомнит этот опыт, возглавив собственное правительство."
 HSM_VER_GRO_articles_tt:0 "Открывает обязательные к исполнению статьи о престолонаследии:\n$HSM_VER_GRO_transfer_terms_tt$"
 HSM_VER_GRO_prepare_tt:0 "Завершает приготовления. Передача произойдёт автоматически после §Y21 мая 1021 года§!, в мирное время и при удержании всего Герцланда; война её откладывает.\n$HSM_VER_GRO_transfer_terms_tt$"
 HSM_VER_GRO_civil_tt:0 "Завершает гражданское урегулирование и навсегда закрывает ветвь регентства. Верения сохраняет имя; находящийся здесь Гровер остаётся частным гостем под защитой. Императорской коронации и передачи не будет."
 HSM_VER_GRO_open_education_tt:0 "Гровер запоминает свободные свидетельства. Восстановленная Империя получает §Y«$HSM_VER_GRO_open_court_legacy$»§!."
 HSM_VER_GRO_filtered_education_tt:0 "Гровер запоминает двор избранных советников. Восстановленная Империя получает §Y«$HSM_VER_GRO_managed_court_legacy$»§!."
 HSM_VER_GRO_apply_law_tt:0 "Закон связывает нашего собственного сторонника. Восстановленная Империя получает §Y«$HSM_VER_GRO_rule_of_law$»§!."
 HSM_VER_GRO_protect_patron_tt:0 "Привилегия нашего сторонника защищена. Восстановленная Империя получает §Y«$HSM_VER_GRO_patrons_legacy$»§!."
 HSM_VER_GRO_logistics_tt:0 "Военный опыт Гровера строится вокруг оборонного снабжения; его независимое правительство сохранит память об этом выборе."
 HSM_VER_GRO_command_tt:0 "Военный опыт Гровера строится вокруг территориального командования; его независимое правительство сохранит память об этом выборе."
 HSM_VER_GRO_sign_articles_tt:0 "Юридически обязывает нас выполнить передачу после завершения приготовлений, наступления совершеннолетия и мира:\n$HSM_VER_GRO_transfer_terms_tt$"

 HSM_VER_GRO_guardianship:0 "Ограниченная опека"
 HSM_VER_GRO_guardianship_desc:0 "Регентство заботится о Гровере и временно управляет Герцландом. Вместе с властью оно принимает обязанность подготовить правительство, которое сможет обойтись без опекунов."
 HSM_VER_GRO_transition:0 "Переход к власти взрослого государя"
 HSM_VER_GRO_transition_desc:0 "Гровер достиг совершеннолетия. Оставшаяся работа относится к министерствам, договорам и восстановлению мира; она не даёт права продлевать его воспитание."
 HSM_VER_GRO_common_market:0 "Веренийско-имперский рынок"
 HSM_VER_GRO_common_market_desc:0 "Веренийские мастерские и покупатели Герцланда продолжают торговлю по соглашению независимых правительств. Счета прежнего регентства стали записями общего торгового дела."
 HSM_VER_GRO_joint_defence:0 "Оборонный договор"
 HSM_VER_GRO_joint_defence_desc:0 "Верения и восстановленная Империя готовятся к обороне как союзники. Их штабы разделяют обязанности, не превращая одно правительство в опекуна другого."
 HSM_VER_GRO_open_court_legacy:0 "Наследие открытого двора"
 HSM_VER_GRO_open_court_legacy_desc:0 "Гровер помнит свидетелей, которым позволяли возражать двору. Привычка выслушивать их последовала за ним в собственное правительство."
 HSM_VER_GRO_managed_court_legacy:0 "Наследие управляемого двора"
 HSM_VER_GRO_managed_court_legacy_desc:0 "Гровер привык работать через упорядоченный круг советников. Их дисциплина остаётся полезной, а голоса за пределами этого круга остаются вопросом, на который предстоит ответить уже его правлению."
 HSM_VER_GRO_rule_of_law:0 "Закон выше милости"
 HSM_VER_GRO_rule_of_law_desc:0 "Однажды неудобное решение связало собственного сторонника регента. Гровер приносит этот прецедент к императорскому двору, где друзьям государя предстоит обнаружить, что закон касается и их."
 HSM_VER_GRO_patrons_legacy:0 "Прецедент покровительства"
 HSM_VER_GRO_patrons_legacy_desc:0 "Регентство защитило полезного сторонника, когда закон оказался неудобен. Гровер помнит и сохранённую этим верность, и просителя, ушедшего без обычного разбирательства."
 HSM_VER_GRO_grover_desc:0 "Гровер VI возвращается на императорский престол после веренийского урегулирования, обещавшего ему собственную страну. Он помнит, кому позволяли говорить при дворе, что происходило с прошением против влиятельного сторонника и как военные наставники понимали службу. Этот опыт сопровождает его в независимом правлении. Верения теперь союзница, чьи правители отказались от опеки, а решения, стоящие перед императором, принадлежат ему самому."
 HSM_VER_GRO_alliance:0 "Веренийско-герцландский союз"
 HSM_VER_REGENCY_neutrality:0 "Веренийское регентство"
 HSM_VER_REGENCY_neutrality_DEF:0 "Веренийское регентство"
 HSM_VER_REGENCY_neutrality_ADJ:0 "Веренийск."
 HSM_VER_REGENCY_democratic:0 "Веренийское регентство"
 HSM_VER_REGENCY_democratic_DEF:0 "Веренийское регентство"
 HSM_VER_REGENCY_democratic_ADJ:0 "Веренийск."
 HSM_VER_REGENCY_fascism:0 "Веренийское регентство"
 HSM_VER_REGENCY_fascism_DEF:0 "Веренийское регентство"
 HSM_VER_REGENCY_fascism_ADJ:0 "Веренийск."
 HSM_VER_REGENCY_communism:0 "Веренийское регентство"
 HSM_VER_REGENCY_communism_DEF:0 "Веренийское регентство"
 HSM_VER_REGENCY_communism_ADJ:0 "Веренийск."
 HSM_VER_REGENCY:0 "Веренийское регентство"
 HSM_VER_REGENCY_DEF:0 "Веренийское регентство"
 HSM_VER_REGENCY_ADJ:0 "Веренийск."
 HSM_VER_GRO_category:0 "Веренийское урегулирование"
 HSM_VER_GRO_category_desc:0 "Записи императорского двора и условия мандата должны соответствовать жизни за дверями канцелярии. Писец может принести новое свидетельство; правительство может утратить власть, на которой основывалось обязательство. Совету предстоит ответить за то, что ещё можно исполнить."
 HSM_VER_GRO_household_retry_decision:0 "Вновь открыть дело двора"
 HSM_VER_GRO_household_retry_decision_desc:0 "Писцы сверят новые свидетельства с записями императорского двора. Возможно, им удастся найти того, чья судьба осталась неясной после падения прежней власти. Известие из действующего зарубежного двора свидетельствует о его госте, но не разрешает забрать этого гостя себе."
 HSM_VER_GRO_household_retry_decision_tt:0 "Урегулирование действует, запрос о дворе снова доступен. Устанавливает обстоятельства Гровера; может принять его и его двор под нашу защиту после падения императорского правительства."
 HSM_VER_GRO_household_retry_tt:0 "Урегулирование действует; со времени предыдущего запроса о дворе прошло 90 дней."
 HSM_VER_GRO_household_report_tt:0 "$HSM_VER_GRO_household_tt$"
 HSM_VER_GRO_close_interrupted:0 "Закрыть прерванный мандат"
 HSM_VER_GRO_close_interrupted_desc:0 "Королевское обязательство больше нельзя исполнить на основании прежних полномочий. Канцелярия закроет счета и придаст оставшейся гражданской работе честное основание. Обещание, утратившее своего подопечного или законного гаранта, нельзя сохранить одной лишь прежней шапкой документа."
 HSM_VER_GRO_close_interrupted_tt:0 "Королевский мандат прерван; веренийская гражданская администрация действует и находится в мире."

 hsm_ver_grover.1.t:0 "Место при дворе"
 hsm_ver_grover.1.eri_diplomatic.d:0 "Первая делегация Герцланда приносит прошение на языке старой императорской канцелярии. Секретарь Эри начинает переводить его на аквилейский, но останавливается, когда другой делегат поправляет перевод. Винсент просит оставить на столе оба текста.\n\nРядом лежит дело императорского двора. Если Гровера можно законно поручить этому двору, он увидит правительство, привыкшее договариваться между разными голосами. Позволят ли этим голосам возражать своему покровителю, ещё предстоит узнать.\n\nПредлагаемое регентство временно. По его окончании Герцланд должен получить независимого императора, а Верения вновь заняться собственной страной."
 hsm_ver_grover.1.eri_military.d:0 "Офицеры, обеспечившие власть над Герцландом, ожидают, что урегулирование учтёт их службу. Списки наград поступают раньше, чем служащие заканчивают выяснять местонахождение Гровера. Винсент кладёт бумаги рядом.\n\nЕсли живой государь здесь, его защита ляжет на двор победителя. Но его будущее от этого не становится ещё одной наградой. Подопечный может стать союзником или остаться среди тех, кто называет обладание верностью.\n\nМандат обещает в конце независимую корону. Сторонникам Винсента однажды придётся отказаться от части того, что победа отдала им в руки."
 hsm_ver_grover.1.eyr_diplomatic.d:0 "Иовинус попросил записи императорского двора без хвалебного предисловия, приготовленного секретариатом. Правительство, управляющее Герцландом, должно решить, что оно действительно может обещать Гроверу, прежде чем просить права говорить за него.\n\nОдин советник предлагает сохранить достоинство старого двора. Другой спрашивает, означает ли это сохранение его исключительных прав. Между ними лежит раскрытая хартия.\n\nЕсли законный мандат возможен, его итогом должно стать независимое императорское правительство рядом с Веренией. Гарантии, предложенные соседу, должны связывать и подписавшего их опекуна."
 hsm_ver_grover.1.eyr_military.d:0 "Иовинус принимает командиров округов в комнате, выбранной для разбирательства о дворе. Их донесения описывают страну, которую удерживают приказы, склады и дисциплинированные войска. Императорская печать в ящике писца принадлежит иному виду власти.\n\nГерцог рассмотрит мандат только для настоящего Гровера, чьи обстоятельства удастся установить. Если соглашение состоится, командованию предстоит подготовить государя, который будет отвечать за собственные приказы.\n\nОбещанный итог — независимая Империя. Дисциплину Эйри испытает приказ уступить управление, адресованный её собственным офицерам."
 hsm_ver_grover.1.a:0 "Начнём с действительных обстоятельств двора."
 hsm_ver_grover.2.t:0 "Что удалось установить"
 hsm_ver_grover.2.dead.d:0 "Разбирательство подтвердило смерть Гровера. Секретарь оставил место для более утешительного вывода, но свидетельства его не дают.\n\nДля него не будет ни опеки, ни уроков, ни будущей коронации. Совет ещё может устроить управление Герцландом, если будет действовать от собственного имени. Дело сохранит показания и имена тех, кто их дал."
 hsm_ver_grover.2.minor.d:0 "Служащие проверили двор и находящегося под его защитой живого Гровера. Он здесь и ещё не достиг совершеннолетия. Разбирательство установило человека, за которого может отвечать опекун, а не титул над пустым креслом.\n\nТеперь можно рассмотреть мандат. Он должен предусмотреть и нынешнюю жизнь Гровера, и власть, которую тот получит по окончании опеки."
 hsm_ver_grover.2.adult.d:0 "Гровер жив и находится здесь. Он также совершеннолетний. Писец дважды читает этот вывод, прежде чем вычеркнуть проект распоряжений о повседневном надзоре за воспитанником.\n\nДвор может устроить законный переход к его независимому правительству, но не вправе объявлять себя опекуном его детства. Оставшиеся вопросы касаются учреждений, территории и условий, при которых власть действительно можно передать."
 hsm_ver_grover.2.foreign.d:0 "Разбирательство установило, что Гровер находится в существующей зарубежной стране. Её придворные записи не становятся веренийским правом на опеку оттого, что наши войска удерживают Герцланд.\n\nНикто из этого двора не поручал его нам. Писцы внесут свидетельства в дело, а гражданская администрация продолжит работу, не притворяясь, будто находящийся за границей государь сидит за нашим столом."
 hsm_ver_grover.2.unknown.d:0 "Уцелевшие записи не подтверждают присутствие живого Гровера под нашей защитой. Одни сведения устарели, другие противоречат друг другу; ни одно не позволяет писцу удостоверить местный двор.\n\nОтсутствие доказательств не означает смерти. Оно также не даёт достаточного основания объявить опеку. Совет сможет вернуться к делу, когда появятся новые сведения. До тех пор он обязан честно говорить о том, что остаётся неизвестным."
 hsm_ver_grover.2.a:0 "Внести вывод без прикрас."
 hsm_ver_grover.3.t:0 "Временная печать"
 hsm_ver_grover.3.minor.d:0 "Новый заголовок гласит: «Веренийское регентство». Под ним мандат отделяет заботу о Гровере от гражданского управления Герцландом. Двор получает обязанность защищать, канцелярия — готовить собственный будущий уход.\n\nГровер смотрит, как опускается печать. Документ обещает корону его взрослому правительству, а Верении — возвращение к своему имени и делам. Регент подписал обязательство, исполнение которого сократит принимаемую им сейчас власть."
 hsm_ver_grover.3.adult.d:0 "Заголовок гласит: «Веренийское регентство», но действующие статьи описывают переход власти. Гровер уже совершеннолетний. Документ даёт администрации работу, которую нужно завершить, а не детство, которым можно распоряжаться.\n\nУчреждения должны подготовить независимое императорское правительство, определить его наследство и оформить союз с Веренией. Гровер читает обещание ухода прежде, чем регент ставит подпись. Временная печать не должна стать оправданием бессрочной отсрочки."
 hsm_ver_grover.3.a:0 "Вместе с властью принимается обязанность уйти."
 hsm_ver_grover.4.t:0 "Бумаги на столе Гровера"
 hsm_ver_grover.4.eri_diplomatic.d:0 "Гровер получил два перевода одного прошения. Аквилейский текст называет автора беспокойным, а герцландский оригинал — не получившим платы. Он спрашивает, какое слово ему следует усвоить.\n\nНаставники предлагают допускать на общие занятия переводчиков, инженеров и просителей, чтобы спорные свидетельства звучали на обоих языках. Секретариат предлагает тщательно отобранный курс технических занятий и показаний, предварительно приведённых к единому изложению.\n\nВинсенту нужно решить, сколько разногласий двор позволит в присутствии Гровера. Любой порядок расскажет ему что-то о руке, которая его выбрала."
 hsm_ver_grover.4.eri_military.d:0 "Официальное изложение кампании завершается возвращением порядка. Свидетельница за дверью сообщает, что её мастерскую отобрали позже этой даты. Гровер заметил расхождение между отчётом и приложенной жалобой.\n\nОдни советники хотят дать ему выслушать инженеров и жителей, переживших урегулирование. Другие предлагают строгий курс отобранных свидетельств и технических занятий, чтобы каждый урок не превращался в новый суд над победой.\n\nУ Винсента есть настоящие обязательства перед сражавшимися за него. Гровер также узнает, кого эти обязательства допускают в комнату."
 hsm_ver_grover.4.eyr_diplomatic.d:0 "Гровер спрашивает, почему рассказ о правлении его отца содержит столько церемоний и так мало управления. Архивист может принести приказы, прошения и решения, показывающие императора, способного и заботиться, и ошибаться. Ни одно не подходит к безупречному портрету, предложенному для учебной комнаты.\n\nИовинус может позволить документам и свидетелям говорить открыто, в том числе о неудобном для императорского двора. Или сохранить отобранное изложение, считая сдержанность и технические знания более надёжной школой будущего двора.\n\nГровер ждёт бумаги. Уважение к отцу ещё не определяет, кому позволено говорить о нём правду."
 hsm_ver_grover.4.eyr_military.d:0 "Приготовленная для Гровера военная история хвалит командование за отступление, которое первоначальные приказы описывают как дорогостоящую ошибку. Штаб предлагает исправить изложение прежде, чем оно попадёт к нему. Интендант предпочёл бы объяснить, как произошла ошибка и чем снабжали уцелевшие части.\n\nИовинус может допустить противоречащие друг другу свидетельства или поручить тщательно отобранный курс доверенным наставникам. И порядок, и откровенность предъявляют командиру требования.\n\nГровер попросил первоначальную карту. Ответ покажет, включает ли дисциплина право разбирать суждение офицера."
 hsm_ver_grover.4.a:0 "Пусть слышит свидетелей и читает оригиналы."
 hsm_ver_grover.4.b:0 "Поручить курс избранным советникам."
 hsm_ver_grover.5.t:0 "Имя сторонника в прошении"
 hsm_ver_grover.5.eri_diplomatic.d:0 "Проситель принёс перевод и подлинник договора. Оба требуют вернуть мельницу владельцам. Её нынешний держатель помог Винсенту добиться урегулирования и теперь просит считать свою службу основанием для исключения.\n\nГровер просит писца прочитать гарантию на обоих языках. Ни один текст не содержит такого исключения.\n\nОбычное разбирательство подчинит сторонника Винсента закону, который герцог сам одобрил. Защита покровителя сохранит полезную верность и покажет всем присутствующим, где заканчивается письменное обещание."
 hsm_ver_grover.5.eri_military.d:0 "Семья, изгнанная из поместья, предъявила документы на владение. Офицер, получивший землю после победы, предъявил благодарственную грамоту. Оба документа подлинные, но отвечают на разные вопросы.\n\nСоветники предупреждают Винсента, что возвращение собственности затронет ожидания тех, кто завоевал для него страну. Семья спрашивает, почему герцог должен платить свой долг её полями. Гровер следит за показаниями, не находя удобного рассказа о правых победителях и виноватых побеждённых.\n\nДвору предстоит выбрать между решением по доказательствам и привилегиями, обещанными победившим сторонникам."
 hsm_ver_grover.5.eyr_diplomatic.d:0 "Хартия даёт городу право оспорить размер сбора. Знатный дом, взимающий его, ссылается на исключительное право, более древнее, чем сама хартия. Его представитель напоминает Иовинусу, скольким урегулирование обязано семьям, согласившимся его принять.\n\nГровер узнаёт имя дома по бумагам отцовского двора. Имперское прошлое явилось требованием к нынешнему просителю.\n\nГерцог может применить общий порядок вопреки старой привилегии или сохранить исключение для покровителя. Любой ответ покажет Гроверу, меняет ли хартия повседневное управление."
 hsm_ver_grover.5.eyr_military.d:0 "Командир удержал повозки после окончания разрешённой реквизиции. Его донесение говорит об оперативной необходимости, а деревенская ведомость перечисляет семьи, которые не могут убрать урожай. Гровер спрашивает, кто подписал приказ о возврате. Иовинус.\n\nОфицеры утверждают, что открытое разбирательство ослабит доверие к командованию. Просители спрашивают, требует ли дисциплина от офицера исполнять неудобный приказ.\n\nОбычное слушание применит правила к собственному командованию герцога. Защита его привилегии удовлетворит верных военных за счёт тех, кого эти правила должны были защищать."
 hsm_ver_grover.5.a:0 "Применить закон к собственному стороннику."
 hsm_ver_grover.5.b:0 "Сохранить исключительную привилегию сторонника."
 hsm_ver_grover.6.t:0 "За пределами плаца"
 hsm_ver_grover.6.eri_diplomatic.d:0 "Штаб предлагает Гроверу место рядом со знамёнами. Он просит показать, как союзные армии работают вместе, когда их офицеры говорят на разных языках.\n\nСлужба снабжения предлагает работу с переводчиками, складами и госпиталями. Территориальные офицеры предлагают изучить местную оборону и ответственность командования. Оба пути могут пригодиться независимой Империи рядом с Веренией.\n\nВинсенту нужно выбрать опыт, который даст его двор. Безупречный парад не ответит на все вопросы будущего государя."
 hsm_ver_grover.6.eri_military.d:0 "Ветераны ожидают, что Гровер узнает кампанию через полки, которые её выиграли. У интендантов другой маршрут: дороги, мастерские и госпитали, поддерживавшие эти полки. Отбросить любой из рассказов значит потерять часть правды.\n\nОдна программа строит службу вокруг обеспечения оборонного союза. Другая учит территориальному командованию и обязанности отвечать за вверенных солдат.\n\nОфицерам Винсента нужно подготовить Гровера к собственной власти. Государь, лишь повторяющий их приказы, никогда не исполнит обещание, данное от его имени."
 hsm_ver_grover.6.eyr_diplomatic.d:0 "Гровер приносит хартию на заседание штаба. Оборонные статьи определяют обязательства правительств, но офицеры должны превратить их в выполнимую работу.\n\nСнабженцы предлагают изучать перевозки, медицинскую поддержку и предел того, что можно обещать союзнику. Территориальное командование предлагает планирование местной обороны и ответственность за следующие из него приказы.\n\nИовинус понимает ценность обоих путей. Ему предстоит выбрать опыт для Гровера, зная, что будущий император будет толковать тот же договор с другой стороны стола."
 hsm_ver_grover.6.eyr_military.d:0 "Учение начинается с приказа, который нельзя исполнить с указанными запасами. Гровер спрашивает, что неверно: донесение или приказ. Наставник отвечает, что командир должен выяснить это прежде, чем посылать солдат вперёд.\n\nИнтенданты предлагают программу обеспечения армии. Территориальный штаб предлагает практическое командование с обязанностью отвечать за ошибочное решение. Ни одна школа не должна завершаться торжественным смотром.\n\nИовинусу нужно подготовить Гровера к дню, когда офицеры Герцланда получат законный приказ, который веренийское командование уже не сможет отменить."
 hsm_ver_grover.6.a:0 "Начать со снабжения, госпиталей и общей обороны."
 hsm_ver_grover.6.b:0 "Учить территориальному командованию и ответственности."
 hsm_ver_grover.7.t:0 "Статья, связывающая регента"
 hsm_ver_grover.7.eri_diplomatic.d:0 "Статьи о престолонаследии прочитали на обоих придворных языках. Секретарь предлагает назвать будущую роль Винсента продолжающимся надзором. Гровер спрашивает, какое правительство тогда будет суверенным.\n\nОкончательный текст оставляет Герцланд независимой императорской короне. Верения сохраняет собственную страну и передаёт обещанные союзнику средства; её флот и офицеры остаются при ней. Договор достаточно точен, чтобы сделать уход обязанностью.\n\nВинсент годами убеждал других доверять его гарантиям. Теперь ему предстоит подписать ту, что требует отказаться от личной власти."
 hsm_ver_grover.7.eri_military.d:0 "Представители ветеранов просят оставить Верении постоянное право утверждать императорские назначения. Они называют это защитой созданного ими порядка. Гровер видит командование, которое переживёт регентство.\n\nВместо этого статьи готовят независимый Герцланд, обеспеченный оговорённой долей военных средств и связанный с Веренией союзом. Флот и веренийские офицеры остаются дома.\n\nВинсенту предстоит отказаться от права решать за государя, которого он защищал. Взрослый союзник сможет с ним не соглашаться. Это часть договора, а не недостаток, который следует исправить."
 hsm_ver_grover.7.eyr_diplomatic.d:0 "Старый императорский род попросил закрепить свои привилегии в статьях о престолонаследии. Просьба связала бы Гровера раньше, чем его правительство смогло бы рассмотреть вопрос. Иовинус кладёт её рядом с хартией.\n\nДоговор учреждает независимую корону со средствами для управления Герцландом и союзом с Веренией. Финансовые и военные обязательства определены; флот и веренийские офицеры остаются под своим правительством.\n\nГерцог не может гарантировать, что ему понравится каждое будущее решение. Он может гарантировать, что право решать перейдёт к государю, которому обещана независимость."
 hsm_ver_grover.7.eyr_military.d:0 "Штабной проект сохраняет веренийскую утверждающую подпись на императорских приказах. Иовинус понимает соблазн: знакомое командование сможет вмешаться, когда новое ошибётся. Гровер спрашивает, когда такой порядок закончится.\n\nСтатьи дают определённый ответ. Государь Герцланда получит землю, военные средства и власть распоряжаться ими. Флот и веренийские офицеры останутся у Верении; союз будет согласовывать действия двух правительств.\n\nИовинусу нужно обязать командиров к настоящей передаче власти. Дисциплина потребует исполнить приказ, прекращающий их право отдавать здесь приказы."
 hsm_ver_grover.7.a:0 "Подписать статьи, включая собственный уход."
 hsm_ver_grover.8.t:0 "Корона и счета"
 hsm_ver_grover.8.minor.d:0 "Распорядители церемонии сообщают, что корона готова. Служащие приносят менее изящную связку: назначения министров, окружные книги и счета, сопровождающие передачу власти. Военные ведомости приложены к тому же обязательству.\n\nГровер пока несовершеннолетний. Но приготовления уже можно закончить, чтобы не искать новой причины для отсрочки, когда его возраст и надёжный мир позволят исполнить обещание. До тех пор двор продолжит заботиться о нём, а администрация будет соблюдать подписанные статьи."
 hsm_ver_grover.8.adult.d:0 "Гровер рассматривает готовые ведомости как взрослый государь. Корона, гражданские счета и военные приготовления завершены; остаётся понять, можно ли безопасно осуществить передачу.\n\nДвору нечего добавлять к его воспитанию. Мир и надёжное владение Герцландом должны позволить передать министерства и части независимому правительству. Когда это станет возможно, обязательство будет исполнено без нового круга церемониальных приготовлений. До тех пор веренийская администрация отвечает за переход, который обещала завершить."
 hsm_ver_grover.8.a:0 "Исполнить готовое обязательство, когда это станет возможно."
 hsm_ver_grover.9.t:0 "Приказы от собственного имени"
 hsm_ver_grover.9.dead.d:0 "Совет закрыл королевский проект, сохранив в деле запись о смерти Гровера. Гражданское урегулирование не обещает коронации, которой никогда не будет.\n\nСтроители и писцы получают поручения от имени Верении. Их работа не исправит случившегося с императорским двором, но даст жителям суды и мастерские, чьи полномочия не зависят от вымысла."
 hsm_ver_grover.9.d:0 "Королевское обязательство уступило место гражданскому урегулированию. У совета нет действительного мандата, позволяющего исполнить прежнее обещание, и он больше не будет писать так, будто такой мандат есть.\n\nОставшаяся работа касается живущих здесь людей: их счетов, мастерских и споров. Новые поручения носят имя Верении. Обстоятельства государя остаются предметом правдивых записей, а не удобным завершением нашего воззвания."
 hsm_ver_grover.9.a:0 "У гражданской работы есть собственное основание."
 hsm_ver_grover.9.interrupted.d:0 "Совет закрыл прерванный мандат. Первоначальное обязательство больше нельзя было исполнить, и итоговый отчёт признаёт эту неудачу, не объявляя коронации.\n\nОставшиеся поручения касаются мастерских, реестров и общественных обязательств. Они носят имя Верении. Каковы бы ни были нынешние обстоятельства двора, гражданская администрация больше не будет ссылаться на полномочия отозванного королевского мандата."
 hsm_ver_grover.9.local.d:0 "Совет решил управлять Герцландом от собственного имени. Гровер остаётся здесь частным гостем под защитой, но правительство отказалось от императорского регентства. Забота о нём не даёт совету права обещать что-либо от имени его короны.\n\nГражданские поручения касаются мастерских, реестров и общественных обязательств. Они не обещают восстановить Империю при будущей коронации. Решение закрывает предложенный мандат и сохраняет защиту двора."
 hsm_ver_grover.10.t:0 "Снова Верения"
 hsm_ver_grover.10.eri_diplomatic.d:0 "Статьи читают на обоих языках, прежде чем Гровер получает императорскую корону. Затем Винсент подписывает последний документ своей временной власти. Под будущими приказами императора не оставлено места для его одобрения.\n\nГерцланд теперь принадлежит независимой союзной Империи. Оговорённые средства переданы, а Верения сохраняет собственные земли, офицеров и флот. Канцелярия возвращается к обычному имени страны.\n\nВинсент покидает зал союзником государя. Двор, который он помог подготовить, теперь может выслушать ответ, выбранный не им."
 hsm_ver_grover.10.eri_military.d:0 "Офицеры, некогда представившие Герцланд как победу, присутствуют при его передаче. Гровер принимает корону взрослым государем, а последний регентский приказ Винсента предписывает администрации признать его независимую власть.\n\nИмперия получила свою страну и средства, обещанные статьями. Верения сохраняет собственные земли, офицеров и флот; её обычное имя возвращается на печать канцелярии.\n\nГроверу больше не нужно разрешение бывшего опекуна, чтобы править. Винсент приобрёл союзника, чья свобода делает обещание труднее и весомее бессрочной опеки."
 hsm_ver_grover.10.eyr_diplomatic.d:0 "На коронации Гровера читают статьи о престолонаследии. Хартия, прежде связывавшая Иовинуса как опекуна, теперь определяет обязательства соседних суверенных правительств.\n\nВосстановленная Империя независимо управляет Герцландом и состоит в союзе с Веренией. Обещанные средства переданы; наши земли, офицеры и флот остались нашими. Канцелярия вернула обычное имя Верении.\n\nИовинус закрывает регентский экземпляр хартии. Гроверу предстоит ответить на вопросы, оставшиеся от отцовского двора, в том числе о привилегиях, которых ждёт уже его собственный двор. Теперь это вопросы его правления."
 hsm_ver_grover.10.eyr_military.d:0 "Перед коронацией Гровера командованию зачитывают последний веренийский приказ. На распоряжениях нового императора не будет утверждающей подписи Иовинуса. Офицеры признают передачу и отчитываются перед правительствами, которым они подчинены по статьям.\n\nГерцланд и обещанные средства теперь обеспечивают независимую союзную Империю. Верения сохраняет свою территорию, офицеров и флот и возвращается к обычному имени.\n\nИовинус годами требовал дисциплины. Сегодня она исполнила приказ, ограничивающий его собственное командование. Гровер получает вместе с короной власть."
 hsm_ver_grover.10.a:0 "Независимый союзник и собственная страна."
 hsm_ver_grover.11.t:0 "Первый стол императора"
 hsm_ver_grover.11.open_law_logistics.d:0 "Гровер просит принести первое прошение, не позволяя советнику переписывать жалобу. Он помнит открытые свидетельства при веренийском дворе и решение, связавшее влиятельного сторонника.\n\nРядом лежат отчёты снабжения и госпиталей. Служба научила его спрашивать, способна ли армия обеспечить исполнение своих приказов. С этого вопроса новый император и начинает.\n\nВерения теперь союзница. Бывший опекун может дать совет; решение и обязанность отвечать за него принадлежат Гроверу."
 hsm_ver_grover.11.open_law_command.d:0 "К прошению приложены первоначальные показания. Гровер помнит, как ему позволяли выслушивать спорное свидетельство и как закон применили к стороннику регента.\n\nТерриториальные командиры ждут указаний. Служба научила его, что командование включает ответственность за последствия, и он просит каждого офицера назвать основание его полномочий.\n\nВеренийскую утверждающую подпись больше не требуется искать. Первые решения императора покажут, что он сделает с примером бывших опекунов."
 hsm_ver_grover.11.open_patron_logistics.d:0 "Гровер помнит свободные свидетельства при веренийском дворе. Он также помнит просителя, чьи доказательства не перевесили полезность покровителя. Открытая дверь не всегда давала обычное разбирательство.\n\nОтчёты снабжения предлагают проверяемые вопросы: прибыли ли грузы, получили ли их госпитали. Служба научила его начинать с этого.\n\nУ нового двора уже есть сторонники, ожидающие внимания. Независимому императору предстоит решить, чего их верность позволяет требовать от чужой страны."
 hsm_ver_grover.11.open_patron_command.d:0 "Советник уверяет Гровера, что говорить позволено всем просителям. Он помнит эту свободу по веренийскому двору и покровителя, чья привилегия пережила высказанные против него доказательства.\n\nТерриториальное командование принесло приказы на утверждение. Служба показала ему, как власть достигает округа; прошение показало, как она может подвести стоящего у канцелярской двери.\n\nВерения больше не разрешит это противоречие за него. Независимому императору предстоит выбрать, какую верность будет вознаграждать его правительство."
 hsm_ver_grover.11.filtered_law_logistics.d:0 "Советники разложили утренние бумаги в знакомом Гроверу строгом порядке. Веренийский двор приучил его полагаться на избранных знатоков, но решение против полезного сторонника показало, что закон способен проникнуть и внутрь этого круга.\n\nОн просит сначала отчёты снабжения и госпиталей. Военная служба научила его замечать работу, стоящую за уверениями офицера.\n\nКорона даёт ему право выбирать, кто входит в его комнату. Бывшие веренийские опекуны отказались от права выбирать за него."
 hsm_ver_grover.11.filtered_law_command.d:0 "Новый секретариат приготовил отобранное изложение утренних прошений. Гровер узнаёт метод. Он также помнит неудобное решение, заставившее сторонника регента отвечать по обычному закону.\n\nЗа дверью ждут территориальные командиры. Служба научила его требовать ясной ответственности, в том числе за неудачный приказ.\n\nНезависимая корона оставляет ему самому соединять эти привычки. Советники могут подготовить изложение, но не могут унаследовать обязанность императора судить о нём."
 hsm_ver_grover.11.filtered_patron_logistics.d:0 "Отобранная справка кратка и успокоительна. Гровер помнит двор, работавший через доверенных советников и защищавший сторонника, когда обычное решение угрожало его поддержке. Такой порядок облегчал управление тем, кто уже находился внутри.\n\nСлужба снабжения научила его другой привычке: сравнивать уверение с действительно прибывшим грузом. Он просит первоначальные накладные.\n\nНовый император унаследовал полезные порядки и трудные прецеденты. Верения стоит рядом союзницей, а выбор того, что сохранить, принадлежит ему."
 hsm_ver_grover.11.filtered_patron_command.d:0 "Советники принесли отобранные бумаги и список надёжных сторонников. Гровер помнит обе привычки веренийского двора. Он помнит и прошение, остановившееся там, где начиналась привилегия покровителя.\n\nОбучение территориальному командованию показало ему силу приказа. Императорская печать теперь передаёт её ему вместе с ответственностью за исполнителей.\n\nВеренийское командование больше не говорит от имени Герцланда. Взрослому императору предстоит решить, достаточно ли доверия собственной верхушки, чтобы оправдать её требования."
 hsm_ver_grover.11.d:0 "Первые бумаги ждут императорской печати Гровера. Веренийская администрация передала полномочия независимому правительству, которое теперь отвечает за дела Герцланда.\n\nУ нового императора есть страна и союзница за её границей. Записи регентства остаются доступны, но ни один прежний опекун не подпишет решения, требующиеся теперь от него."
 hsm_ver_grover.11.a:0 "Принесите первое дело нашего правления."
 hsm_ver_grover.12.t:0 "Мандат больше не действует"
 hsm_ver_grover.12.dead.d:0 "Известие о смерти Гровера дошло до канцелярии. Обязательство двора заканчивается вместе с тем, кого оно должно было защитить; теперь его не завершит никакая церемония престолонаследия.\n\nКоролевский мандат отозван. За оставшуюся гражданскую работу нужно отчитаться без вымышленного воспитанника, обещанного появления или короны, ожидающей того, кто уже не придёт."
 hsm_ver_grover.12.custody.d:0 "Двор больше не может удостоверить, что Гровер находится под нашей защитой. Совет отозвал мандат, чтобы не продолжать издавать приказы от имени того, за кого он не в состоянии отвечать.\n\nПисцы не вправе превращать неизвестность в извещение о смерти, а чужую опеку — в нашу. Они закроют регентские счета по имеющимся свидетельствам. Гражданской администрации придётся найти иное основание власти."
 hsm_ver_grover.12.government.d:0 "Полномочия, на которых основывался королевский мандат, больше его не поддерживают. Одно присутствие Гровера не может сохранить право прежнего правительства действовать за него.\n\nПоэтому обязательство регентства отозвано. Его записи остаются, включая обещания и незавершённую работу. Следующее гражданское урегулирование должно отвечать за собственную власть, не выдавая прерванный мандат за состоявшуюся коронацию."
 hsm_ver_grover.12.a:0 "Записать, что закончилось и что осталось неисполненным."
 hsm_ver_grover.13.t:0 "Больше не воспитанник"
 hsm_ver_grover.13.d:0 "Гровер достиг совершеннолетия. Распоряжения двора о его воспитании закрыты, и администрация обязана обращаться с ним как со взрослым.\n\nСамо по себе это ещё не завершает передачу страны. Нужно закончить согласованные приготовления, надёжно удерживать Герцланд и дождаться мира, позволяющего его правительству вступить в должность. Любая оставшаяся работа относится к переходной администрации, а не к продлению детства Гровера.\n\nРегент обязан сообщить, что ещё предстоит сделать, и передать власть, когда эти обязательства можно будет исполнить."
 hsm_ver_grover.13.a:0 "Его совершеннолетие наступило; оставшийся долг — наш."
 hsm_ver_grover.lapsed.a:0 "У этого слушания больше нет действительного мандата."
