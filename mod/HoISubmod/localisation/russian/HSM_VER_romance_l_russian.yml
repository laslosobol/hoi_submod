l_russian:
 HSM_VER_rosaline_and_montague:0 "Розалин и Монтаг"
 HSM_VER_rosaline_and_montague_desc:0 "Леди Розалин Эри из Бентри и Монтаг Эйри, граф Верении, впервые пересекли границу с письмами, которые написали сами. Совместная работа на съезде добавила к их привязанности общую ответственность. Поженившись по собственному желанию, они приняли единую герцогскую власть после того, как Винсент и Иовинус отказались от соперничающих притязаний перед представителями обоих Домов. Розалин умеет расслышать вопрос, который просителю не дают задать; Монтаг помнит места, не попавшие в безупречный придворный отчёт. Ни одна подпись в отдельности не может говорить от имени их общей короны."
 HSM_VER_rosaline_erie:0 "Розалин Эри"
 HSM_VER_montague_eyrie:0 "Монтаг Эйри"
 HSM_VER_ROM_rosaline_petitions:0 "Розалин Эри"
 HSM_VER_ROM_rosaline_petitions_desc:0 "Розалин лично руководит канцелярией прошений. Прежде чем обсуждать положение просителя, её служащие обязаны ответить по существу жалобы."
 HSM_VER_ROM_montague_provinces:0 "Монтаг Эйри"
 HSM_VER_ROM_montague_provinces_desc:0 "Монтаг согласует работу окружных управлений, выезжая с землемерами и местными представителями, пока за соглашением на бумаге не появится дорога, мост или действующее расписание."
 HSM_VER_ROM_two_signatures:0 "Две подписи, одна корона"
 HSM_VER_ROM_two_signatures_desc:0 "Оба Дома признают единую герцогскую власть, которую супруги осуществляют совместно согласно открытым статьям союза."
 HSM_VER_ROM_doors_of_the_court:0 "Открытые двери двора"
 HSM_VER_ROM_doors_of_the_court_desc:0 "Регулярные приёмы позволяют общему двору слышать тех, кто живёт под властью его решений."
 HSM_VER_ROM_court_on_the_road:0 "Двор в дороге"
 HSM_VER_ROM_court_on_the_road_desc:0 "Поездки по округам дают местным служащим прямой доступ к общему двору и помогают вести провинциальные работы."
 HSM_VER_ROM_keeper_of_petitions:0 "Хранительница прошений"
 HSM_VER_ROM_keeper_of_petitions_desc:0 "Терпеливое слушание и письменный ответ способны уладить обиды, с которыми не справились годы церемоний."
 HSM_VER_ROM_provincial_coordinator:0 "Координатор провинций"
 HSM_VER_ROM_provincial_coordinator_desc:0 "Дороги и мосты строятся через прежнюю границу при участии самих округов."
 hsm_ver_romance.1.t:0 "Имя под письмом"
 hsm_ver_romance.1.d:0 "Розалин приехала к мосту с последним письмом Монтага, сложенным вчетверо. Он назвал реку серебряной. После дождей она разлилась и была бурой; Розалин сообщила ему об этом прежде, чем он закончил приветствие.\n\n«Я пытался уговорить тебя приехать», — признался он.\n\n«Можно было просто попросить».\n\nСтражники остались у заставы. Винсент разрешил ей поездку; Иовинус выдал своему родичу пропуск. Ни одна бумага не объясняла, что гостям полагается говорить при встрече. Некоторое время они обсуждали погоду, мост и особенно несносного трактирщика. Потом Розалин взяла его за лапу. Монтаг посмотрел вниз, словно ему доверили нечто хрупкое.\n\nОна сказала, что скучала. Он ответил без сравнений с рекой. К тому времени, когда сопровождающий напомнил о часе отъезда, они уже условились встретиться снова и поспорили, кому предстоит более долгая дорога.\n\nДворам доложили кратко: оба вернулись благополучно. Следующее письмо Розалин начиналось там, где заканчивался доклад."
 hsm_ver_romance.1.a:0 "В следующий раз попроси сам."
 hsm_ver_romance.2.t:0 "Место за столом"
 hsm_ver_romance.2.d:0 "Секретарь съезда посадил Розалин и Монтага рядом с цветами. В плане рассадки нашлось место их именам, но не пачке окружных прошений, которую Розалин положила на стол.\n\n«Какой приятный повод», — начал секретарь.\n\n«С мельника дважды взяли пошлину за одну телегу, — ответила она. — Который из поводов ему следует счесть приятным?»\n\nМонтаг провёл старую границу по карте мельника. Переправу он знал: сборщики по обе стороны всё ещё пользовались разными книгами. Вместе они представили жалобу делегатам. Винсент спросил, намерены ли они каждое утро тратить на такие мелочи. Иовинус захотел узнать, кто ответит следующему округу.\n\n«Мы», — сказал Монтаг и лишь затем посмотрел на Розалин. Та кивнула, но поправила его: понадобятся писцы, способные выполнять обещания и в их отсутствие.\n\nПредложения было два. Розалин хотела устроить регулярный открытый приём с письменными ответами, доступными каждому. Монтаг предлагал возить писцов по провинциям и решать споры там, где находятся свидетели и сломанные мосты. Оба замысла придавали смысл их месту рядом с цветами."
 hsm_ver_romance.2.a:0 "Розалин: Пусть наши двери будут открыты."
 hsm_ver_romance.2.b:0 "Монтаг: Поедем туда, где нас ждут."
 hsm_ver_romance.3.t:0 "О чём мы просим"
 hsm_ver_romance.3.d:0 "Монтаг отрепетировал речь о будущем. Розалин выслушала первое предложение, узнала интонацию выступления на съезде и попросила начать заново.\n\n«Ты выйдешь за меня?»\n\n«Да. Я уже думала, ты назначишь секретаря, чтобы он спросил».\n\nОни рассмеялись, и некоторое время бумаги могли подождать. Когда к ним вернулись, объявление о помолвке лежало рядом с проектом статей общего правления. Розалин настояла на том, чтобы отнести герцогам два документа по отдельности. Она хотела, чтобы Винсент услышал её ответ раньше чужой рекомендации.\n\nУ делегатов была собственная рекомендация. Эти двое работали сообща там, где старшие претенденты по-прежнему подсчитывали доводы друг против друга. После утверждения союза им следовало совместно занять общую герцогскую должность, скрепляя каждый государственный акт двумя подписями.\n\nВинсент дважды прочёл статью, прекращавшую его отдельные притязания. Иовинус спросил, кто будет командовать армией; ответ отсылал к статьям, уже представленным съезду. Никто не обнаружил тайного исключения для себя. Наконец Винсент отложил перо. Иовинус последовал его примеру. Они передадут власть завершённому соглашению, а на свадьбу придут как родные."
 hsm_ver_romance.3.a:0 "Два обещания, каждое по доброй воле."
 hsm_ver_romance.4.t:0 "Колокола обоих Домов"
 hsm_ver_romance.4.d:0 "Колокола зазвонили до того, как процессия вышла на площадь. В общем гуле Розалин не могла различить напев ни одного из городов. Монтаг заметил, что, возможно, так лучше. Она сжала его лапу достаточно крепко, чтобы прекратить замечания.\n\nБрачные обещания произнесли без секретаря. Затем супруги вместе вошли в зал, где рядом с Винсентом и Иовинусом ждали представители объединённых округов. Герцоги положили печати на стол. Их отречения прочли вслух, а вслед за ними — статьи об общей власти. Винсент наблюдал за свидетелями; Иовинус — за офицерами, приносившими новую присягу.\n\nРозалин подписала первой. Монтаг повернул лист, чтобы поставить свою подпись рядом, не размазав чернила. Когда служитель поднёс единственное церемониальное кресло, она попросила ещё одно. По полу недолго и совсем не торжественно проскрипели ножки. Старые герцоги улыбнулись.\n\nСнаружи толпа всё ещё ждала новобрачных. В зале под двумя свежими подписями лежало первое прошение их правления. Они договорились выйти к людям, а затем вернуться и прочитать его вместе."
 hsm_ver_romance.4.legacy.d:0 "Розалин и Монтаг пришли в давно действующий общий двор с двумя документами. Первый объявлял об их намерении пожениться. Второй содержал предложение представителей: передать им единую герцогскую власть, чтобы они осуществляли её совместно.\n\nИх письма пережили вражду Домов. Привязанность росла во встречах, редко заслуживавших придворного объявления: прогулках, оборванных дождём, пропущенной карете, вечере, потраченном на спор о первой переправе. Розалин помнила бурую реку. Монтаг уверял, что с его берега она казалась серебряной.\n\nПравящий герцог спросил, понимают ли они цену второго документа. Розалин ответила, что прочла ожидающие его прошения. Монтаг сказал, что и эту работу они намерены делить. Герцог велел принести открытые статьи и созвать представителей. Передача власти пройдёт при свидетелях на основании того же соглашения, которое объединило страну.\n\nВ день свадьбы звон колоколов доносился в зал через раскрытые окна. За брачными обещаниями последовали отречение, присяга общему двору и две подписи. Новые правители вместе встали навстречу окружным делегатам. Впервые никому не требовалось решать, какой Дом следует приветствовать первым."
 hsm_ver_romance.4.a:0 "Розалин и Монтаг будут править вместе."
 HSM_VER_ROM_meeting_tt:0 "Розалин и Монтаг по собственному желанию начинают ухаживание. Их совместная работа продолжится после открытия дипломатического съезда."
 HSM_VER_ROM_open_court_tt:0 "Их будущее совместное правительство будет проводить открытые приёмы и после свадьбы получит следующую черту:"
 HSM_VER_ROM_travelling_court_tt:0 "Их будущее совместное правительство будет посещать округа и после свадьбы получит следующую черту:"
 HSM_VER_ROM_betrothal_tt:0 "Розалин и Монтаг обручаются. Герцоги обещают передать им власть после дипломатического объединения; до последней церемонии нынешние правители сохранят должности."
 HSM_VER_ROM_handover_tt:0 "§YРозалин и Монтаг§! сменят герцога-основателя как совместные конституционные правители. Смена главы государства не отстраняет действующих военачальников. Розалин сможет возглавить работу с прошениями, а Монтаг — провинциальное управление: оба станут доступны как необязательные политические советники стоимостью §Y100 единиц политической власти§! каждый."
 HSM_VER_ROM_started:0 "Розалин и Монтаг решили быть вместе"
 HSM_VER_ROM_service_agreed:0 "Розалин и Монтаг приняли общие общественные обязанности"
 HSM_VER_ROM_open_court:0 "Розалин и Монтаг обещали открытые приёмы"
 HSM_VER_ROM_travelling_court:0 "Розалин и Монтаг обещали поездки по провинциям"
 HSM_VER_ROM_betrothed:0 "Розалин и Монтаг обручены"
 HSM_VER_ROM_crowned:0 "Розалин и Монтаг принесли совместную присягу"
 HSM_VER_ROM_legacy_handover:0 "Существующий союз засвидетельствовал передачу власти супругам"
 HSM_VER_ROM_delivery:0 "Встреча представителей двух Домов ожидает ответа"
 HSM_VER_ROM_wedding_delivery:0 "Свадьба и публичная передача власти ожидают ответа"
