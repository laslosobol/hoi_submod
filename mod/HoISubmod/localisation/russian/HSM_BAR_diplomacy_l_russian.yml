l_russian:
 HSM_BAR_diplomacy:0 "Баррад и его соседи"
 HSM_BAR_diplomacy_desc:0 "Падение Пентархии не решило пограничных споров. Виттенленд оспаривает суверенитет Баррада, Каса требует свободы для преследуемых, а Аустурланд хочет обезопасить границу. Наши делегаты могут предложить инспекции и обязательства; соседи вправе потребовать уступок или готовиться к войне."
 HSM_BAR_dip_treaty:0 "Баррадские соглашения"
 HSM_BAR_dip_review:0 "Передать требования новой администрации."
 HSM_BAR_dip_lapsed:0 "Обстоятельства изменились."
 HSM_BAR_dip_refuse:0 "Отвергнуть условия и принять последствия."
 HSM_BAR_dip_refusal_tt:0 "Переговоры провалятся. Уже начатая мобилизация должна завершиться, прежде чем сосед решит, осуществлять ли угрозу. Отказ может привести к цели войны на аннексию и объявлению войны; он не даёт защиты."
 HSM_BAR_dip_enforce:0 "Претворить наши требования в жизнь."
 HSM_BAR_dip_enforce_tt:0 "Если Баррад остаётся независимым и не воюет с нами, мы получим цель войны на аннексию. Война будет объявлена, если это допускают дипломатические правила; иначе цель войны сохранится. Уже идущая война этими переговорами не прекращается."
 HSM_BAR_dip_withdraw:0 "Отозвать угрозу на полгода."
 HSM_BAR_dip_signed_t:0 "Баррадские соглашения подписаны"
 HSM_BAR_dip_signed_d:0 "Баррад принял условия нашей делегации. Инспекторы смогут проверить соблюдение согласованных гарантий, а правительства подписали пакт о ненападении. Это политическое урегулирование отношений с соседом, который сохраняет свою государственность. Наша внутренняя программа может продолжаться без аннексии его земель. Договор не защищает от будущего нарушения обязательств или притязаний третьих стран."
 HSM_BAR_dip_signed:0 "Опубликовать условия и назначить комиссию."
 HSM_BAR_dip_failed_t:0 "Переговоры с Баррадом провалились"
 HSM_BAR_dip_failed_d:0 "Срок переговоров истёк либо Баррад отверг наши условия. Уже начатая мобилизация завершилась. Теперь следует решить, осуществить ли угрозу или заплатить политическую цену за её отзыв на полгода. Отступление не означает заключения договора и не исключает нового столкновения в будущем."
 HSM_BAR_dip_WIT_legacy_d:0 "Прежний ультиматум Виттенленда пришёл в Баррад, где Пентархия уже пала. Новая администрация заявляет о преемственности государства и праве вести переговоры. Вместо старой процедуры капитуляции предстоит конференция о суверенитете, инспекциях и пределах виттенлендских притязаний."
 HSM_BAR_dip_WIT_approach_t:0 "Кто представляет Баррад?"
 HSM_BAR_dip_WIT_white_d:0 "Уайт Стар получает обращение коллегии Баррада. Её члены предлагают открытые реестры лабораторий, приём жалоб граждан и подотчётный совет вместо личных магических владений. Территориальный спор остаётся: Виттенленд считает Баррад утраченной провинцией. Уайт Стар может признать ответственного соседа при условии инспекций или настоять на виттенлендском надзоре за урегулированием."
 HSM_BAR_dip_WIT_claim_d:0 "Гражданское правительство Баррада просит признать его суверенитет. Смена правителей не отменяет исторических притязаний Виттенленда, а обещания новой администрации требуют проверки. Можно предложить признание в обмен на открытые инспекции или предъявить ультиматум о создании внешней комиссии с полномочиями на спорной границе."
 HSM_BAR_dip_WIT_offer:0 "Признать суверенитет при независимых инспекциях."
 HSM_BAR_dip_WIT_demand:0 "Потребовать обязательную пограничную и лабораторную комиссию."
 HSM_BAR_dip_WIT_terms_t:0 "Виттенленд предлагает условное признание"
 HSM_BAR_dip_WIT_terms_collegium_d:0 "Виттенленд признает отдельное правительство Баррада, если коллегия откроет лабораторные реестры, обеспечит рассмотрение жалоб граждан и допустит независимую проверку опасных исследований. Взамен Виттенленд откажется от немедленной аннексии и подпишет пакт о ненападении. Коллегия сохранит свои учреждения, но будет публично отвечать за их деятельность."
 HSM_BAR_dip_WIT_terms_directorate_d:0 "Виттенленд предлагает признать гражданское правительство Баррада в обмен на инспекции исследовательских объектов и независимые свидетельства. Он отзовёт цель войны на аннексию и подпишет пакт о ненападении. Гражданские министры считают себя самостоятельными правителями и ничего не знают о тайной службе, управляющей Баррадом через их администрацию. Службе придётся обеспечить исполнение договора через это публичное прикрытие, не раскрывая своего существования."
 HSM_BAR_dip_WIT_ultimatum_t:0 "Ультиматум Виттенленда о суверенитете"
 HSM_BAR_dip_WIT_ultimatum_collegium_d:0 "Виттенленд требует постоянную комиссию для разбора пограничных инцидентов и надзора за опасными лабораториями. Согласие ограничит свободу действий коллегии и повредит её внутреннему авторитету, но сохранит правительство и территорию Баррада. Виттенленд урегулирует свои непосредственные притязания и подпишет пакт о ненападении. Отказ грозит вторжением."
 HSM_BAR_dip_WIT_ultimatum_directorate_d:0 "Виттенленд требует от гражданского правительства Баррада принять постоянную инспекционную комиссию и обязательный арбитраж пограничных споров. Министры уступят часть полномочий, сохранив территорию под защитой пакта о ненападении. Неизвестная им тайная служба должна изменить указания, которые незаметно проводит через администрацию, с учётом работы комиссии. Её власть должна остаться скрытой от обоих правительств. Отказ может привести к войне."
 HSM_BAR_dip_WIT_sign:0 "Открыть реестры и подписать соглашение о признании."
 HSM_BAR_dip_WIT_concede:0 "Принять комиссию и сохранить наше правительство."
 HSM_BAR_dip_WIT_agreement_tt:0 "Виттенленд признает урегулирование и подпишет пакт о ненападении. Его цель войны на аннексию будет отозвана. Пограничные и лабораторные инспекции остаются обязательными до расторжения соглашения или начала войны."
 HSM_BAR_dip_ZES_approach_t:0 "Беженцы у границы"
 HSM_BAR_dip_ZES_lua_d:0 "Луа Рамеди добивается упорядоченного урегулирования: учёта пересечений границы, гражданских служб помощи и проверяемой отмены рабства в Барраде. Торговля и восстановление могут поддержать реформы, но пограничный контроль не должен возвращать беглецов прежним хозяевам. Её делегация предпочитает проверяемое соглашение новой войне."
 HSM_BAR_dip_ZES_pasarinha_d:0 "Пасаринья спрашивает, кто будет говорить от имени бежавших из Баррада. Она требует безопасного прохода, защиты от насильственного возвращения и права перемещённых общин направлять своих представителей в инспекционную комиссию. Новый флаг над баррадскими учреждениями не убедит её без практических гарантий для уязвимых."
 HSM_BAR_dip_ZES_yrmthu_d:0 "Ирмтху видит возможность заменить поход на север конференцией общин. Представители беженцев должны заседать рядом с новой администрацией Баррада; рабство и принудительный труд должны прекратиться, а инспекторы должны свободно собирать свидетельства. Договор позволит конгрессу Касы обратиться к внутренней программе."
 HSM_BAR_dip_ZES_altu_d:0 "Алту Кекса не доверяет доводам о том, что новое правительство сделало вмешательство ненужным. Он требует доступа к местам заключения, освобождения подневольных работников и публичного расследования преступлений Пентархии. Баррад ещё может избежать войны, но закрытая лаборатория и обещание его не устроят."
 HSM_BAR_dip_ZES_council_d:0 "Совет Касы получил предложение переговоров из Баррада. Беженцы по-прежнему рассказывают о неволе и исчезновениях. Совету предстоит решить, достаточно ли независимых инспекций и безопасного прохода или справедливость требует более сильной комиссии с доступом к тюрьмам и показаниям бывших пленников."
 HSM_BAR_dip_ZES_offer:0 "Предложить соглашение об убежище и борьбе с рабством."
 HSM_BAR_dip_ZES_demand:0 "Потребовать проверки мест заключения и публичной ответственности."
 HSM_BAR_dip_ZES_terms_t:0 "Соглашение Касы о беженцах и свободе"
 HSM_BAR_dip_ZES_terms_collegium_d:0 "Каса предлагает покончить с рабством и принудительным трудом, защитить беженцев от насильственного возвращения и открыть места заключения для инспекций. Представители беженцев будут услышаны наряду с коллегией. Соглашение потребует административных усилий и публично проверит надёжность новых учреждений. Каса подпишет пакт о ненападении и политически завершит свою непосредственную кампанию против Баррада."
 HSM_BAR_dip_ZES_terms_directorate_d:0 "Каса требует от гражданского правительства Баррада отменить рабство и принудительный труд, защитить беженцев и открыть места заключения для независимых инспекций. Местные чиновники не должны препятствовать подаче жалоб. Взамен Каса предлагает пакт о ненападении и отказ от ближайших планов вмешательства. Тайной службе придётся обеспечить выполнение обязательств через публичную администрацию, скрывая свою власть в том числе от министров, подписывающих договор."
 HSM_BAR_dip_ZES_ultimatum_t:0 "Каса требует отчёта"
 HSM_BAR_dip_ZES_ultimatum_collegium_d:0 "Касе недостаточно провозглашённой отмены рабства. Её комиссия будет проверять тюрьмы и трудовые объекты, выслушивать бывших пленников и публиковать сведения об ответственных за злоупотребления. Коллегии придётся принять политическую цену раскрытия дел её основателей. Согласие принесёт пакт о ненападении; отказ позволит Касе осуществить угрозу вмешательства."
 HSM_BAR_dip_ZES_ultimatum_directorate_d:0 "Каса требует публичных слушаний, доступа к тюрьмам и трудовым объектам и освобождения пленников, удерживаемых по порядкам Пентархии. Её делегация возлагает ответственность на гражданское правительство Баррада. Министры не знают о тайной службе, которая управляет государством за их спинами; службе придётся направлять их ответ, не становясь участником переговоров. Согласие обойдётся авторитетом, но обеспечит пакт о ненападении. Отказ может привести армию Касы через границу."
 HSM_BAR_dip_ZES_sign:0 "Отменить неволю, защитить убежище и допустить инспекторов."
 HSM_BAR_dip_ZES_concede:0 "Открыть места заключения и принять публичные слушания."
 HSM_BAR_dip_ZES_agreement_tt:0 "Каса подпишет соглашение о беженцах и борьбе с рабством, а также пакт о ненападении. Её цель войны на аннексию будет отозвана. Внутренняя программа после разрешения баррадского вопроса продолжится без территориальных завоеваний."
 HSM_BAR_dip_OLV_approach_t:0 "Безопасность границы Аустурланда"
 HSM_BAR_dip_OLV_democratic_d:0 "Избранное правительство Аустурланда хочет, чтобы граждане пересекали границу без страха перед рейдами и магическими авариями. Оно предлагает совместные отчёты об инцидентах, проверки приграничных объектов и обязательство не укрывать вооружённые группы. Урегулирование должно также исключить превращение пограничных патрулей в оправдание аннексии."
 HSM_BAR_dip_OLV_communist_d:0 "Социалистическое правительство Аустурланда требует от гражданской администрации Баррада доказать, что личные магические владения Пентархии остались в прошлом. Оно настаивает на участии приграничных работников и перемещённых граждан в совместной комиссии, а также на проверках, исключающих официальное покровительство вооружённым бандам. Делегаты будут судить об обязательствах публичного правительства по положению на границе."
 HSM_BAR_dip_OLV_crown_d:0 "Правители Аустурланда рассматривают Баррад с точки зрения интересов государства и армии. Они могут ограничиться инспекциями пограничных объектов и запретом поддержки вооружённых групп или потребовать особую приграничную зону под надзором своих офицеров. Смена администрации в Барраде не обязывает экспансионистское правительство отказаться от амбиций."
 HSM_BAR_dip_OLV_offer:0 "Предложить совместные инспекции и пограничный пакт."
 HSM_BAR_dip_OLV_demand:0 "Потребовать приграничную зону под надзором."
 HSM_BAR_dip_OLV_terms_t:0 "Пограничный протокол Аустурланда"
 HSM_BAR_dip_OLV_terms_collegium_d:0 "Аустурланд предлагает совместные отчёты об инцидентах, проверки опасных объектов у границы и запрет укрывать вооружённые группы, нападающие на соседнюю страну. Гражданские делегаты получат доступ к комиссии. Коллегия сохранит контроль над границей, приняв внешний надзор; обе страны подпишут пакт о ненападении."
 HSM_BAR_dip_OLV_terms_directorate_d:0 "Аустурланд требует от гражданского правительства Баррада зарегистрировать приграничные объекты, расследовать рейды вместе с совместной комиссией и прекратить укрывать вооружённые группы, действующие через границу. Пограничные власти сохранят командование, но будут обязаны проверять иностранные жалобы. Согласие принесёт пакт о ненападении. Тайная служба, управляющая Баррадом, должна провести эти обязательства через обычные административные распоряжения: ни гражданское правительство, ни соседи не знают о её существовании."
 HSM_BAR_dip_OLV_ultimatum_t:0 "Аустурланд требует пограничных ограничений"
 HSM_BAR_dip_OLV_ultimatum_collegium_d:0 "Аустурланд требует предварительных уведомлений об учениях и новых военных объектах у границы, а также доступа для постоянной инспекционной комиссии. Коллегия уступит часть военной свободы и заплатит внутреннюю политическую цену. Баррад сохранит территорию и правительство. Согласие обеспечит пакт о ненападении; отказ может означать войну."
 HSM_BAR_dip_OLV_ultimatum_directorate_d:0 "Аустурланд требует от гражданского правительства Баррада заранее уведомлять о приграничных учениях и допускать инспекции новых пограничных объектов. Ограничения сократят военную свободу, но сохранят территорию Баррада под пактом о ненападении. Тайная служба должна приспособить своё скрытое управление государством к этим условиям, оставив министров в неведении о том, кто направляет их администрацию. Отказ позволит Аустурланду осуществить угрозу."
 HSM_BAR_dip_OLV_sign:0 "Зарегистрировать границу и подписать совместный протокол."
 HSM_BAR_dip_OLV_concede:0 "Принять ограничения приграничного развёртывания."
 HSM_BAR_dip_OLV_agreement_tt:0 "Аустурланд подпишет пограничный протокол и пакт о ненападении. Его цель войны на аннексию будет отозвана. Уже начатая мобилизация завершится без объявления войны, пока соглашение действует."
 HSM_BAR_dip_GRU_t:0 "Северный крестовый поход продолжается"
 HSM_BAR_dip_GRU_d:0 "Грифусу сообщили, что Пентархия больше не правит Баррадом. Его крестоносцы не считают новую публичную администрацию ответом на свои территориальные и религиозные притязания. Их мобилизация завершилась, но перед оформлением цели войны они направили последнее предупреждение. У нас около двух недель на подготовку; наши прочие договоры не связывают Грифус."
 HSM_BAR_dip_GRU_resist:0 "Уведомить пограничные гарнизоны."
 HSM_BAR_dip_GRU_tt:0 "Через пятнадцать дней после отправки предупреждения Грифус получит прежнюю территориальную цель войны, если обе страны остаются независимыми, не состоят в одном альянсе и ещё не воюют."
 HSM_BAR_dip_WIT_envoy:0 "Отправить делегацию в Виттенленд"
 HSM_BAR_dip_WIT_envoy_desc:0 "Предложить переговоры о признании и конкретных гарантиях. Правительство Виттенленда выберет условия, которые мы сможем принять или отвергнуть. На обмен отведено сорок пять дней; отказ может привести к войне. Переговоры не сбрасывают уже начатую мобилизацию."
 HSM_BAR_dip_WIT_deadline:0 "Срок переговоров с Виттенлендом"
 HSM_BAR_dip_WIT_deadline_desc:0 "Обе делегации должны согласовать условия за сорок пять дней. Истечение срока считается отказом. Уже идущая мобилизация должна завершиться, прежде чем сосед решит, осуществлять ли угрозу."
 HSM_BAR_dip_WIT_renounce:0 "Расторгнуть соглашение с Виттенлендом"
 HSM_BAR_dip_WIT_renounce_desc:0 "Прекратить инспекционные обязательства и пакт о ненападении с Виттенлендом. Его правительство вернётся к спору и может потребовать более жёстких условий. Отказ от новых требований способен привести к войне."
 HSM_BAR_dip_ZES_envoy:0 "Отправить делегацию в Касу"
 HSM_BAR_dip_ZES_envoy_desc:0 "Предложить переговоры о признании и конкретных гарантиях. Правительство Касы выберет условия, которые мы сможем принять или отвергнуть. На обмен отведено сорок пять дней; отказ может привести к войне. Переговоры не сбрасывают уже начатую мобилизацию."
 HSM_BAR_dip_ZES_deadline:0 "Срок переговоров с Касой"
 HSM_BAR_dip_ZES_deadline_desc:0 "Обе делегации должны согласовать условия за сорок пять дней. Истечение срока считается отказом. Уже идущая мобилизация должна завершиться, прежде чем сосед решит, осуществлять ли угрозу."
 HSM_BAR_dip_ZES_renounce:0 "Расторгнуть соглашение с Касой"
 HSM_BAR_dip_ZES_renounce_desc:0 "Прекратить инспекционные обязательства и пакт о ненападении с Касой. Его правительство вернётся к спору и может потребовать более жёстких условий. Отказ от новых требований способен привести к войне."
