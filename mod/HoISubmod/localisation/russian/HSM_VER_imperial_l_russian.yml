l_russian:
 HSM_VER_IMP_settlement:0 "Гриффенхеймское соглашение"
 HSM_VER_IMP_settlement_desc:0 "Нападение империи на участника хартии окончилось поражением агрессора, а мирная конференция передала Гриффенхейм под наше управление. Победа принесла обязанности, которых Веренийская хартия не предусматривала. Мы можем учредить временную гражданскую комиссию по восстановлению с публичной отчётностью и определённым сроком полномочий. Хартия не обязывает нас принимать императорскую корону."
 HSM_VER_IMP_household_record:0 "Дело императорского дома"
 HSM_VER_IMP_household_record_desc:0 "Судьбу Гровера VI нельзя установить по описи дворца. Прежде чем вносить династические положения в соглашение, следует отличить ребёнка от взрослого, подтверждённую смерть от слухов, а местопребывание здесь от убежища в другой стране. Сам по себе отчёт комиссии не даёт ни титула, ни права опеки."
 HSM_VER_IMP_city_contracts:0 "Подряды для живого города"
 HSM_VER_IMP_city_contracts_desc:0 "Гриффенхейму нужны мастерские, крыши и работающие городские службы. Комиссия может открыть гражданское предприятие или вложить средства в строительные методы, которыми городские бригады смогут пользоваться самостоятельно. Это будут общественные работы, а не награды новому императорскому двору."
 HSM_VER_IMP_open_archives:0 "Открыть технические архивы"
 HSM_VER_IMP_open_archives_desc:0 "За имперскими печатями хранятся полезные результаты изысканий, чертежи и акты проверок. Гражданские инженеры опишут их и опубликуют материалы, необходимые для восстановления производства. Доступ к этим бумагам не даёт власти над династией, чьи печати когда-то их защищали."
 HSM_VER_IMP_technical_agreement:0 "Добровольный технический протокол"
 HSM_VER_IMP_technical_agreement_desc:0 "Сохранившие независимость правительства хартии могут обмениваться с нами техническими публикациями и производственными стандартами. Инженеры дома, законно вошедшего в единое государство, вместо этого просят гражданский совет утвердить внутреннюю программу. Каждое предложение требует явного ответа. Отказ не мешает продолжать восстановление."
 HSM_VER_IMP_public_accounts:0 "Опубликовать отчёт комиссии"
 HSM_VER_IMP_public_accounts_desc:0 "Комиссия должна отчитаться за заказанные предприятия, опубликованные труды и служащих, которых она всё ещё удерживает от обычной работы. Временная администрация не вправе продлевать себя, объявляя собственные дела незаменимыми. Представители города изучат сметы, прежде чем решат, оправдывает ли ещё один оплаченный год отсрочку передачи полномочий."
 HSM_VER_IMP_last_year:0 "Последний год финансирования"
 HSM_VER_IMP_last_year_desc:0 "У незаконченных ремонтов есть названия и адреса в последней смете комиссии. Средства ещё на один год позволят продолжить работу бригад и исследовательского бюро, пока городские чиновники изучают счета, которые им предстоит принять. Дата закрытия останется на первой странице. Временный мандат должен завершиться, даже если инженеры ещё находят, что стоило бы отремонтировать."
 HSM_VER_IMP_return_the_keys:0 "Вернуть ключи комиссии"
 HSM_VER_IMP_return_the_keys_desc:0 "Городские ведомства готовы принять договоры, книги обследований и ключи. Инженеры комиссии оставят чертежи тем, кому предстоит отвечать за следующий ремонт. У обычной администрации будет меньше чрезвычайных полномочий, и она не сможет ссылаться на особый мандат, когда мастерская спросит о неоплаченном счёте."
 HSM_VER_IMP_defensive_victory_tt:0 "Империя напала на участника хартии; мы победили в оборонительной войне и закрепили победу на конференции."
 HSM_VER_IMP_peace_and_capital_tt:0 "Грифенхейм принадлежит нам и контролируется нами. Участники хартии не капитулировали и находятся в мире, как и сохранившаяся Империя."
 HSM_VER_IMP_optional_settlement_tt:0 "Событие: принять временную комиссию восстановления либо отказаться. Императорский титул не предоставляется."
 HSM_VER_IMP_noncustodial_tt:0 "Отчёт фиксирует положение Гровера VI. Не передаёт опеку над ним и не предоставляет титул."
 HSM_VER_IMP_mandate_terms_tt:0 "Первоначальный мандат действует не более 730 дней. Война, утрата Гриффенхейма или прекращение работы институтов хартии завершают его. После публикации отчёта можно передать дела гражданским службам или утвердить последнюю программу на 365 дней."
 HSM_VER_IMP_protocol_invitation_tt:0 "Предлагает уцелевшим домам или нашему единому гражданскому совету техническое соглашение. Каждый получатель вправе согласиться или отказать."
 HSM_VER_IMP_last_year_tt:0 "Расходует §R50 политической власти§! на последнюю программу сроком 365 дней, заменяющую прежний мандат. Мирное завершение даёт гражданское наследие на 730 дней."
 HSM_VER_IMP_handover_tt:0 "Завершает мандат: §G+75 политической власти§!, §G+2% стабильности§! и гражданское наследие на 730 дней. Через 30 дней придёт отчёт."
 HSM_VER_IMP_audit_tt:0 "Открывает взаимоисключающие фокусы последнего года работ и передачи дел гражданским службам. Отказ от технического протокола или отсутствие ответа не препятствуют выбору."
 HSM_VER_IMP_reconstruction_mandate:0 "Комиссия по восстановлению Гриффенхейма"
 HSM_VER_IMP_reconstruction_mandate_desc:0 "Временная гражданская комиссия координирует ремонт после оборонительной войны. Её аппарат требует политических ресурсов. Полномочия ограничены сроком, миром и действительным контролем Эри над Гриффенхеймом."
 HSM_VER_IMP_final_programme:0 "Последний год комиссии"
 HSM_VER_IMP_final_programme_desc:0 "Последний год финансирования обеспечивает усиленные ремонтные бригады и небольшое техническое исследовательское бюро. Его политические расходы нельзя продлевать бесконечно. По истечении срока мирное восстановление автоматически переходит к обычным гражданским службам."
 HSM_VER_IMP_civilian_legacy:0 "Гражданские службы восстановления"
 HSM_VER_IMP_civilian_legacy_desc:0 "Опубликованные технические материалы и подготовленные рабочие продолжают служить обществу после закрытия временной комиссии. Эффект действует два года и не предоставляет особых политических полномочий."
 HSM_VER_IMP_technical_protocol:0 "Веренийский технический протокол"
 HSM_VER_IMP_technical_protocol_desc:0 "Согласившиеся правительства хартии либо уполномоченные исследовательские учреждения их законного единого преемника обмениваются инженерными публикациями и стандартами. Ограниченная по сроку программа не даёт территорий или династических прав. Участие единого государства прекращается при утрате оснований объединения, хартии или герцогской земли."
 HSM_VER_IMP_archive_bonus:0 "Технические архивы Гриффенхейма"
 HSM_VER_IMP_workshop_bonus:0 "Чертежи городских мастерских"
 HSM_VER_IMP_repair_bonus:0 "Гражданские строительные методы"
 hsm_ver_imperial.1.t:0 "Конференция без трона"
 hsm_ver_imperial.1.d:0 "Когда империя напала на участника хартии, наши делегаты обещали защитить соглашение. Они не обещали унаследовать империю. Теперь война окончена, и Гриффенхейму, переданному нам по условиям мира, предстоит жить с её последствиями.\n\nГородские представители просят ремонта, надёжных подрядов и администрации, способной назвать срок завершения чрезвычайных работ. Предлагаемая комиссия будет подотчётна гражданским институтам и опубликует свои счета. Ни короны, ни прав на императорский дом она не получит. Мы можем принять эту ограниченную ответственность или с самого начала оставить восстановление обычной администрации."
 hsm_ver_imperial.1.a:0 "Учредить временную гражданскую комиссию."
 hsm_ver_imperial.1.b:0 "Обычной администрации будет достаточно."
 hsm_ver_imperial.2.t:0 "Имя в реестре императорского дома"
 hsm_ver_imperial.2.dead:0 "Расследование установило факт, которого не отменит никакое соглашение: смерть Гровера VI подтверждена. Некоторые просители по-прежнему приносят проекты регентства, словно должность способна заменить того, кого она должна защищать. Комиссия отказывается превращать эти прошения в государственную политику.\n\nСоглашение признает его смерть и обеспечит сохранность соответствующих документов. Восстановление должно служить живым, не изобретая императора или порядок наследования от его имени."
 hsm_ver_imperial.2.minor:0 "Документы подтверждают присутствие живого Гровера VI в нашей стране в рамках уже существующих отношений императорского дома. Он ещё несовершеннолетний. Это не означает согласия на назначение нового опекуна и не даёт комиссии права стать регентским советом.\n\nДелегаты вносят в соглашение строгую оговорку: учреждения восстановления не распоряжаются его воспитанием, личностью или будущим титулом. Существующий порядок сохраняется на прежних основаниях. Отремонтированная столица не является документом о праве собственности на ребёнка."
 hsm_ver_imperial.2.adult:0 "Документы подтверждают, что Гровер VI жив, находится здесь и достиг совершеннолетия. Предложения учредить новое регентство опоздали даже по собственным правилам.\n\nСоглашение относится к нему как ко взрослому, чьё нынешнее положение комиссия по восстановлению не вправе переписывать. Она не назначает опекуна, не обещает коронацию и ничего не решает от его имени. Гражданская программа может работать без заимствованной династической власти."
 hsm_ver_imperial.2.abroad_minor:0 "Достоверные документы указывают, что живой Гровер VI находится в другой существующей стране. Он ещё несовершеннолетний. Ни владение Гриффенхеймом, ни мирная конференция не передали нам его дом.\n\nКомиссия фиксирует сохранение ответственности принимающей стороны и исключает опеку из соглашения. Любое будущее решение потребует достоверно установленного местопребывания, согласия и надлежащих полномочий; здесь их нет. Наши делегаты возвращаются к счетам восстановления, не предъявляя прав на ребёнка."
 hsm_ver_imperial.2.abroad_adult:0 "Сохранившиеся документы указывают, что живой Гровер VI находится за границей и уже достиг совершеннолетия. Его отношения с принимающей страной и любые существующие должности не зависят от нашей программы восстановления.\n\nДелегаты отвергают мысль, будто контроль над старым дворцом делает нас его регентами. Личное соглашение потребовало бы участия самого Гровера и его нынешней принимающей стороны. Это урегулирование такого соглашения не заключает и имперских должностей не предоставляет."
 hsm_ver_imperial.2.unknown:0 "Комиссия не смогла достоверно установить живой императорский дом в какой-либо существующей стране. Подтверждённого извещения о смерти Гровера VI тоже нет. Пустые комнаты, брошенные бумаги и слухи от перемещённых придворных не заполняют этот пробел.\n\nВ реестре будет указано, что его местонахождение и сведения о том, жив ли он, не подтверждены. Опекуна не назначат, наследника не провозгласят, а отсутствующего человека не создадут заново ради удобства соглашения. Гражданское восстановление может продолжаться и при открытом вопросе."
 hsm_ver_imperial.2.a:0 "Признать его смерть и закрыть династический пункт."
 hsm_ver_imperial.2.b:0 "Уважать существующий порядок заботы о ребёнке."
 hsm_ver_imperial.2.c:0 "Совершеннолетнему не нужно новое регентство."
 hsm_ver_imperial.2.d:0 "Зафиксировать ответственность его нынешнего дома."
 hsm_ver_imperial.2.e:0 "Не вмешиваться в его положение за границей."
 hsm_ver_imperial.2.f:0 "Оставить запись открытой, без династических притязаний."
 hsm_ver_imperial.3.t:0 "Первые гражданские подряды"
 hsm_ver_imperial.3.d:0 "В первых сметах комиссии два практических предложения. Городское предприятие могло бы снабжать гражданские службы оборудованием непосредственно из Гриффенхейма. Другой вариант: инженеры опубликуют и преподадут улучшенные строительные методы, чтобы разные службы организовывали ремонт самостоятельно.\n\nОба проекта предложены гражданскими организациями и поддаются проверке. Сейчас средства есть на одно направление. Постоянные ремонтные бригады продолжат работу независимо от выбора."
 hsm_ver_imperial.3.a:0 "Открыть гражданское предприятие в Гриффенхейме."
 hsm_ver_imperial.3.b:0 "Оплатить строительные методы для городских бригад."
 hsm_ver_imperial.4.t:0 "Приглашение к совместной работе"
 hsm_ver_imperial.4.d:0 "Комиссия Эри по восстановлению предлагает нашему правительству двухлетнее техническое соглашение. Инженерные труды и производственные стандарты будут распространяться между согласившимися участниками. Предложение ссылается на нашу подпись под хартией, но требует отдельного ответа.\n\nИнженеры отметили труды, которые хотели бы получить; казначейство отметило расходы, нуждающиеся в объяснении. Участие обяжет нас к работе, описанной здесь. Сама хартия остаётся соглашением, которое мы уже подписали."
 hsm_ver_imperial.4.a:0 "Подписать технический протокол."
 hsm_ver_imperial.4.b:0 "Сохранить отдельную техническую программу."
 hsm_ver_imperial.5.t:0 "Комиссия представляет отчёт"
 hsm_ver_imperial.5.d:0 "Публичный отчёт раскладывает подряды и технические публикации рядом с жалованьем, прошениями и назначениями, которые всё ещё требуют внимания комиссии. Иностранные обязательства приведены с подписями, давшими на них право. Дело императорского дома хранится отдельно от гражданского бюджета.\n\nПредставители города принесли две сметы. Одна сохраняет ремонтные бригады и исследовательское бюро на последний оплаченный год; другая передаёт их документы и обязанности обычным службам уже сейчас. Инженеры защищают незавершённые работы. Городской писарь спрашивает, когда городу доверят ими управлять."
 hsm_ver_imperial.5.a:0 "Опубликовать отчёт и рассмотреть два решения."
 hsm_ver_imperial.6.t:0 "После временного мандата"
 hsm_ver_imperial.6.handover:0 "Через месяц после возвращения ключей подрядами занимается обычная гражданская администрация. Рабочие по-прежнему сверяются с опубликованными чертежами; технический обмен продолжается только с согласившимися правительствами. Городской писарь подписывает ответ, не отправляя его наверх за второй печатью комиссии.\n\nУскоренная ремонтная программа завершилась раньше, чем хотели некоторые инженеры. Зато гражданские службы получили ответственность и практические знания. Установленные миром границы и существующая судьба Гровера остаются за пределами полномочий комиссии."
 hsm_ver_imperial.6.finished:0 "Последнее годовое финансирование закончилось, и комиссия закрылась, не прося нового продления. Ремонтные бригады и исследовательское бюро завершили временную службу. Обычная гражданская администрация принимает планы, документы и подготовленных работников.\n\nПри передаче дел городской инженер спрашивает, где комиссия хранила записи о неудачных проектах. Их приносят вместе с готовыми чертежами. Городу понадобятся и те и другие. От мандата остаётся работа, которую преемники могут понять и продолжить, не спрашивая исчезнувшее ведомство о каждом изменении."
 hsm_ver_imperial.6.interrupted:0 "Комиссия получила распоряжение о прекращении мандата. Её полномочия больше не обеспечивают обещанную работу, а чиновникам, готовящим передачу дел, предстоит отчитаться за незавершённые подряды. Инженеры собирают чертежи, пока писари отмечают неоплаченные обязательства.\n\nВсё уже отремонтированное остаётся на месте. Заключительный отчёт должен описать остальное, не выдавая прерванную программу за завершённую. Город, ожидающий крыш и работающих служб, будет судить об этой разнице строже авторов отчёта."
 hsm_ver_imperial.6.lapsed:0 "Первоначальные двухлетние полномочия комиссии подошли к концу. Последнюю программу так и не утвердили, а публичную передачу дел не согласовали. Поэтому секретарь закрыл книгу назначений датой, напечатанной ещё при выдаче мандата.\n\nЗавершённый ремонт и опубликованные труды остаются у города. Незаконченные дела вошли в заключительный отчёт вместе со спорами, задержавшими должную передачу. Печать комиссии больше не может на них ответить; за дальнейшее придётся отвечать обычным чиновникам."
 hsm_ver_imperial.6.a:0 "Занести итог в публичный реестр."
 hsm_ver_imperial.7.t:0 "Инженеры за одним столом"
 hsm_ver_imperial.7.d:0 "Приглашение было составлено для иностранной канцелярии, которой больше нет. Её инженеры не исчезли вместе с бланками. Они пришли в комиссию с каталогами, несовместимыми мерами и просьбой выделить общий бюджет на публикации.\n\nПисарь кладёт старую хартию рядом с актом основания. Совет вправе разрешить работу внутри единого государства, но не выдумать иностранную подпись или объявить, будто присоединение уже решило каждый вопрос о расходах. Предлагаемое бюро будет публиковать отчёты и закроется по окончании технического гранта. Инженеры ждут решения, которое можно приложить к чертежам."
 hsm_ver_imperial.7.a:0 "Утвердить общее исследовательское бюро."
 hsm_ver_imperial.7.b:0 "Оставить исследования нынешним учреждениям."
 HSM_VER_IMP_union_dispossessed:0 "Прежнее единое государство было аннексировано; старое основание объединения больше недействительно"
 HSM_VER_IMP_internal_protocol_answered:0 "На внутреннем обсуждении исследований принято решение"
 HSM_VER_IMP_internal_protocol_signed:0 "Гражданский совет утвердил внутреннюю исследовательскую программу"
 HSM_VER_IMP_internal_protocol_pending:0 "Ожидается внутреннее обсуждение исследований"
