l_english:
 HSM_BAR_mtk_prosthetics_title:0 "Crystal Prosthetics"
 HSM_BAR_mtk_prosthetics_idea:0 "My own repairs taught me how persuasive a device becomes when it answers pain. They did not teach me how another body should wear it. I propose a crystal-assisted prosthesis whose workshop parts can be replaced without remaking the patient's entire fitting. The first case will concern ordinary movement between a chair, a workbench and the courtyard. Silver will describe the patient's remaining movement before I describe the mechanism. Viira has asked for drawings a village smith could follow. I have cleared a bench for that reader as well as for the device.\n\nLeopold, workshop proposal."
 HSM_BAR_mtk_prosthetics_theory:0 "Working hypothesis: a fitted mechanical support can carry the intended movement while a restrained crystal response assists it, provided the patient can predict and stop that response. The drawing separates the personal fitting from replaceable workshop parts. We shall compare ordinary tasks with the patient's existing aid, examine discomfort after rest, and ask an unfamiliar fitter to replace a worn practice component from the drawing alone. Hoof and claw fittings require separate patterns; neither will be declared universal.\n\nLeopold. Silver will record fatigue and skin condition. Viira insists that every drawing show the movement it is meant to permit."
 HSM_BAR_mtk_prosthetics_tests:0 "The fitted prosthesis supported the agreed courtyard walk and bench task, and its wearer could halt the assisted movement without waiting for me. A local fitter replaced the practice component from the drawing and restored the checked movement. Longer use exposed soreness at the personal fitting; Silver required an adjustment and another rest examination before accepting it. A different limb shape needed its own fitting rather than a tightened copy. The workshop parts remained interchangeable within the tested pattern.\n\nLeopold and Silver signed the fitting record. Viira added the wearer's correction: The drawing must show how to sit, not only how to stand."
 HSM_BAR_mtk_prosthetics_conclusion:0 "The prosthesis is accepted for the movements and fitting recorded in the casebook. Its success includes an ordinary workshop being able to replace the documented parts. It does not include restored sensation, freedom from wear or permission to fit every body from the same drawing. Follow-up visits and local adjustment remain part of the apparatus's working life. I had labelled them aftercare, as though engineering ended at delivery; Silver moved them into the main specification. He was right.\n\nLeopold. Viira countersigns the revised drawings, including the seated posture that my handsome first sheet managed to omit."

 HSM_BAR_mtk_self_repair_title:0 "Self-Repair"
 HSM_BAR_mtk_self_repair_idea:0 "Every returning mechanism arrives with an account of the moment it stopped, seldom with the quieter changes that preceded it. I propose a machine that can indicate an emerging fault and enter a defined maintenance state before its own motion conceals the evidence. The ambitious heading on my bench is self-repair. Beneath it I have drawn a workshop, replacement trays and space for a fitter, since any credible proposal must explain where the missing material comes from. Viira suggests testing the warning before trusting the repair.\n\nLeopold. Silver has offered instruments for checking warmth during ordinary operation."
 HSM_BAR_mtk_self_repair_theory:0 "The hypothesis has distinct parts: recurring wear may produce a recognizable change, and a stopped mechanism may permit a prepared service operation. Neither implies that fractured material can restore itself. We shall introduce ordinary wear into practice assemblies, compare their indicators with a fitter's inspection, and attempt the proposed maintenance only at the workshop bench. Unfamiliar damage must be recorded separately from the faults named on the drawing. The record will include materials consumed and work performed by the attendants.\n\nLeopold. Viira's note: Draw the attendant into the sequence. Otherwise the missing step will look like a miracle."
 HSM_BAR_mtk_self_repair_tests:0 "The indicator repeatedly recognized the familiar loose assembly and brought the practice machine to its maintenance stop. At the prepared bench, the service fixture helped restore an accessible adjustment while a fitter checked the result. Cracked parts stayed cracked. An unfamiliar misalignment produced an apparently ordinary warning, and the machine could not distinguish the required replacement. Dust also obscured an indicator until cleaning. Viira compared the drawings with the actual sequence and circled every unrecorded intervention by the attendants. There were several.\n\nLeopold. Silver signed the warmth records; the workshop log now names who inspected, cleaned, supplied and restarted each assembly."
 HSM_BAR_mtk_self_repair_conclusion:0 "The project is retained in part as a maintenance workshop procedure. Familiar warnings, accessible service points and prepared replacement stocks can support repair; the machine cannot diagnose arbitrary damage or manufacture its missing parts. A fitter must inspect the fault and approve the restart. The heading self-repair has therefore been crossed out on the service sheet and replaced with assisted maintenance. I have kept the original proposal behind it, including my expansive first sketch.\n\nLeopold. Viira's comment: Your machine has acquired a workshop, not the power to heal. Agreed; the workshop deserves to appear in the finished drawing."

 HSM_BAR_mtk_revolver_howitzer_title:0 "Revolver Howitzer"
 HSM_BAR_mtk_revolver_howitzer_idea:0 "A howitzer with a revolver's cylinder. I wrote that sentence on the workshop door because everyone kept asking what the enormous wheel on my drawing was for. The gun would do the hurrying instead of its exhausted crew; that, at least, is the promise. Silver asked whether I had drawn anything to pull it through a muddy field. Not yet. Before asking for a proving ground, I shall commission an inert handling model and let an ordinary crew argue with it.\n\nLeopold. Viira has added a second sentence to the door: The wheel must leave this room without removing the wall."
 HSM_BAR_mtk_revolver_howitzer_theory:0 "The attraction is a short burst of activity followed by preparation for the next, rather than the same interruption after every shot. My first sketch counted only the interval I wanted to shorten. The whole machine also has to travel, be inspected and return to service after a stoppage. Enlarging a familiar mechanism does not preserve its familiar weight or convenience. We will compare complete working cycles using the inert model, including a road journey and maintenance, before accepting any claim about speed.\n\nLeopold. Silver's margin: Put the journey on the first page, not among the qualifications at the end."
 HSM_BAR_mtk_revolver_howitzer_tests:0 "The model reached the yard after we removed the door. It did not reach the far side without additional assistance. The extra weight made every change of position an undertaking, and the crowded mechanism left too little room for routine inspection. During the handling trial, one simulated stoppage held up the entire sequence. Preparation afterwards consumed the interval the drawing had promised to save. The crew preferred the ordinary comparison piece; its pauses were shorter than ours and considerably less dramatic. No firing trial was authorized.\n\nLeopold. Viira returned the door to its hinges. Silver waited until the exhausted attendants had gone before asking for my signature."
 HSM_BAR_mtk_revolver_howitzer_conclusion:0 "The revolver howitzer is closed without adoption. There is no useful weapon or lesser practical application to salvage from this prototype. Its weight, obstructed maintenance and shared stoppages cancel the promised advantage. We shall retain the report, not make the workshop keep an unsuccessful machine occupied. I wanted a sequence with no pauses. What I actually built was a sequence in which every pause stopped everything. That distinction belongs at the front of my next proposal.\n\nLeopold. Viira: Shall I take the sentence off the door? Leave it until tomorrow. I can admit an error and still dislike looking at it."

 HSM_BAR_mtk_crystal_drive_title:0 "Crystal Drive"
 HSM_BAR_mtk_crystal_drive_idea:0 "A bright crystal impresses visitors; a workshop asks whether its light can be made to turn a tool without startling the next operator. I propose a bounded drive for ordinary bench machinery, with the source, load and stopping action shown separately on the drawing. Viira has agreed to describe changes she senses before I decide what the pointer should mean. The first work will concern a harmless polishing wheel under changing resistance. My interest is dependable motion that a fitter can inspect, rather than a spectacle requiring its inventor to remain beside it.\n\nLeopold, drive proposal; spectral observations assigned to Viira."
 HSM_BAR_mtk_crystal_drive_theory:0 "Working hypothesis: a crystal's magical discharge can be regulated against an ordinary workshop load without treating brightness as proof of useful motion. The trial will record the wheel's behaviour, the source's changing state and the effect of withdrawing the load. We shall compare active regulation with the same apparatus at rest, then repeat with a different operator. Exhaustion of the source must produce an intelligible stop. Viira will keep a separate spectral record so an apparently steady pointer cannot conceal a drifting crystal.\n\nLeopold. Silver requests rest intervals for the observers; repeated motion can make a tired witness overlook a change."
 HSM_BAR_mtk_crystal_drive_tests:0 "The drive maintained the polishing wheel's agreed motion through the tested changes in resistance. A replacement operator used the written checks and stopped it without my intervention. When the source weakened, the wheel stopped predictably instead of drawing on neighbouring apparatus. Viira's spectral sheets matched the recorded change in the crystal, but prolonged operation warmed the housing and required a cooling pause. Damaged specimens gave irregular responses and were excluded from the accepted pattern.\n\nLeopold and Viira signed the paired records. Silver noted that changing observers preserved the record's quality even when the wheel itself appeared monotonously reliable."
 HSM_BAR_mtk_crystal_drive_conclusion:0 "The crystal drive is accepted for the documented workshop loads, with source inspection, cooling intervals and a tested stop. It supplies controllable motion from prepared crystals; it does not make its own supply, repair a damaged source or justify connecting every machine to one apparatus. The operator's record now carries Viira's spectral sheet beside my mechanical drawing. Either can challenge the other when a reading drifts. I have kept the quiet demonstration wheel on the bench because visitors still ask to see something more dramatic.\n\nLeopold. Viira's countersignature: Let them watch the stop. That is part of the invention."

 HSM_BAR_mtk_sorting_engine_title:0 "The Sorting Engine"
 HSM_BAR_mtk_sorting_engine_idea:0 "Workshop trays contain pieces that look alike until a fitter tries them. I propose an engine that compares incoming parts with named reference specimens and directs them into prepared trays. The tempting word is judgment; the first drawing calls the operation comparison. We shall begin with known workshop pieces whose accepted shapes can be checked independently. Unfamiliar objects must remain in view instead of disappearing into the nearest convenient category. Viira has volunteered to bring objects that offend my orderly examples. I suspect she has already started a collection.\n\nLeopold. Reference trays will be labelled before the first trial."
 HSM_BAR_mtk_sorting_engine_theory:0 "The working hypothesis is that a restricted set of repeatable measurements can distinguish known classes of parts. The engine will follow a fixed comparison sequence against workshop references; it will receive no instruction to discover an object's purpose. Test trays will mix ordinary examples, worn pieces and unfamiliar shapes. An independent fitter will inspect every destination, including the undecided tray. A correct match must remain a correct match after the feed order changes.\n\nLeopold. Viira's addition: Present the same shape in a misleading material. A machine that recognizes an outline may still know nothing useful about what it has received."
 HSM_BAR_mtk_sorting_engine_tests:0 "Clean examples from the prepared classes reached their intended trays even when the feed order changed. Worn pieces sometimes matched the wrong reference, and Viira's substitute material passed the outline comparison despite being unsuitable for the same task. The engine never inferred purpose; it repeated the comparisons we had supplied. Sending doubtful readings to the undecided tray reduced confident mistakes but left attendants with substantial inspection work. New classes required new references and another checked trial.\n\nLeopold. Viira signed the troublesome specimen list, visibly pleased. The workshop fitter countersigned the destination record before we altered any labels."
 HSM_BAR_mtk_sorting_engine_conclusion:0 "The sorting engine is retained for preliminary classification of clean parts from the tested families. Its partial success depends on reference upkeep and a genuine undecided destination. It cannot identify arbitrary objects, infer a maker's intention or teach itself a new trade. Final acceptance remains with the fitter, especially where material matters more than outline. Viira's inconvenient examples will stay beside the ordinary reference trays so an adjustment can be checked against both.\n\nLeopold. I have removed thinking engine from the invitation to the next demonstration. Viira says comparison is a respectable occupation when it is accurately named."

 HSM_BAR_mtk_manufactory_title:0 "The Manufactory"
 HSM_BAR_mtk_manufactory_idea:0 "I propose a workshop that can repeat an approved making sequence while its attendants concentrate on preparation, inspection and repair. The initial articles will be simple housings and fittings, with every operation visible from the service aisle. Construction must wait for the completed studies of Crystal Prosthetics, Self-Repair, the Revolver Howitzer, the Crystal Drive and the Sorting Engine. Each report must be examined, including any rejected proposal; none is an optional ornament to the final drawing. Whether their conclusions can coexist in a working line remains the question.\n\nLeopold. Viira will review the indicators, Silver the attendants' working record, and Asinti the operating sequence."
 HSM_BAR_mtk_manufactory_theory:0 "The Manufactory hypothesis is a sequence of limited, supervised operations. Crystal Prosthetics supplies interchangeable patterns without treating every fitting as identical. Self-Repair requires an actual maintenance workshop, spare parts and an inspected restart. The failed Revolver Howitzer forbids assuming that combining tasks removes their interruptions; stations must stop separately. The Crystal Drive supplies bounded motion with cooling and source checks. The Sorting Engine admits only known classes and diverts uncertain pieces to a fitter. All these completed studies are prerequisites. Motion comes from mechanisms and crystal power; no reasoning mind or bound soul forms part of the design.\n\nLeopold; Viira, Silver and Asinti countersign the proposed trial sheet."
 HSM_BAR_mtk_manufactory_tests:0 "The Manufactory repeated its approved housing sequence and produced pieces accepted by the fitter. Crystal Prosthetics supplied the checked interchangeability patterns; an unfamiliar fitting still required a new drawing. Self-Repair's service station restored ordinary adjustments, while cracked parts awaited replacement. To test the failed Revolver Howitzer's lesson, we stopped a station: neighbouring stations completed their current tasks and could restart separately. The Crystal Drive held the assigned load and took its cooling pauses. The Sorting Engine handled known blanks and diverted uncertain ones for inspection. No station devised a task when given an unlisted order.\n\nLeopold signed the output record; Viira checked indicators, Silver attendant fatigue, and Asinti the interrupted sequences."
 HSM_BAR_mtk_manufactory_conclusion:0 "The Manufactory is accepted for limited automated manufacture under workshop supervision. Crystal Prosthetics sets the approved patterns, not a universal fit. Self-Repair establishes staffed maintenance, not healing machinery. The Revolver Howitzer remains a failure with no practical benefit; its rejected claim explains why this line preserves separate stops. The Crystal Drive requires prepared sources and cooling. The Sorting Engine requires known references and a fitter's decision on doubtful parts. Every preceding study remains mandatory in the operating dossier. These mechanisms neither think nor contain enslaved souls; new work requires new drawings and trials.\n\nLeopold. Viira, Silver and Asinti sign the same acceptance sheet, followed by the workshop fitter who checked the articles."
