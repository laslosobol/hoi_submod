l_english:
 HSM_ERI_cost_of_feud:0 "The Price of Our Inheritance"
 HSM_ERI_cost_of_feud_desc:0 "Vincent Erie inherited a claim to Verenia, unpaid suppliers and a frontier where every repaired bridge might become tomorrow's battlefield. Iovinus Eyrie's ancestry offers an answer as convincing as his own. Before choosing a settlement with his cousin or a campaign against him, Vincent must hear what either course will ask of the country that pays for it."
 HSM_ERI_hear_petitions:0 "A Hearing for the Living"
 HSM_ERI_hear_petitions_desc:0 "Petitions arrive wrapped in deeds, casualty notices and invoices that nobody expects to be paid. Their authors have practical questions for the duke: when may a cart cross the border, who repairs a ruined workshop, and where is a missing brother? Receiving them in public would make their demands harder to forget. Receiving them privately would leave more room for the court to bargain."
 HSM_ERI_family_letters:0 "Kinship Beyond the Feud"
 HSM_ERI_family_letters_desc:0 "Rosaline Erie of Bantry and Montague Eyrie, Earl of Verenia, have kept a personal connection alive where their elders see only competing claims. Lady Katrina is aunt to both dukes; the family knows how to reach the other court without bringing an ultimatum. Vincent will protect that opening, not purchase it with a marriage promise. The first people allowed across the boundary must be free to speak for themselves."
 HSM_ERI_offer_armistice:0 "Silence Along the Frontier"
 HSM_ERI_offer_armistice_desc:0 "The grievances have been heard, the families have spoken and the safeguards have been chosen. Now Vincent must make restraint an order his captains cannot mistake for a pause before the next raid. Patrols will cease crossing the line to seize cattle or settle an old insult. This armistice will hold while the Houses build a permanent settlement, without an anniversary telling their officers to resume the feud."
 HSM_ERI_open_roads:0 "The First Cart Across"
 HSM_ERI_open_roads_desc:0 "A barricade can be removed in an afternoon. A damaged culvert, a disputed toll and a carrier who has lost three carts require more work. Engineers and local officials will reopen the roads of our own territory while the ceasefire holds. Each ordinary journey completed safely will make the next agreement a little less difficult to imagine."
 HSM_ERI_reciprocal_guarantees:0 "The Price of Restraint"
 HSM_ERI_reciprocal_guarantees_desc:0 "The petitioners want more than a promise that this season will be different. A farmer asks who will stop the next patrol; a dispossessed family asks who will answer for the last one. After hearing them and establishing contact across the family divide, Vincent must put something of his own behind the peace. Joint patrols would expose his officers to scrutiny. A restitution fund would oblige his court to acknowledge damage done in his name. He cannot demand a concession while refusing every cost of his own."
 HSM_ERI_friendship_treaty:0 "The Treaty of Friendship"
 HSM_ERI_friendship_treaty_desc:0 "The reopened crossing has given both courts something their genealogists could not: an example of life without the feud. The treaty will turn that experience into a settlement. Vincent and Iovinus relinquish their demands upon each other's lands and end the privileges that kept the quarrel alive. Neither receives a defeated cousin's submission. Each receives a neighbour whose independence is no longer an unfinished war."
 HSM_ERI_mandate_for_peace:0 "Who Speaks at the Congress?"
 HSM_ERI_mandate_for_peace_desc:0 "The court can appoint household delegates who know every title and precedence. Towns and parishes can send representatives who know which bridge still needs timber. Giving the latter a place will consume political capital and complicate bargaining, but their participation can give an equal council a public purpose beyond accommodating two dynasties."
 HSM_ERI_invite_avian:0 "An Intergigantes Association"
 HSM_ERI_invite_avian_desc:0 "Katrina's council chose to work between the giants, not to shut its doors. Offer Avian a treaty that makes cooperation the first step towards a common state. Its municipal charters and colleges must have a place in the eventual constitution. The first signature opens that work; only a later accession act can transfer sovereignty."
 HSM_ERI_common_statute:0 "A Charter of Agreed Powers"
 HSM_ERI_common_statute_desc:0 "The treaty has quieted the frontier; it has not decided who may speak for a common court, a shared workshop or the next dispute between the Houses. With delegates appointed and Avian offered a seat, Vincent must put a constitution before the congress. An equal council gives each partner the same standing. A limited ducal presidency promises continuity, but asks his cousin to accept a chair that Vincent alone would occupy. The peace is already real. The question is what they will build upon it."
 HSM_ERI_joint_staff:0 "Orders the Other Side Can Read"
 HSM_ERI_joint_staff_desc:0 "The quartermasters have discovered that their supply returns describe the same shortages in incompatible columns. A joint staff will bring the returns, maps and exercise plans to one table. Officers must learn to ask for another House's cooperation without mistaking a colleague's signature for authority over his troops."
 HSM_ERI_shared_services:0 "Standards Across the Border"
 HSM_ERI_shared_services_desc:0 "A replacement part should fit regardless of which House paid for it. Engineers will compare drawings, test each other's measurements and take the disputed pieces back to the workshops. The common technical offices must earn their authority at a workbench, where a seal cannot conceal a badly cut thread."
 HSM_ERI_first_judgement:0 "A Judgement Against the Duke"
 HSM_ERI_first_judgement_desc:0 "Our common court has received a claim to an estate promised to one of Vincent's own veterans and patrons. The former owners belong to a family divided by the old battle lines. Their documents are sound. The charter will mean little unless its judgement can reach a beneficiary of the duke's personal word."
 HSM_ERI_common_defence:0 "An Agreement to Stand Together"
 HSM_ERI_common_defence_desc:0 "Staff cooperation can prepare a defence, but only a further agreement can commit the Houses to a military league. We shall develop support methods and offer Eyrie a defensive partnership where existing commitments permit it. Avian, if a charter partner, will receive its own invitation. Each government must consent to the obligations it takes on."
 HSM_ERI_keep_our_word:0 "Finish the Work We Promised"
 HSM_ERI_keep_our_word_desc:0 "The first petitions were about livelihoods, not constitutional diagrams. We must complete the works promised at home, bringing new civilian production into service where we still hold our territory. The public commitments can then be discharged. Those who asked the duke for help deserve something more substantial than a copy of the charter."
 HSM_ERI_generation_without_feud:0 "A Generation Without the Feud"
 HSM_ERI_generation_without_feud_desc:0 "The union will be judged by the habits it makes possible: a court obeyed, a consignment delivered, a dispute settled without calling the reserves. Vincent has not forgotten his inheritance. He is learning what authority becomes when others accept its exercise and can hold it to its word. Let that be the settlement the next generation receives."
 HSM_ERI_peace_without_union:0 "The Country We Can Rebuild"
 HSM_ERI_peace_without_union_desc:0 "The shared settlement has failed, whether at the first safeguards or at the final charter. A refusal cannot be signed away, and a fallen neighbouring government cannot keep a dead ruler's promises. Vincent can still keep his own: the schools, workshops and roads will not wait for another congress. Whatever agreements remain valid will be respected. Whatever was never agreed will not be invented. We chose negotiation, not an invasion postponed until an unwelcome answer."

 HSM_VER_petition_commitments:0 "Promises Entered in the Register"
 HSM_VER_petition_commitments_desc:0 "The duke has heard the petitioners in public. Their expectations steady the country, but answering them requires civilian resources that cannot simply be diverted elsewhere. The register remains open until the promised work is completed or the independent settlement discharges the programme."
 HSM_VER_frontier_inspections:0 "Joint Frontier Inspections"
 HSM_VER_frontier_inspections_desc:0 "Mixed patrols carry officers from both Houses along the same frontier. Neither command can dismiss an incident merely because the other side reported it. Escorts, inquiries and complaints require continuing attention from both courts. The arrangement serves the armistice and ends when a permanent treaty replaces it or the ceasefire itself breaks down. An inspector's presence gives no claim to another House's land."
 HSM_VER_peace_dividend:0 "Roads Worth Repairing"
 HSM_VER_peace_dividend_desc:0 "The treaty has given engineers and railway planners a reason to invest beyond the next alarm. Infrastructure and railway construction proceed more readily while the two Houses remain independent and their peace holds. These gains belong to the treaty and survive a disagreement over the charter."
 HSM_VER_common_courts:0 "The Common Courts"
 HSM_VER_common_courts_desc:0 "The charter gives disputes between the Houses an agreed hearing. Enforcing procedure costs the government some freedom of action, but a judgement that binds both courts makes daily life more predictable. These benefits depend on independence, a valid charter and respect for its rulings."
 HSM_VER_limited_presidency:0 "A Presidency Bound by Charter"
 HSM_VER_limited_presidency_desc:0 "Vincent presides over the council's agreed business within the powers granted by its signatories. The office lends continuity and authority to government, but confers no sovereignty over Eyrie and no hereditary right to command its ruler. This institutional settlement replaces the ordinary common-court arrangement and is suspended if the charter is breached."
 HSM_VER_public_council:0 "The Public Council"
 HSM_VER_public_council_desc:0 "Civic delegates sit within an equal council, making local needs part of the common agenda. Their scrutiny slows the accumulation of political power, while broader confidence and coordinated civilian works strengthen stability and construction. The council replaces the ordinary common-court arrangement; its benefits require a charter respected by the rulers themselves."
 HSM_VER_joint_staff:0 "The Joint Planning Staff"
 HSM_VER_joint_staff_desc:0 "Officers from the participating Houses share supply calculations and operational planning. Compatible procedures improve organisation and reduce supply consumption without dissolving the national armies. The staff's benefits cease when the charter is suspended or its conditions no longer hold."
 HSM_VER_shared_services:0 "Shared Technical Services"
 HSM_VER_shared_services_desc:0 "Common specifications, accessible technical records and regular exchanges between workshops improve factory output and the growth of production efficiency. The offices serve the independent signatories together. Their benefits depend on the continued operation of the charter."
 HSM_VER_ducal_exception:0 "The Duke's Exception"
 HSM_VER_ducal_exception_desc:0 "Vincent has placed a personal undertaking above the common court's judgement. His immediate freedom to act has grown, but confidence in his promises has suffered. All charter benefits are suspended until he withdraws the exception and accepts the ruling. The friendship treaty itself remains in force while its conditions hold."

 HSM_VER_diplomatic_business:0 "Obligations of the Peace"
 HSM_VER_diplomatic_business_desc:0 "The settlement is tested after the congress: prisoners must return home, a court's judgement must reach a powerful patron, and each military commitment needs a willing partner. These are obligations to fulfil, not reasons to begin the negotiations afresh. Where common institutions cannot be agreed, our own country still has work to finish."
 HSM_VER_reopen_armistice:0 "Terms for a Quiet Frontier"
 HSM_VER_reopen_armistice_desc:0 "A frontier order must bind our own officers as firmly as it binds the other House. Inspection rights and the handling of complaints belong among the terms of restraint; another messenger is no substitute for deciding them."
 HSM_VER_renew_armistice:0 "The Patrols Keep Their Distance"
 HSM_VER_renew_armistice_desc:0 "The guards have grown accustomed to reporting an incident before answering it with a raid. Preserving that restraint means keeping the orders clear at every post. The frontier needs a dependable rule, not a date on which the feud becomes permissible again."
 HSM_VER_reopen_treaty:0 "Settle the Remaining Claims"
 HSM_VER_reopen_treaty_desc:0 "The permanent settlement concerns the land and livelihoods that outlast any patrol. The two Houses must distinguish private claims to compensation from a duke's claim to govern his neighbour."
 HSM_VER_return_to_congress:0 "The Limits of Common Government"
 HSM_VER_return_to_congress_desc:0 "A friendship treaty and a common government are different undertakings. A charter must define powers both Houses can accept. Without that agreement, the treaty may stand on its own and each government remains answerable for its own country."
 HSM_VER_invite_avian_again:0 "Avian's Place Among the Houses"
 HSM_VER_invite_avian_again_desc:0 "An observer may question the disputed clauses without accepting the charter. Avian's participation must rest on its own decision; its empty chair cannot suspend every obligation Erie and Eyrie have already undertaken."
 HSM_VER_obey_judgement:0 "Withdraw the Exception, Honour the Ruling"
 HSM_VER_obey_judgement_desc:0 "The court's judgement remains on the record, and the displaced family still has no answer it can use. Vincent will withdraw his exception and face the patron who believed a wartime promise placed him beyond an ordinary hearing. The common offices need to see the duke's own seal beneath the order that restores the court's authority."
 HSM_VER_exchange_prisoners:0 "Arrange an Exchange of Prisoners"
 HSM_VER_exchange_prisoners_desc:0 "The detention lists contain five hundred names from each House, many accompanied by years of unanswered family letters. Our clerks will compare them with Eyrie's records and arrange a meeting at the crossing. Both governments must agree on whom they are releasing, and the families deserve a date they can trust."
 HSM_VER_propose_defence:0 "Renew the Defensive-League Proposal"
 HSM_VER_propose_defence_desc:0 "Our preparations remain useful even though a league has not been agreed. When both Houses' diplomatic commitments permit it, ask Eyrie to reconsider common defence. An accepted proposal establishes a military partnership; a refusal leaves the charter intact."

 HSM_VER_armistice_offer_tt:0 "Proposes an armistice to Eyrie. Eyrie may sign, request joint inspections or refuse. A diplomatic settlement remains in force until war or a friendship treaty; the temporary arrangement outside that settlement lasts 365 days."
 HSM_VER_guarantees_tt:0 "Opens the frontier conference to agree on joint inspections or a restitution fund. Preparing guarantees does not sign the armistice; the other House may seek revised terms or refuse."
 HSM_VER_treaty_offer_tt:0 "Proposes friendship to Eyrie. Eyrie may sign, request property arbitration or refuse. Ratification ends the rivalry, inspections and mutual territorial claims; both Houses remain independent."
 HSM_VER_avian_offer_tt:0 "Invites House Avian to attend the congress as an §Yobserver§!. Avian decides whether to attend and, separately, whether to join a ratified charter. The Erie-Eyrie settlement can proceed without Avian."
 HSM_VER_charter_offer_tt:0 "Proposes an equal council or a limited ducal presidency. Eyrie may accept, seek equality or refuse. Agreed terms establish the charter; civic delegates can form a public council under equal terms."
 HSM_VER_defence_offer_tt:0 "Proposes a military league where existing commitments permit it. The recipient may refuse. Avian's membership requires separate consent."
 HSM_VER_charter_suspended_tt:0 "§RAll charter benefits are suspended§!, including its institutional settlement, joint staff and shared services. The friendship treaty and its construction benefits remain valid while their conditions hold. Erie can restore the charter by withdrawing the exception and obeying the judgement."
 HSM_VER_common_standards_bonus:0 "Common Industrial Specifications"
 HSM_VER_defence_bonus:0 "Joint Support Planning"
 HSM_VER_peaceful_development_bonus:0 "Construction Beyond the Feud"
 HSM_VER_defensive_league:0 "Verenian Defensive League"
 HSM_VER_keep_equal_union:0 "Our cooperation rests on the equality of the Houses."

 hsm_verenia.1.t:0 "The Inheritance on the Table"
 hsm_verenia.1.d:0 "Vincent asked for the accounts before he asked for the map. The steward laid out road repairs deferred for want of labour, grain purchases made at emergency prices, and pensions paid to households that had ceased to send sons home. Beside them lay the genealogy by which the duke claimed Verenia.\n\nIt was a sound claim. So was Iovinus Eyrie's. House Erie had branched from House Eyrie; Lady Katrina was aunt to both men. No careful reading of their ancestry could make the other nephew disappear.\n\nVincent rested a claw on the map. He still wanted the inheritance he believed was his. Yet possession of every ruined village would scarcely vindicate the years spent ruining them. He told the steward to leave the accounts where the councillors could see them. Tomorrow they would discuss what a settlement might require of its authors."
 hsm_verenia.1.a:0 "Let us hear what this country is owed."
 hsm_verenia.2.t:0 "The Petitioners' Bench"
 hsm_verenia.2.d:0 "The carpenter brought a broken hinge. It belonged to a workshop door burned during a raid, and he had carried it because three written petitions had produced three acknowledgements. Behind him waited a carrier whose route now ended at a barricade and a woman with two contradictory notices about her detained brother.\n\nVincent's chamberlain proposed individual audiences. Claims could be verified quietly; difficult promises need not become public commitments. The clerk beside him had already opened a register with space for witnesses and a date of reply.\n\nThe duke could hear them before the assembled court, accepting the civilian burden of a programme whose progress others would be able to judge. Or he could pay the political cost of private negotiations and leave his household in charge of each settlement. Either way, the carpenter wanted an answer before he went home."
 hsm_verenia.2.a:0 "Open the register. Hear them before witnesses."
 hsm_verenia.2.b:0 "Arrange private audiences and negotiate each claim."
 hsm_verenia.3.t:0 "A Letter Without a Marriage Contract"
 hsm_verenia.3.d:0 "Rosaline Erie of Bantry waited until the secretary had finished reading the formal correspondence. Then she placed a shorter letter beside Vincent's papers. Montague Eyrie, Earl of Verenia, had asked whether a journey between the Houses might ever require less preparation than a military expedition.\n\nTheir interest in one another was hardly a matter for the chancery to manufacture. Both were highborn scions with obligations enough; Rosaline did not intend to have a friendly correspondence converted into a marriage contract by a clerk eager to announce a settlement.\n\nVincent read the letter twice. His aunt Katrina was Iovinus's aunt as well, yet the family had made kinship serve the quarrel for years. He could at least let it serve a conversation. Rosaline asked for an answer that could be delivered safely, and for permission to write it herself. The duke returned her letter without dictating a line."
 hsm_verenia.3.a:0 "Let them speak in their own voices."
 hsm_verenia.4.t:0 "The Cart at the Crossing"
 hsm_verenia.4.d:0 "The first carrier to reach the reopened crossing stopped short of the barrier's empty sockets. He had brought flour, two replacement axles and the old permit bearing a seal that nobody on duty now wished to recognise. An officer read it while the workmen waited with their shovels.\n\nA clerk eventually produced the new instructions. The axle needed weighing; the flour needed an entry in the ledger. Neither required a search for hidden soldiers. By noon the cart was moving again, slowly over the culvert the road crew had spent the morning repairing.\n\nFrom his carriage Vincent watched the carrier test the wheels on firmer ground. No cheer followed him. Others simply began unloading their papers and arranging themselves into a queue. The duke had heard grander declarations of confidence. This one would require him to keep the road open tomorrow."
 hsm_verenia.4.a:0 "See that tomorrow's crossing is as uneventful."

 hsm_verenia.20.t:0 "Orders to End the Raids"
 hsm_verenia.20.d:0 "Erie's envoys have brought matching orders to end the raids. Iovinus studies the restrictions on frontier patrols before the signatures. He knows how easily an ambitious officer can mistake silence for permission. The proposed armistice gives the Houses room to build a permanent settlement. We can accept, require joint inspections or refuse. Vincent's commitment does not relieve us of responsibility for our own border."
 hsm_verenia.20.a:0 "Issue matching orders. Accept the armistice."
 hsm_verenia.20.b:0 "We require joint inspections of the frontier."
 hsm_verenia.20.c:0 "These assurances are insufficient. Refuse."
 hsm_verenia.21.t:0 "Two Signatures on the Inspection Report"
 hsm_verenia.21.d:0 "Iovinus requires officers from both Houses to examine alleged breaches together. Vincent's captains object to outsiders questioning their reports; the same right to question Eyrie's reports does little to soothe them. Accepting will cost the duke political capital at home and conclude the armistice. The inspection arrangement will serve that ceasefire until a permanent treaty replaces it or the ceasefire breaks down. Refusal leaves the proposal unsigned."
 hsm_verenia.21.a:0 "Accept reciprocal inspections and sign."
 hsm_verenia.21.b:0 "We cannot accept that condition."
 hsm_verenia.22.t:0 "The Orders Reach the Border"
 hsm_verenia.22.d:0 "The signed orders have reached both headquarters. Skirmishing parties are being recalled, and the frontier posts are receiving instructions that forbid the familiar excuses for a raid. A private understanding between dukes would be little use to a sentry in the rain. The competing inheritance claims remain for the permanent settlement to resolve; tonight, neither command may use them to send another patrol across the line."
 hsm_verenia.22.a:0 "Let the frontier keep its silence."
 hsm_verenia.23.t:0 "An Unsigned Copy"
 hsm_verenia.23.d:0 "Eyrie's envoy returned the draft without a signature. At the council table, some demand that Vincent answer the refusal with troops. The duke has promised a different course. There is no armistice to announce, and the frontier must remain guarded. But the money and labour assigned to recovery need not wait for Iovinus to change his mind. The hearing at home produced obligations that no foreign refusal can erase."
 hsm_verenia.23.a:0 "Our country cannot wait upon this answer."
 hsm_verenia.24.t:0 "The Names on Both Lists"
 hsm_verenia.24.d:0 "Erie's delegation has brought a list of five hundred prisoners it will release if we return the same number. Our clerk recognises several names from petitions still waiting in his drawer. The officers want the lists checked, the crossing supervised and the exchange completed together. We can authorise that reciprocal return, or withhold consent. The proposed agreement alone opens no prison gate."
 hsm_verenia.24.a:0 "Verify the lists and return the men."
 hsm_verenia.24.b:0 "We will not authorise this exchange."
 hsm_verenia.25.t:0 "Five Hundred Places at Home"
 hsm_verenia.25.d:0 "At the crossing, the clerks called each name twice: once against the detention list, once to hear a living answer. Five hundred men passed towards Erie while the same number returned towards Eyrie. Some families had brought coats; others had brought food that nobody remembered to eat. The final signatures accounted for the exchange. They could not account for the years it had taken to arrange."
 hsm_verenia.25.a:0 "Strike their names from the missing."
 hsm_verenia.29.t:0 "The Armistice Offer Expires"
 hsm_verenia.29.d:0 "The envoys have come home without a signed armistice. At the frontier, the guards continue under the arrangements actually in force; a proposal never became an order. The council must now decide what it can deliver without a common settlement. Roads, schools and workshops do not cease to matter because the conference failed."
 hsm_verenia.29.a:0 "Close the conference. Keep our promises at home."

 hsm_verenia.30.t:0 "An End to the Feud?"
 hsm_verenia.30.d:0 "Vincent offers a friendship treaty that would end the rivalry and relinquish each House's territorial demands across the old lines. Iovinus sees the benefit to roads, markets and exhausted villages. His councillors see deeds whose owners fled those same lines. We can accept the reciprocal settlement, require agreed arbitration of property disputes, or retain only the arrangements already in force. None of these choices transfers our government to Erie."
 hsm_verenia.30.a:0 "Ratify the reciprocal settlement."
 hsm_verenia.30.b:0 "First guarantee a hearing for disputed property."
 hsm_verenia.30.c:0 "We are not ready to sign this treaty."
 hsm_verenia.31.t:0 "What Becomes of the Old Deeds?"
 hsm_verenia.31.d:0 "Eyrie will sign if property disputes receive an agreed hearing. Several of Vincent's supporters object: their wartime rewards sit on land other families still claim. Acceptance means funding a claims commission and spending political capital to acknowledge the limits of ducal favour. Refusal preserves that freedom of action but loses this opportunity to conclude the treaty. Iovinus has given us a concrete answer; now he expects one in return."
 hsm_verenia.31.a:0 "Fund property arbitration and ratify the treaty."
 hsm_verenia.31.b:0 "Our undertakings cannot bear that condition."
 hsm_verenia.32.t:0 "Two Seals, Two Governments"
 hsm_verenia.32.d:0 "The treaty copies have been exchanged. Each House has relinquished its territorial demands against the other and withdrawn the official hostility that made every negotiation an exception. Engineers can plan roads and railway work with greater confidence. Vincent's seal sits beside Iovinus's, neither above the other. The treaty ends the feud through mutual obligations; any shared government will require another conversation."
 hsm_verenia.32.a:0 "Let the peace begin earning its place."
 hsm_verenia.33.t:0 "The Treaty Returns Unratified"
 hsm_verenia.33.d:0 "Iovinus has declined the friendship treaty. Vincent's advisers lay the rejected clauses beside the reports from the reopened roads. They cannot announce an end to the rivalry or claim concessions the other House never accepted. Any existing armistice remains subject to its own terms. The recovery of Erie, however, is still within their reach. A failed treaty does not oblige Vincent to abandon either his country or his promise not to conquer his neighbour."
 hsm_verenia.33.a:0 "Rebuild what is ours to rebuild."
 hsm_verenia.39.t:0 "A Treaty Without Ratification"
 hsm_verenia.39.d:0 "The treaty conference has ended without ratification. The rivalry and the disputed territorial claims have not disappeared from the record. Whatever earlier agreements remain valid must be honoured on their own terms; the unanswered draft adds nothing to them. The delegation returns with useful work on roads and construction, and without authority to speak for the other House. That is the honest starting point for rebuilding at home."
 hsm_verenia.39.a:0 "Do not call the draft a treaty."

 hsm_verenia.40.t:0 "A Chair for the Towns"
 hsm_verenia.40.d:0 "The chamberlain's list of congress delegates was impeccable. Every household had its proper precedence, every councillor a title sufficiently long to fill the margin. The clerk who kept the petition register asked where the carriers' representative would sit. There was no place marked for him.\n\nVincent could appoint civic delegates from the towns and parishes alongside the court's negotiators. Their instructions would concern roads, workshops and accountable expenditure. Winning their cooperation would consume political capital, and an equal council containing them would have to devote real attention to civilian work. A ducal presidency would instead concentrate leadership in its limited chair.\n\nThe household delegation offered quieter bargaining and fewer competing demands. Neither list would alter anyone's convictions overnight. The choice was practical: who could put an item on the agenda, who would have to answer, and whose absence the duke was prepared to defend."
 hsm_verenia.40.a:0 "Make room for civic delegates."
 hsm_verenia.40.b:0 "Entrust the mandate to household delegates."

 hsm_verenia.50.t:0 "An Observer's Place at the Congress"
 hsm_verenia.50.d:0 "Erie and Eyrie have made peace and now invite House Avian to observe their congress. Katrina knows both nephews' pride, and how much patient work a careless phrase can undo. Our presence might help settle disputed clauses and let us judge the proposed institutions ourselves. Attendance would not sign the charter on our behalf. We may accept that limited role or leave the two Houses to conduct their own business."
 hsm_verenia.50.a:0 "Send observers with a mandate to listen."
 hsm_verenia.50.b:0 "Our House will remain outside these talks."
 hsm_verenia.51.t:0 "Avian Will Attend"
 hsm_verenia.51.d:0 "House Avian has accepted an observer's place. The congress secretary adds another delegation to the seating plan, then asks which papers it should receive. Vincent tells him to send the disputed clauses as well as the agreed ones. An observer who sees only the ceremonial copy would be little help. Avian's decision about membership remains its own, to be made on the charter's actual terms."
 hsm_verenia.51.a:0 "Give them the working papers."
 hsm_verenia.52.t:0 "The Third Place Remains Empty"
 hsm_verenia.52.d:0 "House Avian has declined our invitation. Some courtiers had counted on a familiar voice to soften the difficult exchanges; the envoys must now do that work themselves. The treaty between Erie and Eyrie remains binding, and their congress can proceed with two delegations. We have invited a neighbour to participate. Its decision to stay away does not cancel the decisions already made by others."
 hsm_verenia.52.a:0 "Continue the talks with Eyrie."
 hsm_verenia.59.t:0 "No Observer Arrives"
 hsm_verenia.59.d:0 "No observer from House Avian has arrived. The secretary removes the provisional place from the table and brings the disputed clauses to the two delegations present. Avian's silence is neither consent nor a reason to leave our own work unfinished. Erie and Eyrie must settle the powers they are prepared to share without borrowing a third House's voice."
 hsm_verenia.59.a:0 "Proceed with the delegations present."

 hsm_verenia.60.t:0 "Who Shall Preside?"
 hsm_verenia.60.d:0 "The charter draft leaves the council's chair unsettled. Equal leadership would accommodate the civic delegates, if appointed, and give civilian needs a stronger place in government at the cost of political freedom of action. Vincent could instead seek a limited ducal presidency, lending stability and authority to the agreed work. That chair would confer neither sovereignty over Eyrie nor hereditary command of its ruler. Eyrie must consent to either arrangement."
 hsm_verenia.60.a:0 "An equal council with the appointed delegates."
 hsm_verenia.60.b:0 "Propose a ducal presidency bound by the charter."
 hsm_verenia.61.t:0 "The Proposed Common Charter"
 hsm_verenia.61.d:0 "Erie's delegation proposes an equal council and common institutions with powers defined by agreement. Iovinus's advisers work through the draft clause by clause: jurisdiction, shared business and the obligations of each signatory. The charter would make cooperation more durable while preserving our government. We may ratify it or decide that the friendship treaty already represents the extent of the partnership we are prepared to undertake."
 hsm_verenia.61.ducal.d:0 "Vincent asks to preside over the common council within the charter's stated limits. His chair would grant no sovereignty over Eyrie, yet Iovinus doubts that every future dispute about its powers would be easy to settle. We can accept the limited presidency, demand an equal council instead, or decline the charter. Our existing peace does not oblige us to endorse Erie's preferred constitution."
 hsm_verenia.61.a:0 "Ratify the charter on these terms."
 hsm_verenia.61.b:0 "We will sign under an equal council."
 hsm_verenia.61.c:0 "Keep the treaty; decline the charter."
 hsm_verenia.62.t:0 "Iovinus's Counterproposal"
 hsm_verenia.62.d:0 "Eyrie will join the charter under an equal council. Its envoys have crossed out the proposed ducal presidency and left the common institutions intact. Vincent studies the amendment longer than any other clause. He can accept a partnership in which his inherited claim grants no special chair, or let this congress end without a charter. Iovinus has offered cooperation on terms he is prepared to honour."
 hsm_verenia.62.a:0 "Accept the equal council and ratify."
 hsm_verenia.62.b:0 "We cannot agree on this constitution."
 hsm_verenia.63.t:0 "Avian's Own Signature"
 hsm_verenia.63.d:0 "The two Houses have ratified their charter. As an observer, Avian has seen the compromises behind the final text and must now decide whether to assume the same obligations. Joining gives us a place in the common institutions and access to services already established under them. It also binds us to their limits. We may sign as a third independent partner or leave the settlement to its present members."
 hsm_verenia.63.a:0 "Join as an equal and independent signatory."
 hsm_verenia.63.b:0 "Conclude our observation without joining."
 hsm_verenia.64.t:0 "The Charter Enters into Force"
 hsm_verenia.64.d:0 "Erie and Eyrie have exchanged ratified copies of the charter. Clerks are assigning the first cases, establishing the council's records and finding rooms for its agreed business. The negotiated institutional settlement can now operate, with further cooperation to follow as it is established. Avian's participation, if any, requires its own assent. Two signatures already suffice to bind the two governments that placed them on the page."
 hsm_verenia.64.a:0 "Put the agreed institutions to work."
 hsm_verenia.65.t:0 "Peace Survives the Congress"
 hsm_verenia.65.d:0 "Eyrie has refused the common charter. Its envoys confirm that the friendship treaty stands, but neither delegation can promise a common council. Vincent must face the difference between preserving peace and securing everything he wanted from it. The congress has ended. At home, people still expect the works promised before anyone had drawn a seating plan for the delegates."
 hsm_verenia.65.a:0 "Honour the treaty we did conclude."
 hsm_verenia.69.t:0 "The Congress Adjourns"
 hsm_verenia.69.d:0 "The last session has ended without an agreed charter. No common court or council can claim authority from the unfinished text. Any earlier treaty still in force remains binding on its own terms. The delegations leave separately, each answerable for what its own government can deliver. Their failure to build a common administration need not become another generation's reason for war."
 hsm_verenia.69.a:0 "Preserve the peace and the record of the talks."

 hsm_verenia.70.t:0 "The Estate Vincent Promised"
 hsm_verenia.70.d:0 "The veteran stood when Vincent entered. Years earlier he had brought men and money to Erie's cause; in return the duke had promised him an estate. He had repaired its roof and paid its labourers. Now a family whose members had found themselves on opposite sides of the old lines had produced the deeds.\n\nThe common court had heard both parties. The estate must be returned, or its lawful owners compensated under the judgement. Service to Erie did not extinguish their title. The veteran asked only whether the duke's word still counted for anything.\n\nVincent's word counted on both documents: the promise of reward and the charter authorising this court. Accepting the ruling would cost him influence and the confidence of a loyal patron. A royal exception would protect that patron, but suspend every charter benefit by placing the duke above the rules he had asked others to trust."
 hsm_verenia.70.a:0 "Honour the judgement. The political cost is mine."
 hsm_verenia.70.b:0 "Grant a royal exception for my patron."
 hsm_verenia.71.t:0 "A Ruling That Reaches the Powerful"
 hsm_verenia.71.d:0 "Iovinus read the judgement, then Erie's acknowledgement, and sent for the court secretary. He wanted to know whether Vincent had attached conditions. There were none. Restitution or compensation would proceed despite the duke's personal promise to the estate's beneficiary.\n\nThe family had spent years proving that it belonged somewhere. In one office its relatives across the lines had made it suspect; in another, its displaced members had made its title inconvenient. Now a clerk could cite a ruling instead of asking which patron might speak for it.\n\nIovinus had no reason to forget Vincent's ambitions. He had acquired a reason to take his undertakings seriously. The council ordered the case entered in the common record, with Erie's acceptance attached. When another powerful petitioner challenged the court, there would be a precedent worth reading aloud."
 hsm_verenia.71.a:0 "Enter the acceptance beside the judgement."
 hsm_verenia.72.t:0 "The Seal Above the Law"
 hsm_verenia.72.d:0 "The decision from Erie arrived bearing Vincent's seal. His patron would retain the benefit of the promised estate under a royal exception. The common court's judgement remained in the register, deprived of the force the charter had promised it.\n\nIovinus asked his councillors what assurance they could now give a petitioner without a duke's favour. Nobody offered a convincing answer. The common institutions suspended their work under the charter; the staff officers and technical clerks no longer knew which undertakings their governments would honour. Every signatory would feel the interruption.\n\nThe friendship treaty remained. The roads did not need another quarrel, and the displaced family did not need another war fought in its name. Eyrie's answer therefore named a remedy: withdraw the exception and obey the judgement. Until Vincent did so, his signature could not sustain the institutions it had created."
 hsm_verenia.72.a:0 "Keep the peace. Suspend the charter's benefits."
 hsm_verenia.73.t:0 "The Exception Withdrawn"
 hsm_verenia.73.d:0 "Vincent signed the withdrawal in the same room where he had promised the estate. His patron was absent. The secretary had prepared a statement about renewed confidence; the duke asked him to begin with the court's judgement instead.\n\nRestitution or compensation would proceed under its terms. The exception was rescinded, and the cost of disappointing those who had relied on it would fall on the government that had granted it. There was no language suggesting that the family owed gratitude for receiving what the court had already recognised.\n\nCopies went to Eyrie and to the participating institutions. Their work could resume as the suspension ended, including services already established before the breach. Trust would recover less neatly. For now, the record contained a judgement, an evasion and a correction. Vincent could do nothing about their order. He could ensure there was no fourth entry."
 hsm_verenia.73.a:0 "Let the institutions resume their work."

 hsm_verenia.80.t:0 "A League for Common Defence"
 hsm_verenia.80.d:0 "Erie proposes a military league built on the charter's cooperation. Our staff has already learned to work with its counterparts, but a league would add a diplomatic commitment that technical cooperation alone does not carry. Iovinus can accept common defence or keep the existing charter without entering a military alliance. The decision belongs to our government, and Avian would make its own decision if invited."
 hsm_verenia.80.a:0 "Accept the defensive partnership."
 hsm_verenia.80.b:0 "Keep our military commitments separate."
 hsm_verenia.81.t:0 "Cooperation Without a League"
 hsm_verenia.81.d:0 "Our preparations have not produced a defensive league. An agreement may lack consent, or the Houses' existing diplomatic commitments may leave no room for it. The charter's practical work remains valuable on its own terms. Staff officers can retain what they have learned, while the government keeps the proposal ready for a time when both Houses are able and willing to commit."
 hsm_verenia.81.a:0 "Maintain the charter and our preparations."
 hsm_verenia.82.t:0 "Avian and the Defensive League"
 hsm_verenia.82.d:0 "Erie and Eyrie have agreed on common defence and invite their Avian charter partner to join the league. The invitation is distinct from the charter we already signed. Our government must weigh a military commitment against the independence of its present policy. We may enter the league and share its obligations, or continue the charter's cooperation without taking that further step."
 hsm_verenia.82.a:0 "Join the defensive league."
 hsm_verenia.82.b:0 "Remain a charter partner outside the league."

 hsm_verenia.90.t:0 "The Petitioners Return"
 hsm_verenia.90.public.d:0 "The clerk opened the same register that had lain before the first public hearing. Some entries bore dates of completion; others had long explanations written into the margins. The carpenter returned without the broken hinge. This time he brought the first invoice from a workshop that could take orders again.\n\nThe public programme had consumed resources while ministers found other uses for every available coin. Now its commitments could be discharged. New civilian work stood behind the promises, and the petitioners could compare the result with words spoken before witnesses.\n\nVincent listened as the carrier complained about a damaged stretch beyond the repaired crossing. The chamberlain looked offended at the occasion being spoiled. The duke asked the clerk to record the location. A country recovering from a feud would still have bad roads. Its people should be able to complain about them without first explaining which House they served."
 hsm_verenia.90.d:0 "The chamberlain arranged the returning petitioners in the order of their private agreements. There was no public register to read aloud, but the carpenter had kept the clerk's first acknowledgement in his coat. He set it beside an invoice from a workshop that could finally take orders again.\n\nPrivate bargaining had allowed the household to settle awkward questions quietly. It had also made progress depend on remembering names that rarely appeared at court. Vincent asked the secretary to bring every outstanding file, including those whose authors had stopped writing.\n\nThe promised programme could now be discharged, with civilian work to show for it. The carrier nevertheless described a damaged stretch beyond the repaired crossing. Vincent had its location noted beside the completed agreement. The signature ended one undertaking. It did not make the people who had relied on it disappear."
 hsm_verenia.90.a:0 "Keep the completed promises where we can see them."
 hsm_verenia.91.t:0 "What the Next Generation Inherits"
 hsm_verenia.91.d:0 "The council's business began with a dispute about workshop specifications. An Eyrie delegate objected to the wording; an Erie clerk fetched the previous agreement. Outside, a carrier waited to learn which form would accompany his next load. Nobody summoned a regiment.\n\nVincent looked across the table at a partnership his genealogists could never have drafted. His claim to Verenia remained part of his understanding of himself. Iovinus's equally valid claim remained part of the settlement they had learned to share. Neither had surrendered his government to the other.\n\nBetween the two Houses stood a court, agreed services and a record of promises tested against inconvenient facts. The common register now held disputed invoices beside the judgements that had made its authority credible. Clerks from both Houses knew where to find them. The union's success would be measured in how seldom their children needed to learn why every clause had once been difficult."
 hsm_verenia.91.three.d:0 "Three delegations arrived for the council's ordinary business. Avian's representative asked for a correction to the minutes before Erie and Eyrie resumed their argument over workshop specifications. The clerk found the disputed passage and read it back. Nobody treated the third House's signature as ornamental.\n\nVincent watched the papers move around the table. His inherited claim still mattered to him; Iovinus's equally valid claim had not vanished, and Avian had joined by its own decision. The charter gave their governments agreed work to conduct together and limits each was obliged to respect.\n\nA court had tested those obligations against a powerful patron. Services had made cooperation useful beyond the council chamber. The union now belonged to three independent partners who could speak, object and be answered. What the next generation inherited would depend on those habits surviving after the signatures had ceased to be news."
 hsm_verenia.91.a:0 "Let them inherit the agreement, and keep improving it."
 hsm_verenia.92.t:0 "Work Beyond the Conference"
 hsm_verenia.92.d:0 "Vincent found the proposed common charter beneath the plans for a school roof. The steward apologised for the disorder. The duke asked him to leave the roof on top.\n\nThe shared settlement had not survived the negotiation and the changes beyond the frontier. Its papers could not make a promise on another government's behalf. Whatever agreements remained in force would be respected; there would be no ceremony announcing one that had never existed.\n\nErie's recovery was a different obligation. The court could employ builders, honour its own commitments and put the knowledge brought home by the delegation to work. Vincent had wanted a place in a larger settlement. For now, a roof that would hold through winter was an undertaking he could actually answer for."
 hsm_verenia.92.a:0 "Begin with the roof."
 hsm_verenia.95.t:0 "Avian Demands a New Relationship"
 hsm_verenia.95.d:0 "The coup in Avian has replaced familiar assurances with a demand that our House recognise its supremacy. Whatever cooperation existed before, the new authorities cannot acquire our independence by announcing that it has ended. We can reject the demand and maintain our sovereign government. We may instead voluntarily recognise Avian's suzerainty, allowing Hallhaus to direct matters our government once settled for itself. That submission requires our own decision; it does not follow from an earlier invitation or charter."
 hsm_verenia.95.a:0 "Defend our independence. Reject the demand."
 hsm_verenia.95.b:0 "Voluntarily recognise Avian's suzerainty."

