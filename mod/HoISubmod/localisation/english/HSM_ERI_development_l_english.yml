l_english:
 HSM_ERI_DEV_common_curriculum_bonus:0 "Common Technical Curriculum"
 HSM_ERI_DEV_public_health_bonus:0 "Public Health Training"
 HSM_ERI_reconstruction:0 "The Work of Reconstruction"
 HSM_ERI_reconstruction_desc:0 "Neglected bridges, leaking roofs and unanswered petitions have become ordinary features of life in Erie. We will establish a small reconstruction office to survey the damage, arrange deliveries and give local repair crews a reliable point of contact. Its authority will rest on work completed."
 HSM_ERI_restore_public_services:0 "Restore Public Services"
 HSM_ERI_restore_public_services_desc:0 "Clean wells, working dispensaries and dependable local offices matter to families long before grand plans reach them. Repair crews will restore these services first, while regular inspections keep them from falling into neglect again. A household should not have to spend its last savings on failures the administration could have prevented."
 HSM_ERI_reopen_roads:0 "Reopen the District Roads"
 HSM_ERI_reopen_roads_desc:0 "The roads of Erie, Balefire and Comrick must carry grain, tools and travellers in every season. Repaired bridges, drainage ditches and maintained surfaces will reconnect isolated settlements with their markets. The engineers' surveys will also guide our next construction projects."
 HSM_ERI_civilian_industry:0 "A Civilian Industrial Base"
 HSM_ERI_civilian_industry_desc:0 "Our builders need reliable supplies of timber, fittings and machine parts. Expanding civilian production will give local firms steady contracts and put more of that work within reach. This is one step towards an industrial economy, with much still to be built."
 HSM_ERI_workshop_network:0 "Connect the Workshops"
 HSM_ERI_workshop_network_desc:0 "A workshop can grow beyond its founder's tools when it can order standard parts and train apprentices to use them. We will expand manufacturing premises and bring willing workshops into a common system of measurements, inspections and orders. Small producers will retain their craft while learning to supply a larger market."
 HSM_ERI_veterans_to_work:0 "A Trade After Service"
 HSM_ERI_veterans_to_work_desc:0 "Returning soldiers bring practical skills, but a service record is no guarantee of a livelihood. A new placement scheme will match veterans with apprenticeships, repair crews and workshop jobs, with suitable work for those carrying lasting injuries. Experienced volunteers can also help prepare the next intake of recruits."
 HSM_ERI_village_schools:0 "Schools Within Reach"
 HSM_ERI_village_schools_desc:0 "Children should not lose their chance to learn because the nearest classroom is a day's journey away. We will reopen neglected rooms, provide basic books and offer evening lessons to adults. Reading, arithmetic and an introduction to practical science will make further study possible for more households."
 HSM_ERI_teacher_training:0 "Train the Teachers"
 HSM_ERI_teacher_training_desc:0 "Opening a classroom is easier than finding someone prepared to teach in it. New teacher courses will combine supervised lessons with arithmetic, record keeping and elementary technical subjects. Graduates will return to local schools with materials they can use and colleagues they can consult."
 HSM_ERI_technical_college:0 "Found a Technical College"
 HSM_ERI_technical_college_desc:0 "With schools and civilian workshops in place, we can establish a modest technical college. Its first laboratories will teach mechanics and electrical measurement, while workshop placements keep instruction close to practical problems. This new institution will give Erie's growing scientific community a place to train its successors."
 HSM_ERI_applied_research:0 "From Lessons to Research"
 HSM_ERI_applied_research_desc:0 "The college can now support a small team working on problems beyond the classroom. A functioning civilian industrial base and an understanding of electrical engineering will let researchers build instruments, test designs and record results. Sustained research needs a budget, equipment and time as well as promising ideas."
 HSM_ERI_research_council:0 "Coordinate Research"
 HSM_ERI_research_council_desc:0 "Our expanding factories and trained workforce can sustain a broader scientific programme. We will form a small research council to share laboratory time, award practical commissions and publish useful findings. Once basic machine tools and construction methods are established, a second permanent research team can begin work."
 HSM_ERI_army_for_a_country:0 "An Army for the Country"
 HSM_ERI_army_for_a_country_desc:0 "The army must be able to defend the settlements, roads and livelihoods entrusted to it. A review of unit rolls, stores and training will show what our formations can actually do. From that accounting we can build a force whose duties extend beyond ceremony and personal allegiance."
 HSM_ERI_professional_officers:0 "Professional Officers"
 HSM_ERI_professional_officers_desc:0 "A commission carries responsibility for supplies, training and the lives of subordinates. Regular staff courses and exercises will give officers a common grounding in those duties. Promotion should recognise demonstrated competence and the ability to keep a unit ready for service."
 HSM_ERI_modern_infantry:0 "Modern Infantry Equipment"
 HSM_ERI_modern_infantry_desc:0 "Infantry cannot depend indefinitely on incompatible weapons and improvised replacement parts. Comparative trials will identify practical rifles and squad equipment that our workshops can maintain. The results will inform both procurement and the drills used to train their crews."
 HSM_ERI_support_companies:0 "Engineers and Field Medics"
 HSM_ERI_support_companies_desc:0 "A damaged crossing or an untreated wound can end a campaign as surely as enemy fire. We will organise specialist training for engineers and medical detachments, and test equipment suited to their work. These companies must be able to move and serve alongside the infantry."
 HSM_ERI_arsenal_workshops:0 "Expand the Arsenal"
 HSM_ERI_arsenal_workshops_desc:0 "A dependable arsenal needs gauges, inspection benches and workers who understand the equipment they produce. New military workshops will expand our capacity to manufacture and repair weapons. Artillery trials will help ensure that future orders suit the army we can maintain."
 HSM_ERI_supply_service:0 "A Permanent Supply Service"
 HSM_ERI_supply_service_desc:0 "Each formation must know where its next delivery will come from and how to request it. A permanent supply service will standardise inventories, loading schedules and the maintenance of transport. Trials of motor vehicles and specialist logistics equipment will turn these plans into usable field procedures."
 HSM_ERI_integrated_staff:0 "A Staff That Works Together"
 HSM_ERI_integrated_staff_desc:0 "Infantry officers, engineers, medical staff and quartermasters need to plan the same campaign. Joint exercises will test how their work fits together and reveal where orders fail to reach the units that need them. A shared staff system will preserve those lessons for the next mobilisation."

 HSM_ERI_DEV_reconstruction_service:0 "Reconstruction Office"
 HSM_ERI_DEV_reconstruction_service_desc:0 "This newly established office coordinates surveys, materials and repair crews. A common schedule helps limited resources reach the work that needs them."
 HSM_ERI_DEV_public_services:0 "Maintained Public Services"
 HSM_ERI_DEV_public_services_desc:0 "Regular inspections and dependable repair crews keep wells, dispensaries and public buildings in working order. Local services can now address routine problems before they become emergencies."
 HSM_ERI_DEV_workshop_standards:0 "Common Workshop Standards"
 HSM_ERI_DEV_workshop_standards_desc:0 "Shared measurements, inspection routines and apprentice training allow small workshops to fill larger orders with fewer costly mistakes."
 HSM_ERI_DEV_veteran_placements:0 "Veterans in Skilled Work"
 HSM_ERI_DEV_veteran_placements_desc:0 "A new placement scheme helps former soldiers find suitable trades. Their practical experience benefits workshop teams, while willing veterans pass useful skills to recruits."
 HSM_ERI_DEV_technical_education:0 "Practical Education"
 HSM_ERI_DEV_technical_education_desc:0 "Teacher courses and accessible lessons give more students the foundations needed for technical study. Researchers can draw on a growing pool of trained assistants."
 HSM_ERI_DEV_officer_corps:0 "Professional Officer Corps"
 HSM_ERI_DEV_officer_corps_desc:0 "Regular courses and field exercises give officers a common approach to training, administration and command."
 HSM_ERI_DEV_supply_service:0 "Permanent Supply Service"
 HSM_ERI_DEV_supply_service_desc:0 "Reliable inventories and transport schedules reduce waste and make it easier to sustain formations in the field."
 HSM_ERI_DEV_integrated_staff:0 "Integrated Army Staff"
 HSM_ERI_DEV_integrated_staff_desc:0 "Commanders and specialist services plan together, test their procedures in joint exercises and pass the lessons on through regular training."

 HSM_ERI_DEV_construction_bonus:0 "District Engineering Surveys"
 HSM_ERI_DEV_industry_bonus:0 "Workshop and College Research"
 HSM_ERI_DEV_electronics_bonus:0 "Practical Electrical Studies"
 HSM_ERI_DEV_infantry_bonus:0 "Infantry Equipment Trials"
 HSM_ERI_DEV_engineers_bonus:0 "Field Engineering Courses"
 HSM_ERI_DEV_medical_bonus:0 "Field Medicine Courses"
 HSM_ERI_DEV_artillery_bonus:0 "Arsenal Artillery Trials"
 HSM_ERI_DEV_logistics_bonus:0 "Supply Service Trials"
 HSM_ERI_DEV_motorization_bonus:0 "Transport Maintenance Trials"
 HSM_ERI_DEV_support_bonus:0 "Joint Service Exercises"
 HSM_ERI_public_libraries:0 "Books Beyond the Classroom"
 HSM_ERI_public_libraries_desc:0 "School leavers need somewhere to keep learning. Public reading rooms will lend practical manuals, newspapers and stories, while travelling librarians carry books to settlements too small to maintain a collection of their own."
 HSM_ERI_universal_schooling:0 "A Place for Every Pupil"
 HSM_ERI_universal_schooling_desc:0 "A school is public only when every family can use it. Attendance officers will work with parents, teachers and employers to bring missing pupils into class, and adult tutors will welcome those whose childhood passed without that chance."
 HSM_ERI_district_housing:0 "Homes Fit for Work and Rest"
 HSM_ERI_district_housing_desc:0 "Crowded lodgings and leaking roofs consume the wages that should keep a household secure. District builders will repair rented homes and lay out affordable housing near the workshops, with residents able to demand repairs without risking eviction."
 HSM_ERI_social_insurance:0 "Security Through Hard Times"
 HSM_ERI_social_insurance_desc:0 "Illness and injury should not send a working family back to the poorhouse. Employers, workers and the treasury will sustain an insurance fund whose local offices pay claims promptly and answer openly for the money entrusted to them."
 HSM_ERI_rural_credit:0 "Credit for the Countryside"
 HSM_ERI_rural_credit_desc:0 "Farmers and village tradespeople need loans that can be repaid from honest work. Local credit associations will share risks, publish their terms and keep emergency borrowing from becoming a lifetime of dependence."
 HSM_ERI_public_utilities:0 "Water, Power and Public Works"
 HSM_ERI_public_utilities_desc:0 "Growing towns need dependable water, lighting and transport. Engineers and elected district representatives will agree on common service standards, extend reliable networks and train the crews who must keep them working through every season."
 HSM_ERI_lasting_prosperity:0 "Prosperity That Reaches Home"
 HSM_ERI_lasting_prosperity_desc:0 "The rebuilding programme must finally reach the households still left behind. Secure homes, steady work and dependable services will become ordinary expectations, with local authorities responsible for carrying prosperity beyond the busiest streets."
