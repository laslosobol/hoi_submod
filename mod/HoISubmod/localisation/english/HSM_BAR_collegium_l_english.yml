l_english:
 HSM_BAR_collegium_oath:0 "The Promise in the Square"
 HSM_BAR_collegium_applied_chorus:0 "A Choir beyond Its Conductor"
 HSM_BAR_collegium_applied_chorus_desc:0 "Viira's completed Chorus can link trained groups, not every mind in a province. Publish the accepted exercises and send instructors who can recognise a broken link as readily as a successful one. The armed forces may study the method under the same limits as civilian teams. Scaling an accepted result still calls for further research; it is not permission to make consent disappear."
 HSM_BAR_collegium_applied_manufactory:0 "Drawings for Other Workshops"
 HSM_BAR_collegium_applied_manufactory_desc:0 "The Manufactory has passed its trials. Its next test is less theatrical: can a district workshop understand the approved drawings, order replacement parts and stop a station safely without Leopold beside it? The Collegium will publish production standards and support industrial research. Separate stoppages, known materials and honest repair intervals remain part of the design, including the lesson left by the failed howitzer."
 HSM_BAR_collegium_applied_last_minute:0 "The Journey to the Hospital"
 HSM_BAR_collegium_applied_last_minute_desc:0 "The Last Minute preserves a chance of treatment; it does not replace treatment. After the clinical trials, Silver will work with the republic's physicians on evacuation records, receiving wards and the handover of patients. Hospital research must carry the method beyond its inventor without promising a second life to the dead. Every saved minute needs somewhere useful to lead."
 HSM_BAR_collegium_applied_contact:0 "A Dictionary without a Promise"
 HSM_BAR_collegium_applied_contact_desc:0 "Asinti's completed trials established limited contact without a living host. They did not establish that the answerer means what we think it means. A comparative programme will examine repeatable signs, silences and contradictory replies under the accepted ritual safeguards. Its records belong to magical research, not a diplomatic office: an unexplained voice has not become a recognised ambassador."
 HSM_BAR_collegium_school_research:0 "Instrument Training"
 HSM_BAR_collegium_grid_research:0 "Municipal Power Standards"
 HSM_BAR_collegium_wards_research:0 "Reproducible Wards"
 HSM_BAR_collegium_longevity_research:0 "Clinical Follow-up"
 HSM_BAR_collegium_bodycraft_research:0 "District Repair Network"
 HSM_BAR_collegium_teachers_research:0 "Instructor Laboratories"
 HSM_BAR_collegium_peer_review_research:0 "Independent Magical Replication"
 HSM_BAR_collegium_war_reserve_research:0 "Medical Supply and Evacuation"
 HSM_BAR_collegium_chorus_ready_tt:0 "Completed the Collegium project 'The Chorus', including its trials."
 HSM_BAR_collegium_manufactory_ready_tt:0 "Completed the Collegium project 'The Manufactory', including its trials."
 HSM_BAR_collegium_last_minute_ready_tt:0 "Completed the Collegium project 'The Last Minute', including its trials."
 HSM_BAR_collegium_contact_ready_tt:0 "Completed the Collegium project 'Contact', including its trials."
 HSM_BAR_collegium_oath_desc:0 "The square has not elected four new sovereigns. The crowd has spared four lives, and those lives now carry obligations. Gasienica's provisional government must answer for food, courts and the roads; the Collegium must answer for what happens inside its laboratories. We will begin by writing down that distinction while everyone still remembers why it matters."
 HSM_BAR_collegium_names:0 "Give the Missing Their Names"
 HSM_BAR_collegium_names_desc:0 "The first list arrives on the back of a kitchen inventory. Beside some names is a workplace; beside others, only the last day someone was seen. The former servants recognise omissions that no laboratory ledger records. Before the Collegium can publish its discoveries, the republic must preserve this other account of the Pentarchy, beyond the four founders' reach."
 HSM_BAR_collegium_silver:0 "Silver's Mortal Question"
 HSM_BAR_collegium_silver_desc:0 "Silver's calculations are exact until they reach the moment when a living body ceases to answer. There he has left a question mark, pressed so hard into the paper that the next sheet bears it too. White Star's shadow still follows him, but the clinic offers a question neither reputation nor rivalry can settle: which failing processes can be held long enough for a physician to intervene?"
 HSM_BAR_collegium_leopold:0 "A Patient Before an Inventor"
 HSM_BAR_collegium_leopold_desc:0 "Leopold can explain every joint in his replacement mechanism. The millworker wants to know whether it will seize in flour dust, who will repair it in winter, and what the ordinary brace costs. These questions do not appear on the drawing. The inventor who rebuilt his own sickly body must learn to design for lives unlike his own, beginning with someone free to refuse him."
 HSM_BAR_collegium_asinti:0 "The Former Slave Must Listen"
 HSM_BAR_collegium_asinti_desc:0 "Among Asinti's preparations is an instruction to keep the circle intact until the response ends. Nobody has written what to do if it does not end. He remembers captivity, and there are survivors who remember being his captives. A witness chosen by the participants will join the next discussion. This time the first problem to solve is the means of stopping."
 HSM_BAR_collegium_viira:0 "Explain the First Step"
 HSM_BAR_collegium_viira_desc:0 "Viira has drawn the same diagram three times. The students can reproduce every line, yet their crystals remain dark. Her explanation grows shorter with each attempt, as though the missing step should become more obvious in silence. Building a school will require her to find that step: something she does without thinking, which another mind might learn to do deliberately."
 HSM_BAR_collegium_records:0 "An Archive Beyond Our Reach"
 HSM_BAR_collegium_records_desc:0 "Place duplicate testimony with elected custodians. Families control publication of names; the accused cannot control the evidence."
 HSM_BAR_collegium_life:0 "Study the Living"
 HSM_BAR_collegium_life_desc:0 "Fund ageing records, sleep wards and recovery studies. Silver's fear will not vanish, but it can pay for work that benefits strangers."
 HSM_BAR_collegium_clinic:0 "The Common Clinic"
 HSM_BAR_collegium_clinic_desc:0 "Open a clinic with ordinary beds as well as crystal instruments. Food, pain relief and the right to leave come before experimental treatment."
 HSM_BAR_collegium_wards:0 "Wards with an Exit"
 HSM_BAR_collegium_wards_desc:0 "Asinti and Viira can describe a circle that keeps danger outside. The householders ask a different question: who opens it when the researcher has gone home? We need reproducible wards, an ordinary means of leaving and an inspection that belongs to the residents. Recording those conditions will make protective magic something that can be taught and checked, rather than another favour from a pentarch."
 HSM_BAR_collegium_school:0 "A School for the Unexceptional"
 HSM_BAR_collegium_school_desc:0 "A brilliant demonstration cannot replace a trained shift. Viira will help establish classes in measurement, instrument reading and the maintenance of enchanted equipment, with examinations she does not conduct herself. These technicians will work for the Collegium, hospitals and municipal services alike. The school succeeds when an unfamiliar instructor can repeat its lesson."
 HSM_BAR_collegium_grid:0 "Light beyond the Laboratory"
 HSM_BAR_collegium_grid_desc:0 "A laboratory supply can stop when its inventor loses interest. A street cannot. Leopold will publish operating tolerances and maintenance instructions for the municipal engineers, while the cabinet's clerks arrange responsibility for repairs. The power programme will support work on industrial equipment; it will not turn an untested crystal into a completed invention."
 HSM_BAR_collegium_land:0 "Return a Field to Its Farmers"
 HSM_BAR_collegium_land_desc:0 "Research has left ditches, abandoned tracks and land whose safety nobody will guarantee. The government can pay drainage crews and restore access roads while the Collegium maps the contamination. The first works will improve the homeland's infrastructure, not pronounce the whole country healed. A farmer should receive both a usable road and an honest account of what remains unsafe."
 HSM_BAR_collegium_refugees:0 "Guests Who May Leave"
 HSM_BAR_collegium_refugees_desc:0 "Offer displaced families housing and a route onward. Residence, employment and participation in research require three separate agreements."
 HSM_BAR_collegium_oversight:0 "Keys for the Inspectors"
 HSM_BAR_collegium_oversight_desc:0 "An inspector who must ask the four for permission has no authority. Give the elected visitors keys and protected access to complainants."
 HSM_BAR_collegium_budget:0 "The Collegium's Public Budget"
 HSM_BAR_collegium_budget_desc:0 "The republic's treasury and the Collegium's accounts are not the same purse. Clinics, laboratories and teaching rooms will submit a common request to the civilian authorities, with maintenance included instead of concealed beneath promises of future discoveries. Their users may challenge the priorities. The four must learn to explain why a proposed experiment deserves equipment another department also needs."
 HSM_BAR_collegium_report:0 "The First Unsparing Report"
 HSM_BAR_collegium_report_desc:0 "The clinic's shelves now hold letters from patients who have returned to work. The inspectors bring a thinner folder: unfinished follow-ups, disputed measurements and a complaint the department tried to settle privately. Both belong in the same hearing. The four have learned to defend one another; the first public report will ask whether they can also bear to hear one another questioned."
 HSM_BAR_collegium_future:0 "A Collegium Worth Continuing"
 HSM_BAR_collegium_future_desc:0 "Reconstruction has made a future possible. Its constitutional questions will remain alongside the record of how we reached this point."
 HSM_BAR_collegium_future_root:0 "The Work Outlives Its Founders"
 HSM_BAR_collegium_future_root_desc:0 "An institution cannot rest on four sleepless friends. Train replacements and distribute authority before necessity makes the choice for us."
 HSM_BAR_collegium_longevity:0 "Years That Belong to Everyone"
 HSM_BAR_collegium_longevity_desc:0 "Silver's tables mean little if the patient disappears from view after discharge. A network of follow-up clinics will compare recoveries, failures and the ordinary care surrounding them. The research programme can improve hospital practice without claiming that death has been defeated. Experimental projects retain their own trials, and their conclusions cannot be supplied by an administrative order."
 HSM_BAR_collegium_bodycraft:0 "A Body of One's Own"
 HSM_BAR_collegium_bodycraft_desc:0 "A replacement that only Leopold can repair remains tied to its inventor. Publish the approved fittings, train district workshops and establish deliveries of replacement parts. Clinical judgment stays with the physician and consent with the patient. The same repair discipline can improve our supply services without pretending that every new prosthesis has already passed its trials."
 HSM_BAR_collegium_ethics:0 "The Right to End a Ritual"
 HSM_BAR_collegium_ethics_desc:0 "Protect both participants and residents from experiments they cannot interrupt. Asinti's expertise must include accepting an unanswered question."
 HSM_BAR_collegium_teachers:0 "Teachers without Miracles"
 HSM_BAR_collegium_teachers_desc:0 "Viira will attend a class led by someone she taught and keep silent until it ends. Manuals, calibrated instruments and instructors able to answer unfamiliar questions matter more than another display of exceptional talent. The Collegium will support practical instrument research and train teachers whom municipal schools can employ without borrowing a founder every morning."
 HSM_BAR_collegium_civil_reserve:0 "A Civilian Reserve"
 HSM_BAR_collegium_civil_reserve_desc:0 "Store spare crystals and publish priority lists for homes and hospitals. A completed grid project or mature local services can support this reserve."
 HSM_BAR_collegium_war_reserve:0 "Service under Fire"
 HSM_BAR_collegium_war_reserve_desc:0 "The cabinet may call upon field medicine, repair teams and protective wards. It cannot obtain them by declaring every patient and laboratory assistant military property. Establish an evacuation and supply programme with named civilian obligations and a timetable for returning equipment. Improving its methods is part of the Collegium's work; deciding to wage a war belongs to the government."
 HSM_BAR_collegium_peer_review:0 "Let a Student Refute Us"
 HSM_BAR_collegium_peer_review_desc:0 "Two laboratories have returned incompatible results from the same instructions. Viira suspects the crystal; Leopold suspects the mount. The youngest assistant has underlined a sentence both founders skipped. Independent repetitions will receive instruments and time of their own. Whether the fault lies in the apparatus, the instructions or the theory, the disagreement has already given our magical research a useful direction."
 HSM_BAR_collegium_memorial:0 "An Empty Chair at the Table"
 HSM_BAR_collegium_memorial_desc:0 "The founders' friendship does not fill the places they emptied. Families may commemorate their dead without celebrating our redemption."
 HSM_BAR_collegium_assembly:0 "Who May Say No?"
 HSM_BAR_collegium_assembly_desc:0 "The republic now has a civilian cabinet to negotiate with, not merely a delegation outside the laboratory door. Its representatives and the Collegium will decide who appoints the research board, who audits its funding and who may stop a programme. None of the proposed charters transfers the government's courts or foreign policy to the four founders."
 HSM_BAR_collegium_open:0 "The Open Collegium"
 HSM_BAR_collegium_open_desc:0 "An autonomous research college answers to resident and patient councils. The four keep laboratories, never an exemption from public law."
 HSM_BAR_collegium_republic:0 "The Republic's Collegium"
 HSM_BAR_collegium_republic_desc:0 "Elected civic government controls the budget and appoints the college board. Scientific achievement grants a hearing, never an extra vote."
 HSM_BAR_collegium_tutelage:0 "The Tutors' Burden"
 HSM_BAR_collegium_tutelage_desc:0 "The four will retain executive direction of the Collegium while training their successors. That authority ends at the institution's remit: the cabinet governs the republic, and the courts hear complaints against its researchers. The price is less public influence over scientific priorities, not the restoration of four personal thrones."
 HSM_BAR_collegium_lasting:0 "Friends under the Same Law"
 HSM_BAR_collegium_lasting_desc:0 "Publish the charter with every promised limit intact. None of the four needs to become a god to help build something that endures."
 HSM_BAR_collegium_students:0 "The Next Class"
 HSM_BAR_collegium_students_desc:0 "The first graduates are leaving with instrument cases, unfinished arguments and addresses to which replacement parts must be sent. One village has asked for a teacher; another, for someone who can explain why its pump fails after frost. The four could solve these problems themselves. Their harder assignment is to let the students try, then read the reports without quietly rewriting every conclusion."
 HSM_BAR_collegium.1.t:0 "After the Pitchforks"
 HSM_BAR_collegium.1.d:0 "The square has emptied, but someone has left a bent pitchfork against the steps. Silver keeps looking at it. Leopold starts to say that the crowd misunderstood their intentions; Asinti stops him. They understood enough.\n\nA washerwoman returns with three neighbours and a list of missing names. She does not ask whether the four are friends now. She asks who will hear a complaint against them. Viira draws a chair out for her. Forgiveness has bought a hearing, not obedience."
 HSM_BAR_collegium.1.a:0 "Give the petitioners independent representation."
 HSM_BAR_collegium.1.b:0 "The four will hear every household in person."
 HSM_BAR_collegium.2.t:0 "The Name Left Blank"
 HSM_BAR_collegium.2.d:0 "A clerk reaches a line where Asinti recorded only a subject number. A woman recognises the date and asks that it remain blank until her brother's fate is known. Asinti has no answer that would make the waiting kinder.\n\nSilver suggests publishing everything, as proof that nothing is hidden. Leopold points to the woman's face. The archive needs evidence available to investigators, but the public does not own a family's grief."
 HSM_BAR_collegium.2.a:0 "Families choose publication; investigators receive sealed copies."
 HSM_BAR_collegium.2.b:0 "Hold public hearings with protected testimony available."
 HSM_BAR_collegium.3.t:0 "His Sister's Years"
 HSM_BAR_collegium.3.d:0 "Silver has written White Star's name in the margin of a table of lifespans. He scratches it out when Viira arrives. She does not pretend not to have seen. He admits that part of him still wants a discovery that will make Wittenland speak of him first.\n\nThen he admits something smaller: he is frightened of dying before he discovers anything useful. Viira sits beside him until he can talk about the patients whose follow-up records lie unopened between them."
 HSM_BAR_collegium.3.a:0 "Fund the public study of ageing."
 HSM_BAR_collegium.3.b:0 "Start a small, independently supervised laboratory."
 HSM_BAR_collegium.4.t:0 "No, Doctor"
 HSM_BAR_collegium.4.d:0 "Leopold demonstrates a crystal-assisted replacement that could steady a millworker's damaged foreleg. He knows the pain of a body that will not do what one asks of it. He explains the mechanism brilliantly and the maintenance cost badly.\n\nThe worker declines. For an instant Leopold looks wounded, as though his own survival has been rejected. Silver asks him to explain the ordinary brace as carefully. This time, the patient asks a question."
 HSM_BAR_collegium.4.a:0 "Guarantee ordinary care alongside every trial."
 HSM_BAR_collegium.4.b:0 "Pay independent advocates to explain both options."
 HSM_BAR_collegium.5.t:0 "The Other Side of the Door"
 HSM_BAR_collegium.5.d:0 "Asinti remembers being unable to leave. A former subject remembers him standing in the doorway. He starts to explain the purpose of the ritual, then hears himself using the same tone as someone he once hated.\n\nShe asks for no reconciliation. She wants the door unlocked, a witness of her choosing, and the right to stop a procedure after agreeing to begin. Asinti sets down the key. His own suffering has explained something about him; it has excused nothing."
 HSM_BAR_collegium.5.a:0 "Witnesses may halt any experiment."
 HSM_BAR_collegium.5.b:0 "Create an independent review panel with the same veto."
 HSM_BAR_collegium.6.t:0 "The Obvious Step"
 HSM_BAR_collegium.6.d:0 "Viira makes the crystal glow. Her students copy the diagram; nothing happens. She repeats the demonstration more brightly, and one student shields his eyes. Leopold asks what she did between the third and fourth marks.\n\nNothing, she says. Then she tries it without the movement of her antlers that she had never noticed. The crystal stays dark. For the first time today, everyone in the room has encountered the same problem."
 HSM_BAR_collegium.6.a:0 "Rewrite the lessons for ordinary students."
 HSM_BAR_collegium.6.b:0 "Train assistants to teach the missing steps."
 HSM_BAR_collegium.7.t:0 "The First Waiting Room"
 HSM_BAR_collegium.7.d:0 "Silver checks the pulse of an elderly mare twice. Leopold checks the steriliser three times. Asinti puts away the ceremonial instruments when a nurse says they frighten the children. Viira spends the morning labelling drawers.\n\nBy noon the clinic is full of people whose troubles will not make a famous paper. The budget will cover either more ordinary appointments or the equipment needed to follow a small group of volunteers for years."
 HSM_BAR_collegium.7.a:0 "More appointments first."
 HSM_BAR_collegium.7.b:0 "A smaller service with long-term follow-up."
 HSM_BAR_collegium.8.t:0 "Who Loses the Light?"
 HSM_BAR_collegium.8.d:0 "The new grid works until a workshop and the clinic draw power together. Leopold proposes a priority switch. Silver reaches for the laboratory's name at the top of the list, then stops.\n\nA residents' delegate points out that a dark kitchen is not merely an inconvenience when the family cooks after a late shift. There will be priorities, but the power schedule must say who bears their cost."
 HSM_BAR_collegium.8.a:0 "Homes and the clinic take priority."
 HSM_BAR_collegium.8.b:0 "Reserve published hours for workshops."
 HSM_BAR_collegium.9.t:0 "A Road Out of Barrad"
 HSM_BAR_collegium.9.d:0 "A refugee carpenter asks whether accepting a bed will bind her family to the college. The clerk says no. She asks again when Asinti enters. He sits where he cannot block the door and asks the clerk to finish.\n\nThe family may stay, work for a wage, refuse research, or travel onward. Housing will cost something either way. Their gratitude is not a signature on a contract."
 HSM_BAR_collegium.9.a:0 "Fund settlement and independent advice."
 HSM_BAR_collegium.9.b:0 "Fund a smaller hostel and onward travel."
 HSM_BAR_collegium.10.t:0 "A Good Result, a Bad Procedure"
 HSM_BAR_collegium.10.d:0 "The first report credits the clinic with real recoveries. It also records an assistant continuing a measurement after a patient withdrew consent. Leopold says the reading was harmless. The inspector says that is not the disputed fact.\n\nSilver closes the success ledger. Asinti asks the patient's representative what remedy was requested. Viira waits through the silence. Their friendship makes the room bearable; it does not make the finding disappear."
 HSM_BAR_collegium.10.a:0 "Suspend the unit and compensate the patient."
 HSM_BAR_collegium.10.b:0 "Independent supervision, paid from the founders' budget."
 HSM_BAR_collegium.11.t:0 "Four Cups, Five Chairs"
 HSM_BAR_collegium.11.d:0 "They have fallen into the habit of tea after the evening reports. Tonight Viira brings a fifth chair for the clerk who keeps correcting their accounts. Silver has prepared an argument for why the college should remain independent. Asinti has prepared a list of those who might reasonably disagree.\n\nThe clerk asks whether independence means independence from the Count, from one another, or from the people paying for the tea. Nobody has a quick answer."
 HSM_BAR_collegium.11.a:0 "Invite the clerks and residents to draft the charter."
 HSM_BAR_collegium.11.b:0 "Prepare a technical draft for public amendment."
 HSM_BAR_collegium.12.t:0 "An Ordinary Birthday"
 HSM_BAR_collegium.12.d:0 "Silver visits a volunteer who has survived another winter. He has brought a chart; she has baked something uneven and sweet. She wants to know whether the treatment will let her see her grandson finish school.\n\nHe cannot promise it. Saying so costs him more effort than the calculations. She thanks him for the answer and asks him to sit. Later he writes to his sister about a birthday, without mentioning a breakthrough."
 HSM_BAR_collegium.12.a:0 "Make follow-up care a public obligation."
 HSM_BAR_collegium.12.b:0 "Publish the limitations and train regional practitioners."
 HSM_BAR_collegium.13.t:0 "A Repair Anyone Can Make"
 HSM_BAR_collegium.13.d:0 "A patient returns with a broken fitting and an apology. Leopold is already designing an improved replacement when she asks for the old design's drawing. Her village smith can repair it if he knows how.\n\nLeopold's first answer is that the smith will not understand. Viira quietly places one of her rewritten lesson books on his desk. By evening there is a diagram beside it, with a maintenance schedule and no proprietary seal."
 HSM_BAR_collegium.13.a:0 "Release the drawings and subsidise spare parts."
 HSM_BAR_collegium.13.b:0 "Train licensed repairers accountable to patients."
 HSM_BAR_collegium.14.t:0 "Stopping before the Answer"
 HSM_BAR_collegium.14.d:0 "The instruments suggest that Asinti's ritual is finally approaching a useful result. A volunteer raises the agreed signal. Asinti hears the familiar inner argument: a moment longer would make all this worthwhile.\n\nHe stops. Viira takes down the outer wards while Leopold checks the volunteer. Silver records an incomplete result. Afterwards Asinti asks that the record include how long he hesitated."
 HSM_BAR_collegium.14.a:0 "Publish the interruption and improve the stop mechanism."
 HSM_BAR_collegium.14.b:0 "Let independent witnesses run the next review."
 HSM_BAR_collegium.15.t:0 "The Teacher at the Back"
 HSM_BAR_collegium.15.d:0 "Viira sits at the back while a former apprentice teaches an evening class. The demonstration is slow. Two students ask the same question. The teacher answers it twice, differently.\n\nViira nearly interrupts to show the elegant solution. Then a student with scarcely any magic completes the circuit using a hand-cranked regulator. It is not elegant. It works after Viira leaves the room."
 HSM_BAR_collegium.15.a:0 "Open evening classes in every available hall."
 HSM_BAR_collegium.15.b:0 "Give graduates independent teaching posts."
 HSM_BAR_collegium.16.t:0 "The Founders' Seats"
 HSM_BAR_collegium.16.d:0 "The assembly has placed four chairs on the same floor as the others. An older delegate thanks Leopold for the use of her leg, then votes against his proposed powers over the Collegium. He looks towards his friends. Asinti nods to the delegate. Silver writes down her objection.\n\nThe cabinet will remain responsible for the republic under every settlement. What remains to decide is how it shares authority over science: an autonomous college with its users, a board appointed by elected government, or the founders' continued direction under binding courts and accounts. None promises that friendship makes authority harmless."
 HSM_BAR_collegium.16.a:0 "Hold independent charter hearings."
 HSM_BAR_collegium.16.b:0 "Accept the assembly's published amendments now."
 HSM_BAR_collegium.17.t:0 "A Signature That Binds"
 HSM_BAR_collegium.17.a:0 "The open charter belongs to its members."
 HSM_BAR_collegium.17.b:0 "The republic's elected board takes office."
 HSM_BAR_collegium.17.c:0 "The tutors accept the court's right to intervene."
 HSM_BAR_collegium.18.t:0 "The Civilian Switch"
 HSM_BAR_collegium.18.d:0 "The emergency allocation has ended with the war. A porter carries the field-clinic inventory back through the courtyard. Some instruments need repair; some have become so familiar to their users that nobody wants to sign them back in.\n\nThe schedule was a promise. Power returns to homes and workshops, and the college begins accounting for what the emergency consumed."
 HSM_BAR_collegium.18.a:0 "Publish the return inventory."
 HSM_BAR_collegium.19.t:0 "Without Asking Permission"
 HSM_BAR_collegium.19.d:0 "The graduates bring a revised pump regulator, a clinic's error register, and a letter from a village asking for a second teacher. Their supervisor explains that the first design was wrong. It was Viira's design. She asks to see the measurements.\n\nSilver laughs before remembering that he once would have heard an insult. Leopold examines the repair notes. Asinti checks that the clinic's witnesses signed for themselves. None of the four has become immortal. For an afternoon, that seems less urgent than the work on the table."
 HSM_BAR_collegium.19.a:0 "Give the graduates their own budget."
 HSM_BAR_collegium.19.b:0 "Let the first class appoint the next teachers."
 HSM_BAR_collegium.20.t:0 "An Emergency Is a Loan"
 HSM_BAR_collegium.20.d:0 "The defence plan lists field dressings, evacuation wards and repair teams. It also lists the civilian appointments that would be postponed. Leopold will not pretend that the same equipment can serve two places at once.\n\nThe inspectors ask who may activate the plan. A public mandate takes time; a standing authorisation trusts the founders to act first and explain afterwards. After the war the teams return to civilian service. If activation precedes a mandate, opposition to postponed appointments remains until residents approve the transfer."
 HSM_BAR_collegium.20.a:0 "Secure the residents' emergency mandate."
 HSM_BAR_collegium.20.b:0 "Authorise activation, subject to later hearings."
 HSM_BAR_collegium.21.t:0 "The Cost of a Complaint"
 HSM_BAR_collegium.21.d:0 "A patient advocate has stopped a promising trial. The complaint is about the consent interview, not the instrument. Silver worries that a pause will destroy months of useful work. Asinti reminds him that a right that can be exercised only when convenient is no right at all.\n\nThe inspectors offer two remedies: stop new trials while staff retrain, or fund independent supervision of every remaining appointment. Existing patients will receive ordinary care in either case."
 HSM_BAR_collegium.21.a:0 "Pause trial recruitment for sixty days."
 HSM_BAR_collegium.21.b:0 "Pay for independent supervision of every appointment."
 HSM_BAR_collegium.22.t:0 "The First Harvest Is Theirs"
 HSM_BAR_collegium.22.d:0 "The soil tests are encouraging, but the farmer asks Viira to wait until she has dug the drainage ditch herself. Viira nearly offers to move the whole field with a gesture. Instead she takes a smaller shovel.\n\nAt dusk the team hands over the survey, including the patch they still cannot certify. The farmer thanks them for marking it. This land is no longer a laboratory merely because the four know how to study it."
 HSM_BAR_collegium.22.a:0 "Let the farmers control the next survey."
 HSM_BAR_collegium.22.b:0 "Keep a paid inspection team available."
 HSM_BAR_collegium.23.t:0 "A Door in the Circle"
 HSM_BAR_collegium.23.d:0 "The ward holds against the test discharge. A resident then tries to leave and discovers that the latch responds only to Viira. She calls this easily corrected. Asinti asks her to correct it before anyone sleeps here.\n\nThey spend another night rebuilding the mechanism. In the morning a child opens the gate without magic. The protection is slightly weaker. The house is finally fit to inhabit."
 HSM_BAR_collegium.23.a:0 "Every resident gets a mechanical release."
 HSM_BAR_collegium.23.b:0 "Train resident stewards and fit emergency releases."
 HSM_BAR_collegium.24.t:0 "No Speech from the Four"
 HSM_BAR_collegium.24.d:0 "The memorial committee has asked the founders to attend without speaking. Silver spends the walk rehearsing an apology anyway. At the gate, Leopold touches his shoulder and he folds the paper away.\n\nThe names are read by those who knew them. Some people leave when Asinti arrives. Viira does not summon them back. Afterwards the four carry chairs to the storehouse with everyone else."
 HSM_BAR_collegium.24.a:0 "Endow the families' independent memorial fund."
 HSM_BAR_collegium.24.b:0 "Give the archive staff time to trace the remaining names."
 HSM_BAR_collegium_train_cohort:0 "Train a Civilian Cohort"
 HSM_BAR_collegium_train_cohort_desc:0 "Train the first civilian cohort over thirty-five days. The 200 assigned personnel return when the course ends or is cancelled. A completed course establishes a permanent teaching team; it cannot be repeated for more rewards."
 HSM_BAR_collegium_equip_workshops:0 "Equip the Shared Workshops"
 HSM_BAR_collegium_equip_workshops_desc:0 "Equip the shared workshops with calibrated tools: one civilian factory for thirty-five days and 25 support equipment. The completed equipment programme improves civilian construction support once."
 HSM_BAR_collegium_clinic_rounds:0 "Establish the District Clinic Rounds"
 HSM_BAR_collegium_clinic_rounds_desc:0 "Supply the first district medical teams with 25 support equipment for thirty-five days of visits and follow-up. Their report supports medical research; their completed training later improves the wartime medical service."
 HSM_BAR_collegium_repair_fields:0 "Repair the First Experimental Fields"
 HSM_BAR_collegium_repair_fields_desc:0 "Assign one civilian factory and 100 personnel to drainage and soil inspection for forty-two days. The personnel return after completion; local farmers receive the survey."
 HSM_BAR_collegium_settlement_houses:0 "Prepare Voluntary Settlement Houses"
 HSM_BAR_collegium_settlement_houses_desc:0 "One civilian factory spends thirty-five days making homes habitable. Residents who freely choose to settle join ordinary civic life; 500 adult volunteers become available for service. Research participation remains a separate choice."
 HSM_BAR_collegium_onward_travel:0 "Honour the Onward Tickets"
 HSM_BAR_collegium_onward_travel_desc:0 "Spend 20 support equipment on safe onward travel, portable shelter and provisions. No one owes Barrad labour for accepting a bed."
 HSM_BAR_collegium_review_complaint:0 "Hear the Clinic Advocate's Complaint"
 HSM_BAR_collegium_review_complaint_desc:0 "The next patient advocate has challenged a trial procedure. Hold a public hearing and choose a remedy; the promising result cannot dismiss the complaint."
 HSM_BAR_collegium_war_allocation:0 "Activate the Wartime Allocation"
 HSM_BAR_collegium_war_allocation_desc:0 "Suspend this spirit's civilian-factory construction support and assign the same teams to field medicine and supply. No monthly payment is required. Without the residents' mandate, the transfer imposes a fixed 2% stability penalty while active. Peace restores civilian service."
 HSM_BAR_collegium_civil_allocation:0 "Restore Civilian Allocation"
 HSM_BAR_collegium_civil_allocation_desc:0 "Return the instruments and power reserve to ordinary services, even while the war continues. Civilian construction benefits replace the field-service benefits."
 HSM_BAR_collegium_seek_mandate:0 "Seek a Public Emergency Mandate"
 HSM_BAR_collegium_seek_mandate_desc:0 "Hold twenty-one days of public hearings before replacing standing emergency authority with a binding residents' mandate. It removes the wartime stability penalty; it does not replenish any resource."
 HSM_BAR_collegium_maintain_reserve:0 "Equip the Service Reserve"
 HSM_BAR_collegium_maintain_reserve_desc:0 "Set aside 50 support equipment and thirty-five days to equip a permanent evacuation and repair reserve. The completed reserve reduces supply use under wartime allocation once."
 HSM_BAR_collegium.17.open:0 "The open charter gives residents, patients and staff seats on the college board. The founders retain their laboratories under public law. An independent petitions court can suspend an unsafe programme even when all four object.\n\nSilver reads the limits twice. Leopold asks about maintenance funding. Asinti checks the right of withdrawal. Viira corrects a sentence an ordinary reader would misunderstand. They sign beside the public witnesses. Outside, someone is already filing the first complaint. That, the clerk tells them, means the charter has begun to work."
 HSM_BAR_collegium.17.republic:0 "The republic's elected assembly now controls the budget and appoints the research board. The four remain friends and researchers; their offices can pass to someone else. Gasienica's chair is an office of public government, not a fifth throne.\n\nLeopold has lost a vote on laboratory spending. Silver helps him rewrite the application while Asinti brings tea. Viira sits on the other side of the table, marking the explanation that voters found obscure. The clerk files their revised request under the same rules as everyone else's."
 HSM_BAR_collegium.17.tutelage:0 "The tutors retain executive direction of the college and its public programmes. Gasienica still chairs the civic government. The charter gives ordinary citizens less control over research policy than some delegates demanded; several leave without applauding. But the court, independent accounts and the right to refuse treatment remain binding.\n\nViira begins explaining why they need more time. Asinti asks her to let the dissent stand in the record. Silver writes it down. Leopold adds a date for the next public review. They have chosen authority, with an obligation they must keep meeting."
 HSM_BAR_collegium_programs:0 "The Magotechnical Collegium"
 HSM_BAR_collegium_programs_desc:0 "The clinic, school, crystal grid and independent inspectors share the Collegium's public programmes. Their reports record patients treated, classrooms opened and equipment delivered. Civilian and wartime allocations compete for the same staff and instruments."
 HSM_BAR_collegium_services:0 "Public Services of the Collegium"
 HSM_BAR_collegium_services_desc:0 "The independent archive and inspectors, opened school, research board and peer review each contribute their stated benefits. Clinic and grid priorities remain binding. During wartime allocation, civilian construction support is replaced by field medicine and supply support; acting without a public mandate carries a fixed stability penalty."
 HSM_BAR_collegium_provisional:0 "The Four under Public Scrutiny"
 HSM_BAR_collegium_provisional_desc:0 "The crowd's forgiveness spared the four. Their provisional college must now pay for hearings, consent, oversight and the slow work of earning authority."
 HSM_BAR_collegium_open_spirit:0 "The Open Collegium Charter"
 HSM_BAR_collegium_open_spirit_desc:0 "Residents, patients and staff govern the college alongside its researchers. Independent courts protect refusal and review its public spending."
 HSM_BAR_collegium_republic_spirit:0 "Research under Elected Government"
 HSM_BAR_collegium_republic_spirit_desc:0 "The elected assembly controls research funding and appointments. The four remain colleagues, subject to the same public law as their students."
 HSM_BAR_collegium_tutelage_spirit:0 "The Accountable Tutors"
 HSM_BAR_collegium_tutelage_spirit_desc:0 "The four retain executive authority over the college's programmes. Independent courts and protected refusal constrain their power, while the limited public voice remains a source of friction."
 HSM_BAR_collegium_next_tree_tt:0 "Opens the second stage of the Collegium. All earlier Collegium and common focuses remain, with completed progress preserved."
