l_english:
 HSM_BAR_research_clinic_eligible_tt:0 "Requires active Barrad, the open institute, the Collegium route and no capitulation. This programme must not already be completed."
 HSM_BAR_research_clinic_trials_open_tt:0 "Clinical trials are not suspended. Completed research may still be ratified during a suspension."
 HSM_BAR_research_grid_eligible_tt:0 "Requires active Barrad, the open institute, the Collegium route and no capitulation; completed Clinical Thaumaturgy. This programme must not already be completed."
 HSM_BAR_research_wards_eligible_tt:0 "Requires active Barrad, the open institute and no capitulation. The Service must first complete the Living Stone, underground-response and shaft-echo studies; the Collegium retains its own programme. This programme must not already be completed."
 HSM_BAR_research_containment_eligible_tt:0 "Requires the active Service, open institute, no capitulation and completed Anti-Domination Wards; completed Living Stone, underground-response and shaft-echo studies. This programme must not already be completed."
 HSM_BAR_research_forensics_eligible_tt:0 "Requires the active Service, open institute, fieldwork authorization, no capitulation and completed Layered Anomaly Containment. Required studies: Living Stone, underground response, shaft echo, Titan mechanisms and the misleading compass. This programme must not already be completed."
 HSM_BAR_research_suppression_eligible_tt:0 "Requires the active Service, open institute, fieldwork and suppression-laboratory authorization, no capitulation and completed Residual Magical Forensics; normalization without coexistence. Required studies: Living Stone, underground response, shaft echo, Titan mechanisms, the misleading compass and Janosik's amulet. This programme must not already be completed."
 HSM_BAR_research_category:0 "Barrad Magical Institute"
 HSM_BAR_research_category_desc:0 "The Collegium's public institute develops clinical care and civic infrastructure. On the Directorate route, concealed facilities serve a secret organization that controls Barrad through a civilian government unaware of its existence. With Gotterdammerung, research uses the existing Magical Facility. Without it, a funded laboratory term occupies one civilian factory and ends with the same design review. Completed results can be ratified after an interruption."
 HSM_BAR_research_scientist_tt:0 "Recruit a new scientist with magical specialization skill 2. The grant and the two magical breakthroughs are issued once."
 HSM_BAR_research_institute_tt:0 "Unlock EaW's Magical Facility technology. With Gotterdammerung, establish one facility in an eligible owned, fully controlled state, preferring the capital. Anti-Domination Wards require no breakthrough points and can start as soon as a scientist is assigned. If no suitable state is available, recover one and restore the institute through its decision."
 HSM_BAR_research_suspend:0 "File the results until authorization is restored."
 HSM_BAR_research_restore_facility:0 "Restore the Magical Facility"
 HSM_BAR_research_restore_facility_desc:0 "Re-establish a lost institute in an eligible state. The work costs 35 political power, occupies one civilian factory for 60 days and does not repeat the original scientist or breakthrough grant."
 HSM_BAR_research_clinic:0 "Clinical Thaumaturgy"
 HSM_BAR_research_clinic_desc:0 "Separate diagnosis from experimentation. Barrad's clinics will test a repeatable healing protocol and decide who controls the use of a patient's magic."
 HSM_BAR_research_clinic_choice:0 "Whose Consent?"
 HSM_BAR_research_clinic_choice_desc:0 "The first trials can close wounds without exhausting the patient. The physicians want independent witnesses and a right to withdraw; the emergency committee wants a faster intake of patients. Both protocols work in the laboratory. Only one will become the institute's standard."
 HSM_BAR_research_clinic_bonus:0 "Clinical Thaumaturgy: Applied Research"
 HSM_BAR_research_clinic_fallback:0 "Fund Clinical Thaumaturgy"
 HSM_BAR_research_clinic_fallback_desc:0 "Separate diagnosis from experimentation. Barrad's clinics will test a repeatable healing protocol and decide who controls the use of a patient's magic.\n\nA 120-day laboratory term costs 60 political power and occupies one civilian factory. Only one fallback programme can run at a time. Publication applies the chosen prototype's separate implementation cost. Loss of eligibility cancels the term without granting its results."
 HSM_BAR_research_clinic_resume:0 "Ratify: Clinical Thaumaturgy"
 HSM_BAR_research_clinic_resume_desc:0 "Review an already completed programme whose results await authorization or a design choice. This does not perform research or waive the selected design's implementation cost."
 HSM_BAR_research_clinic_consent_choice:0 "Require informed consent and independent review."
 HSM_BAR_research_clinic_consent_idea:0 "Clinics of Consent"
 HSM_BAR_research_clinic_consent_idea_desc:0 "Independent observers protect patients and help turn reliable case notes into medical knowledge."
 HSM_BAR_research_clinic_consent_tt:0 "On completion: spend 25 political power, gain 3% stability; receive Clinics of Consent for 540 days (+100 weekly manpower, +1% research speed). The programme also grants one 50% technology research bonus. The policy is recorded permanently; these national modifiers expire."
 HSM_BAR_research_clinic_expedience_choice:0 "Authorize emergency treatment without the review board."
 HSM_BAR_research_clinic_expedience_idea:0 "Emergency Thaumaturgical Wards"
 HSM_BAR_research_clinic_expedience_idea_desc:0 "Accelerated treatment reaches more wounded, but families distrust procedures performed without an independent advocate."
 HSM_BAR_research_clinic_expedience_tt:0 "On completion: spend 10 political power, lose 4% stability; receive Emergency Thaumaturgical Wards for 365 days (+200 weekly manpower, +6% division recovery rate). The programme also grants one 50% technology research bonus. The policy is recorded permanently; these national modifiers expire."
 HSM_BAR_research_grid:0 "Civic Thaumic Grid"
 HSM_BAR_research_grid_desc:0 "Connect calibrated crystal converters to workshops and public services. The prototype must resolve whether each district can isolate a fault or obey a single dispatch centre."
 HSM_BAR_research_grid_choice:0 "Who Holds the Switch?"
 HSM_BAR_research_grid_choice_desc:0 "A central converter gives the best output on the test bench. Smaller local stations waste some power but keep a single mistake from darkening every district. The engineers have brought two credible plans, and two very different relationships between the institute and the towns."
 HSM_BAR_research_grid_bonus:0 "Civic Thaumic Grid: Applied Research"
 HSM_BAR_research_grid_fallback:0 "Fund Civic Thaumic Grid"
 HSM_BAR_research_grid_fallback_desc:0 "Connect calibrated crystal converters to workshops and public services. The prototype must resolve whether each district can isolate a fault or obey a single dispatch centre.\n\nA 150-day laboratory term costs 75 political power and occupies one civilian factory. Only one fallback programme can run at a time. Publication applies the chosen prototype's separate implementation cost. Loss of eligibility cancels the term without granting its results."
 HSM_BAR_research_grid_resume:0 "Ratify: Civic Thaumic Grid"
 HSM_BAR_research_grid_resume_desc:0 "Review an already completed programme whose results await authorization or a design choice. This does not perform research or waive the selected design's implementation cost."
 HSM_BAR_research_grid_distributed_choice:0 "Let districts maintain independent local grids."
 HSM_BAR_research_grid_distributed_idea:0 "Distributed Civic Grid"
 HSM_BAR_research_grid_distributed_idea_desc:0 "Local maintenance crews keep workshops supplied and can disconnect unsafe equipment without waiting for the capital."
 HSM_BAR_research_grid_distributed_tt:0 "On completion: spend 35 political power, gain 2% stability; receive Distributed Civic Grid for 730 days (+6% construction speed, +2% factory output). The programme also grants one 50% technology research bonus. The policy is recorded permanently; these national modifiers expire."
 HSM_BAR_research_grid_central_choice:0 "Concentrate generation under the central dispatch office."
 HSM_BAR_research_grid_central_idea:0 "Central Thaumic Dispatch"
 HSM_BAR_research_grid_central_idea_desc:0 "Concentrated generation feeds priority factories. Civilian consumers pay for a larger dispatch and maintenance service."
 HSM_BAR_research_grid_central_tt:0 "On completion: spend 20 political power, lose 2% stability; receive Central Thaumic Dispatch for 730 days (+8% factory output, -3% supply consumption, +3% consumer goods factor). The programme also grants one 50% technology research bonus. The policy is recorded permanently; these national modifiers expire."
 HSM_BAR_research_wards:0 "Anti-Domination Wards"
 HSM_BAR_research_wards_desc:0 "Develop measurable alarms and interference patterns against coercive magic. The Collegium equips soldiers and civilians through its public institute; the secret service protects its personnel and concealed facilities without revealing itself to the civilian government."
 HSM_BAR_research_wards_choice:0 "Protection or Inspection?"
 HSM_BAR_research_wards_choice_desc:0 "The ward detects an imposed command only at close range. Personal wards keep warning signals local; central monitoring links them into a detailed record. For the public Collegium, this is a choice about civilian privacy and confidence. Within the secret service, a personal ward warns its wearer directly; a central bureau compares reports and prepares instructions for field teams. Neither design guarantees immunity from every form of magic."
 HSM_BAR_research_wards_bonus:0 "Anti-Domination Wards: Applied Research"
 HSM_BAR_research_wards_fallback:0 "Fund Anti-Domination Wards"
 HSM_BAR_research_wards_fallback_desc:0 "Develop measurable alarms and interference patterns against coercive magic. The Collegium equips soldiers and civilians through its public institute; the secret service protects its personnel and concealed facilities without revealing itself to the civilian government.\n\nA 120-day laboratory term costs 60 political power and occupies one civilian factory. Only one fallback programme can run at a time. Ratification applies the chosen prototype's separate implementation cost. Loss of eligibility cancels the term without granting its results."
 HSM_BAR_research_wards_resume:0 "Ratify: Anti-Domination Wards"
 HSM_BAR_research_wards_resume_desc:0 "Review an already completed programme whose results await authorization or a design choice. This does not perform research or waive the selected design's implementation cost."
 HSM_BAR_research_wards_personal_choice:0 "Issue personal wards with private warning signals."
 HSM_BAR_research_wards_personal_idea:0 "Wards of Personal Autonomy"
 HSM_BAR_research_wards_personal_idea_desc:0 "The Collegium's personal wards protect soldiers and civilians without constant monitoring. Within the secret service, local warning signals protect personnel without leaving records that could expose concealed facilities."
 HSM_BAR_research_wards_personal_tt:0 "On completion: spend 25 political power. Collegium: gain 3% stability; Directorate: no stability change; receive Wards of Personal Autonomy for 540 days (+4% division recovery rate, +15% ideology drift defence). The programme also grants one 50% technology research bonus. The policy is recorded permanently; these national modifiers expire."
 HSM_BAR_research_wards_monitoring_choice:0 "Link the wards to a central monitoring bureau."
 HSM_BAR_research_wards_monitoring_idea:0 "Central Ward Monitoring"
 HSM_BAR_research_wards_monitoring_idea_desc:0 "Central signal records help intelligence and planning. The Collegium's public programme loses confidence through intrusive monitoring; the secret service instead risks leaving a discoverable record of its hidden network."
 HSM_BAR_research_wards_monitoring_tt:0 "On completion: spend 15 political power. Collegium: lose 3% stability; Directorate: no stability change; receive Central Ward Monitoring for 540 days (+10% decryption power, +5% planning speed). The programme also grants one 50% technology research bonus. The policy is recorded permanently; these national modifiers expire."
 HSM_BAR_research_containment:0 "Layered Anomaly Containment"
 HSM_BAR_research_containment_desc:0 "Test nested barriers, remote instruments and evacuation drills for hazardous samples inside concealed service facilities. Compartmented records and encrypted instrument links protect the sites while specialists study the material."
 HSM_BAR_research_containment_choice:0 "Access to the Chamber"
 HSM_BAR_research_containment_choice_desc:0 "Remote instruments survived the first barrier failure in a concealed laboratory. The research cell requests supervised access to identify the fault; the storage cell proposes sealing the chamber and restricting its records. Both plans remain internal to the secret service. Access preserves research opportunities, while sealed storage reduces the chance of exposing a facility."
 HSM_BAR_research_containment_bonus:0 "Layered Anomaly Containment: Applied Research"
 HSM_BAR_research_containment_fallback:0 "Fund Layered Anomaly Containment"
 HSM_BAR_research_containment_fallback_desc:0 "Test nested barriers, remote instruments and evacuation drills for hazardous samples inside concealed service facilities. Compartmented records and encrypted instrument links protect the sites while specialists study the material.\n\nA 150-day laboratory term costs 80 political power and occupies one civilian factory. Only one fallback programme can run at a time. Ratification applies the chosen prototype's separate implementation cost. Loss of eligibility cancels the term without granting its results."
 HSM_BAR_research_containment_resume:0 "Ratify: Layered Anomaly Containment"
 HSM_BAR_research_containment_resume_desc:0 "Review an already completed programme whose results await authorization or a design choice. This does not perform research or waive the selected design's implementation cost."
 HSM_BAR_research_containment_layered_choice:0 "Keep layered barriers and supervised research access."
 HSM_BAR_research_containment_layered_idea:0 "Supervised Containment Laboratories"
 HSM_BAR_research_containment_layered_idea_desc:0 "Independent barriers, encrypted instrument links and compartmented sample records permit research inside concealed laboratories. Equipment and maintenance continue to consume civilian resources."
 HSM_BAR_research_containment_layered_tt:0 "On completion: spend 35 political power; receive Supervised Containment Laboratories for 540 days (+3% research speed, +1 encryption, +2% consumer goods factor). The programme also grants one 50% technology research bonus. The policy is recorded permanently; these national modifiers expire."
 HSM_BAR_research_containment_sealed_choice:0 "Seal the vaults and prioritize secure storage."
 HSM_BAR_research_containment_sealed_idea:0 "Sealed Directorate Vaults"
 HSM_BAR_research_containment_sealed_idea_desc:0 "Sealed chambers, encrypted records and discreet transport protect concealed facilities. Restricting physical access slows experimental work but reduces the risk of exposing a site."
 HSM_BAR_research_containment_sealed_tt:0 "On completion: spend 20 political power; receive Sealed Directorate Vaults for 730 days (+2 encryption, -2% research speed, +2% consumer goods factor). The programme also grants one 50% technology research bonus. The policy is recorded permanently; these national modifiers expire."
 HSM_BAR_research_forensics:0 "Residual Magical Forensics"
 HSM_BAR_research_forensics_desc:0 "Calibrate methods for comparing traces, archives and properly identified remains within the secret service. All cases stay classified. Defeat, disappearance or capitulation alone cannot establish a death or produce a recoverable body."
 HSM_BAR_research_forensics_choice:0 "A Finding That Can Be Challenged"
 HSM_BAR_research_forensics_choice_desc:0 "Residual signatures drift with heat, time and contamination. A separate internal cell can repeat control measurements without knowing the field team's conclusions, or the operational cell can retain sole access to the catalogue. Every case remains classified within the service. Independent internal checks reduce mistakes that could expose a facility; an unchecked catalogue makes field analysis faster but less reliable."
 HSM_BAR_research_forensics_bonus:0 "Residual Magical Forensics: Applied Research"
 HSM_BAR_research_forensics_fallback:0 "Fund Residual Magical Forensics"
 HSM_BAR_research_forensics_fallback_desc:0 "Calibrate methods for comparing traces, archives and properly identified remains within the secret service. All cases stay classified. Defeat, disappearance or capitulation alone cannot establish a death or produce a recoverable body.\n\nA 150-day laboratory term costs 75 political power and occupies one civilian factory. Only one fallback programme can run at a time. Ratification applies the chosen prototype's separate implementation cost. Loss of eligibility cancels the term without granting its results."
 HSM_BAR_research_forensics_resume:0 "Ratify: Residual Magical Forensics"
 HSM_BAR_research_forensics_resume_desc:0 "Review an already completed programme whose results await authorization or a design choice. This does not perform research or waive the selected design's implementation cost."
 HSM_BAR_research_forensics_reviewed_choice:0 "Require replication by a separate internal cell."
 HSM_BAR_research_forensics_reviewed_idea:0 "Audited Residual Forensics"
 HSM_BAR_research_forensics_reviewed_idea_desc:0 "A separate service cell repeats control measurements and checks interpretations of civilian records. Cases remain classified; correcting uncertain identifications reduces mistakes that could expose the network."
 HSM_BAR_research_forensics_reviewed_tt:0 "On completion: spend 35 political power; receive Audited Residual Forensics for 540 days (+4% research speed, +10% civilian intelligence). The programme also grants one 50% technology research bonus. The policy is recorded permanently; these national modifiers expire."
 HSM_BAR_research_forensics_classified_choice:0 "Keep a classified signature catalogue for field teams."
 HSM_BAR_research_forensics_classified_idea:0 "Classified Signature Catalogue"
 HSM_BAR_research_forensics_classified_idea_desc:0 "The operational cell alone maintains the classified catalogue for intercept analysis and military intelligence. Without separate internal replication, misidentified traces can lead teams into actions that expose their cover."
 HSM_BAR_research_forensics_classified_tt:0 "On completion: spend 20 political power; receive Classified Signature Catalogue for 540 days (+15% decryption power, +10% army intelligence). The programme also grants one 50% technology research bonus. The policy is recorded permanently; these national modifiers expire."
 HSM_BAR_research_suppression:0 "Thaumic Suppression Apparatus"
 HSM_BAR_research_suppression_desc:0 "Develop equipment that interrupts hazardous enchantments inside concealed facilities. The normalization programme must choose between reversible shutdown and permanent destruction of enchantments in contaminated machinery and material samples."
 HSM_BAR_research_suppression_choice:0 "The Return Circuit"
 HSM_BAR_research_suppression_choice_desc:0 "The dampener can stop a hazardous enchanted mechanism while preserving its core. Removing the return circuit permanently destroys the treated enchantment and simplifies later handling, but sacrifices samples and risks injuring specialist crews. Repeated equipment failures and emergency deliveries make concealment harder. This design review stays inside the service; civilian officials do not know the programme exists."
 HSM_BAR_research_suppression_bonus:0 "Thaumic Suppression Apparatus: Applied Research"
 HSM_BAR_research_suppression_fallback:0 "Fund Thaumic Suppression Apparatus"
 HSM_BAR_research_suppression_fallback_desc:0 "Develop equipment that interrupts hazardous enchantments inside concealed facilities. The normalization programme must choose between reversible shutdown and permanent destruction of enchantments in contaminated machinery and material samples.\n\nA 180-day laboratory term costs 100 political power and occupies one civilian factory. Only one fallback programme can run at a time. Ratification applies the chosen prototype's separate implementation cost. Loss of eligibility cancels the term without granting its results."
 HSM_BAR_research_suppression_resume:0 "Ratify: Thaumic Suppression Apparatus"
 HSM_BAR_research_suppression_resume_desc:0 "Review an already completed programme whose results await authorization or a design choice. This does not perform research or waive the selected design's implementation cost."
 HSM_BAR_research_suppression_reversible_choice:0 "Retain a reversible dampening circuit."
 HSM_BAR_research_suppression_reversible_idea:0 "Reversible Field Dampeners"
 HSM_BAR_research_suppression_reversible_idea_desc:0 "Controlled equipment shutdowns protect supply teams and shorten recovery. Trained crews and regular servicing consume resources. Maintenance records remain inside the service; civilian suppliers receive only ordinary replacement orders."
 HSM_BAR_research_suppression_reversible_tt:0 "On completion: spend 40 political power; receive Reversible Field Dampeners for 540 days (-5% supply consumption, +6% division recovery rate, +2% consumer goods factor). The programme also grants one 50% technology research bonus. The policy is recorded permanently; these national modifiers expire."
 HSM_BAR_research_suppression_permanent_choice:0 "Approve irreversible normalization of hazardous media."
 HSM_BAR_research_suppression_permanent_idea:0 "Irreversible Normalization Programme"
 HSM_BAR_research_suppression_permanent_idea_desc:0 "Permanent removal of hazardous enchantments simplifies equipment handling and standardized production. Destroyed samples slow research; equipment accidents injure specialists, and emergency supply trails threaten the facilities' cover."
 HSM_BAR_research_suppression_permanent_tt:0 "On completion: spend 50 political power; receive Irreversible Normalization Programme for 730 days (-5% supply consumption, +8% factory output, -4% research speed, -50 weekly manpower). The programme also grants one 50% technology research bonus. The policy is recorded permanently; these national modifiers expire."
