l_english:
 HSM_BAR_normalization_network:0 "The Last Circuit"
 HSM_BAR_normalization_network_desc:0 "The local trial is over. Five distant stations must now repeat its measurements before the field can be joined. Each station has a separate shut-off key. No one has yet agreed who should hold them."
 HSM_BAR_normalization_crisis:0 "Beyond the Last Light"
 HSM_BAR_normalization_crisis_desc:0 "The stations are still working. That is the worst part: every instrument reports that the operation succeeded. On the maps, places once marked as protected ground are being crossed out. Command's reports distinguish the first footfalls, a hollow line that holds ground, and the weight of fire behind it. These are field designations; the intruders have offered no names.\n\n§YThree waves can cross the original breach: 4 + 2 + 2 formations, or 6 + 3 + 3 if its original defender had at least 40 divisions. Reinforcements are due 28 and 56 days after the breach. The final wave brings siege formations if the invader controls at least two states; otherwise it brings holding formations. Breaking full enemy control of the breach permanently stops further arrivals when the daily situation report updates. Existing forces must still be defeated. Native recruitment is separate from these wave limits.§!"
 HSM_BAR_global_network_ready_tt:0 "Requires the continued authorization, completed suppression research and its case knowledge, all five regional offices and completed regional calibrations, and control of Barrad's central installation."
 HSM_BAR_normalization_grid_equus:0 "Equus: the silent line"
 HSM_BAR_normalization_grid_equus_desc:0 "Compare the field against the old ward stones. Record both the reading and the light in the stone; the earlier test recorded only the former."
 HSM_BAR_norm_grid_equus_done:0 "Equus: the silent line: calibrated"
 HSM_BAR_normalization_grid_griffonia:0 "Griffonia: beneath the foundations"
 HSM_BAR_normalization_grid_griffonia_desc:0 "Install the second station below an abandoned observatory. Its foundation contains an older ring of stone which does not appear on the architect's plans."
 HSM_BAR_norm_grid_griffonia_done:0 "Griffonia: beneath the foundations: calibrated"
 HSM_BAR_normalization_grid_north:0 "The North: a watch without a keeper"
 HSM_BAR_normalization_grid_north_desc:0 "The instruments must survive a full cold cycle. The station chief has asked whether the instruction to disregard voices also applies to familiar ones."
 HSM_BAR_norm_grid_north_done:0 "The North: a watch without a keeper: calibrated"
 HSM_BAR_normalization_grid_riverlands:0 "Riverlands: the fifth bank"
 HSM_BAR_normalization_grid_riverlands_desc:0 "Complete the field survey upstream of the inhabited valley. Local guides insist that one stretch of bank must never be measured from the water."
 HSM_BAR_norm_grid_riverlands_done:0 "Riverlands: the fifth bank: calibrated"
 HSM_BAR_normalization_grid_zebrica:0 "Zebrica: the unfinished circle"
 HSM_BAR_normalization_grid_zebrica_desc:0 "Synchronize the southern station without disturbing the markers around it. The regional director refuses to let the central office classify those markers as debris."
 HSM_BAR_norm_grid_zebrica_done:0 "Zebrica: the unfinished circle: calibrated"
 HSM_BAR_normalization_activate:0 "Join the five circuits"
 HSM_BAR_normalization_activate_desc:0 "The last authorization bears the same seal as the first reclamation order. The task was once to make a single field safe for planting. Now the switchboard carries the names of continents.\n\n§YAll countries, including Barrad, will receive the magical-equipment penalties shown in 'The Quiet Field'. These affect the dedicated magical rifle, artillery and tank equipment types, not ordinary designs containing a magical module.§!"
 HSM_BAR_normalization_restore:0 "Return the keys to the wardens"
 HSM_BAR_normalization_restore_desc:0 "Send the surviving measurements to those whose wards we silenced. We cannot repair the boundary alone, and the letters must explain what we did.\n\n§YRestores magical equipment worldwide and prevents further scripted waves. Existing enemy forces, occupied land and wars remain. This choice is exclusive with continued normalization.§!"
 HSM_BAR_normalization_press:0 "Hold the line without the light"
 HSM_BAR_normalization_press_desc:0 "There are still conventional guns, engineers and living defenders. Command proposes to keep the stations active and build a line that needs no ward. The proposal contains no estimate for the years after victory.\n\n§YKeeps the global magical penalties and grants 'Iron Watch' while the invasion lasts. Victory requires the invader's defeat; it is not awarded by completing this decision. This choice excludes restoration.§!"
 HSM_BAR_normalization_arm_without_magic:0 "Issue the mechanical firing tables"
 HSM_BAR_normalization_arm_without_magic_desc:0 "The emergency circular contains no charms and promises no immunity. Its pages describe range stakes, overlapping fields of fire and how to keep a crew from abandoning its position when the target casts no shadow.\n\n§YGrants 'Iron Watch' until the incursion is defeated: ordinary infantry equipment gains +10% soft attack and defence, ordinary artillery +10% soft attack; military factory output −8%, daily political power −0.15.§!"
 HSM_BAR_normalization_magic_failure:0 "The Quiet Field"
 HSM_BAR_normalization_magic_failure_desc:0 "Crystals retain their shape, inscriptions their meaning. Neither answers as it once did. The suppression field crosses every border, including the border of the country that made it.\n\n§YApplies only to dedicated magical equipment archetypes. Ordinary aircraft, ships and tank chassis are not penalized for containing a magical module.§!"
 HSM_BAR_normalization_steel_defence:0 "Iron Watch"
 HSM_BAR_normalization_steel_defence_desc:0 "Ordinary weapons can stop what has crossed. Maintaining their crews, replacement barrels and prepared positions consumes resources which reconstruction can no longer spare."
 HSM_BAR_normalization_beyond:0 "No Hearth Behind Them"
 HSM_BAR_normalization_beyond_desc:0 "The first patrol reported no campfires. The second found no discarded rations, bedding or wounded. There was no third report."
