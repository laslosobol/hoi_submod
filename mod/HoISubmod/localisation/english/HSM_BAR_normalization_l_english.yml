 HSM_BAR_world_barriers_restored:0 "The world's barriers have been restored"
 HSM_BAR_world_normalization_victory:0 "The incursion has been defeated without restoring magic"
 hsm_bar_normalization.1.t:0 "The field beyond the window"
 hsm_bar_normalization.1.d:0 "Marta asked to see the reclaimed plot before attending the demonstration. Nothing whispered beneath it. The workers had removed their ear coverings, and one was laughing at a joke she could not hear.\n\nAt the station, five lamps turned white. A technician put a sprig from the plot beside the switchboard. Severin watched the instruments settle and wrote a single word in the margin: 'Quiet.'\n\nFor the first time, the word sounded like a promise."
 hsm_bar_normalization.1.a:0 "Let them sow."
 hsm_bar_normalization.2.t:0 "The watch that went unanswered"
 hsm_bar_normalization.2.d:0 "The northern station sent an apology for including a folk custom in its report. Each winter, the keeper of a stone arch left a lamp beneath it. Each morning the wick had burned down, although no one ever saw a flame. Yesterday the wick remained untouched.\n\nThree other stations reported the same failure in different words. Their suppression readings were excellent.\n\nSeverin returned the report with the apology crossed out. Beneath it he wrote: 'Find every other place where we called a watch a superstition.'"
 hsm_bar_normalization.2.a:0 "Keep the original reports."
 hsm_bar_normalization.3.t:0 "Beyond the last light"
 hsm_bar_normalization.3.d:0 "The patrol saw lights moving beyond the ridge and assumed that the missing villagers were returning. The lights stopped when the patrol raised its lantern. Then the ground between them darkened, though dawn had already reached the hill.\n\nThe last readable line gives a direction, not a description. Whoever wrote it pressed hard enough to tear the paper.\n\nArmoured columns are now approaching the perimeter. No one at the command post has asked whether this is still an investigation."
 hsm_bar_normalization.3.a:0 "This boundary must hold."
 hsm_bar_normalization.4.t:0 "The names on the letters"
 hsm_bar_normalization.4.d:0 "The letters went out without the old restrictions. Their recipients had been called custodians of dangerous objects, accomplices, obstacles to recovery. Now the Service was asking them to repair what it had silenced.\n\nAt the northern arch, the lamp burned before anyone touched it. Irma's report recorded this without comment. The next page listed defenders still missing beyond the ridge.\n\nMarta signed with her own name. Restoring the boundary had not brought anyone back."
 hsm_bar_normalization.4.a:0 "The living still need us."
 hsm_bar_normalization.5.t:0 "No estimate for the following year"
 hsm_bar_normalization.5.d:0 "The proposal laid before the directors contained a firing plan, a list of factories and the names of units ready to hold the breach. Every column had a total. The page headed 'Following year' was blank.\n\nJadwiga put a cartridge on the table. 'This worked. I will not tell the crews it did not.'\n\nSeverin did not disagree. He asked who would stand watch when the crews grew old. The meeting ended before an answer was entered into the record."
 hsm_bar_normalization.5.a:0 "Keep the stations running."
 hsm_bar_normalization.11.t:0 "A line through the old stones"
 hsm_bar_normalization.11.d:0 "The Equus team has matched the local trial's readings. One ward stone stopped glowing during the final measurement; its inscription remained warm until morning. The station chief enclosed a rubbing rather than scrape a sample from it.\n\nSomeone in the central office has marked the warmth 'residual'. The word is in pencil."
 hsm_bar_normalization.11.a:0 "File the rubbing with the readings."
 hsm_bar_normalization.12.t:0 "The second foundation"
 hsm_bar_normalization.12.d:0 "The Griffonian station stands above a ring older than the observatory. All its joints face inward. When asked what the ring once enclosed, the surveyor answered that its builders may have been keeping something outside.\n\nThe calibration team has not used that sentence in its conclusion."
 hsm_bar_normalization.12.a:0 "Retain the surveyor's note."
 hsm_bar_normalization.13.t:0 "Irma's duplicate"
 hsm_bar_normalization.13.d:0 "Irma sent two copies of the northern test. In one, the team completed the procedure without incident. In the other, a watch officer described hearing his sister ask to be let through the gate.\n\nThe officer's family record was removed from the circulating copy. Irma kept the original in her safe and refused to certify the second account as an echo."
 hsm_bar_normalization.13.a:0 "The original stays in the file."
 hsm_bar_normalization.14.t:0 "The bank that is not on the map"
 hsm_bar_normalization.14.d:0 "The Riverlands instruments agree with the other stations. Their survey marks do not. A line measured from the bridge arrives at the western bank; the same line measured from a boat ends beneath the bridge.\n\nThe guide has signed the report with a hoofprint. Beside it, he asked that his village not be named in any further inquiry. The location has been removed from this copy."
 hsm_bar_normalization.14.a:0 "Do not move the markers."
 hsm_bar_normalization.15.t:0 "The space left open"
 hsm_bar_normalization.15.d:0 "The southern station is ready. Its perimeter markers form an incomplete circle, a detail the installation team repeatedly tried to correct. The local keeper returned each displaced marker before dawn.\n\nAsked why one space had to remain open, she said only: 'So that what is already here need not ask to come in.'\n\nHer name is absent from the forwarded report."
 hsm_bar_normalization.15.a:0 "Leave the space open."
 hsm_bar_normalization.101.t:0 "A silence across borders"
 hsm_bar_normalization.101.d:0 "Reports from several countries describe a sudden weakening of enchanted weapons and crystal mechanisms. Civilian installations have also reported unusual failures, although the cause remains disputed.\n\nIn Barrad, newspapers celebrate the return of workers to formerly dangerous ground. The government has announced no connection between the two developments."
 hsm_bar_normalization.101.a:0 "The reports are not isolated."
 hsm_bar_normalization.102.t:0 "The old watchfires"
 hsm_bar_normalization.102.d:0 "Keepers of several ancient sanctuaries have reported that their protective rites no longer answer. At first the reports were treated as another consequence of the recent magical disturbances. Evacuations began when patrols failed to return from land thought safe for generations.\n\nThe accounts agree on little. They agree that the change came after the silence."
 hsm_bar_normalization.102.a:0 "Some boundaries were never drawn on maps."
 hsm_bar_normalization.103.t:0 "An enemy beyond the perimeter"
 hsm_bar_normalization.103.d:0 "The exclusion zone has become a front. Armed formations whose origin has not been established have taken ground beyond the failed wards, and the defending government has committed regular troops.\n\nNo declaration or demand has been received from the intruders. Witness descriptions remain contradictory. The military reports are more consistent: the enemy can be stopped, but it must be fought."
 hsm_bar_normalization.103.a:0 "The war is real."
 hsm_bar_normalization.104.t:0 "The boundary answers"
 hsm_bar_normalization.104.d:0 "The surviving keepers report that their wards have begun to answer again. Enchanted weapons are recovering their former strength. Several governments acknowledge receiving previously withheld measurements, though none has published the accompanying correspondence.\n\nThe troops facing the intrusion have not been recalled. Whatever has already crossed remains on this side."
 hsm_bar_normalization.104.a:0 "Restoration is not absolution."
 hsm_bar_normalization.105.t:0 "A world kept by watchmen"
 hsm_bar_normalization.105.d:0 "The incursion has been defeated. The suppression stations have not been shut down. Conventional units now guard the places where old protections once stood, and their relief schedules extend beyond any announced reconstruction programme.\n\nBarrad's first reclaimed fields are still being sown. The children who will inherit them will also inherit the watch."
 hsm_bar_normalization.105.a:0 "The victory has no closing hour."
 hsm_bar_normalization.106.t:0 "The line holds"
 hsm_bar_normalization.106.d:0 "The hostile formations have lost their foothold as an independent fighting force. Search parties are returning to the abandoned settlements under armed escort. Several houses still have meals laid out on their tables.\n\nThe military has announced the end of the incursion, not an explanation of it. The surviving records have been ordered preserved."
 hsm_bar_normalization.106.a:0 "Count those who can come home."
 HSM_BAR_normalization_actor_tt:0 "An independent, undefeated Barrad has founded the Service, authorized global normalization and completed suppression research with the required case knowledge; coexistence has not been chosen."
 HSM_BAR_normalization_responder_tt:0 "Commands the authorized Service, or controls Barrad's central installation after that Service can no longer operate."
 HSM_BAR_normalization_choice_open_tt:0 "The incursion has begun; authorized command has not yet chosen between restoration and continued normalization."
