l_english:
 HSM_VER_AVR_routes_tt:0 "Avian's actual course decides our approach: §YIntergigantes§! permits a negotiated accession; §YTrue Neutrality§! opens the conquest branch. The common proclamation of neutrality does not decide this choice."
 HSM_VER_AVR_offer_tt:0 "Invites Avian to an association leading towards a common Verenian state. Avian may accept or refuse; annexation requires a later agreement."
 HSM_VER_AVR_customs_tt:0 "Spend §Y75 political power§! to align Avian's customs and administration with the already united duchies. Avian must expressly ratify accession. Ratification begins a §Y60-day§! transition; annexation requires the final focus."
 HSM_VER_AVR_integrate_tt:0 "Complete Avian's consented accession, transfer its territory and forces, and make its original homeland a core. Overseas possessions do not become cores."
 HSM_VER_AVR_annex_warning_tt:0 "§RThis consents to Avian's annexation by the surviving Verenian government after the agreed transition. Its army and possessions will pass to the united state; Avian will cease to be independent.§!"
 HSM_VER_AVR_customs_bonus:0 "Common Verenian Freight Regulations"
 HSM_VER_AVR_colleges_bonus:0 "The Colleges of a United Verenia"
 HSM_VER_AVR_records_bonus:0 "A Single Civil Register"
 HSM_VER_AVR_authority_tt:0 "Our independent ducal government has a functioning Erie-Eyrie charter, a confirmed military settlement, or a founded Verenian state controlling both ducal homelands."
 HSM_VER_AVR_association_available_tt:0 "The ducal settlement is valid. Avian follows Intergigantes under its constitutional government, is independent and at peace, controls its homeland and has not agreed with another host. Neither side belongs to an incompatible foreign alliance; no proposal is pending or refused."
 HSM_VER_AVR_customs_available_tt:0 "We have united and control both ducal homelands, retain Avian's association treaty and have at least 75 political power. Both governments are independent, at peace and diplomatically compatible; Avian controls its homeland."
 HSM_VER_AVR_accession_available_tt:0 "Avian has explicitly ratified accession to our founded Verenia, customs alignment is complete and the 60-day transition has ended. The treaty, governments, peace and territorial control remain valid."
 HSM_VER_AVR_claim_available_tt:0 "Our ducal settlement is valid. Independent Avian has chosen true neutrality and holds its homeland. Both governments are at peace; no shared faction, non-aggression pact or outstanding accord prevents the claim. Ordinary diplomatic rules permit war."
 HSM_ERI_avian_association:0 "$HSM_ERI_invite_avian$"
 HSM_ERI_avian_association_desc:0 "$HSM_ERI_invite_avian_desc$"
 HSM_EYR_avian_association:0 "$HSM_EYR_a_seat_for_avian$"
 HSM_EYR_avian_association_desc:0 "$HSM_EYR_a_seat_for_avian_desc$"
 hsm_ver_avr.1.t:0 "Katrina's Place at the Table"
 hsm_ver_avr.1.d:0 "Intergigantes was never meant to leave Avian forever balancing between two quarrelling neighbours. The delegation from [From.GetName] has brought a proposal that goes further than mutual protection: common institutions, followed by a common state.\n\nKatrina puts the pages in a different order. Local courts and the colleges come first; the chairmanship comes last. Her signature today would authorise negotiations, not abolish her government. That second signature will have to wait for a complete accession act."
 hsm_ver_avr.1.a:0 "Associate the Houses; reserve the final signature."
 hsm_ver_avr.1.b:0 "Cooperation does not require accession."
 hsm_ver_avr.2.t:0 "The Accession Act"
 hsm_ver_avr.2.d:0 "The tariffs have been compared, the civil registers reconciled, and the officers have agreed who will issue orders when two columns meet at a crossroads. There are no longer two duchies for Avian to mediate between: [From.GetName] is offering a place in a single government.\n\nThe final text preserves Avian's municipal charters and college endowments, but its separate foreign policy and military command will end. Katrina reads that paragraph aloud before asking the council to vote. This is no defensive league disguised by a grand title."
 hsm_ver_avr.2.a:0 "Ratify accession to [From.GetName]."
 hsm_ver_avr.2.b:0 "Keep the treaty, but retain our government."
 hsm_ver_avr.3.t:0 "The Last Customs Post"
 hsm_ver_avr.3.d:0 "The last toll ledger has been closed. The clerks were not dismissed: they now register freight at the outer border. In the courtyard, soldiers replace the duty roster rather than the guards.\n\nAvian's colleges, municipalities and regiments have entered the common state. There will still be arguments over appointments and funding. They will take place inside one government, not across three frontiers."
 hsm_ver_avr.3.a:0 "One country, with more than one memory."
 hsm_ver_avr.obsolete:0 "The circumstances have changed."
 HSM_ERI_avian_question:0 "The Avian Question"
 HSM_ERI_avian_question_desc:0 "Our settlement with the other duchy does not settle Avian's future. Katrina's Intergigantes government has already made cooperation its policy; a government committed to true neutrality has chosen the opposite. Our council must address the Avian question in its own right, not append it to the old family quarrel."
 HSM_ERI_avian_customs:0 "From Association to Administration"
 HSM_ERI_avian_customs_desc:0 "The duchies now share a government. Avian's accession needs working instructions: common customs documents, recognition of municipal law, and a place for its colleges in the public budget. Once these are ready, Katrina's council will receive the act that ends separate sovereignty."
 HSM_ERI_avian_accession:0 "Close the Third Frontier"
 HSM_ERI_avian_accession_desc:0 "Consent has been given and the transition has run its course. Avian's regiments will enter the common army, its courts the common system of appeals, and its towns the same political country as their neighbours. The treaty becomes a constitution in practice."
 HSM_EYR_avian_question:0 "The Avian Question"
 HSM_EYR_avian_question_desc:0 "Our settlement with the other duchy does not settle Avian's future. Katrina's Intergigantes government has already made cooperation its policy; a government committed to true neutrality has chosen the opposite. Our council must address the Avian question in its own right, not append it to the old family quarrel."
