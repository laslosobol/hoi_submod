 HSM_BAR_mtk_ritual_brake_title:0 "Ritual Brake"
 HSM_BAR_mtk_ritual_brake_idea:0 "Opening note in the rhythm book.\n\nA ritual can continue after the singer falls silent. Its last phrase remains in the circle, feeding the next until exhaustion breaks it. I propose an ending that removes that support deliberately, without tearing the whole pattern apart. An assistant should be able to perform it even when I am absorbed in listening. I remember having no power to end what another creature had begun. Remembering has not always made me easier to interrupt.\n\nSigned: Asinti.\nViira, handwritten: Your first drawing puts the stopping mark beneath your own hoof. Move it where someone else can reach it."
 HSM_BAR_mtk_ritual_brake_theory:0 "Analysis of the returning phrase.\n\nTreat the circle as a sequence in which each completed phrase strengthens the next. Simply cutting the singer's contribution may leave enough stored force for several further turns. The proposed brake introduces a cancelling rhythm and leads the remainder into an unvoiced clay resonator. Measure the field after the last audible note, not merely the silence. Compare normal endings, interrupted chants, and assisted stops across several starting strengths. The test concerns rituals still fed by our circuit, not every presence that might exist independently of it.\n\nSigned: Asinti.\nLeopold, pencilled beside the resonator: Clay can crack. Show where the remaining force goes then."
 HSM_BAR_mtk_ritual_brake_tests:0 "Stop trials, witnessed from outside the circle.\n\nThe first interrupted chant left a returning pulse for seven beats. After adding the clay discharge path, sixteen assisted stops ended the measured cycle without a rebound, including four initiated while I continued the opening phrase. Helle, our deer assistant, broke one resonator in the bench test; its paired spare accepted the remainder. During the final trial she stopped a promising response. I began to protest, then read the quiet instruments. The stop had worked without my cooperation.\n\nSigned: Asinti; Helle.\nHelle's handwritten correction: He protested for two whole sentences. Both are in my timing notes."
 HSM_BAR_mtk_ritual_brake_conclusion:0 "Teaching copy of the completed cadence.\n\nThe brake reliably ends the tested rituals by removing their sustaining rhythm and discharging what remains. The paired resonators must be inspected, and the field must be watched after the voices stop. It is not a charm for erasing an independent being. Students have now ended the same exercise with three different singers, including one whose timing I dislike. All three cycles stopped. The teaching drum belongs on the assistant's side of the bench.\n\nSigned: Asinti.\nSilver Star, handwritten: You corrected her pronunciation during the demonstration.\nAsinti's reply: It was poor pronunciation. It was also an entirely effective stop. Put both in the report."

 HSM_BAR_mtk_silent_witness_title:0 "Silent Witness"
 HSM_BAR_mtk_silent_witness_idea:0 "Proposal for a conversation with an absent witness.\n\nSome answering voices offer names, memories, and certainty before a question is complete. I once accepted such generosity from my otherworldly patron Osvananga without asking what the answer cost him. Here I propose to test a narrower claim: can a purported witness report something independently checkable that the listeners do not already know? Use prepared records and concealed targets before asking anything of a grieving family. A familiar voice alone cannot establish who speaks.\n\nSigned: Asinti.\nSilver Star, handwritten: You have written that last sentence very firmly. Read it aloud when the voice says something you wish to hear."
 HSM_BAR_mtk_silent_witness_theory:0 "Plan for separating an answer from a suggestion.\n\nA claimed witness should distinguish four possible marks in a covered box whose contents are unknown to everyone conducting the sitting. Separate trials will test historical details against records held elsewhere. Questions must use the same wording, and the recorder must not learn the target until the answer is fixed. Include empty boxes and invented names. If responses follow the questioner's expectations, their source remains uncertain even when the voice sounds persuasive. A spirit's existence would not establish its honesty or memory.\n\nSigned: Asinti.\nViira, handwritten: Include your pauses in the transcript. You can suggest an answer without saying a word."
 HSM_BAR_mtk_silent_witness_tests:0 "Transcript comparison, twenty-four marked-box sittings.\n\nSix answers matched the four-choice targets, no better than the expected count from guessing. Empty boxes received confident descriptions of objects. In the record trials, an invented witness supplied a detailed childhood, and changing the suggested surname changed the alleged memory. Removing my leading pauses reduced the stories without improving their accuracy. None of the historical claims survived independent checking as information unavailable to the sitters. We have not established who, if anyone, answered.\n\nSigned: Asinti; Viira.\nAsinti, handwritten below his signature: I marked one account convincing because it sounded kind. Viira made me put that word in a separate column."
 HSM_BAR_mtk_silent_witness_conclusion:0 "Final assessment of the witness claim.\n\nSilent Witness failed. The procedure produced no reliable testimony, no usable means of identification, and no dependable information beyond the sitters' own knowledge. Its voices cannot be offered as evidence, intelligence, or a service to bereaved families. There is no practical benefit to claim from this method. The accounts remain unsuccessful observations, not conversations authenticated after the fact. I will not ask an audience to supply the belief the experiment could not earn.\n\nSigned: Asinti.\nSilver Star, handwritten: You still think one voice knew you.\nAsinti's reply: Yes. That is why I asked you to sign the assessment with me."

 HSM_BAR_mtk_place_memory_title:0 "Memory of Place"
 HSM_BAR_mtk_place_memory_idea:0 "Survey proposal, with a brick from the old hall.\n\nA room sometimes answers a spell long after its caster has departed. I want to know whether stone retains a measurable alteration, and whether different workings leave distinguishable traces. The popular phrase memory of place tempts us to imagine a truthful scene waiting to be replayed. We must begin with bricks whose treatment we ourselves record. Untouched stone, weathered stone, and moved stone belong in the comparison, not merely the oldest wall we can find.\n\nSigned: Asinti.\nLeopold, handwritten: You brought a handsome ruin to a materials question. Bring twenty ordinary bricks, and tell me which wall they came from."
 HSM_BAR_mtk_place_memory_theory:0 "On traces without a narrator.\n\nThe proposed model treats a magical working as an alteration in how a material answers a later probe. Different stones may retain different parts, while water, heat, and subsequent spells may overwrite them. A trace need not contain an image, a name, or the order of events. Prepare matched bricks with known sequences, including the same workings in reverse order. Examiners will draw their readings before receiving the treatment list. Described scenes must be compared between observers, separately from instrument marks.\n\nSigned: Asinti.\nViira, handwritten: If the instrument and the observer disagree, do not automatically call the observer more sensitive. You used to do that for me."
 HSM_BAR_mtk_place_memory_tests:0 "Brick series and return visit to the hall.\n\nExaminers detected prior magical treatment in seventeen of twenty concealed samples. They could sometimes distinguish a heating charm from a binding, but reversing the order of two workings produced indistinguishable readings. Rain weakened both. At the hall, an apparently ancient trace followed a replacement brick brought from the workshop last month. Two observers described different figures around the same mark; neither drawing matched the recorded demonstration. The material response repeated. The supposed scene did not.\n\nSigned: Asinti; Helle.\nHelle, handwritten: He called my drawing imaginative until he saw that his own figure wore a cloak nobody at the demonstration possessed."
 HSM_BAR_mtk_place_memory_conclusion:0 "Survey finding returned to the masons.\n\nSome materials retain detectable magical traces. These can guide further sampling and reveal that a surface has been altered, within the limits of weathering and later use. They do not provide literal, truthful history. We cannot infer a culprit, a spoken promise, or a sequence merely by asking a wall to remember. A moved brick carries its trace elsewhere. The masons have received a plan of affected stone, with uncertain readings marked for re-examination.\n\nSigned: Asinti.\nViira, handwritten: Your lecture still begins with the beautiful vision.\nAsinti's reply: I have moved the replacement brick to the lectern. It is a less flattering beginning."

 HSM_BAR_mtk_threshold_compass_title:0 "Threshold Compass"
 HSM_BAR_mtk_threshold_compass_idea:0 "Instrument request, following the western chamber survey.\n\nA compass points somewhere; the device I propose should tell us when somewhere ceases to behave like here. Near a ritual boundary, two matched resonators may cease answering in step even when neither grows louder. If that difference can be measured, we could approach the edge by survey rather than by trusting the shaman's shiver. Test ordinary enchantments and metal fittings alongside deliberately raised thresholds. The instrument must distinguish a boundary from mere magical strength.\n\nSigned: Asinti.\nLeopold, handwritten: Give me a detectable quantity, not another drawing of a doorway. The workshop has enough doors."
 HSM_BAR_mtk_threshold_compass_theory:0 "Differential resonator calculation.\n\nTwo matched crystals receive the same probe, one exposed and one held within a reference ring. Ordinary changes in background strength should affect both. A boundary that changes how the probe returns may shift their relative timing. Rotate and translate the pair to map that change, repeating with the reference ring exchanged. Nearby machinery may distort the readings; calibrate beside it before calling a displacement a threshold. Nothing in the equation identifies a destination or the intentions of anything beyond it.\n\nSigned: Asinti; Leopold.\nViira, handwritten: A useful equation. Your reference ring is still a hypothesis. Test it where you expect nothing interesting."
 HSM_BAR_mtk_threshold_compass_tests:0 "Survey log, eighteen traverses.\n\nAcross eighteen passes through six prepared boundaries, the needle changed direction within a hoofspan of the edge independently mapped by suspended test threads. Rotating the instrument preserved the mapped line. Strong ordinary lamps raised both resonator readings without creating a false threshold. Near the workshop supply, three readings became ambiguous; after local calibration, repeated passes recovered the known boundary. A wall painted with an impressive doorway produced no response. Helle kept that wall in the series after I suggested removing it.\n\nSigned: Asinti; Helle; Leopold.\nHelle, handwritten: He said no educated observer would be fooled. The instrument is not educated. That is rather the point."
 HSM_BAR_mtk_threshold_compass_conclusion:0 "Acceptance note for the survey instrument.\n\nThe compass detects and maps the tested magical boundaries after local calibration. It allows another observer to check where a ritual changes the surrounding field, including stretches where my own sensation is vague. It does not name the far side, guarantee a passage, or judge a speaker. Machinery can still spoil a reading, so the reference check travels with the instrument. Two student surveyors have independently redrawn the western chamber's edge.\n\nSigned: Asinti.\nLeopold, handwritten: The needle is mine; stop telling visitors it follows your spiritual affinity.\nAsinti's reply: The needle is yours. The first three unusable housings are also yours."

 HSM_BAR_mtk_empty_vessel_title:0 "Empty Vessel"
 HSM_BAR_mtk_empty_vessel_idea:0 "Proposal for an uninhabited interlocutor's seat.\n\nI reached Kasa as an escaped slave, and its promise of shared freedom gave my work a purpose beyond survival. I was later exiled for experiments that brought otherworldly beings into living bodies. That history does not prove a body is necessary. I propose a ceramic vessel whose temporary magical pattern offers a place to answer without borrowing anyone's senses or limbs. Osvananga flattered my exceptional spirit while urging others toward dependence; I no longer accept his proposed solution as the only possible one.\n\nSigned: Asinti.\nSilver Star, handwritten: Then draw a vessel that does not resemble a waiting patient."
 HSM_BAR_mtk_empty_vessel_theory:0 "Model of a temporary external manifestation.\n\nA living host may supply a stable pattern rather than an indispensable soul. If so, an inscribed ceramic lattice might sustain a much simpler interface: one moving mark, one change of tone. The hypothesis does not require a complete body or a speaker who can remain after power ends. Compare empty vessels, inactive inscriptions, and driven lattices, recording every mark independently of the listener's impressions. The principal unknown is whether a pattern without living maintenance can stay coherent long enough to answer.\n\nSigned: Asinti.\nLeopold, handwritten: And whether your marks come from the apparatus itself. Leave the ordinary vibration controls in the design."
 HSM_BAR_mtk_empty_vessel_tests:0 "Vessel trials, eleven attempted manifestations.\n\nFour driven lattices sustained a dark moving filament above the ceramic rim for between twenty and forty seconds. Its motion did not follow the measured table vibration, and two trials produced marks after a changed prompt. The other seven lattices either remained quiet or lost coherence before a response. Inactive vessels showed no filament. Extra power heated the ceramic and shortened, rather than lengthened, the manifestation. Nobody served as a living host. The records establish a brief external phenomenon, not a verified identity.\n\nSigned: Asinti; Helle.\nViira, handwritten: You wrote resident. It stayed for less than a minute. Write visitor, at most."
 HSM_BAR_mtk_empty_vessel_conclusion:0 "Report on the uninhabited vessel.\n\nA short manifestation outside a living host is possible in some trials. The vessel cannot house a stable person, preserve a visitor indefinitely, or reproduce all the capacities of embodiment. Its narrow interval may support simple exchanges; that must be tested separately. More power has already made it worse. The cracked fourth vessel remains on my desk because its elegant inscription was the one I most wanted to trust.\n\nSigned: Asinti.\nHelle, handwritten: We need that desk for the next measurements.\nAsinti's reply: Put it on the shelf. Do not call it a relic. I have done enough of that with my own mistakes."

 HSM_BAR_mtk_contact_title:0 "Contact"
 HSM_BAR_mtk_contact_idea:0 "Magnum Opus proposal: an exchange across a measured boundary.\n\nRitual Brake supplies an ending; Silent Witness leaves no trustworthy testimony to build upon. Memory of Place requires us to distinguish old traces from a present reply. Threshold Compass may locate the interface, while Empty Vessel offers only a short manifestation outside a living host. Together these five lessons suggest a conversation whose answer can remain unwelcome. I propose exchanging newly chosen signs, agreeing their meaning, and testing whether either participant can request a pause. No claim of wisdom will substitute for that work.\n\nSigned: Asinti.\nSilver Star, handwritten: Include a question to which you would dislike hearing no."
 HSM_BAR_mtk_contact_theory:0 "Protocol for establishing a small shared vocabulary.\n\nRitual Brake ends our contribution on either side's stop signal. Silent Witness requires fresh challenges and independently recorded answers. Memory of Place requires a clean baseline before each call. Threshold Compass keeps the active interface within its surveyed edge. Empty Vessel sets the brief duration and excludes a living host. Begin with matching, difference, and repeat; change the signs only after both sides demonstrate the old distinction. Apparent agreement may still hide different meanings. Address and identity remain separate questions.\n\nSigned: Asinti.\nViira, handwritten: Your first vocabulary contains obey. Replace it with ask. The grammar is also part of the experiment."
 HSM_BAR_mtk_contact_tests:0 "Twelve calls, with independent written records.\n\nRitual Brake ended every session; Threshold Compass showed no widening boundary. Memory of Place's baseline check excluded residual marks. Empty Vessel sustained five brief replies; seven calls remained unanswered. Under Silent Witness's fresh challenges, three exchanges correctly handled a newly changed sign order and returned a request for repetition. Claimed names disagreed between calls. One voice offered longer speech through a living host. I declined; the next question went unanswered. The vessel cooled without a transfer into anyone present.\n\nSigned: Asinti; Helle; Viira.\nHelle, handwritten: He asked the silent vessel twice more. The brake was already down. I took him outside."
 HSM_BAR_mtk_contact_conclusion:0 "Magnum Opus assessment: bounded contact, incomplete understanding.\n\nBrief reciprocal exchanges occurred outside a living host. Ritual Brake supplied an ending; Silent Witness prevented us authenticating a name from conviction. Memory of Place separated residue from reply; Threshold Compass checked the edge; Empty Vessel limited the duration. These five lessons remain necessary together. We have neither a universal portal nor reliable access to every being, and shared signs do not guarantee truth. I reject domination as the price of clearer speech, including domination exercised by me.\n\nSigned: Asinti.\nSilver Star, handwritten: Are you disappointed?\nAsinti's reply: Bitterly. Stay for tea. Tomorrow we must find out whether their word for again also means please."
