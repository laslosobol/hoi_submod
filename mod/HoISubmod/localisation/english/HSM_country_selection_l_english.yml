 HSM_CSS_Filter_tt:0 "§YEquestria at War: Expanded Stories§!\n\n\n\n\n\n\n£GFX_HSM_CSS_stories_intro\n\n\n\n\n\n\n\n§LBeyond the chronicles of emperors lie the stories of those who lived at the edges of their realm. In Cyanolisia, a countess rules a conquered land while its former masters prepare to return. In Verenia, Erie and Eyrie sustain an old feud, and Avian seeks a place between its neighbours. Their subjects wait for schools, roads and peace, not another ancient claim. As the old order crumbles, even a small realm must choose its future. Some borders will fall at the negotiating table; others must be crossed in arms. The last page of this history remains unwritten.§!"
 HSM_CSS_CYA_DESC:0 "\n\n\n\n\n\n\n\n£GFX_HSM_CSS_CYA_map\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nFar from Griffenheim, the Countess struggles to hold together a frontier divided by conquest and mistrust. Across the water, Asterion prepares to reclaim what was lost. The old imperial order offers little protection, but its collapse may send unexpected guests to Cyanolisia's shores. Will the Countess build a realm of her own, entrust it to a dangerous ally, or give the Empire a new beginning?"
 HSM_CSS_ERI_DESC:0 "\n\n\n\n\n\n\n\n£GFX_HSM_CSS_ERI_map\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nVerenia was broken by revolution; the feud between its surviving Houses has kept it broken ever since. Duke Vincent's claims are older than the soldiers now guarding his frontier, while villages wait for roads, schools and peace. Erie must decide whether a reunited duchy can be negotiated or must be won. Yet bringing down the border posts is only the beginning: someone will have to govern the country beyond them."
 HSM_CSS_EYR_DESC:0 "\n\n\n\n\n\n\n\n£GFX_HSM_CSS_EYR_map\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nDuke Iovinus has learned to distrust promises from across the frontier. Eyrie's soldiers protect a disputed inheritance, but their vigilance cannot fill empty granaries or bring teachers to neglected villages. A settlement with Erie would require guarantees that outlive the next quarrel; victory would demand an answer for the defeated. Between these choices lies the possibility of Verenia becoming a country again, rather than an argument between its rulers."
 HSM_CSS_AVI_DESC:0 "\n\n\n\n\n\n\n\n£GFX_HSM_CSS_AVI_map\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nLady Katrina kept her lands out of the struggle between Erie and Eyrie, but separation has not resolved the divisions within Avian. Towns speak different languages, old privileges endure, and two great powers cast their shadows across the border. Remaining apart promises safety without certainty. Opening the country may bring reform and a place at a common Verenian table, provided that its neighbours learn to listen before they command."
