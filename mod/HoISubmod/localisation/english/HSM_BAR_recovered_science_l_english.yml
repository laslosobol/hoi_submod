 HSM_BAR_recovered_science_access_tt:0 "The Service has been founded and has analysed the recovered Pentarchy archives."
 HSM_BAR_recovered_science_unlocked_tt:0 "The original Barrad research tree is available again: alchemy, military theory, material science and Viira's documented curiosities. Technologies still require normal research and their preceding technologies; existing exclusive choices remain in force. The archives do not restore the Pentarchs or unlock their personal powers and special bodies."
