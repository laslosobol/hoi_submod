l_english:
 HSM_ZYP_victory_roll:0 "The Victory Roll"
 HSM_ZYP_victory_roll_desc:0 "The throne we demanded at Griffenheim was an objective, not an achievement. Before a new imperial title can be proclaimed, the Herzland must be held through settled ownership and effective government, directly or through our dependencies. Let the military and civil offices account for the country behind the victory announcements."
 HSM_ZYP_imperial_coronation:0 "The Imperial Coronation"
 HSM_ZYP_imperial_coronation_desc:0 "Verenia already has its Kaiser. Griffonia has not yet received a Zypressen emperor. Prepare a separate coronation after the Herzland settlement, with a chancery capable of turning the new dignity into government. Neither the ceremony nor the conqueror's surname can supply the consent of every crown beyond the capital."
 HSM_ZYP_household_register:0 "What the Registers Actually Say"
 HSM_ZYP_household_register_desc:0 "The imperial archives contain useful knowledge alongside claims of succession. Separate technical records from court rumours, preserve the former household's documented circumstances and improve the means by which offices exchange information. An emperor who wishes to displace a dynasty need not pretend that a missing page proves whatever his courtiers wish to believe."
 HSM_ZYP_rolls_of_the_crowns:0 "The Crowns Bring Their Own Accounts"
 HSM_ZYP_rolls_of_the_crowns_desc:0 "Our dynasty's dependent governments have treasuries, workshops and obligations of their own. Decide what to offer them: protected local administration with common technical work, or negotiated ministries directing agreed industrial and military business. Family loyalty can begin the conversation. It cannot determine the answer."
 HSM_ZYP_repair_the_arteries:0 "Freight Before Pageantry"
 HSM_ZYP_repair_the_arteries_desc:0 "Victory has left repair orders competing with the transport of food, machinery and troops. Support engineers and choose where to put the next effort: civilian workshops and better construction, or a permanent board coordinating infrastructure and supplies. An imperial procession cannot carry the freight its timetable displaces."
 HSM_ZYP_commissions_not_orders:0 "Commissions, Not Family Orders"
 HSM_ZYP_commissions_not_orders_desc:0 "The dynastic rulers have received a proposal for common ministries, and some have returned it with whole paragraphs crossed out. Their treasuries and councils have learned to govern since the conquests that placed them there. Trubach must negotiate with those institutions: a family connection may secure an audience, but it cannot supply the powers his chancery wants."
 HSM_ZYP_arsenals_and_workshops:0 "Arsenals and Workshops"
 HSM_ZYP_arsenals_and_workshops_desc:0 "The war ministry wants weapons that can be repaired with parts made beyond a single arsenal. Expand military production on securely administered land and bring industrial specialists together over common specifications. The dynasty's authority will travel farther if its equipment can survive the journey."
 HSM_ZYP_common_colleges:0 "An Exchange of Practical Knowledge"
 HSM_ZYP_common_colleges_desc:0 "A common surname does not make every laboratory's instruments interchangeable. The colleges will exchange drawings and teachers with the crowns that signed the technical agreements. Their first task is to make a demonstration repeatable in another country's workshop. Later participants will bring their own apparatus, and their own questions about what the older partners have learned."
 HSM_ZYP_the_muster_dispute:0 "The Muster and the Harvest"
 HSM_ZYP_the_muster_dispute_desc:0 "The staff's neat mobilisation calendar collides with the work that feeds its soldiers. Dependent rulers are asking what the next campaign will leave available at home. We must choose how to organise our own forces: a stronger permanent cadre with a heavier domestic burden, or limited rotations supported by better training and supply."
 HSM_ZYP_western_campaign:0 "The Western Approaches"
 HSM_ZYP_western_campaign_desc:0 "Draw up the Aquileian campaign against the governments that now own the intended territories. The old names on a map may no longer name the states we face. Existing allies and dependent realms stand outside the new demands; the general staff must distinguish a frontier from a family possession."
 HSM_ZYP_reconstruction_contracts:0 "Contracts After the Columns"
 HSM_ZYP_reconstruction_contracts_desc:0 "The western settlement needs more than the passage of military columns. Give civilian builders dependable contracts and develop construction methods that can turn a damaged district back into a working economy. Our own workshops must support that work without claiming ownership of a neighbour's industry."
 HSM_ZYP_northern_campaign:0 "The Northern Routes"
 HSM_ZYP_northern_campaign_desc:0 "Once the western approaches are settled, prepare the routes towards Cloudbury, Vedina, Skyfall and Haukland. Staff work must follow current governments and possession, not the assumption that every old crown still rules. Agreements with allies remain agreements even when their lands appear on an imperial map."
 HSM_ZYP_southern_campaign:0 "The Southern Workshops"
 HSM_ZYP_southern_campaign_desc:0 "A settled north permits the staff to turn towards Wingbardy and the southern industrial realms. Their furnaces and workshops matter as much as their palaces. Prepare demands against their actual independent owners without treating the dependent crowns already serving our dynasty as another conquest to repeat."
 HSM_ZYP_eastern_campaign:0 "Beyond the Eastern Marches"
 HSM_ZYP_eastern_campaign_desc:0 "The eastern marches lead towards Hellquill, Longsword, Lushi and the wider eastern principalities. Arrange this campaign only after the earlier theatres are settled. The emperor's ambition reaches across Griffonia; the staff's preparations must still proceed through real territories, maintained routes and governments capable of answering."
 HSM_ZYP_seats_for_new_crowns:0 "Seats for the Later Arrivals"
 HSM_ZYP_seats_for_new_crowns_desc:0 "The campaigns have enlarged the family of dependent crowns. Their new rulers arrive with officials, debts and local promises that the imperial chancery did not write. Trubach will offer them places beside the earlier signatories, with the same need to agree on which powers belong at home and which can be entrusted to common institutions."
 HSM_ZYP_accounts_after_campaign:0 "The Accounts After the Campaigns"
 HSM_ZYP_accounts_after_campaign_desc:0 "The regional campaigns have reached a settlement, whether through imperial possession, dependent governments or allied arrangements. Review what our ministries actually control and what remains another government's responsibility. Stable production requires orders that survive the departure of the officer who first demanded them."
 HSM_ZYP_crown_and_countries:0 "One Dynasty, Many Countries"
 HSM_ZYP_crown_and_countries_desc:0 "The imperial crown has acquired a continental task. Its success cannot be measured by calling every dependent government an office or every ally a subject. Consolidate the army's experience and practical support services while preserving an honest account of which powers were negotiated. A Zypressen future must be governed, not merely proclaimed."
 HSM_ZYP_imperial_chancery:0 "The Imperial Chancery"
 HSM_ZYP_imperial_chancery_desc:0 "A new imperial office lends stability and political authority to Trubach's coronation. It operates while his independent government and effective control of Griffenheim through Verenia or its subjects endure."
 HSM_ZYP_autonomous_crown:0 "An Autonomous Dynastic Compact"
 HSM_ZYP_autonomous_crown_desc:0 "This dependent government has accepted common technical work while retaining its own administration. Stable local orders favour civilian construction, at an ongoing political cost. No territory or sovereignty is transferred by the compact."
 HSM_ZYP_common_ministries:0 "Negotiated Common Ministries"
 HSM_ZYP_common_ministries_desc:0 "This government has expressly delegated agreed industrial and technical responsibilities to common ministries. Military production and research benefit, while the administration consumes political effort. Its crown, territory and existing subject relationship remain intact."
 HSM_ZYP_dynastic_exchange:0 "The Working Dynastic Network"
 HSM_ZYP_dynastic_exchange_desc:0 "At least one eligible crown has accepted an institutional agreement. Exchange accelerates research and production efficiency growth, with a political cost to the imperial government. Refusal by every partner leaves no network to administer."
 HSM_ZYP_railway_board:0 "The Freight Coordination Board"
 HSM_ZYP_railway_board_desc:0 "Permanent dispatchers coordinate infrastructure work and reduce the waste of military supplies. Their authority concerns our transport administration; they have not been given another crown's railways."
 HSM_ZYP_professional_muster:0 "A Permanent Campaign Cadre"
 HSM_ZYP_professional_muster_desc:0 "Standing officers and specialists improve organisation and planning. Maintaining this cadre strains domestic stability. The measure reorganises our own army and does not conscript a dependent country's forces by decree."
 HSM_ZYP_limited_muster:0 "Rotations the Districts Can Sustain"
 HSM_ZYP_limited_muster_desc:0 "Limited rotations and practical training reduce the time needed to prepare our soldiers and the supplies they consume. The staff accepts a less ambitious standing commitment in exchange for dependable provision."
 HSM_ZYP_settled_orders:0 "Orders That Outlast the Campaign"
 HSM_ZYP_settled_orders_desc:0 "Predictable industrial orders support civilian construction and a higher production efficiency ceiling. The imperial administration is learning to purchase sustained output instead of treating every workshop as a temporary military store."
 HSM_ZYP_imperial_business:0 "The Business of the Imperial Crown"
 HSM_ZYP_imperial_business_desc:0 "A postponed coronation, an unsigned compact or an outdated campaign plan may require another decision. The chancery cannot replace consent with silence, nor make a former owner answer for territory now held by somebody else."
 HSM_ZYP_reconvene_coronation:0 "Reconvene the Imperial Coronation"
 HSM_ZYP_reconvene_coronation_desc:0 "The chamberlain has kept the corrected invitations. In Griffenheim, the officials preparing the ceremony must now make their arrangements fit the government established after the war: whom to receive, which oath to read, and which title Trubach will bear when he leaves the hall. An army's arrival supplied none of those answers."
 HSM_ZYP_reopen_congress:0 "Reopen the Unsigned Compacts"
 HSM_ZYP_reopen_congress_desc:0 "Some crowns have yet to put their seals beneath the compact. The chancery will return to their objections, inviting the newly established courts to explain their own needs as well. Earlier signatories will expect their terms to be honoured while the emperor bargains with those who still doubt what a common ministry would ask of them."
 HSM_ZYP_review_campaign:0 "Review the Current Campaign's Owners"
 HSM_ZYP_review_campaign_desc:0 "The latest dispatches do not match the names on the staff's old map. A disputed frontier may now answer to a different government, and a local ruler may shelter beneath a foreign crown. Before Trubach sends another demand, his officers must establish who can answer it and which agreements still bind the imperial court."
 HSM_ZYP_industry_bonus:0 "Dynastic Industrial Methods"
 HSM_ZYP_construction_bonus:0 "Reconstruction Contracts"
 HSM_ZYP_electronics_bonus:0 "Registers and Technical Colleges"
 HSM_ZYP_support_bonus:0 "Supply Across the Campaign Routes"
 HSM_ZYP_congress_tt:0 "Invites eligible dynastic subjects. Each may accept, seek autonomous terms or refuse. Replies expire after 30 days; new invitations require 90 days from the previous offer."
 HSM_ZYP_colleges_tt:0 "Each consenting eligible crown receives one 100% electronics research bonus, including later signatories. Previously delivered grants are never repeated after interruption or renegotiation."
 HSM_ZYP_no_custody_tt:0 "Acknowledges only established information about Grover VI. Does not move, recruit, retire or appoint a character, establish custody, create a regency or restore a dynasty."
 HSM_ZYP_campaign_tt:0 "Prepares war goals against eligible opponents in the first unsettled theatre. Friendly countries, their subjects and current enemies are excluded. Declaring war remains a separate decision."
 HSM_ZYP_started:0 "The Zypressen Imperial Continuation Has Begun"
 HSM_ZYP_crowned:0 "Trubach Has Accepted the New Imperial Crown"
 HSM_ZYP_coronation_pending:0 "The Imperial Coronation Awaits a Decision"
 HSM_ZYP_coronation_retry:0 "The Imperial Coronation Is Within Its Sixty-Day Postponement"
 HSM_ZYP_policy_chosen:0 "The Proposal to the Dynastic Crowns Has Been Chosen"
 HSM_ZYP_policy_pending:0 "The Institutional Proposal Awaits the Emperor's Choice"
 HSM_ZYP_central_proposal:0 "The Emperor Has Proposed Negotiated Common Ministries"
 HSM_ZYP_works_chosen:0 "The Reconstruction Investment Has Been Chosen"
 HSM_ZYP_works_pending:0 "The Reconstruction Investment Awaits a Decision"
 HSM_ZYP_muster_chosen:0 "The Army's Muster Arrangements Have Been Chosen"
 HSM_ZYP_muster_pending:0 "The Muster Dispute Awaits a Decision"
 HSM_ZYP_signed:0 "This Dynastic Government Has Signed an Institutional Agreement"
 HSM_ZYP_autonomous:0 "This Crown's Separate Administration Is Protected by Agreement"
 HSM_ZYP_offer_pending:0 "The Imperial Proposal Awaits This Crown's Reply"
 HSM_ZYP_offer_retry:0 "A Dynastic Invitation Was Issued Within the Last Ninety Days"
 HSM_ZYP_counter_pending:0 "An Autonomous Counteroffer Awaits Imperial Acceptance"
 HSM_ZYP_refused:0 "The Institutional Negotiations Ended Without Agreement"
 HSM_ZYP_workshop_grant:0 "The One-Time Industrial Research Grant Was Delivered"
 HSM_ZYP_college_grant:0 "The One-Time Electronics Research Grant Was Delivered"
 HSM_ZYP_frontier_retry:0 "The Campaign Ownership Review Is Within Its Ninety-Day Interval"
 hsm_ver_zypressen.0.t:0 "The Map After the War"
 hsm_ver_zypressen.0.d:0 "The clerks brought two maps to Trubach. One followed the advance of the armies; the other recorded possession after the settlement. He had ordered the second prepared because a victorious column could leave a district before its taxes, courts or railway accounts had changed hands.\n\nAcross the Herzland, the reports now described an authority that could remain. The reports distinguished offices answering directly to Verenia from any dependent administrations maintaining their own seals. Griffenheim was no longer merely the destination written beneath a war order.\n\nThe earlier proclamation had given Trubach a kingdom and an imperial ambition. It had not performed the coronation now being proposed. The chamberlain asked which title should appear on the invitations. Trubach returned the proof with the old title intact: the next one would require a ceremony of its own."
 hsm_ver_zypressen.0.a:0 "Prepare the imperial coronation."
 hsm_ver_zypressen.1.t:0 "A Different Crown"
 hsm_ver_zypressen.1.d:0 "Trubach paused at the entrance while the last command passed down the guard. He knew that sound better than the music inside. Orders travelled through ranks, reached the ground and produced a movement he could see. An imperial title promised something larger and less obedient.\n\nHe had already proclaimed a kingdom. The crown waiting at Griffenheim belonged to a different ambition: to make the name Zypressen endure beyond the army that had carried it there. Fresh timber still showed beneath the ceremonial hangings. Somewhere outside, a hammer continued working through the appointed hour. Victory had brought him a capital that needed repairing, not a finished empire.\n\nFor a moment he imagined the hall without his officers, years after their commands had ceased to matter. Would his name still hold the country together? Then the doors opened. He straightened, entered at the prescribed pace and let the question accompany him to the crown."
 hsm_ver_zypressen.1.a:0 "Accept the imperial crown and establish its chancery."
 hsm_ver_zypressen.1.b:0 "Postpone the ceremony; the kingdom remains."
 hsm_ver_zypressen.2.t:0 "Relatives with Treasuries"
 hsm_ver_zypressen.2.d:0 "The draft address called the dependent rulers members of one household. The attached accounts made them look rather less alike. One treasury depended upon civilian orders; another could profit from common military contracts, provided its own officials knew what authority they were surrendering.\n\nTrubach's secretary suggested that a family instruction would be shorter than a constitutional proposal. The emperor pointed to a petition asking who would pay for workshops left idle by an imperial requisition. A shared surname supplied no answer to that question.\n\nHe could offer protected local administration with technical cooperation, accepting that these crowns would continue to govern their own business. Or he could seek common ministries with defined industrial and technical powers. The second arrangement promised closer coordination, but it would have to survive an actual reply. His appointees had acquired countries to govern. They were beginning to speak for those countries as well as for his dynasty."
 hsm_ver_zypressen.2.a:0 "Offer autonomous crowns a common programme of work."
 hsm_ver_zypressen.2.b:0 "Propose common ministries with explicitly delegated powers."
 hsm_ver_zypressen.3.t:0 "A Name in the Former Household's Records"
 hsm_ver_zypressen.3.dead.d:0 "The record of Grover VI's death has reached the archivists. An official proposes closing the former household's file altogether; another points to the claims and obligations still written inside it. Death settles the question of a living claimant, not every question left by his government. Trubach orders the established fact entered without converting it into a fresh account of events nobody in the room witnessed. The archive will retain its documents. This examination changes no custody and restores no dynasty."
 hsm_ver_zypressen.3.local.d:0 "Grover VI is recorded as present in our country. The archivist refuses to turn that limited fact into a story about how he arrived, who accompanied him or what he has promised. Trubach has not convened this office to appoint a regent or bargain away his new crown. The entry will record the presence that can be established. The former household's circumstances remain a matter of evidence, not something this clerk may rearrange to suit the ceremony."
 hsm_ver_zypressen.3.foreign.d:0 "The household search locates Grover VI outside our government. A courtier suggests writing as though the capture of Griffenheim must have delivered the former dynasty into Trubach's hands. The archivist places the contrary record beside his draft. Possession of a capital is not possession of every person once associated with it. The foreign presence will be acknowledged without inventing its circumstances. No demand for custody, regency or restoration accompanies the entry."
 hsm_ver_zypressen.3.d:0 "The surviving records establish neither a confirmed death nor Grover VI's presence in a government known to the archivists. A blank is inconvenient in an imperial register, and the clerk has been urged to supply a plausible conclusion. Trubach tells him to preserve the uncertainty. An invented whereabouts would become somebody else's evidence in the next dispute. The file remains incomplete; this examination orders no search party, custody transfer, regency or restoration."
 hsm_ver_zypressen.3.a:0 "Record only what can be established."
 hsm_ver_zypressen.4.t:0 "The Train That Could Not Leave"
 hsm_ver_zypressen.4.d:0 "The wagon manifest promised machinery to a damaged workshop. The dispatch board promised the same siding to a military train. Neither instruction was absurd on its own; together they had left both consignments waiting while a clerk sought a signature high enough to overrule the other.\n\nThe works office asked for investment in civilian capacity and construction methods. More reliable production would ease the competition for every replacement part. The transport officials argued for a permanent coordination board, with authority to arrange the traffic before it reached a blocked siding.\n\nTrubach had spent years demanding that departments move faster. Here, two departments had moved promptly towards incompatible instructions. He could support the workshops that supplied the system or the dispatchers who kept it moving. The engineer waiting outside needed a decision he could translate into tomorrow's work."
 hsm_ver_zypressen.4.a:0 "Invest in civilian workshops and construction methods."
 hsm_ver_zypressen.4.b:0 "Establish a permanent freight coordination board."
 hsm_ver_zypressen.5.t:0 "Two Calendars"
 hsm_ver_zypressen.5.d:0 "The general staff's calendar showed the next concentration of troops. The district return showed the same weeks marked for work that could not be postponed without consequences for food and repairs. The district administration had sent both documents back with a question: which promise were its officials expected to break?\n\nTrubach read the note twice. The officials who signed it served his own government, but they would face the shortages after the imperial column had moved on. That did not make the objection disloyal. It made the requested commitment more expensive than the staff's table admitted.\n\nThe emperor could strengthen his own permanent cadre, gaining organisation and planning at the cost of domestic strain. Or he could organise limited rotations, spending effort on training and supply so that a smaller standing commitment remained dependable. The officials waiting for his answer would have to make the resulting calendar work in fields and workshops, long after the staff had turned towards the next frontier."
 hsm_ver_zypressen.5.a:0 "Build a permanent cadre in our own army."
 hsm_ver_zypressen.5.b:0 "Use limited rotations with stronger training and supply."
 hsm_ver_zypressen.6.t:0 "Which Office May Sign?"
 hsm_ver_zypressen.6.d:0 "The review began with a purchase order returned for clarification. Its imperial heading was impressive. The signature belonged to an office which had not been delegated authority over the supplier concerned.\n\nThe accountants separated the arrangements: work administered directly by Verenia, responsibilities accepted by participating crowns, and matters still reserved to another government. A refusal did not disappear because the campaign map had grown larger. Nor could an allied frontier be entered as a dependent treasury merely because the staff no longer expected a war there.\n\nTrubach required the revised order to name the office that could actually pay it. The dynasty's ambitions remained continental. Its production would depend on less spectacular distinctions: who had promised a contract, whose accounts would meet it, and whether the same answer would remain valid when the soldiers left. The suppliers waiting for confirmation had little use for another ceremonial title."
 hsm_ver_zypressen.6.a:0 "Issue orders through the offices empowered to honour them."
 hsm_ver_zypressen.7.t:0 "The Emperor and the Countries"
 hsm_ver_zypressen.7.d:0 "From the balcony, Trubach could see carts waiting at a repaired crossing. A patrol passed them without halting the traffic. It was an ordinary sight, and he found himself watching longer than he had watched the parade.\n\nHis early victories had made the dynasty's future seem like a succession of places to reach. Griffenheim, then the roads beyond it, then another frontier. Now the routes carried supplies towards workshops which expected to be working next season. People were making plans that presumed his empire would still exist. That confidence pleased him and made the prospect of failure harder to dismiss.\n\nThe continent had not become a single household. Countries retained interests no family name could absorb, and an ally's cooperation was not obedience. Trubach still wanted his dynasty to outlast every rival. Looking down at the crossing, he began to suspect that its endurance would be measured partly by how little an ordinary journey needed to wait for him."
 hsm_ver_zypressen.7.a:0 "An imperial future still needs governments."
 hsm_ver_zypressen.10.t:0 "The Emperor's Institutional Proposal"
 hsm_ver_zypressen.10.central.d:0 "The imperial proposal asks our government to delegate defined industrial and technical responsibilities to common ministries. The expected gains are real: coordinated military orders, shared research and access to specialists. So is the cost of maintaining the new administration.\n\nOur ruler's dynastic connection has secured a hearing, not erased the interests represented by this treasury. A workshop expecting civilian orders may read the proposal differently from an arsenal. We can accept the delegated powers, propose cooperation with our own administration protected, or decline the arrangement. None of the texts dissolves our country. The question is which institutions our government is prepared to authorise."
 hsm_ver_zypressen.10.d:0 "The imperial proposal offers technical cooperation while recognising our government's separate administration. The draft names workshops whose orders could be shared and engineers who could be invited to inspect the work. Our officials want to know who will settle a disputed bill when the supplier answers to a different crown.\n\nOur ruler's connection to the dynasty does not make the treasury's decision automatic. Officials have attached their own requirements to the invitation: work must remain answerable to the offices that authorised it, and common projects must not become an excuse for quietly expanding imperial demands. We may accept that compact or retain our existing relationship without it. The emperor has asked for a signature; he has not yet received one."
 hsm_ver_zypressen.10.a:0 "Delegate the agreed responsibilities to common ministries."
 hsm_ver_zypressen.10.b:0 "Accept cooperation with our administration protected."
 hsm_ver_zypressen.10.c:0 "Counteroffer: cooperation, but no common ministries."
 hsm_ver_zypressen.10.e:0 "Decline; keep our existing dependent relationship."
 hsm_ver_zypressen.11.t:0 "A Crown Returns the Draft"
 hsm_ver_zypressen.11.d:0 "[From.GetName] has returned the proposed delegation of powers with an alternative. Its government offers technical cooperation and participation in practical projects, but intends to retain its own administration.\n\nThe covering note describes contracts already promised at home. Its author will have to answer for their disruption after the imperial officials have left. The dynasty appears on both sides of the correspondence; the interests represented by the two treasuries are nevertheless different.\n\nTrubach can accept the narrower compact and obtain a willing partner, or refuse the amended terms and leave the existing dependent relationship unchanged. Neither answer will turn the original proposal into a signature that was never given."
 hsm_ver_zypressen.11.a:0 "Accept autonomous cooperation on the proposed terms."
 hsm_ver_zypressen.11.b:0 "Decline the counteroffer; do not impose the ministries."
 hsm_ver_zypressen.12.t:0 "The Reply and the Appointment"
 hsm_ver_zypressen.12.d:0 "A dependent government's answer has reached the imperial chancery. The clerk places it beside the ruler's appointment, then opens a separate file for the institutional proposal. The documents concern the same country, but do different work. One records the dynastic relationship already established; the other records which additional obligations were accepted or refused. Future orders will have to respect the distinction."
 hsm_ver_zypressen.12.a:0 "File the answer without rewriting it."
 hsm_ver_zypressen.20.t:0 "Names on the Western Map"
 hsm_ver_zypressen.20.d:0 "The staff officer began with the familiar names of Aquileian realms. His colleague interrupted with the current ownership returns: several lines in the campaign plan had to be addressed to governments other than the ones printed on the old map.\n\nTrubach ordered the demands prepared against the independent owners actually holding the intended territories, or the foreign overlords of dependent governments there. Allies and our own subjects were to remain outside them. Where an agreement had already settled the frontier, there was no new enemy to manufacture. The order prepared grounds for a campaign; the army would still require a separate decision before war began."
 hsm_ver_zypressen.20.a:0 "Address the demands to the governments that exist."
 hsm_ver_zypressen.21.t:0 "Distances in the North"
 hsm_ver_zypressen.21.d:0 "The northern plans covered Cloudbury, Vedina and the routes towards the coast and islands. A quartermaster placed freight tables beside the coloured arrows. An arrow could cross a long stretch of map in an instant; the stores behind it could not.\n\nThe western settlement had made this next preparation possible. It had not removed the need to distinguish current owners, allies and dependent crowns. Trubach approved demands where an independent outside government remained, including the foreign overlords of local subjects, while leaving friendly relationships intact. The staff would prepare a campaign, not announce that the north had already been won."
 hsm_ver_zypressen.21.a:0 "Prepare the routes as carefully as the demands."
 hsm_ver_zypressen.22.t:0 "The Furnaces Beyond the Frontier"
 hsm_ver_zypressen.22.d:0 "The southern industrial reports interested Trubach as much as the military estimates. Workshops and furnaces could sustain another stage of imperial power, provided their output survived the passage of armies. The staff had been instructed to identify present owners and their overlords rather than plan against a vanished Wingbardian government.\n\nExisting dynastic crowns appeared in a different column from prospective opponents. The same land could not be treated as both a dependent obligation and an enemy possession. With the earlier theatres settled, the new demands were prepared. Whether they would require war remained a further decision."
 hsm_ver_zypressen.22.a:0 "Keep existing commitments outside the new demands."
 hsm_ver_zypressen.23.t:0 "Beyond the Marches"
 hsm_ver_zypressen.23.d:0 "The eastern plan widened as the officers laid out the returns from the marches and the principalities beyond. Each addition brought a different government, a longer route or an obligation already owed elsewhere. The emperor's claim to a continental future had become a stack of practical questions.\n\nDemands would follow the actual independent owners of the intended territories and the foreign overlords of local subjects. Allied governments and our own dependencies would not be attacked by administrative convenience. Trubach approved the preparations only after the previous theatres had been settled. Even now, approval of a campaign plan was not a declaration of war."
 hsm_ver_zypressen.23.a:0 "The next frontier is a task, not a proclamation."
