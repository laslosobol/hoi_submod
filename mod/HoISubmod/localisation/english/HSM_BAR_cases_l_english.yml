 HSM_BAR_study_phylactery:0 "Study: A Vessel Is Not a Corpse"
 HSM_BAR_study_phylactery_desc:0 "BR-009 / isolation test. The recovered vessel was enclosed twice, using different materials. The instruments registered a disturbance at the outer enclosure on both occasions. The inner readings were inconsistent and have not been averaged.\n\nOlcha proposes further work on the relation between the two boundaries. Kalk's reply is attached: her office obtained the vessel to end an uncertainty, not to manufacture a second one. The original inventory contains a personal name beneath an erased entry. Permission to inspect that line is held by the director alone.\n\n$HSM_BAR_case_study_terms_tt$"
