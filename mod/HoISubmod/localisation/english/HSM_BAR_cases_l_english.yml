 hsm_bar_cases.30.t:0 "The Crate Nobody Saw"
 hsm_bar_cases.30.d:0 "SOUTHERN OFFICE / closing memorandum\nThe first seller referred the investigator to a second; the second had never seen the vessel and named the first as his source. An inspection of the proposed storehouse found no crate matching either description.\n\nKalk has suspended the purchase. The courier's last letter contains a third address in another hand. It remains in the file, marked unverified. The name beneath it has been removed from this copy. No further funds are to be released without a witness independent of the sellers."
 hsm_bar_cases.30.a:0 "Insufficient evidence is still an honest finding."
