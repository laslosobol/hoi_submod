 HSM_BAR_study_crown:0 "Study: The Crown Behind Glass"
 HSM_BAR_study_crown_desc:0 "BR-007 / observation through the screen. No subject wore the recovered crown. During the first session, however, the duty officer repeated a command that had not been spoken in the room. He recalled hearing it from his supervisor; the supervisor was absent.\n\nWrona introduced a second confirmation channel and changed the staff rotation. The incident did not recur during the recorded trials. Whether the interruption broke an influence or merely its opportunity remains disputed. The training office requests a restricted drill based on these findings. Krzemien recommends keeping the entire procedure inside the vault staff.\n\n$HSM_BAR_case_study_terms_tt$"
