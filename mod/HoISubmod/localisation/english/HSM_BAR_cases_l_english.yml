 HSM_BAR_study_reactor:0 "Study: A Reactor, Not a Revelation"
 HSM_BAR_study_reactor_desc:0 "BR-006 / shutdown comparison. The operating logs show a rise in coolant temperature before the protective circuit registered a disturbance. One page records the reverse order. Its ink and paper match the rest of the book; the shift named on it denies making the entry.\n\nThe engineers can hold a higher load if the two circuits are watched separately. Olcha recommends the opposite: reduce the load until each shutdown has been repeated with an independent recorder. The disputed page is filed with the lower-shaft material, not in the plant's public maintenance log.\n\n$HSM_BAR_case_study_terms_tt$"
