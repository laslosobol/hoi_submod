 HSM_BAR_study_marsh:0 "Study: The Lamps Over the Marsh"
 HSM_BAR_study_marsh_desc:0 "BR-016 / purchased water samples. The reported lights were reproduced with the same sediment, water and temperature. They ceased when the vessel was ventilated. A courier brought a second sample from the original bank; it behaved in the same way. The ferryman's account is retained, but does not require the presence of a traveller beneath the water.\n\nThe medical section recommends revised storage and drainage rules. A smaller circulation would confine the advice to field hospitals. Kalk asks that the witnesses receive an explanation before anyone publishes a correction of their story.\n\n$HSM_BAR_case_study_terms_tt$"
