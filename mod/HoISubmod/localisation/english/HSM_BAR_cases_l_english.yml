 HSM_BAR_study_sombra:0 "Study: Evidence Against the Returning King"
 HSM_BAR_study_sombra_desc:0 "BR-014 / crystal testimony. The authenticated reports describe orders obeyed before their recipients could explain why. Later accounts use the same language for ordinary fear, making the two difficult to separate. The section has retained only incidents with a second source.\n\nA warning drill can now be written for formations likely to encounter such influence. The alternative is a smaller programme for shelters and civilian recovery. Wrona has forbidden presenting either as immunity. The witness who supplied the final comparison asked that the report never be read aloud in his presence.\n\n$HSM_BAR_case_study_terms_tt$"
