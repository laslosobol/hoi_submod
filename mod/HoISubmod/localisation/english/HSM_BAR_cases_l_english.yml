 HSM_BAR_study_entity:0 "Study: A Reply Beneath the Floor"
 HSM_BAR_study_entity_desc:0 "BR-003 / listening post. On the second night two shafts carried the same sequence of knocks. The third receiver registered a reply to a signal its operator had not yet sent. His first explanation was a crossed wire. The wire was cut; the reply continued.\n\nOlcha has struck the word echo from the report, but refuses to replace it with a name. Krzemien asks that the next watch consist of volunteers who have not read the transcript from BR-«REDACTED». Their instructions must not include the phrase heard at the end of the recording.\n\n$HSM_BAR_case_study_terms_tt$"
