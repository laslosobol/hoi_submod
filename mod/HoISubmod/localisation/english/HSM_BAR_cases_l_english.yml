 HSM_BAR_study_rosa:0 "Study: The Author and the Transformation"
 HSM_BAR_study_rosa_desc:0 "BR-012 / provenance report. Several ritual pages acquired under different names share an identical correction. The mistake in the first copy became an instruction in the third. Kalk warns that a convincing signature proves less than the chain by which a text reached us.\n\nThe laboratory has completed its comparison without repeating the ritual. Olcha requests permission to circulate the verification method among selected researchers. Kalk prefers to keep it with the analysts tracing the suppliers. The names of two intermediaries have been removed; both remain under observation.\n\n$HSM_BAR_case_study_terms_tt$"
