 HSM_BAR_study_titan:0 "Study: The Titan's Joints"
 HSM_BAR_study_titan_desc:0 "BR-002 / comparison of load diagrams. Three surviving drawings disagree about the central joint. Removing the disputed line makes the load calculation impossible; restoring it gives the same displacement recorded on the survey markers. The drawing's author is not identified.\n\nWrona's team found no matching part in the accessible workings. Her final note asks whether the drawing describes what was built, or what someone expected to find below it. The lower survey sheet is retained in a separate envelope. Production engineers have requested the corrected tables.\n\n$HSM_BAR_case_study_terms_tt$"
