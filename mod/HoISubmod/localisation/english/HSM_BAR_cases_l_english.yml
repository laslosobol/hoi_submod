 HSM_BAR_study_echo:0 "Study: The Shaft That Answered Twice"
 HSM_BAR_study_echo_desc:0 "BR-015 / closure of the shaft inquiry. The second voice followed the whistle by the same interval as it followed speech. Behind the damaged partition, the surveyors found a ventilation chamber omitted from every available plan. Opening its inspection hatch changed the delay exactly as the calculation predicted.\n\nThe foreman asked whether the work crew had invented the voice. Krzemien answered that they had reported what they heard. The corrected drawings may be used to reopen the workings, or retained for a smaller programme of shelter ventilation. No further unexplained response was recorded.\n\n$HSM_BAR_case_study_terms_tt$"
