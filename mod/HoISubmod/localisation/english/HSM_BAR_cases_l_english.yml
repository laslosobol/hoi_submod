 HSM_BAR_study_chalice:0 "Study: An Inventory With a Seal"
 HSM_BAR_study_chalice_desc:0 "BR-008 / vessel examination. The trace inside the recovered Chalice survived rinsing with the control solution. A sealed slide taken from it darkened when the vessel was brought into the adjacent room; a second slide did not. The sequence was repeated behind a screen.\n\nKrzemien requests permission to adapt the detection method for contaminated medical stores. No administration to a living subject is authorized. The northern office recommends a sealed transport protocol instead. The annex explaining why both slides were retained has been removed from the circulating copy.\n\n$HSM_BAR_case_study_terms_tt$"
