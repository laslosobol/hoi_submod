 HSM_BAR_study_plants:0 "Study: Growth Under Observation"
 HSM_BAR_study_plants_desc:0 "BR-005 / herbarium note. Most collected irritants behaved as the agricultural handbook predicted. Sample V-6 did not: its new growth followed the shaded side of the enclosure after the lamp was moved. The repeat observation is sealed with the original sketch; the field collector's name is withheld.\n\nKrzemien's handling rules have already prevented another contact injury. The agronomist proposes a monitored plot for reclaiming exhausted ground. Wrona will agree only if the water leaving it is collected separately. No cuttings may leave the enclosure until the director signs a disposition.\n\n$HSM_BAR_case_study_terms_tt$"
