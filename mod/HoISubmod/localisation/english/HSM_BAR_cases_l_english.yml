 HSM_BAR_study_darkheart:0 "Study: The Counterfeit Heart"
 HSM_BAR_study_darkheart_desc:0 "BR-010 / interference record. The captured Dark Heart produced a repeating disturbance in the receiver circuit. Moving the control crystal did not change it. Reversing the test leads did; the operator also reported hearing a second set of footsteps. No second observer confirmed that report.\n\nThe disturbance can be recognized before the receiver becomes unusable. Analysts request a comparison rig for hostile transmissions. Wrona recommends retaining only the warning threshold. The operator's personal account is sealed separately from the instrument log.\n\n$HSM_BAR_case_study_terms_tt$"
