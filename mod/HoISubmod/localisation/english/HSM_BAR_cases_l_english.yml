 HSM_BAR_study_compass:0 "Study: A Needle With a Memory"
 HSM_BAR_study_compass_desc:0 "BR-017 / blinded route trial. When the packing crate was moved without the carrier's knowledge, the needle followed it. The fitting beneath the lid had retained a magnetic charge. Removing it restored the control reading. No route to a buried sanctuary was reproduced.\n\nThe merchant's first sketch contains the crate; the later copies omit it. Wrona has kept all of them. Survey teams could use the resulting calibration drill, while the planning section requests the blinded verification procedure for its own maps. The seller's identity remains withheld pending the fraud inquiry.\n\n$HSM_BAR_case_study_terms_tt$"
