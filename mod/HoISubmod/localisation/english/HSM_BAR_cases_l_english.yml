l_english:
 HSM_BAR_cases_studies:0 "Scientific Complex: Case Studies"
 HSM_BAR_cases_studies_desc:0 "Krzemien's researchers compare the samples with Olcha's notes. Wrona insists that every conclusion retain its original witness statement: the laboratory must answer to those who will return to the site."
 HSM_BAR_cases_containment_knowledge_tt:0 "Completed studies: Living Stone, the underground response, and the naturally explained shaft echo."
 HSM_BAR_cases_forensics_knowledge_tt:0 "Additional completed studies: the Titan's joints and the misleading compass."
 HSM_BAR_cases_suppression_knowledge_tt:0 "Additional completed study: the observed boundary of Janosik's amulet. This supports a local barrier, not proven universal suppression."
 HSM_BAR_cases_lead_confirmed_tt:0 "A checked lead unlocks a targeted operation against the present custodian. La Resistance uses the intelligence route; without it an expedition is available. The object has not been acquired."
 HSM_BAR_cases_samples_received_tt:0 "Field-check materials have arrived. A separate Scientific Complex study is now available; no scientific conclusion or bonus has yet been awarded."
 HSM_BAR_cases_review_ready_tt:0 "Complete the Living Stone and shaft-echo studies, then settle the echo case's disposition."
 HSM_BAR_cases_reserve:0 "Use the findings in our internal safeguards."
 HSM_BAR_cases_later:0 "Defer the application decision."
 HSM_BAR_cases_local:0 "Local Office: Incoming Reports"
 HSM_BAR_cases_local_desc:0 "Wrona recruits teams familiar with the old workings and surviving villages. Their inhabitants remember the Pentarchy's orders better than the names of its experiments. Sometimes an inquiry begins with a promise not to force them back."
 HSM_BAR_cases_equus:0 "Equus: Field Investigations"
 HSM_BAR_cases_equus_desc:0 "Here, wonders are not always hidden. The harder question is who can distinguish an old protection from a threat wearing a familiar face. Marta asks the teams to seek witnesses before choosing enemies."
 HSM_BAR_cases_griffonia:0 "Central Griffonia: Source Verification"
 HSM_BAR_cases_griffonia_desc:0 "University collections contain pages bearing marks found in Olcha's notebooks. Some archivists call them copying errors. Others ask too insistently who has been reading them."
 HSM_BAR_cases_north:0 "Northern Office: Restricted Routes"
 HSM_BAR_cases_north_desc:0 "Irma Kalk keeps a map of places from which guides have stopped returning. Reports of rituals, illnesses and old graves remain separate: a shared fear does not make them the same threat."
 HSM_BAR_cases_riverlands:0 "Riverlands: Field Research"
 HSM_BAR_cases_riverlands_desc:0 "Water samples travel to Barrad as assistance to the recovery commission. That is not quite a lie. If the marsh lights have an ordinary cause, understanding it may prove more useful than another dangerous relic."
 HSM_BAR_cases_zebrica:0 "Zebrica: Caravan Reports"
 HSM_BAR_cases_zebrica_desc:0 "Each account changes with its translator's language. The southern team keeps guides' names in a separate notebook and will not pay for a marvel until it finds someone who witnessed it without an intermediary."
 HSM_BAR_rumor_echo:0 "The second voice in the shaft"
 HSM_BAR_rumor_echo_desc:0 "A repair crew reports that a deserted ventilation shaft answers questions. The local office will repeat the sound measurements before labelling the reply intelligent."
 HSM_BAR_rumor_compass:0 "The needle that refused north"
 HSM_BAR_rumor_compass_desc:0 "A merchant offers a compass that supposedly points towards a buried sanctuary. Inspect its packing, repeat the route and retain a control instrument."
 HSM_BAR_rumor_marsh:0 "Lamps without a ferryman"
 HSM_BAR_rumor_marsh_desc:0 "Witnesses describe lights moving over the river marsh. The ferryman will not cross after sunset. Obtain water and sediment from the bank he identified, and take his statement before showing him the other reports."
 HSM_BAR_rumor_reactor:0 "The installed reactor's missing log"
 HSM_BAR_rumor_reactor_desc:0 "A missing page from the reactor's operating log has been found among the laboratory papers. The engineer named on it denies signing the entry. Compare the original instruments and the shutdown record."
 HSM_BAR_rumor_sombra:0 "The returning king in the crystal reports"
 HSM_BAR_rumor_sombra_desc:0 "The Crystal Empire's reports contain a name the dispatch clerk thought belonged to a closed history. Establish who wrote the first account and whether the later copies add anything beyond it."
 HSM_BAR_rumor_darkheart:0 "A second heart on the inventory"
 HSM_BAR_rumor_darkheart_desc:0 "A construction record refers to a second heart. The phrase was first dismissed as a metaphor; the inventory assigns it a separate custodian. Trace the entry to its source."
 HSM_BAR_rumor_grover:0 "An emperor entered twice"
 HSM_BAR_rumor_grover_desc:0 "Two accounts place the emperor's name beside incompatible dates. The Yale material may establish where the copying began. Obtain the earliest record before repeating the claim."
 HSM_BAR_rumor_herald:0 "A witness to the vault's light"
 HSM_BAR_rumor_herald_desc:0 "The same vault appears in an investigator's notes and a witness's prayer. Both describe light, but neither identifies the other's source. Locate the witness before the account becomes a sermon."
 HSM_BAR_rumor_rosa:0 "Magehold's changing signatures"
 HSM_BAR_rumor_rosa_desc:0 "A ritual page carries a familiar signature over unfamiliar corrections. The northern section has identified someone who handled an earlier copy. Arrange an interview without naming the page's present holder."
 HSM_BAR_rumor_chalice:0 "The expedition's missing vessel"
 HSM_BAR_rumor_chalice_desc:0 "An expedition inventory lists a vessel omitted from the public report. A witness remembers who sealed its container. Follow that chain before asking to inspect the contents."
 HSM_BAR_rumor_phylactery:0 "A repository after the ritual"
 HSM_BAR_rumor_phylactery_desc:0 "One storehouse entry was carried forward after the ritual while the adjacent entries were crossed out. Establish whether its custodian still has the vessel and why the inventory treats it differently."
 HSM_BAR_rumor_zebrica:0 "Three invoices for the same impossible relic"
 HSM_BAR_rumor_zebrica_desc:0 "Three traders offer a relic said to cross sealed walls. Each describes the container differently. Before authorizing a purchase, locate someone who saw it opened."
 HSM_BAR_rumor_crown_equus:0 "A Crown in the Custodians' Reports"
 HSM_BAR_rumor_crown_equus_desc:0 "A discovered crown has acquired an uneasy reputation. The office needs its first witness, its present custodian and an account of what happened between them. Inquiries concerning a reigning bearer must remain observational."
 HSM_BAR_rumor_crown_griffonia:0 "A Crown in the Custodians' Reports"
 HSM_BAR_rumor_crown_griffonia_desc:0 "A discovered crown has acquired an uneasy reputation. The office needs its first witness, its present custodian and an account of what happened between them. Inquiries concerning a reigning bearer must remain observational."
 HSM_BAR_rumor_crown_zebrica:0 "A Crown in the Custodians' Reports"
 HSM_BAR_rumor_crown_zebrica_desc:0 "A discovered crown has acquired an uneasy reputation. The office needs its first witness, its present custodian and an account of what happened between them. Inquiries concerning a reigning bearer must remain observational."
 HSM_BAR_study_rock:0 "Study: Living Stone"
 HSM_BAR_study_rock_desc:0 "BR-001 / pressure trial. The fragment moved against the load on the fourth repetition, but only while its uncut face pointed towards the temple. The control grain remained still. Olcha ordered the chamber turned; the movement stopped. No one was permitted to turn it back until the shift changed.\n\nThe excavation plan now carries a boundary absent from Asinti's surviving drawings. Beside it, a different hand has written: Do not build a second entrance. The signature has been removed from this copy.\n\n$HSM_BAR_case_study_terms_tt$"
