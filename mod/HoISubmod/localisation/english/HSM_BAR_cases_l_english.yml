 HSM_BAR_study_grover:0 "Study: Two Dates for One Emperor"
 HSM_BAR_study_grover_desc:0 "BR-011 / identity commission. The recovered records separate accounts written at the time from those copied after the emperor's name became politically useful. Two supposed eyewitnesses repeat the same damaged sentence, including the missing word. Their statements cannot be treated as independent.\n\nWrona recommends teaching field officers how to separate a person's identity from a claimant's history. Olcha asks that the conflicting chronology remain in the restricted archive. The commission has made no finding about physical custody. The appendix concerning the Yale material requires a separate signature.\n\n$HSM_BAR_case_study_terms_tt$"
