 HSM_BAR_study_herald:0 "Study: Light Without a Verdict"
 HSM_BAR_study_herald_desc:0 "BR-013 / exposure comparison. The surviving testimony agrees that there was light; it disagrees about its source and the order of events. One account describes a shadow where the recording surface was overexposed. The laboratory cannot determine whether these observations concern the same interval.\n\nThe comparison has exposed faults in our own instruments. A revised calibration method is ready for trials. Krzemien asks that the protective screens be retained even if the new readings seem reassuring. The witness list is held in the original office and is not reproduced here.\n\n$HSM_BAR_case_study_terms_tt$"
