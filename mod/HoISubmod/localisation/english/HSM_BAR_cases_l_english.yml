 HSM_BAR_study_amulet:0 "Study: Janosik's Protective Boundary"
 HSM_BAR_study_amulet_desc:0 "BR-004 / boundary register. The oldest witness remembered the guardian's warning, but not the words he used. The second witness remembered the words and denied hearing a warning. Both marked the same bend in the track without seeing the other's map.\n\nThe surviving amulet notes and the present survey agree at that bend. Elsewhere, they do not. Krzemien has forbidden moving the villagers' boundary markers for the sake of a cleaner experiment. A reduced trial line can be laid on abandoned ground; maintaining the existing protection would require a permanent local liaison.\n\n$HSM_BAR_case_study_terms_tt$"
