l_english:
 hsm_ver_force.1.t:0 "The Neighbour After the War"
 hsm_ver_force.1.d:0 "The envoy from [From.GetNameDef] waited while Avian's ministers examined the proposal. Victory over the rival House had changed the balance beyond our border. It had not supplied an answer from this side of it.\n\nThe proposed accord would recognise a boundary to the victor's ambitions: a pact of non-aggression, leaving Avian to govern itself. One minister welcomed the chance to give the frontier a quieter future. Another asked what confidence could be placed in assurances offered by a government still arranging the consequences of its war. Neither question could be settled by the envoy's account of the victory.\n\nOur answer must reflect the undertaking we are prepared to accept. We may sign the pact or decline it. The envoy has brought a place for Avian's signature, and must allow us to leave it empty."
 hsm_ver_force.1.a:0 "Sign the non-aggression accord."
 hsm_ver_force.1.b:0 "Decline the accord."
 hsm_ver_force.2.t:0 "Where Victory Stops"
 hsm_ver_force.2.d:0 "Avian has accepted the non-aggression accord. The officer delivering the reply had expected a celebration; instead, the first question concerned the instructions to be sent to the frontier. The answer now mattered on both sides.\n\nAn agreement with an independent neighbour is a different achievement from a defeated position. Avian has undertaken to respect the pact in its own name, and expects the same restraint from us. Its government, lands and future remain its own.\n\nThe reply is sent to the officers responsible for the border. They have spent the campaign learning how to press an advantage. The peace now asks them to recognise where that advantage ends."
 hsm_ver_force.2.a:0 "Honour the boundary we agreed."
 hsm_ver_force.3.t:0 "Avian's Own Answer"
 hsm_ver_force.3.d:0 "Avian has declined the proposed accord. The envoy returns with an unsigned copy and the uncomfortable task of explaining that the neighbouring government understood the offer perfectly well. It chose not to accept it.\n\nAt court, someone asks whether the refusal is intended as an insult. The envoy can find no such declaration in the reply. Avian has made no new commitment; that leaves a diplomatic uncertainty, not another victory waiting to be collected.\n\nThe work left by our own war remains. Estates need decisions, troops need orders and the inhabitants of the defeated districts need to know how they will be governed. Avian's answer does not relieve us of any of those responsibilities."
 hsm_ver_force.3.a:0 "Acknowledge Avian's decision."

 HSM_VER_FORCE_avian_offer_tt:0 "Opens a choice: §Ypropose a non-aggression accord§! to an independent, peaceful Avian, or §Ymake no commitment§!. Only an accepted offer creates a pact. The parallel military continuation remains available, but a signed pact must first be ended through normal diplomacy, and shared faction membership must also end. Neither choice blocks the domestic settlement."

 HSM_ERI_FORCE_avian_claim:0 "The Third Banner"
 HSM_ERI_FORCE_avian_claim_desc:0 "Avian's council has chosen true neutrality and rejected the work between the giants. Vincent's settlement with Eyrie leaves that frontier outside the common country. His commanders propose a campaign to bring Avian into the same realm. This is a new hostile demand, not a right secretly awarded by a family treaty. Existing pacts must be honoured or ended openly."
 HSM_EYR_FORCE_avian_claim:0 "No Unfinished Frontier"
 HSM_EYR_FORCE_avian_claim_desc:0 "Avian has chosen true neutrality rather than Intergigantes. Iovinus's officers regard its frontier as the last gap in Verenia; his civilian advisers hear the dangerous promise of one more campaign before peace. The duke will demand incorporation openly. That demand does not erase the settlement with Erie or the obligations of an existing pact."
 HSM_ERI_FORCE_avian_articles:0 "The Avian Articles"
 HSM_ERI_FORCE_avian_articles_desc:0 "An Avian registrar arrives with the old assessments and a list of families whose property has already been promised to two different officers. Vincent has heard this dispute before. The third House must receive a settlement it can actually live under: protected local courts and property, or a commission for which the duke accepts direct responsibility. Victory does not choose between them."
 HSM_EYR_FORCE_avian_articles:0 "Orders Beyond the Surrender"
 HSM_EYR_FORCE_avian_articles_desc:0 "The garrison can secure a bridge; it cannot settle every dispute carried across it. Avian's clerks ask who will hear appeals, pay the workshops and release the requisitioned wagons. Iovinus must decide whether local institutions will bind his officers or a permanent commission will answer for them. A subject government asked to surrender its remaining powers will receive guarantees, not a second ultimatum disguised as consent."
 HSM_ERI_FORCE_avian_integration:0 "A Third Seat at the Table"
 HSM_ERI_FORCE_avian_integration_desc:0 "The first Avian accounts have survived comparison with the treasury's ledgers. Workshops have contracts and the courts know where their decisions must be sent. Vincent can now abolish the provisional frontier and give these obligations the force of ordinary government. The third seat at his table represents inhabitants who must be governed, not merely another defeated name."
 HSM_EYR_FORCE_avian_integration:0 "A Province, Not a Garrison"
 HSM_EYR_FORCE_avian_integration_desc:0 "The last temporary supply office is ready to become a permanent workshop. Iovinus receives its estimate alongside the register of Avian petitions. The soldiers have done what a campaign can do; incorporation now rests on pay, law and repair. End the provisional administration without pretending that the settlement's obligations end with it."
 HSM_VER_FORCE_avian_peace_tt:0 "No active non-aggression pact or shared faction with Avian, no unanswered accord, and normal diplomatic rules permit a declaration. §YEnd any existing pact or shared faction through normal diplomacy first§!; this focus does not cancel them or declare war."
 HSM_VER_FORCE_avian_victory_tt:0 "Our ducal charter, military settlement or united Verenian government remains valid. We fought independent Avian, our side defeated it, and the peace conference awarded §Yits original state 470§! to us or our own defeated Avian subject. Both are at peace, the land is fully controlled by its owner, and 30 days have passed since the conference. Occupation, gifts and another overlord's subjects do not qualify."
 HSM_VER_FORCE_avian_terms_tt:0 "Spends §Y75 political power§! once to open the postwar articles. Annexed Avian allows a choice between a local charter and a ducal commission. Our defeated Avian subject instead receives a chartered integration offer and may refuse; its additional holdings do not block the offer. Ratification starts a §Y90-day transition§!, after which the final integration focus becomes available. Interrupted delivery can recover without charging again."
 HSM_VER_FORCE_avian_articles_tt:0 "The Avian articles have been ratified and their 90-day transition has elapsed. A surviving Avian must still be our own defeated subject and have explicitly accepted integration under the same overlord. Integration has not already been completed."
 HSM_VER_FORCE_avian_integration_tt:0 "Integrates a consenting, defeated Avian subject, including its troops and existing holdings, or completes administration of territory already annexed at the conference. §YOnly Avian's original state 470 gains our core§!. Adds one civilian factory there and replaces the transitional burden with the chosen charter or commission. No territory is taken from independent countries or another overlord's subjects."
 HSM_VER_FORCE_avian_subject_consent_tt:0 "Accepts eventual annexation by our current overlord, including our armed forces and additional holdings, under binding local guarantees. The overlord must still complete the 90-day transition and final focus. Only state 470 is cored. Refusal retains our present subject status and blocks this scripted annexation; ordinary subject integration remains separate."
 HSM_VER_FORCE_AVI_transition:0 "Avian Provisional Administration"
 HSM_VER_FORCE_AVI_transition_desc:0 "Appeals, public accounts and requisitions must be reconciled before the provisional frontier can disappear. The work consumes officials and construction capacity until incorporation is completed."
 HSM_VER_FORCE_AVI_charter:0 "The Avian District Charter"
 HSM_VER_FORCE_AVI_charter_desc:0 "Local courts and workshop contracts survive incorporation. They make rebuilding dependable, but petitions and appeals remain obligations the central government cannot simply dismiss."
 HSM_VER_FORCE_AVI_commission:0 "The Avian Ducal Commission"
 HSM_VER_FORCE_AVI_commission_desc:0 "A single commission coordinates workshops and military supply. Its orders are effective; its distance from the inhabitants remains a source of resentment."
 hsm_ver_force.4.t:0 "An Unsent Letter"
 hsm_ver_force.4.d:0 "Two drafts lie before [Root.GetLeader]. The first offers Avian a frontier neither side will cross in arms. The second contains no assurance at all.\n\nThe quartermaster favours the first: his wagons need repairs, not another destination. An officer points to the map and asks whether the three Houses are ever to share one government. Neither pretends that the two drafts mean the same thing.\n\nA promise to Avian must be a promise we intend to keep. We can send it, or leave the neighbouring court without that undertaking while we settle our own country."
 hsm_ver_force.4.a:0 "Send the non-aggression proposal."
 hsm_ver_force.4.b:0 "Make no commitment about the frontier."
 hsm_ver_force.10.t:0 "A Claim at Our Door"
 hsm_ver_force.10.d:0 "The demand from [From.GetNameDef] was delivered with a map on which the frontier had already been rubbed out. The envoy spoke of ending the quarrel of the Houses. An Avian official asked why a quarrel supposedly ended elsewhere now required the surrender of our government.\n\nNo declaration of war accompanied the document. There is still time to move supplies, speak to allies and decide what can be defended. At the guardhouse, however, the distinction between a demand and the fighting expected to follow it offers little comfort."
 hsm_ver_force.10.a:0 "We have not surrendered our country."
 hsm_ver_force.11.t:0 "The Charter and the Remaining Seal"
 hsm_ver_force.11.d:0 "The peace left our government subordinate to [From.GetNameDef], but it did not extinguish it. Now an integration draft asks us to surrender the remaining seal of state, our forces and the administration of our holdings.\n\nThe draft preserves local courts, existing property titles and the right to appeal requisitions. The victors will pay for a common administration and public works; they must also accept that these guarantees bind their own officers. The clerks have insisted that any outlying holdings be listed openly in the instrument, not acquired as a surprise annex to it.\n\nWe may sign, or remain a subject under the present terms. The latter offers less freedom than our old independence, but the signature is still ours to withhold."
 hsm_ver_force.11.a:0 "Sign, with the local guarantees intact."
 hsm_ver_force.11.b:0 "Retain our government under the existing peace."
 hsm_ver_force.12.t:0 "Who Hears an Avian Petition?"
 hsm_ver_force.12.d:0 "A confiscated mill has produced three files: a military receipt, an old property deed and a petition from the workers. The officer who took it asks for a decision from the capital. The clerk carrying the petition asks whether the local court still exists.\n\n[Root.GetLeader] cannot answer both by extending the provisional administration. A district charter would preserve local courts and contracts, with appeals binding on the victorious officials. A ducal commission would organise industry and supply directly, accepting the resentment of inhabitants whose last familiar authority had disappeared.\n\nThe choice concerns the third House, but every district will hear what we decide."
 hsm_ver_force.12.a:0 "Recognise the courts and bind our officers to them."
 hsm_ver_force.12.b:0 "Place administration and supply under one commission."
 hsm_ver_force.13.t:0 "The Seal Stays in Avian"
 hsm_ver_force.13.d:0 "The Avian government has refused the integration articles. Its reply acknowledges the peace and its subordinate position, but will not surrender the remaining seal of state.\n\nOur officials withdraw the incorporation timetable. The refusal neither restores independence nor authorises us to pretend that a signature was given. Avian remains our subject under the existing terms. Any later incorporation through the ordinary relationship between overlord and subject will have to establish its own authority; this unsigned charter provides none."
 hsm_ver_force.13.a:0 "Record the refusal. No signature, no chartered annexation."
 hsm_ver_force.14.t:0 "The First Ordinary Month"
 hsm_ver_force.14.d_charter:0 "The Avian workshop sends its first regular invoice. Beside it lies a judgement requiring one of our officers to return a requisitioned wagon. Both documents follow the same postal route to the treasury.\n\nA secretary asks whether the judgement should receive special attention. [Root.GetLeader] leaves it with the ordinary accounts. The charter would mean very little if each unfavourable decision required another act of personal generosity.\n\nThe frontier is gone. The disagreement remains, but it now has somewhere other than a battlefield to go."
 hsm_ver_force.14.d_commission:0 "The commission reports that Avian's workshop has delivered its first regular order. The supply service is pleased: one set of schedules now connects the three former frontiers.\n\nThe next envelope contains a complaint about the commission itself. Local representatives have had to petition the capital for permission to challenge an official appointed by it. [Root.GetLeader] sets the two reports beside one another.\n\nThe new administration works. That does not mean the inhabitants have mistaken efficiency for their own voice. Both reports belong in the account of this victory."
 hsm_ver_force.14.a:0 "Keep both the achievement and the obligation on record."

 HSM_ERI_FORCE_the_price_of_victory:0 "The Price of Victory"
 HSM_ERI_FORCE_the_price_of_victory_desc:0 "Vincent's supporters speak readily of the inheritance victory will bring. They speak less often of the farms that must sustain it and the promises the duke will owe afterwards. Choosing this campaign means abandoning the negotiated settlement with Eyrie: Verenia is to be united by force, and Erie will have to govern the consequences. Officers, suppliers and patrons must state what they expect before the first regiment marches."
 HSM_ERI_FORCE_promises_in_writing:0 "Promises in Writing"
 HSM_ERI_FORCE_promises_in_writing_desc:0 "A campaign draws on credit as well as courage. Carriers advance their wagons, suppliers reserve their stock, and influential households expect their service to count when rewards are considered. Vincent will require clear undertakings and a supply service capable of keeping them. Loyalty deserves an answer; it cannot be allowed to write its own unlimited claim upon the defeated."
 HSM_ERI_FORCE_not_a_dowry:0 "Not a Dowry"
 HSM_ERI_FORCE_not_a_dowry_desc:0 "Rosaline Erie of Bantry has discovered that her name makes a convenient ending to other people's speeches. A union between Houses, they suggest, could be made complete through her. She intends to speak for herself. Vincent must hear her objection before anyone turns a personal correspondence into a marriage settlement or presents another griffon's future as part of the spoils."
 HSM_ERI_FORCE_final_ultimatum:0 "The Final Ultimatum"
 HSM_ERI_FORCE_final_ultimatum_desc:0 "Vincent will put Erie's claim behind a final demand upon Eyrie. The document cannot make his inheritance more certain than Iovinus's, but it can prepare the grounds on which he intends to fight. Existing promises of peace must still be honoured. Sending the demand leaves the decision to begin a war, and responsibility for that decision, with the duke."
 HSM_ERI_FORCE_terms_for_the_defeated:0 "Terms for the Defeated"
 HSM_ERI_FORCE_terms_for_the_defeated_desc:0 "The military result is settled. Now the people of the defeated districts must discover what Vincent's victory means at a workshop door or in a dispute over a field. Local charters could protect rights his own followers must respect. Ducal commissioners could instead organise the settlement under his direct authority. Either course will make demands that a proclamation of triumph can conceal only briefly."
 HSM_ERI_FORCE_district_charters:0 "The Districts' Own Rights"
 HSM_ERI_FORCE_district_charters_desc:0 "A promise of local rights must be usable by someone who opposed Erie. Let the districts retain recognised procedures for their property, public works and complaints, with obligations the duke's officers must also observe. Building through these institutions will take patience. It will give a town reason to repair its future without first finding a patron at Vincent's court."
 HSM_ERI_FORCE_ducal_commissioners:0 "The Duke's Commissioners"
 HSM_ERI_FORCE_ducal_commissioners_desc:0 "Vincent will place reconstruction under commissioners who answer directly to him. They can bring scattered industrial work into a common programme and make orders reach their destination quickly. Their authority will also make every intrusion the duke's own. The defeated districts may comply without feeling represented, and efficiency will have to bear the weight of that distinction."
 HSM_ERI_FORCE_the_first_petition:0 "The First Petition"
 HSM_ERI_FORCE_the_first_petition_desc:0 "A family from the defeated districts claims an estate sought by one of Vincent's wartime patrons. The patron can prove his service; the family can produce evidence that its property was never his to receive. The first difficult hearing will reveal whether the new order can distinguish a debt owed by the duke from a debt imposed on someone else."
 HSM_ERI_FORCE_reconstruction_contracts:0 "Work Beyond the Victory Parade"
 HSM_ERI_FORCE_reconstruction_contracts_desc:0 "The estate decision has travelled further than its authors expected. Builders and workshop owners now judge new offers against what they have learned about the settlement. Put civilian investment behind the reconstruction contracts and give industrial specialists work worth improving. A durable peace requires people to risk their savings on something other than the favour of the next victorious officer."
 HSM_ERI_FORCE_a_regular_levy:0 "A Levy That Can Be Maintained"
 HSM_ERI_FORCE_a_regular_levy_desc:0 "Wartime service cannot remain a succession of personal bargains. Establish regular training and reliable equipment for the troops, with obligations that can be understood beyond a patron's household. The men who fought for Erie need to know what their service now requires. The districts expected to sustain them need an answer more definite than the continuation of an emergency."
 HSM_ERI_FORCE_the_third_house:0 "Reconcile the Civil Registers"
 HSM_ERI_FORCE_the_third_house_desc:0 "The victorious court cannot govern two duchies from incompatible tax rolls and contradictory property registers. Surveyors, clerks and engineers will reconcile the records before the new administration claims the right to speak for every district."
 HSM_ERI_FORCE_a_bound_duke:0 "A Duke Bound by His Word"
 HSM_ERI_FORCE_a_bound_duke_desc:0 "Vincent will make the district guarantees binding upon his own rule. If he protected his patron's estate award, that exception must now be withdrawn and the claim returned to an evidentiary hearing. Where he already upheld the hearing, its principle must endure beyond one case. The charters can become the foundation of his settlement only if they reach the hand that signed them."
 HSM_ERI_FORCE_a_single_chancery:0 "A Single Chancery"
 HSM_ERI_FORCE_a_single_chancery_desc:0 "Bring the commissioners into a lasting ducal administration. Industry and the army will answer through a common chain, giving Vincent greater power to carry his decisions through. The estate judgement already made will remain part of that order. Central authority can protect a fair hearing or preserve a patron's advantage; it makes the duke responsible for whichever precedent he keeps."
 HSM_ERI_FORCE_inheritance_without_feud:0 "What the Next Generation Receives"
 HSM_ERI_FORCE_inheritance_without_feud_desc:0 "The children growing up under Vincent's settlement will inherit more than the story of a battle. They will inherit the answer given to a dispossessed family, the limits placed on a supporter and the habits of the offices that govern them. Let the old military rivalry end without pretending that victory has erased its consequences or decided Avian's future."

 HSM_ERI_FORCE_war_obligations:0 "The Obligations of the Campaign"
 HSM_ERI_FORCE_war_obligations_desc:0 "Clear commitments to suppliers and supporters make mobilisation and planning faster. Maintaining them limits Vincent's political freedom: the campaign consumes promises as surely as provisions, and those who provide either expect to be remembered."
 HSM_ERI_FORCE_defeated_rights:0 "Rights in Defeat"
 HSM_ERI_FORCE_defeated_rights_desc:0 "Local guarantees give the defeated districts grounds to trust reconstruction and resume building. Respecting their rights strengthens stability at the cost of some ducal freedom of action. These protections must withstand demands from the winners as well as complaints from the losers."
 HSM_ERI_FORCE_central_commissions:0 "The Ducal Commissioners"
 HSM_ERI_FORCE_central_commissions_desc:0 "Vincent's commissioners coordinate military organisation and industrial output through direct authority. Their capacity to get work done comes with unrest among those expected to accept instructions without a comparable voice in making them."
 HSM_ERI_FORCE_chartered_union:0 "The Chartered Ducal Settlement"
 HSM_ERI_FORCE_chartered_union_desc:0 "Vincent's rule over the settled districts is bound by their charters. Predictable obligations strengthen stability, construction and the economy of army supply while limiting his political discretion. This settlement concerns Erie and its defeated rival; it grants no authority over Avian."
 HSM_ERI_FORCE_ducal_administration:0 "The Consolidated Ducal Administration"
 HSM_ERI_FORCE_ducal_administration_desc:0 "A permanent central administration channels industrial work, military organisation and political authority through the duke. Vincent can make his decisions felt more strongly, but the governed districts remain uneasy about how little stands between his favour and their fortunes."
 HSM_ERI_FORCE_patron_claims:0 "The Patron's Reward"
 HSM_ERI_FORCE_patron_claims_desc:0 "Vincent has rewarded wartime service with the contested estate. His fighting supporters draw confidence from that loyalty. Others see a government whose undertakings depend on which side of the audience chamber they can enter, weakening stability and consuming political authority."
 HSM_ERI_FORCE_equal_judgement:0 "A Hearing Even Against the Victor"
 HSM_ERI_FORCE_equal_judgement_desc:0 "The estate claim must stand on evidence, including where it challenges the duke's patron. Greater confidence in property and government strengthens stability and the growth of production efficiency. Service to Erie remains an obligation for Erie to honour, without making another household its payment."
 HSM_ERI_FORCE_supply_bonus:0 "Supply Undertakings of the Campaign"
 HSM_ERI_FORCE_district_bonus:0 "District Reconstruction Methods"
 HSM_ERI_FORCE_commission_bonus:0 "The Commissioners' Industrial Programme"
 HSM_ERI_FORCE_reconstruction_bonus:0 "Civilian Reconstruction Contracts"
 HSM_ERI_FORCE_levy_bonus:0 "Equipment for a Regular Levy"

 hsm_ver_eri_force.1.t:0 "The Men Beside the Banner"
 hsm_ver_eri_force.1.d:0 "The gathering in Vincent's hall began with a toast to his inheritance. The officers stood first, followed by the households that supplied their companies. A merchant at the back remained seated long enough to finish adding a column of figures.\n\nVincent noticed. When the speeches ended, he asked what the merchant had found more urgent. Wagon hire, came the answer, and grain bought on the assurance that service to Erie would be remembered. The phrase appeared in several of the papers now being brought forward.\n\nThe duke had heard his cause described as a duty owed by everyone in the room. Now he heard what the room believed he owed in return. His claim to Verenia was no more certain than Iovinus's. Force could decide possession, but it would leave these expectations standing beside the victor. He asked the merchant to stay."
 hsm_ver_eri_force.1.a:0 "We must reckon with our own side."
 hsm_ver_eri_force.2.t:0 "What Service Is Worth"
 hsm_ver_eri_force.2.d:0 "A patron of the army brought Vincent a list of the wagons, provisions and credit he had supplied. There was nothing modest about the total. Beneath it he had written the name of an estate beyond the old lines.\n\nVincent asked whether the owner had offered it for sale. The patron laughed, then realised the question was serious. He had understood that supporting the duke's cause would bring an appropriate reward. The estate seemed an appropriate reward.\n\nThe supplier waiting behind him had a different request: a clear promise of payment, with dates he could show his own creditors. The quartermaster said that such promises would make deliveries easier to arrange.\n\nVincent ordered the undertakings recorded. He did not promise the estate. His supporters deserved to know what service would earn; they could not each select the household that would be made to pay for it."
 hsm_ver_eri_force.2.a:0 "Record the debt, not a licence to take."
 hsm_ver_eri_force.3.t:0 "Rosaline's Answer"
 hsm_ver_eri_force.3.d:0 "Rosaline found her name halfway through the proposed speech. The sentence began with reconciliation and ended with a marriage that nobody had asked her to consider. She read it aloud to Vincent, including the flattering description of her willingness.\n\nThe author said it was only a suggestion. Rosaline asked why a suggestion required her consent to be described as already given. He began to explain what a union between the Houses would mean. She interrupted: he could explain what he meant by a union without offering her as its proof.\n\nHer correspondence with Montague was her own. Its future could not be promised by a victorious court, and a name on an envelope was no guarantee of what its recipient would choose. Vincent sent the speech back for revision. Rosaline kept the offending page. She wanted the next author to understand why it had been removed."
 hsm_ver_eri_force.3.a:0 "Her future is hers to decide."
 hsm_ver_eri_force.4.t:0 "The Door After the Knock"
 hsm_ver_eri_force.4.d:0 "In the defeated districts, a baker opened his door to a ducal officer and asked whether the old town weights could still be used. The officer knew which banner flew over the square. He did not know the answer about the weights.\n\nSimilar questions reached Vincent from landlords, repair crews and the keepers of local courts. Their petitions contained little admiration for his victory, but considerable interest in what would happen next. His supporters urged him to replace unreliable authorities with commissioners who owed their positions to him. Orders would move faster; the army and its workshops would know whom to obey.\n\nThe alternative was to recognise district rights that even the winners would have to respect. It promised more confidence in rebuilding, with less freedom for the duke to settle every difficulty by command. Vincent had secured the door. He now had to decide how his officers would enter it."
 hsm_ver_eri_force.4.a:0 "Preserve the districts' rights and institutions."
 hsm_ver_eri_force.4.b:0 "Govern through the duke's commissioners."
 hsm_ver_eri_force.5.t:0 "Two Claims to One Orchard"
 hsm_ver_eri_force.5.d_rights:0 "The estate included an orchard. Its claimants brought leases, old receipts and a sketch showing which trees had been replaced. Vincent's patron brought the account of his wartime service. The duke recognised the name of the property before either party spoke.\n\nThe district representative asked that the evidence be heard under the rights now guaranteed. Defeat, he argued, could not by itself transfer a family's title to the supporter most convenient to reward. The patron asked Vincent whether the soldiers and suppliers who had sustained his cause would always be sent away with another appointment.\n\nBoth looked to the duke. He had promised an answer to his supporters and rights to the districts. An evidentiary hearing would protect the latter without denying the former's service. Awarding the estate would instead tell his patrons that their loyalty weighed more than the protection he had offered everyone else."
 hsm_ver_eri_force.5.d_central:0 "The commissioner had expected the estate claim to be straightforward. A wartime patron wanted it as a reward; Vincent had authorised direct administration of the defeated districts. Then the family brought its leases and receipts, and asked which of them had ceased to matter.\n\nThe orchard was still productive. Its workers needed to know whom to pay and whether the agreements for the next harvest would stand. The patron's steward had already offered instructions. The commissioner had not yet given him authority to do so.\n\nVincent could require the competing claims to be tested on their evidence. His commissioners would learn that direct rule still demanded a reasoned judgement. Or he could award the estate for service to Erie, giving his fighting supporters the reward they expected. The same central authority could carry out either decision. It could not make their consequences the same."
 hsm_ver_eri_force.5.a:0 "Require a hearing on the evidence."
 hsm_ver_eri_force.5.b:0 "Award the estate to our wartime patron."
 hsm_ver_eri_force.6.t:0 "What the Districts Have Learned"
 hsm_ver_eri_force.6.d_court:0 "The patron's place at dinner was empty. His steward had sent a correct, chilly acknowledgement of the estate hearing, followed by another request for settlement of the duke's outstanding obligations. Vincent could not pretend that his decision had cost him nothing.\n\nElsewhere, a workshop owner had agreed to replace damaged machinery. The district officer reported that the owner had asked about the orchard before committing his savings. If evidence could be heard against a supporter of the victorious army, he reasoned, there was some purpose in keeping receipts of his own.\n\nThe hearing had not made the defeated districts affectionate. It had made one promise usable. Vincent ordered the patron's legitimate accounts examined without delay. Refusing to pay him with another household's property did not erase what Erie actually owed. The distinction would have to survive more than this first case."
 hsm_ver_eri_force.6.d_patron:0 "The patron arrived with good news from the officers. They had seen that Vincent remembered those who stood beside his banner. The orchard award was being spoken of as proof that loyal service still earned something solid.\n\nThe district report was less cheerful. A workshop owner had postponed replacing damaged machinery, asking whether a new roof would merely make his premises a more attractive reward. The former claimants continued to submit papers. Their persistence was beginning to be described by the patron's steward as a problem of order.\n\nVincent read both reports. He had gained the confidence of supporters whose strength remained useful, and inherited their need to defend what he had given them. Every official sent to explain the award now spent the duke's authority explaining why the other evidence had not prevailed. The estate was only one property. The lesson was travelling."
 hsm_ver_eri_force.6.a:0 "This is what our judgement has taught them."
 hsm_ver_eri_force.7.t:0 "The Shape of Vincent's Rule"
 hsm_ver_eri_force.7.d_rights:0 "At the reading of the district charters, a representative asked whether the duke's own officers could be summoned to answer a complaint. Vincent said that they could. The representative asked that his answer be included in the text, where an officer would find it without relying on anyone's memory.\n\nThe estate hearing had shown what the guarantee might mean. The charters now made that obligation part of the lasting settlement. Vincent would rule the districts, but their recognised rights would restrict the ways in which he could reward a friend, demand supplies or dismiss an objection.\n\nHe watched the representative check the amended passage. There was no gratitude in the gesture, only the care of someone acquiring a protection he intended to use. Vincent had wanted an inheritance. He was accepting that keeping it would sometimes require an answer he would rather not give."
 hsm_ver_eri_force.7.d_reversed:0 "The patron recognised the estate's name as soon as the amended order was read. He asked Vincent whether his service had become less valuable. The duke answered that the charters would be worthless if that service entitled him to stand outside them.\n\nThe exceptional award was withdrawn. The competing claims would return to a hearing on the evidence, with the patron's legitimate wartime accounts treated as obligations of Erie. He left before the reading ended.\n\nThe family's representative did not thank Vincent. She asked whether the earlier decision would remain in the record. It would. The new guarantees could bind the duke from now on, but they could not turn an award he had protected into a wrong he had never committed.\n\nWhen the district charters were signed, the reversal accompanied them. Anyone relying on the promise could see both how it had failed and what its author had been required to surrender."
 hsm_ver_eri_force.7.d_central:0 "The commissioners came to court with work that could no longer be treated as a temporary assignment. Factories needed continuing orders, the army needed dependable arrangements, and the districts needed to know who could overrule whom. Vincent gave the commissions a permanent place beneath a single ducal administration.\n\nThe estate decision stood. The new offices would enforce the judgement already chosen, not quietly replace it with a more convenient history. Anyone seeking a different answer would find the authority responsible for the first one at the head of the same chain.\n\nVincent's signature could now travel farther and produce a more consistent result. He understood why his officers welcomed that. He also understood why a district representative asked how a complaint against those officers would ever reach him. Centralisation had made the question more pressing, and made it unmistakably his."
 hsm_ver_eri_force.7.a:0 "Let our government bear its obligations."
 hsm_ver_eri_force.8.t:0 "The Colours in the Schoolroom"
 hsm_ver_eri_force.8.d:0 "The schoolmaster had kept two scraps of uniform cloth for a lesson about the feud. A pupil wanted to know whether the colours explained who owned the orchard. The schoolmaster said they explained why the question had become difficult, but could not answer it.\n\nVincent heard the story during a visit to the district. For years, his supporters had spoken as though possession of the inheritance would settle its meaning. Now children were growing up under decisions he had made after the fighting: how a complaint was heard, whose reward took precedence and what his officers could demand.\n\nThis settlement answered for the defeated districts; it made no promise in Avian's name. Vincent could end the official rivalry, but could not order the next generation to remember his rule kindly. They would have their own evidence, gathered long after the banners had been put away."
 hsm_ver_eri_force.1.victory.d:0 "The victory banners had been taken down when Vincent's supporters returned to the hall. This gathering began without a toast. A merchant laid out the cost of wagon hire, grain and credit advanced to the army. Beside him, a patron asked when the rewards of faithful service would be considered.\n\nVincent had secured the military result. The peace had not paid either of them. During the campaign, promises had allowed his officers to obtain what they could not immediately buy; now those promises arrived together, each expecting to be first.\n\nThe duke asked the steward to fetch the original undertakings. His claim had prevailed by force, without making the rival inheritance less real. The districts left to govern would contain households with obligations and expectations of their own. Before deciding what victory should give his supporters, he would have to decide what it allowed them to demand from everyone else."
 hsm_ver_eri_force.2.victory.d:0 "The patron brought back the account he had kept throughout the war. Several deliveries bore the quartermaster's hurried acknowledgement. The promised payment had not followed them. At the foot of the page stood the name of an estate in the defeated districts.\n\nVincent asked whether the property had been pledged in any of the undertakings. The patron said he had expected the duke to remember who made the victory possible. He did remember. That did not establish who owned the orchard.\n\nA supplier waiting behind them asked for dates he could give his creditors. His business had survived the campaign by trusting Erie's word, and victory was beginning to look much like another postponement.\n\nVincent ordered the outstanding promises reconciled with the deliveries. His supply officers needed a service that could settle its accounts after a war. The peace could not be financed by allowing each unpaid supporter to choose someone else's land."
 hsm_ver_eri_force.8.a:0 "They will inherit what we make ordinary."

 HSM_EYR_FORCE_the_last_campaign:0 "The Last Campaign"
 HSM_EYR_FORCE_the_last_campaign_desc:0 "Iovinus's officers promise a campaign that will finally make perpetual vigilance unnecessary. He understands the attraction, and how readily headquarters finds reasons to remain indispensable. Choosing their campaign closes the negotiated road with Erie. The duke must decide what Eyrie will take by force and what his own command will have to surrender afterwards, so that victory becomes more than the next mobilisation."
 HSM_EYR_FORCE_break_the_rival_line:0 "Break the Rival Line"
 HSM_EYR_FORCE_break_the_rival_line_desc:0 "Eyrie's claim has not persuaded Erie to yield. Iovinus will prepare a demand backed by the prospect of war, accepting responsibility for a contest that ancestry alone cannot resolve. An existing peace must still be respected. The preparations provide grounds to fight the rival House; the decision to send the army remains a separate and deliberate act."
 HSM_EYR_FORCE_field_liaison:0 "Orders That Reach the Column"
 HSM_EYR_FORCE_field_liaison_desc:0 "A good order arriving late may be less useful than a poor one already understood. Train liaison officers to carry the same picture of the field between headquarters, engineers and the marching columns. Practical work with signals will help Iovinus discover where his command's confidence outruns its knowledge, and give the troops a better chance of receiving instructions they can use."
 HSM_EYR_FORCE_supply_the_columns:0 "Keep the Columns Supplied"
 HSM_EYR_FORCE_supply_the_columns_desc:0 "Quartermasters cannot feed a column with the assurance that another district ought to have sent its carts. Improve loading plans, transport maintenance and the means of reporting a shortage. The army's demands travel through villages and workshops before reaching a depot. Understanding that journey will matter when those same places ask what the end of the campaign has changed."
 HSM_EYR_FORCE_victory_and_the_garrison:0 "Victory and the Garrison"
 HSM_EYR_FORCE_victory_and_the_garrison_desc:0 "The rival army has been defeated and the territorial peace established. Eyrie's officers can still name a reason to maintain emergency command in every district. Iovinus must decide whether to return ordinary administration and economic life to civilian hands or make military tutelage the basis of the settlement. Neither decision will settle the livelihoods waiting outside the headquarters gate."
 HSM_EYR_FORCE_montagues_unsent_reply:0 "Montague's Unsent Reply"
 HSM_EYR_FORCE_montagues_unsent_reply_desc:0 "Montague has an unfinished reply to an older letter from Rosaline, and a question for Iovinus: must private words still receive military approval? The answer will reach beyond this correspondence. Civilian post can carry knowledge and ordinary business at a continuing administrative cost. Command supervision will keep communications useful to headquarters while reminding every writer that an officer may be reading."
 HSM_EYR_FORCE_publish_release_schedule:0 "Dates for Coming Home"
 HSM_EYR_FORCE_publish_release_schedule_desc:0 "The end of emergency administration must have dates that a workshop or household can plan around. Publish a schedule for returning civilian premises and responsibilities, and prepare the building work that will make their use possible. Iovinus will have to accept demands arriving without the discipline of a military return, and answer people who are no longer awaiting his next command."
 HSM_EYR_FORCE_district_commands:0 "The District Commands"
 HSM_EYR_FORCE_district_commands_desc:0 "The garrison will remain an institution of government. Give district commanders permanent responsibilities for coordination, supply and readiness, with staff trained to make those responsibilities workable. Their competence may bring a dependable rhythm to the settlement. It will also carry military authority into decisions that inhabitants might otherwise have made without asking permission."
 HSM_EYR_FORCE_workshops_after_war:0 "The Work Waiting After War"
 HSM_EYR_FORCE_workshops_after_war_desc:0 "Enough time has passed for the chosen order to encounter ordinary needs. Under civilian administration, returning reservists need instruction and premises before service can become a trade. Under military government, civilian repairs compete with the command's orders for machine time. Hear the workshop reports and decide who will bear the cost of the transition."
 HSM_EYR_FORCE_useful_trades:0 "Useful Trades"
 HSM_EYR_FORCE_useful_trades_desc:0 "A former soldier can bring patience, skill and confidence to a workshop without knowing how to operate its machinery. Expand civilian production and the industrial knowledge that sustains it. The programme must build on the answer already given to the returning reservists; a new building alone cannot make an unfunded promise of training disappear."
 HSM_EYR_FORCE_permanent_district_staff:0 "A Permanent District Staff"
 HSM_EYR_FORCE_permanent_district_staff_desc:0 "The military districts need more than a succession of temporary detachments. Establish permanent staff and workshops capable of maintaining the equipment their orders require. The arrangement will make command more dependable while binding industrial work closely to its needs. Civilian contracts, where authorised, will still have to find their place within that hierarchy."
 HSM_EYR_FORCE_avians_border:0 "Registers for the Districts"
 HSM_EYR_FORCE_avians_border_desc:0 "A garrison report cannot replace a civil register. Iovinus orders the district staff to reconcile property records, tax rolls and transport maps so that the two duchies can be administered as a country rather than as an army's temporary possessions."
 HSM_EYR_FORCE_inspections_not_parades:0 "Inspect the Working Day"
 HSM_EYR_FORCE_inspections_not_parades_desc:0 "A prepared parade tells Iovinus what a district can arrange for his arrival. An ordinary working day will tell him more about the order he has created. Examine deliveries and workshop schedules, then visit after the officials have had time to put his instructions into practice. The important question is what happens when nobody expects the duke to be watching."
 HSM_EYR_FORCE_road_that_stays_open:0 "The Road That Stays Open"
 HSM_EYR_FORCE_road_that_stays_open_desc:0 "The road that carried the campaign now carries other journeys. Improve its future through the construction knowledge gathered in the settlement, and look at the habits taking root along it. Iovinus wanted a final victory. Its meaning will be found in whether travellers can leave an emergency behind, or merely pass from one permission to the next."

 HSM_EYR_FORCE_civilian_release:0 "The Civilian Release Schedule"
 HSM_EYR_FORCE_civilian_release_desc:0 "Ordinary administration and economic responsibilities are returning to civilian hands. Greater confidence supports stability and civilian factory construction, while the army loses some of the organisational advantages of keeping the country on an emergency footing."
 HSM_EYR_FORCE_military_government:0 "Military Tutelage of the Districts"
 HSM_EYR_FORCE_military_government_desc:0 "Standing commands govern the settled districts. They strengthen army organisation and planning, but civilian life must support a costly military apparatus. The burden on consumer goods and the loss of public stability accompany the order Iovinus has chosen to retain."
 HSM_EYR_FORCE_open_correspondence:0 "Post Beyond the Headquarters"
 HSM_EYR_FORCE_open_correspondence_desc:0 "Private civilian correspondence can circulate without a commander's countersignature. Knowledge travels more freely, improving research. Maintaining a reliable service outside military control requires continuing political attention."
 HSM_EYR_FORCE_supervised_correspondence:0 "The Commander's Countersignature"
 HSM_EYR_FORCE_supervised_correspondence_desc:0 "The command continues to supervise correspondence. Its familiarity with the movement of information helps planning, while the knowledge that private words may be examined deepens public distrust and weakens stability."
 HSM_EYR_FORCE_unplaced_reservists:0 "Reservists Without a Trade"
 HSM_EYR_FORCE_unplaced_reservists_desc:0 "Civilian boards must absorb returning reservists without the promised central investment in training and capacity. Uncertain livelihoods weaken stability and slow civilian factory construction. A release order has provided freedom from one obligation without the means to begin another life."
 HSM_EYR_FORCE_military_production_priority:0 "The Army's First Claim on Production"
 HSM_EYR_FORCE_military_production_priority_desc:0 "Command reserves workshop time for military orders. Arms production benefits, while civilian factory construction falls behind. The government has chosen to satisfy readiness first and leave ordinary repairs and investment to compete for the hours that remain."
 HSM_EYR_FORCE_contracted_workshops:0 "Civilian Contracts Under Military Rule"
 HSM_EYR_FORCE_contracted_workshops_desc:0 "Negotiated contracts give civilian workshops a defined place within the military settlement. More dependable supply reduces waste and improves the growth of production efficiency. Maintaining the bargain costs continuing political effort and does not abolish the district commands."
 HSM_EYR_FORCE_liaison_bonus:0 "Field Liaison and Signals"
 HSM_EYR_FORCE_supply_bonus:0 "Supply Along the March"
 HSM_EYR_FORCE_release_bonus:0 "Rebuilding for Civilian Use"
 HSM_EYR_FORCE_district_bonus:0 "District Support Services"
 HSM_EYR_FORCE_trades_bonus:0 "Industrial Trades After Service"
 HSM_EYR_FORCE_staff_bonus:0 "Permanent Staff and Workshops"
 HSM_EYR_FORCE_inspection_bonus:0 "Supply Lessons from the Districts"
 HSM_EYR_FORCE_roads_bonus:0 "The Roads of the Settlement"
 HSM_EYR_FORCE_retraining_bonus:0 "Training for Returning Reservists"
 HSM_EYR_FORCE_contracts_bonus:0 "Negotiated Workshop Production"
 HSM_EYR_FORCE_workshop_bonus:0 "Civilian Workshop Methods"
 HSM_EYR_FORCE_arsenal_bonus:0 "District Arsenal Methods"

 hsm_ver_eyr_force.1.t:0 "One Last Campaign"
 hsm_ver_eyr_force.1.d:0 "The officer called it the last campaign. Iovinus let him finish before asking how the headquarters would know it was the last. The answer concerned Erie's positions, roads and reserves. It said nothing about Eyrie's own emergency orders.\n\nThrough the open window came the sound of a wagon waiting at the military gate. Its driver needed a permit to collect tools from a requisitioned workshop. The officer explained that delays were unavoidable while the rival House remained a threat. Iovinus asked whether the gate would disappear with that threat.\n\nThere would be a period of necessary supervision, the officer said. He could not yet say how long.\n\nThe duke wanted the inheritance he claimed, and the security his officers promised. He found it easier to imagine overcoming Erie's resistance than dismissing the machinery he had built to overcome it. That difficulty deserved a place in the plan."
 hsm_ver_eyr_force.1.victory.d:0 "The officer called it the last campaign, this time while putting the maps away. Erie had been defeated and the peace established. Iovinus asked which emergency orders could now be withdrawn. The officer began with the reasons each should remain.\n\nThere were deliveries to protect, damaged crossings to supervise and workshops whose schedules still served the army. Each explanation sounded reasonable. Together they described a country that could continue preparing for the finished campaign indefinitely.\n\nA wagon waited outside the headquarters gate while its driver sought permission to collect tools. Iovinus remembered how readily such delays had been attributed to the rival House. The military result no longer supplied that answer.\n\nHe had won the contest he set out to win. Deciding what his own officers must give back would require a different kind of determination. He told the adjutant to leave the emergency orders on his desk."
 hsm_ver_eyr_force.1.a:0 "Include the end of the emergency in our plans."
 hsm_ver_eyr_force.2.t:0 "When the Garrison Becomes the Government"
 hsm_ver_eyr_force.2.d:0 "The workshop owner asked for a date. The commandant offered an assurance that civilian needs would receive every consideration. She asked for a date again. Her workers could not plan a season around consideration.\n\nAt the command table, Iovinus found a military reason to retain every building marked on the district map. There were real advantages to keeping them coordinated: troops organised quickly, supplies directed where headquarters judged them most useful, instructions obeyed through a familiar chain. The inhabitants paid for that readiness in work postponed and decisions taken elsewhere.\n\nA civilian release schedule would give ordinary administration room to resume. It would also weaken the command's immediate organisation and leave councils to solve problems that an officer could once settle with an order.\n\nIovinus looked from the map to the waiting workshop owner. Victory had made this a choice of government, and she was entitled to know which he intended."
 hsm_ver_eyr_force.2.a:0 "Set dates for the return to civilian administration."
 hsm_ver_eyr_force.2.b:0 "Retain military government in the districts."
 hsm_ver_eyr_force.3.t:0 "A Space for Someone Else's Words"
 hsm_ver_eyr_force.3.d:0 "Montague had placed an unfinished reply beside an older letter from Rosaline. The paper offered Iovinus no news of her present circumstances, and Montague did not pretend that it did. He wanted to know what would be required if he chose to send his answer.\n\nThe postal officer indicated the space for military approval. Montague asked whether the officer needed to approve the route or the words. The distinction was less familiar at headquarters than it ought to have been.\n\nCivilian post would need staff and political support, but it could carry workshop drawings and private questions without making every writer a petitioner to command. Keeping supervision would preserve the army's knowledge of what moved through the districts, along with the distrust that knowledge inspired.\n\nIovinus could settle the postal rule. He could neither write Montague's answer nor promise that Rosaline would send one back."
 hsm_ver_eyr_force.3.a:0 "Establish private civilian post."
 hsm_ver_eyr_force.3.b:0 "Keep correspondence under command supervision."
 hsm_ver_eyr_force.4.t:0 "The Machine After the Muster"
 hsm_ver_eyr_force.4.civilian.d:0 "The reservist could strip and repair the equipment he had used in service. At the civilian workshop, he stood beside an unfamiliar machine and waited for someone to show him the controls. The foreman had three other returning men and one instructor.\n\nMonths had passed since the release schedule began. Iovinus had given ordinary life room to resume; ordinary life now needed tools, premises and wages while new trades were learned. The local board's promise to find places had been made before it knew how many places existed.\n\nThe foreman asked for investment in training and capacity. Securing it would cost the duke influence among people with competing claims on the government's attention. Leaving the matter to the boards would spare that immediate effort, but their shortage would remain.\n\nThe reservist looked up from the machine. He had reported where he was told. He was still waiting to become useful."
 hsm_ver_eyr_force.4.d:0 "The workshop's military orders were neatly arranged by priority. Underneath them lay a pump awaiting repair for a civilian customer. The foreman could name the officer responsible for each army consignment. He could not tell the customer when the pump would reach a machine.\n\nMilitary government had made the district's work easier to direct. It had not created enough hours to satisfy every demand. Iovinus listened while the command representative explained why readiness must come first, then asked what happened to a district whose ordinary repairs never became urgent enough.\n\nThe representative proposed reserving production for command. A civilian manager offered contracts with dependable deliveries and specified workshop time. Negotiating and sustaining them would require political effort, but could make supplies more reliable without dismantling military rule.\n\nThe pump remained on the floor between them, a small piece of machinery with no rank to speak for it."
 hsm_ver_eyr_force.4.a:0 "Fund training and civilian workshop capacity."
 hsm_ver_eyr_force.4.b:0 "Leave placements to the local boards."
 hsm_ver_eyr_force.4.c:0 "Reserve production for military orders."
 hsm_ver_eyr_force.4.contracts:0 "Negotiate dependable civilian supply contracts."
 hsm_ver_eyr_force.5.t:0 "Without the Reception Party"
 hsm_ver_eyr_force.5.civilian.d:0 "A month after the inspection programme began, Iovinus arrived at a workshop without the prepared reception. There was no military permit desk at the gate. A caretaker asked whom he wished to see, recognised him and became flustered. The duke asked for the person responsible for the day's work.\n\nThe answer was a civilian manager with no polished report ready. He described deliveries, the skills his workers could use and the difficulties still preventing others from finding a place. Iovinus had to ask questions; there was no formation to inspect and no adjutant to provide the right response.\n\nThe change had made room for ordinary initiative. It had also made the government's decision about training impossible to hide behind a general assurance of readiness. The manager wanted an answer about work. Iovinus listened while the machines continued, indifferent to whether the duke found the account encouraging."
 hsm_ver_eyr_force.5.d:0 "The district officer could account for every dispatch when Iovinus arrived without warning. Wagons were loaded in sequence, stores matched the day's orders and the staff knew which delay required attention. Military government had acquired the competence its advocates promised.\n\nA civilian manager stood beside the schedule. When the officer described the available workshop time, the manager began to speak, then waited until the duke looked towards him. His objection concerned hours already committed elsewhere. It was practical and specific; finding the moment to voice it had been harder than finding the discrepancy.\n\nIovinus asked the officer to hear him out. The answer would have to reflect the production policy actually chosen, with all its obligations. The command could keep a district moving. The inspection had also shown how easily movement became dependent on civilians knowing when they were permitted to interrupt."
 hsm_ver_eyr_force.5.a:0 "Remember the working day we actually saw."
 hsm_ver_eyr_force.6.t:0 "Traffic on the Old Campaign Road"
 hsm_ver_eyr_force.6.civilian.d:0 "Iovinus watched a cart pass the place where the command post had stood. The driver slowed for a damaged stretch, then continued without looking towards the duke. Montague, beside him, said that he appeared to be late for something.\n\nThe duke almost sent an aide to ask what. There was no need. The journey did not have to become part of his victory merely because he had noticed it. Somewhere along the road, a customer would have questions enough for the driver.\n\nCivilian government had not made every workshop prosperous or every returning soldier secure. Iovinus had seen what his choices had provided and what they had left wanting. It had allowed those difficulties to become public business without keeping the whole country under a command post.\n\nThe cart disappeared around the bend. For once, there was no useful order to give. Letting it go required more attention than he had expected."
 hsm_ver_eyr_force.6.d:0 "The cart stopped at the district post, received its direction and moved into the permitted lane. Another followed before the first had reached the bend. Iovinus watched the routine with the satisfaction of a commander seeing a complicated arrangement work.\n\nMontague asked what happened when a traveller needed to go somewhere the schedule had not anticipated. The officer pointed towards the desk for special requests. There would be an answer, he assured them, once the circumstances had been considered.\n\nThe military settlement had made that desk an ordinary part of life. Its competence could prevent waste, settle competing demands and keep supplies moving. Its authority also required civilians to fit their needs into questions the command was prepared to hear.\n\nIovinus had wanted a victory that endured beyond the next alarm. Here was the order he had chosen to preserve: useful, disciplined and dependent on the continuing willingness of everyone at the post to obey."
 hsm_ver_eyr_force.6.a:0 "This is the peace our victory has made."

 HSM_VER_FORCE_settlement_tt:0 "The House remains independent and uncapitulated under its original duke, with victory over its rival confirmed by a recorded war, rival defeat and peace conference, followed by a completed §Y30-day§! settling period. Its own original provinces remain under its ownership and control; the rival's original provinces belong to and are controlled by the victor or its actual defeated rival subject."
 HSM_VER_FORCE_settlement_started_tt:0 "The political settlement following victory has begun."
 HSM_VER_FORCE_no_protected_peace_tt:0 "Neither House is bound to the other by an armistice, ratified friendship treaty, non-aggression pact or common faction. A friendship already concluded through Avian also counts; a new proposal that Avian has refused does not."
 HSM_ERI_FORCE_story_tt:0 "Continues Vincent's story with the next scene."
 HSM_ERI_FORCE_open_terms_tt:0 "Opens the binding choice between §Ypreserving local district institutions§! and §Ydirect ducal administration§! of the defeated districts."
 HSM_ERI_FORCE_petition_tt:0 "Brings forward the estate petition that tests the claims of Vincent's wartime patron against the evidence of the competing claimants."
 HSM_ERI_FORCE_bound_duke_tt:0 "Replaces the provisional district guarantees with §Ybinding charters§!. Any earlier exception awarding the estate to the wartime patron is §Ywithdrawn§!, restoring an evidentiary hearing and its consequences."
 HSM_ERI_FORCE_chancery_tt:0 "Replaces the provisional commissions with a §Yunified ducal administration§!. The estate judgement already chosen, and its consequences, remain in force."
 HSM_ERI_FORCE_rights_tt:0 "Vincent chose to preserve local rights and district institutions."
 HSM_ERI_FORCE_central_tt:0 "Vincent chose direct ducal administration."
 HSM_ERI_FORCE_claim_decided_tt:0 "The estate petition has received a decision."
 HSM_ERI_FORCE_consequence_tt:0 "The later report on the estate judgement has been received; it becomes available §Y45 days§! after the decision."
 HSM_EYR_FORCE_campaign_tt:0 "Opens Iovinus's account of the campaign and the obligations that victory will leave behind."
 HSM_EYR_FORCE_settlement_tt:0 "Begins the political settlement and presents the choice between §Ycivilian demobilisation§! and §Ylasting military tutelage§!. Ends the official rivalry for the victor and any actual defeated rival subject, without automatically transferring territory or granting cores."
 HSM_EYR_FORCE_correspondence_tt:0 "Montague's unfinished reply raises a separate choice: establish private civilian post or retain military supervision of correspondence. Neither choice promises a reply, a marriage or another person's consent."
 HSM_EYR_FORCE_demobilisation_tt:0 "Begins the return of administration and economic responsibilities to civilian hands. After §Y120 days§!, the workshop review can examine the practical cost of placing returning reservists. This policy does not disband army divisions."
 HSM_EYR_FORCE_tutelage_tt:0 "Retains standing military government in the districts. After §Y120 days§!, the workshop review can examine the competition between military orders and civilian production."
 HSM_EYR_FORCE_workshop_review_tt:0 "Once §Y120 days§! have passed since the choice of government, opens the workshop review: training and employment under civilian administration, or production priorities and contracts under military tutelage."
 HSM_EYR_FORCE_inspection_tt:0 "Begins an inspection of the chosen settlement. An ordinary working-day visit follows after §Y30 days§!, showing the consequences of the government and workshop decisions already made."
 HSM_EYR_FORCE_order_chosen:0 "Iovinus has chosen the postwar form of government"
 HSM_EYR_FORCE_civilian_order:0 "Iovinus chose civilian demobilisation and administration"
 HSM_EYR_FORCE_military_order:0 "Iovinus chose lasting military tutelage"
 HSM_EYR_FORCE_correspondence_decided:0 "The rules for private correspondence have been decided"
 HSM_EYR_FORCE_workshops_decided:0 "The workshop review has been resolved"
 HSM_EYR_FORCE_inspection_seen:0 "Iovinus has completed the visit examining the settlement in practice"
 HSM_VER_FORCE_avian_war_recorded_tt:0 "Our government fought independent Avian."
 HSM_VER_FORCE_avian_defeat_recorded_tt:0 "Avian capitulated to our side in that war."
 HSM_VER_FORCE_avian_peace_recorded_tt:0 "The peace conference confirmed our settlement of Avian's homeland."
 HSM_VER_FORCE_avian_settling_complete_tt:0 "At least §Y30 days§! have passed since the Avian peace settlement."
 HSM_VER_FORCE_avian_lands_held_tt:0 "Avian's homeland is owned and fully controlled by us after annexation, or by us and our defeated Avian subject."
 HSM_VER_FORCE_avian_articles_ratified_tt:0 "The postwar Avian articles have been ratified."
 HSM_VER_FORCE_avian_transition_complete_tt:0 "The §Y90-day transition§! following ratification of the Avian articles has ended."
 HSM_VER_FORCE_avian_current_consent_tt:0 "Avian is already annexed, or our defeated Avian subject has expressly agreed to join our state."
 HSM_VER_FORCE_avian_not_integrated_tt:0 "Avian's postwar integration has not yet been completed."
