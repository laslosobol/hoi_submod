 HSM_VER_SP_united_verenia:0 "United Verenia"
 HSM_VER_SP_united_verenia_desc:0 "The seals of the Houses now stand beneath a single law. Their workshops, schools and staffs have not disappeared with the old borders: they have become the institutions of a common country. The obligations inherited with them belong to Verenia as surely as their achievements."
