l_english:
 HSM_BAR_civic_government:0 "Civil Government"
 HSM_BAR_civic_available_tt:0 "Independent Barrad follows the Collegium path, has completed §Y$HSM_BAR_collegium_oath$§!, has not capitulated, and owns and controls §Y$STATE_624$§!."
 HSM_BAR_civic_municipalities_settled_tt:0 "The delegates have settled municipal or district representation."
 HSM_BAR_civic_courts_settled_tt:0 "The justice office has chosen circuit courts or a permanent bench."
 HSM_BAR_civic_defence_settled_tt:0 "The defence office has chosen local reserves or central depots."
 HSM_BAR_civic_procurement_settled_tt:0 "The cabinet has adopted open tenders or framework contracts."
 HSM_BAR_civic_territorial_representation_settled_tt:0 "The cabinet has adopted local statutes or a common civic franchise."
 HSM_BAR_civic_government_desc:0 "Municipal mandates, civil courts and salaried offices give Barrad a public administration separate from the College. Its ministers answer for their own decisions; scientists advise them without owning the state."
 HSM_BAR_civic_republic:0 "A Government Beyond the College"
 HSM_BAR_civic_republic_desc:0 "The doors of the College are open, but a laboratory cannot decide who repairs a bridge or hears a widow's claim. Gasienica's provisional administration still borrows desks, clerks and authority wherever it can find them. We shall give the Republic offices of its own. The four surviving scholars may advise those offices; expertise will no longer be a title to the country."
 HSM_BAR_civic_republic_tt:0 "Establishes the civil administration and the §YCivil Government§! national modifier. Opens the public-government branch."
 HSM_BAR_civic_municipalities:0 "The Towns Send Delegates"
 HSM_BAR_civic_municipalities_desc:0 "Village assemblies survived the Count by attending to matters too small for his notice. They kept wells usable, shared seed and remembered boundaries after the surveyors stopped coming. Their delegates now arrive with very different instructions. A public government must decide how these local mandates become national decisions without turning the most distant settlements into spectators."
 HSM_BAR_civic_municipalities_tt:0 "The delegates will choose binding municipal mandates or district representation. The settlement changes §YCivil Government§! and is required before a salaried civil service can be established."
 HSM_BAR_civic_registry:0 "Citizens, Not Dependants"
 HSM_BAR_civic_registry_desc:0 "The old rolls recorded obligations to an estate, not membership of a country. Some families appear twice; others vanished when their village was emptied. Civil registrars will accept testimony as well as surviving papers and provide a means of appeal. Births, households and military notices must reach the right doors. Registration will neither restore an old owner's claim to a person nor manufacture a new one."
 HSM_BAR_civic_registry_tt:0 "Changes to §YCivil Government§!:\nMobilisation speed: §G+10.00%§!"
 HSM_BAR_civic_courts:0 "A Court Without a Patron"
 HSM_BAR_civic_courts_desc:0 "A claimant still brings a letter from a powerful acquaintance when summoned to a hearing. The habit is older than the Republic. We need judges whose authority follows a published procedure, and judgments which can be challenged without first finding another patron. The remaining question is where those judges should sit when much of the country cannot afford the journey to them."
 HSM_BAR_civic_courts_tt:0 "The justice office will choose circuit courts or a permanent bench. The settlement changes §YCivil Government§! and is required before the cabinet can be constituted."
 HSM_BAR_civic_civil_service:0 "A Salary, Not a Favour"
 HSM_BAR_civic_civil_service_desc:0 "A clerk paid by the petitioner has two employers, and neither can trust the answer. Municipal officers will enter a salaried service, with published duties, examinations suited to the work and dismissal for taking private fees. Experienced hands need not be discarded with the Count's seals, but neither service to him nor friendship with a scholar will excuse them from the same rules."
 HSM_BAR_civic_civil_service_tt:0 "Changes to §YCivil Government§!:\nPolitical power gain: §G+8.00%§!"
 HSM_BAR_civic_accounts:0 "The Republic's Accounts"
 HSM_BAR_civic_accounts_desc:0 "Nobody can tell Gasienica whether the treasury owns the grain in three government storehouses. One clerk counts the purchase, another the loan, and a third the promise to replace it after harvest. National accounts will distinguish cash, property and obligations. The College's research budget remains its own public question; these books concern the taxes and commitments of the whole state."
 HSM_BAR_civic_accounts_tt:0 "Changes to §YCivil Government§!:\nPolitical power gain: §G+5.00%§!"
 HSM_BAR_civic_cabinet:0 "Ministers With Portfolios"
 HSM_BAR_civic_cabinet_desc:0 "The provisional council has settled too many questions by asking who happens to be in the room. Gasienica will chair a cabinet whose members answer for defined public responsibilities: the treasury, justice, local administration and defence. Scholars may testify and submit proposals. They will not inherit ministries with their laboratories, and a disagreement over an experiment will no longer suspend the business of government."
 HSM_BAR_civic_cabinet_tt:0 "Changes to §YCivil Government§!:\nPolitical power gain: §G+5.00%§!"
 HSM_BAR_civic_defence:0 "The Civilian Signature"
 HSM_BAR_civic_defence_desc:0 "A military requisition still looks much like the Count's order to take whatever is needed. Gasienica knows why officers value speed; the villages know who pays for it. A civilian defence office will authorise expenditure, record requisitions and hear compensation claims. Whether supplies are held locally or concentrated in state depots, neither an officer nor a professor will authorise his own demand."
 HSM_BAR_civic_defence_tt:0 "The defence office will choose accountable local reserves or a central depot service. The settlement changes §YCivil Government§! and is required before administrative appeals can be established."
 HSM_BAR_civic_procurement:0 "Buying for a Country"
 HSM_BAR_civic_procurement_desc:0 "A small workshop can repair a municipal pump but cannot promise a thousand identical fittings. A large supplier can promise them, then make every subsequent repair depend on its own pattern. Public purchasing must settle more than the lowest price. The cabinet will choose how much room to preserve for competition, and how much standardisation it needs to keep essential services running."
 HSM_BAR_civic_procurement_tt:0 "The cabinet will choose open tenders or framework contracts. The settlement changes §YCivil Government§! and is required for the local-works and treasury-inspection reforms."
 HSM_BAR_civic_foreign_office:0 "The Republic Speaks Abroad"
 HSM_BAR_civic_foreign_office_desc:0 "Our neighbours still receive letters bearing names they associate with the Count's estate. A foreign office will send accredited envoys in the Republic's name, keep a consistent account of agreements and separate commercial requests from military threats. The College may maintain scholarly correspondence. It will not conduct the country's diplomacy through invitations to supper or promises its hosts cannot keep."
 HSM_BAR_civic_foreign_office_tt:0 "Changes to §YCivil Government§!:\nImprove relations maintenance cost: §G-10.00%§!\nOpens the existing diplomatic missions to neighbouring countries."
 HSM_BAR_civic_appeals:0 "The Right to Challenge an Order"
 HSM_BAR_civic_appeals_desc:0 "The first defence warrant is returned with a complaint attached. The officer wants the cart; its owner needs it for the harvest. A civilian appeal must not disappear merely because the original order was lawful. Published grounds for review and an enforceable duty to answer will make administrative decisions less convenient for officials, and more credible to those who must live with them."
 HSM_BAR_civic_appeals_tt:0 "Changes to §YCivil Government§!:\nResistance target: §G-2.00%§!\nStability: §G+3.00%§!"
 HSM_BAR_civic_local_works:0 "The Works the Villages Asked For"
 HSM_BAR_civic_local_works_desc:0 "The capital's plan shows a straight road. The village's plan shows where the spring flood washes it away. Local works offices will combine surveyed specifications with the knowledge of those who use a bridge, drain or road every day. Public contractors must finish what was commissioned, not leave an impressive demonstration for someone else to maintain when the guests have gone."
 HSM_BAR_civic_local_works_tt:0 "Changes to §YCivil Government§!:\nInfrastructure construction speed: §G+10.00%§!"
 HSM_BAR_civic_inspectors:0 "An Inspector Outside the Ministry"
 HSM_BAR_civic_inspectors_desc:0 "A minister cannot certify the accuracy of his own accounts simply by appointing a more loyal accountant. Treasury inspectors will receive access to contracts, inventories and payment records across departments. Their reports concern the public purse, including purchases made from the College, but they are not another tribunal on scientific doctrine. The cabinet must answer discrepancies in its own work."
 HSM_BAR_civic_inspectors_tt:0 "Changes to §YCivil Government§!:\nPolitical power gain: §G+5.00%§!"
 HSM_BAR_civic_territorial_representation:0 "A Place at the Table"
 HSM_BAR_civic_territorial_representation_desc:0 "The Republic needs a rule for communities beyond the founding town, including those it may one day administer across a former border. An army's arrival cannot settle their rights. Delegates must be heard, local obligations examined and public services made accountable before anyone can speak convincingly of belonging. The cabinet will establish a common policy without pretending that a proclamation has already won consent."
 HSM_BAR_civic_territorial_representation_tt:0 "The cabinet will choose local statutes or a common civic franchise. This sets a durable representation policy and changes §YCivil Government§!. It does not immediately annex or core any territory."
 HSM_BAR_civic_equal_services:0 "The Same Door Is Open"
 HSM_BAR_civic_equal_services_desc:0 "A resident should not need the correct accent, a professor's recommendation or a relative in the capital to obtain a civil record. The administration will extend access to courts, registrars and municipal services wherever it governs, while respecting the representation settlement. This is slow work performed by ordinary officials. It is also the daily test of whether our promises mean anything outside the cabinet room."
 HSM_BAR_civic_equal_services_tt:0 "Changes to §YCivil Government§!:\nCompliance growth: §G+0.02§!"
 HSM_BAR_civic_ordinary_state:0 "An Ordinary Day in Barrad"
 HSM_BAR_civic_ordinary_state_desc:0 "The cabinet's last meeting ends without a revelation. A minister must explain an unpaid invoice; a village disputes the route of a road; a court requests another clerk. The College sends advice, then returns to its work. Barrad has not run out of wonders or dangers. It has gained something it lacked beneath them: a government that can conduct public business without waiting for a remarkable individual to notice."
 HSM_BAR_civic_ordinary_state_tt:0 "Changes to §YCivil Government§!:\nStability: §G+5.00%§!\nPolitical power gain: §G+5.00%§!"
 HSM_BAR_civic.1.t:0 "The Chair Brought From Home"
 HSM_BAR_civic.1.d:0 "The delegate from the farthest village brings a folding chair. She has been told there may not be enough seats, and she will not return home having remained outside. Before the first meeting begins, three other delegates ask whether her mandate permits a vote on matters their own assemblies have not discussed.\n\nGasienica hears two proposals. Each town could retain binding instructions for its delegate, with public works negotiated directly between the cabinet and the affected communities. That would keep local promises visible, but oblige ministers to return repeatedly for consent. Alternatively, district councils could combine mandates and send representatives empowered to negotiate a common programme. Decisions would arrive sooner, though a small village could find its well postponed by a district majority.\n\nThe delegate opens her chair. She asks that whichever rule is adopted should fit on a notice that can be read at home."
 HSM_BAR_civic.1.a:0 "Keep the towns' binding mandates."
 HSM_BAR_civic.1.b:0 "Let district councils negotiate a common programme."
 HSM_BAR_civic_local_mandates_tt:0 "Changes to §YCivil Government§!:\nConstruction speed: §G+5.00%§!\nPolitical power gain: §R-3.00%§!"
 HSM_BAR_civic_district_mandates_tt:0 "Changes to §YCivil Government§!:\nPolitical power gain: §G+5.00%§!\nStability: §R-2.00%§!"
 HSM_BAR_civic.2.t:0 "The Judge and the Broken Wheel"
 HSM_BAR_civic.2.d:0 "A borrowed cart breaks an axle on the road to the courthouse. Its passengers arrive after their case has been called: two neighbours disputing a boundary neither can prove without the other's testimony. The clerk offers a new date. One of them asks whether the Republic intends to pay for another cart.\n\nThe justice office proposes circuits, taking a judge, a clerk and published forms to settlements on fixed days. More inhabitants could be heard, but the cabinet would pay for travel and work around a moving calendar. The alternative is a permanent bench with regular sittings, trained record-keepers and a dependable archive. Appeals would be more consistent, while distant communities, especially those unfamiliar with Barrad's institutions, would still find the court difficult to reach.\n\nGasienica crosses out a draft exemption for the College's senior advisers. The choice of court will not change who must answer it."
 HSM_BAR_civic.2.a:0 "Send the court to the settlements."
 HSM_BAR_civic.2.b:0 "Build a permanent bench with a regular calendar."
 HSM_BAR_civic_circuit_courts_tt:0 "Changes to §YCivil Government§!:\nResistance target: §G-5.00%§!\nPolitical power gain: §R-2.00%§!"
 HSM_BAR_civic_permanent_bench_tt:0 "Changes to §YCivil Government§!:\nStability: §G+4.00%§!\nCompliance growth: §R-0.02§!"
 HSM_BAR_civic.3.t:0 "Who Holds the Storehouse Key?"
 HSM_BAR_civic.3.d:0 "The defence office requests an inventory. A village sends the number of sacks, the names of the families who filled them, and a question: will the guard arrive before the wagons take them away?\n\nGasienica remembers requisitions made under the Count and declines to sign an unnumbered warrant. Local reserves could keep supplies close to their communities and train beside the ground they would defend. Their different schedules would make training slower, but they would have a reason to hold their own roads. A central depot service could supply formations more consistently and return exhausted units to duty faster. It would need permanent officials and funding, not an officer's promise to repay the village later.\n\nBoth plans place the keys in civilian custody. Leopold offers to design better locks. The minister thanks him and asks him to submit a price like any other supplier."
 HSM_BAR_civic.3.a:0 "Keep accountable reserves in the communities."
 HSM_BAR_civic.3.b:0 "Establish a salaried central depot service."
 HSM_BAR_civic_local_reserve_tt:0 "Changes to §YCivil Government§!:\nDivision defence on core territory: §G+10.00%§!\nTraining time: §R+3.00%§!"
 HSM_BAR_civic_central_depots_tt:0 "Changes to §YCivil Government§!:\nSupply consumption: §G-8.00%§!\nArmy organisation regain: §G+5.00%§!\nPolitical power gain: §R-3.00%§!"
 HSM_BAR_civic.4.t:0 "Two Bids for the Same Pump"
 HSM_BAR_civic.4.d:0 "The cheaper bid includes installation. The other includes spare parts for ten years, but only if the government purchases the manufacturer's pattern for every pump in the district. A minister asks Leopold which machine is better. He answers with a question about the water, then fills the margin with calculations. None of them decide who should own the maintenance contract.\n\nOpen tenders would let local workshops compete for public work and make construction more adaptable. Repeated changes of supplier would slow the accumulation of manufacturing experience. Longer framework contracts would support reliable output and predictable military deliveries, but fixing the specification for years would also limit later improvements.\n\nThe procurement clerk sets the drawings beside the bids instead of beneath them. Technical advice will accompany the government's choice, not conceal it."
 HSM_BAR_civic.4.a:0 "Let suppliers compete for each public contract."
 HSM_BAR_civic.4.b:0 "Offer longer contracts against a common specification."
 HSM_BAR_civic_open_tenders_tt:0 "Changes to §YCivil Government§!:\nConstruction speed: §G+7.00%§!\nProduction efficiency growth: §R-3.00%§!"
 HSM_BAR_civic_framework_orders_tt:0 "Changes to §YCivil Government§!:\nFactory output: §G+8.00%§!\nSupply consumption: §G-5.00%§!\nProduction efficiency cap: §R-2.00%§!"
 HSM_BAR_civic.5.t:0 "The Map and the Empty Chairs"
 HSM_BAR_civic.5.d:0 "The draft representation law leaves a blank after the names of the founding municipalities. A clerk asks whether it should be filled only after the next border settlement. Gasienica tells him that a cabinet should decide what it will promise before soldiers make the question urgent.\n\nOne proposal recognises local statutes and negotiates obligations with territorial assemblies. It offers communities a workable route into the administration, at the price of slower and more demanding negotiations for the capital. The other offers the same civic franchise and legal obligations everywhere. That would make a common political identity clearer and leave less room for arbitrary treatment, but the state must supply offices and services to the same standard rather than exploit cheaper arrangements at the periphery.\n\nNo chair is filled by this vote, and no map changes colour. The law establishes the terms on which future representatives can take their places. For once, the promise is written before the victory speech."
 HSM_BAR_civic.5.a:0 "Recognise local statutes and negotiate common obligations."
 HSM_BAR_civic.5.b:0 "Offer the same franchise and services everywhere."
 HSM_BAR_civic_local_statutes_tt:0 "Changes to §YCivil Government§!:\nCompliance growth: §G+0.04§!\nPolitical power gain: §R-3.00%§!"
 HSM_BAR_civic_equal_franchise_tt:0 "Changes to §YCivil Government§!:\nStability: §G+3.00%§!\nResistance target: §G-3.00%§!\nFactory output: §R-1.00%§!"

