l_english:
 HSM_VER_GRO_open_court:0 "A Court with an Ending"
 HSM_VER_GRO_open_court_desc:0 "Herzland's offices now answer to Verenia. Among the papers reaching our chancery are requests concerning the imperial household. Before anyone offers to govern in Grover's name, we must establish where he is and whether we can lawfully answer for his care. An undertaking to protect a sovereign must also say when our authority ends."
 HSM_VER_GRO_household_file:0 "The Household File"
 HSM_VER_GRO_household_file_desc:0 "A portrait, a rumour and an old court allowance cannot tell us who lives behind a palace door. The household clerks will compare testimony with the surviving records and establish what has become of Grover. They owe the council an honest answer, even if that answer leaves the proposed regent without a ward."
 HSM_VER_GRO_mandate:0 "The Verenian Regency"
 HSM_VER_GRO_mandate_desc:0 "The mandate must distinguish care for Grover from ownership of his future. Verenia will administer Herzland under a temporary title, while the succession articles prepare a crown with authority of its own. If Grover is already of age, the work concerns the transition to his government; it cannot make him a child again."
 HSM_VER_GRO_lessons:0 "Who May Be Heard"
 HSM_VER_GRO_lessons_desc:0 "A court teaches through its doors as much as through its books. Some visitors arrive with polished speeches; others bring accounts that contradict the official history. We must decide whether Grover hears those disagreements himself or receives the account his advisers consider fit to place before him."
 HSM_VER_GRO_petitions:0 "The Inconvenient Petition"
 HSM_VER_GRO_petitions_desc:0 "A petitioner has named someone whose support our government values. The evidence has passed through the same office that recorded our guarantees, and Grover has asked to hear the case. A judgement will teach him what our promises mean when keeping them becomes personally expensive."
 HSM_VER_GRO_registers:0 "The Capital's Registers"
 HSM_VER_GRO_registers_desc:0 "Griffenheim's clerks possess shelves of overlapping grants and obligations. Reconcile the capital's records with those of its surrounding districts, so that a household can discover which office must answer its claim. The regency needs an administration that will still make sense when another sovereign signs its orders."
 HSM_VER_GRO_districts:0 "Herzland's District Books"
 HSM_VER_GRO_districts_desc:0 "The capital's settlement must travel beyond its gates. District officers will compare their rolls, settle conflicting jurisdictions and recognise the inhabitants whom the new administration is meant to serve. Their books should describe a country ready to govern itself, not a collection of offices dependent on our court."
 HSM_VER_GRO_home_workshops:0 "Work for Verenia"
 HSM_VER_GRO_home_workshops_desc:0 "Herzland cannot become the sole occupation of the Verenian government. Our own workshops need premises, equipment and orders that will survive the end of the regency. Investment at home gives the returning administration something more useful to offer than memories of the imperial court."
 HSM_VER_GRO_service:0 "The Meaning of Service"
 HSM_VER_GRO_service_desc:0 "Grover has asked to examine the work behind a military report. Quartermasters would begin with depots, hospitals and the journey of a consignment. The territorial officers would begin with command, responsibility and the duty to answer for an order. Either education must include the moment when our own authority ceases."
 HSM_VER_GRO_succession_articles:0 "The Articles of Succession"
 HSM_VER_GRO_succession_articles_desc:0 "A promise to relinquish power deserves more than a place in a ceremonial speech. The articles will name the country Grover is to govern, the resources its government will receive and the limits of Verenia's continuing obligations. Our signatories must be prepared to honour them when the imperial seal passes to another hand."
 HSM_VER_GRO_prepared_crown:0 "A Crown Made Ready"
 HSM_VER_GRO_prepared_crown_desc:0 "The crown is the simplest object to prepare. The harder work lies in the ministries, army offices and accounts that must answer to its wearer. Let those arrangements be completed now, so that adulthood and a secure peace can bring the promised transfer without another excuse from the regent's desk."
 HSM_VER_GRO_civil_compact:0 "The Civil Settlement"
 HSM_VER_GRO_civil_compact_desc:0 "The people of Herzland require courts, workshops and a government that answers in its own name. The council may undertake that work without accepting an imperial regency. Grover's protection, if he is here, need not make his future the business of our state. Let the civil administration rest on the authority we are willing to exercise ourselves."

 HSM_VER_GRO_can_start_tt:0 "Independent, united Verenia under Erie or Eyrie is at peace and holds Herzland and all five original ducal homelands; the old Empire no longer exists."
 HSM_VER_GRO_active_tt:0 "The Verenian settlement remains active under its founding government, with Griffenheim held."
 HSM_VER_GRO_can_mandate_tt:0 "The living Grover is in our care; our government holds Herzland and all five original ducal homelands at peace and may establish the mandate."
 HSM_VER_GRO_regency_live_tt:0 "The mandate remains valid and the real, living Grover is still here."
 HSM_VER_GRO_civil_available_tt:0 "No royal mandate has been accepted; a civil settlement remains possible."
 HSM_VER_GRO_herzland_held_tt:0 "We own and control all 38 Herzland states."
 HSM_VER_GRO_home_held_tt:0 "We own and control $STATE_391$ and $STATE_401$."
 HSM_VER_GRO_lessons_done_tt:0 "The court's educational policy has been chosen."
 HSM_VER_GRO_petition_done_tt:0 "The petition has received a judgement."
 HSM_VER_GRO_service_done_tt:0 "The programme of military service has been chosen."
 HSM_VER_GRO_articles_done_tt:0 "The succession articles have been signed."
 HSM_VER_GRO_transfer_terms_tt:0 "Adult coronation restores the §Yindependent allied Griffonian Empire§!: §Yall 38 Herzland states§! and §Y25% of land units, aircraft and equipment stockpiles§!. No other territory or ships are transferred; all officers stay with Verenia. Our name returns to §YVerenia§!; only cores granted by this regency are removed."
 HSM_VER_GRO_open_court_tt:0 "Opens a settlement conditional on the real, living Grover being local. Proposed terms:\n$HSM_VER_GRO_transfer_terms_tt$"
 HSM_VER_GRO_household_tt:0 "Checks Grover's actual circumstances. May bring Grover and his household into our care after the fall of his imperial government; never takes him from a surviving foreign court."
 HSM_VER_GRO_mandate_tt:0 "Adopts the temporary name §YVerenian Regency§!. A minor receives guardianship; an adult receives a transitional administration pending the agreed coronation."
 HSM_VER_GRO_lessons_tt:0 "Opens the choice between an open court and a filtered education. The choice grants its reward and shapes Grover's later government."
 HSM_VER_GRO_petitions_tt:0 "Opens a choice between enforcing the law against a supporter and protecting that supporter's privilege. Grover's future government inherits the precedent."
 HSM_VER_GRO_registers_tt:0 "Grants cores in the original imperial capital zone within Herzland. Newly granted cores are recorded for removal when the mandate ends; pre-existing cores are preserved."
 HSM_VER_GRO_districts_tt:0 "Grants cores in the remaining Herzland districts. Only cores granted by this regency are removed at the end of the mandate."
 HSM_VER_GRO_home_workshops_tt:0 "Builds at home in Verenia. Each site without room for a factory instead provides an industrial research bonus."
 HSM_VER_GRO_service_tt:0 "Chooses defence logistics or territorial command. Grover remembers the approach when his own government takes office."
 HSM_VER_GRO_articles_tt:0 "Opens the binding succession articles:\n$HSM_VER_GRO_transfer_terms_tt$"
 HSM_VER_GRO_prepare_tt:0 "Completes preparations now. Transfer follows automatically after §Y21 May 1021§!, once at peace and all Herzland is held; war pauses it.\n$HSM_VER_GRO_transfer_terms_tt$"
 HSM_VER_GRO_civil_tt:0 "Concludes the civil settlement and permanently closes the regency branch. Verenia retains its own name; a local Grover remains a protected private guest. No imperial coronation or transfer follows."
 HSM_VER_GRO_open_education_tt:0 "Grover remembers unrestricted testimony. The restored Empire inherits §Y$HSM_VER_GRO_open_court_legacy$§!."
 HSM_VER_GRO_filtered_education_tt:0 "Grover remembers a court of selected advisers. The restored Empire inherits §Y$HSM_VER_GRO_managed_court_legacy$§!."
 HSM_VER_GRO_apply_law_tt:0 "The law binds our own supporter. The restored Empire inherits §Y$HSM_VER_GRO_rule_of_law$§!."
 HSM_VER_GRO_protect_patron_tt:0 "Our supporter's privilege is protected. The restored Empire inherits §Y$HSM_VER_GRO_patrons_legacy$§!."
 HSM_VER_GRO_logistics_tt:0 "Grover's military experience centres on defence logistics; his independent government remembers that choice."
 HSM_VER_GRO_command_tt:0 "Grover's military experience centres on territorial command; his independent government remembers that choice."
 HSM_VER_GRO_sign_articles_tt:0 "Legally commits us to the following transfer once preparations, adulthood and peace allow it:\n$HSM_VER_GRO_transfer_terms_tt$"

 HSM_VER_GRO_guardianship:0 "A Limited Guardianship"
 HSM_VER_GRO_guardianship_desc:0 "The regency cares for Grover while administering Herzland in trust. Its authority carries an obligation to prepare a government that can stand without its guardians."
 HSM_VER_GRO_transition:0 "The Adult Sovereign's Transition"
 HSM_VER_GRO_transition_desc:0 "Grover has reached adulthood. The remaining work belongs to ministries, treaties and the restoration of peace; it confers no further right to direct his upbringing."
 HSM_VER_GRO_common_market:0 "The Verenian-Imperial Market"
 HSM_VER_GRO_common_market_desc:0 "Verenian workshops and Herzland buyers continue to trade under an agreement between independent governments. The old regency's accounts have become the records of a shared commercial undertaking."
 HSM_VER_GRO_joint_defence:0 "The Defence Compact"
 HSM_VER_GRO_joint_defence_desc:0 "Verenia and the restored Empire prepare their defence as allies. Their staffs share responsibilities without making either government the other's guardian."
 HSM_VER_GRO_open_court_legacy:0 "The Open Court's Legacy"
 HSM_VER_GRO_open_court_legacy_desc:0 "Grover remembers witnesses who were permitted to disagree with the court. The habit of hearing them has followed him into his own government."
 HSM_VER_GRO_managed_court_legacy:0 "The Managed Court's Legacy"
 HSM_VER_GRO_managed_court_legacy_desc:0 "Grover learned to work through an orderly circle of advisers. Their discipline remains useful, and the voices outside that circle remain a question his own reign must answer."
 HSM_VER_GRO_rule_of_law:0 "A Law Above Favour"
 HSM_VER_GRO_rule_of_law_desc:0 "An inconvenient judgement once bound the regent's own supporter. Grover carries that precedent into an imperial court whose friends must now discover that it binds them too."
 HSM_VER_GRO_patrons_legacy:0 "The Patrons' Precedent"
 HSM_VER_GRO_patrons_legacy_desc:0 "The regency protected a useful supporter when the law became inconvenient. Grover remembers both the loyalty that protection secured and the petitioner who left without an ordinary hearing."
 HSM_VER_GRO_grover_desc:0 "Grover VI returns to the imperial throne after a Verenian settlement that promised him a country of his own. He remembers who was allowed to speak at court, what happened when a petitioner challenged a powerful supporter, and how his military advisers understood service. Those experiences accompany him into an independent reign. Verenia is now an ally whose rulers have surrendered their guardianship, and the choices before the emperor are his to make."
 HSM_VER_GRO_alliance:0 "Verenian-Herzland Compact"
 HSM_VER_REGENCY_neutrality:0 "Verenian Regency"
 HSM_VER_REGENCY_neutrality_DEF:0 "the Verenian Regency"
 HSM_VER_REGENCY_neutrality_ADJ:0 "Verenian"
 HSM_VER_REGENCY_democratic:0 "Verenian Regency"
 HSM_VER_REGENCY_democratic_DEF:0 "the Verenian Regency"
 HSM_VER_REGENCY_democratic_ADJ:0 "Verenian"
 HSM_VER_REGENCY_fascism:0 "Verenian Regency"
 HSM_VER_REGENCY_fascism_DEF:0 "the Verenian Regency"
 HSM_VER_REGENCY_fascism_ADJ:0 "Verenian"
 HSM_VER_REGENCY_communism:0 "Verenian Regency"
 HSM_VER_REGENCY_communism_DEF:0 "the Verenian Regency"
 HSM_VER_REGENCY_communism_ADJ:0 "Verenian"
 HSM_VER_REGENCY:0 "Verenian Regency"
 HSM_VER_REGENCY_DEF:0 "the Verenian Regency"
 HSM_VER_REGENCY_ADJ:0 "Verenian"
 HSM_VER_GRO_category:0 "The Verenian Settlement"
 HSM_VER_GRO_category_desc:0 "The household records and the terms of our mandate must agree with the country beyond the chancery doors. A clerk may bring new testimony; a government may lose the authority under which an undertaking was made. The council must answer for what can still be honoured."
 HSM_VER_GRO_household_retry_decision:0 "Reopen the Household File"
 HSM_VER_GRO_household_retry_decision_desc:0 "The clerks will compare the latest testimony with the imperial household's records. They may locate someone the fall of his former court left unaccounted for. A report from a living foreign court must be treated as evidence of its custody, not permission to take its guest."
 HSM_VER_GRO_household_retry_decision_tt:0 "The settlement is active and the household inquiry is available again. Reports Grover's circumstances; may bring him and his household into our care after the fall of his imperial government."
 HSM_VER_GRO_household_retry_tt:0 "The settlement remains active and 90 days have passed since the previous household inquiry."
 HSM_VER_GRO_household_report_tt:0 "$HSM_VER_GRO_household_tt$"
 HSM_VER_GRO_close_interrupted:0 "Close the Interrupted Mandate"
 HSM_VER_GRO_close_interrupted_desc:0 "The royal undertaking can no longer be fulfilled under its original authority. The chancery will close its accounts and place the remaining civil work on an honest footing. A promise that has lost its subject or its lawful guarantor cannot be kept alive by renewing its heading."
 HSM_VER_GRO_close_interrupted_tt:0 "The royal mandate has been interrupted; the Verenian civil administration remains active and is at peace."

 hsm_ver_grover.1.t:0 "A Place at the Court"
 hsm_ver_grover.1.eri_diplomatic.d:0 "The first Herzland delegation brings its petition in the language of the old imperial chancery. An Erie secretary begins translating it into Aquileian, then stops when a second delegate corrects him. Vincent asks for both versions to remain on the table.\n\nThe household file lies beside them. If Grover can lawfully be entrusted to this court, he will encounter a government accustomed to negotiating between voices. Whether those voices may contradict its patron is another matter.\n\nThe proposed regency is temporary. Its end must leave an independent emperor in Herzland and Verenia governing its own country again."
 hsm_ver_grover.1.eri_military.d:0 "The officers who secured Herzland expect the settlement to remember their service. Their lists of rewards arrive before the household clerks have finished their inquiry into Grover's whereabouts. Vincent sets the papers side by side.\n\nIf the living sovereign is here, his protection will rest with the victor's court. That does not make his future another prize to distribute. A ward may grow into an ally or remain surrounded by men who call possession loyalty.\n\nThe proposed mandate promises an independent crown at its end. Vincent's supporters will eventually have to surrender something victory placed within their reach."
 hsm_ver_grover.1.eyr_diplomatic.d:0 "Iovinus has asked for the imperial household's records without the flattering introduction prepared by the secretariat. The government that now administers Herzland must decide what it can truthfully promise Grover before seeking the right to speak for him.\n\nOne councillor recommends preserving the dignity of the old court. Another asks whether that means preserving its exemptions as well. The charter lies open between them.\n\nIf a lawful mandate can be established, it must end in an independent imperial government beside Verenia. The same safeguards offered to a neighbour must bind the guardian who signs them."
 hsm_ver_grover.1.eyr_military.d:0 "Iovinus receives the district commanders in the room chosen for the household inquiry. Their reports describe a country held by orders, depots and disciplined troops. The imperial seal in the clerk's box belongs to a different kind of authority.\n\nThe duke will consider a mandate only for the real Grover whose circumstances the inquiry can establish. If it proceeds, the command must prepare to serve a sovereign who will eventually answer for his own orders.\n\nAn independent Empire is the promised outcome. The test of Eyrie's discipline will come when the command to relinquish control reaches its own officers."
 hsm_ver_grover.1.a:0 "Begin with the household's actual circumstances."
 hsm_ver_grover.2.t:0 "What the Clerks Can Establish"
 hsm_ver_grover.2.dead.d:0 "The household inquiry has confirmed Grover's death. A secretary has left a space for a more comforting conclusion, but the evidence supplies none.\n\nThere can be no guardianship, lessons or future coronation for him. The council may still settle the administration of Herzland, provided it does so in its own name. The file will retain the testimony and the names of those who gave it."
 hsm_ver_grover.2.minor.d:0 "The clerks have verified the household and the living Grover in its care. He is here, and he has not yet reached his majority. The inquiry has found a person for whom a guardian can answer, rather than a title to place above an empty chair.\n\nA mandate can now be considered. It must provide for his present life and the authority he will exercise when that guardianship ends."
 hsm_ver_grover.2.adult.d:0 "Grover is alive and here. He is also an adult. The clerk reads that conclusion twice before striking the proposed instructions concerning a ward's daily supervision.\n\nThe court may arrange a lawful transition to his independent government, but it cannot claim the rights of a guardian over his childhood. The remaining questions concern institutions, territory and the conditions under which authority can actually be handed over."
 hsm_ver_grover.2.foreign.d:0 "The inquiry has located Grover in a living foreign country. Its household records cannot be turned into a Verenian claim to custody merely because our armies hold Herzland.\n\nNo member of that court has entrusted him to us. Our clerks will record the evidence, and the civil administration must proceed without pretending that a sovereign abroad sits at our table."
 hsm_ver_grover.2.unknown.d:0 "The surviving records do not establish a living Grover in our care. Some accounts are old, others contradictory; none permits the clerk to certify a local household.\n\nThe absence of proof is not proof of death. It is also insufficient authority to announce a guardianship. The council may reopen the inquiry when there is something further to examine. Until then, it must speak honestly about what remains unknown."
 hsm_ver_grover.2.a:0 "Enter the finding without embellishment."
 hsm_ver_grover.3.t:0 "The Temporary Seal"
 hsm_ver_grover.3.minor.d:0 "The new heading reads 'Verenian Regency'. Beneath it, the mandate separates the care of Grover from the civil government of Herzland. His household receives a duty of protection; the chancery receives a duty to prepare its own eventual departure.\n\nGrover watches the seal descend. The document promises that the crown will belong to his adult government, while Verenia returns to its own name and affairs. The regent has signed an undertaking whose fulfilment will diminish the power now being assumed."
 hsm_ver_grover.3.adult.d:0 "The heading reads 'Verenian Regency', but the operative clauses describe a transition. Grover is already of age. The document gives the administration work to complete, not a childhood to supervise.\n\nThe offices must prepare an independent imperial government, settle its inheritance and establish the alliance that will connect it to Verenia. Grover reads the promise of departure before the regent signs. A temporary seal should not become an excuse for a permanent delay."
 hsm_ver_grover.3.a:0 "The authority includes an obligation to leave."
 hsm_ver_grover.4.t:0 "The Papers on Grover's Desk"
 hsm_ver_grover.4.eri_diplomatic.d:0 "Grover has received two translations of the same petition. The Aquileian text calls its author troublesome; the Herzland original calls him unpaid. He asks which word the court expects him to learn.\n\nThe tutors propose admitting translators, engineers and petitioners to the same sessions, allowing disputed accounts to be heard in both languages. The secretariat offers a carefully selected course, with technical studies and witnesses whose evidence has first been reconciled.\n\nVincent must decide how much disagreement the court will permit in Grover's presence. Either arrangement will teach him something about the hand that chose it."
 hsm_ver_grover.4.eri_military.d:0 "The official account of the campaign ends with the return of order. A witness waiting outside describes the seizure of her workshop after that date. Grover has noticed the discrepancy between the report and the claim attached to it.\n\nSome advisers want him to hear the engineers and inhabitants who experienced the settlement. Others argue for a disciplined course built from selected testimony and technical instruction, lest every lesson become a retrial of the victory.\n\nVincent has real obligations to those who fought for him. Grover will also learn whom those obligations allow into the room."
 hsm_ver_grover.4.eyr_diplomatic.d:0 "Grover asks why the account of his father's reign contains so many descriptions of ceremony and so few of government. The archivist can produce orders, petitions and decisions that show an emperor capable of both care and failure. None fits the spotless portrait proposed for the lecture room.\n\nIovinus may let the witnesses and documents speak openly, including those unflattering to the imperial household. Or he may retain a selected account, treating discretion and technical competence as the safer education for a future court.\n\nGrover waits for the papers. Respect for his father need not settle who may tell the truth about him."
 hsm_ver_grover.4.eyr_military.d:0 "A military history prepared for Grover praises the command for a retreat whose original orders describe a costly mistake. The staff suggests correcting the summary before it reaches him. The quartermaster would rather explain how the mistake occurred and how the surviving units were supplied.\n\nIovinus can admit the contradictory witnesses and records, or direct a carefully filtered course through trusted instructors. Order and candour each make demands upon a commander.\n\nGrover has asked to see the original map. The answer will show whether discipline includes the right to examine an officer's judgement."
 hsm_ver_grover.4.a:0 "Let him hear the witnesses and read the originals."
 hsm_ver_grover.4.b:0 "Keep the course in the hands of selected advisers."
 hsm_ver_grover.5.t:0 "A Supporter's Name in the Petition"
 hsm_ver_grover.5.eri_diplomatic.d:0 "The petitioner has brought a translation and the original contract. Both say that a mill must be returned to its owners. The patron who presently holds it helped Vincent secure the settlement and now asks the court to regard his service as an exceptional claim.\n\nGrover asks the clerk to read the guarantee in both languages. Neither version contains the exception.\n\nAn ordinary hearing would put Vincent's own supporter under the law he endorsed. Protecting the patron would preserve a valuable loyalty, while teaching everyone present where a written promise can end."
 hsm_ver_grover.5.eri_military.d:0 "A family driven from its estate has produced the title deeds. The officer who received the property after the victory produces a letter of commendation. Both are genuine documents; they answer different questions.\n\nVincent's advisers warn that restitution would disturb the expectations of men who won the country for him. The family asks why the duke's debt to those men should be paid with its fields. Grover follows the testimony without the comfort of a simple account of winners and losers.\n\nThe court must choose between an evidentiary judgement and the privileges promised to its victorious supporters."
 hsm_ver_grover.5.eyr_diplomatic.d:0 "The charter gives the town a right to contest its assessment. The noble household collecting the levy claims an exemption older than the charter itself. Its representative reminds Iovinus how much the settlement owes to families willing to accept it.\n\nGrover recognises the household's name from the papers concerning his father's court. The imperial past has arrived as a demand upon a present petitioner.\n\nThe duke can enforce the common procedure against an old privilege or preserve the patron's exception. Either answer will tell Grover whether a charter changes the practice of government."
 hsm_ver_grover.5.eyr_military.d:0 "A commander has kept wagons after the authorised requisition expired. His report describes an operational necessity; the village's return lists the households unable to bring in their harvest. Grover asks who signed the release order. Iovinus did.\n\nThe officers insist that public proceedings would weaken confidence in the command. The petitioners ask whether discipline also requires an officer to obey an inconvenient order.\n\nAn ordinary hearing would apply the rules to the duke's own command. Protecting its privilege would keep a loyal establishment content, at the expense of the people those rules were meant to protect."
 hsm_ver_grover.5.a:0 "Apply the law to our own supporter."
 hsm_ver_grover.5.b:0 "Uphold the supporter's exceptional privilege."
 hsm_ver_grover.6.t:0 "Beyond the Parade Ground"
 hsm_ver_grover.6.eri_diplomatic.d:0 "The staff offers Grover a place beside the colours. He asks to see the arrangements that let allied armies work together when their officers do not share a language.\n\nThe supply service proposes work with interpreters, depots and hospitals. The territorial officers offer instruction in local defence and the responsibility attached to a command. Both plans can serve an independent Empire alongside Verenia.\n\nVincent must choose the experience his court will provide. A polished parade cannot answer every question Grover will later face as sovereign."
 hsm_ver_grover.6.eri_military.d:0 "The veterans expect Grover to learn the campaign through the regiments that won it. The quartermasters have another itinerary: the roads, workshops and hospitals that kept those regiments alive. Neither account can be dismissed without losing part of the truth.\n\nOne programme would centre his service on sustaining a defensive alliance. The other would teach territorial command and the duty to answer for soldiers entrusted to him.\n\nVincent's officers must prepare him for authority of his own. A sovereign who merely repeats their orders would never discharge the promise made in his name."
 hsm_ver_grover.6.eyr_diplomatic.d:0 "Grover brings the charter to the staff meeting. Its defence clauses describe obligations between governments, but the officers must turn them into work that can be carried out.\n\nThe logistics service proposes studying supply, medical support and the limits of what an ally can promise. The territorial command proposes planning local defence and accepting responsibility for the orders that follow.\n\nIovinus understands the worth of both. He must choose which experience the court gives Grover, knowing that the future emperor will have to interpret the agreement from the other side of the table."
 hsm_ver_grover.6.eyr_military.d:0 "The exercise begins with an order that cannot be carried out with the stores listed. Grover asks whether the report is wrong or the order is. The instructor replies that a commander must discover that before sending men forward.\n\nThe quartermasters offer a programme centred on sustaining the army. The territorial staff offers practical command, including the obligation to account for a failed judgement. Neither should end at a ceremonial inspection.\n\nIovinus must decide how to prepare Grover for the day when Herzland's officers receive a lawful order that the Verenian command cannot overrule."
 hsm_ver_grover.6.a:0 "Begin with supply, hospitals and allied defence."
 hsm_ver_grover.6.b:0 "Teach territorial command and responsibility."
 hsm_ver_grover.7.t:0 "The Clause That Binds the Regent"
 hsm_ver_grover.7.eri_diplomatic.d:0 "The succession articles have been read in both court languages. A secretary suggests describing Vincent's future role as continuing supervision. Grover asks which government would then be sovereign.\n\nThe final text leaves Herzland to an independent imperial crown. Verenia retains its own country and supplies the resources promised to its ally; its fleet and officers remain its own. The agreement is precise enough to make departure an obligation.\n\nVincent has spent years persuading others to trust his guarantees. He must now sign the one that requires him to surrender personal authority."
 hsm_ver_grover.7.eri_military.d:0 "The veterans' representatives request a permanent Verenian right to approve imperial appointments. They call it protection for the order they helped establish. Grover reads it as a command that would outlast the regency.\n\nThe articles instead prepare an independent Herzland state, supported by the promised share of military resources and bound to Verenia through alliance. The fleet and Verenian officers remain at home.\n\nVincent must sign away the power to decide for the sovereign he has protected. His adult ally will be able to disagree with him. That is part of the settlement, not a defect to be repaired."
 hsm_ver_grover.7.eyr_diplomatic.d:0 "An old imperial household has requested a reservation of its privileges in the succession articles. The request would bind Grover before his own government can consider the matter. Iovinus places it beside the charter.\n\nThe agreement establishes an independent crown with the means to govern Herzland and a continuing alliance with Verenia. Its financial and military undertakings are defined; the fleet and Verenian officers remain under their own government.\n\nThe duke cannot guarantee that every future judgement will please him. He can guarantee that the authority to make it will pass to the sovereign whose independence he promised."
 hsm_ver_grover.7.eyr_military.d:0 "The staff's draft retains a Verenian countersignature on imperial orders. Iovinus recognises the attraction: a familiar command would remain available whenever the new one made a mistake. Grover asks when that arrangement would end.\n\nThe articles provide a definite answer. Herzland's sovereign will receive territory, military resources and the authority to command them. The fleet and Verenian officers remain with Verenia; the alliance coordinates two governments.\n\nIovinus must commit his commanders to a real transfer. Discipline will require them to obey the order that ends their right to give orders here."
 hsm_ver_grover.7.a:0 "Sign the articles, including our own departure."
 hsm_ver_grover.8.t:0 "The Crown and the Accounts"
 hsm_ver_grover.8.minor.d:0 "The ceremonial officers report that the crown is ready. The civil servants bring a less elegant bundle: ministry appointments, district records and the accounts that will accompany the transfer. The military schedules are attached to the same undertaking.\n\nGrover is still a minor. The preparations can nevertheless be completed, and the promised departure requires no further excuse for postponement once his adulthood and a secure peace permit it. Until then, the household continues its care and the administration holds itself to the articles already signed."
 hsm_ver_grover.8.adult.d:0 "Grover examines the completed schedules as an adult. The crown, civil accounts and military arrangements are ready; the question is whether the agreed transfer can safely take effect.\n\nThe court has no further course of guardianship to impose upon him. Peace and secure possession of Herzland must allow the ministries and units to pass into an independent government's hands. When they do, the undertaking is to be carried out without requiring another round of ceremonial preparation. Until then, Verenia's administration remains answerable for a transition it has promised to finish."
 hsm_ver_grover.8.a:0 "Let the completed undertaking be honoured when it can."
 hsm_ver_grover.9.t:0 "Orders in Our Own Name"
 hsm_ver_grover.9.dead.d:0 "The council has closed the royal proposal with the record of Grover's death still attached. The civil settlement carries no promise of a coronation that can never take place.\n\nBuilders and clerks receive their commissions under Verenia's own name. Their work cannot repair what happened to the imperial household, but it can give the inhabitants courts and workshops whose authority does not depend on a fiction."
 hsm_ver_grover.9.d:0 "The royal undertaking has given way to a civil settlement. The council has no valid mandate under which it can fulfil that promise, and it will no longer write as though it does.\n\nThe administration's remaining work concerns the people who live here: their accounts, workshops and disputes. New commissions bear Verenia's own name. The sovereign's circumstances remain a matter for truthful records, not a convenient ending to our proclamation."
 hsm_ver_grover.9.a:0 "The civil work has an authority of its own."
 hsm_ver_grover.9.interrupted.d:0 "The council has closed the interrupted mandate. Its original undertaking could no longer be honoured, and the final account records that failure without announcing a coronation.\n\nThe remaining commissions concern workshops, records and public obligations. They bear Verenia's own name. Whatever the household's present circumstances, the civil administration will no longer claim powers derived from the withdrawn royal mandate."
 hsm_ver_grover.9.local.d:0 "The council has chosen to govern Herzland in its own name. Grover remains here as a protected private guest, but the government has declined the imperial regency. Care for his person does not give the council authority to make promises on behalf of his crown.\n\nThe civil commissions concern workshops, records and public obligations. They contain no undertaking to restore an Empire at a future coronation. The decision closes the proposed mandate, while leaving the household's protection intact."
 hsm_ver_grover.10.t:0 "Verenia Again"
 hsm_ver_grover.10.eri_diplomatic.d:0 "The articles are read in both languages before Grover receives the imperial crown. Vincent then signs the last instrument of his temporary authority. There is no reserved place for his approval beneath the emperor's future orders.\n\nHerzland now belongs to an independent allied Empire. The agreed resources have been handed over, while Verenia keeps its own lands, officers and fleet. Our chancery resumes the country's ordinary name.\n\nVincent leaves the hall as the sovereign's ally. The court he helped prepare can now hear an answer he did not choose."
 hsm_ver_grover.10.eri_military.d:0 "The officers who once presented Herzland as a victory stand witness to its transfer. Grover receives the crown as an adult sovereign, and Vincent's final regency order directs the administration to recognise his independent authority.\n\nThe Empire has received its country and the resources promised by the articles. Verenia retains its own lands, officers and fleet, and its ordinary name returns to the chancery seal.\n\nGrover need not ask his former guardian's permission to govern. Vincent has gained an ally whose freedom makes the promise harder, and more substantial, than a permanent wardship."
 hsm_ver_grover.10.eyr_diplomatic.d:0 "Grover's coronation includes the reading of the succession articles. The charter that once bound Iovinus as guardian now defines the obligations of neighbouring sovereign governments.\n\nThe restored Empire governs Herzland independently and stands beside Verenia in alliance. The promised resources have passed to it; our own lands, officers and fleet remain ours. The chancery has restored Verenia's ordinary name.\n\nIovinus closes the regency's copy of the charter. Grover will have to answer the questions his father's court left behind, including the privileges his own court still expects. Those answers now belong to his reign."
 hsm_ver_grover.10.eyr_military.d:0 "The last Verenian order is read to the command before Grover's coronation. There will be no countersignature from Iovinus on the new emperor's instructions. The officers acknowledge the transfer and report to the governments the articles assign them.\n\nHerzland and the promised resources now support an independent allied Empire. Verenia retains its own territory, officers and fleet, and resumes its ordinary name.\n\nIovinus has required discipline through years of command. Today it has carried out the order that limits his own command. Grover receives authority with the crown."
 hsm_ver_grover.10.a:0 "An independent ally, and our own country to govern."
 hsm_ver_grover.11.t:0 "The Emperor's First Desk"
 hsm_ver_grover.11.open_law_logistics.d:0 "Grover asks that the first petition be brought in without an adviser rewriting its complaint. He remembers the open testimony at the Verenian court and the judgement that bound a powerful supporter.\n\nBeside the petition lie the supply and hospital returns. His service taught him to ask whether an army could sustain the orders written for it. The new emperor begins with that question.\n\nVerenia is an ally now. Its former guardian can offer advice; the decision and the obligation to answer for it belong to Grover."
 hsm_ver_grover.11.open_law_command.d:0 "The petition has arrived with the original testimony attached. Grover remembers being allowed to hear a disputed account and seeing the law applied to a supporter of the regent.\n\nThe territorial commanders await their instructions. His service taught him that a command includes responsibility for its consequences, and he asks each officer to name the authority under which he acts.\n\nThere is no Verenian countersignature to seek. The emperor's first decisions will reveal what he makes of the example his former guardians gave him."
 hsm_ver_grover.11.open_patron_logistics.d:0 "Grover remembers hearing testimony freely at the Verenian court. He also remembers the petitioner whose evidence could not overcome a patron's usefulness. An open door did not always produce an ordinary hearing.\n\nThe supply returns offer questions with answers that can be checked: whether stores arrived, whether hospitals received them. His service taught him to begin there.\n\nThe new court already has supporters who expect consideration. As an independent emperor, Grover must decide what their loyalty permits them to ask of someone else's country."
 hsm_ver_grover.11.open_patron_command.d:0 "A councillor assures Grover that all petitioners may speak. He remembers that freedom from the Verenian court, and the patron whose privilege survived the evidence spoken against it.\n\nThe territorial command brings orders for approval. His service taught him how authority reaches a district; the petition taught him how it can fail the person standing outside its office.\n\nVerenia can no longer settle that contradiction for him. The independent emperor must decide what kind of loyalty his own government will reward."
 hsm_ver_grover.11.filtered_law_logistics.d:0 "Grover's advisers have arranged the morning's papers in the careful order he remembers. The Verenian court taught him to rely on selected expertise, yet its judgement against a useful supporter also showed that the law could reach inside that circle.\n\nHe asks for the supply and hospital returns first. His military service left him attentive to the work behind an officer's assurance.\n\nThe crown gives him the authority to choose who enters his own room. Verenia's former guardians have relinquished the right to choose for him."
 hsm_ver_grover.11.filtered_law_command.d:0 "The new secretariat has prepared a selected account of the morning's petitions. Grover recognises the method. He also remembers an inconvenient judgement in which the regent's supporter was made to answer under the ordinary law.\n\nThe territorial commanders wait outside. His service taught him to expect clear responsibility, including responsibility for an order that goes wrong.\n\nAn independent crown leaves him to decide how those habits fit together. His advisers may prepare the account; they cannot inherit the emperor's obligation to judge it."
 hsm_ver_grover.11.filtered_patron_logistics.d:0 "The selected brief is concise and reassuring. Grover remembers a court that worked through trusted advisers and protected a supporter when an ordinary judgement threatened that support. The arrangement made government easier for those already inside it.\n\nHis time with the supply service taught another habit: compare an assurance with the consignment that actually arrived. He asks for the original delivery returns.\n\nThe new emperor has inherited useful routines and difficult precedents. Verenia stands beside his country as an ally, while the choice of what to retain belongs to him."
 hsm_ver_grover.11.filtered_patron_command.d:0 "The advisers have brought selected papers and a list of dependable supporters. Grover remembers both habits from the Verenian court. He remembers, too, the petition that ended where a patron's privilege began.\n\nHis instruction in territorial command made the reach of an order plain. The imperial seal now gives that reach to him, together with responsibility for those who carry his orders out.\n\nVerenia's command no longer speaks for Herzland. The adult emperor must decide whether the confidence of his own establishment is enough to justify what it asks."
 hsm_ver_grover.11.d:0 "The first papers await Grover's imperial seal. The Verenian administration has handed over its authority, leaving an independent government to answer for Herzland's affairs.\n\nThe new emperor has a country to govern and an ally across its frontier. The regency's records remain available, but no former guardian can sign the decisions now required of him."
 hsm_ver_grover.11.a:0 "Bring in the first matter of our own reign."
 hsm_ver_grover.12.t:0 "The Mandate Cannot Continue"
 hsm_ver_grover.12.dead.d:0 "The news of Grover's death has reached the chancery. The household's undertaking ends with the person it was meant to protect; no succession ceremony can complete it now.\n\nThe royal mandate has been withdrawn. The remaining civil work must be accounted for without a fictitious ward, a promised appearance or a crown waiting for someone who will never arrive."
 hsm_ver_grover.12.custody.d:0 "The household can no longer certify that Grover is in our care. The council has withdrawn the mandate rather than continue to issue orders in the name of someone for whom it cannot answer.\n\nThe clerks have no authority to turn uncertainty into a death notice or foreign custody into our own. They will close the regency's accounts according to the evidence they possess. Civil administration must find its authority elsewhere."
 hsm_ver_grover.12.government.d:0 "The authority under which the royal mandate was given no longer supports it. Grover's presence alone cannot preserve the former government's right to act for him.\n\nThe regency's undertaking has therefore been withdrawn. Its records remain, including the promises made and the work left incomplete. The next civil settlement must answer for its own authority, without treating an interrupted mandate as an accomplished coronation."
 hsm_ver_grover.12.a:0 "Record what ended and what remains unfinished."
 hsm_ver_grover.13.t:0 "No Longer a Ward"
 hsm_ver_grover.13.d:0 "Grover has reached his majority. The household's instructions concerning his upbringing are closed, and the administration must now address him as an adult.\n\nThat change does not itself complete the transfer of a country. The agreed preparations still have to be finished, Herzland must be securely held and peace must allow its government to take office. Any outstanding work belongs to the transitional administration, not to an extension of Grover's childhood.\n\nThe regent owes him an account of what remains to be done and a transfer when those obligations can be fulfilled."
 hsm_ver_grover.13.a:0 "His adulthood is settled; the remaining duty is ours."
 hsm_ver_grover.lapsed.a:0 "This hearing no longer has a valid mandate."
