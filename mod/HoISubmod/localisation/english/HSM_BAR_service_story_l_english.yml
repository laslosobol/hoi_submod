l_english:
 hsm_bar_service.1.t:0 "The Names Beneath the Oath"
 hsm_bar_service.1.d:0 "Marta Krzemien, the earth-pony doctor, has brought the names of the first patients from the reopened fields. Beside them lie the sheets Seweryn Olcha salvaged from the Pentarchy's laboratories. Several bear his own corrections. He has turned those pages face down.\n\nThe new Service needs a charter. Jadwiga Wrona wants every order traceable to whoever gave it; she remembers doors opened during the uprising and prisoners who could name none of their keepers. Olcha asks what happens when the wrong reader finds that list.\n\nThey agree that the cabinet must never receive it. They cannot agree whether anyone should. At the top of the sheet Marta writes the full name: Service for Containment and Preservation. Beneath it, the space for signatures is still empty."
 hsm_bar_service.1.a:0 "Keep the names in the sealed original."
 hsm_bar_service.1.b:0 "Record authorizations by code alone."
 hsm_bar_service.2.t:0 "Three Knocks Beneath the Floor"
 hsm_bar_service.2.d:0 "The village carpenter describes three knocks beneath his daughter's bed. He lifted the boards; there was only packed earth. The child now sleeps in the kitchen, and the knocking has followed her. Her mother says the intervals are those her missing brother used when he came home late.\n\nThe carpenter's first letter went unanswered. The second received advice on draining the foundations. Marta has the third, with a strip of cloth enclosing a little soil. Nothing about the soil looks unusual. She has already packed her instruments.\n\nOlcha asks her to wait for an account from another household. Wrona offers to accompany her, but the nearest medical station will have to find a replacement for the journey."
 hsm_bar_service.2.a:0 "Arrange cover at the station. Go to the family."
 hsm_bar_service.2.b:0 "Keep in touch; wait for another witness."
 hsm_bar_service.3.t:0 "A Second Tooth"
 hsm_bar_service.3.d:0 "Two sealed tubes came out of the abandoned surgery. Wrona saw one tooth in each. At the examination table there are three, and the wax on both stoppers appears untouched.\n\nThe assistant who carried them remembers stopping at the washroom. Olcha remembers leaving that assistant alone. Neither can say whether the spare tooth was there before the tubes were opened. The first measurements, taken in haste, might already belong to different specimens.\n\nMarta sets the instruments down. She wants the route retraced and everyone questioned separately before anyone draws a conclusion. Olcha fears losing the only useful comparison; he would continue under a provisional number, leaving the discrepancy beside every result."
 hsm_bar_service.3.a:0 "Suspend the measurements. Reconstruct what happened."
 hsm_bar_service.3.b:0 "Continue under a provisional identification."
 hsm_bar_service.4.t:0 "The Last Descent"
 hsm_bar_service.4.d:0 "The stair gave way on Wrona's second descent. A bearer went through the landing; the griffon caught his harness in her talons, but the falling case broke his leg against the wall. Below them, the lamp still lit the sealed recess they had come to examine.\n\nWrona cut the case loose. By the time they reached the surface the passage had closed. The bearer is alive. The material remains below.\n\nOlcha has spent three nights reconstructing the measurements they lost. He does not accuse Wrona of cowardice. He asks whether every field leader may abandon a recovery, even when waiting could make it impossible. Marta answers while changing the bearer's dressing. She wants reserve equipment and a retreat order no laboratory can overrule."
 hsm_bar_service.4.a:0 "Give field leaders the right and means to withdraw."
 hsm_bar_service.4.b:0 "Recovery remains the priority, despite the risk."
 hsm_bar_service.5.t:0 "The Handwriting in the Margin"
 hsm_bar_service.5.d:0 "A page from the Pentarchy's notebooks shows the same instrument as the next page, with one difference: the lead shielding has been moved outside the observation booth. The published result is better. The notes beneath it mention headaches, then lost sleep, then nothing.\n\nOlcha identifies the change before Marta asks. The unicorn touches the pale scar below his horn. He was the assistant who suggested it. He had thought the shielding was interfering with the reading.\n\nThe last page is stuck to the cover. Wrona separates it over steam. In the margin, beneath an order to repeat the trial, someone has written: «The reading is correct. The interpretation is not.» The entry for the observer has been scraped away.\n\nOlcha asks for the notebook intact."
 hsm_bar_service.5.a:0 "Keep the failed trials with the working drawings."
 hsm_bar_service.6.t:0 "The Room on the Plan"
 hsm_bar_service.6.d:0 "The first chamber is ready. Its doors close properly; the ventilation draws outward; an observer can reach the alarm without approaching the inner wall. There is nothing inside.\n\nDuring the final inspection Marta notices that the plan copied from the Pentarchy's stores shows a second door. The builders did not install it: it would open into solid rock. Olcha finds its label beneath a pasted correction. «Return passage. See enclosure: REMOVED.»\n\nWrona proposes testing the room with instruments outside it before bringing anything through the first door. The superintendent objects that the empty chamber is consuming staff and power. Marta gives him the old plan. He stops asking when it will be filled."
 hsm_bar_service.6.a:0 "Keep the chamber empty until its limits are known."
 hsm_bar_service.7.t:0 "What the Republic Pays For"
 hsm_bar_service.7.d:0 "Michal Zawisza has asked every provincial clinic for a list of medicines it cannot obtain. He wants to put a purchasing office at their disposal before winter. Marta helped him draft the request; now she wishes she had asked where the replies would be compared.\n\nThe Service's isolation wards need the same rare sedative as three ordinary hospitals. Their orders still pass through those hospitals, under the names of patients who never occupied their beds. A diligent clerk could bring all three lists to Zawisza.\n\nA separate medical buyer would keep the wards supplied without using the clinics. Its orders would no longer appear in the hospitals' patient lists. Olcha offers to keep the shared buyer and place another intermediary between the names."
 hsm_bar_service.7.a:0 "Arrange a separate supplier for the isolation wards."
 hsm_bar_service.7.b:0 "Keep the shared buyer behind an intermediary."
 hsm_bar_service.8.t:0 "One Question for a Stranger"
 hsm_bar_service.8.d:0 "On the table are two drawings of a protective circle. The first came from an abandoned Barradian treatment room. The second was copied from a foreign medical journal. A gap appears in precisely the same place, although the authors give different reasons for leaving it.\n\nOlcha wants the overseas author questioned. Marta reminds him that the drawing may have kept patients alive for years. There will be no unannounced search, no offer to buy the original through a frightened assistant.\n\nTheir intermediary will ask about the gap and offer the measurements from Barrad in return. The accompanying note names neither the laboratory nor the Service. It does name the injuries observed when the circle was closed."
 hsm_bar_service.8.a:0 "Ask about the gap. Share the relevant warning."
 hsm_bar_service.9.t:0 "The Audience That Was Not Requested"
 hsm_bar_service.9.d:0 "Wrona reads the proposed assignment twice. Its subject occupies a throne, but the attached plan might have been drawn for removing a specimen from an empty house. There is a route in, a route out and no account of what happens to anyone between them.\n\nOlcha has written «no examination possible» across the plan. Marta asks him to explain. He means that the testimony describes power exercised over a country; it does not show what a visitor could touch, measure or safely remove.\n\nWrona closes the travel order. A field officer will have to begin with witnesses and a means of lawful approach, however long that takes. The dossier keeps its subject. It loses its arrest instructions."
 hsm_bar_service.9.a:0 "Replace the seizure plan with an access assessment."
 hsm_bar_service.10.t:0 "The Missing Seventh Minute"
 hsm_bar_service.10.d:0 "The copy intended for a foreign laboratory describes a stable response lasting six minutes. Marta remembers the seventh. The observation bell did not ring; everyone behind the glass turned towards a wall on which nothing was moving. Olcha still cannot account for the next thirty seconds.\n\nIn the outgoing copy the interval has become a black rectangle. The address of the laboratory remains beneath it. Someone protected the result from embarrassment more carefully than they protected the staff.\n\nMarta dictates a replacement: «Do not maintain exposure beyond the recorded limit. Withdrawal must be initiated by an observer outside the chamber.» The location and the witnesses' names will stay in the sealed original."
 hsm_bar_service.10.a:0 "Restore the warning. Conceal the witnesses."
 hsm_bar_service.11.t:0 "A Grave With No Name"
 hsm_bar_service.11.d:0 "The packet contains a photograph of a ruined courtyard and a report that its former master is dead. A pencilled arrow points to a pale shape beside the steps. One correspondent calls it a body. Another calls it the remains of a statue. Neither took the photograph.\n\nWrona lays her magnifier down. Beneath the arrow, the picture has been retouched. Olcha asks to retain it anyway: the untouched edge shows a mark mentioned in an older account. The reference number on that account is restricted.\n\nBefore anyone travels, they will need the photographer, the unaltered negative and a witness who saw what remained. Marta refuses to reserve a table in the examination room."
 hsm_bar_service.11.a:0 "Establish the provenance before authorizing recovery."
 hsm_bar_service.12.t:0 "Water for the Upper Street"
 hsm_bar_service.12.d:0 "The workshop pump has completed its trial without shaking the bolts loose. Olcha's alteration is small: a different mounting and a way to detect vibration before it reaches the housing. The measurements came from an investigation whose other pages will never leave the archive.\n\nMarta brings a map of the village above the old canal. Its upper street still carries water uphill in buckets because the pump there breaks every few weeks. The workshop can send drawings now. A second engineer wants to repeat the trial with a worn machine, closer to what the villagers actually own.\n\nWrona has seen the climb. She asks how long they intend to make it wait."
 hsm_bar_service.12.a:0 "Send the tested drawings to the village workshops."
 hsm_bar_service.12.b:0 "Have an independent workshop repeat the trial first."
 hsm_bar_service.13.t:0 "The Bearer Returns"
 hsm_bar_service.13.d:0 "The bearer from the collapsed stair has come back for his equipment. Marta makes him walk the length of the room before signing his discharge. He favours the healed leg, though he insists that he does not.\n\nWrona has kept the piece of harness she cut underground. He asks for it, feels the severed end, and leaves it on her desk. Then he asks to read the order governing the next descent. Neither of them mentions the case still buried below.\n\nMarta attaches a copy of the order to his treatment record before the two leave."
 hsm_bar_service.13.a:0 "Keep the order with his treatment record."
 hsm_bar_service.14.t:0 "The Minister's Three Patients"
 hsm_bar_service.14.d:0 "Zawisza has found three patients with identical prescriptions, each admitted to a different hospital on the same day. The hospitals have no record of treating them. He suspects that medicines intended for provincial wards are being sold elsewhere.\n\nHis request for an explanation reaches Marta with a personal note: he trusts her to tell him if his purchasing office has failed. She recognizes the three false names. Beneath them are the real dosages for the Service's isolation wards.\n\nThey can reconcile the hospitals' records and move those wards to separate funding. Olcha offers a quicker transfer to another buyer. It would keep the medicines coming, but Zawisza would still have his unanswered question."
 hsm_bar_service.14.a:0 "Reconcile the records and separate the wards' funding."
 hsm_bar_service.14.b:0 "Move the purchases; leave the inquiry unanswered."
 hsm_bar_service.15.t:0 "The Pump at Daybreak"
 hsm_bar_service.15.d:0 "The independent workshop sends back the drawings with a correction. Olcha allowed too little clearance around a worn bearing. The second engineer has adjusted it, run the pump until morning and invited the village mechanic to watch it start again.\n\nMarta goes to the upper street without her medical bag. The new fitting is already in place. At the standpipe, a mare tells her that the water takes a moment to clear, but at least it reaches them now. She does not know who first made the measurements.\n\nOn the way home Marta buys a fresh notebook. The first page will record where the improvement has been installed, rather than where someone has fallen ill."
 hsm_bar_service.15.a:0 "Send out the corrected drawings."
 hsm_bar_service.20.t:0 "Equus: A Circle Left Open"
 hsm_bar_service.20.d:0 "The first Equus cell rents rooms above a surgery. Its medical correspondent has sent a rubbing from an old protective inscription. The owner calls it an ornament; a retired healer refused to let the builders remove the stone.\n\nMarta recognizes the gap in the circle from a Barradian notebook. On the reverse of the rubbing, the correspondent has written: «She would discuss the inscription until I asked what it faced. Then she asked who had sent me.»\n\nThe healer is willing to receive one visitor, without instruments. Wrona tells the cell to accept those terms. Olcha asks that the visitor also note which room the old pony refuses to enter."
 hsm_bar_service.20.a:0 "Send someone who will listen before measuring."
 hsm_bar_service.21.t:0 "Griffonia: The Erased Accession"
 hsm_bar_service.21.d:0 "A museum catalogue acquired by the Griffonian cell includes a portrait of its former curator. Behind him stands a cabinet absent from every floor plan. A narrow strip has been pasted over the accession list beneath the photograph.\n\nThe librarian remembers the cabinet being moved after complaints from the night attendants. She can name the carpenter, but she will not give his address until someone agrees to visit in daylight.\n\nWrona leaves the catalogue open beside a copy of the Pentarchy's purchases. The descriptions are too vague to match. One seller's mark appears in both. The local officer receives permission to speak to the carpenter, not to enter the museum after closing."
 hsm_bar_service.21.a:0 "Begin with the carpenter's account."
 hsm_bar_service.22.t:0 "The North: A Light Across the Water"
 hsm_bar_service.22.d:0 "The northern director Irma Kalk's first report arrives with a map drawn by a fisherman. He has marked a light seen across the water on three successive nights. At dawn, each time, the shore was empty. Another witness names a chapel that the fisherman says was pulled down before he was born.\n\nKalk has rented a room facing that shore. She asks for warmer clothing and the uncensored appendix to an old Barradian account of lights under a sealed door. The requested appendix bears Olcha's former laboratory number.\n\nHe authorizes a copy with two passages withheld. Kalk acknowledges receipt, then asks why the omitted passages have exactly the length of the witness's description."
 hsm_bar_service.22.a:0 "Keep Kalk at the shore. Preserve her questions."
 hsm_bar_service.23.t:0 "Riverlands: Against the Current"
 hsm_bar_service.23.d:0 "A surveyor working with the Riverlands cell has marked a bend where boatmen stop trusting their compasses. Their explanations differ. One will not carry iron past it; another has never noticed anything wrong. The surveyor asks permission to take readings from both banks.\n\nHis preliminary sketch interests Olcha more than the stories. The deviation could come from the ground beneath the channel. A similar distortion has made several Barradian surveys unreliable, leaving restoration crews afraid to cross their own boundary marks.\n\nMarta asks him to send a second needle and record the weather. In the margin she adds a practical question: is anyone using the uncertainty to charge boatmen for safe passage?"
 hsm_bar_service.23.a:0 "Survey both banks, with a second instrument."
 hsm_bar_service.24.t:0 "Zebrica: The Witness Who Was a Song"
 hsm_bar_service.24.d:0 "The Zebrican cell's first interview concerns a place where, the interpreter says, the same traveller has been welcomed for generations. Asked for a name, the speaker sings a verse. Asked when the traveller last came, she repeats it with a different ending.\n\nThe interviewer has underlined «the same» three times. The interpreter crosses out the underlining. It might describe a person, an inherited duty or the part taken by each guest in a ceremony. No one present will point out a grave or a house.\n\nWrona returns the draft without its proposed title. The cell is to find who taught the verse and ask permission to hear it again in its proper setting. The first recording remains sealed with the translation."
 hsm_bar_service.24.a:0 "Keep the recording. Seek a second conversation."
 HSM_BAR_archive_open_tt:0 "Opens Barrad's local case office and restricted archive. Rumours, field investigations and completed studies remain separate stages."
 HSM_BAR_courier_chain_tt:0 "Authorizes the courier investigation and convoy diversion. The plot is resolved only after their operations and reports."
 HSM_BAR_research_not_discovery_tt:0 "Authorizes the suppression laboratory; grants no knowledge or completed project. The listed anomaly studies and subsequent research project are still required."
 HSM_BAR_careful_retrieval:0 "The Right to Return"
 HSM_BAR_careful_retrieval_desc:0 "Wrona's teams carry a spare line and leave a reserve at the surface. A field leader may stop a recovery without first persuading the laboratory that the danger is real."
 HSM_BAR_expedited_retrieval:0 "Recovery at Any Cost"
 HSM_BAR_expedited_retrieval_desc:0 "The laboratories receive material sooner. In the treatment room, Marta keeps a second list: those sent back below before she would have released them."
 HSM_BAR_applied_findings:0 "Knowledge Returned to the Villages"
 HSM_BAR_applied_findings_desc:0 "The origin of the measurements remains sealed. The corrected drawings do not: village mechanics use them to keep pumps running and worn machinery in service."
 HSM_BAR_replicate_bulletin:0 "Repeat the Pump Trial"
 HSM_BAR_replicate_bulletin_desc:0 "The village machine has worn bearings and a patched housing. An independent workshop will repeat Olcha's trial under the conditions the drawings must actually survive. Marta wants the mechanic present when it starts."
 HSM_BAR_review_retrieval_order:0 "Revise the Recovery Order"
 HSM_BAR_review_retrieval_order_desc:0 "Marta has attached the bearer's restricted-duty certificate to the standing order. Wrona proposes reserve crews and authority to withdraw. The field supervisors must be retrained before anyone descends under the new rules."
 HSM_BAR_returned_findings:0 "Useful, tested findings were circulated through civilian contractors"
 HSM_BAR_replication_pending:0 "Independent replication is awaiting funding"
 HSM_BAR_selective_suppression:0 "The trial site was physically isolated"
 HSM_BAR_extended_test:0 "The connected gallery was chosen for the trial"
 HSM_BAR_secure_storage:0 "Secure storage premises are ready; magical containment still needs research"
 HSM_BAR_project_containment_done:0 "The containment research project is complete"
 HSM_BAR_project_suppression_done:0 "The suppression apparatus research project is complete"
 hsm_bar_service.13.d_careful:0 "The bearer from the collapsed stair walks into the equipment room without crutches. Wrona shows him the new harness, the spare line and the signal by which anyone in the group can demand a halt. He tests the buckle twice.\n\nHe asks what happens if the laboratory insists they continue. Wrona opens the withdrawal order at her own signature. His return does not require another descent; a place at the surface station is waiting. He takes that assignment.\n\nMarta watches him carry the lighter case out to the yard. The limp is still there. In his treatment record she notes that the next team will have a second bearer."
 hsm_bar_service.13.d_priority:0 "The bearer from the collapsed stair has returned before Marta would have preferred. The next recovery has already been assigned, and his name is on the team. He reads the instruction that material must reach the surface before withdrawal, then reads it again.\n\nWrona says she will take his place beside the case. He points out that someone must still carry the injured if the stair gives way again. She has no extra bearer to offer.\n\nMarta signs him fit for light duty only and attaches the restriction to the recovery order. Olcha receives both sheets. The old case remains under the rubble; for the first time he asks what it would cost to change the standing order."
