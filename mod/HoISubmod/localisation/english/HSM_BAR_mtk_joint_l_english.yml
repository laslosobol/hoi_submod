 HSM_BAR_mtk_sensate_prosthesis_title:0 "The Borrowed Touch"
 HSM_BAR_mtk_sensate_prosthesis_idea:0 "Joint proposal, rehabilitation room.\n\nLeopold's replacement limb holds a cup, but its wearer must watch every movement. Silver's pain sessions sometimes make that movement bearable; they do not tell the wearer how firmly the cup is held. The carpenter has asked whether these two appointments might happen in the same room. We propose a fitting that reports pressure through a separate, healthy contact point. It would borrow an existing sensation rather than promise a restored one. Mechanical fitting and the signed phantom-pain comparison must precede admission.\n\nLeopold will coordinate the apparatus. Silver retains authority over patient admission and withdrawal. The carpenter has reserved the right to dislike the cup we provide."
 HSM_BAR_mtk_sensate_prosthesis_theory:0 "Leopold's diagram, with Silver's annotations.\n\nA pressure change at the artificial limb can move a padded contact against intact skin. The wearer must learn this signal; the drawing provides no reason to call it the sensation of the missing limb. A small crystal damps abrupt movement but carries no identity or memory. Silver proposes separate comparisons with feedback present, absent and deliberately delayed, using only comfortable loads. Pain relief will be recorded independently of successful handling.\n\nSilver: A quieter patient is not proof of a better instrument.\nLeopold: Then the release belongs to the wearer.\nSilver: It already did. Draw it where they can reach it without looking."
 HSM_BAR_mtk_sensate_prosthesis_tests:0 "Combined workshop and clinic register.\n\nSix volunteers used individually fitted devices. Four learned to distinguish the ordinary pressure signals and needed fewer visual checks when placing light objects. Two found the additional sensation distracting and returned to their earlier fittings. During a delayed-signal comparison, one volunteer gripped harder instead of less; the device was removed immediately. No injury followed, but all later fittings retained a strict travel stop and an ordinary mechanical release. Phantom pain improved in only two participants, with no reliable difference attributable to the feedback attachment.\n\nThe carpenter chose the unenchanted contact pad. Leopold had prepared a speech about the crystal. Silver took him outside before he could deliver it."
 HSM_BAR_mtk_sensate_prosthesis_conclusion:0 "Joint acceptance: limited rehabilitation aid.\n\nThe attachment provides useful learned pressure feedback for some wearers. It does not restore natural sensation, cure phantom pain, or remove the need for fitting and follow-up. Civilian workshops may reproduce the documented fittings alongside rehabilitation appointments; medical service teams may retain the same apparatus for returning experienced patients to suitable duties. Neither application permits compulsory use or an assumption that discomfort is resistance to progress. A rejected attachment is not a failed patient.\n\nSigned: Leopold and Silver Star.\nThe carpenter's addition: I dropped your cup while laughing. Please record that the instrument was working.\nLeopold: Recorded. I have ordered less expensive cups."
 HSM_BAR_mtk_interrupt_notation_title:0 "An End Written In"
 HSM_BAR_mtk_interrupt_notation_idea:0 "Joint proposal from Viira and Asinti.\n\nViira's diagrams make an elementary spell reproducible by someone who did not write it. Asinti's brake lets an assistant end a sustained ritual without winning an argument with its leader. At present these are separate lessons, and the assistant must guess where one lesson joins the other. We propose notation that carries its own marked interruption points: not a universal ban on magic, but a procedure whose exit can be read before entry. The completed notation and brake reports are required together.\n\nViira will coordinate the written forms. Asinti insists that a pause in a drawing must become a pause in the room. He has brought his teaching drum."
 HSM_BAR_mtk_interrupt_notation_theory:0 "Transparent diagrams over the cadence sheet.\n\nEach tested sequence is divided at points where its sustaining pattern can be interrupted without transferring the remaining charge into the observer. The notation records the required discharge interval and what must still be watched afterwards. Asinti rejects Viira's first symbol because it resembles a completed stop while meaning only a request to stop. They replace it with two marks, one for the request and one for the measured return to the baseline.\n\nViira: We should have distinguished those from the beginning.\nAsinti: We did. In different rooms.\nTheir revised exercise allows an assistant unfamiliar with the author's preferred rhythm to identify, call and verify the ending."
 HSM_BAR_mtk_interrupt_notation_tests:0 "Report from the teaching chamber.\n\nThree instructors exchanged diagrams without attending each other's preparation. Assistants correctly identified the interruption points in the elementary sequences and ended them using the brake. A deliberately altered discharge mark produced a disagreement before the ritual began, which the instructors resolved by comparison with the reference sheet. The exercise was not resumed until both copies agreed. An unfamiliar compound ritual could not be translated into the notation without new measurements and was withdrawn from this series.\n\nAsinti interrupted Viira's demonstration halfway through her explanation. The field settled within the written interval. She asked why. He pointed to the assistant's request. She signed the report before asking for her sentence back."
 HSM_BAR_mtk_interrupt_notation_conclusion:0 "Accepted teaching and operational notation.\n\nThe tested notation links reproducible spell instructions to an independently verifiable ending. It reduces avoidable interruptions and repeated preparation in trained magical units; in civilian teaching it makes shared exercises easier to inspect and safer to repeat. Its scope remains the measured families of sustained rituals. It cannot dismiss an independent being, extinguish an unknown enchantment, or make a dangerous procedure harmless by putting a stop symbol beside it. New sequences still require their own trials.\n\nSigned: Viira and Asinti.\nSilver requests a copy for the classroom, not the operating theatre. Leopold asks whether the two marks might also distinguish an order to stop a machine from evidence that it has stopped. A separate proposal is opened."
 HSM_BAR_mtk_revolver_howitzer_tests_instrumented:0 "Instrumented protocol: handling rig and separate load benches.\n\nThe workshop reservation allowed us to measure transport effort, access for inspection and interruption of the handling cycle on separate inert rigs. The measurements arrived sooner than the sequential yard trial would have permitted. They did not rescue the gun. Moving the mock cylinder required more assistance than the ordinary comparison piece, and every simulated stoppage still held up the whole sequence. Repositioning and preparation consumed the promised gain. No firing trial was authorized; the apparatus remained inert throughout.\n\nLeopold: We paid for an earlier answer, not a different one.\nSilver: Put that above the order for a second prototype.\nLeopold has cancelled that order. The failure remains filed with the Manufactory's preparatory studies."
