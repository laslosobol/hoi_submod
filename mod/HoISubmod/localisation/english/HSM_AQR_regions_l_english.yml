l_english:
 HSM_AQR.10.a:0 "We will be held to our articles."
 HSM_AQR.10.d:0 "A clerk brought the provincial registers into the national archive this morning. Their familiar bindings look small between the imperial shelves. Delegates from the towns which supported us want an answer: will the promises made while we were weak survive now that we govern the capital? The first invitations will go to the other provinces. Each must be allowed to answer in its own name."
 HSM_AQR.10.t:0 "The Provincial Seal in the Capital"
 HSM_AQR.100.a:0 "Let the courts hear the complaints."
 HSM_AQR.100.b:0 "The captains will answer directly to me."
 HSM_AQR.100.d:0 "Michel places a confiscated schoolbook beside the reports of the last fighting. Its owner was arrested for a margin full of arguments about royal authority. The captain responsible insists that hesitation would have cost lives. Across the table, a magistrate asks which sentence in the book gave the order to shoot.\n\nThe duke has heard both arguments before, often from friends. Now the war is over and the decision will carry his seal. He can make emergency orders answerable to local courts, or retain a single executive command responsible directly to him. Either course will disappoint men who believed victory had settled the matter."
 HSM_AQR.100.t:0 "The Orders on Michel's Desk"
 HSM_AQR.101.a:0 "Give the representatives an effective right of review."
 HSM_AQR.101.b:0 "Let the cabinet act, then answer to the assembly."
 HSM_AQR.101.d:0 "The chair reserved for Michel stands beside the delegates' benches. He leaves it empty while a printer reads the proposed oath aloud. A minister would be obliged to explain a disputed order before the assembly, but the draft says little about what happens while that explanation is awaited.\n\nA veteran of the clubs wants local representatives to suspend contested measures until a hearing. Another delegate recalls a supply train held up while three committees exchanged letters. She proposes a cabinet able to act promptly, with ministers facing questioning afterwards. Michel asks for the final wording. He will sign a constitution that can inconvenience its government, provided everyone understands how it works."
 HSM_AQR.101.t:0 "The Chair Left Empty"
 HSM_AQR.102.a:0 "Let local hearings establish the facts."
 HSM_AQR.102.b:0 "Give the common executive authority to investigate."
 HSM_AQR.102.d:0 "A clerk has placed two petitions in the same folder. One demands the release of a detained royalist; the other accuses him of ordering a neighbour's death. The committee member reading them recognises both signatures. He fought beside one petitioner and borrowed a printing press from the other.\n\nThe clubs cannot keep settling such cases through friendship or applause. Some delegates want local courts and elected committees to examine complaints in public. Others propose a common executive with the means to investigate quickly and apply the same rules throughout Rila. Both promise trials. The argument is over who may begin acting before the whole committee has heard the evidence."
 HSM_AQR.102.t:0 "The Name Beneath the Accusation"
 HSM_AQR.103.a:0 "Bring the committee before elected representatives."
 HSM_AQR.103.b:0 "Keep a strong executive to defend the settlement."
 HSM_AQR.103.d:0 "Outside the meeting hall, workers are carrying the last paving stones back into the street. Inside, a Cocardier speaker warns that the enemies of the republic have merely changed their coats. A delegate from a smaller club holds up an unsigned detention order. Her brother carried messages for the committee; now a guard has taken him away.\n\nNobody proposes returning power to the old court. The question is whether the committee will submit its orders to elected civilian scrutiny, or retain a stronger executive able to direct workshops and armed forces together. The speaker looks towards the window. The barricade protected this hall. It cannot remain across the street forever."
 HSM_AQR.103.t:0 "When the Barricade Comes Down"
 HSM_AQR.104.a:0 "The court will answer its petitioners."
 HSM_AQR.104.b:0 "Give the governors authority to finish the work."
 HSM_AQR.104.d:0 "A noble places his family's seal beside the proposed commission for his nephew. Across the table, a village delegate lays down a plank from the unrepaired bridge. Both helped Jeanne's cause; both have come to collect. Jeanne asks the officers to remain while the obligations of her new government are read aloud. One draft preserves petitions and local guarantees that the court must answer before demanding further service. The other gives her appointed governors authority to direct reconstruction across the march, with the nobles supplying labour and transport. Neither restores the old military masters. Her supporters must decide whether their signatures bind them as firmly as they bind the marquise."
 HSM_AQR.104.t:0 "The Price of Their Signatures"
 HSM_AQR.105.a:0 "Let the towns fill the council."
 HSM_AQR.105.b:0 "A common cabinet, answerable to the representatives."
 HSM_AQR.105.d:0 "The chair beside Jeanne has been left empty until the coalition decides who may occupy it. A republican delegate proposes a council drawn from the towns, able to question appointments and withhold consent to new burdens. An officer answers that separate permissions will leave every damaged road waiting on another meeting. The alternative is a common cabinet, appointed by Jeanne but required to defend its programme before the representatives. It could direct the work across municipal boundaries while the courts hear complaints. The marquise places the original appeal between the drafts. Her return to government will depend on a bargain her partners can still recognise when their immediate enemy is gone."
 HSM_AQR.105.t:0 "The Seat beside Jeanne"
 HSM_AQR.106.a:0 "Give the civilian partners their share of authority."
 HSM_AQR.106.b:0 "Keep a national command for reconstruction."
 HSM_AQR.106.d:0 "Colette recognises the railway worker before he reaches the table. He carries the timetable used during the rising, with the promises to civilian organisers written on its reverse. The officers have brought a plan for national reconstruction under her direction. Their allies answer with a council that would approve military expenditure and place civilian ministers over the workshops. Colette can accept that division of authority, retaining command under the council's mandate. Or she can establish a stronger national executive, keeping the army at the centre of reconstruction while admitting organised civilian representation. The worker leaves the old timetable between them. Cooperation carried the revolution through its danger; its terms must now survive peace."
 HSM_AQR.106.t:0 "The Allies Bring Their Programme"
 HSM_AQR.107.a:0 "Let the harbour council hear the city."
 HSM_AQR.107.b:0 "One port command, with duties plainly assigned."
 HSM_AQR.107.d:0 "The dockyard whistle sounds while Dennis is hearing the petition. Nobody rises: the foremen have agreed that this meeting matters more than the first shift. They propose a harbour council where workers and merchants can challenge requisitions and bring complaints against the guards. His captains offer a unified port command, responsible for freight, repairs and security, with appointed civilian officers to hear disputes. Dennis taps an old scar against the chair's arm. He knows how to take a harbour, and the city knows what that cost. His government must now decide whether ordinary work rests on a bargain with its inhabitants or on a command capable of keeping every quay moving."
 HSM_AQR.107.t:0 "The Whistle after the Fighting"
 HSM_AQR.108.a:0 "The communes retain the right to recall."
 HSM_AQR.108.b:0 "Give the common secretariat a working mandate."
 HSM_AQR.108.d:0 "The baker has brought the key used for the militia's storehouse. He asks which assembly should receive it now. One delegate proposes a federation council whose members remain bound by local instructions and can be recalled before the next session. Another points to the waiting bread carts: a joint secretariat needs authority to allocate supplies and organise defence without seeking permission for every journey. Its mandate would still come from the communes, but their disagreements would be settled after common orders had been issued. The room grows quiet when the baker places the key on the table. They promised a revolution without masters. They also promised that the hungry districts would not be left to fend for themselves."
 HSM_AQR.108.t:0 "Who Keeps the Bakery Key?"
 HSM_AQR.109.a:0 "A strong state must hear a challenge."
 HSM_AQR.109.b:0 "Give the directorate authority to act together."
 HSM_AQR.109.d:0 "The investigator reads the merchant's testimony, then turns to a speech made by a fellow revolutionary. A delegate interrupts: the first describes a stolen shipment, the second a disagreement about command. The movement's founders insist that Aquileia cannot survive by trusting every declared friend. Some nevertheless propose a national council with public hearings and a right to challenge security orders. Others want a directorate able to coordinate industry and defence, with its own inspectors checking abuses after urgent decisions are carried out. Both intend to build a strong revolutionary state. The question is whether its citizens can question an accusation before the machinery set in motion against them has finished its work."
 HSM_AQR.109.t:0 "Two Names on One Page"
 HSM_AQR.110.a:0 "Bring the councils into the parliamentary settlement."
 HSM_AQR.110.b:0 "Give the elected coalition a firm executive mandate."
 HSM_AQR.110.d:0 "A communard unfolds the paper carried from the meeting in the forest. Its last sentence postpones the argument about property until victory. The FJA representative places a draft labour law beside it and points out that victory has arrived. One proposal would give municipal and workplace councils a continuing part in social policy, with the elected assembly settling disputes. The other would entrust reconstruction to a stronger coalition cabinet, responsible to parliament for a common industrial programme. Both retain contested elections, lawful opposition and the possibility of losing office. The clinic attendant waits with the next supply request. A government must be formed, but the partners will not be asked to sign away the right to disagree with it."
 HSM_AQR.110.t:0 "The Questions Left in the Forest"
 HSM_AQR.111.a:0 "Give the communities a right to challenge demands."
 HSM_AQR.111.b:0 "My government will coordinate and answer for them."
 HSM_AQR.111.d:0 "A village carter has brought the palace a broken wheel and a royal requisition receipt. His team was taken during the fighting. He wants to know whether loyalty will plough his field this spring. Gadiffer's steward offers compensation, but the carter points to the receipt: that was promised already.\n\nAn officer warns that letting each village refuse a demand would leave the duchy unable to support any common defence. The local delegates ask for a binding right to challenge what they cannot provide. Gadiffer can place those hearings between the crown and his subjects, or make his own government responsible for coordinating demands and answering for the burden."
 HSM_AQR.111.t:0 "The Duke's Own Cart"
 HSM_AQR.112.a:0 "Let the communities help write the programme."
 HSM_AQR.112.b:0 "Give a common council the means to coordinate it."
 HSM_AQR.112.d:0 "The schoolroom is too small for the meeting, so the ABC organisers open the windows and move the blackboard into the yard. A student writes a plan for rebuilding Vinovia. Before she reaches the second line, a mill worker asks why every speaker so far has come from the same lecture hall.\n\nThe question draws laughter, then an uncomfortable silence. Local councils could choose their own priorities and send accountable delegates to a common congress. A stronger coordinating council could instead gather scarce teachers and workshop capacity where they are most needed. Both plans promise a social republic. The movement must decide how much of its programme it is prepared to let its new neighbours rewrite."
 HSM_AQR.112.t:0 "Who Gets the Chalk?"
 HSM_AQR.113.a:0 "Keep the guard answerable to its communities."
 HSM_AQR.113.b:0 "Coordinate the guards through a common executive."
 HSM_AQR.113.d:0 "The captain of a local guard brings a petition to the town hall. His men protected the district through the fighting, and he wants a permanent command capable of moving them wherever danger appears. The hall's keeper remembers the same men helping her carry soup to the wounded. She also remembers promising the neighbours that their guard would remain answerable to them.\n\nThe Chevaliers must choose how to make that promise endure. Town councils could retain close control over their own institutions, or a common executive could coordinate the guards and workshops across Vinovia. The captain places his sword on an empty bench. For once, nobody asks him to lead a procession."
 HSM_AQR.113.t:0 "The Guard and the Town Hall"
 HSM_AQR.114.a:0 "Hear the provinces before settling the rules."
 HSM_AQR.114.b:0 "Let a professional executive carry out the programme."
 HSM_AQR.114.d:0 "The proposed civil code lies open beneath a petition marked by a muddy clawprint. Its author has travelled from a village whose customary water rights do not fit the categories in the draft. A society jurist explains that equal citizenship requires common rules. A former teacher asks him to explain those rules to the farmer waiting outside.\n\nThe new government can let provincial representatives examine how reforms affect local practice, or give a professional executive the authority to apply a common programme and review disputes afterwards. Neither approach excuses arbitrary rule. The disagreement concerns how much of a citizen's life the reformers should understand before they decide what must change."
 HSM_AQR.114.t:0 "The Petition with a Muddy Clawprint"
 HSM_AQR.20.a:0 "We cannot endorse this national settlement."
 HSM_AQR.20.b:0 "Sign the articles of accession."
 HSM_AQR.20.d:0 "An envoy has delivered the new Aquileian government's articles. Local courts and elected councils would keep their ordinary duties, but foreign policy, the army and the common treasury would pass to the capital. This is an invitation to become part of one country. Our signatures would end the separate authority of the provincial government. The delegates have asked for the doors to be closed while they decide."
 HSM_AQR.20.t:0 "The Capital Invites Our Delegates"
 HSM_AQR.200.a_desc:0 "Rila's charter has travelled with its delegates to the national assembly. Entrusted with a mandate for the reunited country, Michel opens it before him. A delegate asks whether its protections will travel beyond the duke's former borders. Michel invites her to mark the passage she wants preserved.\n\nThe clerks will need another clean copy. For once, nobody suggests that a royal signature should spare them the trouble. The government taking shape around the table must hear complaints from places Michel has never visited."
 HSM_AQR.200.b_desc:0 "The habits Michel learned governing Rila now face the demands of an entire country. Provincial representatives have entrusted Michel with a national mandate, and his first cabinet meets over a map stained by spilled tea. Couriers need roads reopened; commanders need to know whose orders bind them.\n\nMichel draws a line through a request for indefinite emergency powers. His government will issue one set of instructions, but every minister must sign the orders for which he answers. The court discovers that proximity to the duke also brings responsibility."
 HSM_AQR.200.t:0 "A Crown's New Responsibility"
 HSM_AQR.201.a_desc:0 "Delegates from the reunited Aquileia arrive carrying their own amendments to Rila's charter. Michel cannot settle their claims by invoking his ducal title; the national assembly must decide what place a crown will have in the new order. He takes a seat while a provincial speaker challenges the draft before them.\n\nThe dispute lasts well into the evening. When the lamps are lit, the visitors are still arguing, and nobody has ordered the doors closed. The agreement that once restrained one duke is becoming a promise made between provinces."
 HSM_AQR.201.b_desc:0 "The new Aquileian cabinet inherits Rila's habit of acting first and defending its decisions before the assembly afterwards. Its first railway order crosses several provincial boundaries and brings an angry delegation to the chamber. Michel sits through their questions alongside the ministers who signed it.\n\nHis ducal title has not settled the national crown's position; that remains the assembly's decision. For today, the argument concerns freight wagons. A constitution proves its strength in such ordinary disputes, when an executive accustomed to giving orders must remain in the room for the answers."
 HSM_AQR.201.t:0 "The Charter Travels"
 HSM_AQR.202.a_desc:0 "The first assembly of reunited Aquileia contains speakers who opposed the clubs throughout the revolution. One asks for the floor and receives it, to the audible displeasure of several veterans. His complaint concerns a provincial newspaper whose editor has been threatened for criticising the new government.\n\nThe chair calls the responsible delegate forward. Victory has given the clubs a larger country to govern, and far more people who will disagree with them. By the end of the hearing, the visitors know where to bring a complaint. The veterans know that the hearing will not always be comfortable."
 HSM_AQR.202.b_desc:0 "Aquileia's common executive receives its first demand for a coordinated reopening of the provincial railways. It issues the order before the assembly has finished debating the timetable. Within days, an opposition newspaper calls the decision an insult to the towns whose freight has been left waiting.\n\nThe minister arrives at the next sitting with the dispatch book under his arm. The government has chosen to act decisively, and must now defend the priorities it imposed. The clubs have neither dissolved the opposition nor promised to agree with it. They have given it someone who must answer."
 HSM_AQR.202.t:0 "The Opposition Takes Its Seat"
 HSM_AQR.203.a_desc:0 "The assembly of reunited Aquileia asks the revolutionary committee to surrender an authority it once exercised without question. Its delegates arrive with the original emergency orders tied in a bundle. Some regard the handover as a victory; others fear that men who never faced the old regime will waste what was won.\n\nA provincial deputy asks to inspect the bundle before making a speech. The committee agrees. The republic is extending equal law across its territories, and that law must reach the people who guarded its first meeting rooms as well."
 HSM_AQR.203.b_desc:0 "The committee's dispatch room now serves a reunited Aquileia. Factory representatives wait beside officers for decisions on the same crowded railway lines. A common executive can choose priorities quickly, and its members have grown accustomed to doing so. Beyond the doorway, former allies are asking when they will be invited to argue those priorities.\n\nThe chair orders another bench brought into the room. Keeping the committee's authority has not made every critic a monarchist. Its hardest task will be hearing a republican objection without treating the delay it causes as proof of treachery."
 HSM_AQR.203.t:0 "The Republic Beyond the Barricades"
 HSM_AQR.204.a_desc:0 "The first delegation to arrive at the reunited capital carries a petition bound in plain cloth. Its members have heard that Jeanne once took a village's grievance past the soldiers at her door. Now they want the same hearing for their province. Experience in Westkeep prepared her for this national mandate; the delegates' agreement, rather than her family name alone, sustains it. She orders a place prepared for their witnesses. Behind them wait nobles who expected the new court to spare them the inconveniences of the old promises."
 HSM_AQR.204.b_desc:0 "The capital's receiving hall is crowded with governors awaiting Jeanne's instructions. A provincial envoy brings the authority granted by his own assembly and asks where it ends beside theirs. The marquise has won agreement to a common government, not inherited every local office with her title. She marks the powers assigned to the governors and returns the remaining questions to the envoy. Outside, their transport officers are already sharing wagons. The machinery that helped recover her march must now serve a country whose support was negotiated."
 HSM_AQR.204.t:0 "The First Aquileian Audience"
 HSM_AQR.205.a_desc:0 "The provincial delegates arrive with chairs borrowed from their own meeting halls. One is too broad for the space assigned to it. The resulting argument concerns neither upholstery nor protocol: the province wants assurance that its institutions will fit inside the new Aquileian settlement. Jeanne asks its delegates to explain the powers they were sent to preserve. Her national mandate builds on the provincial coalition's experience, but no hereditary claim could have supplied their consent. By evening the seating plan has changed, and the compact records a local court that the first draft omitted."
 HSM_AQR.205.b_desc:0 "The first common cabinet receives two competing instructions for the same railway junction. Each bears a valid provincial seal. Its minister lays both before the representatives and asks for a single authority to reopen the line. Jeanne supports the request, but the coalition insists on an account of whose traffic will wait and why. The cabinet wins permission for a common schedule. It must return to defend the results next session. Aquileia has gained a government capable of acting across its regions without treating the agreement that formed it as a completed formality."
 HSM_AQR.205.t:0 "Seats from beyond Westkeep"
 HSM_AQR.206.a_desc:0 "A former underground organiser arrives at the capital's supply ministry with an appointment approved by the council. The colonel at the entrance directs her to the visitors' queue. She asks him to read the signature again. Colette comes down from the meeting room and introduces the new minister to the staff herself. Unification has enlarged the army's responsibilities, but it has also brought the civilian partners the authority they were promised. That evening, the minister refuses a requisition which lacks an explanation. The officers must learn to give one."
 HSM_AQR.206.b_desc:0 "Colette's reconstruction headquarters has linked the provincial workshops into one supply programme. The first train arrives on time, carrying tools that three towns could not have obtained separately. At the platform, a workers' delegate points to a consignment made during compulsory overtime and asks when the promised civilian hearing will take place. Colette gives him a date and orders the responsible officer to attend. The national executive has kept its command, and its achievements are visible. So are the people bearing the cost of its urgency."
 HSM_AQR.206.t:0 "The First Civilian Appointment"
 HSM_AQR.207.a_desc:0 "Delegates from an inland province watch a dockworker challenge a naval requisition before the harbour council. They had expected Dennis to settle the matter with a shouted order. Instead, the council asks which civilian cargo would be delayed and sends the officer back for an answer. The agreement that joined their provinces to Aquileia promised something similar. Experience governing Pridea prepared Dennis for national responsibilities; the new mandate did not make every town his quarterdeck. The delegates leave with the council's procedure, intending to demand a hearing of their own."
 HSM_AQR.207.b_desc:0 "The first national convoy schedule hangs where Dennis once kept a chart of familiar coastal waters. Its inland connections were negotiated with provinces that accepted his leadership after the old political arrangement broke apart. A veteran captain claims priority for a ship belonging to an old comrade. The new port director refuses: another cargo has already been promised to the northern workshops. Dennis studies the schedule and lets the refusal stand. Central direction will accomplish little if every personal friendship can overrule the officers appointed to carry it out."
 HSM_AQR.207.t:0 "More than an Admiral's Promise"
 HSM_AQR.208.a_desc:0 "The newly federated communes send a replacement for a delegate who approved an unwanted supply levy. He protests that his place in the common council was earned during the fighting. His own assembly sends the instructions he disregarded. The council admits the replacement before continuing its business. Beyond Pridea, the promise of recall has become something a smaller community can actually use. The dismissed delegate leaves angry, but the bread carts still depart that afternoon. The federation has survived a change of representative without declaring the dissenting district an enemy."
 HSM_AQR.208.b_desc:0 "The common secretariat has redirected flour to a flooded district before the neighbouring assemblies could meet. Its decision saved the day's baking, but one commune now finds its reserves lower than promised. At the federal gathering, its delegate insists on an explanation in front of everyone. The secretariat presents the damaged road reports and accepts a repayment schedule. Aquileia's communes have given their centre real coordinating power. Keeping that power from becoming a permanent superiority will require more than good intentions whenever an urgent order leaves somebody else short."
 HSM_AQR.208.t:0 "A Delegate Sent Home"
 HSM_AQR.209.a_desc:0 "At the first national hearing, a workshop delegate is accused of undermining the revolution by opposing an allocation order. He asks the council to hear the workers who elected him. Their testimony concerns damaged machinery and an impossible delivery date, not a foreign plot. The accusation is withdrawn and the order revised. The movement still speaks of Aquileia's enemies, but its new institutions have refused to turn a practical objection into proof of treachery. Outside the chamber, the delegate answers questions from comrades who had expected him not to return."
 HSM_AQR.209.b_desc:0 "The directorate's common orders have brought the provincial foundries onto the same production schedule. For the first time, a workshop can obtain a missing component without appealing to three rival committees. The security office also requires permits for meetings that once needed only an available room. A former courier waits outside with a petition from her own cell. The directorate has made the reunited country's industry easier to command, but it has made familiar comrades harder to trust. Its inspectors will have to investigate a complaint about the very rules they enforce."
 HSM_AQR.209.t:0 "An Accusation in the Capital"
 HSM_AQR.21.a:0 "Publish the guarantees."
 HSM_AQR.21.d:0 "The signed articles have arrived. Behind the wax and ribbons are offices which must be combined, officers whose commissions must be recognised, and villages that expect the agreement to protect them. The envoys will return with copies bearing both seals."
 HSM_AQR.21.t:0 "A Provincial Seal Joins Ours"
 HSM_AQR.210.a_desc:0 "The first municipal contest in the reunited country gives a former communard ally enough seats to challenge the coalition's housing plan. Our organisers arrive at the hired hall expecting an attack on everything they built together. Instead, they find a proposal to change the rents and the order in which damaged homes are repaired. The disagreement is sharp, and it remains legal. Aquileia's parliamentary settlement has brought the old partners into institutions where cooperation does not require permanent agreement. The coalition must win the argument before it can win the vote."
 HSM_AQR.210.b_desc:0 "The coalition cabinet has directed reconstruction funds to the factories serving several provinces at once. Production has recovered, but a town left waiting for its housing programme invites an opposition speaker to explain a different budget. A minister suggests delaying the meeting until the cabinet's work is better understood. His parliamentary colleagues refuse. The government has authority to coordinate investment, not to suspend the contest over its choices. Its candidates will have to defend the common programme at the next election, including the promises that central priorities postponed."
 HSM_AQR.210.t:0 "The Opposition Hires a Hall"
 HSM_AQR.211.a_desc:0 "In Vinovia, Gadiffer learned that loyalty had to be answered with protection when royal demands reached a village. Representatives of the reunited country have now entrusted him with a national mandate, bringing the dispute he once heard in Vinovia to a much larger table.\n\nA provincial speaker asks whether the protections granted to the duke's own villages apply to hers. Gadiffer recognises the question before she finishes it. The promise that helped hold his duchy together must survive the moment when he becomes the authority other provinces need protection from."
 HSM_AQR.211.b_desc:0 "The experience of governing Vinovia has brought Gadiffer before provincial representatives, who have entrusted him with a mandate to govern the reunited country. The letters on his desk now come from places whose names his steward must locate on a map. Each asks for a decision, and several demand the same wagons.\n\nThe duke forms a common executive on the principle he applied in Vinovia: an authority that makes demands must answer for their consequences. Family loyalty brought him into the struggle, but it cannot settle these claims. His ministers will have to learn the country they have accepted responsibility for."
 HSM_AQR.211.t:0 "Loyalty Beyond Vinovia"
 HSM_AQR.212.a_desc:0 "The congress of reunited Aquileia is louder than the ABC founders expected. A village teacher objects to a plan drafted by university friends; a workshop delegate proposes something none of them discussed before the revolution. The chair keeps calling for patience, then realises that the room is doing what the movement asked of it.\n\nA social federation cannot remain the private seminar of its first organisers. The delegates begin revising the programme together. By evening, the blackboard contains several different handwritings, and the original author is helping a newcomer make room for another line."
 HSM_AQR.212.b_desc:0 "The common council of reunited Aquileia receives more requests for teachers than the ABC organisers can possibly meet at once. It assigns the first teams to districts where schools have remained closed longest. A delegation from another province arrives furious that its promised visit has been postponed.\n\nThe council must explain its priorities without treating disappointment as ignorance. Its members have accepted the power to coordinate the country's recovery, and now discover how many reasonable demands compete for the same resources. The lecture notes that once supplied every answer remain closed on the chair's desk."
 HSM_AQR.212.t:0 "The Congress Has New Voices"
 HSM_AQR.213.a_desc:0 "The Chevaliers explain their part in Aquileia's reunification through a confederal promise. Vinovia can protect its institutions more securely among provinces that recognise the same rights than beneath another distant, unrestrained centre. The new assembly will have to make that argument convincing beyond their homeland.\n\nA delegate from a smaller province asks to retain a local ceremony unfamiliar to the Vinovians. The chair invites him to describe it. This is the bargain the Chevaliers offered: their own traditions deserve protection because local communities deserve it, including communities whose customs they have never learned."
 HSM_AQR.213.b_desc:0 "A reunited Aquileia gives the Chevaliers a problem they cannot solve by invoking Vinovia alone. Their proposed confederation must protect provincial institutions while sustaining a common defence. They have accepted a firmer executive to coordinate that defence, and other provinces want to know where its authority ends.\n\nThe first joint command meeting begins with the provincial charter laid beside the campaign map. Officers receive common instructions, while local representatives challenge requests that reach beyond the agreement. The Chevaliers' reason for unification must survive their new ability to issue orders across someone else's homeland."
 HSM_AQR.213.t:0 "A Union Worth Defending"
 HSM_AQR.214.a_desc:0 "The society's members once borrowed arguments from distant republican movements. In reunited Aquileia, they must now answer questions from provinces close enough to send a delegation by morning. A local newspaper prints a sharp criticism of their proposed civil service appointments. The author is invited to explain the objection before the assembly.\n\nHe arrives expecting a reprimand and finds a place reserved among the speakers. The society's network has helped build a republic, but membership in that network cannot become a qualification for being heard. The chair asks the newspaper editor to publish the reply in full."
 HSM_AQR.214.b_desc:0 "The new Aquileian administration sends trained officials into provinces where the society previously knew little beyond a few correspondents. Their instructions are clear, their confidence considerable. The first returned report describes a town council refusing to abandon a longstanding arrangement for maintaining its wells.\n\nThe executive calls the official back to explain what the common rules would actually improve. Professional authority must be able to justify itself without sheltering behind a diploma. The society has chosen to govern decisively; its reputation will depend on whether expertise helps it recognise a mistake before that mistake becomes an order."
 HSM_AQR.214.t:0 "The Republic Reads Its Critics"
 HSM_AQR.22.a:0 "We have their answer."
 HSM_AQR.22.d:0 "The provincial delegates will not come. Their letter rejects the transfer of authority to the capital. Ministers who promised swift unity now have to explain whether they will accept a neighbour's refusal or seek a mandate to enforce the national claim."
 HSM_AQR.22.t:0 "The Empty Place at the Table"
 HSM_AQR.30.continue:0 "Join the national movement; continue as Aquileia."
 HSM_AQR.30.d:0 "The revolution is over, and the envoys from Aquileia have come for an answer. They bring orders placing our garrisons and provincial offices under the national government. Those who sign will carry their supporters into the movement already governing the capital. Across the table, opponents argue that the country must instead be led from here. The envoys will leave with our signatures or with a declaration of war."
 HSM_AQR.30.dismiss:0 "Circumstances have changed. Close these talks."
 HSM_AQR.30.game_over:0 "Join Aquileia and end our separate campaign."
 HSM_AQR.30.incorporate:0 "Join the national movement."
 HSM_AQR.30.lead:0 "Refuse. We will fight to lead Aquileia."
 HSM_AQR.30.t:0 "One Aquileia"
 HSM_AQR.300.a_desc:0 "The settlement concerns the Herzland territory presently in our hands. Border districts join Aquileia, while the remaining holdings pass to a dependent government. At the first hearing, a village representative produces two tax demands carrying different seals. He wants to know which authority will answer when both collectors return.\n\nMichel's commissioner sits down beside the interpreter. Local courts must be able to hear disputes arising from the new boundary, and the dependent government must have room to settle its own affairs. The document remains unsigned until the village receives an intelligible answer."
 HSM_AQR.300.b_desc:0 "A courier brings Michel the proposed division of the Herzland lands under our control. The border districts will be administered by Aquileia; the remaining holdings will support a dependent government. Beside the map lies a request to let every garrison negotiate its own arrangements with neighbouring towns.\n\nMichel refuses that convenience. The cabinet must issue common instructions and name the officers responsible for carrying them out. Local petitions will reach those officers through an interpreter, rather than being passed from one headquarters to another. The new frontier needs an authority that can give a definite answer."
 HSM_AQR.300.t:0 "The Boundary and the Seal"
 HSM_AQR.301.a_desc:0 "The Herzland settlement divides only the territory now held by our country. Aquileia takes responsibility for the border districts, and the remaining holdings receive a dependent government. Its delegates arrive with a demand familiar to Michel: no agreement should leave their assembly with nothing to discuss but orders already issued elsewhere.\n\nThe negotiating table soon fills with amended pages. Rila's experience gives the Aquileian representatives little excuse to object to every correction. The dependent government's powers must be written clearly, and the incorporated districts must have a voice in the state they have joined."
 HSM_AQR.301.b_desc:0 "The cabinet lays the division of our Herzland holdings before the assembly. It proposes a common administration for the border districts joining Aquileia and a dependent government for the remaining territory. Trains and customs posts cannot wait for every disputed clause, the responsible minister argues.\n\nThe deputies allow the work to proceed, then demand his return with the agreements signed locally. Michel watches the minister mark the date in his notebook. Executive freedom has a familiar companion: the obligation to explain what was done with it to representatives who were absent when the order went out."
 HSM_AQR.301.t:0 "A Charter Across the Boundary"
 HSM_AQR.302.a_desc:0 "The new boundary divides the Herzland territory held by Aquileia between incorporated border districts and a dependent republic. At a customs house, a council from one of the districts asks whether its school may keep teaching in the language the children speak at home.\n\nThe Aquileian delegates have spent years demanding a voice for provinces. They invite the council to record its objections and bring representatives from the dependent republic into the discussion. Agreement will require more than translating a proclamation. The people affected must be able to change what the document says."
 HSM_AQR.302.b_desc:0 "The executive orders a single procedure for administering the Herzland border districts now joining Aquileia. The remaining lands under our control are assigned to a dependent republic. Its officials arrive at the frontier to find three different instructions on the movement of food carts.\n\nAn Aquileian commissioner withdraws the contradictory orders and gives both administrations a common timetable. Complaints will go to a named office, with written decisions open to challenge. The moderate clubs have chosen coordination over a separate negotiation at every crossing. They still owe the travellers an explanation they can understand."
 HSM_AQR.302.t:0 "A Hearing at the Customs House"
 HSM_AQR.303.a_desc:0 "The division of our Herzland holdings brings local republicans to the negotiating table. Border districts are entering Aquileia; the remaining territory receives a dependent republic. One visitor says he fought his old rulers to stop distant officials deciding everything for his town. He recognises the language of our proclamations, and asks whether we recognise his claim.\n\nThe committee's civilian delegates leave space for amendments. Their own surrender of emergency powers would mean little if a neighbouring republic were allowed only to obey. The frontier agreement must give local representatives something they can defend before their towns."
 HSM_AQR.303.b_desc:0 "The executive considers the Herzland lands under our control a frontier that must be organised without competing commands. Border districts will join Aquileia, while the remaining holdings form a dependent republic. Its republican delegates accept the need for cooperation but object when an officer treats their council as another branch of his headquarters.\n\nThe committee must settle the dispute it has created. Shared security arrangements require a clear chain of responsibility, yet the dependent government needs room to govern. The officer is told to return with an agreement, not merely a copy of his orders."
 HSM_AQR.303.t:0 "Republicans Across the Table"
 HSM_AQR.304.a_desc:0 "At the newly agreed frontier, a general asks Jeanne to place the neighbouring dependent monarchy under his permanent supervision. He presents the request as the natural reward for securing the border. The local delegates have brought a different understanding: their ruler retains the courts and appointments promised in the settlement. Jeanne orders both documents read before the officers. She once needed noble allies to escape military tutelage; extending the same protection to a smaller neighbour now costs her the gratitude of a successful commander."
 HSM_AQR.304.b_desc:0 "The frontier governors report that the agreed districts can be supplied without extending military authority farther into Herzland. One commander nevertheless sends a map with another river marked as the necessary line of defence. Jeanne remembers officers who once found similar reasons to govern her own household. She returns the map with the negotiated boundary intact and commissions a joint inspection of the depots. Her government retains firm control of its borderlands, while the dependent monarchy beyond them keeps its separate administration. Victory has supplied no warrant for another province."
 HSM_AQR.304.t:0 "The Victorious Generals"
 HSM_AQR.305.a_desc:0 "Representatives of the dependent Herzland state attend their first joint meeting without a military escort inside the chamber. They ask when the protective arrangement can be reviewed and who will hear disputes over the newly settled border. Jeanne's provincial allies recognise the questions: they once asked much the same of her. The defence agreement is read alongside guarantees for the neighbour's civilian government and local courts. The frontier remains as negotiated. A clerk reserves space for a later review, and this time the smaller delegation helps choose the date."
 HSM_AQR.305.b_desc:0 "A common defence schedule is ready, but the neighbouring Herzland cabinet refuses the clause allowing officers to redirect civilian trains without notice. Our ministers warn that another negotiation will delay the depots. Jeanne returns the disputed page to the joint committee rather than approving it alone. The revised schedule gives military transport priority within agreed limits and leaves the neighbour's government responsible for civilian service. Coordination will be firmer than the provinces first preferred, yet its terms remain reviewable. The cabinet must explain the compromise to the same representatives who authorised it."
 HSM_AQR.305.t:0 "The Neighbour's Own Cabinet"
 HSM_AQR.306.a_desc:0 "The Herzland delegation objects to an adviser who has begun approving appointments in its railway service. Our civilian minister asks the officer to produce the clause granting that power. He has none. Colette supports his recall and sends a replacement with written duties confined to the agreed defence arrangement. The border districts already transferred remain under our administration; the neighbouring state retains its civilian government. The left-wing partners who once carried coded messages between garrisons now watch whether liberation abroad means the same restraint they demanded at home."
 HSM_AQR.306.b_desc:0 "The frontier staff presents Colette with a schedule for bases, instructors and railway access in the dependent Herzland state. Its commanders want the arrangement to outlast every foreseeable emergency. A civilian delegate asks what remains for the neighbour's government to decide. Colette draws the limits around the agreed installations and leaves the rest of the administration to its ministers. The military partnership will be close, but it does not authorise a march into the next province. Back at headquarters, the officers must plan demobilisation without assuming that another campaign will postpone it."
 HSM_AQR.306.t:0 "Who Gives the Advisers Their Orders?"
 HSM_AQR.307.a_desc:0 "The Herzland transport delegation calls its railway depot an inland harbour. Dennis approves the comparison, then asks who may complain when our military freight takes every available wagon. Their answer names a civilian board established under the border settlement. Our own harbour council sends representatives to agree on access and compensation. The dependent partner will carry goods across the continent without surrendering its ordinary administration. Dennis leaves the ceremonial map folded. What matters today is whether a farmer can get his grain through the depot after the soldiers have unloaded."
 HSM_AQR.307.b_desc:0 "The new transport director brings Dennis a timetable joining the controlled frontier districts to the dependent Herzland partner's depots. It can move supplies without another territorial demand. A captain objects that local inspectors will slow the trains. The director produces the agreed inspection hours and a signed undertaking from the neighbouring government. Dennis tells the captain to meet the schedule. The network must work when the admiral is absent, through officials whose powers are understood on both sides. A naval reputation can win an audience; it cannot dispatch every train."
 HSM_AQR.307.t:0 "A Harbour without Water"
 HSM_AQR.308.a_desc:0 "Delegates from the Herzland communes arrive wearing the travelling coats in which they crossed the new frontier. They ask why the defence arrangement still makes them dependent on a larger federation that speaks of equality. Our delegates cannot answer by pointing to the map. They invite them to place the review of that relationship on the common agenda, beside the guarantees already agreed for border communities. The present settlement remains in force, but its temporary nature must mean something. Nobody is asked to surrender a local language or assembly to earn a hearing."
 HSM_AQR.308.b_desc:0 "The joint headquarters requests another season of authority over the Herzland communes' supply routes. It argues that hostile governments elsewhere still threaten the revolution. A visiting delegate asks whether a distant enemy can renew its mandate forever. The secretariat keeps the agreed defence coordination, but must present the request to the participating communes with its costs and limits exposed. The controlled borderlands do not expand with the officers' map. Those who carried the promise of liberation beyond Aquileia now have to explain why common protection still requires unequal powers."
 HSM_AQR.308.t:0 "Guests at the Same Table"
 HSM_AQR.309.a_desc:0 "The frontier commission reports that the agreed Herzland buffer is functioning. A security officer asks to extend its powers to newspapers critical of our advisers. The national council instead summons the advisers to answer those criticisms. The dependent neighbour remains bound by the defence settlement, while its inhabitants retain the guarantees negotiated for their own institutions. Aquileia has secured the strategic districts named in the agreement. The council refuses to treat every argument beyond that boundary as another encirclement, or every local custom as an obstacle to national survival."
 HSM_AQR.309.b_desc:0 "With the principal frontier threat contained, the directorate receives a proposal to keep the emergency transport controls indefinitely. Its authors point to possible enemies farther beyond the buffer. The neighbouring Herzland government asks instead when its civilian factories will recover the promised railway slots. Our commissioners retain central direction of the agreed defence network, but cannot satisfy both requests without another political decision. The border remains fixed. At the depot, workers wait beside finished goods while an inspector studies the permits. The doctrine of permanent danger now has an ordinary economic cost."
 HSM_AQR.309.t:0 "The Limits of Encirclement"
 HSM_AQR.310.a_desc:0 "The neighbouring Herzland social republic sends a delegation concerned about the cost of the security agreement. Its ministers want to reopen schools before maintaining the wartime supply quotas. Our labour representatives support their request, while returning soldiers ask when their own housing will be ready. The parliamentary commission must consider both alongside the guarantees for the integrated border districts. Dependence is still part of the present settlement, but the partner's civilian priorities have a place in the negotiations. Neither delegation accepts that another emergency can indefinitely postpone the social promises made to its voters."
 HSM_AQR.310.b_desc:0 "The cabinet proposes a common reconstruction schedule linking our border factories to workshops in the dependent Herzland republic. Its counterpart accepts coordinated orders but asks parliament to preserve funds for local hospitals. The agreement comes before both legislatures with the disputed figures still visible. Our government can argue for concentrating resources; it cannot describe every objection as disloyalty to the alliance. The frontier settlement has provided a partner and a limited border, not an excuse to abandon elections. The ministers prepare to defend the budget before representatives who may vote it down."
 HSM_AQR.310.t:0 "The Budget after Demobilisation"
 HSM_AQR.311.a_desc:0 "The Herzland settlement assigns our border holdings to Aquileia and the remaining territory in our possession to a dependent government. Gadiffer's delegates encounter an old concern in a new language: villagers want to know whether the next army passing through may take whatever it needs.\n\nThe duke sends the safeguards first written for Vinovia. They will require local interpretation and negotiation, but their purpose remains recognisable. A dependent neighbour must retain a government capable of speaking for its communities. Gadiffer's representatives cannot promise respect at home and treat the same demand abroad as insolence."
 HSM_AQR.311.b_desc:0 "Gadiffer asks for a single report on the Herzland territories under our control. The border districts will join Aquileia, while the remaining holdings receive a dependent government. His officers propose separate supply arrangements for every garrison, each negotiated according to immediate need.\n\nThe duke remembers the carter who brought a broken wheel to his palace. He orders his ministers to coordinate the arrangements with the dependent government and identify who will answer for disputed demands. Firmer direction must make responsibility easier to find. Otherwise the frontier will inherit every excuse he once heard from royal quartermasters."
 HSM_AQR.311.t:0 "The Promise Reaches the Frontier"
 HSM_AQR.312.a_desc:0 "The settlement divides the Herzland land in our possession between Aquileian border districts and a dependent republic. ABC volunteers arrive with books and discover that the village already has a teacher. She welcomes the supplies, then asks why the lessons in every donated reader assume that her pupils speak Aquileian at home.\n\nThe visitors sit down to revise the teaching plan with her. Educational access cannot depend on abandoning a local language. Representatives from both sides of the new boundary join the discussion, bringing the same demand for participation that once drew the ABC into village schoolrooms."
 HSM_AQR.312.b_desc:0 "The coordinating council assigns rebuilding teams to the Herzland territories now held by our country. Border districts are incorporated into Aquileia; the remaining holdings receive a dependent republic. The first schedule sends teachers and repair workers together so that lessons can begin when the roofs are sound.\n\nLocal organisers object to a uniform curriculum arriving with the supplies. The council's representative revises the instructions: coordination concerns where help is sent, while teaching must account for the language and experience of its pupils. A timetable can bring a classroom into use. It cannot decide everything that should be said inside."
 HSM_AQR.312.t:0 "A School with Two Voices"
 HSM_AQR.313.a_desc:0 "The settlement divides our Herzland holdings between border districts joining Aquileia and a dependent government over the remaining territory. A delegation asks to preserve its charitable society and the hall where local veterans meet. The Chevaliers recognise the request immediately; they once used almost the same words before an Aquileian official.\n\nTheir representatives invite the society's keeper to help draft the guarantees. Cultural protection cannot stop at the edge of Vinovia. The dependent government and the incorporated communities must have room for institutions that belong to their own history, even when their banners look unfamiliar."
 HSM_AQR.313.b_desc:0 "The common executive proposes coordinated frontier patrols across the Herzland lands in our possession. Border districts are incorporated into Aquileia, with a dependent government established over the remaining holdings. Local officers agree to exchange information but object to replacing every familiar unit emblem with an Aquileian one.\n\nThe Chevalier heading the talks removes that instruction from the draft. Common command needs reliable signals and clear responsibilities; it need not erase the histories of the people serving beneath it. The agreement will be judged by whether the dependent neighbour can cooperate without surrendering every institution that makes it recognisable."
 HSM_AQR.313.t:0 "The Neighbour's Traditions"
 HSM_AQR.314.a_desc:0 "The Herzland settlement assigns the border districts in our possession to Aquileia and the remaining holdings to a dependent republic. Society jurists bring a constitutional draft to the talks. Their interpreter pauses over a term whose neat definition would dissolve several local arrangements for shared land.\n\nA village delegate asks to describe how those arrangements work before the sentence is translated. The jurists agree to hear him. Constitutional cooperation cannot rest on the assumption that every familiar word means the same thing across a frontier. The dependent government needs an agreement its citizens can understand and influence."
 HSM_AQR.314.b_desc:0 "The executive sends a professional commission to organise the Herzland territory under our control. Border districts will enter Aquileia, while the remaining holdings receive a dependent republic. The commissioners bring a common schedule for opening offices and settling which government will hear each kind of petition.\n\nAt the first meeting, local lawyers point out that the proposed forms leave several customary rights unnamed. The commission must revise its instructions without losing the coordination it was sent to establish. An administration can arrive with authority and still need instruction from the people who will live under its decisions."
 HSM_AQR.314.t:0 "A Constitution Needs a Translation"
 HSM_AQR.410.JEB_cocardiers:0 "The Cocardiers"
 HSM_AQR.410.JEB_constitutional:0 "Authorise reconciliation with Michel under a charter."
 HSM_AQR.410.JEB_moderate:0 "The Moderate Clubs"
 HSM_AQR.410.JEB_royal:0 "Michel's Loyalists"
 HSM_AQR.410.later:0 "Continue these talks later."
 HSM_AQR.410.marais:0 "The Marais delegates take their seats together, with several smaller clubs gathered around them. When another speaker begins to count their support among his own, their spokeswoman asks him to read the agreement they have supposedly signed. There is none.\n\nShe lays their proposals on the table. The committee will need their consent, and they intend to bargain over the promises made in its name. Other delegates pull their chairs closer.\n\nMichel's name is raised among the possible approaches. Reconciliation with the exiled duke would still require an invitation and agreed conditions. For now, the clubs must decide with whom they can negotiate a common programme."
 HSM_AQR.410.rev:0 "The clubs meet in a hall whose windows still bear strips of paper from the fighting. Their messengers bring petitions from streets that helped the revolution, asking when the promises on the walls will reach their homes.\n\nA delegate raises the name of the exiled Michel. The room grows quiet. Any reconciliation with the duke would require an invitation and terms acceptable to the assembly; nobody has yet brought him back.\n\nThe chair calls the speakers to order. Rila's revolutionaries must agree what they will ask of a government before carrying their arguments into Aquileia's wider debate."
 HSM_AQR.410.royal:0 "Michel's captains have brought their reports to the palace. A town delegate lays a bundle of requisition receipts beside them and waits while the last account of the royal victory is read. The duke asks his secretary to open the bundle.\n\nThe first receipt bears a signature nobody at the table recognises. The captain responsible promises an inquiry; the delegate asks where her neighbours should take the others.\n\nMichel keeps the papers before him. Rila has held for the crown. Its government must now give the people who endured the fighting a reason to trust the peace."
 HSM_AQR.410.t:0 "The Rila Meeting"
 HSM_AQR.410.unprepared:0 "The delegates arrive with petitions, but no common programme to put before the meeting. The people who carried messages during the fighting are still being asked to settle disputes they have no authority to decide.\n\nA clerk leaves the heading of the agreement blank. Each group can explain what it wanted to end; agreement on what should follow proves harder. The chair asks them to begin with the complaints waiting outside.\n\nThey must find partners willing to share responsibility for the peace. Any approach to an old opponent will need terms their own supporters can accept."
 HSM_AQR.411.JRR_absolutist:0 "Negotiate Jeanne's return with the royalist assembly."
 HSM_AQR.411.JRR_coalition:0 "Negotiate Jeanne's return through a coalition."
 HSM_AQR.411.JRR_colette:0 "Negotiate the civil obligations of Colette's command."
 HSM_AQR.411.later:0 "Continue these talks later."
 HSM_AQR.411.rev:0 "A civilian organiser arrives at Colette's headquarters with a list of missing flour deliveries. The sentry knows her from the rising, but the clerk sends her to an officer who has already left for the railway yard. She sits down and refuses to leave.\n\nColette finds her still waiting when the morning reports are finished. The army has held its command through victory; its civilian allies now want someone who can answer for the work of peace.\n\nThe colonel tells her adjutant to find chairs for the delegates. Their proposals must give the towns a voice the headquarters will hear."
 HSM_AQR.411.royal:0 "Bassot's officers have kept the commandant's office since the loyalist countercoup. Today Jeanne's envoys arrive carrying petitions which have passed through the garrison twice without an answer. An officer reaches for the familiar military stamp. They ask him to wait.\n\nThe marquise wants a civilian administration able to receive such complaints in its own name. Bassot still holds command, and her supporters must negotiate the authority she would exercise.\n\nTwo copies of the proposed terms are laid on the desk, one for the commander and one for Jeanne. The signatures must wait until their obligations are settled."
 HSM_AQR.411.t:0 "Beyond the Barracks"
 HSM_AQR.411.unprepared:0 "Jeanne's supporters reach Bassot's office carrying different drafts. The loyalist countercoup has secured the march, but nobody can produce an agreement on the civilian authority that should follow. The commander's secretary sets out another chair.\n\nAn old court ally asks who will answer to the marquise. A town delegate asks who will answer to the towns. Both have brought grievances against the military offices through which their petitions still pass.\n\nBassot retains command while they argue. Before Jeanne can return to government, her supporters must agree what powers they will seek for her and what obligations they will accept themselves."
 HSM_AQR.412.JFT_communes:0 "The Communes Keep Their Promise"
 HSM_AQR.412.JFT_dennis:0 "The Admiral's City"
 HSM_AQR.412.JFT_enfants:0 "The Forgotten Children of Aquileia"
 HSM_AQR.412.JFT_fja:0 "The Coalition before the Voters"
 HSM_AQR.412.later:0 "Continue these talks later."
 HSM_AQR.412.rev:0 "The harbour meeting begins before the night shift has gone home. Delegates from the organisations that carried the rising arrive with folded petitions and messages passed between workshops during the fighting. The doors remain open for the latecomers.\n\nA sailor asks who will speak for the crews. A dockworker wants the same answer for those on shore. The organisers have won a hearing, but their wartime promises leave plenty to argue over.\n\nSomeone clears a space for the first draft. Pridea's contribution to the new Aquileia will begin here, with a programme its supporters are prepared to defend together."
 HSM_AQR.412.royal:0 "The royal banner hangs above Pridea's harbour, but the dockyard foremen have come to Dennis with unfinished repairs and crews asking when they can go home. His veterans make room around a table still covered by a naval chart.\n\nAn old marine begins with the defence of the quays. A foreman answers with the names of families living beside them. Dennis rolls back the chart so the petition can lie flat.\n\nThe admiral has kept his harbour. The men and women who work it need terms they can live under when the patrols have passed. His supporters must decide what promises to carry into those talks."
 HSM_AQR.412.t:0 "A Meeting by the Quays"
 HSM_AQR.412.unprepared:0 "The delegates arrive with petitions, but no common programme to put before the meeting. The people who carried messages during the fighting are still being asked to settle disputes they have no authority to decide.\n\nA clerk leaves the heading of the agreement blank. Each group can explain what it wanted to end; agreement on what should follow proves harder. The chair asks them to begin with the complaints waiting outside.\n\nThey must find partners willing to share responsibility for the peace. Any approach to an old opponent will need terms their own supporters can accept."
 HSM_AQR.413.VIN_abc:0 "Les Amis des ABC"
 HSM_AQR.413.VIN_chevaliers:0 "The Chevaliers of Fidelity"
 HSM_AQR.413.VIN_gadiffer:0 "Gadiffer's Loyal Duchy"
 HSM_AQR.413.VIN_sis:0 "The Society of Intellectual Students"
 HSM_AQR.413.later:0 "Continue these talks later."
 HSM_AQR.413.rev:0 "The delegates have propped their society banners against the wall to make room for letters from the districts. A village teacher has come to hear her own letter read; the courier could not tell her which office would answer it.\n\nThe movements that sustained the revolution now face neighbours who expect them to govern. One speaker asks for a common declaration. Another unfolds a petition whose signatories want to know who can be called to account when a promise is broken.\n\nThe teacher waits while they amend the opening paragraph. Before Vinovia offers Aquileia a programme, its advocates must be able to answer her."
 HSM_AQR.413.royal:0 "Gadiffer's secretary brings in the letters which waited while the roads were unsafe. The duke recognises the seal on the first: a district whose volunteers marched under his colours. Its council is asking for the return of borrowed carts.\n\nAn adviser begins to explain how much the victory has cost. Gadiffer asks him to read the rest of the letter. The carts are needed for a harvest that will not wait for the treasury.\n\nAround the table, the duke's supporters turn from congratulations to proposals. Serving the Discret crown now means finding obligations that Vinovia and its ruler can both honour."
 HSM_AQR.413.t:0 "Letters from the Districts"
 HSM_AQR.413.unprepared:0 "The delegates arrive with petitions, but no common programme to put before the meeting. The people who carried messages during the fighting are still being asked to settle disputes they have no authority to decide.\n\nA clerk leaves the heading of the agreement blank. Each group can explain what it wanted to end; agreement on what should follow proves harder. The chair asks them to begin with the complaints waiting outside.\n\nThey must find partners willing to share responsibility for the peace. Any approach to an old opponent will need terms their own supporters can accept."
 HSM_AQR.450.t:0 "An Earlier Petition"
 HSM_AQR.451.t:0 "An Earlier Petition"
 HSM_AQR.452.t:0 "An Earlier Petition"
 HSM_AQR.453.t:0 "An Earlier Petition"
 HSM_AQR.454.t:0 "An Earlier Petition"
 HSM_AQR.455.t:0 "An Earlier Petition"
 HSM_AQR.456.t:0 "Postwar Delegations"
 HSM_AQR.480.a:0 "Our programme will govern Aquileia."
 HSM_AQR.480.b:0 "Return the seal to the lawful Discrets."
 HSM_AQR.480.c:0 "Rejoin the national republican movement."
 HSM_AQR.480.d:0 "The capital has been secured, but victory leaves an older promise unanswered. Some delegates carried the banners of the national movement throughout the fighting; others expected their province to supply a new government for the whole country. The difference can no longer be hidden behind a common enemy. The seal lies on the table. Whoever receives it will govern Aquileia, and the delegates must decide whether their task was to restore an authority or to replace it."
 HSM_AQR.480.t:0 "Who Receives the National Seal?"
 HSM_AQR.500.a:0 "Put the households first."
 HSM_AQR.500.d:0 "The victory proclamations are still hanging outside the ministry. Inside, the first common register lists families in railway sheds, soldiers awaiting discharge and towns buying bread from army depots. The government has survived the struggle; now it must make the country habitable. The clerks have left three folders on the table: shelter, the return from service, and food deliveries."
 HSM_AQR.500.t:0 "The First Peace-Time Ledger"
 HSM_AQR.501.a:0 "We will retain our separate government."
 HSM_AQR.501.b:0 "Sign the articles of accession."
 HSM_AQR.501.d:0 "[From.GetName] has sent its delegates with a proposal for accession. Municipal courts and local offices would continue their work under the founding articles, while the treasury, foreign policy and armed forces would become national institutions. This would end our separate government. The delegates have brought two copies of the agreement, but no signature has been entered on our behalf."
 HSM_AQR.501.t:0 "Articles from Aquileia"
 HSM_AQR.502.a:0 "Publish both copies."
 HSM_AQR.502.d:0 "The delegates have returned with the signed articles. The provincial offices will keep a copy beside the founding settlement so that neither a minister nor a local magistrate can quietly rewrite the guarantees. The territorial register must now follow the agreement."
 HSM_AQR.502.t:0 "Two Copies, Two Seals"
 HSM_AQR.503.a:0 "Their answer will stand."
 HSM_AQR.503.b:0 "Seek a mandate to enforce the claim."
 HSM_AQR.503.d:0 "[From.GetName] has declined accession. Its reply recognises the conference but reserves authority to its own institutions. The cabinet can leave the matter there. Those who demand compulsion must instead seek an explicit mandate and explain why the claim justifies another war."
 HSM_AQR.503.t:0 "A Refusal in Writing"
 HSM_AQR.504.a:0 "Let this become ordinary."
 HSM_AQR.504.d:0 "The ministry's latest dispatch contains no victory speech. It reports that the morning bread train arrived, the discharge office closed its last temporary barracks, and a repaired street has received its residents. The country still has poor districts and schools to build. Those obligations remain with the institutions created by the founding settlement; the immediate emergency no longer prevents them from working."
 HSM_AQR.504.t:0 "The Ordinary Morning"
 HSM_AQR.600.0:0 "Require the guarantor to answer before the craftsmen."
 HSM_AQR.600.1:0 "Settle this delivery from the ducal household."
 HSM_AQR.600.d:0 "Michel arrives at the new tool shop to find a velvet chair standing beside an unfinished press. The master has kept it for the merchant who guaranteed the iron. That merchant has sent a servant instead, carrying a demand that his old market exemptions be confirmed before the next delivery.\n\nThe treasurer calls it a small concession. A wheelwright opens his account book: he has paid the fair's fees through every lean season, and the promised press is meant to serve his neighbours as well. Michel runs a claw over the rough casting. Until the iron arrives, the royal seal above the door protects an empty room.\n\nThere are two ways to settle this particular claim. The duke can summon his guarantor to honour the signed undertaking in front of the craftsmen. He can also use his household funds to release the disputed consignment, leaving the larger privilege dispute for another hearing. Either solution will be remembered at the next fair."
 HSM_AQR.600.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.600.t:0 "The Patron's Empty Place"
 HSM_AQR.601.0:0 "Walk the failed route and teach the officers."
 HSM_AQR.601.1:0 "Escort the stranded arms consignment."
 HSM_AQR.601.d:0 "Beau Harnais stops the practice march at a village crossroads. The advance company has arrived with polished equipment, while its ration wagon remains behind a broken bridge. The captain asks permission to requisition bread. The baker says he has already promised his morning's work to the surrounding farms.\n\nMichel has come to watch the exercise. Several officers look towards him, expecting an easy order that will spare the regiment embarrassment. Harnais instead asks the captain to explain how the same march would work without a duke beside it. The captain spreads his map on an overturned crate, and the baker points to a cart track missing from the drawing.\n\nThe exercise can pause while the officers retrace the supply route with local drivers, making a useful lesson of the failure. Alternatively, the party can escort a delayed military consignment along the newly identified track and bring its usable rifles back to the stores. Neither task requires taking the bread promised to the farms."
 HSM_AQR.601.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.601.t:0 "Bread Before the Parade"
 HSM_AQR.602.0:0 "Give the waiting families the floor."
 HSM_AQR.602.1:0 "Explain the volunteers' service before the gathering."
 HSM_AQR.602.d:0 "At a meeting of the national royal movement, Michel waits while a choir finishes the hymn. His delegation has brought a petition from Rilan families whose sons have not returned from detention. A court organiser suggests presenting it privately after the loyal addresses. The duke asks whether the families have been invited to that private meeting. They have not.\n\nThe organiser is no enemy of mercy. He fears that every royal gathering will become a recital of grievances while the crown still needs defenders. Michel knows that argument; he has used versions of it himself. Beside the petition lies a list of volunteers willing to serve if their households can discover where their missing relatives are held.\n\nThe delegation can arrange an open reception for the families and make the crown's representatives hear their claims today. It can instead spend its speaking time explaining the limited service requested of the volunteers, with the petition delivered directly afterwards. Rila must choose how to use this audience without pretending that loyalty has erased its wounds."
 HSM_AQR.602.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.602.t:0 "The Hymn and the Petition"
 HSM_AQR.603.0:0 "Require a public explanation before endorsement."
 HSM_AQR.603.1:0 "Bring the creditors and contractor together."
 HSM_AQR.603.d:0 "Michel pauses over the workshop bids. One bears the name of a supplier who served his household before his flight from Rila. The proposed price is good, and the drawings are competent. An assembly delegate places an unpaid printer's bill beside them. The same firm, she says, cannot plead poverty to its old creditors while seeking a new public advance.\n\nThe minister asks for time. Refusing a useful workshop because its contractor has enemies would be easy; explaining why a ducal acquaintance received special indulgence would be harder. Michel closes the folder and leaves it on the delegates' side of the table.\n\nThe committee can call the supplier to a public explanation now, giving the assembly a clear answer before it endorses the order. Alternatively, it can invite the affected craftsmen to reconcile the disputed bills with the supplier under its supervision. Either course concerns this contract alone. Michel's signature on the charter cannot tell the representatives which remedy they must prefer."
 HSM_AQR.603.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.603.t:0 "The Bid Michel Recognises"
 HSM_AQR.604.0:0 "Repeat the exercise with clear responsibility."
 HSM_AQR.604.1:0 "Inspect and release the serviceable reserve weapons."
 HSM_AQR.604.d:0 "Anne-Josephine de Mericourt arrives at the assembly carrying an exercise order with three endorsements and no usable instruction. A reserve company waited at a closed depot while its captain sought permission from each signatory in turn. Michel recognises the palace secretary's handwriting on one endorsement. Recognition does nothing to explain who could have opened the gate.\n\nA veteran deputy says the answer is obvious: give the commander freedom to act. Another remembers when that freedom meant entering a house without asking. Mericourt puts the exercise map between them. This case concerns a depot already assigned to the army, not a house, and the distinction ought to appear in the order.\n\nThe officers can return to the field and repeat the exercise with a clearly named duty commander. They can instead spend the afternoon at the depot with its armourers, sorting the usable reserve weapons while the ministry corrects the instruction. The charter needs both capable command and limits that soldiers can understand without a lawyer beside every gate."
 HSM_AQR.604.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.604.t:0 "Who May Open the Gate?"
 HSM_AQR.605.0:0 "Yield the floor to the provincial amendment."
 HSM_AQR.605.1:0 "State the limits of Michel's mandate for the record."
 HSM_AQR.605.d:0 "At the national constitutional meeting, a visitor addresses Michel as though a Rilan duke must naturally preside over Aquileia. The room grows quiet. Across the table, a provincial delegate draws her own proposed amendment back towards her. She came to discuss a government answerable to representatives, not to witness a succession announced by courtesy.\n\nMichel asks the secretary to retain his ducal title in the minutes and nothing more. His reconciliation with Rila gave him a place under its charter. It did not settle the national crown, nor give him authority over the representatives now listening. The visitor apologises, but the withdrawn amendment remains beneath its author's claw.\n\nThere is time for one further intervention before the session ends. Michel can yield it to the delegate and let her challenge the Rilan draft in public. He can instead read a carefully limited statement of his own mandate into the record, closing the misunderstanding before the next round of negotiations. Either action must make consent visible where a flattering title nearly concealed it."
 HSM_AQR.605.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.605.t:0 "A Crown Is Not an Amendment"
 HSM_AQR.606.0:0 "Accept inspected rifles against the debt."
 HSM_AQR.606.1:0 "Have the guarantors acknowledge the settlement publicly."
 HSM_AQR.606.d:0 "De Becignier has lent a room for the machine hall's subscribers, and the meeting has almost ended when a porter brings in a long wooden crate. A trader who owes the craftsmen money has offered rifles in settlement. They are left from the clubs' hurried purchases abroad, bought when a weapon's mere arrival seemed a victory.\n\nThe printer wants payment he can spend on paper. A volunteer instructor asks to see the locks before anyone dismisses the offer. The trader has also brought a written acknowledgement of the debt; he says that a public guarantee from his associates will let him settle it in ordinary goods shortly. Several subscribers recognise those associates and disagree sharply about their reliability.\n\nThe moderate committee can accept only the weapons that pass inspection, releasing them to the district stores against the disputed account. Alternatively, it can bring the guarantors before the subscribers and obtain an acknowledged settlement. De Becignier moves his own chair aside so the people owed the money can reach the table."
 HSM_AQR.606.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.606.t:0 "A Debt in an Unfamiliar Crate"
 HSM_AQR.607.0:0 "Repeat the relief and teach both sections."
 HSM_AQR.607.1:0 "Wait for the guards and hear them in the hall."
 HSM_AQR.607.d:0 "Anne-Josephine de Mericourt enters a club hall carrying a guard roster. The sentries from the western stores are still outside on duty, although their relief was due before the meeting began. Inside, their neighbours are arguing over the next appointments to the district reserve. An empty chair near the front belongs to a corporal whose name is already being discussed.\n\nThe chair of the meeting offers to read the absent guards' opinions from a note. Mericourt asks whether he would accept the same courtesy when someone else decided what he meant. The argument stops long enough for a messenger to explain the delay: the incoming section had been directed to the wrong gate.\n\nThe officers can use the remainder of the evening to repeat the handover, letting both sections trace the mistake together. The club can instead suspend its deliberation until the returning guards take their places, hearing their account in front of their neighbours. The roster needs correction in either case. The immediate question is where the lesson will be learned."
 HSM_AQR.607.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.607.t:0 "The Sentry's Empty Chair"
 HSM_AQR.608.0:0 "Send couriers with the notices and defend the meeting."
 HSM_AQR.608.1:0 "Require the obstructing organisers to answer publicly."
 HSM_AQR.608.d:0 "A printer arrives at the Committee of Public Safety with a damaged bundle of notices. His club lost the last debate within the national republican movement, and a group of victors has decided that its meeting no longer deserves publicity. They have not banned the paper, they insist. They merely persuaded the carriers to leave it behind.\n\nDe Becignier recognises the printer. His press once served clubs that could not safely announce where they met. A moderate representative says that memory should settle the matter. Another asks who will carry tonight's notices if everyone remains here praising yesterday's courage. The printer lays the bundle between them and says the meeting begins before sunset.\n\nThe committee can lend its couriers to deliver this issue and publicly defend the losing club's right to meet. It can instead summon the organisers who obstructed distribution and require an open acknowledgement of the committee's decision. Neither response changes the defeated motion. The republic's supporters must discover whether losing an argument still leaves them a place in the next one."
 HSM_AQR.608.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.608.t:0 "The Press After the Defeat"
 HSM_AQR.609.0:0 "Return the identified wages before the workers."
 HSM_AQR.609.1:0 "Account publicly for the parts sent to the armourers."
 HSM_AQR.609.d:0 "The Committee of Public Safety receives two inventories for the same seized coach house. One lists tools for the new pump workshop. The other lists a locked chest that a Cocardier patrol removed before the craftsmen arrived. A Fanal delegate brings the chest into the meeting herself. Inside lie rifle parts, household papers and the wages set aside for the estate's servants.\n\nA patrol member says everything belonged to a noble and therefore belonged to the revolution. The delegate places a servant's pay note on the table. The workshop foreman examines the metal pieces: some can restore weapons already in the district stores. The rest of the chest cannot be melted into a useful answer.\n\nThe committee can make restitution of the identified wages its first public act in the disputed workshop, returning them before the waiting workers. It can instead begin by handing the serviceable rifle parts to the armourers and demonstrating where the patrol's seizure has gone. The papers remain available for investigation in either case; nobody receives permission to pocket the remainder."
 HSM_AQR.609.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.609.t:0 "The Lock Inside the Seized Chest"
 HSM_AQR.610.0:0 "Repeat the exercise after a joint supply reckoning."
 HSM_AQR.610.1:0 "Train and enrol the waiting volunteer supply parties."
 HSM_AQR.610.d:0 "Boreas Babeuf signals the start of the exercise, and the company on his left fails to fire. Its volunteers raise empty ammunition pouches. On the right, another company has enough cartridges to practise all afternoon. Both quartermasters produce instructions stamped by the Committee of Public Safety, and both insist that their own club followed its orders faithfully.\n\nBabeuf wants the march resumed immediately. A recruit asks whether he should carry a loaded neighbour's spare pouch or wait for his own committee to approve the exchange. The question irritates the officers because it exposes exactly what the exercise was meant to conceal: a common army still living on private habits.\n\nThe command can halt the march and make the quartermasters redistribute and record the ammunition together, repeating the signals afterwards. Alternatively, the officers can bring waiting volunteer groups into the exercise as supply runners, enrolling those who complete the practical instruction. The lesson is the same, but the afternoon can be spent correcting the staff or widening the service."
 HSM_AQR.610.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.610.t:0 "Babeuf's Unfired Exercise"
 HSM_AQR.611.0:0 "Hear why the defenders still offer their service."
 HSM_AQR.611.1:0 "Make the requisition delegates answer this claim."
 HSM_AQR.611.d:0 "Anne-Josephine de Mericourt stands beside the Committee of Public Safety's speakers at a meeting for delegates from other provinces. The Cocardiers have displayed accounts of defended streets and liberated prisoners. A worker in the audience raises a requisition bearing their seal and asks why the tools taken from his neighbours never reached a public workshop.\n\nA veteran calls the interruption a gift to the monarchists. Mericourt asks him to let the worker finish. The visitor has worn his republican cockade throughout the speech; he wants the revolution's promise applied to the people who claim to carry it. Several provincial delegates put down their prepared endorsements and listen.\n\nThe committee can give the next speaking period to witnesses of the clubs' common defence, asking them to explain why they still believe the republic worth serving. It can instead keep this particular claimant at the table and require the responsible requisition delegates to answer before the meeting. Neither course withdraws the national revolutionary programme. What changes is the evidence its advocates choose to present first."
 HSM_AQR.611.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.611.t:0 "A Witness Beneath the Cockade"
 HSM_AQR.612.0:0 "Read the bond before the assembled estates."
 HSM_AQR.612.1:0 "Accept the repairs; let the village send its grain."
 HSM_AQR.612.d:0 "Jeanne's surveyor rolls a fragment of rotten timber onto the audience carpet. The noble whose bond paid for the crossing objects to the mud before he objects to the evidence. His steward insists that the estate delivered everything promised; the village carrier says the wagons stopped at the manor and never reached the stream.\n\nJeanne asks for the delivery book. Its receipt bears a familiar household seal, but no signature from the road crew. The noble offers to settle quietly by sending labourers tomorrow. The surveyor wants the receipt read aloud before the other estates, warning that several have used the same convenient form.\n\nThe bridge can be repaired either way. A public examination would establish that the marquise's summons reaches even her oldest supporters. Accepting an immediate settlement would get the village's grain moving before the next rain. Jeanne lays the broken timber across the disputed receipt. Her ally can no longer call the matter a misunderstanding between servants."
 HSM_AQR.612.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.612.t:0 "The Stone beneath the Seal"
 HSM_AQR.613.0:0 "Collect compatible rifles from the household stores."
 HSM_AQR.613.1:0 "Repeat the relief with mixed companies."
 HSM_AQR.613.d:0 "The practice convoy has reached its last depot, but two companies remain outside the gate. The departing captain refuses to surrender ammunition bought by his patron. His replacement has brought rifles of another pattern and cannot use it anyway. The instructors report a successful journey followed by an entirely unsuccessful relief.\n\nJeanne summons the captains with their armourers. One proposes recalling serviceable rifles from household stores so the depot can issue matched weapons. The other asks to repeat the exercise with mixed companies until officers learn to account for every crate before setting out. Both are embarrassed by the court's clerk recording their explanations.\n\nThere is time for one immediate remedy before the companies return to their posts. A collection of compatible weapons would equip the escorts now. Another field exercise would teach the officers why a full wagon is not necessarily a useful delivery. Jeanne will require the patrons to cooperate with whichever remedy she chooses; their private quarrel has already detained the convoy long enough."
 HSM_AQR.613.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.613.t:0 "The Escort That Would Not Leave"
 HSM_AQR.614.0:0 "Escort the volunteers to the crown's muster."
 HSM_AQR.614.1:0 "Carry the royal oath through the march."
 HSM_AQR.614.d:0 "The royal delegation's secretary asks Jeanne where the march's oath should be delivered. A noble answers with the name of her residence. Jeanne corrects him: the address is that of the recognised Aquileian court. The distinction leaves the room quiet enough to hear the secretary sharpen his pencil.\n\nHer supporters have brought two offerings for the occasion. Veterans and estate volunteers are ready to accompany the delegation and enter the crown's service. The parish and market messengers instead propose carrying the oath through Westkeep, with public gatherings to affirm the royal settlement and explain the march's duties within it.\n\nJeanne cannot spare the same escorts for both journeys this week. The first would place willing recruits where the crown can receive them. The second would turn a private assurance between great households into an undertaking heard by the communities that must sustain it. She asks the secretary to leave space beneath her signature for the chosen arrangements. Nobody again proposes sending the oath back to her own door."
 HSM_AQR.614.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.614.t:0 "An Oath with an Address"
 HSM_AQR.615.0:0 "Establish the precedent in an open judgement."
 HSM_AQR.615.1:0 "Return the lathe under the repair agreement today."
 HSM_AQR.615.d:0 "The workshop owner arrives at the hearing carrying a requisition receipt. The garrison clerk brings a second document, declaring the same lathe indispensable to military repairs. Neither disputes that the machine belonged to the workshop before the soldiers took it. They disagree over whether a promise to return it can survive an officer's insistence that he still needs it.\n\nJeanne listens while the coalition's lawyer reads the original terms. The military office has missed the date it wrote itself. The owner wants a public ruling and has neighbours ready to testify. His foregriffon would rather accept an immediate arrangement: the lathe returns today, while a civilian contract reserves agreed repair hours for the garrison.\n\nBoth approaches recognise the workshop's ownership. A formal judgement would give the coalition a precedent it could cite against other overdue requisitions. The practical settlement would reopen a bench whose workers have been waiting outside since morning. Jeanne asks the owner which papers he wants signed first, and then turns to the assembled representatives for their decision."
 HSM_AQR.615.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.615.t:0 "The Lathe with Two Owners"
 HSM_AQR.616.0:0 "Enrol volunteers available for complete training days."
 HSM_AQR.616.1:0 "Teach the section leaders to honour the timetable."
 HSM_AQR.616.d:0 "At noon the instructor dismisses a reserve company and discovers that several soldiers have already left. Their employers promised them the morning, but the exercise ran late. The mayor insists that the officers knew the terms; the captain replies that a company cannot learn a difficult movement by stopping whenever the market bell rings.\n\nJeanne has the timetable brought into the room. It shows a longer exercise that nobody explained to the workshops. The municipal delegates offer to recruit a fresh contingent whose employers can guarantee full training days. The instructors propose using the next gathering to teach section leaders how to divide the work into reliable sessions, bringing the existing reservists back under the terms already agreed.\n\nNeither offer excuses the unauthorised departures. One would put more willing volunteers on the rolls without extending anyone's obligation. The other would make the present company easier to train. Jeanne asks the captain to erase his accusation of civilian sabotage before she considers either remedy. The coalition cannot teach punctual service with an unpublished timetable."
 HSM_AQR.616.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.616.t:0 "The Empty Rank at Noon"
 HSM_AQR.617.0:0 "Hear the republican signatories before departure."
 HSM_AQR.617.1:0 "Stand with the veterans for the common settlement."
 HSM_AQR.617.d:0 "The national delegation's clerk has prepared a clean copy of Westkeep's address. In it, every signatory professes lifelong devotion to the crown. A municipal republican pushes the sheet back across the table. He promised to uphold the coalition's royal settlement, he says, not to acquire a childhood he never had.\n\nJeanne reads the offending line and strikes it out. The clerk worries that an honest disagreement will spoil the public ceremony. Outside, veterans have assembled to accompany the delegation; a smaller crowd wants to hear whether republican complaints can still be voiced under the agreement.\n\nThe marquise has time for one public appearance before departure. She could open a hearing with her dissenting partners, showing that their signatures do not require silence. Or she could join the veterans and explain why different convictions can sustain a common defence of the agreed settlement. Neither gathering will decide Aquileia's throne. They will decide what the towns believe their representatives meant when they placed their names beside Jeanne's."
 HSM_AQR.617.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.617.t:0 "A Republican Signs beside the Marquise"
 HSM_AQR.618.0:0 "Finish the bolts and return the rifles to service."
 HSM_AQR.618.1:0 "Honour the civilian delivery promised for today."
 HSM_AQR.618.d:0 "Colette arrives while the night shift is still arguing with the quartermaster. His order calls for rifle bolts; the civilian foregriffon has already promised bearings for a stalled delivery cart. Both jobs require the same lathe. The quartermaster calls the delay disloyal. A worker points to the faded recruitment poster above his head and asks whether the allies it summoned were expected to grow another pair of claws.\n\nColette tells the officer to withdraw the accusation and has both orders placed on the bench. The agreed shift can finish one batch. Completing the bolts would return repaired rifles to service. Making the bearings would release the cart bringing ordinary supplies to waiting households.\n\nNobody proposes working the exhausted crew through another night. The dispute is over whose urgent need comes first within the hours already promised. Colette can insist on the military delivery or recognise the civilian commitment. Either way, the foregriffon wants her decision written down so the next officer cannot claim that the unfinished order was simply forgotten."
 HSM_AQR.618.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.618.t:0 "One Lathe, Two Urgent Orders"
 HSM_AQR.619.0:0 "Let scouts and staff write the next order together."
 HSM_AQR.619.1:0 "Use the local contacts to recover the cached rifles."
 HSM_AQR.619.d:0 "The scout refuses to follow the route marked by the staff. There is a hedge across it, he says, and the ground beyond will not carry the supply wagons. The instructor answers that the exercise concerns obedience to orders. Colette asks whether the wagons have been informed of this distinction.\n\nOn the ground, both officers and former guerrillas discover mistakes. The map misses the obstacle, while the scout's alternative passes through a yard whose occupants have never agreed to receive a military column. Local knowledge needs checking as much as a printed diagram. The company returns with scratched paint and a useful set of arguments.\n\nColette can give the next exercise to mixed scouting and staff teams, requiring them to produce an order another company can execute. Alternatively, the quartermaster offers to spend the available day collecting usable rifles from nearby caches whose keepers the scouts still know. One choice develops the officers' judgement; the other turns surviving underground connections into immediately usable equipment. Neither permits the instructor to dismiss the hedge."
 HSM_AQR.619.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.619.t:0 "The Map Is Missing a Hedge"
 HSM_AQR.620.0:0 "Open with the civilian delegates' grievances."
 HSM_AQR.620.1:0 "Speak together for the republic's defence."
 HSM_AQR.620.d:0 "The officer preparing Westkeep's delegation has entered the civilian organisers as assistants to the military representatives. Colette recognises a former courier studying his card. He points to the word beneath his name and asks whether the national revolution has finally found a polite way to tell him to wait outside.\n\nShe orders the cards corrected. The MPA's republican connections secured the meeting, but they did not supply every voice that kept Westkeep working. Her officers accept the change and ask what message the delegation should carry. The civilian organisers have brought accounts of cooperation and complaints about requisitions. Veterans waiting at the station want an appeal for service to the republic.\n\nThere is room for either emphasis in the opening address. Colette can have the delegates present the grievances publicly, demonstrating that civilian participation has substance. Or she can ask them to speak together beside the veterans, affirming their commitment to defend the national republican settlement. Neither choice appoints her to Aquileia's highest office. It determines what her allies hear when she speaks in their name."
 HSM_AQR.620.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.620.t:0 "No Cipher on the Delegate's Card"
 HSM_AQR.621.0:0 "Keep the grain carrier's promised berth."
 HSM_AQR.621.1:0 "Use the escort repair to train its crew."
 HSM_AQR.621.d:0 "Dennis recognises the captain before the harbour clerk announces him. The two exchange a sea story while a coaster's carpenter waits beside the new slip with a cracked plank under his wing. The captain wants an escort vessel brought forward for repair; the carpenter's grain carrier has already been promised the berth.\n\nFleur places both orders on the desk. The escort's machinery can be inspected afloat, she explains, but doing so will occupy the naval repair party. Keeping the grain carrier first would honour the public schedule and reassure merchants who still expect the admiral's friends to pass them. Bringing in the escort would instead let its crew practise a complete repair alongside the yard workers. Neither ship can have the slip twice.\n\nDennis stops the story halfway through. His old friend looks offended when the carpenter is invited closer. Outside, the crane crew waits for a single hull number. The admiral reaches for the order book."
 HSM_AQR.621.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.621.t:0 "The First Hull on the Slip"
 HSM_AQR.622.0:0 "Dennis will repeat the signal exercise."
 HSM_AQR.622.1:0 "Fleur will rehearse the landing supply drill."
 HSM_AQR.622.d:0 "A launch emerges from the morning fog carrying the wrong landing party. Its captain followed a signal he remembers from Dennis's earlier service; the shore station used the newly agreed code. No one has been hurt, but Fleur finds the missing medical panniers aboard a different boat.\n\nThe captain offers to repeat the voyage with his own signals. Dennis begins to agree, then sees Fleur put the two signal books side by side. She asks which book the next young lieutenant is supposed to know. The captain falls silent. His experience is real, and so is the mistake.\n\nThere is time before the boats return to their ordinary duties for one extended exercise. Dennis can take the signal crews through the gulf again, rehearsing recognition and replies until both shores understand. Fleur can instead keep the landing parties ashore and make them unload, sort and carry the scattered equipment together. The fog has exposed two weaknesses; today's daylight will cover only one lesson."
 HSM_AQR.622.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.622.t:0 "The Launch in the Fog"
 HSM_AQR.623.0:0 "Read the shipping agreement before the harbour."
 HSM_AQR.623.1:0 "Let Dennis present the reserve in royal service."
 HSM_AQR.623.d:0 "The crown's representative has asked for the harbour key to be displayed beside the new national shipping chart. Dennis hears a demand for surrender and lays his claw over the key before the sentence is finished. Fleur quietly turns the chart around. It marks shared sailings and naval stores, not a transfer of his home.\n\nThe representative needs a public sign that the admiral's undertakings can be trusted outside Pridea. Dennis insists that his captains must still be heard when distant offices promise more than their ships can carry. Neither objection is frivolous, though the waiting clerks have begun examining the floor.\n\nA ceremony at the quay could bring the merchants and sailors together around the actual shipping agreement, with their complaints heard before the key is displayed. Alternatively, Dennis could lead a review of the harbour reserve, presenting his service to the crown through crews who know him. He lifts his claw at last. Someone must now explain the gesture to the city."
 HSM_AQR.623.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.623.t:0 "The Key on the Chart"
 HSM_AQR.624.0:0 "Finish the furnace job and secure the common order."
 HSM_AQR.624.1:0 "Give the displaced assembly its room back today."
 HSM_AQR.624.d:0 "Pierre reaches the foundry with a borrowed crane and discovers two assemblies waiting for it. The first has promised to lift a furnace door; the second needs to move the timber blocking its damaged meeting room. Each keeper carries a paper signed by someone entitled to lend the machine.\n\nLouis begins by asking which promise came first. A foundry worker answers that this will not make either job disappear. The room falls quiet, and Pierre unfolds the crane crew's working notes instead. The furnace lift would allow the workers to finish a batch of castings and pay closer attention to the machinery together. Clearing the meeting room would give the displaced assembly its own place again before another evening's arguments spill into the street.\n\nNeither commune proposes taking the crane permanently. The difficulty is the ordinary one of deciding whose urgent work waits until tomorrow. Louis puts both papers where the crews can see them and asks for a decision they can explain on returning home."
 HSM_AQR.624.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.624.t:0 "The Crane Belongs to Two Promises"
 HSM_AQR.625.0:0 "Train the neighbours offering to take a watch."
 HSM_AQR.625.1:0 "Rehearse the handover with the serving militia."
 HSM_AQR.625.d:0 "The messenger finds Pierre beside a militia column whose delegate has just been recalled. The assembly's replacement is expected by evening. Until then, nobody is certain whether the old instructions to relieve the neighbouring watch remain valid. A tired volunteer asks whether the right to recall also means the right to go home.\n\nLouis arrives with the assembly's actual message. It challenges the delegate's conduct, not the promise to relieve their neighbours. The distinction settles the immediate order, but the volunteers remain around the map. Several residents have offered to take a temporary watch if someone shows them the route. The experienced militia could train these replacements and bring fresh volunteers into service.\n\nAlternatively, Pierre proposes using the afternoon to practise the entire handover with the existing units, including a deliberately missing messenger. Both choices honour the recall. One spreads the burden to more willing neighbours; the other teaches those already carrying it how to keep a change of representative from becoming an empty crossing."
 HSM_AQR.625.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.625.t:0 "A Recall at the Crossing"
 HSM_AQR.626.0:0 "Hear the communes before seeking their answer."
 HSM_AQR.626.1:0 "Call those willing to defend one another."
 HSM_AQR.626.d:0 "A visiting commune has placed a decorated chair at the head of the federation's long table. Its delegate calls it a courtesy to Louis, whose speech against kings and presidents has travelled farther than he has. Louis moves the chair into the circle and asks who will report the meeting to the absent night shift.\n\nThe gesture earns laughter, then a harder question. A rural commune wants time to explain the new mutual defence undertaking before volunteering its people. Others fear that repeated delays will leave their neighbours unprepared. Neither a ceremonial chair nor an inspiring speech can decide what those absent residents consent to do.\n\nThe federation can send speakers to hold open meetings and return with the communes' answers, demonstrating that joining a common undertaking does not surrender their voice. It can also call a voluntary defence gathering in Pridea, asking those already convinced to make their willingness visible. Louis offers to speak at either. He will not sign the answer for the others."
 HSM_AQR.626.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.626.t:0 "An Empty Chair for Louis"
 HSM_AQR.627.0:0 "Assemble the rifles for immediate issue."
 HSM_AQR.627.1:0 "Teach the recruits to service their weapons."
 HSM_AQR.627.d:0 "The bearded speaker with the black eyepatch stands beneath the revolutionary flag while mechanics open a crate from the reclaimed storehouse. Someone has chalked a foreign bank's name across its lid as proof of an enemy connection. Inside are rifle parts bought through an ordinary intermediary, with several receipts that the security cell never unfolded.\n\nThe speaker asks whether the parts work. A mechanic assembles a bolt and passes it across the table. They can finish the usable rifles now and send them to the new battalions. Alternatively, the same stock would let instructors give recruits a thorough course in stripping, identifying and repairing weapons before issuing them. The workshop cannot provide both courses of work today.\n\nAn organiser starts repeating the accusation about the bank. The older griffon interrupts him and points to the assembled bolt. Aquileia needs defenders who understand what they carry. Whatever the final allocation, the unopened receipts must first be read by someone capable of explaining them."
 HSM_AQR.627.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.627.t:0 "The Crate beneath the Flag"
 HSM_AQR.628.0:0 "Rehearse the infantry passage and mutual cover."
 HSM_AQR.628.1:0 "Practise aerial observation and ground reports."
 HSM_AQR.628.d:0 "Berty Albatros stops drawing the advance where the waterfront warehouses hide the next street. An organiser asks why the arrow does not reach the objective. Albatros asks who has seen the far side of the buildings. The answer is a report copied twice from the same untested observer.\n\nThe organiser reminds him that hesitation can also cost lives. Albatros agrees and places the infantry schedule beside the report. A column waiting blindly is vulnerable; so is a column sent forward to satisfy a slogan. They have enough daylight to conduct one additional exercise before the training ground must be cleared.\n\nThe infantry can practise taking and holding the warehouse passage, learning how adjacent companies cover the blind corners. The pilots can instead fly a reconnaissance exercise and practise sending observations to the troops below, making the unseen street part of the plan. Albatros leaves the arrow unfinished until the organisers choose which uncertainty they intend to remove first."
 HSM_AQR.628.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.628.t:0 "Albatros Leaves the Arrow Unfinished"
 HSM_AQR.629.0:0 "Let Aquileia hear the reserve's pledge."
 HSM_AQR.629.1:0 "Take the volunteers to the wounded and bereaved."
 HSM_AQR.629.d:0 "The older griffon with the eyepatch has prepared the same warning he once delivered in a shuttered room: Aquileia has enemies, and its forgotten children must stand ready. The new audience includes factory shifts, country delegates and veterans whose empty sleeves move in the sea wind. A worker asks when readiness will leave an evening for visiting the wounded.\n\nThe speaker looks toward the national flag. He has no intention of retracting the warning. He also recognises that another parade will not carry a meal up the stairs to a veteran's room. The local organisers have gathered enough volunteers for one large undertaking this week.\n\nThey can turn the gathering into a patriotic reserve rally, making defence of the revolutionary state a public pledge shared beyond the original cells. They can instead lead the volunteers to the hospitals and bereaved households, showing that the movement remembers people after they leave the ranks. The speaker folds the last page of his address and waits for the organisers' answer."
 HSM_AQR.629.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.629.t:0 "The Flag and the Empty Sleeves"
 HSM_AQR.630.0:0 "Settle the tenants' claim at the house today."
 HSM_AQR.630.1:0 "Make this case the coalition's national demand."
 HSM_AQR.630.d:0 "Pierre brings Louis to a house repaired by the municipal crews. The roof no longer leaks, but the tenants have received a rent demand treating the publicly supported work as the owner's private improvement. The FJA representative arrives with the repair agreement and discovers that its wording never settled this point.\n\nLouis wants the coalition to answer in front of the tenants. He recalls how easily grand promises used to disappear between a meeting and a doorstep. The representative agrees that the claim needs an answer, but also sees the same omission in several pending contracts. A local settlement could reassure the affected families immediately; a carefully argued case could give the national party a concrete demand to carry into its legislative work.\n\nThe builders are waiting for their next assignment, and neither partner wants to leave them idle while the argument spreads. Pierre clears a space on the repaired staircase for the papers. Someone must decide whether today's effort belongs with the tenants or with the coalition's wider campaign."
 HSM_AQR.630.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.630.t:0 "The Rent beneath the New Roof"
 HSM_AQR.631.0:0 "Run the complete rescue exercise with the companies."
 HSM_AQR.631.1:0 "Welcome and instruct the new volunteers."
 HSM_AQR.631.d:0 "Pain Levé waits at the narrow bridge while the civilian committee measures the ambulance cart. A young volunteer mutters that Pridea has already seen enough ponies telling griffons where to stand. Pierre, carrying the rear stretcher pole, asks him to take the other end before finishing the complaint. Together they discover that the turn cannot be made safely.\n\nLevé does not demand an apology. He asks the committee to mark a better approach, then explains why the bearers must practise it with a loaded stretcher. Several onlookers step forward to help. Some have been reluctant to volunteer for a force they feared would inherit the old divisions of the city.\n\nThe afternoon can become a full rescue exercise for the existing companies, turning the committee's criticism into a lesson everyone rehearses. It can also become an open induction for the willing newcomers, with veterans showing what service will actually require. Pierre rests the stretcher on the grass. The next group is waiting for a task."
 HSM_AQR.631.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.631.t:0 "Levé Waits for the Committee"
 HSM_AQR.632.0:0 "Hold the joint meeting and answer together."
 HSM_AQR.632.1:0 "Take the coalition's record to new voters."
 HSM_AQR.632.d:0 "Louis finds two leaflets waiting at the coalition's meeting hall. One asks voters to support the FJA's national programme; the other argues that workplace councils must keep powers no parliamentary majority should casually remove. The party organiser wants them distributed on different days. Louis asks why the disagreement should be hidden from people expected to vote on it.\n\nPierre brings chairs out for the gathering crowd. Some workers want to question both sides together. Others have come to help the coalition carry its record of wages and municipal repairs to districts that still know it only through old accusations. The partners cannot organise a substantial hearing and send the same volunteers across the city tonight.\n\nA joint meeting would let the public hear the argument without mistaking disagreement for the end of the alliance. A shared canvass would put their achieved work before new voters while leaving each partner's leaflet in circulation. Neither choice settles the next election. The doors remain open while they decide where to put their effort."
 HSM_AQR.632.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.632.t:0 "Two Leaflets at the Same Door"
 HSM_AQR.633.0:0 "Send the grain to the market kitchens."
 HSM_AQR.633.1:0 "Provision the volunteers and release their farmhands."
 HSM_AQR.633.d:0 "The merchant turns Gadiffer's silver dish over and examines the family mark before naming his price. Beside him, a tenant holds a sack of seed grain that she has brought as proof of what the villages cannot spare. The steward objects that selling the dish will feed the district only once. Lending against the coming harvest would preserve the household's standing and keep the arrangement open.\n\nGadiffer asks whose standing survives if the harvest fails. The merchant replies that he sells grain, not confidence. He will release the carts on either security, but the duke must choose where they go first.\n\nOne consignment could reopen the market kitchens before evening. Another could provision the volunteers waiting at the barracks and allow their farmhands to return home. Both requests bear names the duke recognises. He pushes the dish across the table and asks the tenant which road is still passable."
 HSM_AQR.633.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.633.t:0 "The Last Silver Dish"
 HSM_AQR.634.0:0 "Send the officers with the carts."
 HSM_AQR.634.1:0 "Recruit a village transport party."
 HSM_AQR.634.d:0 "Robert Niverolle finds the colonel inspecting an empty bread bin while the village carters unload at the wrong storehouse. The supply schedule bears the colonel's signature. He admits that he moved the field kitchens for a parade without informing the men bringing their flour. Now he wants Gadiffer to order an immediate requisition from the nearest farms.\n\nThe duke arrives with the carter who has already made the journey twice. Niverolle lays the schedule on the bread bin. Someone must accompany the carts, verify the unloading and report the changed route; no signature will do that work alone.\n\nThe colonel offers his junior officers for the task. The carter proposes pairing them with villagers who know every yard and can recruit neighbours for regular transport. Gadiffer can make this an officers' practical exercise or sponsor a civilian transport party. Either will fill the bin. The choice is who learns to prevent it becoming empty again."
 HSM_AQR.634.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.634.t:0 "The Colonel's Empty Bread Bin"
 HSM_AQR.635.0:0 "Bring both delegations before the royal office."
 HSM_AQR.635.1:0 "Secure a joint hearing through travelling advocates."
 HSM_AQR.635.d:0 "Gadiffer recognises the handwriting of his Vinovian steward before he notices the second petition beneath it. Both concern dependants of soldiers who served the crown. The first has the duchy's seal and a careful recommendation. The second comes from another province, with witness statements folded around a child's drawing of a missing parent.\n\nThe royal office offers a public hearing, but the second delegation cannot afford another long journey. Gadiffer's secretary suggests taking the Vinovian case first; the duke knows those witnesses and could settle it quickly. The other petition may require embarrassing questions about a royal officer's promises.\n\nGadiffer sets the papers side by side. His kinship has carried them into this room, but it cannot decide which family deserves an answer. He can pay to bring both delegations before the royal office. Or he can secure authority for travelling advocates to collect testimony in both districts and present their cases together."
 HSM_AQR.635.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.635.t:0 "A Petition without Our Seal"
 HSM_AQR.636.0:0 "Pay the arrears and let the shift go home."
 HSM_AQR.636.1:0 "Pay volunteers to finish the rifle order."
 HSM_AQR.636.d:0 "Guillaume Boucarle arrives at the cooperative to collect repaired rifles and finds the assembly arguing over an apprentice's wage. The student keeping the books has entered the boy under training expenses. The machinist beside him asks why a training expense was left alone to finish yesterday's order.\n\nBoucarle sets his collection slip on the bench. His men need the weapons, but he cannot decide how the workshop shares its earnings. The apprentice explains that his family has been buying supper on credit while the cooperative congratulates itself on belonging to everyone.\n\nThe members can close the accounts early, pay the overdue wages and suspend the evening shift. They can also pay those wages and invite paid volunteers to complete the rifles overnight, using the reserve kept for their next civilian order. Neither proposal returns the apprentice to his old place in the ledger. The student crosses out the heading and makes room for his name."
 HSM_AQR.636.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.636.t:0 "The Apprentice's Place in the Ledger"
 HSM_AQR.637.0:0 "Give the existing class time to become instructors."
 HSM_AQR.637.1:0 "Open the introductory course to waiting volunteers."
 HSM_AQR.637.d:0 "Jean-Baptiste Jules Gélinotte-des-Bois reaches the night class while its newest instructor is explaining how to withdraw a platoon. The marshal asks who checks the last room. The answer produces three simultaneous objections from veterans sitting among the students. He sends them outside to demonstrate their alternatives around the schoolyard.\n\nThe exercise lasts until the caretaker brings a lamp. One student has missed the last tram; another must report to the early shift. Their instructor asks whether the army expects citizens to learn command or merely admires the idea of teaching them.\n\nThe marshal offers a limited detachment of experienced instructors. They can spend the coming weeks coaching the existing class until its members can teach others. Alternatively, they can open an introductory course for the workers waiting beyond the gate, several already asking to enlist. The ABC organisers must choose between deepening a small cadre and bringing more neighbours into regular service."
 HSM_AQR.637.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.637.t:0 "The Marshal and the Night Class"
 HSM_AQR.638.0:0 "Make attendance possible for working households."
 HSM_AQR.638.1:0 "Take the families' appeal to barracks and workshops."
 HSM_AQR.638.d:0 "Guillaume Boucarle attends the ABC gathering to hear a petition from soldiers' families. Before he can read it, a workshop delegate rises from the chair nearest the door and says she must leave: the neighbour minding her children begins work shortly. Half the proposals have not yet been discussed.\n\nA founder suggests that she entrust her vote to a colleague. She replies that the republic has finally given her a voice and immediately asked her to lend it away. Boucarle folds his petition. The soldiers wrote it because their households could not always attend such meetings; their complaint is already being spoken aloud.\n\nThe organisers have enough volunteers for one additional effort. They can arrange childcare and repeat meetings near the evening shifts, giving these delegates a dependable place in the congress. Or they can tour the barracks and workers' quarters together, explaining how the social republic will defend households bearing the burdens of service."
 HSM_AQR.638.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.638.t:0 "The Chair Left by the Door"
 HSM_AQR.639.0:0 "Make room for the family among the established stalls."
 HSM_AQR.639.1:0 "Buy their inspected rifles for the guard."
 HSM_AQR.639.d:0 "Isabelle de Pie-Grièche stops at the fair to inspect a gunsmith's offered consignment and finds his stall behind the refuse carts. He has brought rifles repaired by a family recently arrived in Vinovia. The organising patron explains that the best places are reserved for crafts rooted in local tradition. The gunsmith asks how many generations his children must wait before their work acquires roots.\n\nA nearby cook recognises the question. Her dishes once received the same treatment whenever she tried to sell them under their Vinovian names elsewhere. She offers to move her table beside his, although both would lose the main crowd.\n\nThe Chevaliers' stewards can rearrange the fair and publicly welcome the newcomers among the established stalls. Alternatively, they can use the day's purchasing fund to accept the inspected rifles for the guard, giving the family a paid order and a customer willing to sign its name beside theirs."
 HSM_AQR.639.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.639.t:0 "A Stall without a Patron"
 HSM_AQR.640.0:0 "Have the officers practise with village hosts."
 HSM_AQR.640.1:0 "Hire the carters for regular transport service."
 HSM_AQR.640.d:0 "Isabelle de Pie-Grièche takes the guard's supply map to the carters and asks them to trace yesterday's exercise. Their route runs well beyond the estates marked as depots. A captain explains that those estates belong to reliable patrons. Isabelle asks whether reliability makes a wagon arrive before nightfall when the road adds another day's travel.\n\nThe owner of an unmarked village granary offers space, provided the guard pays for what it uses and leaves his neighbours access to their own stores. One patron dislikes entrusting supplies to someone absent from the charitable committee. The captain quietly admits that this same villager fed his stranded patrol.\n\nThe Chevaliers can send their officers to practise opening depots with village hosts, learning the arrangements themselves. Or they can recruit a paid transport party from the carters already travelling these roads. The manor remains a useful storehouse. It simply ceases to be the only place the map remembers."
 HSM_AQR.640.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.640.t:0 "The Road Past the Manor"
 HSM_AQR.641.0:0 "Learn both songs before the common feast."
 HSM_AQR.641.1:0 "Let the contingents pledge mutual defence in their own songs."
 HSM_AQR.641.d:0 "The visiting provincial delegation proposes a song for the federation's ceremony. Several Chevalier patrons dislike its unfamiliar rhythm, and one wonders whether a Vinovian march would make the occasion more dignified. Isabelle de Pie-Grièche, attending to arrange the guard of honour, asks which song the visitors promised their households they would hear.\n\nTheir delegate produces a copy worn thin at the folds. He has brought it because the federal guarantee convinced his town that joining Aquileia need not silence its own civic memory. A patron reads the translated verses and discovers that the strange song also remembers neighbours lost defending their streets.\n\nThe organisers can invite the townspeople to learn both songs together before a shared feast. They can instead make the visiting contingent's own march part of a public pledge of mutual defence, with the Vinovian guard answering in its turn. Either choice asks the hosts to listen before they lead."
 HSM_AQR.641.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.641.t:0 "The Song Our Guests Choose"
 HSM_AQR.642.0:0 "Publish the failure and put the keeper beside the repair crew."
 HSM_AQR.642.1:0 "Train engineers and soldiers through the temporary supply work."
 HSM_AQR.642.d:0 "Guillaume Boucarle has brought a barracks water cart to the public demonstration. The engineer starts his new pump, the committee prepares to applaud, and the flow stops with a clatter. A well keeper points to the intake. He warned the society's examiner about the grit yesterday, but the approved drawing showed clean water.\n\nThe examiner knows the engineer from an old SIS study circle. He suggests postponing the report until a replacement part arrives. The keeper asks whether the queue outside can also postpone its thirst. Boucarle tells his driver to begin distributing the cart's water while the argument continues.\n\nThe committee can publish the failure immediately and invite the keeper to supervise repairs, accepting an embarrassing morning in exchange for public trust. Or it can keep the demonstration open as a practical lesson, pairing its engineers with Boucarle's transport detail to arrange temporary supply. In either case, the broken part stays on the table."
 HSM_AQR.642.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.642.t:0 "The Pump Stops before the Applause"
 HSM_AQR.643.0:0 "Repeat the march with the transport officers."
 HSM_AQR.643.1:0 "Practise aerial reports with the mapmakers."
 HSM_AQR.643.d:0 "Guillaume Boucarle lays two reports before the society's staff class. The first says the supply column reached its destination on time. The second comes from the driver still waiting beside an orchard that the map marks as open ground. Both reports were signed by graduates of the same course.\n\nThe lecturer explains that the exercise assumed an unobstructed road. Boucarle asks whether the soldiers should eat the assumption. An aerial observer offers a sketch of the orchard and the narrow lane around it; the quartermaster says the carters knew that lane before the class began.\n\nThe society has enough instructors to repeat one part of the exercise properly. It can concentrate on the transport officers, making them follow and revise the column's route. Or it can bring the observers together with the mapmakers to practise passing corrections before the first wagon leaves. The lecturer takes down his original diagram and leaves the blackboard clear."
 HSM_AQR.643.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.643.t:0 "The Map's Missing Orchard"
 HSM_AQR.644.0:0 "Publish an independent review of the examination."
 HSM_AQR.644.1:0 "Convene a public demonstration before soldiers and craftsmen."
 HSM_AQR.644.d:0 "An editorial accuses the society of reserving a national technical appointment for a familiar name. The candidate passed the examination, but the newspaper prints another applicant's answer beside his and asks why the better calculation received the lower mark. SIS members recognise the examiner as a colleague who once lectured on republican equality.\n\nGuillaume Boucarle has been invited because the appointment concerns military instruments. He brings a faulty gauge and asks which candidate can explain it. Both do, then disagree about the repair. The examiner begins to speak for his former pupil; the newspaper's editor asks him to let the applicants finish.\n\nThe society can open an independent review of the marked papers and publish its reasoning, accepting whatever correction follows. Or it can organise a public technical hearing in which both candidates demonstrate their work before soldiers and civilian craftsmen. The republic will hear an answer. The society must decide how to make that answer credible."
 HSM_AQR.644.lapsed:0 "File the report with the former government's papers."
 HSM_AQR.644.t:0 "The Examiner Examined"
 HSM_AQR.acknowledge:0 "The work continues."
 HSM_AQR_CAM_JEB_cocardiers_c1:0 "The Fanal Reads Its Own Demands"
 HSM_AQR_CAM_JEB_cocardiers_c1_desc:0 "The Fanal's workers have carried other clubs' pamphlets through Rila for years. Now a reader hesitates over a requisition that claims to speak for them. The Cocardiers will open lessons around actual workshop notices and meeting papers. Those who supplied the revolution's feet should be able to read its promises, challenge a forged instruction and recognise their own words in print."
 HSM_AQR_CAM_JEB_cocardiers_c2:0 "The Revolution Hears Its Witnesses"
 HSM_AQR_CAM_JEB_cocardiers_c2_desc:0 "Delegates beyond Rila ask the Cocardiers why their committee should be trusted with wider revolutionary responsibility. Its defenders bring accounts of courage; its critics bring accounts of confiscations and frightened neighbours. The national campaign will hear both before proclaiming what must be preserved. A movement determined to prevent another restoration must explain which victories belong to the republic and which merely rewarded a club."
 HSM_AQR_CAM_JEB_cocardiers_e1:0 "Account for the Rupins' Stores"
 HSM_AQR_CAM_JEB_cocardiers_e1_desc:0 "The Cocardiers bring the keys of seized warehouses to the Committee of Public Safety. Inside are goods taken in the revolution's name, some useful and some already disappearing into private hands. Their promise was to break the wealth that sustained restoration. They must now put those stores to public work, beginning with inventories that even a victorious club cannot quietly alter."
 HSM_AQR_CAM_JEB_cocardiers_e2:0 "The Coach House Makes Pumps"
 HSM_AQR_CAM_JEB_cocardiers_e2_desc:0 "A confiscated coach house still smells of polished leather while neighbouring workshops wait for pumps and repair tools. The Cocardiers call its former craftsmen back to fit benches beneath the empty harness racks. Turning an estate's luxury into useful work will test their revolutionary claim more severely than another raid: the machines must serve people who cannot simply seize replacements."
 HSM_AQR_CAM_JEB_cocardiers_e3:0 "One Order for the Foundry"
 HSM_AQR_CAM_JEB_cocardiers_e3_desc:0 "The foundry has received demands for machine parts, rifle fittings and an ornamental revolutionary bell, each marked urgent by a different club. Its workers ask the committee which furnace charge should come first. The Cocardiers will bring their requisitions into a common production schedule. Revolutionary resolve cannot melt the same iron three times, however loudly its claimants pronounce the republic's name."
 HSM_AQR_CAM_JEB_cocardiers_e4:0 "The Freight Behind the Proclamation"
 HSM_AQR_CAM_JEB_cocardiers_e4_desc:0 "Aquileian clubs answer the Cocardiers' national appeal with requests for tools, not merely speakers. The dispatch room discovers that pledged supplies are waiting on several disconnected schedules. Its delegates will travel with the railway workers to join those journeys together. A movement claiming to defend the entire republic must reach workshops beyond Rila before asking them to trust its commands."
 HSM_AQR_CAM_JEB_cocardiers_e5:0 "Arms from the Public Workshops"
 HSM_AQR_CAM_JEB_cocardiers_e5_desc:0 "The memory of paying smugglers for unreliable rifles still angers the Cocardiers' veterans. A national revolutionary programme cannot rest on another desperate purchase. The committee will dedicate a workshop to military manufacture, drawing on the foundry's common specifications and the armourers' experience. Its weapons must leave the bench ready for inspection by the recruits who will carry them."
 HSM_AQR_CAM_JEB_cocardiers_economy1:0 "The Seized Warehouse Inventory"
 HSM_AQR_CAM_JEB_cocardiers_economy1_desc:0 "The Cocardiers begin turning confiscated privilege into working supplies, with an inventory that challenges private claims made in the revolution's name."
 HSM_AQR_CAM_JEB_cocardiers_economy2:0 "The Common Furnace Schedule"
 HSM_AQR_CAM_JEB_cocardiers_economy2_desc:0 "Competing club requisitions give way to a foundry schedule that workers can follow without guessing which seal matters most."
 HSM_AQR_CAM_JEB_cocardiers_economy3:0 "The Republic's Working Arsenals"
 HSM_AQR_CAM_JEB_cocardiers_economy3_desc:0 "The public workshops connect seized stores, common specifications and arms manufacture. Revolutionary claims must now produce usable work."
 HSM_AQR_CAM_JEB_cocardiers_m1:0 "The Club Goes to the Muster"
 HSM_AQR_CAM_JEB_cocardiers_m1_desc:0 "The Cocardiers' volunteers arrive by club, each group expecting to keep its own watchwords and commanders. Boreas Babeuf counts the gaps between them as carefully as the recruits themselves. The committee will ask each club to send a complete contingent into common service. Its revolutionary army must be able to stand together when the familiar meeting hall is far behind."
 HSM_AQR_CAM_JEB_cocardiers_m2:0 "Lessons from the Smuggled Rifles"
 HSM_AQR_CAM_JEB_cocardiers_m2_desc:0 "At Dilven, an instructor spreads the old imported weapons across a bench. Some were obsolete when bought; others never worked properly. The recruits laugh until he asks which one they would trust during a retreat. The Cocardiers will turn that bitter collection into practical instruction, teaching soldiers to recognise faults, keep sound weapons working and refuse dangerous improvisation disguised as revolutionary courage."
 HSM_AQR_CAM_JEB_cocardiers_m3:0 "Babeuf Counts the Empty Wagons"
 HSM_AQR_CAM_JEB_cocardiers_m3_desc:0 "Babeuf orders a rapid exercise and discovers that three clubs have sent ammunition to the same company while another receives none. Their messengers all carry valid committee seals. The revolutionary command will drill dispatchers and quartermasters alongside the soldiers. A shared purpose requires a supply route that survives competing loyalties, or the quickest march will merely bring hungry volunteers together."
 HSM_AQR_CAM_JEB_cocardiers_m4:0 "The Gun Crew Beyond Its Club"
 HSM_AQR_CAM_JEB_cocardiers_m4_desc:0 "Artillery pieces arrive with crews who have served only beside their own comrades. Babeuf places observers from another formation at the range and tells them to request support. The first attempt dissolves into incompatible signals. A revolutionary army seeking a national role must learn the patient language of shared fire plans, where a familiar slogan cannot tell a gunner where to aim."
 HSM_AQR_CAM_JEB_cocardiers_m5:0 "An Army That Can Leave the Barricade"
 HSM_AQR_CAM_JEB_cocardiers_m5_desc:0 "The old barricade fighters know every doorway in their own district. Beyond it, they need cooks, repair carts and messengers who can find an unfamiliar road. The Cocardiers will build their common service around those uncelebrated duties. Their promise to defend the republic across Aquileia demands troops able to travel without making each village surrender the means of feeding itself."
 HSM_AQR_CAM_JEB_cocardiers_military1:0 "The Clubs' Common Muster"
 HSM_AQR_CAM_JEB_cocardiers_military1_desc:0 "Cocardier volunteers begin learning a shared service beyond the customs of their own meeting halls."
 HSM_AQR_CAM_JEB_cocardiers_military2:0 "Ammunition Beyond the Club Seal"
 HSM_AQR_CAM_JEB_cocardiers_military2_desc:0 "Common dispatch exercises teach the revolutionary formations to send supplies where they are needed, rather than where an old comrade is waiting."
 HSM_AQR_CAM_JEB_cocardiers_military3:0 "The Marching Revolutionary Service"
 HSM_AQR_CAM_JEB_cocardiers_military3_desc:0 "The club contingents carry their common drills, repair teams and provisioning habits beyond the streets where they first assembled."
 HSM_AQR_CAM_JEB_constitutional_c1:0 "A Petition Without a Patron"
 HSM_AQR_CAM_JEB_constitutional_c1_desc:0 "The assembly's visitors still ask which influential name should appear above their own. Michel hears a servant explain that this was how petitions reached him before the charter. A public reception will admit claimants in the order they arrive, including those who know nobody in the chamber. The settlement must change the experience of waiting outside as well as speaking within."
 HSM_AQR_CAM_JEB_constitutional_c2:0 "The Duke Takes a Place in the Queue"
 HSM_AQR_CAM_JEB_constitutional_c2_desc:0 "Rila's constitutional delegation carries a charter into a national meeting where other provinces have brought their own demands. Michel asks for the speaking list instead of the chair. His return was authorised by Rilan representatives; any wider place must be argued afresh. The movement's credibility now depends on whether its most recognisable advocate will accept amendments he did not propose."
 HSM_AQR_CAM_JEB_constitutional_e1:0 "The Seal Beside the Vote"
 HSM_AQR_CAM_JEB_constitutional_e1_desc:0 "After Michel's return under the charter, his former suppliers still bring invoices to the palace. The assembly sends them to the minister who placed the orders. A ducal promise must now meet an appropriation openly agreed by representatives. The first contracts will establish whether old acquaintances can work within the settlement without slipping through the gaps between its signatures."
 HSM_AQR_CAM_JEB_constitutional_e2:0 "A Tender on the Reading Table"
 HSM_AQR_CAM_JEB_constitutional_e2_desc:0 "A proposal for a machine workshop circulates through Rila's reading rooms before the assembly chooses a contractor. Michel recognises one bidder; the printers recognise another from unpaid wartime bills. Neither recognition settles the question. The delegates will compare drawings and hear the workers who must operate the machines, giving the charter its first substantial undertaking outside the debating chamber."
 HSM_AQR_CAM_JEB_constitutional_e3:0 "The Gauge Has No Title"
 HSM_AQR_CAM_JEB_constitutional_e3_desc:0 "A foreman rejects a delivery bearing an impressive coat of arms: the fittings do not match the order. The supplier appeals to Michel, who passes the disputed pieces to the workshop's examiners. Rila's constitutional bargain needs places where evidence can inconvenience an influential patron. A common testing room will let the craftsmen settle such arguments with measurements that both sides can repeat."
 HSM_AQR_CAM_JEB_constitutional_e4:0 "Questions Carried by Wire"
 HSM_AQR_CAM_JEB_constitutional_e4_desc:0 "Representatives outside Rila complain that the ministry's answers arrive after the work they concern has already begun. The constitutional delegation proposes linking provincial offices and technical schools by reliable telegraph service. An engineer lays the circuit drawings beside the unanswered letters. A responsible cabinet must be reachable from beyond the corridor where its ministers recognise every visitor by sight."
 HSM_AQR_CAM_JEB_constitutional_e5:0 "The Appropriation Survives Its Patron"
 HSM_AQR_CAM_JEB_constitutional_e5_desc:0 "A contractor asks what becomes of a provincial order if its sponsoring minister loses the assembly's confidence. Michel has no private guarantee to offer. The charter's advocates will make the approved undertaking answerable to the chamber itself, with records that a successor can follow. Their national programme must promise continuity without granting any officeholder a right to remain forever."
 HSM_AQR_CAM_JEB_constitutional_economy1:0 "Countersigned Workshop Orders"
 HSM_AQR_CAM_JEB_constitutional_economy1_desc:0 "Rila's new contracts require an appropriation and an accountable minister, giving craftsmen a promise they can present beyond the palace doors."
 HSM_AQR_CAM_JEB_constitutional_economy2:0 "The Assembly's Testing Rooms"
 HSM_AQR_CAM_JEB_constitutional_economy2_desc:0 "Measurements and recorded specifications are replacing the recommendation of a familiar patron in Rila's public workshops."
 HSM_AQR_CAM_JEB_constitutional_economy3:0 "Contracts Beneath the Charter"
 HSM_AQR_CAM_JEB_constitutional_economy3_desc:0 "Technical evidence travels with public orders, and approved work survives a change of ministry. Rila's charter has acquired a practical industrial life."
 HSM_AQR_CAM_JEB_constitutional_m1:0 "The Oath Read in Full"
 HSM_AQR_CAM_JEB_constitutional_m1_desc:0 "Recruits gather beneath a charter posted beside the enlistment table. Some expect an oath to Michel; others fear another club's private army. Anne-Josephine de Mericourt reads the text aloud before asking for volunteers. Service belongs to the lawful institutions they have established together. A soldier should understand whose orders bind the regiment, and who can demand an account of them."
 HSM_AQR_CAM_JEB_constitutional_m2:0 "Promotion Before a Witness"
 HSM_AQR_CAM_JEB_constitutional_m2_desc:0 "A veteran instructor and a young clerk arrive for the same officer examination. One knows the ground; the other can read every instruction without help. Mericourt asks both to lead a squad through an unfamiliar exercise. The constitutional army will need schools where experience can be taught and learning tested, without a family connection deciding whose mistakes deserve forgiveness."
 HSM_AQR_CAM_JEB_constitutional_m3:0 "The Emergency Order Has an Author"
 HSM_AQR_CAM_JEB_constitutional_m3_desc:0 "A mobilisation exercise reveals an order signed only with the name of a committee. The stationmaster cannot discover who may change it, and two companies wait beside a loaded train. Mericourt brings the instruction to the ministry. The charter must allow urgent action while leaving a recognisable officer responsible for explaining what was ordered and why the railway stopped."
 HSM_AQR_CAM_JEB_constitutional_m4:0 "An Arsenal Open to Inspection"
 HSM_AQR_CAM_JEB_constitutional_m4_desc:0 "The assembly receives an offer to expand arms manufacture under a confidential arrangement. Its military delegates accept that drawings need protection, but ask why the invoices should be hidden as well. A supervised arsenal will give the constitutional programme a practical answer. Workers, inspectors and officers will each know which door they may open without seeking a patron's favour."
 HSM_AQR_CAM_JEB_constitutional_m5:0 "A Staff Answerable to the Chamber"
 HSM_AQR_CAM_JEB_constitutional_m5_desc:0 "Maps brought from several provinces cover the ministry's table. Each delegation has a different memory of what emergency powers once permitted. Mericourt proposes a common staff exercise, with civilian representatives examining the dispatches afterwards. The constitutional movement must show that a coordinated army can obey a clear command while leaving its government's authority open to an awkward question."
 HSM_AQR_CAM_JEB_constitutional_military1:0 "A Charter in the Barracks"
 HSM_AQR_CAM_JEB_constitutional_military1_desc:0 "The recruit's oath identifies the lawful institutions above the regiment. Personal loyalty must find its place inside that common undertaking."
 HSM_AQR_CAM_JEB_constitutional_military2:0 "Signed Emergency Dispatches"
 HSM_AQR_CAM_JEB_constitutional_military2_desc:0 "Urgent orders now have authors who can be found and questioned. Officers can prepare together without losing the thread of responsibility."
 HSM_AQR_CAM_JEB_constitutional_military3:0 "The Constitutional General Staff"
 HSM_AQR_CAM_JEB_constitutional_military3_desc:0 "A common staff coordinates the provincial formations while its ministers remain answerable for the authority they entrust to it."
 HSM_AQR_CAM_JEB_moderate_c1:0 "Read the Motion for Yourself"
 HSM_AQR_CAM_JEB_moderate_c1_desc:0 "The Fanal's messengers once carried printed words for workers who could not read them. In the moderate clubs' evening rooms, a compositor now sets a short motion beside a spelling exercise. Learners can question the sentence as soon as they understand it. The republic will gain citizens who need neither a landlord nor a friendly orator to tell them what a paper says."
 HSM_AQR_CAM_JEB_moderate_c2:0 "The Clubs That Lose a Vote"
 HSM_AQR_CAM_JEB_moderate_c2_desc:0 "The moderate delegation returns from a national republican meeting without winning every argument. At home, an impatient supporter wants the rejected speakers excluded from the next public hall. Société Justice refuses the suggestion. The clubs have joined a broader movement whose decisions will sometimes disappoint them; their place in it depends on making disagreement survivable for their neighbours as well."
 HSM_AQR_CAM_JEB_moderate_e1:0 "A Stall Without a Patron"
 HSM_AQR_CAM_JEB_moderate_e1_desc:0 "The moderate clubs find the same names on every list of favoured market traders. Outside the gates, a basket maker waits for someone important to recommend her. Société Justice will hear these sellers before drafting the new market rules. A republic defended by small workshops should let their owners reach a customer without first acquiring a friend in government."
 HSM_AQR_CAM_JEB_moderate_e2:0 "The Subscribers' Machine Hall"
 HSM_AQR_CAM_JEB_moderate_e2_desc:0 "A printer needs a lathe only occasionally; a cartwright cannot afford one at all. At a meeting hosted by De Becignier, craftsmen propose a machine hall supported by subscriptions and open appointments. The moderate committee will help them turn the proposal into a working shop. Its machines must remain available to neighbours whose club badges differ from the founders'."
 HSM_AQR_CAM_JEB_moderate_e3:0 "Receipts Survive the Barricades"
 HSM_AQR_CAM_JEB_moderate_e3_desc:0 "Small suppliers arrive with revolutionary receipts that nobody knows how to redeem. Some furnished paper, others bread or iron, and several now owe their own neighbours. The moderate clubs will reconcile these claims in a common clearing office. Restarting production means tracing promises back to the work they purchased, without treating every inconvenient creditor as an enemy of the republic."
 HSM_AQR_CAM_JEB_moderate_e4:0 "A Wagon for the Smaller Town"
 HSM_AQR_CAM_JEB_moderate_e4_desc:0 "The largest republican clubs can fill a freight wagon with their supporters' goods. A smaller town cannot, and its crates remain on the platform while speeches praise national solidarity. Rila's moderate delegates propose collecting small consignments along a shared route. Their contribution to the national republic will be judged by merchants who need a timetable more than another invitation to applaud."
 HSM_AQR_CAM_JEB_moderate_e5:0 "Prices Beyond the Club Door"
 HSM_AQR_CAM_JEB_moderate_e5_desc:0 "A merchant receives news of a distant shortage before the market hears it and buys every available sack. The clubs' printers want to publish regular quotations from other provinces, with telegraph operators helping verify them. The moderate programme will carry this modest service into national republican politics: information that reaches a small producer before a well-connected buyer has finished bargaining."
 HSM_AQR_CAM_JEB_moderate_economy1:0 "The Unendorsed Market Stall"
 HSM_AQR_CAM_JEB_moderate_economy1_desc:0 "Small Rilan producers can seek customers without first borrowing the reputation of a courtier or a club director."
 HSM_AQR_CAM_JEB_moderate_economy2:0 "The Craftsmen's Clearing House"
 HSM_AQR_CAM_JEB_moderate_economy2_desc:0 "Shared equipment and reconciled receipts let independent workshops undertake work that none could carry through alone."
 HSM_AQR_CAM_JEB_moderate_economy3:0 "The Moderate Producers' Compact"
 HSM_AQR_CAM_JEB_moderate_economy3_desc:0 "Small consignments, public prices and dependable claims bind Rila's independent producers into a useful part of the national republican economy."
 HSM_AQR_CAM_JEB_moderate_m1:0 "The Volunteer Has a Workshop"
 HSM_AQR_CAM_JEB_moderate_m1_desc:0 "A guard roster reaches a workshop with every skilled worker's name marked for the same week. The owner and apprentices bring it to the moderate committee together. Mericourt will arrange service around the occupations that keep a district alive, asking employers and volunteers to agree workable rotations. A citizen army must remain recognisable as part of the society it defends."
 HSM_AQR_CAM_JEB_moderate_m2:0 "Proof Every Donated Rifle"
 HSM_AQR_CAM_JEB_moderate_m2_desc:0 "The clubs proudly display weapons collected during the uprising, including rifles that jam when warmed by repeated firing. A familiar donor asks the armourer not to embarrass him before the volunteers. The moderate committee backs the inspection. Gratitude can be expressed in a speech; the recruits deserve instructors who will set aside a dangerous gift without asking who presented it."
 HSM_AQR_CAM_JEB_moderate_m3:0 "The Relief Arrives Before the Vote"
 HSM_AQR_CAM_JEB_moderate_m3_desc:0 "An evening assembly begins while the district guards are still waiting for relief. Their neighbours have already taken the best seats and begun deciding the agenda. Mericourt brings the roster to the club representatives. Duties must pass reliably between units so that service does not silence the citizen. The same habit will matter when exhaustion replaces a meeting as the reason to change the watch."
 HSM_AQR_CAM_JEB_moderate_m4:0 "Repair Orders Without Club Colours"
 HSM_AQR_CAM_JEB_moderate_m4_desc:0 "Officers from outside Rila arrive with damaged weapons and discover that local repair queues still follow old political friendships. The moderate delegates propose a dedicated arms workshop whose orders are ranked by condition and need. Supporting the national republic means accepting unfamiliar formations at the same bench, even when their soldiers sing a different version of the revolutionary songs."
 HSM_AQR_CAM_JEB_moderate_m5:0 "A Citizen's Place in the Reserve"
 HSM_AQR_CAM_JEB_moderate_m5_desc:0 "A returning volunteer knows where his unit will assemble but not who will bring the stretcher carts or replace the exhausted sentries. The moderate clubs invite medical workers and reserve instructors to plan together. Their army will defend the republic through districts able to sustain a position, relieve their neighbours and welcome the injured home without losing the thread of common service."
 HSM_AQR_CAM_JEB_moderate_military1:0 "The Workshop Volunteer Roster"
 HSM_AQR_CAM_JEB_moderate_military1_desc:0 "Local service is arranged around the households and trades that keep each district standing. The citizen guard knows the places it must protect."
 HSM_AQR_CAM_JEB_moderate_military2:0 "The Reliable Relief"
 HSM_AQR_CAM_JEB_moderate_military2_desc:0 "The guards have learned to hand over their positions before exhaustion turns a willing volunteer into an inattentive sentry."
 HSM_AQR_CAM_JEB_moderate_military3:0 "The Republic's District Reserves"
 HSM_AQR_CAM_JEB_moderate_military3_desc:0 "Medical workers, repair shops and reserve companies sustain a defensive service rooted in the republic's ordinary districts."
 HSM_AQR_CAM_JEB_royal_c1:0 "The Books Returned to Their Shelves"
 HSM_AQR_CAM_JEB_royal_c1_desc:0 "Booksellers bring Michel lists of missing volumes, some seized by guards and others hidden before a search could begin. His old guests remember the promise that Rila would shelter thought. The duke offers rooms for reading and instruction, then asks the librarians what they need to reopen. No courtier is invited to choose which peaceful argument a pupil may encounter there."
 HSM_AQR_CAM_JEB_royal_c2:0 "A Loyal Voice Beyond Rila"
 HSM_AQR_CAM_JEB_royal_c2_desc:0 "Michel's delegation carries complaints as well as assurances of loyalty to the national royal movement. Provincial families have lost relatives on both sides, and a triumphal address cannot answer all their questions. The duke will put those petitions before the crown's representatives. Rila's place beside the legitimate dynasty must include the awkward work of telling its allies what their subjects endure."
 HSM_AQR_CAM_JEB_royal_e1:0 "The Duke's Fair Must Pay Its Way"
 HSM_AQR_CAM_JEB_royal_e1_desc:0 "Michel's treasurer can name every noble exemption and scarcely any reason for keeping it. At the fair, an artisan pays for a stall while a privileged merchant fills a whole street. The duke asks for both accounts. A royal market should sustain the town around it; the court will have to surrender some comfortable customs to make that promise credible."
 HSM_AQR_CAM_JEB_royal_e2:0 "Tools Under the Royal Seal"
 HSM_AQR_CAM_JEB_royal_e2_desc:0 "A broken press and an idle saw tell Michel more about recovery than the court's ceremonial addresses. He invites Rilan craftsmen to submit work for a common tool shop under ducal patronage. The palace can guarantee an order, but it cannot judge a cutting edge. That task will belong to the artisans who must use what the shop produces."
 HSM_AQR_CAM_JEB_royal_e3:0 "Flowerino's Road to Market"
 HSM_AQR_CAM_JEB_royal_e3_desc:0 "Farmers outside Flowerino can see the fair's tents long before their carts reach them. Ruts and a neglected crossing consume the morning, leaving the best stalls to merchants with lighter wagons. Michel sends his road surveyors out with the next produce convoy. The crown's protection will be measured along the journey, where a broken axle can spoil an entire week's work."
 HSM_AQR_CAM_JEB_royal_e4:0 "A Slipway for Pélis"
 HSM_AQR_CAM_JEB_royal_e4_desc:0 "The Chantiers de Pélis wants room for another hull, and its workers want reassurance that a royal celebration will not swallow the wages. Michel's representatives bring a construction agreement to the yard instead of a parade order. The duchy's maritime craft can serve Aquileia's crown best when the shipwright who lays the keel knows who will pay for it."
 HSM_AQR_CAM_JEB_royal_e5:0 "Patronage That Outlives the Feast"
 HSM_AQR_CAM_JEB_royal_e5_desc:0 "Aquileian visitors have admired Rila's fairs and ships; Michel now asks them to stay for the workshop inspections. A crown cannot live indefinitely on gratitude for a splendid afternoon. The duke's engineers will share their drawings with royal contractors beyond his province, carrying the less glamorous habits that keep a crane working after the banners have been taken down."
 HSM_AQR_CAM_JEB_royal_economy1:0 "The Fair's Own Accounts"
 HSM_AQR_CAM_JEB_royal_economy1_desc:0 "Michel's patronage begins to carry an obligation: favoured merchants must explain what their privileges contribute to Rila's working streets."
 HSM_AQR_CAM_JEB_royal_economy2:0 "Roads Beneath the Royal Banners"
 HSM_AQR_CAM_JEB_royal_economy2_desc:0 "The fair and its suppliers are learning to depend on a maintained road, a signed order and a workshop that opens on time."
 HSM_AQR_CAM_JEB_royal_economy3:0 "The Crown's Rilan Suppliers"
 HSM_AQR_CAM_JEB_royal_economy3_desc:0 "From Flowerino's carts to the Pélis slipways, royal patronage rests on craftsmen whose work must justify the seal above their doors."
 HSM_AQR_CAM_JEB_royal_m1:0 "Harnais Inspects the Garrisons"
 HSM_AQR_CAM_JEB_royal_m1_desc:0 "Beau Harnais finds a garrison proud of its banners and careless with its stores. He asks the youngest sentry to describe what happens if the coastal road is cut. The answer brings the captain down from his horse. Rila's loyal regiments will begin with the work that earns a soldier's confidence: dependable reliefs, sound positions and officers who know the ground."
 HSM_AQR_CAM_JEB_royal_m2:0 "One Rifle, One Armourer's Pattern"
 HSM_AQR_CAM_JEB_royal_m2_desc:0 "Crates received from royal suppliers do not always agree with the weapons already on the racks. Harnais brings armourers into the barracks and has the soldiers lay their rifles beside the spare parts. Courtiers may argue about prestigious contracts elsewhere. Here the argument ends when a replacement bolt fits, and a company can march without borrowing tools from the next."
 HSM_AQR_CAM_JEB_royal_m3:0 "The Cart Behind the Colour"
 HSM_AQR_CAM_JEB_royal_m3_desc:0 "A regimental standard reaches the village before the bread wagon, and the welcome soon becomes an argument about requisitions. Harnais follows the missing cart back along its route. The army of a lawful crown cannot ask every village to repair its mistakes. Its quartermasters will learn to arrange deliveries before the march, and its captains to respect the arrangements."
 HSM_AQR_CAM_JEB_royal_m4:0 "The Crown's Coastal Watch"
 HSM_AQR_CAM_JEB_royal_m4_desc:0 "From Pélis, a merchant captain can trace an unfamiliar silhouette long before a headquarters clerk hears of it. Royal service should make use of that knowledge without turning every fishing trip into an interrogation. Naval officers will meet the pilots at their own tables, agreeing signals and rendezvous that let coastal communities shelter the crown's shipping and warn its escorts."
 HSM_AQR_CAM_JEB_royal_m5:0 "Regiments Worthy of Their Oath"
 HSM_AQR_CAM_JEB_royal_m5_desc:0 "Harnais lays the Rilan exercise reports before officers arriving from other royal formations. They have brought different habits and the same question: what must a soldier preserve when orders become confused? He begins with the supply route and the ground entrusted to each company. Michel wants Rila's service to strengthen the legitimate crown through competence that other regiments can recognise."
 HSM_AQR_CAM_JEB_royal_military1:0 "Harnais's Garrison Rounds"
 HSM_AQR_CAM_JEB_royal_military1_desc:0 "Loyalty keeps the colours flying; Harnais insists that prepared positions and attentive officers must keep the soldiers beneath them alive."
 HSM_AQR_CAM_JEB_royal_military2:0 "Provisioned Royal Garrisons"
 HSM_AQR_CAM_JEB_royal_military2_desc:0 "The bread wagon now belongs in the captain's plans alongside the company standard. Royal troops are learning to hold ground without exhausting their hosts."
 HSM_AQR_CAM_JEB_royal_military3:0 "The Rilan Standard of Service"
 HSM_AQR_CAM_JEB_royal_military3_desc:0 "Rila offers the crown a disciplined defensive service, with coastal stores and marching columns arranged around the same dependable deliveries."
 HSM_AQR_CAM_JFT_communes_c1:0 "Read the Motion Aloud"
 HSM_AQR_CAM_JFT_communes_c1_desc:0 "The assembly's papers are passed around faster than some workers can read them. Louis notices a neighbour agreeing to a motion after asking the wrong question about it. Evening reading circles will use the actual workshop notices and communal proposals. Nobody should need a patron to discover what has been put forward in their name."
 HSM_AQR_CAM_JFT_communes_c2:0 "No President at the Long Table"
 HSM_AQR_CAM_JFT_communes_c2_desc:0 "Delegates arriving from across Aquileia ask who chairs the federation when its communes disagree. Louis points to the empty seat awaiting the next assembly's speaker. The shared mandate requires someone to conduct business, but it gives nobody ownership of the table. Pridea must now practise among strangers the freedom it first promised to its neighbours."
 HSM_AQR_CAM_JFT_communes_e1:0 "The Workshops Keep the Keys"
 HSM_AQR_CAM_JFT_communes_e1_desc:0 "The workshops have elected their own delegates, but their locked storerooms still divide tools needed for the same job. Louis asks each assembly to send a keeper who can promise a loan and answer for its return. Common ownership will acquire meaning when a neighbouring workshop can borrow a lathe attachment without first winning a speech contest."
 HSM_AQR_CAM_JFT_communes_e2:0 "A Foundry Owned by Its Shifts"
 HSM_AQR_CAM_JFT_communes_e2_desc:0 "The communal workshops need castings more urgently than they need another declaration about labour. An idle foundry offers space for a shared undertaking, provided its shifts can agree who repairs the furnace and who receives the first pour. Pierre carries the proposals between assemblies, returning each evening with soot on the same pages that record their objections."
 HSM_AQR_CAM_JFT_communes_e3:0 "Drawings without a Master's Seal"
 HSM_AQR_CAM_JFT_communes_e3_desc:0 "An apprentice has copied a useful casting pattern, only to discover that the original remains guarded as a former proprietor's secret. The foundry assembly will open its drawing cupboard to neighbouring workshops. Experienced moulders must explain the marks on the paper, and the apprentices must be allowed to ask why the old method sometimes fails."
 HSM_AQR_CAM_JFT_communes_e4:0 "The Road Agreed between Communes"
 HSM_AQR_CAM_JFT_communes_e4_desc:0 "Newly joined communes have brought the federation a practical dispute: the shortest freight road crosses fields whose owners will not accept another requisition. Delegates walk the proposed route with the farmers and cart crews. Their revised plan takes longer to draw, but each village will know which work it promised and where its neighbours' responsibility begins."
 HSM_AQR_CAM_JFT_communes_e5:0 "A Wire between Open Stores"
 HSM_AQR_CAM_JFT_communes_e5_desc:0 "A commune can promise surplus bearings in the morning and discover a broken pump before the courier returns. The federation's workshops want direct messages between their stores, with each assembly still responsible for the promises sent. A repaired telephone exchange will carry those conversations farther, allowing disagreements to reach the neighbours before an empty wagon does."
 HSM_AQR_CAM_JFT_communes_economy1:0 "Borrowed Tools, Shared Work"
 HSM_AQR_CAM_JFT_communes_economy1_desc:0 "Workshop assemblies lend equipment through keepers who answer for its return. Repair work can cross a district boundary without crossing a patron's doorstep."
 HSM_AQR_CAM_JFT_communes_economy2:0 "The Foundry's Open Drawings"
 HSM_AQR_CAM_JFT_communes_economy2_desc:0 "Shared casting patterns connect the communal workshops. Skilled workers teach neighbours how to make parts that used to arrive behind a proprietor's seal."
 HSM_AQR_CAM_JFT_communes_economy3:0 "The Federation of Working Shops"
 HSM_AQR_CAM_JFT_communes_economy3_desc:0 "Road agreements and direct messages give the communes a working exchange of tools, castings and labour. Their stores remain answerable to their assemblies."
 HSM_AQR_CAM_JFT_communes_m1:0 "The Assembly's Arms Chest"
 HSM_AQR_CAM_JFT_communes_m1_desc:0 "Militia weapons have followed their owners home, leaving some districts well supplied and others asking favours at every alarm. Pierre proposes communal arms chests entrusted to keepers chosen by the assemblies. Volunteers will still know where their rifles are, but the right to defend a street will no longer depend on knowing the right veteran."
 HSM_AQR_CAM_JFT_communes_m2:0 "Barricades with a Way Through"
 HSM_AQR_CAM_JFT_communes_m2_desc:0 "The veterans remember where the first commune's defenders made their stand. Younger volunteers have begun copying those barricades, including mistakes that trapped the wounded behind their own furniture. The militia will study the streets with residents who carried stretchers through them. A position must shelter its defenders while leaving them a route to reinforce a neighbour."
 HSM_AQR_CAM_JFT_communes_m3:0 "A Common Watch, a Recallable Command"
 HSM_AQR_CAM_JFT_communes_m3_desc:0 "Two assemblies have recalled their militia delegates on the same afternoon, leaving a relief column waiting for instructions. Louis refuses to make military service an exemption from communal control. The neighbouring watches will rehearse a handover that preserves the route and supplies while a new delegate takes the old one's place at the map."
 HSM_AQR_CAM_JFT_communes_m4:0 "Depots Held in Common"
 HSM_AQR_CAM_JFT_communes_m4_desc:0 "Federation patrols now travel beyond the streets where every baker knows them. Their supplies must follow agreements between communes rather than the appetite of whichever column arrives first. Storekeepers will prepare marked loads for neighbouring units and accompany the first journeys. A militia defending collective freedom must learn to leave a community's winter grain untouched."
 HSM_AQR_CAM_JFT_communes_m5:0 "An Arsenal with Assembly Windows"
 HSM_AQR_CAM_JFT_communes_m5_desc:0 "The shared foundry can cast the fittings needed by a dedicated arms workshop. Its delegates insist that military orders must remain visible to the workers whose evenings they consume. The federation will establish an arsenal where repair crews and elected keepers work together, supplying common defence without handing the armoury keys to an unanswerable commander."
 HSM_AQR_CAM_JFT_communes_military1:0 "Rifles Entrusted by the Street"
 HSM_AQR_CAM_JFT_communes_military1_desc:0 "Communal keepers distribute arms for local defence. Volunteers know the streets they guard and the neighbours who entrusted the weapons to them."
 HSM_AQR_CAM_JFT_communes_military2:0 "The Watch Survives Its Delegate"
 HSM_AQR_CAM_JFT_communes_military2_desc:0 "Rehearsed handovers let assemblies replace military representatives without abandoning the common watch. Neighbouring units know where to find each other."
 HSM_AQR_CAM_JFT_communes_military3:0 "Defence by Mutual Undertaking"
 HSM_AQR_CAM_JFT_communes_military3_desc:0 "Common depots and an accountable arsenal sustain the federation's militia beyond its home streets. A march no longer requires taking a village's winter stores."
 HSM_AQR_CAM_JFT_dennis_c1:0 "The Auxiliaries' Home Addresses"
 HSM_AQR_CAM_JFT_dennis_c1_desc:0 "The pony auxiliaries have families in streets where their uniforms recall raids and searches. Fleur brings Dennis a bundle of complaints, some against his men and some against those threatening their children. She asks him to distinguish service from collective innocence, and grievance from collective guilt. The admiral cannot settle these streets by marching through them once more."
 HSM_AQR_CAM_JFT_dennis_c2:0 "A Sailor's Place beside the Crown"
 HSM_AQR_CAM_JFT_dennis_c2_desc:0 "The national settlement gives Pridea's admiral a place from which to argue for his harbour. Dennis arrives with charts, freight complaints and a deep suspicion that someone wants his keys. Royal service still binds him to the dynasty. Making that service useful will require him to speak for his sailors without treating every Aquileian shore as his possession."
 HSM_AQR_CAM_JFT_dennis_e1:0 "The Admiral's Repair Book"
 HSM_AQR_CAM_JFT_dennis_e1_desc:0 "Dennis can remember which captain owes him a favour, but the dockyard cannot repair a hull with recollections. Its masters have begun a book of damaged vessels, promised timber and unfinished work. The admiral wants his old acquaintances served promptly. They will discover that even an acquaintance must bring the carpenter something more useful than a familiar name."
 HSM_AQR_CAM_JFT_dennis_e2:0 "A Berth for the Coasters"
 HSM_AQR_CAM_JFT_dennis_e2_desc:0 "The great naval hulls take every convenient berth while the small coasters wait with split planks and leaking seams. Their captains carry the cargoes that keep Pridea's markets open. A repair slip reserved for these uncelebrated vessels will test whether Dennis's maritime friendships can serve the harbour beyond the ships whose officers dine at his table."
 HSM_AQR_CAM_JFT_dennis_e3:0 "Patterns from the Master Shipwrights"
 HSM_AQR_CAM_JFT_dennis_e3_desc:0 "Every yard keeps its own patterns, and every apprentice learns which neighbouring yard supposedly cuts them wrong. Dennis has asked the masters to lay their templates together beside a dismantled winch. Agreement comes slowly, with much pointing and swearing. Once the same replacement fits on either quay, the admiral will have something worth sending to other royal ports."
 HSM_AQR_CAM_JFT_dennis_e4:0 "The Crown's Inland Cargo"
 HSM_AQR_CAM_JFT_dennis_e4_desc:0 "A national shipping agreement has carried Dennis's promises farther inland than any of his boats can sail. Wagons must now connect the quays to towns that have never known his captains. The admiral will send road surveyors with the first consignments, making his contribution to the crown visible wherever a broken bridge would otherwise swallow it."
 HSM_AQR_CAM_JFT_dennis_e5:0 "Orders Beyond the Quarterdeck"
 HSM_AQR_CAM_JFT_dennis_e5_desc:0 "The shipwrights' common patterns have found customers among millers and warehouse keepers. A workshop beside the harbour can supply them without interrupting repairs at sea. Dennis likes the thought of inland merchants depending on Pridea, though his craftsmen insist that dependable deliveries will win more contracts than another invitation to drink with the admiral."
 HSM_AQR_CAM_JFT_dennis_economy1:0 "The Shipwrights' Book"
 HSM_AQR_CAM_JFT_dennis_economy1_desc:0 "Pridea's masters have begun putting promised repairs in writing. Even an old shipmate of the admiral must explain what his vessel needs."
 HSM_AQR_CAM_JFT_dennis_economy2:0 "Patterns Shared between Quays"
 HSM_AQR_CAM_JFT_dennis_economy2_desc:0 "Shipwrights exchange patterns and reserve space for work their neighbours cannot finish. The harbour's quarrels now produce usable fittings."
 HSM_AQR_CAM_JFT_dennis_economy3:0 "Pridea's Maritime Undertaking"
 HSM_AQR_CAM_JFT_dennis_economy3_desc:0 "The admiral's harbour links repair slips to inland customers. Its promises travel with craftsmen and road crews, as well as captains."
 HSM_AQR_CAM_JFT_dennis_m1:0 "Muster the Old Boat Crews"
 HSM_AQR_CAM_JFT_dennis_m1_desc:0 "Dennis's old sailors know every landing in the gulf, but years ashore have scattered them among taverns, workshops and fishing boats. The muster will distinguish those ready to serve again from those whose strength now lies in teaching. The admiral needs both, and neither group intends to accept another promise of pay remembered only by its captain."
 HSM_AQR_CAM_JFT_dennis_m2:0 "Fleur's Embarkation Tables"
 HSM_AQR_CAM_JFT_dennis_m2_desc:0 "Fleur Bloom has arranged the landing stores in the order soldiers will need them ashore. The marines complain that her tables leave less room for their favourite equipment. She asks them to carry a wounded comrade through their preferred arrangement. Dennis watches the attempt before telling the boatswains to leave her chalk marks where they are."
 HSM_AQR_CAM_JFT_dennis_m3:0 "Signals across the Gulf"
 HSM_AQR_CAM_JFT_dennis_m3_desc:0 "The shore watchers recognise Dennis's flagship instantly; they are less certain what its lamps are asking them to do. Merchant escorts and landing parties need a language that survives fog and unfamiliar officers. Fleur will bring the signal crews together, while the admiral supplies the impatient captains who must learn to wait for an answer."
 HSM_AQR_CAM_JFT_dennis_m4:0 "Marines on Unfamiliar Ground"
 HSM_AQR_CAM_JFT_dennis_m4_desc:0 "The crown has uses for Pridea's marines beyond guarding Dennis's quays. Inland exercises reveal how quickly a landing column loses its bearings without a visible coast. Marie Anne d'Armond brings her officers back to the map, asking them to explain how a formation built for the shore will hold a village until its support arrives."
 HSM_AQR_CAM_JFT_dennis_m5:0 "Stores for a Royal Relief Column"
 HSM_AQR_CAM_JFT_dennis_m5_desc:0 "The harbour stores contain enough mismatched weapons to embarrass every quartermaster who has signed for them. Fleur wants a reserve that an arriving column can actually use. Dennis orders his captains to open their private caches as well. Old naval loyalties will be measured by what reaches the soldiers, not by how loudly their owners salute."
 HSM_AQR_CAM_JFT_dennis_military1:0 "The Returning Boat Crews"
 HSM_AQR_CAM_JFT_dennis_military1_desc:0 "Veteran sailors are teaching younger crews the routines that kept them together at sea. Familiar voices help a battered watch begin again."
 HSM_AQR_CAM_JFT_dennis_military2:0 "Answer the Shore Signal"
 HSM_AQR_CAM_JFT_dennis_military2_desc:0 "Fleur's tables and shared signals connect the marines to the crews carrying them. Pridea's officers are learning to expect an answer before moving."
 HSM_AQR_CAM_JFT_dennis_military3:0 "The Admiral's Service Squadron"
 HSM_AQR_CAM_JFT_dennis_military3_desc:0 "The harbour's old loyalties sustain a force able to carry and supply royal troops beyond familiar waters. Its reserve chests are finally open."
 HSM_AQR_CAM_JFT_enfants_c1:0 "The Witness beside the Accusation"
 HSM_AQR_CAM_JFT_enfants_c1_desc:0 "A workshop stoppage has entered the security files as sabotage before anyone has inspected the broken drive shaft. The movement's investigators will bring the mechanic's account beside the accuser's report. Les Enfants Terribles still expect enemies to strike at the revolution. They cannot afford a service that confuses an inconvenient witness with the danger it was sent to uncover."
 HSM_AQR_CAM_JFT_enfants_c2:0 "The Children Address Aquileia"
 HSM_AQR_CAM_JFT_enfants_c2_desc:0 "The revolutionary flag now hangs above a platform meant for listeners from every province. Les Enfants Terribles have won the chance to carry their national programme beyond Pridea. Their speakers must explain what survival asks of those who did not attend the old clandestine meetings, and why the burdens of defending Aquileia should be borne together."
 HSM_AQR_CAM_JFT_enfants_e1:0 "Metal for the Forgotten Children"
 HSM_AQR_CAM_JFT_enfants_e1_desc:0 "Les Enfants Terribles have promised that Aquileia will never again wait helplessly for another country's goodwill. Their collectors now face a less stirring task: sorting scrap boilers, broken rails and salvage from the harbour. The movement's workshops need metal they can actually use. Patriotic speeches will accompany the carts, but the foundry workers will decide what enters the furnace."
 HSM_AQR_CAM_JFT_enfants_e2:0 "Turn the Storehouse into a Machine Hall"
 HSM_AQR_CAM_JFT_enfants_e2_desc:0 "A requisitioned storehouse contains machinery collected by different revolutionary cells, much of it still wrapped for journeys that never happened. The movement will bring the scattered mechanics together under its roof. Every working machine will need a named keeper and a real task; possession of a sealed warehouse has too often been mistaken for control of production."
 HSM_AQR_CAM_JFT_enfants_e3:0 "One Gauge for Every Cell"
 HSM_AQR_CAM_JFT_enfants_e3_desc:0 "The underground's secrecy once protected its workshops; now it protects incompatible parts and duplicated work. Les Enfants Terribles will collect their gauges and drawings in the machine hall. The old organisers dislike exposing their methods to rivals, but a revolutionary state cannot arm itself with components whose only guarantee is the loyalty of the cell that made them."
 HSM_AQR_CAM_JFT_enfants_e4:0 "The Instruments Aquileia Must Make"
 HSM_AQR_CAM_JFT_enfants_e4_desc:0 "The national programme's promise of independence has reached a cupboard of imported electrical instruments. Nobody in the machine hall can repair several of them without instructions from abroad. Technicians will begin with the simpler pieces, tracing each connection before attempting a substitute. The movement's suspicion of foreign suppliers must produce patient work if it is to produce anything lasting."
 HSM_AQR_CAM_JFT_enfants_e5:0 "The National Arsenal Order"
 HSM_AQR_CAM_JFT_enfants_e5_desc:0 "Orders from across Aquileia now reach the same machine hall that once sheltered rival cells' unopened crates. A dedicated armaments works will turn its common patterns into a sustained undertaking. Les Enfants Terribles intend this arsenal to embody a revolution able to defend itself, and its supervisors will answer for weapons delivered rather than promises shouted beneath a flag."
 HSM_AQR_CAM_JFT_enfants_economy1:0 "The Movement's Salvage Trains"
 HSM_AQR_CAM_JFT_enfants_economy1_desc:0 "The cells are collecting usable metal for their workshops. Sorting the loads has given their promise of national endurance a material beginning."
 HSM_AQR_CAM_JFT_enfants_economy2:0 "Common Gauges of the Revolution"
 HSM_AQR_CAM_JFT_enfants_economy2_desc:0 "Former underground workshops make parts to shared patterns. Rival organisers can no longer conceal poor work behind the secrecy of their cells."
 HSM_AQR_CAM_JFT_enfants_economy3:0 "Aquileia's Own Machine Hall"
 HSM_AQR_CAM_JFT_enfants_economy3_desc:0 "The national arsenal carries workshop knowledge into sustained production. The movement's demand for independence is taking the form of machines its own mechanics understand."
 HSM_AQR_CAM_JFT_enfants_m1:0 "A Muster beneath the Revolutionary Flag"
 HSM_AQR_CAM_JFT_enfants_m1_desc:0 "The movement's speakers demand that every willing defender of Aquileia step forward. At the muster tables, enthusiasm meets questions about trade, experience and the family left behind. Les Enfants Terribles will turn declarations into assigned duties, giving recruits somewhere to report and veterans someone to teach before another procession ends with everyone returning separately home."
 HSM_AQR_CAM_JFT_enfants_m2:0 "Beyond the Cell's Own Street"
 HSM_AQR_CAM_JFT_enfants_m2_desc:0 "A revolutionary cell knows every door on its own street and almost nothing about the formation advancing beside it. The new service battalions will practise crossing the warehouse district together. Their instructors must preserve initiative while teaching recruits when a sudden dash merely leaves a neighbour exposed. Courage needs a common direction before it can defend a country."
 HSM_AQR_CAM_JFT_enfants_m3:0 "A Plan That Reaches the Last Company"
 HSM_AQR_CAM_JFT_enfants_m3_desc:0 "Berty Albatros has watched an exercise stall because the last company received yesterday's instructions. The organisers blame a careless messenger; he asks why nobody checked what the company understood. The movement's forces will repeat their orders back through the chain, tracing each intended move to the soldiers expected to carry it out before declaring the plan complete."
 HSM_AQR_CAM_JFT_enfants_m4:0 "Eyes above the National Coast"
 HSM_AQR_CAM_JFT_enfants_m4_desc:0 "The revolutionary executive receives coastal sightings faster than it can separate fishing boats from imagined invasions. Pilots and shore observers will compare their reports over the same charts. Les Enfants Terribles distrust the world beyond Aquileia; learning what actually moves over its waters will give that vigilance a task more demanding than repeating rumours from every watch post."
 HSM_AQR_CAM_JFT_enfants_m5:0 "Shells Matched to the Fire Plan"
 HSM_AQR_CAM_JFT_enfants_m5_desc:0 "The arsenal can make shells that the batteries cannot yet use confidently together. Gunners will return damaged fuses and firing notes to the workshops, then test the corrected batches alongside the infantry they support. The movement wants an army whose resolve is unmistakable. Its batteries will express that resolve through deliberate fire, with each promised salvo accounted for."
 HSM_AQR_CAM_JFT_enfants_military1:0 "The Muster Has an Address"
 HSM_AQR_CAM_JFT_enfants_military1_desc:0 "Recruits report to assigned units and veterans prepare their instruction. The movement's military promises have begun to acquire a common timetable."
 HSM_AQR_CAM_JFT_enfants_military2:0 "Orders Returned and Understood"
 HSM_AQR_CAM_JFT_enfants_military2_desc:0 "The service battalions check instructions through the entire formation. Their resolve can now follow a plan understood beyond its author's desk."
 HSM_AQR_CAM_JFT_enfants_military3:0 "The Revolution's Deliberate Defence"
 HSM_AQR_CAM_JFT_enfants_military3_desc:0 "Observed threats, rehearsed orders and tested fire plans turn the movement's vigilance into coordinated defence. Patriotism remains its language; preparation gives that language weight."
 HSM_AQR_CAM_JFT_fja_c1:0 "The Clinic Keeps Its Place"
 HSM_AQR_CAM_JFT_fja_c1_desc:0 "The clinic attendant who once asked the coalition for flour returns with families unable to pay for treatment. Workplace collections have helped, but they stop when a workshop closes. Municipal relief will connect those scattered efforts to the coalition's social commitments, giving the sick somewhere to turn without requiring a party recommendation at the door."
 HSM_AQR_CAM_JFT_fja_c2:0 "The Forest Agreement Faces the Ballot"
 HSM_AQR_CAM_JFT_fja_c2_desc:0 "The partners who once postponed their quarrels in a Vinovian forest now carry them into national electoral meetings. Pridea's FJA delegates remain part of their wider party; the communards have not forgotten why they distrusted it. The coalition must make room for that argument while asking voters to judge a shared record of wages, relief and public works."
 HSM_AQR_CAM_JFT_fja_e1:0 "Wages Written beside the Orders"
 HSM_AQR_CAM_JFT_fja_e1_desc:0 "The coalition receives workshop orders with delivery dates carefully recorded and wage promises left in the margins. Its FJA representatives and communard partners will bring employers and shift delegates to the same table. Reopening production must include an agreement workers can read on payday, otherwise the partnership born in the forest will meet its next argument at a locked gate."
 HSM_AQR_CAM_JFT_fja_e2:0 "Builders Paid by the Municipality"
 HSM_AQR_CAM_JFT_fja_e2_desc:0 "Pridea's building crews move between damaged homes, waiting for householders who cannot pay them. A municipal works yard can gather tools and place repair orders large enough to keep the crews employed. The coalition's partners agree on the work; their argument concerns whose street comes first and how tenants will share in the improvement they helped finance."
 HSM_AQR_CAM_JFT_fja_e3:0 "The Inspector Walks with the Shift"
 HSM_AQR_CAM_JFT_fja_e3_desc:0 "An inspector arrives after the accident and finds that the workers warned about the belt weeks earlier. The coalition will pair technical inspection with accounts from the people who stand beside the machines. Workshop councils need a hearing, while the FJA's legislators need evidence that can become enforceable rules rather than another argument about who loves labour most."
 HSM_AQR_CAM_JFT_fja_e4:0 "The Porters' National Petition"
 HSM_AQR_CAM_JFT_fja_e4_desc:0 "Porters from other provinces have brought the national coalition accounts of the same broken approaches and flooded loading yards. Pridea's works crews can offer methods that their representatives have already had to defend in public. The petition will become a programme of connected repairs, with local testimony following each contract beyond the offices that approved it."
 HSM_AQR_CAM_JFT_fja_e5:0 "An Evening Bench for the Technicians"
 HSM_AQR_CAM_JFT_fja_e5_desc:0 "The inspection reports describe electrical faults that local technicians have been solving separately after their shifts. The coalition will give them a shared bench and time to compare their work. FJA delegates want practical findings for national legislation; communard partners want workers to keep a voice in the experiments. The first demonstration must satisfy both demands."
 HSM_AQR_CAM_JFT_fja_economy1:0 "The Signed Workshop Wage"
 HSM_AQR_CAM_JFT_fja_economy1_desc:0 "Delivery orders now travel with wage agreements negotiated by the coalition's partners. Work can resume on terms the shifts recognise."
 HSM_AQR_CAM_JFT_fja_economy2:0 "Inspection from the Workshop Floor"
 HSM_AQR_CAM_JFT_fja_economy2_desc:0 "Technical inspectors hear the workers who know each dangerous machine. Repairs and safer routines are becoming part of the coalition's industrial practice."
 HSM_AQR_CAM_JFT_fja_economy3:0 "The Coalition's Working Demonstration"
 HSM_AQR_CAM_JFT_fja_economy3_desc:0 "Municipal repairs and shared technical work give the national FJA a programme its Pridean partners can defend from experience. Workplace voices remain part of its delivery."
 HSM_AQR_CAM_JFT_fja_m1:0 "The Reservist's Return Ticket"
 HSM_AQR_CAM_JFT_fja_m1_desc:0 "Volunteers ask whether joining the reserve means losing the workshop places they have only just recovered. The coalition will negotiate service arrangements with employers and workers' delegates before opening the enrolment desks. A citizen army needs people who can leave their families without fearing that the uniform will cost them their livelihood when they return."
 HSM_AQR_CAM_JFT_fja_m2:0 "Militia Rifles in Public Stores"
 HSM_AQR_CAM_JFT_fja_m2_desc:0 "The coalition's wartime partners have brought different weapons and different memories to the reserve depots. Their armourers will repair the serviceable rifles and record which stores hold them. FJA organisers need a force parliament can supply; communard delegates need assurance that handing over a weapon does not hand every future argument to whoever commands the depot gate."
 HSM_AQR_CAM_JFT_fja_m3:0 "Levé's Ambulance Route"
 HSM_AQR_CAM_JFT_fja_m3_desc:0 "Pain Levé has traced the reserve's exercise route to a bridge too narrow for the ambulance carts. He asks the civilian supply committee to walk it with his instructors. The coalition's military settlement will be judged by these meetings: whether an officer can obtain practical help, and whether civilians can question his plan before the first casualty needs it."
 HSM_AQR_CAM_JFT_fja_m4:0 "Training That Survives an Election"
 HSM_AQR_CAM_JFT_fja_m4_desc:0 "Reserve officers from several provinces ask whether a change of parliamentary majority will discard their training arrangements. The coalition will put common instruction before the elected representatives, allowing objections without turning each company into a party club. Soldiers must learn to hold a position together even when the citizens who sent them disagree over the next ministry."
 HSM_AQR_CAM_JFT_fja_m5:0 "An Arsenal in the Published Budget"
 HSM_AQR_CAM_JFT_fja_m5_desc:0 "The national reserve needs a dependable source of weapons, and the proposed arsenal competes with civilian claims on the same builders. The coalition will defend its order before the elected assembly and accept inspection of the finished works. Labour representatives want safe shifts; officers want reliable deliveries. Both must be able to explain the expense to the households paying it."
 HSM_AQR_CAM_JFT_fja_military1:0 "Service with a Place to Return"
 HSM_AQR_CAM_JFT_fja_military1_desc:0 "Reserve arrangements protect a recruit's connection to civilian employment. Instructors can plan training for volunteers who know what their absence means."
 HSM_AQR_CAM_JFT_fja_military2:0 "The Civilian Committee's Route Map"
 HSM_AQR_CAM_JFT_fja_military2_desc:0 "Officers and civilian suppliers have walked the reserve routes together. Their preparations connect training to transport, medical care and clear responsibilities."
 HSM_AQR_CAM_JFT_fja_military3:0 "A Reserve Answerable to the Assembly"
 HSM_AQR_CAM_JFT_fja_military3_desc:0 "Common training and inspected supply contracts sustain a national reserve through ordinary parliamentary disputes. Its officers can serve without deciding who deserves to govern."
 HSM_AQR_CAM_JRR_absolutist_c1:0 "Widows at the Audience Door"
 HSM_AQR_CAM_JRR_absolutist_c1_desc:0 "The families of the fallen have learned the route between an estate office and a military paymaster, with neither accepting the final responsibility. Jeanne sets aside an audience for their claims and binds relief to the obligations promised by her supporters. The court's protection acquires a difficult audience: petitioners who can remember exactly what was pledged."
 HSM_AQR_CAM_JRR_absolutist_c2:0 "The Marquise before the Crown"
 HSM_AQR_CAM_JRR_absolutist_c2_desc:0 "Aquileia's national proclamation gives Jeanne a place among the crown's supporters. Her nobles would like the occasion to erase every provincial grievance beneath a single splendid oath. She will bring their obligations with her. Loyalty is a service she offers to the legitimate sovereign, carrying Westkeep's standing into the royal settlement without mistaking her march for a hereditary national throne."
 HSM_AQR_CAM_JRR_absolutist_e1:0 "The Estates Must Deliver"
 HSM_AQR_CAM_JRR_absolutist_e1_desc:0 "The nobles who sustained Jeanne's cause offer pledges of timber, stone and wagons. Her steward has begun accepting the pledges as if the materials were already outside. Jeanne sends the papers back. Each estate will name the yard from which its contribution can actually be collected; noble service must leave something more substantial than a seal."
 HSM_AQR_CAM_JRR_absolutist_e2:0 "Bonds for the Estate Roads"
 HSM_AQR_CAM_JRR_absolutist_e2_desc:0 "An estate road reaches the manor in excellent condition and becomes a ditch before the tenant villages. Jeanne's surveyors will require the landowner's bond to cover the entire route used by his produce. The court can enforce that obligation without surrendering its authority to the garrisons that once decided which complaints deserved an escort."
 HSM_AQR_CAM_JRR_absolutist_e3:0 "Patterns Kept under the Seal"
 HSM_AQR_CAM_JRR_absolutist_e3_desc:0 "Three estate workshops have supplied three incompatible fittings for the same bridge. Their masters each insist that old custom vindicates their work. Jeanne's purchasing office will keep approved patterns and lend them to every contractor serving the court. Reputation may win a craftsgriffon an audience, but the finished piece must still fit the engineer's drawing."
 HSM_AQR_CAM_JRR_absolutist_e4:0 "Westkeep's Credit at Court"
 HSM_AQR_CAM_JRR_absolutist_e4_desc:0 "With Aquileia's national settlement proclaimed, Jeanne carries the march's contracts into royal negotiations. She seeks guarantees for productive work, not a competing crown. The creditors expect her noble supporters to honour the same delivery terms they accepted at home. A provincial reputation can purchase wider confidence, provided its owners remain answerable for the signatures beneath it."
 HSM_AQR_CAM_JRR_absolutist_e5:0 "A Works on the Royal Road"
 HSM_AQR_CAM_JRR_absolutist_e5_desc:0 "The court's orders now reach farther than the manor workshops can serve. Jeanne sponsors a permanent works beside the road that carries Westkeep's deliveries into Aquileia. Its founders bring estate capital and royal contracts; its foregriffons bring the patterns that survived inspection. The doors will bear the marquise's patronage, and the invoices will bear her obligations."
 HSM_AQR_CAM_JRR_absolutist_economy1:0 "Pledged Estate Deliveries"
 HSM_AQR_CAM_JRR_absolutist_economy1_desc:0 "Jeanne has made noble contributions collectible. The road crews can finally name the estate responsible for the stone they are awaiting."
 HSM_AQR_CAM_JRR_absolutist_economy2:0 "The Court's Approved Patterns"
 HSM_AQR_CAM_JRR_absolutist_economy2_desc:0 "Common patterns and enforceable bonds tie the estate workshops to Jeanne's purchasing office. Patronage now comes with an inspection."
 HSM_AQR_CAM_JRR_absolutist_economy3:0 "Royal Contracts through Westkeep"
 HSM_AQR_CAM_JRR_absolutist_economy3_desc:0 "Estate capital, inspected workmanship and obligations recognised at court sustain Westkeep's works. Jeanne's royal service has acquired workshops and delivery dates."
 HSM_AQR_CAM_JRR_absolutist_m1:0 "Service beyond the Household"
 HSM_AQR_CAM_JRR_absolutist_m1_desc:0 "The loyal officers arrive with companies whose first allegiance remains to the households that equipped them. Jeanne requires a roll of service owed to the march and, through it, the crown. An estate may recommend a recruit, but cannot recall him whenever its owner quarrels with the officer responsible for a neighbouring stretch of road."
 HSM_AQR_CAM_JRR_absolutist_m2:0 "The Court Armourer's Receipt"
 HSM_AQR_CAM_JRR_absolutist_m2_desc:0 "A noble donor presents a handsome rifle case and requests a captaincy for his son. Jeanne asks the armourer to examine the weapons before anyone discusses commissions. Court patronage will supply usable arms to the companies on duty. Gifts can be acknowledged in the audience book without allowing their donors to choose who commands the recipients."
 HSM_AQR_CAM_JRR_absolutist_m3:0 "Relief at the Last Depot"
 HSM_AQR_CAM_JRR_absolutist_m3_desc:0 "A convoy can cross half the march before discovering that the next estate's escort considers its duty complete. Jeanne orders the loyal officers to practise relief at the depots themselves. The arriving commander must see his replacement accept the loads. Household honour will be measured by deliveries completed, rather than by how promptly a company marches home."
 HSM_AQR_CAM_JRR_absolutist_m4:0 "Posts in the Crown's Line"
 HSM_AQR_CAM_JRR_absolutist_m4_desc:0 "Westkeep's service obligations now meet those of neighbouring provinces. A defended crossing means little if the next post expects its relief from somewhere else. Jeanne sends officers with written instructions to agree stores, signals and responsibilities with the royal command. The march will hold its assigned ground without turning every dispute over provisions into a contest of family precedence."
 HSM_AQR_CAM_JRR_absolutist_m5:0 "The Crown's Westkeep Arsenal"
 HSM_AQR_CAM_JRR_absolutist_m5_desc:0 "The old household armouries cannot sustain companies serving throughout Aquileia. Jeanne brings their repair contracts into a permanent arsenal, where court inspectors follow each order from raw stock to finished weapon. The nobles retain the distinction of supplying the crown. They must accept that the weapons leave according to service needs, even when their own retainers are waiting."
 HSM_AQR_CAM_JRR_absolutist_military1:0 "The March's Service Roll"
 HSM_AQR_CAM_JRR_absolutist_military1_desc:0 "The loyal companies owe service beyond their patrons' gates. Named duties make their stores easier to assemble and their movements harder to evade."
 HSM_AQR_CAM_JRR_absolutist_military2:0 "Reliefs under the Marquise's Seal"
 HSM_AQR_CAM_JRR_absolutist_military2_desc:0 "The companies have learned to hand over a depot before going home. Supplies and defended crossings no longer depend on an argument between households."
 HSM_AQR_CAM_JRR_absolutist_military3:0 "Westkeep in the Royal Line"
 HSM_AQR_CAM_JRR_absolutist_military3_desc:0 "The crown can rely on Westkeep's assigned posts, repaired weapons and scheduled reliefs. Noble service has become a duty that neighbouring units can plan around."
 HSM_AQR_CAM_JRR_coalition_c1:0 "Read the Compact after Work"
 HSM_AQR_CAM_JRR_coalition_c1_desc:0 "The coalition's printed pledge hangs above a workshop door, beyond the understanding of several workers it claims to protect. Republican volunteers and parish teachers offer evening readings with room for questions. Jeanne lends the assembly rooms. Learning to read the promise also means learning to recognise the clause a magistrate has conveniently omitted when explaining it."
 HSM_AQR_CAM_JRR_coalition_c2:0 "Republicans in the Royal Delegation"
 HSM_AQR_CAM_JRR_coalition_c2_desc:0 "Jeanne's municipal allies enter national politics beside the marquise without pretending that they have become monarchists. Their compact binds them to a royal settlement whose promises they intend to enforce. The delegation will carry dissenting signatures alongside loyal ones. Cooperation must survive an honest introduction before it can claim to offer Aquileia anything beyond another temporary bargain against soldiers."
 HSM_AQR_CAM_JRR_coalition_e1:0 "A Tender in the Town Square"
 HSM_AQR_CAM_JRR_coalition_e1_desc:0 "The court's old suppliers know which antechamber to visit. The towns supporting Jeanne's coalition want a place where an unfamiliar workshop can offer its work without a patron's introduction. Contracts will be posted beside the market notices, with samples examined before witnesses. The marquise keeps her signature, but must explain why it falls beneath one offer rather than another."
 HSM_AQR_CAM_JRR_coalition_e2:0 "The Requisition Bench"
 HSM_AQR_CAM_JRR_coalition_e2_desc:0 "A workshop cannot accept a civilian order while the garrison still claims its lathe. Municipal lawyers will hear the disputed receipts beside representatives of the court and the suppliers. Jeanne's coalition has promised a life beyond military permission. Settling who may use a machine tomorrow will test that promise more severely than another proclamation on the printer's wall."
 HSM_AQR_CAM_JRR_coalition_e3:0 "Gauges Shared between Workshops"
 HSM_AQR_CAM_JRR_coalition_e3_desc:0 "Small suppliers have won their first contracts and discovered that their neighbours measure the same fitting differently. The coalition's town delegates propose lending gauges and keeping a shared bench for disputed work. Skilled masters can teach the common practice without surrendering their shops. Jeanne's purchasing clerks will accept the agreed measurements even when an older court supplier objects."
 HSM_AQR_CAM_JRR_coalition_e4:0 "A Contract the Other Towns Can Sign"
 HSM_AQR_CAM_JRR_coalition_e4_desc:0 "The national settlement has opened markets beyond Westkeep, but its towns cannot live by privileges negotiated for one march. Jeanne's coalition brings its tender rules and appeals procedure to other royal municipalities. They will join through contracts their own representatives can defend. The first difficult customer may do more for the agreement than a room of courteous admirers."
 HSM_AQR_CAM_JRR_coalition_e5:0 "The Workshops' Common Yard"
 HSM_AQR_CAM_JRR_coalition_e5_desc:0 "Several workshops can build a machine together, yet none can afford the heavy equipment needed to finish it. The coalition arranges a common industrial yard financed by participating towns and private subscriptions. Jeanne opens the premises beside the municipal delegates. Orders will be divided by the published contract, leaving room for the small suppliers who first demanded it."
 HSM_AQR_CAM_JRR_coalition_economy1:0 "Tenders beyond the Antechamber"
 HSM_AQR_CAM_JRR_coalition_economy1_desc:0 "Published offers let Westkeep's smaller workshops compete for the coalition's orders. Work reaches benches that court patronage previously overlooked."
 HSM_AQR_CAM_JRR_coalition_economy2:0 "The Towns' Common Measures"
 HSM_AQR_CAM_JRR_coalition_economy2_desc:0 "Shared gauges and civilian settlement of disputed receipts help independent workshops keep their promises to one another."
 HSM_AQR_CAM_JRR_coalition_economy3:0 "The Municipal Suppliers' Compact"
 HSM_AQR_CAM_JRR_coalition_economy3_desc:0 "The common yard gives small contractors access to heavy equipment, while published terms let their cooperation survive disagreements between towns."
 HSM_AQR_CAM_JRR_coalition_m1:0 "A Muster with a Return Date"
 HSM_AQR_CAM_JRR_coalition_m1_desc:0 "Municipal delegates arrive with lists of willing reservists and a question the recruiting officer has never liked: when will they return? Jeanne's coalition will recognise service terms that towns and commanders can both enforce. The volunteers owe real training and real duty. Their employers and families deserve something firmer than an assurance that the garrison will remember them."
 HSM_AQR_CAM_JRR_coalition_m2:0 "Arms against a Civilian Receipt"
 HSM_AQR_CAM_JRR_coalition_m2_desc:0 "The town armourer will supply the reserve, but refuses another requisition signed by an officer who cannot be found afterwards. Jeanne orders the purchasing office to acknowledge every delivery and name the unit receiving it. Civilians can equip soldiers without surrendering their right to payment. The reserve's first discipline begins with the promises made to its suppliers."
 HSM_AQR_CAM_JRR_coalition_m3:0 "Drill between Market Days"
 HSM_AQR_CAM_JRR_coalition_m3_desc:0 "The reserve cannot learn to move as a unit if every workshop releases its apprentices on a different afternoon. Town delegates and instructors will agree training gatherings around local work, then hold everyone to the arrangement. A shorter, properly attended exercise can teach more than a magnificent parade whose absent ranks are explained away as unavoidable civilian inconvenience."
 HSM_AQR_CAM_JRR_coalition_m4:0 "The Service Warrant Travels"
 HSM_AQR_CAM_JRR_coalition_m4_desc:0 "The royal command now requests Westkeep's reservists for duties outside their home towns. Their agreed service cannot disappear at the provincial boundary. Jeanne's officers and municipal representatives will prepare arrangements for relief, medical care and messages home. The coalition can answer a national call while making clear who remains responsible for the volunteers after their train departs."
 HSM_AQR_CAM_JRR_coalition_m5:0 "An Arsenal with Open Accounts"
 HSM_AQR_CAM_JRR_coalition_m5_desc:0 "The coalition's reserve needs steady deliveries that scattered repair shops cannot promise. Municipal subscribers and the court will finance an arsenal whose accounts remain open to the representatives who approved the order. Its managers must meet military specifications and civilian payment dates. Jeanne expects reliable weapons; her partners expect to see how the promises were paid for."
 HSM_AQR_CAM_JRR_coalition_military1:0 "A Place Kept for the Reservist"
 HSM_AQR_CAM_JRR_coalition_military1_desc:0 "Agreed service terms give volunteers a reason to return to their units without fearing that every summons will cost them their civilian livelihood."
 HSM_AQR_CAM_JRR_coalition_military2:0 "The Towns Keep Their Training Days"
 HSM_AQR_CAM_JRR_coalition_military2_desc:0 "Employers and instructors honour the same calendar. The reserve can practise together and recover between duties without constantly bargaining for attendance."
 HSM_AQR_CAM_JRR_coalition_military3:0 "The Coalition's Accountable Reserve"
 HSM_AQR_CAM_JRR_coalition_military3_desc:0 "Reliable training, civilian accounts and arrangements for relief allow the towns' volunteers to serve throughout Aquileia while retaining the compact that brought them together."
 HSM_AQR_CAM_JRR_colette_c1:0 "Read without the Cipher"
 HSM_AQR_CAM_JRR_colette_c1_desc:0 "Some former messengers could recognise a coded sign on a poster without reading the ordinary notice around it. Workers' groups offer lessons using the orders now governing their workshops. Colette allows the rooms to open, knowing that better readers will bring more precise objections. The civilians who helped carry her revolution intend to understand the instructions it leaves behind."
 HSM_AQR_CAM_JRR_colette_c2:0 "Delegates without a Secret Message"
 HSM_AQR_CAM_JRR_colette_c2_desc:0 "Colette sends Westkeep's representatives into the national republican movement through doors the MPA once approached in secret. Her officers expect a disciplined delegation; the civilian allies intend to speak in their own names. She must carry their partnership into wider politics without claiming that her local victory appoints Aquileia's leader. The old network can arrange introductions, but cannot write everyone's answer."
 HSM_AQR_CAM_JRR_colette_e1:0 "The Workshops behind the Posters"
 HSM_AQR_CAM_JRR_colette_e1_desc:0 "Colette's recruiting posters once carried messages that only the underground could read. The workshops behind those messages now receive ordinary orders, stamped by officers impatient for deliveries. She will bring their foregriffons into the scheduling room. The military network can direct production, but it must discover what the benches can actually make before announcing another indispensable demand."
 HSM_AQR_CAM_JRR_colette_e2:0 "The Shift after the Bugle"
 HSM_AQR_CAM_JRR_colette_e2_desc:0 "A garrison order tells the workshop to continue until the work is finished. The workers' delegate asks which work, and who will replace the exhausted night shift. Colette requires a schedule that names both deliveries and reliefs. Command retains its urgency, but an officer who conceals impossible hours will have to explain the empty benches himself."
 HSM_AQR_CAM_JRR_colette_e3:0 "Sort the Revolution's Scrap"
 HSM_AQR_CAM_JRR_colette_e3_desc:0 "Captured stores have supplied the workshops with metal of uncertain origin and uncertain quality. Colette's engineers will separate useful stock from material that merely looks impressive on a requisition form. Workers who repaired weapons in hiding know which substitutions survive use. Their knowledge belongs at the testing bench, even when it contradicts a quartermaster's report of abundant supplies."
 HSM_AQR_CAM_JRR_colette_e4:0 "The Republican Repair Circuit"
 HSM_AQR_CAM_JRR_colette_e4_desc:0 "The MPA connections Colette helped build with Rodier now carry lists of damaged machinery between provinces. Westkeep can offer repair teams and tested spares to the national republican effort. She will send workshop delegates alongside the officers arranging deliveries. Their task is to negotiate work that can be completed, before military enthusiasm promises the same lathe to three distant customers."
 HSM_AQR_CAM_JRR_colette_e5:0 "From Salvage Yard to Machine Works"
 HSM_AQR_CAM_JRR_colette_e5_desc:0 "Repair teams have kept the machinery moving, but salvaged fittings cannot meet every new order. Colette assembles a permanent machine works around the best surviving benches and the specialists who kept them alive. Military purchasers bring national contracts; civilian delegates bring the agreed working arrangements. The factory's first test will be whether either side can keep its promises without the other's silence."
 HSM_AQR_CAM_JRR_colette_economy1:0 "Orders Heard at the Bench"
 HSM_AQR_CAM_JRR_colette_economy1_desc:0 "Colette's officers now hear the foregriffons before issuing workshop schedules. Urgent demands have begun to correspond to work that can actually be done."
 HSM_AQR_CAM_JRR_colette_economy2:0 "Tested Salvage, Agreed Shifts"
 HSM_AQR_CAM_JRR_colette_economy2_desc:0 "Testing recovered material and naming relief crews keep the revolutionary workshops working through shortages without hiding every difficulty in a quartermaster's report."
 HSM_AQR_CAM_JRR_colette_economy3:0 "Westkeep's Republican Machine Works"
 HSM_AQR_CAM_JRR_colette_economy3_desc:0 "The repair network has become a durable manufacturing effort. Military orders and organised civilian labour meet over tested materials, delivery dates and contested working hours."
 HSM_AQR_CAM_JRR_colette_m1:0 "Through the Garrison's Front Gate"
 HSM_AQR_CAM_JRR_colette_m1_desc:0 "The garrison captains who once received secret approaches from guerrillas now face volunteers demanding recognised service. Colette will admit experienced fighters through the front gate and assess what they can teach regular units. Their clandestine courage does not settle questions of command. It does make them worth hearing before a career officer dismisses everyone without an academy certificate."
 HSM_AQR_CAM_JRR_colette_m2:0 "The Caches Come into Daylight"
 HSM_AQR_CAM_JRR_colette_m2_desc:0 "Weapons hidden for the uprising still lie behind false walls while neighbouring companies report shortages. Former couriers know the addresses, but distrust demands made without acknowledgement. Colette orders the receiving officers to record each surrender and return the signed receipt. The revolution's arsenals will enter regular service through the people who guarded them, rather than another rumour of confiscation."
 HSM_AQR_CAM_JRR_colette_m3:0 "An Ambush Becomes an Order"
 HSM_AQR_CAM_JRR_colette_m3_desc:0 "A former guerrilla explains a successful ambush with gestures the staff cannot put on its map. The officers answer with symbols his scouts have never learned. Colette brings both groups to the ground they are describing. They must turn practical knowledge into orders another unit can follow, retaining the scouts' initiative without allowing every patrol to fight its own private battle."
 HSM_AQR_CAM_JRR_colette_m4:0 "Reports That Can Change the Plan"
 HSM_AQR_CAM_JRR_colette_m4_desc:0 "Westkeep's officers now work with republican formations beyond the march. A scout's warning must travel through their staffs without becoming a polite note attached to an unchanged order. Colette establishes exchanges between runners, signals specialists and planners. Her insistence on a common command will mean little if that command cannot hear what its forward units have already discovered."
 HSM_AQR_CAM_JRR_colette_m5:0 "An Arsenal for the Republican Line"
 HSM_AQR_CAM_JRR_colette_m5_desc:0 "The republic's units need weapons whose parts can be exchanged without a workshop argument. Colette brings military repair contracts into an arsenal using the patterns accepted by the receiving commands. Former clandestine armourers will work beside army inspectors. Their shared task is to send dependable equipment into national service, with civilian representatives able to question the hours demanded to make it."
 HSM_AQR_CAM_JRR_colette_military1:0 "Experience through the Garrison Gate"
 HSM_AQR_CAM_JRR_colette_military1_desc:0 "Experienced irregulars help the officers prepare practical orders. Colette's common command has gained knowledge that military schooling alone could not supply."
 HSM_AQR_CAM_JRR_colette_military2:0 "Scouts on the Staff Map"
 HSM_AQR_CAM_JRR_colette_military2_desc:0 "Scouts and regular officers share the language of orders. Ground knowledge can reach the planning table without losing its meaning along the way."
 HSM_AQR_CAM_JRR_colette_military3:0 "A Command That Hears the Patrol"
 HSM_AQR_CAM_JRR_colette_military3_desc:0 "Westkeep's republican formations connect reconnaissance, orders and dependable supply. A common command can change its plan when the patrol brings better evidence."
 HSM_AQR_CAM_VIN_abc_c1:0 "Reading after the Factory Bell"
 HSM_AQR_CAM_VIN_abc_c1_desc:0 "The apprentice can recognise every tool in the workshop but cannot read the agreement his cooperative has asked him to approve. ABC volunteers arrange lessons around the shifts, using wages, letters and newspapers alongside primers. A movement promising to abolish inherited privilege must make its own meetings accessible. Nobody should need a student's whispered explanation to understand a vote."
 HSM_AQR_CAM_VIN_abc_c2:0 "A Republic beyond the Café"
 HSM_AQR_CAM_VIN_abc_c2_desc:0 "ABC's national gathering brings people who have never shared its favourite café or its founders' private jokes. Delegates ask for childcare during meetings and seats for workers on rotating shifts. The movement has offered Aquileia a social republic. Its first test is whether the room where that republic speaks can accommodate citizens whose lives do not resemble those of its organisers."
 HSM_AQR_CAM_VIN_abc_e1:0 "The Workshop Holds the Keys"
 HSM_AQR_CAM_VIN_abc_e1_desc:0 "The owner has left, but the workers still know which bearing overheats and which customer owes for last winter's repairs. ABC organisers propose putting the workshop under its crew's elected management. The first meeting must settle who purchases materials and who answers for a spoiled order. Taking down the old sign is easier than keeping the doors open tomorrow."
 HSM_AQR_CAM_VIN_abc_e2:0 "Wages from the Cooperative Till"
 HSM_AQR_CAM_VIN_abc_e2_desc:0 "A student proudly presents the cooperative's first accounts until a machinist asks where the unpaid apprentices appear. They have shared every emergency without sharing a wage. The ABC committee will bring the apprentices into the discussion of earnings and reserves. Equality must survive an evening when paying someone fairly means postponing a purchase that everyone wants."
 HSM_AQR_CAM_VIN_abc_e3:0 "A Lathe Bought Together"
 HSM_AQR_CAM_VIN_abc_e3_desc:0 "Several small cooperatives can afford a modern lathe only by buying it together. Each wants it installed in its own workshop, close to familiar hands. ABC delegates bring the crews around the same table to arrange shifts and upkeep. Their argument for social ownership will acquire a working spindle, or fail over whose doorway the machine should enter."
 HSM_AQR_CAM_VIN_abc_e4:0 "Delegates from the Shop Floor"
 HSM_AQR_CAM_VIN_abc_e4_desc:0 "The national economic conference has reserved seats for the cooperatives, but the ABC founders cannot fill them all with university friends. Workshop crews will send delegates carrying their own proposals for shared purchasing and credit. Vinovia's example must become something others can revise. The students will have to defend their calculations before workers who already know what a failed delivery costs."
 HSM_AQR_CAM_VIN_abc_e5:0 "The Laboratory after the Shift"
 HSM_AQR_CAM_VIN_abc_e5_desc:0 "The cooperative's evening visitors bring cracked castings and oilstained notebooks into a university laboratory. Their questions have survived several dismissive answers from scholars who never watched the machines work. ABC organisers arrange a permanent place for these investigations. Knowledge made with working people can travel beyond Vinovia without arriving as another lecture on what their lives ought to be."
 HSM_AQR_CAM_VIN_abc_economy1:0 "Keys in the Workers' Keeping"
 HSM_AQR_CAM_VIN_abc_economy1_desc:0 "Elected workshop crews take responsibility for orders once left to absent owners."
 HSM_AQR_CAM_VIN_abc_economy2:0 "The Cooperative Machine Room"
 HSM_AQR_CAM_VIN_abc_economy2_desc:0 "Shared machinery draws neighbouring crews into practical cooperation over maintenance and production."
 HSM_AQR_CAM_VIN_abc_economy3:0 "Knowledge from the Shop Floor"
 HSM_AQR_CAM_VIN_abc_economy3_desc:0 "Workers bring the laboratory their stubborn production problems and carry tested answers back to the machines."
 HSM_AQR_CAM_VIN_abc_m1:0 "The Barricade Becomes a Company"
 HSM_AQR_CAM_VIN_abc_m1_desc:0 "The ABC volunteers remember who stood beside them at the barricade, but their company rolls still contain café nicknames and abandoned addresses. Guillaume Boucarle asks the organisers to assemble the survivors by actual duties. Comradeship will remain precious in the new army. It must also tell a replacement where to report when the familiar face beside him is missing."
 HSM_AQR_CAM_VIN_abc_m2:0 "Lessons beside the Sand Table"
 HSM_AQR_CAM_VIN_abc_m2_desc:0 "An ABC lecturer explains a splendid advance across the sand table until a veteran asks where the wounded go. Boucarle makes the class repeat the exercise with stretcher parties and tired messengers. Those who learned courage in the streets must acquire the patience of infantry work. The best lesson may come from someone who never finished a school term."
 HSM_AQR_CAM_VIN_abc_m3:0 "Cadres from Every Shift"
 HSM_AQR_CAM_VIN_abc_m3_desc:0 "Evening training has filled with machinists, porters and students who cannot leave work for a lengthy residential course. Jean-Baptiste Jules Gélinotte-des-Bois brings instructors to examine what they can learn locally. The ABC council wants opportunity without inherited privilege. It must now give its candidates enough practice to make an unfamiliar platoon trust them when an exercise begins to unravel."
 HSM_AQR_CAM_VIN_abc_m4:0 "The Arsenal's Elected Committee"
 HSM_AQR_CAM_VIN_abc_m4_desc:0 "A national arms order reaches a cooperative whose members once repaired barricade weapons in borrowed rooms. They elect a committee to oversee the expanded arsenal and ask Boucarle's inspectors to explain rejected pieces before the whole shift. Workers' control cannot make a defective breech safe. It can ensure that the maker hears the soldier's complaint without an owner speaking for both."
 HSM_AQR_CAM_VIN_abc_m5:0 "The Citizen Instructor Returns"
 HSM_AQR_CAM_VIN_abc_m5_desc:0 "The first workers trained as instructors return to their districts carrying battered notebooks. The ABC council asks them to teach replacements beside the veterans who once doubted their chances. A citizen army will endure through habits passed between ordinary households. Its officers must keep learning how to lead people who can meet them afterwards at a cooperative meeting."
 HSM_AQR_CAM_VIN_abc_military1:0 "Comrades on the Company Roll"
 HSM_AQR_CAM_VIN_abc_military1_desc:0 "Barricade volunteers learn the routines that let newcomers take their place in the ranks."
 HSM_AQR_CAM_VIN_abc_military2:0 "The Evening Cadre School"
 HSM_AQR_CAM_VIN_abc_military2_desc:0 "Workers and students learn to lead through exercises fitted around the lives of citizen volunteers."
 HSM_AQR_CAM_VIN_abc_military3:0 "A Citizen Army That Teaches"
 HSM_AQR_CAM_VIN_abc_military3_desc:0 "Experienced volunteers return as instructors, turning shared service into knowledge their neighbours can use."
 HSM_AQR_CAM_VIN_chevaliers_c1:0 "The Apprentices Read Their Inheritance"
 HSM_AQR_CAM_VIN_chevaliers_c1_desc:0 "A guild's oldest recipe book is celebrated every year and read by almost nobody outside its senior families. The Chevaliers ask local teachers to prepare readable copies in the language apprentices use at home. Preserving Vinovian culture cannot depend on keeping its words inaccessible. The new readers may find questions in the margins that their patrons have never thought to ask."
 HSM_AQR_CAM_VIN_chevaliers_c2:0 "The Other Province's Feast"
 HSM_AQR_CAM_VIN_chevaliers_c2_desc:0 "The Chevaliers' national partners request protection for a civic feast that looks nothing like Vinovia's ceremonies. Some patrons fear that recognising every custom will leave the federation without a shared character. Their own charter supplies the answer they must now defend. The same guarantee that keeps Vinovia's songs alive must leave room for neighbours whose voices sound entirely different."
 HSM_AQR_CAM_VIN_chevaliers_e1:0 "The Benefactors' Common Purse"
 HSM_AQR_CAM_VIN_chevaliers_e1_desc:0 "The Chevaliers' patrons have each endowed a kitchen or shelter, sometimes on opposite sides of the same street. Their stewards will compare what those gifts actually sustain. A common purse can preserve each foundation's history while moving supplies where the queues are longest. Landed generosity will have to accept questions from the people who cook with it every morning."
 HSM_AQR_CAM_VIN_chevaliers_e2:0 "The Fair in Our Own Tongue"
 HSM_AQR_CAM_VIN_chevaliers_e2_desc:0 "Vinovian craftsmen want a fair where their work need not borrow a fashionable Aquileian name to find a buyer. The Chevaliers offer grounds and patronage, while stallholders ask for passable approaches and honest measures. Pride will bring the opening procession. Repeat custom will depend on whether an unfamiliar merchant receives the same welcome as a neighbouring estate's steward."
 HSM_AQR_CAM_VIN_chevaliers_e3:0 "A Charter for the Craft Hall"
 HSM_AQR_CAM_VIN_chevaliers_e3_desc:0 "An unused estate building could shelter several workshops, but its owner expects the oldest guild families to choose every tenant. The Chevaliers propose a craft charter that protects local methods while admitting apprentices with no inherited place. Their patrons will lend the hall its roof. The craftsmen must decide how to make tradition a livelihood that another generation can enter."
 HSM_AQR_CAM_VIN_chevaliers_e4:0 "Fairs That Recognise Each Other"
 HSM_AQR_CAM_VIN_chevaliers_e4_desc:0 "The national federation brings invitations to fairs whose customs the Vinovian patrons do not know. The Chevaliers send craftsmen to compare measures, guarantees and apprenticeship certificates with their neighbours. Common trade can respect local workmanship if recognition travels both ways. A mark accepted abroad obliges our own stallholders to accept an unfamiliar mark at home."
 HSM_AQR_CAM_VIN_chevaliers_e5:0 "Endowments beyond Familiar Streets"
 HSM_AQR_CAM_VIN_chevaliers_e5_desc:0 "A provincial foundation asks Vinovia's patrons to support a workshop serving displaced families. Its methods differ from the craft hall's, and its beneficiaries cannot recite the Chevaliers' favourite verses. The federation gives their request a hearing. Extending the endowment will show whether local institutions deserve protection because they are Vinovian, or because communities everywhere need places they can call their own."
 HSM_AQR_CAM_VIN_chevaliers_economy1:0 "The Patrons' Shared Table"
 HSM_AQR_CAM_VIN_chevaliers_economy1_desc:0 "Charitable foundations coordinate their purchases while keeping the local trust on which their work depends."
 HSM_AQR_CAM_VIN_chevaliers_economy2:0 "The Craft Hall Covenant"
 HSM_AQR_CAM_VIN_chevaliers_economy2_desc:0 "Patrons provide premises while craftsmen bind their shared workshops to workable agreements."
 HSM_AQR_CAM_VIN_chevaliers_economy3:0 "Reciprocal Provincial Credit"
 HSM_AQR_CAM_VIN_chevaliers_economy3_desc:0 "Recognised guarantees let provincial craft institutions cooperate without abandoning the methods their communities value."
 HSM_AQR_CAM_VIN_chevaliers_m1:0 "Open the Family Armouries"
 HSM_AQR_CAM_VIN_chevaliers_m1_desc:0 "The Chevaliers' households preserve weapons carried by grandparents alongside rifles bought for the recent struggle. Local guards need the latter, whatever sentiment surrounds the former. The patrons will open their armouries for an inventory conducted with serving soldiers. A martial inheritance becomes useful when its owners can distinguish an honoured keepsake from a weapon another griffon can safely carry."
 HSM_AQR_CAM_VIN_chevaliers_m2:0 "The Knight Learns to Take Cover"
 HSM_AQR_CAM_VIN_chevaliers_m2_desc:0 "An instructor praises the courage of the Chevaliers' volunteers, then asks them to cross the exercise ground under observation. Their bright company pennant is spotted before the first patrol moves. The guard will keep its ceremonies and practise concealment away from the reviewing stand. Defending Vinovia's martial tradition requires its heirs to survive long enough to pass it on."
 HSM_AQR_CAM_VIN_chevaliers_m3:0 "Granaries on the Guard's Road"
 HSM_AQR_CAM_VIN_chevaliers_m3_desc:0 "The guard captains have marked supply stops at estates whose owners attend the same charitable dinners. Isabelle de Pie-Grièche asks what happens when a column takes another road. The Chevaliers will arrange depots with willing towns and villages outside their familiar circle. A local defence must know the whole locality, including households that have never received a patron's invitation."
 HSM_AQR_CAM_VIN_chevaliers_m4:0 "Common Parts, Provincial Colours"
 HSM_AQR_CAM_VIN_chevaliers_m4_desc:0 "Federated guards bring rifles bearing different makers' marks and discover that their spare parts will not fit. The Chevaliers sponsor an armoury to produce common replacements while each contingent keeps its colours. A shared workshop need not erase a regiment's memory. It will, however, ask proud captains to stop treating an incompatible screw as an ancestral liberty."
 HSM_AQR_CAM_VIN_chevaliers_m5:0 "Each Province Keeps the Next Supplied"
 HSM_AQR_CAM_VIN_chevaliers_m5_desc:0 "A joint exercise sends Vinovian guards through another province and places its visiting contingent in our storehouses' care. The Chevaliers have argued that mutual obligations protect local freedoms. Their quartermasters must now make that argument tangible, delivering familiar necessities to unfamiliar uniforms. The exercise ends only when both contingents can return without leaving unpaid households along their routes."
 HSM_AQR_CAM_VIN_chevaliers_military1:0 "Stores for the Local Colours"
 HSM_AQR_CAM_VIN_chevaliers_military1_desc:0 "The guards' armouries and supply rooms begin serving actual contingents rather than household prestige."
 HSM_AQR_CAM_VIN_chevaliers_military2:0 "The Guard's Wider Neighbourhood"
 HSM_AQR_CAM_VIN_chevaliers_military2_desc:0 "Depots beyond the patrons' estates give local guards dependable support from a broader community."
 HSM_AQR_CAM_VIN_chevaliers_military3:0 "The Federation's Mutual Watch"
 HSM_AQR_CAM_VIN_chevaliers_military3_desc:0 "Provincial contingents preserve their traditions while learning to feed and relieve one another."
 HSM_AQR_CAM_VIN_gadiffer_c1:0 "Widows at the Estate Door"
 HSM_AQR_CAM_VIN_gadiffer_c1_desc:0 "The families of royal volunteers bring the palace letters written by men who will never return. Gadiffer's steward can identify the signatures but finds no provision for the children waiting beside their mothers. The duke sets aside estate income for their upkeep. His household must learn to recognise an obligation that continues after a soldier's name leaves the muster roll."
 HSM_AQR_CAM_VIN_gadiffer_c2:0 "Vinovia's Voice beside the Crown"
 HSM_AQR_CAM_VIN_gadiffer_c2_desc:0 "Gadiffer's place in national deliberations brings visitors who have never owed rent to his household. They want to know whether his protection depends on that connection. The duke asks them to present their complaints alongside Vinovia's. He will argue for his province within the royal settlement, but kinship with the sovereign cannot make every other province a petitioner at his gate."
 HSM_AQR_CAM_VIN_gadiffer_e1:0 "Rent Receipts under the Ducal Seal"
 HSM_AQR_CAM_VIN_gadiffer_e1_desc:0 "Gadiffer's tenants arrive with receipts that his estate managers have never entered in their books. Some paid in grain; others repaired a mill in place of rent. The duke orders these obligations reconciled before another demand leaves his household. Royal loyalty will have firmer roots if the Discret name on a receipt means the debt has truly been paid."
 HSM_AQR_CAM_VIN_gadiffer_e2:0 "Grain against the Palace Silver"
 HSM_AQR_CAM_VIN_gadiffer_e2_desc:0 "Merchants will advance grain against Gadiffer's credit, but his steward offers the tenants' next harvest as security. The duke puts household silver on the table instead. Royal standing can open a merchant's warehouse; someone must still bear the risk of a poor season. Vinovia's estate economy will have to discover how far paternal duty reaches into the palace itself."
 HSM_AQR_CAM_VIN_gadiffer_e3:0 "Leases for the Millwrights"
 HSM_AQR_CAM_VIN_gadiffer_e3_desc:0 "The old estate mill needs machinery its hereditary keeper cannot afford. Gadiffer invites millwrights to lease the workshop on terms that recognise repairs as investment rather than unpaid service. The keeper protests that strangers will inherit his father's place. A written lease must preserve the craft without preserving a broken wheel merely because a familiar family owns it."
 HSM_AQR_CAM_VIN_gadiffer_e4:0 "The Crown's Purchase Book"
 HSM_AQR_CAM_VIN_gadiffer_e4_desc:0 "Provincial suppliers have learned to distrust an order bearing a grander seal than its issuer can honour. Gadiffer brings Vinovia's settled accounts to the national purchasing office and asks the crown to bind its buyers to the same discipline. His family name secures the hearing. The suppliers waiting outside will judge the outcome by whether the next invoice is paid."
 HSM_AQR_CAM_VIN_gadiffer_e5:0 "A Household Bound to Its Word"
 HSM_AQR_CAM_VIN_gadiffer_e5_desc:0 "An estate once advertised its wealth through the number of guests it could feed. Gadiffer wants his household known for the contracts it can honour through an uncertain season. Surveyors and builders return to works abandoned after earlier promises failed. The duke's example reaches the crown through completed foundations, carrying a quieter claim to authority than another banquet."
 HSM_AQR_CAM_VIN_gadiffer_economy1:0 "The Duke's Settled Accounts"
 HSM_AQR_CAM_VIN_gadiffer_economy1_desc:0 "Recognised receipts let estate workshops plan their work without fearing that an old demand will return."
 HSM_AQR_CAM_VIN_gadiffer_economy2:0 "Silver behind the Promise"
 HSM_AQR_CAM_VIN_gadiffer_economy2_desc:0 "Gadiffer's household guarantees the agreements that keep tenants and millwrights at work."
 HSM_AQR_CAM_VIN_gadiffer_economy3:0 "The Credit of the Discret Household"
 HSM_AQR_CAM_VIN_gadiffer_economy3_desc:0 "The duke's reputation rests on paid suppliers and completed works, making personal patronage answerable to its commitments."
 HSM_AQR_CAM_VIN_gadiffer_m1:0 "Service beneath the Family Standard"
 HSM_AQR_CAM_VIN_gadiffer_m1_desc:0 "The ducal standard attracts volunteers who know the Discret name better than the duties of a soldier. Gadiffer asks Robert Niverolle to turn their attachment into dependable service. Muster rolls will record trades and previous experience beside family names. A loyal regiment must have room for the carter who can keep it moving as well as the noble who carries its colours."
 HSM_AQR_CAM_VIN_gadiffer_m2:0 "Measure the Gun Teams"
 HSM_AQR_CAM_VIN_gadiffer_m2_desc:0 "Niverolle watches a battery perform a splendid salute and then struggle to move its pieces away. He orders the next inspection held on an ordinary road with ammunition wagons attached. Gadiffer's officers must show how their guns reach the position they promise to defend. The spectators can wait until the teams have learned to finish the journey."
 HSM_AQR_CAM_VIN_gadiffer_m3:0 "Bread before the Parade"
 HSM_AQR_CAM_VIN_gadiffer_m3_desc:0 "The regiment's parade route crosses a district already supplying its field kitchens. Niverolle proposes scheduled deliveries in place of officers arriving whenever a store runs empty. Gadiffer requires the schedule to respect the harvest work his tenants cannot postpone. The resulting supply arrangements will be tested by hungry soldiers, tired carters and a colonel accustomed to being served first."
 HSM_AQR_CAM_VIN_gadiffer_m4:0 "A Ducal Battery for Common Service"
 HSM_AQR_CAM_VIN_gadiffer_m4_desc:0 "The national command requests batteries that can exchange ammunition and reports without exchanging their loyalties. Gadiffer offers a Vinovian workshop to produce fittings to the common specification. Niverolle brings worn pieces for the craftsmen to examine. Serving the crown beyond the duchy now means accepting that another province's gun crew may need to use what our own has made."
 HSM_AQR_CAM_VIN_gadiffer_m5:0 "Officers Who Answer to Their Men"
 HSM_AQR_CAM_VIN_gadiffer_m5_desc:0 "Gadiffer has listened to enough disputes over carts to recognise the same excuses in a regimental complaint. Niverolle will assemble the officers to examine failures of supply and command together. A commission remains an honour bestowed in the crown's name, but its bearer must explain what happened to the soldiers entrusted to him when the written arrangements broke down."
 HSM_AQR_CAM_VIN_gadiffer_military1:0 "The Ducal Muster"
 HSM_AQR_CAM_VIN_gadiffer_military1_desc:0 "Loyal volunteers learn to serve beside strangers beneath a familiar family standard."
 HSM_AQR_CAM_VIN_gadiffer_military2:0 "The Regiment's Provision Book"
 HSM_AQR_CAM_VIN_gadiffer_military2_desc:0 "Niverolle's supply arrangements bind officers to deliveries their supporting villages can actually make."
 HSM_AQR_CAM_VIN_gadiffer_military3:0 "Commissions Kept in Good Faith"
 HSM_AQR_CAM_VIN_gadiffer_military3_desc:0 "Ducal officers preserve the pride of royal service by answering for the men and stores placed in their care."
 HSM_AQR_CAM_VIN_sis_c1:0 "An Examination without Introductions"
 HSM_AQR_CAM_VIN_sis_c1_desc:0 "The society's graduates recognise one another at interviews, while an unfamiliar applicant waits with a better written exercise. SIS will remove names and recommendations from the first examination of candidates. Its network helped republican ideas survive; public employment must now reach beyond it. The old study circles will have to accept that a stranger may be better prepared to serve."
 HSM_AQR_CAM_VIN_sis_c2:0 "A Republic May Correct Its Teachers"
 HSM_AQR_CAM_VIN_sis_c2_desc:0 "An old society lecturer hears his own arguments quoted against a national appointment he has recommended. The speaker learned them in one of the society's public classes. SIS must decide what it means to carry the promise of political change into an existing republic. Its most useful national service may be defending a citizen's right to embarrass the people who taught him."
 HSM_AQR_CAM_VIN_sis_e1:0 "One Weight on Every Counter"
 HSM_AQR_CAM_VIN_sis_e1_desc:0 "A society graduate buys the same quantity of flour at three shops and returns with three different weights. The merchants distrust the proposed inspectors, many of whom have never served a customer. SIS will bring traders and trained measurers together at a public bench. Republican confidence can begin with a customer watching the test that determines what a purchase means."
 HSM_AQR_CAM_VIN_sis_e2:0 "The Pump Must Work in Public"
 HSM_AQR_CAM_VIN_sis_e2_desc:0 "An engineer recommended by an old society acquaintance promises a pump that will transform the town's water supply. The drawings impress the committee; the keeper of the well asks to see it run. SIS will require a demonstration with local operators before accepting the installation. Expertise should survive the inconvenient questions asked by those who must live with its machines."
 HSM_AQR_CAM_VIN_sis_e3:0 "Instruments Worth Their Certificate"
 HSM_AQR_CAM_VIN_sis_e3_desc:0 "The society's testing bench has outgrown its borrowed room. Instrument makers offer to build gauges and electrical meters nearby, provided the examiners publish what a certificate actually guarantees. A workshop devoted to these instruments will give Vinovia's manufacturers something more useful than an impressive stamp. Its own products will undergo the same public trials as everyone else's."
 HSM_AQR_CAM_VIN_sis_e4:0 "The Same Signal across Aquileia"
 HSM_AQR_CAM_VIN_sis_e4_desc:0 "National technical delegates discover that equipment approved in one province cannot always communicate with equipment approved in another. SIS offers its testing records to a joint examination of electrical standards. The society's republican network must learn to exchange corrections as readily as manifestos. A circuit that works beyond Vinovia will carry a more convincing argument for cooperation than another celebrated address."
 HSM_AQR_CAM_VIN_sis_e5:0 "Correspondents with Open Notebooks"
 HSM_AQR_CAM_VIN_sis_e5_desc:0 "The society's correspondents once sent accounts of political changes abroad. Now their letters include failed experiments, workshop measurements and requests for a second opinion. SIS will give these exchanges a permanent research home. The national republic gains a useful institution if the network can welcome a convincing correction from someone who never belonged to its oldest study circles."
 HSM_AQR_CAM_VIN_sis_economy1:0 "The Public Testing Bench"
 HSM_AQR_CAM_VIN_sis_economy1_desc:0 "Merchants and examiners establish standards whose meaning a customer can witness."
 HSM_AQR_CAM_VIN_sis_economy2:0 "Certificates with Published Methods"
 HSM_AQR_CAM_VIN_sis_economy2_desc:0 "Instrument makers and inspectors publish the methods behind their claims, making defects easier to identify and correct."
 HSM_AQR_CAM_VIN_sis_economy3:0 "The Correspondents' Technical Exchange"
 HSM_AQR_CAM_VIN_sis_economy3_desc:0 "The society's network carries useful production findings between workshops willing to expose their own mistakes."
 HSM_AQR_CAM_VIN_sis_m1:0 "The Surveyor beside the Sergeant"
 HSM_AQR_CAM_VIN_sis_m1_desc:0 "SIS volunteers arrive at the barracks carrying maps whose elegant contours omit a footbridge used by every local patrol. Guillaume Boucarle pairs the surveyors with sergeants before accepting their work. The army needs educated specialists who will walk the ground they describe. A shared map begins when the graduate stops correcting the soldier long enough to hear where he has been."
 HSM_AQR_CAM_VIN_sis_m2:0 "Range Tables Tested on the Ground"
 HSM_AQR_CAM_VIN_sis_m2_desc:0 "The artillery class can solve its exercises quickly, yet two observers return different distances to the same target. Society mathematicians will work with gun crews to find where measurement gives way to assumption. Their corrected tables must remain readable in rain and hurried light. The proof that matters will arrive from a battery using them without their authors standing nearby."
 HSM_AQR_CAM_VIN_sis_m3:0 "The Staff Exercise Leaves the Library"
 HSM_AQR_CAM_VIN_sis_m3_desc:0 "A society seminar has produced an excellent supply plan for roads that its participants have never travelled. Boucarle invites the authors to carry it through an exercise with actual carts and messengers. Their calculations will meet late deliveries and contradictory reports. A republican staff must learn to revise an elegant answer before soldiers elsewhere pay for its reluctance to admit uncertainty."
 HSM_AQR_CAM_VIN_sis_m4:0 "Optics for a Common Army"
 HSM_AQR_CAM_VIN_sis_m4_desc:0 "The national army asks Vinovia's instrument makers for sights whose markings remain consistent across provincial contracts. SIS arranges a production workshop beside the testing rooms and insists that soldiers report faults directly. A technical profession serving the republic must accept scrutiny from its users. The sight is finished when the gunner can trust it, whatever the examiner's diploma says."
 HSM_AQR_CAM_VIN_sis_m5:0 "The Observer's Unwelcome Correction"
 HSM_AQR_CAM_VIN_sis_m5_desc:0 "An aerial observer returns with a sketch contradicting the route approved by a respected staff lecturer. The society will bring observers, mapmakers and supply officers into the same exercise room. Professional judgement grows stronger when a correction can reach the person who needs it. The army must give an unwelcome report a hearing before it gives another column the wrong road."
 HSM_AQR_CAM_VIN_sis_military1:0 "Maps with a Sergeant's Corrections"
 HSM_AQR_CAM_VIN_sis_military1_desc:0 "Surveyors incorporate the routes and obstacles familiar to serving patrols."
 HSM_AQR_CAM_VIN_sis_military2:0 "Calculations That Travel with the Column"
 HSM_AQR_CAM_VIN_sis_military2_desc:0 "Staff specialists test supply plans against actual marches and reports from the road."
 HSM_AQR_CAM_VIN_sis_military3:0 "A Staff That Receives Corrections"
 HSM_AQR_CAM_VIN_sis_military3_desc:0 "Observers and supply officers can correct shared plans before an elegant mistake becomes a marching order."
 HSM_AQR_JEB_cocardiers:0 "Cocardier Executive Committee"
 HSM_AQR_JEB_cocardiers_government_tt:0 "Government: Non-aligned. Leader: $HSM_AQR_JEB_cocardiers$. Ruling support: §Y55%§!; other currents: §Y15%§! each. No scheduled national elections."
 HSM_AQR_JEB_cocardiers_organise:0 "Convene Revolutionary Tribunals"
 HSM_AQR_JEB_cocardiers_organise_desc:0 "An accusation left over from the fighting has reached a tribunal without a witness attached. The Cocardiers cannot promise Aquileia a republic secure against its enemies while letting an unsigned paper decide a neighbour's fate. They will gather the evidence and hear the defence. The courtroom must show what their revolutionary government means when the crowd outside demands an answer."
 HSM_AQR_JEB_cocardiers_organise_effect:0 "Political power: §G+35§!."
 HSM_AQR_JEB_cocardiers_organise_req_tt:0 "This programme is active and our regional administration is functioning."
 HSM_AQR_JEB_cocardiers_party:0 "Cocardiers"
 HSM_AQR_JEB_cocardiers_pledge:0 "Establish the Emergency Committee"
 HSM_AQR_JEB_cocardiers_pledge_desc:0 "Victory has left the Cocardiers with a committee built to receive warnings before dawn. Its messengers still hurry through Rila, although the barricades are coming down. The movement wants to defend the republic throughout Aquileia. First it must decide which emergency duties remain necessary here, and who can question an order issued in the name of a danger nobody else has seen."
 HSM_AQR_JEB_cocardiers_pledge_effect:0 "Adopt the post-revolutionary programme."
 HSM_AQR_JEB_cocardiers_pledge_req_tt:0 "The victorious regional movement has endorsed this programme; no competing programme is active."
 HSM_AQR_JEB_cocardiers_programme_tt:0 "Modify §Y$HSM_AQR_compact$§! by:\n$MODIFIER_MOBILIZATION_SPEED$: §G+15.0%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+10.0%§!"
 HSM_AQR_JEB_cocardiers_ratify_again_req_tt:0 "The winning programme can be ratified; reserve 50 political power."
 HSM_AQR_JEB_cocardiers_resume_req_tt:0 "Choose the Cocardiers' revolutionary programme. Ratification requires revolutionary victory and peace in Rila."
 HSM_AQR_JEB_cocardiers_settle:0 "Unite the Commands"
 HSM_AQR_JEB_cocardiers_settle_desc:0 "Two orders have reached the same workshop, each bearing a different committee's seal. The Cocardiers will settle who speaks for their government and who answers when that voice is wrong. They intend to offer this programme to the whole republic. Rila must first show that a common executive can protect a victory without leaving its citizens permanently under siege."
 HSM_AQR_JEB_cocardiers_settle_effect:0 "The constituent assembly will meet. Ratification costs §Y50§! political power and establishes the government and its programme."
 HSM_AQR_JEB_cocardiers_settle_req_tt:0 "The chosen programme can form a government in peacetime or during our war for Aquileia."
 HSM_AQR_JEB_constitutional_government_tt:0 "Government: Democratic / Harmony. Leader: $JEB_duke_michel_discret$. Ruling support: §Y55%§!; other currents: §Y15%§! each. Elections permitted."
 HSM_AQR_JEB_constitutional_organise:0 "Recognise the Assembly"
 HSM_AQR_JEB_constitutional_organise_desc:0 "Michel returns with the clubs' letter folded inside his coat. On the table lies a charter giving the elected assembly authority to reject ministerial proposals. His former secretary reaches for a clean copy, but Michel asks to read the corrections first. The invitation ended his exile; only an agreement with the assembly can give him a place in Rila's government."
 HSM_AQR_JEB_constitutional_organise_effect:0 "Political power: §G+35§!."
 HSM_AQR_JEB_constitutional_organise_req_tt:0 "This programme is active and our regional administration is functioning."
 HSM_AQR_JEB_constitutional_party:0 "Constitutional Bloc"
 HSM_AQR_JEB_constitutional_pledge:0 "Convene Court and Clubs"
 HSM_AQR_JEB_constitutional_pledge_desc:0 "Michel fled when the revolution took Rila. Now the fighting has ended, his former allies propose inviting him back to negotiate with the victorious clubs. Their letter offers safe passage, not the restoration of his old powers. If he accepts, the first meeting will be in a borrowed hall, where the delegates who authorised his return can question him."
 HSM_AQR_JEB_constitutional_pledge_effect:0 "Adopt the post-revolutionary programme."
 HSM_AQR_JEB_constitutional_pledge_req_tt:0 "The victorious regional movement has endorsed this programme; no competing programme is active."
 HSM_AQR_JEB_constitutional_programme_tt:0 "Modify §Y$HSM_AQR_compact$§! by:\n$MODIFIER_POLITICAL_POWER_FACTOR$: §G+10.0%§!\n$MODIFIER_STABILITY_FACTOR$: §G+5.0%§!"
 HSM_AQR_JEB_constitutional_ratify_again_req_tt:0 "The winning programme can be ratified; reserve 50 political power."
 HSM_AQR_JEB_constitutional_resume_req_tt:0 "Choose a constitutional settlement within Rila's revolutionary camp. Ratification requires revolutionary victory and peace."
 HSM_AQR_JEB_constitutional_settle:0 "A Responsible Ministry"
 HSM_AQR_JEB_constitutional_settle_desc:0 "The charter negotiated since Michel's return still leaves one question unsettled: what may ministers do between meetings of the assembly? Delegates bring examples from the first weeks of peace, when delayed decisions left petitions unanswered. Their agreement must work in Rila before its advocates can present it to Aquileia. Michel will have to earn that wider hearing alongside them."
 HSM_AQR_JEB_constitutional_settle_effect:0 "The constituent assembly will meet. Ratification costs §Y50§! political power and establishes the government and its programme."
 HSM_AQR_JEB_constitutional_settle_req_tt:0 "The chosen programme can form a government in peacetime or during our war for Aquileia."
 HSM_AQR_JEB_moderate:0 "Rilan Constitutional Committee"
 HSM_AQR_JEB_moderate_government_tt:0 "Government: Democratic / Harmony. Leader: $HSM_AQR_JEB_moderate$. Ruling support: §Y55%§!; other currents: §Y15%§! each. Elections permitted."
 HSM_AQR_JEB_moderate_organise:0 "Safeguard the Ballot"
 HSM_AQR_JEB_moderate_organise_desc:0 "The printer has begun the ballot papers, but an armed veteran insists on watching every sheet leave the press. He calls it protection. The moderates remember how readily that word became an excuse before the revolution. They will find observers trusted outside the clubs and ask the veteran to leave his rifle elsewhere when he comes to cast his vote."
 HSM_AQR_JEB_moderate_organise_effect:0 "Political power: §G+35§!."
 HSM_AQR_JEB_moderate_organise_req_tt:0 "This programme is active and our regional administration is functioning."
 HSM_AQR_JEB_moderate_party:0 "Union of Moderate Clubs"
 HSM_AQR_JEB_moderate_pledge:0 "Form the Common Committee"
 HSM_AQR_JEB_moderate_pledge_desc:0 "The clubs won the streets together; their messengers now arrive at three different offices with the same petition. A widow has followed one of them all morning, trying to discover who can answer her. The moderates will bring the offices together. Before joining the arguments over Aquileia's future, they should be able to give one neighbour a reliable address."
 HSM_AQR_JEB_moderate_pledge_effect:0 "Adopt the post-revolutionary programme."
 HSM_AQR_JEB_moderate_pledge_req_tt:0 "The victorious regional movement has endorsed this programme; no competing programme is active."
 HSM_AQR_JEB_moderate_programme_tt:0 "Modify §Y$HSM_AQR_compact$§! by:\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §G-5.0%§!\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10.0%§!"
 HSM_AQR_JEB_moderate_ratify_again_req_tt:0 "The winning programme can be ratified; reserve 50 political power."
 HSM_AQR_JEB_moderate_resume_req_tt:0 "Choose the moderate clubs' programme. Ratification requires Rila's revolutionary camp to prevail and the country to be at peace."
 HSM_AQR_JEB_moderate_settle:0 "Amnesty Through Courts"
 HSM_AQR_JEB_moderate_settle_desc:0 "The committee's waiting room remains full long after the fighting. Families seek prisoners; former enemies offer to surrender weapons; witnesses name those responsible for killings. The moderates must distinguish political defeat from a charge that belongs before a court. When their delegates join the national republican movement, this record will matter more than another speech about the rule of law."
 HSM_AQR_JEB_moderate_settle_effect:0 "The constituent assembly will meet. Ratification costs §Y50§! political power and establishes the government and its programme."
 HSM_AQR_JEB_moderate_settle_req_tt:0 "The chosen programme can form a government in peacetime or during our war for Aquileia."
 HSM_AQR_JEB_royal_government_tt:0 "Government: Non-aligned. Leader: $JEB_duke_michel_discret$. Ruling support: §Y55%§!; other currents: §Y15%§! each. No scheduled national elections."
 HSM_AQR_JEB_royal_organise:0 "Hear the Moderates"
 HSM_AQR_JEB_royal_organise_desc:0 "The palace chairs are being uncovered for guests who stayed away throughout the fighting. Several courtiers object to inviting critics so soon after a royal victory. Michel asks whether they intend to govern Rila without hearing it. A crown that has survived the revolution still needs people willing to speak honestly beneath its roof, including those who wanted it reformed."
 HSM_AQR_JEB_royal_organise_effect:0 "Political power: §G+35§!."
 HSM_AQR_JEB_royal_organise_req_tt:0 "This programme is active and our regional administration is functioning."
 HSM_AQR_JEB_royal_party:0 "Rilan Royalists"
 HSM_AQR_JEB_royal_pledge:0 "Protect the Streets"
 HSM_AQR_JEB_royal_pledge_desc:0 "The royalists have held Rila, but the shutters still close when a patrol approaches. Michel watches a shopkeeper wait for the soldiers to pass before opening his door. The duke will bring their captains together and ask what victory has changed for that family. Service to the crown must now mean more than finding another enemy in the street."
 HSM_AQR_JEB_royal_pledge_effect:0 "Adopt the post-revolutionary programme."
 HSM_AQR_JEB_royal_pledge_req_tt:0 "The victorious regional movement has endorsed this programme; no competing programme is active."
 HSM_AQR_JEB_royal_programme_tt:0 "Modify §Y$HSM_AQR_compact$§! by:\n$MODIFIER_ARMY_ORG_FACTOR$: §G+5.0%§!\n$MODIFIER_STABILITY_FACTOR$: §G+5.0%§!"
 HSM_AQR_JEB_royal_ratify_again_req_tt:0 "The winning programme can be ratified; reserve 50 political power."
 HSM_AQR_JEB_royal_resume_req_tt:0 "Choose Michel's loyalist programme. Ratification requires the monarchist camp to prevail and the country to be at peace."
 HSM_AQR_JEB_royal_settle:0 "Bound Emergency Powers"
 HSM_AQR_JEB_royal_settle_desc:0 "On Michel's desk lie wartime orders whose authors can scarcely explain the powers they granted. The captains want clear instructions; the magistrates want an end to searches without warrants. Settling their dispute will give Rila a government fit for peace. Michel intends its work to strengthen the Discret crown, beginning with subjects who can trust the next royal signature."
 HSM_AQR_JEB_royal_settle_effect:0 "The constituent assembly will meet. Ratification costs §Y50§! political power and establishes the government and its programme."
 HSM_AQR_JEB_royal_settle_req_tt:0 "The chosen programme can form a government in peacetime or during our war for Aquileia."
 HSM_AQR_JFT_communes:0 "Council of Communes"
 HSM_AQR_JFT_communes_government_tt:0 "Government: Communist. Leader: $HSM_AQR_JFT_communes$. Ruling support: §Y55%§!; other currents: §Y15%§! each. No scheduled national elections."
 HSM_AQR_JFT_communes_organise:0 "The Militias Answer to the Assemblies"
 HSM_AQR_JFT_communes_organise_desc:0 "Militia patrols still follow their wartime orders, holding up bread carts at a crossing nobody needs to defend. Delegates spread a city plan across the bakery table and ask which duties remain necessary. The assemblies must agree how to supervise the units and replace commanders who disregard them. A federation's common defence must answer to the communities it serves."
 HSM_AQR_JFT_communes_organise_effect:0 "Political power: §G+35§!."
 HSM_AQR_JFT_communes_organise_req_tt:0 "This programme is active and our regional administration is functioning."
 HSM_AQR_JFT_communes_party:0 "Federation of Communes"
 HSM_AQR_JFT_communes_pledge:0 "Assemblies by District"
 HSM_AQR_JFT_communes_pledge_desc:0 "Victory has filled the meeting room before the last shift reaches it. Older communards insist that the new order cannot be entrusted to speakers nobody can replace. Each district will choose delegates bound by instructions from its assembly. Pridea must show how such accountability could work across an Aquileian federation, beginning with a hearing for the night shift."
 HSM_AQR_JFT_communes_pledge_effect:0 "Adopt the post-revolutionary programme."
 HSM_AQR_JFT_communes_pledge_req_tt:0 "The victorious regional movement has endorsed this programme; no competing programme is active."
 HSM_AQR_JFT_communes_programme_tt:0 "Modify §Y$HSM_AQR_compact$§! by:\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+10.0%§!\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §G-5.0%§!"
 HSM_AQR_JFT_communes_ratify_again_req_tt:0 "The winning programme can be ratified; reserve 50 political power."
 HSM_AQR_JFT_communes_resume_req_tt:0 "The communards seek self-government beyond Pridea and beyond Aquileia. Their continuation must explain how common defence can serve communities without ruling over them."
 HSM_AQR_JFT_communes_settle:0 "Bread through Common Stores"
 HSM_AQR_JFT_communes_settle_desc:0 "Peace has returned the militia's flour carts to districts with very different needs. One assembly wants its stores back; another has lost its ovens. Their delegates must settle how shared supplies are governed before offering the same arrangement to communes throughout Aquileia. Pridea will be the starting point for a wider federation, and this hungry morning its first practical test."
 HSM_AQR_JFT_communes_settle_effect:0 "The constituent assembly will meet. Ratification costs §Y50§! political power and establishes the government and its programme."
 HSM_AQR_JFT_communes_settle_req_tt:0 "The chosen programme can form a government in peacetime or during our war for Aquileia."
 HSM_AQR_JFT_dennis_government_tt:0 "Government: Non-aligned. Leader: $JFT_baron_dennis_discret$. Ruling support: §Y55%§!; other currents: §Y15%§! each. No scheduled national elections."
 HSM_AQR_JFT_dennis_organise:0 "The Marines' Old Comrades"
 HSM_AQR_JFT_dennis_organise_desc:0 "The veterans recognise Dennis before the harbour guard announces him. Some served at sea; others fought beside the pony auxiliaries when the first commune fell. He needs their knowledge of the quays and their influence over younger sailors. Calling on those loyalties will also revive old claims for pay and wounds, and memories the workers have never agreed to share."
 HSM_AQR_JFT_dennis_organise_effect:0 "Political power: §G+35§!."
 HSM_AQR_JFT_dennis_organise_req_tt:0 "This programme is active and our regional administration is functioning."
 HSM_AQR_JFT_dennis_party:0 "Dennis' Loyalists"
 HSM_AQR_JFT_dennis_pledge:0 "Keep the Harbour Open"
 HSM_AQR_JFT_dennis_pledge_desc:0 "The fighting has ended, but a flour ship still waits outside Pridea while its captain argues with the patrol boat. Dennis knows the captain and distrusts the delay more than the cargo. He will give the quay guards instructions suited to peace. His claim to lead Aquileia must begin with a harbour that feeds its people without another personal intervention."
 HSM_AQR_JFT_dennis_pledge_effect:0 "Adopt the post-revolutionary programme."
 HSM_AQR_JFT_dennis_pledge_req_tt:0 "The victorious regional movement has endorsed this programme; no competing programme is active."
 HSM_AQR_JFT_dennis_programme_tt:0 "Modify §Y$HSM_AQR_compact$§! by:\n$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$: §G+15.0%§!\n$MODIFIER_SUPPLY_CONSUMPTION_FACTOR$: §G-5.0%§!"
 HSM_AQR_JFT_dennis_ratify_again_req_tt:0 "The winning programme can be ratified; reserve 50 political power."
 HSM_AQR_JFT_dennis_resume_req_tt:0 "Dennis Discret has chosen to hold Pridea for the monarchy. His marines, pony auxiliaries and old naval connections give him strength without resolving the city's grievances."
 HSM_AQR_JFT_dennis_settle:0 "Terms for the Dockyards"
 HSM_AQR_JFT_dennis_settle_desc:0 "A patrol still accompanies every shift into the dockyard. Dennis receives a petition from foremen who cannot repair ships under arrangements made for a siege. His veterans fear losing the harbour; the workers want ordinary working conditions restored. Before advancing his claim to lead Aquileia, the admiral must decide which parts of his command belong in a civilian government."
 HSM_AQR_JFT_dennis_settle_effect:0 "The constituent assembly will meet. Ratification costs §Y50§! political power and establishes the government and its programme."
 HSM_AQR_JFT_dennis_settle_req_tt:0 "The chosen programme can form a government in peacetime or during our war for Aquileia."
 HSM_AQR_JFT_enfants:0 "Les Enfants Terribles Directorate"
 HSM_AQR_JFT_enfants_government_tt:0 "Government: Supremacist. Leader: $HSM_AQR_JFT_enfants$. Ruling support: §Y55%§!; other currents: §Y15%§! each. No scheduled national elections."
 HSM_AQR_JFT_enfants_organise:0 "Account for Every Shipment"
 HSM_AQR_JFT_enfants_organise_desc:0 "A shipment lost during the fighting has been traced to a sale under a forged collection order. The dockside organisers bring a witness and the merchant's duplicate receipt. Former underground cells must now cooperate openly to establish what happened. Their common supply office will examine the records before making accusations, beginning the work of governing without treating suspicion as proof."
 HSM_AQR_JFT_enfants_organise_effect:0 "Political power: §G+35§!."
 HSM_AQR_JFT_enfants_organise_req_tt:0 "This programme is active and our regional administration is functioning."
 HSM_AQR_JFT_enfants_party:0 "Les Enfants Terribles"
 HSM_AQR_JFT_enfants_pledge:0 "Bring the Cells into Daylight"
 HSM_AQR_JFT_enfants_pledge_desc:0 "Two former couriers arrive with contradictory instructions, each bearing a signature trusted during the fighting. Victory has brought the cells into public offices without settling who may speak for the movement. Their organisers will compare records and establish responsibilities before presenting a programme for Aquileia. Wartime secrecy cannot remain an excuse for orders that nobody will defend in person."
 HSM_AQR_JFT_enfants_pledge_effect:0 "Adopt the post-revolutionary programme."
 HSM_AQR_JFT_enfants_pledge_req_tt:0 "The victorious regional movement has endorsed this programme; no competing programme is active."
 HSM_AQR_JFT_enfants_programme_tt:0 "Modify §Y$HSM_AQR_compact$§! by:\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$: §G+10.0%§!\n$MODIFIER_MOBILIZATION_SPEED$: §G+15.0%§!"
 HSM_AQR_JFT_enfants_ratify_again_req_tt:0 "The winning programme can be ratified; reserve 50 political power."
 HSM_AQR_JFT_enfants_resume_req_tt:0 "Les Enfants Terribles place Aquileian strength and the survival of the revolution first. Their national programme differs from the communards' federation and the FJA's parliamentary coalition."
 HSM_AQR_JFT_enfants_settle:0 "Examine the Wartime Files"
 HSM_AQR_JFT_enfants_settle_desc:0 "The fighting is over, and the security cell brings its wartime files to the provisional assembly. One suspect helped sell the missing shipment; another merely disputed an organiser's orders. Their names appear on the same page. Before offering its programme to Aquileia, the movement must decide who may investigate opponents and what evidence separates disagreement from betrayal."
 HSM_AQR_JFT_enfants_settle_effect:0 "The constituent assembly will meet. Ratification costs §Y50§! political power and establishes the government and its programme."
 HSM_AQR_JFT_enfants_settle_req_tt:0 "The chosen programme can form a government in peacetime or during our war for Aquileia."
 HSM_AQR_JFT_fja:0 "FJA Coalition Government"
 HSM_AQR_JFT_fja_government_tt:0 "Government: Democratic / Harmony. Leader: $HSM_AQR_JFT_fja$. Ruling support: §Y55%§!; other currents: §Y15%§! each. Elections permitted."
 HSM_AQR_JFT_fja_organise:0 "Civilian Supply Committees"
 HSM_AQR_JFT_fja_organise_desc:0 "A militia organiser claims the flour reserved for his units during the fighting. A clinic attendant asks why the hospital must still wait now that peace has returned. Joint civilian committees will review those wartime allocations and publish the distribution agreed with the neighbourhoods. Their work must make the coalition's social programme credible before it seeks a wider Aquileian mandate."
 HSM_AQR_JFT_fja_organise_effect:0 "Political power: §G+35§!."
 HSM_AQR_JFT_fja_organise_req_tt:0 "This programme is active and our regional administration is functioning."
 HSM_AQR_JFT_fja_party:0 "FJA Coalition"
 HSM_AQR_JFT_fja_pledge:0 "Renew the Forest Agreement"
 HSM_AQR_JFT_fja_pledge_desc:0 "The first public meeting after victory begins with the paper once carried into the forest. Nobody recorded who could speak for the neighbourhood groups beyond the emergency. The FJA and the communards must renew their agreement for ordinary political life. Their proposal for Aquileia will need representatives able to disagree in public while still building a common parliamentary programme."
 HSM_AQR_JFT_fja_pledge_effect:0 "Adopt the post-revolutionary programme."
 HSM_AQR_JFT_fja_pledge_req_tt:0 "The victorious regional movement has endorsed this programme; no competing programme is active."
 HSM_AQR_JFT_fja_programme_tt:0 "Modify §Y$HSM_AQR_compact$§! by:\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §G+5.0%§!\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §G-5.0%§!"
 HSM_AQR_JFT_fja_ratify_again_req_tt:0 "The winning programme can be ratified; reserve 50 political power."
 HSM_AQR_JFT_fja_resume_req_tt:0 "The Pridean FJA and the communards agreed to postpone their differences until victory. A parliamentary social republic must now negotiate the questions they left unanswered."
 HSM_AQR_JFT_fja_settle:0 "A Provisional Coalition Cabinet"
 HSM_AQR_JFT_fja_settle_desc:0 "Peace has ended the reason for postponing every disagreement. The communards bring proposals for workplace councils; the FJA brings an electoral timetable and a programme of social legislation. Both need a government able to reopen the factories and keep the hospitals supplied. Their provisional cabinet must establish how decisions are made now, and how the voters may replace its members later."
 HSM_AQR_JFT_fja_settle_effect:0 "The constituent assembly will meet. Ratification costs §Y50§! political power and establishes the government and its programme."
 HSM_AQR_JFT_fja_settle_req_tt:0 "The chosen programme can form a government in peacetime or during our war for Aquileia."
 HSM_AQR_JRR_absolutist_government_tt:0 "Government: Non-aligned. Leader: $HSM_AQR_jeanne_discret$. Ruling support: §Y55%§!; other currents: §Y15%§! each. No scheduled national elections."
 HSM_AQR_JRR_absolutist_organise:0 "The Officers Answer to the Court"
 HSM_AQR_JRR_absolutist_organise_desc:0 "Victory has left Jeanne with officers who expect their wartime promises to become permanent privileges. She will summon them to explain which duties belong to the court and which require a soldier's judgement. Their commissions must answer to public authority before she can offer this settlement to Aquileia. Replacing one military patron with another would leave the marquise dependent."
 HSM_AQR_JRR_absolutist_organise_effect:0 "Political power: §G+35§!."
 HSM_AQR_JRR_absolutist_organise_req_tt:0 "This programme is active and our regional administration is functioning."
 HSM_AQR_JRR_absolutist_party:0 "Jeanne's Court"
 HSM_AQR_JRR_absolutist_pledge:0 "The Marquise's Own Chancery"
 HSM_AQR_JRR_absolutist_pledge_desc:0 "A village petition has reached Jeanne after three visits to military offices. The bridge it concerns is still broken. She will appoint her own clerks and receive the petitioners herself, giving the court work that can be judged outside its walls. An administration capable of answering such requests would make her authority more than a title on a letter."
 HSM_AQR_JRR_absolutist_pledge_effect:0 "Adopt the post-revolutionary programme."
 HSM_AQR_JRR_absolutist_pledge_req_tt:0 "The victorious regional movement has endorsed this programme; no competing programme is active."
 HSM_AQR_JRR_absolutist_programme_tt:0 "Modify §Y$HSM_AQR_compact$§! by:\n$MODIFIER_POLITICAL_POWER_FACTOR$: §G+10.0%§!\n$MODIFIER_ARMY_ORG_FACTOR$: §G+5.0%§!"
 HSM_AQR_JRR_absolutist_ratify_again_req_tt:0 "The winning programme can be ratified; reserve 50 political power."
 HSM_AQR_JRR_absolutist_resume_req_tt:0 "Jeanne has chosen the nobles and loyal officers against Colette. Their support can restore her authority, but it comes with expectations of its own."
 HSM_AQR_JRR_absolutist_settle:0 "Oaths from the Estates"
 HSM_AQR_JRR_absolutist_settle_desc:0 "The fighting has ended, and the nobles arrive with the promises they made to Jeanne. Some expect appointments before damaged villages receive assistance. She will summon their delegates to settle the obligations of her government. Westkeep must show what her royal leadership could offer Aquileia beyond a family name, beginning with duties that bind the court's own supporters."
 HSM_AQR_JRR_absolutist_settle_effect:0 "The constituent assembly will meet. Ratification costs §Y50§! political power and establishes the government and its programme."
 HSM_AQR_JRR_absolutist_settle_req_tt:0 "The chosen programme can form a government in peacetime or during our war for Aquileia."
 HSM_AQR_JRR_coalition_government_tt:0 "Government: Democratic / Harmony. Leader: $HSM_AQR_jeanne_discret$. Ruling support: §Y55%§!; other currents: §Y15%§! each. Elections permitted."
 HSM_AQR_JRR_coalition_organise:0 "A Bench beyond the Barracks"
 HSM_AQR_JRR_coalition_organise_desc:0 "A shopkeeper still needs an officer's permission to challenge a wartime requisition. The coalition's lawyers propose a hearing outside the garrison, where witnesses can speak without their former commandant's approval. Jeanne will protect its right to convene. Her allies helped secure victory; a royal government worthy of their continued support must now hear complaints against its own officers."
 HSM_AQR_JRR_coalition_organise_effect:0 "Political power: §G+35§!."
 HSM_AQR_JRR_coalition_organise_req_tt:0 "This programme is active and our regional administration is functioning."
 HSM_AQR_JRR_coalition_party:0 "Westkeep Civic Coalition"
 HSM_AQR_JRR_coalition_pledge:0 "Publish the Coalition Pledge"
 HSM_AQR_JRR_coalition_pledge_desc:0 "Royal victory has brought Jeanne's republican allies back to the printers with their original pledge. They ask that the promised municipal seats appear before the signatures. The revised compact will keep the marquise at the head of a royal coalition while giving the towns a lasting voice. Publishing its terms will show Aquileia what their unlikely partnership can offer."
 HSM_AQR_JRR_coalition_pledge_effect:0 "Adopt the post-revolutionary programme."
 HSM_AQR_JRR_coalition_pledge_req_tt:0 "The victorious regional movement has endorsed this programme; no competing programme is active."
 HSM_AQR_JRR_coalition_programme_tt:0 "Modify §Y$HSM_AQR_compact$§! by:\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10.0%§!\n$MODIFIER_SUPPLY_CONSUMPTION_FACTOR$: §G-5.0%§!"
 HSM_AQR_JRR_coalition_ratify_again_req_tt:0 "The winning programme can be ratified; reserve 50 political power."
 HSM_AQR_JRR_coalition_resume_req_tt:0 "Jeanne has sought moderate republican support against military rule. Their coalition opens a constitutional question; it has not already answered it."
 HSM_AQR_JRR_coalition_settle:0 "Civilian Warrants"
 HSM_AQR_JRR_coalition_settle_desc:0 "Peace has returned, but the commandant still signs the permits for town meetings. Municipal delegates bring Jeanne the coalition's printed compact and ask who will sign tomorrow. Their settlement must place the garrisons under civilian authority while preserving her royal leadership. Before proposing it to the wider Aquileian movement, they must show how a town can challenge a lawful order."
 HSM_AQR_JRR_coalition_settle_effect:0 "The constituent assembly will meet. Ratification costs §Y50§! political power and establishes the government and its programme."
 HSM_AQR_JRR_coalition_settle_req_tt:0 "The chosen programme can form a government in peacetime or during our war for Aquileia."
 HSM_AQR_JRR_colette_government_tt:0 "Government: Supremacist. Leader: $JRR_colonel_colette_solide$. Ruling support: §Y55%§!; other currents: §Y15%§! each. No scheduled national elections."
 HSM_AQR_JRR_colette_organise:0 "The Workers' Liaison"
 HSM_AQR_JRR_colette_organise_desc:0 "The former underground delegates now bring their demands through the headquarters' front door. They want representation and an answer about the hours worked by those supplying the recovering towns. Colette's officers would still prefer to discuss military deliveries first. A regular civilian liaison must give both a hearing before their reconstruction programme can claim support beyond the garrisons."
 HSM_AQR_JRR_colette_organise_effect:0 "Political power: §G+35§!."
 HSM_AQR_JRR_colette_organise_req_tt:0 "This programme is active and our regional administration is functioning."
 HSM_AQR_JRR_colette_party:0 "Military and Civic Coalition"
 HSM_AQR_JRR_colette_pledge:0 "The Timetable after Victory"
 HSM_AQR_JRR_colette_pledge_desc:0 "The railway worker returns to Colette's headquarters with the timetable used during the rising. Its reverse carries promises to the civilian organisers who kept the trains moving. Now the fighting has ended, he asks which will be honoured. Colette will bring officers and railway delegates together to turn their wartime cooperation into a proposal for Aquileia's reconstruction."
 HSM_AQR_JRR_colette_pledge_effect:0 "Adopt the post-revolutionary programme."
 HSM_AQR_JRR_colette_pledge_req_tt:0 "The victorious regional movement has endorsed this programme; no competing programme is active."
 HSM_AQR_JRR_colette_programme_tt:0 "Modify §Y$HSM_AQR_compact$§! by:\n$MODIFIER_ARMY_ORG_FACTOR$: §G+10.0%§!\n$MODIFIER_MAX_PLANNING_FACTOR$: §G+15.0%§!"
 HSM_AQR_JRR_colette_ratify_again_req_tt:0 "The winning programme can be ratified; reserve 50 political power."
 HSM_AQR_JRR_colette_resume_req_tt:0 "Colette has rallied the revolutionary military network and courted the underground left. Their common enemy does not settle who will govern after victory."
 HSM_AQR_JRR_colette_settle:0 "One Operational Command"
 HSM_AQR_JRR_colette_settle_desc:0 "With peace restored, the headquarters receives its first request to surrender a factory requisition. Colette's quartermaster still needs the machinery; the workers want to reopen ordinary production. The improvised wartime command requires a political settlement before either side will yield. The delegates are coming to decide which powers remain with the officers, and which belong to the revolution's civilian partners."
 HSM_AQR_JRR_colette_settle_effect:0 "The constituent assembly will meet. Ratification costs §Y50§! political power and establishes the government and its programme."
 HSM_AQR_JRR_colette_settle_req_tt:0 "The chosen programme can form a government in peacetime or during our war for Aquileia."
 HSM_AQR_KINGDOM_communism:0 "Kingdom of Aquileia"
 HSM_AQR_KINGDOM_communism_ADJ:0 "Aquileian"
 HSM_AQR_KINGDOM_communism_DEF:0 "the Kingdom of Aquileia"
 HSM_AQR_KINGDOM_democratic:0 "Kingdom of Aquileia"
 HSM_AQR_KINGDOM_democratic_ADJ:0 "Aquileian"
 HSM_AQR_KINGDOM_democratic_DEF:0 "the Kingdom of Aquileia"
 HSM_AQR_KINGDOM_fascism:0 "Kingdom of Aquileia"
 HSM_AQR_KINGDOM_fascism_ADJ:0 "Aquileian"
 HSM_AQR_KINGDOM_fascism_DEF:0 "the Kingdom of Aquileia"
 HSM_AQR_KINGDOM_neutrality:0 "Kingdom of Aquileia"
 HSM_AQR_KINGDOM_neutrality_ADJ:0 "Aquileian"
 HSM_AQR_KINGDOM_neutrality_DEF:0 "the Kingdom of Aquileia"
 HSM_AQR_LOCAL_JEB_f1:0 "Sound the Pélis Approaches"
 HSM_AQR_LOCAL_JEB_f1_desc:0 "The merchant captains of Pélis know which harbour marks have shifted and which stretches of quay swallow a cartwheel after rain. Their complaints seldom reach Rila together. A survey party will travel with the pilots, mark the troublesome approaches and carry its drawings ashore, where dockworkers can point out everything a captain cannot see from the deck."
 HSM_AQR_LOCAL_JEB_f2:0 "The Fairground Scales"
 HSM_AQR_LOCAL_JEB_f2_desc:0 "A farmer brings grain to a Rilan fair and discovers that the buyer's measure differs from the one used at the harbour. Both vessels carry respectable seals. Inspectors will compare the weights in front of the stalls and leave a reference set with the market keeper. Bargaining should begin with the price, without an argument over the size of a sack."
 HSM_AQR_LOCAL_JEB_f3:0 "Oil for the Stored Rifles"
 HSM_AQR_LOCAL_JEB_f3_desc:0 "The armourer opens a crate whose inventory promises serviceable rifles. Salt air has reached the locks, and the packing straw is damp. Rila's coastal stores need a patient inspection before another consignment is accepted on the strength of its label. Apprentices will clean the recoverable weapons beside experienced smiths, sorting usable parts from those that should never return to a rifle."
 HSM_AQR_LOCAL_JEB_f4:0 "A Dispatch Along the Coast"
 HSM_AQR_LOCAL_JEB_f4_desc:0 "A coastal exercise begins with an unremarkable instruction: deliver a sealed message and a loaded supply cart to the same rendezvous. The messenger arrives first, then waits while the driver searches for a passable road. The officers will walk the route with the carters afterwards. A supply plan drawn in Rila must survive the journey beyond the city gates."
 HSM_AQR_LOCAL_JFT_f1:0 "The Harbour Clock"
 HSM_AQR_LOCAL_JFT_f1_desc:0 "Pridea's fish carts and grain wagons meet beneath the same harbour clock, although their owners appear to keep different hours. Pilots know when a vessel can enter the gulf; market porters know when its cargo must reach the stalls. Bringing their timetables together will spare the city another morning of empty baskets beside a crowded quay."
 HSM_AQR_LOCAL_JFT_f2:0 "From Quay to Granary"
 HSM_AQR_LOCAL_JFT_f2_desc:0 "The road between Pridea's quays and the surrounding grain stores carries more than the harbour map suggests. A broken culvert strands the same wagons in every heavy rain, leaving sailors to unload sacks that cannot go anywhere. Road crews will work outward from that crossing, following the cart drivers who know where the next wheel will sink."
 HSM_AQR_LOCAL_JFT_f3:0 "Salt in the Rifle Racks"
 HSM_AQR_LOCAL_JFT_f3_desc:0 "Salt air reaches the harbour armouries as readily as it reaches a ship's rigging. The armourers have collected serviceable barrels beneath a roof that no longer keeps them dry. Repairing the racks and matching these scattered parts will put neglected weapons back into orderly stores, where a quartermaster can find them without opening every rusted chest."
 HSM_AQR_LOCAL_JFT_f4:0 "A Gangway Wide Enough"
 HSM_AQR_LOCAL_JFT_f4_desc:0 "A harbour exercise has left the stretcher bearers waiting behind ammunition carts on the narrowest gangway. Pridea has sailors who understand boats and soldiers who understand marching, but the moment between shore and deck belongs to neither profession alone. Repeating the loading drill together will teach the crews where to leave room before anyone needs it under fire."
 HSM_AQR_LOCAL_JRR_f1:0 "The March's Road Book"
 HSM_AQR_LOCAL_JRR_f1_desc:0 "Westkeep's military offices possess excellent maps of approaches to their barracks, yet a village carrier still discovers broken culverts by driving into them. Road keepers and postal clerks will assemble a common book of crossings, repair materials and dependable stopping places. Civilian journeys deserve a route that exists outside an officer's pencilled campaign plan."
 HSM_AQR_LOCAL_JRR_f2:0 "A Passage for the Mail Cart"
 HSM_AQR_LOCAL_JRR_f2_desc:0 "A military wagon can find helpers at the nearest garrison. The cart carrying letters, medicine and replacement millstones has no such privilege. The march's road crews will repair narrow crossings and mark places where heavy traffic must wait. Merchants and village carriers can then arrange their journeys around the seasons instead of yesterday's stranded convoy."
 HSM_AQR_LOCAL_JRR_f3:0 "What the Armourers Can Mend"
 HSM_AQR_LOCAL_JRR_f3_desc:0 "The march's armouries contain rifles whose labels describe their former owners more accurately than their ammunition. Armourers will sort serviceable weapons from salvage and collect scattered spare parts at working benches. The job requires patience, gauges and honest inventories. It gives the garrisons usable equipment without another officer discovering that his newest delivery cannot be fired."
 HSM_AQR_LOCAL_JRR_f4:0 "The Wagon Must Reach the Field"
 HSM_AQR_LOCAL_JRR_f4_desc:0 "Westkeep has trained officers for wars far beyond its villages, but a polished map exercise cannot replace a loaded wagon on a muddy road. The military instructors will take clerks, drivers and runners into the field together. Their task is to deliver a practice consignment, report its arrival and discover which assumptions failed along the way."
 HSM_AQR_LOCAL_VIN_f1:0 "The Carts Before Dawn"
 HSM_AQR_LOCAL_VIN_f1_desc:0 "Before the cafés open, carts squeeze past Vinovia's market stalls with flour, vegetables and timber. A blocked culvert can delay half a district's deliveries. The road keepers know which stretches fail first, although nobody has asked them together. Bringing their repairs onto one schedule will give the morning market a chance to begin before the arguments do."
 HSM_AQR_LOCAL_VIN_f2:0 "Both Names for the Street"
 HSM_AQR_LOCAL_VIN_f2_desc:0 "A visitor's letter has circled the town because the street on its envelope bears one name in official records and another in everyday Vinovian speech. Postmasters, midwives and market clerks will compare the names they actually use. A directory made from their corrections should help a messenger find the right door without first finding someone to translate it."
 HSM_AQR_LOCAL_VIN_f3:0 "The Gunsmiths' Shared Bench"
 HSM_AQR_LOCAL_VIN_f3_desc:0 "Vinovia's gunsmiths inherit weapons as readily as their customers inherit family stories. A rifle awaiting a spring may lie beside another whose stock alone remains sound. The garrison armourer proposes an afternoon when private workshops bring their repairable pieces together. Experienced claws can recover serviceable weapons from these mismatched heaps without waiting for an entirely new consignment."
 HSM_AQR_LOCAL_VIN_f4:0 "A Wagon Through Every Gate"
 HSM_AQR_LOCAL_VIN_f4_desc:0 "A supply wagon that passes the barracks gate may still stick beneath the arch of a village granary. Vinovia's quartermasters will walk their routes with the carters who know those obstacles by heart. Loading drills beside the actual bridges and storehouses should expose mistakes while a spilled sack remains an embarrassment rather than a hungry company's only supper."
 HSM_AQR_REC_accession_tt:0 "Transfer our owned territory and armed forces to the inviting Aquileian government. Our separate country and playable campaign end. Acceptance is valid only while both governments meet the invitation's terms; third-party subjects and foreign occupation are excluded."
 HSM_AQR_REC_articles_req_tt:0 "Independent Aquileia is at peace and controls its capital; the peripheral conference has been held."
 HSM_AQR_REC_articles_tt:0 "Gain cores only on original Pomovarran, Flowenan, Greifwald, Fezeran and Northern Tribal territory that we own and fully control. The articles also cover later acquisitions when peace and full control return. This transfers no foreign territory and does not integrate subjects automatically."
 HSM_AQR_REC_claim_tt:0 "Gain an annexation war goal against the government which refused this invitation. Requires peace, its independence, and no common faction, non-aggression pact, truce or guarantee from us. War is not declared."
 HSM_AQR_REC_conference_req_tt:0 "Independent Aquileia is at peace and owns and fully controls its original heartland and the four provinces. Emergency reconstruction is complete. A provincial claimant must also complete its national settlement; native Aquileia must have completed its opening political course and ended the revolution."
 HSM_AQR_REC_conference_tt:0 "Invite eligible Pomovarra, Flowena, Greifwald, Fezera and the Northern Tribes to join one country. Each government can refuse freely. Countries at war, foreign subjects or faction partners, rulers with subjects, and countries with disputed territorial control receive no offer. Invitations expire after 60 days."
 HSM_AQR_REC_crisis:0 "The Peace Has No Roof"
 HSM_AQR_REC_crisis_desc:0 "The proclamation has reached towns whose roofs, ration lists and workplaces were destroyed long before the delegates arrived. Victory has placed their repair on one government's desk."
 HSM_AQR_REC_demobilisation:0 "Service Papers and Workshop Keys"
 HSM_AQR_REC_demobilisation_desc:0 "Discharge orders must arrive with recognised service records and a place to report for civilian work. The army will keep its trained reserve; towns will receive their craftspeople without waiting for each colonel to release them at his convenience."
 HSM_AQR_REC_demobilisation_req_tt:0 "The previous reconstruction stage is complete. Independent Aquileia controls its capital and is at peace. The reconstruction crisis is active; reserve 50 political power."
 HSM_AQR_REC_food_networks:0 "Bread on a Timetable"
 HSM_AQR_REC_food_networks_desc:0 "The harvest must travel by contracts which survive the next requisition order. Market towns, mills and railway offices will agree delivery days and storage responsibilities. Empty wagons should no longer leave a full granary while the next district queues for bread."
 HSM_AQR_REC_food_networks_req_tt:0 "The previous reconstruction stage is complete. Independent Aquileia controls its capital and is at peace. The reconstruction crisis is active; reserve 50 political power."
 HSM_AQR_REC_peripheral_articles:0 "Rights Entered in the Register"
 HSM_AQR_REC_peripheral_articles_desc:0 "Accession articles have to survive their ceremonial reading. Courts will recognise municipal records, officials will reconcile service histories, and the treasury will publish the same obligations for old provinces and new districts. A border on a minister's map grants no authority over a town which the government does not actually administer."
 HSM_AQR_REC_peripheral_conference:0 "Seats beyond the Old Provinces"
 HSM_AQR_REC_peripheral_conference_desc:0 "The neighbours have watched the new government restore its own towns. They are entitled to ask whether the founding articles would protect theirs. The conference will set out the courts and local institutions which accession preserves, and the national authority which a signature would recognise. An empty chair will not be counted as consent."
 HSM_AQR_REC_postwar_housing:0 "A Roof for the Returning"
 HSM_AQR_REC_postwar_housing_desc:0 "Municipal surveyors will distinguish ruined houses from abandoned claims. Timber and brick will go first to buildings which can shelter families before winter. The register will record who received help and who is still waiting."
 HSM_AQR_REC_postwar_housing_req_tt:0 "The provincial claimant has established a national civil service, or Aquileia has completed its opening political course and the revolution has ended. Independent Aquileia controls its capital and is at peace. The reconstruction crisis is active; reserve 75 political power."
 HSM_AQR_REC_recall_conference:0 "Reconvene the Peripheral Conference"
 HSM_AQR_REC_recall_conference_desc:0 "Some chairs remained empty while neighbouring governments fought their own wars or could not speak for their territory. Other invitations lapsed without an answer. The chancery will send the articles when those obstacles have passed. Replies already received will remain in the record; reopening the hall does not cancel a neighbour's refusal."
 HSM_AQR_REC_recall_req_tt:0 "The united Aquileian government is independent, at peace and controls its capital; the conference has been held. At least one eligible peripheral government has no live invitation and has not refused us. Unanswered invitations can be renewed after 60 days. The recipient must be at peace, independent or our subject, outside a foreign faction, without subjects, and in full control of its owned territory."
 HSM_AQR_REC_returning_workers:0 "Workers without Deliveries"
 HSM_AQR_REC_returning_workers_desc:0 "Demobilisation has brought hands back to the workshops. Their first wages will mean little until food can reach the towns regularly."
 HSM_AQR_REC_roofs:0 "Shelter before Winter"
 HSM_AQR_REC_roofs_desc:0 "Families have somewhere to sleep again. Workshops still lack their workers, and too many soldiers wait for orders which will never come."
 HSM_AQR_RESTORE_open_tt:0 "The assembly considers restoring the original national movement or retaining our own Aquileian government. This does not transfer power by itself."
 HSM_AQR_RESTORE_req_tt:0 "Independent Aquileia at peace; the former centre is gone. A living leader of our victorious national movement is available to us. Own and fully control the capital and retain another province."
 HSM_AQR_RESTORE_transfer_tt:0 "Continue as Aquileia with its original political focus tree. All our territory and armed forces join it. The national movement retains its own succession or republican political contest; our provincial government ends. No foreign territory or character is taken."
 HSM_AQR_VIN_abc:0 "ABC Civic Council"
 HSM_AQR_VIN_abc_government_tt:0 "Government: Communist. Leader: $HSM_AQR_VIN_abc$. Ruling support: §Y55%§!; other currents: §Y15%§! each. No scheduled national elections."
 HSM_AQR_VIN_abc_organise:0 "Schools Beyond the Cities"
 HSM_AQR_VIN_abc_organise_desc:0 "The books have arrived, but rain comes through the roof of the village school. ABC volunteers who expected to give lessons find themselves borrowing ladders instead. Their argument for a different social order will be heard more readily if they return to finish the work. Other provinces will judge the programme by children learning here, not by the promise on its posters."
 HSM_AQR_VIN_abc_organise_effect:0 "Political power: §G+35§!."
 HSM_AQR_VIN_abc_organise_req_tt:0 "This programme is active and our regional administration is functioning."
 HSM_AQR_VIN_abc_party:0 "Friends of the ABC"
 HSM_AQR_VIN_abc_pledge:0 "Join Campus and Workshop"
 HSM_AQR_VIN_abc_pledge_desc:0 "An ABC speaker has spent the first meeting after victory explaining the future to workers asking about tomorrow's wages. At the next meeting, the workers will speak first. The students need to learn what governing Vinovia requires before asking Aquileia to follow their example. Their hosts have plenty to teach them, beginning with a workshop whose owner has disappeared."
 HSM_AQR_VIN_abc_pledge_effect:0 "Adopt the post-revolutionary programme."
 HSM_AQR_VIN_abc_pledge_req_tt:0 "The victorious regional movement has endorsed this programme; no competing programme is active."
 HSM_AQR_VIN_abc_programme_tt:0 "Modify §Y$HSM_AQR_compact$§! by:\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §G+10.0%§!\n$MODIFIER_MOBILIZATION_SPEED$: §G+10.0%§!"
 HSM_AQR_VIN_abc_ratify_again_req_tt:0 "The winning programme can be ratified; reserve 50 political power."
 HSM_AQR_VIN_abc_resume_req_tt:0 "Choose the ABC programme through an explicit commitment. Ratification requires Vinovia's revolutionary camp to prevail and peace to return."
 HSM_AQR_VIN_abc_settle:0 "Elect Local Councils"
 HSM_AQR_VIN_abc_settle_desc:0 "The neighbours who carried messages during the fighting now bring their own proposals to the ABC meeting. They want a say in the government taking shape around them. Councils rooted in those streets and villages could give the movement a programme worth presenting across Aquileia. The students must begin by accepting amendments from people who never sat beside them in a lecture hall."
 HSM_AQR_VIN_abc_settle_effect:0 "The constituent assembly will meet. Ratification costs §Y50§! political power and establishes the government and its programme."
 HSM_AQR_VIN_abc_settle_req_tt:0 "The chosen programme can form a government in peacetime or during our war for Aquileia."
 HSM_AQR_VIN_chevaliers:0 "Vinovian Council of Communities"
 HSM_AQR_VIN_chevaliers_government_tt:0 "Government: Non-aligned. Leader: $HSM_AQR_VIN_chevaliers$. Ruling support: §Y55%§!; other currents: §Y15%§! each. No scheduled national elections."
 HSM_AQR_VIN_chevaliers_organise:0 "Sustain Community Charities"
 HSM_AQR_VIN_chevaliers_organise_desc:0 "A Chevalier helping at the kitchen meets a family displaced from another province. Their account of a damaged school sounds painfully familiar. The movement has learned to defend Vinovian institutions; it can also recognise their worth elsewhere. The next appeal for supplies will include these newcomers, giving its organisers a practical answer when asked what they owe to the rest of Aquileia."
 HSM_AQR_VIN_chevaliers_organise_effect:0 "Political power: §G+35§!."
 HSM_AQR_VIN_chevaliers_organise_req_tt:0 "This programme is active and our regional administration is functioning."
 HSM_AQR_VIN_chevaliers_party:0 "Chevaliers of Fidelity"
 HSM_AQR_VIN_chevaliers_pledge:0 "Muster the Local Guard"
 HSM_AQR_VIN_chevaliers_pledge_desc:0 "The Chevaliers' volunteers have returned from the fighting with rifles and conflicting instructions. A shopkeeper asks which captain can give her the key to the requisitioned storeroom. Before speaking for Vinovia in a national settlement, the movement must answer her. Its guards should protect the daily life their banners celebrate, and learn when a neighbour no longer needs a soldier's permission."
 HSM_AQR_VIN_chevaliers_pledge_effect:0 "Adopt the post-revolutionary programme."
 HSM_AQR_VIN_chevaliers_pledge_req_tt:0 "The victorious regional movement has endorsed this programme; no competing programme is active."
 HSM_AQR_VIN_chevaliers_programme_tt:0 "Modify §Y$HSM_AQR_compact$§! by:\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+10.0%§!\n$MODIFIER_ARMY_ORG_FACTOR$: §G+5.0%§!"
 HSM_AQR_VIN_chevaliers_ratify_again_req_tt:0 "The winning programme can be ratified; reserve 50 political power."
 HSM_AQR_VIN_chevaliers_resume_req_tt:0 "Choose the Chevaliers' programme of Vinovian self-government. Ratification requires revolutionary victory and peace, despite the movement's conservative outlook."
 HSM_AQR_VIN_chevaliers_settle:0 "Prepare a Federal Programme"
 HSM_AQR_VIN_chevaliers_settle_desc:0 "The Chevaliers' delegates spread Vinovia's proposed charter beside letters from other provinces. Their neighbours ask whether its protections could apply beyond their homeland. A federal programme for Aquileia would require the movement to accept obligations as well as guarantees. They will begin by making their own provincial government answerable, then seek partners willing to offer the same protection to one another."
 HSM_AQR_VIN_chevaliers_settle_effect:0 "The constituent assembly will meet. Ratification costs §Y50§! political power and establishes the government and its programme."
 HSM_AQR_VIN_chevaliers_settle_req_tt:0 "The chosen programme can form a government in peacetime or during our war for Aquileia."
 HSM_AQR_VIN_gadiffer_government_tt:0 "Government: Non-aligned. Leader: $VIN_duke_gadiffer_discret$. Ruling support: §Y55%§!; other currents: §Y15%§! each. No scheduled national elections."
 HSM_AQR_VIN_gadiffer_organise:0 "Meet Local Associations"
 HSM_AQR_VIN_gadiffer_organise_desc:0 "An association once described as a revolutionary cell has kept its kitchen open throughout the fighting. Its organiser arrives at Gadiffer's palace carrying the unpaid bills. The duke will hear her before the official who wrote the warning. If Vinovia is to speak credibly in the royal settlement, its government must know whose work actually held its communities together."
 HSM_AQR_VIN_gadiffer_organise_effect:0 "Political power: §G+35§!."
 HSM_AQR_VIN_gadiffer_organise_req_tt:0 "This programme is active and our regional administration is functioning."
 HSM_AQR_VIN_gadiffer_party:0 "Gadiffer's Court"
 HSM_AQR_VIN_gadiffer_pledge:0 "Relieve Hardship"
 HSM_AQR_VIN_gadiffer_pledge_desc:0 "The fighting is over, but Gadiffer's carriage still passes a bread queue where nobody cheers the ducal colours. A miller has sent three letters about a bridge damaged during the unrest. The duke wants the fourth brought directly to him. Restoring confidence in the crown begins with flour reaching the streets, not another appeal to the patience of hungry families."
 HSM_AQR_VIN_gadiffer_pledge_effect:0 "Adopt the post-revolutionary programme."
 HSM_AQR_VIN_gadiffer_pledge_req_tt:0 "The victorious regional movement has endorsed this programme; no competing programme is active."
 HSM_AQR_VIN_gadiffer_programme_tt:0 "Modify §Y$HSM_AQR_compact$§! by:\n$MODIFIER_LOCAL_RESOURCES_FACTOR$: §G+10.0%§!\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10.0%§!"
 HSM_AQR_VIN_gadiffer_ratify_again_req_tt:0 "The winning programme can be ratified; reserve 50 political power."
 HSM_AQR_VIN_gadiffer_resume_req_tt:0 "Choose Gadiffer's loyalist programme. Ratification requires the monarchist camp to prevail and Vinovia to be at peace."
 HSM_AQR_VIN_gadiffer_settle:0 "Limit Royal Requisitions"
 HSM_AQR_VIN_gadiffer_settle_desc:0 "Royal victory has not cleared the villages' accounts. Wagons still arrive carrying demands written for armies that no longer need to march. Gadiffer will bring the receipts before his advisers and establish how Vinovia should answer future requests. He intends to serve the Discret crown with a province able to keep its promises, rather than exhaust it with impossible ones."
 HSM_AQR_VIN_gadiffer_settle_effect:0 "The constituent assembly will meet. Ratification costs §Y50§! political power and establishes the government and its programme."
 HSM_AQR_VIN_gadiffer_settle_req_tt:0 "The chosen programme can form a government in peacetime or during our war for Aquileia."
 HSM_AQR_VIN_sis:0 "Council of Law and Education"
 HSM_AQR_VIN_sis_government_tt:0 "Government: Democratic / Harmony. Leader: $HSM_AQR_VIN_sis$. Ruling support: §Y55%§!; other currents: §Y15%§! each. Elections permitted."
 HSM_AQR_VIN_sis_organise:0 "Protect the Independent Press"
 HSM_AQR_VIN_sis_organise_desc:0 "The editor who once printed the society's arguments now publishes a complaint against one of its organisers. Several colleagues want the article withdrawn. Others remind them that victory has made their words powerful enough to silence a critic. Vinovia's contribution to the national republic should begin with a newspaper free to embarrass the very people who promised to protect it."
 HSM_AQR_VIN_sis_organise_effect:0 "Political power: §G+35§!."
 HSM_AQR_VIN_sis_organise_req_tt:0 "This programme is active and our regional administration is functioning."
 HSM_AQR_VIN_sis_party:0 "Society of Intellectual Students"
 HSM_AQR_VIN_sis_pledge:0 "Gather Jurists and Teachers"
 HSM_AQR_VIN_sis_pledge_desc:0 "Letters from former students have begun arriving again now that the fighting is over. One describes a court without records; another, a school whose teacher has not returned. The society will bring their authors together to work through these problems. The national republic needs more than sympathetic speeches from Vinovia: it needs people who can make its promises useful in ordinary offices."
 HSM_AQR_VIN_sis_pledge_effect:0 "Adopt the post-revolutionary programme."
 HSM_AQR_VIN_sis_pledge_req_tt:0 "The victorious regional movement has endorsed this programme; no competing programme is active."
 HSM_AQR_VIN_sis_programme_tt:0 "Modify §Y$HSM_AQR_compact$§! by:\n$MODIFIER_POLITICAL_POWER_FACTOR$: §G+10.0%§!\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §G+5.0%§!"
 HSM_AQR_VIN_sis_ratify_again_req_tt:0 "The winning programme can be ratified; reserve 50 political power."
 HSM_AQR_VIN_sis_resume_req_tt:0 "Choose the SIS programme of republican institutions. Ratification requires Vinovia's revolutionary camp to prevail and peace to return."
 HSM_AQR_VIN_sis_settle:0 "Prepare Civil Administration"
 HSM_AQR_VIN_sis_settle_desc:0 "Society members arrive at the provincial offices with drafts amended during their first weeks of peace. The clerks ask how those promises should change the petitions already waiting on their desks. Answering them will give Vinovia something useful to bring into national republican politics. The society intends to support that cause with a working administration, and with officials prepared to admit a mistake."
 HSM_AQR_VIN_sis_settle_effect:0 "The constituent assembly will meet. Ratification costs §Y50§! political power and establishes the government and its programme."
 HSM_AQR_VIN_sis_settle_req_tt:0 "The chosen programme can form a government in peacetime or during our war for Aquileia."
 HSM_AQR_affairs:0 "Provincial Affairs"
 HSM_AQR_affairs_desc:0 "The assembly can return to unfinished constitutional business. The revolution and the province's relations with the capital determine which mandates remain viable."
 HSM_AQR_border:0 "The Border Articles"
 HSM_AQR_border_desc:0 "Citizenship cannot be conveyed by moving a line on a staff map. Courts, schools and municipal councils need to know which law they will use tomorrow. Delegates from the border will sign the articles only after their place in the new settlement has been stated."
 HSM_AQR_border_req_tt:0 "Peace; the dependent Herzland government exists; own and fully control at least one of the four border districts."
 HSM_AQR_border_tt:0 "The border delegates will report on the new citizenship articles."
 HSM_AQR_break_resistance:0 "Enforce the National Claim"
 HSM_AQR_break_resistance_desc:0 "The assembly will hear the case for compulsion. Those who support it must name the government they intend to remove and explain what protections will remain for its people. A national seal cannot excuse an unnamed and endless war."
 HSM_AQR_break_resistance_tt:0 "Gain annexation war goals against independent Rila, Westkeep, Pridea or Vinovia which refused accession. No goal is granted against a faction partner or a country protected by our pact or truce. War is not declared automatically."
 HSM_AQR_campaign_national_req_tt:0 "Our government has proclaimed Aquileia and controls its capital."
 HSM_AQR_campaign_req_tt:0 "Our ratified provincial government remains in power."
 HSM_AQR_common_market:0 "Roads to the Weekly Market"
 HSM_AQR_common_market_bonus_tt:0 "Modify §Y$HSM_AQR_compact$§! by:\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+10.0%§!"
 HSM_AQR_common_market_desc:0 "Every district knows a bridge which exists only in the ministry's records. Surveyors will travel the actual roads, settle maintenance obligations and reconnect workshops to the towns which need their products."
 HSM_AQR_compact:0 "The Provincial Settlement"
 HSM_AQR_compact_desc:0 "The founding programme and the institutions built since the revolution shape the state."
 HSM_AQR_constitution_a_tt:0 "Modify §Y$HSM_AQR_compact$§! by:\n$MODIFIER_STABILITY_FACTOR$: §G+5.0%§!\n$MODIFIER_POLITICAL_POWER_FACTOR$: §G+10.0%§!"
 HSM_AQR_constitution_b_tt:0 "Modify §Y$HSM_AQR_compact$§! by:\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+10.0%§!\n$MODIFIER_ARMY_ORG_FACTOR$: §G+5.0%§!\n$MODIFIER_STABILITY_FACTOR$: §R-5.0%§!"
 HSM_AQR_continue_centre_tt:0 "Continue playing as Aquileia. Our territory and armed forces join it; its incumbent, political course and national focus progress are preserved."
 HSM_AQR_defer:0 "Reconvene when the treasury is ready."
 HSM_AQR_foundation_req_tt:0 "Our regional administration is functioning."
 HSM_AQR_herzland_guarantees:0 "A Treaty with a Signature"
 HSM_AQR_herzland_guarantees_desc:0 "The Herzland ministers will receive an office of their own at the treaty conference. The agreement must identify the obligations owed to Aquileia and those which Aquileia owes in return. Without that second column, a dependent government is only an occupation office with a different sign."
 HSM_AQR_invite_regions:0 "Articles for the Other Provinces"
 HSM_AQR_invite_regions_desc:0 "The invitation carries the same articles that limited our own provincial government. Envoys must explain what will be retained locally, what passes to the national administration, and who will hear a complaint when the agreement is broken."
 HSM_AQR_invite_tt:0 "Send accession proposals to the other independent regions and our regional subjects at peace. Acceptance transfers their territory and armed forces; refusal permits a separate political response."
 HSM_AQR_jeanne_discret:0 "Marquise Jeanne Discret"
 HSM_AQR_local_credit:0 "Credit without Patrons"
 HSM_AQR_local_credit_desc:0 "A ruined harvest should not decide which family owns the village for the next generation. Local credit offices will inspect the accounts and make reconstruction loans available beyond the circle of court acquaintances."
 HSM_AQR_merge_centre_tt:0 "Join Aquileia with our territory and armed forces. Its present leadership and national campaign continue."
 HSM_AQR_national_army:0 "Commissions Recognised by All"
 HSM_AQR_national_army_bonus_tt:0 "Modify §Y$HSM_AQR_compact$§! by:\n$MODIFIER_ARMY_ORG_FACTOR$: §G+5.0%§!\n$MODIFIERS_ARMY_DEFENCE_FACTOR$: §G+5.0%§!"
 HSM_AQR_national_army_desc:0 "A regiment should receive its orders through a chain of command which exists on paper as well as in the colonel's memory. Provincial veterans will keep their service records; their officers must accept a common training and supply system."
 HSM_AQR_national_mandate:0 "Who Speaks for Aquileia?"
 HSM_AQR_national_mandate_desc:0 "Relations with the capital have broken down. Provincial delegates now argue that the state must be rebuilt around their settlement. Such a claim needs more than a proclamation: it needs a public account of why the old government has lost the right to command."
 HSM_AQR_national_recovery:0 "Reopen the Workshops"
 HSM_AQR_national_recovery_desc:0 "The treasury will publish which workshops receive reconstruction credit and why. A minister who can point to a reopened yard or a repaired mill has a stronger answer to the villages than another victory speech."
 HSM_AQR_national_req_tt:0 "Our regional government has proclaimed Aquileia and remains independent."
 HSM_AQR_national_schools:0 "The Next Generation of Teachers"
 HSM_AQR_national_schools_desc:0 "The first provincial schools have sent their best pupils to teacher training. They arrive speaking differently and remembering different sides of the revolution. Their classrooms must give the next generation a country it can understand without demanding that every family forget its own history."
 HSM_AQR_national_services:0 "One Civil Service"
 HSM_AQR_national_services_bonus_tt:0 "Modify §Y$HSM_AQR_compact$§! by:\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+10.0%§!\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$: §G+10.0%§!"
 HSM_AQR_national_services_desc:0 "Provincial clerks have brought incompatible forms and very similar grievances. A common service will recognise their experience while ending the practice of charging a second fee at every former frontier."
 HSM_AQR_national_settlement:0 "Promises beyond the Province"
 HSM_AQR_national_settlement_bonus_tt:0 "Modify §Y$HSM_AQR_compact$§! by:\n$MODIFIER_STABILITY_FACTOR$: §G+5.0%§!\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §G-5.0%§!"
 HSM_AQR_national_settlement_desc:0 "The founding delegates return to the capital with letters from their districts. They will compare the first articles with the institutions now governing the whole country. The argument is no longer about who won the revolution, but about what victory has made possible for the people who survived it."
 HSM_AQR_native_selection_tt:0 "Confirm the programme supported during the revolution. Its focus branch becomes available; the constituent assembly will establish the government."
 HSM_AQR_native_settlement_retry_JEB:0 "Reconvene the Provincial Settlement"
 HSM_AQR_native_settlement_retry_JEB_desc:0 "The delegates can return to the unfinished discussion. Their original preparations remain the basis of the talks; later committee manoeuvres do not rewrite that record."
 HSM_AQR_native_settlement_retry_JEB_tt:0 "The native outcome is recorded, peace has returned and the postwar opening is complete. An available programme can be discussed; no settlement is already ratified, selected or awaiting an answer."
 HSM_AQR_native_settlement_retry_JFT:0 "Reconvene the Provincial Settlement"
 HSM_AQR_native_settlement_retry_JFT_desc:0 "The delegates can return to the unfinished discussion. Their original preparations remain the basis of the talks; later committee manoeuvres do not rewrite that record."
 HSM_AQR_native_settlement_retry_JFT_tt:0 "The native outcome is recorded, peace has returned and the postwar opening is complete. An available programme can be discussed; no settlement is already ratified, selected or awaiting an answer."
 HSM_AQR_native_settlement_retry_JRR:0 "Reconvene the Provincial Settlement"
 HSM_AQR_native_settlement_retry_JRR_desc:0 "The delegates can return to the unfinished discussion. Their original preparations remain the basis of the talks; later committee manoeuvres do not rewrite that record."
 HSM_AQR_native_settlement_retry_JRR_tt:0 "The native outcome is recorded, peace has returned and the postwar opening is complete. An available programme can be discussed; no settlement is already ratified, selected or awaiting an answer."
 HSM_AQR_native_settlement_retry_VIN:0 "Reconvene the Provincial Settlement"
 HSM_AQR_native_settlement_retry_VIN_desc:0 "The delegates can return to the unfinished discussion. Their original preparations remain the basis of the talks; later committee manoeuvres do not rewrite that record."
 HSM_AQR_native_settlement_retry_VIN_tt:0 "The native outcome is recorded, peace has returned and the postwar opening is complete. An available programme can be discussed; no settlement is already ratified, selected or awaiting an answer."
 HSM_AQR_offer_req_tt:0 "Both governments still exist and are at peace; the sender remains independent Aquileia; we are independent or its subject."
 HSM_AQR_opening:0 "After the Revolution"
 HSM_AQR_opening_desc:0 "The fighting has settled who holds the province, but the victorious camp still owes its neighbours an answer. Delegates bring the promises made in clubs, town halls and officers’ quarters to the same table. They must decide which of those promises can now become a government."
 HSM_AQR_opening_effect_tt:0 "The provincial assembly will discuss the surviving postwar programmes."
 HSM_AQR_opening_req_tt:0 "Completes automatically after the revolution; our local government remains in place."
 HSM_AQR_partition:0 "A Government in Griffenheim"
 HSM_AQR_partition_desc:0 "The occupation offices cannot administer another country forever. Representatives from the Herzland towns will assemble in Griffenheim to form a dependent government, with its own officials and a written division of responsibilities. The border districts require a separate agreement."
 HSM_AQR_partition_req_tt:0 "Peace; independent Aquileia; the old Empire no longer exists; we or our Herzland subject own and fully control Griffenheim. Herzland is absent or already our subject."
 HSM_AQR_partition_tt:0 "Transfer our fully controlled Herzland territories to the dependent government, retaining $STATE_378$, $STATE_399$, $STATE_447$ and $STATE_497$. Its government follows our constitutional settlement."
 HSM_AQR_peace_req_tt:0 "The country is at peace."
 HSM_AQR_postpone_tt:0 "The proposal remains available in provincial affairs. No political power is spent."
 HSM_AQR_proclaim:0 "An Aquileian Government"
 HSM_AQR_proclaim_desc:0 "The provincial seal lies beside the seal recovered from the capital. Keeping both would be easy; persuading distant towns that the new administration belongs to them will be harder. The proclamation must carry obligations as well as a name."
 HSM_AQR_proclaim_req_tt:0 "Ratified government, independence and peace; the old Aquileia no longer exists; own and fully control Aquileia (377)."
 HSM_AQR_proclaim_tt:0 "Adopt the name, flag and colour of Aquileia appropriate to our government."
 HSM_AQR_provincial_schools:0 "A Classroom in Every District"
 HSM_AQR_provincial_schools_desc:0 "Teachers cannot live on promises. Municipal councils will repair classrooms, organise training and agree how to pay the people who stay when the ceremonial visitors have gone."
 HSM_AQR_ratify_again_JEB_cocardiers:0 "Reconvene: The Cocardiers"
 HSM_AQR_ratify_again_JEB_cocardiers_desc:0 "Two orders have reached the same workshop, each bearing a different committee's seal. The Cocardiers will settle who speaks for their government and who answers when that voice is wrong. They intend to offer this programme to the whole republic. Rila must first show that a common executive can protect a victory without leaving its citizens permanently under siege."
 HSM_AQR_ratify_again_JEB_constitutional:0 "Reconvene: Michel's Constitutional Settlement"
 HSM_AQR_ratify_again_JEB_constitutional_desc:0 "The charter negotiated since Michel's return still leaves one question unsettled: what may ministers do between meetings of the assembly? Delegates bring examples from the first weeks of peace, when delayed decisions left petitions unanswered. Their agreement must work in Rila before its advocates can present it to Aquileia. Michel will have to earn that wider hearing alongside them."
 HSM_AQR_ratify_again_JEB_moderate:0 "Reconvene: The Moderate Clubs"
 HSM_AQR_ratify_again_JEB_moderate_desc:0 "The committee's waiting room remains full long after the fighting. Families seek prisoners; former enemies offer to surrender weapons; witnesses name those responsible for killings. The moderates must distinguish political defeat from a charge that belongs before a court. When their delegates join the national republican movement, this record will matter more than another speech about the rule of law."
 HSM_AQR_ratify_again_JEB_royal:0 "Reconvene: Michel's Loyalists"
 HSM_AQR_ratify_again_JEB_royal_desc:0 "On Michel's desk lie wartime orders whose authors can scarcely explain the powers they granted. The captains want clear instructions; the magistrates want an end to searches without warrants. Settling their dispute will give Rila a government fit for peace. Michel intends its work to strengthen the Discret crown, beginning with subjects who can trust the next royal signature."
 HSM_AQR_ratify_again_JFT_communes:0 "Reconvene: The Communes Keep Their Promise"
 HSM_AQR_ratify_again_JFT_communes_desc:0 "Peace has returned the militia's flour carts to districts with very different needs. One assembly wants its stores back; another has lost its ovens. Their delegates must settle how shared supplies are governed before offering the same arrangement to communes throughout Aquileia. Pridea will be the starting point for a wider federation, and this hungry morning its first practical test."
 HSM_AQR_ratify_again_JFT_dennis:0 "Reconvene: The Admiral's City"
 HSM_AQR_ratify_again_JFT_dennis_desc:0 "A patrol still accompanies every shift into the dockyard. Dennis receives a petition from foremen who cannot repair ships under arrangements made for a siege. His veterans fear losing the harbour; the workers want ordinary working conditions restored. Before advancing his claim to lead Aquileia, the admiral must decide which parts of his command belong in a civilian government."
 HSM_AQR_ratify_again_JFT_enfants:0 "Reconvene: The Forgotten Children of Aquileia"
 HSM_AQR_ratify_again_JFT_enfants_desc:0 "The fighting is over, and the security cell brings its wartime files to the provisional assembly. One suspect helped sell the missing shipment; another merely disputed an organiser's orders. Their names appear on the same page. Before offering its programme to Aquileia, the movement must decide who may investigate opponents and what evidence separates disagreement from betrayal."
 HSM_AQR_ratify_again_JFT_fja:0 "Reconvene: The Coalition before the Voters"
 HSM_AQR_ratify_again_JFT_fja_desc:0 "Peace has ended the reason for postponing every disagreement. The communards bring proposals for workplace councils; the FJA brings an electoral timetable and a programme of social legislation. Both need a government able to reopen the factories and keep the hospitals supplied. Their provisional cabinet must establish how decisions are made now, and how the voters may replace its members later."
 HSM_AQR_ratify_again_JRR_absolutist:0 "Reconvene: The Marquise's Authority"
 HSM_AQR_ratify_again_JRR_absolutist_desc:0 "The fighting has ended, and the nobles arrive with the promises they made to Jeanne. Some expect appointments before damaged villages receive assistance. She will summon their delegates to settle the obligations of her government. Westkeep must show what her royal leadership could offer Aquileia beyond a family name, beginning with duties that bind the court's own supporters."
 HSM_AQR_ratify_again_JRR_coalition:0 "Reconvene: Jeanne's Provincial Compact"
 HSM_AQR_ratify_again_JRR_coalition_desc:0 "Peace has returned, but the commandant still signs the permits for town meetings. Municipal delegates bring Jeanne the coalition's printed compact and ask who will sign tomorrow. Their settlement must place the garrisons under civilian authority while preserving her royal leadership. Before proposing it to the wider Aquileian movement, they must show how a town can challenge a lawful order."
 HSM_AQR_ratify_again_JRR_colette:0 "Reconvene: Colette's National Revolution"
 HSM_AQR_ratify_again_JRR_colette_desc:0 "With peace restored, the headquarters receives its first request to surrender a factory requisition. Colette's quartermaster still needs the machinery; the workers want to reopen ordinary production. The improvised wartime command requires a political settlement before either side will yield. The delegates are coming to decide which powers remain with the officers, and which belong to the revolution's civilian partners."
 HSM_AQR_ratify_again_VIN_abc:0 "Reconvene: Les Amis des ABC"
 HSM_AQR_ratify_again_VIN_abc_desc:0 "The neighbours who carried messages during the fighting now bring their own proposals to the ABC meeting. They want a say in the government taking shape around them. Councils rooted in those streets and villages could give the movement a programme worth presenting across Aquileia. The students must begin by accepting amendments from people who never sat beside them in a lecture hall."
 HSM_AQR_ratify_again_VIN_chevaliers:0 "Reconvene: The Chevaliers of Fidelity"
 HSM_AQR_ratify_again_VIN_chevaliers_desc:0 "The Chevaliers' delegates spread Vinovia's proposed charter beside letters from other provinces. Their neighbours ask whether its protections could apply beyond their homeland. A federal programme for Aquileia would require the movement to accept obligations as well as guarantees. They will begin by making their own provincial government answerable, then seek partners willing to offer the same protection to one another."
 HSM_AQR_ratify_again_VIN_gadiffer:0 "Reconvene: Gadiffer's Loyal Duchy"
 HSM_AQR_ratify_again_VIN_gadiffer_desc:0 "Royal victory has not cleared the villages' accounts. Wagons still arrive carrying demands written for armies that no longer need to march. Gadiffer will bring the receipts before his advisers and establish how Vinovia should answer future requests. He intends to serve the Discret crown with a province able to keep its promises, rather than exhaust it with impossible ones."
 HSM_AQR_ratify_again_VIN_sis:0 "Reconvene: The Society of Intellectual Students"
 HSM_AQR_ratify_again_VIN_sis_desc:0 "Society members arrive at the provincial offices with drafts amended during their first weeks of peace. The clerks ask how those promises should change the petitions already waiting on their desks. Answering them will give Vinovia something useful to bring into national republican politics. The society intends to support that cause with a working administration, and with officials prepared to admit a mistake."
 HSM_AQR_regional_articles:0 "Articles of Provincial Government"
 HSM_AQR_regional_articles_bonus_tt:0 "Modify §Y$HSM_AQR_compact$§! by:\n$MODIFIER_POLITICAL_POWER_FACTOR$: §G+5.0%§!"
 HSM_AQR_regional_articles_desc:0 "Petitions have been collected in rooms where the roof still leaks. They will now become rules: who appoints a magistrate, who audits the treasury, and where a village can appeal when the capital refuses to listen."
 HSM_AQR_resend:0 "Invite the Remaining Delegates"
 HSM_AQR_resend_desc:0 "The chancery keeps a place for provinces which could not answer while they were at war. Their delegates will receive the same articles and the same right to decline."
 HSM_AQR_resend_req_tt:0 "At peace; another independent province or our subject can receive an offer and has not refused it."
 HSM_AQR_resisting_req_tt:0 "An independent region has refused accession; no common faction, pact or truce prevents a response."
 HSM_AQR_restore_national_movement:0 "The Promise behind the Victory"
 HSM_AQR_restore_national_movement_desc:0 "The delegates who followed us to the capital did not all swear the same oath. The national administration must hear them before its first appointments make a temporary arrangement permanent. Restoring an old authority and building a new one both demand a public answer."
 HSM_AQR_resume_JEB_cocardiers:0 "Resume: The Cocardiers"
 HSM_AQR_resume_JEB_cocardiers_desc:0 "The programme can return to the assembly without repeating its earlier grants."
 HSM_AQR_resume_JEB_constitutional:0 "Resume: Michel's Constitutional Settlement"
 HSM_AQR_resume_JEB_constitutional_desc:0 "The programme can return to the assembly without repeating its earlier grants."
 HSM_AQR_resume_JEB_moderate:0 "Resume: The Moderate Clubs"
 HSM_AQR_resume_JEB_moderate_desc:0 "The programme can return to the assembly without repeating its earlier grants."
 HSM_AQR_resume_JEB_royal:0 "Resume: Michel's Loyalists"
