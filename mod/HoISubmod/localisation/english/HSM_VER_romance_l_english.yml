l_english:
 HSM_VER_rosaline_and_montague:0 "Rosaline and Montague"
 HSM_VER_rosaline_and_montague_desc:0 "Lady Rosaline Erie of Bantry and Montague Eyrie, Earl of Verenia, first crossed the frontier with letters they had written themselves. Their shared work in the convention gave their affection a public responsibility. Married by their own choice, they accepted the joint ducal office after Vincent and Iovinus surrendered their competing claims before the representatives of both Houses. Rosaline brings a sharp ear for the question that a petitioner has been prevented from asking; Montague remembers the places a polished court report leaves out. Neither signature alone can speak for their common crown."
 HSM_VER_rosaline_erie:0 "Rosaline Erie"
 HSM_VER_montague_eyrie:0 "Montague Eyrie"
 HSM_VER_ROM_rosaline_petitions:0 "Rosaline Erie"
 HSM_VER_ROM_rosaline_petitions_desc:0 "Rosaline personally supervises the petitions office, making its clerks answer the substance of a complaint before they debate the standing of its author."
 HSM_VER_ROM_montague_provinces:0 "Montague Eyrie"
 HSM_VER_ROM_montague_provinces_desc:0 "Montague coordinates the provincial offices, travelling with surveyors and local representatives until an agreement on paper has a road, a bridge or a working timetable to show for it."
 HSM_VER_ROM_two_signatures:0 "Two Signatures, One Crown"
 HSM_VER_ROM_two_signatures_desc:0 "The two Houses recognise the same ducal office, exercised jointly under the public articles of the union."
 HSM_VER_ROM_doors_of_the_court:0 "The Court's Open Doors"
 HSM_VER_ROM_doors_of_the_court_desc:0 "Regular hearings keep the common court in conversation with those who live under its decisions."
 HSM_VER_ROM_court_on_the_road:0 "A Court on the Road"
 HSM_VER_ROM_court_on_the_road_desc:0 "Visits to the districts give local officials direct access to the common court and keep provincial works moving."
 HSM_VER_ROM_keeper_of_petitions:0 "Keeper of Petitions"
 HSM_VER_ROM_keeper_of_petitions_desc:0 "A patient hearing and a written answer can settle grievances that years of ceremony have left untouched."
 HSM_VER_ROM_provincial_coordinator:0 "Provincial Coordinator"
 HSM_VER_ROM_provincial_coordinator_desc:0 "Bridges and roads are planned across the old frontier, with the districts involved in the work."
 hsm_ver_romance.1.t:0 "The Name Beneath the Letter"
 hsm_ver_romance.1.d:0 "Rosaline arrived at the bridge carrying Montague's latest letter folded into quarters. He had described the river as silver. It was brown, swollen by rain, and she told him so before he could finish his greeting.\n\n'I was trying to persuade you to come,' he admitted.\n\n'You could have asked.'\n\nThe guards remained by the tollhouse. Vincent had authorised her journey; Iovinus had issued a pass for his kinsman. Neither document explained what the two visitors should say once they met. For a while they discussed the weather, the bridge and a particularly disagreeable innkeeper. Then Rosaline took his claw. Montague looked down, as though she had entrusted him with something easily broken.\n\nShe said that she had missed him. He answered without reaching for a comparison to the river. By the time the escort reminded them of the hour, they had arranged another meeting and argued about who would make the longer journey.\n\nTheir report to the courts was brief: both had returned safely. Rosaline's next letter began where the report ended."
 hsm_ver_romance.1.a:0 "This time, ask me yourself."
 hsm_ver_romance.2.t:0 "A Place at the Table"
 hsm_ver_romance.2.d:0 "The convention's secretary had placed Rosaline and Montague beside the flowers. There was room for their names on the seating plan, but none for the packet of district petitions Rosaline put on the table.\n\n'A charming occasion,' the secretary began.\n\n'A miller has been charged twice for the same cart,' she replied. 'Which occasion should he find charming?'\n\nMontague drew the old boundary through the miller's map. He knew the crossing; the tollkeepers on either side still used different books. Together they brought the complaint before the delegates. Vincent asked whether they intended to spend every morning on such small matters. Iovinus wanted to know who would answer when the next district arrived.\n\n'We will,' Montague said, before looking at Rosaline. She nodded, then corrected him: they would need clerks who could keep their promises when they were elsewhere.\n\nThey had two proposals. Rosaline favoured a regular hearing in an open court, with written answers anyone could consult. Montague suggested taking the clerks through the provinces, settling disputes where the witnesses and broken bridges actually stood. Either would give their place beside the flowers a purpose."
 hsm_ver_romance.2.a:0 "Rosaline: Let them find our doors open."
 hsm_ver_romance.2.b:0 "Montague: Let us go where they are waiting."
 hsm_ver_romance.3.t:0 "What We Are Asking"
 hsm_ver_romance.3.d:0 "Montague had rehearsed a speech about the future. Rosaline heard the first sentence, recognised its resemblance to a convention address, and asked him to begin again.\n\n'Will you marry me?'\n\n'Yes. I was beginning to think you would appoint a secretary to ask.'\n\nThey laughed, and for a little while the papers could wait. When they returned to them, their announcement lay beside the proposed articles of common government. Rosaline insisted on carrying the two documents separately to the dukes. She wanted Vincent to hear her answer before he read anyone's recommendation.\n\nThe delegates had a recommendation of their own. The couple had worked together where the older claimants still counted precedents against one another. They should hold the common ducal office once the union was ratified, with each public act bearing both signatures.\n\nVincent read the clause ending his separate claim twice. Iovinus asked who would command the army; the answer referred him to the articles already before the convention. Neither found a hidden exception for himself. At last Vincent laid down his pen. Iovinus followed. They would place their authority in the completed settlement, and attend the wedding as family."
 hsm_ver_romance.3.a:0 "Two promises, each freely made."
 hsm_ver_romance.4.t:0 "The Bells of Both Houses"
 hsm_ver_romance.4.d:0 "The bells began before the procession reached the square. Rosaline could distinguish neither town's tune in the sound, and Montague said that this was probably an improvement. She squeezed his claw hard enough to stop his commentary.\n\nTheir vows were spoken without a secretary. Afterwards they went together into the hall, where the representatives of the united districts waited beside Vincent and Iovinus. The dukes placed their seals on the table. Their renunciations were read aloud, followed by the articles establishing the common office. Vincent watched the witnesses; Iovinus watched the officers as they took the new oath.\n\nRosaline signed first. Montague turned the page so that he could write beside her without smearing the ink. When an attendant brought forward a single ceremonial chair, she asked for another. There was a brief, undignified scrape across the floor. It made the old dukes smile.\n\nOutside, the crowd was still waiting for the newly married pair. Inside, the first petition of their reign lay beneath the two fresh signatures. They agreed to see the crowd, then come back and read it together."
 hsm_ver_romance.4.legacy.d:0 "Rosaline and Montague came to the established court with two documents. One announced their intention to marry. The other carried the representatives' proposal that the common ducal office should pass to them jointly.\n\nTheir letters had survived the quarrel between the Houses. Their affection had grown through meetings that seldom deserved a court announcement: walks cut short by rain, a missed coach, an evening spent correcting one another's recollection of the first crossing. Rosaline recalled the brown river. Montague maintained that it had looked silver from his side.\n\nThe reigning duke asked whether they understood what the second document would cost them. Rosaline answered that she had read the petitions awaiting him. Montague said they intended to share that work as well. The duke had the public articles brought in and the representatives summoned. The handover would be witnessed under the same settlement that had joined the country.\n\nOn their wedding day the bells reached the hall through its open windows. After the vows came the renunciation, the oath of the common court and two signatures. The new rulers stood together to receive the district delegates. For once, nobody had to decide which House should be greeted first."
 hsm_ver_romance.4.a:0 "Rosaline and Montague shall govern together."
 HSM_VER_ROM_meeting_tt:0 "Rosaline and Montague begin their voluntary courtship. Their shared work continues when a diplomatic convention opens."
 HSM_VER_ROM_open_court_tt:0 "Their future joint government will hold regular public hearings and receive the following trait after the wedding:"
 HSM_VER_ROM_travelling_court_tt:0 "Their future joint government will visit the districts and receive the following trait after the wedding:"
 HSM_VER_ROM_betrothal_tt:0 "The couple become engaged. The dukes undertake to hand over their offices after diplomatic unification; the current rulers remain in office until the final ceremony."
 HSM_VER_ROM_handover_tt:0 "§YRosaline and Montague§! replace the founding duke as joint constitutional rulers. Serving commanders keep their military posts. Rosaline's petitions portfolio and Montague's provincial portfolio become available as optional political advisers, costing §Y100 political power§! each."
