 HSM_VER_ROM_legacy_handover:0 "The established union has witnessed the couple's handover"
 HSM_VER_ROM_delivery:0 "A meeting of the two Houses is awaiting an answer"
 HSM_VER_ROM_wedding_delivery:0 "The wedding and public handover are awaiting an answer"
