 hsm_ver_regency.16.t:0 "The Erie Estates Take Their Seats"
 hsm_ver_regency.16.d:0 "Erie's representatives arrive without diplomatic credentials. Their House has lawfully joined the unified country, and the old foreign chancery no longer speaks for it. The original charter lies on the table beside the founding act and the proposed Herzland articles.\n\nA workshop delegate asks who will hear a complaint against the reconstruction office. A landholder asks whether reserved obligations can be enlarged without another hearing. The clerk reads the limits into the record. The estates must now give their own answer. Incorporation granted no advance vote on this settlement, and this sitting settles neither Grover's whereabouts nor anyone's custody of him."
 hsm_ver_regency.16.a:0 "Record Erie's estate vote in favour."
 hsm_ver_regency.16.b:0 "Withhold Erie's assent."
 hsm_ver_regency.17.t:0 "The Eyrie Estates Read the Articles"
 hsm_ver_regency.17.d:0 "The Eyrie delegates bring an annotated copy of the charter. Since lawful incorporation their arguments belong before the common council, but they have not surrendered the right to make them. One clause in the Herzland draft has three different comments in its margin.\n\nThe chair asks the clerk to read each objection before calling the vote. A finite guardianship, where lawful, must end at majority; a civil compact must answer for its own accounts. Neither may be justified by an extinct government's supposed signature. The estates can affirm the articles or send the proposal back. Their answer will be recorded here, in the country whose government must honour it."
 hsm_ver_regency.17.a:0 "Record Eyrie's estate vote in favour."
 hsm_ver_regency.17.b:0 "Withhold Eyrie's assent."
