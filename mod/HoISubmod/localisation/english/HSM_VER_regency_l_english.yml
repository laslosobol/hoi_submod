l_english:
 HSM_VER_REG_after_defence:0 "What the Victory Leaves Us"
 HSM_VER_REG_after_defence_desc:0 "The Empire attacked a member of our charter; Avian answered, and the peace has left Griffenheim in our keeping. Katrina knows how easily a victorious guardian becomes another master. Before the officers put away their maps, she will ask Iovinus and Vincent what a settlement in the Herzland must promise the Houses that survived the war."
 HSM_VER_REG_household_file:0 "A Name Is Not a Household"
 HSM_VER_REG_household_file_desc:0 "Grover VI appears in petitions, inventories and proposed proclamations. None can tell Katrina whether a living child is actually in her care. Establish his circumstances before discussing guardianship. An adult needs no regent, a foreign household has its own responsibilities, and uncertainty must not be dressed as a death notice or an arrival."
 HSM_VER_REG_civilian_contracts:0 "Orders for the City"
 HSM_VER_REG_civilian_contracts_desc:0 "A workshop in Griffenheim asks whether its next order will be paid in coin or another promise of national salvation. Katrina sends for the civilian estimates. Reopening productive work will give the city something more dependable than the arrival of a new banner; where premises cannot be opened, its engineers can still improve the methods of reconstruction."
 HSM_VER_REG_agreement_for_herzland:0 "The Herzland Agreement"
 HSM_VER_REG_agreement_for_herzland_desc:0 "The Houses' original peace must survive the settlement beyond Verenia. With Grover present as a living minor, Katrina can propose a regency ending at his majority; a civil compact offers another course. Each independent government must answer freely. A lawfully absorbed House instead debates the text through its own estates within the unified country. Incorporation supplies no automatic assent."
 HSM_VER_REG_schools_and_witnesses:0 "A Place Among the Learners"
 HSM_VER_REG_schools_and_witnesses_desc:0 "The technical schools need tools, teachers and permission to question a confident answer. Bring workshop experience into their classrooms and share their discoveries with industry. If Grover is a child in our care, he should encounter that work himself. Public education has its own purpose whether or not a future monarch sits at a desk."
 HSM_VER_REG_defence_articles:0 "The Price of Readiness"
 HSM_VER_REG_defence_articles_desc:0 "Katrina's reservist system taught Avian the value of knowing who would answer a summons. Beyond Verenia, the council must decide how that service can be sustained. A common supply office would negotiate competing demands across the whole settlement. Territorial reserves would rely on officers and stores close to home. Iovinus wants to know who may call them out; Vincent wants to know who will pay when they do."
 HSM_VER_REG_petitions_to_the_council:0 "Let the Complaint Be Heard"
 HSM_VER_REG_petitions_to_the_council_desc:0 "A petition against the reconstruction office has reached the council. The petitioner is neither a courtier nor a convenient witness to our generosity. Give the complaint an ordinary hearing, even where it embarrasses Katrina's administration. A child learning government, if present, should see that a respectful bow does not oblige its author to withdraw an objection."
 HSM_VER_REG_rebuilding_the_quarters:0 "Streets Worth Coming Home To"
 HSM_VER_REG_rebuilding_the_quarters_desc:0 "Behind the repaired public facades, families still share damaged rooms and workshops wait for reliable access. Send construction specialists through the residential quarters with the engineers who learned their trade during the war. Their experience should now help make a staircase sound, a street passable and a delivery ordinary."
 HSM_VER_REG_reserved_house_rights:0 "What the Houses Keep"
 HSM_VER_REG_reserved_house_rights_desc:0 "The constitutional guarantees must protect Verenia's institutions when respecting them becomes inconvenient. Independent Houses keep their governments; constituent estates keep their charter rights within the unified country. The courts, agreed obligations and limits bind Katrina's administration in either case."
 HSM_VER_REG_a_finite_guardianship:0 "The Date on the Last Page"
 HSM_VER_REG_a_finite_guardianship_desc:0 "A regency has an ending even when its guardians still have unfinished business. Grover's majority ends their authority over a minor. Under the agreed settlement he may become constitutional head of the Avian-Herzland state, bound by Verenia's reserved institutions. Neither unfinished lessons nor an inconvenient birthday can justify prolonging childhood by decree."
 HSM_VER_REG_a_union_without_a_throne:0 "A Union Without a Throne"
 HSM_VER_REG_a_union_without_a_throne_desc:0 "The civil compact rests on the Houses' consent and the obligations they can answer for. If Grover's death is confirmed, it must acknowledge the loss without inventing a successor. Where he is adult, abroad or unaccounted for, it must respect those different circumstances. The work of governing can continue without claiming to speak through him."
 HSM_VER_REG_the_settled_frontier:0 "An Ordinary Border"
 HSM_VER_REG_the_settled_frontier_desc:0 "The frontier should become a place where a carrier checks a destination, not where another proclamation begins. Complete the limited settlement of the Herzland and keep Verenia's Houses within their agreed constitutional relationship. A constitutional future or a civilian one must give those living here reasons to trust tomorrow's ordinary business."

 HSM_VER_REG_joint_guardianship:0 "The Limited Regency"
 HSM_VER_REG_joint_guardianship_desc:0 "Erie and Eyrie have separately accepted guardianship of the living minor Grover VI in Avian. An independent House signs through its government; a lawfully absorbed House votes through its estates. Katrina governs within those limits. Majority, death or loss of the required conditions ends the authority to act; old signatures alone cannot sustain its benefits."
 HSM_VER_REG_civil_settlement:0 "The Civil Herzland Compact"
 HSM_VER_REG_civil_settlement_desc:0 "Erie and Eyrie have separately consented to a civilian settlement. Independent governments and the estates of lawfully absorbed Houses answer for their own undertakings. Repairs and infrastructure receive support while the charter, sovereign homeland and current consent remain valid."
 HSM_VER_REG_reserved_rights:0 "Verenia's Constitutional Guarantees"
 HSM_VER_REG_reserved_rights_desc:0 "The Houses' reserved institutions bind the settlement, including an adult constitutional monarch. Independent partners keep their governments; constituent estates retain their agreed voice within the unified country. Reliable obligations strengthen stability and production, while respecting them consumes political influence."
 HSM_VER_REG_joint_logistics:0 "The Joint Supply Offices"
 HSM_VER_REG_joint_logistics_desc:0 "Agreed schedules and supply arrangements let Avian prepare plans faster and consume fewer supplies. Keeping the offices accountable to the settlement requires continuing political work. Their remit grants no command over an independent House's army."
 HSM_VER_REG_territorial_reserves:0 "The Territorial Reserve Articles"
 HSM_VER_REG_territorial_reserves_desc:0 "Reserves organised around familiar ground strengthen defence on our core territory and help formations recover. Planning proceeds more slowly as local readiness takes precedence over the convenience of a single timetable. The arrangement develops Katrina's reservist tradition within the agreed limits."

 HSM_VER_REG_settlement_business:0 "The Herzland Council"
 HSM_VER_REG_settlement_business_desc:0 "The council can reopen negotiations and examine reliable news about Grover's household. Each House must consent through its independent government or, after legitimate incorporation, its own estates. Refusal permits another proposal after the agreed interval; it supplies no substitute authority."
 HSM_VER_REG_reconsider_agreement:0 "Reopen the Agreement Talks"
 HSM_VER_REG_reconsider_agreement_desc:0 "The council's copy still carries the objections that prevented an agreement. Katrina will have them read beside the new draft before asking Erie and Eyrie to return. Whether the text concerns Grover's guardianship or a civil compact, the Houses must be offered obligations they can defend before their own people."
 HSM_VER_REG_request_household:0 "Ask the Host House About Grover"
 HSM_VER_REG_request_household_desc:0 "Katrina's letter to Grover's household begins with his lessons and daily care. Before anyone drafts a reception, the relatives sheltering him must decide whether to entrust the child to Avian. Their answer concerns where he will live; the Houses will still have to settle who may govern in his name."
 HSM_VER_REG_reopen_household:0 "Reopen the Household File"
 HSM_VER_REG_reopen_household_desc:0 "The imperial household scattered with the fall of its government. Now that Avian's officials can follow its trail through the former imperial lands, they will compare residence books, travel orders and the testimony of surviving attendants. Katrina wants a reliable account of the child entrusted to that household before anyone promises to bring him here."
 HSM_VER_REG_industry_bonus:0 "Lessons from the Technical Schools"
 HSM_VER_REG_reconstruction_bonus:0 "Methods for Rebuilding Griffenheim"
 HSM_VER_REG_custody_tt:0 "Grover's household may be recovered from the fallen Empire or transferred with its host's consent. A request grants neither custody nor a regency."
 HSM_VER_REG_consent_tt:0 "Proposes a limited regency or a civilian compact. Both Houses must consent, through their governments or lawful local estates. The regency ends when Grover comes of age."
 HSM_VER_REG_grover_desc:0 "Grover VI has come of age under the limited Herzland settlement. He succeeds Katrina as constitutional head of the Avian-Herzland state, bound by Verenia's reserved institutions. Independent partners keep their governments, and constituent estates keep the rights affirmed in their own votes. His inheritance carries obligations to those who live under this constitution, not an unlimited claim upon the continent."

 hsm_ver_regency.1.t:0 "After the Guns"
 hsm_ver_regency.1.d:0 "Katrina could hear a mason working below the Griffenheim windows. Each blow interrupted the officer explaining how far the victory entitled them to go. He had brought a large map. She had brought the charter.\n\nIovinus's memorandum asked who would judge a dispute between the new administration and a Verenian House. Vincent's asked who would pay for the troops once the emergency ended. They had once found enough reasons to fight each other; Katrina was relieved to find them asking difficult questions of her instead. Relief did not make the answers cheaper.\n\nThe Empire had attacked their agreement, and their defence had carried them here. Now she had to explain what staying would mean. She laid the two memoranda beside the city estimates and told the officer to leave his map. The mason struck again. There was work enough within its borders."
 hsm_ver_regency.1.a:0 "Begin with what we owe this peace."
 hsm_ver_regency.2.t:0 "The Household Report"
 hsm_ver_regency.2.dead.d:0 "The report confirms Grover VI's death. Katrina read that sentence twice, then put down the draft that described her as his prospective regent. There would be no signature beneath it.\n\nA secretary asked whether the council should retain the title as a mark of continuity. She looked at the name on the report. The dead sovereign could neither need their guardianship nor release them from it; an office held in his name would serve only its occupants.\n\nShe instructed the council to preserve the evidence and prepare its business in its own name. The Houses could still undertake reconstruction together. They would have to explain that undertaking to the living, without placing an absent sovereign between themselves and the answer."
 hsm_ver_regency.2.minor.d:0 "The household report has ceased to be a collection of competing claims. Grover is alive, still a minor, and actually present in Avian's care. Katrina closed the file before receiving the officials who wanted to discuss his future.\n\nOne had prepared a ceremonial programme. Another wanted an immediate announcement. She asked first who had arranged his lessons and whether anyone had explained the proposed changes to him. Neither question appeared in the programme.\n\nThere could now be an honest discussion of guardianship. It would still require the independent consent of Erie and Eyrie, and an ending that the guardians could not move for their own convenience. For today, she sent the ceremonial programme back. Establishing where a child belonged was a responsibility before it was an occasion."
 hsm_ver_regency.2.adult.d:0 "Grover VI is alive and present in Avian, but the date beside his name settles one question: he has reached his majority. Katrina returned the suggested regency clauses with a line through their heading.\n\nAn official protested that the arrangements had taken months to prepare. She answered that none of those months belonged to them to give back. Their late arrival at a solution could not make another griffon a child again.\n\nThe council will proceed on the terms it can actually offer. A civilian compact can organise reconstruction and preserve the Houses' rights without appointing a guardian or promising a crown. Grover's adult circumstances must be acknowledged in their own right, rather than made to fit an unfinished draft."
 hsm_ver_regency.2.foreign.d:0 "Reliable records place the living Grover VI in another country's household. They do not place him in Katrina's care. She set the report apart from the inventory of the Griffenheim residence, where an enthusiastic clerk had filed it.\n\nIf Erie or Eyrie is sheltering the child, Katrina can write to the household responsible for his care. A request will have to answer its concerns about his safety and upbringing. Until that household agrees, no reception can be promised here.\n\nFor now, there is no child here on whose behalf to establish a regency. Katrina asked the secretary to remove the proposed reception from her diary. The city could begin rebuilding while the constitutional talks considered a civilian compact; neither undertaking required an imagined guest."
 hsm_ver_regency.2.unknown.d:0 "The household file does not establish grounds for guardianship. Some entries leave questions unanswered; others cannot be reconciled with the authority the council proposes to exercise. Katrina asks the secretary to preserve every known fact before drawing a conclusion.\n\nHe has prepared a single heading for the unresolved material. She returns it. A gap in the evidence, conflicting records and an existing position that excludes guardianship cannot all mean the same thing. The report must keep those distinctions visible, even if they prevent a tidy recommendation.\n\nNo new arrival or death will be announced merely to resolve the difficulty. Reliable evidence may justify another examination, but only under the conditions that actually permit it. A civilian agreement can carry the work of government while the council acknowledges the limits of this file."
 hsm_ver_regency.2.a:0 "Let the record say only what is known."
 hsm_ver_regency.3.t:0 "Two Proposals Before the Houses"
 hsm_ver_regency.3.d:0 "Katrina read the proposed powers aloud. The common court must bind the head of the state; the obligations of reconstruction must be written down before a military undertaking is offered. The Houses' representatives would not let victory settle either question.\n\nOne text proposed a limited regency for a living minor actually in Avian's care. The other entrusted common work to a civil compact. Both reserved the Houses' institutions and required two separate answers.\n\nThe secretary prepared diplomatic copies for the governments still independent. Where a House had lawfully entered the unified country, its estates would receive the same clauses at a local sitting. Their vote remained necessary. Katrina chose which proposal to put before them."
 hsm_ver_regency.3.a:0 "Propose the limited regency."
 hsm_ver_regency.3.b:0 "Propose the civil compact."
 hsm_ver_regency.4.t:0 "The Answer on the Slate"
 hsm_ver_regency.4.child.d:0 "Grover had expected the technical school to stop working when he entered. Instead, a teacher found him a stool beside an apprentice and asked him to copy the calculation on the slate. The apprentice glanced at his answer, hesitated, then pointed out a missing allowance for wasted metal.\n\nGrover reddened. He looked towards Katrina, who was speaking with the workshop instructor. She came over, examined the figures and asked the apprentice to explain. The correction remained.\n\nAfterwards Grover admitted that he had thought knowing the rule would be enough. Katrina told him that the griffons who had to make the piece fit would discover the error regardless of whose answer it was. He borrowed a clean sheet and worked it through again.\n\nThe school's visitors left with drawings for the workshops. Grover kept his first sheet as well as the corrected one."
 hsm_ver_regency.4.d:0 "The instructor placed two metal fittings on the table. Each met the drawing supplied by its own office; they would not fit together. The visiting officials waited for someone to identify the guilty workshop. Instead, an apprentice brought out the two drawings.\n\nKatrina asked her to explain the difference to the whole room. It took longer than the demonstration allotted in the programme. By the end, the clerks responsible for specifications were asking questions of their own, and one had crossed out a confident note in his inspection book.\n\nThe technical schools will share their methods with industry, and the workshops will send back the difficulties encountered in using them. The lesson belongs to everyone whose work depends on another's answer. No distinguished pupil is needed to make it worth teaching."
 hsm_ver_regency.4.a:0 "Keep the correction with the lesson."
 hsm_ver_regency.5.t:0 "Who Will Be Ready?"
 hsm_ver_regency.5.d:0 "Katrina recognised the reserve officer's argument before he finished. Avian's reservist system bore her imprint: familiar assembly points, officers who knew their districts, stores kept close to the homes of those who would need them. He wanted to develop it for the settlement.\n\nAcross the table, a supply officer spread out a railway timetable. Local readiness would not make a missing consignment arrive. He proposed common depots and a central office empowered to settle competing requests before two columns were promised the same train. District commanders would have to accept its priorities, and the council would have to answer their objections.\n\nIovinus's delegation wanted the limits of common authority recorded. Vincent's wanted a system that would still function after the present officers retired. The reservist warned against emptying local stores for distant plans; the supply officer asked how those local arrangements would meet a danger crossing several districts. Katrina kept both questions in the minutes."
 hsm_ver_regency.5.a:0 "Sustain the joint supply offices."
 hsm_ver_regency.5.b:0 "Build around the territorial reserves."
 hsm_ver_regency.6.t:0 "The Petitioner Who Stayed"
 hsm_ver_regency.6.child.d:0 "The petitioner bowed to Grover, then turned back to the council. Her workshop's entrance had been blocked by a reconstruction depot. She had been promised another approach; the official responsible now insisted that the promise had meant only access on foot.\n\nGrover whispered that Katrina could surely order the carts moved. Katrina asked him to listen to the rest. The depot supplied repairs elsewhere, and its officer had instructions of his own. The council needed to hear those instructions before deciding what the administration owed.\n\nThe petitioner was still dissatisfied when she finished. An usher reached for the next name, but Grover noticed that her question had not been entered in the record. He asked the clerk to read it back.\n\nKatrina let the interruption stand. Later, Grover asked whether the woman would be punished for speaking so sharply. She told him to remember that question when complaints were addressed to him."
 hsm_ver_regency.6.d:0 "The petitioner had brought a small drawing of her workshop entrance. A reconstruction depot blocked the carts that used to reach it. The council's official pointed to an order authorising the depot; she pointed to a written promise of another approach. Both papers carried the administration's mark.\n\nKatrina asked the clerk to put them beside each other. Repairing one quarter could not make the cost imposed on another disappear. The depot officer would have to explain the obstruction, and the council would have to establish what the workshop had been promised.\n\nThe woman left without praising the hearing. Her complaint remained open, with an office responsible for answering it. Katrina watched the clerk enter that obligation in the record. Giving the public a hearing meant accepting that some visitors would leave still expecting an answer."
 hsm_ver_regency.6.a:0 "Record the complaint and hear the answer."

 hsm_ver_regency.7.t:0 "The Guardians' Last Day"
 hsm_ver_regency.7.d:0 "The legal adviser had drafted a useful phrase: guardianship would continue until the council considered the transition complete. Katrina asked him to read it to Grover. He suddenly found several qualifications worth mentioning.\n\nGrover wanted to know whether finishing his studies counted, or agreeing with the council, or simply waiting until everyone was satisfied. The adviser could not give him a date. Katrina drew a line through the phrase. His majority already supplied one.\n\nShe still had lessons she hoped he would learn and mistakes she hoped he would avoid. Neither hope entitled her to keep him a minor. The constitution offered him the headship of the Avian-Herzland state, with Verenia's rights binding his government and the Houses retaining the authority reserved to their governments or constituent estates.\n\nGrover examined the amended page. This time he could find where the guardians' power ended."
 hsm_ver_regency.7.after.d:0 "The council secretary found the old guardianship schedule among the papers for the final settlement. Several entries remained unfinished. He asked whether they should be carried forward under the same authority.\n\nThe answer lay on the last page. The regency no longer stood, and an unfinished programme could not extend it. Its obligations had to be dealt with by the institutions entitled to act now. Any constitutional succession belonged to an adult; any failure of the guardianship required its own honest reckoning.\n\nThe secretary copied the outstanding business onto the ordinary agenda and left the old ending intact. The settlement's worth would be tested by its ability to relinquish a power once exercised, including when keeping it might have made the next meeting easier."
 hsm_ver_regency.7.a:0 "The ending is part of the promise."
 hsm_ver_regency.8.t:0 "The Houses in Their Own Names"
 hsm_ver_regency.8.dead.d:0 "There was an empty place in the proposed ceremony, marked for the sovereign in whose name the council had once imagined working. Grover's death was confirmed. Katrina asked that the place be removed from the plan.\n\nVincent's delegation wanted the agreement to acknowledge the loss. Iovinus's wanted to know who would answer for its decisions. She saw no conflict between the requests. The record could preserve Grover's name without making him the author of obligations he would never read.\n\nThe civil compact was signed in the names of the Houses accepting it. Repairs, accounts and the Houses' reserved rights would rest on their consent. No successor was announced and no regent received an indefinite commission over an empty chair.\n\nWhen the papers were laid out for the sitting, every place belonged to someone who could be asked a question."
 hsm_ver_regency.8.d:0 "The printer had left a space for a royal style at the head of the agreement. Katrina returned the proof with the names of the consenting Houses written across it. The civil compact could speak in those names.\n\nEven a child's presence would not appoint the council his guardian without a separate agreement. Grover's circumstances could not be compressed into a convenient absence. An adult could not be placed under a new regency; a household abroad could not be summoned into existence here; an unresolved report could not establish a death. None gave the council authority to govern through him.\n\nIovinus's and Vincent's representatives checked the clauses preserving the Houses' rights. The reconstruction officials checked where responsibility for their accounts would lie. There was sufficient business for a real agreement among accountable institutions. The printer could close the space without inventing a throne to fill it."
 hsm_ver_regency.8.a:0 "Let the signatories answer for the compact."
 hsm_ver_regency.9.t:0 "The Road Beyond the Gate"
 hsm_ver_regency.9.regency.d:0 "A carrier leaving Griffenheim stopped at the gate to ask which office handled a disputed delivery across the Verenian boundary. The guard gave him an address. There was no speech about the destiny of the continent.\n\nKatrina heard the account that evening, between a report on the reserve arrangements and papers for Grover's household. She had once spent entire visits persuading Iovinus and Vincent to consider what the other might accept. Now their representatives could insist on the rights they had agreed, and her administration had offices obliged to answer.\n\nGrover was still a minor. The regency remained a duty with an ending, not a title made permanent by a successful reconstruction. Beyond the gate lay neighbours, customers and difficult questions. Katrina hoped the state he inherited would know how to meet all three without first drawing a larger frontier."
 hsm_ver_regency.9.adult.d:0 "The dispatch addressed to Grover VI concerned a delivery dispute at the Verenian boundary. It had passed through the offices named in the charter before reaching the constitutional head of the Avian-Herzland state. He read the opinions attached to it before the request for his attention.\n\nThe Houses' reserved rights remained binding. Their representatives had offered reasons, not petitions for permission to possess their own rights. The old imperial capital now housed a government whose head was bound by an agreement he could neither inherit away nor enlarge by proclamation.\n\nThe next dispatch concerned repairs to a residential street. Grover placed it beside the first. The settlement had given his office a defined place in the work of governing. He would have ample opportunity to discover how demanding that place could be without acquiring a single further province."
 hsm_ver_regency.9.d:0 "The notice at the Griffenheim gate listed an address for delivery disputes, an office for reconstruction accounts and the hours when petitions could be received. Rain had softened one corner. The gate clerk asked for another copy, with larger lettering.\n\nKatrina approved the small expense. Reports from the Houses had arrived that morning: questions about agreed work, complaints about delays, proposals for the next sitting. The Houses had kept their agreed voice, and the civil compact had acquired ordinary business that did not need a sovereign's name to justify it.\n\nThere would still be arguments over what the agreement required. Its courts, accounts and reserved rights gave those arguments somewhere to go. The frontier no longer needed to promise another conquest. For the carrier waiting at the gate, it needed an address he could read in the rain."
 hsm_ver_regency.9.a:0 "Keep faith with the settlement."
 hsm_ver_regency.10.t:0 "Avian Requests Our Assent"
 hsm_ver_regency.10.regency.d:0 "Katrina's proposal concerns the living minor Grover VI, now in Avian's care. She asks our House to approve a limited regency: she will continue to govern during his minority, and the agreed constitution will provide for his eventual headship of the Avian-Herzland state.\n\nOur clerks have marked the clauses preserving Verenia's institutions and the rights of Erie and Eyrie. The proposed headship does not annex an independent partner. It cannot alter our obligations simply because the guardian believes a broader power would be useful.\n\nThe council asks for an answer from our own government. Both Houses must accept before the regency takes effect. We may judge the guarantees sufficient, or decline without penalty to our existing charter. The victory gives this letter urgency; only our signature can give it consent."
 hsm_ver_regency.10.d:0 "Avian has submitted a civilian agreement for the Herzland. Katrina proposes common work on reconstruction and defence within the existing charter, with Verenia's reserved institutions protected. No guardianship or royal authority is sought through this text.\n\nThe proposed obligations still deserve scrutiny. Our government must answer for the undertakings it accepts, and Erie and Eyrie must both consent before the compact becomes effective. A civilian heading cannot make our signature a formality.\n\nThe clerks have laid out the provisions beside the original charter. We may sign and help give the reconstruction a dependable basis, or decline while retaining our present rights. Katrina will receive an answer to this proposal, not a pledge to agree with every future request."
 hsm_ver_regency.10.a:0 "Give our House's independent assent."
 hsm_ver_regency.10.b:0 "Decline the proposed agreement."
 hsm_ver_regency.11.t:0 "The Answers Are In"
 hsm_ver_regency.11.d:0 "The second assent came with a request for copies of the working papers. Katrina placed it beside the first. Erie and Eyrie had each accepted in their own name, through a government or a constituent estate sitting entitled to speak for that House.\n\nThe secretary offered congratulations. She asked him to deliver the requested copies before the first meeting. The representatives could now hold her administration to its words; they should have those words in front of them."
 hsm_ver_regency.11.refused.d:0 "The answer was a refusal. Katrina read it to the council without softening its meaning. Both Houses' consent was required, and the proposal had not secured it.\n\nAn adviser suggested carrying forward the useful portions under a civilian heading. She asked where the Houses had signed that agreement. There was no such document. A different proposal could be put to them after the interval for renewed talks, but it would require their answers in turn.\n\nThe existing charter remained. No penalty was entered against the refusing House, and no substitute compact was proclaimed. The invitation went into the file with the reply attached."
 hsm_ver_regency.11.a:0 "Proceed on the answers actually given."
 hsm_ver_regency.12.t:0 "A Request Concerning Grover"
 hsm_ver_regency.12.d:0 "Grover is a living minor in our household, not a ruler whom Avian may recall. Katrina has written to ask whether we will entrust him to Avian's care while the Herzland settlement is considered. The request is ours to answer.\n\nThe household officials have asked what will happen to his lessons and familiar routine. These are reasonable questions about a child whose future attracts too many speeches. An acceptance would permit his transfer; it would not constitute our signature on a regency or civilian compact. Those decisions remain separate.\n\nWe can agree to the move or keep our present responsibility. Refusal will leave him here and will not cost our House its place in the charter. Katrina's letter asks for consent, and the household should be able to rely on the distinction."
 hsm_ver_regency.12.a:0 "Entrust Grover to Avian's care."
 hsm_ver_regency.12.b:0 "Keep him in our household."
 hsm_ver_regency.13.t:0 "The Commission Has Ended"
 hsm_ver_regency.13.d:0 "The council has withdrawn the authority of the limited regency. The conditions under which it undertook guardianship no longer hold. Its seal cannot establish a living child in its care or preserve a government that has ceased to meet the agreement.\n\nThe secretary collects the outstanding instructions and marks which depended on that authority. Each must now be examined on its actual grounds. A death, a change of custody and a political rupture are different facts; the ending itself does not license him to invent any of them.\n\nThe Houses may consider a new civilian compact when circumstances permit, with fresh consent from both. Until then, the former guardians cannot turn their uncompleted duties into permission to continue."
 hsm_ver_regency.13.a:0 "Close the regency's commission."
 hsm_ver_regency.14.t:0 "The Signature Is His Own"
 hsm_ver_regency.14.memory.d:0 "Grover brought two old papers to the constitutional sitting. One was a calculation with the wasted-metal allowance missing. The other was his copy of the workshop petition, including the question the clerk had nearly passed over. Katrina recognised both.\n\nHe remembered looking to her when the apprentice corrected him. He also remembered expecting her to settle the blocked entrance by giving an order. Neither memory was particularly flattering. He had kept them because the answer had mattered more than how he looked while learning it.\n\nThe regency had ended with his majority. Now he would succeed Katrina as constitutional head of the Avian-Herzland state. The oath bound his government to Verenia's reserved institutions; the Houses retained rights his crown could not absorb.\n\nKatrina passed him the pen. Grover checked that the guarantees accompanied the oath, then signed. Afterwards he put the old papers back among his own things. He would need them again."
 hsm_ver_regency.14.d:0 "The usher announced Grover VI, and Katrina rose from the place she had occupied during the regency. His majority had ended the guardianship. The constitutional sitting would now give the adult his own responsibility.\n\nGrover read the oath before taking the pen. He was to succeed her as head of the composite Avian-Herzland state, bound by the settlement's institutions and Verenia's reserved rights. The representatives of Erie and Eyrie attended with the mandates of their governments or constituent estates. The oath could neither annex an independent partner nor erase rights within the unified country.\n\nKatrina asked whether he wanted anything read again. He asked for the clauses governing the common institutions. The clerk read them, without abridging the limits on the new head of state. Then Grover signed.\n\nThe papers awaiting his attention were already on the next table. His first day began with the government he had actually inherited."
 hsm_ver_regency.14.a:0 "Take the constitutional oath."
 hsm_ver_regency.15.t:0 "An Invitation Without Two Answers"
 hsm_ver_regency.15.d:0 "The time allowed for the proposal has passed without the two valid assents needed to establish it. The secretary cannot say whether every invitation reached the right desk. He can say that the council does not possess the necessary signatures.\n\nKatrina orders the unfinished proposal closed. Silence will impose no obligations on either House, and no civilian compact will be substituted for an unsigned regency. After the invitation interval has passed, a fresh proposal can be considered with the circumstances checked again.\n\nFor now, the existing charter remains the measure of what the Houses and the common administration owe one another."
 hsm_ver_regency.15.a:0 "Close the unanswered proposal."

