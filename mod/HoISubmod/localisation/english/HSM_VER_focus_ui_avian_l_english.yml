l_english:
 HSM_VER_UI_AVI_government_tt:0 "Katrina or her constitutional successor governs on the Intergigantes route."
 HSM_VER_UI_AVI_friendship_tt:0 "The free Houses remain at peace; the Treaty of Friendship is completed."
 HSM_VER_UI_AVI_peace_entry_tt:0 "A negotiated peace is valid, or the original peace can still be recognised."
 HSM_VER_UI_AVI_union_peace_tt:0 "The constitutional union and peace between all three Houses are intact."
 HSM_VER_UI_AVI_route_active_tt:0 "The peaceful constitutional campaign remains active."
 HSM_VER_UI_AVI_charter_consent_tt:0 "All three Houses have ratified the charter without suspension."
 HSM_VER_UI_AVI_charter_in_force_tt:0 "The constitutional campaign and three-House charter remain in force."
 HSM_VER_UI_AVI_budget_answers_tt:0 "Erie and Eyrie have answered the budget offer or their reply periods have expired."
 HSM_VER_UI_AVI_budget_reviewed_tt:0 "The first common budget has been reviewed."
 HSM_VER_UI_AVI_levy_settled_tt:0 "The levy dispute is settled; Avian claims no exceptional levy."
 HSM_VER_UI_AVI_no_charter_tt:0 "No active three-House charter exists."
 HSM_VER_UI_AVI_separate_settlement_tt:0 "Charter talks failed, or Avian is outside the valid charter with no ratification pending."
 HSM_VER_UI_AVI_start_effect_tt:0 "Recognises the existing peace and opens the constitutional campaign. Avian observes the congress; charter membership requires separate consent."
 HSM_VER_UI_AVI_language_effect_tt:0 "Opens §Y$hsm_ver_avian.2.t$§!: the Houses settle the language of their common administration."
 HSM_VER_UI_AVI_charter_effect_tt:0 "Sponsors charter negotiations between Erie and Eyrie. Each House may refuse; Avian decides on its own membership separately."
 HSM_VER_UI_AVI_budget_effect_tt:0 "Invites Erie and Eyrie to the common budget. Each may contribute or refuse; Avian needs at least one partner. Unanswered offers close after 30 days, with new invitations possible after 90 days."
 HSM_VER_UI_AVI_services_effect_tt:0 "Shared services for all three Houses: +10% production efficiency growth and +5% factory output while the charter is active."
 HSM_VER_UI_AVI_staff_effect_tt:0 "Joint staff for all three Houses: +5% army organisation and -8% supply consumption while the charter is active."
 HSM_VER_UI_AVI_review_budget_effect_tt:0 "Opens the first budget review. Acknowledging it unlocks the levy dispute focus, even if both Houses refused or let their offers expire."
 HSM_VER_UI_AVI_minutes_effect_tt:0 "In one day, the published minutes reveal how the charter changed the Houses' shared institutions. Opens the final constitutional settlement."
 HSM_VER_UI_AVI_levy_effect_tt:0 "Opens §Y$hsm_ver_avian.30.t$§!: honour the levy exemptions or claim an exception that suspends the charter."
 HSM_VER_UI_AVI_works_effect_tt:0 "Adds 1 civilian factory and 1 building slot in a fully controlled owned core with capacity.\nIf no eligible state has capacity: one 100% construction research bonus instead."
 HSM_VER_UI_AVI_convention_effect_tt:0 "Completes the first constitutional settlement and opens the Constituent Convention for further unification by consent."
 HSM_VER_UI_ZYP_government_tt:0 "Trubach rules independent fascist Verenia and has claimed the imperial throne."
 HSM_VER_UI_ZYP_herzland_tt:0 "Verenia or its subjects own and fully control the entire Herzland."
 HSM_VER_UI_ZYP_crowned_government_tt:0 "Trubach's crowned fascist government remains independent and has not capitulated."
 HSM_VER_UI_ZYP_capital_tt:0 "Griffenheim's owner is Verenia or its subject and fully controls the state."
 HSM_VER_UI_ZYP_policy_tt:0 "The proposal to the dynastic crowns has been chosen."
 HSM_VER_UI_ZYP_works_tt:0 "The reconstruction investment has been chosen."
 HSM_VER_UI_ZYP_muster_tt:0 "The muster dispute has been resolved."
 HSM_VER_UI_ZYP_west_tt:0 "The west is held by us, our subjects, faction partners or their subjects."
 HSM_VER_UI_ZYP_north_tt:0 "The north is held by us, our subjects, faction partners or their subjects."
 HSM_VER_UI_ZYP_three_regions_tt:0 "West, north and south are settled; ownership by faction partners and their subjects counts."
 HSM_VER_UI_ZYP_all_regions_tt:0 "All four regions are settled; ownership by faction partners and their subjects counts."
 HSM_VER_UI_ZYP_victory_roll_effect_tt:0 "Opens the postwar settlement report and prepares the imperial coronation."
 HSM_VER_UI_ZYP_imperial_coronation_effect_tt:0 "Choose the imperial coronation:\nAccept: +7% stability and an Imperial Chancery (+5% stability, +5% political power gain).\nPostpone: the ceremony may be reconvened after 60 days."
 HSM_VER_UI_ZYP_household_register_effect_tt:0 "Opens the report on Grover VI's confirmed circumstances."
 HSM_VER_UI_ZYP_rolls_of_the_crowns_effect_tt:0 "Choose the proposal for dynastic subjects: autonomous compacts or common ministries. Each crown will answer separately."
 HSM_VER_UI_ZYP_repair_the_arteries_effect_tt:0 "Two 100% support technology research bonuses, then choose:\nCivilian works: 1 factory and 1 building slot on fully controlled owned land with capacity, plus one 100% construction bonus; no capacity gives a second construction bonus instead of the factory.\nFreight board: -10% supply consumption, +15% infrastructure construction speed."
 HSM_VER_UI_ZYP_commissions_not_orders_effect_tt:0 "Invites dynastic subjects to the proposed compact. Each government may accept, seek revised terms or refuse."
 HSM_VER_UI_ZYP_arsenals_and_workshops_effect_tt:0 "Two 100% industry research bonuses.\nAdds 1 military factory and 1 building slot on fully controlled owned land with capacity; otherwise grants one additional 100% industry research bonus."
 HSM_VER_UI_ZYP_common_colleges_effect_tt:0 "Two 100% electronics research bonuses for Verenia.\nEach consenting eligible crown receives one 100% electronics bonus once, including later signatories."
 HSM_VER_UI_ZYP_the_muster_dispute_effect_tt:0 "Opens the dispute over professional cadres and limited troop rotations."
 HSM_VER_UI_ZYP_campaign_effect_tt:0 "Grants take-state war goals against eligible outside owners in the first unresolved open theatre; their landless overlords receive annexation war goals.\nExcludes friendly countries and their subjects, and current enemies. Does not declare war."
 HSM_VER_UI_ZYP_western_campaign_effect_tt:0 "Opens the western campaign and its briefing.\n$HSM_VER_UI_ZYP_campaign_effect_tt$"
 HSM_VER_UI_ZYP_reconstruction_contracts_effect_tt:0 "Two 100% construction research bonuses.\nAdds 1 civilian factory and 1 building slot on fully controlled owned land with capacity; otherwise grants one additional 100% construction research bonus."
 HSM_VER_UI_ZYP_northern_campaign_effect_tt:0 "Opens the northern campaign and its briefing.\n$HSM_VER_UI_ZYP_campaign_effect_tt$"
 HSM_VER_UI_ZYP_southern_campaign_effect_tt:0 "Opens the southern campaign and its briefing.\n$HSM_VER_UI_ZYP_campaign_effect_tt$"
 HSM_VER_UI_ZYP_eastern_campaign_effect_tt:0 "Opens the eastern campaign and its briefing.\n$HSM_VER_UI_ZYP_campaign_effect_tt$"
 HSM_VER_UI_ZYP_seats_for_new_crowns_effect_tt:0 "Invites eligible new crowns to the existing compact. Each must consent separately; earlier grants are not repeated."
 HSM_VER_UI_ZYP_accounts_after_campaign_effect_tt:0 "Opens the debate on the empire's postwar accounts."
 HSM_VER_UI_ZYP_crown_and_countries_effect_tt:0 "Opens the imperial settlement epilogue.\n+40 army experience and two 100% support technology research bonuses."
