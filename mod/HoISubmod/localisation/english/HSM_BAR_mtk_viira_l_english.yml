l_english:
 HSM_BAR_mtk_field_atlas_title:0 "Field Atlas"
 HSM_BAR_mtk_field_atlas_idea:0 "I can distinguish currents in a room that my students describe as empty. That is an observation about me, not yet a description of the room. I propose an atlas whose marks another observer could dispute. Transparent sheets will keep the terrain, the crystal readings and the observer's impressions separate; superimposing them should reveal what we have been calling a single field. Leopold has offered to carry the apparatus, provided I stop adjusting it while he measures. Fair enough. The first survey will follow the path from the teaching room to the workshop.\n\nProposal signed: Viira."
 HSM_BAR_mtk_field_atlas_theory:0 "Working hypothesis: a local magical disturbance produces a repeatable spectral pattern, although each observer notices different parts of it. We shall record an unexcited crystal before introducing a familiar light charm, then exchange observers without moving the stand. Separate transparent diagrams will mark the charm, nearby active instruments and the direction each observer faces. A reading that follows the observer rather than the source must remain an observation about perception. Silver will keep the order of the trials out of the readers' view.\n\nLeopold's margin: Include a blank sheet for an idle apparatus. Viira: Included, with your signature beside mine."
 HSM_BAR_mtk_field_atlas_tests:0 "The unfamiliar survey team located the light charm from the atlas sheets before entering the teaching room. Their readings followed the source when it was moved; exchanging readers changed the reported brightness, but not the mapped boundary. In the workshop, an apparent second source vanished when Leopold stopped a nearby enchanted instrument. We have therefore drawn that interference on its own transparent layer. Rain against the outer wall blurred the weakest readings, and nobody could assign a dependable boundary there.\n\nSurvey signed: Viira and Leopold. Silver's comparison: The blank trials remained blank; the atlas describes a field, not merely an expectation."
 HSM_BAR_mtk_field_atlas_conclusion:0 "The atlas is accepted for repeatable surveys within the conditions written on each sheet. Its achievement is a common reference: another team can find a recorded disturbance and distinguish it from an observer's unusually sharp perception. It does not turn every impression into a measurement, and uncertain boundaries must stay uncertain when the weather or neighbouring apparatus changes. Leopold has added removable overlays so a correction need not erase the earlier survey. I had wanted a beautiful final map. His arrangement makes a better working atlas.\n\nAccepted: Viira. Workshop countersignature: Leopold, who asks that wet sheets be dried before filing."

 HSM_BAR_mtk_shared_senses_title:0 "Shared Senses"
 HSM_BAR_mtk_shared_senses_idea:0 "When I describe a spectral edge, Leopold asks whether I mean its position, its brightness or the sensation behind my eyes. I usually mean all of them. Perhaps a deliberately offered fragment of perception could settle the question before our explanations multiply. I propose paired stations where a sender attends to a coloured shape and a receiver draws what arrives. Each participant will retain an ordinary view of the room and a separate record. We are looking for a bridge between observations, with a clearly marked entrance and exit.\n\nViira. Leopold adds: Start with a shape that does not move."
 HSM_BAR_mtk_shared_senses_theory:0 "The proposed link would carry a selected sensory pattern, not the sender's entire awareness. Our hypothesis is that steady attention can give a simple outline a recognizable magical envelope. Participants will alternate between viewing a card and imagining it, while the receiver draws behind an opaque screen. An inactive connection will provide the comparison. Transparent overlays will distinguish the offered image from the receiver's own field of view. We must also record fatigue and any confusion about direction.\n\nProtocol: Viira. Asinti's addition: Let each station interrupt its own connection; otherwise an interrupted observation cannot be studied properly."
 HSM_BAR_mtk_shared_senses_tests:0 "Receivers identified the offered stationary outlines more often with the link active than during the inactive comparison. They could still answer spoken questions about their own surroundings and interrupt the connection independently. Colour proved inconsistent: a pale green card arrived as brightness without hue, while moving shapes produced conflicting directions and queasiness. Imagined cards were particularly unreliable. Leopold compared the drawings without knowing which connection had been active, then spread the transparent sheets across my desk. Their agreement was real, and much narrower than my first description.\n\nTrial signed: Viira. Asinti witnessed the interruptions; Silver recorded recovery after the sessions."
 HSM_BAR_mtk_shared_senses_conclusion:0 "Shared perception is retained as a limited demonstration of deliberately transmitted, simple sensory features. It cannot stand in for another observer's whole experience, and a receiver's confident colour judgment deserves no special trust. Sessions must remain local, brief and anchored by an ordinary view of the room. Movement and imagined scenes fall outside the accepted procedure. Asinti proposes keeping the separate drawings even when they disagree; Leopold has made shallow trays so none need be stacked into a misleading composite.\n\nViira: I wanted to lend someone my eyes. We have learned to exchange an outline, and to label whose outline it is."

 HSM_BAR_mtk_sleep_lecture_title:0 "The Sleeping Lecture"
 HSM_BAR_mtk_sleep_lecture_idea:0 "Students can repeat an explanation in the evening and lose its order by morning. I wonder whether a lesson presented during sleep might be retained without the distractions of the classroom. Silver objects that recognition on waking may merely come from the evening conversation. He is right to demand unfamiliar material. I propose a harmless sequence of invented signs, offered only after the sleeper has settled, with a separate waking class for comparison. The recording will contain no familiar charm that a practiced pupil could reconstruct from habit.\n\nViira. Silver will prepare the signs; I will not preview the answers."
 HSM_BAR_mtk_sleep_lecture_theory:0 "The working hypothesis requires more than a sleeper responding to sound: the order and meaning of unfamiliar signs must be available after waking. Silver will prepare matched sign sets, one explained awake and another presented during observed sleep. Quiet nights and an inactive apparatus will separate instruction from disturbed rest. The morning examiner will receive no indication of which session occurred. Recognition, explanation and use in a new arrangement will be recorded separately.\n\nViira's protocol. Silver's annotation: A dream about a lecture is not evidence of learning. Agreed; the dream account will go on a different sheet."
 HSM_BAR_mtk_sleep_lecture_tests:0 "The sleeping participants sometimes recalled a voice or dreamed about a classroom. They could not explain the unfamiliar signs or arrange them any better than after the quiet comparison nights. Apparent recognition disappeared when the examiner exchanged the cards. The waking class, using its separate sign set, could explain the rule in its own words. Repeated sleep sessions brought tiredness without a learning effect, so Silver stopped them. I checked the recordings for a missing passage; none was missing.\n\nTest record signed: Viira and Silver. Leopold verified that the apparatus had played the intended lesson throughout the observed interval."
 HSM_BAR_mtk_sleep_lecture_conclusion:0 "The sleeping lecture has failed. It provides no demonstrated learning, no useful substitute for teaching and no compensating practical benefit. The equipment is withdrawn from instruction, and the students return to ordinary classes after undisturbed rest. Dream recollections remain in the report because they explain why the idea once looked persuasive, not because they constitute a lesser success. I asked Silver to examine my preferred interpretation again. He did, patiently, and reached the same answer.\n\nClosed: Viira. Silver's final note: Keep the waking comparison beside the dream accounts, so the next reader can see exactly which claim the evidence rejected."

 HSM_BAR_mtk_crystal_memory_title:0 "Crystal Memory"
 HSM_BAR_mtk_crystal_memory_idea:0 "A diagram freezes the arrangement of an experiment but loses the way its light changes. I propose asking a crystal to retain that changing impression long enough for another observer to examine it. The first subject will be an illuminated pattern, not a recollection from anyone's life. Leopold has brought a tray of apparently similar crystals and insists that I number the cloudy ones as carefully as the clear ones. He suspects I choose specimens by a feeling I have never described. That suspicion belongs in the proposal.\n\nViira. Specimen register countersigned by Leopold."
 HSM_BAR_mtk_crystal_memory_theory:0 "Our hypothesis is that an imposed magical pattern leaves a temporary ordering within a receptive crystal. A later excitation might reproduce its visible trace, but reproduction must be distinguished from a fresh image supplied by the reader. We shall compare exposed specimens with untouched crystals, vary the reader, and place the original pattern beside the recovered trace only after independent drawings are complete. Transparent spectral sheets will record fading and any overlap after reuse.\n\nLeopold: Record storage conditions, especially warmth. Viira: Agreed. A beautiful replay after careful selection would tell us too little about an ordinary shelf."
 HSM_BAR_mtk_crystal_memory_tests:0 "Exposed crystals reproduced the broad order of the illuminated pattern; untouched specimens did not. Readers who had never seen the original still drew recognizable traces. Fine edges faded during storage, however, and specimens left near the warm workshop wall blurred sooner. Reusing a crystal sometimes left an earlier shape beneath the new one. Leopold found that my preferred clear specimens were no guarantee against this ghosting. We laid the recovered images over the original transparent diagram and marked each disagreement instead of smoothing it away.\n\nRecord signed: Viira and Leopold. Silver checked the independent drawings before the comparison sheets were opened."
 HSM_BAR_mtk_crystal_memory_conclusion:0 "Crystal memory is accepted only for temporary records of simple visible magical patterns. A recovered trace needs its source diagram, storage history and an indication of previous use. It is unsuitable as an exact record of fine detail, much less as a container for a personality or a complete lived memory. The name is convenient; the distinction is essential. Leopold has reserved a separate tray for doubtful specimens, and I have stopped calling their blurred edges an artistic resemblance.\n\nViira. Leopold's addition: Keep the paper originals. A crystal that remembers yesterday imperfectly should never be the only witness to yesterday."

 HSM_BAR_mtk_spell_notation_title:0 "Spell Notation"
 HSM_BAR_mtk_spell_notation_idea:0 "My lesson diagram says to sustain the light, which is precisely the part my students cannot reproduce. Leopold watched my antlers and found a movement I had omitted because I scarcely noticed making it. I propose a notation that records preparation, attention and interruption as carefully as the visible spell. Transparent diagrams will separate the desired effect from the actions of the caster. The opening exercise will be an ordinary light charm, taught from the page by someone who has not watched me perform it.\n\nViira. Leopold has volunteered to ask the apparently foolish questions again."
 HSM_BAR_mtk_spell_notation_theory:0 "The hypothesis is that a teachable spell contains describable operations alongside personal habits. Each symbol must identify either an observable action, a condition to check or a point where the caster should stop. We shall give an unfamiliar instructor the written exercise and collect questions before any demonstration. Separate diagrams will show how antlers, a horn or an external regulator meet the same stated condition; resemblance of movement alone will not establish equivalence.\n\nSilver suggests deliberately omitting an instruction from a comparison copy. Viira: Yes, provided we use the harmless exercise and record where the reader notices the omission."
 HSM_BAR_mtk_spell_notation_tests:0 "An instructor who had not attended my demonstrations taught the light exercise from the revised pages. Learners could explain why it stopped as well as make it glow. The comparison copy stalled at its missing instruction, which the instructor marked without inventing an answer. An external regulator reproduced the stated condition for a learner with weak magic; copying my antler movement alone did not. More intricate charms still required unwritten judgments, so their sheets remain drafts.\n\nViira. Silver reviewed the lesson records. Leopold's pencilled observation: The smallest correction was also the one you had insisted was unnecessary."
 HSM_BAR_mtk_spell_notation_conclusion:0 "The notation is accepted for the elementary exercises that another instructor has reproduced. It records a procedure with checks, not a promise that every creature can supply the same magic. Untranslated bodily habits and judgments must remain visible gaps until they receive their own demonstrations. The transparent diagrams now let a teacher replace one method without pretending the required condition has changed. I returned to the back of the classroom and watched someone correct my original page without consulting me.\n\nViira. Leopold countersigns the regulator drawings. Silver requests copies with generous margins; apparently our finished notation still needs somewhere to argue."

 HSM_BAR_mtk_chorus_title:0 "The Chorus"
 HSM_BAR_mtk_chorus_idea:0 "I propose a room in which several researchers can attend to the same magical event while remaining distinguishable observers. Each station would offer a chosen impression and a modest contribution to a shared light pattern; transparent diagrams would preserve their separate traces. Assembly must wait for completed reports on the Field Atlas, Shared Senses, the Sleeping Lecture, Crystal Memory and Spell Notation. None can be omitted merely because its answer disappoints us. This proposal depends on their examination, not on my ability to overwhelm a poor connection with power.\n\nViira. Leopold will prepare separate stations; Asinti will review their interruptions."
 HSM_BAR_mtk_chorus_theory:0 "The Chorus hypothesis combines bounded exchanges rather than merging minds. The Field Atlas supplies surveyed boundaries and interference layers. Shared Senses restricts transmission to deliberately offered, stationary features. The Sleeping Lecture's failure rules out passive acquisition of understanding: every participant must rehearse awake and explain the task. Crystal Memory supplies only temporary reference traces, checked against paper because they fade. Spell Notation supplies readable contributions and explicit stopping points. All these completed studies are required before assembly. We predict that independent stations can sustain a common light pattern within the surveyed room; range, overload and withdrawal remain experimental questions.\n\nViira; station design checked by Leopold, rehearsal protocol by Silver and Asinti."
 HSM_BAR_mtk_chorus_tests:0 "The Chorus sustained the agreed light pattern while participants described their own surroundings and withdrew independently. The Field Atlas identified interference beside the workshop wall; moving the stations inside its surveyed boundary restored the pattern. Shared Senses carried offered outlines but still confused colour. Following the failed Sleeping Lecture, Silver required waking explanations; copying a signal without understanding did not suffice. Crystal Memory traces drifted during repetition, so paper references settled discrepancies. Spell Notation let another reader resume an abandoned contribution without guessing its purpose. Crowded exchanges caused fatigue, and reception ceased beyond the prepared room.\n\nViira recorded the spectra; Leopold, Silver and Asinti countersigned their separate station logs."
 HSM_BAR_mtk_chorus_conclusion:0 "The Chorus is accepted as a local collaboration in perception and magic, with independent participants and separately interruptible contributions. The Field Atlas determines where a session is supported. Shared Senses limits what may be shared. The failed Sleeping Lecture supplies no learning benefit; its rejected premise forbids treating reception as understanding. Crystal Memory remains a fading reference beside permanent drawings. Spell Notation makes each contribution inspectable and replaceable. All these studies belong with every copy of this report. Nothing observed supports access to absent minds or a consciousness beyond the prepared group.\n\nViira: The transparent sheets still show distinct authors. Leopold, Silver and Asinti sign beside her, each on their own trace."
