l_english:
 HSM_VER_GRO_restored_empire:0 "The Restored Empire"
 HSM_VER_GRO_restored_oath:0 "The Emperor's Public Oath"
 HSM_VER_GRO_restored_oath_desc:0 "Grover returns to a country whose future cannot be settled by his surname alone. Before the assembled deputies and household witnesses, he will bind the crown to the settlement that brought him home."
 HSM_VER_GRO_restored_reconstruction:0 "Open the Reconstruction Offices"
 HSM_VER_GRO_restored_reconstruction_desc:0 "The first petitions concern roofs, wages and workshops whose doors have remained shut since the fighting. Local engineers and elected councils must turn those petitions into work that families can see from their own streets."
 HSM_VER_GRO_restored_charter:0 "A Charter for the Crown"
 HSM_VER_GRO_restored_charter_desc:0 "The imperial signature must have a place in the law, and the law must remain legible without it. Ministers, deputies and the sovereign will set out who answers for each decision and how a citizen may challenge it."
 HSM_VER_GRO_restored_embassies:0 "Across the Vereni Border"
 HSM_VER_GRO_restored_embassies_desc:0 "Verenia was Grover's home before it became his neighbour. Resident envoys and visiting scholars can preserve that familiarity between two independent governments, each responsible to its own people."
 HSM_VER_GRO_restored_workshops:0 "The Workshops Reopen"
 HSM_VER_GRO_restored_workshops_desc:0 "A repaired factory needs more than a new sign above the gate. Apprentices, foregriffs and engineers will compare the methods that survived the war and train a generation able to improve upon them."
 HSM_VER_GRO_restored_courts:0 "Petitions Before Privilege"
 HSM_VER_GRO_restored_courts_desc:0 "An ordinary household should not need an introduction at court to obtain a hearing. Provincial judges and public clerks will establish a route from the smallest petition to a reasoned answer, even when a powerful name stands on the other side."
 HSM_VER_GRO_restored_defence:0 "The Service Oath"
 HSM_VER_GRO_restored_defence_desc:0 "Grover remembers the officers who taught him that command begins with responsibility. The army's new service articles will place the defence of the country under lawful civilian authority and give its soldiers a clear duty to the communities behind them."
 HSM_VER_GRO_restored_university:0 "A University of the Settlement"
 HSM_VER_GRO_restored_university_desc:0 "The rebuilt lecture halls will welcome students whose families once stood on opposite sides of the war. Public laboratories and open appointments can make the university a shared undertaking that outlasts the ceremonies of restoration."
 HSM_VER_GRO_restored_arsenals:0 "Provision the Home Army"
 HSM_VER_GRO_restored_arsenals_desc:0 "Quartermasters have brought the ministry a practical list: reliable tools, sound equipment and workshops close enough to maintain them. The home army will be provisioned for the defence of the settlement and the people living within it."
 HSM_VER_GRO_restored_peace:0 "The Work of a Reign"
 HSM_VER_GRO_restored_peace_desc:0 "The crown has returned to daily life. Its worth will be measured in hearings kept, classrooms opened and promises honoured when they become inconvenient. Grover must now learn to govern within the institutions he helped to establish."
 HSM_VER_GRO_restored_government_tt:0 "The restored Empire is independent and Grover VI is its reigning monarch."
 HSM_VER_GRO_restored_partner_tt:0 "The Vereni partner that restored the Empire still exists and is at peace with us."
 HSM_VER_GRO_restored_construction_bonus:0 "Reconstruction Office Methods"
 HSM_VER_GRO_restored_exchange_bonus:0 "Vereni Academic Exchanges"
 HSM_VER_GRO_restored_industry_bonus:0 "Herzland Workshop Standards"
 HSM_VER_GRO_restored_defence_bonus:0 "Home Defence Studies"
 HSM_VER_GRO_restored_university_bonus:0 "Public Research Laboratories"
 HSM_VER_GRO_restored_arsenal_bonus:0 "Arsenal Design Studies"
 HSM_VER_GRO_restored_arsenal_site_tt:0 "Another owned and controlled state: §G+1§! slot and §G1§! military factory."
 hsm_ver_grover_restored.1.t:0 "A Name Beneath the Oath"
 hsm_ver_grover_restored.1.d:0 "The clerk left a space beneath the oath for Grover's signature. He had seen his name printed on proclamations since childhood, usually beneath words someone else had chosen. This time he read the whole page aloud.\n\nThe deputies stood when he finished. From the gallery came the uneven sound of applause, a few voices joining later than the rest. Grover waited until it had stopped before taking up the pen.\n\nOutside, the petitioners were still waiting for the offices to open. He asked the chamberlain to let them in."
 hsm_ver_grover_restored.1.a:0 "Let every petition reach the throne."
 hsm_ver_grover_restored.1.b:0 "Let ministers prepare each audience."
 hsm_ver_grover_restored.2.t:0 "The Amended Clause"
 hsm_ver_grover_restored.2.d:0 "The committee returned the charter with a sentence struck through. Grover had proposed a power to suspend a minister's decision in an emergency. A deputy had written in the margin: Who decides when the emergency is over?\n\nThey worked until the lamps were lit, adding a hearing, a deadline and a duty to give reasons. Representatives of the founding houses brought a different proposal: reserve appointments and exemptions for the families whose officers had secured the restoration.\n\nThe clerk laid both drafts before Grover. The committee wanted a rule that could bind every household; the patrons wanted recognition of obligations they believed the crown already owed."
 hsm_ver_grover_restored.2.a:0 "Enter the committee's text."
 hsm_ver_grover_restored.2.b:0 "Reserve a place for the founding houses."
 hsm_ver_grover_restored.3.t:0 "The Other Side of the Table"
 hsm_ver_grover_restored.3.d:0 "The Vereni envoy brought the expected credentials and, tucked beneath them, a letter from the household that had sheltered Grover. The emperor put the letter beside his cup. He would read it after the meeting.\n\nThere were laboratory visits to arrange and qualifications to recognise. The envoy disagreed with a proposed deadline; Grover asked his minister to offer another. Neither delegation needed to pretend that friendship removed the work of negotiation.\n\nAfterwards, alone for a few minutes, he opened the letter. Someone had asked whether he was getting enough sleep."
 hsm_ver_grover_restored.3.a:0 "An answer for the envoy, and one for home."
 hsm_ver_grover_restored.4.t:0 "An Ordinary Morning"
 hsm_ver_grover_restored.4.d:0 "The morning papers carried a dispute over a workshop contract, the names of the university's new lecturers and a complaint about an army delivery blocking a market street. The emperor appeared halfway down the second page.\n\nGrover read the complaint twice and sent it to the responsible minister. His secretary asked whether the palace wanted a public reply. He said that the market wanted its street back.\n\nFrom the window he could see the queue moving at the petitions office. There would be difficult mornings after this one, and decisions no oath could make easy. For now, the officials had begun their work without waiting for him to appear."
 hsm_ver_grover_restored.4.a:0 "Send the papers to the cabinet."
 hsm_ver_grover_restored.1.d_filtered:0 "The chamberlain offered Grover a list of suitable questions before the public hearing. It was a familiar courtesy: his tutors had once chosen the books, visitors and arguments he was allowed to encounter.\n\nHe recognised one of the petitioners from an earlier procession. Her question was absent from the list. The chamberlain explained that ministers could investigate it first and bring a considered answer to a later audience. The petitioner feared that her landlord would receive an answer long before she did.\n\nGrover put the list beside the oath he had just signed. Its promise to hear his subjects left him a decision about who would be allowed to speak for them."
 hsm_ver_grover_restored.2.d_patron:0 "A familiar family name appeared beside the committee's proposed rule on public contracts. Years earlier, Grover had learned how easily a patron's reputation could outweigh a petitioner's evidence. Now the same household sought an exemption from the charter's new procedure.\n\nIts representative spoke of officers, loans and promises made during the restoration. The committee's jurist replied that every exemption would become a precedent when the next household arrived.\n\nThe request lay beside the completed charter until evening. Grover could confirm the obligations inherited from his guardians, or require his former protectors to make their case under the common rule. Neither answer would remain a private matter."
 hsm_ver_grover_restored.3.d_eyrie:0 "The envoy from Eyrie laid the credentials beside a letter from Grover's former household. The handwriting brought back the sound of those rooms more clearly than any official seal could. He set the letter aside until the meeting was finished.\n\nThe delegations spent the morning discussing student journeys, workshop visits and the recognition of qualifications. At one point Grover addressed the envoy as he had in childhood, then paused and let his own minister finish the proposal.\n\nWhen the doors closed, he opened the letter. Behind all the titles and appointments, someone still wanted to know whether he was getting enough sleep."
 hsm_ver_grover_restored.4.d_command:0 "The officers presented their annual report with the precision Grover remembered from his own service. He knew where to find the readiness tables and asked a question before the general had reached the second page.\n\nThen the civilian minister opened another file: complaints about requisitions, delayed payments and an exercise that had damaged a village bridge. Grover turned back to the general and asked him to remain while they went through it.\n\nThe meeting lasted longer than the parade outside. By the time it ended, the cabinet had agreed who would repair the bridge and who would answer to the village council. Grover signed the record beneath the minister's name."
 HSM_VER_GRO_restored_public_service:0 "Provincial Public Service"
 HSM_VER_GRO_restored_public_service_desc:0 "Local courts and reconstruction offices share a public record of contracts, claims and completed work. A stalled project has an office answerable for it, and a petitioner can follow its progress beyond the palace gates."
 HSM_VER_GRO_restored_civic_settlement:0 "Institutions of the Settlement"
 HSM_VER_GRO_restored_civic_settlement_desc:0 "The restored state rests on working institutions: workshops that train apprentices, laboratories that exchange their findings and ministries that can carry out a decision without waiting for another ceremony."
