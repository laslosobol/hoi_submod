l_english:
 HSM_AVI_three_separate_seals:0 "Three Seals, One Constitution"
 HSM_AVI_three_separate_seals_desc:0 "Katrina's Intergigantes has brought the Houses from rivalry to friendship. Its next task is to prepare a united Verenia. Begin with separate signatures on a common charter, so that courts, accounts and public offices can earn the authority a single country will need. The Houses retain their governments during this first settlement; the constitutional convention will decide how those powers pass to a common government."
 HSM_AVI_charter_without_submission:0 "The First Constitutional Charter"
 HSM_AVI_charter_without_submission_desc:0 "Submit the charter to Erie and Eyrie, then seek Avian's own ratification. Common courts and services will be the first institutions of the future Verenia. Their present jurisdiction must be explicit, and each House must accept its obligations. This provisional division of powers gives the later convention an enforceable foundation for a common treasury, citizenship and government."
 HSM_AVI_defence_without_a_master:0 "Defence Under Civil Authority"
 HSM_AVI_defence_without_a_master_desc:0 "The common staff needs officers who can work together and engineers who can maintain the same defences. Train them under the charter's civilian authority. The present commands remain responsible for their forces while the convention prepares the laws and appropriations needed for a unified army. Avian's experience will help turn coordination into a service of the future state."
 HSM_AVI_open_minutes_desc:0 "Publish the levy dispute, its resolution and the obligations that remain. The towns must be able to judge how the first common institutions have used their powers before they are asked to entrust more to a united government. These records will accompany our delegates to the constitutional convention."
 HSM_AVI_a_union_worth_keeping:0 "A Mandate for United Verenia"
 HSM_AVI_a_union_worth_keeping_desc:0 "The charter has survived a dispute over money and authority. Its courts can bind the host, its offices can publish honest accounts, and its workshops can plan beyond a season. Conclude this first settlement and open a constituent convention. The next negotiations will establish common institutions and choose the government that will bring the Houses into one country. Avian can seek that responsibility under the same ratified constitution."
 HSM_AVI_route_choice_tt:0 "Begins the §Yconstitutional unification of Verenia§!. Avian becomes an observer and seeks a separately ratified charter. Completing the first constitutional settlement opens the §YConstituent Convention§! for institutions, a common government and eventual unification into one country. This commitment closes the native §YSecond Winterfest Ball§! route."
 HSM_AVI_full_integration_tt:0 "Begins §YThree Seals, One Constitution§! and opens its constitutional campaign. Existing treaty and charter signatures remain in force. The Houses negotiate the institutions of a united Verenia; the final transfer of authority follows the constituent convention and ratification."
 HSM_AVI_constituent_convention_tt:0 "The first constitutional settlement is complete. Opens the §YConstituent Convention§! for further constitutional negotiations leading to §Yone united Verenia§!. Avian may become the seat of the common government. Each further commitment requires the convention's own approvals."
 hsm_ver_avian.1.t:0 "The First Page of a Constitution"
 hsm_ver_avian.1.d:0 "The secretary placed Avian's seal above those of Erie and Eyrie. Katrina moved it beside them. There would be time to decide where the common government should sit; today they needed a document all three governments could sign.\n\nShe was aunt to both Vincent and Iovinus, and had spent enough receptions persuading them to remain in the same room. Friendship had made that possible. A country would need more: courts whose decisions survived an offended duke, accounts that survived an awkward question, and offices able to work after their patrons went home.\n\nKatrina asked for an observer's place at the charter talks and a separate instrument for Avian's ratification. Each House would first grant defined powers to the common institutions. Once those powers had been tested, a constituent convention could settle citizenship, revenue and the transfer to one government. Three seals would open the work. They did not have to remain three borders."
 hsm_ver_avian.1.a:0 "Prepare the first common charter."
 hsm_ver_avian.50.t:0 "From Charter to Country"
 hsm_ver_avian.50.d:0 "The secretary brought the next agenda with a blank space where the place of meeting should have been. Erie proposed its own hall; Eyrie requested a copy of the levy judgment before choosing a delegation. Katrina asked for both letters to be entered in the record.\n\nThe first charter had done something a family promise could not. Its court had reached the host, its accounts recorded actual commitments, and the towns had been allowed to question an appropriation. These were institutions on which a country could be built. They were still divided among three administrations, and every shared undertaking had to cross that division again.\n\nThe new agenda therefore called for a constituent convention: a treasury with lawful revenues, common citizenship, and a government responsible for the whole of Verenia. Avian could offer to host that government, but the Houses would have to ratify its powers and the eventual transfer of authority. Katrina signed the invitation. The charter had given them a first settlement. Now they could negotiate one country."
 hsm_ver_avian.50.a:0 "Convene the delegates for a united Verenia."
 HSM_AVI_preserved_union:0 "Avian Has Committed to Constitutional Unification"
 HSM_AVI_settlement_completed:0 "The First Constitutional Settlement Is Complete"
 full_integration:0 "Prepare Constitutional Integration"
 full_integration_desc:0 "The common markets, colleges and transport agreements have given Intergigantes practical weight. Commission a constitutional settlement to carry this cooperation towards one Verenia. Katrina will open the charter negotiations, test the first common institutions and then bring the question of a united government before a constituent convention. The Houses' authority must pass through agreed laws and ratification."
