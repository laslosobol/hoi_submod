l_english:
 hsm_cya_story.1.t:0 "A Copy for the Petitioner"
 hsm_cya_story.1.d:0 "The ferrymaster had brought no petition. He laid a folded copy of the provincial agreement on the Countess's table, carefully avoiding a ring left by her teacup. His boat had carried soldiers across the river all winter. Now the depot wanted its timber to repair a warehouse.\n\n'The governor says the agreement permits it.'\n\n'It permits a requisition,' she answered.\n\n'And an appeal. He says the appeal must go to him.'\n\nThe Countess looked at her own signature. It had been easy to promise lawful government while everyone in the room wanted the war to end. The ferrymaster had travelled here to discover whether she had meant it. Behind him, her secretary waited to learn the same thing."
 hsm_cya_story.1.a:0 "The promise binds my treasury too."
 hsm_cya_story.1.b:0 "Review this seizure, but reserve the Crown's budget discretion."
 hsm_cya_story.2.t:0 "The Crossing"
 hsm_cya_story.2.settled.d:0 "A little wooden boat arrived with the provincial post. The ferryman's daughter had carved it while he repaired the real one. His appeal had been upheld before the reconstruction budget was negotiated again.\n\nThe Countess set the model beside the new settlement. The provinces had accepted a different allocation, but not the suggestion that her earlier signature could simply be forgotten. Obtaining their agreement had taken more than an order.\n\n'The boat can stay,' she told the clerk clearing her desk.\n\nIt was a small reminder of the difference between changing an arrangement and pretending it had never existed."
 hsm_cya_story.2.bound.d:0 "A small wooden boat arrived with the provincial dispatches. It was a model, roughly carved, with a strip of blue cloth for a river. The ferrymaster's daughter had made it while her father repaired the real vessel.\n\nThe appeal had succeeded. Paying for the warehouse another way had taken three meetings and a quarrel with the quartermaster. The finance minister now wanted to know whether every district could expect the same consideration.\n\nThe Countess put the boat beside the maps. 'If they can produce the same signature.'\n\nThe minister did not smile. Neither did she. The miniature stayed on the table when the next budget was brought in."
 hsm_cya_story.2.discretion.d:0 "The ferrymaster's receipt returned before he did. The seizure had been cancelled by a personal order; at the bottom, the governor had carefully written that it created no precedent.\n\n'He has his boat,' the secretary said.\n\n'And the next ferrymaster?'\n\n'Will have to find his way here.'\n\nThe Countess left the receipt unsigned for a while. She had preserved the freedom to move funds where they were needed. She had also made herself the last bridge between a provincial promise and the official who could ignore it. Eventually she signed. Outside, another petitioner was already waiting."
 hsm_cya_story.2.a:0 "Leave the copy where I can see it."
 hsm_cya_story.3.t:0 "After the Last Campaign"
 hsm_cya_story.3.d:0 "Dawnclaw found the colonel still standing outside his office after midnight. The report had been delivered hours ago. What remained was a letter from the colonel's regiment, written in the careful language soldiers used when they were afraid of sounding afraid.\n\nThey had been promised that their service would count when the fighting ended. Did that mean pensions and a place in the reserve, or only a medal and a railway ticket?\n\n'You are asking me to guarantee appointments before I know what the next war requires.'\n\n'I am asking what happens if there is no next war.'\n\nFor once, Dawnclaw had no map to point at. He pulled the letter closer."
 hsm_cya_story.3.a:0 "Guarantee funded places in the post-war reserve."
 hsm_cya_story.3.b:0 "Service deserves recognition, not permanent appointments."
 hsm_cya_story.4.t:0 "A Request for Leave"
 hsm_cya_story.4.settled.d:0 "The colonel's next letter gave a home address instead of a casualty list. His reserve appointment had been replaced by the demobilization settlement. He asked Dawnclaw to confirm the terms in writing before he moved his family.\n\nThe general almost referred him to the commission. Then he found his first promise beneath the later papers. The colonel had not forgotten whose word he had relied upon.\n\nDawnclaw signed the confirmation. There would be no permanent place at the garrison, but neither would the officer leave with nothing except instructions to ask somebody else. For once, the letter on his desk concerned an obligation discharged rather than another service required."
 hsm_cya_story.4.bound.d:0 "The colonel's next letter was shorter. With a reserve appointment promised, he wanted leave to bring his family closer to the garrison. For the first time, he had enclosed an address rather than a list of losses.\n\nDawnclaw approved the leave. Then he found the finance office's objection beneath it: every such appointment was already being counted against the future civilian budget. His staff had begun to speak of the promise as an acquired right.\n\nHe remembered why he had made it. These officers had stayed when obedience was dangerous. That did not make the bill smaller. He returned the objection without crossing out the appointment."
 hsm_cya_story.4.term.d:0 "The colonel submitted his peacetime plans with a blank beside his own name. Dawnclaw asked why.\n\n'You said the commission ended with the campaign. I thought someone else should decide whether I am still needed.'\n\nIt was exactly the answer the order required. It was also the first time the general had heard it from an officer he trusted. For several seconds he considered writing an exception. Instead he passed the file to the appointments board.\n\nAn army that obeyed him only while he protected every career would never truly belong to the state. He understood the argument. He disliked how lonely it made the room."
 hsm_cya_story.4.a:0 "File the letter with the original order."
 hsm_cya_story.5.t:0 "The Unmarked Ferry"
 hsm_cya_story.5.d:0 "Grover had been given a clean map for his lesson. The roads were straight, the borders distinct, the towns represented by neat circles. Beside it lay a transport report which mentioned a village the map did not show.\n\n'Where do they cross the river?' he asked.\n\nThe tutor searched the legend. 'It is not important enough for this scale.'\n\n'But the report says they cannot get to the mill.'\n\nThe boy drew a small boat in the margin. His tutor could have corrected the untidy addition. Instead, he carried both sheets to the household office and asked which version of the country the young emperor was supposed to study."
 hsm_cya_story.5.a:0 "Give him the reports without removing the difficult passages."
 hsm_cya_story.5.b:0 "Let the tutor prepare explanations before he reads them."
 hsm_cya_story.6.t:0 "A Question in the Margin"
 hsm_cya_story.6.open.d:0 "The next bundle of reports returned from Grover's room with questions pencilled along the edges. Some were childish. Why did a bridge cost more than a school? Could the army lend its boats? Others made the clerks uncomfortable: who had decided that the ferry could wait?\n\nHis tutor expected a reprimand. Instead the boy asked whether unanswered questions belonged in next month's bundle.\n\n'Yes,' the tutor said, after a pause.\n\nGrover numbered them. He had not learned how to repair a bridge. He had learned that an answer could be late, and that someone ought to notice."
 hsm_cya_story.6.filtered.d:0 "The tutor's explanation was faultless. The ferry had been omitted because a larger bridge served the district, the mill because grain deliveries could be reorganised. Grover copied the answer in a careful hand.\n\nLater he asked why the village had sent another letter if its problem had already been explained. His tutor began the explanation again, then stopped.\n\n'Knowing why a thing happened is not always the same as putting it right.'\n\nThe boy did not erase the answer. Beneath it he left enough space for another. When the lesson ended, the map went back into its case with the little boat still in the margin."
 hsm_cya_story.6.a:0 "Keep the annotated copy."
 hsm_cya_story.7.t:0 "Not His Signature"
 hsm_cya_story.7.d:0 "The coronation had changed the name at the head of the papers. It had not changed the papers themselves. Grover found the first disputed allocation waiting beside his breakfast. A minister had marked it 'continuation of established practice'.\n\n[Root.GetHSMCyaStoryInheritance]\n\n'Then why does it need my signature?'\n\nThe minister began to explain continuity. Grover let him finish. He was not asking whether yesterday's government had existed. He wanted to know whether inheriting its authority also meant never questioning its arrangements.\n\nHe put down the pen. Whatever he decided, he would have to answer to those who had relied on the old promises."
 hsm_cya_story.7.a:0 "Keep the undertakings. Change policy through their agreed procedures."
 hsm_cya_story.7.b:0 "Call their representatives and negotiate a public revision."
 hsm_cya_story.8.t:0 "When the Door Stayed Open"
 hsm_cya_story.8.d:0 "The last petitioner had gone, but the chamberlain had not closed the doors. Grover was still at the small table beneath the window, reading a letter which contained neither congratulations nor an appeal to his ancestors. A district clerk wanted an answer to a question that had survived three administrations.\n\n[Root.GetHSMCyaStoryChildhood]\n\n[Root.GetHSMCyaStorySettlement]\n\nThe chamberlain asked whether tomorrow's audience should follow the same arrangements.\n\n'Yes. And bring back the questions we did not answer today.'\n\nThere would be no proclamation about that instruction. By morning, someone outside the palace would know whether it had been obeyed."
 hsm_cya_story.8.a:0 "There is work for tomorrow."
 hsm_cya_story.9.t:0 "A Letter without a Decree"
 hsm_cya_story.9.civil.d:0 "A widow's petition reached Grover through the civilian audience office. She wanted the name on a casualty notice corrected so that her children could claim their father's pension. There was no question of imperial policy, and perhaps that was why the guards let him keep it.\n\nHe asked for the regiment's reply. His secretary reminded him that he could request one, not order it.\n\n'I know.'\n\nHe wrote a short letter and signed only his name. Dawnclaw's office received a copy before it left the palace. The emperor watched the original disappear into the dispatch bag and wondered which would arrive first: the request or the instruction about how to answer it."
 hsm_cya_story.9.staff.d:0 "The audience report contained a single line about a widow and a disputed casualty notice. Grover asked to see the petition. His secretary explained that the staff office had already forwarded it to the proper authority.\n\n'Which authority?'\n\nThe secretary did not know. Finding out would require another request.\n\nGrover wrote one. He was permitted to sign it, although not to send it without review. On the copy kept for his own records, he added the woman's name in the margin. The crown on the paper was magnificent. It did not tell him where the letter would go."
 hsm_cya_story.9.a:0 "Keep her name on the next audience list."
 hsm_cya_story.10.t:0 "The Answer"
 hsm_cya_story.10.civil.d:0 "The corrected notice came back with a brief acknowledgement. The widow had received her payment. Grover read the letter twice, then asked whether he could answer her himself. His secretary glanced towards the guard before nodding.\n\nHe had not appointed a minister, dismissed an officer or altered a law. Tomorrow the same doors would still be locked, and the staff would still decide which papers reached him.\n\nYet someone had written to him, and something had been put right. Grover placed the letter in a drawer beside the unanswered petitions. It was not proof that he ruled. It was a reason to open the drawer again."
 hsm_cya_story.10.staff.d:0 "The reply said that the widow's case had been processed according to regulation. It did not say whether the name was corrected or the pension paid. Grover asked his secretary which regulation.\n\n'That is all they sent, Your Majesty.'\n\nHe could summon a procession more easily than an honest answer. For a moment he considered tearing the report in half. Instead he wrote the date beside the woman's name and asked that the question be sent again.\n\nBeyond the door, the guard changed. Nothing in the palace had altered. At the emperor's desk, the unanswered list had not been thrown away."
 hsm_cya_story.10.a:0 "Ask again."
 hsm_cya_story.11.t:0 "The Oath with a Missing Name"
 hsm_cya_story.11.executed.d:0 "The first peacetime intake was waiting in the courtyard. An adjutant brought Dawnclaw the oath and asked which form of address should stand where the emperor's name had once been.\n\nDawnclaw remembered an order that had required no such hesitation. Grover was dead because he had chosen it. No victory report could turn that decision into an accident, and no successor's title could make it temporary.\n\n'The state,' he said.\n\nThe adjutant waited, expecting more. Nothing came. Below the window, recruits practised the words they would carry into service. Most had been children when the old crown fell. They would inherit his institutions without having heard his explanations."
 hsm_cya_story.11.absent.d:0 "The first peacetime intake was waiting in the courtyard. An adjutant brought Dawnclaw the oath and asked what should replace the emperor's name.\n\nGrover had died elsewhere. The general had neither issued that order nor been able to prevent it. For years, the missing heir had been a question to be settled after the next campaign. Now the campaigns had ended, and the question remained.\n\n'The state,' he said.\n\nThere would be no convenient name added in the margin. The succession council would have to do its work, and the army would have to serve while it did. Dawnclaw watched the recruits assemble and wondered how much of his authority depended on their never having to wait for anyone else."
 hsm_cya_story.11.a:0 "Let the next oath outlive its author."
 hsm_cya_story.12.t:0 "The Chair by the Window"
 hsm_cya_story.12.d:0 "The rooms prepared for the emperor were finally needed for something else. A clerk asked the Countess whether the furniture should be sent to the provincial delegation. She agreed, then stopped him at the door.\n\n'Leave the small table.'\n\nThere had been plans for lessons, audiences, a first winter with fewer guards. Not all of them had ever become memories. Grover was dead; keeping a room empty would not honour him more faithfully than governing the country left behind.\n\nShe sat by the window and opened the succession council's correspondence. The crown remained where it was. Before answering the jurists, she turned to a petition from a river district. Someone there was still waiting for a promise to be kept."
 hsm_cya_story.12.a:0 "Bring in the petitioner."
 HSM_CYA_story_circumstances_changed:0 "The household must set this matter aside."
 HSM_CYA_story_provincial_guarantee_tt:0 "The Crown guarantees priority for provincial reconstruction, increasing compliance growth by 3%. Choosing the central research budget will end this bonus and require a separate settlement costing 75 political power, unless Grover has already renegotiated the guarantee."
 HSM_CYA_story_revocable_mandate_tt:0 "This seizure will be reviewed individually. No new binding priority is granted over the post-war budget; existing provincial rights remain unchanged."
 HSM_CYA_story_officer_guarantee_tt:0 "Guaranteed reserve appointments retain experienced instructors, reducing division training time by 5%. Civilian demobilization will end this bonus and require a separate settlement costing 75 political power, unless Grover has already renegotiated the guarantee."
 HSM_CYA_story_term_commissions_tt:0 "Appointments remain subject to review after the campaign. No additional settlement is required for civilian demobilization."
 HSM_CYA_story_inherited_mandates_tt:0 "Inherited budget guarantees remain binding. A conflicting post-war programme will still require its stated settlement; no other provincial rights or focus rewards change."
 HSM_CYA_story_reviewed_mandates_tt:0 "Public negotiations release the inherited reconstruction and reserve guarantees, ending their compliance and training bonuses. If either remains outstanding, negotiations cost 50 political power now instead of a later 75-point settlement. Existing autonomy and other programme bonuses are preserved."
 HSM_CYA_story_officer_settlement_tt:0 "The guaranteed reserve appointments must be settled before reallocating their budget to civilian demobilization."
 HSM_CYA_story_provincial_settlement_tt:0 "The provinces must agree to release their guaranteed reconstruction allocation for the central research budget."
 HSM_CYA_story_memory_open:0 "He remembered the little boat he had drawn on a school map, and the first bundle of reports returned with his questions still unanswered."
 HSM_CYA_story_memory_filtered:0 "He remembered a tutor who had explained a missing ferry perfectly, then admitted that an explanation did not carry anyone across a river."
 HSM_CYA_story_memory_adult:0 "He had learned enough since taking power to distrust a clean margin. It often meant that someone else's question had been left out."
 HSM_CYA_story_inheritance_provinces:0 "The provincial allocation carried the Countess's guarantee. Delegates had planned their reconstruction around it; they had not mistaken a change of ruler for its cancellation."
 HSM_CYA_story_inheritance_officers:0 "The reserve appointments carried Dawnclaw's guarantee. Officers were planning their families' lives around it. A new seal would not release the Crown from its word."
 HSM_CYA_story_inheritance_unpledged:0 "The file cited established arrangements rather than a special personal guarantee. Even so, the officials who had worked under them expected to know what would survive the change of ruler."
 HSM_CYA_story_settlement_reviewed:0 "The public negotiations had not made every delegation friendly. They had made it harder for ministers to describe an old arrangement as something the emperor could never discuss."
 HSM_CYA_story_settlement_adjusted:0 "The post-war settlement had changed some of the guarantees he inherited. Agreement had cost time and concessions; an earlier signature could be renegotiated, but not made to disappear."
 HSM_CYA_story_settlement_inherited:0 "He had kept the inherited undertakings. Their limits still frustrated him, but a signature meant little if it bound only the person holding the pen that morning."
 HSM_CYA_story_provincial_guarantee:0 "Provincial reconstruction has been guaranteed priority"
 HSM_CYA_story_officer_guarantee:0 "Funded reserve appointments have been guaranteed"
 HSM_CYA_story_reviewed_mandates:0 "Grover has publicly renegotiated the inherited guarantees"
 HSM_CYA_story_provinces_compensated:0 "The provincial budget guarantee has been settled"
 HSM_CYA_story_officers_compensated:0 "The reserve appointment guarantee has been settled"
 HSM_CYA_story_provincial_support_active:0 "The reconstruction guarantee still brings provincial cooperation"
 HSM_CYA_story_officer_support_active:0 "The reserve guarantee still retains experienced instructors"
