 HSM_BAR_investigation_compass_doc_1:0 "Purchase offer / two route sketches"
 HSM_BAR_investigation_compass_fragment_1_1:0 "The seller says the needle finds a buried sanctuary. The quoted inscription is absent from his sketch of the instrument."
 HSM_BAR_investigation_compass_fragment_1_2:0 "The builder is entered as unknown. The merchant's identity is held under £HSM_BAR_redact_long£."
 HSM_BAR_investigation_compass_fragment_1_3:0 "The two drawn routes approach from different directions but both end at the seller's packing shed."
 HSM_BAR_investigation_compass_doc_2:0 "Demonstration terms / Wrona's copy"
 HSM_BAR_investigation_compass_fragment_2_1:0 "Olcha requires a control instrument the seller has never handled. No comparison has yet been witnessed."
 HSM_BAR_investigation_compass_fragment_2_2:0 "The seller's proposed demonstration keeps his instrument in its own case and straps. He offers no uncased route trial."
 HSM_BAR_investigation_compass_fragment_2_3:0 "Wrona asks for the case and instrument together. Neither the sanctuary nor the inscription has been authenticated."
 HSM_BAR_investigation_compass_hypothesis:0 "The routes change, but the destination and the seller's transport arrangement remain. Separate instrument, case, carrier and direction before attributing the deviation to a sanctuary. Exchange one element at a time without telling the carrier which is under test. The offer may be mistaken or deceptive; neither possibility identifies the physical cause in advance."
 HSM_BAR_investigation_compass_mismatch:0 "An undocumented inscription weakens the sales story but cannot explain a turning needle. The useful relationship joins the repeated destination to conditions the seller keeps unchanged. Test those conditions before treating an uncertain history as either proof of a relic or proof of fraud."
 HSM_BAR_investigation_compass_status:0 "[GetHSMBARInvestigationStatus_compass]"
 HSM_BAR_investigation_compass_1_title:0 "Blind route exchange"
 HSM_BAR_investigation_compass_1_brief:0 "Hire a second survey team and exchange the offered compass with Olcha's control without telling the carrier. Repeat the route with and without the case, keeping direction and carrier recorded separately. Retain all fittings for later examination."
 HSM_BAR_investigation_compass_1_report:0 "SURVEY SECTION / exchange sheet sealed\nThe deviation followed the packing case across the exchanges. It did not follow the carrier or the direction of travel. Leaving the case behind removed the alleged route. Wrona retained a fastener from its lining in a separate envelope for examination.\nThe seller requested another demonstration using his own straps; the request was refused. The field record identifies the assembly that requires testing, not a sanctuary. The final material examination must account for the fastener before the file is closed."
 HSM_BAR_investigation_compass_1_price:0 "35 political power / 14 days"
 HSM_BAR_investigation_compass_1_remaining:0 "FIELDWORK / [?days_mission_timeout@HSM_BAR_investigation_compass_1_mission|0] days remaining"
 HSM_BAR_investigation_compass_1_mission:0 "$HSM_BAR_investigation_compass_1_title$"
 HSM_BAR_investigation_compass_2_title:0 "Stationary comparison, then a route"
 HSM_BAR_investigation_compass_2_brief:0 "Use the survey workshop to rotate the case around two fixed compasses, changing one fitting at a time. Then verify the resulting suspicion on a short blind route. Borrowed instruments reduce hire costs but require a longer booking."
 HSM_BAR_investigation_compass_2_report:0 "WORKSHOP AND ROUTE / linked records\nWith the compasses fixed, changing the case's position changed the deviation. The subsequent blind exchange on the route reproduced the dependence on the case rather than on its bearer. Without the case the promised direction vanished.\nA lining fastener is held separately with the test order. Its physical properties remain for laboratory examination; the workshop has not certified the merchant's inscription or intent. Wrona filed the stationary measurements beside the route sheet so that neither can be mistaken for a journey to a hidden sanctuary."
 HSM_BAR_investigation_compass_2_price:0 "25 political power / 28 days"
 HSM_BAR_investigation_compass_2_remaining:0 "FIELDWORK / [?days_mission_timeout@HSM_BAR_investigation_compass_2_mission|0] days remaining"
