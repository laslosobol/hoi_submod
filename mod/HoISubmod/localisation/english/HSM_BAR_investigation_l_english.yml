l_english:
 HSM_BAR_investigation_rock_doc_1:0 "Mason's statement / physician's extract"
 HSM_BAR_investigation_rock_fragment_1_1:0 "No fragment accompanied the statement. The witness declined to recover his tools."
 HSM_BAR_investigation_rock_fragment_1_2:0 "The witness described the cut closing after the stone yielded to his chisel. He did not describe a fall of loose rubble."
 HSM_BAR_investigation_rock_fragment_1_3:0 "Krzemien retained his final question: would the Republic require him to finish the excavation?"
 HSM_BAR_investigation_rock_doc_2:0 "Works office / preliminary incident slip"
 HSM_BAR_investigation_rock_fragment_2_1:0 "The temple plan is enclosed. The witness's identifying details travel under £HSM_BAR_redact_short£."
 HSM_BAR_investigation_rock_fragment_2_2:0 "No inspection signature stands beneath the request to reopen the passage."
 HSM_BAR_investigation_rock_fragment_2_3:0 "The draft enters 'settling at the tool's point of contact'. That location was supplied by the clerk, not by an inspection."
 HSM_BAR_investigation_rock_hypothesis:0 "The draft turns a witness's account into a measured location that nobody measured. Olcha requests separate marks for the point of pressure and any subsequent movement, with an untouched stretch of wall in view. A closing cut, loose settling and movement elsewhere would leave different records. The old opening is sufficient; no new passage is authorised."
 HSM_BAR_investigation_rock_mismatch:0 "These passages help establish how the complaint reached the office, but do not test its explanation. The useful discrepancy concerns what the witness saw and what the draft claims was measured. Wrona will not send a crew back merely to confirm a clerk's choice of words."
 HSM_BAR_investigation_rock_status:0 "[GetHSMBARInvestigationStatus_rock]"
 HSM_BAR_investigation_rock_1_title:0 "Paired survey marks"
 HSM_BAR_investigation_rock_1_brief:0 "Hire a survey crew for a short, supervised visit. Mark the existing cut and the adjoining face separately. Apply limited pressure with a handled probe while a second observer records both marks; stop at the first displacement."
 HSM_BAR_investigation_rock_1_report:0 "WRONA / marked sheet enclosed\nPressure was applied at the old cut. The second observer recorded movement beneath the neighbouring mark, not beneath the probe. The untouched reference remained legible. Loose grains were lifted from the existing cut into a labelled envelope; no passage was opened.\nThe works copy again arrived with only one mark. Wrona returned it unsigned. Both marks now accompany the field inventory. This establishes a displacement to investigate, not a useful building material."
 HSM_BAR_investigation_rock_1_price:0 "35 political power / 14 days"
 HSM_BAR_investigation_rock_1_remaining:0 "FIELDWORK / [?days_mission_timeout@HSM_BAR_investigation_rock_1_mission|0] days remaining"
 HSM_BAR_investigation_rock_1_mission:0 "$HSM_BAR_investigation_rock_1_title$"
 HSM_BAR_investigation_rock_2_title:0 "An undisturbed watch"
 HSM_BAR_investigation_rock_2_brief:0 "Keep the passage closed and photograph the face at regular intervals without touching it. A small watch can establish whether displacement occurs without excavation, but cannot compare pressure with movement."
 HSM_BAR_investigation_rock_2_report:0 "WATCH LOG / no contact made\nThe fixed photographs show no measurable change during the watch. That excludes continuous settling over the observed interval; it says nothing about what happened under the mason's chisel. His account began with contact, which this watch deliberately omitted.\nThe reference photographs are retained. Another visit requires a marked pressure trial and the surveyor's attendance; extending an unchanged watch would not answer the remaining question. No clearance to reopen the passage has been signed."
 HSM_BAR_investigation_rock_2_price:0 "20 political power / 21 days"
 HSM_BAR_investigation_rock_2_remaining:0 "FIELDWORK / [?days_mission_timeout@HSM_BAR_investigation_rock_2_mission|0] days remaining"
 HSM_BAR_investigation_rock_2_mission:0 "$HSM_BAR_investigation_rock_2_title$"
 HSM_BAR_investigation_rock_3_title:0 "Remote contact record"
 HSM_BAR_investigation_rock_3_brief:0 "Fit a borrowed mechanical recorder to a handled probe and photograph the marked face from the entrance. Calibration and repeated reference exposures take longer, but reduce the time observers spend beside the cut."
 HSM_BAR_investigation_rock_3_report:0 "OLCHA / contact trace and plates\nThe recorder fixes contact at one mark; successive plates place the displacement beneath its neighbour. An empty probe stroke produced no corresponding change. The apparatus was withdrawn after the limited trial.\nWrona collected only grains already loose in the old cut. Their envelope carries the plate references, including the apparently uneventful control. No new opening was made. The field survey retains two locations where the office draft supplied one; whether detached material behaves similarly remains a laboratory question."
 HSM_BAR_investigation_rock_3_price:0 "25 political power / 28 days"
 HSM_BAR_investigation_rock_3_remaining:0 "FIELDWORK / [?days_mission_timeout@HSM_BAR_investigation_rock_3_mission|0] days remaining"
 HSM_BAR_investigation_rock_3_mission:0 "$HSM_BAR_investigation_rock_3_title$"
 HSM_BAR_investigation_titan_doc_1:0 "Excavation ledger / loose leaf"
 HSM_BAR_investigation_titan_fragment_1_1:0 "Rope, oil and three lamps precede the entry for the construct. Replacement rope follows it."
 HSM_BAR_investigation_titan_fragment_1_2:0 "No surviving entry records the casting of the old body. The earlier builder's name remains absent."
 HSM_BAR_investigation_titan_fragment_1_3:0 "Olcha's note: Leopold found the machine. A later alteration cannot serve as the original drawing of an excavated joint."
 HSM_BAR_investigation_titan_doc_2:0 "Workshop / proposed clean reconstruction"
 HSM_BAR_investigation_titan_fragment_2_1:0 "The drafter has extended a dimension from Leopold's correction across every joint. Earlier lines are to be erased as duplicates."
 HSM_BAR_investigation_titan_fragment_2_2:0 "Several leaves were cut close to the binding. Neither the clean copy nor its covering note identifies what they contained."
 HSM_BAR_investigation_titan_fragment_2_3:0 "Krzemien asks whether the drawings might help lift a fallen roof. She has not requested the machine's restoration."
 HSM_BAR_investigation_titan_hypothesis:0 "The clean drawing assumes continuity where the excavation record requires a distinction. Compare joints and notation before combining dimensions: a correction may describe Leopold's addition rather than the older mechanism beneath it. Preserve the sequence and the missing leaves. Nothing here warrants naming the first builder or assembling a complete Titan."
 HSM_BAR_investigation_titan_mismatch:0 "Missing pages and supply purchases establish an incomplete excavation record, but do not validate any reconstructed dimension. The disputed step is the transfer of a later correction onto older parts. A convincing silhouette would still leave that step untested."
 HSM_BAR_investigation_titan_status:0 "[GetHSMBARInvestigationStatus_titan]"
 HSM_BAR_investigation_titan_1_title:0 "A model of the clean drawing"
 HSM_BAR_investigation_titan_1_brief:0 "Build a small inert model from the proposed clean sheet. This tests whether the drafter's joints fit together, without moving the excavated sections. It relies on the very dimensional conversion under dispute."
 HSM_BAR_investigation_titan_1_report:0 "WORKSHOP RETURN / model retained\nThe joints fit only where the drafter supplied spacers absent from the surviving sheets. Removing those additions prevents the model from closing. This exposes an assumption in the clean reconstruction, not a defect demonstrated in the original machine.\nThe model is labelled with its added parts and kept for comparison. A renewed assignment must inspect the underlying measurements or establish the order of the drawings. More work on the same silhouette would merely conceal the missing evidence more neatly."
 HSM_BAR_investigation_titan_1_price:0 "20 political power / 21 days"
 HSM_BAR_investigation_titan_1_remaining:0 "FIELDWORK / [?days_mission_timeout@HSM_BAR_investigation_titan_1_mission|0] days remaining"
 HSM_BAR_investigation_titan_1_mission:0 "$HSM_BAR_investigation_titan_1_title$"
 HSM_BAR_investigation_titan_2_title:0 "Survey the surviving joints"
 HSM_BAR_investigation_titan_2_brief:0 "Bring surveyors and a lifting-safety specialist to the accessible remains. Measure external joints without powering or assembling them; match each measurement to its own drawing, retaining altered and unaltered sections separately."
 HSM_BAR_investigation_titan_2_report:0 "TECHNICAL INVENTORY / survey supplement\nThe older joints do not match Leopold's later notation. A second system of measurement accounts for dimensions that the clean copy had treated as damaged figures. Each accessible section now has its own drawing reference and condition record.\nPhotographs of dismantled and intact sections remain separate. Nothing has been powered or reassembled. The missing leaves still prevent a complete reconstruction, but the surviving dimensions can be submitted for a limited load model. The inventory names Leopold as the later modifier, not the first builder."
 HSM_BAR_investigation_titan_2_price:0 "35 political power / 14 days"
 HSM_BAR_investigation_titan_2_remaining:0 "FIELDWORK / [?days_mission_timeout@HSM_BAR_investigation_titan_2_mission|0] days remaining"
 HSM_BAR_investigation_titan_2_mission:0 "$HSM_BAR_investigation_titan_2_title$"
 HSM_BAR_investigation_titan_3_title:0 "Recover the drawing sequence"
 HSM_BAR_investigation_titan_3_brief:0 "Collate bindings, corrections and excavation photographs, then make a limited site check of external dimensions. Work from the separate sheets rather than the clean reconstruction. Archive work saves hired lifting equipment but takes longer."
 HSM_BAR_investigation_titan_3_report:0 "OLCHA / ordered drawing register\nLeopold's corrections form a later layer. The underlying joint drawings use a different measure; a limited check against accessible sections supports keeping both systems rather than averaging them. Cut pages remain gaps in the register, not reconstructed leaves.\nWrona attached separate condition photographs to each surviving stage. The inventory is adequate for a load-model proposal using the recorded dimensions. It supplies neither an intact Titan nor the name of whoever made its oldest parts."
 HSM_BAR_investigation_titan_3_price:0 "25 political power / 28 days"
 HSM_BAR_investigation_titan_3_remaining:0 "FIELDWORK / [?days_mission_timeout@HSM_BAR_investigation_titan_3_mission|0] days remaining"
 HSM_BAR_investigation_titan_3_mission:0 "$HSM_BAR_investigation_titan_3_title$"
 HSM_BAR_investigation_entity_doc_1:0 "Witness sheet / retained wording"
 HSM_BAR_investigation_entity_fragment_1_1:0 "She said 'more than one', gave no number, then wrote the same word at different sizes. She would not read it aloud."
 HSM_BAR_investigation_entity_fragment_1_2:0 "Krzemien permits another interview only with her agreement. The refusal to speak must remain in the record."
 HSM_BAR_investigation_entity_fragment_1_3:0 "The interpreter's rendering is enclosed separately. The speaker's identity is not established by a religious heading."
 HSM_BAR_investigation_entity_doc_2:0 "Dispatch index / unsigned entry"
 HSM_BAR_investigation_entity_fragment_2_1:0 "The handwritten sheet is listed under £HSM_BAR_redact_short£. It has not been transcribed into the index."
 HSM_BAR_investigation_entity_fragment_2_2:0 "The entry assigns one speaker because there is one witness statement. No listening record supports that count."
 HSM_BAR_investigation_entity_fragment_2_3:0 "A blank line requests the interval between a call and a reply. The interview supplied no measured interval."
 HSM_BAR_investigation_entity_hypothesis:0 "The index has counted statements instead of speakers. Neither handwriting nor overlapping speech supplies a reliable number. Olcha proposes independent station logs: record a controlled signal, the interval and the response separately, without completing one observer's account from the other's. Stop if the response changes. No name, bargain or source of power is established by hearing something answer."
 HSM_BAR_investigation_entity_mismatch:0 "These passages concern the handling of testimony, not the number or nature of those heard below. An omitted name is not evidence of a particular being. The immediate question is whether the dispatch has substituted the number of documents for something the witness expressly could not count."
 HSM_BAR_investigation_entity_status:0 "[GetHSMBARInvestigationStatus_entity]"
 HSM_BAR_investigation_entity_1_title:0 "Independent listening stations"
 HSM_BAR_investigation_entity_1_brief:0 "Equip two teams at separate shaft approaches with synchronised clocks. One operator gives a short agreed series; both teams seal their own logs before comparison. Olcha supervises withdrawal if the response changes. No descent or renewed witness exposure."
 HSM_BAR_investigation_entity_1_report:0 "WRONA / two covers, no combined transcript\nThe independent logs describe the same early responses. After the third signal the response changed; Olcha ordered both teams away. Neither log supplies a dependable count of speakers. The signal sequence is retained, its last wording held under £HSM_BAR_redact_long£.\nTiming entries were preserved rather than forced into a single delay. They await comparison with an ordinary acoustic control. An older Pentarchy transcript breaks in a comparable place. The field file records a contact and a withdrawal, not an identified being under our control."
 HSM_BAR_investigation_entity_1_price:0 "35 political power / 14 days"
 HSM_BAR_investigation_entity_1_remaining:0 "FIELDWORK / [?days_mission_timeout@HSM_BAR_investigation_entity_1_mission|0] days remaining"
 HSM_BAR_investigation_entity_1_mission:0 "$HSM_BAR_investigation_entity_1_title$"
 HSM_BAR_investigation_entity_2_title:0 "Separate signal and response"
 HSM_BAR_investigation_entity_2_brief:0 "Prepare a short sequence with unequal pauses, testing the recorders away from the workings first. Repeat only the agreed sequence at two guarded listening positions. Keep the operator's timing sheet separate from the listeners' descriptions; withdraw on a changed response."
 HSM_BAR_investigation_entity_2_report:0 "OLCHA / three sheets to be kept separate\nThe operator's sheet distinguishes the imposed pauses from what the listeners recorded. Their first descriptions agree. The third signal brought a changed response and the trial ended on Olcha's order, not at its planned hour.\nThe records do not justify a fixed count or a fixed-delay explanation. Comparison with ordinary returning sound remains required. Wrona found a comparable interruption in the old Pentarchy papers and attached its reference without supplying the missing words. No extraction apparatus was brought below."
 HSM_BAR_investigation_entity_2_price:0 "25 political power / 28 days"
 HSM_BAR_investigation_entity_2_remaining:0 "FIELDWORK / [?days_mission_timeout@HSM_BAR_investigation_entity_2_mission|0] days remaining"
 HSM_BAR_investigation_entity_2_mission:0 "$HSM_BAR_investigation_entity_2_title$"
 HSM_BAR_investigation_entity_3_title:0 "Listen without addressing it"
 HSM_BAR_investigation_entity_3_brief:0 "Leave a guarded recording post at the upper approach without sending signals. This avoids initiating contact and may establish when overlapping sounds occur. It cannot by itself show whether any sound answers an observer."
 HSM_BAR_investigation_entity_3_report:0 "PASSIVE WATCH / timing sheet retained\nThe recording contains overlapping sounds, but no agreed call against which to test a reply. Two transcribers divide the same passage differently; neither can certify a number of speakers. The disagreement is attached, not settled by choosing the neater transcript.\nThe watch identifies material requiring controlled comparison. A further assignment needs a signal record and independent listeners, with a withdrawal rule. Replaying this reel until a familiar name appears would not supply the missing control."
 HSM_BAR_investigation_entity_3_price:0 "20 political power / 21 days"
 HSM_BAR_investigation_entity_3_remaining:0 "FIELDWORK / [?days_mission_timeout@HSM_BAR_investigation_entity_3_mission|0] days remaining"
 HSM_BAR_investigation_entity_3_mission:0 "$HSM_BAR_investigation_entity_3_title$"
 HSM_BAR_investigation_amulet_doc_1:0 "Settlement letter / enclosed account"
 HSM_BAR_investigation_amulet_fragment_1_1:0 "They ask for the survey stakes to be moved, not the protection. Janosik bought the amulet before the plants came."
 HSM_BAR_investigation_amulet_fragment_1_2:0 "The remembered event concerns plants turning away at the settlement edge. The writer names no other repelled danger."
 HSM_BAR_investigation_amulet_fragment_1_3:0 "The address is £HSM_BAR_redact_long£. The appeal ends: 'Do not take away the thing that kept us alive.'"
 HSM_BAR_investigation_amulet_doc_2:0 "Trader's promise / collected versions"
 HSM_BAR_investigation_amulet_fragment_2_1:0 "Three tellings preserve different explanations of the purchase. None is a signed account by the trader himself."
 HSM_BAR_investigation_amulet_fragment_2_2:0 "Olcha has requested the exact words. One witness will speak only to the doctor; that condition is retained."
 HSM_BAR_investigation_amulet_fragment_2_3:0 "One version promises protection 'against everything born below Barrad'. It lists no observation beyond the plants."
 HSM_BAR_investigation_amulet_hypothesis:0 "The promise covers more than the remembered event. Map where protection was actually observed and what encountered it, keeping the trader's broader claim separate. Compare accounts against fixed landmarks without moving the amulet or introducing a threat. The village's survival is a reason to preserve its defence, not a licence to test it to destruction."
 HSM_BAR_investigation_amulet_mismatch:0 "The purchase and the residents' refusal establish why removal is unacceptable. They do not establish the ward's reach. The comparison must distinguish a witnessed protective effect from a promise about dangers nobody in these passages encountered."
 HSM_BAR_investigation_amulet_status:0 "[GetHSMBARInvestigationStatus_amulet]"
 HSM_BAR_investigation_amulet_1_title:0 "Observe the boundary in place"
 HSM_BAR_investigation_amulet_1_brief:0 "Hire surveyors to record the existing plant margin and settlement landmarks with residents present. Compare observation points inside and outside the reported line without bringing plants across it. Leave both amulet and stakes undisturbed."
 HSM_BAR_investigation_amulet_1_report:0 "WRONA / boundary sheet\nThe observations can be placed against the settlement edge. Residents agree on where the plants turned away; claims about other threats remain separate and inconsistent. The survey keeps the recorded line distinct from the trader's broader promise.\nNo test creature or hostile material was introduced. No requisition for the amulet exists. Readings and statements, not the settlement's defence, accompany the field report. Olcha's request for the trader's exact words remains open."
 HSM_BAR_investigation_amulet_1_price:0 "35 political power / 14 days"
 HSM_BAR_investigation_amulet_1_remaining:0 "FIELDWORK / [?days_mission_timeout@HSM_BAR_investigation_amulet_1_mission|0] days remaining"
 HSM_BAR_investigation_amulet_1_mission:0 "$HSM_BAR_investigation_amulet_1_title$"
 HSM_BAR_investigation_amulet_2_title:0 "Trace the trader's promise"
 HSM_BAR_investigation_amulet_2_brief:0 "Send a clerk and interpreter to compare the three purchase accounts without entering the protected margin. Record who heard the trader directly and who repeated another telling. This tests the promise's transmission, not the boundary itself."
 HSM_BAR_investigation_amulet_2_report:0 "CORRESPONDENCE REVIEW / no boundary readings\nThe broadest version cannot be tied to an independent observation beyond the plants. Differences in wording remain on the comparison sheet; the witness who will speak only to the doctor has not been pressed to waive that condition.\nThis narrows what may honestly be quoted as testimony. It does not locate the ward or measure its limits. A new visit must fund a boundary survey or a landmark-based reconstruction with the residents. The amulet has neither been collected nor declared ineffective."
 HSM_BAR_investigation_amulet_2_price:0 "20 political power / 21 days"
 HSM_BAR_investigation_amulet_2_remaining:0 "FIELDWORK / [?days_mission_timeout@HSM_BAR_investigation_amulet_2_mission|0] days remaining"
 HSM_BAR_investigation_amulet_2_mission:0 "$HSM_BAR_investigation_amulet_2_title$"
 HSM_BAR_investigation_amulet_3_title:0 "Reconstruct the old boundary"
 HSM_BAR_investigation_amulet_3_brief:0 "Let residents mark the earliest plant encounters on separate copies of the settlement plan. Check their landmarks in a slow circuit with a small team, adding current readings without provoking the ward. Preserve disagreements about anything other than plants."
 HSM_BAR_investigation_amulet_3_report:0 "KRZEMIEN / plans returned to their owners\nIndependent recollections converge on the settlement edge for the plants, even where their explanations of the purchase differ. The landmarks were checked on foot and current readings attached. No similar agreement supports the promise against everything below Barrad.\nThe record is sufficient for the boundary file, with disputed accounts still visible. The amulet stayed where its keepers placed it. A later comparative study may use these measurements; it may not borrow the settlement's protection as a specimen."
 HSM_BAR_investigation_amulet_3_price:0 "25 political power / 28 days"
 HSM_BAR_investigation_amulet_3_remaining:0 "FIELDWORK / [?days_mission_timeout@HSM_BAR_investigation_amulet_3_mission|0] days remaining"
 HSM_BAR_investigation_amulet_3_mission:0 "$HSM_BAR_investigation_amulet_3_title$"
 HSM_BAR_investigation_plants_doc_1:0 "Infirmary / three separate admissions"
 HSM_BAR_investigation_plants_fragment_1_1:0 "Different leaves accompanied the three accounts. Each patient used the same local name for the growth."
 HSM_BAR_investigation_plants_fragment_1_2:0 "Two patients reported touching the plants. Their samples remain with their own statements."
 HSM_BAR_investigation_plants_fragment_1_3:0 "The third patient burned a bundle collected by someone else. The record does not say that this patient touched a living plant."
 HSM_BAR_investigation_plants_doc_2:0 "Clearing crew / draft health return"
 HSM_BAR_investigation_plants_fragment_2_1:0 "The map records injury sites. A shared plant name has been copied across several separate marks."
 HSM_BAR_investigation_plants_fragment_2_2:0 "The summary files all three admissions as contact injuries. Its single heading has replaced the separate exposure accounts."
 HSM_BAR_investigation_plants_fragment_2_3:0 "An older boundary note is attached under BR-004. No instruction to burn the margins accompanies it."
 HSM_BAR_investigation_plants_hypothesis:0 "The summary merges contact with exposure to burning material, while the shared name may cover different plants. Reconstruct who encountered what, by which route and at which location. Keep ash apart from leaves and each specimen beside its own account. No additional exposure of a patient is needed to correct a classification that the records already call into question."
 HSM_BAR_investigation_plants_mismatch:0 "A common name or a nearby protective boundary does not establish how these patients were harmed. The comparison must preserve the distinction that the health return erased. Otherwise a remedy for skin contact could be sent to someone whose exposure was through smoke."
 HSM_BAR_investigation_plants_status:0 "[GetHSMBARInvestigationStatus_plants]"
 HSM_BAR_investigation_plants_1_title:0 "Separate collection routes"
 HSM_BAR_investigation_plants_1_brief:0 "A botanist and guarded field team retrace the reported sites with protective equipment. Bag each specimen by location and exposure account, keeping burned material separate. Compare survey marks with the clearing route before approaching unfamiliar growth."
 HSM_BAR_investigation_plants_1_report:0 "HERBARIUM / route labels retained\nThe collection no longer treats the local name as a species. Familiar irritants were separated from specimens whose responses remain unexplained; burned material has its own container and source account. No volunteer was exposed.\nAt one stretch the survey marks ceased to agree with the workers' route. Wrona halted clearing there and retained both maps. The field inventory now supports separate study of contact, smoke and transport. Olcha's request for the missing growing-schedule leaf remains unanswered."
 HSM_BAR_investigation_plants_1_price:0 "30 political power / 21 days"
 HSM_BAR_investigation_plants_1_remaining:0 "FIELDWORK / [?days_mission_timeout@HSM_BAR_investigation_plants_1_mission|0] days remaining"
 HSM_BAR_investigation_plants_1_mission:0 "$HSM_BAR_investigation_plants_1_title$"
 HSM_BAR_investigation_plants_2_title:0 "Follow each sample home"
 HSM_BAR_investigation_plants_2_brief:0 "Begin with the infirmary samples and visit their collectors separately. Reconstruct the gathering and burning routes, then obtain small reference specimens without repeating the injuries. A slower two-person inquiry trades hired field capacity for careful provenance."
 HSM_BAR_investigation_plants_2_report:0 "KRZEMIEN / admission slips and collection map\nThe burned bundle has a different collection history from the two contact samples. Keeping those histories separate reveals ordinary irritants among material that the clearing return had treated as one threat. Other specimens remain unexplained and isolated.\nThe reconstructed route also fails to match part of the survey. Wrona halted clearing on that section pending correction. Separate labels and containers now accompany the field herbarium; no new burning trial or deliberate skin exposure was performed."
 HSM_BAR_investigation_plants_2_price:0 "25 political power / 28 days"
 HSM_BAR_investigation_plants_2_remaining:0 "FIELDWORK / [?days_mission_timeout@HSM_BAR_investigation_plants_2_mission|0] days remaining"
 HSM_BAR_investigation_plants_2_mission:0 "$HSM_BAR_investigation_plants_2_title$"
 HSM_BAR_investigation_plants_3_title:0 "Sort the leaves first"
 HSM_BAR_investigation_plants_3_brief:0 "Ask a visiting botanist to sort the infirmary collection by visible structure without leaving the laboratory. Preserve all original labels. This can expose misleading names, but the burned bundle cannot be reconstructed from intact leaves alone."
 HSM_BAR_investigation_plants_3_report:0 "BOTANICAL SORT / exposure unresolved\nThe shared village name covers visibly different material. The sorted trays correct that much. They cannot show which component of the burned bundle reached the third patient, nor connect an intact leaf to a smoke exposure merely because their labels match.\nThe collection is retained in separate trays. Completion requires the collectors' accounts and the gathering sites, with burned material traced independently. The next assignment pays for that missing fieldwork, not for another rearrangement of the same leaves."
 HSM_BAR_investigation_plants_3_price:0 "20 political power / 14 days"
 HSM_BAR_investigation_plants_3_remaining:0 "FIELDWORK / [?days_mission_timeout@HSM_BAR_investigation_plants_3_mission|0] days remaining"
 HSM_BAR_investigation_plants_3_mission:0 "$HSM_BAR_investigation_plants_3_title$"
 HSM_BAR_investigation_echo_doc_1:0 "Foreman's statement / first copy"
 HSM_BAR_investigation_echo_fragment_1_1:0 "He reports that nobody was working below the marked landing. This is a work roster, not a shaft inspection."
 HSM_BAR_investigation_echo_fragment_1_2:0 "He calls the delayed sound an answer and remembers words different from the worker's. Their estimates of the delay agree."
 HSM_BAR_investigation_echo_fragment_1_3:0 "His request concerns the next shift. The ventilation plan is still being sought."
 HSM_BAR_investigation_echo_doc_2:0 "Worker's statement / medical copy"
 HSM_BAR_investigation_echo_fragment_2_1:0 "He heard his own words return after the interval described by the foreman. He does not remember a different reply."
 HSM_BAR_investigation_echo_fragment_2_2:0 "The plan ends at a wall the workers describe as hollow. The statement contains no view of what lies behind it."
 HSM_BAR_investigation_echo_fragment_2_3:0 "Krzemien retained the refusal of another shift. Name and employment reference: £HSM_BAR_redact_long£."
 HSM_BAR_investigation_echo_hypothesis:0 "The witnesses agree about timing while disagreeing about meaning. Replace speech with a recognisable nonverbal signal, then record both delay and direction from safe positions. A sound returning by an unrecorded route could be mistaken for an answer; that remains a hypothesis until the route is surveyed. No descent beyond the checked landing is authorised."
 HSM_BAR_investigation_echo_mismatch:0 "An empty work roster and an unfinished plan leave open where sound could travel; they do not establish another speaker. The stronger comparison is between two incompatible descriptions of words with the same reported delay. Test what can be repeated without asking either witness to supply a better memory."
 HSM_BAR_investigation_echo_status:0 "[GetHSMBARInvestigationStatus_echo]"
 HSM_BAR_investigation_echo_1_title:0 "Revisit the spoken accounts"
 HSM_BAR_investigation_echo_1_brief:0 "Interview the workers separately, with consent, and compare their earliest accounts with later tellings. This may establish how 'answer' entered the record. It will not measure the shaft's acoustic path."
 HSM_BAR_investigation_echo_1_report:0 "INTERVIEW REVIEW / originals retained\nThe original accounts still agree more closely on delay than on words. Later tellings borrow one another's phrasing and therefore cannot count as fresh corroboration. Neither witness has been asked to return below.\nThis distinguishes repeated testimony from independent evidence, but leaves the sound itself untested. A new field assignment must supply a controlled signal and positions marked on the ventilation plan. The interviews will accompany it; asking the same question again would not replace the survey."
 HSM_BAR_investigation_echo_1_price:0 "20 political power / 21 days"
 HSM_BAR_investigation_echo_1_remaining:0 "FIELDWORK / [?days_mission_timeout@HSM_BAR_investigation_echo_1_mission|0] days remaining"
 HSM_BAR_investigation_echo_1_mission:0 "$HSM_BAR_investigation_echo_1_title$"
 HSM_BAR_investigation_echo_2_title:0 "Whistle and direction survey"
 HSM_BAR_investigation_echo_2_brief:0 "Hire an acoustic survey team. Use a whistle instead of a question and compare its return from the landing and the checked side passage. Inspect the route in stages; move no observer into an unchecked opening."
 HSM_BAR_investigation_echo_2_report:0 "ACOUSTIC SHEET / route corrected\nThe whistle returned after the interval described by the workers. In the checked side passage it arrived from behind. Following the measured direction revealed a chamber missing from the plan, without requiring anyone to descend the open shaft.\nWrona marked the return route and retained the old drawing beneath it. The field report provides a repeatable acoustic comparison; final closure still belongs with the full measurements. Krzemien has left the shaft rail on the repair list."
 HSM_BAR_investigation_echo_2_price:0 "35 political power / 14 days"
 HSM_BAR_investigation_echo_2_remaining:0 "FIELDWORK / [?days_mission_timeout@HSM_BAR_investigation_echo_2_mission|0] days remaining"
 HSM_BAR_investigation_echo_2_mission:0 "$HSM_BAR_investigation_echo_2_title$"
 HSM_BAR_investigation_echo_3_title:0 "Map the return with recorders"
 HSM_BAR_investigation_echo_3_brief:0 "Borrow recording equipment for a longer staged survey. Time a whistle at the source and at checked listening positions, then compare direction without relying on remembered words. Inspect newly indicated passages before relocating equipment."
 HSM_BAR_investigation_echo_3_report:0 "RECORDING REGISTER / matched signals\nThe timed whistle provides the same delayed return at the landing and a rearward arrival in the side passage. Repeated comparisons trace a route through a chamber absent from the old drawing. No independent spoken answer was recorded during the trials.\nThe corrected route and unedited control recordings accompany the field file. Their value is the repeatable path, not a verdict about every voice reported in Barrad. The missing chamber belongs to this ventilation survey; the open shaft remains a fall hazard."
 HSM_BAR_investigation_echo_3_price:0 "25 political power / 28 days"
