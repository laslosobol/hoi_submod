 HSM_BAR_investigation_compass_3_title:0 "Check the claimed provenance"
 HSM_BAR_investigation_compass_3_brief:0 "Compare the seller's drawings and purchase account with surviving workshop catalogues. Request a traceable copy of the claimed inscription. This tests the pedigree offered with the compass, not its behaviour in the field."
 HSM_BAR_investigation_compass_3_report:0 "PROVENANCE REVIEW / attribution withheld\nNo traceable copy of the quoted inscription accompanies the instrument's history. The supplied papers do not establish a builder or a sanctuary. That absence leaves the sale unverified; it does not explain why the needle deviates, nor prove that no deviation occurs.\nThe correspondence is retained. A renewed assignment needs the instrument, its case and an independent control on the same trial. Further catalogue work cannot substitute for that comparison, and no ancient-language attribution has been entered."
