l_english:
 HSM_BAR_dir_charter:0 "[Player.GetHSMBAR_charter]"
 HSM_BAR_dir_charter_desc:0 "[Player.GetHSMBAR_charter_desc]"
 HSM_BAR_dir_charter_internal:0 "Behind the Closed Ward"
 HSM_BAR_dir_charter_internal_desc:0 "The Service already has a name, though none of Barrad's ministers has heard it. Its founders still meet after Marta Krzemien's patients fall asleep. Now they must decide who equips the next team, who can authorize a new laboratory and who may refuse an unsafe order. Olcha asks for a shared instrument bench so each group need not rebuild its tools from scraps. Seweryn Olcha brings the recovered notebooks; Jadwiga Wrona brings the names of the workers sent below. Neither is willing to leave the other alone with both. Beyond the ward, Michal Zawisza is building a republic. Whatever takes shape here must not make his country another Pentarch's private experiment."
 HSM_BAR_dir_charter_cover:0 "The Recovery Commission"
 HSM_BAR_dir_charter_cover_desc:0 "The Republic's first surveys have exposed damage that ordinary repairs cannot settle. A recovery commission will bring physicians, surveyors and workshop engineers together, while village councils continue to decide where families may return. Zawisza wants each specialist to answer a practical question: can the well be used, can the field be sown, can the school reopen? The commission must earn its place through answers that survive the next winter."
 HSM_BAR_dir_names:0 "[Player.GetHSMBAR_names]"
 HSM_BAR_dir_names_desc:0 "[Player.GetHSMBAR_names_desc]"
 HSM_BAR_dir_names_internal:0 "Two Names for One Discovery"
 HSM_BAR_dir_names_internal_desc:0 "A village well appears in two accounts. Zawisza's engineers blame a damaged lining; Marta's examination records describe something the lining cannot explain. Both teams need access, and neither can safely work from half the truth about the danger. Wrona proposes separate assignments, with complete warnings but no common employer. Investigators will practise answering ordinary questions about their work without leading a curious official back to the ward. Olcha favours the cheaper expedient of borrowing a ministry's arrangements. Their concealment will be tested by an honest official doing his work, long before any enemy learns where to look. The well must meanwhile remain closed."
 HSM_BAR_dir_names_cover:0 "Independent Survey Teams"
 HSM_BAR_dir_names_cover_desc:0 "Two teams have examined the same well and returned incompatible estimates. Before either contractor begins work, the commission must establish who is responsible for each measurement and which repairs have actually been paid for. Separate surveys cost more, but a contractor should not certify its own disputed work. Zawisza intends the village council to receive one intelligible account of the remedy, with someone named to answer if it fails."
 HSM_BAR_dir_seal_labs:0 "[Player.GetHSMBAR_seal_labs]"
 HSM_BAR_dir_seal_labs_desc:0 "[Player.GetHSMBAR_seal_labs_desc]"
 HSM_BAR_dir_seal_labs_internal:0 "What the Locked Rooms Kept"
 HSM_BAR_dir_seal_labs_internal_desc:0 "The first descent did not silence the rooms beneath the old laboratories. A surveyor hears movement through a wall whose other side is marked solid rock. Olcha recognises the warning beside its door, then claims not to remember who wrote it. Wrona orders the approaches mapped before anyone touches the lock. The surveyors must work out which pumps, braces and ventilation shafts can be restored without reopening the rooms they were built to serve. Marta wants the workmen examined before and after every visit. Somewhere among these abandoned experiments may lie the means to restore the fields; finding it must not mean supplying the dead magocrats with new assistants."
 HSM_BAR_dir_seal_labs_cover:0 "Inspect the Old Foundations"
 HSM_BAR_dir_seal_labs_cover_desc:0 "Reconstruction crews are approaching cellars and galleries omitted from the estate's public plans. Their condition must be established before roads, wells or housing are built above them. The commission will compare surviving drawings with fresh surveys and mark unsafe approaches. Village representatives will receive clear boundaries for suspended work rather than another indefinite prohibition. Repairs can resume where the ground is sound; uncertainty is no excuse to abandon the whole district."
 HSM_BAR_dir_watchmen:0 "[Player.GetHSMBAR_watchmen]"
 HSM_BAR_dir_watchmen_desc:0 "[Player.GetHSMBAR_watchmen_desc]"
 HSM_BAR_dir_watchmen_internal:0 "Where the Road Falls Silent"
 HSM_BAR_dir_watchmen_internal_desc:0 "Marta's patients describe places more readily than symptoms. One cough begins beside a particular ditch; another stops when the patient crosses a stream. Wrona follows those directions with a medical bag and two surveyors, leaving weapons out of sight. Her teams will learn which accounts lead back to the Pentarchy and which end at a neglected drain. A familiar physician or well-keeper can introduce an investigator where a stranger's questions would close every door. Villagers need someone who returns after the first interview. They have had enough visitors who took a name, promised an answer and never came back."
 HSM_BAR_dir_watchmen_cover:0 "Travelling Medical Teams"
 HSM_BAR_dir_watchmen_cover_desc:0 "Isolated settlements cannot wait for every road to be repaired before receiving medical care. Travelling teams will visit them with basic supplies, examine water sources and arrange transport for patients who need a hospital. Doctors and surveyors will compare their observations without requiring families to travel repeatedly to the district offices. Regular visits should reveal recurring problems early and give village councils someone familiar to consult when conditions change."
 HSM_BAR_dir_evidence:0 "[Player.GetHSMBAR_evidence]"
 HSM_BAR_dir_evidence_desc:0 "[Player.GetHSMBAR_evidence_desc]"
 HSM_BAR_dir_evidence_internal:0 "The Witness Beside the Specimen"
 HSM_BAR_dir_evidence_internal_desc:0 "Olcha identifies a fragment by the number on its container. The worker who collected it insists that the number belonged to something else. Wrona brings him into the examination room despite Olcha's objections. What follows is less impressive than a discovery: a journey retraced, an overlooked substitution, an experiment postponed. Marta keeps the worker's account beside the measurements. Wrona wants her teams to reconstruct an object's journey before a retrieval, while Olcha sets an independent instrument beside the disputed reading. An overlooked witness may reveal more than the assignment originally sought. The Service cannot hope to understand the Pentarchy's surviving work if a learned voice can still make the person who carried its consequences disappear from the record."
 HSM_BAR_dir_evidence_cover:0 "Reliable Field Measurements"
 HSM_BAR_dir_evidence_cover_desc:0 "A disputed sample has exposed differences between the survey teams' methods. Collection sites, instruments and observations need to remain traceable when material reaches a distant laboratory. The commission will train field workers to record their own evidence and retain enough material for a second examination. Specialists may disagree, but village repairs cannot rest on whichever report sounds most confident. A result should be checkable by someone who was not present."
 HSM_BAR_dir_training:0 "[Player.GetHSMBAR_training]"
 HSM_BAR_dir_training_desc:0 "[Player.GetHSMBAR_training_desc]"
 HSM_BAR_dir_training_internal:0 "Everyone Comes Back"
 HSM_BAR_dir_training_internal_desc:0 "During a retrieval exercise, a worker is injured and the team must choose between the specimen and the stretcher. Wrona's answer is immediate; the argument afterwards is not. Olcha has seen irreplaceable evidence destroyed in a single careless retreat. Marta has seen what happens when preserving it becomes more important than the patient. Before another team descends, Marta will rehearse casualty care with the rescuers, and Wrona will make them practise a withdrawal under pursuit. A second route and someone trained to use it may keep a missing investigator from becoming a prisoner. Orders written in a safe room have a way of surviving the people sent to obey them."
 HSM_BAR_dir_training_cover:0 "Rescue Teams for the Worksites"
 HSM_BAR_dir_training_cover_desc:0 "Reopened workings bring familiar dangers: weak supports, smoke, failed hoists and exhausted crews. Rescue teams need regular practice with the equipment actually used underground, not demonstrations arranged for visiting officials. Each site must know how to raise an alarm, clear an approach and receive the injured. The recovery commission will ask foremen to rehearse a withdrawal as carefully as a productive shift. A rebuilding programme cannot afford to treat its workers as replaceable."
 HSM_BAR_dir_register:0 "[Player.GetHSMBAR_register]"
 HSM_BAR_dir_register_desc:0 "[Player.GetHSMBAR_register_desc]"
 HSM_BAR_dir_register_internal:0 "A Map of the Wounds"
 HSM_BAR_dir_register_internal_desc:0 "Marta spreads the open investigations beside Olcha's laboratory plans. Wrona has marked the sites her teams reached; the blank spaces remain blank. Their growing archive needs distinctions that fear alone cannot supply. Hearth, Lunar Circle, Winter Watch and Starless will describe different problems of keeping watch, not a ladder on which every unfamiliar thing must climb. Injury, custody and uncertainty need their own entries. A harmless explanation must survive beside a dangerous finding. Researchers will be able to compare measurements from different sites without repeating an experiment another team has already disproved. Otherwise the map will show only what the Service expected to fear, and hide what it failed to understand."
 HSM_BAR_dir_register_cover:0 "The Barrad Land Survey"
 HSM_BAR_dir_register_cover_desc:0 "The Republic inherited boundary maps made for collecting dues, not for deciding where families can live safely. A new survey will combine soil samples, water measurements and accounts from residents who remember how their surroundings changed. Findings will guide the repair of wells and the return of abandoned plots to cultivation. Areas awaiting examination will remain clearly distinguished from those already assessed, so a hopeful sketch does not become an order to return."
 HSM_BAR_dir_radio:0 "[Player.GetHSMBAR_radio]"
 HSM_BAR_dir_radio_desc:0 "[Player.GetHSMBAR_radio_desc]"
 HSM_BAR_dir_radio_internal:0 "A Voice at the Surface"
 HSM_BAR_dir_radio_internal_desc:0 "Below the laboratory, a voice once answered before the question was asked. Wrona no longer trusts a familiar voice to prove that a colleague is alive. Field teams need an independent line to the surface, changing cipher keys and challenges agreed before departure. Operators will learn to withhold a reply when a correct voice gives the wrong answer. Olcha tests the equipment while Marta watches the pauses between replies. Ordinary radios cannot explain what happened in the shaft, but they may reveal when a conversation has stopped being ordinary. No remote station should ever have to decide alone whether the speaker requesting entry is really one of its own."
 HSM_BAR_dir_radio_cover:0 "An Emergency Radio Network"
 HSM_BAR_dir_radio_cover_desc:0 "Bad roads can leave an injured work crew hours away from help. The commission proposes radio links between clinics, survey camps and major reconstruction sites, with scheduled checks and a reserve power supply. Operators will practise passing clear requests under poor conditions instead of improvising during an accident. Civilian authorities will receive a dependable picture of where assistance is needed, while villages beyond the main roads gain a faster way to summon it."
 HSM_BAR_dir_archives:0 "[Player.GetHSMBAR_archives]"
 HSM_BAR_dir_archives_desc:0 "[Player.GetHSMBAR_archives_desc]"
 HSM_BAR_dir_archives_internal:0 "Olcha's Handwriting"
 HSM_BAR_dir_archives_internal_desc:0 "The notebooks are open, but much of their meaning remains with the assistant who once helped fill them. Olcha has begun correcting a diagram from memory. Marta asks why he did not mention that memory before. Reconstructing the archive will mean returning to failed experiments, comparing rival accounts and separating methods that others can reproduce from powers that died with their owners. Among the disputed pages are circuits for receivers and measuring instruments. Rebuilding those on an ordinary bench can teach the technicians without asking them to trust the experiments once connected to the wires. Olcha may help Barrad recover what it needs; his usefulness must not decide which pages survive."
 HSM_BAR_dir_archives_cover:0 "Rebuild the Technical Library"
 HSM_BAR_dir_archives_cover_desc:0 "Surviving drawings and notebooks are scattered between damaged workshops and private cupboards. The Republic will gather them into a technical collection, preserving disagreements between versions rather than choosing the neatest copy. Engineers and teachers can then test older methods against current needs and prepare material suitable for apprentices. The library should make useful knowledge available beyond a single patron's household, without presenting every surviving diagram as a trustworthy instruction."
 HSM_BAR_dir_agency:0 "[Player.GetHSMBAR_agency]"
 HSM_BAR_dir_agency_desc:0 "[Player.GetHSMBAR_agency_desc]"
 HSM_BAR_dir_agency_internal:0 "An Innocent Doorway"
 HSM_BAR_dir_agency_internal_desc:0 "Wrona needs a way to ask questions beyond a cordon without arriving as its commander. Alder Survey offers a respectable reason to hire interpreters, consult specialists and visit troubled ground. Most of its staff will earn their wages doing exactly that. A few enquiries will pass to an investigator and a small group of language analysts who never attend the directors' meetings. Between legitimate surveys, they will learn to follow a coded message beyond its apparent destination. Zawisza must be able to inspect genuine work and find genuine results. The hardest part of the disguise is allowing an honest institution to live beneath it, rather than turning every employee into a conspirator."
 HSM_BAR_dir_agency_cover:0 "Alder Survey"
 HSM_BAR_dir_agency_cover_desc:0 "The reconstruction ministries cannot keep every specialist on a permanent salary. Alder Survey will undertake geological surveys, laboratory examinations and technical consultations where public teams lack the necessary experience. Its work must be useful enough to attract clients beyond government offices. Clear contracts and ordinary professional standards should let the Republic obtain expertise without building another unwieldy department, while giving trained graduates a reason to remain in Barrad."
 HSM_BAR_dir_storage:0 "[Player.GetHSMBAR_storage]"
 HSM_BAR_dir_storage_desc:0 "[Player.GetHSMBAR_storage_desc]"
 HSM_BAR_dir_storage_internal:0 "Before Anything Crosses the Threshold"
 HSM_BAR_dir_storage_internal_desc:0 "The proposed receiving room stands too close to the ward. Marta notices this before anyone discusses its locks. Wrona asks where a frightened team will retreat if the incoming specimen behaves differently from the one described. Olcha can list precautions from the notebooks, but some were written by researchers who did not survive their use. The Service needs separated rooms, observation positions and a clear route out. Reusable packing, prepared vehicles and equipment kept ready between assignments will spare each retrieval team an improvised and expensive departure. Their first purpose is to make careful work possible; whatever eventually occupies them will still require an answer of its own."
 HSM_BAR_dir_storage_cover:0 "Isolated Examination Rooms"
 HSM_BAR_dir_storage_cover_desc:0 "Samples collected during reconstruction should not be examined beside occupied wards or crowded workshops. Separate rooms will provide suitable ventilation, washable surfaces and safe routes for receiving material. Physicians and engineers will help choose their location before construction begins, while maintenance staff prepare for ordinary failures of lighting and water. Better premises will make careful examination possible without exposing patients and neighbours to the consequences of work they did not undertake."
 HSM_BAR_dir_foreign_mandate:0 "[Player.GetHSMBAR_foreign_mandate]"
 HSM_BAR_dir_foreign_mandate_desc:0 "[Player.GetHSMBAR_foreign_mandate_desc]"
 HSM_BAR_dir_foreign_mandate_internal:0 "Beyond the First Harvest"
 HSM_BAR_dir_foreign_mandate_internal_desc:0 "The first reclaimed fields have yielded grain. Beyond their boundary, the same treatment still fails. Olcha returns to the recovered research with soil on his cuffs and finds references to work done outside Barrad: a water sample, an unfamiliar protective pattern, a name omitted from the final copy. Marta will not promise another village what she cannot yet deliver. Wrona proposes following those traces abroad and preparing an investigator for a permanent foreign assignment. Language lessons, an ordinary occupation and contacts who know nothing of the ward must come before the journey. The Service began by trying to bring workers home from one mine; finishing that task now means leaving the country it was meant to heal."
 HSM_BAR_dir_foreign_mandate_cover:0 "Research Beyond Our Borders"
 HSM_BAR_dir_foreign_mandate_cover_desc:0 "The first successful reclamation has exposed the limits of local methods. Some damaged districts need expertise and comparisons that Barrad cannot supply from its own collections. The commission proposes sending specialists abroad to consult laboratories, study water treatment and examine established protective engineering. Zawisza supports the expense because every visit must answer a question arising from unfinished work at home. The next promise of recovery should rest on more than hope."
 HSM_BAR_dir_world:0 "[Player.GetHSMBAR_world]"
 HSM_BAR_dir_world_desc:0 "[Player.GetHSMBAR_world_desc]"
 HSM_BAR_dir_world_internal:0 "Far from the Closed Ward"
 HSM_BAR_dir_world_internal_desc:0 "The first foreign assignments cannot be directed like another descent beneath the manor. Wrona needs investigators who can live where they work, recognise a local warning and survive the loss of contact with Barrad. Marta wants their findings to reach the recovery teams before another sowing season is lost. Olcha fears what a distant office might conceal from its own founders. Experienced field staff will prepare new stations, teach their first contacts and test long-range sets before trusting them with a distant team's safety. Each station will also inherit responsibilities its founders can no longer discharge by gathering around the same table."
 HSM_BAR_dir_world_cover:0 "Regional Research Partnerships"
 HSM_BAR_dir_world_cover_desc:0 "A visiting specialist can settle a single question; sustained reconstruction needs relationships that outlast the visit. Barrad's research contractors will seek regional partners for surveys, consultations and comparative trials. Local staff will guide unfamiliar visitors and keep practical work moving between expeditions. Each partnership must support an ordinary profession and serve ordinary clients. The Republic's programme will benefit more from reliable institutions than from a succession of impressive but unrepeatable journeys."
 HSM_BAR_dir_equus:0 "[Player.GetHSMBAR_equus]"
 HSM_BAR_dir_equus_desc:0 "[Player.GetHSMBAR_equus_desc]"
 HSM_BAR_dir_equus_internal:0 "Across the Western Sea"
 HSM_BAR_dir_equus_internal_desc:0 "In Equus, magic is neither a whispered accusation nor a forgotten laboratory's inheritance. It belongs to public life, and our investigators must learn to distinguish that life from the dangers they have crossed the sea to understand. Silver Coast Provisioning gives them a lawful foothold among medical suppliers and survey contractors. Wrona sends questions before she sends retrieval equipment. The first investigators will work alongside local staff, learning whom to approach and how to ask without betraying an interest their ordinary employment cannot explain. Marta asks for accounts of protection and recovery, not a catalogue of marvels. If a greater threat emerges, the station must know whom it can approach without making itself another danger."
 HSM_BAR_dir_equus_cover:0 "Silver Coast Provisioning"
 HSM_BAR_dir_equus_cover_desc:0 "Recovery work requires dependable instruments, medicines and materials that Barrad cannot yet produce in sufficient quantity. Silver Coast Provisioning will establish purchasing relationships in Equus and arrange consultations with experienced suppliers. Its representatives must learn which products suit conditions at home rather than buying whatever looks most advanced. A steady exchange of practical knowledge should accompany the orders, allowing local workshops to maintain imported equipment instead of depending indefinitely on replacements."
 HSM_BAR_dir_griffonia:0 "[Player.GetHSMBAR_griffonia]"
 HSM_BAR_dir_griffonia_desc:0 "[Player.GetHSMBAR_griffonia_desc]"
 HSM_BAR_dir_griffonia_internal:0 "The Relics Change Owners"
 HSM_BAR_dir_griffonia_internal_desc:0 "Wrona finds the same description in a collector's catalogue and the margin of a Pentarch's notebook. Neither identifies a current owner. Across the Griffon Lands, old collections, displaced households and ambitious patrons have left trails that seldom agree. A surveying partnership will give investigators time to follow them without announcing an auction of Barrad's secrets. Local contacts will help the analysts compare dealers' aliases and repeated phrases in coded correspondence; an old sale may supply the missing clue to a new message. Olcha wants to know which objects his former masters understood and which they merely coveted. The answer may lie in a storeroom, a university or a witness who has learned to distrust both."
 HSM_BAR_dir_griffonia_cover:0 "Surveying and Prospecting"
 HSM_BAR_dir_griffonia_cover_desc:0 "The Griffon Lands contain technical collections and experienced specialists whose knowledge could serve Barrad's reconstruction. A surveying partnership will commission consultations, compare geological samples and arrange access to material held by willing institutions. Its representatives must respect ownership and establish the provenance of anything offered for sale. Careful purchases and lasting professional relationships will do more for the programme than an expensive acquisition whose history or practical value cannot be established."
 HSM_BAR_dir_north:0 "[Player.GetHSMBAR_north]"
 HSM_BAR_dir_north_desc:0 "[Player.GetHSMBAR_north_desc]"
 HSM_BAR_dir_north_internal:0 "The Last Lamp to the North"
 HSM_BAR_dir_north_internal_desc:0 "Irma Kalk has rented premises for the northern office and already rejected its first dramatic report. Two witnesses repeated the words of one missing traveller; she wants the traveller's name. Beyond the familiar routes lie places where silence may mean an empty road or something less merciful. Kalk intends to learn the difference before sending a team across it. Wrona approves her insistence on a return plan. Trusted guides, sheltered meeting places and rehearsed escape routes must grow with the station's contacts; a northern assignment cannot depend on one guide who knows everything. Marta encloses a short request of her own: record the people living beside the danger, not only the stories told about it."
 HSM_BAR_dir_north_cover:0 "Northern Transit Company"
 HSM_BAR_dir_north_cover_desc:0 "Northern routes require more than a line drawn across a map. The Northern Transit Company will study seasonal conditions, establish dependable local contacts and prepare emergency arrangements for travelling specialists. Staff familiar with the region can assess accommodation, supplies and the condition of approaches before an expedition leaves Barrad. Reliable support should make northern consultations possible without asking every research team to rediscover the same hazards at its own expense."
 HSM_BAR_dir_riverlands:0 "[Player.GetHSMBAR_riverlands]"
 HSM_BAR_dir_riverlands_desc:0 "[Player.GetHSMBAR_riverlands_desc]"
 HSM_BAR_dir_riverlands_internal:0 "What the Water Carries"
 HSM_BAR_dir_riverlands_internal_desc:0 "A Riverlands surveyor has offered to repeat an unusual water measurement for an ordinary consulting fee. Marta regards that as a promising beginning. Barrad needs to understand how damage travels through soil and streams, and why some waters seem to resist it. Wrona's local team will follow those questions alongside less certain reports from the riverbanks. The surveyor can introduce trustworthy colleagues and help fit out a field station with instruments they already know how to maintain. An explanation may prove entirely ordinary and still bring a village closer to recovery. Olcha, who once worked for a patron demanding wonders, must learn to recognise the value of that answer."
 HSM_BAR_dir_riverlands_cover:0 "River Surveying Partnership"
 HSM_BAR_dir_riverlands_cover_desc:0 "Barrad's recovery commission needs reliable comparisons for its own damaged waterways. The River Surveying Partnership will work with local specialists on currents, sediment and the maintenance of embankments. Comparative samples should help engineers distinguish a failure in their methods from a difference in the ground itself. The practical aim is straightforward: cleaner water, safer crossings and repairs that remain useful after the next flood, both for our programme and for its regional partners."
 HSM_BAR_dir_zebrica:0 "[Player.GetHSMBAR_zebrica]"
 HSM_BAR_dir_zebrica_desc:0 "[Player.GetHSMBAR_zebrica_desc]"
 HSM_BAR_dir_zebrica_internal:0 "The Word the Interpreter Refused"
 HSM_BAR_dir_zebrica_internal_desc:0 "The interpreter refuses to translate a witness's expression as immortal. It could mean enduring, ancestral or simply remembered, and she will not supply a discovery to please a visitor. Wrona wants her hired for the next interview. The Zebrican station must begin with people who understand where its questions come apart. Local guides and suppliers will help its teams build lasting contacts and prepare expeditions without paying for every visitor's mistake twice. Olcha has circled a reference in the old research, but a foreign name on a page is not a path through an unfamiliar country. The first expedition may return with nothing beyond a better question; it must be allowed to return."
 HSM_BAR_dir_zebrica_cover:0 "Southern Caravan Partnership"
 HSM_BAR_dir_zebrica_cover_desc:0 "The Southern Caravan Partnership will arrange interpreters, guides and local consultations for Barrad's researchers in Zebrica. Its representatives must negotiate with people who know the places being visited, not rely on distant accounts of them. Adequate preparation includes learning how local terms are used and which questions cannot be settled during a brief stay. Modest, well-supported journeys should build the trust needed for useful exchanges rather than exhaust it on the first visit."
 HSM_BAR_dir_liaison:0 "[Player.GetHSMBAR_liaison]"
 HSM_BAR_dir_liaison_desc:0 "[Player.GetHSMBAR_liaison_desc]"
 HSM_BAR_dir_liaison_internal:0 "Someone Else Keeps Watch"
 HSM_BAR_dir_liaison_internal_desc:0 "Marta would rather compare a protective method with another investigator than discover its failure beside a hospital bed. A trusted intermediary may make that possible without revealing who directs the work in Barrad. Wrona will teach the liaison staff to separate a meeting from the investigator who requested it, so following one visitor does not expose the whole station. Wrona insists that any exchange begin with a shared danger, not an assertion of authority. In Equus, S.M.I.L.E. may have reason to listen if Sombra's return gives both sides the same enemy. Until such a reason exists, the Service can prepare an honest question and a means of asking it. Secrecy need not mean facing every threat alone."
 HSM_BAR_dir_liaison_cover:0 "Reciprocal Technical Visits"
 HSM_BAR_dir_liaison_cover_desc:0 "Foreign laboratories face practical problems that resemble our own. Reciprocal visits will allow specialists to compare methods, examine instruments and identify useful lines of cooperation without promising agreement on every subject. Each delegation should arrive with a clear question and enough material for its hosts to assess it. In return, Barrad must be willing to show what its own researchers have learned, including the limits of methods it hopes to recommend."
 HSM_BAR_dir_trafficking:0 "[Player.GetHSMBAR_trafficking]"
 HSM_BAR_dir_trafficking_desc:0 "[Player.GetHSMBAR_trafficking_desc]"
 HSM_BAR_dir_trafficking_internal:0 "The Buyers of Forbidden Things"
 HSM_BAR_dir_trafficking_internal_desc:0 "A reliquary changes owners three times while its description loses a little more detail. The final intermediary has disappeared. Wrona suspects a trade sustained by people who know which questions buyers prefer not to ask. Olcha recognises the habits of collectors who once courted the Pentarchy, but habit is not proof. Following the purchases may reveal a dangerous object, a fraud or someone seeking materials for a purpose still hidden. Wrona asks her investigators to learn the intermediaries' habits before moving; a well-timed interception might recover both the cargo and the trail to its next buyer. Marta wants the buyers found before their experiments produce patients. An ordinary ownership dispute offers the first quiet way in."
 HSM_BAR_dir_trafficking_cover:0 "Specialist Cargo Insurance"
 HSM_BAR_dir_trafficking_cover_desc:0 "Delicate instruments and unusual research materials are difficult to replace when damaged or lost. A specialist insurance office will establish provenance, assess transport conditions and investigate disputed ownership before settling claims. Accurate descriptions protect both suppliers and the institutions paying for their work. Barrad's contractors need a reliable way to resolve losses without accepting every extravagant valuation or allowing an unexplained disappearance to be dismissed as the routine cost of doing business."
 HSM_BAR_dir_rulers:0 "[Player.GetHSMBAR_rulers]"
 HSM_BAR_dir_rulers_desc:0 "[Player.GetHSMBAR_rulers_desc]"
 HSM_BAR_dir_rulers_internal:0 "A Sovereign Is Not a Specimen"
 HSM_BAR_dir_rulers_internal_desc:0 "One proposed dossier places a sovereign beside a laboratory artefact as though both await the same sort of recovery. Wrona strikes out the heading. A ruler has subjects, enemies and a history that continues beyond our observations. Marta asks whose protection would be served by turning a suspicion into an attempted abduction. These investigations will begin with witnesses, public acts and the changing circumstances around their subjects. Language analysts will compare that public record with intercepted correspondence, looking for repeated names and phrases that might open a cipher. Power may deserve scrutiny, but an unfamiliar nature is not permission to seize its bearer. The Service has already lived beneath rulers who believed otherwise."
 HSM_BAR_dir_rulers_cover:0 "Study the Historical Collections"
 HSM_BAR_dir_rulers_cover_desc:0 "Collections assembled under private patrons often mix reliable records with flattering legends. Researchers will compare accounts of their origins, trace changes of ownership and consult institutions willing to share evidence. Particular care is needed where an object is associated with a living dynasty or disputed claim. Barrad's historical work should improve understanding without treating a catalogue as a right of possession or allowing scholarly curiosity to become an avoidable diplomatic quarrel."
 HSM_BAR_dir_countercult:0 "[Player.GetHSMBAR_countercult]"
 HSM_BAR_dir_countercult_desc:0 "[Player.GetHSMBAR_countercult_desc]"
 HSM_BAR_dir_countercult_internal:0 "Those Who Came to Collect"
 HSM_BAR_dir_countercult_internal_desc:0 "Someone is buying prison-transport schedules through the same intermediaries who handle the reliquary. Wrona sees preparations, not merely a collector's curiosity. The emerging trail points towards a small Maarite cell; it does not explain every secret inherited from the Pentarchy. Olcha wants the suspect material secured before it changes owners again. Wrona wants to know who is waiting at the journey's end and who gave them the schedule. Her investigators will trace the leak through their own contacts, learning to recognise an infiltrator before another transfer is compromised. Either course will bring the Service into conflict with people who have plans of their own. Preventing their next move matters more than announcing that an enemy has been found."
 HSM_BAR_dir_countercult_cover:0 "Protect the Recovery Teams"
 HSM_BAR_dir_countercult_cover_desc:0 "Technical surveys and valuable consignments have attracted theft and intimidation. The recovery contractors will coordinate with legitimate escorts, assess vulnerable approaches and prepare alternative routes for work that cannot be postponed. Discreet precautions should protect workers without closing ordinary roads or treating neighbouring settlements as suspects. Zawisza expects disruptions to be resolved through specific evidence and responsible arrangements, not an excuse for bringing the Count's old habits back into public life."
 HSM_BAR_dir_foreign_protocol:0 "[Player.GetHSMBAR_foreign_protocol]"
 HSM_BAR_dir_foreign_protocol_desc:0 "[Player.GetHSMBAR_foreign_protocol_desc]"
 HSM_BAR_dir_foreign_protocol_internal:0 "What Must Not Be Blacked Out"
 HSM_BAR_dir_foreign_protocol_internal_desc:0 "The proposed exchange conceals every failed trial and leaves the researcher's address untouched. Marta lays it beside an account of an injured field worker. This is the information a partner needs least, she says, and the information they cannot safely do without. Olcha begins again. Names, routes and unrelated cases may remain hidden; thresholds, harmful responses and unanswered questions must survive the censor. Wrona wants an investigator abroad to know which equipment to bring, which local specialist can help and when to withdraw. Partners who share usable precautions can spare one another repeated journeys and ruined instruments. That cannot happen if secrecy turns a warning into a page of reassuring omissions."
 HSM_BAR_dir_foreign_protocol_cover:0 "Shared Laboratory Standards"
 HSM_BAR_dir_foreign_protocol_cover_desc:0 "A useful technical exchange requires enough detail for another laboratory to repeat the work. Participating institutions will agree on how to describe instruments, conditions and known sources of error while respecting confidential personal and commercial information. Failed trials belong beside successful ones when they explain the limits of a method. Barrad's specialists should be able to rely on the warnings they receive and expect their own warnings to reach the people carrying out the work."
 HSM_BAR_dir_remains:0 "[Player.GetHSMBAR_remains]"
 HSM_BAR_dir_remains_desc:0 "[Player.GetHSMBAR_remains_desc]"
 HSM_BAR_dir_remains_internal:0 "After the Witnesses Leave"
 HSM_BAR_dir_remains_internal_desc:0 "A report of defeat reaches Barrad with an offer to recover what supposedly remains. Marta asks who saw the body. Nobody has answered. Wrona can send someone to establish a place and a witness, but she will not send a retrieval team after a newspaper's certainty. Marta will train the recovery physicians to preserve traces, recognise contaminated tissue and examine injuries without becoming the next casualties. If a remnant survives and can be reached, Olcha may learn from it what its owner would never have permitted. Until then, the absence itself belongs in the investigation. The Service must not create a convenient death merely because it has prepared an examination room."
 HSM_BAR_dir_remains_cover:0 "Conservation and Identification"
 HSM_BAR_dir_remains_cover_desc:0 "Damaged collections and displaced material require careful examination before restoration begins. A conservation laboratory will establish provenance, distinguish original work from later alterations and consult witnesses where written records are incomplete. Material associated with violence or uncertain ownership must be handled with particular care. The Republic should not sponsor a confident reconstruction of something whose identity has never been established, nor mistake an attractive account of its history for evidence."
 HSM_BAR_dir_commission:0 "[Player.GetHSMBAR_commission]"
 HSM_BAR_dir_commission_desc:0 "[Player.GetHSMBAR_commission_desc]"
 HSM_BAR_dir_commission_internal:0 "After the Fields Return"
 HSM_BAR_dir_commission_internal_desc:0 "The recovery programme has reached the fields it set out to save. Local studies, river samples and protective research have accomplished together what none could promise alone. The hostile cell's immediate scheme has also been broken. Marta brings these results to the meeting; Olcha brings the unresolved cases. They need a standing circle of researchers able to compare the stations' work, challenge a promising conclusion and spare the next team an already disproved experiment. Wrona asks which unfinished dangers now justify remaining abroad. The Service can no longer explain every decision as an emergency in Barrad. Its founders must decide whether their success obliges them to guard a complicated world or gives them the right to simplify it."
 HSM_BAR_dir_commission_cover:0 "The Recovery Conference"
 HSM_BAR_dir_commission_cover_desc:0 "With the homeland recovery programme completed, the commission can assess what should become ordinary public practice. Physicians, agricultural specialists and engineers will compare the results of local work and foreign consultations. Successful methods need maintenance, while remaining uncertainties deserve clearly assigned responsibility. Zawisza wants the next programme to begin from what residents still need, not from the continued existence of an office whose first task has ended. Reconstruction must leave durable institutions behind it."
 HSM_BAR_dir_coexistence:0 "[Player.GetHSMBAR_coexistence]"
 HSM_BAR_dir_coexistence_desc:0 "[Player.GetHSMBAR_coexistence_desc]"
 HSM_BAR_dir_coexistence_internal:0 "The Light We Leave Burning"
 HSM_BAR_dir_coexistence_internal_desc:0 "Marta remembers the school at Alder Ford with boards over its windows. A protective plate now lies beneath the threshold, made possible by work that began with fear. Destroying every unexplained influence would not have opened those windows. The Service will distinguish a danger from a life made possible by the same forces. Wrona will still be sent to places others cannot enter, and some doors must remain closed. Investigators will keep watch for those trying to reach protected sites under a borrowed name, rather than treating every neighbour as a suspect. But the purpose of keeping watch is not to empty the world of everything its custodians have yet to understand."
 HSM_BAR_dir_coexistence_cover:0 "Safer Clinics, Living Communities"
 HSM_BAR_dir_coexistence_cover_desc:0 "Recovery is incomplete if people must abandon the practices that make their homes and clinics work. The commission will support useful treatments and protective installations while examining particular failures with care. Local professionals should be able to improve their work without being told that every unfamiliar method is suspect. The Republic's responsibility is to keep communities functioning safely, combining experience and research instead of demanding that either surrender its place to the other."
 HSM_BAR_dir_normalization:0 "[Player.GetHSMBAR_normalization]"
 HSM_BAR_dir_normalization_desc:0 "[Player.GetHSMBAR_normalization_desc]"
 HSM_BAR_dir_normalization_internal:0 "No More Exceptions"
 HSM_BAR_dir_normalization_internal_desc:0 "Olcha knows how much of the recovery depends on precautions whose authors never understood their limits. He has copied enough warnings from dead researchers to distrust another promise of vigilance. What if the source of those exceptions could be silenced? Marta asks him to include the wards beneath the school and the tools beside her patients. His proposal has no answer yet. He asks the analysts to work through intercepted accounts of protective systems, comparing the ciphers as carefully as the claims concealed within them. Reading another institution's secrets will not prove that his own theory is sound. The attraction of normalization lies in that unfinished sentence: no more accidents of this kind, if only the world can be made to obey one rule."
 HSM_BAR_dir_normalization_cover:0 "Standards for Unreliable Systems"
 HSM_BAR_dir_normalization_cover_desc:0 "Reconstruction has left neighbouring districts using equipment and protective methods with very different tolerances. A standards programme will identify recurring failures, compare maintenance requirements and examine whether unpredictable processes can be made more reliable. Researchers must account for the useful functions of any system they propose to replace. A simpler specification is not necessarily a safer one; the Republic needs improvements that remain practical outside the conditions of a demonstration."
 HSM_BAR_dir_custody_law:0 "[Player.GetHSMBAR_custody_law]"
 HSM_BAR_dir_custody_law_desc:0 "[Player.GetHSMBAR_custody_law_desc]"
 HSM_BAR_dir_custody_law_internal:0 "The Second Key"
 HSM_BAR_dir_custody_law_internal_desc:0 "Marta finds an examination postponed twice without reaching her desk. The director who requested it also decided that nobody else needed to know. Wrona proposes a second authority at every secure site, able to stop work without asking the person responsible for the danger. Olcha observes that the arrangement will slow urgent investigations. That is precisely the point when urgency belongs to only one voice. No minister will discover who holds these keys, but within the Service neither key should become an inheritance passed from one unanswerable master to the next."
 HSM_BAR_dir_custody_law_cover:0 "Independent Safety Inspections"
 HSM_BAR_dir_custody_law_cover_desc:0 "A site manager should not be the only person deciding whether work may continue after an accident. Independent inspectors will examine maintenance, storage and working conditions through arrangements separate from the contractor under review. Their findings must reach those able to order repairs, even when stopping work is inconvenient. The Republic will bear the expense of that independence rather than ask workers to rely on a supervisor's confidence when their own safety is in doubt."
 HSM_BAR_dir_open_report:0 "[Player.GetHSMBAR_open_report]"
 HSM_BAR_dir_open_report_desc:0 "[Player.GetHSMBAR_open_report_desc]"
 HSM_BAR_dir_open_report_internal:0 "What the Villages Can Keep"
 HSM_BAR_dir_open_report_internal_desc:0 "A workshop can use the improved fitting without knowing where its measurements were first taken. Marta wants the finding released through the recovery commission; Olcha wants another examination before it leaves. Wrona remembers the workers whose accounts made the improvement possible. Their neighbours should not have to wait forever for a benefit merely because the original investigation is secret. The Service must decide how to return knowledge without returning the danger that produced it. An ordinary mechanic should receive a workable method, its limits and the freedom to improve on it."
 HSM_BAR_dir_open_report_cover:0 "Applied Research for the Workshops"
 HSM_BAR_dir_open_report_cover_desc:0 "Work undertaken during reconstruction has produced improvements that ordinary workshops can test and use. The commission will prepare practical instructions with clear conditions, material requirements and known limitations. Independent craftsmen should be able to repeat the result without consulting the original investigators at every stage. Their corrections will help turn a promising laboratory method into dependable practice, while public circulation allows useful work to reach communities beyond the sites that first commissioned it."
 HSM_BAR_dir_quiet_watch:0 "[Player.GetHSMBAR_quiet_watch]"
 HSM_BAR_dir_quiet_watch_desc:0 "[Player.GetHSMBAR_quiet_watch_desc]"
 HSM_BAR_dir_quiet_watch_internal:0 "An Ordinary Morning"
 HSM_BAR_dir_quiet_watch_internal_desc:0 "The school opens, a repaired pump starts, and Marta hears no urgent footsteps outside the ward. Somewhere else, Wrona's team changes watch beside a door that must remain closed. The two kinds of work belong to the same promise, though Zawisza will only see one of them. There will be further cases and errors no founding charter can prevent. After years of fieldwork, its investigators know how to break surveillance, leave a meeting separately and return to an ordinary occupation. For now, the Service has learned to measure success without demanding that the country notice it. A morning that belongs to the people living through it is worth the unseen effort of keeping it ordinary."
 HSM_BAR_dir_quiet_watch_cover:0 "Care That Outlasts Reconstruction"
 HSM_BAR_dir_quiet_watch_cover_desc:0 "The end of emergency repairs should not mean the end of reliable care. Clinics, waterworks and protective installations need staff who know them, spare materials and regular examinations. The recovery commission will pass tested routines to permanent local services, so that a minor fault does not become another district-wide crisis. Residents should no longer have to wait for a visiting delegation before an everyday problem receives attention from someone capable of resolving it."
 HSM_BAR_dir_sealed_orders:0 "[Player.GetHSMBAR_sealed_orders]"
 HSM_BAR_dir_sealed_orders_desc:0 "[Player.GetHSMBAR_sealed_orders_desc]"
 HSM_BAR_dir_sealed_orders_internal:0 "How Far Does the Wall Reach?"
 HSM_BAR_dir_sealed_orders_internal_desc:0 "Olcha has drawn a perimeter around the proposed trial. Wrona follows a conduit through it and asks where the line ends underground. An isolated working would be expensive to prepare; the connected gallery offers a broader experiment and paths into places its planners do not supervise. Marta wants every such path accounted for before anyone calls the site empty. Wrona requires separate cipher keys for the trial staff and authenticated instructions to stop the apparatus; a stolen field code must not become an order to the operators. Concealment from the cabinet is not isolation from the country. The Service must choose the ground of its experiment while there is still time to refuse the more convenient site."
 HSM_BAR_dir_sealed_orders_cover:0 "Separate the Utility Networks"
 HSM_BAR_dir_sealed_orders_cover_desc:0 "Older sites often share pipes, cables and service galleries whose routes are poorly recorded. Before major experimental maintenance begins, engineers must establish which installations depend on them and where a failure could spread. Physically separated networks are costly, but they allow faults to be examined without interrupting unrelated services. The commission will weigh those costs against the exposure of clinics, workshops and homes that never appeared on the original contractor's plan."
 HSM_BAR_dir_suppression_lab:0 "[Player.GetHSMBAR_suppression_lab]"
 HSM_BAR_dir_suppression_lab_desc:0 "[Player.GetHSMBAR_suppression_lab_desc]"
 HSM_BAR_dir_suppression_lab_internal:0 "Build Only What We Understand"
 HSM_BAR_dir_suppression_lab_internal_desc:0 "Olcha lays the material studies beside the amulet observations and the work on protective boundaries. Only together do they suggest a way of acting on magic rather than merely surviving an encounter with it. Marta asks him to mark which conclusions were measured and which remain assumptions. There are more marks than he expected. A laboratory can now attempt the apparatus, but the missing steps will have to be found at the bench. Neither the recovered notebooks nor the Service's new ambition can supply a result that its researchers have not earned."
 HSM_BAR_dir_suppression_lab_cover:0 "An Experimental Instrument Laboratory"
 HSM_BAR_dir_suppression_lab_cover_desc:0 "The accumulated measurements justify a laboratory dedicated to testing instruments under controlled conditions. Researchers will compare material responses, calibrate readings and establish how experimental equipment behaves near existing installations. Designs must retain a clear connection to the observations that support them, with assumptions identified before construction. The Republic needs dependable engineering, not a succession of impressive prototypes whose behaviour changes whenever they are taken beyond the laboratory's carefully arranged surroundings."
 HSM_BAR_dir_activation:0 "[Player.GetHSMBAR_activation]"
 HSM_BAR_dir_activation_desc:0 "[Player.GetHSMBAR_activation_desc]"
 HSM_BAR_dir_activation_internal:0 "Thirty Days of Silence"
 HSM_BAR_dir_activation_internal_desc:0 "The apparatus is ready for a local trial. Olcha asks for thirty days of readings; Marta asks how quickly a protective ward would fail before anyone noticed the change. Wrona checks the independent shutdown route herself. Beyond the perimeter, the ministry expects repairs in old workings, not a test of the forces on which some of its recovery depends. Success inside this boundary would still leave an immense distance to the world outside it. For the next month, even the first step must remain something the operators are willing to stop."
 HSM_BAR_dir_activation_cover:0 "A Thirty-Day Equipment Trial"
 HSM_BAR_dir_activation_cover_desc:0 "Experimental equipment is ready for a limited period of observation at the selected site. Engineers will record its behaviour over thirty days, examine surrounding installations and retain a separate means of stopping the work. The trial must establish maintenance needs as well as performance under favourable conditions. A useful result includes knowing when the equipment should not be used; the commission cannot ask ordinary services to discover that limit through an avoidable failure."
 HSM_BAR_dir_aftermath:0 "[Player.GetHSMBAR_aftermath]"
 HSM_BAR_dir_aftermath_desc:0 "[Player.GetHSMBAR_aftermath_desc]"
 HSM_BAR_dir_aftermath_internal:0 "The World Beyond the Perimeter"
 HSM_BAR_dir_aftermath_internal_desc:0 "The local trial has ended. Its measurements remain on Olcha's desk beside the warnings that accompanied them. Marta wants broad suppression abandoned and the useful knowledge returned to protective work. Another proposal would carry the experiment beyond Barrad, through regional sites still requiring preparation and evidence no signature can replace. Wrona asks which parts of the report those teams would receive. Authorizing that undertaking would not activate it; it would commit the Service to preparing a choice on a scale its first promise never contemplated. They can still refuse."
 HSM_BAR_dir_aftermath_cover:0 "Review the Experimental Programme"
 HSM_BAR_dir_aftermath_cover_desc:0 "The trial's observations must now be compared with its original purpose. The commission will record failures, interruptions and useful findings together, so that a convenient summary cannot become a misleading instruction for another site. Further work requires a separate assessment of local conditions and costs. Zawisza expects a reasoned recommendation about which methods to retain, revise or abandon, rather than an assumption that expenditure already incurred obliges the Republic to continue indefinitely."
