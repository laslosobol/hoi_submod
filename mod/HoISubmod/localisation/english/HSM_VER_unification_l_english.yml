l_english:
 HSM_VER_UNI_convention:0 "The Verenian Convention"
 HSM_VER_UNI_convention_desc:0 "The River countries have shown how common work can become common government. Our Houses must write their own settlement. The House calling the convention will seek the constitutional presidency, but its delegates must explain how that office will answer to the country. Towns bring their customs and courts to the table; surviving governments bring powers they will not surrender on a promise alone."
 HSM_VER_UNI_convention_tt:0 "Invites the Houses to unite under our presidency. §YAnnexation requires a separate final vote.§! Neutral Avian does not prevent ducal unification. War or occupation suspends the process; final consent must then be renewed."
 HSM_VER_UNI_customs_union:0 "One Customs Schedule"
 HSM_VER_UNI_customs_union_desc:0 "Merchants can cross a peaceful frontier and still pay for the same cargo twice. A common tariff must survive its first encounter with a laden wagon and two clerks trained to keep different accounts. The Houses will reconcile their schedules and receipts until a carrier can cross with papers that mean the same thing at either post."
 HSM_VER_UNI_customs_union_tt:0 "All participants receive the customs spirit below. Begins a §Y60-day§! implementation period."
 HSM_VER_UNI_common_works:0 "Roads and Common Workshops"
 HSM_VER_UNI_common_works_desc:0 "A bridge cannot stop where the survey changes its letterhead. Engineers from the participating districts will agree on loads, deliveries and maintenance. New civilian workshops give that agreement a place to be tested: the fittings ordered on one bank must reach the builders on the other before the river rises."
 HSM_VER_UNI_common_works_tt:0 "Each participant receives the spirit below, §G1 building slot§! in its native seat and §G1 civilian factory§! where capacity permits. One grant per House."
 HSM_VER_UNI_common_administration:0 "A Common Civil Service"
 HSM_VER_UNI_common_administration_desc:0 "The new offices must be paid for and given authority that a duke cannot revoke whenever a petition displeases him. Local titles and Avian's languages will remain legible in the common register. Rosaline and Montague's private correspondence supplies no mandate for an official marriage: institutions must rest on public articles."
 HSM_VER_UNI_common_administration_tt:0 "Costs §Y100 political power§!. All participants receive the spirit below; administrative transition takes §Y90 days§!."
 HSM_VER_UNI_unified_command:0 "Orders in One Chain"
 HSM_VER_UNI_unified_command_desc:0 "Iovinus knows how easily a temporary headquarters becomes a permanent government. Vincent's household officers will also have to recognise orders carrying another district's signature. The common staff answers to the constitutional presidency and its published budget. Local service traditions continue within one command."
 HSM_VER_UNI_unified_command_tt:0 "Costs §Y50 political power§!. All participants receive the common command spirit below."
 HSM_VER_UNI_constitutional_draft:0 "The Final Articles"
 HSM_VER_UNI_constitutional_draft_desc:0 "The delegates now have a customs service, public works, common offices and a staff to put under a single constitution. Their final signatures will have a different meaning from the invitation. Each remaining government must explicitly agree to cease being a separate country, transfer its forces and holdings, and accept the initiating House's presidency."
 HSM_VER_UNI_constitutional_draft_tt:0 "Requests separate, explicit consent to absorption from every surviving participant. Refusal withdraws that House; refusal by either required duchy ends this convention."
 HSM_VER_UNI_constitutional_act:0 "One Verenian State"
 HSM_VER_UNI_constitutional_act_desc:0 "The act places the common institutions under one sovereign government, led by the House that called the convention. Provincial customs, courts and languages remain protected by its articles. The dukes' old claims must now be heard within the country they once divided, and the common seal will bind the offices that formerly answered only to their own House."
 HSM_VER_UNI_constitutional_act_tt:0 "§RAnnexes consenting participants, including their forces and holdings.§! Only native lands of the united Houses become cores. Our leader remains in office. Replaces the convention spirits with the founding administration below."
 HSM_VER_UNI_settled_institutions:0 "The First Ordinary Budget"
 HSM_VER_UNI_settled_institutions_desc:0 "The ministries must now present the first ordinary budget of the united country. District representatives return with repair estimates and school registers instead of rival declarations of sovereignty. The president's signature will put the new state's promises against its revenues, and every district will want to see where its needs appear in the accounts."
 HSM_VER_UNI_settled_institutions_tt:0 "Replaces the founding administration with the permanent spirit below. Also grants §G+3% stability§!."
 HSM_VER_UNI_can_start_tt:0 "A completed charter settlement or recognised military victory, peaceful native homelands and no rival presidency. The other House's position on unification must permit the convention."
 HSM_VER_UNI_can_customs_tt:0 "All required Houses have accepted our presidency. Optional invitations must be answered. The compact is valid and unsuspended."
 HSM_VER_UNI_can_works_tt:0 "The customs union is operating and the common works have not already been funded."
 HSM_VER_UNI_can_administration_tt:0 "Common works completed, sixty customs days elapsed, valid compact, and at least 100 political power."
 HSM_VER_UNI_can_command_tt:0 "Common administration established, ninety transition days elapsed, valid compact, and at least 50 political power."
 HSM_VER_UNI_can_draft_tt:0 "The unified command is operating and the final articles have not already been submitted."
 HSM_VER_UNI_can_found_tt:0 "All stages and waiting periods complete; every surviving participant explicitly consents to absorption. Native homelands must remain owned and fully controlled, with no war or foreign overlord."
 HSM_VER_UNI_can_settle_tt:0 "One founded state holds all five ducal homelands, is independent and at peace, and has completed sixty days of founding administration."
 HSM_VER_UNI_customs_spirit:0 "Common Customs"
 HSM_VER_UNI_customs_spirit_desc:0 "One schedule and compatible industrial standards reduce duplicated work."
 HSM_VER_UNI_works_spirit:0 "Interprovincial Works"
 HSM_VER_UNI_works_spirit_desc:0 "Shared contracts keep workshops and roads useful across the former boundaries."
 HSM_VER_UNI_administration_spirit:0 "Building the Common Service"
 HSM_VER_UNI_administration_spirit_desc:0 "The new offices require political attention while they establish reliable common records."
 HSM_VER_UNI_command_spirit:0 "Constitutional Joint Command"
 HSM_VER_UNI_command_spirit_desc:0 "The shared staff serves the presidency while respecting local service traditions."
 HSM_VER_UNI_constitutional_state:0 "The Founded Verenian State"
 HSM_VER_UNI_constitutional_state_desc:0 "The founding administration joins industry and defence under one government. Its first ordinary budget is still being prepared."
 HSM_VER_UNI_settled_state:0 "Verenian Common Institutions"
 HSM_VER_UNI_settled_state_desc:0 "Local customs and languages endure within one constitutional state. Working schools, offices, workshops and a unified staff give its presidency lasting substance."
 HSM_VER_UNI_participation_tt:0 "Joins this named presidency's institutions. Our administration continues; a separate final vote is required before our country can be absorbed."
 HSM_VER_UNI_absorption_warning_tt:0 "§RThis consent authorizes the end of our independent state.§! Under the constitutional act, our government, forces and holdings pass to the named president's country. Only native homelands become its new cores."
 hsm_ver_uni.10.t:0 "A Convention Under House Erie"
 hsm_ver_uni.10.d:0 "House Erie proposes a common customs service, public works, civil administration and military staff under Vincent's constitutional presidency. Each stage will be established before the delegates consider one sovereign state. Local courts, customs and Avian's languages retain their place in the articles.\n\nOur delegates may take part while our own government continues its work. The transfer of sovereignty will require a later vote on the completed constitution. For now, the invitation asks whether we are willing to help write it, and to hear what the other Houses are prepared to entrust to a common country."
 hsm_ver_uni.20.t:0 "The Act of Union: House Erie"
 hsm_ver_uni.20.d:0 "The delegates have brought the completed articles and the instruments transferring authority to one state under Vincent's presidency. House Erie asks for our final signature. Local customs, courts and languages are protected, but our separate government will end: its regiments, mainland districts and overseas possessions will pass to the common country.\n\nThe secretary reads the transfer aloud before placing the pen on the table. A signature here will mean more than cooperation between neighbours. Refusing it will take our House out of this convention; accepting it will entrust our future to the constitution we helped prepare. No one may sign for us."
