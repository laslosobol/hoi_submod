 hsm_ver_uni.decline:0 "Decline this convention."
 hsm_ver_uni.participate:0 "Join the institutions; reserve our final decision."
 hsm_ver_uni.refuse_absorption:0 "Keep our country. Withdraw from this act."
 hsm_ver_uni.approve_absorption:0 "§RApprove absorption and the end of our country.§!"
 hsm_ver_uni.30.t:0 "The First Day of One State"
 hsm_ver_uni.30.d:0 "The common seal is placed on the constitution beside the names of the participating districts. [Root.GetLeader] remains at the head of the surviving government. The Houses' local customs and courts now operate within a single state.\n\nBeyond the assembly, the offices continue the work that made this act possible: receiving petitions, paying workshops and issuing orders. The treasury has begun comparing the districts' estimates for the first ordinary budget. It will be the new presidency's next account to its citizens."
 hsm_ver_uni.30.a:0 "Let the institutions answer to the country."

