l_english:
 HSM_VER_ID_eligible_tt:0 "Independent and uncapitulated, under the House's original duke or the lawful co-rule of Rosaline and Montague."
 HSM_VER_ID_ERI_language_question:0 "The Language of the Schoolroom"
 HSM_VER_ID_ERI_language_question_desc:0 "A school inspector brings the court three exercise books: Aquileian prose, Griffish arithmetic, and a local song written as its singer speaks. All belong to Erie. Avian's language quarrel warns us what happens when the court mistakes its own speech for everyone's education. Our teachers must first count the children whom their lessons cannot reach."
 HSM_VER_ID_ERI_aquileian_classrooms:0 "An Aquileian Curriculum"
 HSM_VER_ID_ERI_aquileian_classrooms_desc:0 "Erie's Aquileian inheritance can offer more than courtly manners. Affordable primers and a common written standard will connect village lessons to a substantial literature of science and history. The government will fund teacher training in Aquileian while keeping local speech welcome in the classroom. Cultural kinship gives our schools a direction; their administration remains Erie's responsibility."
 HSM_VER_ID_ERI_two_living_languages:0 "Two Living Languages"
 HSM_VER_ID_ERI_two_living_languages_desc:0 "An Aquileian-speaking child should not have to forget home to learn Griffish, nor should a Griffish-speaking child be excluded from Erie's public life. Parallel readers and teachers trained in both languages will make the first lesson comprehensible and the second language attainable. The extra expense buys a curriculum that more families can trust."
 HSM_VER_ID_ERI_translated_journals:0 "Journals Beyond the Court"
 HSM_VER_ID_ERI_translated_journals_desc:0 "Aquileian scientific journals too often end their journey on a noble's shelf. A public translation bureau will purchase subscriptions, explain unfamiliar terms, and circulate practical extracts among technical schools. Wireless theory and electrical measurement will become subjects our own students can investigate, rather than marvels reported from distant academies."
 HSM_VER_ID_ERI_district_teacher_colleges:0 "District Teacher Colleges"
 HSM_VER_ID_ERI_district_teacher_colleges_desc:0 "Printing two versions of a textbook cannot replace a teacher who understands both. District colleges will train instructors to explain arithmetic, mechanics, and electrical experiments across the language divide. Scholarships for village candidates will carry these methods home, while shared examinations let an apprentice continue studying beyond the district of their birth."
 HSM_VER_ID_ERI_local_histories:0 "A Place for Local Histories"
 HSM_VER_ID_ERI_local_histories_desc:0 "The school standard need not become the measure of every story. Town libraries will collect songs, family records, and testimony in the dialects in which they survive, with translations beside them. When a village finds its own history on a public shelf, the cultural settlement becomes something its inhabitants have helped to write."
 HSM_VER_ID_ERI_public_scholarships:0 "Scholarships in Public Trust"
 HSM_VER_ID_ERI_public_scholarships_desc:0 "A capable pupil should not need a relative at court to reach a laboratory. A permanent endowment will award scholarships through published examinations and require its scholars to teach or serve in public institutions. Erie's cultural choice will thus leave a durable inheritance: trained teachers, accessible learning, and researchers accountable to their own country."
 HSM_VER_ID_EYR_language_question:0 "The Language of Public Service"
 HSM_VER_ID_EYR_language_question_desc:0 "The court receives a petition from a parish teacher whose pupils can recite an imperial lesson but cannot explain it in their own words. Eyrie's offices face the same problem with recruits and clerks. Avian's argument over language belongs here too: the House must decide how its Herzland inheritance can become an education its people actually share."
 HSM_VER_ID_EYR_herzland_classrooms:0 "The Herzland School Tradition"
 HSM_VER_ID_EYR_herzland_classrooms_desc:0 "The imperial written tradition gives Eyrie access to generations of scholarship. A Griffish curriculum, supported by modern primers and trained teachers, will connect parish schools to that wider body of knowledge. The government can honour the Herzland's intellectual inheritance through an independent school system, with lessons explained patiently wherever a local dialect remains the language of home."
 HSM_VER_ID_EYR_two_living_languages:0 "Two Living Languages"
 HSM_VER_ID_EYR_two_living_languages_desc:0 "Eyrie's Griffish institutions can make room for Aquileian-speaking neighbours without abandoning their own inheritance. Bilingual readers and equal access to public examinations will let families approach the schoolhouse with confidence. Teachers will begin with the language a pupil knows and teach the other as an additional skill, preserving a shared civic life across the borderland's different voices."
 HSM_VER_ID_EYR_technical_lexicon:0 "A Common Technical Lexicon"
 HSM_VER_ID_EYR_technical_lexicon_desc:0 "A workshop manual is of little use when every instructor gives a different name to the same part. Engineers and schoolmasters will prepare Griffish reference works from the Herzland's technical literature, with familiar local terms indexed alongside them. Consistent descriptions and tested examples will help Eyrie's workshops turn formal instruction into better industrial practice."
 HSM_VER_ID_EYR_interpreters_college:0 "The College of Interpreters"
 HSM_VER_ID_EYR_interpreters_college_desc:0 "Our bilingual settlement needs people who can carry a precise meaning between languages. The new college will train teachers, technical translators, and public interpreters through practical work with machines and instruments. Its graduates will make industrial manuals and electrical research usable on either side of a linguistic boundary, beginning with Eyrie's own schools."
 HSM_VER_ID_EYR_parish_archives:0 "Open the Parish Archives"
 HSM_VER_ID_EYR_parish_archives_desc:0 "Registers and chronicles tell a richer story than the chancery's official histories alone. Parish archives will receive funds for conservation, public catalogues, and translations of records that younger readers can no longer understand. Keeping these voices accessible will let Eyrie's inhabitants recognise their communities within the House's cultural settlement."
 HSM_VER_ID_EYR_civic_fellowships:0 "Fellowships for Civic Service"
 HSM_VER_ID_EYR_civic_fellowships_desc:0 "The government will establish fellowships for talented pupils from every district, awarded through public examinations. Their recipients will return as teachers, researchers, and trained civil servants. Whether their early lessons followed the Herzland standard or a bilingual reader, they will share the duty to make knowledge useful to the country that supported their studies."
 HSM_VER_ID_aquileian_curriculum:0 "Aquileian Scholarly Tradition"
 HSM_VER_ID_aquileian_curriculum_desc:0 "Erie's schools use an Aquileian written standard to connect elementary teaching with scientific literature. Teacher training and accessible books give local students a firmer foundation for advanced study."
 HSM_VER_ID_herzland_curriculum:0 "Herzland Scholarly Tradition"
 HSM_VER_ID_herzland_curriculum_desc:0 "Eyrie's Griffish curriculum draws on the Herzland's scholarly inheritance. Clear textbooks and trained instructors connect parish classrooms with technical and scientific study."
 HSM_VER_ID_bilingual_curriculum:0 "A Bilingual Public Education"
 HSM_VER_ID_bilingual_curriculum_desc:0 "Aquileian and Griffish share a place in public education. Training teachers in both languages takes resources, but gives more families confidence in the schools and more pupils access to further study."
 HSM_VER_ID_public_endowment:0 "Public Scholarship Endowment"
 HSM_VER_ID_public_endowment_desc:0 "Scholarships awarded through open examinations support a continuing supply of teachers, researchers, and civil servants. Their obligation to serve public institutions turns educational opportunity into lasting civic capacity."
