l_english:
 HSM_VER_DEC_free_houses_peace_tt:0 "Both Houses are independent, have not capitulated, and are at peace."
 HSM_VER_DEC_obey_tt:0 "Ends the ducal exception and recognises the court's ruling. Charter benefits resume once all signatories have settled their breaches. A report arrives tomorrow."
 HSM_VER_DEC_prisoners_tt:0 "Asks Eyrie to exchange prisoners. If it agrees, each House receives §G500 manpower§!, once only. Eyrie may refuse; this decision cannot be repeated even after refusal."
 HSM_VER_DEC_defence_ready_tt:0 "The charter is active; peaceful, independent Houses can share an alliance without leaving another. No reply is pending; any previous offer was sent at least 90 days ago."
 HSM_VER_DEC_defence_ERI_tt:0 "Offers Eyrie a defensive alliance, subject to its consent. Erie leads a new alliance; an existing leader is retained. Avian receives a separate invitation."
 HSM_VER_DEC_defence_EYR_tt:0 "Offers Erie a defensive alliance, subject to its consent. Eyrie leads a new alliance; an existing leader is retained. Avian receives a separate invitation."
 HSM_VER_DEC_requisitions_tt:0 "Ends exceptional requisitions and settles Eyrie's command dispute. Charter benefits resume once the other signatories have also honoured their obligations. A report arrives tomorrow."
 HSM_VER_DEC_charter_ready_tt:0 "Avian's constitutional peace is intact. Erie has not ratified the charter and no reply is pending. This is the first proposal or 120 days have passed since the previous one."
 HSM_VER_DEC_charter_tt:0 "Reopens the Houses' charter negotiations. Avian may ratify a concluded charter separately; sponsoring talks does not grant membership or force either duchy's agreement."
 HSM_VER_DEC_membership_wait_tt:0 "No ratification offer is pending; this is the first membership request or 90 days have passed since the previous one."
 HSM_VER_DEC_membership_tt:0 "Reopens Avian's choice to ratify or decline the charter. Ratification restores full membership, not annexation. Unsettled violations still suspend its benefits."
 HSM_VER_DEC_budget_ready_tt:0 "All three Houses retain the charter. At least one unsigned House has no pending reply and has not received a budget offer in the past 90 days."
 HSM_VER_DEC_budget_tt:0 "Invites unsigned Houses to the common budget. Each may contribute or refuse; Avian requires at least one partner."
 HSM_VER_DEC_levy_tt:0 "Withdraws Avian's exceptional levy and its national spirit. The charter resumes once all signatories have settled their breaches. A report arrives tomorrow."
 HSM_VER_DEC_contact_ready_tt:0 "Peaceful contact with Avian is possible; our House has not chosen military union. At least 35 political power; no pending offer, cooldown or existing compact."
 HSM_VER_DEC_contact_tt:0 "Costs §Y35 political power§! when sent. Proposes civilian transit and a non-aggression pact to Avian; it may refuse. An unanswered offer closes after §Y30 days§!; another may be sent §Y90 days§! after this one."
 HSM_VER_DEC_integration_ready_tt:0 "At least one independent allied duchy can reconsider Avian's original integration offer. The constitutional alternative is not chosen; the previous invitation cooldown has ended."
 HSM_VER_DEC_integration_tt:0 "Asks eligible allied duchies to reconsider Avian's integration offer. Each may refuse; accepting this original arrangement makes the duchy Avian's subject. Further invitations wait §Y90 days§!."
 HSM_VER_DEC_regency_ready_tt:0 "The Herzland settlement is valid; no agreement, reply, scheduled proposal or succession blocks talks. This is the first proposal or 90 days have passed since the previous one."
 HSM_VER_DEC_regency_tt:0 "Tomorrow, choose a civilian agreement or, with minor Grover in Avian's care, a limited regency. Both Houses must consent before either settlement takes effect."
 HSM_VER_DEC_custody_wait_tt:0 "The previous household request was sent at least 90 days ago, or this is the first request."
 HSM_VER_DEC_custody_request_tt:0 "Asks the House sheltering Grover to transfer his household to Avian. Its consent is required. The request expires after §Y45 days§!; another may be sent §Y90 days§! after this one."
 HSM_VER_DEC_custody_recover_ready_tt:0 "Minor Grover remains with the fallen Empire, not a foreign host. Avian holds all original imperial lands; no civilian compact or prior transfer prevents recovery."
 HSM_VER_DEC_custody_recover_tt:0 "Transfers the surviving imperial household and Grover to Avian; an updated report arrives tomorrow. Does not enthrone him or create a regency without consent."
 HSM_VER_DEC_coronation_ready_tt:0 "Independent Trubach holds the Herzland at peace. No ceremony is pending; 60 days have passed since any postponement."
 HSM_VER_DEC_coronation_tt:0 "Reconvenes the imperial coronation. The court may accept the crown or postpone the ceremony for 60 days."
 HSM_VER_DEC_congress_ready_tt:0 "The crowned government holds Griffenheim; a policy is chosen and an eligible dynastic subject can receive a new invitation."
 HSM_VER_DEC_congress_tt:0 "Invites eligible dynastic subjects to the chosen compact. Each may refuse; prior grants are not repeated."
 HSM_VER_DEC_frontiers_ready_tt:0 "Trubach's crowned government is at peace. An opened, unsettled theatre contains a new eligible opponent; the 90-day review cooldown has ended."
 HSM_VER_DEC_frontiers_tt:0 "Renews war goals in the first unsettled open theatre, excluding friendly states and their subjects. Does not declare war. Another review is available after §Y90 days§!."
 HSM_VER_DEC_no_ducal_peace_tt:0 "The rival House exists; neither a recognised peace nor a ducal armistice protects it from hostilities."
 HSM_VER_DEC_border_tt:0 "Starts a border clash between Erie and Eyrie without transferring territory. The clash ends after §Y15 days§! if unresolved; another raid is blocked for §Y90 days§!."
 HSM_VER_DEC_border_timeout_tt:0 "Ends the unresolved border clash without transferring territory."
 HSM_VER_DEC_wargoal_tt:0 "If rivalry and freedom to act persist after §Y130 days§!, grants a war goal against the rival: §Y50% annexation / 50% subjugation§!. Peace or a prior war can cancel the result."
 HSM_VER_DEC_white_peace_tt:0 "Asks the rival for white peace; it may refuse. Starts the two-year restriction on a renewed rivalry campaign, even if this offer is rejected."
