l_english:
 HSM_AVI_two_legible_copies:0 "Two Legible Copies"
 HSM_AVI_two_legible_copies_desc:0 "An agreement is of little use when its readers disagree about what it asks of them. A professional translation office can produce reliable common records and make technical knowledge more accessible, at a continuing administrative cost. Locally appointed clerks can instead draw on familiar voices and existing relationships. Neither arrangement can settle every cultural division within Avian, but both can give its common business a more dependable language."
 HSM_AVI_hear_the_towns:0 "The Towns Have Their Own Questions"
 HSM_AVI_hear_the_towns_desc:0 "A congress agenda can give every House a seat while leaving the towns outside the door. Invite carriers, workshop representatives and local authorities to describe where cooperation would change their working day. Their petitions will inform our construction methods and expose promises that have not yet acquired a responsible office. Peace must become usable beyond the reception room."
 HSM_AVI_common_accounts:0 "Contributions by Consent"
 HSM_AVI_common_accounts_desc:0 "Avian's treasurer has drawn up three columns, but only one government can promise the sums in the first. Katrina will send Erie and Eyrie the proposed accounts and ask what each is prepared to contribute. Shared roads and workshops need dependable funding; a courteous reply cannot pay a supplier, and a blank signature cannot become a debt."
 HSM_AVI_roads_between_houses:0 "The Work Between the Houses"
 HSM_AVI_roads_between_houses_desc:0 "A road crossing a border brings different specifications, maintenance records and suppliers into the same undertaking. Put the charter's shared technical services to work on those differences and give Avian's engineers opportunities to improve industrial methods. Coordination can make future construction more useful without giving our offices the right to order work on another House's land."
 HSM_AVI_limited_joint_staff:0 "A Staff with Agreed Limits"
 HSM_AVI_limited_joint_staff_desc:0 "The common staff should know both what its officers can arrange and what requires a further political decision. Develop shared planning, improve support methods and give Avian's officers experience of working with their counterparts. These practical preparations do not themselves create a military alliance or place the other armies under our command."
 HSM_AVI_a_court_for_hosts:0 "The Host Before the Court"
 HSM_AVI_a_court_for_hosts_desc:0 "Hosting a congress cannot exempt Avian from the rules agreed within it. Katrina will acknowledge the common court's jurisdiction in the matters entrusted to it, including disputes involving her own administration. More reliable records and communications can help the institutions do their work. Their authority must reach the office that supplies the meeting room."
 HSM_AVI_the_first_common_budget:0 "Read the Budget as Signed"
 HSM_AVI_the_first_common_budget_desc:0 "The treasurer must turn the Houses' replies into a programme he can actually fund. Some proposed works may have to wait; others can proceed with fewer partners. Katrina will have the signed obligations read beside the estimates. The charter's credibility now depends on an account that neither conceals a refusal nor spends a contribution nobody promised."
 HSM_AVI_the_unauthorised_levy:0 "The Levy Nobody Authorised"
 HSM_AVI_the_unauthorised_levy_desc:0 "An emergency circular demands timber, metalwork and transport beyond the contributions the Houses agreed. Its author has attached the congress seal where the suppliers expected a warrant. Katrina must answer for an office acting in her name. If the host can enlarge an obligation whenever its stores run low, every signature beneath the charter becomes a promise made on someone else's terms."
 HSM_AVI_honour_the_exemptions:0 "Make the Exemptions Real"
 HSM_AVI_honour_the_exemptions_desc:0 "The suppliers who planned around their exemptions need more than a corrected circular. Let Avian's works offices bring them orders they can fulfil without surrendering the materials promised to other customers. We shall support civilian industry and better building methods, putting our own resources behind the obligations we accepted. A workshop should be able to plan its next season without wondering whether the host will confiscate its output."
 HSM_AVI_common_workshops:0 "Workshops That Can Plan Ahead"
 HSM_AVI_common_workshops_desc:0 "Reliable orders let workshops exchange methods without wondering whether their next consignment will be seized as an emergency contribution. Bring engineers and production specialists together to pursue improvements in industrial technique. Their research will strengthen Avian's capacity to cooperate through practical knowledge and predictable civilian work."
 HSM_AVI_open_minutes:0 "Minutes That Can Be Read Outside"
 HSM_AVI_neighbours_without_a_chair:0 "Neighbours Without a Common Chair"
 HSM_AVI_neighbours_without_a_chair_desc:0 "The charter negotiations have not produced a common government all can accept. Preserve the friendship already concluded and turn the practical knowledge gathered during the talks towards construction. Katrina can continue to mediate between independent neighbours without treating their refusal as ingratitude. Another congress may become possible; the peace need not wait for it."

 HSM_AVI_translation_office:0 "The Common Translation Office"
 HSM_AVI_translation_office_desc:0 "Professional translators maintain consistent versions of common records and technical documents. Their work strengthens confidence in administration and makes research more effective, while the continuing demands of the office consume political effort. Its remit concerns shared business, not the resolution of every linguistic or cultural dispute in Avian."
 HSM_AVI_local_clerks:0 "Clerks Appointed by the Towns"
 HSM_AVI_local_clerks_desc:0 "Common business is explained and recorded through locally appointed clerks familiar to their communities. Their relationships strengthen stability and make it easier to organise political support. They provide a practical means of communication while Avian's broader cultural differences remain matters for further work."
 HSM_AVI_common_budget:0 "The Agreed Budget Protocol"
 HSM_AVI_common_budget_desc:0 "Consenting treasuries have accepted a common accounting protocol. Coordinated work accelerates infrastructure construction and the growth of production efficiency, at a political cost to its participants. Avian requires at least one valid partner signature; each other House benefits only through its own assent. The protocol depends on Katrina's preserved three-House charter. Occupation pauses its benefits. War between the Houses, Katrina's replacement, the Second Winterfest Ball or a communist, loyalist or fascist political transition voids its signatures."
 HSM_AVI_exceptional_levy:0 "The Unauthorised Emergency Levy"
 HSM_AVI_exceptional_levy_desc:0 "Katrina has allowed the administration to take supplies beyond the agreed obligations. The appropriation increases military output, but undermines stability and increases the burden of civilian goods. All charter benefits, including the common budget, are suspended. Avian must withdraw its exception; any unresolved breaches in Erie or Eyrie must also be settled before shared benefits return."

 HSM_AVI_congress_business:0 "The Host's Continuing Obligations"
 HSM_AVI_congress_business_desc:0 "The reception rooms are empty, but the congress office still receives disputed bills, unsigned drafts and letters asking what became of a promise. Katrina's clerks must keep those papers together with the replies. The host's obligations continue after its guests go home, particularly where its own officials would rather close the file."
 HSM_AVI_reconvene_charter:0 "Reconvene the Charter Talks"
 HSM_AVI_reconvene_charter_desc:0 "The delegates left their amendments behind when the last sitting ended. Katrina will ask them to return to those disputed clauses, with Avian's own obligations open to the same scrutiny. Providing a hall and a chair gives the host a place in the negotiations, not an answer to them."
 HSM_AVI_reaffirm_membership:0 "Reconsider Avian's Membership"
 HSM_AVI_reaffirm_membership_desc:0 "Return as an observer and reopen the question of Avian's own consent to the charter. Previous reluctance need not determine every future answer. Membership remains a deliberate decision, with the obligations of the final text available for examination."
 HSM_AVI_reopen_budget:0 "Reopen Unfinished Budget Negotiations"
 HSM_AVI_reopen_budget_desc:0 "The treasury has kept the unsigned budget drafts beside the smaller accounts it can honour. A fresh proposal will have to address the objections Erie and Eyrie actually raised. Existing contributions remain commitments already made; Katrina must persuade the reluctant treasuries that the next undertaking is worth their signature."
 HSM_AVI_withdraw_levy:0 "Withdraw the Unauthorised Levy"
 HSM_AVI_withdraw_levy_desc:0 "The suppliers still hold the circular bearing Avian's seal. Revoking it will mean recalling demands already sent and explaining to our own officials why urgency did not entitle them to another House's stores. Katrina will return the disputed accounts to the agreed terms and ask the common offices to judge the host by the same standard as its guests."

 HSM_AVI_construction_bonus:0 "Construction Beyond the Congress Hall"
 HSM_AVI_industry_bonus:0 "Methods Shared Between Workshops"
 HSM_AVI_support_bonus:0 "Support Within the Agreed Mandate"
 HSM_AVI_electronics_bonus:0 "Reliable Records and Communications"
 HSM_AVI_engineers_bonus:0 "Engineering for a Common Defence"
 HSM_AVI_charter_offer_tt:0 "Sponsors charter negotiations through the existing Erie-Eyrie talks. Both Houses must agree to their terms. Avian ratifies separately; sponsorship alone grants neither membership nor authority over another House."
 HSM_AVI_budget_offer_tt:0 "Avian makes its contribution and invites §YErie and Eyrie separately§! to join the budget protocol. Each may pay §Y35 political power§! to accept or refuse without penalty. Only consenting partners receive its benefits; Avian requires at least one valid partner signature. Refusals and expired offers do not block the campaign."
 HSM_AVI_levy_case_tt:0 "Katrina must decide whether to respect the agreed limits on contributions. Compliance costs §Y75 political power§!. Protecting the levy grants §Y100 political power§! and §YThe Unauthorised Emergency Levy§!, but §Rsuspends all charter benefits, including the common budget§!. Repairing Avian's breach does not resolve any separate Erie or Eyrie exception."

 hsm_ver_avian.2.t:0 "The Same Obligation in Different Words"
 hsm_ver_avian.2.d:0 "The two copies agreed on the quantity of timber. They disagreed on what its delivery meant. One clerk had used a word ordinarily reserved for a voluntary contribution; another had chosen the familiar term for dues. Both insisted that a reader from his district would understand him perfectly.\n\nKatrina asked whose understanding would prevail when a supplier refused. The silence gave her a better account of the difficulty than another explanation of grammar.\n\nA professional translation office could maintain consistent texts, including the technical papers the Houses wanted to share. Establishing it would require political effort, and its work would need continuing attention. Locally appointed clerks offered a different strength: people who knew whom to question and how an instruction would be heard at home. Neither proposal could erase Avian's cultural divisions. One could at least ensure that a promise did not change its meaning on the journey to those expected to keep it."
 hsm_ver_avian.2.a:0 "Establish a professional translation office."
 hsm_ver_avian.2.b:0 "Let the towns appoint clerks they know."
 hsm_ver_avian.3.t:0 "A Road Has Two Ends"
 hsm_ver_avian.3.d:0 "The carrier unfolded a road sketch across a table intended for petitions. At one end, the works office had marked a repaired approach. At the other, a bridge still restricted the weight of a loaded wagon. A successful report in one district had left him unloading the same cargo twice.\n\nA workshop representative followed with orders requiring specifications that changed at the border. The local officials had other examples. None asked Katrina to settle the inheritance of Verenia. They wanted to know which office could answer a question that crossed an administrative boundary.\n\nShe kept the sketch when the audience ended. The engineers would receive it with the petition, not merely an account of how grateful the towns were to have been heard. Cooperation had to join actual journeys and actual work. A road drawn neatly to the edge of one's own responsibility was still capable of stopping in the wrong place."
 hsm_ver_avian.3.a:0 "Send the engineers the whole journey."
 hsm_ver_avian.4.t:0 "A Petition Against the Host"
 hsm_ver_avian.4.d:0 "A supplier had brought a complaint against Avian's congress office. The agreed delivery had been made; an additional charge had appeared when the papers were registered. The clerk receiving the petition suggested that a matter involving the host could first be settled privately, sparing the common court an awkward beginning.\n\nKatrina asked whether the same courtesy would be offered to a complainant against Erie or Eyrie. The clerk began to explain the special responsibilities of the host, then stopped.\n\nThe court's jurisdiction concerned the business the Houses had entrusted to it. Within that business, Avian's stationery could confer no immunity. Katrina ordered the petition forwarded with the office's account and the original agreement. She did not tell the judges what to decide. The supplier would have to prove the charge unjustified; her administration would have to defend it before someone other than the official who had imposed it."
 hsm_ver_avian.4.a:0 "The host must answer under the same rules."

 hsm_ver_avian.10.t:0 "The Columns We Can Fill"
 hsm_ver_avian.10.both.d:0 "The treasurer read the contributions in order: Avian, Erie, Eyrie. Both invited Houses had accepted the protocol. Their representatives now asked the questions that followed a signature: when accounts would be circulated, how disputed costs would be separated, and who could authorise a revision.\n\nKatrina had expected the meeting to feel less difficult once agreement was secured. Instead, every sum had acquired somebody entitled to examine it. The common work could proceed with broader resources and more dependable methods, but its authors would have to surrender the convenience of explaining a bill only to themselves.\n\nThe treasurer proposed rounding a small difference into the following quarter. An Eyrie clerk requested that it remain visible. Erie supported the request. Katrina told the treasurer to keep the line. All three Houses had signed; none had agreed that a minor inconvenience was beneath the attention of those expected to pay."
 hsm_ver_avian.10.one.d:0 "The treasurer had prepared three columns. Only two contained agreed contributions: Avian's own and that of one neighbouring House. The other delegation would remain within the charter without taking on this budget protocol. Its answer had been clear enough to enter in the record.\n\nAn official suggested describing the result as a first unanimous allocation, with the absent contribution deferred. Katrina asked whether anyone had actually promised that later payment. Nobody had. She ordered the heading changed and the proposed sum removed from the total.\n\nThe smaller programme still gave its participants useful work to coordinate and methods to share. It also required them to choose what they could afford together. The representative who had declined listened without being presented with a debt. Katrina wanted a wider agreement eventually. For now, she would have to make an honest account of the narrower one worth considering."
 hsm_ver_avian.10.d:0 "The contributions proposed for Erie and Eyrie remained outside the approved total. Neither neighbouring House had joined the budget protocol. Avian's preparation had produced a set of accounts, but no shared funding arrangement on which its treasurer could rely.\n\nA councillor suggested that the expense of hosting the negotiations gave Katrina grounds to recover something from their guests. She asked him to find that obligation in the charter. He returned to the draft budget instead, where it remained a proposal.\n\nThe court, the services and the work already authorised under the charter had their own standing. They need not be abandoned because a further agreement had failed. Katrina instructed the treasurer to retain the refused terms and prepare a smaller domestic plan. Her nephews had not promised to meet every request. Treating their refusal as lawful would make the next invitation more credible than presenting it as an unpaid bill."
 hsm_ver_avian.10.a:0 "Enter the obligations that were actually accepted."

 hsm_ver_avian.20.t:0 "Avian Proposes a Budget Protocol"
 hsm_ver_avian.20.d:0 "Avian has submitted a protocol for common accounts and contributions. Our treasury can join, spending political capital to support more coordinated infrastructure and industrial practice, or decline while retaining our place in the charter. Katrina's covering note asks for an answer to the listed obligations. Our signature would authorise those commitments; it would not give the host an unlimited claim on our revenues."
 hsm_ver_avian.20.a:0 "Accept the protocol and provide our contribution."
 hsm_ver_avian.20.b:0 "Remain in the charter without joining this budget."
 hsm_ver_avian.21.t:0 "A Treasury Has Answered"
 hsm_ver_avian.21.d:0 "A reply to the budget proposal has reached Katrina's office. The secretary places it beside the invitation and marks the corresponding entry in the accounts. An answer may narrow the programme as readily as enlarge it. The next estimate must reflect what was agreed, leaving the other House's independence intact wherever the common undertaking stops."
 hsm_ver_avian.21.a:0 "Let the accounts reflect the reply."
 hsm_ver_avian.29.t:0 "The Budget Offer Closes"
 hsm_ver_avian.29.d:0 "The time allowed for answering Avian's budget proposal has passed without our signature. The treasury files the invitation among the matters not agreed. No contribution can be charged to us on the strength of silence. Our existing obligations under the charter remain, and a later proposal can be considered on its own terms."
 hsm_ver_avian.29.a:0 "Record that no budget commitment was made."

 hsm_ver_avian.30.t:0 "The Missing Authority"
 hsm_ver_avian.30.d:0 "The emergency circular listed timber, metalwork and transport to be supplied without payment. Its author had attached the congress seal and a convincing account of urgent needs. He had not attached the agreement authorising those demands.\n\nA treasury clerk compared the list with the contributions the Houses had accepted. Several entries lay beyond them. Suppliers who had planned around an exemption were being told that common necessity overruled it. The official responsible argued that Katrina could settle the paperwork once the stores were full.\n\nShe recognised the attraction. The appropriation would strengthen her administration at once and keep military production supplied. Refusing it meant disappointing officials who had already promised results and spending influence to restrain her own office. Protecting it meant making the host's convenience superior to the charter. Every common institution would then lose the assurance on which its work depended, including whichever budget obligations had actually been agreed."
 hsm_ver_avian.30.a:0 "Honour the limits. Withdraw the unauthorised demands."
 hsm_ver_avian.30.b:0 "Protect the emergency levy despite the agreed limits."
 hsm_ver_avian.31.t:0 "The Host Answers for the Levy"
 hsm_ver_avian.31.d:0 "Avian's administration is now bound to the agreed limits on contributions. Our treasury has received confirmation that the exceptional demands cannot stand. The host has accepted that common necessity does not create its own authority to collect. This resolves Avian's part of the dispute; it does not excuse any separate breach still maintained by another House."
 hsm_ver_avian.31.breach.d:0 "Katrina has protected the emergency levy despite the absence of an agreement authorising its demands. The treasury has instructed its clerks to withhold the disputed contributions, and the common offices have stopped work they can no longer promise to support. Avian's seal cannot stand for consent we never gave. Our reply asks the host to withdraw its exception and honour the charter alongside every other House bound by it."
 hsm_ver_avian.31.a:0 "Keep the decision with the agreed obligations."
 hsm_ver_avian.32.t:0 "The Circular Recalled"
 hsm_ver_avian.32.d:0 "Katrina ordered the levy circular recalled with its original date and authority recorded beside the withdrawal. An official offered to issue a cleaner version, one which described the additional demands as an error caught before they acquired significance. She asked whether the suppliers who had received them would recognise that account.\n\nThe replacement instruction revoked the exceptional appropriation and required the offices concerned to work within the obligations actually accepted. Those who had relied on the broader demand would have to revise their plans. Katrina would bear the political cost of telling them so.\n\nHer correction could settle Avian's breach, but could not forgive an exception maintained in Erie or Eyrie. Each government remained answerable for its own conduct. The clerk preparing the dispatches kept both versions of the circular. When a supplier asked why the demand had changed, the administration would have to give the answer it had put on record."
 hsm_ver_avian.32.a:0 "Send the withdrawal wherever the original was sent."
 hsm_ver_avian.41.t:0 "The Minutes Leave the Chamber"
 hsm_ver_avian.41.d:0 "The published minutes included the proposed levy, the objections and Katrina's refusal to let it exceed the agreed contributions. The clerk reading them aloud reached the disputed word and paused. A supplier asked whether its meaning was the same in the other version of the record.\n\nThe clerks responsible for common business explained who had prepared each text and how a correction could be requested. That arrangement now had to work in front of the people it served. Familiar voices and careful wording mattered little if the answer changed when someone asked a difficult question.\n\nKatrina listened while the supplier compared the passage with his exemption. He was satisfied about the levy and dissatisfied about an unrelated delay. Both remarks went into the account of the meeting. She had wanted the public record to establish confidence. It would do so only if a reader could recognise room for an objection in it."
 hsm_ver_avian.41.breach.d:0 "The published minutes carried three documents: the proposed levy, Katrina's protection of it and the later withdrawal. A councillor suggested reading only the corrected instruction. The clerk responsible for the second copy asked how that would explain the earlier demand still pinned above a supplier's desk.\n\nKatrina told him to read all three. The language arrangements for common business would be tested by their ability to make an uncomfortable sequence clear. Each version needed the same account of who had authorised the appropriation and why it no longer stood.\n\nA supplier asked which instruction he should have obeyed in the interval. The answer could not erase the inconvenience already caused. It could identify responsibility and state what the offices must now do. Katrina let the exchange remain in the minutes. An admission made only inside the council chamber would give those outside it little reason to trust the correction."
 hsm_ver_avian.41.a:0 "Publish the account with the objections included."
 hsm_ver_avian.51.t:0 "The Invitations Remain in the Drawer"
 hsm_ver_avian.51.d:0 "The secretary brought Katrina the papers for a charter binding all three Houses. They had not produced the necessary agreement. She asked him to separate the obligations already accepted from those still awaiting consent; the first pile was smaller than she had hoped, but it was not empty.\n\nThe friendship between Erie and Eyrie remained. Avian could keep its own government, maintain its relations and put the construction knowledge gathered during the talks to use at home. None of that required presenting a failed constitutional proposal as a debt owed to its host.\n\nKatrina left the invitations in the drawer. Another meeting might become possible, provided the Houses could attend without being told that their previous answer did not count. For now, she sent instructions concerning the work Avian could undertake on its own. Peace had given the region choices. A common chair was one of them, and had to remain a choice."
 hsm_ver_avian.51.a:0 "Honour the peace and leave room for another answer."

