 hsm_ver_crisis.1.t:0 "The News from Hallhaus"
 hsm_ver_crisis.1.eri.d:0 "The first message reached Erie's offices folded inside a carrier's waybill. Shots had broken up the Second Winterfest Ball at Hallhaus; the guests had been evacuated and the hospitals were filling. A second messenger brought fewer certainties and a longer list of names to trace. Nobody at our table could say who had fired, or who would control the streets when the next letter arrived.\n\nThe steward put the treasury figures beside the dispatch. Our own settlements had paid dearly for years of rivalry, and the frontier captain wanted every available resource kept at home. The medical officer asked for dressings, transport and permission to leave. A councillor argued that abandoning the lawful government now would make every promise of regional peace sound hollow.\n\nAll three requests had weight. We can guard our own territory without a new expenditure, fund emergency medical assistance for Avian, or commit more substantial political support to the loyalists. None of the papers before us can decide the struggle in Hallhaus. They can decide what Erie does while its neighbours are still waiting to learn who has survived."
 hsm_ver_crisis.1.eyr.d:0 "Eyrie's clerk read the dispatch twice before entering it in the register. The Second Winterfest Ball had ended in gunfire. Hallhaus was evacuating guests and carrying the wounded to hospital; later reports spoke of rival groups gathering under arms. Across the table, someone asked whether the seals on the latest message were still those of an authority able to protect its couriers.\n\nThe frontier officers urged caution. A border left unattended would not be repaired by a fine declaration of sympathy. The physicians had a different concern: each hour spent authenticating another letter was an hour lost to patients who could still be saved. Supporters of the lawful government wanted an answer stronger than a condolence, lest hesitation help those seeking to seize power.\n\nThe House's old claims have taught its councillors to examine the obligations behind gracious words. Today the obligation must be chosen before the outcome is known. We may hold our own posts, pay to send medical assistance to Avian, or support the loyalists in the coming struggle. No account of the ball yet tells us what tomorrow's government will remember of our choice."
 hsm_ver_crisis.1.a:0 "Send medical assistance to Avian. (25 PP; 120 days)"
 hsm_ver_crisis.1.b:0 "Aid the lawful government. (40 PP)"
 hsm_ver_crisis.1.c:0 "Keep the home guard on our own frontier. (No cost)"

 hsm_ver_crisis.2.t:0 "The Hospital Returns"
 hsm_ver_crisis.2.loyalist.d:0 "The hospital returns arrived in a laundry basket because the records office had run out of boxes. Some pages listed a patient twice, once under a surname and once under the place where the stretcher party had found them. Others carried the same careful blank where a home address should have been. The clerk asked whether the victory proclamation ought to be attached. The physician asked for more paper.\n\nAvian's surviving government has begun to assemble a record of what its neighbours did during the fighting. Requests sent to Erie and Eyrie lie beside the replies, wherever replies came. Medical aid and assistance to the loyalists appear in different columns. Neither column can account for everyone who waited outside a locked crossing, or everyone who returned to a household with one bed too many.\n\nThere is a temptation to turn the whole bundle into a roll of friends and enemies. The clerk instead prepares acknowledgements precise enough to be believed. Gratitude may open a conversation with a House beyond our authority; it cannot sign a treaty on that House's behalf. Within Avian, the harder promise is already due: survival must become a government under which people can live."
 hsm_ver_crisis.2.military.d:0 "The officer inspecting the hospital returns stopped at a page headed 'assistance from the Houses'. He wanted the entries arranged by political allegiance. The senior surgeon pointed to the admission dates: most had been written while the radio was still changing hands. Nobody on those nights had been able to consult a list of approved benefactors.\n\nThe military administration has won control of Avian. It now inherits the wards, the missing-person inquiries and the letters addressed to offices whose former occupants will not answer. The record of Erie and Eyrie's conduct is uneven. Where supplies or loyalist assistance were sent, the receipts preserve the distinction. Where there was no contribution, a blank remains; it proves little about the fear on the other side of the border.\n\nA clerk drafts separate acknowledgements for medical work and a confidential memorandum on support given to the defeated government. The administration can remember both without treating either as a signature beneath its claim to regional supremacy. Beyond its actual subjects, the frontier still separates governments. The hospital accounts will be closed under the victors' stamp. The diplomatic accounts have only just been opened."
 hsm_ver_crisis.2.technocrat.d:0 "A railway worker recovering in the hospital asked the visiting official to find his brother. The official had come to count available beds and medicines. He wrote the name in the margin anyway. By the end of the visit, the margin contained more names than the printed form had lines.\n\nThe revolution has taken Hallhaus, and the new authorities are collecting the records of a country they must now make function. Hospital returns record assistance received during the crisis, including any help sent by Erie or Eyrie. Aid to the loyalists is recorded separately. To the political committee it is evidence of choices made against the revolution; to the surgeon it is another reminder that the wounded did not arrive in neat political categories.\n\nThe old rulers cannot be summoned to explain the papers they left behind. Nor can the new government assume that its victory has dissolved every independent neighbour. Its officials must distinguish incorporated subjects from foreign administrations still capable of answering for themselves. The worker's inquiry goes into the outgoing post beside the first official letters. Both require an address that exists outside the committee's filing system."
 hsm_ver_crisis.2.a:0 "Record what was done, and send the acknowledgements."

 hsm_ver_crisis.3.t:0 "A Compact on the Table"
 hsm_ver_crisis.3.military.d:0 "The representative from [From.GetName] brought a document short enough for the duty officer to read before admitting the delegation. Its requests concerned civilian crossings, road repairs, deliveries and a pledge of non-aggression. The signature line named two governments. That detail caused a longer discussion than all the proposed schedules together.\n\nTo the military administration, accepting such terms would mean conducting business with a House that had not accepted our supremacy. Some officers consider that an intolerable qualification to victory. Others have spent the morning explaining why workshops lack materials and why another detour has delayed a hospital consignment. They can see a use for a frontier whose daily operation does not require a fresh confrontation.\n\nThe envoy offers no oath and asks for no seat in our command. We can accept the limited bargain or return it unsigned. The people incorporated into Avian as its subjects remain under Avian's authority; this delegation speaks for a country outside it. An agreement would bind our conduct at that border without supplying the submission the general staff originally wanted."
 hsm_ver_crisis.3.technocrat.d:0 "The committee secretary disliked the seal on [From.GetName]'s proposal and approved of its first page. It listed delays in civilian freight, repairs needed on connecting roads and difficulties returning patients to their homes. The second page made clear that the sender expected to remain responsible for its own side of the border.\n\nOne member objected that an agreement with a House administration would lend respectability to institutions the revolution had rejected. A transport delegate answered that a broken axle was indifferent to the ancestry of the official who ordered its replacement. For the new government, the question is whether practical cooperation can serve the population without turning yesterday's enemies into political partners at home.\n\nThe proposal requires a mutual pledge of non-aggression and permits limited civilian coordination. It transfers no territory or authority. We can sign, accepting that an independent neighbour will continue to answer our letters in its own name, or refuse and bear the inconvenience of an unsettled frontier. The secretary leaves the disputed seal visible. Nobody at the table should mistake what they are being asked to recognise."
 hsm_ver_crisis.3.loyalist.d:0 "The envelope from [From.GetName] was placed with the messages received during the emergency. The official handling it remembered how eagerly those earlier envelopes had been opened, and how often their contents had disappointed someone. This one contained a proposed civilian compact and a page of signatures from carriers who wanted a dependable crossing.\n\nThe government that survived the fighting has reasons to welcome a useful neighbour. It also has reason to be careful with the language of reunion. Assistance during a crisis did not settle every question of sovereignty, and the government's own civic reforms must not be made hostage to another ceremonial bargain between Houses.\n\nThe draft offers modest obligations: non-aggression, arrangements for civilian transit and cooperation on the roads and production that sustain it. Each side would keep its own institutions. The clerk has prepared an acceptance and a refusal, leaving space for reasons beneath either. A signature could give our assurances a daily, visible consequence. Refusal would preserve freedom of action, but the carriers waiting beyond the office would still need an answer about tomorrow's journey."
 hsm_ver_crisis.3.neutral.d:0 "Lady Katrina read [From.GetName]'s proposal after the morning's domestic correspondence. The familiar seal drew her attention; the absence of any appeal to a common army kept it. The delegation had understood at least part of her decision. Its draft concerned civilian journeys, deliveries and the maintenance of connecting roads.\n\nA secretary asked whether receiving the proposal would encourage another attempt to draw Avian into the Houses' quarrels. Katrina turned to the clause reserving each government's authority. There was a difference between accepting responsibility for a neighbour's ambitions and arranging for a cart to cross a boundary without three days of uncertainty. That difference would have to survive the first disagreement, not merely the signing ceremony.\n\nWe may accept the civilian compact and its pledge of non-aggression, or hold to a more complete distance. Neither course invites a military union. The envoy waits with an unused return envelope, prepared for either answer. Avian chose neutrality so that its own people could have a future beyond the feud; the question is whether a carefully limited crossing can belong to that future."
 hsm_ver_crisis.3.foundation.d:0 "The letter from [From.GetName] has passed through more offices than its author anticipated. The civilian secretary attached a list of delayed consignments. The security liaison returned the bundle with several proposed crossing hours underlined and no explanation of what required the other hours to remain clear.\n\nThe neighbour seeks a civilian compact: non-aggression, predictable journeys and cooperation on connecting roads. It asks for an official who can answer when an ordinary delivery is stopped. It has neither requested nor received access to the Foundation's protected work. The difficulty is deciding how much certainty our civil administration can honestly promise while security requirements remain beyond the visitors' knowledge.\n\nThe revised draft separates civilian traffic from restricted activity and assigns responsibility for communicating delays. We can approve it without opening the Foundation's files, or refuse rather than accept obligations our offices will struggle to coordinate. The secretary has removed a sentence promising that there will never be interruptions. A promise to explain the permitted route is less impressive, but it is one a border official might actually be able to keep."
 hsm_ver_crisis.3.a:0 "Accept the civilian compact and the non-aggression pact."
 hsm_ver_crisis.3.b:0 "Return the proposal unsigned."

 hsm_ver_crisis.4.t:0 "An Unsigned Copy"
 hsm_ver_crisis.4.d:0 "The registry has closed the current file without an Avian signature. A returned draft or a silence lasting beyond the appointed interval has the same consequence for the carriers waiting outside: no agreed schedule can be posted at the crossing.\n\nOur delegation's work has still consumed money, influence and time. The clerk keeps its annotated copy for a future attempt, but does not mark it as a treaty. The frontier office must keep answering each carrier separately. A later delegation will have to bring terms that address the objections this one could not resolve."
 hsm_ver_crisis.4.a:0 "Keep the draft. Close this round of talks."

 hsm_ver_crisis.5.t:0 "An Answer from the Survivors"
 hsm_ver_crisis.5.support.d:0 "The letter thanks our House for assistance given before anyone could know which government would survive. Its author has crossed out 'in the hour of victory' and written 'when victory remained uncertain'. The correction was left visible when the page was copied. Someone in Hallhaus wanted us to notice it.\n\nThe loyalists have prevailed, but their correspondence describes offices short of staff and families still searching for the missing. The support we committed helped their cause; it did not purchase a claim over the government they now have to build. One of our councillors calls the acknowledgement inadequate. Another asks how many favours can be demanded before gratitude becomes an accusation.\n\nThe surviving government offers a relationship in which the crisis is remembered honestly. We can receive its thanks without adding a new obligation. Where our House is independent, we can also put a civilian border compact before Avian for a separate answer. Existing subject ties remain in force. The letter ends with a request for corrected names on a list of missing people. Whatever policy we choose, the clerk has already begun checking them."
 hsm_ver_crisis.5.medics.d:0 "A small parcel accompanied the letter from Hallhaus: cleaned instruments, a bundle of receipts and a list of patients who had been discharged. One receipt bore a thumbprint where a signature should have been. The physician reading it recognised the name and set that page aside for a family that had been asking for news.\n\nThe loyalist government thanks our House for the medical assistance sent during the emergency. It does not pretend that a surgeon's work was an oath to a political faction. That distinction matters to those who served in the wards, and to those at home who approved the expense while refusing to gamble on the victor.\n\nThe emergency will pass; the journeys between households and hospitals will continue. We may accept the acknowledgement and let ordinary correspondence resume. An independent House may instead propose a civilian compact to make such crossings dependable, subject to Avian's acceptance. A House already bound to Avian remains so. As the councillors debate the reply, the physician asks permission to deliver the discharge list before the office closes. For several households, the most important answer has already arrived."
 hsm_ver_crisis.5.border.d:0 "Hallhaus has sent an acknowledgement addressed to our government, with no special expression of gratitude. The loyalists survived; our House kept its attention on its own territory. The wording is correct enough that nobody can object to it, and cool enough that everyone understands what has been omitted.\n\nThe frontier captain places the patrol reports beside the letter. There were reasons for caution when nobody knew who controlled the roads. A civilian official lays down the unanswered requests from families with relatives in Avian. There were costs to caution as well. Neither record makes the other disappear.\n\nThe government in Hallhaus now has to decide how to live with neighbours whose choices did not assist its victory. We have to decide whether protecting our own border will remain our whole answer. We may acknowledge the new circumstances and leave relations as they stand. If independent, we may spend the influence needed to propose a civilian compact, requiring Avian's own consent. The past cannot be revised by a courteous letter. A crossing that works tomorrow is still something we can negotiate."
 hsm_ver_crisis.5.a:0 "Acknowledge the letter and our existing obligations."
 hsm_ver_crisis.5.b:0 "Offer a civilian border compact. (35 PP)"

 hsm_ver_crisis.6.t:0 "The Demand Comes Back"
 hsm_ver_crisis.6.d:0 "The reply from [From.GetName] is brief. Its government rejects our claim to supremacy and has instructed its frontier posts to continue taking orders from its own authorities. The courier requests a receipt, making the refusal part of the record on both sides.\n\nAn officer reaches for a map; the clerk waits for instructions about the receipt. The refusal has not itself begun a war. Avian's victory governs what happened within Avian and to its actual subjects. A surviving independent House presents a different problem, one that cannot be settled by filing its answer among the domestic orders."
 hsm_ver_crisis.6.a:0 "Acknowledge receipt of their refusal."

 hsm_ver_crisis.7.t:0 "Katrina Draws a Line"
 hsm_ver_crisis.7.eri.d:0 "Lady Katrina's letter arrived with no invitation enclosed. Avian would pursue its own course, declining to make its future depend upon another settlement of the Houses' rivalry. The language was courteous, but the steward found no room in it for the familiar assumption that one more meeting would bring everyone back to the same table.\n\nIn Erie, the practical objections came first. Merchants had planned journeys through Avian; families had connections across the boundary; repairs on one stretch of road meant little if the next remained unusable. A councillor proposed reminding Katrina of her obligations to her relatives. The steward asked which paragraph of such a reminder would tell a carrier whether the bridge was open.\n\nWe can respect Avian's decision and arrange our affairs around its distance. We can also offer a narrower undertaking, confined to civilian transit and a pledge of non-aggression. That proposal would cost influence and require a fresh Avian signature. It would give Katrina no responsibility for Erie's ambitions. The reply lies unfinished beside the accounts, awaiting a decision about how much ordinary neighbourliness can survive the end of a larger expectation."
 hsm_ver_crisis.7.eyr.d:0 "The registrar in Eyrie found a place for Katrina's letter among the diplomatic acts, rather than the family correspondence. Avian's decision to pursue true neutrality was a public policy. Whatever kinship connected the Houses, it would no longer be treated as a standing invitation to involve Avian in their disputes.\n\nSeveral councillors heard a rebuke to Eyrie's claims. Others heard an opportunity to leave those claims undisturbed by yet another attempted compromise. The frontier officer had a smaller question: when a civilian carriage reached the boundary, which arrangements could he still promise its passengers? The old courtesies had never been written with such a deliberate distance in mind.\n\nWe may accept that distance and issue our own instructions accordingly. Alternatively, we may propose limited civilian transit and non-aggression, with each government retaining responsibility on its side. Katrina would have to accept; a proposal is no warrant to cross her border. The registrar leaves space for a new document beside the letter. Eyrie's history gives it reasons to guard its jurisdiction, and perhaps reasons to understand a neighbour doing the same."
 hsm_ver_crisis.7.a:0 "Respect Avian's chosen distance."
 hsm_ver_crisis.7.b:0 "Seek an agreement for civilian crossings. (35 PP)"

 hsm_ver_crisis.8.t:0 "New Notices at the Crossing"
 hsm_ver_crisis.8.d:0 "The carrier brought back his delivery papers with a new stamp and an instruction to use a different crossing. He could describe the barrier, the additional guards and the civil official who had apologised for the delay. He could not explain why the road had been restricted. The official had declined to discuss it.\n\nAvian has admitted the Foundation. Beyond that fact, our government possesses little dependable information. Petitions from merchants speak of interrupted routes and unfamiliar security requirements. The more extravagant rumours circulating in the waiting room have no place in the report placed before our council.\n\nOne adviser wants all such traffic kept at a distance until Avian provides a fuller explanation. Another proposes asking a question its civilian administration can answer: where may ordinary people travel, and who takes responsibility when the published arrangement fails? A limited compact could address those matters without granting us access to the Foundation's affairs or placing our own border under its authority.\n\nWe can acknowledge the changed conditions and maintain our precautions. We can instead pay for a delegation to seek explicit terms. The carrier asks only that the next instruction reach him before he has loaded the cart."
 hsm_ver_crisis.8.a:0 "Acknowledge the notices. Keep our own precautions."
 hsm_ver_crisis.8.b:0 "Negotiate clear civilian passage. (35 PP)"

 hsm_ver_crisis.9.t:0 "The Election Papers"
 hsm_ver_crisis.9.eri.d:0 "The report from Avian included the election results and a newspaper folded to a page of local arguments about spending. The Federalists had won decisively. Below the announcement, a correspondent complained about the state of a road with a freedom of expression that would once have seemed more remarkable than the potholes.\n\nIn Erie's offices, the steward read the complaint before the ceremonial address. The loyalists' survival had been followed by a democratic settlement: civic participation had widened and noble authority had been reduced. Familiar family names remained part of public life, but they no longer explained by themselves who could answer for the government.\n\nSome of our councillors see a welcome source of legitimacy after the violence. Others worry about the questions these newspapers will prompt at home. We may congratulate the elected authorities or acknowledge the result more cautiously. Neither reply will change our own government or dissolve any existing subject relationship. What it will change is the tone of our next letter. The steward sets the road complaint beside our accounts. Whoever now speaks for Avian will still need to explain how the work is paid for."
 hsm_ver_crisis.9.eyr.d:0 "Eyrie's registrar began the reply in the accustomed form, then stopped over the line naming Avian's government. The election had returned a decisive Federalist victory. The document now required an address to authorities whose mandate came from votes, and the old formula offered no guidance on how warmly to greet them.\n\nThe council debated that warmth at length. Some considered the elections a fulfilment of the loyalists' promise to make survival worth more than the preservation of a court. Others feared that reduced noble power in Avian would make every customary privilege in Eyrie look newly negotiable. The legal officer observed that recognising a neighbour's government did not require copying its constitution.\n\nAvian's democratic outcome is already a fact. We may welcome it openly or send a correct, reserved acknowledgement. Our own institutions and any existing ties of subordination remain as they were. The registrar eventually writes the elected government's proper designation in full. Whatever judgement accompanies it, future correspondence must reach the people empowered to answer. An archive that records only the authorities it finds comfortable soon ceases to record the country next door."
 hsm_ver_crisis.9.a:0 "Congratulate Avian's elected government."
 hsm_ver_crisis.9.b:0 "Acknowledge the result with diplomatic reserve."

 hsm_ver_crisis.10.t:0 "Two Signatures"
 hsm_ver_crisis.10.d:0 "The signed copy has arrived. At the crossing, an official pins the agreed civilian arrangements beside the notices already worn pale by the weather. A carrier reads the whole page before asking whether it applies today. This time, the official can say yes.\n\nAvian has accepted our compact and a mutual pledge of non-aggression. Road crews can agree on the work at the boundary, and workshops can arrange deliveries against a schedule both governments recognise. Each crossing still has two authorities, now able to answer one another. The old congress has acquired no new powers from these signatures. The achievement is narrower, and the first travellers will be able to judge it for themselves."
 hsm_ver_crisis.10.a:0 "Put the signed arrangements into practice."

 hsm_ver_crisis.11.t:0 "The Signature No Longer Suffices"
 hsm_ver_crisis.11.d:0 "The official at the crossing has taken down the compact's notice. New instructions from the capital no longer recognise the authority under which it was signed. Carriers ask which of tomorrow's deliveries may still pass, and the official can offer only the arrangements his own government is prepared to honour.\n\nThe completed repairs remain, as do the journeys families remember. The clerk places both signed copies in the archive and opens a new file for the unanswered questions. Any further cooperation will need governments willing to take responsibility for it again."
 hsm_ver_crisis.11.a:0 "Close the agreement and retain the record."

 hsm_ver_crisis.12.t:0 "The Reply Goes Through Hallhaus"
 hsm_ver_crisis.12.d:0 "The first instructions arrived before the office had found a place for the new correspondence tray. A routine reply concerning relations beyond our border was returned for clearance through Avian. The clerk understood the change at once; several councillors needed to see the returned document before accepting what their signature had meant.\n\nOur House explicitly accepted Avian's suzerainty. Its offices still receive petitions and issue local instructions, but the letters that once left in our own name now pass through another government's hands. This was no civilian compact between independent governments. The council chose submission, surrendering the freedom to answer every external question in our own name."
 hsm_ver_crisis.12.a:0 "Enter the obligations we have accepted."

 hsm_ver_crisis.15.t:0 "What the Crossing Has Become"
 hsm_ver_crisis.15.military.d:0 "The returning patient could not climb down from the cart without help. At the Avian post, a sentry had kept the party waiting beyond the agreed crossing hour. Now, on our side, the patient's sister held a chair steady while the driver complained about the delay and a damaged wheel. She listened until her brother was seated, then asked the driver to complain more quietly.\n\nThe journey had continued because our border officer invoked the compact and an Avian superior ordered the cart released. The settlement report includes the exchange, with the repair bill attached. Its account is less reassuring than the scene at the family's door: the military administration still gives orders as though any objection were an act of indiscipline. Our representatives still insist upon answering for their own territory.\n\nRoad work and civilian deliveries have become dependable enough to plan, though every interruption must be challenged and recorded. The compact has secured something real from a neighbour whose ambitions remain unsettling. At home, the patient asks for the chair to be moved nearer the fire. His sister has kept supper warm. Neither of them needs to call the frontier friendly to know that crossing it mattered."
 hsm_ver_crisis.15.technocrat.d:0 "The Avian mechanic had brought the missing coupling and a delivery form stripped of every House honorific. Our workshop foreman fitted the coupling before sending for someone authorised to argue about the form. By afternoon the machine was running, while two representatives were still disputing how to address one another.\n\nThat is the compact's first settlement report in miniature. The technocrat administration values materials delivered and idle hours avoided. Our officials also count the occasions on which they have maintained their jurisdiction against a neighbour impatient with its existence. The working schedules survive the arguments because both sides need the work done.\n\nBefore leaving, the mechanic asks after a worker injured during the crisis. A recovered tool has travelled in his kit, wrapped separately from the spare parts. The foreman promises to deliver it and gives him a receipt bearing the House's full designation. Neither comments on the other's expression. The revolution has changed Avian profoundly; our House remains an independent institution that must deal with its new government. In this workshop, cooperation has acquired the sound of machinery starting again, without requiring either visitor or host to pretend that their political disagreement is finished."
 hsm_ver_crisis.15.elections.d:0 "The invitation came from an elected local representative in Avian, asking our border official to explain a delayed repair at a public meeting. The official initially prepared a private answer for the ministry. The reply advised that the question had been asked in public and deserved to be answered there.\n\nOur welcome for Avian's elections has acquired a practical meaning. The compact's schedules and expenses are now discussed by people who can challenge the authorities responsible for them. A supplier's complaint reaches the council without needing a noble intermediary; a promise made by an official can be read back to that official at the next meeting.\n\nThis has made cooperation less ceremonious and occasionally less comfortable. It has also made several avoidable failures harder to conceal. The settlement report records functioning crossings, continuing work and a government in Avian whose democratic mandate remains its own. Our institutions have not been transformed by congratulating it. We have, however, learned to address questions to an office that must answer more than a family. The repair estimate is attached to the public reply, including the item our official had hoped would pass without comment."
 hsm_ver_crisis.15.loyalist.d:0 "The report includes two letters from the same Avian office. The first thanks our representatives for resolving a difficulty with civilian deliveries. The second questions the expense of a proposed road repair. The familiar warmth of the opening lines has not made the figures any easier to defend.\n\nThe government that survived the crisis now has ordinary responsibilities again. Our House deals with those responsibilities through the compact, maintaining its own authority while accepting obligations it can be asked to fulfil. Avian's civic settlement proceeds on its own terms; nothing in our agreement restores privileges removed by its reforms or makes its political future ours to decide.\n\nAt the crossing, a hospital attendant accompanies a discharged patient as far as the waiting family. The official who checks the papers recognises a name from the emergency lists and quietly corrects the address in his register. The report recommends retaining the present arrangements. It offers no sweeping conclusion about the Houses' future. There is enough work in the undertakings already signed, and a kind of reconciliation in being able to quarrel about their cost without first wondering who will survive the argument."
 hsm_ver_crisis.15.neutral.d:0 "The two road crews met at the boundary with different instructions for draining the same flooded ditch. Their foremen walked its length together, argued over the slope, and agreed where the water would go. They returned to their own workers before the afternoon meal. No common banner was raised over the repaired stretch.\n\nAvian has kept its distance. Katrina's latest reply declines an invitation to wider political discussions while confirming the civilian arrangements for the coming month. The agreement has not made her responsible for our House's ambitions. It has given people on either side a reliable way to settle problems that would otherwise stop at the boundary and worsen there.\n\nThe settlement report records planned deliveries and completed repairs, including the ditch. A family adds its thanks for a relative's return from hospital along the newly usable road. They had feared another postponement when the rain began. Our House has retained a useful neighbour without securing a partner in its larger designs; Avian has preserved its freedom to attend to its own affairs. Tomorrow the crews will work on separate stretches again. The water already runs through both."
 hsm_ver_crisis.15.foundation.d:0 "An Avian notice changed the hours of a civilian crossing, and this time it arrived before the carriers had loaded their carts. Our border office redistributed the schedule. A merchant complained about the inconvenience, then admitted that knowing it in advance had saved a wasted journey.\n\nThe compact has not explained the Foundation. Reports still describe guarded routes, restricted access and officials unwilling to discuss matters beyond their remit. Our representatives have learned which civilian office can authorise an alternative passage and which questions receive no answer. That knowledge is limited, but it is sufficient to prevent some uncertainty from becoming hardship.\n\nThe settlement report recommends recording interruptions carefully and maintaining our own authority at the boundary. It also includes a letter from a family whose relative came home after treatment in Avian, with all the necessary transit papers supplied in time. There is nothing in that letter about what lies behind the closed gates. Our government knows no more of those matters than it did when it signed. What it can verify is smaller: the permitted road is usable, a responsible official can be reached, and our neighbours have kept this particular promise."
 hsm_ver_crisis.15.a:0 "Keep the report with the agreement."

 hsm_ver_crisis.16.t:0 "A Border Still Our Own"
 hsm_ver_crisis.16.eri.d:0 "Erie's steward brings the council three months of frontier expenditure. Posts have been maintained, defensive work inspected and civilian inquiries answered individually because no compact exists to settle them in advance. The House refused Avian's supremacy, and the bill for making that refusal credible is now an ordinary part of the accounts.\n\nThere has been no miraculous end to the uncertainty. Carriers still ask which papers will be recognised; families still bring letters they cannot deliver themselves. The frontier officers have learned to distinguish a delayed cart from a provocation, and the officials in our offices have learned how much patience such distinctions require.\n\nThe report records the essential result without a triumphal address. Our government continues to issue its own orders. Avian's victory has not become a right to issue them for us. Future talks remain possible when circumstances permit, but no signature has yet supplied a civilian settlement. The steward places the new expenses beside the older costs of rivalry. Independence has survived the demand; the task of making life under it tolerable will continue after this file is closed."
 hsm_ver_crisis.16.eyr.d:0 "The young guard had learned the wording of Eyrie's refusal by heart. It was less useful when a traveller asked why a letter from her family had taken so long to reach her. His sergeant heard the exchange, checked her papers and explained which crossing she could attempt. He gave no promise about the reception on the Avian side.\n\nFor three months, our frontier posts have continued to answer to our own authorities. There is no civilian compact to supply common procedures, and no submission giving Hallhaus the right to issue our orders. Eyrie's representatives have preserved its jurisdiction. They must now answer for the daily difficulty of exercising it beside a government that demanded its surrender.\n\nThe traveller's news was good; her complaint remained justified. After she left, the sergeant told the guard to learn the current crossing instructions as carefully as the declaration. The settlement report records an independent House whose institutions have endured, with all the costs and obligations that endurance brings. Future negotiations remain possible on acceptable terms. Until then, the border must be held by people who understand both whom they serve and what the people waiting there need."
 hsm_ver_crisis.16.a:0 "Maintain our authority and answer for its costs."

 HSM_VER_CR_demand_military_desc:0 "The officer presenting Avian's demand waits while our clerk checks his credentials. His document describes the victory in Hallhaus as the beginning of a new regional order and calls upon our House to recognise Avian's supremacy. The clerk asks whether that is a request for a signature. The officer says the administration expects a favourable answer.\n\nWithin Avian, the military has taken power and incorporated the Houses that were actually its subjects. Our country remains independent. No proclamation issued in Hallhaus can substitute for our decision here, and the officials receiving this envoy speak for an institution that still governs its own territory.\n\nThe frontier captain wants the demand rejected and his posts reinforced. The civil envoys propose terms for crossings and deliveries between governments that still answer for themselves. Those urging submission ask the council to entrust its independence to the victors in Hallhaus. The officer places a clean copy on the table. There are several possible replies, but only one of them gives his government the authority it has come to claim."
 HSM_VER_CR_demand_technocrat_desc:0 "Avian's representative lays a typed declaration over the ceremonial cloth on our council table. The new authorities describe hereditary rule as an obstacle to the region's future. They ask our House to acknowledge Avian's supremacy and place its administration within the order created by the revolution.\n\nThe declaration speaks confidently of history. Its bearer is less certain when asked which legal instrument already gives Hallhaus authority on our side of the border. The revolution has taken power in Avian and incorporated its actual subjects. Our country remains independent, whatever judgement the victors pass upon the institution governing it. Its representatives are here to make a decision, not to certify that one has already been made elsewhere.\n\nThe officers propose holding the frontier under our own authority. Civilian envoys ask whether the revolutionary government would accept terms for ordinary trade and travel. Others believe the council must submit and let Hallhaus determine the place of the House in its new order. The council secretary leaves the signature space empty while the alternatives are read aloud. Practical dealings with a revolutionary neighbour need not begin with surrendering the right to answer it."
 HSM_VER_CR_military_victory_desc:0 "The military's orders are being read in the offices that can now be reached from Hallhaus. Lieutenant-General Trubach's coup has prevailed. The defeated communist organisers and loyalist commanders face the victors' tribunals, while martial law gives the new administration the means to impose its decisions throughout Avian.\n\nThe map on the command table is less obliging than the proclamation. Houses actually subject to Avian are incorporated into the new order. Surviving countries beyond that relationship still have their own authorities, their own border posts and the ability to answer an Avian courier with a refusal. Victory at home has not furnished signatures from independent governments.\n\nThe staff prepares two sets of correspondence: instructions for the territories now under its authority, and demands to be delivered abroad. An officer suggests using the same wording for both. The secretary separates the bundles again. The administration may claim a future for all Verenia, but it must confront the distinction between the power it has seized and the recognition it has yet to obtain."
 HSM_VER_CR_technocrat_victory_desc:0 "The red flag flies over Hallhaus. The communist victory has destroyed the old centre of power: the defeated leadership and nobles caught in the struggle have met the revolution's judgement, and committees are taking possession of the offices from which Avian will now be governed. The work of rebuilding begins among records still marked by the fighting.\n\nThe victorious authorities incorporate the Houses that were actually Avian's subjects. That act does not encompass every surviving country in the region. Independent governments retain their territory and their own representatives; rulers abroad cannot be counted among prisoners in Hallhaus merely because a proclamation dismisses their institutions as obsolete.\n\nA transport official asks which seal should be placed on the first letters going beyond Avian's authority. The committee approves the new stamp and adds demands for recognition of its supremacy. Those demands will require separate answers. For the moment, the revolution possesses Avian and the responsibilities that follow from governing it. The frontier marks the point where its orders become correspondence, and where the people receiving them can still say no."
