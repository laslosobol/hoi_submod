l_english:
 HSM_VER_CR_emergency_hospitals:0 "Emergency Hospital Wards"
 HSM_VER_CR_emergency_hospitals_desc:0 "Beds have been found in rooms that were never meant to hold them. Medical supplies and assistance from across the border give Avian's exhausted surgeons time to treat the wounded and return recovering personnel to service. The emergency arrangement lasts 120 days."
 HSM_VER_CR_border_watch:0 "The House Holds Its Border"
 HSM_VER_CR_border_watch_desc:0 "The answer to Avian's demand has reached the frontier posts. Officers prepare defensive positions and make certain that local orders can still be carried out without permission from Hallhaus. For 180 days, this heightened vigilance strengthens defence and speeds entrenchment."
 HSM_VER_CR_civilian_transit:0 "Civilian Border Compact"
 HSM_VER_CR_civilian_transit_desc:0 "Road crews, workshops and civilian carriers work to schedules recognised on both sides of the border. Each government retains its own authority. Cooperation provides §G+10%§! infrastructure construction speed and §G+5%§! factory output while the signed compact is operational. Capitulation suspends these benefits; war between the signatories, subjugation, disappearance or a change of Avian's political route requires a new agreement."
 HSM_VER_CR_border_correspondence:0 "Letters Across the Avian Border"
 HSM_VER_CR_border_correspondence_desc:0 "The couriers still know the road to Hallhaus, even when the names above its offices change. We can ask the government there to recognise limited civilian arrangements: reliable crossings, work on connecting roads and a promise of non-aggression. Each House must secure its own agreement."
 HSM_VER_CR_reopen_talks:0 "Propose a Civilian Border Compact"
 HSM_VER_CR_reopen_talks_desc:0 "Our clerks have retained the disputed drafts and the carriers' petitions. The next delegation will carry both to Hallhaus. A repaired crossing and a dependable delivery schedule may persuade Avian to hear us again, even where the larger quarrels remain unresolved. Its government will still have to put its own name to the undertaking."
 HSM_VER_CR_integration_correspondence:0 "The Unfinished Union"
 HSM_VER_CR_integration_correspondence_desc:0 "A place beside Avian in an alliance has not settled the question of political authority. Independent partners retain the right to examine an integration proposal and to withhold their signatures. The correspondence can be renewed without pretending their earlier hesitation was consent."
 HSM_VER_CR_reconsider_integration:0 "Renew the Integration Proposal"
 HSM_VER_CR_reconsider_integration_desc:0 "The alliance has brought the Houses' officers to the same table, but their governments still answer in separate names. Avian's envoys will return with the proposed terms of submission and the questions left unanswered at the last meeting. A partner asked to surrender its freedom must be able to read what that surrender will mean."
 HSM_VER_CR_integration_defer:0 "We will not sign while the terms remain unsettled."
 HSM_VER_CR_negotiate_demand_option:0 "Propose a civilian compact instead. (35 PP)"
 HSM_VER_CR_loyalist_support_tt:0 "Our aid strengthens the lawful government in the coming struggle. It does not guarantee a loyalist victory or change our House's political status."
 HSM_VER_CR_erie_medics_tt:0 "House Erie sent medical assistance to Avian during the emergency."
 HSM_VER_CR_eyrie_medics_tt:0 "House Eyrie sent medical assistance to Avian during the emergency."
 HSM_VER_CR_erie_support_tt:0 "House Erie committed aid to the lawful government before the outcome was known."
 HSM_VER_CR_eyrie_support_tt:0 "House Eyrie committed aid to the lawful government before the outcome was known."
 HSM_VER_CR_elections_no_regime_change_tt:0 "This records our response to Avian's elections. Avian retains its democratic government; our government and any existing subject relationship are unchanged."

