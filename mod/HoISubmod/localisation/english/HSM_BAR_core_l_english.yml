l_english:
 HSM_BAR_service_capacity:0 "The Unseen Service"
 HSM_BAR_service_capacity_desc:0 "The republic rebuilds its roads and clinics in daylight. Its ministers do not know who works beneath that recovery. Behind ordinary surveys stand trained investigators, cipher specialists and laboratories able to support them far from Barrad. These are the Service's own skills and institutions; what it learns from each anomaly is another matter, recorded in the case that yielded it. Some of its staff still treat the neighbours they first set out to save. Others have begun to think on a very different scale."
 HSM_BAR_common_reconstruction:0 "A Country Beyond the Palace"
 HSM_BAR_common_reconstruction_desc:0 "The palace inventories list well-stocked laboratories and shelves of books. They say nothing of the households living on borrowed grain, or the villagers who must ask a clerk to read a notice. Before promising a new Barrad, we must send teachers and village delegates beyond the palace walls. Their account of food, shelter and schooling will replace the comfortable fiction that the Pentarchy's learning and wealth belonged to everyone."
 HSM_BAR_public_works:0 "Work Paid in Coin"
 HSM_BAR_public_works_desc:0 "The first road crews arrive with shovels borrowed from their neighbours and food enough for a day. They cannot rebuild the country on promises. The public works office will pay regular wages, buy supplies locally where possible and repair the crossings that keep villages cut off from market. Each council will be able to inspect the accounts before it sends another crew."
 HSM_BAR_land_register:0 "Return the Stolen Fields"
 HSM_BAR_land_register_desc:0 "A field cannot simply be returned to the loudest claimant. Surviving records and testimony from neighbours must separate confiscations from older boundary disputes. Surveyors will record which plots can actually be worked and which remain dangerous. A recognized title, with a place to appeal a ruling, will let families plant without fearing that the next official will take the harvest."
 HSM_BAR_workshops:0 "Reopen the Village Workshops"
 HSM_BAR_workshops_desc:0 "Our first contracts are for hinges, pumps and ploughshares. Empty smithies need fuel; carpenters need seasoned timber; both need customers who can pay. A common purchasing office can keep several small workshops supplied while they find their feet. Their first success will be a village that no longer waits weeks for a broken pump to be repaired."
 HSM_BAR_neighbour_conference:0 "Letters Across the Border"
 HSM_BAR_neighbour_conference_desc:0 "Our neighbours know Barrad through refugees, raids and rumours. We must offer guarantees they can inspect, while making clear that the fall of the count is not an invitation to partition the country."
 HSM_BAR_technical_school:0 "A School Without Initiation"
 HSM_BAR_technical_school_desc:0 "The new technical school will teach drawing, arithmetic and the diagnosis of faults on machines its students may actually encounter. Admission will not require a patron's mark or a secret oath. Working apprentices will attend evening classes, while instructors and the ablest pupils begin testing repairs of their own. A public workshop needs someone who understands why a device works, not merely which lever to pull."
 HSM_BAR_border_watch:0 "Watch Posts, Not Raiding Camps"
 HSM_BAR_border_watch_desc:0 "Officers must know which road they are defending and which villages they may not requisition. Clear orders will help us distinguish a border incident from the beginning of war."
 HSM_BAR_magical_institute:0 "A Civil Institute of Magic"
 HSM_BAR_magical_institute_desc:0 "A damaged apparatus cannot be made safe by giving it a respectable new name. The institute will need properly equipped rooms, trained assistants and records another examiner can follow. Its first work will concern damaged soil, contaminated water and the surviving machinery. Results will be checked before anyone is told to return to a field or reopen a well."
 HSM_BAR_defence_stores:0 "The Defensive Reserve"
 HSM_BAR_defence_stores_desc:0 "A small army cannot afford to discover its shortages during an invasion. An ordnance works will supply standard parts and replenish the stores that village workshops cannot maintain alone. Depots must be dispersed and their contents accounted for. Soldiers need reliable equipment, while nearby families need a plan for getting clear if the front reaches them."
 HSM_BAR_reconstruction_accounts:0 "Publish the Reconstruction Accounts"
 HSM_BAR_reconstruction_accounts_desc:0 "Some promises have become roads; others remain entries in a ledger. The treasury will publish what was purchased, what was delivered and where work stopped. Councils will be able to challenge missing wages and inflated invoices before the next contracts are signed. Reconstruction must become a service the republic can sustain, not an emergency that excuses every failure."
 hsm_bar_core.1.t:0 "A Ward Without a Sign"
 hsm_bar_core.1.d:0 "Gasienica's cabinet has approved another convalescent ward. The civilian administrator Michal Zawisza wants it close enough to the villages for families to visit. Marta knows why the Service needs a different building: several patients react to voices from rooms that appear empty to everyone else.\n\nShe can arrange private premises, with a separate medical staff and supplies that do not pass through the public ward. Olcha suggests adapting rooms already purchased by the ministry and concealing their purpose within ordinary maintenance work.\n\nZawisza has marked his preferred site on the plan. It is beside a school. Marta moves the plan away from the other papers before answering."
 hsm_bar_core.1.a:0 "Arrange separate premises and independent supplies."
 hsm_bar_core.1.b:0 "Adapt the ministry's unused rooms discreetly."
 hsm_bar_core.2.t:0 "The Patient Who Came Back"
 hsm_bar_core.2.d:0 "The pony brought out of the ruined treatment house recognizes her sister but not the room around her. She keeps asking why the window has been moved. Marta has covered the glass; it is the only way the patient will sleep.\n\nHer family has spent months searching. Wrona wants them told that she is alive and given a place nearby, with supervised visits until the cause is understood. The visits will need a private ward and a plausible explanation for its restrictions.\n\nOlcha asks for uninterrupted observation instead. The woman recalls a sequence from one of the damaged laboratory notebooks, but only when she thinks she is alone. Her sister is already waiting at the public clinic."
 hsm_bar_core.2.a:0 "Arrange protected visits and care for the family."
 hsm_bar_core.2.b:0 "Keep her under observation before admitting visitors."
 hsm_bar_core.3.t:0 "Beyond the Last Page"
 hsm_bar_core.3.d:0 "The missing half of a laboratory sketch has turned up in a foreign antiquarian's catalogue. The dimensions fit; so does a burn running through the margin. On the reverse, a previous owner has listed places where the same effect was reportedly observed.\n\nOlcha recognizes one of the names and refuses to explain it in the common examination room. Later he gives Wrona a sealed page headed «Instructions for the accompanying assistant». There is no account of whether the assistant returned.\n\nThe first external cell receives the catalogue, a tracing of the sketch and permission to locate its present owner. Marta adds a request: if anyone is living near the reported site, ask after their health before asking about the ground."
 hsm_bar_core.3.a:0 "Send the field brief to the external cells."
 hsm_bar_core.4.t:0 "The Reliquary That Changed Names"
 hsm_bar_core.4.d:0 "Wrona has three photographs of a reliquary. In each, a different seller has put a new label beside it. A chip along the rim identifies the same vessel. The last seller never collected his payment.\n\nAn insurer wants to know whether to compensate the buyer. Wrona wants to know why the buyer paid for a supposedly empty vessel in advance. In the enlargement, something has been scratched inside the lid. Olcha asks for the negative and sends it back with the inscription covered. His note reads: «Do not copy aloud. Comparison pending.»\n\nThe insurer can arrange an interview with the courier who handled the last transfer. For now the courier believes the dispute concerns broken packing."
 hsm_bar_core.4.a:0 "Reach the courier through the disputed claim."
 hsm_bar_core.5.t:0 "The Names on the Convoy List"
 hsm_bar_core.5.d:0 "The courier's destination is a rented room with shuttered windows. From the landing Wrona hears a prayer to Maar. Later, a watcher sees a prison-transfer schedule spread beside the reliquary's description. Three prisoners' names have been circled.\n\nThe packet is due to leave again. Following it may reveal who wants those prisoners and whether the vessel is part of the same plan. The route also gives the cell time to prepare. Wrona could replace the packet at the depot instead and take the original for examination, but a discovered substitution would end the trail.\n\nShe waits with her watchers while the room above them goes quiet."
 hsm_bar_core.5.a:0 "Follow the packet to its recipient."
 hsm_bar_core.5.b:0 "Substitute the packet at the depot."
 hsm_bar_core.6.t:0 "The Empty Road"
 hsm_bar_core.6.d:0 "The convoy has taken the eastern road. Its escort carries a genuine notice about bridge repairs, signed by an engineer who does not know why the work was brought forward. The prisoners reach their destination without seeing the figures waiting above the old crossing.\n\nBy evening the rented room is empty. The plotters were drawn away by a false instruction passed through their own contact. Wrona has their abandoned papers and the means to answer one further message.\n\nClosing the compromised channels will protect the witnesses who helped her. Keeping one intermediary in place might reveal who expected the prisoners. The intermediary has seen the circled names. He asks not to be left without a way out."
 hsm_bar_core.6.a:0 "Close the channels and protect the witnesses."
 hsm_bar_core.6.b:0 "Keep one intermediary under our protection and watch."
 hsm_bar_core.7.t:0 "The Field Beyond the Fence"
 hsm_bar_core.7.d:0 "There is grass beyond the old boundary fence. Marta brings a clod of soil to the meeting and puts it beside the reports. Restoration has worked on this strip. A little farther downhill, nothing grows.\n\nWrona has brought the names from the intercepted convoy list. She asks how many fences the Service can watch, and how many families must wait outside them. Olcha sets down a sketch for suppressing the field itself. The same phenomenon that damaged the land may also be carrying the remaining protective workings; he has not resolved the distinction.\n\nMarta takes the sketch rather than pushing it away. She wants the lower fields safe too. Before any order is signed, she asks what they are willing to destroy in order to cure them."
 hsm_bar_core.7.a:0 "Let every department answer before we choose."
 hsm_bar_core.8.t:0 "A Place Beside the Stove"
 hsm_bar_core.8.d:0 "The healer's letter is short. She needs a replacement for a cracked lens and someone to examine the stones around her treatment room. Her patients have begun refusing to sit near the far wall.\n\nMarta reads the letter beside Olcha. She knows the room: in winter the healer moves a bench nearer the stove so that those waiting do not have to keep their coats on. The request is not for a new doctrine. It is for a room where she can go on treating them.\n\nThe Service's instruction will distinguish the suspect wall from the healer's work. Wrona adds the address to the investigation list. Marta writes back that they will come, and asks the healer to keep the cracked lens wrapped."
 hsm_bar_core.8.a:0 "Protect her work. Investigate what threatens it."
 hsm_bar_core.9.t:0 "The Objection in Olcha's Voice"
 hsm_bar_core.9.d:0 "Wrona proposes a programme that would leave fewer sealed doors for the next generation to guard. The sketches on the table suggest that the underlying influence might be suppressed instead of watched indefinitely. Marta wants to know whether that would also silence the instruments keeping her worst patients alive.\n\nOlcha asks for independent measurements. He has heard an answer like Wrona's before, in a laboratory where objections were removed from the final report. He was the assistant who copied that report.\n\nThey can retain his objection and arrange a separate examination, or release the equipment orders now. The suppliers will notice the sudden demand. Wrona leaves the requisition unsigned while they decide."
 hsm_bar_core.9.a:0 "Commission the independent examination. Keep the objection."
 hsm_bar_core.9.b:0 "Authorize urgent procurement for the programme."
 hsm_bar_core.10.t:0 "The Key on the Inside"
 hsm_bar_core.10.d:0 "The night examiner's entry records a visitor at the isolation room. No visitor appears on the duty roster. The director calls it a mistaken time; Marta finds that the patient's treatment was changed during the same interval.\n\nNobody outside the site can reconstruct what happened without the director's permission. Even the medical staff depend on him for access to the records. Wrona recognizes the arrangement from the houses opened during the uprising.\n\nA separate inspection team will hold the second key, with its own supplies and authority to stop work. Its first task is to interview the night examiner before the director speaks to him again."
 hsm_bar_core.10.a:0 "Give the inspectors independent access."
 hsm_bar_core.11.t:0 "Two Underground Plans"
 hsm_bar_core.11.d:0 "The abandoned workings are dry enough for an experimental site. Olcha has marked every connection that must be cut before an apparatus is installed. Marta has added a second boundary beyond the first. Severing the old conduits will be costly.\n\nThe alternative is a service gallery nearer the remaining machinery. Power and access are already available there, and the trial could cover a larger area. The same conduits continue beneath inhabited ground. Their plans end at the edge of the Pentarchy's last survey.\n\nWrona asks what lies beyond that edge. Nobody can tell her. The superintendent needs a site before he can order the first foundations."
 hsm_bar_core.11.a:0 "Isolate the abandoned workings before construction."
 hsm_bar_core.11.b:0 "Prepare the connected gallery for a larger trial."
 hsm_bar_core.12.t:0 "The Wards Went Quiet"
 hsm_bar_core.12.d:0 "The test chamber falls silent. For a few moments the instruments behave exactly as Olcha predicted. Then the ward above the observation door fades, and the temperature on its far side begins to fall.\n\nWrona orders the inner team out. Through the speaking tube, one examiner asks whether the passage should be longer on the return journey. The next words are indistinct. Marta reaches the entrance with blankets and asks for the apparatus to be stopped.\n\nThe operators can still reduce the field, but repairs will require equipment brought in without explanation to the public works crews. Continuing would give Olcha readings he has never seen. He is staring at the door rather than at the instruments."
 hsm_bar_core.12.a:0 "Shut it down. Fund the recovery and repairs."
 hsm_bar_core.12.b:0 "Continue the trial and widen the emergency cover."
 hsm_bar_core.13.t:0 "Before the First Reading"
 hsm_bar_core.13.d:0 "The apparatus is ready for its first sustained trial. Above ground, a works crew has placed notices warning of tunnel repairs. Below, Marta checks the names of the observers and makes each repeat the evacuation signal.\n\nOlcha reads the instructions without looking up. Wrona notices that he has written the shutdown procedure on a separate sheet, small enough to carry out of the control room. She takes a copy for the team outside.\n\nNo one at the site may extend the trial on their own authority. A second team will keep the means to interrupt it. As the first readings begin, Marta listens to the speaking tube until every station has answered."
 hsm_bar_core.13.a:0 "Keep the independent shutdown team in place."
 hsm_bar_core.14.t:0 "A Bench in the Sun"
 hsm_bar_core.14.d:0 "Zawisza visits the restored strip above the canal. The village council wants another pump; the school asks for windows before winter. He records both requests and spends longer than intended on a bench beside the road. No one has an illness to report.\n\nMarta sits down at the other end. Through the grass she can see the low stones marking the protected boundary. The villagers know not to disturb them, though they do not know who checks them at night.\n\nZawisza thanks the doctor for staying when so many left. She nearly tells him about the other staff. Instead, she asks him to keep the school at the top of his list.\n\nThat evening, the internal report contains a single observation beneath the readings: children used the upper path today."
 hsm_bar_core.14.a:0 "Keep the path open and the boundary watched."
 hsm_bar_core.15.t:0 "What the Other Laboratories Will Read"
 hsm_bar_core.15.d:0 "The trial report lies open at the account from the observation passage. Olcha has restored the section the circulation clerk meant to remove. Marta places the treatment records beside it. The cabinet's repair summary contains neither.\n\nWrona asks what they intend to tell the field partners who will one day work beside an apparatus like this. She once believed every retreat would leave the same danger for someone else. Now there is a warning she can either pass on or leave in this room.\n\nThey may abandon broad suppression and devote the programme to protection against particular threats. Or they may circulate only the successful readings, keeping the larger ambition alive. Olcha does not reach for the pen."
 hsm_bar_core.15.a:0 "End broad suppression. Redirect the Service to containment."
 hsm_bar_core.15.b:0 "Withhold the warnings. Preserve the normalization programme."
 HSM_BAR_core_fall_desc:0 "At the palace gates, friendship is a story told by the survivors. The families waiting outside have brought other stories: confiscated fields, empty beds, names that vanished from the village rolls. Ambrosius is dead. His four guests stand before a crowd that no longer fears their promises.\n\nSomeone calls for them to repair the land. Someone else holds up a child's coat. Gasienica's supporters try to keep a passage clear, but they cannot make this choice for those who have come. Whether the guests live or die, tomorrow there will still be mouths to feed, houses to reopen and places where no one dares to dig."
 HSM_BAR_core_fall_collegium:0 "Spare them. They will answer to a civilian charter."
 HSM_BAR_core_fall_directorate:0 "There will be no pardon. Barrad must govern itself."
 HSM_BAR_COL_democratic:0 "Barrad Magotechnical Collegium"
 HSM_BAR_COL_democratic_DEF:0 "the Barrad Magotechnical Collegium"
 HSM_BAR_COL_democratic_ADJ:0 "Barradian"
 HSM_BAR_DIR_democratic:0 "Barrad Republic"
 HSM_BAR_DIR_democratic_DEF:0 "the Barrad Republic"
 HSM_BAR_DIR_democratic_ADJ:0 "Barradian"
 HSM_BAR_radio_bonus:0 "Field Communications Programme"
 HSM_BAR_service_affairs:0 "Behind the Closed Door"
 HSM_BAR_service_affairs_desc:0 "A medical station, a survey party and an institute laboratory share more than their public reports admit. Orders pass between them under separate names. Within the Service, Marta's treatment records and Wrona's field accounts are read together. The cabinet receives the restoration report."
 HSM_BAR_trace_couriers:0 "Trace the Reliquary Couriers"
 HSM_BAR_trace_couriers_desc:0 "The reliquary's photographs disagree on its name but preserve the same chip along the rim. The insurer can introduce us to the courier who handled it last. Wrona wants the recipient watched before anyone knows the questions concern more than compensation."
 HSM_BAR_watched_transfer:0 "Divert the Prisoner Convoy"
 HSM_BAR_watched_transfer_desc:0 "Three names have been circled on the prison-transfer schedule. An early bridge repair will send the escort along another road. The plotters must receive a different instruction through a contact they still trust."
 HSM_BAR_contact_smile:0 "Open a Channel Against Sombra"
 HSM_BAR_contact_smile_desc:0 "Sombra's rule has turned the question of coercive magic into an immediate threat. Marta wants the protective work offered to those facing it. A medical intermediary can seek S.M.I.L.E.'s attention; Wrona will keep the first approach separate from our other foreign contacts."
 HSM_BAR_share_wards:0 "Share Anti-Domination Research"
 HSM_BAR_share_wards_desc:0 "Olcha has assembled the warding trials, including the failed exposures. The Equestrian researchers need those failures to understand where the protection ends. Marta has signed the technical copy, leaving the original witnesses' names in the sealed appendix."
 HSM_BAR_assist_against_sombra:0 "Deploy the Joint Warding Mission"
 HSM_BAR_assist_against_sombra_desc:0 "The Equestrian liaison asks for instructors who can recognize a failing ward before the troops behind it do. Wrona will send a small team with spare components and the full emergency instructions. The methods that began in Barradian treatment rooms are going to a battlefield."
 HSM_BAR_sombra_volunteer_mission:0 "Authorize Volunteers for Equestria"
 HSM_BAR_sombra_volunteer_mission_desc:0 "Among those willing to serve in Equestria are soldiers who remember why Barrad's old rulers fell. They will travel as volunteers against Sombra, with ordinary military papers. The specialists accompanying them know which part of their training must never appear in a public account."
 HSM_BAR_volunteer_window_tt:0 "Volunteer dispatch is enabled for 90 days. Use diplomacy with Equestria. Losing the conditions removes permission for new dispatches, but does not recall divisions already sent."
 HSM_BAR_abort_suppression:0 "Order an Emergency Shutdown"
 HSM_BAR_abort_suppression_desc:0 "The shutdown team has its own copy of the procedure and a direct route to the controls. Marta requests that the trial end before another exposure. Wrona will bring the observers out while the remaining crew secures the apparatus."
 hsm_bar_smile.1.t:0 "A Drawing in the Medical Envelope"
 hsm_bar_smile.1.d:0 "The enclosure reaches S.M.I.L.E. through a medical correspondent. It shows a protective arrangement tested against compulsive responses, with failures marked in the same ink as the successes. A note offers the remaining measurements for work against Sombra.\n\nOur examiner recognizes Barradian notation. The return contact is a physician, but the witnesses have been replaced by reference numbers. Someone has taken care to leave the hazards legible while removing almost everything that would locate the laboratory.\n\nWe can agree to a limited technical exchange. Before any operative relies on the method, we will need to reproduce it ourselves."
 hsm_bar_smile.1.a:0 "Arrange a restricted technical exchange."
 hsm_bar_smile.1.b:0 "Decline until the evidence is stronger."
 hsm_bar_smile.2.t:0 "The Other Examiner's Questions"
 hsm_bar_smile.2.d:0 "The reply from S.M.I.L.E. contains no promise beyond the proposed exchange. It contains eleven questions. Olcha recognizes the last one before he has finished reading: the examiner wants the unabridged account of a failed exposure.\n\nMarta is relieved. Someone on the other side has read past the successful results. She prepares a reply through the physician who made the introduction, leaving the laboratory address off the page. Wrona records a single contact route and keeps it apart from the field assignments.\n\nFor the first time, their work against coercion will be examined by colleagues they did not appoint."
 hsm_bar_smile.2.a:0 "Continue through the agreed medical contact."
 hsm_bar_smile.3.t:0 "The Pages Beneath the Summary"
 hsm_bar_smile.3.d:0 "Olcha has placed two versions of the warding trials before Marta. The short one explains the principle. The complete one records the interruptions, the symptoms and the moments when an apparently protected observer repeated words no one in the room had spoken.\n\nS.M.I.L.E.'s examiners have asked for the second. Without it they would have to discover the limits beside their own patients and field personnel. The full record will expose much of the laboratory's method, though not its location or the witnesses' names.\n\nMarta leaves both copies open. The summary is the easier one to send."
 hsm_bar_smile.3.a:0 "Share the full experimental record."
 hsm_bar_smile.3.b:0 "Send only the summary for now."
 hsm_bar_smile.4.t:0 "A Courtesy, Not an Agreement"
 hsm_bar_smile.4.d:0 "S.M.I.L.E.'s reply thanks the physician for the enclosure and declines the proposed exchange. Its examiner will not recommend an unknown method on the strength of a selected account. The final paragraph invites firmer evidence at a later date.\n\nOlcha reads the letter once and places it beneath the missing trial records. Marta asks the intermediary to acknowledge the reply without pressing for a meeting. The address can be kept. Trust will require more than another envelope."
 hsm_bar_smile.4.a:0 "Keep the contact for a later approach."
 HSM_BAR_provisional_watch:0 "The Work Left Behind"
 HSM_BAR_provisional_watch_desc:0 "The Pentarchy is gone. Its broken roads, abandoned treatment houses and frightened villages remain. Barrad's new civilian authorities must build the institutions that once existed only at a ruler's pleasure."
 HSM_BAR_accountable_service:0 "The Watch Continues"
 HSM_BAR_accountable_service_desc:0 "The Service has chosen to protect a world it cannot make entirely safe. Examiners, field teams and independent inspectors carry different keys. A closed file does not end their responsibility for those who live beside it."
 HSM_BAR_normalization_service:0 "The Normalization Programme"
 HSM_BAR_normalization_service_desc:0 "The sealed chamber and the nightly watch are no longer enough. The programme seeks to silence the influence itself. Its supporters remember the places they could not save; its opponents keep the records of what the same influence has preserved."
 HSM_BAR_public_defence:0 "A Public Defensive Reserve"
 HSM_BAR_public_defence_desc:0 "Local defence plans pair army supply with evacuation and civilian accountability."
 HSM_BAR_reconstruction_contract:0 "Reconstruction Contracts"
 HSM_BAR_reconstruction_contract_desc:0 "Published contracts direct resources toward ordinary workshops, roads and reliable employment."
 HSM_BAR_custody_charter:0 "The Second Key"
 HSM_BAR_custody_charter_desc:0 "The site director no longer holds every key. A separate team can speak to the patients, examine the night records and halt a trial without asking the laboratory it is inspecting."
 HSM_BAR_suppression_crisis:0 "The Suppression Crisis"
 HSM_BAR_suppression_crisis_desc:0 "The trial's field has unsettled the protective workings around it. Observers wait beside the speaking tubes; above ground, work crews have been told to prepare for repairs to old tunnels. Marta has asked for every available blanket."
 HSM_BAR_anti_sombra:0 "Joint Anti-Domination Wards"
 HSM_BAR_anti_sombra_desc:0 "The warding teams work beside Equestrian soldiers confronting Sombra. Their instructions carry the scars of Barradian experiments: when to break contact, which symptoms to watch for and when a comrade's answer is no longer their own."
 HSM_BAR_sombra_volunteers:0 "Volunteers for the Equestrian Front"
 HSM_BAR_sombra_volunteers_desc:0 "Barradian volunteers have orders for the Equestrian front against Sombra. Their public account will describe soldiers and medics; the warding instructors keep a separate record."
 HSM_BAR_displaced_families:0 "Families Behind the Perimeter"
 HSM_BAR_displaced_families_desc:0 "The families waiting outside the cordon were promised a return home. They know the officials who moved them and the rooms where they now wait; they know nothing of the hidden experiment that has kept the road closed."
 HSM_BAR_active:0 "Barrad's post-Pentarchy institutions are established"
 HSM_BAR_collegium:0 "The Collegium charter was accepted"
 HSM_BAR_directorate:0 "Barrad chose a republic after the fall of the Pentarchy"
 HSM_BAR_diplomacy_open:0 "Neighbour negotiations are authorized"
 HSM_BAR_institute_open:0 "The magical institute is open"
 HSM_BAR_foreign_mandate:0 "External cells are authorized to follow documented leads"
 HSM_BAR_field_research_open:0 "Field investigations are authorized"
 HSM_BAR_liaison_open:0 "Confidential foreign channels are authorized"
 HSM_BAR_coexistence:0 "The service protects coexistence with magic"
 HSM_BAR_normalization:0 "The normalization doctrine was chosen"
 HSM_BAR_repressive_methods:0 "The service employs collective repression"
 HSM_BAR_countercult_open:0 "Evidence-based countercult work is authorized"
 HSM_BAR_cult_leads:0 "The couriers' trail has been found"
 HSM_BAR_couriers_traced:0 "The couriers have been traced"
 HSM_BAR_cult_sting:0 "A controlled transfer was authorized"
 HSM_BAR_cult_mass_arrests:0 "Mass arrests were ordered"
 HSM_BAR_cult_network_broken:0 "The local trafficking and rescue network was disrupted"
 HSM_BAR_smile_partner:0 "A conditional partnership with S.M.I.L.E. exists"
 HSM_BAR_smile_contact_cooldown:0 "S.M.I.L.E. was approached in the past six months"
 HSM_BAR_wards_shared:0 "The full warding research was shared"
 HSM_BAR_suppression_live:0 "The suppression trial is operating"
 HSM_BAR_suppression_resolved:0 "The suppression trial reached a decision"
 HSM_BAR_suppression_test_window:0 "The thirty-day trial is still running"
 HSM_BAR_front_agency:0 "Alder Survey"
 HSM_BAR_contact_smile_tt:0 "Ask S.M.I.L.E. to open a confidential liaison. If accepted, completed warding research can be shared. Full research exchange enables anti-Sombra assistance during Equestria's war against his regime; this contact alone grants no combat bonus."
 HSM_BAR_smile_contact_relevant:0 "Sombra rules the Crystal Empire and a peaceful channel to harmonic Equestria is available"
 HSM_BAR_smile_compromised:0 "The network concealed operational dangers from S.M.I.L.E."
 HSM_BAR_cult_intercept:0 "The courier's packet was intercepted covertly"

