 HSM_BAR_food_cooperatives:0 "Village Cooperatives"
 HSM_BAR_food_cooperatives_desc:0 "A family with a little grain to sell often returns from market with less than it needs for winter. Village cooperatives can purchase seed together, hire carts and keep a common granary under the oversight of their members. The republic will help establish the first stores. No household should have to surrender next year's harvest merely to eat this week."
 HSM_BAR_village_schools:0 "A School Within Reach"
 HSM_BAR_village_schools_desc:0 "For many children, the nearest classroom is a day's journey away. Councils have offered empty rooms, but a roof alone does not make a school. We must provide primers, fuel and a teacher whose wages arrive on time. Lessons will begin where families can reach them, with space on the benches for older pupils who were never taught to read."
 HSM_BAR_teacher_training:0 "Teachers for the Villages"
 HSM_BAR_teacher_training_desc:0 "Knowing one's letters is not the same as knowing how to teach them. Experienced instructors will prepare new teachers in small classes, then accompany them to the villages for their first lessons. The training college will also compare teaching methods and circulate exercises that have proved useful. A mistake in a primer need not pass from one classroom to the next."
 HSM_BAR_clean_water:0 "Safe Wells and Water Mains"
 HSM_BAR_clean_water_desc:0 "A repaired pump is little comfort if the water makes a household ill. Surveyors and medical staff will trace the town's supply, separate drains from drinking water and lay pipes from sources that have been tested. Wells whose contamination we cannot explain will remain closed. There is enough ordinary work to do without declaring every danger overcome."
 HSM_BAR_power_grid:0 "Power for the Workshops"
 HSM_BAR_power_grid_desc:0 "Each workshop struggles to maintain its own source of power, and a failed boiler can idle an entire street. A public generating station and local distribution lines will let several works share a dependable supply. Electricians will inspect the connections before the machinery starts. The first network need not reach every village to change how a town earns its living."
 HSM_BAR_machine_tools:0 "Tools That Make Tools"
 HSM_BAR_machine_tools_desc:0 "Our workshops can repair an old lathe, but producing another requires drawings, gauges and materials of known quality. We will obtain working examples, study their construction and let experienced machinists test improvements with their apprentices. The aim is not a showpiece for visiting officials. It is equipment that another workshop can build and keep in service."
 HSM_BAR_workers_housing:0 "Homes Near the Works"
 HSM_BAR_workers_housing_desc:0 "Families have followed the new jobs into sheds and crowded rented rooms. The councils will release suitable building land, arrange affordable loans and require landlords to repair dangerous dwellings. New homes need drainage, heating and a road to the workplace. A wage should support a household, not disappear into rent for a leaking roof."
 HSM_BAR_polytechnic:0 "The Barrad Polytechnic"
 HSM_BAR_polytechnic_desc:0 "The technical school's senior pupils already undertake work beyond its small teaching rooms. Engineers, surveyors and laboratory instructors will bring those classes together in a polytechnic, with workshops shared across departments. Its first graduates must be able to design a bridge, test a material and explain their calculations to someone who was not present at the lesson."
 HSM_BAR_industrial_standards:0 "One Measure for Every Workshop"
 HSM_BAR_industrial_standards_desc:0 "A replacement part should fit without a day of filing, and a purchaser should know what a stated weight means. A civilian standards office will maintain reference measures and publish specifications drawn up with the workshops. Inspection must catch faulty goods without becoming another toll at the factory gate. Reliable standards will make small producers useful partners in larger undertakings."
 HSM_BAR_regional_markets:0 "Markets Beyond the Village"
 HSM_BAR_regional_markets_desc:0 "A good harvest in one district can coincide with empty stalls in the next. Regular market days, repaired warehouses and published transport charges will give farmers and shopkeepers a reason to trade farther afield. Councils will settle disputes over spoiled deliveries and unpaid purchases. A family should be able to sell its surplus without depending on the only merchant willing to visit."
 HSM_BAR_civil_laboratories:0 "Civil Laboratories"
 HSM_BAR_civil_laboratories_desc:0 "A water sample, a cracked axle and a spoiled sack of seed do not all require a great magical experiment. Civil laboratories will give chemists and engineers a place to investigate the ordinary failures that impoverish whole communities. Samples will be labelled, results recorded and disputed findings repeated. The republic needs answers that remain useful after the examiner has gone home."
 HSM_BAR_extension_schools:0 "Evening Lessons, Travelling Teachers"
 HSM_BAR_extension_schools_desc:0 "Those who missed school cannot all leave their fields and workshops to attend it now. Travelling teachers will bring lessons to outlying settlements, while existing classrooms open in the evening. Reading a contract, keeping accounts and writing to a distant relative are worthwhile achievements in themselves. Adult pupils will not be treated as children who arrived late."
 HSM_BAR_precision_industry:0 "Instruments Made in Barrad"
 HSM_BAR_precision_industry_desc:0 "Our laboratories wait months for a replacement lens or a properly calibrated gauge. A dedicated instrument works will bring glassworkers and precision machinists together with the researchers who use their products. Small runs will be tested before orders grow. The factory's reputation will depend on measurements that agree, not on an impressive catalogue."
 HSM_BAR_scholarships:0 "Study Without Leaving a Family Hungry"
 HSM_BAR_scholarships_desc:0 "Some of the strongest pupils disappear from class as soon as their earnings are needed at home. Scholarships will cover lodging, books and a modest allowance, with awards based on demonstrated ability and need. Village teachers will be able to nominate pupils as well as town schools. A promising education should not end at the cost of the next term."
 HSM_BAR_research_council:0 "The Republic's Research Council"
 HSM_BAR_research_council_desc:0 "Laboratories cannot keep their staff if every project waits for a minister's personal interest. A civilian research council will award grants against written proposals, provide for salaries and equipment, and ask independent examiners to assess the work. Several teams will be able to pursue different questions at once. A careful negative result must be worth reporting too."
 HSM_BAR_national_grid:0 "Connect the District Networks"
 HSM_BAR_national_grid_desc:0 "Local generating stations have changed the towns around them, yet one damaged machine can still darken an entire district. Engineers will link compatible networks, agree common operating rules and prepare reserves for repairs. Outlying communities will be connected where the ground has been cleared for construction. Dependable power should no longer end at the edge of the largest town."
 HSM_BAR_social_insurance:0 "Security in Illness and Old Age"
 HSM_BAR_social_insurance_desc:0 "A broken leg can consume a household's savings before it heals. Contributions from employers, workers and the treasury will support sickness payments and pensions, administered through local offices with a right of appeal. The scheme will begin with benefits it can actually pay. Families need a dependable promise, not a generous entitlement that exists only on paper."
 HSM_BAR_developed_republic:0 "A Republic That Can Provide"
 HSM_BAR_developed_republic_desc:0 "There are still villages waiting for repairs and fields no responsible surveyor will declare safe. But schools now train their successors, workshops can replace their equipment and laboratories have work planned beyond the next emergency. The ministries will bring those institutions into a lasting programme of investment. The republic can begin to plan for needs that have not yet become disasters."

 HSM_BAR_development:0 "Republic Development Programmes"
 HSM_BAR_development_desc:0 "The economic ministry and the education authorities receive requests from councils, cooperatives, schools and laboratories. A village may need a teacher's lodging before another classroom; a workshop may need a reliable supply before another machine. Each programme funds a defined stage of work, with local needs checked before the next allocation. Places still unsafe to inhabit are not reclaimed by an entry in a budget."
 HSM_BAR_development_living_standards:0 "Fund Local Relief and Livelihoods"
 HSM_BAR_development_living_standards_desc:0 "Council officers will visit households at risk of losing their homes or means of work. Repair loans, seed purchases and assistance during illness can stop a temporary hardship from becoming lasting destitution. Each round will cover another set of settlements, with the accounts checked before further funds are assigned."
 HSM_BAR_development_school_network:0 "Extend the Public School Network"
 HSM_BAR_development_school_network_desc:0 "The education authorities will work from lists of children without a place in school and adults asking for evening lessons. New teaching posts must come with rooms, books and wages, not merely an appointment letter. Each round will equip another group of classrooms and prepare the staff who will keep them open."
 HSM_BAR_development_industrial_program:0 "Fund the Next Industrial Programme"
 HSM_BAR_development_industrial_program_desc:0 "The economic ministry will consult producers about the failures holding up their work: unreliable power, worn equipment, missing skills or poor access to supplies. Funding will address an agreed group of these problems together. Later programmes can build on functioning workshops rather than repeating the same unfinished orders."
 HSM_BAR_development_research_grants:0 "Award Civil Research Grants"
 HSM_BAR_development_research_grants_desc:0 "Laboratories will submit proposals with a question, a method and a realistic account of the equipment they lack. The grants committee will fund a new group of projects and the assistants needed to carry them through. Reports will include failed experiments, so that the next investigators do not have to purchase the same mistake."
 HSM_BAR_unlock_living_standards_tt:0 "Unlocks the repeatable programme §Y$HSM_BAR_development_living_standards$§! to reduce poverty."
 HSM_BAR_unlock_school_network_tt:0 "Unlocks the repeatable programme §Y$HSM_BAR_development_school_network$§! to reduce illiteracy."
 HSM_BAR_unlock_industrial_program_tt:0 "Unlocks the repeatable programme §Y$HSM_BAR_development_industrial_program$§! to advance industrial development."
 HSM_BAR_unlock_research_grants_tt:0 "Unlocks the repeatable programme §Y$HSM_BAR_development_research_grants$§! to improve the scientific base."
 HSM_BAR_development_interrupted_tt:0 "The programme was interrupted before completion. §RNo development improvement is granted.§!"

 hsm_bar_development.1.t:0 "The Polytechnic's First Graduates"
 hsm_bar_development.1.d:0 "The examination room still smells of paint. On the table beside the diplomas lie a pump drawing, soil samples and a measuring instrument assembled in the teaching workshop. The instructors have asked the graduates to leave them there until the guests have finished asking questions.\n\nOne of the village delegates recognizes a former apprentice among the new engineers. She asks whether he will come home to examine their mill. He has already written for its measurements. Beside him, another graduate explains why her proposed water main must take a longer route than the council wanted. Her examiner listens without intervening.\n\nThere are more vacancies than graduates. For once, however, the republic can fill some of them without waiting for a specialist to arrive from abroad. The next class is already at work upstairs."
 hsm_bar_development.1.a:0 "There is work waiting for them."
 hsm_bar_development.2.t:0 "The First Research Grants"
 hsm_bar_development.2.d:0 "The research council's first awards are ready to be posted. A materials laboratory will investigate failed boiler plates; an agronomist will compare seed trials on land already cleared for cultivation. Another team has received money to test a measuring method whose inventor openly admits that it may not work.\n\nThe treasury's representative pauses at that last proposal. The examiner shows her the cost of the faulty measurements it could prevent, then the plan for checking the result. She signs. Salaries, supplies and time for independent tests are entered beside the equipment orders.\n\nOutside the meeting room, an assistant reads the notice twice. His laboratory can retain its staff through the winter. He leaves to tell them before the evening shift begins."
 hsm_bar_development.2.a:0 "Let the teams begin their work."
