 HSM_BAR_fielddesk_recon_cost:0 "20 political power  /  14 days  /  1 civilian factory"
 HSM_BAR_fielddesk_recon_tt:0 "$HSM_BAR_fielddesk_recon_title$\n$HSM_BAR_fielddesk_recon_cost$\n\nA documented regional lead that still needs reconnaissance, at a location controlled by the selected country. That country must still exist and must not have capitulated.\n\nFactories remain assigned for the full operation. If the lead, territorial access or authorization is lost, the team is recalled: dispatch costs are refunded and factories are released."
 HSM_BAR_fielddesk_recon_mission:0 "Reconnaissance"
 HSM_BAR_fielddesk_recon_running:0 "$HSM_BAR_fielddesk_recon_title$: [?HSM_BAR_fielddesk_order_target.GetName]\n[?days_mission_timeout@HSM_BAR_fielddesk_recon_mission|0] days remaining; [?HSM_BAR_fielddesk_factories|0] factories assigned."
 HSM_BAR_fielddesk_archive_cost:0 "30 political power  /  21 days  /  2 civilian factories"
 HSM_BAR_fielddesk_archive_tt:0 "$HSM_BAR_fielddesk_archive_title$\n$HSM_BAR_fielddesk_archive_cost$\n\nA surveyed destination with unexamined records from a documented case. Their location must remain under the selected country's control, and that country must not have capitulated.\n\nFactories remain assigned for the full operation. If the lead, territorial access or authorization is lost, the team is recalled: dispatch costs are refunded and factories are released."
 HSM_BAR_fielddesk_archive_mission:0 "Archive retrieval"
 HSM_BAR_fielddesk_archive_running:0 "$HSM_BAR_fielddesk_archive_title$: [?HSM_BAR_fielddesk_order_target.GetName]\n[?days_mission_timeout@HSM_BAR_fielddesk_archive_mission|0] days remaining; [?HSM_BAR_fielddesk_factories|0] factories assigned."
 HSM_BAR_fielddesk_relic_cost:0 "60 PP  /  30 days  /  3 civilian factories  /  20 PP success surcharge"
 HSM_BAR_fielddesk_relic_tt:0 "$HSM_BAR_fielddesk_relic_title$\n$HSM_BAR_fielddesk_relic_cost$\n\nCompleted containment research and an investigated relic available for extraction at its documented location, still controlled by the selected country. Crowns must be in a museum or under seal; worn crowns and rulers cannot be taken. Successful extraction costs an additional 20 political power and causes a diplomatic incident.\n\nFactories remain assigned for the full operation. If the lead, territorial access or authorization is lost, the team is recalled: dispatch costs are refunded and factories are released."
 HSM_BAR_fielddesk_relic_mission:0 "Relic retrieval"
 HSM_BAR_fielddesk_relic_running:0 "$HSM_BAR_fielddesk_relic_title$: [?HSM_BAR_fielddesk_order_target.GetName]\n[?days_mission_timeout@HSM_BAR_fielddesk_relic_mission|0] days remaining; [?HSM_BAR_fielddesk_factories|0] factories assigned."
 HSM_BAR_fielddesk_remains_cost:0 "60 PP  /  21 days  /  2 civilian factories  /  20 PP success surcharge"
 HSM_BAR_fielddesk_remains_tt:0 "$HSM_BAR_fielddesk_remains_title$\n$HSM_BAR_fielddesk_remains_cost$\n\nA forensic mandate, completed forensics research, investigated Grover evidence and confirmed recoverable bones at a location still controlled by the selected country. A living or resurrected Grover excludes recovery. Successful recovery costs an additional 20 political power and causes a diplomatic incident.\n\nFactories remain assigned for the full operation. If the lead, territorial access or authorization is lost, the team is recalled: dispatch costs are refunded and factories are released."
 HSM_BAR_fielddesk_remains_mission:0 "Remains recovery"
 HSM_BAR_fielddesk_remains_running:0 "$HSM_BAR_fielddesk_remains_title$: [?HSM_BAR_fielddesk_order_target.GetName]\n[?days_mission_timeout@HSM_BAR_fielddesk_remains_mission|0] days remaining; [?HSM_BAR_fielddesk_factories|0] factories assigned."
