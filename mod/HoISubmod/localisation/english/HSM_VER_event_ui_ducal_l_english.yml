l_english:
 HSM_VER_EUI_ducal_hearings_tt:0 "Commits Erie to public hearings and their continuing civic costs. The petition commitments spirit applies:"
 HSM_VER_EUI_ducal_private_petitions_tt:0 "Petitions will be handled privately at court. Pays the political cost of this choice."
 HSM_VER_EUI_ducal_rosaline_tt:0 "Records that Rosaline has been heard about her correspondence with Montague."
 HSM_VER_EUI_ducal_armistice_tt:0 "Signs the armistice and ends border clashes and mutual conquest goals. Agreed inspections apply until friendship replaces the armistice."
 HSM_VER_EUI_ducal_ask_inspections_tt:0 "Sends the proposing House a counteroffer for joint frontier inspections. It must accept the inspection terms before the armistice can be signed."
 HSM_VER_EUI_ducal_refuse_armistice_tt:0 "Rejects the outstanding armistice proposal and closes this round of talks. No truce or inspection agreement is signed."
 HSM_VER_EUI_ducal_accept_inspections_tt:0 "Accepts joint inspections and signs the armistice. The diplomatic settlement remains in force until war or a friendship treaty."
 HSM_VER_EUI_ducal_exchange_tt:0 "Completes the prisoner exchange once, returning captives to both Houses' manpower pools. Erie receives a report of the exchange."
 HSM_VER_EUI_ducal_treaty_tt:0 "Ratifies friendship, ends inspections and relinquishes the Houses' disputed foreign cores. Both Houses remain independent."
 HSM_VER_EUI_ducal_ask_arbitration_tt:0 "Returns the friendship proposal with a demand for property arbitration. The proposing House must accept this counteroffer before the treaty can be concluded."
 HSM_VER_EUI_ducal_refuse_treaty_tt:0 "Rejects the outstanding friendship treaty and closes this round of negotiations. The proposed peace dividend and territorial concessions do not take effect."
 HSM_VER_EUI_ducal_accept_arbitration_tt:0 "Accepts property arbitration and ratifies friendship."
 HSM_VER_EUI_ducal_civic_delegates_tt:0 "Seats civic delegates. Ratification of an equal charter will establish a public council."
 HSM_VER_EUI_ducal_household_delegates_tt:0 "Seats household delegates. Ratification of an equal charter will establish common courts."
 HSM_VER_EUI_ducal_observer_tt:0 "Accepts observer status at the Verenian congress and informs the Houses. If their charter is already valid, Avian receives a separate offer to ratify it; observing alone does not grant charter benefits."
 HSM_VER_EUI_ducal_refuse_observer_tt:0 "Declines the congress invitation and informs the Houses. Avian stays outside the congress; this reply grants no charter membership."
 HSM_VER_EUI_ducal_offer_equal_tt:0 "Offers an equal charter to Eyrie, subject to its consent. Eligible Avian observers receive a separate invitation after ratification."
 HSM_VER_EUI_ducal_offer_presidency_tt:0 "Proposes Erie's limited ducal presidency. Eyrie may accept, demand equality or refuse."
 HSM_VER_EUI_ducal_ratify_chosen_tt:0 "Ratifies the negotiated charter. Eligible Avian observers receive a separate invitation; unresolved charter disputes suspend common institutions."
 HSM_VER_EUI_ducal_equal_counteroffer_tt:0 "Asks Erie to abandon its proposed ducal presidency and accept equal charter institutions. Erie must answer this counteroffer before the charter is ratified."
 HSM_VER_EUI_ducal_refuse_charter_tt:0 "Rejects the pending charter and ends this round of talks. Common institutions are not established by this reply; the friendship treaty remains a separate agreement."
 HSM_VER_EUI_ducal_ratify_equal_tt:0 "Ratifies an equal charter. Eligible Avian observers receive a separate invitation; unresolved charter disputes suspend common institutions."
 HSM_VER_EUI_ducal_avian_ratify_tt:0 "Avian joins the charter and its established institutions. Unresolved disputes suspend the benefits."
 HSM_VER_EUI_ducal_avian_refuse_charter_tt:0 "Declines charter membership and relinquishes Avian's congress observer status. Erie records the refusal; no common-court, staff or services benefits are granted."
 HSM_VER_EUI_ducal_honour_judgement_tt:0 "Honours the court's ruling and resolves Erie's first charter dispute, allowing the settlement to continue. Eyrie receives notice that the ruling has been respected."
 HSM_VER_EUI_ducal_ducal_exception_tt:0 "Claims a ducal exception and suspends charter benefits for both Houses and any Avian signatory, including courts, staff, services and the common budget. Existing military alliances remain in force. Erie gains the ducal exception spirit:"
 HSM_VER_EUI_ducal_erie_league_tt:0 "Accepts the defensive alliance. Erie leads a new league; an existing alliance keeps its leader. The Houses join where their current memberships permit it. Eligible Avian charter partners receive a separate invitation and may refuse."
 HSM_VER_EUI_ducal_refuse_league_tt:0 "Declines the pending defensive alliance and informs the proposing House. No faction is created or joined by this reply; the charter remains a separate agreement."
 HSM_VER_EUI_ducal_avian_league_tt:0 "Accepts the invitation and brings Avian into the Houses' existing defensive alliance under its current Erie or Eyrie leader. Avian retains its own government."
 HSM_VER_EUI_ducal_avian_refuse_league_tt:0 "Declines the invitation to the defensive alliance. Avian stays outside the faction; its charter membership is not revoked by this decision."
 HSM_VER_EUI_ducal_resist_avian_tt:0 "Rejects Avian's demand for supremacy and notifies its government. Grants Border Watch for 180 days; the border situation can be reviewed after 90 days if the hostile relationship persists."
 HSM_VER_EUI_ducal_negotiate_avian_tt:0 "Proposes a civilian transit compact to Avian, subject to its consent. Ratification establishes a non-aggression pact."
 HSM_VER_EUI_ducal_submit_avian_tt:0 "Accepts Avian's suzerainty: our country becomes its puppet. Removes Border Watch and any civilian transit benefits that no longer meet the compact's conditions."
 HSM_VER_EUI_ducal_accountable_muster_tt:0 "Settles the muster review through civilian accountability. Pays for the audit and grants accountable muster: faster mobilisation and greater stability at a continuing political cost."
 HSM_VER_EUI_ducal_officers_muster_tt:0 "Entrusts the muster review to the officers, settling the question of oversight. Grants army experience and the officers' confidence spirit, strengthening training and organisation at the expense of stability."
 HSM_VER_EUI_ducal_civic_command_tt:0 "Replaces professional command with civic scrutiny and settles Eyrie's command policy."
 HSM_VER_EUI_ducal_professional_command_tt:0 "Replaces civic scrutiny with professional command and settles Eyrie's command policy."
 HSM_VER_EUI_ducal_ask_presidency_tt:0 "Seeks Eyrie's consent to Erie's limited presidency. The charter awaits Eyrie's reply."
 HSM_VER_EUI_ducal_ratify_presidency_tt:0 "Ratifies Erie's limited presidency and Eyrie's common courts. Eligible Avian observers receive a separate invitation."
 HSM_VER_EUI_ducal_eyrie_league_tt:0 "Accepts the defensive alliance. Eyrie leads a new league; an existing alliance keeps its leader. The Houses join where their current memberships permit it. Eligible Avian charter partners receive a separate invitation and may refuse."
 HSM_VER_EUI_ducal_return_workshops_tt:0 "Returns the requisitioned workshops and settles Eyrie's command dispute. Erie receives notice that the court's ruling has been honoured, allowing the charter settlement to continue."
 HSM_VER_EUI_ducal_keep_requisitions_tt:0 "Upholds military requisitions and suspends charter benefits for both Houses and any Avian signatory, including courts, staff, services and the common budget. Existing military alliances remain. Eyrie gains exceptional requisitions:"
 HSM_VER_EUI_ducal_conference_inspections_tt:0 "Chooses joint frontier inspections. They begin with the armistice and end when friendship is ratified."
 HSM_VER_EUI_ducal_conference_arbitration_tt:0 "Chooses property arbitration in place of joint frontier inspections."
 HSM_VER_EUI_ducal_defeated_rights_tt:0 "Recognises the defeated House's rights in Erie's settlement. Until a final constitutional order replaces it, the settlement uses the rights-based administration shown below:"
 HSM_VER_EUI_ducal_central_commissions_tt:0 "Places the defeated territory under central commissions. Until a final constitutional order replaces them, these commissions favour the army and factory production at the expense of stability:"
 HSM_VER_EUI_ducal_equal_judgement_tt:0 "Upholds the court's judgement and applies equal treatment to the petition. Replaces any patron-claims spirit with equal judgement; a report on the consequences can follow after 45 days while the settlement holds."
 HSM_VER_EUI_ducal_patron_claims_tt:0 "Awards the claim to the duke's patrons, replacing equal judgement with patron claims. A report on the consequences can follow after 45 days while the settlement holds."
 HSM_VER_EUI_ducal_campaign_read_tt:0 "Acknowledges Iovinus's campaign memorandum and closes this report."
 HSM_VER_EUI_ducal_civilian_release_tt:0 "Chooses civilian demobilisation and begins a 120-day transition. After that wait, the workshop programme can proceed once the correspondence policy and required focus are complete. The civilian release spirit applies while the settlement holds:"
 HSM_VER_EUI_ducal_military_order_tt:0 "Retains military government. Begins a 120-day transition; the workshop programme can then proceed after the correspondence decision and required focus. While the settlement holds, grants military government:"
 HSM_VER_EUI_ducal_open_post_tt:0 "Allows private correspondence and settles the postal policy. The open correspondence spirit supports research at a daily political cost while Eyrie's postwar settlement remains active:"
 HSM_VER_EUI_ducal_supervised_post_tt:0 "Keeps private correspondence under military countersignature and settles the postal policy. Supervised correspondence improves planning at the expense of stability while the settlement remains active:"
 HSM_VER_EUI_ducal_fund_training_tt:0 "Funds civilian retraining and workshop construction where capacity permits."
 HSM_VER_EUI_ducal_unfunded_training_tt:0 "Leaves retraining to the local boards without new funding. The unresolved placement of reservists reduces stability and civilian factory construction while the settlement remains active:"
 HSM_VER_EUI_ducal_arms_priority_tt:0 "Reserves workshop capacity for military production. The resulting priority raises factory output but slows civilian factory construction while the settlement remains active:"
 HSM_VER_EUI_ducal_civilian_contracts_tt:0 "Funds civilian contracts and settles the workshop programme."
 HSM_VER_EUI_ducal_inspection_read_tt:0 "Records the completed inspection, allowing the settlement's closing report once its final focus is complete. The chosen civilian or military order and workshop policies continue."
 HSM_VER_EUI_ducal_ending_read_tt:0 "Acknowledges the settlement's closing report. The chosen postwar policies continue under their existing conditions."
 HSM_VER_EUI_ducal_approach_avian_tt:0 "Seeks a non-aggression agreement with Avian. An offer is sent only while the settlement remains valid and Avian is an independent Intergigantes government at peace. Avian decides whether to accept."
 HSM_VER_EUI_ducal_leave_avian_tt:0 "Closes the decision to approach Avian without sending a non-aggression offer. Avian receives no new diplomatic commitment from this choice."
 HSM_VER_EUI_ducal_accept_pact_tt:0 "Signs a non-aggression pact with [FROM.GetNameDef] and informs its government. Avian accepts this bilateral agreement while retaining its own government and territory."
 HSM_VER_EUI_ducal_refuse_pact_tt:0 "Declines the non-aggression offer and informs [FROM.GetNameDef]. This round of negotiations ends without a pact."
 HSM_VER_EUI_ducal_subject_consent_tt:0 "Consents to later annexation by [FROM.GetNameDef] and begins a 90-day transition. Integration still requires peace, homeland control and the valid settlement."
 HSM_VER_EUI_ducal_subject_refusal_tt:0 "Refuses consent to annexation and informs [FROM.GetNameDef]. The proposed integration process stops at the terms stage; Avian remains a subject under its existing relationship."
 HSM_VER_EUI_ducal_avian_local_charter_tt:0 "Selects a local charter and begins the 90-day transition. Its institutions take effect after integration:"
 HSM_VER_EUI_ducal_avian_commission_tt:0 "Selects direct commissions and begins the 90-day transition. Their institutions take effect after integration:"
 HSM_VER_EUI_ducal_association_accept_tt:0 "Accepts association with [FROM.GetNameDef]. If the Houses' charter is valid, Avian also becomes a congress observer and signatory. This reply grants no immediate spirit; any later annexation requires a separate accession agreement."
 HSM_VER_EUI_ducal_association_refuse_tt:0 "Declines association with [FROM.GetNameDef] and closes the pending offer. Avian does not enter the congress or charter through this reply."
 HSM_VER_EUI_ducal_accession_accept_tt:0 "Consents to annexation by [FROM.GetNameDef] and starts a 60-day transition. Annexation is a later action: Avian's territory and troops will pass to the sponsor only if the association, independence, peace and required homeland control remain valid."
 HSM_VER_EUI_ducal_accession_refuse_tt:0 "Refuses annexation by [FROM.GetNameDef] and closes the accession offer. The existing association is retained; Avian gives no consent to transfer its territory or troops."
 HSM_VER_EUI_ducal_exchange_open_tt:0 "Both Houses remain free and at mutual peace under an armistice or treaty; the prisoner exchange is still outstanding."
 HSM_VER_EUI_ducal_muster_open_tt:0 "Iovinus still governs a free Eyrie; the muster review has not been settled."
 HSM_VER_EUI_ducal_command_policy_open_tt:0 "Iovinus still governs a free Eyrie; the peace treaty is valid and the command policy remains undecided."
 HSM_VER_EUI_ducal_judgement_open_tt:0 "Erie's court case still awaits a ruling under the active charter."
 HSM_VER_EUI_ducal_requisitions_open_tt:0 "Eyrie's requisition dispute still awaits a ruling under the active charter."
