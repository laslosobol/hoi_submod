l_english:
 HSM_VER_CW_first_budget:0 "The First Common Budget"
 HSM_VER_CW_first_budget_desc:0 "The border disappeared from the map before it disappeared from the ledgers. Two offices pay for one school, while neither accepts responsibility for the next. The government must decide who spends the common revenue and who answers to those who supplied it."
 HSM_VER_CW_citizens:0 "Citizens Beyond the Old Seals"
 HSM_VER_CW_citizens_desc:0 "A subject of the neighbouring House is no longer a foreigner, yet the clerk still demands a special fee. The old courts disagree over inheritance, debt and the right to practise a trade. One shared coat of arms is not enough: residents need dependable protection on both sides of the former border."
 HSM_VER_CW_housing:0 "Homes Beyond the Former Border"
 HSM_VER_CW_housing_desc:0 "Hired workers sleep in workshop annexes while empty estate houses stand boarded up for years. Municipal builders will receive contracts for homes, wells and drains. The return to ordinary life must reach beyond the main square."
 HSM_VER_CW_clinics:0 "Treatment Without a Ducal Certificate"
 HSM_VER_CW_clinics_desc:0 "Patients are asked where they came from, then sent to another district for a certificate. Physicians propose common sanitary rules, recognition of training and a shared supply list for rural clinics. Disease never respected the borders, even when the dukes did."
 HSM_VER_CW_market_roads:0 "Roads to a Common Market"
 HSM_VER_CW_market_roads_desc:0 "Roads once led to checkpoints and garrisons rather than neighbouring towns. Carriers now mark damaged bridges, dangerous slopes and needless detours on a single map. Their markings will become the first common road plan."
 HSM_VER_CW_machine_shops:0 "Machine Shops Instead of Tollhouses"
 HSM_VER_CW_machine_shops_desc:0 "The old customs warehouses stand beside useful roads but hold little beyond broken barriers. Craftsgriffons propose machine tools and repair shops. Orders will connect suppliers from different districts, turning the removal of the border into the beginning of new work."
 HSM_VER_CW_standards:0 "One Drawing for Different Workshops"
 HSM_VER_CW_standards_desc:0 "A bolt made in one district will not fit a nut from another. Masters regard their own measurements as part of their craft's dignity. A common standards office will leave their makers' marks intact, but insist that parts fit without a file."
 HSM_VER_CW_evening_classes:0 "Evening Classes"
 HSM_VER_CW_evening_classes_desc:0 "A new school will not help an adult read a contract if its doors open only during working hours. Teachers and workshops will arrange evening lessons. Their pupils have tired claws and too much experience to be ashamed of their first page."
 HSM_VER_CW_institute:0 "The Verenian Institute of Applied Studies"
 HSM_VER_CW_institute_desc:0 "Each former capital has its teachers, workshops and collection of instruments. Separately they request the same books and fail to finish the same experiments. A shared institute will begin with exchanged equipment, open admissions and the right to argue with a colleague from another House."
 HSM_VER_CW_common_service:0 "Serving One Country"
 HSM_VER_CW_common_service_desc:0 "Regimental rolls still remember whom the militia once assembled to fight. Common service requires more than a new cockade: shared appointments, training and accountability to civil government. Officers must decide what will sustain the defence of a small country."
 HSM_VER_CW_reserve_depots:0 "Reserves of the Common Country"
 HSM_VER_CW_reserve_depots_desc:0 "The old arsenals were designed for a short campaign over a neighbouring hill. The common country needs repair stocks, dispersed depots and workshops able to replace a lost delivery. An order cannot make us a great power, but we need not depend on a single road."
 HSM_VER_CW_public_accounts:0 "An Account to All Verenia"
 HSM_VER_CW_public_accounts_desc:0 "The first common projects are complete. Not every letter to the capital is grateful: contractors dispute prices, communities dispute priorities and treasurers dispute missing receipts. A published account must name both the promises fulfilled and those paid for work left undone."
 HSM_VER_CW_ordinary_country:0 "The Country the Morning After"
 HSM_VER_CW_ordinary_country_desc:0 "Unification will be remembered for its speeches and raised flag. Its durability will be decided later: whether medicine reaches a village, a diploma is recognised in the next town, and a court hears a complaint against its own official. We need a country that keeps working when the celebration is over."
 HSM_VER_CW_ready_tt:0 "Verenia is independent, at peace and controls its central homeland; the common institutions are established."
 HSM_VER_CW_budget_agreed_tt:0 "The first common budget has been agreed."
 HSM_VER_CW_citizens_agreed_tt:0 "Common civil guarantees have been agreed."
 HSM_VER_CW_service_agreed_tt:0 "The organisation of common military service has been agreed."
 HSM_VER_CW_civilian_space_tt:0 "A fully controlled core state has space for two civilian factories."
 HSM_VER_CW_military_space_tt:0 "A fully controlled core state has space for a military factory."
 HSM_VER_CW_treasury:0 "The Common Treasury"
 HSM_VER_CW_treasury_desc:0 "The common treasury directs funds towards works needed by the whole country, rather than only the former owner of a road."
 HSM_VER_CW_district_credit:0 "District Credit Associations"
 HSM_VER_CW_district_credit_desc:0 "Local associations finance workshops and suppliers under shared accounting rules."
 HSM_VER_CW_common_courts:0 "Common Civil Justice"
 HSM_VER_CW_common_courts_desc:0 "The same case is heard under the same law, regardless of the coat of arms above the courthouse."
 HSM_VER_CW_local_guarantees:0 "District Self-Government Guarantees"
 HSM_VER_CW_local_guarantees_desc:0 "Districts retain their institutions, but common civil rights take precedence over local custom."
 HSM_VER_CW_housing_service:0 "Municipal Housing and Water"
 HSM_VER_CW_housing_service_desc:0 "Towns and rural communities maintain housing, wells and drains under common sanitary rules."
 HSM_VER_CW_interchangeable_parts:0 "Interchangeable Parts"
 HSM_VER_CW_interchangeable_parts_desc:0 "Production drawings no longer cease to be useful beyond the workshop that made them."
 HSM_VER_CW_professional_service:0 "The Verenian Standing Army"
 HSM_VER_CW_professional_service_desc:0 "A common officer corps trains standing formations and maintains unified appointment rolls."
 HSM_VER_CW_territorial_service:0 "District Reserve Service"
 HSM_VER_CW_territorial_service_desc:0 "Reservists train near home, while shared depots and instructors connect the districts into a common defence system."
 HSM_VER_CW_accounts_office:0 "The Verenian Audit Office"
 HSM_VER_CW_accounts_office_desc:0 "Auditing common expenditure no longer depends on the polite consent of the official who approved it."
 HSM_VER_CW_clinical_training:0 "Common Clinical Protocols"
 HSM_VER_CW_public_works:0 "Common Road Plan"
 HSM_VER_CW_precision_tools:0 "Production Standards Office"
 HSM_VER_CW_technical_training:0 "Evening Technical Education"
 HSM_VER_CW_joint_research:0 "Verenian Applied Research"
 HSM_VER_CW_reserve_supply:0 "Dispersed Depots"
 hsm_ver_cw.1.t:0 "Whose Signature on the Budget?"
 hsm_ver_cw.1.d:0 "The first common budget arrived in three bindings. The figures differed. Each treasurer included repairs to his own road and hoped a neighbour would pay for the bridge between them. When the clerk laid the books side by side, the bridge had been promised less than two office carriages.\n\nCommunity delegates demand a treasury able to move funds between districts. Workshop owners object that the capital will receive the money before learning what their towns need. They propose credit associations under common supervision. Neither arrangement will end disputes; it will determine where they are settled."
 hsm_ver_cw.1.a:0 "Common revenue must serve a common plan."
 hsm_ver_cw.1.b:0 "Let credit begin with the local workshop."
 hsm_ver_cw.2.t:0 "The Case of Two Certificates"
 hsm_ver_cw.2.d:0 "A widow came to court with two certificates for the same house. Her home district recognised her inheritance; under her husband's former law, she needed the consent of a relative who now lived across the street. The old border had run along that street.\n\nThe judges resolved her case, but similar petitions filled the registry. Some propose a common civil code and appeal procedure. Others would retain district courts while requiring them to recognise common rights and neighbouring judgements. First, they must accept that no resident becomes a foreigner by crossing a bridge."
 hsm_ver_cw.2.d.military:0 "A petition from an incorporated district says nothing about the old dynasty. Its author asks why he pays taxes as a Verenian but must sue an army supplier as a foreigner. His neighbours have signed below, including families of our soldiers.\n\nVictory gave the government authority, not an answer. A common civil code would bring the districts under shared courts. Protected self-government would retain local institutions while binding them to common rights. Either course means abandoning the convenient belief that whatever suits the victor is lawful."
 hsm_ver_cw.2.a:0 "One civil law and a common court."
 hsm_ver_cw.2.b:0 "Common rights, district institutions."
 hsm_ver_cw.3.t:0 "No Certificate of Origin"
 hsm_ver_cw.3.d:0 "The first patient at the new rural clinic was a laundress who had brought her child from a neighbouring district. She had prepared a certificate and small coins for the foreign admission fee. The medical assistant told her to put both away: the fee had been abolished, and a birth certificate would not lower a fever.\n\nThat evening he reported that dressings had arrived on time, but the journey from the outlying villages was still too long. In the capital, an editor tried to remove that line from the celebratory notice. The physician insisted that it stay."
 hsm_ver_cw.3.a:0 "The next clinic will be closer to them."
 hsm_ver_cw.4.t:0 "An Instrument Without an Owner"
 hsm_ver_cw.4.d:0 "The institute's first laboratory argued over a brass measuring instrument. One district had paid for it, another delivered it, and an apprentice from a third workshop repaired it. A proposed plaque listed every benefactor, leaving no room for the instrument's name.\n\nThe professor removed the plaque and set an experiment log beside it. On the first page he wrote the names of those responsible for the measurements. The plaque eventually returned above the entrance, where it obstructed nobody. Common science began not with a discovery, but with permission to use somebody else's instrument."
 hsm_ver_cw.4.a:0 "Let them argue over results, not seals."
 hsm_ver_cw.5.t:0 "After the Last Separate Roll Call"
 hsm_ver_cw.5.d:0 "At a joint exercise an instructor called the reservists from old regimental rolls. Half the formation turned the wrong way: identical commands meant different movements. It was amusing until a supply wagon blocked the medical cart.\n\nThe staff proposes a standing army with shared training and appointments. District delegates prefer a trained reserve that does not remove the best workers from their workshops all year. Both agree that the next roll call must assemble units of one country, not neighbours bound by a temporary agreement."
 hsm_ver_cw.5.a:0 "A common standing corps."
 hsm_ver_cw.5.b:0 "A trained district reserve."
 hsm_ver_cw.6.t:0 "The Accounts After the Bridge Opening"
 hsm_ver_cw.6.d.treasury:0 "The road audit found two payments for the same stone. The contractor claimed the second invoice covered delivery; the carrier produced his own receipt, already paid. An official asked that the first common construction project not be marred by a trial.\n\nThe audit office referred the case to court and published the corrected account. The common treasury had proved capable not only of collecting revenue, but of questioning its own administrators. In his next letter a village elder enclosed a complaint without the customary apology for causing trouble."
 hsm_ver_cw.6.d.districts:0 "The first credit association reported a new workshop and regular repayments. The second had spent years lending to its chairman's relatives against an empty barn. Before unification those stories would have stayed in separate ledgers. Now the accounts lay on one desk.\n\nCommon supervision required the guarantors to be named and money paid for unfinished work to be returned. Associations that had kept proper accounts continued lending. District autonomy survived; the habit of calling every question outside interference did not."
 hsm_ver_cw.6.a:0 "Publish the whole account."
 hsm_ver_cw.7.t:0 "A Morning Without Ceremonies"
 hsm_ver_cw.7.d:0 "The old border booth was not demolished at once. Road workers first stored tools inside it; later a trader sheltered his cart beneath its roof. A stop now stands there, and schoolchildren argue over the bench.\n\nThe government still disputes expenditure and appointments. Complaints have not disappeared, nor has construction made every village equally prosperous. Yet a letter from the next town is no longer foreign, a diploma need not be recognised at every bridge, and an official cannot send a petitioner to a border that no longer exists.\n\nVerenia has survived more than its founding day. It has learned how to meet the next."
 hsm_ver_cw.7.d.three:0 "The common registry keeps three old seals. Each once stopped a convoy, invalidated a neighbour's certificate or demanded another toll. Now they authenticate museum inventories. A new complaint is registered with one seal, a much less ceremonial act than proclaiming unity.\n\nAll three Houses left the country workshops, habits and old grievances. The common institutions have not made their inhabitants forget where they came from. They have made origin less decisive in where someone may study, receive treatment or seek justice.\n\nThere will be no new celebration tomorrow. Schools, workshops and public offices will open. That was the point."
 hsm_ver_cw.7.a:0 "And still, it is our country."

