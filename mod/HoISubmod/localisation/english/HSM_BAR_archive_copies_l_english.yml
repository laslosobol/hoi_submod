l_english:
 # Historical editions of the same dated evidence; base document keys remain the circulation defaults.
 # Distribution marks name original recipients. They do not grant reader clearance.
 HSM_BAR_archive_copy_1:0 "Circulation copy"
 HSM_BAR_archive_copy_2:0 "Restricted copy"
 HSM_BAR_archive_copy_3:0 "Sealed file"
 HSM_BAR_archive_copy_1_tt:0 "S.C.P. / CIRCULATION\nField teams; works offices. Abridged text. Enclosures listed separately."
 HSM_BAR_archive_copy_2_tt:0 "S.C.P. / RESTRICTED DISTRIBUTION\nInvestigating staff; medical section. Corrected passages and marginal notes retained."
 HSM_BAR_archive_copy_3_tt:0 "S.C.P. / SEPARATE FILE\nDocument signatories; keepers of sealed enclosures. Gaps in the leaf numbering. Attachments missing."
 HSM_BAR_archive_rock_intake_restricted:0 "TESTIMONY 6 / physician's duplicate\nThe phrase «surface displacement» in the travelling abstract replaces the mason's statement that the wall yielded and then closed over the chisel mark. Marta Krzemien has restored that sequence here. He brought no fragment and would not return for his tools.\nName: £HSM_BAR_redact_long£. His foreleg and hammer had the same cloth around them. The location within the temple is £HSM_BAR_redact_short£.\nHe asked whether the Republic would make him finish the excavation. The interview gives no answer from the wall, and no assurance from the Republic."
 HSM_BAR_archive_rock_intake_sealed:0 "ORIGINAL INTERVIEW / retained with the corrections\nThe mason's refusal was reduced to «interruption of excavation» in the dispatch. In the fuller record it follows his account of a cut closing in stone beneath Asinti's temple. He left his tools there. No fragment accompanied the statement.\nMarta's notation protects £HSM_BAR_redact_long£ at his request; the identifying details remain £HSM_BAR_redact_short£.\n£HSM_BAR_redact_cut£ §gAddress leaf absent from this duplicate.§!\nThe foreleg and the abandoned hammer were wrapped in the same cloth. Marta kept the question about being sent back at the foot of the statement. The space for the commission's answer is empty."
 HSM_BAR_archive_rock_field_restricted:0 "WRONA / marked survey duplicate\nThe works abstract's «local settling» leaves out the useful distinction: pressure at one mark produced movement under the next. The team took loose grains from the existing cut and opened no passage. The marks must survive copying. Survey reference: £HSM_BAR_redact_short£.\nOlcha recognised a sign on the mason's temple plan and crossed it out before returning the sheet.\n£HSM_BAR_redact_cut£ §gRecognised sign withheld; original kept separately.§!\nWrona's note beside the correction: «Return the explanation with the plan.» The envelope contains the crossed-out sheet. There is no accompanying answer from Olcha."
 HSM_BAR_archive_rock_field_sealed:0 "PLAN ENVELOPE / Olcha's correction retained\nThe sign beneath Olcha's stroke is £HSM_BAR_redact_long£. The circulation drawing omits it. The works abstract reads «local settling»; the marked survey reads: contact at one mark, movement beneath its neighbour.\nSample reference: £HSM_BAR_redact_short£. Loose grains came from the old cut; no new opening was made.\n£HSM_BAR_redact_cut£ §gPlan fragment unavailable in this duplicate.§!\nOlcha returned the plan with the sign crossed out. The envelope still bears «SEPARATE CLEARANCE». Wrona's field sheet ends with the grains taken from the old cut; the explanation requested beside the correction is missing."
 HSM_BAR_archive_rock_study_restricted:0 "SEWERYN OLCHA / laboratory duplicate\nThe works summary's «handling difficulty» means that detached grains still respond to pressure outside the temple. The sealed control remains still. Distance from the sanctuary cannot therefore be listed as a safeguard. Recorded pressure: £HSM_BAR_redact_short£.\nKrzemien's well support remains a proposal, deferred until the limit is repeated with a second sample. The comparative note asks whether the material resembles BR-002.\n£HSM_BAR_redact_cut£ §gComparative working sheet retained separately.§!\nThe question mark was omitted with the reference in the works copy. Restore both whenever that reference is restored."
 HSM_BAR_archive_rock_study_sealed:0 "LABORATORY ORIGINAL / support request attached\nKrzemien wants the village well supported. Olcha's surviving measurements, £HSM_BAR_redact_short£, describe responsive grains outside the temple and an unmoving sealed control. His demand for a second sample still stands.\nThe travelling summary suppresses the BR-002 comparison. Here its question mark remains; the resemblance has not become a shared origin.\n£HSM_BAR_redact_cut£ §gComparative leaf absent from this set.§!\nWell address: £HSM_BAR_redact_long£. Krzemien's support request remains beside the pressure table. Across its signature line Olcha has written: «Second sample.» The space for the repeated measurement is still blank."
 HSM_BAR_archive_entity_intake_restricted:0 "WITNESS SHEET / medical duplicate\n«Difficulty counting» is the dispatch clerk's wording. The witness said there was more than one speaker below; she did not supply a number. Asked again, she wrote the same word in different sizes and refused to pronounce it.\nThe word is £HSM_BAR_redact_short£. Identity: £HSM_BAR_redact_long£. The interpreter's rendering is enclosed separately, beside the witness's handwritten sheet.\nMarta Krzemien has written «only with her agreement» beside the request for another interview. The religious heading remains unfilled."
 HSM_BAR_archive_entity_intake_sealed:0 "SEALED TESTIMONY / handwriting retained\nThe repeated word, £HSM_BAR_redact_short£, occupies the fresh sheet requested by the witness. Letter size varies; the record gives no key to those variations. Her statement was «more than one», softened in circulation to difficulty counting.\nThe interpreter's rendering remains £HSM_BAR_redact_long£. The space for a religious name in the heading is empty.\n£HSM_BAR_redact_cut£ §gIdentifying interview particulars withdrawn.§!\nMarta left the refusal to read aloud in the statement. Beside the next-interview line: «Only with her agreement.» The witness's sheet remains folded inside; the interpreter's enclosure is listed, but its text is withheld."
 HSM_BAR_archive_entity_field_restricted:0 "CONTACT LOG / station duplicate\nThe departure was not scheduled. That phrase was inserted in the dispatch abstract where the log records Olcha ordering both teams away after the third signal changed the response. The earlier responses described in the two station logs had matched. Signal wording: £HSM_BAR_redact_long£.\nThe Pentarchy transcript breaks similarly. An annotation pressed through the following two sheets; its wording is £HSM_BAR_redact_short£.\n£HSM_BAR_redact_cut£ §gAnswer transcript held outside this copy.§!\nWrona's comparison sheet carries the reference BR-015. The two station logs are kept separately; both break off at the withdrawal order. The response enclosure has its own number, still legible beneath the removal mark."
 HSM_BAR_archive_entity_field_sealed:0 "COMPARISON FOLDER / contact interruption\nThe Pentarchy author's «not one» was suppressed in circulation. The words pressed through two following leaves; there they survive without ink. The same abstract calls the later withdrawal scheduled. The written station logs instead place Olcha's order after the third signal, £HSM_BAR_redact_long£, changed the common response.\nStation identities: £HSM_BAR_redact_short£.\n£HSM_BAR_redact_cut£ §gResponse text absent from this sealed duplicate.§!\nWrona kept the old leaves beside the two station logs. The pressure marks continue onto the second sheet after the ink has ended. The answer enclosure is missing; its number remains between the comparison and the withdrawal order."
 HSM_BAR_archive_entity_study_restricted:0 "CONTACT PRECAUTIONS / medical copy\nThe supply summary omits Olcha's actual objection: one voice cannot give consent for the whole. The response differs from the fixed delay in the ventilation control; it is distinguishable from returning sound. The identities of all who answer remain unresolved. Listener: £HSM_BAR_redact_short£.\nKrzemien retained the omitted question under £HSM_BAR_redact_long£ because it frightened the listener. The circumstances are enclosed for medical review.\nNo power extraction is authorised. Olcha's ruling ends with the question of consent. Krzemien's medical reference follows it on the next line; that enclosure is carried under a different seal."
 HSM_BAR_archive_entity_study_sealed:0 "OLCHA / unabridged ruling, incomplete attachments\nWe can recognise a reply without knowing every participant. The ventilation control returns sound at a fixed delay. Here we received an answer, but could not distinguish all who answered. The supply abstract replaces these lines with «unsuitable agreement».\nThe listener is £HSM_BAR_redact_long£; the omitted question remains £HSM_BAR_redact_short£.\n£HSM_BAR_redact_cut£ §gMedical transcript retained in another folder.§!\nMarta's note: «We need to know what frightened the listener.» Below it, Olcha has retained the full ruling: «No promise by one voice is consent from the whole.» The extraction authorisation remains unsigned."
 HSM_BAR_archive_reactor_intake_restricted:0 "ENGINEERING COVER / Olcha's duplicate\nThe marginal sentence concealed as «prior site conditions» reads: «There was already something here.» It stands beside the first load table. The chamber has a name, £HSM_BAR_redact_short£; the machine is called only the installation.\nConstruction papers must be separated from contact papers. The other seal is £HSM_BAR_redact_long£. The reference points to the contact enclosure.\nThe construction file ends here without a completion certificate. Olcha's request for the contact papers is still enclosed. The sentence beside the load table has no corresponding entry in the building schedule."
 HSM_BAR_archive_reactor_intake_sealed:0 "RECOVERED COVER / annotation preserved\n«There was already something here» has no signed explanation. The travelling abstract suppresses its wording under site conditions. This duplicate retains it beside the first load table, but the writer's identity is £HSM_BAR_redact_long£.\nThe chamber name is £HSM_BAR_redact_short£.\n£HSM_BAR_redact_cut£ §gCross-reference to the separately sealed contact papers omitted.§!\nOlcha's covering request separates BUILDING from CONTACT. No inspection report accompanies either heading on this cover. The load table survives; the separately sealed papers do not. Beside the pencilled sentence, the space for an explanation is empty."
 HSM_BAR_archive_reactor_field_restricted:0 "JADWIGA WRONA / inspection duplicate\nThe installation was present at the survey. The bypass omitted from the clean cooling drawing was marked without operating the valves. The maintenance abstract labels the gap a drafting discrepancy. Valve reference: £HSM_BAR_redact_short£.\nThe old maintenance entry tells workers to leave before a load change. The evacuation interval survives at £HSM_BAR_redact_long£; the reason does not. The shift list remains £HSM_BAR_redact_short£.\nWrona's survey marks run along the bypass left out of the clean drawing. The evacuation entry is copied underneath. Its interval has survived more carefully than the explanation that should precede it."
 HSM_BAR_archive_reactor_field_sealed:0 "DRAWING COMPARISON / marked original\nThe bypass is missing from the clean copy, present on the recovered cooling drawing, and marked by the inspection team. Wrona recorded no operation of its valves. Their references remain £HSM_BAR_redact_long£.\nThe maintenance order preserves an evacuation interval, £HSM_BAR_redact_short£, before a load change. No surviving reason explains it.\n£HSM_BAR_redact_cut£ §gShift identities withheld from this duplicate.§!\n«Drafting discrepancy» appears only on the circulation abstract. Wrona's marked drawing preserves the bypass. The evacuation interval remains beside a gap where the reason should be. No restart appears in the inspection log."
 HSM_BAR_archive_reactor_study_restricted:0 "STOP TABLE / engineering duplicate\nThe circulation extract's «scheduling allowance» conceals an unsafe sequence: heat removal fails before the recorded containment boundary gives way. Waiting for the boundary alarm leaves too little margin. Olcha's revised stop settings are £HSM_BAR_redact_long£.\nKrzemien insists that the earlier evacuation order accompany the table. It shows that someone acted before a load change, although their explanation is missing. Author: £HSM_BAR_redact_short£.\nThe old order and the revised table remain fastened together. Krzemien's note: «Keep the evacuation entry beside this.» One requires departure before the load change; the other places the stop before the boundary alarm."
 HSM_BAR_archive_reactor_study_sealed:0 "SHUTDOWN REVIEW / retained objection\nKrzemien's retained note: «Whoever wrote the evacuation entry understood at least one danger the final design concealed.» The word «concealed» is underlined. Identity: £HSM_BAR_redact_short£.\nHeat removal fails before the containment boundary. Olcha's stop table addresses that sequence; its settings remain £HSM_BAR_redact_long£.\n£HSM_BAR_redact_cut£ §gOperating particulars withheld from the duplicate.§!\nThe engineering original retains the failure order beneath the circulation phrase «scheduling allowance». Krzemien has kept the old evacuation entry beside it. The signature space beneath the restart proposal is empty."
 HSM_BAR_archive_crown_intake_restricted:0 "INTERCEPTED LETTER / Wrona's duplicate\nThe circulation heading «question of loyalty» conceals the writer's question: can loyalty be measured by the number of subjects who refuse an instruction? It follows an account of a crown found in a cave. Wrona underlined that change of subject.\nSender: £HSM_BAR_redact_long£. Discovery address: £HSM_BAR_redact_short£. The finder and current bearer have yet to be established before any approach.\nOther locations remain in other envelopes. Here the cave account ends just above Wrona's underline. The next paragraph asks about disobedient subjects; no names or count accompany the question."
 HSM_BAR_archive_crown_intake_sealed:0 "LETTER ORIGINAL / separate discovery envelope\nWrona's underline begins where the writer leaves the cave and begins counting disobedient subjects. The travelling abstract retains loyalty and removes the proposed measure. That deletion makes the paragraph sound like a different sort of enquiry.\nThe sender is £HSM_BAR_redact_long£; the intended correspondent is £HSM_BAR_redact_short£.\n£HSM_BAR_redact_cut£ §gReturn address removed from this duplicate.§!\nThe lines for finder and present bearer remain empty. Wrona's underlining runs from the cave account into the question about disobedience. Other discovery envelopes are listed separately; none is attached to this letter."
 HSM_BAR_archive_crown_field_restricted:0 "RETRIEVAL FILE / witness comparison\n«Reliable compliance» is the circulation editor's replacement for the witnesses' accounts of influence. Those accounts describe limits of distance and number. Museum and sealing records have been compared with reports of use; the handover sequence is £HSM_BAR_redact_long£.\nWrona disputed the word cure in a witness summary. The rest of her marginal objection is £HSM_BAR_redact_short£. The witness concerned is £HSM_BAR_redact_short£.\nNo order concerning the bearer is attached. The inventory reference follows the museum and sealing entries through the comparison. Wrona's objection remains on the reverse, beneath the word the circulation editor preferred."
 HSM_BAR_archive_crown_field_sealed:0 "WRONA / possession record and objection\nThe museum entries, sealing records and use reports have been kept against their own dates. The circulation abstract suppresses the full possession sequence, £HSM_BAR_redact_long£, and removes Wrona's objection: «The temptation is how quickly witnesses begin calling obedience a cure.» Both omissions are editorial; neither repairs a missing link.\nSource identity: £HSM_BAR_redact_short£.\n£HSM_BAR_redact_cut£ §gHandover particulars withheld from this set.§!\nThe accounts retain limits of distance and number. Wrona's objection occupies the margin beside the witness comparison; the clinical wording is still readable underneath. The numbered instance record is enclosed. The order concerning its bearer is not."
 HSM_BAR_archive_crown_study_restricted:0 "EXPOSURE STUDY / clinical objection attached\nThe «clinical extension» declined in the circulation summary proposed tests on patients unable to consent. Krzemien forbids them. Applicant: £HSM_BAR_redact_long£. The rejected application remains attached under that name.\nNo researcher wore the isolated crown. Accounts and observations made outside the enclosure support a model limited by distance and number; its working figures are £HSM_BAR_redact_short£.\nThe specimen number is repeated on the observation sheets and the refused application. Krzemien has left the applicant's word «improvement» legible beneath her ruling. The refusal carries her signature."
 HSM_BAR_archive_crown_study_sealed:0 "KRZEMIEN / rejected application retained\nThe applicant, £HSM_BAR_redact_long£, called obedience improvement and proposed patients who could not consent. The circulation summary reduces this to a declined extension. Krzemien's refusal is written across the application.\n£HSM_BAR_redact_cut£ §gProposed exposure procedure withheld.§!\nNo researcher wore the specimen. Observations from outside the enclosure and witness accounts retain limits of distance and number, £HSM_BAR_redact_short£. The inventory number runs through those sheets and the rejected proposal. Krzemien's signature appears beneath the refusal. The proposed patient trial has no observation sheet: it was never carried out."
 HSM_BAR_archive_echo_intake_restricted:0 "WORKERS' STATEMENTS / medical duplicate\n«Communication difficulty» in the repair summary replaces two frightened accounts: a foreman heard an answer from a deserted shaft, and a younger worker heard his own words returned. They agree about the delay, not the wording. Names: £HSM_BAR_redact_short£; £HSM_BAR_redact_long£.\nWrona asked for the ventilation plan. It ends at a supposedly hollow wall; nobody's statement supplies what lies beyond it.\nKrzemien kept the refusal of the next shift with the testimony. The request for a ventilation plan lies above it. Wrona's restriction ends at the marked landing; the space for the shaft inspection is unfilled."
 HSM_BAR_archive_echo_intake_sealed:0 "INITIAL STATEMENTS / identities detached\nThe youngest worker's own words seemed to return from the shaft. The foreman's account instead calls the sound an answer. The timing agrees. This difference was compressed into «communication difficulty» in the travelling copy; neither original statement resolves it.\nWitnesses: £HSM_BAR_redact_long£; £HSM_BAR_redact_short£.\n£HSM_BAR_redact_cut£ §gPersonal employment particulars withheld.§!\nThe plan ends at the wall the workers call hollow. Wrona's request for a check is attached to the younger worker's refusal of the next shift. His absence and the foreman's account remain on separate sheets."
 HSM_BAR_archive_echo_field_restricted:0 "ACOUSTIC LOG / personal exchange retained\nThe whistle returned at the same interval as the question. In the side passage it came from behind the observer; a chamber omitted from the old plan accounted for the changed direction. Survey mark: £HSM_BAR_redact_short£.\nThe exchange removed from the repair copy concerns employment. The foreman asked whether the younger worker would lose his place. Krzemien's answer remains £HSM_BAR_redact_short£ in this duplicate. Name: £HSM_BAR_redact_long£.\nThe personal exchange remains behind the corrected ventilation drawing. The repair copy ends with measurements; this duplicate keeps the foreman's employment question and the place where Krzemien's answer has been masked."
 HSM_BAR_archive_echo_field_sealed:0 "WRONA / measurements with personal note\nThe repair copy removes the foreman's question after the whistle test. He had listened without speaking, then asked whether the younger worker would lose his place. Marta's answer is no. The names remain £HSM_BAR_redact_long£; the employment reference is £HSM_BAR_redact_short£.\nThe sound returned after the same delay and reached the side passage from behind. The missing chamber accounted for that direction.\n£HSM_BAR_redact_cut£ §gIdentifying details withheld; measurements retained.§!\nThe repair copy ends at the measurements. This sheet continues with the foreman's question and Marta's single-word answer. The corrected drawing is attached behind the exchange; both the old route and Wrona's correction are legible."
 HSM_BAR_archive_echo_study_restricted:0 "CLOSURE / witness protection copy\nThe unmarked chamber supplies an ordinary returning path. No independent voice was recorded. The statements are sealed to protect the workers, £HSM_BAR_redact_long£, while the corrected drawing goes to the repair crew.\nOlcha requested that the control procedure be available for comparison under £HSM_BAR_redact_short£. The destination is withheld on the routing slip.\nKrzemien's full repair instruction retains the rail: a fall can still kill. The notice about voices is crossed out on the repair copy; the railing remains in the list of required work."
 HSM_BAR_archive_echo_study_sealed:0 "CLOSED FILE / original instruction retained\nThe chamber explains the sound, the control supports that explanation, and the corrected drawing was sent for repairs. The circulation omissions concern witnesses, £HSM_BAR_redact_long£, and a cross-reference, £HSM_BAR_redact_short£.\n£HSM_BAR_redact_cut£ §gPersonal statements retained outside this set.§!\nOlcha's request: «Attach the control procedure to BR-003 for a separate comparison.» Marta's repair instruction follows: «Remove the warning about voices, not the rail.» The corrected drawing remains attached. The closure signature covers this shaft's acoustic inquiry; the rail is still on the works list."
 HSM_BAR_archive_marsh_intake_restricted:0 "TRAVELLER'S STATEMENT / earliest wording retained\nThe first account records a light and a lost pack. The figure with a lamp appears by morning. The circulation phrase «fuller recollection» is an editorial choice; Wrona requested the corrections precisely because the change is not explained.\nWitness: £HSM_BAR_redact_short£. The correspondent offering water and sediment lives at £HSM_BAR_redact_long£. The offer has not yet supplied examined material.\nBoth versions record the lost pack. Wrona has asked for the first sheet with its corrections intact. The correspondent's offer of water and sediment is enclosed; the sample receipt line is still empty."
 HSM_BAR_archive_marsh_intake_sealed:0 "RIVERLAND ENVELOPE / uncorrected sequence\nThe later figure was not present in the traveller's earliest statement. The circulation copy's «fuller recollection» conceals this uncertainty without resolving it. Wrona wants the first sheet and its corrections kept together. Sender: £HSM_BAR_redact_long£.\n£HSM_BAR_redact_cut£ §gDirections to the correspondent's home withheld.§!\nThe offered water and sediment would come from £HSM_BAR_redact_short£. No jars have been received with these papers. The first account puts the lost pack after the traveller left the road; the lamp bearer appears on the later sheet. Wrona's request for the uncorrected statement is still enclosed."
 HSM_BAR_archive_marsh_field_restricted:0 "SAMPLE RECEIPT / carrier's statement retained\nThe «handling preference» in the circulation receipt was fear: the carrier had been told a jar contained a spirit and asked that it stay closed while he was present. Name: £HSM_BAR_redact_short£. Krzemien entered the request beside the carrier's name.\nWater and sediment arrived in separate marked jars. The labels matched the correspondent's weather notes, filed under £HSM_BAR_redact_long£. No figure was found in either.\nThe supplier's receipt lists water and sediment separately. Krzemien kept the carrier's request behind it, with the weather notes and jar labels. The receipt bears the purchase stamp and the sample references."
 HSM_BAR_archive_marsh_field_sealed:0 "KRZEMIEN / receipt with carrier's account\nThe carrier's request survives here: do not open the jar in his presence. Someone had described its contents as a spirit. The circulation receipt recasts the request as a preference.\nCarrier: £HSM_BAR_redact_short£. Supplier address: £HSM_BAR_redact_long£.\n£HSM_BAR_redact_cut£ §gPersonal delivery particulars withdrawn.§!\nThe separately marked water and sediment were matched to the weather notes. No figure appeared in either jar. The purchase receipt is enclosed beneath the carrier's statement. Krzemien retained his request in full, including the words «while I am in the room»."
 HSM_BAR_archive_marsh_study_restricted:0 "CONTROLLED TRIAL / settlement instruction draft\nAn ordinary chemical reaction reproduced the light under the recorded conditions and ceased when they changed. No migrating agent was detected. The detailed conditions, £HSM_BAR_redact_long£, were left out of the settlement circular so the practical instructions would not become a recipe for repeating the trial.\nKrzemien struck out «Village superstition». The witness is £HSM_BAR_redact_short£. His lost pack belongs to the account even after the glow is explained.\nThe storage and clean-water instructions went into the settlement copy. The trial conditions stayed on the laboratory leaf. Krzemien's stroke passes through the proposed heading; the account of the lost pack underneath is untouched."
 HSM_BAR_archive_marsh_study_sealed:0 "LABORATORY RECORD / rejected heading attached\nThe light stopped when the recorded conditions changed. It was reproduced as an ordinary chemical reaction; no migrating agent was detected. Conditions remain £HSM_BAR_redact_long£ in this duplicate.\n£HSM_BAR_redact_cut£ §gExperimental particulars retained on a separate leaf.§!\nThe rejected heading «Village superstition» remains beneath Krzemien's stroke. Traveller: £HSM_BAR_redact_short£. Her note reads: «He lost his pack in dangerous ground.» The chemical finding is signed below the trial record. Storage and clean-water instructions are attached to the settlement copy; the crossed-out draft stays here."
