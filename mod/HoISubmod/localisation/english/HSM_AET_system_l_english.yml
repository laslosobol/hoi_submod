 HSM_AET_GRI_oath:0 "The Crown’s Own Signature"
 HSM_AET_GRI_oath_desc:0 "The regent’s seal has been returned. Grover must now put his own name to the obligations that protected him. The old offices demand their privileges back; the charter instead gives each ministry a defined task and a public account to answer for."
 HSM_AET_GRI_towns:0 "Reopen the Town Workshops"
 HSM_AET_GRI_towns_desc:0 "Orders for roofs, tools and farm machinery will give the surviving workshops a future beyond military requisitions."
 HSM_AET_GRI_army:0 "Service under the Charter"
 HSM_AET_GRI_army_desc:0 "Officers will receive commissions with defined responsibilities, regular pay and civilian oversight."
 HSM_AET_GRI_schools:0 "A School in Every District"
 HSM_AET_GRI_schools_desc:0 "Teachers who once sought refuge can now return with books, colleagues and the means to open their classrooms."
 HSM_AET_GRI_debts:0 "Settle the Court’s Accounts"
 HSM_AET_GRI_debts_desc:0 "Shelter, salaries and provisions were paid for long before the palace reopened. The creditors have kept their receipts. A sovereign government must distinguish debts it owes from favours that creditors expect it to continue."
 HSM_AET_GRI_settlement:0 "The Ordinary Work of Peace"
 HSM_AET_GRI_settlement_desc:0 "The courts have reopened and the ministers have learned to disagree without calling out the army. These quieter victories will hold the state together."
 HSM_AET_system.1.t:0 "The Mandate Has Changed"
 HSM_AET_system.1.d:0 "The circumstances that sustained the regency no longer hold. Its temporary territorial privileges have ended. The household must be located and the lands must receive a lawful answer before the old work can resume."
 HSM_AET_system.1.a:0 "Review the obligations that remain."
 HSM_AET_system.2.t:0 "A Familiar Signature"
 HSM_AET_system.2.d:0 "The count has signed another routine letter. Yet a clerk has placed it beside an older instruction and quietly asked for the register of appointments. Someone who remembers the promise behind that instruction will have to speak."
 HSM_AET_system.2.a:0 "Compare the letters."
 HSM_AET_system.3.t:0 "A Partner for the Western Compact"
 HSM_AET_system.3.d:0 "Greifwald has completed the restoration of an independent imperial government under Grover VI. Its representatives ask us to admit that government to our alliance. Their bilateral guarantees will remain even if we decline."
 HSM_AET_system.3.a:0 "Admit the restored Empire."
 HSM_AET_system.4.t:0 "The Keys of Griffenheim"
 HSM_AET_system.4.d:0 "The household has returned with the agreements made during its absence. Grover now holds the keys, but the papers on his desk record how many other lives made this return possible. His private tutors and advisers ask that petitions first pass through the chancery. He agrees to orderly hearings, provided the clerks preserve the petitioners’ own words beside their summaries."
 HSM_AET_system.4.a:0 "Begin the work of government."
 HSM_AET_system.5.t:0 "An Adult at the Council Table"
 HSM_AET_system.5.d:0 "The household can no longer govern Grover as a child. Preparations for the agreed transfer may continue, and war may delay its execution, but he now takes part in the council as an adult whose own consent matters."
 HSM_AET_system.5.a:0 "He must speak for himself."
 HSM_AET_system.6.t:0 "The Household Dossier"
 HSM_AET_system.6.a:0 "Enter the verified findings."
 HSM_AET_system.7.t:0 "Close the Mission?"
 HSM_AET_system.7.d:0 "The chancery has prepared the final account. Closing the mission will end the county’s political programme, although any guest already under its protection will retain that protection. The representatives may still leave the files open."
 HSM_AET_system.7.a:0 "Close the mission."
 HSM_AET_system.8.t:0 "An Oath without a Map"
 HSM_AET_system.8.d:0 "The ceremony’s last draft promises to restore every former imperial frontier. Grover strikes out the sentence. The officers who served under personal contracts want to know whether their commissions survive. They do, he answers, with their agreed pay and a new oath to the charter. One colonel asks for that answer in writing. Grover signs it before the ceremony begins."
 HSM_AET_system.8.a:0 "Promise what we can honour."
 HSM_AET_system.9.t:0 "The Creditors’ Audience"
 HSM_AET_system.9.d:0 "The lenders have brought their wartime agreements to the palace. Grover will honour documented debts, but personal favour will no longer exempt a creditor from the courts. The ministers begin negotiations over a public repayment schedule."
 HSM_AET_system.9.a:0 "No private contract stands above the law."
 HSM_AET_system.3.b:0 "Keep the existing alliance unchanged."
 HSM_AET_system.7.b:0 "Keep the files open."
 HSM_AET_system.6.dead:0 "Verified records confirm Grover’s death. The county cannot establish a guardianship over a vacant throne. A new agreement between the administered lands is required."
 HSM_AET_system.6.local:0 "The original imperial household is here under our protection. Its present circumstances permit a review of the mandate, subject to the status of the lands and government."
 HSM_AET_system.6.foreign:0 "Grover is alive in another country. His presence there gives Greifwald no authority over him or his household. The chancery records the confirmed address and closes the proposed transfer: our representatives cannot establish a local mandate by claiming someone else’s guest or sovereign."
 HSM_AET_system.6.unknown:0 "The surviving records do not establish a household we can lawfully receive. No verified notice confirms Grover’s death. The clerks will keep the case open rather than fill its gaps with a convenient story."
 HSM_AET_system.4.open.d:0 "The household returns with bundles of school registers and petitions collected during Grover’s visits to Greifwald’s towns. A teacher has marked a missing roof on the new district plan. When the chamberlain offers to put these papers away before the reception, Grover leaves the plan on his desk. The officials arriving to congratulate him can begin by finding a carpenter."
 HSM_AET_system.8.law.d:0 "An officer brings the charter that already governed his service in Greifwald. He asks whether returning to Griffenheim changes his oath. Grover places the same wording in the imperial commission: the ministry authorises expenditure, the courts hear complaints and rank grants no exemption. He also removes the promise to recover every former frontier. The officer signs a commission whose limits he recognises."
 HSM_AET_system.8.law_trimmel.d:0 "The new commissions retain the civilian oversight established in Greifwald. One minister objects to citing a charter once signed by Trimmel. Grover asks which provision allowed that ruler to be questioned, exposed and bound to his own name. The minister taps the hearing clause. It remains in the final text, beside the limits on military command. The oath promises lawful government of these lands, not the recovery of every former frontier."
 HSM_AET_system.8.contract_trimmel.d:0 "Officers who once relied on personal contracts demand written guarantees before accepting civilian supervision. A minister recalls the hearing that made Trimmel sign under his own name: promises survived only when someone could enforce them. Grover offers regular pay, a right of appeal and commissions governed by the charter. The officers keep their livelihoods; the crown gains an army whose terms of service are public. The promise of unlimited reconquest is struck from the oath."
 HSM_AET_system.9.protected.d:0 "The financier arrives with his receipts and reminds the ministers how the earlier complaint against him was set aside. He expects that protection to continue at the new palace. Grover recognises the debt, then asks the clerk to bring back the unanswered complaint. The exemption was never written down; he refuses to insert it into the public repayment agreement now. Breaking with the old favour delays the settlement and angers its beneficiary, but the court accepts the complaint before the creditors leave."
 HSM_AET_system.9.judged.d:0 "The creditors find a copy of the Greifwald judgement beside the repayment schedule. One asks whether returning to the palace has set that ruling aside. Grover sends the question to the same public court that must examine every disputed receipt. The judgement stands; legitimate debts will be paid without restoring the privileges it removed. This time the clerk need not wait for permission to register a complaint."
