l_english:
 HSM_AET_compact:0 "The Western Compact"
 HSM_AET_compact_desc:0 "The county has accepted obligations that reach beyond its borders. Schools, courts and the public accounts must keep the promises made in its name."
 HSM_AET_civic_council:0 "Council of the Compact"
 HSM_AET_imperial_compact:0 "The Charter of Restoration"
 HSM_AET_imperial_compact_desc:0 "The returned crown rests upon obligations to the lands that sustained it."
 HSM_AET_imperial_settlement:0 "A Crown Bound by Its Word"
 HSM_AET_imperial_settlement_desc:0 "The institutions of peace have survived their first disagreements. The sovereign and his ministers now govern by the terms they once promised."
 HSM_AET_grover_desc:0 "Grover VI returns to Griffenheim with obligations freely undertaken in Greifwald. Behind the restored crown stand towns that sheltered his household, officials who argued over its accounts and soldiers expecting the government to honour their service. He has promised them a government answerable for what it asks of its people."
 HSM_AET_identity_pending_tt:0 "The unresolved crisis imposes §R−10%§! stability through the Western Compact and suspends legal ratification and the handover. Complete the investigation, hearing and final signature to lift it."
 HSM_AET_western_compact:0 "Western Defence Compact"
 HSM_AET_category:0 "Obligations of the County"
 HSM_AET_category_desc:0 "Couriers carry news of displaced households and unfinished agreements. The chancery can review a case when circumstances change, or close a mission that can no longer fulfil its purpose."
 HSM_AET_household_review:0 "Review the household dossier"
 HSM_AET_household_review_desc:0 "A new address, a verified witness or a changed government may alter what the county can undertake. The household deserves a current answer."
 HSM_AET_review_tt:0 "The county can act, and thirty days have passed since its last review."
 HSM_AET_review_effect_tt:0 "Verify Grover’s actual whereabouts. Recover his household from the dissolved imperial court only if Griffenheim is ours and no living country hosts him. A previously declined local mandate may be reconsidered."
 HSM_AET_end_mission:0 "Consider closing the mission"
 HSM_AET_end_mission_desc:0 "There are promises the county can no longer fulfil. Before closing the files, its representatives must decide whether to seek another opportunity or withdraw their mandate."
 HSM_AET_end_mission_tt:0 "The country is at peace and has no active regency or completed union."
 HSM_AET_close_tt:0 "Permanently close this campaign and remove its national modifier. Grover, if locally present, remains a protected private guest. No territory is transferred."
 HSM_AET_restored_government_tt:0 "Independent restored Herzland is governed by Grover VI."
 HSM_AET_alliance_accept_tt:0 "The restored Empire joins our existing faction."
