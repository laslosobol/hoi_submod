l_english:
 HSM_BAR_transition_republic:0 "The Republic after the Pentarchy"
 HSM_BAR_transition_republic_desc:0 "The Count leaves empty offices and a crowd that will no longer obey. A gathering of village representatives must turn the uprising's victory into a government that can survive the next winter."
 HSM_BAR_transition_councils:0 "Assemble the Village Councils"
 HSM_BAR_transition_councils_desc:0 "Michal Zawisza visits the settlements without a tax collector's guard. Each must choose not a new master but someone who will return home and answer to their neighbours."
 HSM_BAR_transition_relief:0 "Open the Relief Houses"
 HSM_BAR_transition_relief_desc:0 "Marta Krzemien opens wards in the former household offices. Among the wounded and starving are patients whose symptoms persist even after leaving the dangerous places."
 HSM_BAR_transition_survey:0 "Survey the Abandoned Fields"
 HSM_BAR_transition_survey_desc:0 "Not every displaced farmer can return. The boundary stones remain, but familiar paths sometimes lead elsewhere. Surveyors will start with fields the villagers still dare approach."
 HSM_BAR_transition_bread:0 "Sowing under the Republic"
 HSM_BAR_transition_bread_desc:0 "Political promises cannot replace seed and a working plough. Councils will receive tools and grain; disputed fields will be sown only after an arrangement with those living upon them."
 HSM_BAR_transition_patients:0 "Those Who Returned Changed"
 HSM_BAR_transition_patients_desc:0 "New patients arrive from settlements near the old mines. Marta asks that they not be called possessed. First she needs to learn where each has been."
 HSM_BAR_transition_cabinet:0 "The Sealed Study"
 HSM_BAR_transition_cabinet_desc:0 "The plate from the field leads to a locked room in the manor. Fire never reached its cabinet of laboratory notebooks. Seweryn Olcha recognises the lock rather too quickly."
 HSM_BAR_transition_descent:0 "Return to the Lower Workings"
 HSM_BAR_transition_descent_desc:0 "The recovered plan marks a chamber beneath the old mine. No worker has descended since the Count's last order. Wrona prepares a team; Olcha insists the hoist must never be stopped."
 HSM_BAR_transition_commission:0 "Behind the Commission's Door"
 HSM_BAR_transition_commission_desc:0 "After the team's return, Marta no longer brings every record to public meetings. Stopping the surviving experiments requires people willing to preserve their traces and answer for the consequences. Four meet after the wards close."
 HSM_BAR_republic_tree:0 "Barrad: The Transition"
 HSM_BAR_directorate_tree:0 "Barrad: The Buried Inheritance"
 HSM_BAR_directorate_world_tree:0 "Barrad: Beyond the Hearth"
 HSM_BAR_republic_recovery:0 "Returning the Land"
 HSM_BAR_republic_recovery_desc:0 "The Republic promised safe homes and fields fit to sow. Krzemien's commission investigates what the old maps cannot explain."
 HSM_BAR_public_survey:0 "Survey the Fields of Alder Ford"
 HSM_BAR_public_survey_desc:0 "Surveyors will examine abandoned fields and mark the places families must avoid until the work is complete."
 HSM_BAR_decode_records:0 "Decipher the Sealed Study's Notebooks"
 HSM_BAR_decode_records_desc:0 "Olcha has agreed to read the diagrams. Marta will be present; he has already tried to set some pages aside."
 HSM_BAR_first_descent:0 "Send the First Search Team"
 HSM_BAR_first_descent_desc:0 "Wrona will gather workers who know the old hoist. The task seems simple: find the chamber in the notebooks and return before dark."
 HSM_BAR_recover_science:0 "Reconstruct the Research Archive"
 HSM_BAR_recover_science_desc:0 "Marginal signatures and surviving drawings distinguish repeatable work from the magocrats' personal secrets. Research teams must verify the findings themselves."
 HSM_BAR_reclaim_fields:0 "Reclaim the First Fields"
 HSM_BAR_reclaim_fields_desc:0 "Observations of rock and vegetation identify a safe strip near Alder Ford. Work will proceed from the stream towards the old boundary stones."
 HSM_BAR_heal_homeland:0 "Complete the Land Recovery Programme"
 HSM_BAR_heal_homeland_desc:0 "River samples improved the water treatment, while the amulet and ward studies showed how to preserve recovered fields. Tested measures can now extend across Barrad's remaining controlled homeland."
 HSM_BAR_recovering_soil:0 "Land under Observation"
 HSM_BAR_recovering_soil_desc:0 "The first fields are habitable again, but dangers persist beyond the boundary markers."
 HSM_BAR_service_founded:0 "The Service for Containment and Preservation has been founded"
 HSM_BAR_republic_transition:0 "The republican transition is underway"
 HSM_BAR_public_survey_open:0 "The commission has authorized the land survey"
 HSM_BAR_survey_recorded:0 "The first survey found a laboratory's traces"
 HSM_BAR_cabinet_open:0 "The sealed study has been opened"
 HSM_BAR_records_decoded:0 "The preliminary notes have been deciphered"
 HSM_BAR_recovered_archives:0 "The Pentarchy's scientific archive has been recovered and assessed"
 HSM_BAR_first_descent_open:0 "The first expedition beneath the mine is prepared"
 HSM_BAR_first_descent_returned:0 "The first search team's report has arrived"
 HSM_BAR_first_incident_resolved:0 "The first expedition's emergency has been resolved"
 HSM_BAR_land_partly_healed:0 "The first fields have been reclaimed"
 HSM_BAR_land_healed:0 "The controlled homeland's recovery programme is complete"
 HSM_BAR_village_councils:0 "The village councils have assembled"
 HSM_BAR_relief_houses:0 "The relief houses are open"
 HSM_BAR_global_authorized:0 "Preparation of global normalization has been authorized"
 hsm_bar_republic.1.t:0 "The Square after the Fire"
 hsm_bar_republic.1.d:0 "The square still smells of smoke. Some want the manor fence for firewood; others demand the missing-person lists before the remaining papers burn. Captain Gasienica does not order them home. For the first time in years, the argument is not about obeying the Count, but about who may decide for everyone else.\n\nMichal Zawisza takes a desk in the former tax collector's office. He turns its sign blank-side out. By evening it reads Republic. Marta Krzemien receives patients next door. Beyond the square, the country still belongs to hunger, broken roads and whatever was left underground."
 hsm_bar_republic.1.a:0 "We must survive the first winter."
 hsm_bar_republic.2.t:0 "Beneath the Boundary Stone"
 hsm_bar_republic.2.d:0 "The surveyors from Alder Ford did not return for supper. Jadwiga Wrona found all three kneeling beside an old boundary stone, listening to the ground. One heard a wheel turning in his father's abandoned mill. Another heard his own breathing while holding his breath.\n\nWrona led them across the stream. The sound stopped. A detached grain lay wrapped in a handkerchief inside one surveyor's bag. Something beneath the cloth was slowly changing shape. A copper plate on the stone bore the number of one of the Count's laboratories."
 hsm_bar_republic.2.a:0 "Find that laboratory's journal."
 hsm_bar_republic.3.t:0 "A Familiar Hand"
 hsm_bar_republic.3.d:0 "Seweryn Olcha would not open the notebooks at first. Ambrosius had signed the first page; later entries changed to a smaller hand. Olcha said they belonged to an assistant long dead. Marta noticed him use the same unusual mark above an abbreviation.\n\nThe books contained more than methods of intervention. Among the crossed-out trials lay a plan for stopping one. Its last page was missing. A margin preserved a fragment: If the answer from below precedes your voice, do not..."
 hsm_bar_republic.3.a:0 "For now, we need him alive and at this desk."
 hsm_bar_republic.4.t:0 "The Third Voice"
 hsm_bar_republic.4.d:0 "The lower shaft answered in Marta's voice. Marta herself stood beside the hoist with a hoof pressed to her mouth. Wrona pulled the signal rope: two workers and a crate containing the Count's only surviving recorder remained below. The hoist could carry everyone if the crate stayed.\n\nOlcha watched the surface instrument. Its needle moved in time with the voice below. He asked for another minute. Wrona was already unfastening her safety loop to descend herself."
 hsm_bar_republic.4.a:0 "Leave the recorder. Bring up the workers."
 hsm_bar_republic.4.b:0 "One more reading, then straight up."
 hsm_bar_republic.5.t:0 "Four in the Closed Ward"
 hsm_bar_republic.5.d:0 "Zawisza believes Krzemien's commission investigates poisoned wells. That is what Marta signed this morning. In the closed ward that evening, four gather: a doctor, the Count's former assistant, a search commander and a silent mine keeper. Beyond the wall sleeps a worker who still answers questions before they are asked.\n\nThey agree not to return their finds to ordinary stores, or surrender the notebooks to those seeking a new weapon. Olcha writes S.C.P. on the first shared case file. Marta asks him first to write the names of those they promise to bring home."
 hsm_bar_republic.5.a:0 "Service for Containment and Preservation."
 hsm_bar_republic.6.t:0 "The First Bread"
 hsm_bar_republic.6.d:0 "Alder Ford grinds its own grain again. Wrona breaks a still-warm crust and notices Marta watching not the bread but the children beside the oven. In spring two could not leave home without coughing fits.\n\nBeyond the new boundary marker lies a strip of grey grass. The workers keep to the line established by the experiments. Further out, the same method fails. Olcha has found a foreign place name and an unfamiliar seal on the back of an old plan. Marta puts the sheet away as Zawisza approaches."
 hsm_bar_republic.6.a:0 "Find whoever placed that seal."
 hsm_bar_republic.7.t:0 "Open Windows"
 hsm_bar_republic.7.d:0 "The boards come off Alder Ford's school windows. Teacher Zosia brings the old register: some names must be moved to another page. Returning the land does not return everyone who lived upon it.\n\nA protective plate remains beneath the threshold, made from findings in Barrad and the Riverlands. It is inspected monthly. To Zawisza it is an engineering measure of reconstruction. To Marta it proves that some wonders must be preserved. Olcha stands at the open window for a long time before entering."
 hsm_bar_republic.7.a:0 "This was our first task."
 hsm_bar_republic.8.t:0 "Notebooks That Outlived Their Authors"
 hsm_bar_republic.8.d:0 "Olcha divides the surviving records into four piles. Asinti's tables are covered in corrections; parts of Leopold's drawings can be checked with ordinary instruments. In Viira's notes the observer becomes part of the experiment. Where Silver Star's work begins, Marta stops the reading and asks for a separate list of the dead.\n\nThe archivists have not recovered their teachers' voices. They have recovered enough evidence to argue with them. The first copies bear no coat of arms of the Count."
 hsm_bar_republic.8.a:0 "Continue, and preserve the names of the dead."
 hsm_bar_republic.9.t:0 "Who Owns the Field"
 hsm_bar_republic.9.d:0 "Zawisza has two maps of one field. The old map names a family expelled under the Count. The newer names another family forcibly settled there ten years ago. Both have brought their children. Both believe the Republic promised to return their home.\n\nGasienica refuses to settle it by garrison order. The village council can hear the claims before sowing, or the present residents can receive temporary cultivation rights without extinguishing the former owners' claim."
 hsm_bar_republic.9.a:0 "The council must hear both families."
 hsm_bar_republic.9.b:0 "Allow sowing until a final settlement."
 hsm_bar_republic.10.t:0 "A Patient from an Empty House"
 hsm_bar_republic.10.d:0 "Marta receives a foal brought from an abandoned house beside the mine. He gives the name of a grown worker who disappeared before his birth. His mother begs for silence: a neighbour has already suggested summoning those who recently killed the magocrats.\n\nMarta keeps the child in an ordinary ward. The commission's record says fever. In her private notebook, she leaves room for another diagnosis."
 hsm_bar_republic.10.a:0 "Close the ward to strangers, not his family."
