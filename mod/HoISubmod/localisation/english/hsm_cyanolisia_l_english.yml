 HSM_CYA_industrial_program_dynamic_modifier:0 "Cyanolisian Industrial Program"
 HSM_CYA_industrial_program_dynamic_modifier_desc:0 "Cyanolisia's factories, rails, workshops, and reconstruction boards are being folded into one long modernization program."
 HSM_CYA_industrial_program_dynamic_modifier_dummy_idea:0 "Cyanolisian Industrial Program"
 HSM_CYA_military_program_dynamic_modifier:0 "Cyanolisian Military Program"
 HSM_CYA_military_program_dynamic_modifier_desc:0 "The army is being reshaped through staff schools, frontier logistics, mobilization boards, and lessons brought home from conquest."
 HSM_CYA_military_program_dynamic_modifier_dummy_idea:0 "Cyanolisian Military Program"
 HSM_CYA_imperial_legitimacy_dynamic_modifier:0 "Imperial Legitimacy"
 HSM_CYA_imperial_legitimacy_dynamic_modifier_desc:0 "Cyanolisia's claim to rule Griffonia rests on courts, occupation offices, dynastic symbols, and the hard question of Grover VI."
 HSM_CYA_imperial_legitimacy_dynamic_modifier_dummy_idea:0 "Imperial Legitimacy"
