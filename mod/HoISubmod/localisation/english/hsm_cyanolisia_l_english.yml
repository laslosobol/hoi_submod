 HSM_CYA_industrial_program_dynamic_modifier:0 "Cyanolisian Industrial Program"
 HSM_CYA_industrial_program_dynamic_modifier_desc:0 "Port investors, provincial workshops, and state engineers now argue over one plan. Its strength lies in keeping the rails and factories working together, whether they serve the Countess' regency or Dawnclaw's campaigns."
 HSM_CYA_industrial_program_dynamic_modifier_dummy_idea:0 "Cyanolisian Industrial Program"
 HSM_CYA_military_program_dynamic_modifier:0 "Cyanolisian Military Program"
 HSM_CYA_military_program_dynamic_modifier_desc:0 "The army has outgrown its coastal garrisons. Staff schools and supply offices give it a common method; the court's struggle decides whose authority those methods will serve."
 HSM_CYA_military_program_dynamic_modifier_dummy_idea:0 "Cyanolisian Military Program"
 HSM_CYA_imperial_legitimacy_dynamic_modifier:0 "Imperial Legitimacy"
 HSM_CYA_imperial_legitimacy_dynamic_modifier_desc:0 "A captured capital cannot compel obedience by itself. Courts, provincial bargains, and Grover's name where it still carries weight give the claim substance; in occupied lands, predictable administration can quiet resistance and earn cooperation."
 HSM_CYA_imperial_legitimacy_dynamic_modifier_dummy_idea:0 "Imperial Legitimacy"
 HSM_CYA_exiled_imperial_strategist:0 "Exiled Imperial Strategist"
 HSM_CYA_all_evi_territory_owned_tt:0 "Own every historical territory of the Evi valley"
 HSM_CYA_all_asterion_territory_owned_tt:0 "Own every historical territory of Asterion"
 HSM_CYA_all_sicameon_territory_owned_tt:0 "Own every historical territory of Sicameon"
 HSM_CYA_imperial_administration_diplomacy:0 "Imperial Administration"
 HSM_CYA_imperial_administration_diplomacy_desc:0 "The provisional cabinet can seek protection from Griffenheim when the two countries share a border."
 HSM_CYA_enter_griffonian_imperial_alliance:0 "Join the Griffonian Empire's Alliance"
 HSM_CYA_enter_griffonian_imperial_alliance_desc:0 "Accept a place in the Empire's faction while its frontier touches ours."
 HSM_CYA_countess_union_mandate:0 "Mandate for a United Griffonia"
 HSM_CYA_countess_union_mandate_desc:0 "Taking Griffenheim fulfilled only the first part of Taillow's promise. The provincial courts, rail offices, and army face a harder task: bind the divided continent to the imperial crown. That mandate belongs to the state and will survive the transfer of government to Grover."
 HSM_CYA_countess_northern_charters:0 "Summon the Northern Governments"
 HSM_CYA_countess_northern_charters_desc:0 "The northern republics, clans and duchies will not disappear because Griffenheim has changed hands. Envoys will demand recognition of the imperial government; the general staff will prepare for those who refuse. Their courts and treasuries can be reorganised only after the campaign."
 HSM_CYA_countess_western_concord:0 "A Settlement with the West"
 HSM_CYA_countess_western_concord_desc:0 "Aquileia's claims and the independence of the western trade cities cannot be settled by restoring the palace alone. The Countess will put the crown's terms before their governments, with the army behind her envoys. Port revenues and oil concessions belong to the settlement after victory, not to promises made before it."
 HSM_CYA_countess_southern_compacts:0 "The Crowns of the South"
 HSM_CYA_countess_southern_compacts_desc:0 "With the western provinces functioning again, the government can turn towards Wingbardy and its neighbours without waiting for the northern settlement. The southern courts must enter the imperial order without undoing the arrangements already made in Sicameon and Asterion."
 HSM_CYA_countess_river_missions:0 "Terms for the Riverlands"
 HSM_CYA_countess_river_missions_desc:0 "The eastern ports and provincial roads now give our missions a secure rear. The Riverlands must decide whether they will accept imperial supremacy. Even after a military victory, these pony lands will be governed through commissariats, not declared ordinary Griffonian provinces."
 HSM_CYA_countess_continental_rail_board:0 "Continental Rail Board"
 HSM_CYA_countess_continental_rail_board_desc:0 "New workshops in Griffenheim coordinate rails and freight capacity for the regency's far provinces."
 HSM_CYA_countess_regency_general_staff:0 "Regency General Staff"
 HSM_CYA_countess_regency_general_staff_desc:0 "Officers trained under the Countess turn regional forces into one supplied army for the imperial settlement."
 HSM_CYA_countess_western_circuits:0 "Join the Restored Provinces"
 HSM_CYA_countess_western_circuits_desc:0 "Northern courts, lake roads and western industries now serve the same government. The continental rail board and the general staff can coordinate them as a single rear. Southern and eastern campaigns may begin without leaving three separate occupations behind them."
 HSM_CYA_countess_eastern_circuits:0 "The Eastern Commissariats"
 HSM_CYA_countess_eastern_circuits_desc:0 "Griffonian provincial integration stops where the pony countries begin. In the Riverlands and Beorgfordas, the crown will use the Empire's commissariat arrangements instead. Their governments may be subordinate without their inhabitants being declared Griffonian nationals by decree."
 HSM_CYA_one_griffonia_under_the_crown:0 "One Griffonia for the Crown"
 HSM_CYA_one_griffonia_under_the_crown_desc:0 "From the coast that sheltered an exile to the courts of western Griffonia, the provinces now answer to one capital. The project begun under Taillow's regency has become a continental realm. Whether Grover has already taken government into his own hands, still awaits his crown, or is lost to us, conquest does not make that crown hers."
 HSM_CYA_grover_first_council:0 "Grover's First Council"
 HSM_CYA_grover_first_council_desc:0 "The transfer of authority is complete; now Grover must exercise it. At his first provincial council, he requires ministers to publish the obligations inherited from Taillow's settlement and to answer petitions in his name. She attends as a former guardian, without a regent's veto."
 HSM_CYA_grover_imperial_academies:0 "Imperial Academies Reopened"
 HSM_CYA_grover_imperial_academies_desc:0 "The new Emperor directs resources to universities and officer schools instead of another round of court patronage."
 HSM_CYA_countess_memorial_regency:0 "The Regency Without Grover"
 HSM_CYA_countess_memorial_regency_desc:0 "Grover died by another's hand. The Countess will preserve the institutions assembled for him, without naming herself Empress."
 HSM_CYA_countess_succession_council:0 "Council of Imperial Succession"
 HSM_CYA_countess_succession_council_desc:0 "Provincial delegates and jurists keep the united realm functioning until a lawful succession can be settled."
 HSM_CYA_grover_lost_to_others:0 "Grover Lost to Another's Hand"
 HSM_CYA_grover_lost_to_others_desc:0 "The heir is already dead. Dawnclaw will claim the empty throne's machinery without pretending the killing was his."
 HSM_CYA_memorial_imperial_council:0 "The Memorial Imperial Council"
 HSM_CYA_memorial_imperial_council_desc:0 "Court loyalists are offered a place in government while the dead emperor's name is kept out of factional reprisals."
 HSM_CYA_heirless_provincial_compact:0 "The Interregnum Compact"
 HSM_CYA_heirless_provincial_compact_desc:0 "The provinces recognise a provisional interregnum, not a new hereditary right for the Countess or the army. Their delegates and imperial jurists will examine proposed successors and record the terms of recognition. Until a lawful settlement is accepted, the council may levy taxes and maintain the army but may not dispose of the crown as its property."
 hsm_cyanolisia.40.adult.d:0 "Grover VI has worn a crown before; another ceremony treating him as a ward would insult him and the provinces that knew his rule. Before the court in Griffenheim, Taillow gives him the seals of government and releases the army from its oath to her regency. Some delegates applaud. Others watch Grover for the first order that will truly be his."
 hsm_cyanolisia.42.adult.d:0 "Grover VI once ruled without asking Dawnclaw's leave. In Griffenheim he is received with an emperor's honors and a prisoner's itinerary. The court calls it restoration; the officers who approve every audience know how little the word guarantees."
 hsm_cyanolisia.43.adult.d:0 "Grover VI has ruled before, and he recognizes the weight of the seals Dawnclaw returns to him. The army and courts remain, but their officers must now answer to the Emperor rather than his former protector. The ceremony ends; the harder transfer begins at the first cabinet meeting."
 hsm_cyanolisia.45.t:0 "An Empty Throne Inherited"
 hsm_cyanolisia.45.d:0 "Grover VI died beyond Dawnclaw's reach. The officers demand continuity of command; provincial delegates demand a lawful basis for obedience. An interim council will administer the realm while jurists examine nominations and seek provincial recognition of a successor. It is an interregnum, not proof that an unnamed relative exists or that the general has inherited the dynasty."
 hsm_cyanolisia.45.a:0 "Let the council hold the realm together."
 hsm_cyanolisia.46.t:0 "The Countess Keeps the Trust"
 hsm_cyanolisia.46.d:0 "Taillow prepared an empire for Grover and has lived long enough to learn that he will never receive it. The provincial envoys wait for her to take the crown; she leaves it untouched. A council will govern in his memory and seek a lawful successor, while the Countess keeps the realm from breaking before one can be found."
 hsm_cyanolisia.46.a:0 "Our duty did not die with him."
 HSM_CYA_DIRECTORATE:0 "Cyanolisian Directorate"
 HSM_CYA_DIRECTORATE_DEF:0 "the Cyanolisian Directorate"
 HSM_CYA_DIRECTORATE_ADJ:0 "Cyanolisian"
 HSM_CYA_DIRECTORATE_fascism:0 "Cyanolisian Directorate"
 HSM_CYA_DIRECTORATE_neutrality:0 "Cyanolisian Directorate"
 HSM_CYA_DIRECTORATE_democratic:0 "Cyanolisian Directorate"
 HSM_CYA_DIRECTORATE_communism:0 "Cyanolisian Directorate"
 HSM_CYA_DIRECTORATE_fascism_DEF:0 "the Cyanolisian Directorate"
 HSM_CYA_DIRECTORATE_neutrality_DEF:0 "the Cyanolisian Directorate"
 HSM_CYA_DIRECTORATE_democratic_DEF:0 "the Cyanolisian Directorate"
 HSM_CYA_DIRECTORATE_communism_DEF:0 "the Cyanolisian Directorate"
 HSM_CYA_DIRECTORATE_fascism_ADJ:0 "Cyanolisian"
 HSM_CYA_DIRECTORATE_neutrality_ADJ:0 "Cyanolisian"
 HSM_CYA_DIRECTORATE_democratic_ADJ:0 "Cyanolisian"
 HSM_CYA_DIRECTORATE_communism_ADJ:0 "Cyanolisian"
 hsm_cyanolisia.47.t:0 "The Northern Standards"
 hsm_cyanolisia.47.countess.d:0 "The Countess's envoys carry charters bearing Griffenheim's seal northward. Some courts bargain for their assemblies; others count the garrisons behind the words. The regency must pay its negotiators and turn their promises into a common law."
 hsm_cyanolisia.47.dawnclaw.d:0 "Northern banners do not hurry to bow to Griffenheim. Dawnclaw sends ultimatums, but his staff knows each capital will demand a separate settlement or campaign. Military victory alone will not build a working administration."
 hsm_cyanolisia.47.a:0 "Open a northern affairs office."
 hsm_cyanolisia.48.t:0 "Across the River"
 hsm_cyanolisia.48.countess.d:0 "Across the river is no empty square on an imperial map. The federation, local crowns, and town councils speak for their own people. The Countess orders the future mandates mapped before the campaign: victory must not mean annexing every village."
 hsm_cyanolisia.48.dawnclaw.d:0 "Dawnclaw's staff plots crossings and supply lines. Draft mandates are pinned beside the field maps: after the campaign the ponies will live under imperial supervision, not become provinces of Griffenheim."
 hsm_cyanolisia.48.a:0 "Prepare an administration across the river."
 hsm_cyanolisia.49.t:0 "The Edge of the Imperial Core"
 hsm_cyanolisia.49.d:0 "The eastern griffon districts can be tied to Griffenheim by courts, taxes, and rail. Across the river, however, pony councils and hill chiefs will not become imperial provinces by changing the ink on a map. The chancery proposes dependent commissariats, each with local officials beneath an imperial governor."
 hsm_cyanolisia.49.a:0 "Have the chancery draft the decrees."
 hsm_cyanolisia.50.t:0 "The West Remembers Its Crowns"
 hsm_cyanolisia.50.countess.d:0 "Aquileian representatives and western princes heard the regency's envoys separately. The Countess offers each court a place under common law, but no treaty erases an old claim. Judges, archives, and patience will be needed."
 hsm_cyanolisia.50.dawnclaw.d:0 "Dawnclaw's staff draws arrows across the west. Aquileian representatives and the old principalities see the end of their independence in those maps, whatever form their governments now take. To hold the west after victory, Griffenheim will need working courts as well as garrisons."
 hsm_cyanolisia.50.a:0 "Open the western archives."
 hsm_cyanolisia.51.t:0 "The Southern Compacts"
 hsm_cyanolisia.51.countess.d:0 "The southern crowns trade across the sea and will not recognize Griffenheim from imperial memory alone. The Countess prepares agreements on ports and customs beside the campaign plans: the Empire must govern what it conquers."
 hsm_cyanolisia.51.dawnclaw.d:0 "The southern campaign will not end at the last land border. Ports, islands, and sea lanes need separate garrisons and their own supply staff. Dawnclaw gives fleet and army their common orders."
 hsm_cyanolisia.51.a:0 "Prepare the southern staff."
 HSM_CYA_reform_field_command:0 "Reform the Field Command"
 HSM_CYA_reform_field_command_desc:0 "The coast guard, frontier garrisons, and palace officers have spent too long answering to different desks. A common field command will teach them whose orders take precedence when the first alarm sounds."
 HSM_CYA_standardise_field_equipment:0 "Standardise Field Equipment"
 HSM_CYA_standardise_field_equipment_desc:0 "Every regiment has guarded its own stores and favored its own rifle. The arsenals will issue common patterns so a battalion sent north can be supplied by more than the quartermaster who raised it."
 HSM_CYA_officer_academy:0 "Cyanolisian Officer Academy"
 HSM_CYA_officer_academy_desc:0 "Proven sergeants will sit beside the sons of court families over the same maps. The academy cannot remove their loyalties, but it can give them a shared language before the army outgrows its old commanders."
 HSM_CYA_frontier_supply_corps:0 "Frontier Supply Corps"
 HSM_CYA_frontier_supply_corps_desc:0 "A frontier unit is only as stubborn as the road behind it. Drivers, mechanics, and depot clerks will answer to one corps instead of waiting for each local commander to improvise a convoy."
 HSM_CYA_combined_arms_school:0 "Combined Arms School"
 HSM_CYA_combined_arms_school_desc:0 "Infantry advances have too often outrun their guns, while workshops build to peacetime schedules. Exercises will make the regiments, batteries, and arsenals plan the same battle."
 HSM_CYA_joint_general_staff:0 "Joint General Staff"
 HSM_CYA_joint_general_staff_desc:0 "The reform committees can be dismissed; a general staff must survive the ministers who appointed it. Its maps will cover the coast, the Evi roads, and eventually the long approach to Griffenheim."
 HSM_CYA_crown_field_staff:0 "Crown Field Staff"
 HSM_CYA_crown_field_staff_desc:0 "The Countess will not leave behind a collection of private armies. Officers must learn to serve the crown rather than her household, with orders recorded by the court as well as the barracks."
 HSM_CYA_dawnclaw_operational_staff:0 "Dawnclaw's Operational Staff"
 HSM_CYA_dawnclaw_operational_staff_desc:0 "Dawnclaw spreads the old imperial maps across a Cyanolisian table. His officers learn to think in rail timetables, reserves, and campaigns that do not end at the next border."
 HSM_CYA_border_defense_staff:0 "Border Defense Staff"
 HSM_CYA_border_defense_staff_desc:0 "The march cannot win by imitating a great power's offensives. Its staff studies the passes, stores supplies behind them, and plans how a smaller army can make an invader pay for every road."
 HSM_CYA_coastal_reconstruction:0 "Rebuild the Coastal Economy"
 HSM_CYA_coastal_reconstruction_desc:0 "Closed workshops stand beside busy quays, and young workers still leave for wages elsewhere. Reopening the coast's factories is the first promise that modernization will reach beyond the Countess' ledgers."
 HSM_CYA_coastal_transport_authority:0 "Coastal Transport Authority"
 HSM_CYA_coastal_transport_authority_desc:0 "Goods now wait at one station while empty wagons pass another. A transport authority will put the ports, workshops, and border depots on a timetable the same ministry can enforce."
 HSM_CYA_technical_institute:0 "Cyanolisian Technical Institute"
 HSM_CYA_technical_institute_desc:0 "The best mechanics are teaching apprentices beside broken machines. Give them laboratories, books, and paid time to test their designs, and their work may outlast any single minister."
 HSM_CYA_port_foundries:0 "Port Foundries"
 HSM_CYA_port_foundries_desc:0 "The port cannot live on imported fittings forever. Foundries and dockside shops will keep the fleet supplied while giving civilian merchants a reason to invest in the same waterfront."
 HSM_CYA_arsenal_network:0 "Arsenal Network"
 HSM_CYA_arsenal_network_desc:0 "One crowded arsenal can be shut by a strike, fire, or enemy raid. Smaller workshops, bound by common specifications, will keep the army armed even when the capital cannot."
 HSM_CYA_national_development_plan:0 "National Development Plan"
 HSM_CYA_national_development_plan_desc:0 "Rail officials, schoolmasters, and factory owners have each asked for funds as if the others did not exist. A public plan will force them to answer the same question: what sort of country are they building?"
 HSM_CYA_crown_credit_authority:0 "Crown Credit Authority"
 HSM_CYA_crown_credit_authority_desc:0 "The Countess asks old families to lend against the future crown, not merely their own estates. Their money can raise towns and workshops; the court must make sure the creditors do not come to own them."
 HSM_CYA_dawnclaw_procurement_office:0 "Dawnclaw's Procurement Office"
 HSM_CYA_dawnclaw_procurement_office_desc:0 "Dawnclaw knows which firms once supplied Griffenheim and which directors will accept a discreet order. A single procurement office turns those contacts into rifles, vehicles, and obligations."
 HSM_CYA_frontier_development_board:0 "Frontier Development Board"
 HSM_CYA_frontier_development_board_desc:0 "Surveyors know the villages that generals mark as blank space. Give them a board with a budget, and frontier roads and depots can be built for the residents who must keep them open."
 HSM_CYA_southern_fleet_yards:0 "Southern Fleet Yards"
 HSM_CYA_southern_fleet_yards_desc:0 "The old slips are still crowded with rusting hulls and unpaid crews. Reopening the yards will give the southern coast ships it can repair itself, rather than a fleet that exists only on paper."
 HSM_CYA_coastal_patrols:0 "Coastal Patrols"
 HSM_CYA_coastal_patrols_desc:0 "Smugglers and foreign scouts know the inlets better than the Admiralty. Regular patrols will turn the coast from a line on headquarters maps into water the fleet actually watches."
 HSM_CYA_naval_air_school:0 "Naval Air School"
 HSM_CYA_naval_air_school_desc:0 "Ships cannot guard every mile between the ports. Pilots trained alongside captains will spot the convoys, raiders, and weather that a distant Admiralty learns about too late."
 HSM_CYA_dockyard_program:0 "Dockyard Program"
 HSM_CYA_dockyard_program_desc:0 "A fleet built in bursts leaves skilled workers idle between contracts. Permanent orders and larger slips will make shipbuilding a trade the port can pass from one generation to the next."
 HSM_CYA_raise_austernfischer:0 "Raise the Austernfischer"
 HSM_CYA_raise_austernfischer_desc:0 "The Austernfischer has rested in the harbour long enough to become a story told by old sailors. Raising her will cost steel and patience, but the crew that sees her return may believe the fleet has a future."
 HSM_CYA_seaborne_corps:0 "Seaborne Corps"
 HSM_CYA_seaborne_corps_desc:0 "A landing is decided before the first boat touches shore. Marines must train with the crews who carry them, and both must know how to fight when the supply line is still at sea."
 HSM_CYA_admiralty_compact:0 "Admiralty Compact"
 HSM_CYA_admiralty_compact_desc:0 "The captains, air officers, and shore commanders have spent years protecting separate budgets. The compact gives them a single plan and makes each service answer for the others' losses."
 HSM_CYA_imperial_supply_grid:0 "Imperial Supply Grid"
 HSM_CYA_imperial_supply_grid_desc:0 "The Empire's collapse left southern railways and Griffenheim's warehouses under separate administrations. Tariffs, schedules and stockpiles now divide a network that once served a wider realm. Reconnecting it is less glorious than taking the capital, but essential to any army marching beyond it."
 HSM_CYA_griffonian_armament_standard:0 "Griffonian Armament Standard"
 HSM_CYA_griffonian_armament_standard_desc:0 "Captured depots hold weapons made for different armies and different rulers. A common standard will let the provinces supply one field force without erasing the workshops that know how to make its parts."
 HSM_CYA_quartermaster_service:0 "Quartermaster Service"
 HSM_CYA_quartermaster_service_desc:0 "A truck stranded for want of one part is no use to a marching regiment. Quartermasters will count fuel, repairs, and spare wheels as carefully as officers count rifles."
 HSM_CYA_railway_battalions:0 "Railway Battalions"
 HSM_CYA_railway_battalions_desc:0 "Tracks near the frontier are repaired after every crisis and forgotten after every peace. Permanent railway battalions will keep the line open before an army needs it."
 HSM_CYA_signal_companies:0 "Signal Companies"
 HSM_CYA_signal_companies_desc:0 "A broken wire can leave a whole battalion fighting yesterday's battle. Signal companies will carry orders through bad roads and worse weather while learning when silence matters more than speed."
 HSM_CYA_field_hospitals:0 "Field Hospitals"
 HSM_CYA_field_hospitals_desc:0 "The wounded have too often disappeared between the front and the nearest town. Medical teams, wagons, and clear evacuation routes will give soldiers a reason to trust the army that sent them out."
 HSM_CYA_frontier_artillery:0 "Frontier Artillery"
 HSM_CYA_frontier_artillery_desc:0 "The border regiments cannot always wait for guns borrowed from the capital. Their own batteries will know the passes and be in position before the first enemy column appears."
 HSM_CYA_engineer_brigades:0 "Engineer Brigades"
 HSM_CYA_engineer_brigades_desc:0 "The same hands that throw up a defensive wall must know how to cross one. Engineer brigades will train for bridges, demolition, and the patient labor that keeps a line intact."
 HSM_CYA_aerial_reconnaissance:0 "Aerial Reconnaissance"
 HSM_CYA_aerial_reconnaissance_desc:0 "Maps from the last war cannot show this year's roads or the enemy's new camps. Forward pilots will bring back photographs and reports before the staff commits its reserves."
 HSM_CYA_motorised_reserves:0 "Motorised Reserves"
 HSM_CYA_motorised_reserves_desc:0 "A continental army cannot make every crisis wait for infantry on foot. Mechanics and drivers will form a reserve able to move from one threatened railway to the next."
 HSM_CYA_crown_military_colleges:0 "Crown Military Colleges"
 HSM_CYA_crown_military_colleges_desc:0 "The Countess needs officers whose service will outlast her government. Their commissions must bind them to lawful institutions, not to a personal household. Such an army can later serve an imperial settlement without having to be bought a second time."
 HSM_CYA_dawnclaw_war_college:0 "Dawnclaw's War College"
 HSM_CYA_dawnclaw_war_college_desc:0 "Dawnclaw does not want officers who merely admire his victories. He wants staff who can keep three campaigns supplied, conceal a fourth, and continue working when he is absent."
 HSM_CYA_imperial_officer_exchange:0 "Imperial Officer Exchange"
 HSM_CYA_imperial_officer_exchange_desc:0 "Former enemies arrive with different drill books and memories of the same war. Exchange postings will make them learn each other's formations before they command the provinces together."
 HSM_CYA_continental_ordnance:0 "Continental Ordnance"
 HSM_CYA_continental_ordnance_desc:0 "The old capital's arsenals once armed an empire; conquest has filled them with mismatched stock. Refit the lines and set one standard for the armies still marching across Griffonia."
 HSM_CYA_port_customs_houses:0 "Customs and Freight Offices"
 HSM_CYA_port_customs_houses_desc:0 "Cargo vanishes between the harbour books and the inland warehouses. Customs and freight clerks will reconcile the two, turning missing duties into wages for new workshops."
 HSM_CYA_coastal_quarries:0 "Southern Quarries"
 HSM_CYA_coastal_quarries_desc:0 "The inland quarries supply stone but send their ore away unworked. Surveyors and smelters will keep more of that value in southern towns, where the roads to the coast begin."
 HSM_CYA_electrify_the_workshops:0 "Electrify the Workshops"
 HSM_CYA_electrify_the_workshops_desc:0 "Old workshops close at dusk even when orders are waiting. Reliable power and trained electricians will let machinists work to a schedule set by demand, not daylight."
 HSM_CYA_apprenticeship_halls:0 "Apprenticeship Halls"
 HSM_CYA_apprenticeship_halls_desc:0 "A factory can import machines, not the hands that know their faults. Apprenticeship halls will put experienced workers beside young recruits before the next expansion empties the workshops of skill."
 HSM_CYA_rural_cooperatives:0 "Rural Cooperatives"
 HSM_CYA_rural_cooperatives_desc:0 "The countryside is asked to feed the cities and wait for prosperity to return. Cooperatives will give villages tools, credit, and a claim on the industries that grow from their labor."
 HSM_CYA_industrial_standards_board:0 "Industrial Standards Board"
 HSM_CYA_industrial_standards_board_desc:0 "One factory's fittings still fail in another's machines. Inspectors, engineers, and owners will agree on common measures before the army and the railways pay for every disagreement."
 HSM_CYA_crown_municipal_loans:0 "Crown Municipal Loans"
 HSM_CYA_crown_municipal_loans_desc:0 "Municipal councils know which bridges and workshops need repairs but cannot borrow on the Countess's terms. Her guarantees will fund those works in exchange for published accounts and a share of future revenue."
 HSM_CYA_dawnclaw_factory_contracts:0 "Dawnclaw's Factory Contracts"
 HSM_CYA_dawnclaw_factory_contracts_desc:0 "Dawnclaw's contracts promise steady orders to firms willing to surrender their books for inspection. The arsenals gain certainty; their directors learn that a missed quota has political consequences."
 HSM_CYA_griffenheim_rail_hub:0 "Griffenheim Rail Hub"
 HSM_CYA_griffenheim_rail_hub_desc:0 "The rails into Griffenheim were laid for a capital that commanded the south. Joining them to Cyanolisia's lines will make that old geography useful to the new government."
 HSM_CYA_herzland_industrial_survey:0 "Herzland Industrial Survey"
 HSM_CYA_herzland_industrial_survey_desc:0 "Occupation officers can seize a factory without knowing whether its furnaces still work. Engineers will inventory the mines, workshops, and damaged lines before the capital promises what it cannot yet produce."
 HSM_CYA_evi_freight_corridor:0 "Evi Freight Corridor"
 HSM_CYA_evi_freight_corridor_desc:0 "Evi's roads carried armies before they carried ordinary freight. A dependable corridor from Griffenheim will let the valley receive goods without waiting for the next campaign to repair its bridges."
 HSM_CYA_imperial_research_exchange:0 "Imperial Research Exchange"
 HSM_CYA_imperial_research_exchange_desc:0 "Cyanolisian engineers built under scarcity; Herzland scholars worked beneath old imperial patronage. Put their institutes in correspondence and let each test what the other once dismissed."
 HSM_CYA_convoy_escorts:0 "Convoy Escorts"
 HSM_CYA_convoy_escorts_desc:0 "Merchant captains cannot plan a voyage around rumours of raiders. Escort schedules, charts, and reliable refuelling will make the sea lanes usable even when the coast is at war."
 HSM_CYA_naval_signals_school:0 "Naval Signals School"
 HSM_CYA_naval_signals_school_desc:0 "A warning that reaches one ship but not the squadron can lose the whole convoy. Signals officers will practice speaking across water, weather, and the competing habits of every captain."
 HSM_CYA_seaplane_stations:0 "Seaplane Stations"
 HSM_CYA_seaplane_stations_desc:0 "The fleet needs eyes beyond the harbour mouth. Seaplane crews and shore observers will chart movement along the coast before it becomes a surprise reported by a missing ship."
 HSM_CYA_marine_training_ground:0 "Marine Training Ground"
 HSM_CYA_marine_training_ground_desc:0 "The first landing party cannot bring the whole army ashore with it. Marines will train to hold a pier, clear a road, and survive until the transports return."
 HSM_CYA_coastal_defence_batteries:0 "Coastal Defence Batteries"
 HSM_CYA_coastal_defence_batteries_desc:0 "An enemy need not take the port from the sea; the roads behind it are just as vulnerable. Batteries and inland strongpoints will make the harbour costly to seize from either direction."
 HSM_CYA_bluewater_shipyards:0 "Bluewater Shipyards"
 HSM_CYA_bluewater_shipyards_desc:0 "A patrol fleet can guard a coast, not sustain an expedition. Larger slips and long contracts will give shipbuilders the time to produce vessels meant to stay at sea."
 HSM_CYA_imperial_convoy_authority:0 "Imperial Convoy Authority"
 HSM_CYA_imperial_convoy_authority_desc:0 "New provinces bring ports with their own masters and competing schedules. An imperial convoy authority will make them answer to one supply plan without pretending the sea has become safe."
 HSM_CYA_expeditionary_fleet:0 "Expeditionary Fleet"
 HSM_CYA_expeditionary_fleet_desc:0 "The southern crown and distant islands cannot be reached by decree from Griffenheim. A fleet built for long passages will carry the army, guard its return, and keep the Empire connected after victory."
 HSM_CYA_imperial_sentence_title:0 "The Sentence Against Dawnclaw"
 HSM_CYA_imperial_sentence_option:0 "The coup is over."
 HSM_CYA_imperial_escape_desc:0 "The coup has failed, but the condemned general has escaped the prison convoy. A sympathetic officer substituted the transport orders; by the time the discrepancy was discovered, Ferdinand Dawnclaw and a handful of accomplices had vanished toward the southern ports. The court announces his conviction and orders a discreet pursuit. Its authority has survived. Its most dangerous enemy has not yet faced the scaffold."
 hsm_cyanolisia.1.left.d:0 "Dawnclaw's escape from imperial custody has divided the officers associated with the Group of Twenty. Committed revolutionaries demand that this enemy of their cause be expelled; their less committed colleagues see a useful organiser and a chance to recover control of the army. The Countess's household offers those officers a bargain: abandon the revolutionary programme, restore her executive authority where it has been displaced, and conceal Dawnclaw as a military assistant. Accepting him is a counter-coup, not a continuation of the revolution. Refusing leaves the existing political course intact."
 HSM_CYA_court_countercoup_tt:0 "The officers abandon the revolutionary programme. The Countess resumes executive authority; the Dawnclaw route replaces the socialist route."
 HSM_CYA_grover_in_our_custody_tt:0 "Grover VI is alive and his character is present in our country; a foreign sovereign must not be seized remotely."
 hsm_cyanolisia.52.t:0 "The Imperial Household Arrives"
 hsm_cyanolisia.52.d:0 "Grover's attendants arrive with the household accounts, a small escort and a written acknowledgement from his former keepers. Their state is now either subject to ours or fully conquered; the transfer is a consequence of that settlement, not of a distant claim to his name. The boy is placed under guard in Griffenheim. His future has not yet been decided."
 hsm_cyanolisia.52.adult.d:0 "Grover VI arrives from a court whose state is now subject to ours or fully conquered. His attendants surrender the official records, but the man beside them is no child to be assigned a tutor. Whether he has already ruled elsewhere or has waited years for his first accession, the coming settlement must deal with an adult claimant and the loyalties he brings with him."
 hsm_cyanolisia.52.a:0 "Receive the household in Griffenheim."
 HSM_CYA_grover_ruler_desc:0 "Grover VI rules from Griffenheim after the Cyanolisian campaigns and a formal transfer of executive authority. His claim survived war, competing guardians and rival accounts of what the Empire should become. The institutions he inherits were built before he controlled them. His reign will be judged by whether he can make their officers and ministers answer to the crown rather than to its former keepers."
 hsm_cyanolisia.40.late.d:0 "Grover's first accession has come long after his eighteenth birthday. Taillow receives an adult, not a pupil, before the court in Griffenheim. She surrenders the executive seals and releases the army from its oath to her temporary authority. There is no childhood to recover in this ceremony, only a delayed promise to fulfil and a government for Grover to take into his own hands."
 hsm_cyanolisia.42.late.d:0 "Grover has reached adulthood without ever exercising sovereign power. Dawnclaw now gives him a crown, a guarded residence and a schedule approved by officers. The court calls the ceremony an accession. Its practical terms leave no doubt that the government still answers to the general."
 hsm_cyanolisia.43.late.d:0 "Grover reaches his first throne as an adult. Dawnclaw places the executive seals before him and accepts the bargain he once rejected: the state must survive its builder, and its officers must serve an office they cannot inherit by force. Grover takes the seals without promising to preserve every order issued in his name."
 hsm_cyanolisia.53.t:0 "The Provinces Remember"
 hsm_cyanolisia.53.d:0 "Provincial petitions are laid before Grover's council. They ask which promises survived the transfer of power.\n\n[Root.GetHSMCyaKaivSettlement]\n\n[Root.GetHSMCyaMidoriaSettlement]\n\n[Root.GetHSMCyaGryphusSettlement]\n\n[Root.GetHSMCyaNorthSettlement]\n[Root.GetHSMCyaLakeSettlement]\n[Root.GetHSMCyaWestSettlement]\n\n[Root.GetHSMCyaEducation] The emperor must now choose his first priority. His education informs the choice; it does not make it for him."
 hsm_cyanolisia.53.a:0 "Uphold the provincial charters."
 HSM_CYA_petitions_kaiv_charter:0 "Kaiv cites its autonomy charter against an unsanctioned levy. The Rada expects the crown to enforce the limit it promised."
 HSM_CYA_petitions_kaiv_officers:0 "Kaiv's Cossack officers ask whether their commissions and local commands remain valid. Military service, not a civilian charter, was their bargain."
 HSM_CYA_petitions_kaiv_veto:0 "Kaiv's Rada asks whether the commandant may still veto every local resolution now that the Emperor claims to hear the provinces."
 HSM_CYA_petitions_kaiv_supervised:0 "Kaiv's watched Rada sends a carefully worded petition: may its votes now carry weight beyond endorsing the garrison's decisions?"
 HSM_CYA_petitions_kaiv_unsettled:0 "No agreed Kaiv settlement appears in the council's records. The ministry cannot answer local claims by inventing a charter after the fact."
 HSM_CYA_petitions_midoria_charters:0 "Midoria's parishes defend the harbour dues and patrols retained under their charters. A naval requisition has brought that guarantee to its first test."
 HSM_CYA_petitions_midoria_customs:0 "Midoria's harbour delegates want accounts from the central customs board. They surrendered local exemptions, not the right to know where the dues went."
 HSM_CYA_petitions_midoria_amnesty:0 "Midoria's pardoned corsair crews ask for written confirmation that their old offences cannot be reopened after they fulfilled their service."
 HSM_CYA_petitions_midoria_requisition:0 "Midoria's dockmasters present unpaid requisition receipts. The yards kept working under soldiers; now the crown must say which obligations it honours."
 HSM_CYA_petitions_midoria_unsettled:0 "Midoria has no recorded special settlement. Its petition asks for terms before the ministry treats wartime arrangements as permanent law."
 HSM_CYA_petitions_gryphus_company:0 "The Gryphussian company demands enforcement of its renewed charter. Free-town petitioners reply that commercial privilege must not exempt it from public obligations."
 HSM_CYA_petitions_gryphus_towns:0 "Gryphus's free towns invoke the municipal guarantees given instead of a privileged company charter. They expect direct access to the crown's courts."
 HSM_CYA_petitions_gryphus_audit:0 "Gryphus's audited merchants ask whether the new assessments are final. They cannot plan a season's trade under a permanently provisional tax demand."
 HSM_CYA_petitions_gryphus_order:0 "The Order of Opinicus asks who now holds the security files seized from its chapterhouses. An oath to Grover has not erased those instruments of pressure."
 HSM_CYA_petitions_gryphus_unsettled:0 "The record contains no special Gryphus charter. The council must distinguish enforceable obligations from privileges claimed but never conceded."
 HSM_CYA_dawnclaw_departed:0 "Dawnclaw has left Cyanolisia"
 HSM_CYA_dawnclaw_escaped_execution:0 "Dawnclaw escaped after his failed coup"
 HSM_CYA_court_countercoup:0 "The revolutionary programme was abandoned in favour of the Countess"
 hsm_cyanolisia.12.orphaned.d:0 "The empire that trained these officials no longer exists, and Dawnclaw no longer has a place at court. Stranded members of the old administrative mission offer their experience and surviving commercial connections in exchange for permanent posts. They cannot deliver Griffenheim's protection. What they can deliver is a cabinet, provided the Countess accepts their influence over appointments, contracts and the public accounts."

 # Regional reconquest and reconstruction
 HSM_CYA_countess_lake_charters:0 "The Oaths of the Lake Houses"
 HSM_CYA_countess_lake_charters_desc:0 "The houses around the lakes once settled their quarrels without asking Griffenheim. Now the crown demands a common frontier and an end to private tolls. Recognition may be negotiated, but resistance will meet an army before it meets an imperial magistrate."
 HSM_CYA_countess_frontier_mandate:0 "The Eastern Provincial Mandate"
 HSM_CYA_countess_frontier_mandate_desc:0 "The restored lake routes provide a rear for the eastern campaign. The Griffonian Frontier is not the Riverlands: Longsword, Hellquill and the Evi states have their own claims, disputes and roads to the sea. Envoys and commanders can follow those roads without waiting for the western settlement."
 HSM_CYA_countess_hill_compacts:0 "The Beorgfordas Settlement"
 HSM_CYA_countess_hill_compacts_desc:0 "The hill countries cannot be treated as an appendix to the Riverlands. Their passes, communities and rulers require separate demands and a separate campaign plan. The crown seeks submission; the local administration that follows will remain a commissariat."
 HSM_CYA_reclaim_the_griffon_frontier:0 "Secure the Griffonian Frontier"
 HSM_CYA_reclaim_the_griffon_frontier_desc:0 "The lake transit authority can supply an eastern army. Dawnclaw can now secure the Griffonian Frontier before crossing into the pony lands, without waiting for every western province to be reorganized. Ports and supply roads must follow the campaign towards Gryphus."
 HSM_CYA_countess_northern_assizes:0 "Reopen the Northern Courts"
 HSM_CYA_countess_northern_assizes_desc:0 "Recognition of Griffenheim must reach beyond the signatures of defeated governments. Provincial judges will hear property disputes, workshops will reopen and the crown will assume responsibility for the roads. The northern lands can now enter the ordinary imperial integration system."
 HSM_CYA_northern_garrison_network:0 "A Permanent Northern Rear"
 HSM_CYA_northern_garrison_network_desc:0 "The army cannot keep winning the same towns every spring. A permanent garrison network will protect repaired roads and the reopened northern arsenal. Civil administration will return under supervision, and the provinces will be admitted to imperial integration."
 HSM_CYA_countess_lake_reconstruction:0 "Reopen the Lake Roads"
 HSM_CYA_countess_lake_reconstruction_desc:0 "The lake houses have submitted, but their old barriers still divide farms from markets. Surveyors will repair the roads through the Avian lands and Blackhollow. A common provincial administration will replace rival toll collectors and prepare the region for integration."
 HSM_CYA_lake_transit_authority:0 "The Central Transit Authority"
 HSM_CYA_lake_transit_authority_desc:0 "Private tolls and damaged roads now obstruct our own supply columns. Military engineers will reopen the routes through the Avian lands and Blackhollow, while appointed officials unify their administration. Central Griffonia must become a dependable rear, not a collection of conquered checkpoints."
 HSM_CYA_countess_western_reconstruction:0 "Western Reconstruction Charters"
 HSM_CYA_countess_western_reconstruction_desc:0 "The Aquileian workshops need orders, and the oil fields need equipment and secure contracts. The crown will reopen production while recognising enforceable local property rights. Western integration will proceed through functioning institutions, not through a declaration that the war repaired everything."
 HSM_CYA_western_reconstruction_office:0 "The Western Reconstruction Office"
 HSM_CYA_western_reconstruction_office_desc:0 "Seized ledgers are of little use beside idle machinery. The western reconstruction office will place Aquileian factories under contract and restore output from the oil fields. Local administrations will answer to Griffenheim as the region enters imperial integration."
 HSM_CYA_countess_karthin_settlement:0 "The Karthin Settlement"
 HSM_CYA_countess_karthin_settlement_desc:0 "After the southern campaign, the crown needs employers and harvests as much as it needs obedient officials. Karthin's workshops and the rubber trade will anchor the reconstruction. Griffonian provinces will enter imperial integration; Asterion's separate status will not be erased by an administrative decree."
 HSM_CYA_karthin_war_industry:0 "Bring Karthin's Workshops Back"
 HSM_CYA_karthin_war_industry_desc:0 "The southern armies have delivered territory, not a functioning arsenal. Karthin's workshops will be reopened under military contracts, and rubber deliveries will be restored. Griffonian provinces can begin integration without extending that policy to the minotaurs of Asterion."
 HSM_CYA_countess_frontier_ports:0 "Gryphus and the Eastern Roads"
 HSM_CYA_countess_frontier_ports_desc:0 "The eastern provinces need a route to market that does not end at an army checkpoint. The port of Gryphus will be expanded and the roads through Gryphia repaired. These Griffonian lands can enter imperial integration before the government decides the fate of the pony countries farther east."
 HSM_CYA_frontier_supply_ports:0 "An Eastern Supply Coast"
 HSM_CYA_frontier_supply_ports_desc:0 "Gryphus must become a working supply port, not a name at the end of an arrow on the staff map. New dockyards and repaired roads through Gryphia will support the next campaign. The Griffonian Frontier will enter imperial integration before the army crosses into the pony lands."
 HSM_CYA_campaign_north_secured_tt:0 "The original Griffonian territories of the North are owned and controlled by us or our subjects."
 HSM_CYA_claim_north_tt:0 "Gain annexation war goals against the current independent owners of territories in the North, including third-party conquerors. Our subjects, current enemies and countries already targeted by our war goals are excluded."
 HSM_CYA_integrate_north_tt:0 "Unlock EaW's normal compliance-based integration of the original Griffonian provinces of the North. No immediate cores are granted. Asterion and pony territories are excluded."
 HSM_CYA_campaign_central_secured_tt:0 "The original Griffonian territories of Central Griffonia and the lake countries are owned and controlled by us or our subjects."
 HSM_CYA_claim_central_tt:0 "Gain annexation war goals against the current independent owners of territories in Central Griffonia and the lake countries, including third-party conquerors. Our subjects, current enemies and countries already targeted by our war goals are excluded."
 HSM_CYA_integrate_central_tt:0 "Unlock EaW's normal compliance-based integration of the original Griffonian provinces of Central Griffonia and the lake countries. No immediate cores are granted. Asterion and pony territories are excluded."
 HSM_CYA_campaign_west_secured_tt:0 "The original Griffonian territories of Aquileia and the western countries are owned and controlled by us or our subjects."
 HSM_CYA_claim_west_tt:0 "Gain annexation war goals against the current independent owners of territories in Aquileia and the western countries, including third-party conquerors. Our subjects, current enemies and countries already targeted by our war goals are excluded."
 HSM_CYA_integrate_west_tt:0 "Unlock EaW's normal compliance-based integration of the original Griffonian provinces of Aquileia and the western countries. No immediate cores are granted. Asterion and pony territories are excluded."
 HSM_CYA_campaign_south_secured_tt:0 "The original Griffonian territories of the southern countries and Asterion are owned and controlled by us or our subjects."
 HSM_CYA_claim_south_tt:0 "Gain annexation war goals against the current independent owners of territories in the southern countries and Asterion, including third-party conquerors. Our subjects, current enemies and countries already targeted by our war goals are excluded."
 HSM_CYA_integrate_south_tt:0 "Unlock EaW's normal compliance-based integration of the original Griffonian provinces of the southern countries and Asterion. No immediate cores are granted. Asterion and pony territories are excluded."
 HSM_CYA_campaign_frontier_secured_tt:0 "The original Griffonian territories of the Griffonian Frontier and the Evi states are owned and controlled by us or our subjects."
 HSM_CYA_claim_frontier_tt:0 "Gain annexation war goals against the current independent owners of territories in the Griffonian Frontier and the Evi states, including third-party conquerors. Our subjects, current enemies and countries already targeted by our war goals are excluded."
 HSM_CYA_integrate_frontier_tt:0 "Unlock EaW's normal compliance-based integration of the original Griffonian provinces of the Griffonian Frontier and the Evi states. No immediate cores are granted. Asterion and pony territories are excluded."
 HSM_CYA_campaign_river_secured_tt:0 "The original Griffonian territories of the Riverlands are owned and controlled by us or our subjects."
 HSM_CYA_claim_river_tt:0 "Gain annexation war goals against the current independent owners of territories in the Riverlands, including third-party conquerors. Our subjects, current enemies and countries already targeted by our war goals are excluded."
 HSM_CYA_campaign_hills_secured_tt:0 "The original Griffonian territories of Beorgfordas are owned and controlled by us or our subjects."
 HSM_CYA_claim_hills_tt:0 "Gain annexation war goals against the current independent owners of territories in Beorgfordas, including third-party conquerors. Our subjects, current enemies and countries already targeted by our war goals are excluded."

 # Imperial reconstruction, regional institutions and the peace settlement.
 HSM_CYA_imperial_settlement:0 "The Imperial Settlement"
 HSM_CYA_imperial_settlement_desc:0 "Conquest does not settle every border or every promise. Renew claims when territorial owners change, negotiate the accession of independent allies, and prepare a lasting peace once Griffonia is secured. Pony lands remain under the existing imperial mandate system; these measures do not grant cores."
 HSM_CYA_renew_north_claims:0 "Renew Claims to the Northern Provinces"
 HSM_CYA_renew_north_claims_desc:0 "The old campaign orders no longer cover the current map. Issue war goals against the present owners of the region's original territories, excluding our subjects and countries already at war with us. Existing war goals are not duplicated. Claims do not override alliances or truces."
 HSM_CYA_renew_central_claims:0 "Renew Claims to Central Griffonia"
 HSM_CYA_renew_central_claims_desc:0 "The old campaign orders no longer cover the current map. Issue war goals against the present owners of the region's original territories, excluding our subjects and countries already at war with us. Existing war goals are not duplicated. Claims do not override alliances or truces."
 HSM_CYA_renew_west_claims:0 "Renew Claims to Western Griffonia"
 HSM_CYA_renew_west_claims_desc:0 "The old campaign orders no longer cover the current map. Issue war goals against the present owners of the region's original territories, excluding our subjects and countries already at war with us. Existing war goals are not duplicated. Claims do not override alliances or truces."
 HSM_CYA_renew_south_claims:0 "Renew Claims to Southern Griffonia"
 HSM_CYA_renew_south_claims_desc:0 "The old campaign orders no longer cover the current map. Issue war goals against the present owners of the region's original territories, excluding our subjects and countries already at war with us. Existing war goals are not duplicated. Claims do not override alliances or truces."
 HSM_CYA_renew_frontier_claims:0 "Renew Claims to the Griffonian Frontier"
 HSM_CYA_renew_frontier_claims_desc:0 "The old campaign orders no longer cover the current map. Issue war goals against the present owners of the region's original territories, excluding our subjects and countries already at war with us. Existing war goals are not duplicated. Claims do not override alliances or truces."
 HSM_CYA_renew_river_claims:0 "Renew Claims to the Riverlands"
 HSM_CYA_renew_river_claims_desc:0 "The old campaign orders no longer cover the current map. Issue war goals against the present owners of the region's original territories, excluding our subjects and countries already at war with us. Existing war goals are not duplicated. Claims do not override alliances or truces."
 HSM_CYA_renew_hills_claims:0 "Renew Claims to the Hill Countries"
 HSM_CYA_renew_hills_claims_desc:0 "The old campaign orders no longer cover the current map. Issue war goals against the present owners of the region's original territories, excluding our subjects and countries already at war with us. Existing war goals are not duplicated. Claims do not override alliances or truces."
 HSM_CYA_renew_continental_claims:0 "Renew the Continental Mandate"
 HSM_CYA_renew_continental_claims_desc:0 "Some territories have changed hands or escaped the regional settlements. Restate our claims against their present owners. Impassable territory, overseas possessions and our subjects are excluded. Alliances and truces still apply."
 HSM_CYA_offer_imperial_accession:0 "Offer [From.GetName] an Imperial Compact"
 HSM_CYA_offer_imperial_accession_desc:0 "Offer an independent ally a place within the empire as an autonomous subject. Its government may refuse. Both parties must be at peace; a faction leader cannot become our subject while leading the alliance. After a refusal, negotiations may be reopened in 180 days. Territorial war goals cannot be used while we remain allies."
 HSM_CYA_accession_refused_tt:0 "The ally remains independent. Reopen negotiations after the cooldown, or resolve our alliance and territorial claims through normal diplomacy. No territory or subject status is imposed."
 HSM_CYA_peace_settlement_unlocked_tt:0 "Unlocks a three-stage peace settlement: demobilization, reconstruction, and the distribution of imperial authority. Each stage requires peace and continued control of Griffonia."
 HSM_CYA_peace_demobilization:0 "Convene the Demobilization Commission"
 HSM_CYA_peace_demobilization_desc:0 "Thirty days of negotiations will produce a binding choice, not another ceremonial declaration. War or the loss of imperial territory interrupts the commission; it can be convened again once peace and control are restored. Its final settlement can be adopted only once."
 HSM_CYA_peace_reconstruction:0 "Approve the Reconstruction Budget"
 HSM_CYA_peace_reconstruction_desc:0 "Thirty days of negotiations will produce a binding choice, not another ceremonial declaration. War or the loss of imperial territory interrupts the commission; it can be convened again once peace and control are restored. Its final settlement can be adopted only once."
 HSM_CYA_peace_constitution:0 "Settle Imperial Authority"
 HSM_CYA_peace_constitution_desc:0 "Thirty days of negotiations will produce a binding choice, not another ceremonial declaration. War or the loss of imperial territory interrupts the commission; it can be convened again once peace and control are restored. Its final settlement can be adopted only once."
 hsm_cyanolisia.54.t:0 "Who Keeps Order in the North?"
 hsm_cyanolisia.54.countess.d:0 "The northern courts have received our judges, but the judges cannot govern every town from Griffenheim. Local councils offer to collect taxes and maintain civil order if their charters survive. Crown officials propose a different bargain: direct administration, public workshops and salaries paid from the centre. Taillow's settlement must say which promises bind the government that succeeds her."
 hsm_cyanolisia.54.dawnclaw.d:0 "The northern campaign is over; the garrisons now need officers who know the roads, depots and inhabitants. Dawnclaw can retain local officers under imperial commissions, or place the district entirely under staff-appointed commanders. The first gives the army experienced intermediaries. The second gives headquarters a more uniform chain of command."
 hsm_cyanolisia.54.a:0 "Recognize the towns' charters and tax obligations."
 hsm_cyanolisia.54.b:0 "Fund permanent offices of the crown."
 hsm_cyanolisia.54.c:0 "Commission the local officers."
 hsm_cyanolisia.54.d:0 "Let the general staff appoint the commanders."
 hsm_cyanolisia.55.t:0 "The Lake Settlement"
 hsm_cyanolisia.55.countess.d:0 "The reopened roads bring merchants, petitions and the representatives of the lake houses. They will acknowledge the crown and remit agreed taxes, but expect a voice in their own administration. The chancery would instead send salaried magistrates, responsible to the capital rather than to hereditary patrons. Both proposals would restore government; they disagree over who may hold it to account."
 hsm_cyanolisia.55.dawnclaw.d:0 "The lake routes supply the eastern armies. Local notables offer their storehouses, clerks and transport contracts in return for a place in the new administration. Army inspectors propose to replace that network with military offices and a permanent arsenal. Dawnclaw must choose between using the institutions he found and building ones that owe their existence to his command."
 hsm_cyanolisia.55.a:0 "Confirm the houses' rights in return for regular taxes."
 hsm_cyanolisia.55.b:0 "Appoint magistrates answerable to the crown."
 hsm_cyanolisia.55.c:0 "Bind the local notables to the supply service."
 hsm_cyanolisia.55.d:0 "Place the routes under military administration."
 hsm_cyanolisia.56.t:0 "The Western Industrial Bargain"
 hsm_cyanolisia.56.countess.d:0 "Aquileian industrialists will reopen their plants if contracts and titles remain enforceable. The treasury can guarantee those arrangements and finance new workshops, or retain tighter control of public contracts and concentrate its funds on industrial research. Neither course erases the war. What matters now is whether the next generation of orders is signed as a bargain or issued as an instruction."
 hsm_cyanolisia.56.dawnclaw.d:0 "The western factories survived unevenly. Some owners offer to meet army contracts in exchange for operating licences; inspectors want to sequester selected plants and establish state arsenals. Dawnclaw does not need another proclamation of victory. He needs to decide who will sign the pay sheets and who will answer when an order is late."
 hsm_cyanolisia.56.a:0 "Guarantee the industrial compact."
 hsm_cyanolisia.56.b:0 "Keep public contracts under treasury supervision."
 hsm_cyanolisia.56.c:0 "License the plants under enforceable army contracts."
 hsm_cyanolisia.56.d:0 "Sequester the plants needed for an imperial arsenal."
 hsm_cyanolisia.53.b:0 "Make the general staff answer to the crown."
 hsm_cyanolisia.53.c:0 "Inspect the provinces and fund their recovery."
 hsm_cyanolisia.57.t:0 "Petitions Beyond the Timetable"
 hsm_cyanolisia.57.d:0 "The imperial tour has acquired an audience that Dawnclaw's timetable did not anticipate. Provincial delegates want Grover to hear complaints directly. A small chancery for civilian petitions would give the emperor a narrow but real public function; a staff office would keep every request within the military chain of command. Neither arrangement hands him the government.\n\n[Root.GetHSMCyaEducation]"
 hsm_cyanolisia.57.a:0 "Allow a chancery for civilian petitions."
 hsm_cyanolisia.57.b:0 "Route every petition through the staff."
 hsm_cyanolisia.58.t:0 "An Army After the War"
 hsm_cyanolisia.58.d:0 "The last fronts have fallen silent, but mobilization orders still govern workshops and households. One commission proposes placing released specialists in civilian industry. Another wants a smaller permanent army with trained reserves and a settled programme of instruction. We cannot build both systems from the same first allocation."
 hsm_cyanolisia.58.a:0 "Return specialists to civilian production."
 hsm_cyanolisia.58.b:0 "Build a professional army and trained reserve."
 hsm_cyanolisia.59.t:0 "The First Peace Budget"
 hsm_cyanolisia.59.d:0 "The reconstruction ledger names towns rather than fronts. Provincial delegates ask for workshops close to their workers and markets. The central institutes propose a common programme of industrial research whose benefits will arrive later. The question is not whether to rebuild, but where the first peace budget should begin."
 hsm_cyanolisia.59.a:0 "Build in the northern, lake and western provinces."
 hsm_cyanolisia.59.b:0 "Finance a common industrial research programme."
 hsm_cyanolisia.60.t:0 "What Outlasts the Campaigns"
 hsm_cyanolisia.60.living.d:0 "Griffonia has been brought within the imperial settlement. The crown still has to determine which powers belong to provincial institutions and which must remain with the central government. If Grover has not yet assumed personal rule, these statutes bind the regency without cancelling its duty to hand him authority. If he already rules, they define the machinery he has inherited.\n\n[Root.GetHSMCyaNorthSettlement]\n[Root.GetHSMCyaLakeSettlement]\n[Root.GetHSMCyaWestSettlement]\n\n[Root.GetHSMCyaCrownPolicy]"
 hsm_cyanolisia.60.puppet.d:0 "Grover wears the crown, but Dawnclaw's offices still govern. Peace removes the excuse that every question must wait until the next campaign. The military compact can now be written into a permanent division of duties, with the throne's limited public role expressly defined. This is an institutional settlement, not a second coronation.\n\n[Root.GetHSMCyaCrownPolicy]"
 hsm_cyanolisia.60.dead.d:0 "Grover is dead. Neither victory nor a legal formula can restore him, and no agreed successor has emerged. Provincial delegates and senior officials must decide how appointments, budgets and a future transfer of executive authority will work without him. A chartered civil order, a permanent service administration or a council charged with writing succession procedures can give the state continuity; none can invent an heir.\n\n[Root.GetHSMCyaNorthSettlement]\n[Root.GetHSMCyaLakeSettlement]\n[Root.GetHSMCyaWestSettlement]"
 hsm_cyanolisia.60.a:0 "Guarantee provincial institutions within the imperial order."
 hsm_cyanolisia.60.b:0 "Define the duties of a permanent service administration."
 hsm_cyanolisia.60.c:0 "Commission succession statutes, without naming an heir."
 hsm_cyanolisia.58.defer:0 "The conditions have changed; reconvene after the crisis."
 hsm_cyanolisia.59.defer:0 "The conditions have changed; reconvene after the crisis."
 hsm_cyanolisia.60.defer:0 "The conditions have changed; reconvene after the crisis."
 hsm_cyanolisia.61.t:0 "An Imperial Compact"
 hsm_cyanolisia.61.d:0 "[From.GetName] proposes turning our alliance into a formal place within its empire. We would retain our territory and domestic administration, but become an autonomous subject and surrender independent foreign policy. Acceptance is voluntary. If the diplomatic situation has changed, we may decline without ceding land."
 hsm_cyanolisia.61.a:0 "Accept subject status under the imperial compact."
 hsm_cyanolisia.61.b:0 "Retain our independence."
 hsm_cyanolisia.62.t:0 "The Compact Is Accepted"
 hsm_cyanolisia.62.d:0 "[From.GetName] has accepted subject status within the empire. Its territory remains under its own administration, while its foreign policy now belongs to the imperial settlement. No new cores have been created."
 hsm_cyanolisia.62.a:0 "Record the agreement."
 hsm_cyanolisia.63.t:0 "The Compact Is Declined"
 hsm_cyanolisia.63.d:0 "[From.GetName] will not exchange independence for a place in the empire. The refusal leaves the alliance intact and transfers no territory. Any further pressure must respect the diplomatic arrangements that still bind us."
 hsm_cyanolisia.63.a:0 "The territorial question remains open."
 HSM_CYA_history_northern_charters:0 "Northern towns retain their charters and tax obligations."
 HSM_CYA_history_northern_crown_offices:0 "The North is governed through permanent crown offices."
 HSM_CYA_history_northern_local_officers:0 "Local officers hold imperial commissions in the northern garrisons."
 HSM_CYA_history_northern_staff_garrisons:0 "The general staff appoints the northern garrison commanders."
 HSM_CYA_history_north_unsettled:0 "The northern administration has not yet received a lasting settlement."
 HSM_CYA_history_lake_houses_confirmed:0 "The lake houses retain a recognized role in taxation and government."
 HSM_CYA_history_lake_crown_magistrates:0 "Crown magistrates administer the lake provinces."
 HSM_CYA_history_lake_service_nobility:0 "Local notables serve the army's lake supply network."
 HSM_CYA_history_lake_military_administration:0 "Military offices control the lake routes and arsenal."
 HSM_CYA_history_lake_unsettled:0 "The lake provinces still await their administrative settlement."
 HSM_CYA_history_western_industrial_compacts:0 "Western industrial property is protected by negotiated contracts."
 HSM_CYA_history_western_public_contracts:0 "The treasury supervises western public contracts and research."
 HSM_CYA_history_western_licensed_industry:0 "Western factories operate under army licences and contracts."
 HSM_CYA_history_western_sequestered_arsenals:0 "Selected western factories have become state arsenals."
 HSM_CYA_history_west_unsettled:0 "The western industrial settlement remains undecided."
 HSM_CYA_history_grover_lesson_mercy:0 "Grover remembers lessons in mercy: authority creates obligations towards those it governs."
 HSM_CYA_history_grover_lesson_authority:0 "Grover was taught that authority is a duty, not merely a title."
 HSM_CYA_history_grover_lesson_frontier:0 "Reports from the frontier taught Grover to ask how decisions reach the provinces."
 HSM_CYA_history_education_unsettled:0 "Grover's earlier education was not directed by this government; the council must address the ruler before it."
 HSM_CYA_history_grover_guarantees_charters:0 "Grover has already promised to uphold provincial charters; the new statutes must honour that undertaking."
 HSM_CYA_history_grover_civilian_oversight:0 "Grover has demanded civilian oversight of the staff; the permanent order must specify who can enforce it."
 HSM_CYA_history_grover_provincial_inspections:0 "Grover has made provincial recovery his first priority; ministries must account for their work outside the capital."
 HSM_CYA_history_puppet_civil_audiences:0 "Grover's civilian petition office has a narrow recognized role, although executive power remains elsewhere."
 HSM_CYA_history_puppet_staff_audiences:0 "The throne's petitions still pass through the staff; the emperor has no independent executive office."
