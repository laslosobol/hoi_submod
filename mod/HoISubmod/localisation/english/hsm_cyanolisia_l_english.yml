 HSM_CYA_DIRECTORATE_communism_ADJ:0 "Cyanolisian"
 hsm_cyanolisia.47.t:0 "The Northern Standards"
 hsm_cyanolisia.47.countess.d:0 "The Countess's envoys carry charters bearing Griffenheim's seal northward. Some courts bargain for their assemblies; others count the garrisons behind the words. The regency must pay its negotiators and turn their promises into a common law."
 hsm_cyanolisia.47.dawnclaw.d:0 "Northern banners do not hurry to bow to Griffenheim. Dawnclaw sends ultimatums, but his staff knows each capital will demand a separate settlement or campaign. Military victory alone will not build a working administration."
 hsm_cyanolisia.47.a:0 "Open a northern affairs office."
 hsm_cyanolisia.48.t:0 "Across the River"
 hsm_cyanolisia.48.countess.d:0 "Across the river is no empty square on an imperial map. The federation, local crowns, and town councils speak for their own people. The Countess orders the future mandates mapped before the campaign: victory must not mean annexing every village."
 hsm_cyanolisia.48.dawnclaw.d:0 "Dawnclaw's staff plots crossings and supply lines. Draft mandates are pinned beside the field maps: after the campaign the ponies will live under imperial supervision, not become provinces of Griffenheim."
 hsm_cyanolisia.48.a:0 "Prepare an administration across the river."
 hsm_cyanolisia.49.t:0 "The Edge of the Imperial Core"
 hsm_cyanolisia.49.d:0 "The eastern griffon districts can be tied to Griffenheim by courts, taxes, and rail. Across the river, however, pony councils and hill chiefs will not become imperial provinces by changing the ink on a map. The chancery proposes dependent commissariats, each with local officials beneath an imperial governor."
 hsm_cyanolisia.49.a:0 "Have the chancery draft the decrees."
 hsm_cyanolisia.50.t:0 "The West Remembers Its Crowns"
 hsm_cyanolisia.50.countess.d:0 "Aquileian representatives and western princes heard the regency's envoys separately. The Countess offers each court a place under common law, but no treaty erases an old claim. Judges, archives, and patience will be needed."
 hsm_cyanolisia.50.dawnclaw.d:0 "Dawnclaw's staff draws arrows across the west. Aquileia and the old principalities see the end of their crowns in those maps. To hold them after victory, Griffenheim will need working courts as well as garrisons."
 hsm_cyanolisia.50.a:0 "Open the western archives."
 hsm_cyanolisia.51.t:0 "The Southern Compacts"
 hsm_cyanolisia.51.countess.d:0 "The southern crowns trade across the sea and will not recognize Griffenheim from imperial memory alone. The Countess prepares agreements on ports and customs beside the campaign plans: the Empire must govern what it conquers."
 hsm_cyanolisia.51.dawnclaw.d:0 "The southern campaign will not end at the last land border. Ports, islands, and sea lanes need separate garrisons and their own supply staff. Dawnclaw gives fleet and army their common orders."
 hsm_cyanolisia.51.a:0 "Prepare the southern staff."
 HSM_CYA_reform_field_command:0 "Reform the Field Command"
 HSM_CYA_reform_field_command_desc:0 "The coast guard, frontier garrisons, and palace officers have spent too long answering to different desks. A common field command will teach them whose orders take precedence when the first alarm sounds."
 HSM_CYA_standardise_field_equipment:0 "Standardise Field Equipment"
 HSM_CYA_standardise_field_equipment_desc:0 "Every regiment has guarded its own stores and favored its own rifle. The arsenals will issue common patterns so a battalion sent north can be supplied by more than the quartermaster who raised it."
 HSM_CYA_officer_academy:0 "Cyanolisian Officer Academy"
 HSM_CYA_officer_academy_desc:0 "Proven sergeants will sit beside the sons of court families over the same maps. The academy cannot remove their loyalties, but it can give them a shared language before the army outgrows its old commanders."
 HSM_CYA_frontier_supply_corps:0 "Frontier Supply Corps"
 HSM_CYA_frontier_supply_corps_desc:0 "A frontier unit is only as stubborn as the road behind it. Drivers, mechanics, and depot clerks will answer to one corps instead of waiting for each local commander to improvise a convoy."
 HSM_CYA_combined_arms_school:0 "Combined Arms School"
 HSM_CYA_combined_arms_school_desc:0 "Infantry advances have too often outrun their guns, while workshops build to peacetime schedules. Exercises will make the regiments, batteries, and arsenals plan the same battle."
 HSM_CYA_joint_general_staff:0 "Joint General Staff"
 HSM_CYA_joint_general_staff_desc:0 "The reform committees can be dismissed; a general staff must survive the ministers who appointed it. Its maps will cover the coast, the Evi roads, and eventually the long approach to Griffenheim."
 HSM_CYA_crown_field_staff:0 "Crown Field Staff"
 HSM_CYA_crown_field_staff_desc:0 "The Countess will not leave behind a collection of private armies. Officers must learn to serve the crown rather than her household, with orders recorded by the court as well as the barracks."
 HSM_CYA_dawnclaw_operational_staff:0 "Dawnclaw's Operational Staff"
 HSM_CYA_dawnclaw_operational_staff_desc:0 "Dawnclaw spreads the old imperial maps across a Cyanolisian table. His officers learn to think in rail timetables, reserves, and campaigns that do not end at the next border."
 HSM_CYA_border_defense_staff:0 "Border Defense Staff"
 HSM_CYA_border_defense_staff_desc:0 "The march cannot win by imitating a great power's offensives. Its staff studies the passes, stores supplies behind them, and plans how a smaller army can make an invader pay for every road."
 HSM_CYA_coastal_reconstruction:0 "Rebuild the Coastal Economy"
 HSM_CYA_coastal_reconstruction_desc:0 "Closed workshops stand beside busy quays, and young workers still leave for wages elsewhere. Reopening the coast's factories is the first promise that modernization will reach beyond the Countess' ledgers."
 HSM_CYA_coastal_transport_authority:0 "Coastal Transport Authority"
 HSM_CYA_coastal_transport_authority_desc:0 "Goods now wait at one station while empty wagons pass another. A transport authority will put the ports, workshops, and border depots on a timetable the same ministry can enforce."
 HSM_CYA_technical_institute:0 "Cyanolisian Technical Institute"
 HSM_CYA_technical_institute_desc:0 "The best mechanics are teaching apprentices beside broken machines. Give them laboratories, books, and paid time to test their designs, and their work may outlast any single minister."
 HSM_CYA_port_foundries:0 "Port Foundries"
 HSM_CYA_port_foundries_desc:0 "The port cannot live on imported fittings forever. Foundries and dockside shops will keep the fleet supplied while giving civilian merchants a reason to invest in the same waterfront."
 HSM_CYA_arsenal_network:0 "Arsenal Network"
 HSM_CYA_arsenal_network_desc:0 "One crowded arsenal can be shut by a strike, fire, or enemy raid. Smaller workshops, bound by common specifications, will keep the army armed even when the capital cannot."
 HSM_CYA_national_development_plan:0 "National Development Plan"
 HSM_CYA_national_development_plan_desc:0 "Rail officials, schoolmasters, and factory owners have each asked for funds as if the others did not exist. A public plan will force them to answer the same question: what sort of country are they building?"
 HSM_CYA_crown_credit_authority:0 "Crown Credit Authority"
 HSM_CYA_crown_credit_authority_desc:0 "The Countess asks old families to lend against the future crown, not merely their own estates. Their money can raise towns and workshops; the court must make sure the creditors do not come to own them."
 HSM_CYA_dawnclaw_procurement_office:0 "Dawnclaw's Procurement Office"
 HSM_CYA_dawnclaw_procurement_office_desc:0 "Dawnclaw knows which firms once supplied Griffenheim and which directors will accept a discreet order. A single procurement office turns those contacts into rifles, vehicles, and obligations."
 HSM_CYA_frontier_development_board:0 "Frontier Development Board"
 HSM_CYA_frontier_development_board_desc:0 "Surveyors know the villages that generals mark as blank space. Give them a board with a budget, and frontier roads and depots can be built for the residents who must keep them open."
 HSM_CYA_southern_fleet_yards:0 "Southern Fleet Yards"
 HSM_CYA_southern_fleet_yards_desc:0 "The old slips are still crowded with rusting hulls and unpaid crews. Reopening the yards will give the southern coast ships it can repair itself, rather than a fleet that exists only on paper."
 HSM_CYA_coastal_patrols:0 "Coastal Patrols"
 HSM_CYA_coastal_patrols_desc:0 "Smugglers and foreign scouts know the inlets better than the Admiralty. Regular patrols will turn the coast from a line on headquarters maps into water the fleet actually watches."
 HSM_CYA_naval_air_school:0 "Naval Air School"
 HSM_CYA_naval_air_school_desc:0 "Ships cannot guard every mile between the ports. Pilots trained alongside captains will spot the convoys, raiders, and weather that a distant Admiralty learns about too late."
 HSM_CYA_dockyard_program:0 "Dockyard Program"
 HSM_CYA_dockyard_program_desc:0 "A fleet built in bursts leaves skilled workers idle between contracts. Permanent orders and larger slips will make shipbuilding a trade the port can pass from one generation to the next."
 HSM_CYA_raise_austernfischer:0 "Raise the Austernfischer"
 HSM_CYA_raise_austernfischer_desc:0 "The Austernfischer has rested in the harbour long enough to become a story told by old sailors. Raising her will cost steel and patience, but the crew that sees her return may believe the fleet has a future."
 HSM_CYA_seaborne_corps:0 "Seaborne Corps"
 HSM_CYA_seaborne_corps_desc:0 "A landing is decided before the first boat touches shore. Marines must train with the crews who carry them, and both must know how to fight when the supply line is still at sea."
 HSM_CYA_admiralty_compact:0 "Admiralty Compact"
 HSM_CYA_admiralty_compact_desc:0 "The captains, air officers, and shore commanders have spent years protecting separate budgets. The compact gives them a single plan and makes each service answer for the others' losses."
 HSM_CYA_imperial_supply_grid:0 "Imperial Supply Grid"
 HSM_CYA_imperial_supply_grid_desc:0 "Griffenheim's warehouses and the southern rail system were built for rival states. Joining their schedules is less glorious than taking the capital, and more important to any army that intends to march beyond it."
 HSM_CYA_griffonian_armament_standard:0 "Griffonian Armament Standard"
 HSM_CYA_griffonian_armament_standard_desc:0 "Captured depots hold weapons made for different armies and different rulers. A common standard will let the provinces supply one field force without erasing the workshops that know how to make its parts."
 HSM_CYA_quartermaster_service:0 "Quartermaster Service"
 HSM_CYA_quartermaster_service_desc:0 "A truck stranded for want of one part is no use to a marching regiment. Quartermasters will count fuel, repairs, and spare wheels as carefully as officers count rifles."
 HSM_CYA_railway_battalions:0 "Railway Battalions"
 HSM_CYA_railway_battalions_desc:0 "Tracks near the frontier are repaired after every crisis and forgotten after every peace. Permanent railway battalions will keep the line open before an army needs it."
 HSM_CYA_signal_companies:0 "Signal Companies"
 HSM_CYA_signal_companies_desc:0 "A broken wire can leave a whole battalion fighting yesterday's battle. Signal companies will carry orders through bad roads and worse weather while learning when silence matters more than speed."
 HSM_CYA_field_hospitals:0 "Field Hospitals"
 HSM_CYA_field_hospitals_desc:0 "The wounded have too often disappeared between the front and the nearest town. Medical teams, wagons, and clear evacuation routes will give soldiers a reason to trust the army that sent them out."
 HSM_CYA_frontier_artillery:0 "Frontier Artillery"
 HSM_CYA_frontier_artillery_desc:0 "The border regiments cannot always wait for guns borrowed from the capital. Their own batteries will know the passes and be in position before the first enemy column appears."
 HSM_CYA_engineer_brigades:0 "Engineer Brigades"
 HSM_CYA_engineer_brigades_desc:0 "The same hands that throw up a defensive wall must know how to cross one. Engineer brigades will train for bridges, demolition, and the patient labor that keeps a line intact."
 HSM_CYA_aerial_reconnaissance:0 "Aerial Reconnaissance"
 HSM_CYA_aerial_reconnaissance_desc:0 "Maps from the last war cannot show this year's roads or the enemy's new camps. Forward pilots will bring back photographs and reports before the staff commits its reserves."
 HSM_CYA_motorised_reserves:0 "Motorised Reserves"
 HSM_CYA_motorised_reserves_desc:0 "A continental army cannot make every crisis wait for infantry on foot. Mechanics and drivers will form a reserve able to move from one threatened railway to the next."
 HSM_CYA_crown_military_colleges:0 "Crown Military Colleges"
 HSM_CYA_crown_military_colleges_desc:0 "The Countess needs officers who will still obey when her regency ends, whatever happens to Grover. Their commissions carry her seal, but their oath binds them to the crown beyond her household."
 HSM_CYA_dawnclaw_war_college:0 "Dawnclaw's War College"
 HSM_CYA_dawnclaw_war_college_desc:0 "Dawnclaw does not want officers who merely admire his victories. He wants staff who can keep three campaigns supplied, conceal a fourth, and continue working when he is absent."
 HSM_CYA_imperial_officer_exchange:0 "Imperial Officer Exchange"
 HSM_CYA_imperial_officer_exchange_desc:0 "Former enemies arrive with different drill books and memories of the same war. Exchange postings will make them learn each other's formations before they command the provinces together."
 HSM_CYA_continental_ordnance:0 "Continental Ordnance"
 HSM_CYA_continental_ordnance_desc:0 "The old capital's arsenals once armed an empire; conquest has filled them with mismatched stock. Refit the lines and set one standard for the armies still marching across Griffonia."
 HSM_CYA_port_customs_houses:0 "Customs and Freight Offices"
 HSM_CYA_port_customs_houses_desc:0 "Cargo vanishes between the harbour books and the inland warehouses. Customs and freight clerks will reconcile the two, turning missing duties into wages for new workshops."
 HSM_CYA_coastal_quarries:0 "Southern Quarries"
 HSM_CYA_coastal_quarries_desc:0 "The inland quarries supply stone but send their ore away unworked. Surveyors and smelters will keep more of that value in southern towns, where the roads to the coast begin."
 HSM_CYA_electrify_the_workshops:0 "Electrify the Workshops"
 HSM_CYA_electrify_the_workshops_desc:0 "Old workshops close at dusk even when orders are waiting. Reliable power and trained electricians will let machinists work to a schedule set by demand, not daylight."
 HSM_CYA_apprenticeship_halls:0 "Apprenticeship Halls"
 HSM_CYA_apprenticeship_halls_desc:0 "A factory can import machines, not the hands that know their faults. Apprenticeship halls will put experienced workers beside young recruits before the next expansion empties the workshops of skill."
 HSM_CYA_rural_cooperatives:0 "Rural Cooperatives"
 HSM_CYA_rural_cooperatives_desc:0 "The countryside is asked to feed the cities and wait for prosperity to return. Cooperatives will give villages tools, credit, and a claim on the industries that grow from their labor."
 HSM_CYA_industrial_standards_board:0 "Industrial Standards Board"
 HSM_CYA_industrial_standards_board_desc:0 "One factory's fittings still fail in another's machines. Inspectors, engineers, and owners will agree on common measures before the army and the railways pay for every disagreement."
 HSM_CYA_crown_municipal_loans:0 "Crown Municipal Loans"
 HSM_CYA_crown_municipal_loans_desc:0 "Provincial councils know which bridges and workshops they need, but cannot borrow on the Countess' terms. Crown guarantees will let them build while binding their accounts to her future regency."
 HSM_CYA_dawnclaw_factory_contracts:0 "Dawnclaw's Factory Contracts"
 HSM_CYA_dawnclaw_factory_contracts_desc:0 "Dawnclaw's contracts promise steady orders to firms willing to surrender their books for inspection. The arsenals gain certainty; their directors learn that a missed quota has political consequences."
 HSM_CYA_griffenheim_rail_hub:0 "Griffenheim Rail Hub"
 HSM_CYA_griffenheim_rail_hub_desc:0 "The rails into Griffenheim were laid for a capital that commanded the south. Joining them to Cyanolisia's lines will make that old geography useful to the new government."
 HSM_CYA_herzland_industrial_survey:0 "Herzland Industrial Survey"
 HSM_CYA_herzland_industrial_survey_desc:0 "Occupation officers can seize a factory without knowing whether its furnaces still work. Engineers will inventory the mines, workshops, and damaged lines before the capital promises what it cannot yet produce."
 HSM_CYA_evi_freight_corridor:0 "Evi Freight Corridor"
 HSM_CYA_evi_freight_corridor_desc:0 "Evi's roads carried armies before they carried ordinary freight. A dependable corridor from Griffenheim will let the valley receive goods without waiting for the next campaign to repair its bridges."
 HSM_CYA_imperial_research_exchange:0 "Imperial Research Exchange"
 HSM_CYA_imperial_research_exchange_desc:0 "Cyanolisian engineers built under scarcity; Herzland scholars worked beneath old imperial patronage. Put their institutes in correspondence and let each test what the other once dismissed."
 HSM_CYA_convoy_escorts:0 "Convoy Escorts"
 HSM_CYA_convoy_escorts_desc:0 "Merchant captains cannot plan a voyage around rumours of raiders. Escort schedules, charts, and reliable refuelling will make the sea lanes usable even when the coast is at war."
 HSM_CYA_naval_signals_school:0 "Naval Signals School"
 HSM_CYA_naval_signals_school_desc:0 "A warning that reaches one ship but not the squadron can lose the whole convoy. Signals officers will practice speaking across water, weather, and the competing habits of every captain."
 HSM_CYA_seaplane_stations:0 "Seaplane Stations"
 HSM_CYA_seaplane_stations_desc:0 "The fleet needs eyes beyond the harbour mouth. Seaplane crews and shore observers will chart movement along the coast before it becomes a surprise reported by a missing ship."
 HSM_CYA_marine_training_ground:0 "Marine Training Ground"
 HSM_CYA_marine_training_ground_desc:0 "The first landing party cannot bring the whole army ashore with it. Marines will train to hold a pier, clear a road, and survive until the transports return."
 HSM_CYA_coastal_defence_batteries:0 "Coastal Defence Batteries"
 HSM_CYA_coastal_defence_batteries_desc:0 "An enemy need not take the port from the sea; the roads behind it are just as vulnerable. Batteries and inland strongpoints will make the harbour costly to seize from either direction."
 HSM_CYA_bluewater_shipyards:0 "Bluewater Shipyards"
 HSM_CYA_bluewater_shipyards_desc:0 "A patrol fleet can guard a coast, not sustain an expedition. Larger slips and long contracts will give shipbuilders the time to produce vessels meant to stay at sea."
 HSM_CYA_imperial_convoy_authority:0 "Imperial Convoy Authority"
 HSM_CYA_imperial_convoy_authority_desc:0 "New provinces bring ports with their own masters and competing schedules. An imperial convoy authority will make them answer to one supply plan without pretending the sea has become safe."
 HSM_CYA_expeditionary_fleet:0 "Expeditionary Fleet"
 HSM_CYA_expeditionary_fleet_desc:0 "The southern crown and distant islands cannot be reached by decree from Griffenheim. A fleet built for long passages will carry the army, guard its return, and keep the Empire connected after victory."
