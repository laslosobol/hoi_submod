l_english:
 hsm_cyanolisia.1.t:0 "A Fugitive From Griffenheim"
 hsm_cyanolisia.1.d:0 "The court at Griffenheim has condemned Ferdinand Dawnclaw after his failed coup, but a forged transport order saved him from the scaffold. He reaches the Countess's household under a false name, carrying army records and letters to imperial suppliers. Sanctuary would put that knowledge at Cyanolisia's disposal. It would also make the household shelter a fugitive whom the imperial court has every reason to hunt."
 hsm_cyanolisia.1.a:0 "Hide him as the Countess' assistant."
 hsm_cyanolisia.1.b:0 "Send him away before the Empire notices."
 HSM_CYA_ferdinand_dawnclaw:0 "Ferdinand Dawnclaw"
 HSM_CYA_ferdinand_dawnclaw_desc:0 "The exiled imperial commander reads roads, enemy formations, and court whispers with the same cold attention. The Countess keeps his talents inside her staff, where his plans are useful and his ambitions can be watched."
 HSM_CYA_dawnclaw_country_leader_desc:0 "The exile has traded a borrowed room for ministries and a general staff. Revenge brought Dawnclaw to Cyanolisia; the institutions he builds there may keep following his orders long after Griffenheim falls."
 HSM_CYA_dawnclaw_assistant_appointed_tt:0 "Ferdinand Dawnclaw will be appointed as a Political Advisor and cannot be replaced."
 HSM_CYA_lowenstein_motor_pool:0 "Löwenstein Cyanolisian Workshops"
 HSM_CYA_lowenstein_motor_pool_desc:0 "A small team of Löwenstein engineers and procurement agents followed Dawnclaw's escape route. They register local workshops through civilian partners and take ordinary transport contracts; no signboard advertises the fugitive who introduced them. This is a new expatriate branch, not the relocation of the entire parent firm."
 HSM_CYA_reichswaffen_fieldworks:0 "Reichswaffen Support Workshops"
 HSM_CYA_reichswaffen_fieldworks_desc:0 "Former Reichswaffen procurement staff establish support-equipment workshops through Cyanolisian commercial partners. Their contacts help obtain patterns and machine tools, while civilian contracts conceal the political connection. The Griffenheim parent company has not been transferred to the Countess."
 HSM_CYA_dawnclaw_fascism_party:0 "Herzland Staff"
 HSM_CYA_dawnclaw_fascism_party_long:0 "Dawnclaw's Herzland Staff"
 HSM_CYA_dawnclaw_griffonian_files:0 "Dawnclaw's Griffenheim Files"
 HSM_CYA_dawnclaw_griffonian_files_desc:0 "His Griffenheim files hold rail schedules beside names of officers he once trusted. To the Countess they are intelligence; to Dawnclaw they are a route back into the capital."
 hsm_cyanolisia.2.t:0 "The Price Of Sanctuary"
 hsm_cyanolisia.2.d:0 "Dawnclaw has survived the first days in hiding. His name remains absent from the ledgers, his rooms are listed as storage, and the Countess' staff have learned not to ask why a minor assistant receives military reports. Now the court must decide what this dangerous guest is actually for."
 hsm_cyanolisia.2.a:0 "He is an adviser, nothing more."
 hsm_cyanolisia.2.b:0 "Bind him to the court."
 hsm_cyanolisia.2.c:0 "Send him on; entrust the cabinet to imperial officials."
 hsm_cyanolisia.3.t:0 "A Marriage Of Convenience"
 hsm_cyanolisia.3.d:0 "The marriage is entered in a sealed household register, witnessed by a trusted cleric and two officers. Outside that room, the bridegroom remains the Countess's obscure military assistant. Taillow gains access to imperial military connections; Dawnclaw gains a protected place in her household and a claim to influence its decisions. Neither mistakes the bargain for affection. Both know that a public announcement would also tell Griffenheim where to find him."
 hsm_cyanolisia.3.a:0 "Let the court whisper."
 hsm_cyanolisia.4.t:0 "Dawnclaw's Staff"
 hsm_cyanolisia.4.d:0 "The palace guard no longer waits for civilian clerks. Reports pass through Dawnclaw's operational staff before they reach the Countess, and officers increasingly speak of security, discipline, and the enemies within."
 hsm_cyanolisia.4.a:0 "He knows how to impose order."
 hsm_cyanolisia.5.t:0 "The Countess Presides"
 hsm_cyanolisia.5.d:0 "Taillow has allowed Dawnclaw to advise, but not command. The marriage remains politically useful, his files are valuable, his fury is contained, and the court has learned that the exile survives only because the Countess permits it."
 hsm_cyanolisia.5.a:0 "The court remembers who rules."
 hsm_cyanolisia.10.t:0 "Knives From Griffenheim"
 hsm_cyanolisia.10.d:0 "The fiction surrounding Dawnclaw has frayed. A courier is missing, a servant has been bribed, and armed strangers have been traced through the port. The network that hunted him after the failed coup has not forgotten its commission. Even the fall of a ministry cannot dissolve every oath of vengeance, private purse or surviving imperial intelligence cell."
 hsm_cyanolisia.10.a:0 "Move him before they strike."
 hsm_cyanolisia.10.b:0 "The agents find their mark."
 hsm_cyanolisia.11.t:0 "The Cover Slips"
 hsm_cyanolisia.11.d:0 "Too many letters have been burned, too many officers have visited after dark, and too many servants have seen the Countess' assistant reading military dispatches. The secret is no longer contained inside the palace."
 hsm_cyanolisia.11.a:0 "Griffenheim will hear of this."
 hsm_cyanolisia.12.t:0 "An Imperial Cabinet For Cyanolisia"
 hsm_cyanolisia.12.d:0 "Dawnclaw no longer has a place in the government. Griffenheim's administrative mission has used the opening to offer a cabinet staffed by imperial-trained officials and their Cyanolisian partners. Its advisers bring commercial contacts and the prospect of imperial protection, but also protected contracts, access to public accounts and a voice in appointments. The Countess keeps her title. Beneath it, the government's dependence on the mission is becoming difficult to disguise."
 hsm_cyanolisia.12.a:0 "Order, at a price."
 HSM_CYA_frontier_march_path_tt:0 "Dawnclaw will advise the frontier command while the Countess keeps him out of court politics."
 HSM_CYA_marriage_path_tt:0 "Their marriage opens a struggle for influence at court, shaped through decisions."
 HSM_CYA_imperial_admin_path_tt:0 "Imperial administration becomes available. If Dawnclaw is still alive, ending his asylum removes him from office and ends the concealment crisis; it does not execute him."
 HSM_CYA_proxy_rule_trade:0 "Imperial Trade Supervision"
 HSM_CYA_power_struggle_unlocked_tt:0 "The court struggle between Dawnclaw and the Countess can now be shaped through decisions."
 HSM_CYA_dawnclaw_dominance_tt:0 "Dawnclaw dominates the court. His open hand in security will increase weekly exposure."
 HSM_CYA_countess_dominance_tt:0 "The Countess dominates the court. Dawnclaw remains hidden for longer."
 HSM_CYA_assassination_prevented_tt:0 "Dawnclaw is moved to a safer hiding place for a time."
 HSM_CYA_exposure_minus_2_tt:0 "Dawnclaw's exposure is reduced by §G2§!."
 HSM_CYA_exposure_minus_3_tt:0 "Dawnclaw's exposure is reduced by §G3§!."
 HSM_CYA_exposure_minus_4_tt:0 "Dawnclaw's exposure is reduced by §G4§!."
 HSM_CYA_exposure_minus_5_tt:0 "Dawnclaw's exposure is reduced by §G5§!."
 HSM_CYA_advisor_role_confirmed_tt:0 "Dawnclaw's role is reduced to visible advisory work. Imperial agents will no longer pursue the assassination loop."
 HSM_CYA_hide_the_fugitive:0 "Hide The Fugitive"
 HSM_CYA_hide_the_fugitive_desc:0 "A false name, a locked room, and a few carefully misplaced records may keep Ferdinand Dawnclaw hidden long enough for the Countess' court to decide what he is truly for."
 HSM_CYA_an_unlikely_marriage:0 "An Unlikely Marriage"
 HSM_CYA_an_unlikely_marriage_desc:0 "Bind Dawnclaw to the Countess' court by marriage, turning a hidden exile into a permanent crisis of household power."
 HSM_CYA_frontier_march_plan:0 "The Frontier March Plan"
 HSM_CYA_frontier_march_plan_desc:0 "Keep Dawnclaw as a quiet defensive adviser and turn Cyanolisia's vulnerable borderlands into a disciplined march."
 HSM_CYA_reorganise_border_forces:0 "Standardise the Border Forces"
 HSM_CYA_reorganise_border_forces_desc:0 "Let Dawnclaw quietly audit training manuals, supply tables, and field routines until the border forces begin to resemble a modern army."
 HSM_CYA_modernise_internal_intelligence:0 "Modernise Internal Intelligence"
 HSM_CYA_modernise_internal_intelligence_desc:0 "Fold Dawnclaw's methods into a modest internal intelligence bureau, proving to Griffenheim's observers that he is an adviser, not a pretender."
 HSM_CYA_frontier_drill_standards:0 "Frontier Drill Standards"
 HSM_CYA_frontier_drill_standards_desc:0 "Turn Dawnclaw's first inspection notes into repeatable border drills, supply checks, and field routines."
 HSM_CYA_frontier_signals_network:0 "Frontier Signals Network"
 HSM_CYA_frontier_signals_network_desc:0 "Link the internal intelligence office with border posts, couriers, and listening rooms without making Dawnclaw look like a claimant."
 HSM_CYA_local_supply_depots:0 "Local Supply Depots"
 HSM_CYA_local_supply_depots_desc:0 "Stock the march with local depots and repair stores so the border forces can fight without waiting on the capital."
 HSM_CYA_fortify_against_minotauria:0 "Fortify Against Minotauria"
 HSM_CYA_fortify_against_minotauria_desc:0 "Turn the southern approaches into prepared positions, supply sheds, and mapped fallback lines."
 HSM_CYA_watch_sicameon:0 "Watch Sicameon"
 HSM_CYA_watch_sicameon_desc:0 "Extend the signals network toward the coast and make Sicameon a watched frontier rather than an ignored neighbour."
 HSM_CYA_defensive_victory_claims:0 "Defensive Victory Claims"
 HSM_CYA_defensive_victory_claims_desc:0 "Prepare the legal papers and military maps that would let Cyanolisia demand compensation after a successful defensive war."
 HSM_CYA_proclaim_cyanolisian_march:0 "The Cyanolisian March"
 HSM_CYA_proclaim_cyanolisian_march_desc:0 "Give the frontier system a public name, a chain of command, and enough local pride to survive without becoming Dawnclaw's throne."
 HSM_CYA_civilian_liaison_offices:0 "Civilian Liaison Offices"
 HSM_CYA_civilian_liaison_offices_desc:0 "Give the Countess' clerks a permanent place inside security affairs, keeping Dawnclaw useful but surrounded by civilian procedure."
 HSM_CYA_codify_household_compact:0 "Codify The Household Compact"
 HSM_CYA_codify_household_compact_desc:0 "Write the court's new hierarchy into titles, signatures, and chains of command before any officer can pretend it is temporary."
 HSM_CYA_the_hidden_assistant:0 "The Hidden Assistant"
 HSM_CYA_the_hidden_assistant_desc:0 "Keep Dawnclaw close enough to advise and quiet enough that the Countess remains the only visible center of power."
 HSM_CYA_the_countess_alone:0 "The Countess Presides"
 HSM_CYA_the_countess_alone_desc:0 "Keep the marriage intact while making the court understand that Dawnclaw is protected by the Countess, useful to the Countess, and politically smaller than the Countess."
 HSM_CYA_recognise_outback_councils:0 "Recognise Outback Councils"
 HSM_CYA_recognise_outback_councils_desc:0 "Turn local minotaur intermediaries into registered councils, trading autonomy at the edges for calmer administration."
 HSM_CYA_palace_security_directorate:0 "Palace Security Directorate"
 HSM_CYA_palace_security_directorate_desc:0 "Let Dawnclaw formalize the palace guard, the courier watch, and the files that decide who may stand near the Countess."
 HSM_CYA_field_security_battalions:0 "Field Security Battalions"
 HSM_CYA_field_security_battalions_desc:0 "Raise disciplined security detachments for field headquarters and railway nodes before Dawnclaw risks open provincial policing."
 HSM_CYA_the_colonels_household:0 "Dawnclaw's Staff"
 HSM_CYA_the_colonels_household_desc:0 "Turn the palace's private security apparatus into Dawnclaw's personal staff, even if it still formally serves the Countess' court."
 HSM_CYA_the_revealed_exile:0 "The Revealed Exile"
 HSM_CYA_the_revealed_exile_desc:0 "Dawnclaw's role can no longer be treated as a harmless clerkship. If he rules from the shadows, the shadows must become disciplined."
 HSM_CYA_cabinet_procurement_board:0 "Cabinet Procurement Board"
 HSM_CYA_cabinet_procurement_board_desc:0 "Bring workshop orders under a cabinet board so military production recovers without escaping Imperial supervision."
 HSM_CYA_rationalise_proxy_quotas:0 "Rationalise Imperial Production Quotas"
 HSM_CYA_rationalise_proxy_quotas_desc:0 "Replace improvised demands with negotiated delivery schedules. Whether their backers remain in Griffenheim or now trade on their own account, the inspectors must state what they intend to take and when."
 HSM_CYA_dawnclaw_hiding:0 "Dawnclaw's Cover"
 HSM_CYA_dawnclaw_hiding_desc:0 "§YCurrent Exposure§!: §R[?Root.HSM_CYA_dawnclaw_exposure|0]§!/§Y10§!\n\nExposure rises by §R1§! every week while Dawnclaw remains hidden. The defensive path adds no extra pressure. Countess dominance adds §R+1§! weekly, while Dawnclaw dominance adds §R+2§! weekly.\n\nAt §Y7§! exposure, Griffenheim agents begin closing in. If exposure reaches §R10§!, the assassination fires. Countess-aligned decisions rely on paperwork and court alibis; Dawnclaw-aligned decisions are faster, harsher, and more politically costly."
 HSM_CYA_griffenheim_agents_closing_in:0 "Griffenheim Agents Closing In"
 HSM_CYA_griffenheim_agents_closing_in_desc:0 "Imperial agents have enough fragments to start tracing Dawnclaw's movements. Reduce his exposure below §Y7§! to break the trail before it reaches him."
 HSM_CYA_maintain_dawnclaw_cover:0 "Maintain Dawnclaw's Cover"
 HSM_CYA_maintain_dawnclaw_cover_desc:0 "Refresh the false papers, move the servants around, and make sure the Countess' assistant remains an assistant on paper."
 HSM_CYA_counterintelligence_sweep:0 "Counterintelligence Sweep"
 HSM_CYA_counterintelligence_sweep_desc:0 "Commit loyal officers to trace leaks, isolate suspect couriers, and smother the signs that Dawnclaw is acting from inside the court."
 HSM_CYA_stage_loyalist_raids:0 "Stage Loyalist Raids"
 HSM_CYA_stage_loyalist_raids_desc:0 "Dawnclaw's loyalists can raid suspected Imperial contacts before they report home, but such violence will shake the court."
 HSM_CYA_disappear_compromised_witnesses:0 "Disappear Compromised Witnesses"
 HSM_CYA_disappear_compromised_witnesses_desc:0 "A few servants, couriers, and minor officers know too much. Dawnclaw's men can solve that problem, though the silence will be noticed."
 HSM_CYA_rotate_palace_servants:0 "Rotate Palace Servants"
 HSM_CYA_rotate_palace_servants_desc:0 "Move maids, clerks, guards, and kitchen staff between households until no single witness can describe Dawnclaw's routine."
 HSM_CYA_courtly_alibi_network:0 "Courtly Alibi Network"
 HSM_CYA_courtly_alibi_network_desc:0 "The Countess' household can bury Dawnclaw under invitations, appointments, and false witnesses that make every Imperial report contradict another."
 HSM_CYA_false_griffenheim_leak:0 "False Griffenheim Leak"
 HSM_CYA_false_griffenheim_leak_desc:0 "Feed Imperial agents a convincing trail toward the wrong cellar, the wrong courier, and the wrong officer, buying Dawnclaw time at the price of another public disturbance."
 HSM_CYA_integrate_minotaur_outback:0 "Charter Outback Autonomy"
 HSM_CYA_integrate_minotaur_outback_desc:0 "Pacify the outback through registered local privileges, limited self-rule, and predictable obligations rather than direct assimilation."
 HSM_CYA_police_minotaur_outback:0 "Patrol The Minotaurian Outback"
 HSM_CYA_police_minotaur_outback_desc:0 "Dawnclaw rejects a bargain with the outback councils. Patrols will map the roads, informants will name the chiefs, and every settlement will learn which office issues its permits."
 CYA_policed_outback:0 "Patrolled Minotaurian Outback"
 CYA_policed_outback_desc:0 "Considerable forces are assigned to control the internal minotaurian districts. Patrols, registration, and pressure weaken local autonomy but allow the state to meet new demands."
 CYA_opened_outback:0 "Opened Minotaurian Outback"
 CYA_opened_outback_desc:0 "The internal minotaurian districts have received more legal channels for trade, local councils, and cooperation with Cyanolisian administration."
 CYA_ignored_outback:0 "Neglected Minotaurian Outback"
 CYA_ignored_outback_desc:0 "The internal minotaurian districts are left without enough supervision or reform, preserving old problems on the southern periphery."
 HSM_CYA_delegate_security_to_dawnclaw:0 "Delegate Security To Dawnclaw"
 HSM_CYA_delegate_security_to_dawnclaw_desc:0 "The Countess can give Dawnclaw the guards, the files, and the authority to question her own officers. Once he knows who enters the palace, he will know who truly governs it."
 HSM_CYA_expand_countess_cabinet:0 "Expand The Countess' Cabinet"
 HSM_CYA_expand_countess_cabinet_desc:0 "Strengthen civilian administration before the exile's officers become the only organized faction in court."
 HSM_CYA_install_imperial_cabinet:0 "Install The Imperial Cabinet"
 HSM_CYA_install_imperial_cabinet_desc:0 "With Dawnclaw dead or his asylum ended, imperial-trained officials offer a replacement administration. Their expertise brings conditions: protected contracts, access to public accounts and a voice in appointments. A surviving empire may sponsor the mission; without it, the officials must negotiate with the Countess in their own names."
 HSM_CYA_regularise_minotaur_administration:0 "Regularise Minotaur Administration"
 HSM_CYA_regularise_minotaur_administration_desc:0 "Replace emergency patrols with registered councils, controlled permits, and predictable tax offices in the outback."
 HSM_CYA_reopen_military_workshops:0 "Reopen Military Workshops"
 HSM_CYA_reopen_military_workshops_desc:0 "Restore a few idle workshops under cabinet supervision, enough to steady production without freeing the army from Imperial oversight."
 HSM_CYA_consolidate_proxy_cabinet:0 "Consolidate the Supervised Cabinet"
 HSM_CYA_consolidate_proxy_cabinet_desc:0 "Turn the temporary Imperial committee into a functioning administration that Cyanolisia's officials can survive inside."
 HSM_CYA_frontier_march_policy:0 "Cyanolisian March Policy"
 HSM_CYA_frontier_march_policy_desc:0 "Dawnclaw may inspect the border forts and correct their plans, but he will not command the court. The march is meant to protect Cyanolisia, not become the army of a claimant in waiting."
 HSM_CYA_reorganised_border_forces:0 "Reorganised Border Forces"
 HSM_CYA_reorganised_border_forces_desc:0 "The border forces have been restandardized through dull manuals, repeated drills, and Dawnclaw's unforgiving eye for small failures."
 HSM_CYA_frontier_drill_standards_idea:0 "Frontier Drill Standards"
 HSM_CYA_frontier_drill_standards_idea_desc:0 "Every frontier company now uses the same drills, supply checks, and defensive routines."
 HSM_CYA_internal_intelligence_modernisation:0 "Modernised Internal Intelligence"
 HSM_CYA_internal_intelligence_modernisation_desc:0 "Dawnclaw's knowledge now serves a limited internal intelligence office. The arrangement is visible enough to seem harmless and useful enough to keep."
 HSM_CYA_frontier_signals_network_idea:0 "Frontier Signals Network"
 HSM_CYA_frontier_signals_network_idea_desc:0 "Reports from the march now move through a quiet web of couriers, listening posts, and civilian intelligence clerks."
 HSM_CYA_local_supply_depots_idea:0 "Local Supply Depots"
 HSM_CYA_local_supply_depots_idea_desc:0 "Cyanolisia's border stores are small, dispersed, and boringly inventoried, which is exactly why they work."
 HSM_CYA_minotaurian_border_works:0 "Minotaurian Border Works"
 HSM_CYA_minotaurian_border_works_desc:0 "The southern approaches are prepared with bunkers, depots, field maps, and stubborn local garrisons."
 HSM_CYA_sicameon_watch_posts:0 "Sicameon Watch Posts"
 HSM_CYA_sicameon_watch_posts_desc:0 "Cyanolisian observers now watch the western approaches with couriers, signal stations, and quiet suspicion."
 HSM_CYA_proclaimed_cyanolisian_march:0 "Proclaimed Cyanolisian March"
 HSM_CYA_proclaimed_cyanolisian_march_desc:0 "The frontier has been given a name and a purpose: endure pressure, answer raids, and keep the Countess' border intact."
 HSM_CYA_unlikely_marriage:0 "An Unlikely Marriage"
 HSM_CYA_unlikely_marriage_desc:0 "Their vows settle nothing the court actually fears. Taillow lends the exile her name; Dawnclaw lends her the reach of his staff. Every appointment now tests which gift carries more power."
 HSM_CYA_dawnclaw_dominant_court:0 "Dawnclaw Dominates The Court"
 HSM_CYA_dawnclaw_dominant_court_desc:0 "The Countess still signs the orders, but Dawnclaw's office decides what reaches her desk."
 HSM_CYA_security_directorate_court:0 "Security Directorate Court"
 HSM_CYA_security_directorate_court_desc:0 "The Countess still holds audience, but a security clerk has already read every petition before she sees it. Dawnclaw need not forbid an order if his office decides what reaches the desk."
 HSM_CYA_colonels_household:0 "Dawnclaw's Staff"
 HSM_CYA_colonels_household_desc:0 "The court guard, courier rooms, and security clerks increasingly answer to Dawnclaw's staff before anyone else."
 HSM_CYA_countess_dominant_court:0 "The Countess Dominates The Court"
 HSM_CYA_countess_dominant_court_desc:0 "Dawnclaw's officers can advise; they no longer decide who enters the Countess' chamber. Taillow's clerks hold the seals, the appointments, and the tedious daily authority on which a court depends."
 HSM_CYA_countess_civilian_court:0 "Civilian Oversight at Court"
 HSM_CYA_countess_civilian_court_desc:0 "Civilian clerks now sit beside the security officers, turning Dawnclaw's usefulness into paperwork the Countess can control."
 HSM_CYA_household_compact:0 "Household Compact"
 HSM_CYA_household_compact_desc:0 "The court's new settlement makes Dawnclaw an instrument of the Countess' rule, not a rival center of power."
 HSM_CYA_hidden_assistant_court:0 "The Hidden Assistant"
 HSM_CYA_hidden_assistant_court_desc:0 "Dawnclaw's work is useful, narrow, and publicly deniable. That is exactly how the Countess prefers him."
 HSM_CYA_countess_alone_court:0 "The Countess Presides"
 HSM_CYA_countess_alone_court_desc:0 "The marriage remains useful, but the court has absorbed Dawnclaw's talents without sharing sovereignty with him."
 HSM_CYA_revealed_exile_regime:0 "The Revealed Exile"
 HSM_CYA_revealed_exile_regime_desc:0 "Dawnclaw is no longer merely hidden in the court. His enemies suspect the truth, and his supporters have begun to act like a regime."
 HSM_CYA_imperial_administration:0 "Imperial Administration"
 HSM_CYA_imperial_administration_desc:0 "Dawnclaw's papers outlived his influence at court. A provisional cabinet sorts his contacts and liabilities, hoping procedures can prevent the exile's presence from becoming a new crisis."
 HSM_CYA_gri_proxy_rule:0 "Imperial Administrative Mission"
 HSM_CYA_gri_proxy_rule_desc:0 "Imperial-trained advisers reserve contracts and workshop capacity for the cabinet's commercial partners. The Countess obtains administrative order, but decisions about production now depend on officials with interests of their own. This arrangement is political supervision, not in itself a treaty of vassalage."
 HSM_CYA_imperial_cabinet_direct_rule:0 "Direct Rule From Thymíaustadt"
 HSM_CYA_imperial_cabinet_direct_rule_desc:0 "The old direct-rule apparatus now answers to Thymíaustadt through Imperial inspectors, local clerks, and carefully watched Cyanolisian administrators."
 HSM_CYA_consolidated_direct_rule:0 "Consolidated Cabinet Direct Rule"
 HSM_CYA_consolidated_direct_rule_desc:0 "The proxy cabinet has become boring enough to function, which is perhaps the highest compliment this kind of administration can earn."
 HSM_CYA_imperial_workshop_program:0 "Imperial Workshop Program"
 HSM_CYA_imperial_workshop_program_desc:0 "A limited production recovery program keeps Cyanolisian workshops running under cabinet supervision."
 HSM_CYA_cabinet_procurement_board_idea:0 "Cabinet Procurement Board"
 HSM_CYA_cabinet_procurement_board_idea_desc:0 "Military procurement now moves through ledgers that satisfy both Cyanolisian workshops and Imperial inspectors."
 HSM_CYA_rationalised_proxy_quotas:0 "Agreed Production Quotas"
 HSM_CYA_rationalised_proxy_quotas_desc:0 "The cabinet's commercial concessions remain burdensome, but written delivery schedules let Cyanolisian workshops plan their own production."
 HSM_CYA_dawnclaw_asylum_scheduled:0 "Dawnclaw's asylum event has been scheduled"
 HSM_CYA_dawnclaw_asylum_resolved:0 "Dawnclaw's asylum has been resolved"
 HSM_CYA_dawnclaw_hidden_in_court:0 "Dawnclaw is hidden in the Countess' court"
 HSM_CYA_dawnclaw_branch_unlocked:0 "Dawnclaw's Cyanolisian branch is unlocked"
 HSM_CYA_dawnclaw_path_chosen:0 "A role has been chosen for Dawnclaw"
 HSM_CYA_dawnclaw_married_countess:0 "Dawnclaw has married the Countess"
 HSM_CYA_dawnclaw_dead:0 "Dawnclaw is dead"
 HSM_CYA_dawnclaw_advisor_role_confirmed:0 "Dawnclaw has been reduced to an advisory role"
 HSM_CYA_dawnclaw_identity_secured:0 "Dawnclaw's identity is secured"
 HSM_CYA_dawnclaw_revealed_to_empire:0 "Dawnclaw has been revealed to Griffenheim"
 HSM_CYA_dawnclaw_assassination_pending:0 "Griffenheim agents are closing in"
 HSM_CYA_dawnclaw_assassination_launched:0 "Griffenheim agents have moved to strike"
 HSM_CYA_dawnclaw_assassination_risk_ended:0 "Dawnclaw's assassination risk has ended"
 HSM_CYA_path_frontier_march:0 "Cyanolisia has chosen the Frontier March path"
 HSM_CYA_path_marriage:0 "Cyanolisia has chosen the marriage path"
 HSM_CYA_path_imperial_administration:0 "Cyanolisia has chosen the Imperial Administration path"
 HSM_CYA_countess_dominant:0 "The Countess dominates the court"
 HSM_CYA_dawnclaw_dominant:0 "Dawnclaw dominates the court"
 HSM_CYA_frontier_march_formed:0 "The Cyanolisian March has been formed"
 HSM_CYA_border_claims_prepared:0 "Border claims have been prepared"
 HSM_CYA_gri_proxy_rule_installed:0 "Griffenheim proxy rule has been installed"
 HSM_CYA_blackrock_wasteland_surveys:0 "Survey the Blackhollow Frontier"
 HSM_CYA_blackrock_wasteland_surveys_desc:0 "Beyond the border lie inhabited villages, disputed estates and routes broken by war and bandit rule. Surveyors must ask the residents where bridges stood and which wells still serve the roads before drawing plans for Blackhollow's recovery."
 HSM_CYA_restore_frontier_county:0 "Restore The Frontier County"
 HSM_CYA_restore_frontier_county_desc:0 "Blackhollow's villages and disputed estates cannot be governed from a distant desk. A restored county administration, surveyors and a permanent garrison will give residents an authority to petition and Cyanolisia a means to enforce the frontier settlement."
 HSM_CYA_frontier_county_garrisons:0 "Frontier County Garrisons"
 HSM_CYA_frontier_county_garrisons_desc:0 "A restored frontier administration needs soldiers close enough to answer raids and dull enough to respect the local ledgers."
 HSM_CYA_countess_border_modernisation:0 "Border Modernisation"
 HSM_CYA_countess_border_modernisation_desc:0 "The Countess must first make her own county governable. Engineers repair roads and depots, while civilian offices reconcile recruitment rolls with harvest labour. These are preparations for a larger state, not yet an imperial regency."
 HSM_CYA_aristocratic_credit_lines:0 "Aristocratic Credit Lines"
 HSM_CYA_aristocratic_credit_lines_desc:0 "Landowners and old families will finance the first wave of reform, provided their place in the new order is respected."
 HSM_CYA_countess_minotaur_charter:0 "The Minotaur Charter"
 HSM_CYA_countess_minotaur_charter_desc:0 "Taillow's earlier attempts at conciliation failed because courtesy left the balance of power untouched. This charter goes further: communal grazing land is protected against seizure, minotaur traders gain access to coastal markets, and mixed local courts hear disputes with griffon landlords. Councils accept regular taxes in return for a voice in their assessment. The Countess gives up profitable privileges to obtain a settlement worth defending."
 HSM_CYA_prepare_asterion_protectorate:0 "Prepare The Asterion Protectorate"
 HSM_CYA_prepare_asterion_protectorate_desc:0 "Whatever government now rules Asterion, the island commands approaches to Cyanolisia's southern coast and retains an interest in the minotaur communities of the mainland. The Countess orders a protectorate plan based on those enduring interests, not on the expectation that today's ministers or alliances will last forever."
 HSM_CYA_subdue_asterion:0 "Subdue Asterion"
 HSM_CYA_subdue_asterion_desc:0 "Asterion's independence has become a strategic danger. The Countess will wrap the war in legal protection and the creation of a dependent protectorate."
 HSM_CYA_countess_sicameon_settlement:0 "Sicameon Settlement Papers"
 HSM_CYA_countess_sicameon_settlement_desc:0 "Sicameon's anti-monarchist republic cannot be left to threaten the coast. Prepare a settlement that binds its ports to Cyanolisia."
 HSM_CYA_claim_sicameon_coast:0 "Claim The Sicameon Coast"
 HSM_CYA_claim_sicameon_coast_desc:0 "The western coast must be secured before the frontier can become a road toward Gryphus and the Herzland."
 HSM_CYA_frontier_aristocratic_league:0 "Frontier Aristocratic League"
 HSM_CYA_frontier_aristocratic_league_desc:0 "Bind landed houses, merchant credit, and loyal officers into a conservative league for ruling the frontier."
 HSM_CYA_evi_valley_protectorates:0 "Evi Valley Protectorates"
 HSM_CYA_evi_valley_protectorates_desc:0 "Gryphus, Brodfeld, and Lushi cannot be allowed to drift into hostile coalitions while Cyanolisia prepares for the imperial question."
 HSM_CYA_regency_prepares_for_herzland:0 "Prepare The Herzland Offensive"
 HSM_CYA_regency_prepares_for_herzland_desc:0 "Taillow sends the staff north with instructions to secure Griffenheim, locate the imperial household and establish what has become of Grover VI. She promises no crown to herself. A child would need a guardian, an adult sovereign a negotiated transfer of authority, and an empty throne a lawful interim settlement. None can be decided from the county's maps alone."
 HSM_CYA_countess_herzland_reconstruction:0 "Herzland Reconstruction Offices"
 HSM_CYA_countess_herzland_reconstruction_desc:0 "After Griffenheim is taken and the regency claims imperial succession, food, railways, tax ledgers, and local order must replace the devastation."
 HSM_CYA_restore_imperial_provinces:0 "Restore The Imperial Provinces"
 HSM_CYA_restore_imperial_provinces_desc:0 "Griffenheim and the Herzland principalities must come under Cyanolisian authority before the Countess can make a credible claim to protect the imperial succession."
 HSM_CYA_countess_regency_for_grover:0 "Guardian of the Imperial Crown"
 HSM_CYA_countess_regency_for_grover_desc:0 "Taillow claims custody of the imperial crown, not a right to wear it. If Grover's household can be transferred from a subject or a fully conquered former host, it will be brought to Griffenheim. An independent foreign sovereign cannot be summoned by proclamation. Until the succession is settled, the Countess undertakes to preserve the realm for its lawful ruler."
 HSM_CYA_dawnclaw_corporate_rearmament:0 "Corporate Rearmament"
 HSM_CYA_dawnclaw_corporate_rearmament_desc:0 "Dawnclaw gives contracts to factories and firms willing to accept discipline, secrecy, and accelerated production quotas."
 HSM_CYA_imperial_officer_cells:0 "Imperial Officer Cells"
 HSM_CYA_imperial_officer_cells_desc:0 "Exiled officers, nationalists, and old army contacts are organised into cells that can survive until the Herzland offensive."
 HSM_CYA_security_districts:0 "Security Districts"
 HSM_CYA_security_districts_desc:0 "Dawnclaw's secret police divide the country into watched districts where documents, travel, and loyalty are no longer private matters."
 HSM_CYA_operation_against_asterion:0 "Operation Against Asterion"
 HSM_CYA_operation_against_asterion_desc:0 "Asterion is not a neighbour to be negotiated with. It is a flank to be broken and turned into a dependent protectorate."
 HSM_CYA_military_governorate_asterion:0 "Asterion Protectorate Command"
 HSM_CYA_military_governorate_asterion_desc:0 "Once Asterion is subordinated, its government remains on the map as a buffer, but its roads, harbours, and staff decisions answer to Cyanolisian officers."
 HSM_CYA_sicameon_security_corridor:0 "Sicameon Security Corridor"
 HSM_CYA_sicameon_security_corridor_desc:0 "Sicameon's ports and militias are too dangerous to leave alone. Dawnclaw will carve a corridor to the coast."
 HSM_CYA_frontier_military_governorates:0 "Strike The Evi Valley"
 HSM_CYA_frontier_military_governorates_desc:0 "Gryphus, Brodfeld, Lushi, and the surrounding frontier states will be forced open before Dawnclaw turns the whole march toward Griffenheim."
 HSM_CYA_nationalist_frontier_mobilisation:0 "Nationalist Frontier Mobilisation"
 HSM_CYA_nationalist_frontier_mobilisation_desc:0 "Nationalists, veterans, and imperial loyalists will carry Cyanolisia from frontier war to Herzland war."
 HSM_CYA_prepare_herzland_offensive:0 "Prepare The Herzland Offensive"
 HSM_CYA_prepare_herzland_offensive_desc:0 "Dawnclaw's return will require maps, collaborators, supply depots, and a state willing to spend itself."
 HSM_CYA_herzland_reconstruction_authority:0 "Herzland Reconstruction Authority"
 HSM_CYA_herzland_reconstruction_authority_desc:0 "Only after Griffenheim falls and Cyanolisia proclaims itself the Empire's descendant can Dawnclaw replace devastation with ration offices, police registries, and compulsory contracts."
 HSM_CYA_march_on_imperial_provinces:0 "March On The Imperial Provinces"
 HSM_CYA_march_on_imperial_provinces_desc:0 "The old imperial provinces will either recognise Dawnclaw's command or be treated as enemy territory."
 HSM_CYA_question_of_grover:0 "The Question Of Grover"
 HSM_CYA_question_of_grover_desc:0 "Griffenheim has fallen, but Grover VI's name still binds much of the realm. He may be a sheltered ward, a ruler who wore the crown elsewhere, or a memory beyond Dawnclaw's reach. The new state must decide what his claim now means."
 HSM_CYA_execute_the_child_emperor:0 "Execute Grover VI"
 HSM_CYA_execute_the_child_emperor_desc:0 "Grover is in our custody. Dawnclaw can order his death, destroying a living rival while turning the dynasty's remaining loyalists into enemies of the new state. It is a deliberate rupture with dynastic legitimacy, not the disposal of a name on a foreign register."
 HSM_CYA_the_puppet_emperor:0 "The Puppet Emperor"
 HSM_CYA_the_puppet_emperor_desc:0 "A living Grover can bless the conquests without commanding them. Dawnclaw will keep him alive, appoint his attendants, and decide which decrees may bear the imperial seal."
 HSM_CYA_the_child_may_rule:0 "Let Grover Govern"
 HSM_CYA_the_child_may_rule_desc:0 "Dawnclaw once believed that a dynasty could only obstruct an officer's reconstruction of the Empire. Now he faces a different danger: a state whose commanders will fight over his legacy when he dies. He will bind the army to permanent institutions and accept Grover as their sovereign. This bargain gives the Emperor real authority, including the power to dismiss Dawnclaw's appointees. It is a price the general must consciously pay, not a kinder name for a puppet."
 HSM_CYA_empty_throne_proclamation:0 "The State Outlived The Dynasty"
 HSM_CYA_empty_throne_proclamation_desc:0 "The united realm has no Grover on its throne. Dawnclaw must make the offices of empire endure, whether he killed the heir or inherited a court already bereaved."
 HSM_CYA_purge_groverite_clergy:0 "Break The Groverite Pulpits"
 HSM_CYA_purge_groverite_clergy_desc:0 "Priests and court loyalists who still speak of bloodright can turn grief into revolt. Their networks must be registered, split, and silenced."
 HSM_CYA_boreas_without_bloodline:0 "Boreas Without A Bloodline"
 HSM_CYA_boreas_without_bloodline_desc:0 "Dawnclaw's jurists argue that Boreas blessed the Empire, not a helpless lineage. The new state will be holy because it is victorious."
 HSM_CYA_caged_coronation:0 "The Throne Under Lock"
 HSM_CYA_caged_coronation_desc:0 "Grover has a crown, whether newly bestowed or restored from an earlier reign. Dawnclaw's offices still define the court and the emperor's permitted power."
 HSM_CYA_court_of_supervised_oaths:0 "Court Of Supervised Oaths"
 HSM_CYA_court_of_supervised_oaths_desc:0 "Nobles, officers, bishops, and mayors will swear before Grover while Dawnclaw's staff records every hesitation. Loyalty to the crown will be measured by those who control its court."
 HSM_CYA_puppet_imperial_tours:0 "Imperial Tours Under Guard"
 HSM_CYA_puppet_imperial_tours_desc:0 "Grover will be shown to Griffonia by train, guarded by soldiers and introduced by speeches written in Dawnclaw's offices. Yet provincial delegates also bring petitions. The tour must settle whether the emperor may hear them through a civilian chancery or only through the general staff."
 HSM_CYA_grover_restoration_ceremony:0 "Grover's First Decrees"
 HSM_CYA_grover_restoration_ceremony_desc:0 "Grover's first decree ends the security office's power to block provincial petitions without a written charge. Cases already opened remain subject to review; commanders must explain their refusals to the civilian courts. The officers keep their posts for now, but the Emperor has shown that Dawnclaw's procedures can be changed without his permission."
 HSM_CYA_steel_regency_statutes:0 "Statutes of Military Service"
 HSM_CYA_steel_regency_statutes_desc:0 "The army will retain its professional chain of command, but its commissions come from the Emperor. Dismissal, promotion and emergency mobilisation must follow a published procedure. Dawnclaw's officers receive continuity of service, not a right to overrule Grover."
 HSM_CYA_reconciled_imperial_oaths:0 "A Common Oath to the Emperor"
 HSM_CYA_reconciled_imperial_oaths_desc:0 "Former enemies, frightened loyalists, and frontier collaborators are offered a final formula: serve Grover, accept the new order, and survive."
 HSM_CYA_empire_after_grover:0 "The Empire Beyond Griffenheim"
 HSM_CYA_empire_after_grover_desc:0 "Griffenheim has been taken, but a capital is not a continent. Grover may be in our keeping, sheltered at a foreign court, or already lost. His fate cannot leave the army waiting at the city gates: Dawnclaw must turn his southern state toward every frontier still beyond imperial reach."
 HSM_CYA_cross_the_river_frontier:0 "Cross into the Riverlands"
 HSM_CYA_cross_the_river_frontier_desc:0 "With the Griffonian Frontier secured and Gryphus supplying the eastern forces, the army can prepare the crossings into the Riverlands. Dawnclaw demands military submission. The conquered pony countries will provide commissariats, not new national provinces."
 HSM_CYA_the_northern_submission:0 "Break the Northern Resistance"
 HSM_CYA_the_northern_submission_desc:0 "Dawnclaw will not leave the northern republics and military rulers to rally another coalition. The army will take the roads towards their centres of power. Victory is only the opening step: garrisons and functioning workshops must follow the columns."
 HSM_CYA_break_the_lake_countries:0 "Break the Lake Houses"
 HSM_CYA_break_the_lake_countries_desc:0 "The rival houses divide Central Griffonia into toll barriers, private loyalties and competing mobilisation districts. A single campaign will end their freedom to wage private wars. The roads around the lakes must then be reopened under military supervision."
 HSM_CYA_crush_the_western_crowns:0 "Break the Western Coalition"
 HSM_CYA_crush_the_western_crowns_desc:0 "Aquileian power and the wealth of the western ports could sustain a long war against Griffenheim. Dawnclaw intends to break that combination before it becomes unassailable. The army will secure the region; a reconstruction office will put its factories and oil fields back to work."
 HSM_CYA_claim_the_southern_crowns:0 "March on Wingbardy"
 HSM_CYA_claim_the_southern_crowns_desc:0 "The western reconstruction offices can now support a southern campaign against Wingbardy and its neighbours. We need not wait for every northern province to settle its affairs. Existing subjects remain outside the target lists, and the post-war administration must respect the arrangements already made on the southern coast."
 HSM_CYA_subdue_the_hillponies:0 "Subdue Beorgfordas"
 HSM_CYA_subdue_the_hillponies_desc:0 "The roads to Beorgfordas branch away from the river crossings. A separate campaign must secure the passes and disarm the hill governments. Their submission will complete the eastern military settlement, while commissariats preserve a distinct form of administration."
 HSM_CYA_western_imperial_circuits:0 "A Rear for the Next Campaign"
 HSM_CYA_western_imperial_circuits_desc:0 "The northern, central and western settlements must work together before the army advances again. Provincial supply accounts, construction orders and transport priorities will be coordinated from Griffenheim. This is the foundation for the southern and eastern campaigns, not a claim that the continent is already ours."
 HSM_CYA_eastern_imperial_circuits:0 "The Eastern Commissariats"
 HSM_CYA_eastern_imperial_circuits_desc:0 "The eastern armies have reached the limits of ordinary provincial integration. The Riverlands and Beorgfordas will be held through the Empire's commissariats, with their own subordinate administrations. Remaining independent enclaves must still be dealt with before Dawnclaw can proclaim continental victory."
 HSM_CYA_one_griffonia_under_claw:0 "One Griffonia Under One Claw"
 HSM_CYA_one_griffonia_under_claw_desc:0 "The last independent banners have fallen or sworn a dependent oath. The exile who arrived under a false name now commands a continent. Conquest has settled the borders, but the question of Grover and the crown still demands a lasting political settlement."
 HSM_CYA_western_griffonia_secured_tt:0 "The original northern, central and western territories of Griffonia are owned and controlled by us or our subjects."
 HSM_CYA_herzland_campaign_secured_tt:0 "Griffenheim and the original Griffonian territories of the Herzland campaign states are owned and controlled by us or our subjects."
 HSM_CYA_griffonia_secured_tt:0 "All passable states in Griffonia are currently owned and controlled by us or our subjects, including imperial commissariats."
 HSM_CYA_eastern_griffonia_secured_tt:0 "The original Griffonian Frontier, Riverlands and Beorgfordas territories are owned and controlled by us or our subjects."
 HSM_CYA_regency_coronation_preparations:0 "Imperial Transfer Commission"
 HSM_CYA_regency_coronation_preparations_desc:0 "Heralds, jurists, and provincial delegates prepare the transfer of government to Grover VI. The regency holds the crown in trust; unfinished campaigns cannot give it a permanent right to govern in his place."
 HSM_CYA_crown_in_trust:0 "The Crown In Trust"
 HSM_CYA_crown_in_trust_desc:0 "The regency has one final promise to keep: the Empire is not hers, and the crown must pass to Grover VI."
 HSM_CYA_groverite_reconciliation:0 "Groverite Reconciliation"
 HSM_CYA_groverite_reconciliation_desc:0 "Old imperial loyalists are brought back through pardons, court appointments, and careful invitations to serve the restored Emperor."
 HSM_CYA_regency_constitution:0 "Imperial Constitutional Settlement"
 HSM_CYA_regency_constitution_desc:0 "The regency has ended. Grover's government must now define ministerial responsibility, provincial rights and the order of succession. Emergency regency powers will be reserved for a future minority or incapacity, not retained by the Countess after she has surrendered them."
 HSM_CYA_frontier_county_administration:0 "Frontier County Administration"
 HSM_CYA_frontier_county_administration_desc:0 "Blackhollow is administered through a restored frontier county bound to the Cyanolisian March. Local councils retain the powers granted by its settlement."
 HSM_CYA_countess_frontier_reforms:0 "Countess' Frontier Reforms"
 HSM_CYA_countess_frontier_reforms_desc:0 "Taillow funds roads and depots that local councils can maintain after the troops depart. The frontier is to be defended as a place where people live, not merely a line on a staff map."
 HSM_CYA_aristocratic_credit_network:0 "Aristocratic Credit Network"
 HSM_CYA_aristocratic_credit_network_desc:0 "Landed families lend to the Countess against future tolls and harvests. The money will help rebuild the frontier, but every creditor expects a hearing when its administration is decided."
 HSM_CYA_countess_mit_protectorate:0 "Asterion Protectorate Plans"
 HSM_CYA_countess_mit_protectorate_desc:0 "Taillow calls the southern campaign a protectorate, not a conquest. Her envoys promise local chambers and guarded roads, while the army draws up the conditions under which those promises will hold."
 HSM_CYA_countess_sicameon_mandate:0 "Sicameon Mandate Papers"
 HSM_CYA_countess_sicameon_mandate_desc:0 "Cyanolisia prepares to bind Sicameon's coast through trade, port supervision, and conservative administration."
 HSM_CYA_frontier_aristocratic_league_idea:0 "Frontier Aristocratic League"
 HSM_CYA_frontier_aristocratic_league_idea_desc:0 "Landed houses supply contacts, merchants supply credit, and officers supply force. The league can keep the frontier together so long as none of its members mistakes cooperation for surrender."
 HSM_CYA_regency_claim:0 "Regency Claim"
 HSM_CYA_regency_claim_desc:0 "Taillow claims no crown in her own name. She asks officers and provincial notables to follow a regent who promises to preserve the imperial succession while the realm is put back together."
 HSM_CYA_herzland_reconstruction:0 "Herzland Reconstruction"
 HSM_CYA_herzland_reconstruction_desc:0 "The capital's fall has not reopened its markets or put bread in the provinces. Reconstruction begins with disputed property, ruined rail, and officials willing to work for the rulers who defeated them."
 HSM_CYA_grover_regency:0 "Regency For Grover VI"
 HSM_CYA_grover_regency_desc:0 "Grover's name appears on the regency's proclamations, but Taillow signs the orders that feed and guard his realm. Her authority rests on a promise to return what she could so easily keep."
 HSM_CYA_regency_coronation_commission:0 "Coronation Commission"
 HSM_CYA_regency_coronation_commission_desc:0 "Heralds, jurists, bishops, and loyal officers prepare the legal and ceremonial road to Grover VI's coronation."
 HSM_CYA_crown_in_trust_idea:0 "The Crown In Trust"
 HSM_CYA_crown_in_trust_idea_desc:0 "The regency treats the crown as a trust, not a prize of conquest. Each province it binds to Griffenheim makes the eventual transfer to Grover harder to refuse and harder to carry out."
 HSM_CYA_groverite_reconciliation_idea:0 "Groverite Reconciliation"
 HSM_CYA_groverite_reconciliation_idea_desc:0 "Returning loyalist families accept offices under Grover's government and swear to the settlement that ended the regency. A pardon opens the door; their conduct in office will determine whether they keep it."
 HSM_CYA_regency_constitution_idea:0 "Imperial Constitutional Settlement"
 HSM_CYA_regency_constitution_idea_desc:0 "Ministers answer to the Emperor within a written constitutional settlement. Provincial rights and succession are defined; any future regency requires a lawful vacancy or incapacity and cannot be claimed by the former guardian."
 HSM_CYA_corporate_rearmament:0 "Corporate Rearmament"
 HSM_CYA_corporate_rearmament_desc:0 "Factories receive steady contracts and hard deadlines from Dawnclaw's office. Directors who once negotiated with ministers now find officers inspecting their ledgers and production floors."
 HSM_CYA_imperial_officer_cells_idea:0 "Imperial Officer Cells"
 HSM_CYA_imperial_officer_cells_idea_desc:0 "Exiled officers keep addresses, passwords, and supply contacts under civilian names. Each cell can serve the next campaign without revealing the others before Dawnclaw is ready."
 HSM_CYA_security_districts_idea:0 "Security Districts"
 HSM_CYA_security_districts_idea_desc:0 "District offices compare travel permits, letters, and household records. The regime knows more about its subjects each month, though knowing where dissent lives is not the same as ending it."
 HSM_CYA_military_governorates:0 "Military Governorates"
 HSM_CYA_military_governorates_desc:0 "The advance leaves behind commandants, censuses, and requisition orders. Civilian offices may follow, but for now each conquered district answers to the officer who holds its roads."
 HSM_CYA_nationalist_frontier_mobilisation_idea:0 "Nationalist Frontier Mobilisation"
 HSM_CYA_nationalist_frontier_mobilisation_idea_desc:0 "Veterans' clubs become recruitment offices, and old imperial songs return to public squares. Dawnclaw can direct that fervor toward Griffenheim, but cannot choose what its followers will demand afterward."
 HSM_CYA_herzland_reconstruction_authority_idea:0 "Herzland Offensive Authority"
 HSM_CYA_herzland_reconstruction_authority_idea_desc:0 "One authority now signs orders for rails, rations, and replacement officials. Its clerks prepare for a Herzland campaign whose victory would be worthless if Griffenheim could not be fed afterward."
 HSM_CYA_child_emperor_executed:0 "Grover VI Executed"
 HSM_CYA_child_emperor_executed_desc:0 "Dawnclaw has killed Grover, whose name once held the Empire together. The succession is settled by force, but every court and chapel must now decide what loyalty to the dead means."
 HSM_CYA_empty_throne_proclamation_idea:0 "The Empty Throne"
 HSM_CYA_empty_throne_proclamation_idea_desc:0 "The throne remains in the hall, but no Grover will occupy it. Dawnclaw asks the provinces to swear to the state itself, knowing a broken dynasty does not erase those who still mourn it."
 HSM_CYA_purged_groverite_clergy:0 "Purged Groverite Clergy"
 HSM_CYA_purged_groverite_clergy_desc:0 "The court removes priests who still preach dynastic right and watches the chapels they leave behind. Their sermons are quieter now, but the silence cannot be mistaken for assent."
 HSM_CYA_boreas_without_bloodline_idea:0 "Boreas Without A Bloodline"
 HSM_CYA_boreas_without_bloodline_idea_desc:0 "The regime teaches that Boreas blessed the Empire's laws and victories, not one bloodline. Priests who reject that distinction are removed from their pulpits."
 HSM_CYA_empty_throne_state_idea:0 "The Empty-Throne State"
 HSM_CYA_empty_throne_state_idea_desc:0 "The Empire has passed the year of coronation without Grover VI. Dawnclaw's command, not dynastic succession, now defines imperial continuity."
 HSM_CYA_puppet_emperor:0 "The Puppet Emperor"
 HSM_CYA_puppet_emperor_desc:0 "Grover VI is visible at ceremonies and absent from decisions. His seal reassures the provinces while Dawnclaw's officers decide what it is placed upon."
 HSM_CYA_caged_coronation_idea:0 "The Caged Coronation"
 HSM_CYA_caged_coronation_idea_desc:0 "The ceremonies are rehearsed, the guards chosen, the Emperor's route approved in advance. Griffonia will see Grover receive a crown; only the court will know who chose the words he may speak."
 HSM_CYA_supervised_oaths_idea:0 "Supervised Imperial Oaths"
 HSM_CYA_supervised_oaths_idea_desc:0 "Every oath to Grover is copied into security files. Nobles who once chose their words freely now learn which phrases Dawnclaw considers loyal."
 HSM_CYA_puppet_imperial_tours_idea:0 "Imperial Tours Under Guard"
 HSM_CYA_puppet_imperial_tours_idea_desc:0 "Provincial crowds see Grover wave from guarded stations and hear speeches prepared by the directorate. His presence lends the new state an old face; the journeys reveal how carefully that face is managed."
 HSM_CYA_caged_emperor_1021_idea:0 "The Caged Emperor"
 HSM_CYA_caged_emperor_1021_idea_desc:0 "Grover VI has been crowned, but every court, guard rota, and public appearance answers to Dawnclaw's state."
 HSM_CYA_restored_grover_supervised:0 "Grover Restored Under Supervision"
 HSM_CYA_restored_grover_supervised_desc:0 "Grover's orders are now his own, but he inherited an army and bureaucracy trained to obey Dawnclaw first. Every appointment tests how far the restored throne can reach into that machinery."
 HSM_CYA_grover_restoration_ceremony_idea:0 "Grover's Restoration Ceremony"
 HSM_CYA_grover_restoration_ceremony_idea_desc:0 "The Emperor's first decrees subject security orders to written justification and civilian review. The inherited administration remains, but it can no longer treat its founder's preferences as permanent law."
 HSM_CYA_steel_regency_statutes_idea:0 "Statutes of Military Service"
 HSM_CYA_steel_regency_statutes_idea_desc:0 "The military serves the Emperor through defined offices and lawful commissions. Dawnclaw's personal patronage no longer grants an exemption from dismissal or review."
 HSM_CYA_reconciled_imperial_oaths_idea:0 "A Common Oath to the Emperor"
 HSM_CYA_reconciled_imperial_oaths_idea_desc:0 "Provincial officials swear to Grover without surrendering the institutions that reunited the realm. The formula promises continuity, but every appointment will test which part of it matters more."
 HSM_CYA_restored_grover_1021_idea:0 "Grover VI's Restored Empire"
 HSM_CYA_restored_grover_1021_idea_desc:0 "Grover VI rules from Griffenheim, but the restored Empire still carries the institutions that survived the conquest and reconstruction."
 HSM_CYA_river_frontier_war_plan:0 "River Frontier War Plan"
 HSM_CYA_river_frontier_war_plan_desc:0 "The River Federation is treated as the next strategic frontier of the restored Empire."
 HSM_CYA_blackrock_wasteland_mapped:0 "The Blackhollow frontier has been surveyed"
 HSM_CYA_field_security_battalions_raised:0 "Field security battalions have been raised"
 HSM_CYA_question_of_grover_opened:0 "The question of Grover VI has been opened"
 HSM_CYA_grover_executed:0 "Grover VI has been executed"
 HSM_CYA_grover_puppet:0 "Grover VI has been made a puppet emperor"
 HSM_CYA_grover_restored:0 "Grover VI has been restored under supervision"
 HSM_CYA_countess_crown_prepared:0 "The regency has prepared Grover VI's coronation"
 HSM_CYA_grover_reigned_elsewhere:0 "Grover VI has already reigned in another country"
 HSM_CYA_grover_absent:0 "Grover VI is unavailable to the new Empire"
 HSM_CYA_imperial_cabinet_installed:0 "The imperial cabinet has been installed"
 HSM_CYA_1021_crown_in_trust:0 "The Countess has transferred sovereign authority to Grover VI"
 HSM_CYA_1021_memorial_regency:0 "The Countess has proclaimed a memorial regency"
 HSM_CYA_1021_empty_throne:0 "The Empire has passed 1021 without Grover VI"
 HSM_CYA_1021_caged_coronation:0 "Grover VI has been crowned under guard"
 HSM_CYA_1021_grover_restored:0 "Grover VI has been restored to the throne"
 HSM_CYA_controls_imperial_centres_tt:0 "Controls Griffenheim and Griffonstone"
 HSM_CYA_frontier_war_games:0 "Frontier Staff Exercises"
 HSM_CYA_frontier_war_games_desc:0 "The Cyanolisian March rehearses defensive responses against Asterion and Sicameon while keeping Dawnclaw in a deliberately secondary role."
 HSM_CYA_evi_border_embassies:0 "Evi Border Embassies"
 HSM_CYA_evi_border_embassies_desc:0 "The frontier path survives through scouts, envoys, and trade clerks who know when a border dispute is still cheaper than a war."
 HSM_CYA_blackrock_autonomy_statute:0 "Blackhollow Autonomy Statute"
 HSM_CYA_blackrock_autonomy_statute_desc:0 "The restored county must answer to Cyanolisia without treating every village custom as an offence. Local councils will retain defined powers over communal land and tolls, subject to a common court of appeal."
 HSM_CYA_countess_evosmoshafen_ministries:0 "Thymíaustadt Ministries"
 HSM_CYA_countess_evosmoshafen_ministries_desc:0 "The Countess expands the civilian ministries before turning south, giving her reforms clerks, ledgers, and a quieter legal face."
 HSM_CYA_countess_mit_customs_zone:0 "Asterion Customs Zone"
 HSM_CYA_countess_mit_customs_zone_desc:0 "If Minotauria is to be subdued, its roads and markets must first be mapped as future customs corridors."
 HSM_CYA_countess_sicameon_port_authority:0 "Sicameon Port Authority"
 HSM_CYA_countess_sicameon_port_authority_desc:0 "A conservative port authority will prepare the legal machinery for bringing Sicameon's coast under Cyanolisian supervision."
 HSM_CYA_countess_integrate_south:0 "Sicameon Integration Statutes"
 HSM_CYA_countess_integrate_south_desc:0 "Asterion must remain a dependent protectorate. Sicameon's coast, however, can be folded into Cyanolisia through ports, parish boards, and trade law."
 HSM_CYA_countess_southern_provincial_diets:0 "Southern Provincial Diets"
 HSM_CYA_countess_southern_provincial_diets_desc:0 "The Countess offers controlled assemblies to the southern provinces: enough autonomy to govern, not enough to break away."
 HSM_CYA_countess_merchant_arbitration:0 "Merchant Arbitration Courts"
 HSM_CYA_countess_merchant_arbitration_desc:0 "Trade disputes in the south will be settled by courts friendly to aristocrats, landowners, and Cyanolisian port interests."
 HSM_CYA_countess_frontier_conference:0 "Frontier Conference"
 HSM_CYA_countess_frontier_conference_desc:0 "Aristocrats, merchants, officers, and frontier estate delegates are gathered to turn the southern settlement into a platform for the Evi Valley."
 HSM_CYA_countess_integrate_evi_valley:0 "Evi Valley Integration"
 HSM_CYA_countess_integrate_evi_valley_desc:0 "The valley states will not be ruled as raided land. They will be marked as future provinces once compliance and local settlement make it possible."
 HSM_CYA_evi_civic_modernisation:0 "Evi Civic Modernisation"
 HSM_CYA_evi_civic_modernisation_desc:0 "The valley cannot be held by old charters alone. Roads, tax offices, survey teams, and relief works will make Cyanolisian rule useful enough to endure."
 HSM_CYA_evi_frontier_schools:0 "Frontier School Boards"
 HSM_CYA_evi_frontier_schools_desc:0 "Teachers and technical clerks are sent into the Evi towns to turn frontier integration into schools, ledgers, and a new language of administration."
 HSM_CYA_countess_capital_restoration_plan:0 "Capital Restoration Plan"
 HSM_CYA_countess_capital_restoration_plan_desc:0 "Cyanolisia's engineers, grain offices and experienced administrators must be ready before the army reaches Griffenheim. The Countess is preparing an occupation and a claim to temporary imperial authority, not administering a capital she does not yet hold."
 HSM_CYA_dawnclaw_war_room:0 "Dawnclaw's Operational Staff"
 HSM_CYA_dawnclaw_war_room_desc:0 "Dawnclaw turns palace offices into a permanent operational staff where officers, informants, railway planners, and loyal industrialists prepare the southern campaigns."
 HSM_CYA_minotaurian_logistics_board:0 "Minotaurian Logistics Board"
 HSM_CYA_minotaurian_logistics_board_desc:0 "The southern operation will be won by depots and rail schedules before the first ultimatum is delivered."
 HSM_CYA_sicameon_informant_ports:0 "Informants In The Ports"
 HSM_CYA_sicameon_informant_ports_desc:0 "Sicameon's coast is full of unions, republicans, and smugglers. Dawnclaw intends to buy the names before he buys the bullets."
 HSM_CYA_dawnclaw_integrate_south:0 "Sicameon Occupation Codes"
 HSM_CYA_dawnclaw_integrate_south_desc:0 "Asterion will be held as a puppet protectorate. Sicameon becomes the territory of registries, port purges, and future integration through compliance."
 HSM_CYA_minotaurian_security_registry:0 "Minotaurian Security Registry"
 HSM_CYA_minotaurian_security_registry_desc:0 "Families, unions, veterans, and local chiefs are entered into a security registry that makes rebellion easier to anticipate and harder to hide."
 HSM_CYA_port_purge_lists:0 "Port Purge Lists"
 HSM_CYA_port_purge_lists_desc:0 "Sicameon's dockside networks will be screened for republican organisers, smugglers, and anyone still loyal to the old coast."
 HSM_CYA_frontier_security_census:0 "Frontier Security Census"
 HSM_CYA_frontier_security_census_desc:0 "Every town, rail junction, guild office, and barracks on the Evi frontier is counted as a future security problem."
 HSM_CYA_evi_governorate_codes:0 "Evi Governorate Codes"
 HSM_CYA_evi_governorate_codes_desc:0 "The Evi Valley can become imperial territory only after its occupied administrations are reduced to codes, permits, and compliance thresholds. Dawnclaw will mark the new order with a directorate's name and flag."
 HSM_CYA_frontier_registry_modernisation:0 "Registry Modernisation"
 HSM_CYA_frontier_registry_modernisation_desc:0 "Occupation files are turned into tax rolls, labour books, and railway schedules. Even Dawnclaw's harsh frontier state needs a modern bureaucracy beneath the warrants."
 HSM_CYA_security_polytechnic_cells:0 "Supervised Technical Schools"
 HSM_CYA_security_polytechnic_cells_desc:0 "Technical schools in the occupied valley will serve the army first: radio clerks, mechanics, armoury inspectors, and engineers trained under police supervision."
 HSM_CYA_dawnclaw_capital_restoration_plan:0 "Griffenheim Restoration Plan"
 HSM_CYA_dawnclaw_capital_restoration_plan_desc:0 "After the proclamation of imperial succession, Dawnclaw prepares the engineers, police cadres, and requisition offices needed for a devastated capital."
 HSM_CYA_evosmoshafen_ministries:0 "Thymíaustadt Ministries"
 HSM_CYA_evosmoshafen_ministries_desc:0 "Expanded civilian ministries give the Countess more control over reform without handing every file to the army."
 HSM_CYA_countess_mit_customs_zone_idea:0 "Asterion Customs Zone"
 HSM_CYA_countess_mit_customs_zone_idea_desc:0 "Southern customs planning ties future Asterion trade to Cyanolisian law."
 HSM_CYA_countess_port_authority:0 "Sicameon Port Authority"
 HSM_CYA_countess_port_authority_desc:0 "Port supervision prepares the coast for conservative settlement and trade control."
 HSM_CYA_frontier_conference_idea:0 "Frontier Conference"
 HSM_CYA_frontier_conference_idea_desc:0 "A working compact of aristocrats, merchants, and officers coordinates the next frontier phase."
 HSM_CYA_capital_restoration_plan:0 "Capital Restoration Plan"
 HSM_CYA_capital_restoration_plan_desc:0 "Engineers, tax offices, and administrators are prepared for the day Cyanolisia enters Griffenheim."
 HSM_CYA_herzland_devastation:0 "Herzland Devastation"
 HSM_CYA_herzland_devastation_desc:0 "Griffenheim has fallen, but the city its conquerors inherited is hungry and scarred. Until the markets, courts, and railways work again, every imperial proclamation must compete with the price of bread."
 HSM_CYA_dawnclaw_war_room_idea:0 "Dawnclaw's Operational Staff"
 HSM_CYA_dawnclaw_war_room_idea_desc:0 "Officers, informants, and loyal industrialists coordinate campaigns through the court's new operational staff."
 HSM_CYA_minotaurian_logistics_board_idea:0 "Minotaurian Logistics Board"
 HSM_CYA_minotaurian_logistics_board_idea_desc:0 "Southern roads and depots are being prepared for a campaign against Asterion."
 HSM_CYA_sicameon_informant_ports_idea:0 "Sicameon Port Informants"
 HSM_CYA_sicameon_informant_ports_idea_desc:0 "Paid informants and dockside files give Cyanolisia a clearer view of Sicameon's coast."
 HSM_CYA_frontier_security_census_idea:0 "Frontier Security Census"
 HSM_CYA_frontier_security_census_idea_desc:0 "The Evi frontier is being catalogued as an occupation problem before it becomes an occupation."
 HSM_CYA_can_claim_empire_descendant:0 "Cyanolisia can claim imperial succession"
 HSM_CYA_empire_descendant_declared:0 "Cyanolisia has proclaimed itself the Empire's descendant"
 HSM_CYA_empire_descendant_reconstruction_tt:0 "§YHerzland reconstruction focuses§! will become available. Former imperial lands will be marked for future compliance-based integration."
 HSM_CYA_controls_south_capitals_tt:0 "Controls Midoria; Asterion is our subject, or all its listed home territories are ours and we are at peace so a protectorate can be released."
 HSM_CYA_controls_evi_capitals_tt:0 "Controls §YKivessin§! and §YKaiv§!."
 HSM_CYA_kivessin_compromise:0 "The Kivessin Compromise"
 HSM_CYA_kivessin_compromise_desc:0 "Kivessin is too important to be treated as another occupied town. The Countess will bargain with temples, estates, and city families before the valley is folded into Cyanolisia."
 HSM_CYA_kaiv_autonomy_promise:0 "Promise Kaiv Autonomy"
 HSM_CYA_kaiv_autonomy_promise_desc:0 "The cossack memory of Kaiv cannot be dissolved by decree. A loyal autonomous charter will calm the city without surrendering the frontier."
 HSM_CYA_break_the_kivessin_estates:0 "Break The Kivessin Estates"
 HSM_CYA_break_the_kivessin_estates_desc:0 "Dawnclaw will not bargain with landlords who survived every empire by changing banners. Kivessin's estates will be audited, disarmed, and made useful."
 HSM_CYA_tame_the_kaiv_rada:0 "Tame The Kaiv Rada"
 HSM_CYA_tame_the_kaiv_rada_desc:0 "Kaiv's Rada may keep its rituals, but its votes will be watched by officers and its cossack elders will learn who controls the frontier."
 hsm_cyanolisia.20.t:0 "The Kivessin Compromise"
 hsm_cyanolisia.20.d:0 "Kivessin's landowners ask who will command their local levies and whether wartime requisitions will become permanent taxes. Merchants demand access to grain markets without paying each estate's toll. The Countess cannot grant both groups everything: she can preserve the estates' privileges in return for cooperation, or entrust recovery to the countinghouses and weaken the old families' hold."
 hsm_cyanolisia.20.a:0 "Let Kivessin keep its dignity."
 hsm_cyanolisia.20.b:0 "Give the merchants the countinghouses."
 hsm_cyanolisia.21.t:0 "A Charter For Kaiv"
 hsm_cyanolisia.21.d:0 "Kaiv's delegates defend the Rada's right to negotiate levies and the Cossacks' right to serve under their own officers. They call these liberties the substance of Zaphzia, not ceremonial privileges. The Countess can recognise a civilian charter with limits on requisitions, or bind the frontier through Cossack commissions in her army. Each offer creates different people with a stake in the settlement."
 hsm_cyanolisia.21.a:0 "Recognise the Rada's charter."
 hsm_cyanolisia.21.b:0 "Put Cossack officers on the frontier."
 hsm_cyanolisia.22.t:0 "The Estates Of Kivessin"
 hsm_cyanolisia.22.d:0 "Dawnclaw's officers enter Kivessin with account books and arrest warrants. Landowners are summoned individually; their holdings are searched, their tax exemptions challenged and their militia rolls compared with army records. Privilege is not abolished at a stroke. Its holders are made personally answerable to the commandant."
 hsm_cyanolisia.22.a:0 "Privilege now answers to command."
 hsm_cyanolisia.22.b:0 "Seize their ledgers before their titles."
 hsm_cyanolisia.23.t:0 "The Tamed Rada"
 hsm_cyanolisia.23.d:0 "The Rada gathers beneath watched balconies. Cossack elders speak of old liberties; Dawnclaw's liaison speaks of railways, hostages, and ammunition permits. The vote is technically free. Everyone present understands the shape of the acceptable answer."
 hsm_cyanolisia.23.a:0 "Let them vote correctly."
 hsm_cyanolisia.23.b:0 "Give the commandant a veto."
 HSM_CYA_kivessin_compromise_accepted:0 "The Kivessin compromise has been accepted"
 HSM_CYA_kivessin_merchant_compact:0 "Kivessin merchants received a trade compact"
 HSM_CYA_kaiv_autonomy_promised:0 "Kaiv has been promised controlled autonomy"
 HSM_CYA_kaiv_cossack_guard:0 "Kaiv's Cossack officers guard the frontier"
 HSM_CYA_kivessin_estates_broken:0 "The Kivessin estates have been broken"
 HSM_CYA_kivessin_tax_ledgers_seized:0 "Kivessin estate ledgers have been seized"
 HSM_CYA_kaiv_rada_tamed:0 "The Kaiv Rada has been tamed"
 HSM_CYA_kaiv_commandant_veto:0 "The Kaiv commandant may veto the Rada"
 HSM_CYA_asterion_assembly_compact:0 "Asterion Assembly Compact"
 HSM_CYA_asterion_assembly_compact_desc:0 "Aster's Landing remembers the loss of mainland self-rule and the struggles fought in its name. Its delegates will not accept a governor's promises without control over some local taxes and a place to contest requisitions. A supervised assembly can give them those rights while leaving military command and foreign policy outside its remit."
 HSM_CYA_midoria_parish_board:0 "Midoria Parish Board"
 HSM_CYA_midoria_parish_board_desc:0 "Sicameon's parishes are accustomed to charters, coast law, and jealous local privileges. A parish board can turn that habit into an instrument of Cyanolisian order."
 HSM_CYA_lushland_border_commission:0 "Lushland Border Commission"
 HSM_CYA_lushland_border_commission_desc:0 "Lushland's frontier is a tangle of fields, shrines, toll posts, and frightened town councils. A border commission will replace rumor with maps and bargaining."
 HSM_CYA_gryphus_company_charter:0 "Gryphus Company Charter"
 HSM_CYA_gryphus_company_charter_desc:0 "The Gryphussian Southern Continent Company and the free towns seek different guarantees. The Countess must choose whose privileges to protect and how to make their obligations enforceable under Cyanolisian law."
 HSM_CYA_evi_notables_council:0 "Council Of Evi Estates"
 HSM_CYA_evi_notables_council_desc:0 "Kivessin, Kaiv, Lushland, and Gryphus will send useful families, guild clerks, and frontier officers to one council. It will not be democracy, but it will be governable."
 HSM_CYA_asterion_hostage_bureau:0 "Asterion Hostage Bureau"
 HSM_CYA_asterion_hostage_bureau_desc:0 "Aster's Landing preserves competing traditions of mainland independence. Dawnclaw's officers will identify which veterans, teachers and prominent families can mobilise resistance. The bureau offers no reconciliation: it turns those relationships into lists of hostages or candidates for supervised auxiliary service."
 HSM_CYA_midoria_dockyard_command:0 "Midoria Dockyard Command"
 HSM_CYA_midoria_dockyard_command_desc:0 "Midoria's docks feed parishes, corsairs, traders, and revolutionaries alike. Under Dawnclaw, the harbor will answer first to requisition officers."
 HSM_CYA_lushland_reprisals:0 "Lushland Reprisals"
 HSM_CYA_lushland_reprisals_desc:0 "Dawnclaw's officers will punish suspected organisers publicly and force surviving accomplices to identify routes, caches and hiding places. The order may open the roads for a season; it also gives the border villages grievances they will not soon forget."
 HSM_CYA_gryphus_company_audit:0 "Gryphus Company Audit"
 HSM_CYA_gryphus_company_audit_desc:0 "The Gryphussian Southern Continent Company, free-town councils and chapterhouses of the Order of Opinicus claim different exemptions. Dawnclaw's auditors will distinguish valid contracts from privileges maintained by influence alone."
 HSM_CYA_frontier_auxiliary_legions:0 "Frontier Auxiliary Legions"
 HSM_CYA_frontier_auxiliary_legions_desc:0 "The frontier has soldiers who know its roads better than any Cyanolisian staff map. Those willing to serve will be formed into auxiliary legions; those unwilling will be listed beside them."
 HSM_CYA_evi_notables_council_idea:0 "Council Of Evi Estates"
 HSM_CYA_evi_notables_council_idea_desc:0 "Selected local families, guild clerks, and officers give Cyanolisia a conservative channel through the newly conquered Evi Valley."
 HSM_CYA_frontier_auxiliary_legions_idea:0 "Frontier Auxiliary Legions"
 HSM_CYA_frontier_auxiliary_legions_idea_desc:0 "Local auxiliaries strengthen Dawnclaw's frontier armies, though their discipline depends on fear, pay, and careful supervision."
 HSM_CYA_port_purge_network_idea:0 "Port Purge Network"
 HSM_CYA_port_purge_network_idea_desc:0 "Dock ledgers, informants, and customs police make the southern ports safer for Cyanolisian convoys and more dangerous for republican organisers."
 HSM_CYA_kivessin_estate_audits_idea:0 "Kivessin Estate Audits"
 HSM_CYA_kivessin_estate_audits_idea_desc:0 "Kivessin's estates keep their gates, but every gate now has an officer, a warrant, and a tax file behind it."
 HSM_CYA_kaiv_supervised_rada_idea:0 "Supervised Kaiv Rada"
 HSM_CYA_kaiv_supervised_rada_idea_desc:0 "Kaiv's local forms remain, watched by officers who turn every vote into another measure of loyalty."
 HSM_CYA_lushland_reprisals_idea:0 "Lushland Reprisals"
 HSM_CYA_lushland_reprisals_idea_desc:0 "Selective punishments force the frontier roads open, at the cost of making every village remember who gave the order."
 HSM_CYA_gryphus_audit_board_idea:0 "Gryphus Audit Board"
 HSM_CYA_gryphus_audit_board_idea_desc:0 "Company ledgers, free-town accounts, and chapterhouse privileges are turned into tax claims and security files."
 HSM_CYA_evi_governorate_codes_idea:0 "Evi Governorate Codes"
 HSM_CYA_evi_governorate_codes_idea_desc:0 "Audits, censuses, and supervised councils now use the same seal. The valley is easier to govern on paper; that does not mean its inhabitants have forgotten how the papers were obtained."
 HSM_CYA_evi_civic_modernisation_idea:0 "Evi Civic Modernisation"
 HSM_CYA_evi_civic_modernisation_idea_desc:0 "Relief works, road offices, and tax surveys tie the Evi Valley to Cyanolisia through practical administration."
 HSM_CYA_evi_frontier_schools_idea:0 "Frontier School Boards"
 HSM_CYA_evi_frontier_schools_idea_desc:0 "The valley's schools and clerical courses are being aligned with Cyanolisian law and technical needs."
 HSM_CYA_frontier_registry_modernisation_idea:0 "Modernised Frontier Registries"
 HSM_CYA_frontier_registry_modernisation_idea_desc:0 "Occupation records are being converted into modern registries for taxes, work crews, and police supervision."
 HSM_CYA_security_polytechnic_cells_idea:0 "Supervised Technical Schools"
 HSM_CYA_security_polytechnic_cells_idea_desc:0 "Technical education in the frontier is supervised by officers and directed toward the regime's arsenals, radios, and roads."
 hsm_cyanolisia.24.t:0 "Aster's Landing Debates"
 hsm_cyanolisia.24.d:0 "In Aster's Landing, mainland delegates argue over who may tax their districts and hear complaints against requisition officers. The Countess's envoy offers a limited assembly: local revenue, schools and petitions may be debated, but military command and foreign policy remain outside its remit. The delegates must decide whether those limited powers are worth accepting under Cyanolisian supervision."
 hsm_cyanolisia.24.a:0 "Restore the assembly under our seal."
 hsm_cyanolisia.24.b:0 "A governor may hear petitions instead."
 hsm_cyanolisia.25.t:0 "Parishes Of Midoria"
 hsm_cyanolisia.25.d:0 "Midoria's parish delegates want their elected officers to retain control of local patrols and harbour dues. The customs inspectors insist that separate parish exemptions will frustrate a common shipping policy. The Countess must decide whether to preserve those charters or place the ports under a central board whose efficiency comes at the expense of local consent."
 hsm_cyanolisia.25.a:0 "Protect the parish charters."
 hsm_cyanolisia.25.b:0 "Bind the ports to our customs board."
 hsm_cyanolisia.26.t:0 "Lines Through Lushland"
 hsm_cyanolisia.26.d:0 "The Lushland border is not a neat frontier. A shrine owes tithe to one town, a road toll to another, and protection to whoever last marched through. Cyanolisian surveyors suggest two paths: arbitrate the border patiently, or turn the commission into a rail and supply survey for future campaigns."
 hsm_cyanolisia.26.a:0 "Arbitrate the border towns."
 hsm_cyanolisia.26.b:0 "Survey the roads first."
 hsm_cyanolisia.27.t:0 "The Gryphus Charter"
 hsm_cyanolisia.27.d:0 "The Gryphussian Southern Continent Company asks that its commercial privileges survive the conquest. Free-town delegates object: a charter protecting company tolls would leave their councils paying for roads they cannot freely use. The Countess may exchange commercial continuity for company cooperation, or guarantee municipal rights and bring the towns directly into the new administration."
 hsm_cyanolisia.27.a:0 "Charter the company under our seal."
 hsm_cyanolisia.27.b:0 "Guarantee the free towns."
 hsm_cyanolisia.28.t:0 "Names In Asterion"
 hsm_cyanolisia.28.d:0 "Dawnclaw's bureau begins with veterans' clubs, schoolmasters and families associated with campaigns for mainland independence. Some officers demand hostages from the most prominent households. Others argue that locally recruited auxiliary officers would secure cooperation without filling the prisons with their relatives."
 hsm_cyanolisia.28.a:0 "Register the prominent families."
 hsm_cyanolisia.28.b:0 "Recruit officers from the compliant."
 hsm_cyanolisia.29.t:0 "Midoria Under Command"
 hsm_cyanolisia.29.d:0 "Midoria's dockmasters know how to delay a war without ever raising a flag. Dawnclaw's commandants propose requisitions, patrol schedules, and a port ledger written by soldiers. A few suggest an amnesty for corsair crews willing to hunt the regime's enemies."
 hsm_cyanolisia.29.a:0 "Requisition the dockyards."
 hsm_cyanolisia.29.b:0 "Offer a corsair amnesty."
 hsm_cyanolisia.30.t:0 "The Lushland Example"
 hsm_cyanolisia.30.d:0 "A railway clerk vanishes. A courier is found in a ditch. The border villages deny everything with identical faces. Dawnclaw's officers can answer with reprisals swift enough to frighten the roads open, or build an informant net that poisons the villages more slowly."
 hsm_cyanolisia.30.a:0 "Authorize selective reprisals."
 hsm_cyanolisia.30.b:0 "Build the informant net."
 hsm_cyanolisia.31.t:0 "Gryphus Accounts"
 hsm_cyanolisia.31.d:0 "The free towns of Gryphus kept their independence in account books as much as in fortresses. Dawnclaw's auditors seize ledgers from company offices and request lists from the Order of Opinicus. Every hidden contract can become either a tax claim or a security file."
 hsm_cyanolisia.31.a:0 "Audit the company ledgers."
 hsm_cyanolisia.31.b:0 "Compromise the chapterhouses."
 HSM_CYA_asterion_assembly_restored:0 "The Asterion assembly was restored under Cyanolisian seal"
 HSM_CYA_asterion_governor_petitions:0 "Asterion petitions were placed under the governor"
 HSM_CYA_midoria_parish_charters:0 "Midoria's parish charters were protected"
 HSM_CYA_midoria_customs_board:0 "Midoria was bound to a customs board"
 HSM_CYA_lushland_border_commissioned:0 "The Lushland border commission was formed"
 HSM_CYA_lushland_rail_survey:0 "The Lushland rail survey was prioritized"
 HSM_CYA_gryphus_company_chartered:0 "The Gryphus company charter was renewed"
 HSM_CYA_gryphus_free_towns_protected:0 "The Gryphus free towns were guaranteed"
 HSM_CYA_asterion_hostage_rolls:0 "Asterion hostage rolls were prepared"
 HSM_CYA_asterion_auxiliary_officers:0 "Asterion auxiliary officers were recruited"
 HSM_CYA_midoria_dockyards_requisitioned:0 "Midoria's dockyards were requisitioned"
 HSM_CYA_midoria_corsair_amnesty:0 "A Midoria corsair amnesty was offered"
 HSM_CYA_lushland_reprisals_authorized:0 "Lushland reprisals were authorized"
 HSM_CYA_lushland_informant_net:0 "A Lushland informant net was built"
 HSM_CYA_gryphus_company_audited:0 "The Gryphus company was audited"
 HSM_CYA_gryphus_order_compromised:0 "Gryphus chapterhouses were compromised"
 HSM_CYA_southern_amnesty_registers:0 "Southern Amnesty Registers"
 HSM_CYA_southern_amnesty_registers_desc:0 "The south cannot be ruled forever through fear of the last campaign. The Countess will decide who may be forgiven, who must be watched, and who remains outside the law."
 HSM_CYA_frontier_school_missions:0 "Frontier School Missions"
 HSM_CYA_frontier_school_missions_desc:0 "Teachers, clergy and local clerks open schools in the Evi provinces. Reading and practical lessons offer families a reason to cooperate; the administration also expects the classroom to make its laws intelligible."
 HSM_CYA_princely_lesson_books:0 "Princely Lesson Books"
 HSM_CYA_princely_lesson_books_desc:0 "Only a minor living under the Countess's protection can be her pupil. Tutors will introduce Grover to the disputes behind imperial orders: a province unable to meet a levy, a pardon contested by an officer, a frontier left without supplies. His education must prepare him to judge these claims himself."
 HSM_CYA_frontier_tribunals:0 "Frontier Tribunals"
 HSM_CYA_frontier_tribunals_desc:0 "Dawnclaw's frontier will be taught through courtrooms, lists, and sentences. The valley must learn that resistance is not romantic, only documented."
 HSM_CYA_hostage_cadet_schools:0 "Hostage Cadet Schools"
 HSM_CYA_hostage_cadet_schools_desc:0 "Sons of compromised families can rot as hostages, or they can be remade as officers whose loyalty is trained before it is tested."
 HSM_CYA_grover_black_files:0 "The Grover Dossier"
 HSM_CYA_grover_black_files_desc:0 "The palace archives can reveal Grover's household, loyalties and political position without proving that he is in our custody. If a minor Grover is here, the staff can also assess his upbringing. An adult ruler requires a political dossier, not a school timetable; a dead heir can be studied only through the claims made in his name."
 HSM_CYA_southern_amnesty_registers_idea:0 "Southern Amnesty Registers"
 HSM_CYA_southern_amnesty_registers_idea_desc:0 "Pardons in the south are being turned into a political ledger of who can be trusted, bought, or watched."
 HSM_CYA_frontier_school_missions_idea:0 "Frontier School Missions"
 HSM_CYA_frontier_school_missions_idea_desc:0 "Provincial schools teach reading, practical skills and the laws of the new administration."
 HSM_CYA_grover_tutelage_notes_idea:0 "Grover's Tutelage Notes"
 HSM_CYA_grover_tutelage_notes_idea_desc:0 "Reports, lesson books, and carefully selected histories are prepared for the Emperor the regency hopes to restore."
 HSM_CYA_frontier_tribunals_idea:0 "Frontier Tribunals"
 HSM_CYA_frontier_tribunals_idea_desc:0 "The occupied frontier is being disciplined through tribunals that make examples and files in equal measure."
 HSM_CYA_hostage_cadet_schools_idea:0 "Hostage Cadet Schools"
 HSM_CYA_hostage_cadet_schools_idea_desc:0 "Hostage families are bound to the army by turning their sons into cadets of the new order."
 HSM_CYA_grover_black_files_idea:0 "The Grover Dossier"
 HSM_CYA_grover_black_files_idea_desc:0 "Dawnclaw's staff keeps a sealed operational dossier on Grover VI's habits, tutors, and future usefulness."
 HSM_CYA_development_board_idea:0 "Cyanolisian Development Board"
 HSM_CYA_development_board_idea_desc:0 "Development policy is being centralized through a board that tracks factories, schools, roads, and frontier arrears."
 HSM_CYA_public_works_relief_idea:0 "Public Works Relief"
 HSM_CYA_public_works_relief_idea_desc:0 "Public works soften poverty while binding labor to state projects."
 HSM_CYA_polytechnic_exchange_idea:0 "Polytechnic Exchange"
 HSM_CYA_polytechnic_exchange_idea_desc:0 "Engineers, students, and military technicians are moved between institutes and workshops under state supervision."
 HSM_CYA_frontier_railway_corps_idea:0 "Frontier Railway Corps"
 HSM_CYA_frontier_railway_corps_idea_desc:0 "Railway crews and army logisticians keep the frontier supplied and repairable."
 HSM_CYA_frontier_defense_industry_idea:0 "Frontier Defense Industry"
 HSM_CYA_frontier_defense_industry_idea_desc:0 "Dispersed workshops support border defense without demanding grand industrial miracles."
 HSM_CYA_regency_land_credit_idea:0 "The Countess's Land Credit"
 HSM_CYA_regency_land_credit_idea_desc:0 "Landowners and port creditors finance the Countess's development programme against future revenues. Their investment purchases influence, not an existing claim to the imperial regency."
 HSM_CYA_cabinet_industrial_plan_idea:0 "Cabinet Industrial Plan"
 HSM_CYA_cabinet_industrial_plan_idea_desc:0 "The civilian cabinet coordinates industrial recovery and technical planning."
 HSM_CYA_corporate_mobilisation_plan_idea:0 "Corporate Mobilisation Plan"
 HSM_CYA_corporate_mobilisation_plan_idea_desc:0 "Favored firms receive contracts and protection in exchange for obedience to Dawnclaw's mobilization program."
 HSM_CYA_black_budget_arsenals_idea:0 "Black-Budget Arsenals"
 HSM_CYA_black_budget_arsenals_idea_desc:0 "Hidden procurement channels feed military workshops beyond ordinary parliamentary accounting."
 HSM_CYA_frontier_doctrine_school_idea:0 "Frontier Doctrine School"
 HSM_CYA_frontier_doctrine_school_idea_desc:0 "Officers are trained to defend the frontier through logistics, field discipline, and careful terrain work."
 HSM_CYA_regency_general_staff_idea:0 "The Countess's General Staff"
 HSM_CYA_regency_general_staff_idea_desc:0 "The senior staff answers to the Countess's civilian government and prepares the county's army for coordinated defensive operations."
 HSM_CYA_stratocratic_general_staff_idea:0 "Stratocratic General Staff"
 HSM_CYA_stratocratic_general_staff_idea_desc:0 "Dawnclaw's army staff joins command, policing, and future offensive planning into one military state."
 HSM_CYA_admiralty_patrol_compact_idea:0 "Admiralty Patrol Compact"
 HSM_CYA_admiralty_patrol_compact_idea_desc:0 "Coastal patrols and customs reports give the regime a steadier hand over Cyanolisia's shores."
 hsm_cyanolisia.32.t:0 "The Pardon Registers"
 hsm_cyanolisia.32.d:0 "Petitions arrive from Asterion, Midoria and the coastal towns. Some concern smugglers who supplied the losing army; others concern surrendered opponents or families whose cooperation the administration needs. The Countess can accept local sponsorship as a path to reconciliation, or record every pardon as a conditional favour that officials can later use as leverage."
 hsm_cyanolisia.32.a:0 "Let the loyal families sponsor their own."
 hsm_cyanolisia.32.b:0 "Every pardon receives a file."
 hsm_cyanolisia.33.t:0 "The Frontier Schoolhouse"
 hsm_cyanolisia.33.d:0 "The first schoolhouse opens in a town whose loyalties change with every patrol. The children learn letters beside maps of the new frontier. Their parents watch the teachers with suspicion, but suspicion is still a kind of attendance."
 hsm_cyanolisia.33.a:0 "Teach them to read the new laws."
 hsm_cyanolisia.33.b:0 "Begin with loyalty primers."
 hsm_cyanolisia.34.t:0 "Lessons For An Emperor"
 hsm_cyanolisia.34.d:0 "The lesson books arrive from Thymíaustadt: dynastic histories, frontier reports, moral tales, and military maps. The pages removed before binding tell Grover as much about the regency as those left inside. The Countess has brought him beneath her protection; now she must decide what sort of ruler her guardianship will teach him to become."
 hsm_cyanolisia.34.a:0 "Teach him mercy as discipline."
 hsm_cyanolisia.34.b:0 "Teach him authority as duty."
 hsm_cyanolisia.34.c:0 "Let him learn how the border provinces live."
 hsm_cyanolisia.35.t:0 "Sentences In The Valley"
 hsm_cyanolisia.35.d:0 "Dawnclaw's tribunals sit under armed guards and borrowed seals. A village elder denies hiding rifles. A guild clerk produces three ledgers and a fourth by accident. The question is not whether the frontier will be judged, but whether fear should be public or administrative."
 hsm_cyanolisia.35.a:0 "Make the sentences visible."
 hsm_cyanolisia.35.b:0 "Let the files do the work."
 hsm_cyanolisia.36.t:0 "Cadets From Hostage Houses"
 hsm_cyanolisia.36.d:0 "The hostage rolls are full of sons old enough to learn drill and young enough to be reshaped. Some officers want them watched in barracks. Others see a future corps of frontier auxiliaries with every family bond tied to Cyanolisian command."
 hsm_cyanolisia.36.a:0 "Enroll them as cadets."
 hsm_cyanolisia.36.b:0 "Bind them through officer bonds."
 hsm_cyanolisia.37.t:0 "The Grover Dossier"
 hsm_cyanolisia.37.d:0 "The dossier begins with a few pages: the boy's tutors, routines, reported moods and the attendants he trusts. Dawnclaw's staff weighs three possibilities. Grover could be trained to lend a name to another's decisions, treated as a rival to eliminate, or left beyond an immediate verdict while the succession is debated."
 hsm_cyanolisia.37.a:0 "Prepare him as a puppet."
 hsm_cyanolisia.37.b:0 "Prepare for the worst answer."
 hsm_cyanolisia.37.c:0 "Keep it sealed until the succession is settled."
 HSM_CYA_southern_amnesty_notables:0 "Southern amnesties were sponsored by loyal families"
 HSM_CYA_herzland_ready_tt:0 "§YThe Herzland§! must either be united around Griffenheim or the campaign must wait until §Y1013§!."
 HSM_CYA_blackrock_survey_corps_idea:0 "Blackhollow Survey Corps"
 HSM_CYA_blackrock_survey_corps_idea_desc:0 "Survey parties map wells, roads, ruins, and defensible tracks before the frontier county is restored."
 HSM_CYA_southern_provincial_diets_idea:0 "Southern Provincial Diets"
 HSM_CYA_southern_provincial_diets_idea_desc:0 "Supervised provincial diets give the Countess a conservative channel for southern petitions and tax bargaining."
 HSM_CYA_merchant_arbitration_idea:0 "Merchant Arbitration Boards"
 HSM_CYA_merchant_arbitration_idea_desc:0 "Port merchants and estate creditors settle disputes through boards watched by Cyanolisian clerks."
 HSM_CYA_kivessin_compromise_idea:0 "Kivessin Compromise"
 HSM_CYA_kivessin_compromise_idea_desc:0 "Temples, estates, and city families are kept inside a narrow bargain of obedience and dignity."
 HSM_CYA_kaiv_autonomy_idea:0 "Kaiv Autonomy Charter"
 HSM_CYA_kaiv_autonomy_idea_desc:0 "Kaiv retains a supervised Rada and negotiated local obligations, while Cyanolisia directs external policy and coordinates the frontier army."
 HSM_CYA_lushland_border_commission_idea:0 "Lushland Border Commission"
 HSM_CYA_lushland_border_commission_idea_desc:0 "Surveyors and clerks turn Lushland's confused frontier into roads, rolls, and enforceable borders."
 HSM_CYA_gryphus_company_charter_idea:0 "Gryphus Company Charter"
 HSM_CYA_gryphus_company_charter_idea_desc:0 "The Southern Continent Company receives a supervised charter in exchange for taxes, transport, and loyalty."
 HSM_CYA_integrated_evi_valley_idea:0 "Integrated Evi Valley"
 HSM_CYA_integrated_evi_valley_idea_desc:0 "Kivessin's estates, Kaiv's Rada and the free towns accepted different terms. The provincial administration must honour those bargains within one system if the peace in Evi is to last."
 HSM_CYA_southern_amnesty_registers_flag:0 "Southern amnesties were placed in state registers"
 HSM_CYA_frontier_school_missions_flag:0 "Frontier school missions were opened"
 HSM_CYA_frontier_loyalty_primers:0 "Frontier loyalty primers were distributed"
 HSM_CYA_grover_lesson_mercy:0 "Grover's lessons emphasize disciplined mercy"
 HSM_CYA_grover_lesson_authority:0 "Grover's lessons emphasize imperial authority"
 HSM_CYA_grover_lesson_frontier:0 "Grover's lessons emphasize the frontier"
 HSM_CYA_frontier_public_tribunals:0 "Frontier tribunals use public sentences"
 HSM_CYA_frontier_paper_tribunals:0 "Frontier tribunals work through administrative files"
 HSM_CYA_hostage_cadets_enrolled:0 "Hostage cadets were enrolled"
 HSM_CYA_hostage_officer_bonds:0 "Hostage families were bound through officer service"
 HSM_CYA_grover_puppet_education_file:0 "The Grover file prepares a puppet coronation"
 HSM_CYA_grover_liability_file:0 "The Grover file prepares for removing him"
 HSM_CYA_grover_sealed_file:0 "The Grover file remains sealed"
 hsm_cyanolisia.40.t:0 "The Crown In Trust"
 hsm_cyanolisia.40.d:0 "The regency has gathered the provinces and kept its promise long enough to make it dangerous. Before the court in Griffenheim, the Countess gives up the authority she could have kept. Grover VI receives the crown beneath old banners and new guards; loyalists weep, provincial delegates count their concessions, and the army waits to see which orders will now carry his seal."
 hsm_cyanolisia.40.a:0 "The crown passes to Grover VI."
 hsm_cyanolisia.41.t:0 "The Year Without A Coronation"
 hsm_cyanolisia.41.d:0 "The appointed day arrives without a coronation. Dawnclaw has killed Grover VI, and the throne is now declared an office of imperial command. Officers welcome the certainty; priests and old loyalists understand the cost."
 hsm_cyanolisia.41.a:0 "There is no Emperor but the Empire."
 hsm_cyanolisia.42.t:0 "The Coronation Under Guard"
 hsm_cyanolisia.42.d:0 "Grover VI is led through Griffenheim beneath restored banners and rifle barrels. The crown is real, the prayers are old, and the applause is loud enough to hide the locks. Dawnclaw stands beside the ceremony as the Empire's necessary protector. Loyalists are allowed to believe. Officers are allowed to understand."
 hsm_cyanolisia.42.a:0 "Let them see their Emperor."
 hsm_cyanolisia.43.t:0 "Grover VI Receives The Empire"
 hsm_cyanolisia.43.d:0 "Grover VI takes the crown before a capital rebuilt by soldiers, clerks and frightened patriots. Dawnclaw also yields the executive seals: he has chosen a state that can outlive him over one dependent on his personal command. The army and ministries remain, but Grover may now dismiss their heads. The general's signature beneath that settlement is the ceremony's least decorative act."
 hsm_cyanolisia.43.a:0 "For Grover VI, and for the Empire."
 hsm_cyanolisia.44.t:0 "The Countess Falls Silent"
 hsm_cyanolisia.44.d:0 "By morning the Countess' apartments are sealed, her personal guard has been relieved, and the palace physicians sign a statement no one at court is foolish enough to read aloud. Taillow Sumpfkiel is dead. Dawnclaw's officers speak only of security, continuity, and the necessities of state, while the old household learns that mourning is permitted only in private."
 hsm_cyanolisia.44.a:0 "The court understands."
 HSM_CYA_regency_bread_offices:0 "Regency Bread Offices"
 HSM_CYA_regency_bread_offices_desc:0 "Griffenheim cannot be governed by banners alone. The regency will begin with ration offices, market inspectors, and the slow restoration of ordinary food deliveries."
 HSM_CYA_restore_imperial_courts:0 "Restore Imperial Courts"
 HSM_CYA_restore_imperial_courts_desc:0 "If the Countess means to rule for Grover, she must make the old law useful again: reopened courts, reviewed confiscations, and judges who know who restored their benches."
 HSM_CYA_emergency_griffenheim_command:0 "Emergency Griffenheim Command"
 HSM_CYA_emergency_griffenheim_command_desc:0 "Dawnclaw treats the capital as a headquarters first and a city second. Curfews, billets, depot guards, and staff officers will keep Griffenheim obedient while reconstruction begins."
 HSM_CYA_purge_imperial_remainders:0 "Purge the Old Imperial Apparatus"
 HSM_CYA_purge_imperial_remainders_desc:0 "The old ministries are full of men who survived every regime by filing the correct paper at the correct time. Dawnclaw will find which of them still belong to the dead Empire."
 HSM_CYA_countess_local_compacts_idea:0 "Local Compacts"
 HSM_CYA_countess_local_compacts_idea_desc:0 "The Countess stabilizes new territories through town privileges, registered councils, and negotiated obligations."
 HSM_CYA_countess_trade_boards_idea:0 "Trade Boards"
 HSM_CYA_countess_trade_boards_idea_desc:0 "Customs boards and chartered merchants turn conquest into ledgers the regency can actually administer."
 HSM_CYA_dawnclaw_frontier_controls_idea:0 "Frontier Controls"
 HSM_CYA_dawnclaw_frontier_controls_idea_desc:0 "Dawnclaw's officers rely on registries, patrols, and supervised local commanders to keep the frontier quiet."
 HSM_CYA_dawnclaw_security_files_idea:0 "Security Files"
 HSM_CYA_dawnclaw_security_files_idea_desc:0 "Ports, companies, and chapterhouses are mapped through files that turn local influence into leverage."
 HSM_CYA_frontier_loyalty_primers_idea:0 "Frontier Loyalty Primers"
 HSM_CYA_frontier_loyalty_primers_idea_desc:0 "School texts in the frontier teach loyalty through maps, law, and carefully chosen imperial history."
 HSM_CYA_frontier_paper_tribunals_idea:0 "Paper Tribunals"
 HSM_CYA_frontier_paper_tribunals_idea_desc:0 "Dawnclaw's tribunals sometimes punish with forms rather than gallows, creating informants and obligations instead of martyrs."
 HSM_CYA_hostage_officer_bonds_idea:0 "Hostage Officer Bonds"
 HSM_CYA_hostage_officer_bonds_idea_desc:0 "Compromised families are bound to the army through sons whose careers depend on obedience."
 HSM_CYA_regency_bread_offices_idea:0 "Regency Bread Offices"
 HSM_CYA_regency_bread_offices_idea_desc:0 "Ration offices and market inspectors make the regency visible in daily life before politics can return to the streets."
 HSM_CYA_restored_imperial_courts_idea:0 "Restored Imperial Courts"
 HSM_CYA_restored_imperial_courts_idea_desc:0 "Reopened courts give the regency a lawful face and a way to sort collaborators from useful servants."
 HSM_CYA_emergency_griffenheim_command_idea:0 "Emergency Griffenheim Command"
 HSM_CYA_emergency_griffenheim_command_idea_desc:0 "The capital is held through military offices, depot guards, and staff orders that treat disorder as a logistical failure."
 HSM_CYA_purge_imperial_remainders_idea:0 "Purged Imperial Apparatus"
 HSM_CYA_purge_imperial_remainders_idea_desc:0 "Old officials are screened, frightened, and selectively retained by Dawnclaw's security staff."
 HSM_CYA_grover_mercy_lesson_idea:0 "Grover's Lesson: Mercy"
 HSM_CYA_grover_mercy_lesson_idea_desc:0 "The young emperor's prepared image emphasizes reconciliation and the restoration of ordinary peace."
 HSM_CYA_grover_authority_lesson_idea:0 "Grover's Lesson: Authority"
 HSM_CYA_grover_authority_lesson_idea_desc:0 "The young emperor's prepared image emphasizes obedience, hierarchy, and the return of command."
 HSM_CYA_grover_frontier_lesson_idea:0 "Grover's Lesson: Frontier"
 HSM_CYA_grover_frontier_lesson_idea_desc:0 "The young emperor's prepared image binds imperial legitimacy to the hard borderlands that restored him."
 HSM_CYA_grover_liability_file_idea:0 "Grover Liability File"
 HSM_CYA_grover_liability_file_idea_desc:0 "Dawnclaw's staff preserves the argument that Grover is more danger than symbol."
 HSM_CYA_puppet_education_file_idea:0 "Puppet Education File"
 HSM_CYA_puppet_education_file_idea_desc:0 "Every lesson prepared for Grover is also a leash, written in manners, ceremonies, and carefully managed tutors."
 HSM_CYA_revealed_exile_regime_secure:0 "Secured Exile Regime"
 HSM_CYA_revealed_exile_regime_secure_desc:0 "Dawnclaw's seizure of power has passed from emergency conspiracy into an armed government with offices, guards, and routines."
 HSM_CYA_strained_minotaurian_indigenes:0 "Restive Minotaur Communities"
 HSM_CYA_strained_minotaurian_indigenes_desc:0 "The minotaurian interior remains hostile and underrepresented, but Dawnclaw's regime has begun replacing old imperial neglect with registries, coercion, and limited military bargaining."
 HSM_CYA_policed_minotaurian_outback:0 "Policed Minotaurian Outback"
 HSM_CYA_policed_minotaurian_outback_desc:0 "The outback is watched by patrols, informants, and road posts. The system is costly and resented, but no longer drains the coastal garrisons quite as blindly as before."
 HSM_CYA_registered_minotaurian_communities:0 "Registered Minotaurian Communities"
 HSM_CYA_registered_minotaurian_communities_desc:0 "After the southern campaign, local minotaurian communities are forced into registries and obligations that reduce resistance without pretending reconciliation has arrived."
 HSM_CYA_asterion_military_governorate:0 "Asterion Military Governorate"
 HSM_CYA_asterion_military_governorate_desc:0 "Asterion is held by garrisons, auxiliary rolls, and military offices while Dawnclaw turns the next campaign toward Sicameon."
 HSM_CYA_southern_security_administration:0 "Southern Security Administration"
 HSM_CYA_southern_security_administration_desc:0 "The emergency southern commands have been folded into a permanent administration for ports, roads, auxiliaries, and registered local authorities."
 HSM_CYA_countess_southern_settlement:0 "Southern Settlement"
 HSM_CYA_countess_southern_settlement_desc:0 "The Countess replaces wartime mandates with trade boards, local bargains, and a conservative settlement for the southern coast."
 HSM_CYA_herzland_reconstruction_authority_settled:0 "Settled Herzland Authority"
 HSM_CYA_herzland_reconstruction_authority_settled_desc:0 "The authority built for the march on Griffenheim is being repurposed into occupation offices, reconstruction boards, and police supervision."
