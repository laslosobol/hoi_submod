l_english:
 hsm_cyanolisia.1.t:0 "A Fugitive From Griffenheim"
 hsm_cyanolisia.1.d:0 "The purge in Griffenheim has sent officers, informants, and frightened couriers scattering across the Herzland. One such courier arrives at the Countess' court under a false name, carrying a sealed confession and a request for sanctuary from Ferdinand Dawnclaw himself. Granting him refuge would risk imperial anger, but his knowledge of the army could prove useful if he is kept quiet and close."
 hsm_cyanolisia.1.a:0 "Hide him as the Countess' assistant."
 hsm_cyanolisia.1.b:0 "Send him away before the Empire notices."
 HSM_CYA_ferdinand_dawnclaw:0 "Ferdinand Dawnclaw"
 HSM_CYA_ferdinand_dawnclaw_desc:0 "Officially a minor assistant in the Countess' household, Dawnclaw remains a dangerous exile with a soldier's memory for names, formations, and grudges. His presence stiffens resolve against Griffenheim, but keeping him hidden drains political capital."
 HSM_CYA_dawnclaw_country_leader_desc:0 "Dawnclaw no longer hides behind the Countess' household. Cyanolisia now serves as the base for his discipline, revenge, and unfinished imperial ambitions."
 HSM_CYA_dawnclaw_assistant_appointed_tt:0 "Ferdinand Dawnclaw will be appointed as a Political Advisor and cannot be replaced."
 HSM_CYA_dawnclaw_griffonian_files:0 "Dawnclaw's Griffenheim Files"
 HSM_CYA_dawnclaw_griffonian_files_desc:0 "Dawnclaw brought names, maps, marching tables, and private grudges from Griffenheim. Even in exile, his knowledge makes Cyanolisia more dangerous to the Empire."
 hsm_cyanolisia.2.t:0 "Three Uses For A Fugitive"
 hsm_cyanolisia.2.d:0 "Dawnclaw has survived the first days in hiding. His name remains absent from the ledgers, his rooms are listed as storage, and the Countess' staff have learned not to ask why a minor assistant receives military reports. Now the court must decide what this dangerous guest is actually for."
 hsm_cyanolisia.2.a:0 "He is an adviser, nothing more."
 hsm_cyanolisia.2.b:0 "Bind him to the court."
 hsm_cyanolisia.2.c:0 "Turn his papers over to an administration."
 hsm_cyanolisia.3.t:0 "A Marriage Of Convenience"
 hsm_cyanolisia.3.d:0 "No public romance could explain the arrangement, and perhaps none is needed. The Countess gains a soldier who knows Griffenheim's weaknesses. Dawnclaw gains a roof, a name, and a court he can attempt to bend toward revenge."
 hsm_cyanolisia.3.a:0 "Let the court whisper."
 hsm_cyanolisia.4.t:0 "The Colonel's Household"
 hsm_cyanolisia.4.d:0 "The palace guard no longer waits for civilian clerks. Reports pass through Dawnclaw's desk before they reach the Countess, and officers increasingly speak of security, discipline, and the enemies within."
 hsm_cyanolisia.4.a:0 "He knows how to impose order."
 hsm_cyanolisia.5.t:0 "The Countess Presides"
 hsm_cyanolisia.5.d:0 "Taillow has allowed Dawnclaw to advise, but not command. The marriage remains politically useful, his files are valuable, his fury is contained, and the court has learned that the exile survives only because the Countess permits it."
 hsm_cyanolisia.5.a:0 "The court remembers who rules."
 hsm_cyanolisia.10.t:0 "Knives From Griffenheim"
 hsm_cyanolisia.10.d:0 "The fiction surrounding Dawnclaw has frayed. A courier is missing, a servant has been bribed, and the palace guard has intercepted signs of Imperial agents moving through the port. Someone in Griffenheim has decided the failed colonel should not live long enough to become useful."
 hsm_cyanolisia.10.a:0 "Move him before they strike."
 hsm_cyanolisia.10.b:0 "The agents find their mark."
 hsm_cyanolisia.11.t:0 "The Cover Slips"
 hsm_cyanolisia.11.d:0 "Too many letters have been burned, too many officers have visited after dark, and too many servants have seen the Countess' assistant reading military dispatches. The secret is no longer contained inside the palace."
 hsm_cyanolisia.11.a:0 "Griffenheim will hear of this."
 hsm_cyanolisia.12.t:0 "An Imperial Cabinet For Cyanolisia"
 hsm_cyanolisia.12.d:0 "Dawnclaw's death has left the court with a corpse, a scandal, and no faction strong enough to rule cleanly through the panic. Griffenheim has moved quickly. Advisers arrive under diplomatic seals, trade clerks take possession of factory ledgers, and a new cabinet is assembled from officials willing to call dependency stability. Cyanolisia keeps its banners and its Countess, but the machinery beneath them now answers to Imperial hands."
 hsm_cyanolisia.12.a:0 "Order, at a price."
 HSM_CYA_frontier_march_path_tt:0 "Unlocks the defensive Cyanolisian March skeleton decisions."
 HSM_CYA_marriage_path_tt:0 "Unlocks the marriage and court power struggle skeleton decisions."
 HSM_CYA_imperial_admin_path_tt:0 "Unlocks the short Imperial Administration fallback skeleton."
 HSM_CYA_proxy_rule_trade:0 "Proxy Trade Administration"
 HSM_CYA_power_struggle_unlocked_tt:0 "The balance between Dawnclaw and the Countess can now be shaped through decisions."
 HSM_CYA_dawnclaw_dominance_tt:0 "Dawnclaw dominates the court. His open hand in security will increase weekly exposure."
 HSM_CYA_countess_dominance_tt:0 "The Countess dominates the court. Dawnclaw remains hidden for longer."
 HSM_CYA_assassination_prevented_tt:0 "Dawnclaw is moved to a safer hiding place for a time."
 HSM_CYA_exposure_minus_2_tt:0 "Dawnclaw's exposure is reduced by §G2§!."
 HSM_CYA_exposure_minus_3_tt:0 "Dawnclaw's exposure is reduced by §G3§!."
 HSM_CYA_exposure_minus_4_tt:0 "Dawnclaw's exposure is reduced by §G4§!."
 HSM_CYA_exposure_minus_5_tt:0 "Dawnclaw's exposure is reduced by §G5§!."
 HSM_CYA_advisor_role_confirmed_tt:0 "Dawnclaw's role is reduced to visible advisory work. Imperial agents will no longer pursue the assassination loop."
 HSM_CYA_hide_the_fugitive:0 "Hide The Fugitive"
 HSM_CYA_hide_the_fugitive_desc:0 "A false name, a locked room, and a few carefully misplaced records may keep Ferdinand Dawnclaw hidden long enough for the Countess' court to decide what he is truly for."
 HSM_CYA_an_unlikely_marriage:0 "An Unlikely Marriage"
 HSM_CYA_an_unlikely_marriage_desc:0 "Bind Dawnclaw to the Countess' court by marriage, turning a hidden exile into a permanent crisis of household power."
 HSM_CYA_frontier_march_plan:0 "The Frontier March Plan"
 HSM_CYA_frontier_march_plan_desc:0 "Keep Dawnclaw as a quiet defensive adviser and turn Cyanolisia's vulnerable borderlands into a disciplined march."
 HSM_CYA_reorganise_border_forces:0 "Reorganization And Restandardization"
 HSM_CYA_reorganise_border_forces_desc:0 "Let Dawnclaw quietly audit training manuals, supply tables, and field routines until the border forces begin to resemble a modern army."
 HSM_CYA_modernise_internal_intelligence:0 "Modernise Internal Intelligence"
 HSM_CYA_modernise_internal_intelligence_desc:0 "Fold Dawnclaw's methods into a modest internal intelligence bureau, proving to Griffenheim's observers that he is an adviser, not a pretender."
 HSM_CYA_frontier_drill_standards:0 "Frontier Drill Standards"
 HSM_CYA_frontier_drill_standards_desc:0 "Turn Dawnclaw's first inspection notes into repeatable border drills, supply checks, and field routines."
 HSM_CYA_frontier_signals_network:0 "Frontier Signals Network"
 HSM_CYA_frontier_signals_network_desc:0 "Link the internal intelligence office with border posts, couriers, and listening rooms without making Dawnclaw look like a claimant."
 HSM_CYA_local_supply_depots:0 "Local Supply Depots"
 HSM_CYA_local_supply_depots_desc:0 "Stock the march with local depots and repair stores so the border forces can fight without waiting on the capital."
 HSM_CYA_fortify_against_minotauria:0 "Fortify Against Minotauria"
 HSM_CYA_fortify_against_minotauria_desc:0 "Turn the southern approaches into prepared positions, supply sheds, and mapped fallback lines."
 HSM_CYA_watch_sicameon:0 "Watch Sicameon"
 HSM_CYA_watch_sicameon_desc:0 "Extend the signals network toward the coast and make Sicameon a watched frontier rather than an ignored neighbour."
 HSM_CYA_defensive_victory_claims:0 "Defensive Victory Claims"
 HSM_CYA_defensive_victory_claims_desc:0 "Prepare the legal papers and military maps that would let Cyanolisia demand compensation after a successful defensive war."
 HSM_CYA_proclaim_cyanolisian_march:0 "The Cyanolisian March"
 HSM_CYA_proclaim_cyanolisian_march_desc:0 "Give the frontier system a public name, a chain of command, and enough local pride to survive without becoming Dawnclaw's throne."
 HSM_CYA_civilian_liaison_offices:0 "Civilian Liaison Offices"
 HSM_CYA_civilian_liaison_offices_desc:0 "Give the Countess' clerks a permanent place inside security affairs, keeping Dawnclaw useful but surrounded by civilian procedure."
 HSM_CYA_codify_household_compact:0 "Codify The Household Compact"
 HSM_CYA_codify_household_compact_desc:0 "Write the court's new balance into titles, signatures, and chains of command before any officer can pretend it is temporary."
 HSM_CYA_the_hidden_assistant:0 "The Hidden Assistant"
 HSM_CYA_the_hidden_assistant_desc:0 "Keep Dawnclaw close enough to advise and quiet enough that the Countess remains the only visible center of power."
 HSM_CYA_the_countess_alone:0 "The Countess Presides"
 HSM_CYA_the_countess_alone_desc:0 "Keep the marriage intact while making the court understand that Dawnclaw is protected by the Countess, useful to the Countess, and politically smaller than the Countess."
 HSM_CYA_recognise_outback_councils:0 "Recognise Outback Councils"
 HSM_CYA_recognise_outback_councils_desc:0 "Turn local minotaur intermediaries into registered councils, trading autonomy at the edges for calmer administration."
 HSM_CYA_palace_security_directorate:0 "Palace Security Directorate"
 HSM_CYA_palace_security_directorate_desc:0 "Let Dawnclaw formalize the palace guard, the courier watch, and the files that decide who may stand near the Countess."
 HSM_CYA_field_security_battalions:0 "Field Security Battalions"
 HSM_CYA_field_security_battalions_desc:0 "Raise disciplined security detachments for field headquarters and railway nodes before Dawnclaw risks open provincial policing."
 HSM_CYA_the_colonels_household:0 "The Colonel's Household"
 HSM_CYA_the_colonels_household_desc:0 "Turn the palace's private security apparatus into Dawnclaw's household staff in everything but name."
 HSM_CYA_the_revealed_exile:0 "The Revealed Exile"
 HSM_CYA_the_revealed_exile_desc:0 "Dawnclaw's role can no longer be treated as a harmless clerkship. If he rules from the shadows, the shadows must become disciplined."
 HSM_CYA_cabinet_procurement_board:0 "Cabinet Procurement Board"
 HSM_CYA_cabinet_procurement_board_desc:0 "Bring workshop orders under a cabinet board so military production recovers without escaping Imperial supervision."
 HSM_CYA_rationalise_proxy_quotas:0 "Rationalise Proxy Quotas"
 HSM_CYA_rationalise_proxy_quotas_desc:0 "Negotiate predictable factory quotas with Griffenheim, still exploitative, but less chaotic for Cyanolisian ledgers."
 HSM_CYA_dawnclaw_hiding:0 "Dawnclaw's Cover"
 HSM_CYA_dawnclaw_hiding_desc:0 "§YCurrent Exposure§!: §R[?Root.HSM_CYA_dawnclaw_exposure|0]§!/§Y10§!\n\nExposure rises by §R1§! every week while Dawnclaw remains hidden. The defensive path adds no extra pressure. Countess dominance adds §R+1§! weekly, while Dawnclaw dominance adds §R+2§! weekly.\n\nAt §Y7§! exposure, Griffenheim agents begin closing in. If exposure reaches §R10§!, the assassination fires."
 HSM_CYA_griffenheim_agents_closing_in:0 "Griffenheim Agents Closing In"
 HSM_CYA_griffenheim_agents_closing_in_desc:0 "Imperial agents have enough fragments to start tracing Dawnclaw's movements. Reduce his exposure below §Y7§! to break the trail before it reaches him."
 HSM_CYA_maintain_dawnclaw_cover:0 "Maintain Dawnclaw's Cover"
 HSM_CYA_maintain_dawnclaw_cover_desc:0 "Refresh the false papers, move the servants around, and make sure the Countess' assistant remains an assistant on paper."
 HSM_CYA_counterintelligence_sweep:0 "Counterintelligence Sweep"
 HSM_CYA_counterintelligence_sweep_desc:0 "Commit loyal officers to trace leaks, isolate suspect couriers, and smother the signs that Dawnclaw is acting from inside the court."
 HSM_CYA_stage_loyalist_raids:0 "Stage Loyalist Raids"
 HSM_CYA_stage_loyalist_raids_desc:0 "Dawnclaw's loyalists can raid suspected Imperial contacts before they report home, but such violence will shake the court."
 HSM_CYA_disappear_compromised_witnesses:0 "Disappear Compromised Witnesses"
 HSM_CYA_disappear_compromised_witnesses_desc:0 "A few servants, couriers, and minor officers know too much. Dawnclaw's men can solve that problem, though the silence will be noticed."
 HSM_CYA_integrate_minotaur_outback:0 "Charter Outback Autonomy"
 HSM_CYA_integrate_minotaur_outback_desc:0 "Pacify the outback through registered local privileges, limited self-rule, and predictable obligations rather than direct assimilation."
 HSM_CYA_police_minotaur_outback:0 "Police The Minotaur Outback"
 HSM_CYA_police_minotaur_outback_desc:0 "Dawnclaw favours patrols, informants, and force over concessions."
 HSM_CYA_delegate_security_to_dawnclaw:0 "Delegate Security To Dawnclaw"
 HSM_CYA_delegate_security_to_dawnclaw_desc:0 "Let Dawnclaw reshape court security and the army's internal discipline."
 HSM_CYA_expand_countess_cabinet:0 "Expand The Countess' Cabinet"
 HSM_CYA_expand_countess_cabinet_desc:0 "Strengthen civilian administration before the exile's officers become the only organized faction in court."
 HSM_CYA_install_imperial_cabinet:0 "Install The Imperial Cabinet"
 HSM_CYA_install_imperial_cabinet_desc:0 "Accept Griffenheim's clerks, inspectors, and trade officers as the price of restoring order after Dawnclaw's death."
 HSM_CYA_regularise_minotaur_administration:0 "Regularise Minotaur Administration"
 HSM_CYA_regularise_minotaur_administration_desc:0 "Replace emergency patrols with registered councils, controlled permits, and predictable tax offices in the outback."
 HSM_CYA_reopen_military_workshops:0 "Reopen Military Workshops"
 HSM_CYA_reopen_military_workshops_desc:0 "Restore a few idle workshops under cabinet supervision, enough to steady production without freeing the army from Imperial oversight."
 HSM_CYA_consolidate_proxy_cabinet:0 "Consolidate The Proxy Cabinet"
 HSM_CYA_consolidate_proxy_cabinet_desc:0 "Turn the temporary Imperial committee into a functioning administration that Cyanolisia's officials can survive inside."
 HSM_CYA_frontier_march_policy:0 "Cyanolisian March Policy"
 HSM_CYA_frontier_march_policy_desc:0 "Dawnclaw remains an adviser, useful mostly for drilling the borders and preparing Cyanolisia to survive a defensive war."
 HSM_CYA_reorganised_border_forces:0 "Reorganised Border Forces"
 HSM_CYA_reorganised_border_forces_desc:0 "The border forces have been restandardized through dull manuals, repeated drills, and Dawnclaw's unforgiving eye for small failures."
 HSM_CYA_frontier_drill_standards_idea:0 "Frontier Drill Standards"
 HSM_CYA_frontier_drill_standards_idea_desc:0 "Every frontier company now uses the same drills, supply checks, and defensive routines."
 HSM_CYA_internal_intelligence_modernisation:0 "Modernised Internal Intelligence"
 HSM_CYA_internal_intelligence_modernisation_desc:0 "Dawnclaw's knowledge now serves a limited internal intelligence office. The arrangement is visible enough to seem harmless and useful enough to keep."
 HSM_CYA_frontier_signals_network_idea:0 "Frontier Signals Network"
 HSM_CYA_frontier_signals_network_idea_desc:0 "Reports from the march now move through a quiet web of couriers, listening posts, and civilian intelligence clerks."
 HSM_CYA_local_supply_depots_idea:0 "Local Supply Depots"
 HSM_CYA_local_supply_depots_idea_desc:0 "Cyanolisia's border stores are small, dispersed, and boringly inventoried, which is exactly why they work."
 HSM_CYA_minotaurian_border_works:0 "Minotaurian Border Works"
 HSM_CYA_minotaurian_border_works_desc:0 "The southern approaches are prepared with bunkers, depots, field maps, and stubborn local garrisons."
 HSM_CYA_sicameon_watch_posts:0 "Sicameon Watch Posts"
 HSM_CYA_sicameon_watch_posts_desc:0 "Cyanolisian observers now watch the western approaches with couriers, signal stations, and quiet suspicion."
 HSM_CYA_proclaimed_cyanolisian_march:0 "Proclaimed Cyanolisian March"
 HSM_CYA_proclaimed_cyanolisian_march_desc:0 "The frontier has been given a name and a purpose: endure pressure, answer raids, and keep the Countess' border intact."
 HSM_CYA_unlikely_marriage:0 "An Unlikely Marriage"
 HSM_CYA_unlikely_marriage_desc:0 "The Countess and Dawnclaw are bound by convenience, calculation, and mutual danger. The court watches to see which of them will truly rule."
 HSM_CYA_dawnclaw_dominant_court:0 "Dawnclaw Dominates The Court"
 HSM_CYA_dawnclaw_dominant_court_desc:0 "The Countess still signs the orders, but Dawnclaw's office decides what reaches her desk."
 HSM_CYA_security_directorate_court:0 "Security Directorate Court"
 HSM_CYA_security_directorate_court_desc:0 "Dawnclaw's directorate filters petitions, guards corridors, and decides which threats are real enough to reach the Countess."
 HSM_CYA_colonels_household:0 "The Colonel's Household"
 HSM_CYA_colonels_household_desc:0 "The court guard, courier rooms, and security clerks increasingly answer to Dawnclaw's household before anyone else."
 HSM_CYA_countess_dominant_court:0 "The Countess Dominates The Court"
 HSM_CYA_countess_dominant_court_desc:0 "Dawnclaw remains useful, but contained. The court bends back toward civilian rule and cautious integration."
 HSM_CYA_countess_civilian_court:0 "Civilian Liaison Court"
 HSM_CYA_countess_civilian_court_desc:0 "Civilian clerks now sit beside the security officers, turning Dawnclaw's usefulness into paperwork the Countess can control."
 HSM_CYA_household_compact:0 "Household Compact"
 HSM_CYA_household_compact_desc:0 "The court's new settlement makes Dawnclaw an instrument of the Countess' rule, not a rival center of power."
 HSM_CYA_hidden_assistant_court:0 "The Hidden Assistant"
 HSM_CYA_hidden_assistant_court_desc:0 "Dawnclaw's work is useful, narrow, and publicly deniable. That is exactly how the Countess prefers him."
 HSM_CYA_countess_alone_court:0 "The Countess Presides"
 HSM_CYA_countess_alone_court_desc:0 "The marriage remains useful, but the court has absorbed Dawnclaw's talents without sharing sovereignty with him."
 HSM_CYA_revealed_exile_regime:0 "The Revealed Exile"
 HSM_CYA_revealed_exile_regime_desc:0 "Dawnclaw is no longer merely hidden in the court. His enemies suspect the truth, and his supporters have begun to act like a regime."
 HSM_CYA_imperial_administration:0 "Imperial Administration"
 HSM_CYA_imperial_administration_desc:0 "Dawnclaw is gone or sidelined, but his papers, contacts, and enemies remain. A small administrative clique now handles the aftermath."
 HSM_CYA_gri_proxy_rule:0 "Griffenheim Proxy Rule"
 HSM_CYA_gri_proxy_rule_desc:0 "Imperial advisers supervise Cyanolisia's ledgers, trade policy, and military procurement. A large share of civilian and military output is effectively reserved for Griffenheim, buying stability and trade access at the cost of real autonomy."
 HSM_CYA_imperial_cabinet_direct_rule:0 "Imperial Cabinet Direct Rule"
 HSM_CYA_imperial_cabinet_direct_rule_desc:0 "The old direct rule apparatus has been folded into a cabinet of Imperial inspectors, local clerks, and carefully watched Cyanolisian administrators."
 HSM_CYA_consolidated_direct_rule:0 "Consolidated Cabinet Direct Rule"
 HSM_CYA_consolidated_direct_rule_desc:0 "The proxy cabinet has become boring enough to function, which is perhaps the highest compliment this kind of administration can earn."
 HSM_CYA_imperial_workshop_program:0 "Imperial Workshop Program"
 HSM_CYA_imperial_workshop_program_desc:0 "A limited production recovery program keeps Cyanolisian workshops running under cabinet supervision."
 HSM_CYA_cabinet_procurement_board_idea:0 "Cabinet Procurement Board"
 HSM_CYA_cabinet_procurement_board_idea_desc:0 "Military procurement now moves through ledgers that satisfy both Cyanolisian workshops and Imperial inspectors."
 HSM_CYA_rationalised_proxy_quotas:0 "Rationalised Proxy Quotas"
 HSM_CYA_rationalised_proxy_quotas_desc:0 "Factory concessions to Griffenheim remain painful, but the quotas are predictable enough for Cyanolisia to plan around them."
 HSM_CYA_dawnclaw_asylum_scheduled:0 "Dawnclaw's asylum event has been scheduled"
 HSM_CYA_dawnclaw_asylum_resolved:0 "Dawnclaw's asylum has been resolved"
 HSM_CYA_dawnclaw_hidden_in_court:0 "Dawnclaw is hidden in the Countess' court"
 HSM_CYA_dawnclaw_branch_unlocked:0 "Dawnclaw's Cyanolisian branch is unlocked"
 HSM_CYA_dawnclaw_path_chosen:0 "A role has been chosen for Dawnclaw"
 HSM_CYA_dawnclaw_married_countess:0 "Dawnclaw has married the Countess"
 HSM_CYA_dawnclaw_dead:0 "Dawnclaw is dead"
 HSM_CYA_dawnclaw_advisor_role_confirmed:0 "Dawnclaw has been reduced to an advisory role"
 HSM_CYA_dawnclaw_identity_secured:0 "Dawnclaw's identity is secured"
 HSM_CYA_dawnclaw_revealed_to_empire:0 "Dawnclaw has been revealed to Griffenheim"
 HSM_CYA_dawnclaw_assassination_pending:0 "Griffenheim agents are closing in"
 HSM_CYA_dawnclaw_assassination_launched:0 "Griffenheim agents have moved to strike"
 HSM_CYA_dawnclaw_assassination_risk_ended:0 "Dawnclaw's assassination risk has ended"
 HSM_CYA_path_frontier_march:0 "Cyanolisia has chosen the Frontier March path"
 HSM_CYA_path_marriage:0 "Cyanolisia has chosen the marriage path"
 HSM_CYA_path_imperial_administration:0 "Cyanolisia has chosen the Imperial Administration path"
 HSM_CYA_countess_dominant:0 "The Countess dominates the court"
 HSM_CYA_dawnclaw_dominant:0 "Dawnclaw dominates the court"
 HSM_CYA_frontier_march_formed:0 "The Cyanolisian March has been formed"
 HSM_CYA_border_claims_prepared:0 "Border claims have been prepared"
 HSM_CYA_gri_proxy_rule_installed:0 "Griffenheim proxy rule has been installed"
 HSM_CYA_blackrock_wasteland_surveys:0 "Blackrock Wasteland Surveys"
 HSM_CYA_blackrock_wasteland_surveys_desc:0 "Map the routes, wells, and ruined holdings of the northern wastelands before anyone attempts to restore order there."
 HSM_CYA_restore_frontier_county:0 "Restore The Frontier County"
 HSM_CYA_restore_frontier_county_desc:0 "The old county name belongs elsewhere. Cyanolisia will instead restore a new frontier county around the Blackrock wastelands, tied to the march and watched by loyal garrisons."
 HSM_CYA_frontier_county_garrisons:0 "Frontier County Garrisons"
 HSM_CYA_frontier_county_garrisons_desc:0 "A restored frontier administration needs soldiers close enough to answer raids and dull enough to respect the local ledgers."
 HSM_CYA_countess_border_modernisation:0 "Border Modernisation"
 HSM_CYA_countess_border_modernisation_desc:0 "The Countess' regency begins with roads, depots, clerks, and defensive schedules rather than declarations."
 HSM_CYA_aristocratic_credit_lines:0 "Aristocratic Credit Lines"
 HSM_CYA_aristocratic_credit_lines_desc:0 "Landowners and old families will finance the first wave of reform, provided their place in the new order is respected."
 HSM_CYA_countess_minotaur_charter:0 "The Minotaur Charter"
 HSM_CYA_countess_minotaur_charter_desc:0 "Pacification under the Countess means controlled autonomy: local councils, registered privileges, and obligations the outback can live with."
 HSM_CYA_prepare_asterion_protectorate:0 "Prepare The Asterion Protectorate"
 HSM_CYA_prepare_asterion_protectorate_desc:0 "Minotauria is democratic, militarised, friendly to Sicameon, and a constant threat to the southern border. A protectorate plan must be ready."
 HSM_CYA_subdue_asterion:0 "Subdue Asterion"
 HSM_CYA_subdue_asterion_desc:0 "Asterion's independence has become a strategic danger. The Countess will wrap conquest in legal protection and provincial settlement."
 HSM_CYA_countess_sicameon_settlement:0 "Sicameon Settlement Papers"
 HSM_CYA_countess_sicameon_settlement_desc:0 "Sicameon's anti-monarchist republic cannot be left to threaten the coast. Prepare a settlement that binds its ports to Cyanolisia."
 HSM_CYA_claim_sicameon_coast:0 "Claim The Sicameon Coast"
 HSM_CYA_claim_sicameon_coast_desc:0 "The western coast must be secured before the frontier can become a road toward Gryphus and the Herzland."
 HSM_CYA_frontier_aristocratic_league:0 "Frontier Aristocratic League"
 HSM_CYA_frontier_aristocratic_league_desc:0 "Bind landed houses, merchant credit, and loyal officers into a conservative league for ruling the frontier."
 HSM_CYA_evi_valley_protectorates:0 "Evi Valley Protectorates"
 HSM_CYA_evi_valley_protectorates_desc:0 "Gryphus, Brodfeld, and Lushi cannot be allowed to drift into hostile coalitions while Cyanolisia prepares for the imperial question."
 HSM_CYA_regency_prepares_for_herzland:0 "The Regency Looks To Herzland"
 HSM_CYA_regency_prepares_for_herzland_desc:0 "The Countess does not claim the throne for herself. She prepares a regency that can carry Grover VI back to Griffenheim."
 HSM_CYA_countess_herzland_reconstruction:0 "Herzland Reconstruction Offices"
 HSM_CYA_countess_herzland_reconstruction_desc:0 "After Griffenheim is taken and the regency claims imperial succession, food, railways, tax ledgers, and local order must replace the devastation."
 HSM_CYA_restore_imperial_provinces:0 "Restore The Imperial Provinces"
 HSM_CYA_restore_imperial_provinces_desc:0 "Karfin, the northern republicans, Aquileian claimants, Hellquill, and Longsword all stand between the regency and a united Empire."
 HSM_CYA_countess_regency_for_grover:0 "Regency For Grover VI"
 HSM_CYA_countess_regency_for_grover_desc:0 "The Countess will rule as regent, preserve the Empire, and leave the final throne to Grover VI."
 HSM_CYA_dawnclaw_corporate_rearmament:0 "Corporate Rearmament"
 HSM_CYA_dawnclaw_corporate_rearmament_desc:0 "Dawnclaw gives contracts to factories and firms willing to accept discipline, secrecy, and accelerated production quotas."
 HSM_CYA_imperial_officer_cells:0 "Imperial Officer Cells"
 HSM_CYA_imperial_officer_cells_desc:0 "Exiled officers, nationalists, and old army contacts are organised into cells that can survive until the Herzland offensive."
 HSM_CYA_security_districts:0 "Security Districts"
 HSM_CYA_security_districts_desc:0 "Dawnclaw's secret police divide the country into watched districts where documents, travel, and loyalty are no longer private matters."
 HSM_CYA_operation_against_asterion:0 "Operation Against Asterion"
 HSM_CYA_operation_against_asterion_desc:0 "Minotauria is not a neighbour to be negotiated with. It is a flank to be broken and governed."
 HSM_CYA_military_governorate_asterion:0 "Install The Asterion Governorate"
 HSM_CYA_military_governorate_asterion_desc:0 "Once Asterion is broken or subordinated, its southern roads and workshops will be held by officers, informants, supply officers, and enough fear to make the railways run."
 HSM_CYA_sicameon_security_corridor:0 "Sicameon Security Corridor"
 HSM_CYA_sicameon_security_corridor_desc:0 "Sicameon's ports and militias are too dangerous to leave alone. Dawnclaw will carve a corridor to the coast."
 HSM_CYA_frontier_military_governorates:0 "Strike The Evi Valley"
 HSM_CYA_frontier_military_governorates_desc:0 "Gryphus, Brodfeld, Lushi, and the surrounding frontier states will be forced open before Dawnclaw turns the whole march toward Griffenheim."
 HSM_CYA_nationalist_frontier_mobilisation:0 "Nationalist Frontier Mobilisation"
 HSM_CYA_nationalist_frontier_mobilisation_desc:0 "Nationalists, veterans, and imperial loyalists will carry Cyanolisia from frontier war to Herzland war."
 HSM_CYA_prepare_herzland_offensive:0 "Prepare The Herzland Offensive"
 HSM_CYA_prepare_herzland_offensive_desc:0 "Dawnclaw's return will require maps, collaborators, supply depots, and a state willing to spend itself."
 HSM_CYA_herzland_reconstruction_authority:0 "Herzland Reconstruction Authority"
 HSM_CYA_herzland_reconstruction_authority_desc:0 "Only after Griffenheim falls and Cyanolisia proclaims itself the Empire's descendant can Dawnclaw replace devastation with ration offices, police registries, and compulsory contracts."
 HSM_CYA_march_on_imperial_provinces:0 "March On The Imperial Provinces"
 HSM_CYA_march_on_imperial_provinces_desc:0 "The old imperial provinces will either recognise Dawnclaw's command or be treated as enemy territory."
 HSM_CYA_question_of_grover:0 "The Question Of Grover"
 HSM_CYA_question_of_grover_desc:0 "Once the Empire is within reach, Dawnclaw must decide what to do with the child whose name can still command loyalty."
 HSM_CYA_execute_the_child_emperor:0 "Execute The Child Emperor"
 HSM_CYA_execute_the_child_emperor_desc:0 "A final, terrible answer: no Grover, no regency, no rival sacred name."
 HSM_CYA_the_puppet_emperor:0 "The Puppet Emperor"
 HSM_CYA_the_puppet_emperor_desc:0 "Grover VI may live as a symbol, watched, displayed, and never allowed to rule."
 HSM_CYA_the_child_may_rule:0 "The Child May Rule"
 HSM_CYA_the_child_may_rule_desc:0 "Dawnclaw can step back at the end, leaving a disciplined Empire to Grover VI and making himself its necessary shadow."
 HSM_CYA_cross_the_river_frontier:0 "Cross The River Frontier"
 HSM_CYA_cross_the_river_frontier_desc:0 "If the Empire is to be secured by force, the River Federation cannot remain the safe harbour of every enemy Cyanolisia has made."
 HSM_CYA_frontier_county_administration:0 "Frontier County Administration"
 HSM_CYA_frontier_county_administration_desc:0 "The Blackrock wastelands are administered through a restored frontier county tied to the Cyanolisian March."
 HSM_CYA_countess_frontier_reforms:0 "Countess' Frontier Reforms"
 HSM_CYA_countess_frontier_reforms_desc:0 "The Countess modernises through roads, depots, and careful defensive administration."
 HSM_CYA_aristocratic_credit_network:0 "Aristocratic Credit Network"
 HSM_CYA_aristocratic_credit_network_desc:0 "Old wealth funds new state projects, while old wealth quietly expects repayment in influence."
 HSM_CYA_countess_mit_protectorate:0 "Asterion Protectorate Plans"
 HSM_CYA_countess_mit_protectorate_desc:0 "The southern campaign is framed as protection, settlement, and border security."
 HSM_CYA_countess_sicameon_mandate:0 "Sicameon Mandate Papers"
 HSM_CYA_countess_sicameon_mandate_desc:0 "Cyanolisia prepares to bind Sicameon's coast through trade, port supervision, and conservative administration."
 HSM_CYA_frontier_aristocratic_league_idea:0 "Frontier Aristocratic League"
 HSM_CYA_frontier_aristocratic_league_idea_desc:0 "Landed houses, merchant credit, and loyal officers now share responsibility for the frontier order."
 HSM_CYA_regency_claim:0 "Regency Claim"
 HSM_CYA_regency_claim_desc:0 "The Countess claims authority as the future regent of a restored Groverite Empire."
 HSM_CYA_herzland_reconstruction:0 "Herzland Reconstruction"
 HSM_CYA_herzland_reconstruction_desc:0 "Newly taken imperial lands require rails, food offices, police registries, and patient administrative repair."
 HSM_CYA_grover_regency:0 "Regency For Grover VI"
 HSM_CYA_grover_regency_desc:0 "The Countess rules in trust for Grover VI, promising order now and imperial continuity later."
 HSM_CYA_corporate_rearmament:0 "Corporate Rearmament"
 HSM_CYA_corporate_rearmament_desc:0 "Factories and firms receive contracts in exchange for obedience to Dawnclaw's military priorities."
 HSM_CYA_imperial_officer_cells_idea:0 "Imperial Officer Cells"
 HSM_CYA_imperial_officer_cells_idea_desc:0 "Exiled officers and old imperial nationalists are organised into disciplined cells."
 HSM_CYA_security_districts_idea:0 "Security Districts"
 HSM_CYA_security_districts_idea_desc:0 "Travel, papers, and loyalty are tracked through Dawnclaw's district security network."
 HSM_CYA_military_governorates:0 "Military Governorates"
 HSM_CYA_military_governorates_desc:0 "New territories are ruled by officers first and civilian clerks later."
 HSM_CYA_nationalist_frontier_mobilisation_idea:0 "Nationalist Frontier Mobilisation"
 HSM_CYA_nationalist_frontier_mobilisation_idea_desc:0 "Veterans and nationalists are mobilised for the wars that lead back to Griffenheim."
 HSM_CYA_herzland_reconstruction_authority_idea:0 "Herzland Offensive Authority"
 HSM_CYA_herzland_reconstruction_authority_idea_desc:0 "Dawnclaw centralises the resources needed to strike into the Herzland and rebuild what he takes."
 HSM_CYA_child_emperor_executed:0 "The Child Emperor Executed"
 HSM_CYA_child_emperor_executed_desc:0 "Grover VI is dead. Dawnclaw's regime gains terrible clarity and terrible enemies."
 HSM_CYA_puppet_emperor:0 "The Puppet Emperor"
 HSM_CYA_puppet_emperor_desc:0 "Grover VI lives as a controlled symbol of imperial legitimacy."
 HSM_CYA_restored_grover_supervised:0 "Grover Restored Under Supervision"
 HSM_CYA_restored_grover_supervised_desc:0 "Grover VI is allowed to rule, though the institutions Dawnclaw built remain close around the throne."
 HSM_CYA_river_frontier_war_plan:0 "River Frontier War Plan"
 HSM_CYA_river_frontier_war_plan_desc:0 "The River Federation is treated as the next strategic frontier of the restored Empire."
 HSM_CYA_blackrock_wasteland_mapped:0 "The Blackrock wastelands have been mapped"
 HSM_CYA_field_security_battalions_raised:0 "Field security battalions have been raised"
 HSM_CYA_question_of_grover_opened:0 "The question of Grover VI has been opened"
 HSM_CYA_grover_executed:0 "Grover VI has been executed"
 HSM_CYA_grover_puppet:0 "Grover VI has been made a puppet emperor"
 HSM_CYA_grover_restored:0 "Grover VI has been restored under supervision"
 HSM_CYA_frontier_war_games:0 "Frontier War Games"
 HSM_CYA_frontier_war_games_desc:0 "The Cyanolisian March rehearses defensive responses against Asterion and Sicameon while keeping Dawnclaw in a deliberately secondary role."
 HSM_CYA_evi_border_embassies:0 "Evi Border Embassies"
 HSM_CYA_evi_border_embassies_desc:0 "The frontier path survives through scouts, envoys, and trade clerks who know when a border dispute is still cheaper than a war."
 HSM_CYA_blackrock_autonomy_statute:0 "Blackrock Autonomy Statute"
 HSM_CYA_blackrock_autonomy_statute_desc:0 "The restored frontier county will be tied to Cyanolisia, but its local customs and wasteland councils need enough room to keep the north quiet."
 HSM_CYA_countess_evosmoshafen_ministries:0 "Evosmoshafen Ministries"
 HSM_CYA_countess_evosmoshafen_ministries_desc:0 "The Countess expands the civilian ministries before turning south, giving her reforms clerks, ledgers, and a quieter legal face."
 HSM_CYA_countess_mit_customs_zone:0 "Asterion Customs Zone"
 HSM_CYA_countess_mit_customs_zone_desc:0 "If Minotauria is to be subdued, its roads and markets must first be mapped as future customs corridors."
 HSM_CYA_countess_sicameon_port_authority:0 "Sicameon Port Authority"
 HSM_CYA_countess_sicameon_port_authority_desc:0 "A conservative port authority will prepare the legal machinery for bringing Sicameon's coast under Cyanolisian supervision."
 HSM_CYA_countess_integrate_south:0 "Southern Settlement Statutes"
 HSM_CYA_countess_integrate_south_desc:0 "Asterion and Sicameon can be drawn into Cyanolisia through supervised autonomy, local councils, and patient legal absorption."
 HSM_CYA_countess_southern_provincial_diets:0 "Southern Provincial Diets"
 HSM_CYA_countess_southern_provincial_diets_desc:0 "The Countess offers controlled assemblies to the southern provinces: enough autonomy to govern, not enough to break away."
 HSM_CYA_countess_merchant_arbitration:0 "Merchant Arbitration Courts"
 HSM_CYA_countess_merchant_arbitration_desc:0 "Trade disputes in the south will be settled by courts friendly to aristocrats, landowners, and Cyanolisian port interests."
 HSM_CYA_countess_frontier_conference:0 "Frontier Conference"
 HSM_CYA_countess_frontier_conference_desc:0 "Aristocrats, merchants, officers, and frontier notables are gathered to turn the southern settlement into a platform for the Evi Valley."
 HSM_CYA_countess_integrate_evi_valley:0 "Evi Valley Integration"
 HSM_CYA_countess_integrate_evi_valley_desc:0 "The valley states will not be ruled as raided land. They will be marked as future provinces once compliance and local settlement make it possible."
 HSM_CYA_countess_capital_restoration_plan:0 "Capital Restoration Plan"
 HSM_CYA_countess_capital_restoration_plan_desc:0 "Before the regency can rebuild Griffenheim, it must prepare engineers, tax offices, grain ledgers, and loyal administrators."
 HSM_CYA_dawnclaw_war_room:0 "The War Room"
 HSM_CYA_dawnclaw_war_room_desc:0 "Dawnclaw gathers officers, informants, railway planners, and loyal industrialists into a permanent war room beneath the court."
 HSM_CYA_minotaurian_logistics_board:0 "Minotaurian Logistics Board"
 HSM_CYA_minotaurian_logistics_board_desc:0 "The southern operation will be won by depots and rail schedules before the first ultimatum is delivered."
 HSM_CYA_sicameon_informant_ports:0 "Informants In The Ports"
 HSM_CYA_sicameon_informant_ports_desc:0 "Sicameon's coast is full of unions, republicans, and smugglers. Dawnclaw intends to buy the names before he buys the bullets."
 HSM_CYA_dawnclaw_integrate_south:0 "Codify Southern Occupation"
 HSM_CYA_dawnclaw_integrate_south_desc:0 "Southern integration under Dawnclaw means registries, security districts, and future cores earned through compliance rather than consent."
 HSM_CYA_minotaurian_security_registry:0 "Minotaurian Security Registry"
 HSM_CYA_minotaurian_security_registry_desc:0 "Families, unions, veterans, and local chiefs are entered into a security registry that makes rebellion easier to anticipate and harder to hide."
 HSM_CYA_port_purge_lists:0 "Port Purge Lists"
 HSM_CYA_port_purge_lists_desc:0 "Sicameon's dockside networks will be screened for republican organisers, smugglers, and anyone still loyal to the old coast."
 HSM_CYA_frontier_security_census:0 "Frontier Security Census"
 HSM_CYA_frontier_security_census_desc:0 "Every town, rail junction, guild office, and barracks on the Evi frontier is counted as a future security problem."
 HSM_CYA_evi_governorate_codes:0 "Evi Governorate Codes"
 HSM_CYA_evi_governorate_codes_desc:0 "The Evi Valley can become imperial territory only after its occupied administrations are reduced to codes, permits, and compliance thresholds."
 HSM_CYA_dawnclaw_capital_restoration_plan:0 "Griffenheim Restoration Plan"
 HSM_CYA_dawnclaw_capital_restoration_plan_desc:0 "Dawnclaw prepares the engineers, police cadres, and requisition offices needed for a devastated capital."
 HSM_CYA_evosmoshafen_ministries:0 "Evosmoshafen Ministries"
 HSM_CYA_evosmoshafen_ministries_desc:0 "Expanded civilian ministries give the Countess more control over reform without handing every file to the army."
 HSM_CYA_countess_mit_customs_zone_idea:0 "Asterion Customs Zone"
 HSM_CYA_countess_mit_customs_zone_idea_desc:0 "Southern customs planning ties future Asterion trade to Cyanolisian law."
 HSM_CYA_countess_port_authority:0 "Sicameon Port Authority"
 HSM_CYA_countess_port_authority_desc:0 "Port supervision prepares the coast for conservative settlement and trade control."
 HSM_CYA_frontier_conference_idea:0 "Frontier Conference"
 HSM_CYA_frontier_conference_idea_desc:0 "A working compact of aristocrats, merchants, and officers coordinates the next frontier phase."
 HSM_CYA_capital_restoration_plan:0 "Capital Restoration Plan"
 HSM_CYA_capital_restoration_plan_desc:0 "Engineers, tax offices, and administrators are prepared for the day Cyanolisia enters Griffenheim."
 HSM_CYA_herzland_devastation:0 "Herzland Devastation"
 HSM_CYA_herzland_devastation_desc:0 "The fall of Griffenheim has made Cyanolisia the claimant to an Empire in ruins. The capital must be fed, repaired, policed, and made governable."
 HSM_CYA_dawnclaw_war_room_idea:0 "Dawnclaw's War Room"
 HSM_CYA_dawnclaw_war_room_idea_desc:0 "Officers, informants, and loyal industrialists coordinate campaigns from the court's new war room."
 HSM_CYA_minotaurian_logistics_board_idea:0 "Minotaurian Logistics Board"
 HSM_CYA_minotaurian_logistics_board_idea_desc:0 "Southern roads and depots are being prepared for a campaign against Asterion."
 HSM_CYA_sicameon_informant_ports_idea:0 "Sicameon Port Informants"
 HSM_CYA_sicameon_informant_ports_idea_desc:0 "Paid informants and dockside files give Cyanolisia a clearer view of Sicameon's coast."
 HSM_CYA_frontier_security_census_idea:0 "Frontier Security Census"
 HSM_CYA_frontier_security_census_idea_desc:0 "The Evi frontier is being catalogued as an occupation problem before it becomes an occupation."
 HSM_CYA_can_claim_empire_descendant:0 "Cyanolisia can claim imperial succession"
 HSM_CYA_empire_descendant_declared:0 "Cyanolisia has proclaimed itself the Empire's descendant"
 HSM_CYA_imperial_restoration:0 "Imperial Restoration"
 HSM_CYA_imperial_restoration_desc:0 "Griffenheim is the key. Without the capital, Cyanolisia can prepare for empire but cannot claim to inherit it."
 HSM_CYA_become_the_empire_descendant:0 "Become The Empire's Descendant"
 HSM_CYA_become_the_empire_descendant_desc:0 "With Griffenheim occupied, Cyanolisia can move the capital, proclaim imperial succession, and face the devastation left behind."
 HSM_CYA_empire_descendant_reconstruction_tt:0 "§YHerzland reconstruction focuses§! will become available. Former imperial lands will be marked for future compliance-based integration."
