l_english:
 HSM_VER_FUI_imperial_institutions_tt:0 "Erie's charter institutions or their unified successor remain independent and at peace."
 HSM_VER_FUI_mandate_not_decided_tt:0 "The reconstruction mandate has not yet been accepted or declined."
 HSM_VER_FUI_mandate_active_tt:0 "The reconstruction mandate is active and unexpired; its peace settlement remains valid."
 HSM_VER_FUI_household_recorded_tt:0 "The report on Grover VI's circumstances has been received."
 HSM_VER_FUI_contracts_awarded_tt:0 "The city's reconstruction contracts have been awarded."
 HSM_VER_FUI_audit_published_tt:0 "The commission has published its accounts."
 HSM_VER_FUI_city_contracts_effect_tt:0 "Event: choose a civilian factory in Griffenheim or two §G75%§! construction research bonuses. Without factory capacity, the first option gives one §G100%§! industry bonus."
 HSM_VER_FUI_archive_effect_tt:0 "Two §G50%§! bonuses to industry research."
 HSM_VER_FUI_audit_effect_tt:0 "Event: publish the commission's accounts, opening the choice between a final funded year and immediate civilian handover."
 HSM_VER_FUI_reg_context_tt:0 "Constitutional Avian holds the Herzland after a defensive victory; 45 days have passed since peace. Verenian institutions remain valid."
 HSM_VER_FUI_reg_agreement_tt:0 "The agreed regency or civilian settlement remains in force, with both Houses' consent."
 HSM_VER_FUI_reg_prior_hearings_tt:0 "The school visit and the decision on defence arrangements are complete."
 HSM_VER_FUI_reg_petitions_heard_tt:0 "The council has heard the petitions."
 HSM_VER_FUI_reg_guardianship_tt:0 "The limited regency continues, or Grover has lawfully succeeded it."
 HSM_VER_FUI_reg_civil_compact_tt:0 "The Houses chose a civilian settlement rather than a regency."
 HSM_VER_FUI_reg_open_effect_tt:0 "Event: the Houses discuss the settlement of the defeated Herzland. Opens the regency or civilian-agreement campaign."
 HSM_VER_FUI_reg_household_effect_tt:0 "A report on Grover VI arrives in two days. Where lawful, requests his household's transfer; does not create custody or a title."
 HSM_VER_FUI_reg_city_effect_tt:0 "One civilian factory and one building slot in Griffenheim. If it cannot fit the factory: two §G100%§! industry research bonuses instead."
 HSM_VER_FUI_reg_agreement_effect_tt:0 "Event: propose civilian administration or, with minor Grover in our care, a limited regency. Both Houses must consent."
 HSM_VER_FUI_reg_schools_effect_tt:0 "Opens the report on the school visit."
 HSM_VER_FUI_reg_defence_effect_tt:0 "Event: choose joint logistics or territorial reserves. The chosen policy determines the defence spirit."
 HSM_VER_FUI_reg_petitions_effect_tt:0 "Event: hear the council's petitioners. Opens the reconstruction and House-rights programmes."
 HSM_VER_FUI_reg_rebuilding_effect_tt:0 "§G25 army experience§! and two §G100%§! construction research bonuses."
 HSM_VER_FUI_reg_rights_effect_tt:0 "Establishes the Houses' reserved rights while their agreement remains in force:"
 HSM_VER_FUI_reg_guardianship_effect_tt:0 "An event closes the limited-guardianship chapter, reflecting Grover's actual circumstances."
 HSM_VER_FUI_reg_civil_effect_tt:0 "An event closes the civilian-settlement chapter without establishing a regency."
 HSM_VER_FUI_reg_final_effect_tt:0 "Final event: the settled frontier and the outcome of the chosen constitutional arrangement."
 HSM_VER_FUI_uni_operational_tt:0 "The convention is active; participants have accepted our presidency and control their homelands."
 HSM_VER_FUI_uni_works_done_tt:0 "The common-works programme is complete."
 HSM_VER_FUI_uni_customs_wait_tt:0 "The 60-day customs transition has ended; administration has not yet been established."
 HSM_VER_FUI_uni_admin_done_tt:0 "The common administration has been established."
 HSM_VER_FUI_uni_admin_wait_tt:0 "The 90-day administrative transition has ended; unified command has not yet been established."
 HSM_VER_FUI_uni_preparations_tt:0 "The constitutional draft and all preparatory stages and waiting periods are complete."
 HSM_VER_FUI_uni_consents_tt:0 "Every participating government has expressly consented to annexation."
 HSM_VER_FUI_uni_homeland_tt:0 "The founded union remains independent and controls its original Verenian homelands."
 HSM_VER_FUI_uni_budget_wait_tt:0 "60 days have passed since founding; the first ordinary budget has not yet been adopted."
