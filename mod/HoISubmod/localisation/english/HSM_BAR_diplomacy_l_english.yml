l_english:
 HSM_BAR_diplomacy:0 "Barrad and Its Neighbours"
 HSM_BAR_diplomacy_desc:0 "The fall of the Pentarchy does not settle the frontier. Wittenland disputes sovereignty, Kasa demands freedom for the persecuted, and Austurland wants a secure border. Our delegates can offer inspection and enforceable commitments; our neighbours can demand concessions or prepare for war."
 HSM_BAR_dip_treaty:0 "The Barrad Accords"
 HSM_BAR_dip_review:0 "Refer the demand to the new administration."
 HSM_BAR_dip_lapsed:0 "Events have overtaken this exchange."
 HSM_BAR_dip_refuse:0 "Reject these terms. We will face the consequences."
 HSM_BAR_dip_refusal_tt:0 "Talks fail. Any existing mobilisation countdown must finish before the neighbour decides whether to enforce its threat. Refusal can lead to an annexation war goal and war; it grants no protection."
 HSM_BAR_dip_enforce:0 "Enforce our demands."
 HSM_BAR_dip_enforce_tt:0 "If Barrad remains independent and at peace with us, gain an annexation war goal. Declare war if diplomatic rules permit; otherwise retain the war goal. An existing war is never ended by this exchange."
 HSM_BAR_dip_withdraw:0 "Withdraw the threat for six months."
 HSM_BAR_dip_signed_t:0 "The Barrad Accords Are Signed"
 HSM_BAR_dip_signed_d:0 "Barrad has accepted our delegation's terms. Inspectors may verify the agreed safeguards, and both governments have signed a non-aggression pact. This is a political settlement with a continuing neighbour. Our domestic programme can proceed without annexing its territory. The agreement offers no guarantee against a future breach or a third country's ambitions."
 HSM_BAR_dip_signed:0 "Publish the terms and appoint the commission."
 HSM_BAR_dip_failed_t:0 "The Barrad Negotiations Fail"
 HSM_BAR_dip_failed_d:0 "The deadline has passed or Barrad has rejected our terms. Any mobilisation already underway has now run its course. We must decide whether to enforce our demands or pay the political cost of withdrawing them for six months. Withdrawal recognises neither a treaty nor immunity from a later confrontation."
 HSM_BAR_dip_WIT_legacy_d:0 "Wittenland's earlier demand has reached a Barrad whose Pentarchy has fallen. The new administration claims continuity of government and the right to negotiate. The old surrender procedure must be replaced by a conference on sovereignty, inspection and the limits of Wittenland's claims."
 HSM_BAR_dip_WIT_approach_t:0 "Who Speaks for Barrad?"
 HSM_BAR_dip_WIT_white_d:0 "White Star receives a petition from Barrad's collegium. Its members propose published laboratory registers, civilian petitions and an accountable council in place of private magical dominions. The territorial dispute remains: Wittenland regards Barrad as a lost province. White Star can recognise a responsible neighbour under inspection, or insist that Wittenland supervise the settlement of those claims."
 HSM_BAR_dip_WIT_claim_d:0 "Barrad's civilian government asks us to recognise its sovereignty. A change of rulers does not extinguish Wittenland's historical claims, and the new administration's promises still require verification. We can offer recognition in return for open inspections, or issue an ultimatum demanding an external commission with authority over the disputed frontier."
 HSM_BAR_dip_WIT_offer:0 "Recognise sovereignty after independent inspection."
 HSM_BAR_dip_WIT_demand:0 "Demand a binding frontier and laboratory commission."
 HSM_BAR_dip_WIT_terms_t:0 "Wittenland Offers Conditional Recognition"
 HSM_BAR_dip_WIT_terms_collegium_d:0 "Wittenland will recognise Barrad's separate government if the collegium opens its laboratory records, receives civilian complaints and permits an independent commission to inspect dangerous research. In return, Wittenland suspends its annexation claim and signs a non-aggression pact. The collegium keeps its institutions, but must answer publicly for their conduct."
 HSM_BAR_dip_WIT_terms_directorate_d:0 "Wittenland offers recognition to Barrad's civilian government in exchange for research inspections and independent testimony. It will suspend its annexation claim and sign a non-aggression pact. The civilian ministers believe they govern in their own right; they know nothing of the secret service controlling Barrad through their administration. The service must arrange compliance through this public front without revealing its existence."
 HSM_BAR_dip_WIT_ultimatum_t:0 "Wittenland's Sovereignty Ultimatum"
 HSM_BAR_dip_WIT_ultimatum_collegium_d:0 "Wittenland demands a standing commission to arbitrate frontier incidents and supervise dangerous laboratories. Accepting would concede part of the collegium's freedom of action and damage its domestic standing, but preserve Barrad's government and territory. Wittenland would settle its immediate claim and sign a non-aggression pact. Refusal risks invasion."
 HSM_BAR_dip_WIT_ultimatum_directorate_d:0 "Wittenland demands that Barrad's civilian government accept a permanent inspection commission and binding arbitration of frontier disputes. The ministers would concede authority while preserving Barrad's territory under a non-aggression pact. Unknown to them, the secret service must adjust the instructions it feeds into their administration to accommodate the commission. Its control must remain hidden from both governments. Rejection may bring war."
 HSM_BAR_dip_WIT_sign:0 "Open the registers and sign the recognition accord."
 HSM_BAR_dip_WIT_concede:0 "Accept the commission and preserve our government."
 HSM_BAR_dip_WIT_agreement_tt:0 "Wittenland recognises this settlement and signs a non-aggression pact. Its annexation war goal is withdrawn. The frontier and laboratory inspection obligations remain in force until the agreement is repudiated or war breaks out."
 HSM_BAR_dip_ZES_approach_t:0 "The Refugees at the Frontier"
 HSM_BAR_dip_ZES_lua_d:0 "Lua Ramedi wants an orderly settlement: registered crossings, civilian relief offices and verifiable abolition of slavery in Barrad. Trade and reconstruction can support those reforms, but an efficient border must not become a means of returning fugitives to their former masters. Her delegation favours an inspected agreement over a new war."
 HSM_BAR_dip_ZES_pasarinha_d:0 "Pasarinha asks who will speak for those who fled Barrad. She demands safe passage, freedom from forced return and the right of displaced communities to send their own representatives to the inspection commission. A new flag over Barrad's offices will not satisfy her without practical guarantees for the vulnerable."
 HSM_BAR_dip_ZES_yrmthu_d:0 "Yrmthu sees an opportunity to replace the march north with a conference of communities. Refugee delegates must sit alongside the new Barrad administration; slavery and forced labour must end, and inspectors must hear testimony freely. A negotiated settlement would allow Kasa's congress to turn to its domestic programme."
 HSM_BAR_dip_ZES_altu_d:0 "Altu Kexa distrusts the argument that a new government has made intervention unnecessary. He demands access to detention sites, the release of forced labourers and a public account of crimes committed under the Pentarchy. Barrad may still avoid war, but a sealed laboratory and a promise will not satisfy him."
 HSM_BAR_dip_ZES_council_d:0 "Kasa's council receives a request for talks from Barrad. Refugees still arrive with accounts of bondage and disappearances. The council must decide whether independent inspection and safe passage are sufficient, or whether justice requires a stronger commission with access to prisons and the testimony of former captives."
 HSM_BAR_dip_ZES_offer:0 "Offer an asylum and anti-slavery inspection accord."
 HSM_BAR_dip_ZES_demand:0 "Require detention inspections and public accountability."
 HSM_BAR_dip_ZES_terms_t:0 "Kasa's Refugee and Freedom Accord"
 HSM_BAR_dip_ZES_terms_collegium_d:0 "Kasa proposes an agreement ending slavery and forced labour, protecting refugees from forced return and opening detention sites to inspection. Refugee representatives will be heard alongside the collegium. The agreement costs administrative capacity but gives our new institutions a public test of credibility. Kasa will sign a non-aggression pact and conclude its immediate Barrad campaign."
 HSM_BAR_dip_ZES_terms_directorate_d:0 "Kasa asks Barrad's civilian government to end slavery and forced labour, protect refugees and open detention sites to independent inspection. Local officials must hear complaints without obstructing them. Kasa offers a non-aggression pact and an end to its immediate intervention plans. The secret service must make the public administration fulfil these commitments while keeping its control concealed, including from the ministers who sign the accord."
 HSM_BAR_dip_ZES_ultimatum_t:0 "Kasa Demands an Accounting"
 HSM_BAR_dip_ZES_ultimatum_collegium_d:0 "Kasa wants more than a declaration of abolition. Its commission will inspect prisons and labour sites, take testimony from former captives and publish responsibility for abuses. The collegium must accept the political cost of exposing its founders' records. Acceptance brings a non-aggression pact; rejection allows Kasa to pursue its threatened intervention."
 HSM_BAR_dip_ZES_ultimatum_directorate_d:0 "Kasa demands public hearings, access to prisons and labour sites, and the release of captives held under the Pentarchy's arrangements. Its delegation holds Barrad's civilian government responsible. The ministers have no knowledge of the secret service directing the state behind them; the service must steer their response without becoming a party to the talks. Acceptance costs authority but secures a non-aggression pact. Refusal may bring Kasa's army across the border."
 HSM_BAR_dip_ZES_sign:0 "Abolish bondage, protect asylum and admit inspectors."
 HSM_BAR_dip_ZES_concede:0 "Open the detention sites and accept public hearings."
 HSM_BAR_dip_ZES_agreement_tt:0 "Kasa signs the refugee and anti-slavery accord and a non-aggression pact. Its annexation war goal is withdrawn. Its post-Barrad domestic programme can continue without territorial conquest."
 HSM_BAR_dip_OLV_approach_t:0 "Security on Austurland's Frontier"
 HSM_BAR_dip_OLV_democratic_d:0 "Austurland's elected government wants a border that civilians can cross without fear of raids or magical accidents. It proposes joint incident reports, inspections of installations near the frontier and an undertaking not to shelter armed groups. A settlement must also make clear that security patrols confer no right to annex a neighbour."
 HSM_BAR_dip_OLV_communist_d:0 "Austurland's socialist government wants Barrad's civilian administration to prove that the Pentarchy's private magical dominions have ended. It demands seats for frontier workers and displaced civilians on a joint commission, with inspections to verify that no armed bands operate under official protection. Its delegates will judge the public government's commitments by conditions along the border."
 HSM_BAR_dip_OLV_crown_d:0 "Austurland's rulers see Barrad through the needs of their state and army. They may settle for inspected border installations and a ban on cross-border armed groups, or demand a restrictive frontier zone supervised by their officers. A new administration in Barrad does not oblige an expansionist government to abandon its ambitions."
 HSM_BAR_dip_OLV_offer:0 "Offer joint inspections and a border-security pact."
 HSM_BAR_dip_OLV_demand:0 "Demand a supervised frontier zone."
 HSM_BAR_dip_OLV_terms_t:0 "Austurland's Border Protocol"
 HSM_BAR_dip_OLV_terms_collegium_d:0 "Austurland proposes joint incident reports, inspections of dangerous installations near the frontier and a ban on sheltering armed groups that attack across it. Civilian delegates will have access to the commission. The collegium would retain control of the border while accepting outside scrutiny; both countries would sign a non-aggression pact."
 HSM_BAR_dip_OLV_terms_directorate_d:0 "Austurland asks Barrad's civilian government to register frontier installations, investigate raids with a joint commission and stop sheltering cross-border armed groups. The border authorities retain command but must investigate foreign complaints. Acceptance brings a non-aggression pact. The secret service controlling Barrad must put these commitments into effect through ordinary administrative orders; neither the civilian government nor its neighbours know the service exists."
 HSM_BAR_dip_OLV_ultimatum_t:0 "Austurland Demands Frontier Restrictions"
 HSM_BAR_dip_OLV_ultimatum_collegium_d:0 "Austurland demands prior notification of exercises and new military installations near the frontier, together with access for a standing inspection commission. The collegium would concede freedom of military action and pay a domestic political price. Barrad keeps its territory and government. Acceptance secures a non-aggression pact; refusal may mean war."
 HSM_BAR_dip_OLV_ultimatum_directorate_d:0 "Austurland demands that Barrad's civilian government give advance notice of frontier exercises and submit new border installations to inspection. These restrictions reduce military freedom but preserve Barrad's territory under a non-aggression pact. The secret service must adapt its hidden direction of the state while the ministers remain unaware of who controls their administration. Refusal permits Austurland to enforce its threat."
 HSM_BAR_dip_OLV_sign:0 "Register the frontier and sign the joint protocol."
 HSM_BAR_dip_OLV_concede:0 "Accept restrictions on frontier deployments."
 HSM_BAR_dip_OLV_agreement_tt:0 "Austurland signs the border protocol and a non-aggression pact. Its annexation war goal is withdrawn. Existing mobilisation finishes without a declaration of war while this agreement remains in force."
 HSM_BAR_dip_GRU_t:0 "The Northern Crusade Still Marches"
 HSM_BAR_dip_GRU_d:0 "Gryphus has been informed that the Pentarchy no longer governs Barrad. Its crusaders do not regard the new public administration as an answer to their territorial and religious claims. Their mobilisation has finished, but they have sent a final notice before formalising a claim against us. We have roughly two weeks to prepare; our other treaties do not bind Gryphus."
 HSM_BAR_dip_GRU_resist:0 "Notify the frontier garrisons."
 HSM_BAR_dip_GRU_tt:0 "Gryphus receives its original territorial war goal fifteen days after sending this warning, provided both countries remain independent and outside the same faction, and war has not already begun."
 HSM_BAR_dip_WIT_envoy:0 "Send a Delegation to Wittenland"
 HSM_BAR_dip_WIT_envoy_desc:0 "Ask Wittenland to negotiate recognition and concrete safeguards. Its government will choose the terms; we may accept or refuse them. The exchange has a forty-five-day deadline, and refusal may lead to war. An existing mobilisation is not reset by talks."
 HSM_BAR_dip_WIT_deadline:0 "Wittenland: Negotiation Deadline"
 HSM_BAR_dip_WIT_deadline_desc:0 "Both delegations must settle the terms within forty-five days. Letting the deadline expire counts as refusal. Any native mobilisation already running must still finish before the neighbour decides whether to enforce its threat."
 HSM_BAR_dip_WIT_renounce:0 "Repudiate the Accord with Wittenland"
 HSM_BAR_dip_WIT_renounce_desc:0 "End our inspection commitments and non-aggression pact with Wittenland. Its government will reopen the dispute and may demand harsher terms. Refusing the renewed demands can bring war."
 HSM_BAR_dip_ZES_envoy:0 "Send a Delegation to Kasa"
 HSM_BAR_dip_ZES_envoy_desc:0 "Ask Kasa to negotiate recognition and concrete safeguards. Its government will choose the terms; we may accept or refuse them. The exchange has a forty-five-day deadline, and refusal may lead to war. An existing mobilisation is not reset by talks."
 HSM_BAR_dip_ZES_deadline:0 "Kasa: Negotiation Deadline"
 HSM_BAR_dip_ZES_deadline_desc:0 "Both delegations must settle the terms within forty-five days. Letting the deadline expire counts as refusal. Any native mobilisation already running must still finish before the neighbour decides whether to enforce its threat."
 HSM_BAR_dip_ZES_renounce:0 "Repudiate the Accord with Kasa"
 HSM_BAR_dip_ZES_renounce_desc:0 "End our inspection commitments and non-aggression pact with Kasa. Its government will reopen the dispute and may demand harsher terms. Refusing the renewed demands can bring war."
 HSM_BAR_dip_OLV_envoy:0 "Send a Delegation to Austurland"
 HSM_BAR_dip_OLV_envoy_desc:0 "Ask Austurland to negotiate recognition and concrete safeguards. Its government will choose the terms; we may accept or refuse them. The exchange has a forty-five-day deadline, and refusal may lead to war. An existing mobilisation is not reset by talks."
 HSM_BAR_dip_OLV_deadline:0 "Austurland: Negotiation Deadline"
 HSM_BAR_dip_OLV_deadline_desc:0 "Both delegations must settle the terms within forty-five days. Letting the deadline expire counts as refusal. Any native mobilisation already running must still finish before the neighbour decides whether to enforce its threat."
 HSM_BAR_dip_OLV_renounce:0 "Repudiate the Accord with Austurland"
 HSM_BAR_dip_OLV_renounce_desc:0 "End our inspection commitments and non-aggression pact with Austurland. Its government will reopen the dispute and may demand harsher terms. Refusing the renewed demands can bring war."
