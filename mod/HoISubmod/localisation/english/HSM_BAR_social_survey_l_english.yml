 HSM_BAR_social_survey_tt:0 "The first national survey corrects the inherited social assessment to §Y$poverty1$§! and §Y$lack_of_scientists1$§!. Any worse level is retained. This assessment happens once; subsequent improvements are never reset by a change of focus tree. Industry, the scientific base and research slots are unchanged."
 hsm_bar_social_survey.1.t:0 "The Villages Behind the Figures"
 hsm_bar_social_survey.1.d:0 "The first reports arrived folded around lists of names. Beside some names stood a debt in grain; beside others, the mark of a witness who had read the questions aloud. One teacher found a schoolroom being used for storage. In another village, lessons continued at a kitchen table, with a single book shared between the children.\n\nThe palace accounts had recorded what reached the laboratories, not what remained in the villages. A stocked storeroom was not a fed household. Four learned scholars were not an educated country. The delegates have refused to sign a report that confuses one with the other.\n\nTheir findings do not make Barrad poorer overnight. They make its poverty impossible to leave out of the accounts. The Republic must now answer with food, schools and work that reaches beyond the palace gates."
 hsm_bar_social_survey.1.a:0 "Begin with the country we actually have."
