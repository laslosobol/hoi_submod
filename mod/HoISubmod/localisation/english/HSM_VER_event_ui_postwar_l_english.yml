l_english:
 HSM_VER_EVT_internal_protocol_tt:0 "Ratify the technical protocol. Gain the spirit below for §Y730 days§!; an existing protocol is not extended."
 HSM_VER_EVT_foreign_protocol_tt:0 "Ratify the protocol. We gain the spirit below for §Y730 days§!; Erie receives the same benefit upon its first partner's signature."
 HSM_VER_EVT_decline_protocol_tt:0 "Decline this invitation. No technical-protocol benefit is granted."
 HSM_VER_EVT_mandate_tt:0 "Spend §Y50 political power§! to begin a §Y730-day§! reconstruction mandate, with the spirit below. War, loss of Griffenheim or collapse of the shared institutions ends the mandate early."
 HSM_VER_EVT_decline_mandate_tt:0 "Reject the mandate. No political power is spent; the Griffenheim reconstruction programme will not open."
 HSM_VER_EVT_household_record_tt:0 "Record the verified fate of Grover VI and open the archive programme. This neither transfers his household nor establishes a regency."
 HSM_VER_EVT_city_factory_tt:0 "Griffenheim gains §G1 civilian factory§! and §G1 building slot§!. If no factory can fit, receive §G1 research bonus of 100%§! for industry instead."
 HSM_VER_EVT_city_plans_tt:0 "Receive §G2 research bonuses of 75%§! for construction technologies. No factory is built."
 HSM_VER_EVT_audit_tt:0 "Publish the audit, allowing a choice between a final year of reconstruction and returning the commission's powers. The mandate is not extended by publication alone."
 HSM_VER_EVT_estates_sign_tt:0 "Record this province's consent. Both Erie and Eyrie's consent is required to establish or maintain the Avian settlement; no province is annexed by this vote."
 HSM_VER_EVT_void_pact_tt:0 "Reject the settlement. Avian loses the shared regency or civil compact and all national spirits dependent on that agreement."
 HSM_VER_EVT_propose_regency_tt:0 "Ask Erie and Eyrie to approve a regency for the living, underage Grover VI. Replies are valid for §Y45 days§!; a new proposal requires §Y90 days§! from this one. Only both consents grant Avian the spirit below."
 HSM_VER_EVT_propose_civil_tt:0 "Ask Erie and Eyrie to approve a civil settlement without a regent. Replies are valid for §Y45 days§!; a new proposal requires §Y90 days§! from this one. Only both consents grant Avian the spirit below."
 HSM_VER_EVT_school_tt:0 "Record the school visit. Together with the defence settlement, this opens the council's petition hearings. Grover's attendance, if he is here as a child, will be remembered at his majority."
 HSM_VER_EVT_logistics_tt:0 "Choose joint logistics instead of territorial reserves. Avian gains the spirit below while the shared settlement remains in force."
 HSM_VER_EVT_reserves_tt:0 "Choose territorial reserves instead of joint logistics. Avian gains the spirit below while the shared settlement remains in force."
 HSM_VER_EVT_petitions_tt:0 "Complete the petition hearings, opening the reconstruction and reserved-rights programmes. A young Grover's attendance will be recalled at his majority."
 HSM_VER_EVT_regency_sign_tt:0 "Consent to Avian's proposal. Both Erie and Eyrie must agree before the regency or civil settlement takes effect. We retain our territory and government."
 HSM_VER_EVT_regency_decline_tt:0 "Reject the proposal and end this round of negotiations. Avian receives no shared settlement; a renewed offer must await its existing 90-day interval."
 HSM_VER_EVT_custody_transfer_tt:0 "Transfer Grover VI and his household to Avian; we lose the young emperor's national spirit. This is not a coronation or an agreement to annex our country."
 HSM_VER_EVT_custody_decline_tt:0 "Refuse the transfer. Grover VI and his household remain with us."
 HSM_VER_EVT_succession_tt:0 "Grover VI becomes Avian's constitutional monarch. The government is Non-Aligned, without elections; the young emperor's spirit is removed. No other country is annexed."
 HSM_VER_EVT_decline_union_tt:0 "Refuse participation and remain independent. This presidency cannot invite us again. Refusal by Erie or Eyrie closes the convention; Avian's withdrawal does not prevent a union of the two duchies."
 HSM_VER_EVT_refuse_absorption_tt:0 "Withdraw our consent and remain independent. This presidency cannot invite us again. Erie or Eyrie's refusal closes the convention; Avian may withdraw without blocking the two duchies' union."
