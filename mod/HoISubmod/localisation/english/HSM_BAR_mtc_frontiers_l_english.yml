l_english:
 HSM_BAR_mtc_frontiers_WIT_victory:0 "Barrad won the recorded defensive war against Wittenland"
 HSM_BAR_mtc_frontiers_WIT_attacked_history:0 "Wittenland directly attacked Collegium Barrad"
 HSM_BAR_mtc_frontiers_direct_declaration:0 "Wittenland's direct declaration has been recorded"
 HSM_BAR_mtc_frontiers_defending:0 "Barrad is defending against Wittenland's recorded attack"
 HSM_BAR_mtc_frontiers_conference:0 "Barrad attends the peace conference as a victor over Wittenland"
 HSM_BAR_mtc_frontiers_held_before_war:0 "The province belonged to Barrad before this war"
 HSM_BAR_mtc_frontiers_settlement:0 "The province was awarded to Barrad after the defensive victory"
 HSM_BAR_mtc_frontiers_registered:0 "Civil registration in the province is complete"
 HSM_BAR_mtc_frontiers_registry_running:0 "Civil registration is in progress"
 HSM_BAR_mtc_frontiers_citizenship_running:0 "The citizenship programme is in progress"
 HSM_BAR_mtc_frontiers_integrated:0 "The province has adopted equal republican citizenship"
 HSM_BAR_mtc_frontiers_citizenship_report:0 "The assembly has received the first completed citizenship report"
 HSM_BAR_mtc_frontiers_ZES_goal:0 "The parliamentary authorization for war against Kása remains valid"
 HSM_BAR_mtc_frontiers_OLV_goal:0 "The parliamentary mandate against [OLV.GetNameDef] remains valid"
 HSM_BAR_mtc_frontiers_ZES_goal_issued:0 "The Kása campaign mandate has already been resolved"
 HSM_BAR_mtc_frontiers_OLV_goal_issued:0 "The campaign mandate concerning [OLV.GetNameDef] has already been resolved"
 HSM_BAR_mtc_frontiers_ZES_vote:0 "A legacy parliamentary vote concerning Kása is recorded"
 HSM_BAR_mtc_frontiers_OLV_vote:0 "A legacy parliamentary vote concerning [OLV.GetNameDef] is recorded"
 HSM_BAR_mtc_frontiers:0 "A Republic Among Neighbours"
 HSM_BAR_mtc_frontiers_desc:0 "The Pentarchy treated foreign affairs as a private quarrel between magicians. The republic cannot. Its foreign office needs a public mandate, a defence budget and the right to question the Collegium's advice. Civilian surveyors and army scouts will compare their border maps before the assembly hears any campaign proposal. Preparing an army will not exempt us from explaining why it should fight."
 HSM_BAR_mtc_frontiers_supply:0 "An Army That Can Be Supplied"
 HSM_BAR_mtc_frontiers_supply_desc:0 "A demonstration engine can impress a committee for an afternoon. A military wagon must work in rain, mud and the hands of an exhausted mechanic. Civilian procurement officers will impose common specifications on field workshops and transport equipment. The Collegium will answer for repairs as well as inventions."
 HSM_BAR_mtc_frontiers_staff:0 "Officers Before the Assembly"
 HSM_BAR_mtc_frontiers_staff_desc:0 "Our first staff exercise will end in the assembly chamber. Officers must explain their estimates of losses, ammunition and transport before anyone votes for a campaign. These hearings will be uncomfortable. An army accustomed to a magician's command must learn that a civilian refusal is still an order."
 HSM_BAR_mtc_frontiers_ZES_hearing:0 "The Kása Hearings"
 HSM_BAR_mtc_frontiers_ZES_hearing_desc:0 "The border file contains commercial disputes, military estimates and sharply different accounts of the new Barrad. None establishes that every government in Kása is our natural enemy. Quartermasters will turn the testimony of carriers and local guides into a practical supply study. The assembly can then open talks without surrendering its right to debate a campaign."
 HSM_BAR_mtc_frontiers_ZES_mandate:0 "A Mandate Concerning Kása"
 HSM_BAR_mtc_frontiers_ZES_mandate_desc:0 "Supporters of intervention promise secure approaches and access to southern markets. Their opponents ask when a republic founded against arbitrary rule acquired the right to decide another country's future. The assembly must now settle the motion itself: authorizing an offensive objective openly, and accepting responsibility for it. That mandate does not order the army across the border."
 HSM_BAR_mtc_frontiers_OLV_hearing:0 "Hearings: [OLV.GetName]"
 HSM_BAR_mtc_frontiers_OLV_hearing_desc:0 "Our southern neighbour is [OLV.GetNameDef], not an empty space on a map. Merchants and local guides know roads that can carry an invading column, a harvest or a caravan of refugees. Their testimony will inform a supply study before the assembly considers cooperation or a campaign."
 HSM_BAR_mtc_frontiers_OLV_mandate:0 "Mandate: [OLV.GetName]"
 HSM_BAR_mtc_frontiers_OLV_mandate_desc:0 "A plan for a campaign against [OLV.GetNameDef] is before the deputies. The cabinet argues that the republic needs strategic depth; its critics see an old ambition wearing a new seal. The assembly will settle the motion, not pass responsibility to another committee. An approved objective permits a war; it is not an order to begin one."
 HSM_BAR_mtc_frontiers_WIT_line:0 "A Line Against Invasion"
 HSM_BAR_mtc_frontiers_WIT_line_desc:0 "Wittenland's claims did not vanish when Ambrosius fell. Engineers will survey defensive positions while diplomats keep the door open. The republic is not granting Silver Star a campaign against his former homeland. Fortification plans must protect villages, not furnish a pretext for a private reckoning."
 HSM_BAR_mtc_frontiers_WIT_armistice:0 "After the Defensive War"
 HSM_BAR_mtc_frontiers_WIT_armistice_desc:0 "Wittenland attacked, and the peace conference has placed Barrad among the victors. That record matters: this settlement cannot be invoked to justify an unrelated conquest. A civilian delegation will examine only the provinces actually awarded to us. The fate of Wittenland's remaining territory is not ours to settle by decree."
 HSM_BAR_mtc_frontiers_WIT_councils:0 "Councils Beyond the Frontier"
 HSM_BAR_mtc_frontiers_WIT_councils_desc:0 "A military governor can requisition grain, but cannot make the requisition legitimate simply by changing the stationery. Local representatives must examine ownership records, reopen courts and challenge emergency orders. Integration will begin province by province; an inaccessible district must not hold every other community hostage."
 HSM_BAR_mtc_frontiers_WIT_charter:0 "Citizenship, Not Spoils"
 HSM_BAR_mtc_frontiers_WIT_charter_desc:0 "The final charter offers the same civic standing as in Barrad, not permanent government by the victors. Registration must precede citizenship, and persistent resistance will halt the process. No assembly vote can transfer a province held by another state. Our promise concerns the inhabitants we actually govern, and it will take time and money to fulfil."
 HSM_BAR_mtc_frontiers_ZES_mandate_tt:0 "Completing this focus grants a 180-day annexation war goal against Kása. No separate decision or political-power payment is required. It does not declare war, transfer territory or grant cores. A subsequent treaty or loss of valid target conditions withdraws this mandate's unused goal."
 HSM_BAR_mtc_frontiers_OLV_mandate_tt:0 "Completing this focus grants a 180-day annexation war goal against [OLV.GetNameDef]. No separate decision or political-power payment is required. It does not declare war, transfer territory or grant cores. A subsequent treaty or loss of valid target conditions withdraws this mandate's unused goal."
 HSM_BAR_mtc_frontiers_WIT_councils_tt:0 "Unlocks provincial registration: 50 political power, 60 days, compliance at least 25 and resistance at most 35 throughout; grants 10 compliance and records civil registration, not a core. Only historical Wittenland provinces newly obtained in a recorded defensive victory qualify. Each province requires peace, ownership and control. Cancellation gives no refund."
 HSM_BAR_mtc_frontiers_WIT_charter_tt:0 "Unlocks citizenship for already registered provinces: 100 political power, 120 days, compliance at least 60 and resistance at most 10 throughout. Peace, ownership, control and institutional access must remain valid. Successful completion adds a BAR core to that province only. Cancellation gives no refund or core."
 HSM_BAR_mtc_frontiers_policy:0 "Wittenland's Civil Settlement"
 HSM_BAR_mtc_frontiers_policy_desc:0 "Local records and equal citizenship concern only provinces awarded after Wittenland directly attacked Barrad and lost the resulting peace conference. The assembly's campaign mandates are settled in the focus tree, not through these provincial programmes."
 HSM_BAR_mtc_frontiers_assembly_t:0 "Who May Order a Campaign?"
 HSM_BAR_mtc_frontiers_assembly_d:0 "The general staff arrived with three folders. The civilian chair asked for a fourth: the authority under which the first three had been prepared. An engineer protested that the roads did not care which committee paid for them. A village deputy replied that the families supplying the soldiers certainly did.\n\nThe compromise did not please everyone. The Collegium would advise, the army would prepare, and civilian representatives would authorize any offensive goal separately. Treaties would remain binding until formally renounced. For the first time, a neighbour's future was not being decided in a magician's private study."
 HSM_BAR_mtc_frontiers_assembly_a:0 "Put the limits into the minutes."
 HSM_BAR_mtc_frontiers_ZES_vote_t:0 "The Kása Motion Passes"
 HSM_BAR_mtc_frontiers_ZES_vote_d:0 "The cabinet called the proposed campaign a measure of security. Across the chamber, a deputy crossed out that phrase and wrote 'a war we choose to begin'. Kása's government has its own supporters, opponents and obligations; it cannot be reduced to a convenient villain in our founding story.\n\nThe motion passed, and the dissenting speeches remain in the minutes. The cabinet now has a military objective it may pursue for six months. The frontier remains quiet: an authorization is not a marching order, and the assembly has neither annexed a neighbour on paper nor made its inhabitants our citizens."
 HSM_BAR_mtc_frontiers_OLV_vote_t:0 "The Price of Strategic Depth"
 HSM_BAR_mtc_frontiers_OLV_vote_d:0 "A staff officer placed a ruler across the southern map. Beyond the line, he said, Barrad could maintain better approaches and supply routes. A merchant asked how many farms lay underneath the ruler. Nobody had counted.\n\nThe assembly has nevertheless approved a campaign objective against [OLV.GetNameDef], valid for six months. The cabinet must decide whether to use it. The inhabitants are not obstacles drawn in ink, and victory would bring occupation, not instant citizenship. The republic has chosen to permit expansion. It may not pretend that expansion chose it."
 HSM_BAR_mtc_frontiers_peace_t:0 "A Victory Is Not a Constitution"
 HSM_BAR_mtc_frontiers_peace_d:0 "The peace papers establish who attacked and who prevailed. They do not establish how a village should choose its councillors, which court will hear a property dispute or whether a school may keep its books. Those questions have reached the civilian delegation's desk.\n\nOnly provinces actually awarded to Barrad belong in its dossier. No clerk is to draw a new frontier around territory still governed by someone else. Before the republic can speak of fellow citizens, it must govern its new responsibilities without treating them as spoils."
 HSM_BAR_mtc_frontiers_peace_a:0 "Send administrators, not proprietors."
 HSM_BAR_mtc_frontiers_family_t:0 "A Name on the Delegation List"
 HSM_BAR_mtc_frontiers_family_d:0 "Silver Star found his name among the proposed advisers and asked who had entered it. 'You know the country,' the secretary replied. He stared at the list. Knowing a country was not the same as being owed it.\n\nHis sister White Star had condemned the dark arts that drew him away from Wittenland. He remembered her judgment with the old resentment, and, uncomfortably, remembered that resentment was not evidence. Whatever office she held now, her brother could not use a republic's victory to settle their quarrel.\n\nHe struck out the suggestion that he oversee the settlement and offered a medical inventory instead. For once, a return home would not have to resemble a triumph."
 HSM_BAR_mtc_frontiers_delegation_d:0 "The delegation's proposed powers were returned unsigned. Its draft made a temporary administrator judge, tax collector and final authority in every dispute. A note from the assembly asked a simple question: had Barrad overthrown the Pentarchy merely to export its habits?\n\nThe revised instructions preserve local records and require civilian hearings before permanent changes. The delegation will report to the republic, not become a new court of magicians beyond the frontier."
 HSM_BAR_mtc_frontiers_family_a:0 "No private claims in the republic's name."
 HSM_BAR_mtc_frontiers_citizens_t:0 "The First Completed Register"
 HSM_BAR_mtc_frontiers_citizens_d:0 "The first provincial register arrived with corrections in three different inks. Some entries had been challenged; others restored after witnesses returned. The clerk apologised for the untidy pages. The chair told her that a clean register produced without objections would have been much harder to trust.\n\nIts inhabitants now enter the republic on the same civic footing as Barrad's own communities. Other provinces still have their own hearings ahead of them. This conclusion is not an instruction to skip those hearings."
 HSM_BAR_mtc_frontiers_citizens_a:0 "The next province must receive the same hearing."
 HSM_BAR_mtc_frontiers_ZES_hearing_t:0 "What the Kása File Does Not Prove"
 HSM_BAR_mtc_frontiers_ZES_hearing_d:0 "A deputy asked the ministry to distinguish a neighbour's intentions from our own wishes. The resulting file became considerably thinner. The quartermasters' supply study was more useful: crossings, repair stops and storage sites were marked from testimony rather than arrows on a staff map.\n\nCopies have gone to the field workshops. A civilian envoy may now take the political questions to Kása, or the assembly may retain the report without opening talks. Neither choice authorizes an invasion."
 HSM_BAR_mtc_frontiers_OLV_hearing_t:0 "Before the Southern Maps"
 HSM_BAR_mtc_frontiers_OLV_hearing_d:0 "The guides brought sketches that disagreed with the army's neat arrows. The dispute was not only geographical. Some deputies wanted a safer border with [OLV.GetNameDef]; others wanted to move it. The chair insisted that these were different proposals.\n\nThe completed supply study records roads, winter storage and the limits of the army's transport. The workshops will receive it whatever the assembly decides about negotiations. A diplomatic approach may still find room for coexistence; it is not an authorization for war."
 HSM_BAR_mtc_frontiers_envoy:0 "Send a civilian envoy."
 HSM_BAR_mtc_frontiers_registry_614:0 "Restore civil records in $STATE_614$"
 HSM_BAR_mtc_frontiers_registry_614_desc:0 "Land titles, missing-person records and village councils must be restored before citizenship can be promised. Sixty days of work cost 50 political power and add 10 compliance. Ownership and control, peace, compliance of at least 25 and resistance no higher than 35 must be maintained. Interrupted work gives no reward or refund."
 HSM_BAR_mtc_frontiers_citizenship_614:0 "Extend equal citizenship to $STATE_614$"
 HSM_BAR_mtc_frontiers_citizenship_614_desc:0 "With registration complete, the province can adopt the common civic charter. This costs 100 political power and takes 120 days, requiring peace, ownership and control, compliance of at least 60 and resistance no higher than 10 throughout. Only successful completion makes this province a core; other states and their existing cores are untouched."
