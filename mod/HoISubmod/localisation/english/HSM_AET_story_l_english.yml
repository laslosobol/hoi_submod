 HSM_AET.30.a:0 "Open the records to witnesses."
 HSM_AET.30.a.tt:0 "Begin an open inquiry. The eventual identity settlement will add §G5 percentage points§! of stability; its separate signing cost is §Y35§! political power."
 HSM_AET.30.b:0 "Verify the evidence behind closed doors."
 HSM_AET.30.b.tt:0 "Investigate privately, then hold the public hearing. The eventual disclosure will cost §R5 percentage points§! of stability; its separate signing cost remains §Y35§! political power."
 HSM_AET.31.t:0 "The Name Behind the Seal"
 HSM_AET.31.d:0 "The clerk lays the disputed orders beside the military dispatches Trimmel signed before taking the Count's name. The same unusual corrections recur in both. Officers who carried the instructions have confirmed their origin, and certified copies have been lodged outside the palace. These witnesses and papers will remain even if the audience is dismissed.\n\nThe quartermaster confirms that the disputed orders kept supplies moving. He will not certify another payroll under a name now challenged by the witnesses. Trimmel gives his own name: he will defend his command at a hearing rather than let every order become a disputed signature. The clerk records the admission and the quartermaster's testimony. Neither establishes what happened to the real Count."
 HSM_AET.31.a:0 "Enter the admission under his own name."
 HSM_AET.31.a.tt:0 "Record Trimmel's identity and proceed to a public hearing. Legal ratification and imperial handover remain suspended until the settlement is signed."
 HSM_AET.32.t:0 "The Authority of a Borrowed Face"
 HSM_AET.32.count.d:0 "Count Cloudet takes his place before the assembly. Several delegates rise to greet him; he motions for them to hear the disputed orders first. His return gives them someone else to entrust with the county, but restoring his name will not by itself repair what was done under it.\n\nDismissal can be accompanied by an orderly restitution fund, or enforced without compensation if the government cannot afford it. A third proposal would retain Trimmel openly as a protector under written limits: public accounts, civilian countersignatures and no inherited claim to the county or the crown. The audience is divided. Nobody is allowed to pretend the face is still Cloudet's."
 HSM_AET.32.council.d:0 "The search for Count Cloudet has brought no reliable news. Some delegates demand a declaration of death, but the clerk refuses to enter a rumour into the record. If Trimmel is dismissed, a civic council will take responsibility for the county until a lawful settlement can be reached.\n\nThe petitioners want more than a change of names: contracts signed under false pretences have left unpaid bills. Compensation would ease the transition; without it, those losses will remain with the claimants. Others propose retaining Trimmel openly as protector, subject to public accounts and civilian countersignatures. He would have to surrender both the borrowed face and any claim to a hereditary title."
 HSM_AET.32.a:0 "Dismiss him and fund restitution."
 HSM_AET.32.a.tt:0 "Remove Trimmel from government. Restore Count Cloudet if he has been found; otherwise appoint a civic council. Pay compensation for the imposture's immediate harm."
 HSM_AET.32.b:0 "Ratify the protector, under his own name."
 HSM_AET.32.b.tt:0 "Retain Trimmel as an openly acknowledged, constrained protector. The compact gains §G+5%§! division organisation and §R−0.15§! daily political power. The final signature is still required."
 HSM_AET.32.c:0 "Dismiss him. We cannot fund compensation."
 HSM_AET.32.c.tt:0 "Remove Trimmel. Restore Count Cloudet if he has been found; otherwise appoint a civic council. Pay no compensation; claimants must bear the immediate loss."
 HSM_AET.33.t:0 "A Signature of One's Own"
 HSM_AET.33.trimmel_open.d:0 "Trimmel reads the clauses governing his command twice. The treasury will honour only orders countersigned by the civilian administration; the assembly can withdraw his appointment if he breaks the charter. In return, he keeps an acknowledged command and a budget the offices will release under his own name. He checks that the agreed military accounts are attached, then signs as protector. No hereditary title accompanies the appointment.\n\nAt the public reading, a witness asks which official may refuse an unlawful order. The civilian countersignatory stands and gives her name. Those who followed the open inquiry can check the charter against the testimony they heard. The appointment is entered under Trimmel's own name, and the offices resume the business held over during the hearing."
 HSM_AET.33.trimmel_quiet.d:0 "Trimmel reads the clauses governing his command twice. The treasury will honour only orders countersigned by the civilian administration; the assembly can withdraw his appointment if he breaks the charter. In return, he keeps an acknowledged command and a budget the offices will release under his own name. He checks that the agreed military accounts are attached, then signs as protector. No hereditary title accompanies the appointment.\n\nAt the public reading, a delegate asks when the officials first knew whose orders they were obeying. The dates in the private inquiry's register bring a murmur from the room. Trimmel's appointment can take effect under its published restrictions, but the officials who kept the inquiry quiet will still have to answer for the delay. The offices resume the business held over during the hearing."
 HSM_AET.33.count_open.d:0 "Count Cloudet takes the pen and asks for the disputed orders to remain attached. A restored ruler, he says, does not get to inherit only the convenient pages. The clerk makes room for a proper signature and keeps the witnesses seated until it is dry.\n\nThe restitution arrangement remains attached to the restored administration's obligations. The witnesses who followed the open inquiry can check the final record against what they heard. The legal suspension can end: the name, the office and the responsibility finally occupy the same line."
 HSM_AET.33.count_open_unpaid.d:0 "Count Cloudet takes the pen and asks for the disputed orders to remain attached. A restored ruler, he says, does not get to inherit only the convenient pages. The clerk makes room for a proper signature and keeps the witnesses seated until it is dry.\n\nThe unfunded dismissal has left claims unpaid; this signature records them, but cannot conjure the missing compensation. The witnesses who followed the open inquiry can check the final record against what they heard. The legal suspension can end: the name, the office and the responsibility finally occupy the same line."
 HSM_AET.33.count_quiet.d:0 "Count Cloudet takes the pen and asks for the disputed orders to remain attached. A restored ruler, he says, does not get to inherit only the convenient pages. The clerk makes room for a proper signature and keeps the witnesses seated until it is dry.\n\nThe restitution arrangement remains attached to the restored administration's obligations. The public also learns how long the inquiry remained private. The questions about that silence will outlast today's ceremony. Even so, the legal suspension can end: the name, the office and the responsibility finally occupy the same line."
 HSM_AET.33.count_quiet_unpaid.d:0 "Count Cloudet takes the pen and asks for the disputed orders to remain attached. A restored ruler, he says, does not get to inherit only the convenient pages. The clerk makes room for a proper signature and keeps the witnesses seated until it is dry.\n\nThe unfunded dismissal has left claims unpaid; this signature records them, but cannot conjure the missing compensation. The public also learns how long the inquiry remained private. The questions about that silence will outlast today's ceremony. Even so, the legal suspension can end: the name, the office and the responsibility finally occupy the same line."
 HSM_AET.33.council_open.d:0 "The civic council signs by office and date. Nobody imitates the Count's hand, and nobody fills the silence about his fate with a convenient obituary. The authority restored today belongs to a lawful administration, whose decisions can be traced to the officials who made them.\n\nThe restitution arrangement remains attached to the restored administration's obligations. The witnesses who followed the open inquiry can check the final record against what they heard. The legal suspension can end: the name, the office and the responsibility finally occupy the same line."
