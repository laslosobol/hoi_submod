l_english:
 HSM_AET_context_lost:0 "These circumstances no longer hold."
 HSM_AET_context_lost_desc:0 "The circumstances recorded in this paper no longer hold. The office files it without authorising the proposed action."
 HSM_AET_postpone:0 "Leave the question for the next review."
 HSM_AET_postpone_tt:0 "Postpone without cost, reward or a policy choice. The matter will return at the next scheduled review in several weeks, provided the circumstances still permit it."
 HSM_AET_story_afford_10:0 "At least §Y10§! political power is available."
 HSM_AET_story_afford_25:0 "At least §Y25§! political power is available."
 HSM_AET_story_afford_35:0 "At least §Y35§! political power is available."
 HSM_AET_story_afford_50:0 "At least §Y50§! political power is available."
 HSM_AET_story_afford_75:0 "At least §Y75§! political power is available."
 HSM_AET_story_afford_revision:0 "Contract revision requires §Y50§! political power if the financier faced the court, or §Y100§! if he was protected."
 HSM_AET.1.t:0 "Letters Without an Answer"
 HSM_AET.1.imperial.d:0 "The packet from the imperial road contains three unpaid invoices, a request for flour and a letter addressed to a ministry that no longer answers. Someone has carefully crossed out the old forwarding address.\n\nGreifwald once treated its ties to the Empire as useful insurance against its neighbours. Now those ties have acquired faces: a clerk waiting at the gate, a porter with a list of missing colleagues. The county can offer bread, shelter and an office where a petition will be read. Anything grander will have to earn its signature."
 HSM_AET.1.changed.d:0 "The old foreign-policy memorandum still lies on the desk: trade with both neighbours, promise neither too much. Beside it sits a letter from the imperial road, stained through by rain. Its author asks where the displaced should sleep.\n\nWhether Greifwald looked west or kept its distance, the memorandum offers no answer. The clerks draft a narrower undertaking: shelter those who reach us, keep an honest account, promise no throne we cannot lawfully deliver. The first wagon is already at the gate."
 HSM_AET.1.a:0 "Give the letters an address."
 HSM_AET.1.a.tt:0 "Open the relief administration and begin the county's undertaking."
 HSM_AET.2.t:0 "A Room on the Register"
 HSM_AET.2.minor.d:0 "The lodging clerk has one column for names and another for blankets. When Grover's household reaches her desk, she asks for both, in that order. The boy watches a carpenter carry a broken school bench upstairs; for once, nobody asks him to bless anything.\n\nHis presence is entered in the register. So are the families beside him. Lodging is not a regency, and a warm room does not buy an oath. The engineers among the arrivals ask for a workshop before they ask for ceremony."
 HSM_AET.2.adult.d:0 "Grover arrives at the lodging office with his own list of household expenses. The clerk begins to address him through an attendant; he moves the ledger between them and answers for himself. Outside, refugee craftsmen argue over the keys to an empty workshop.\n\nHe is an adult guest, not a ward to be allocated. Protection can be offered here; public authority will require his agreement and a territorial settlement. For tonight, the register records a room, a household and an expense that someone must pay."
 HSM_AET.2.absent.d:0 "The first arrivals bring a dismantled printing press, parish registers and more keys than doors they can still open. The clerk gives the engineers a workshop and the families a place on the lodging list.\n\nThere is no imperial household to receive at this desk. The palace rooms remain available, but an empty room is no proof of a death, an arrival or a right of custody. The county will work with the people actually here while its envoys establish where Grover and his household have taken refuge."
 HSM_AET.2.dead.d:0 "The arrivals bring a dismantled printing press, parish registers and a bundle of household papers tied with black ribbon. Grover's death has been confirmed. The lodging clerk leaves his name off the list of expected guests, then asks the survivors where they will sleep tonight.\n\nA former court servant helps her identify families separated on the road. The engineers ask whether the empty workshop can be opened, and a carpenter offers to repair its door. Rooms once held ready for the imperial household are assigned to people who need them now. There is still work for the county to do."
 HSM_AET.2.a:0 "Names first. Titles afterwards."
 HSM_AET.2.a.tt:0 "Receive the refugees and put their industrial expertise to work."
 HSM_AET.3.t:0 "The County's Own Roof"
 HSM_AET.3.d:0 "The mayor lays a cracked roof tile beside the relief budget. Rain has been entering the village school since spring. Across the table, a merchant offers credit for both the roof and the new lodgings; his repayment schedule is folded underneath the offer.\n\nNobody demands that the guests be turned away. They ask whose repairs will wait, and who will still be paying when the procession has gone. A public appropriation would settle the question openly. Credit would get the builders moving sooner, at the price of a creditor's regular place at the door."
 HSM_AET.3.a:0 "Publish the appropriation."
 HSM_AET.3.a.tt:0 "Fund relief through the public budget. The compact gains §G+5%§! stability."
 HSM_AET.3.b:0 "Accept the loan, and print its terms."
 HSM_AET.3.b.tt:0 "Use private credit. The compact gains §G+5%§! construction speed and §R−0.10§! daily political power."
 HSM_AET.4.t:0 "A Map with an Edge"
 HSM_AET.4.d:0 "The delegates object to the first map. It colours every old imperial province alike, including places whose inhabitants have sent nobody to this room. The surveyor takes it away.\n\nIts replacement shows Griffenheim and the Herzland districts that our administration actually owns and controls. Greifwald's homeland is set apart. The delegates consent to a temporary common administration within that boundary, subject to a later settlement. A clerk draws a firm line around the signatories' territory. For once, the border of an ambition can be seen."
 HSM_AET.4.a:0 "This is the extent of our mandate."
 HSM_AET.4.a.tt:0 "Confirm the territorial congress and open the county's domestic development programme."
 HSM_AET.10.t:0 "A Guest or a Mandate"
 HSM_AET.10.minor.d:0 "The guardianship deed lies beside the household register. One document promises a child shelter; the other would let Greifwald govern the administered Herzland in his name until a lawful handover. The distinction takes the lawyers all afternoon to preserve.\n\nGrover asks whether refusing would mean packing his belongings. The secretary turns the lodging agreement towards him: that promise has no such condition. The household may accept a public mandate, or remain under private protection. Nobody at the table is entitled to call that choice a family duty."
 HSM_AET.10.adult.d:0 "Grover crosses out the word 'guardian' before the secretary has finished reading. He is old enough to sign for himself. What he can agree to is a temporary administration, a published budget and a binding transfer of the administered Herzland when the terms are met.\n\nThe revised deed leaves Greifwald's homeland outside that transfer. It also leaves him free to refuse. His lodging and personal protection do not depend on lending his name to a government. He reads that clause twice, then puts down the pen."
 HSM_AET.10.a:0 "Accept the written mandate."
 HSM_AET.10.a.tt:0 "Establish a lawful regency or adult transition. Fully controlled Herzland holdings gain provisional integration; the county's homeland remains separate."
 HSM_AET.10.b:0 "Keep the protection private."
 HSM_AET.10.b.tt:0 "Decline the political mandate. Grover remains a protected guest; the regency programme closes, while domestic development remains available."
 HSM_AET.11.t:0 "Who May Ask a Question?"
 HSM_AET.11.minor.d:0 "At the school doorway, Grover discovers that the smallest desk has an ink stain shaped like a river. A pupil insists that it is a dragon. Their argument ends only when the tutor calls him back to the waiting carriage.\n\nThe household can arrange ordinary lessons, shared with children whose parents will expect honest answers about the county. Or it can assemble an accomplished court staff, keeping his education close to the offices he may one day lead. Both promise to teach him how government works. Only one begins with being contradicted over an ink stain."
 HSM_AET.11.adult.d:0 "Grover's first proposed civic visit comes with a prepared list of questions. At the bottom, the protocol officer has added the answers. Grover places the two sheets side by side and asks which part of the visit requires him to attend.\n\nWe can open the programme to schools, workshops and public meetings, where an answer may be challenged. The court instead proposes a disciplined round of briefings with experienced officials. One widens the circle around the future government; the other makes the existing circle work more smoothly."
 HSM_AET.11.a:0 "Let the doors open both ways."
 HSM_AET.11.a.tt:0 "Choose public education and civic exchanges. The compact gains §G+5%§! research speed."
 HSM_AET.11.b:0 "Let the household organise the programme."
 HSM_AET.11.b.tt:0 "Choose court tutors and official briefings. The compact gains §G+10%§! political power gain."
 HSM_AET.12.t:0 "The Price of the Candles"
 HSM_AET.12.d:0 "The household accounts distinguish ceremonial candles from ordinary candles. The treasurer cannot explain why the former cost three times as much. A private patron offers to settle the difference and spare everyone an embarrassing hearing.\n\nHis proposal comes with an office for his agent and a preference for his suppliers. Public funding would be slower and politically expensive; every receipt would be open to inspection. Private finance would ease the demands on industry, but the household would acquire someone whose invoices arrive with requests attached."
 HSM_AET.12.a:0 "Every candle goes in the public ledger."
 HSM_AET.12.a.tt:0 "Publish and fund the court accounts. The compact gains §G+5%§! stability."
 HSM_AET.12.b:0 "Take the patron's offer."
 HSM_AET.12.b.tt:0 "Accept patron finance. The compact gains §G−5%§! consumer goods factories factor, at §R−0.10§! daily political power."
 HSM_AET.13.t:0 "The Oath's Last Line"
 HSM_AET.13.d:0 "The colonel reads the proposed oath in a voice trained to carry across a parade ground. Then a deputy asks who may dismiss him if the government breaks its own law. The colonel begins the oath again.\n\nThe civilian draft binds the army to published law and the territory under administration. The officers offer professional contracts in exchange for firmer guarantees of pay and influence over military appointments. Neither draft promises a march across Griffonia. The dispute is over who may command the soldiers standing here."
 HSM_AET.13.a:0 "The army serves the law."
 HSM_AET.13.a.tt:0 "Bind service to civilian law. The compact gains §G+5%§! division organisation and §G−5%§! supply consumption."
 HSM_AET.13.b:0 "Sign the officers' contracts."
 HSM_AET.13.b.tt:0 "Secure the officers' cooperation. The compact gains §G+10%§! division organisation and §R+5%§! consumer goods factories factor."
 HSM_AET.14.t:0 "The Supplier's Seal"
 HSM_AET.14.patron.d:0 "The complaint concerns the financier whose money keeps the household running. A miller has receipts showing that his agent bought grain below the published price and charged the court in full. The patron offers another advance if the matter is left to his own accountants.\n\nThe miller has brought no advocate. He has brought the original receipts, wrapped against the rain. The magistrate asks whether a creditor of the court must answer to the same bench as everyone else."
 HSM_AET.14.public.d:0 "The public accounts have done their work: a miller has matched his receipts against the court's published grain purchases. The figures do not agree. A supplier who also finances influential officials offers an advance if the discrepancy can be settled privately.\n\nPublishing a ledger was easier than judging someone whose friends helped to approve it. The miller waits on a wooden bench, with the receipts on his knees. The magistrate waits for an answer about jurisdiction."
 HSM_AET.14.a:0 "The seal grants no exemption."
 HSM_AET.14.a.tt:0 "Bring the financier before an independent court. The compact gains §G+5%§! stability."
 HSM_AET.14.b:0 "The household still needs his credit."
 HSM_AET.14.b.tt:0 "Shield the financier and accept his assistance. His influence costs §R0.10§! daily political power under the compact."
 HSM_AET.15.t:0 "The First Objection"
 HSM_AET.15.minor_judged_law.d:0 "Grover has brought the grain case to the working table. He has underlined a sentence from his lessons: the law is the same for everyone. 'Does that include the people who pay us?' he asks. Nobody reaches for the schoolbook.\n\nThe financier did face the court. Grover asks whether the same courage will survive a dispute with a more useful ally. The army's oath already names the law. Revising the remaining privileges would give the words a harder edge; leaving the agreements intact would preserve the settlement and its friends."
 HSM_AET.15.minor_judged_contract.d:0 "Grover has brought the grain case to the working table. He has underlined a sentence from his lessons: the law is the same for everyone. 'Does that include the people who pay us?' he asks. Nobody reaches for the schoolbook.\n\nThe financier did face the court. Grover asks whether the same courage will survive a dispute with a more useful ally. The officers' contracts reserve their privileges. Revising the civil agreements would address the grievance, although the separate military bargain would remain. Upholding them would keep the backers together and leave Grover's objection on the record."
 HSM_AET.15.minor_protected_law.d:0 "Grover has brought the grain case to the working table. He has underlined a sentence from his lessons: the law is the same for everyone. 'Does that include the people who pay us?' he asks. Nobody reaches for the schoolbook.\n\nThe financier was protected. Grover points to the miller's unanswered receipts; the household's need for credit has become an exception nobody wrote down. The army's oath already names the law. Revising the remaining privileges would give the words a harder edge; leaving the agreements intact would preserve the settlement and its friends."
 HSM_AET.15.minor_protected_contract.d:0 "Grover has brought the grain case to the working table. He has underlined a sentence from his lessons: the law is the same for everyone. 'Does that include the people who pay us?' he asks. Nobody reaches for the schoolbook.\n\nThe financier was protected. Grover points to the miller's unanswered receipts; the household's need for credit has become an exception nobody wrote down. The officers' contracts reserve their privileges. Revising the civil agreements would address the grievance, although the separate military bargain would remain. Upholding them would keep the backers together and leave Grover's objection on the record."
 HSM_AET.15.adult_judged_law.d:0 "Grover places the grain judgement beside the army's service agreement. He has marked the places where an obligation becomes an exception. 'I will have to govern under these clauses,' he says. 'I would like to know which ones we mean.'\n\nThe financier did face the court. Grover asks whether the same courage will survive a dispute with a more useful ally. The army's oath already names the law. Revising the remaining privileges would give the words a harder edge; leaving the agreements intact would preserve the settlement and its friends."
 HSM_AET.15.adult_judged_contract.d:0 "Grover places the grain judgement beside the army's service agreement. He has marked the places where an obligation becomes an exception. 'I will have to govern under these clauses,' he says. 'I would like to know which ones we mean.'\n\nThe financier did face the court. Grover asks whether the same courage will survive a dispute with a more useful ally. The officers' contracts reserve their privileges. Revising the civil agreements would address the grievance, although the separate military bargain would remain. Upholding them would keep the backers together and leave Grover's objection on the record."
 HSM_AET.15.adult_protected_law.d:0 "Grover places the grain complaint beside the army's service agreement. He has marked the places where an obligation becomes an exception. 'I will have to govern under these clauses,' he says. 'I would like to know which ones we mean.'\n\nThe financier was protected. Grover points to the miller's unanswered receipts; the household's need for credit has become an exception nobody wrote down. The army's oath already names the law. Revising the remaining privileges would give the words a harder edge; leaving the agreements intact would preserve the settlement and its friends."
 HSM_AET.15.adult_protected_contract.d:0 "Grover places the grain complaint beside the army's service agreement. He has marked the places where an obligation becomes an exception. 'I will have to govern under these clauses,' he says. 'I would like to know which ones we mean.'\n\nThe financier was protected. Grover points to the miller's unanswered receipts; the household's need for credit has become an exception nobody wrote down. The officers' contracts reserve their privileges. Revising the civil agreements would address the grievance, although the separate military bargain would remain. Upholding them would keep the backers together and leave Grover's objection on the record."
 HSM_AET.15.a:0 "Amend what we can still put right."
 HSM_AET.15.a.tt:0 "Revise the civil agreements and uphold judicial scrutiny. Military service terms remain unchanged."
 HSM_AET.15.a.protected.tt:0 "Bring the protected financier under judicial scrutiny: remove his §R−0.10§! daily political power burden and replace it with §G+5%§! stability from the compact. Military service terms remain unchanged."
 HSM_AET.15.b:0 "Record the objection. Honour the agreements."
 HSM_AET.15.b.tt:0 "Keep the patron and military arrangements already chosen. Grover's objection remains in the record."
 HSM_AET.16.t:0 "The Date Left Blank"
 HSM_AET.16.minor.d:0 "The treaty has a place for the date of transfer, but the secretary leaves it blank. Grover must first come of age; peace and lawful control must still hold when the day arrives. Everything else is written now, while postponement still looks convenient.\n\nThe restored government will receive Griffenheim and our fully controlled holdings within the agreed Herzland boundary. Greifwald keeps its homeland. A quarter of the army, aircraft and military stockpile will accompany the settlement; ships and officers will not be assigned away. Grover traces the blank date with a claw. The promise finally has an ending."
 HSM_AET.16.adult.d:0 "Grover reads the transfer schedule as a signatory, correcting a boundary reference in the margin. The administration may continue only until the agreed conditions are met: peace, his lawful presence here, settled authority and actual control of the listed lands. There is no longer any need to wait for him to come of age.\n\nGriffenheim and our fully controlled Herzland holdings will pass to the restored government; Greifwald's homeland remains outside. A quarter of the army, aircraft and military stockpile goes with the settlement, but no ships or officers. The last page requires a signature from the government that must learn to let go."
 HSM_AET.16.a:0 "Make the promise binding."
 HSM_AET.16.a.tt:0 "Sign the handover treaty. At peace, an adult Grover lawfully present in Greifwald will receive an independent restored Empire and the eligible Herzland holdings, including Griffenheim. Transfer §Y25%§! of the army, air force and equipment stockpile; retain ships, officers, Greifwald's homeland and Adelart. A faction alliance still requires the relevant leader's consent. The administration continues until every condition holds.\nOnly after the actual handover, Greifwald's compact permanently gains §G+10%§! production efficiency cap and §G+5%§! research speed."
 HSM_AET.17.t:0 "The Returned Key"
 HSM_AET.17.d:0 "The dispatch from Griffenheim arrives with a certified transfer register. Grover has taken up his office there; the administration that governed in his name has handed over its authority. The county's copy lists the lands, the units and the stores actually transferred, without colouring in the provinces beyond them.\n\nAt the former household rooms, a caretaker finds a key returned in an envelope. There is no demand attached. The last page of the county's account can finally be closed. Tomorrow's difficulties will belong to two governments, each obliged to answer for its own promises."
 HSM_AET.17.a:0 "Close the regency's ledger."
 HSM_AET.17.a.tt:0 "Acknowledge the completed transfer. Greifwald and the restored Empire now govern their own territories. The completed handover has already granted Greifwald's compact permanent bonuses of §G+10%§! production efficiency cap and §G+5%§! research speed; this acknowledgement does not grant them again."
 HSM_AET.20.t:0 "A Name in Black Ink"
 HSM_AET.20.guardian.d:0 "The confirmation is read aloud at the household's old table. Grover is dead. The attendant who used to bring his meals asks what should be done with his room; halfway through the question, she falls silent.\n\nThe secretary sets the next petition aside. Those who knew Grover are given time to speak, including servants whose names would never appear in a court obituary. Outside, the relief wagons are being loaded as usual. For this morning, the household may mourn without being asked to turn its loss into another argument about government."
 HSM_AET.20.distant.d:0 "The messenger's papers have been checked against the surviving records and the witnesses' accounts. Grover is dead. A refugee asks for the report to be read again, then folds the letter she had hoped to send to his household.\n\nNews gathers a small crowd at the courthouse. Some remember the imperial household; others knew Grover only as a name on official papers. At their request, the bell is rung and the day's petitions are set aside until the service is over. The delegates will meet again tomorrow. Today, the county makes room for people whose loss cannot be answered by a proclamation."
 HSM_AET.20.a:0 "Let the county mourn."
 HSM_AET.20.a.tt:0 "Record Grover's confirmed death. End any dynastic mandate and its provisional Herzland integration. A consent-based union remains possible; no imperial succession is claimed."
 HSM_AET.21.t:0 "Until the Delegates Decide"
 HSM_AET.21.d:0 "The clerks bring two seals to the morning meeting. One invokes guardianship of the imperial crown. The other says only 'interim administration'. The first is locked away in front of witnesses.\n\nThe new instruction keeps courts sitting, wages paid and relief wagons moving. It authorises no permanent constitution. A district delegate asks when this temporary power will end. The secretary writes the answer into the order: its continuation must be put before the constituent representatives. The delegate stays until the ink is dry."
 HSM_AET.21.direct.d:0 "The courthouse has opened under the congress's temporary authority, but its clerks cannot tell petitioners how long that authority will last. A district delegate brings the unanswered cases to the morning meeting and places them beside the relief payroll.\n\nThe congress extends the civil administration until the constituent representatives can settle its future. Courts will keep sitting and wages will be paid; permanent constitutional decisions are reserved for the assembly. Before leaving, the delegate asks for the instruction to be posted at the courthouse. The people waiting outside should be able to read the same promise."
 HSM_AET.21.a:0 "Keep the offices open, and the mandate limited."
 HSM_AET.21.a.tt:0 "Continue essential administration while the constituent territories negotiate their union."
 HSM_AET.22.t:0 "A Chair for the County"
 HSM_AET.22.d:0 "The Herzland delegation arrives with census tables. Greifwald's representatives arrive with the draft agreement that made this meeting possible. Both place their papers at the centre of the table.\n\nEqual territorial delegations would protect the smaller members from being swallowed by the larger cities. Seats apportioned by population would give those cities a voice closer to the number of people they must answer to. The county cannot have both a small tax roll and a perpetual majority. Its representatives are asked to choose which principle they can defend when it costs them a vote."
 HSM_AET.22.a:0 "Equal voices for the constituent lands."
 HSM_AET.22.a.tt:0 "Give each constituent territory equal representation. The compact gains §G+5%§! stability."
 HSM_AET.22.b:0 "Seats must follow the inhabitants."
 HSM_AET.22.b.tt:0 "Apportion representation by population. The compact gains §G+10%§! political power gain."
 HSM_AET.23.t:0 "The Treaty Without a Crown"
 HSM_AET.23.d:0 "A delegate from one of the smaller towns will not sign until its name is restored to the territorial schedule. Another has brought the corrections approved at home. The secretary reads each amendment back, and the signatures begin only when the delegates recognise the agreement they were sent to make.\n\nThe charter joins Greifwald and the administered Herzland lands in a common state. Its schedule names only lands under our ownership and control; no absent neighbour has been signed into the union. The county retains its title, while the union's authority rests on the agreement. As the last copy is sealed, the first delegate asks who will deliver it to the courthouse in his town."
 HSM_AET.23.a:0 "Let the agreement be our foundation."
 HSM_AET.23.a.tt:0 "Found the treaty union and permanently integrate fully controlled Herzland holdings within the agreed boundary. Claim no territory belonging to a third party."
 HSM_AET.24.t:0 "Two Copies of Every Receipt"
 HSM_AET.24.d:0 "The union's first tax receipt has been stamped twice. The district collector says the bridge must be repaired before another payment leaves town. The central treasury says three districts are already waiting for help with worse damage.\n\nLocal budgets would let communities repair what they know and defend the share promised to them. A common treasury could assemble larger sums and build across district lines. Neither answer produces money by itself. The dispute is over who must explain the waiting list to the people standing on it."
 HSM_AET.24.a:0 "Guarantee the local share."
 HSM_AET.24.a.tt:0 "Protect local budgets. The compact gains §G+5%§! stability and §G+15%§! factory repair speed."
 HSM_AET.24.b:0 "Pool the revenue for common works."
 HSM_AET.24.b.tt:0 "Consolidate common investment. The compact gains §G+10%§! construction speed."
 HSM_AET.25.t:0 "The Office Nobody Inherits"
 HSM_AET.25.d:0 "The assembly tries its draft succession rule on an empty chair. The secretary reads what would happen if the present president could no longer serve. Before the first page is finished, two delegates are asking who has the right to call the vote.\n\nOne proposal gives the choice to the common assembly. The other reserves it for a council of the constituent territories. Both leave the county's hereditary title to its own law. The delegates must settle who will summon the electors and record their decision while the chair is still empty by choice."
 HSM_AET.25.a:0 "The assembly elects the president."
 HSM_AET.25.a.tt:0 "Make the presidency elective through the common assembly. The compact gains §G+10%§! political power gain."
 HSM_AET.25.b:0 "Let the territorial council choose."
 HSM_AET.25.b.tt:0 "Entrust selection to the constituent council. The compact gains §G−5%§! consumer goods factories factor."
 HSM_AET.26.t:0 "The First Winter's Account"
 HSM_AET.26.local.d:0 "Snow closes the northern road before the common assembly has finished congratulating itself. A district treasurer releases its protected repair funds and sends the bill under the procedure agreed in summer. The central office has to accept a lawful decision it did not make.\n\nThe convoy arrives late, but it arrives. The winter budget is passed with objections still entered in the minutes. Outside, a clerk sweeps the steps before the next petitioners come. The union's first achievement is modest enough to be real: its institutions have worked on a day when their founders would rather have argued."
 HSM_AET.26.central.d:0 "Snow closes the northern road before the common assembly has finished congratulating itself. The treasury diverts a common works convoy to reopen it. Delegates from the district that must now wait demand the figures, and receive them before they receive an apology.\n\nThe winter budget survives its first unwelcome amendment. Outside, a clerk sweeps the steps before the next petitioners come. Nobody calls the result a coronation. The union has begun to do something harder to celebrate: take a decision, explain its cost and remain answerable after the applause."
 HSM_AET.26.a:0 "Pass the budget. Open tomorrow's session."
 HSM_AET.26.a.tt:0 "Conclude the founding settlement. The union's agreed institutions and domestic programme endure."
 HSM_AET.27.t:0 "What an Emperor Costs"
 HSM_AET.27.minor.d:0 "Grover leaves a small jewel on top of the household bill. It is his own, he explains, and therefore simpler than asking the county for more. The treasurer has no column for that explanation.\n\nAn attendant suggests announcing the gift as an example of imperial sacrifice. Another quietly fetches a box so it will not be lost among the receipts. We can accept a private contribution without turning a child's generosity into a public duty. Or we can let the newspapers make a lesson of it. The jewel catches the light either way."
 HSM_AET.27.adult.d:0 "Grover presents an assignment of income from his private estate. He has had the household expenses checked and proposes to meet a share himself. The treasurer reads the conditions; the press secretary reads the possible headline.\n\nThe contribution can remain a private, properly recorded transaction. It can also become a public declaration that the future ruler shares the cost of recovery. Grover asks that whichever course is chosen, the actual sum be printed accurately. He has no wish to donate a fortune that exists only in a newspaper."
 HSM_AET.27.a:0 "Thank him without calling the press."
 HSM_AET.27.a.tt:0 "Keep the contribution private, with an ordinary receipt."
 HSM_AET.27.b:0 "Publish the gift and its exact value."
 HSM_AET.27.b.tt:0 "Make the contribution a public gesture of shared responsibility."
 HSM_AET.30.t:0 "A Familiar Hand"
 HSM_AET.30.minor_patron.d:0 "Grover notices the signature before the clerks do. The name is familiar, but the answer underneath it belongs to someone who does not remember their earlier conversation. When he asks about the old promise, the Count's office sends back the same answer on cleaner paper.\n\nThe protected financier's exemption is among the papers. Whoever holds the seal now claims never to have promised him protection. We can open the inquiry to witnesses now, or verify the evidence privately before a public hearing. Privacy may buy time; it will also require us to explain the silence afterwards."
 HSM_AET.30.minor_law.d:0 "Grover notices the signature before the clerks do. The name is familiar, but the answer underneath it belongs to someone who does not remember their earlier conversation. When he asks about the old promise, the Count's office sends back the same answer on cleaner paper.\n\nThe army's civilian oath is among the papers. The new order treats the command as a personal possession, although the signed oath says otherwise. We can open the inquiry to witnesses now, or verify the evidence privately before a public hearing. Privacy may buy time; it will also require us to explain the silence afterwards."
 HSM_AET.30.minor_other.d:0 "Grover notices the signature before the clerks do. The name is familiar, but the answer underneath it belongs to someone who does not remember their earlier conversation. When he asks about the old promise, the Count's office sends back the same answer on cleaner paper.\n\nThe first relief undertaking is among the papers. Its modest limits are missing from the new instructions. We can open the inquiry to witnesses now, or verify the evidence privately before a public hearing. Privacy may buy time; it will also require us to explain the silence afterwards."
 HSM_AET.30.adult_patron.d:0 "Grover returns two letters to the chancellery. Both carry the Count's name; they interpret the same undertaking in incompatible ways. His covering note asks which government he is negotiating with. No tutor can dismiss the question as a child's misunderstanding.\n\nThe protected financier's exemption is among the papers. Whoever holds the seal now claims never to have promised him protection. We can open the inquiry to witnesses now, or verify the evidence privately before a public hearing. Privacy may buy time; it will also require us to explain the silence afterwards."
