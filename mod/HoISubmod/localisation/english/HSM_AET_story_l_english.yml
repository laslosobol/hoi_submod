 HSM_AET.33.a:0 "Sign, publish, and answer for it."
 HSM_AET.33.a.tt:0 "Publish the settlement and lift the legal suspension. Remove the pending imposture inquiry's §R−10%§! stability modifier.\n§YSeparate immediate stability change:§!\n§YOpen inquiry:§! §G+5 percentage points§!.\n§YQuiet inquiry:§! §R−5 percentage points§! when the earlier secrecy is disclosed."
 HSM_AET.40.t:0 "An Invitation from Greifwald"
 HSM_AET.40.minor.d:0 "[AET.GetName] has asked permission to receive Grover and his household. The request promises personal protection and suitable lodging; it does not claim that possessing an imperial capital gives anyone the right to take a child out of our care.\n\nOur answer must be explicit. We may authorise the household's move, or keep our present responsibilities. Any political guardianship would need a further agreement in Greifwald. The envoy waits with an unsealed reply envelope. Nothing is to happen merely because we have not yet answered."
 HSM_AET.40.adult.d:0 "[AET.GetName] proposes to receive Grover and his household as protected guests. He is an adult, and the invitation makes no claim to guardianship over his person. Any public authority in his name would require a later agreement with him.\n\nThe household's present host is being asked to consent to the transfer of its protection arrangements. We may authorise the move or decline it. The reply carries no promise of a throne, territorial surrender or political obedience. The envoy has been instructed to wait for an answer, not to treat silence as permission."
 HSM_AET.40.a:0 "Consent to the household's move."
 HSM_AET.40.a.tt:0 "Transfer the original Grover and his protection arrangements to Greifwald only while this invitation and our authority remain valid. No territory is transferred."
 HSM_AET.40.b:0 "Decline. The household remains here."
 HSM_AET.40.b.tt:0 "Refuse permission and retain the household. Greifwald receives our reply."
 HSM_AET.41.t:0 "An Envelope Returned"
 HSM_AET.41.d:0 "The household correspondence has come back without a valid permission to travel. The present invitation has either been refused or ceased to be one that its recipients can lawfully accept. The secretary files it among unanswered arrangements, not among death notices.\n\nThere will be no carriage dispatched on the strength of an old request. The relief offices can continue their work, and any later approach must begin with the actual household and the circumstances then in force."
 HSM_AET.41.a:0 "Record the answer."
 HSM_AET.41.a.tt:0 "The present request grants no permission to move the household."
 HSM_AET.42.t:0 "The Arrival Register"
 HSM_AET.42.minor.d:0 "The escort delivers the household to Greifwald under the permission actually given. The receiving clerk checks the names before the luggage. Grover waits beside a window, watching someone attempt to fit a trunk through a door that is plainly too narrow.\n\nThe register now records his presence here. The completed journey settles who provides his protection; it does not settle who may govern in his name. That will require the county and the household to read a different document together."
 HSM_AET.42.adult.d:0 "Grover signs the arrival register himself. The escort's papers confirm the consent under which his household has moved to Greifwald. He asks for a copy, then asks which office is responsible for the proposed territorial agreement.\n\nHis protection has changed hands; his political consent has not been signed away. The household is now actually here, and any public mandate must be put to him as an adult capable of accepting or refusing it."
 HSM_AET.42.changed.d:0 "A completed household transfer has been entered in the correspondence, but the present register no longer confirms Grover's local presence. The clerk refuses to turn an earlier arrival notice into a new authority to act for him.\n\nThe journey can be recorded as a past fact. Any guardianship, public audience or handover must depend on the household's actual circumstances now. The entry says nothing by itself about a death."
 HSM_AET.42.a:0 "Keep the register accurate."
 HSM_AET.42.a.tt:0 "Record the completed transfer; any later mandate still requires its own lawful agreement."
 HSM_AET.3.choices_tt:0 "Choice costs: public relief §Y50§! political power; private credit §Y25§!."
 HSM_AET.12.choices_tt:0 "Choice costs: public court funding §Y50§! political power; patron funding §Y25§!."
 HSM_AET.14.choices_tt:0 "Choice costs: independent trial §Y75§! political power; protecting the financier costs no political power and grants §G35§!."
 HSM_AET.15.choices_tt:0 "Choice costs: revise the civil agreements for §Y50§! political power after the financier's trial, or §Y100§! if he was protected; upholding the agreements costs no political power and grants §G25§!."
 HSM_AET.16.choices_tt:0 "Signing the handover treaty costs §Y50§! political power."
 HSM_AET.22.choices_tt:0 "Choice costs: equal territorial votes or representation by population — §Y35§! political power each."
 HSM_AET.23.choices_tt:0 "Founding the treaty union costs §Y35§! political power."
 HSM_AET.24.choices_tt:0 "Choice costs: guaranteed local budgets or pooled revenue for common works — §Y35§! political power each."
 HSM_AET.25.choices_tt:0 "Choice costs: election by the assembly or selection by the territorial council — §Y35§! political power each."
 HSM_AET.30.choices_tt:0 "Choice costs: open inquiry §Y25§! political power; private inquiry §Y10§!. Signing the final settlement later costs a further §Y35§!."
 HSM_AET.32.choices_tt:0 "Choice costs: dismissal with compensation §Y50§! political power; ratification as protector §Y75§!. Only below §Y50§! political power, dismissal without compensation is available at no political power cost but loses §R8 percentage points§! of stability."
 HSM_AET.33.choices_tt:0 "Signing the final identity settlement costs §Y35§! political power."
 HSM_AET.1.imperial_cloudet.d:0 "The packet from the imperial road contains three unpaid invoices, a request for flour and a letter addressed to a ministry that no longer answers. Someone has carefully crossed out the old forwarding address.\n\nGreifwald once treated its ties to the Empire as useful insurance against its neighbours. Now those ties have acquired faces: a clerk waiting at the gate, a porter with a list of missing colleagues. The county can offer bread, shelter and an office where a petition will be read. Anything grander will have to earn its signature.\n\nCloudet sets his seal beside the flour request. 'Let us promise something the baker can deliver.'"
 HSM_AET.1.changed_cloudet.d:0 "The old foreign-policy memorandum still lies on the desk: trade with both neighbours, promise neither too much. Beside it sits a letter from the imperial road, stained through by rain. Its author asks where the displaced should sleep.\n\nWhether Greifwald looked west or kept its distance, the memorandum offers no answer. The clerks draft a narrower undertaking: shelter those who reach us, keep an honest account, promise no throne we cannot lawfully deliver. The first wagon is already at the gate.\n\nCloudet sets his seal beside the flour request. 'Let us promise something the baker can deliver.'"
