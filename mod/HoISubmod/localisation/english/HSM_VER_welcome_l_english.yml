 HSM_VER_WS_ERI_header:0 "House Erie — The Inheritance of a Feud"
 HSM_VER_WS_EYR_header:0 "House Eyrie — The Price of Vigilance"
 HSM_VER_WS_region_header:0 "Verenia — Three Houses, One Homeland"
 HSM_VER_WS_ERI_intro:0 "§YHouse Erie in 1007§!\nDuke Vincent has inherited more than a title. The feud with House Eyrie runs through border claims, family memories and the accounts of villages that must feed another patrol. At court, yielding an old claim looks like weakness; beyond its gates, keeping that claim alive means another bridge left unrepaired and another school without a teacher.\n\nAquileian influence is strong here, but the people of the duchy do not all speak with one voice. A government that wants to rebuild the country must decide how its schools and offices will speak to them. Meanwhile, the private correspondence of Rosaline Erie and Montague Eyrie offers their families an unfamiliar prospect: a future that need not repeat the past.\n\n§YYour campaign§!\nBegin with §Y$HSM_ERI_cost_of_feud$§! and choose between a negotiated settlement and military unification. These are mutually exclusive political commitments. Diplomacy leads from guarantees to shared institutions; victory requires a settlement for the defeated lands.\n\nSchools, livelihoods and industry need their own programme alongside that choice. Erie's cultural branch offers an Aquileian orientation or a bilingual settlement; these reforms remain available after peaceful unification and a change of ruler. The §YRegion§! tab explains the common campaign and Avian's place in it."
 HSM_VER_WS_EYR_intro:0 "§YHouse Eyrie in 1007§!\nDuke Iovinus has built his authority around vigilance. To his officers, the frontier with Erie is a duty handed down with their commissions; to the families behind it, it is a constant demand for labour, provisions and sons. Preparedness has kept the House standing, but it has not filled its classrooms or freed its villages from poverty.\n\nHerzland traditions shape the court and army. Their survival now depends on whether the duchy can turn discipline into lasting civilian institutions. Montague Eyrie's correspondence with Rosaline Erie crosses a border that their elders still regard as a line of rivalry. It may become more than a private understanding, if their Houses can make room for it.\n\n§YYour campaign§!\nBegin with §Y$HSM_EYR_the_price_of_vigilance$§! and choose between an agreement with Erie and military unification. These are mutually exclusive political commitments. Diplomacy requires guarantees and shared institutions; a victorious army must decide how to govern once the fighting ends.\n\nCivilian development addresses poverty, education and production alongside the political campaign. Eyrie's cultural branch offers a Herzland orientation or a bilingual settlement; it remains available under the later joint court. See §YRegion§! for cooperation between the Houses, gradual integration and relations with Avian."
 HSM_VER_WS_region_intro:0 "§YBetween Herzland and Aquileia§!\nErie and Eyrie dispute an inheritance while Avian tries to preserve its own place between larger powers. Their roads, markets and villages already belong to the same region. Turning that fact into a common state will require an answer to an older question: whose authority will the three Houses recognise?\n\n§YFrom agreement to unification§!\nThe diplomatic campaign establishes guarantees and a charter before a convention can begin integration. Customs, common works, administration and command are §Yjoint focuses§!: a participating House can complete a project for its partners. Works and administration can advance in parallel. Allow time for institutions to take effect; final incorporation still requires each surviving participant's separate consent. The House chairing the convention leads the united state.\n\n§YThe Avian question§!\nAvian has its own choice. §YIntergigantes§! permits negotiated accession. §YTrue neutrality§! closes that route: Erie or Eyrie must then turn to the separate conquest and postwar integration branch, even after peacefully uniting the two duchies. Avian's neutrality does not prevent Erie and Eyrie from uniting first.\n\n§YAfter the union§!\nVerenia still needs schools, public services and a workable government. Peaceful ducal unification can give Rosaline and Montague a shared public future. The separate Herzland campaign concerns Grover's fate and a Verenian regency; a successful adult succession restores an independent allied Empire while Verenia retains its own homeland."
