l_english:
 HSM_VER_UI_NATIVE_AVI_armistice_or_treaty_tt:0 "The Houses share an armistice or treaty, or mediation has not begun."
 HSM_VER_UI_NATIVE_AVI_houses_at_peace_tt:0 "Erie and Eyrie are not at war with each other."
 HSM_VER_UI_NATIVE_AVI_three_recipients_tt:0 "Avian, Erie and Eyrie each receive:"
 HSM_VER_UI_NATIVE_AVI_treaty_or_native_tt:0 "The negotiated peace is valid, or mediation has not begun."
 HSM_VER_UI_NATIVE_AVI_houses_allied_tt:0 "Erie and Eyrie share Avian's faction."
 HSM_VER_UI_NATIVE_AVI_charter_active_tt:0 "All three Houses have ratified the charter; it remains in force."
 HSM_VER_UI_NATIVE_AVI_faction_position_tt:0 "Avian has no faction, leads its faction, or shares Erie's faction."
 HSM_VER_UI_NATIVE_AVI_at_peace_tt:0 "Avian is at peace."
 HSM_VER_UI_NATIVE_AVI_constitution_started_tt:0 "The constitutional union campaign has already begun."
 HSM_VER_UI_NATIVE_AVI_constitution_entry_tt:0 "The constitutional government, Intergigantes route and three-House peace permit integration."
 HSM_VER_UI_NATIVE_AVI_constitution_unchosen_tt:0 "The constitutional union has not been chosen."
 HSM_VER_UI_NATIVE_AVI_winterfest_context_tt:0 "Peaceful integration is available, or both Houses are allied Avian subjects."
 HSM_VER_UI_NATIVE_AVI_armistice_effect_tt:0 "Negotiated route: offers an armistice when eligible; accept, request inspections, or refuse.\nOriginal route: ends the Erie-Eyrie war and sets a 365-day truce."
 HSM_VER_UI_NATIVE_AVI_treaty_effect_tt:0 "Negotiated route: proposes a treaty when eligible; accept, seek arbitration, or refuse.\nOriginal route: ends the rivalry, improves mutual opinion, sets a 60-day truce and removes disputed cores."
 HSM_VER_UI_NATIVE_AVI_tripartite_effect_tt:0 "Forms Intergigantes if Avian has no faction. As faction leader, invites eligible Erie and Eyrie: each may accept (+50 political power for Avian) or refuse (-50)."
 HSM_VER_UI_NATIVE_AVI_integration_effect_tt:0 "Completes Three Seals, One Constitution and starts consensual unification. Preserves signatures; Avian may accept or refuse an existing charter. Adopting the original peace gives Erie and Eyrie +15% infrastructure and railway construction."
 HSM_VER_UI_NATIVE_AVI_winterfest_effect_tt:0 "Starts the Winterfest political crisis and closes constitutional unification. Later battle choices favour loyalists, communists or fascists."
 HSM_VER_UI_NATIVE_AVI_intelligence_effect_tt:0 "All three Houses: +1.5% stability, +15% ideology drift defence, -15% subversive activity cost and -10% operative detection risk.\nWith La Resistance: +1 encryption, +10% decryption power. Otherwise: +10% encryption and decryption."
