 HSM_BAR_archive_index_title:0 "Memorandum found inside the cover"
 HSM_BAR_archive_locked:0 "MISSING LEAF\n\nThe surviving folder contains no attachment for this entry. A number in the old index marks the gap; it supplies neither the missing text nor a reason for its absence.\n\nA keeper's note survives: «Retain the numbered gap. Do not substitute a sheet from another file.»"
 HSM_BAR_archive_inaugural:0 "FOUNDING MEMORANDUM / M. Krzemien\nWe began with a list of wells to clear and families to bring home. Beneath the temple we found work that did not end when its masters died. The Service will keep that work from reaching another village unnoticed.\n\nOlcha keeps the laboratory originals; Wrona signs the field copies. Their disagreements are to be preserved, not reconciled by the clerk. Mask source identities in travelling copies; keep withdrawn leaves in the inventory. Where no answer exists, say so. Missing evidence must not be supplied by conjecture.\n\nProvisional protocol classes: Hearth, stable safeguards; Lunar Circle, conditions requiring observation; Winter Watch, continuous intervention; Starless, no reliable containment. Guardian marks a protective function, not a lower risk. A completed report is not permission to lower a class.\n\nOur first obligation is still the list of wells."
 HSM_BAR_archive_index_empty:0 "No corresponding files found on this shelf. The loose founding memorandum remains."
 HSM_BAR_archive_index_filed:0 "Recovered index / duplicates bear different circulation stamps."
 HSM_BAR_archive_record_note:0 "RECOVERED COPY | Findings belong to the dated inquiry."
 HSM_BAR_archive_status_unknown:0 "Not indexed"
 HSM_BAR_archive_status_intake:0 "Witness material"
 HSM_BAR_archive_status_field:0 "Field record"
 HSM_BAR_archive_status_studied:0 "Signed conclusion"
 HSM_BAR_archive_status_inconclusive:0 "Inquiry closed: unverified"
 HSM_BAR_archive_closure_title:0 "Closure memorandum"
 HSM_BAR_archive_rock_title:0 "BR-001 | Living stone"
 HSM_BAR_archive_rock_intake:0 "RECOVERY COMMISSION / travelling abstract\nMarta Krzemien records a mason's report of surface displacement beneath Asinti's temple. He says the stone yielded to his chisel; the account of what followed is filed under £HSM_BAR_redact_short£. No fragment accompanied his statement. His foreleg and hammer were wrapped in the same cloth.\nThe witness declined to recover his tools. His name, £HSM_BAR_redact_long£, was removed at his own request. The dispatch summary calls this an interruption of excavation. His final question was whether the Republic would require him to finish the work."
 HSM_BAR_archive_rock_field:0 "EXPOSED FACE / copy for the works office\nJadwiga Wrona's team marked the existing cut before applying pressure. Movement was recorded beneath the neighbouring mark; the office abstract describes it as local settling. Loose grains were collected from the old cut. No additional passage was opened.\nThe temple plan bears Olcha's correction at £HSM_BAR_redact_short£. Its original sign is absent from this copy.\n£HSM_BAR_redact_cut£ §gPlan detail withdrawn before duplication.§!\nThe sample envelope belongs with the marked survey. A clean drawing without the marks would place the movement where nobody observed it."
 HSM_BAR_archive_rock_study:0 "LABORATORY SUMMARY / proposed well support\nDetached grains responded to pressure outside the temple; the sealed control remained still. The travelling summary calls this a material handling difficulty. Seweryn Olcha's pressure limit is withheld at £HSM_BAR_redact_short£ pending repetition with a second sample.\nKrzemien's request concerns a support for the damaged village well. Permission remains deferred. Removing stone from the sanctuary has not, by itself, made it suitable for the job.\n£HSM_BAR_redact_cut£ §gComparative reference omitted from the works copy.§!\nThe signature beneath the well-support request is still missing. Against the omitted comparative reference, Olcha left a question mark. Both remain on the laboratory original."
 HSM_BAR_archive_rock_results:0 "[ROOT.GetHSMBAROutcome_rock]"
 HSM_BAR_archive_titan_title:0 "BR-002 | Titan"
 HSM_BAR_archive_titan_intake:0 "EXTRACT FROM AN EXCAVATION LEDGER\nThe entry for the construct begins halfway down a page. Above it: rope, oil, three lamps; supplier £HSM_BAR_redact_short£. Below it: replacement rope. No entry records the laying of a foundation or the casting of a body.\nOlcha's marginal note: Leopold found this machine. He did not build its oldest parts. The folio that named the earlier builder has not been found."
 HSM_BAR_archive_titan_field:0 "TECHNICAL INVENTORY / copy for Wrona\nThe surviving drawings use two systems of measurement. Later alterations are in Leopold's notation; the underlying joints are not. Several pages have been cut away along the binding.\nEvery recovered drawing is marked with its place in the sequence. Photographs of intact and dismantled sections must not be pasted into the same reconstruction.\n£HSM_BAR_redact_cut£ §gAttachment withdrawn from this copy.§!"
 HSM_BAR_archive_titan_study:0 "LOAD TRIALS / S. Olcha\nThe surviving dimensions yield a usable load model. Its first practical test is a lifting frame, with no living material in its moving parts. The frame carries the weight specified in the old ledger.\nKrzemien: a method for lifting a collapsed roof is worth keeping. The instruction on the next page is not.\n£HSM_BAR_redact_cut£ §gLeaf removed by review order.§!\n\nNo attempt to reconstruct the Titan is authorised."
 HSM_BAR_archive_titan_results:0 "[ROOT.GetHSMBAROutcome_titan]"
 HSM_BAR_archive_entity_title:0 "BR-003 | Below the workings"
 HSM_BAR_archive_entity_intake:0 "RECOVERY COMMISSION / interview abstract\nThe witness reported overlapping speech beneath the workings. This copy records difficulty counting the speakers. When asked for a number, she requested a fresh sheet and repeated one word in letters of different sizes. She declined to read it aloud.\nHer identity is £HSM_BAR_redact_long£. The interpreter's rendering is filed separately under £HSM_BAR_redact_short£; no religious name has been accepted as a heading.\nMarta Krzemien: another interview only with the witness's agreement. The extra sheet remains folded inside the statement, with the interpreter's separate enclosure listed beneath it."
 HSM_BAR_archive_entity_field:0 "LISTENING STATIONS / field abstract\nObservers' written logs from separate shafts describe the same response. After the third signal it changed, and Olcha ordered both teams away. The dispatch copy enters this as a scheduled interruption; it retains the order of signals but withholds the last one's wording at £HSM_BAR_redact_long£.\nAn older Pentarchy transcript has a comparable break. The note pressed through its following sheets is omitted here.\n£HSM_BAR_redact_cut£ §gResponse and marginal annotation withdrawn.§!\nWrona kept the two station logs in separate covers. Both end at the order to withdraw. The Pentarchy comparison is clipped between them, with its interrupted line facing the blank end of the later log."
 HSM_BAR_archive_entity_study:0 "CONTACT SUMMARY / limited distribution\nThe response did not follow the fixed delay observed in the ventilation control. Seweryn Olcha distinguishes an answer from returning sound; he cannot distinguish all who answer. The abbreviated ruling calls the result unsuitable for a supply agreement. No power extraction is authorised.\nThe listener's name is £HSM_BAR_redact_short£. A question absent from the travelling transcript remains in the medical copy.\n£HSM_BAR_redact_cut£ §gMedical passage withheld.§!\nKrzemien's note to the medical section: «Keep the omitted question. We need to know what frightened the listener.» The medical enclosure is listed on the cover but absent from this set."
 HSM_BAR_archive_entity_results:0 "[ROOT.GetHSMBAROutcome_entity]"
 HSM_BAR_archive_amulet_title:0 "BR-004 | Janosik's amulet"
 HSM_BAR_archive_amulet_intake:0 "SETTLEMENT LETTER / forwarded to Krzemien\nThey ask that the survey stakes be moved, not the protection. The oldest account names Janosik and an amulet bought before the plants came. The trader's explanation has survived in three different versions.\nAt the bottom, in another script: «You took away the masters. Do not take away the thing that kept us alive.»\nAddress: £HSM_BAR_redact_long£."
 HSM_BAR_archive_amulet_field:0 "BOUNDARY SURVEY / J. Wrona\nThe older observations place the ward's effect along the settlement edge. The accounts agree about the plants turning away; they do not agree about what else the ward could repel.\nNo requisition for the amulet was issued. The survey retained measurements and witness statements.\nOlcha has requested the trader's exact words. The witness who remembers them, £HSM_BAR_redact_long£, will speak only to the doctor."
 HSM_BAR_archive_amulet_study:0 "COMPARATIVE FINDING / M. Krzemien\nThe recorded boundary readings and the settlement accounts support a limited protective effect. They do not support the trader's promise against everything born below Barrad.\nThe proposed barrier trial will use the recorded pattern, not the removal of the settlement's defence.\nSecondary designation: GUARDIAN. Protection of others is part of this object's function, not a reason to treat it as harmless.\nSupplier file: £HSM_BAR_redact_short£."
 HSM_BAR_archive_amulet_results:0 "[ROOT.GetHSMBAROutcome_amulet]"
 HSM_BAR_archive_reactor_title:0 "BR-006 | Reactor"
 HSM_BAR_archive_reactor_intake:0 "ENGINEERING CORRESPONDENCE / recovered cover\nThe surviving instructions name a chamber but refer to the proposed machine only as the installation. The first load table carries a marginal qualification. This abstract files it as a note about prior site conditions; its wording is withheld at £HSM_BAR_redact_long£.\nOlcha is asked to separate the construction history from contact papers bearing another seal, £HSM_BAR_redact_short£. No inspection report accompanies this sheet.\nThe construction entry has no completion certificate attached. Olcha's covering request bears two headings, BUILDING and CONTACT; the reference beneath the second points to the separately sealed papers."
 HSM_BAR_archive_reactor_field:0 "INSTALLATION SURVEY / maintenance copy\nWrona's team found the installation itself. The recovered cooling drawing differs from the clean copy at £HSM_BAR_redact_short£. The abstract calls this a drafting discrepancy. The team marked the omitted route without moving its valves; their positions are withheld at £HSM_BAR_redact_short£.\nA maintenance entry orders the workers out before a recorded load change. It preserves the evacuation interval but supplies no reason. Shift names: £HSM_BAR_redact_long£.\nWrona's valve marks remain on the survey copy. The clean drawing is folded behind it. No restart is entered in the inspection log; the evacuation instruction is copied in full."
 HSM_BAR_archive_reactor_study:0 "REVISED STOP TABLE / circulation extract\nAn earlier operating limit, £HSM_BAR_redact_short£, precedes the recorded containment boundary failure. This summary calls the difference a scheduling allowance. Olcha's revision requires stopping before the boundary alarm; the numerical settings are withheld at £HSM_BAR_redact_long£. Waiting for that alarm is not an acceptable rule.\nKrzemien asks that the old evacuation entry remain beside the revision. Its author's name is £HSM_BAR_redact_short£. The earlier entry preserves a warning which the final design does not adequately express.\nThe stop table is filed with the old evacuation order. On the margin Krzemien has underlined «before». The restart line remains unsigned."
 HSM_BAR_archive_reactor_results:0 "[ROOT.GetHSMBAROutcome_reactor]"
 HSM_BAR_archive_crown_title:0 "BR-007 | Crown of control"
 HSM_BAR_archive_crown_intake:0 "CORRESPONDENCE ABSTRACT / reported cave find\nThe writer describes a crown recovered from a cave, then turns from the discovery to the obedience of subjects. The circulation clerk has headed the last paragraph a question of loyalty. Its exact question is omitted.\nSender: £HSM_BAR_redact_long£. Wrona underlined the change of subject and requested the identities of both finder and current bearer before any approach. Their correspondence address is £HSM_BAR_redact_short£.\nReports naming other caves remain in separate envelopes. On this one, Wrona has left two lines for the finder and the present bearer. Both are empty."
 HSM_BAR_archive_crown_field:0 "FIELD ABSTRACT / retrieval correspondence\nThe accounts describe influence limited by distance and by the number of minds affected. Museum and sealing records have been compared with reports of use. This copy calls the reported behaviour unusually reliable compliance. Wrona's objection to that wording has been removed from the margin.\nThe possession sequence is retained in the retrieval copy; the handover reference here is £HSM_BAR_redact_short£.\n£HSM_BAR_redact_cut£ §gWitness comparison and marginal objection withheld.§!\nThe instance record is fastened to this abstract. Its possession sequence follows the dated museum and sealing entries. The space for an order concerning the bearer is empty."
 HSM_BAR_archive_crown_study:0 "EXPOSURE SUMMARY / isolated specimen\nNo researcher wore the crown. Witness accounts were compared with observations from outside its enclosure. The model retains limits on both distance and the number affected; this copy withholds the working figures at £HSM_BAR_redact_short£.\nA proposed clinical extension was declined. The applicant's name is £HSM_BAR_redact_long£. Krzemien's restriction remains in force even where the application describes obedience as improvement.\nThis specimen's inventory number appears on every leaf, including the rejected application. The applicant's word «improvement» survives beneath Krzemien's refusal. The observation sheets remain with the enclosure record."
 HSM_BAR_archive_crown_results:0 "[ROOT.GetHSMBAROutcome_crown]"
 HSM_BAR_archive_chalice_title:0 "BR-008 | Blood Chalice"
 HSM_BAR_archive_chalice_intake:0 "NORTHERN BRANCH / expedition fragment\nThe damaged account describes a vessel discovered during Rosa Maledicta's expedition. Its author records the route carefully and the return barely at all.\nIrma Kalk requests the missing ending, not another drawing of the cup. The object existed before the expedition; someone had reason to leave it where it was.\nRepository address: £HSM_BAR_redact_long£."
 HSM_BAR_archive_chalice_field:0 "IRMA KALK / authentication note\nThe accounts place the vessel in Rosa's history before the later claims about her condition. A second correspondent calls every vessel connected with her a soul receptacle. His statement has been separated from the expedition record.\nThe original witness's name, £HSM_BAR_redact_long£, is retained only in the branch original. He has asked us not to send the same courier twice."
 HSM_BAR_archive_chalice_study:0 "SEALED-VESSEL EXAMINATION / S. Olcha\nResidues on the recovered vessel have been compared with the surviving ritual record. The comparison can inform detection and sealed transport. It does not require anyone to drink from it.\nKalk returned the request for a living trial without forwarding it to the branch staff.\nHer note: «The expedition already supplied a warning. We do not need to supply a second expedition.»"
 HSM_BAR_archive_chalice_results:0 "[ROOT.GetHSMBAROutcome_chalice]"
 HSM_BAR_archive_phylactery_title:0 "BR-009 | Phylactery"
 HSM_BAR_archive_phylactery_intake:0 "RESTRICTED EXTRACT / northern correspondence\nThe account speaks of a receptacle made for Rosa's altered existence and then hidden. The witness describes the hiding, not the chamber where it was made.\nKalk has ordered the witness's route, £HSM_BAR_redact_long£, removed from ordinary copies. In the margin she asks why the correspondent was willing to name the maker but not the last person who handled the container."
 HSM_BAR_archive_phylactery_field:0 "SEARCH REVIEW / I. Kalk\nThe creation record and the report of concealment agree on the object's purpose. They do not supply an address. Sketches of three possible containers were submitted; only the traceable record has been retained for authentication.\nThe heading «destroy on sight» was struck out by Olcha. His reason is sealed with the ritual appendix, not with the search team."
 HSM_BAR_archive_phylactery_study:0 "ISOLATION LOG / authenticated vessel\nThe recovered vessel was compared with the repository record before isolation measurements began. The experiment did not test destruction. All breakage proposals remain unsigned.\nOlcha's note to Krzemien: a container and the thing it contains need not fail together. I will not certify the order until we know which one we would release.\n£HSM_BAR_redact_cut£ §gLine withdrawn from the branch copy.§!"
 HSM_BAR_archive_phylactery_results:0 "[ROOT.GetHSMBAROutcome_phylactery]"
 HSM_BAR_archive_darkheart_title:0 "BR-010 | Dark Heart"
 HSM_BAR_archive_darkheart_intake:0 "CRYSTAL CORRESPONDENCE / identity protected\nThe informant insists that the replacement was grown. He objects to the word repair and crosses it out in every question put to him.\nA drawing shows the original Heart and the cultivated crystal on different stands. The second stand's location is masked in this copy: £HSM_BAR_redact_long£.\nOlcha requests the growth record before any attempt to interpret the replacement."
 HSM_BAR_archive_darkheart_field:0 "CONSTRUCTION RECORD / analytical extract\nThe umbrum crystal was cultivated into the Dark Heart. The surviving account links its installation with Sombra's return. The original protective Heart is a different object.\nWrona asks that the distinction be written on the transport order itself. A misplaced label would make the removal of protection look like the removal of a threat.\nRelated file: BR-014; further reference: £HSM_BAR_redact_short£."
 HSM_BAR_archive_darkheart_study:0 "INTERFERENCE TRIAL / captured artefact\nComparison with the construction record yields a warning threshold for interference. The experiment is reproducible without growing another crystal.\nKrzemien objects to the phrase «replacement protection» in the draft. It has been deleted; the deletion is initialled.\nOlcha: the instrument tells us when the boundary is disturbed. It does not tell us that everything on the far side is trying to enter."
 HSM_BAR_archive_darkheart_results:0 "[ROOT.GetHSMBAROutcome_darkheart]"
 HSM_BAR_archive_grover_title:0 "BR-011 | Grover II"
 HSM_BAR_archive_grover_intake:0 "YALE FILE / historical identification\nThe imperial burial entry names Grover II. A later laboratory reference uses the same name beside a sequence of restoration experiments. Between the two lies a gap that the surviving catalogue cannot explain.\nOlcha requests copies of the original dates, including corrections at catalogue reference £HSM_BAR_redact_short£. The crown drawn in the margin is not an identifying mark.\nYale source: £HSM_BAR_redact_long£."
 HSM_BAR_archive_grover_field:0 "DOCUMENT COMPARISON / J. Wrona\nThe experiment record proceeds from an animal trial towards the imperial remains. Reports of the emperor must be dated against that sequence, not merely against the old burial entry.\nNo order to seize a person has been issued. Any transfer of material requires a separate inventory and positive identification.\nWrona's private note: a name can outlive its owner. That is exactly why it is not enough."
 HSM_BAR_archive_grover_study:0 "FORENSIC MEMORANDUM / M. Krzemien\nThe chronology distinguishes death, treatment of remains and claims of return. Disputed dates are retained beside their sources. No examination of a body is claimed by this memorandum.\nThe comparison method can expose a substituted record; it cannot decide which memories belong to the historical emperor.\nOlcha's written answer to that last question is held under a separate seal."
 HSM_BAR_archive_grover_results:0 "[ROOT.GetHSMBAROutcome_grover]"
 HSM_BAR_archive_rosa_title:0 "BR-012 | Rosa Maledicta"
 HSM_BAR_archive_rosa_intake:0 "IRMA KALK / report on northern testimony\nCorrespondents agree on the name and disagree on almost everything that follows it. One describes a ceremony; another repeats a proclamation he never heard himself.\nTheir accounts are retained separately. Kalk has refused the demand for a single finished biography.\nHer covering note: «A neat history would be easier to circulate. It would also be easier for her followers to write for us.»"
 HSM_BAR_archive_rosa_field:0 "PROVENANCE REVIEW / branch copy\nEach reported transformation has been placed beside the ritual record that supports it. The testimony is not interchangeable. References to a phylactery have their own attachment, where corroborated.\nA report of defeat gives no destination for remains. The request for a specimen is returned unfulfilled.\nThe last correspondent stopped using his agreed signature. His subsequent letters are sealed pending verification."
 HSM_BAR_archive_rosa_study:0 "RITUAL COMPARISON / M. Krzemien and S. Olcha\nThe useful finding is a method of tracing a ritual claim back through its copies. Several confident statements turn out to repeat the same damaged sentence.\nKalk asks that the discarded claims remain in an appendix: someone may be circulating them deliberately.\nNo autopsy accompanies this report. The blank specimen entry must remain blank.\n£HSM_BAR_redact_cut£ §gSource list withdrawn. Director's copy only.§!"
 HSM_BAR_archive_rosa_results:0 "[ROOT.GetHSMBAROutcome_rosa]"
 HSM_BAR_archive_herald_title:0 "BR-013 | Herald of Boreas"
 HSM_BAR_archive_herald_intake:0 "YALE CORRESPONDENCE / sealed witness\nThe witness describes a voice, a light and a figure no longer resting on the floor. Asked what happened first, he speaks instead of what the figure called itself.\nWrona has requested a second account from outside the room. Olcha asks about the fluid mentioned in an earlier experimental entry.\nThe witness's answer occupies an attachment marked «NOT FOR RELIGIOUS CIRCULATION»."
 HSM_BAR_archive_herald_field:0 "EXPERIMENTAL CHRONOLOGY / S. Olcha\nThe laboratory record of the fluid precedes the report of traces on the subject's beak. The manifestations follow. That sequence is preserved; the title claimed by the subject is not entered as an experimental result.\nWrona: the guards remembered the voice better than the container. Find the keeper of the container's record.\nContact: £HSM_BAR_redact_long£. Vault reference: £HSM_BAR_redact_short£."
 HSM_BAR_archive_herald_study:0 "OPTICAL REVIEW / instrument section\nThe accounts and vault chronology have been compared. The report separates the recorded manifestations from the identity attributed to their source. Instrument shielding can be improved without reproducing the exposure.\nKrzemien will not sign a request to repeat the incident on a volunteer.\n£HSM_BAR_redact_cut£ §gProposed procedure removed from the circulating copy.§!\nAttached movement reports establish no accessible remains. Olcha's final paragraph concerns the missing interval, not a body; circulation restricted."
 HSM_BAR_archive_herald_results:0 "[ROOT.GetHSMBAROutcome_herald]"
 HSM_BAR_archive_sombra_title:0 "BR-014 | Sombra"
 HSM_BAR_archive_sombra_intake:0 "CRYSTAL FILE / witness extract\nThe old account and the new message use the same name. The new writer describes a change in orders, not a legend. His final request is for instructions that can be followed without attracting attention.\nDistrict: £HSM_BAR_redact_long£. The complete address is sealed with the authentication material.\nWrona: send no demand for a meeting until we know who is reading his replies."
 HSM_BAR_archive_sombra_field:0 "RETURN CHRONOLOGY / link to BR-010\nThe crystal records connect restoration of a material body with the Dark Heart. The sequence concerns Sombra's return, not the invention of a new person.\nReports about others beneath the ice are enclosed separately. Their sources have not all been reached.\nA proposed search for remains has no verified location attached. Kalk has written across it: «A defeat is not an address.»"
 HSM_BAR_archive_sombra_study:0 "DEFENSIVE ASSESSMENT / M. Krzemien\nThe verified chronology and the witness statements have been separated from interrogation summaries. Recommendations address exposure and the protection of civilians. The liaison copy contains those measures; source identities remain sealed.\nOlcha has retained a separate question: what protection was displaced to permit the return?\nNo instruction to remove the original Crystal Heart is authorised. Further comparison with file £HSM_BAR_redact_short£ requires the director's signature."
 HSM_BAR_archive_sombra_results:0 "[ROOT.GetHSMBAROutcome_sombra]"
 HSM_BAR_archive_echo_title:0 "BR-015 | The second voice"
 HSM_BAR_archive_echo_intake:0 "REPAIR CREW / absence explanation\nThe foreman reported a voice from the deserted ventilation shaft. A younger worker heard his own words returned and refused another shift. Their statements agree on the delay and disagree about the words. The circulation summary calls this a communication difficulty.\nNames: £HSM_BAR_redact_short£; £HSM_BAR_redact_long£. Wrona requested the ventilation plan. It ends at a wall the workers describe as hollow.\nKrzemien kept the absence report with the testimony. Wrona's request for the plan is still attached. Entry beyond the marked landing remains prohibited until the shaft has been checked."
 HSM_BAR_archive_echo_field:0 "ACOUSTIC CHECK / repair copy\nA whistle replaced the spoken question; the sound returned after the same interval. At the side passage it reached the observer from behind. A chamber missing from the old plan accounted for the change in direction. Wrona marked the corrected route at £HSM_BAR_redact_short£.\nThis copy retains the measurements and omits the foreman's employment inquiry.\n£HSM_BAR_redact_cut£ §gPersonal exchange removed from the works attachment.§!\nThe foreman listened to the whistle test without speaking. His question afterwards is marked PERSONAL in the margin. The repair copy carries the corrected route and the excision mark."
 HSM_BAR_archive_echo_study:0 "CLOSURE NOTICE / ventilation repairs\nAn ordinary acoustic path through the unmarked chamber accounts for the returning sound. No independent voice was recorded. The corrected drawing went to the repair crew; witness statements remain sealed under £HSM_BAR_redact_short£.\nThe original names, £HSM_BAR_redact_long£, are absent from this notice. Olcha requested the control procedure for the comparison file. Its destination was omitted from this notice.\nKrzemien retained the shaft rail in the repair instructions. The warning about voices can be removed. The opening remains a fall hazard, even when there is nobody at its bottom calling back."
 HSM_BAR_archive_echo_results:0 "[ROOT.GetHSMBAROutcome_echo]"
 HSM_BAR_archive_marsh_title:0 "BR-016 | Marsh lights"
 HSM_BAR_archive_marsh_intake:0 "RIVERLAND CORRESPONDENCE / shortened account\nA traveller followed a light off the road and lost his pack in wet ground. The first statement mentions only light. By morning he described a figure carrying a lamp. This copy files the change as a fuller recollection; Wrona requested the earliest account with every correction preserved.\nThe correspondent offers water and sediment from the place. Sender's village: £HSM_BAR_redact_long£. The collection directions are £HSM_BAR_redact_short£.\nNo samples accompany this letter. The offer of water and sediment is still folded around the two accounts. The earliest sheet records the lost pack; the figure with the lamp appears on the later one."
 HSM_BAR_archive_marsh_field:0 "PURCHASED MATERIAL / receipt abstract\nWater and sediment arrived in separately marked jars and were matched to the correspondent's weather notes. Collection reference: £HSM_BAR_redact_short£. The carrier requested that one jar remain closed while he was present. His stated concern is £HSM_BAR_redact_long£; this copy records a handling preference.\nNo figure was found in either jar.\n£HSM_BAR_redact_cut£ §gCarrier's personal statement omitted from the receipt.§!\nKrzemien kept the weather notes with the jar labels. The supplier's receipt is stamped PAID; the delivery note bears the same sample references. The traveller's two statements are filed behind the purchased material."
 HSM_BAR_archive_marsh_study:0 "SETTLEMENT CIRCULAR / water precautions\nThe samples reproduced the reported light through an ordinary chemical reaction under the recorded conditions. Changing those conditions stopped it. No migrating agent was detected. The experimental particulars are withheld at £HSM_BAR_redact_long£; the circular carries storage and clean water recommendations.\nKrzemien's correction to the draft heading is £HSM_BAR_redact_short£. The traveller's name, £HSM_BAR_redact_short£, is unnecessary to those instructions.\nThe circular ends with storage and clean-water instructions. The lost pack remains in the witness account. Krzemien's correction is on the covering draft, beside the recommendation for the settlements."
 HSM_BAR_archive_marsh_results:0 "[ROOT.GetHSMBAROutcome_marsh]"
 HSM_BAR_archive_compass_title:0 "BR-017 | The false north"
 HSM_BAR_archive_compass_intake:0 "PURCHASE OFFER / merchant's name £HSM_BAR_redact_long£\nThe compass is said to point towards a buried sanctuary. The seller drew the route twice; both drawings end at his own packing shed.\nWrona has asked for the instrument and its case together. Olcha wants a control instrument that the seller has never handled.\nClaimed builder: «UNKNOWN». The quoted inscription is absent from the enclosed sketch."
 HSM_BAR_archive_compass_field:0 "ROUTE TRIAL / survey section\nThe instruments were exchanged without telling the carrier. Comparison route: £HSM_BAR_redact_short£. The deviation followed the packing case, not the bearer or the direction of travel. When the case was left behind, the alleged route disappeared.\nThe seller asked to demonstrate once more with his original straps. Permission refused.\nWrona retained a fastener from the lining in a separate envelope."
 HSM_BAR_archive_compass_study:0 "CLOSURE / magnetised fastener\nThe fastener accounts for the deviation. Repeated blind comparisons show no further effect. The control procedure is approved for the survey crews; the sanctuary claim is unsupported.\nOlcha: retain the case beside the instrument. If we display only the needle, the next investigator will inherit the same mystery.\nThe merchant's explanation of the inscription is filed under «UNVERIFIED», not under ancient languages."
 HSM_BAR_archive_compass_results:0 "[ROOT.GetHSMBAROutcome_compass]"
 HSM_BAR_archive_plants_title:0 "BR-005 | The field margin"
 HSM_BAR_archive_plants_intake:0 "VILLAGE INFIRMARY / M. Krzemien\nThree patients brought different leaves and called them by the same name. Two had touched the plants; the third had burned a bundle gathered by someone else.\nThe doctor retained each account with its own sample. The map is marked by where the injuries occurred, not by the villagers' names for the growth.\nOne older note refers to protection at the settlement boundary. Cross-reference BR-004."
 HSM_BAR_archive_plants_field:0 "HERBARIUM ENTRY / samples kept apart\nOrdinary irritants were separated from specimens whose responses remain unexplained. Burned material has its own container. Wrona halted clearing work where the survey marks no longer matched the workers' route.\nOlcha requested the missing page of the Pentarchy's growing schedule. Its surviving heading is «AFTER THE THIRD CHANGE».\n£HSM_BAR_redact_cut£ §gInstruction cut from the original leaf.§!"
 HSM_BAR_archive_plants_study:0 "HANDLING PROTOCOL / M. Krzemien\nThe herbarium now supports separate procedures for contact, smoke and transport. A name shared by several plants is not a diagnosis. Unexplained specimens remain isolated from the cleared collection.\nThe first instructions sent to the villages concern gloves, washing and what not to burn. No order to destroy the surrounding forest accompanies them.\nWrona asks that a copy be kept at the well, where the workers actually read."
 HSM_BAR_archive_plants_results:0 "[ROOT.GetHSMBAROutcome_plants]"
 HSM_BAR_archive_zebrica_title:0 "BR-018 | The absent relic"
 HSM_BAR_archive_zebrica_intake:0 "SOUTHERN CORRESPONDENCE / three offers\nThree intermediaries offered a relic said to cross sealed walls. Each named a different owner. All three repeated an unusual error in the description of the clasp.\nWrona requested a witness who had seen the contents rather than the package. The replies supplied new prices and no witness.\nThe alleged place of origin is held under «UNVERIFIED»."
 HSM_BAR_archive_zebrica_closure:0 "CLOSURE NOTE / J. Wrona\nThe offers lead back to the same copied description. The last intermediary withdrew when asked to present the object outside its wrapping. No authenticated specimen was delivered.\nNo one can establish whether the missing original described a relic or an ordinary container. Further payments are stopped.\nKalk: retain the repeated error. If the description returns under another name, that may be the only thing by which we recognise it."
