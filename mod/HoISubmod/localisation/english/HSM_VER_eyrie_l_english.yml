l_english:
 HSM_EYR_the_price_of_vigilance:0 "The Price of Vigilance"
 HSM_EYR_the_price_of_vigilance_desc:0 "Iovinus Eyrie has made readiness a condition of survival. Yet the same emergency orders are renewed, the same villages supply the men, and the same returns promise soldiers an inspection cannot always find. Before choosing accommodation with Erie or a campaign to break its claim, the duke must discover what his vigilance has cost the country, and what his army can actually deliver."
 HSM_EYR_audit_the_muster:0 "The Men Behind the Numbers"
 HSM_EYR_audit_the_muster_desc:0 "A name on a muster roll may represent a soldier, a discharged veteran or an absence nobody has dared to explain. Iovinus must decide who will ask the questions. Local representatives will want to account for the men their villages sent; an army commission will insist that the inquiry remains a matter of service. Either must begin by counting those who are actually there."
 HSM_EYR_montagues_correspondence:0 "Montague's Crossing"
 HSM_EYR_montagues_correspondence_desc:0 "Montague Eyrie, Earl of Verenia, wants to visit Rosaline Erie of Bantry. His officers see a route through hostile positions; he sees the journey to someone whose company he has missed. Iovinus can secure his passage without dictating its purpose. Let the two speak for themselves. A family connection may open the way to an agreement, but it must not become a marriage imposed to spare the dukes an awkward conversation."
 HSM_EYR_reciprocal_frontier:0 "Stand Down the Raiding Parties"
 HSM_EYR_reciprocal_frontier_desc:0 "The muster has been examined, Montague has opened a personal way across the divide, and the safeguards are ready. Iovinus can now order his officers to put away the excuses by which every raid becomes a precaution. The same restraint will bind Erie. This armistice is the foundation of a permanent settlement, not a year's holiday from the feud."
 HSM_EYR_inspect_both_sides:0 "Roads Between the Houses"
 HSM_EYR_inspect_both_sides_desc:0 "The engineers have spent years marking bridges for demolition. Now they must discover which can carry ordinary traffic again. Survey the approaches, compare the available materials and make the frontier routes usable without an army preparing their passage. The same practical knowledge will serve our own roads and the settlement we are building with Erie."
 HSM_EYR_publish_the_rules:0 "Safeguards That Bind Us Too"
 HSM_EYR_publish_the_rules_desc:0 "The muster tells Iovinus what his army can do. Montague's journey reminds him that not every crossing must be an operation. Before concluding an armistice, he must decide what will make its promises credible: mixed patrols empowered to question both commands, or a restitution fund that acknowledges damage and hears property claims. Either course asks the duke to restrain his own supporters. Only then can he ask the same of Vincent."
 HSM_EYR_friendship_with_safeguards:0 "Friendship with Safeguards"
 HSM_EYR_friendship_with_safeguards_desc:0 "An open crossing has made the frontier's old habits harder to defend. The treaty will end the official rivalry and relinquish the territorial demands that let either House call its neighbour's independence a provocation. Iovinus retains his army and his government. He gains a peace that no longer needs the prospect of victory to justify itself."
 HSM_EYR_limits_of_command:0 "Where Command Ends"
 HSM_EYR_limits_of_command_desc:0 "A reliable army needs a clear account of what it may demand from the country it protects. Local councils want a voice when a requisition takes away their last wagon. The officers answer that a command cannot negotiate every order with a village meeting. Iovinus must establish who will hear an objection, and whose duty it will be to make the army respect the answer."
 HSM_EYR_a_seat_for_avian:0 "An Intergigantes Association"
 HSM_EYR_a_seat_for_avian_desc:0 "Intergigantes has brought Avian out of isolation. Iovinus can now offer more than an observer's chair: a negotiated place in a united Verenia. Begin with the courts, colleges and municipal charters. A separate accession act will decide who governs the common country, and Katrina must be able to read it before she signs."
 HSM_EYR_a_charter_we_can_sign:0 "A Charter We Can Sign"
 HSM_EYR_a_charter_we_can_sign_desc:0 "Offer Erie an equal council with defined responsibilities, common courts and room for practical cooperation. Vincent may accept this constitution, ask to preside within strictly limited powers, or refuse. His chairmanship would require our explicit consent and convey no sovereignty over Eyrie. Iovinus must decide which shared powers he can honour after the congress has dispersed."
 HSM_EYR_officers_at_one_table:0 "Officers at One Table"
 HSM_EYR_officers_at_one_table_desc:0 "The shared staff will have to turn familiar suspicions into questions that can be answered on a map. Supply officers will compare their plans while signallers practise carrying a report across the old divide. Iovinus expects each officer to know what he can promise, and when he must ask the government whose troops he serves."
 HSM_EYR_shared_workshops:0 "Specifications Worth Sharing"
 HSM_EYR_shared_workshops_desc:0 "The same replacement part should not require a different drawing on each side of the frontier. Put the charter's technical services to work comparing specifications and production methods. Shared services will help the participating workshops, while Eyrie's engineers gain an opportunity to develop their industrial knowledge. Useful cooperation can begin with a part that fits."
 HSM_EYR_the_return_order:0 "An Order to Give Back"
 HSM_EYR_the_return_order_desc:0 "The civilian workshops requisitioned for the frontier army have received their release orders. The command has refused to hand them over. Its officers invoke readiness, but the authority that allowed the requisitions also set their limits. Iovinus must enforce those limits against his own military establishment or protect it at the expense of the charter's credibility."
 HSM_EYR_a_defence_agreement:0 "Defence by Agreement"
 HSM_EYR_a_defence_agreement_desc:0 "The staff can draw a common plan, but it cannot promise another government's soldiers. Iovinus will put a defensive league before Erie, with duties clear enough to survive the first alarm at the frontier. Existing alliances must be respected, and Katrina will have to answer for Avian in her own name. The officers may prepare the maps while the governments consider the signatures."
 HSM_EYR_workshops_returned:0 "The Workshops Return to Work"
 HSM_EYR_workshops_returned_desc:0 "Returning a key is only the beginning. Civilian production needs usable premises, replacement equipment and workers who can plan beyond the next requisition notice. The works office will inspect what the army has returned and hear the owners' estimates. A workshop promised back must become a place where someone can earn a living again."
 HSM_EYR_a_border_without_orders:0 "A Border Without Emergency Orders"
 HSM_EYR_a_border_without_orders_desc:0 "The army will still guard the country. Its task can become clearer now that every consignment, workshop and journey need not remain at its disposal. A dependable settlement gives Iovinus partners whose consent matters and soldiers whose authority has an agreed boundary. The frontier should be secure enough to let ordinary business proceed without asking headquarters for permission."
 HSM_EYR_neighbours_without_a_council:0 "Eyrie's Own Work"
 HSM_EYR_neighbours_without_a_council_desc:0 "The shared settlement has failed. The refusal may have come before a ceasefire, before a treaty, or at the final congress; the government across the line may no longer be able to keep its word. None of that repairs a road in Eyrie. We will honour whatever agreements remain valid, without claiming ones that never existed, and turn the work of recovery towards our own country. Iovinus promised to seek security without conquest. A disappointing answer does not release him from that choice."

 HSM_EYR_accountable_muster:0 "An Accountable Muster"
 HSM_EYR_accountable_muster_desc:0 "The rolls are open to scrutiny beyond the barracks. Local records and service returns must agree, and missing entries require an answer. Reliable figures accelerate mobilisation and strengthen stability, while maintaining that accountability consumes a continuing share of the government's political effort."
 HSM_EYR_officers_confidence:0 "The Officers' Confidence"
 HSM_EYR_officers_confidence_desc:0 "An army commission has taken responsibility for correcting the muster. Professional review improves training and organisation, strengthening the officers' confidence in their service. Keeping the inquiry within the army unsettles those whose objections remain outside the barracks gates, weakening public stability."
 HSM_EYR_civic_scrutiny:0 "Civilian Scrutiny of Defence"
 HSM_EYR_civic_scrutiny_desc:0 "Local representatives have a recognised place in reviewing the demands of defence. Better justified deliveries reduce supply consumption, while confidence in the procedure strengthens stability. Regular scrutiny requires political effort every day, including those when the frontier gives no immediate cause for alarm."
 HSM_EYR_professional_command:0 "A Command with Defined Responsibilities"
 HSM_EYR_professional_command_desc:0 "The professional command is responsible for maintaining readiness within acknowledged limits. Clear responsibilities accelerate planning and improve army organisation. Officers must arrange their procedures accordingly, accepting that military competence includes knowing when an emergency power has expired."
 HSM_EYR_exceptional_requisitions:0 "Requisitions Without Release"
 HSM_EYR_exceptional_requisitions_desc:0 "The duke has protected the command's refusal to return civilian workshops. Retaining their capacity increases military factory output, but undermines stability and increases the burden of civilian goods. All shared charter benefits are suspended. Withdrawing this order resolves Eyrie's breach; any separate Erie exception must also be settled before common benefits can return."

 HSM_EYR_diplomatic_business:0 "The Work of the Settlement"
 HSM_EYR_diplomatic_business_desc:0 "The frontier settlement has obligations beyond its signatures. Civilian workshops must be returned, shared rules must bind the command and military cooperation needs willing partners. Our government must finish the work it accepted. A conference that failed does not require another procession of unanswered invitations."
 HSM_EYR_reopen_armistice:0 "Reciprocal Frontier Terms"
 HSM_EYR_reopen_armistice_desc:0 "Restraint must bind both armies. The terms concern what each patrol may do and how a complaint will be heard, not how often a messenger can be sent across the line."
 HSM_EYR_reopen_treaty:0 "The Property Behind the Claims"
 HSM_EYR_reopen_treaty_desc:0 "A permanent settlement must distinguish a family's right to compensation from a ruler's claim to another country. Agreed safeguards give that distinction practical meaning."
 HSM_EYR_reopen_charter:0 "The Powers We Can Share"
 HSM_EYR_reopen_charter_desc:0 "A common council requires powers that both Houses are willing to grant. Where that agreement is impossible, separate governments can still honour whatever peace they have actually concluded."
 HSM_EYR_invite_avian_again:0 "An Independent Voice from Avian"
 HSM_EYR_invite_avian_again_desc:0 "Avian's observer must be free to speak and free to remain outside the charter. Neither attendance nor an empty chair can replace the consent of Erie and Eyrie to their own settlement."
 HSM_EYR_withdraw_requisitions:0 "Rescind the Exceptional Requisitions"
 HSM_EYR_withdraw_requisitions_desc:0 "The workshop owners have brought back the release orders the command refused to honour. Iovinus will have the keys returned and require his officers to account for the machinery they kept. Their readiness reports cannot erase the promises bearing his own seal. Eyrie must answer for this breach before it can ask another House to keep its word."
 HSM_EYR_propose_defence:0 "Return to the Defence Agreement"
 HSM_EYR_propose_defence_desc:0 "The officers have kept the common plans even though the governments have not agreed to a league. Iovinus will ask Erie which obligations it is now prepared to undertake. Agreements already made with other allies belong on the table, and Avian's place will require a letter addressed to Katrina rather than a chair reserved without her answer."

 HSM_EYR_inspection_bonus:0 "Frontier Engineering Surveys"
 HSM_EYR_support_bonus:0 "Published Frontier Procedures"
 HSM_EYR_signals_bonus:0 "Communications Between the Staffs"
 HSM_EYR_industry_bonus:0 "Compatible Workshop Standards"
 HSM_EYR_reconstruction_bonus:0 "Civilian Reconstruction Methods"
 HSM_EYR_armistice_offer_tt:0 "Proposes an armistice to Erie. Erie may sign, request joint inspections or refuse. A diplomatic settlement remains in force until war or a friendship treaty; the temporary arrangement outside that settlement lasts 365 days."
 HSM_EYR_treaty_offer_tt:0 "Proposes friendship to Erie. Erie may sign, request property arbitration or refuse. Ratification ends the rivalry, inspections and mutual territorial claims; both Houses remain independent."
 HSM_EYR_charter_offer_tt:0 "Proposes an equal council to Erie. Erie may accept, seek a limited presidency or refuse. Eyrie must agree to any counterproposal; Avian decides on membership separately."
 HSM_EYR_defence_offer_tt:0 "Requests Erie's consent to a military agreement. Existing House-led alliances retain their leadership; a new league follows Eyrie's initiative. Avian must consent separately."
 HSM_EYR_requisition_case_tt:0 "Iovinus must answer the command's refusal to return civilian workshops. Enforcing the return costs political power. Protecting the refusal §Rsuspends all charter benefits§! until Eyrie's requisition exception and any separate Erie exception have both been resolved."
 HSM_EYR_no_unresolved_exception_tt:0 "Neither Eyrie's exceptional requisitions nor Erie's royal exception remains unresolved."

 hsm_ver_eyrie.1.t:0 "Ready for What?"
 hsm_ver_eyrie.1.d:0 "The morning return declared the frontier ready. Iovinus asked how many men that meant. The adjutant gave him a number, then a second number when asked how many could assemble before nightfall. A quartermaster explained that the difference included men on detached duty, men awaiting equipment and entries still being corrected.\n\nOutside the office, a carrier waited for the army to release a cart borrowed under an emergency order. The order had been renewed so often that the clerk had stopped writing a new reason in the margin.\n\nIovinus had no intention of leaving his country defenceless. His claim to Verenia was no less valid than Vincent's, and he knew what weakness could invite. But a commander needed to know what his figures meant. He ordered the original rolls brought in, together with the outstanding requisitions. Before demanding another assurance of readiness, he would inspect the assurances already on his desk."
 hsm_ver_eyrie.1.a:0 "Bring the records that support these numbers."
 hsm_ver_eyrie.2.t:0 "The Empty Place in the Rank"
 hsm_ver_eyrie.2.d:0 "At the inspection, the sergeant called a name and received no answer. The company clerk found it in last month's return, then in the month before. A village record described the same soldier as discharged. Elsewhere, men actually serving had disappeared between two sets of accounts.\n\nThe officers wanted an army commission. Its members would understand transfers, detachments and the difference between a dishonest return and a late one. Their inquiry could improve professional practice without submitting every military explanation to an audience.\n\nThe civilian clerk asked how a village could correct a levy if it was never allowed to see the roll. A public review would require political effort and oblige the service to answer inconvenient questions beyond its own chain of command. Iovinus looked again at the empty place in the rank. Someone would have to account for it; he had to decide before whom."
 hsm_ver_eyrie.2.a:0 "Open the rolls to public review."
 hsm_ver_eyrie.2.b:0 "Commission the army to audit its own returns."
 hsm_ver_eyrie.3.t:0 "No Instructions for the Reply"
 hsm_ver_eyrie.3.d:0 "Montague Eyrie, Earl of Verenia, found the security officer considering whether a personal letter required a second seal. Rosaline Erie of Bantry had asked about a visit, and the proposed route crossed places that headquarters still described chiefly in terms of approaches and fields of fire.\n\nIovinus suggested that an exchange between two highborn scions might be useful. Montague answered carefully: their interest in one another was already their own. A correspondence written to satisfy two courts would soon cease to be a correspondence worth having.\n\nThe duke understood the objection better than he welcomed it. He wanted an opening he could rely on, yet turning a letter into an instrument of policy would give its author every reason to withhold it. He authorised its passage without instructions for the reply. The officers could secure the journey. They were not being asked to decide what the travellers should mean to each other."
 hsm_ver_eyrie.3.a:0 "Secure the passage. Leave the words to them."
 hsm_ver_eyrie.4.t:0 "A Bridge Meant to Stand"
 hsm_ver_eyrie.4.d:0 "The old survey marked the bridge's weak points in red. The new one used the same marks to calculate where timber and stone were needed. The officer who had once prepared its demolition watched the engineer lay a ruler across the drawing.\n\nA carrier asked when the far approach would be passable. The quartermaster began explaining its military importance, then stopped. The question was about a loaded cart, not an advancing regiment. They counted the available beams and sent a crew to inspect the culvert.\n\nThe armistice had made the journey possible. Making it ordinary would take work. For the first time in years, Eyrie's engineers were being asked how long a frontier bridge could last, rather than how quickly they could bring it down."
 hsm_ver_eyrie.4.a:0 "Give the builders the survey."
 hsm_ver_eyrie.10.t:0 "Who May Say the Emergency Is Over?"
 hsm_ver_eyrie.10.d:0 "The council's draft contained a difficulty that no frontier map could resolve. The army was authorised to prepare for danger. Who, then, could tell it that a particular demand no longer served that purpose?\n\nA civilian representative brought a workshop's schedule, repeatedly interrupted by requisitions. The command's delegate brought a supply plan whose dates depended on those same machines. Both documents described necessary work. Leaving the army to take precedence by habit would settle every dispute before the other party had spoken.\n\nIovinus could establish civic scrutiny of defence, giving local representatives a continuing voice and accepting the political effort of answering them. Or he could entrust defined responsibilities to a professional command, making its officers accountable for maintaining readiness within agreed limits. Neither arrangement abolished the need to defend the frontier. The question was whether the country would help examine military demands, or rely on the service to discipline its own."
 hsm_ver_eyrie.10.a:0 "Give civilian scrutiny a recognised place."
 hsm_ver_eyrie.10.b:0 "Bind professional command to defined responsibilities."

 hsm_ver_eyrie.30.t:0 "The Keys Remain at Headquarters"
 hsm_ver_eyrie.30.d:0 "The workshop manager arrived with a release order and returned without the keys. The command had marked the building as indispensable to readiness. Its machines were still turning out military fittings, and the officers argued that replacing this capacity would take time the frontier might not grant them.\n\nNobody disputed the army's use for the workshop. The release order concerned its right to keep it indefinitely. Civilian contracts waited, wages depended on restarting them, and the charter's limits were meant to apply even when compliance inconvenienced the service.\n\nIovinus heard the officers in person. They had spent years treating precaution as a sufficient answer, and expected him to recognise that instinct as loyalty. He could enforce the return and spend political capital making his command accept a boundary. Or he could protect the exceptional requisition, suspending the common institutions whose promises his officers would thereby be refusing to honour."
 hsm_ver_eyrie.30.a:0 "Enforce the return order, despite the political cost."
 hsm_ver_eyrie.30.b:0 "Protect the command's exceptional requisitions."
 hsm_ver_eyrie.32.t:0 "A Receipt for the Keys"
 hsm_ver_eyrie.32.d:0 "The revised order gave headquarters a duty rather than another extension. The exceptional requisition was withdrawn. The workshop was to be released, its equipment accounted for and the handover acknowledged by the civilian manager as well as the officer responsible.\n\nIovinus read the final sentence twice. He had once considered a subordinate's report sufficient proof that an instruction had been carried out. This time the person receiving the building would also have to say what had actually been returned.\n\nThe correction settled Eyrie's breach. It could not excuse any independent exception still maintained by Erie; the common offices still needed undertakings they could trust from both Houses. The army would retain its proper work and find another way to organise the supplies it needed. When the keys reached the workshop, the manager counted them against the receipt. The command's authority had ended at a door it had finally agreed to open."
 hsm_ver_eyrie.32.a:0 "File the civilian receipt with the command's report."
 hsm_ver_eyrie.40.t:0 "The Gate Opens on Time"
 hsm_ver_eyrie.40.d:0 "The gate opened at the hour written on the board. A sentry checked the carrier's papers while an army wagon waited its turn behind him. There was still a guard, still a duty officer and still a procedure for reporting trouble. Ordinary traffic no longer had to invent a military justification for existing.\n\nIovinus received the morning return without the old assurance that every precaution was indispensable. The figures could be questioned. The limits applied to both commands. A workshop released from military use remained a workshop even when headquarters regretted losing its machines.\n\nAcross the frontier, Vincent governed Erie, an independent partner whose assent mattered as much as Eyrie's. The shared institutions gave their disagreements somewhere to go before an order reached the barracks. Iovinus still governed Eyrie and commanded its army. He had accepted that strength included an order obeyed when it told the powerful to stop."
 hsm_ver_eyrie.40.a:0 "Keep the frontier secure, and its ordinary life possible."
 hsm_ver_eyrie.41.t:0 "The Work Within Our Borders"
 hsm_ver_eyrie.41.d:0 "The conference papers did not contain the common settlement Iovinus had wanted. Nor could they promise that the government beyond the line would remain the one his envoys had met. The duke put them aside when the foreman arrived.\n\nThe foreman needed a decision on a school and the road serving its district. Neither required a common council. The labour was available; the methods developed during the talks could be put to use. What was missing was permission to begin.\n\nIovinus gave it. Existing agreements would be respected while they remained valid. No officer would receive a new campaign merely because the congress had failed. Eyrie's safety still required an army. Its future required work that the army could not do for it."
 hsm_ver_eyrie.41.a:0 "Authorise the work."

 hsm_ver_eyrie.110.t:0 "Eyrie Offers Reciprocal Restraint"
 hsm_ver_eyrie.110.d:0 "Iovinus proposes an armistice with matching orders for both frontier commands. Vincent asks his officers which assurances they could verify, rather than which phrases they find reassuring. The agreement would provide room for a permanent settlement. We may accept, insist on joint inspections or refuse. Eyrie's commitment does not replace our own decision to bind Erie's patrols."
 hsm_ver_eyrie.110.a:0 "Accept and issue the matching orders."
 hsm_ver_eyrie.110.b:0 "Require joint inspections before we sign."
 hsm_ver_eyrie.110.c:0 "These terms do not yet protect our interests."
 hsm_ver_eyrie.111.t:0 "Vincent Requests Inspection Rights"
 hsm_ver_eyrie.111.d:0 "Vincent requires inspectors from both Houses to examine alleged breaches together. Eyrie's officers object to representatives from across the line questioning their reports. Their own representatives would have precisely the same right. Accepting the condition requires political effort at home and concludes the armistice. Both courts must sustain the inspections while that ceasefire lasts, until a permanent treaty replaces it or the ceasefire breaks down. Refusal leaves the proposal unsigned."
 hsm_ver_eyrie.111.a:0 "Accept reciprocal inspections and sign."
 hsm_ver_eyrie.111.b:0 "We cannot accept the inspection condition."
 hsm_ver_eyrie.112.t:0 "Matching Instructions"
 hsm_ver_eyrie.112.d:0 "Erie's acceptance has reached the chancery. Copies of the armistice are going to the frontier posts with matching instructions for both commands. Officers must explain the limits to every patrol, not rely on a sentry remembering a rumour about negotiations. The inheritance dispute remains for the permanent treaty to resolve. The patrols now have an order that tells them what they may not do in its name."
 hsm_ver_eyrie.112.a:0 "Make sure every post receives its copy."
 hsm_ver_eyrie.113.t:0 "No New Agreement on the Frontier"
 hsm_ver_eyrie.113.d:0 "The armistice proposal has not received Erie's consent. Iovinus cannot tell the sentries that a draft protects them. He can tell his own officers that the refusal does not authorise another campaign. The country still needs the roads and civilian works the government promised. Those undertakings do not require Vincent's signature."
 hsm_ver_eyrie.113.a:0 "Our own obligations remain."
 hsm_ver_eyrie.119.t:0 "The Armistice Mandate Expires"
 hsm_ver_eyrie.119.d:0 "The conference has closed without an agreed armistice. Draft orders cannot be sent to the frontier as if Erie had accepted them. Whatever earlier arrangements remain valid continue on their own terms. The work waiting within Eyrie's borders can proceed without pretending that the meeting achieved more than it did."
 hsm_ver_eyrie.119.a:0 "Close the mandate without inventing an agreement."
 hsm_ver_eyrie.120.t:0 "Iovinus Offers Friendship with Safeguards"
 hsm_ver_eyrie.120.d:0 "Eyrie proposes ending the rivalry through reciprocal guarantees and the abandonment of territorial demands against one another. Vincent recognises the value of a dependable frontier. His advisers ask what the settlement will mean for families with deeds on the wrong side of it. We may ratify, require funded property arbitration, or refuse. Accepting the treaty gives Iovinus obligations, not authority over Erie."
 hsm_ver_eyrie.120.a:0 "Ratify the reciprocal friendship treaty."
 hsm_ver_eyrie.120.b:0 "Require an agreed hearing for disputed property."
 hsm_ver_eyrie.120.c:0 "We cannot ratify this settlement."
 hsm_ver_eyrie.121.t:0 "The Claims That Outlast a Patrol"
 hsm_ver_eyrie.121.d:0 "Vincent will sign if an agreed commission can hear property claims. Our officers are accustomed to treating possession near the frontier as a security matter; civilian title requires another kind of evidence. Accepting means funding the review and spending political capital to support its work. Refusal would leave the treaty unconcluded. Erie's counterproposal asks whether our safeguards can protect someone without a uniform."
 hsm_ver_eyrie.121.a:0 "Fund the arbitration and conclude the treaty."
 hsm_ver_eyrie.121.b:0 "We cannot undertake that obligation."
 hsm_ver_eyrie.125.t:0 "A Frontier the Treaty Can Protect"
 hsm_ver_eyrie.125.d:0 "The treaty has been ratified. The two Houses have abandoned their reciprocal territorial demands and the official rivalry that made routine contact suspect. Roads and railway plans can benefit from a more dependable peace. Iovinus remains responsible for Eyrie's security, while Vincent remains responsible for Erie's government. Any common institution will require an additional agreement between them."
 hsm_ver_eyrie.125.a:0 "Put the agreed safeguards into ordinary practice."
 hsm_ver_eyrie.129.t:0 "The Treaty Talks End Without Agreement"
 hsm_ver_eyrie.129.d:0 "The treaty negotiations have ended without ratification. Any armistice still in force remains subject to its own terms; the rivalry cannot be declared settled by an unsigned text. Iovinus has chosen a course that does not turn an unwelcome answer into grounds for conquest. He must now show what that choice can give his own country: reconstruction, useful knowledge and civilian work that no longer waits upon the conference."
 hsm_ver_eyrie.129.a:0 "Bring the useful work home."
 hsm_ver_eyrie.130.t:0 "An Equal Council Proposed by Eyrie"
 hsm_ver_eyrie.130.d:0 "Iovinus offers a common charter under an equal council. Vincent reads the proposed powers beside the limits on their exercise. He can accept shared institutions on that basis, request a limited ducal presidency for himself, or decline the charter. A presidency would still require Eyrie's consent and would grant no hereditary authority over its government. The existing friendship treaty does not predetermine our answer."
 hsm_ver_eyrie.130.a:0 "Accept the charter and its equal council."
 hsm_ver_eyrie.130.b:0 "Request a limited Erie presidency."
 hsm_ver_eyrie.130.c:0 "Keep the friendship treaty without this charter."
 hsm_ver_eyrie.131.t:0 "The Chair Vincent Asks For"
 hsm_ver_eyrie.131.d:0 "Erie will sign if Vincent presides over the council within the charter's limited powers. The proposal conveys no sovereignty over Eyrie and no hereditary right to command Iovinus. It nevertheless gives one partner a distinctive office. We may accept that arrangement or end these talks without a charter. Declining the chairmanship leaves the friendship treaty intact."
 hsm_ver_eyrie.131.a:0 "Accept the limited chairmanship and ratify."
 hsm_ver_eyrie.131.b:0 "Retain our peace without agreeing to this charter."
 hsm_ver_eyrie.132.t:0 "Agreed Powers, Recorded Limits"
 hsm_ver_eyrie.132.d:0 "The charter now bears the necessary signatures. Officials can begin establishing the common institutions under the constitution the two Houses actually accepted. Iovinus has instructed the command to obtain copies of the limits as well as the provisions for cooperation. Avian's participation requires its own assent. The agreement already binds Erie and Eyrie without making either government the other's subordinate."
 hsm_ver_eyrie.132.a:0 "Distribute the limits with the new responsibilities."
 hsm_ver_eyrie.139.t:0 "The Congress Has No Final Text"
 hsm_ver_eyrie.139.d:0 "The congress has ended without a common charter. Neither delegation may turn its preferred amendments into authority over the other House. Earlier agreements remain binding only while their own conditions hold. Iovinus will have to build Eyrie's future without a shared council, and without making that council's absence an excuse for another war."
 hsm_ver_eyrie.139.a:0 "Keep the treaty in force and the drafts on file."
 hsm_ver_eyrie.140.t:0 "Eyrie Requests a Military Commitment"
 hsm_ver_eyrie.140.d:0 "Iovinus proposes a defensive league extending the cooperation already conducted under the charter. His letter asks Vincent who will answer when another House calls for help, and which obligations the armies are prepared to share. Existing alliances must be respected in the articles.\n\nThe staff officers have attached their plans, but the undertaking belongs to the governments whose soldiers would carry them out. Vincent can accept Eyrie's invitation or keep their cooperation within the bounds of the charter."
 hsm_ver_eyrie.140.a:0 "Accept the common military commitment."
 hsm_ver_eyrie.140.b:0 "Continue the charter without this military agreement."

 hsm_ver_eyrie.8.t:0 "Avian's Place at the Congress"
 hsm_ver_eyrie.8.accepted.d:0 "House Avian has accepted an observer's place. Iovinus asks the secretary to include the inspection procedures among the papers sent to its delegation. A useful observer should see how an agreement is meant to work beyond the council chamber. Attendance is one decision; any membership or additional obligation requires Avian's own consent. The work between Erie and Eyrie can now proceed with another House listening."
 hsm_ver_eyrie.8.d:0 "There is no Avian observer taking a place in these talks. The secretary removes the provisional entry from the attendance list and prepares the papers for the delegations present. Iovinus had hoped that another familiar voice might help. The two Houses must nevertheless answer each other's objections themselves. Their treaty and their ability to negotiate a charter do not depend on Avian's participation."
 hsm_ver_eyrie.8.a:0 "Proceed on the basis of each House's actual consent."

 hsm_ver_eyrie.31.t:0 "Eyrie's Answer to Its Command"
 hsm_ver_eyrie.31.d:0 "Vincent's military secretary read Eyrie's report aloud. Iovinus had required his officers to obey the order releasing the civilian workshops. The command's objection had been heard, and its usefulness to defence had been acknowledged. It had nevertheless been denied the power to prolong a requisition simply by repeating that it was useful.\n\nOne of Erie's officers asked whether this would leave the neighbouring army short of supplies. The secretary answered that its quartermasters would have to revise their arrangements. A government that accepted limits would sometimes have to do inconvenient work because of them.\n\nVincent requested the text of the release order for the common record. Eyrie had provided evidence of its own compliance, without settling any separate obligation Erie still owed. At the next negotiation, our representatives could ask what an undertaking required with an example already before them: a command had been told where its authority ended."
 hsm_ver_eyrie.31.dispute.d:0 "The report from Eyrie confirmed that the workshops would remain under military requisition. Iovinus had protected his officers' refusal to release them. Their argument was familiar enough to Erie's command: supplies were needed, dangers remained, and a civilian timetable could not be allowed to determine military readiness.\n\nVincent asked what would then determine the end of a requisition. The secretary could find no answer in the order. Without an enforceable limit, each assurance depended on whether headquarters still found compliance convenient.\n\nThe common offices have stopped the work whose guarantees the command has set aside. The friendship treaty remains on its own terms; a dispute about the army's powers need not become another border campaign. Our delegates ask Eyrie to withdraw its exception and acknowledge that Erie must answer for any breach of its own. Our reply records the breach and the remedy. It gives Iovinus a condition he can meet, rather than a humiliation he must answer."
 hsm_ver_eyrie.31.a:0 "Enter Eyrie's decision in the common record."

 hsm_ver_eyrie.141.t:0 "Erie's Answer on Common Defence"
 hsm_ver_eyrie.141.accepted.d:0 "Erie has accepted the military agreement. The two governments can now attach a common commitment to the practical cooperation of their staffs. Existing suitable House-led arrangements are respected; where a new league is required, Eyrie leads it. Avian must make its own decision about participation. The signature settles what Erie has agreed to undertake, not what we might hope every neighbour will do."
 hsm_ver_eyrie.141.d:0 "The proposed military agreement has not received Erie's acceptance. Vincent's government retains its own commitments, while the charter's existing cooperation can continue under its terms. Iovinus has ordered the staff to keep the preparatory work available. A useful plan need not be discarded because the political agreement has failed; neither may it be treated as authority to bind an unwilling partner."
 hsm_ver_eyrie.141.a:0 "Give the staff the answer that was actually agreed."

