l_english:
 HSM_BAR_operations_recon_valid_tt:0 "Requires Barrad's active Directorate, field research authorization, a working intelligence agency, La Resistance, no civil war and no capitulation. The target must be a different existing country and satisfy the current case-registry conditions."
 HSM_BAR_operations_archive_valid_tt:0 "Requires Barrad's active Directorate, field research authorization, a working intelligence agency, La Resistance, no civil war and no capitulation. The target must be a different existing country and satisfy the current case-registry conditions."
 HSM_BAR_operations_relic_valid_tt:0 "Requires Barrad's active Directorate, field research authorization, a working intelligence agency, La Resistance, no civil war and no capitulation. The target must be a different existing country and satisfy the current case-registry conditions. Layered Anomaly Containment must be completed."
 HSM_BAR_operations_remains_valid_tt:0 "Requires Barrad's active Directorate, field research authorization, a working intelligence agency, La Resistance, no civil war and no capitulation. The target must be a different existing country and satisfy the current case-registry conditions. Residual Magical Forensics must be completed."
 HSM_BAR_operations_recon:0 "Survey Magical Affairs"
 HSM_BAR_operations_recon_desc:0 "Build a dossier from observations, testimony and public records in [From.GetName]. Discovery identifies leads; it does not transfer a relic, imprison a spellcaster or establish that someone has died."
 HSM_BAR_operations_recon_result_tt:0 "Record verified leads in the Barrad case registry. Only evidence still present at completion can be recorded."
 HSM_BAR_operations_archive:0 "Acquire Magical Archives"
 HSM_BAR_operations_archive_desc:0 "Copy records from an identified archive or investigate the documentation of a known relic in [From.GetName]. The operation acquires evidence and research notes, never the person described in them."
 HSM_BAR_operations_archive_result_tt:0 "Acquire the eligible archive evidence or advance the investigation of a known relic, after checking its current custodian and location."
 HSM_BAR_operations_relic:0 "Recover an Identified Relic"
 HSM_BAR_operations_relic_desc:0 "Recover a physically accessible, investigated relic from [From.GetName] using the institute's containment protocol. A ruler wearing or embodying an object is not an extraction target. If custody or access changes, the team withdraws."
 HSM_BAR_operations_relic_result_tt:0 "Transfer only an investigated, currently recoverable object into Barrad's registered custody. The object's live state is checked again when the team returns."
 HSM_BAR_operations_remains:0 "Recover Confirmed Magical Remains"
 HSM_BAR_operations_remains_desc:0 "A forensic team may recover only identified, located remains whose post-defeat status is confirmed by the case registry. Capitulation, an empty throne or an unverified death notice does not qualify. A return to life immediately invalidates the mission."
 HSM_BAR_operations_remains_result_tt:0 "Recover the already confirmed remains only while identity, location and post-defeat status remain valid. No living leader is captured or removed."
 HSM_BAR_operations_phase_approach:0 "Establish a Discreet Field Station"
 HSM_BAR_operations_phase_approach_desc:0 "A small team rents working space and establishes secure communications with the institute."
 HSM_BAR_operations_phase_approach_outcome:0 "The team established a field station and checked local access."
 HSM_BAR_operations_phase_recon:0 "Correlate Reports and Observations"
 HSM_BAR_operations_phase_recon_desc:0 "Interview witnesses separately and compare their accounts with dated records. Keep conjecture distinct from observed magic."
 HSM_BAR_operations_phase_recon_outcome:0 "The observers assembled a dated dossier, with uncertain claims marked for further investigation."
 HSM_BAR_operations_phase_archive:0 "Copy and Authenticate the Records"
 HSM_BAR_operations_phase_archive_desc:0 "Acquire the relevant pages, seals and provenance records. Copies without a defensible origin remain unverified leads."
 HSM_BAR_operations_phase_archive_outcome:0 "The team prepared authenticated copies for the institute's archivists."
 HSM_BAR_operations_phase_relic:0 "Verify Custody and Isolate the Relic"
 HSM_BAR_operations_phase_relic_desc:0 "Match the object to the case file before sealing its container. Abort if it is inaccessible, destroyed, uncreated or inseparable from a living holder."
 HSM_BAR_operations_phase_relic_outcome:0 "The recovery team checked the object and its custody against the current case file before attempting transport."
 HSM_BAR_operations_phase_remains:0 "Confirm Identity and Chain of Custody"
 HSM_BAR_operations_phase_remains_desc:0 "Compare physical evidence with the confirmed remains record. Recheck every indication of resurrection or survival before sealing forensic samples."
 HSM_BAR_operations_phase_remains_outcome:0 "The examiners documented the site and checked the identity and current status of the recorded remains."
 HSM_BAR_operations_phase_return:0 "Return Through the Secure Courier Route"
 HSM_BAR_operations_phase_return_desc:0 "Deliver records and any admissible sealed cargo to the institute. The registry accepts a transfer only after a final check of the object's current state."
 HSM_BAR_operations_phase_return_outcome:0 "The team filed its report for final registry validation."
 HSM_BAR_operations_phase_return_failed:0 "The courier route was compromised. Surviving records still require a full custody check before any finding is accepted."
 HSM_BAR_operations_invalid_title:0 "The Case Has Changed"
 HSM_BAR_operations_invalid_desc:0 "The final review no longer supports the operation's authorization or target. Access, custody or the subject's actual state changed while the team was away. The institute will not turn an outdated report into a discovery or a transfer. Its registry remains unchanged."
 HSM_BAR_operations_invalid_option:0 "Close this report without a transfer."
