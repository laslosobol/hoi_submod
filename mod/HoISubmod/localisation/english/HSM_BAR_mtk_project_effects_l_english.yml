l_english:
 HSM_BAR_mtk_projects_missions:0 "Collegium Research"
 HSM_BAR_mtk_projects_missions_desc:0 "Current departmental theory and trial missions."
 HSM_BAR_mtk_research:0 "Collegium Research Results"
 HSM_BAR_mtk_research_desc:0 "Validated departmental findings, from clinical procedures to industrial automation. Results are implemented without separate civilian or field applications. Workshops are reserved only during research and trials; completed findings have no upkeep."
 HSM_BAR_mtk_method_replication:0 "sequential replication"
 HSM_BAR_mtk_method_instrumentation:0 "instrumented trials"
 HSM_BAR_mtk_viira_choose_replication:0 "$BAR_viira_lehtola$: sequential replication"
 HSM_BAR_mtk_viira_choose_replication_desc:0 "Viira can compare successive observations or reserve a workshop for a parallel array of sensing crystals. More instruments shorten the observation schedule; they cannot make two minds identical.\n\nSequential trials reserve one factory (Magnum Opus: two). Instrumentation shortens trials by 7 days (Magnum Opus: 21), but needs one additional factory and 15 more political power (Magnum Opus: 35). Workshops are released on completion or cancellation. The paid method is fixed and does not change the outcome."
 HSM_BAR_mtk_viira_choose_instrumentation:0 "$BAR_viira_lehtola$: instrumented trials"
 HSM_BAR_mtk_viira_choose_instrumentation_desc:0 "Viira can compare successive observations or reserve a workshop for a parallel array of sensing crystals. More instruments shorten the observation schedule; they cannot make two minds identical.\n\nSequential trials reserve one factory (Magnum Opus: two). Instrumentation shortens trials by 7 days (Magnum Opus: 21), but needs one additional factory and 15 more political power (Magnum Opus: 35). Workshops are released on completion or cancellation. The paid method is fixed and does not change the outcome."
 HSM_BAR_mtk_leopold_choose_replication:0 "$BAR_leopold_schmeller$: sequential replication"
 HSM_BAR_mtk_leopold_choose_replication_desc:0 "Leopold can rebuild each test rig in turn or commission dedicated gauges and duplicate benches. A crowded workshop delivers measurements sooner, not a guarantee that the machine will work.\n\nSequential trials reserve one factory (Magnum Opus: two). Instrumentation shortens trials by 7 days (Magnum Opus: 21), but needs one additional factory and 15 more political power (Magnum Opus: 35). Workshops are released on completion or cancellation. The paid method is fixed and does not change the outcome."
 HSM_BAR_mtk_leopold_choose_instrumentation:0 "$BAR_leopold_schmeller$: instrumented trials"
 HSM_BAR_mtk_leopold_choose_instrumentation_desc:0 "Leopold can rebuild each test rig in turn or commission dedicated gauges and duplicate benches. A crowded workshop delivers measurements sooner, not a guarantee that the machine will work.\n\nSequential trials reserve one factory (Magnum Opus: two). Instrumentation shortens trials by 7 days (Magnum Opus: 21), but needs one additional factory and 15 more political power (Magnum Opus: 35). Workshops are released on completion or cancellation. The paid method is fixed and does not change the outcome."
 HSM_BAR_mtk_silver_choose_replication:0 "$BAR_silver_star$: sequential replication"
 HSM_BAR_mtk_silver_choose_replication_desc:0 "Silver Star can follow one clinical series at a time or equip parallel diagnostic teams. The extra apparatus reduces delays between observations, not the care owed to an individual patient.\n\nSequential trials reserve one factory (Magnum Opus: two). Instrumentation shortens trials by 7 days (Magnum Opus: 21), but needs one additional factory and 15 more political power (Magnum Opus: 35). Workshops are released on completion or cancellation. The paid method is fixed and does not change the outcome."
 HSM_BAR_mtk_silver_choose_instrumentation:0 "$BAR_silver_star$: instrumented trials"
 HSM_BAR_mtk_silver_choose_instrumentation_desc:0 "Silver Star can follow one clinical series at a time or equip parallel diagnostic teams. The extra apparatus reduces delays between observations, not the care owed to an individual patient.\n\nSequential trials reserve one factory (Magnum Opus: two). Instrumentation shortens trials by 7 days (Magnum Opus: 21), but needs one additional factory and 15 more political power (Magnum Opus: 35). Workshops are released on completion or cancellation. The paid method is fixed and does not change the outcome."
 HSM_BAR_mtk_asinti_choose_replication:0 "$BAR_asinti$: sequential replication"
 HSM_BAR_mtk_asinti_choose_replication_desc:0 "Asinti can repeat the observation at each ritual interval or prepare an instrumented chamber to record several intervals together. A clearer trace still need not be an answer from the other side.\n\nSequential trials reserve one factory (Magnum Opus: two). Instrumentation shortens trials by 7 days (Magnum Opus: 21), but needs one additional factory and 15 more political power (Magnum Opus: 35). Workshops are released on completion or cancellation. The paid method is fixed and does not change the outcome."
 HSM_BAR_mtk_asinti_choose_instrumentation:0 "$BAR_asinti$: instrumented trials"
 HSM_BAR_mtk_asinti_choose_instrumentation_desc:0 "Asinti can repeat the observation at each ritual interval or prepare an instrumented chamber to record several intervals together. A clearer trace still need not be an answer from the other side.\n\nSequential trials reserve one factory (Magnum Opus: two). Instrumentation shortens trials by 7 days (Magnum Opus: 21), but needs one additional factory and 15 more political power (Magnum Opus: 35). Workshops are released on completion or cancellation. The paid method is fixed and does not change the outcome."
