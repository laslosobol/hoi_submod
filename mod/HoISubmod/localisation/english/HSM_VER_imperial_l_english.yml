l_english:
 HSM_VER_IMP_settlement:0 "The Griffenheim Settlement"
 HSM_VER_IMP_settlement_desc:0 "The imperial attack on a signatory has ended in defeat, and the peace conference has left Griffenheim in our hands. Victory has brought responsibilities which the Verenia charter never expected. We may offer a limited civilian reconstruction mandate, with a public account of its work and a fixed end. The charter does not oblige us to accept an imperial crown."
 HSM_VER_IMP_household_record:0 "The Household's Record"
 HSM_VER_IMP_household_record_desc:0 "The fate of Grover VI cannot be settled by an inventory of the palace. Before writing a single dynastic clause, the commission must distinguish a living child from an adult, a confirmed death from an unverified report, and a household here from one sheltered elsewhere. Its report will confer no title or guardianship."
 HSM_VER_IMP_city_contracts:0 "Contracts for a Living City"
 HSM_VER_IMP_city_contracts_desc:0 "Griffenheim needs workshops, roofs and functioning public services. The reconstruction commission can establish a civilian workshop in the city, or invest its effort in construction methods which municipal crews can use themselves. Contracts will be paid for as public works, never as rewards for a new imperial court."
 HSM_VER_IMP_open_archives:0 "Open the Technical Archives"
 HSM_VER_IMP_open_archives_desc:0 "Behind the imperial seals are useful surveys, machine drawings and inspection records. Let civilian engineers catalogue them and publish the work that can restore production. Access to these papers carries no authority over the dynasty whose seals once protected them."
 HSM_VER_IMP_technical_agreement:0 "A Voluntary Technical Protocol"
 HSM_VER_IMP_technical_agreement_desc:0 "Surviving independent charter governments may share technical publications and workshop standards with us. Where a House has lawfully joined the unified country, its engineers instead ask the civilian council to authorize a domestic programme. Each proposal needs an explicit answer. Reconstruction can continue even if it is declined."
 HSM_VER_IMP_public_accounts:0 "Publish the Mandate's Accounts"
 HSM_VER_IMP_public_accounts_desc:0 "The commission must account for the factories it commissioned, the papers it released and the staff it still keeps from ordinary service. A temporary administration cannot renew itself by declaring its own work indispensable. The municipal representatives will read its estimates before deciding whether another funded year justifies delaying the handover."
 HSM_VER_IMP_last_year:0 "One Final Funded Year"
 HSM_VER_IMP_last_year_desc:0 "The unfinished repairs have names and addresses in the commission's final estimate. One more year's appropriation will keep its crews and research office at work, with municipal officials learning the accounts they must inherit. The closing date will remain on the first page. A temporary mandate must end even when its engineers can still find something worth repairing."
 HSM_VER_IMP_return_the_keys:0 "Return the Commission's Keys"
 HSM_VER_IMP_return_the_keys_desc:0 "The municipal offices are ready to receive the contracts, survey books and keys. The commission's engineers will leave their drawings with the people who must answer for the next repair. Ordinary administration will have fewer extraordinary powers and no special mandate to invoke when a workshop asks why its bill remains unpaid."
 HSM_VER_IMP_defensive_victory_tt:0 "We defeated the Empire after its attack on a charter member, and secured that defensive victory at the peace conference."
 HSM_VER_IMP_peace_and_capital_tt:0 "We own and control Griffenheim. Surviving signatories are uncapitulated and at peace; any surviving Empire is also at peace."
 HSM_VER_IMP_optional_settlement_tt:0 "Event: accept a temporary reconstruction commission or decline it. Does not grant an imperial title."
 HSM_VER_IMP_noncustodial_tt:0 "A report records Grover VI's circumstances. It grants neither custody nor a title."
 HSM_VER_IMP_mandate_terms_tt:0 "The mandate lasts at most 730 days before review. War, loss of Griffenheim or failure of the charter institutions ends it. After the public audit, choose civilian handover or one final 365-day programme."
 HSM_VER_IMP_protocol_invitation_tt:0 "Offers the surviving Houses or our unified civilian council a technical agreement. Each recipient may accept or refuse."
 HSM_VER_IMP_last_year_tt:0 "Spends §R50 political power§! on one final 365-day programme, replacing the existing mandate. Peaceful completion grants the civilian legacy for 730 days."
 HSM_VER_IMP_handover_tt:0 "Ends the mandate: §G+75 political power§!, §G+2% stability§!, and the civilian legacy for 730 days. A report follows in 30 days."
 HSM_VER_IMP_audit_tt:0 "Unlocks the mutually exclusive final-year and civilian-handover focuses. Declined or unanswered technical invitations do not block either choice."
 HSM_VER_IMP_reconstruction_mandate:0 "Griffenheim Reconstruction Commission"
 HSM_VER_IMP_reconstruction_mandate_desc:0 "A temporary civilian commission coordinates repairs after the defensive war. Its staff consume political resources; its authority has a fixed expiry and rests on peace and Erie's actual control of Griffenheim."
 HSM_VER_IMP_final_programme:0 "The Commission's Final Year"
 HSM_VER_IMP_final_programme_desc:0 "A final funded year brings stronger repair teams and a small technical research office. Its political expense cannot be renewed indefinitely. At the deadline, peaceful reconstruction passes automatically to ordinary civilian services."
 HSM_VER_IMP_civilian_legacy:0 "Civilian Reconstruction Services"
 HSM_VER_IMP_civilian_legacy_desc:0 "Published technical records and trained workshop crews continue serving the public after the temporary commission has closed. Their benefit lasts two years and carries no special political authority."
 HSM_VER_IMP_technical_protocol:0 "Verenia Technical Protocol"
 HSM_VER_IMP_technical_protocol_desc:0 "Consenting charter governments, or the authorized research offices of their legitimate unified successor, exchange engineering papers and production standards. The finite programme grants no territory or dynastic authority. Unified participation ends if the founding, charter or homeland conditions fail."
 HSM_VER_IMP_archive_bonus:0 "Griffenheim Technical Archives"
 HSM_VER_IMP_workshop_bonus:0 "Municipal Workshop Designs"
 HSM_VER_IMP_repair_bonus:0 "Civilian Construction Methods"
 hsm_ver_imperial.1.t:0 "A Conference Without a Throne"
 hsm_ver_imperial.1.d:0 "When the Empire attacked a member of the charter, our delegates promised to defend the agreement. They did not promise to inherit an empire. Now the war is over and Griffenheim, assigned to us by the peace settlement, must live with its consequences.\n\nMunicipal representatives ask for repairs, reliable contracts and an administration that can tell them when its extraordinary work will end. The proposed reconstruction commission would answer to civilian institutions and publish its accounts. It would have neither a crown nor a claim over the imperial household. We can accept that limited responsibility, or leave reconstruction to the ordinary administration from the outset."
 hsm_ver_imperial.1.a:0 "Authorize the temporary civilian commission."
 hsm_ver_imperial.1.b:0 "Ordinary administration will suffice."
 hsm_ver_imperial.2.t:0 "The Name in the Household Register"
 hsm_ver_imperial.2.dead:0 "The investigation encounters a fact which no treaty can reverse: Grover VI is confirmed dead. Some petitioners still bring proposals for a regency, as though an office could supply the person it is supposed to protect. The commission refuses to turn those petitions into policy.\n\nThe settlement will acknowledge his death and preserve the relevant records. Reconstruction must find its justification in the needs of the living, without inventing an emperor or a succession in his name."
 hsm_ver_imperial.2.minor:0 "The records identify the living Grover VI within our country's existing household arrangements. He is still a minor. That establishes neither a new guardian's consent nor the commission's right to act as a regency.\n\nThe delegates enter a strict reservation in the settlement: the reconstruction offices exercise no authority over his upbringing, person or future title. His existing household arrangements continue under their own authority. A repaired capital is not a deed of ownership over a child."
 hsm_ver_imperial.2.adult:0 "The records identify Grover VI here, alive and of age. Petitions proposing a new regency have therefore arrived too late even on their own terms.\n\nThe settlement treats him as an adult whose existing position cannot be rewritten by a reconstruction commission. It appoints no guardian, promises no coronation and makes no decision on his behalf. The civilian programme can proceed without borrowing his name as its authority."
 hsm_ver_imperial.2.abroad_minor:0 "Reliable household records place the living Grover VI with another existing country. He remains a minor. Neither our possession of Griffenheim nor the peace conference transferred that household to us.\n\nThe commission records the foreign host's continuing responsibility and excludes guardianship from this agreement. Any future arrangement would require an identifiable household, its consent and proper authority; none has been supplied here. Our delegates return to the reconstruction accounts without claiming the child."
 hsm_ver_imperial.2.abroad_adult:0 "The surviving records place the living Grover VI abroad, and he has reached adulthood. His host's arrangements and any position he already holds exist independently of our reconstruction programme.\n\nThe delegates reject the suggestion that control of the old palace makes us his regents. They record that any personal agreement would have to involve him and his existing host. This settlement makes no such agreement and confers no imperial office."
 hsm_ver_imperial.2.unknown:0 "The commission cannot verify a living household in an existing country. It has also found no confirmed notice of Grover VI's death. Empty rooms, abandoned papers and rumours from displaced courtiers cannot close that gap.\n\nThe register will say that his whereabouts and living status remain unverified. No guardian will be appointed, no heir proclaimed and no absent person recreated for the convenience of the settlement. Civilian reconstruction can proceed while that question remains open."
 hsm_ver_imperial.2.a:0 "Acknowledge his death; close the dynastic clause."
 hsm_ver_imperial.2.b:0 "Respect the minor's existing household arrangements."
 hsm_ver_imperial.2.c:0 "An adult needs no newly appointed regency."
 hsm_ver_imperial.2.d:0 "Record the foreign household's responsibility."
 hsm_ver_imperial.2.e:0 "Leave his adult position and foreign host undisturbed."
 hsm_ver_imperial.2.f:0 "Leave the register open; make no dynastic claim."
 hsm_ver_imperial.3.t:0 "The First Civilian Contracts"
 hsm_ver_imperial.3.d:0 "The commission's first estimates contain two practical proposals. A municipal workshop could supply civilian machinery from Griffenheim itself. Alternatively, engineers could publish and teach improved construction methods, allowing several services to organize their own repairs.\n\nBoth proposals have civilian sponsors and both can be audited. There is funding for one priority now. The standing repair teams will continue their work whichever proposal receives the contract."
 hsm_ver_imperial.3.a:0 "Commission a civilian workshop in Griffenheim."
 hsm_ver_imperial.3.b:0 "Fund construction methods for municipal crews."
 hsm_ver_imperial.4.t:0 "An Invitation to Share the Work"
 hsm_ver_imperial.4.d:0 "Erie's reconstruction commission offers our government a two-year technical protocol. Published engineering papers and workshop standards would circulate between the consenting parties. The offer invokes our existing charter signature, but asks for a separate answer on this undertaking.\n\nOur engineers have marked the papers they would like to request; the treasury has marked the costs it wants explained. Joining the exchange would commit us to the work described here. The charter itself remains the agreement we already signed."
 hsm_ver_imperial.4.a:0 "Sign the technical protocol."
 hsm_ver_imperial.4.b:0 "Keep our technical programme separate."
 hsm_ver_imperial.5.t:0 "The Commission Accounts for Itself"
 hsm_ver_imperial.5.d:0 "The public accounts lay out the contracts and technical publications beside the salaries, petitions and appointments that still require the commission's attention. Foreign undertakings appear with the signatures that authorised them. The household report has been filed separately from the civilian budget.\n\nThe municipal representatives have brought two estimates. One keeps the repair teams and research office together for a final funded year; the other transfers their records and responsibilities to ordinary services now. The engineers defend the unfinished work. The municipal clerk asks when the city will be trusted to administer it."
 hsm_ver_imperial.5.a:0 "Publish the accounts and put the two conclusions before us."
 hsm_ver_imperial.6.t:0 "After the Temporary Mandate"
 hsm_ver_imperial.6.handover:0 "A month after the commission returned its keys, the ordinary civilian administration is handling the contracts. Workshop crews still consult the published plans; foreign technical exchanges continue only with governments that signed them. The municipal clerk signs the reply without sending it upstairs for a second commission seal.\n\nThe accelerated repair programme ended earlier than some engineers wished. In return, civilian services have gained both responsibility and the practical knowledge to exercise it. The peace settlement's borders and Grover's existing fate remain beyond the commission's reach."
 hsm_ver_imperial.6.finished:0 "The final year's appropriation has expired, and the commission has closed without requesting another renewal. Its repair teams and research office have completed their temporary service. The ordinary civilian administration receives the plans, records and trained crews.\n\nAt the handover, a municipal engineer asks where the commission kept the notes on failed designs. They are brought out with the finished drawings. The city will need both. What remains of the mandate is work its successors can understand and continue, without asking the vanished office to approve every alteration."
 hsm_ver_imperial.6.interrupted:0 "The commission has received the order ending its mandate. Its authority can no longer support the work it promised, and the officials preparing the handover have unfinished contracts to account for. Engineers gather their drawings while the clerks mark which commitments remain unpaid.\n\nThe repairs already completed stand where they were built. The closing report must record the rest without calling an interruption a finished programme. A city awaiting roofs and working services will judge the difference more closely than the authors of the report."
 hsm_ver_imperial.6.lapsed:0 "The commission's original two-year authority has reached its end. Its final programme remained unapproved, and the public handover was never settled. The secretary has therefore closed the appointment book beneath the date printed when the mandate began.\n\nCompleted repairs and published papers remain available to the city. Unfinished business goes into the closing accounts, including the arguments that delayed a proper transfer. The commission's seal can no longer answer them; ordinary officials will have to take responsibility for what comes next."
 hsm_ver_imperial.6.a:0 "Enter the conclusion in the public record."
 hsm_ver_imperial.7.t:0 "The Engineers at One Table"
 hsm_ver_imperial.7.d:0 "The invitation was drafted for a foreign ministry that has ceased to exist. Its engineers have not vanished with its stationery. They arrive at the commission with catalogues, incompatible measurements and a request for a common publication budget.\n\nThe clerk lays the old charter beside the founding instrument. The council may authorize work within the unified country, but cannot invent a foreign signature or claim that incorporation settled every expense. The proposed office will publish its accounts and close when its technical grant expires. The engineers wait for a decision they can put beside their drawings."
 hsm_ver_imperial.7.a:0 "Authorize the common research office."
 hsm_ver_imperial.7.b:0 "Leave research with the existing institutions."
 HSM_VER_IMP_union_dispossessed:0 "The former unified host was annexed; its old founding proof is no longer valid"
 HSM_VER_IMP_internal_protocol_answered:0 "The domestic research hearing has been answered"
 HSM_VER_IMP_internal_protocol_signed:0 "The civilian council authorized the domestic research programme"
 HSM_VER_IMP_internal_protocol_pending:0 "The domestic research hearing is pending"
