 HSM_BAR_residencies_review_a_legacy_tt:0 "Reconnaissance §G+1.00%§! replaces the watch's reconnaissance bonus."
 HSM_BAR_residencies_review_b_tt:0 "Maintain or restore the commercial watch: daily political power §R-0.03§!. Replaces the protective-check contribution; does not stack. No repeat research award."
 HSM_BAR_residencies_review_b_lar_tt:0 "Intelligence-network gain §G+5.00%§!; operation outcome §G+5.00%§!."
 HSM_BAR_residencies_review_b_legacy_tt:0 "Reconnaissance §G+2.00%§!."
 HSM_BAR_residencies_equus:0 "Equus: Revisit the Closed Room"
 HSM_BAR_residencies_equus_desc:0 "The healer has agreed to a visit under her conditions. Pay the local medical correspondent and test the room's air before accepting an explanation based on the copied inscription."
 HSM_BAR_residencies_equus_access_tt:0 "The Equus residency has opened this inquiry; its preceding conversation is concluded."
 HSM_BAR_residencies_griffonia:0 "Griffonia: Find the Cabinet Maker"
 HSM_BAR_residencies_griffonia_desc:0 "The carpenter will speak in daylight, away from the dealer who commissioned the cabinet. Compare his account with the museum's records and ask the curator who last signed for the missing vessel."
 HSM_BAR_residencies_griffonia_access_tt:0 "The Griffonian residency has opened this inquiry; its preceding conversation is concluded."
 HSM_BAR_residencies_north:0 "The North: Observe Both Shores"
 HSM_BAR_residencies_north_desc:0 "Provide Irma Kalk with a second observation point and weather instruments. Reproduce the reported light if possible; preserve dates for which the evidence is incomplete."
 HSM_BAR_residencies_north_access_tt:0 "The northern residency has opened this inquiry; its preceding conversation is concluded."
 HSM_BAR_residencies_riverlands:0 "Riverlands: Repeat the Ferry Survey"
 HSM_BAR_residencies_riverlands_desc:0 "The boatmen disagree about where the compass first turned. Commission readings on both banks and aboard the ferry, using a second instrument and a record of each crossing's cargo. Ask the crews to mark their own observations beside the surveyor's."
 HSM_BAR_residencies_riverlands_access_tt:0 "The Riverlands residency has opened this inquiry; its preceding conversation is concluded."
 HSM_BAR_residencies_zebrica:0 "Zebrica: Hear the Answering Verse"
 HSM_BAR_residencies_zebrica_desc:0 "Pay for a second conversation with the keeper and an interpreter able to correct our questions. Establish who speaks, who replies and what the recording permits us to conclude."
 HSM_BAR_residencies_zebrica_access_tt:0 "The Zebrican residency has opened this inquiry; its preceding conversation is concluded."
 HSM_BAR_residencies_comparison:0 "Zebrica: Compare the Traveller's Accounts"
 HSM_BAR_residencies_comparison_desc:0 "The traveller's name changes between the accounts, yet the greeting stays the same. Commission an independent translation, compare the verses with the journeys they describe and arrange observations with the participants' permission. The dealer's certificates also need a second reader."
 HSM_BAR_residencies_comparison_access_tt:0 "The Zebrican residency has opened this inquiry; its preceding conversation is concluded."
 HSM_BAR_residencies_reply:0 "Answer the Protected Intermediary"
 HSM_BAR_residencies_reply_desc:0 "Prepare a safe exit before examining the new request received through the retained channel. The intermediary's protection is part of the assignment, not a reward conditional on useful intelligence."
 HSM_BAR_residencies_reply_access_tt:0 "The convoy inquiry has reached this stage, with the original choice about the intermediary respected."
 HSM_BAR_residencies_papers:0 "Reconstruct the Closed Channel"
 HSM_BAR_residencies_papers_desc:0 "Work through discarded papers and copies supplied by willing commercial contacts. The old intermediary will remain out of contact; closing the channel does not end the inquiry."
 HSM_BAR_residencies_papers_access_tt:0 "The convoy inquiry has reached this stage, with the original choice about the intermediary respected."
 HSM_BAR_residencies_exchange:0 "Examine the Second Consignment"
 HSM_BAR_residencies_exchange_desc:0 "A commercial dispute offers lawful access through a cooperating warehouse contact. Establish the contents and permitted route before deciding whether to impound the crate or substitute inert packing."
 HSM_BAR_residencies_exchange_access_tt:0 "The convoy inquiry has reached this stage, with the original choice about the intermediary respected."
 HSM_BAR_residencies_aftermath:0 "Protect the Witnesses Against the Next Approach"
 HSM_BAR_residencies_aftermath_desc:0 "Compare the replacement supplier's claims and check the agreed protections. A live source will be withdrawn if exposed; a retired source will not be brought back for convenience."
 HSM_BAR_residencies_aftermath_access_tt:0 "The convoy inquiry has reached this stage, with the original choice about the intermediary respected."
 HSM_BAR_residencies_review:0 "Review the Commercial Watch"
 HSM_BAR_residencies_review_desc:0 "Six months of catalogues and unsolicited offers await comparison with the convoy file. Wrona wants to know whether the new commercial front is still finding useful leads, and whether those leads justify its running costs."
 HSM_BAR_residencies_review_access_tt:0 "The convoy inquiry has reached this stage, with the original choice about the intermediary respected."
 HSM_BAR_residencies.1.t:0 "The Room That Was Kept Shut"
 HSM_BAR_residencies.1.a:0 "Publish the clinical note with the family's consent."
 HSM_BAR_residencies.1.b:0 "Keep the inspection procedure for field teams."
 HSM_BAR_residencies.1.d:0 "The healer lets the correspondent enter after the brazier has been carried outside. Nobody is to copy the old inscription, and the family will decide what may be published. Inside, Marta's test papers discolour near a blocked flue. The builders had connected a new stove to it without checking where it ended.\n\nThe retired healer recognised headaches and sudden weakness long before she had a name for the gas. The circle beside the doorway was her warning not to bring another flame into that room. Its resemblance to the Barradian drawing remains on file; it is not evidence that both places contain the same thing. Repairing the flue stops the illness.\n\nOlcha proposes an anonymous clinical note which the family can approve. Wrona would rather circulate a restricted inspection procedure for rented rooms and field hospitals. Neither report will describe a supernatural entity recovered from the house."
 HSM_BAR_residencies.2.t:0 "The Cabinet's Second Back"
 HSM_BAR_residencies.2.a:0 "Share the casting tests with the workshops."
 HSM_BAR_residencies.2.b:0 "Keep the dealer's marks and payment trail together."
 HSM_BAR_residencies.2.d:0 "The carpenter agrees to meet in daylight. He remembers the cabinet because it had a false back, fitted at the buyer's insistence, and because the buyer returned twice to complain that its drawers clicked at night. Changes in humidity reproduce the sound. The carpenter has no explanation for the missing accession number.\n\nThe librarian does. A dealer offered to remove an allegedly dangerous object, then billed the museum for a substitute case. His inventory records a bronze vessel under three different descriptions. There is no object left to seize, only a casting sample, receipts and a curator's embarrassed admission.\n\nThe sample could help the workshops distinguish good castings from disguised defects. Alternatively, Wrona can retain the complete commercial trail for comparison with other dealers. She will not label the carpenter or the museum Maarite because someone sold them a frightening story."
 HSM_BAR_residencies.3.t:0 "The Shore Beyond the Shore"
 HSM_BAR_residencies.3.a:0 "Circulate the optical study and its limitations."
 HSM_BAR_residencies.3.b:0 "Adopt Kalk's paired-observation procedure."
 HSM_BAR_residencies.3.d:0 "Irma Kalk sends paired observations taken before dawn and after the wind changes. A shore lantern appears above an empty headland only when a cold layer settles over warmer air. Move the lamp, and the distant light moves; remove it, and the supposed chapel goes dark. The fisherman's old map helped her find the correct line of sight.\n\nOne entry remains unexplained: a witness described the light on a night for which no weather record survives. Kalk refuses both to certify an apparition and to strike the entry from her notebook. Olcha finally supplies the withheld passages. They describe a different place, not an explanation for this one.\n\nThe station can release a useful optical study, with the incomplete observation marked as such. Or the Service can turn Kalk's practice of paired observations into field reconnaissance instructions. The unverified night will remain unverified in either case."
 HSM_BAR_residencies.4.t:0 "The Needle in the Ferry"
 HSM_BAR_residencies.4.a:0 "Give the route planners a reproducible survey."
 HSM_BAR_residencies.4.b:0 "Teach field teams to check their instruments first."
 HSM_BAR_residencies.4.d:0 "The surveyor returns to both banks with a second instrument. On shore the readings agree. On the ferry they diverge, but only when the needle stands above the chest beneath the forward seat. The ferryman opens it: spare iron fittings, moved there after a leak in the stern.\n\nHis competitor has charged passengers extra to avoid the supposedly cursed bend. Nobody needs to be arrested for an anomalous influence. The residency pays for the agreed survey, gives the ferryman the readings and asks him not to use one reassuring result to dismiss every future complaint.\n\nThe notes can become a lesson in route surveying and equipment placement. Wrona instead proposes a short field procedure for checking instruments before digging shelters or marking a perimeter. The northern station's unexplained night and Barrad's genuine distortions will not be erased by a ferry full of iron."
 HSM_BAR_residencies.5.t:0 "Who Is Allowed to Finish the Verse?"
 HSM_BAR_residencies.5.a:0 "Pay the keeper and interpreter for a complete account."
 HSM_BAR_residencies.5.b:0 "Purchase the dealer's version for independent checking."
 HSM_BAR_residencies.5.d:0 "The second interviewer does not ask how old the traveller is. She asks who may sing the reply. The interpreter points out that the first recording contains only half of the exchange: a guest's words without the host's answer. The keeper will arrange a complete performance after the next gathering, provided names and the recording stay under local control.\n\nA dealer offers a quicker solution. He has a written version, an explanation of the missing verse and a sealed object which he says proves that the traveller never died. His account is fluent in the interviewer's language. The keeper's account will require time, payment to the performers and a translator who can challenge the questions.\n\nWrona asks the residency to choose its source openly in the field notebook. Paying the dealer does not authorize taking the keeper's recording, and choosing the keeper does not yet establish what the song describes."
 HSM_BAR_residencies.6.t:0 "The Traveller in Three Accounts"
 HSM_BAR_residencies.6.a:0 "Prepare a corrected scientific comparison."
 HSM_BAR_residencies.6.b:0 "Apply the findings in the residencies' work."
 HSM_BAR_residencies.6.listeners:0 "With permission, the residency records the complete exchange. The traveller is an office taken in turn by a guide; the greeting marks responsibility for a route, not an undying body. Repeated verses carry changes in water access and obligations to hosts. Older performers correct a transcription that would have sent travellers to a closed well.\n\nThe pattern is a practical memory aid whose errors can be detected by the answering singer. Olcha had underlined a supposed personal name. The interpreter returns that page with the grammatical endings marked. There is no subject for a containment order.\n\nThe performers approve a limited account of the method, not publication of their names, sacred passages or the routes themselves. It can inform our own supply training, or the residency can maintain paid local partnerships and use their corrections to improve field supply. What the Service learned began with learning how to ask."
 HSM_BAR_residencies.6.broker:0 "The dealer's written verse uses the guest's words as a personal name. Its missing ending is taken from a different occasion. Independent translation exposes the join; examination of the sealed proof finds recently worked material, not identified remains. No corpse or immortal traveller has been located.\n\nThe keeper agrees to explain the error after the residency returns the copied recording and pays the interpreter for the extra work. The dealer has sold similar certificates elsewhere. A distinctive repair to his seal is worth preserving, though a false antiquity alone proves neither a cult nor a supernatural object.\n\nOlcha can turn the comparison into a narrowly useful study of error detection in encoded messages. Wrona prefers to preserve the forged certificates as a method for screening future acquisitions. The residency's first report is withdrawn, with the reason written plainly on its cover."
 HSM_BAR_residencies.7.t:0 "The Channel Left Behind"
 HSM_BAR_residencies.7.a:0 "Protect the witnesses. Continue through records."
 HSM_BAR_residencies.7.b:0 "Approve the controlled approach."
 HSM_BAR_residencies.7.retained:0 "The intermediary kept after the convoy affair has received a question only the vanished buyers should know to ask. It concerns a numbered seal, not the prisoners. He gives Wrona the note and asks whether a correct reply will bring them to his door.\n\nThe return phrase matches the invocation heard outside the rented room. That links this correspondence to the same Maar-affiliated cell; it does not turn every dealer using its warehouse into a worshipper. Wrona can withdraw the intermediary now and continue through records and protected witnesses. Keeping him in contact would yield fresher intelligence, but also expose him and those who meet him to capture.\n\nHe agrees to one controlled reply only if an extraction is ready. The service's record of this choice will include that promise, not merely the intelligence expected from it."
 HSM_BAR_residencies.7.closed:0 "No reply was sent after the convoy affair. The witnesses have moved, and the buyers no longer have a voice at the other end of their channel. Wrona works from discarded papers, comparing seal repairs and sums with copies supplied by consenting commercial contacts. It is slower and costs more than asking a living source.\n\nOne instruction reproduces the invocation recorded outside the rented room. A payment reference points to a second intermediary, but there is no warrant for treating every name on the account as a member of the cell.\n\nThe Service can confine the list to a protective watch around threatened witnesses. Or it can prepare a controlled documentary approach through an uninvolved front, without bringing the old intermediary out of safety. Closing that channel was a real decision; reopening it is not the price of continuing the case."
 HSM_BAR_residencies.8.t:0 "The Second Consignment"
 HSM_BAR_residencies.8.a:0 "Impound the consignment and secure its records."
 HSM_BAR_residencies.8.b:0 "Send the inert replacement under controlled observation."
 HSM_BAR_residencies.8.linked:0 "A residency's preserved commercial evidence matches a repair on the seal used by the convoy conspirators. The match is narrow but repeatable. Wrona has a shipment number, a consenting warehouse contact and a crate the seller claims contains a ritual vessel. The contact will allow an inspection; the Service does not command the local customs office.\n\nThe crate holds packing around an ordinary substitute. Its buyer still expects the genuine vessel and has supplied another instruction in the cell's ritual wording. Someone in this network trades in both dangerous promises and simple fraud. Finding the fraud does not make the intended abduction harmless.\n\nThe contact can impound the consignment under the terms of the commercial dispute. Alternatively, an inert replacement can continue along the agreed route while the watchers record its recipients. No unknown object and no captive will be carried through the operation."
 HSM_BAR_residencies.8.independent:0 "The commercial contacts identify another order after several weeks of comparison. There is no helpful match from the residencies; Wrona's watchers have had to account for each transfer themselves. A consenting warehouse keeper permits inspection of the disputed crate and refuses to let the Service turn the rest of his business into a trap.\n\nThe crate holds an ordinary substitute for a promised ritual vessel. The buyer's instructions repeat the cell's invocation and the reference to the earlier convoy. This is evidence about these buyers, not proof of a worldwide command directing every trade in old objects.\n\nThe keeper can impound the consignment under the commercial agreement. Or he will allow an inert replacement to leave while its recipients are observed. Wrona writes the permitted route into the plan. Nobody has agreed to transport a captive or an object whose effects are unknown."
 HSM_BAR_residencies.9.t:0 "The Buyers Try Again"
 HSM_BAR_residencies.9.a:0 "Close this trade and keep the protective records."
 HSM_BAR_residencies.9.b:0 "Fund a replacement watch without the retired source."
 HSM_BAR_residencies.9.exposed:0 "The buyers try a new supplier. In its paperwork Wrona finds an address one street away from the intermediary's refuge. It might be a mistake; the surveillance plan assumes that it is not. The extraction prepared before his controlled reply is carried out, and his household leaves before the next collection.\n\nThe correspondence was useful. It was also used to test the Service's reach. Olcha objects when the draft report calls the episode a successful penetration without mentioning the move. Wrona adds the cost and the intermediary's request never to be contacted through the old name again.\n\nThe cell's local trade can now be closed down through the documented disputes, retaining the protected records. Or a new commercial front can watch subsequent offers, with regular expenditure and no use of the retired source. The old channel has reached its promised end."
 HSM_BAR_residencies.9.protected:0 "A replacement supplier sends a catalogue containing the same incorrect dimensions as the cell's old list. Protected witnesses confirm the clerical habit without appearing at a meeting. The earlier decision not to expose the intermediary leaves less immediate detail, but there is no source to extract from this approach.\n\nThe comparison is enough to connect these offers to the trade already under investigation. It is not a claim that the Service has defeated every Maarite organisation. Some consignments were frauds, and some were meant to support an abduction; the report keeps that distinction.\n\nWrona can close the documented trade and retain the protective records. Alternatively, she can fund a replacement commercial watch to examine later approaches. The witnesses remain protected under either plan. Their safety will not be spent a second time to make the next report look more complete."
 HSM_BAR_residencies.10.t:0 "The Next Catalogue"
 HSM_BAR_residencies.10.a:0 "Return to protective records and consignment checks."
 HSM_BAR_residencies.10.b:0 "Maintain a funded commercial watch."
 HSM_BAR_residencies.10.d:0 "The scheduled review compares new approaches with the retired case. Most are ordinary sales. One reuses a number deliberately removed from circulation after the convoy affair. The reviewer marks it for comparison, not for automatic confiscation.\n\nThe old intermediary has not been contacted. A different commercial front can sustain a limited watch, but its accounts require regular expenditure. The alternative is to restrict the work to protected records, consignment checks and warnings to consenting contacts. Wrona lays the invoices beside the catalogue: someone must decide how much another uncertain lead is worth.\n\nWrona signs the review only after the clerk removes a line claiming that the cell has been eliminated forever. A closed route can be replaced. That is a reason for maintaining evidence, not for declaring every unexplained sale part of the same conspiracy."

