l_english:
 HSM_BAR_residencies_reports:0 "Residency Investigations"
 HSM_BAR_residencies_reports_desc:0 "A copied inscription, an erased museum entry, a song recorded halfway through: the first dispatches leave questions their authors could not answer. The residencies are sending correspondents back with instruments, interpreters and time to listen."
 HSM_BAR_residencies_countertrade:0 "The Trade Behind the Convoy"
 HSM_BAR_residencies_countertrade_desc:0 "The vanished buyers have other intermediaries. Follow evidence about this network without treating every dealer as an enemy or spending the same witness twice."
 HSM_BAR_residencies_methods:0 "Residency Methods"
 HSM_BAR_residencies_methods_desc:0 "Field investigations have produced practical methods, corrected false claims and exposed a limited trafficking network. Commercial observation requires protection and maintenance; a closed channel remains closed."
 HSM_BAR_residencies_actor_tt:0 "Independent Barrad has an active Service, has not capitulated, and owns and controls $STATE_624$."
 HSM_BAR_residencies_no_pending_tt:0 "No unfinished investigation or unanswered report is pending for this assignment; any required review interval has elapsed."
 HSM_BAR_residencies_start_tt:0 "The decision cost pays for this investigation. On cancellation it is not refunded; an unfinished investigation grants no findings. The report is issued only after the full duration."
 HSM_BAR_residencies_finish_tt:0 "An uninterrupted investigation produces a report for a decision on its findings. It does not grant control of an anomaly or complete a containment study."
 HSM_BAR_residencies_continuation_tt:0 "The trafficking case continues through the retained intermediary or, if the channel was closed, through protected witnesses and commercial records."
 HSM_BAR_residencies_clinical_exchange:0 "Closed-Room Clinical Notes"
 HSM_BAR_residencies_materials_exchange:0 "Museum Casting Comparison"
 HSM_BAR_residencies_optics_exchange:0 "Kalk's Optical Observations"
 HSM_BAR_residencies_survey_exchange:0 "Ferry Survey Methods"
 HSM_BAR_residencies_route_exchange:0 "Consented Route-Memory Study"
 HSM_BAR_residencies_translation_exchange:0 "Comparative Error Detection"
 HSM_BAR_residencies_equus_a_tt:0 "One §Y50%§! research bonus for §Yfield hospitals§!; no anomalous object is acquired."
 HSM_BAR_residencies_equus_b_tt:0 "§YResidency Methods§!: attrition §G-1.00%§!."
 HSM_BAR_residencies_griffonia_a_tt:0 "One §Y50%§! research bonus for §Yindustry§!."
 HSM_BAR_residencies_griffonia_b_tt:0 "Preserve the commercial evidence for the trafficking investigation."
 HSM_BAR_residencies_griffonia_b_lar_tt:0 "§YResidency Methods§!: operation cost §G-3.00%§!."
 HSM_BAR_residencies_griffonia_b_legacy_tt:0 "§YResidency Methods§!: reconnaissance §G+0.50%§!."
 HSM_BAR_residencies_north_a_tt:0 "One §Y50%§! research bonus for §Yelectronics§!. The unmatched observation remains unresolved."
 HSM_BAR_residencies_north_b_tt:0 "§YResidency Methods§!: reconnaissance §G+1.00%§!."
 HSM_BAR_residencies_riverlands_a_tt:0 "One §Y50%§! research bonus for §Ylogistics companies§!."
 HSM_BAR_residencies_riverlands_b_tt:0 "§YResidency Methods§!: entrenchment speed §G+5.00%§!."
 HSM_BAR_residencies_zebrica_a_tt:0 "The comparison will use the keeper's complete account and locally controlled recording. No reward is granted before that inquiry is finished."
 HSM_BAR_residencies_zebrica_b_tt:0 "The comparison will independently check the dealer's transcription and claimed proof. Purchasing a claim does not confirm it."
 HSM_BAR_residencies_comparison_a_log_tt:0 "One §Y50%§! research bonus for §Ylogistics companies§! from the approved route-memory study."
 HSM_BAR_residencies_comparison_a_ele_tt:0 "One §Y50%§! research bonus for §Yelectronics§! from the corrected comparison of encoded messages."
 HSM_BAR_residencies_comparison_b_local_tt:0 "§YResidency Methods§!: supply consumption §G-2.00%§! through paid local partnerships."
 HSM_BAR_residencies_comparison_b_lar_tt:0 "Preserve the forged certificates as commercial evidence. §YResidency Methods§!: operation outcome §G+3.00%§!."
 HSM_BAR_residencies_comparison_b_legacy_tt:0 "Preserve the forged certificates as commercial evidence. §YResidency Methods§!: reconnaissance §G+1.00%§!."
 HSM_BAR_residencies_contact_a_tt:0 "Protect the witnesses and use records instead of a live approach. The next consignment can be investigated after §Y30 days§!."
 HSM_BAR_residencies_contact_a_lar_tt:0 "Until the final settlement: agency defence §G+1§!."
 HSM_BAR_residencies_contact_a_legacy_tt:0 "Until the final settlement: reconnaissance §G+0.50%§!."
 HSM_BAR_residencies_contact_b_tt:0 "Permit a controlled approach. The next consignment can be investigated after §Y30 days§!."
