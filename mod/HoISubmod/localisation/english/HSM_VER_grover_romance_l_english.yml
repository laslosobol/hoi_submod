l_english:
 hsm_ver_grover.1.romance.d:0 "The Herzland delegates bring a petition in the language of the imperial chancery. Rosaline keeps its Aquileian translation beside the original and asks the petitioners to explain a disputed phrase. Montague requests the household records and the district reports beneath the secretary's flattering introduction.\n\nGrover's circumstances must be established before either ruler can promise to act for him. If a lawful mandate follows, it will bear both signatures and bind both to the same departure: an independent imperial government in Herzland, with Verenia governing its own country again."
 hsm_ver_grover.4.romance.d:0 "Rosaline finds that an Aquileian translation calls a petitioner troublesome where the Herzland original calls him unpaid. Montague asks the archivist for the orders behind the dispute. They belong to Grover's father's reign, which the approved history describes chiefly through ceremonies.\n\nGrover wants to see the papers. The tutors propose hearing translators, engineers and witnesses together; the secretariat offers a selected account with technical instruction. Rosaline and Montague must decide how much disagreement their court will admit. Affection for a father does not settle who may speak about his government."
 hsm_ver_grover.5.romance.d:0 "Rosaline hears the miller's petition in both court languages. Montague checks the district register: the charter guarantees a hearing, but the household holding the mill claims an older exemption. Its representative reminds both rulers how much the settlement owes to his family's support.\n\nGrover recognises the household's name from his father's papers. He asks where its exemption appears in the charter.\n\nThe common court must answer. Enforcing the hearing would subject a useful supporter to the law; protecting his privilege would make the petitioner's loss a debt paid for someone else's loyalty."
 hsm_ver_grover.6.romance.d:0 "Montague brings the district officers' plans to the table; Rosaline brings the petitions about requisitioned carts. Grover asks how allied armies can keep their promises when their officers do not even share a language.\n\nOne programme takes him through interpreting offices, depots and hospitals. The other offers territorial planning and responsibility for orders given to local troops. Eyrie's staff records and Erie's translators have work in either.\n\nRosaline and Montague must choose the service their court will provide. Grover will eventually answer for an independent country's needs, including those that a parade leaves unseen."
 hsm_ver_grover.7.romance.d:0 "Rosaline compares the succession articles in both court languages while Montague checks the district and military schedules. A secretary proposes retaining their approval of imperial appointments. Grover asks which crown would then govern Herzland.\n\nThe final articles reserve no such right. The independent Empire will receive the agreed resources and stand beside Verenia in alliance; Verenia keeps its own country, officers and fleet.\n\nRosaline signs, then passes the pen to Montague. Their common crown accepted the mandate together. Both must now bind it to surrender the authority it promised was temporary."
 hsm_ver_grover.10.romance.d:0 "At Grover's coronation, Rosaline reads the final instrument in both court languages. Montague presents the completed district and military records. Their signatures close the mandate together; neither is reserved a place beneath the emperor's future orders.\n\nHerzland and the promised resources now belong to an independent allied Empire. Verenia retains its own lands, officers and fleet, and its ordinary name returns to the chancery seal.\n\nGrover receives the imperial papers. Rosaline and Montague leave him to govern, carrying home the petitions that still require their own two signatures."
