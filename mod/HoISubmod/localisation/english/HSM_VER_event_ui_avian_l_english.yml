l_english:
 HSM_VER_EVT_AVI_ack_tt:0 "Acknowledges the report. No additional effects."
 HSM_VER_EVT_AVI_translation_tt:0 "While the constitutional campaign continues and the language choice is unresolved: -50 political power. Translation Office: +6% stability, +3% research speed, -0.10 daily political power. Settles the language question."
 HSM_VER_EVT_AVI_clerks_tt:0 "While the constitutional campaign continues and the language choice is unresolved: Local Clerks grant +3% stability and +8% political power gain. Settles the language question at no political power cost."
 HSM_VER_EVT_AVI_review_tt:0 "With the three-House charter intact and both budget replies concluded, records the first budget review and opens the levy dispute focus. Does not add participants or grant another budget bonus."
 HSM_VER_EVT_AVI_budget_accept_tt:0 "Joins the common budget. While the agreement holds, our House and Avian receive:"
 HSM_VER_EVT_AVI_budget_decline_tt:0 "While this offer and the three-House charter remain valid, declines the common budget without political power cost. Your House receives no budget spirit; charter membership is unchanged. Avian is notified in 1 day."
 HSM_VER_EVT_AVI_levy_settle_tt:0 "Settles the levy dispute and allows constitutional reform to continue."
 HSM_VER_EVT_AVI_levy_defy_tt:0 "Claims an exceptional levy and suspends the three Houses' charter and common budget until the breach is settled."
 HSM_VER_EVT_AVI_convention_ack_tt:0 "Acknowledges the completed settlement. The Constituent Convention is already available; this reply grants no additional effects."
 HSM_VER_EVT_AVI_border_tt:0 "While the aid request remains open, keeps the border guarded and closes this aid choice. No political power cost, military bonus or change to the struggle in Avian."
 HSM_VER_EVT_AVI_medics_tt:0 "While the aid request remains open: -25 political power. Avian gains Emergency Hospitals for 120 days: +10% army recovery rate and +10% casualty trickleback. An existing hospital spirit is not extended. Does not affect the victor."
 HSM_VER_EVT_AVI_loyalist_aid_tt:0 "While the aid request remains open: -40 political power; adds 1 point to the loyalists' battle score. This support lets them win a tie for the highest score, but does not guarantee victory. Closes this aid choice."
 HSM_VER_EVT_AVI_aid_report_tt:0 "Records the report of Erie and Eyrie's earlier assistance. The aid has already taken effect; acknowledging it grants no further bonus."
 HSM_VER_EVT_AVI_compact_available_tt:0 "Independent Erie/Eyrie and Avian are at peace and have not capitulated; Avian has a settled government outside the emergency. Your House has more than 34 political power and no military route, active compact, pending offer or 90-day retry restriction."
 HSM_VER_EVT_AVI_compact_offer_tt:0 "Proposes civilian transit to Avian. Avian may accept or refuse; acceptance establishes a non-aggression pact and the transit agreement."
 HSM_VER_EVT_AVI_compact_accept_tt:0 "Signs a non-aggression pact and ends the sender's border watch. While the compact operates, both countries receive:"
 HSM_VER_EVT_AVI_compact_refuse_tt:0 "If the offer remains valid under this government, declines it and informs the sender in 1 day. No transit spirit or non-aggression pact is granted, and the sender's 35 political power is not refunded."
 HSM_VER_EVT_AVI_no_compact_tt:0 "Records this reply without proposing a civilian transit compact. No political power cost or additional bonus."
 HSM_VER_EVT_AVI_elections_welcome_tt:0 "Records support for Avian's local elections, which the later loyalist transit report will reflect. Your ruler, ruling party and autonomy are unchanged; no immediate stat bonus."
 HSM_VER_EVT_AVI_elections_reserve_tt:0 "Acknowledges Avian's local elections without endorsing them. Your ruler, ruling party and autonomy are unchanged; no immediate stat bonus."
 HSM_VER_EVT_AVI_crown_tt:0 "If the coronation remains pending and Trubach holds the Herzland at peace: crowns him Emperor and grants +7% stability. Imperial Chancery adds +5% stability and +5% political power gain while his crowned government retains Griffenheim."
 HSM_VER_EVT_AVI_crown_defer_tt:0 "If Trubach has not yet been crowned, postpones the coronation for at least 60 days. A new ceremony still requires peace and control of the Herzland. No coronation stability or chancery bonus now."
 HSM_VER_EVT_AVI_policy_autonomous_tt:0 "While the crowned government is active and policy is undecided, selects autonomous agreements for future invitations to dynastic crowns. Each crown must consent separately; no agreement or change of subject autonomy occurs now."
 HSM_VER_EVT_AVI_policy_central_tt:0 "While the crowned government is active and policy is undecided, selects common ministries for future invitations. Each dynastic crown may accept, request autonomous terms or refuse; no agreement is signed now."
 HSM_VER_EVT_AVI_grover_ack_tt:0 "Acknowledges the report on Grover VI. Does not move him, change his custody or alter his status."
 HSM_VER_EVT_AVI_works_tt:0 "While Trubach's crowned government is active and investment is undecided: 1 civilian factory and 1 building slot in a fully controlled owned state with capacity, plus one 100% construction research bonus. Without an eligible state, grants a second 100% construction bonus instead of the factory."
 HSM_VER_EVT_AVI_railways_tt:0 "While Trubach's crowned government is active and investment is undecided: Railway Board grants -10% supply consumption and +15% infrastructure construction speed. Settles this investment choice; the spirit lasts while his imperial government remains in power."
 HSM_VER_EVT_AVI_professional_tt:0 "While the crowned government is active and the muster is undecided: +30 army experience. Professional Muster grants +8% army organisation, +10% planning speed and -4% stability while Trubach's imperial government remains in power."
 HSM_VER_EVT_AVI_limited_tt:0 "While the crowned government is active and the muster is undecided: one 100% support technology research bonus. Limited Muster grants -10% supply consumption and -10% training time while Trubach's imperial government remains in power."
 HSM_VER_EVT_AVI_central_offer_tt:0 "Verenia has proposed common ministries."
 HSM_VER_EVT_AVI_autonomous_offer_tt:0 "Verenia has proposed autonomous terms."
 HSM_VER_EVT_AVI_central_sign_tt:0 "Ratifies common ministries. Subject status is unchanged; the agreement must remain valid."
 HSM_VER_EVT_AVI_autonomous_sign_tt:0 "Ratifies autonomous terms. Subject status is unchanged; the agreement must remain valid."
 HSM_VER_EVT_AVI_counter_offer_tt:0 "While the common-ministry offer remains valid, requests autonomous terms instead. Verenia receives the counterproposal in 1 day and must consent within 30 days. No agreement, spirit, research bonus or autonomy change yet."
 HSM_VER_EVT_AVI_dynastic_refuse_tt:0 "While the dynastic offer remains valid, refuses it and informs Verenia in 1 day. No agreement or bonuses; existing subject status is unchanged. A new invitation must wait for the 90-day restriction from the original offer to expire."
 HSM_VER_EVT_AVI_counter_accept_tt:0 "Accepts the crown's autonomous terms. Its subject status remains unchanged; the agreement must remain valid."
 HSM_VER_EVT_AVI_counter_refuse_tt:0 "While the crown's counterproposal remains valid, closes it without an agreement or bonuses. Subject status is unchanged; the original 90-day invitation restriction still applies."
 HSM_VER_EVT_AVI_faction_available_tt:0 "Avian's original union government remains outside the crisis, neutral and Foundation routes and leads a faction. Your country is independent, at peace with Avian, and outside any rival faction."
 HSM_VER_EVT_AVI_faction_join_tt:0 "If these conditions still hold, joins Avian's faction and sends acceptance to Avian. Does not change your independence."
 HSM_VER_EVT_AVI_faction_refuse_tt:0 "Declines the faction invitation and notifies Avian. Costs 200 political power unless your country has signed the peace treaty or charter; signatories refuse without that cost."
 HSM_VER_EVT_AVI_integration_defer_tt:0 "Withholds consent to integration and keeps independence, without a political power cost. The invitation's 90-day retry restriction remains in place."
 HSM_VER_EVT_AVI_integration_accept_tt:0 "If integration remains valid and consent has not already been given: +25 political power; adopts Avian's blue colours and grants consent for 45 days to become its integrated puppet. Avian receives a confirmation event; subject status changes only if it confirms while the conditions remain valid."
 HSM_VER_EVT_AVI_integration_refuse_tt:0 "If the integration offer remains valid: -250 political power; withdraws consent and sends refusal to Avian. Your country stays independent."
 HSM_VER_EVT_AVI_equal_available_tt:0 "Your country has signed the peace treaty or the charter."
 HSM_VER_EVT_AVI_equal_keep_tt:0 "Withdraws consent to vassalisation and preserves independence within the equal union. No political power cost; the invitation's 90-day retry restriction remains in place."
 HSM_VER_EVT_AVI_integration_confirm_tt:0 "If consent is unexpired, both countries are independent and uncapitulated, the sender is at peace with Avian and has no rival faction, and Avian retains its original union government: the sender becomes Avian's integrated puppet and gains +25 opinion of Avian; Avian gains 50 political power. Consumes consent even if those conditions fail."
 HSM_VER_EVT_AVI_battles_tt:0 "Schedules the battle for the broadcasting station in 14 days, unless it is already scheduled. This reply does not decide the victor."
 HSM_VER_EVT_AVI_military_victory_tt:0 "Trubach replaces Katrina. Independent Houses answer his demands separately. Avian leaves the charter; common budgets end. An empty Intergigantes is dissolved."
 HSM_VER_EVT_AVI_loyalist_victory_tt:0 "Restores non-aligned rule, opens the loyalist focus tree and retires Trubach. Avian leaves the charter and loses its benefits; all common budgets end. An aid report follows in 14 days, and eligible Erie/Eyrie governments receive contact in 1 day."
 HSM_VER_EVT_AVI_technocrat_victory_tt:0 "Redtail becomes the triumphant revolutionary; Katrina and Trubach retire. Independent Houses answer separately. Avian leaves the charter; common budgets end and an empty Intergigantes dissolves."
 HSM_VER_EVT_AVI_loyalist_wins_tt:0 "The loyalists lead both rivals, or tie for the highest score after Erie or Eyrie supported them during the crisis."
 HSM_VER_EVT_AVI_loyalist_result_tt:0 "The loyalist victory event follows in 4 hours."
