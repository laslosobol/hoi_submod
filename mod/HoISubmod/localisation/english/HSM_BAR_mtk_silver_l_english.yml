 HSM_BAR_mtk_necrotic_suture_title:0 "Necrotic Suture"
 HSM_BAR_mtk_necrotic_suture_idea:0 "Proposal, Silver Star's surgical notebook.\n\nA severed tendon retains its arrangement after it loses its warmth. The animation spells in my old books pull that arrangement into motion; perhaps a quieter command could hold damaged fibres together while a surgeon works. I propose a necromantic suture that bears tension without ordering the limb to move. Freshly discarded surgical tissue will answer the first question. Any later bedside trial must measure circulation as well as strength. A beautifully rigid leg can still be dying.\n\nSigned: Silver Star.\nLeopold, pencilled beneath: You have drawn a joint with no allowance for swelling. Leave room for the patient."
 HSM_BAR_mtk_necrotic_suture_theory:0 "Calculation sheet, revised after the anatomy demonstration.\n\nAn animation command normally travels along the whole remembered shape. The proposed stitch confines it between two anchoring marks, like a short bridge across interrupted fibres. Tension should rise with separation and fall when the edges touch. It must not squeeze the small vessels between them. Compare equal tissue strips under ordinary thread, an inactive inscription, and the active stitch; record tearing, fluid passage, and recoil after release. The spell supplies support, not blood or new tissue.\n\nSigned: Silver Star.\nViira, in the margin: Your bridge also conducts magic. Measure leakage into neighbouring muscle before praising its elegance."
 HSM_BAR_mtk_necrotic_suture_tests:0 "Bench record and first clinical series.\n\nTen paired tendon strips endured repeated bending. Eight active stitches held until the ordinary thread was secured; two slipped where the anchoring marks crossed bruised fibres. Dye continued through the small vessels only at the lower tension setting. Six subsequent patients received temporary support during transport or repair, alongside the usual treatment. All reached surgery with the supported edges aligned. One developed swelling; release relieved it before the dressing was replaced.\n\nSigned: Silver Star; Rada, earth-pony ward nurse.\nRada's hoofwritten addition: He called the miller's leg saved before the second visit. I have booked that visit. The miller still cannot climb stairs."
 HSM_BAR_mtk_necrotic_suture_conclusion:0 "Clinic letter, six weeks after the first application.\n\nThe temporary suture has done the job proposed: it supports damaged tissue until treatment can take over. All six patients retained circulation during use. Five now bear weight; the sixth needs further repair of an injury outside the stitch. None required continued animation after removal. Tenderness, infection, and loss of blood still demand their own treatment. The working case contains ordinary thread beside the inscribing stylus.\n\nSigned: Silver Star.\nLeopold, handwritten: A supported wound is not a healed wound.\nSilver's reply: Agreed. I visited the miller. He wanted help carrying flour, so I carried flour."

 HSM_BAR_mtk_tissue_bank_title:0 "Tissue Bank"
 HSM_BAR_mtk_tissue_bank_idea:0 "Request for a second cold cabinet.\n\nOur surgeon sometimes lacks a graft while suitable donated tissue spoils two streets away. I propose storing small, carefully identified pieces under cold and a restrained preservation spell. Skin, tendon, and an entire organ must occupy separate columns; looking unchanged is not the same as remaining useful. We shall compare matched fragments after warming, including their capacity to knit into a living wound. The cabinet must preserve the donor record as faithfully as the specimen.\n\nSigned: Silver Star.\nLeopold, beside the cost: You requested shelves before specifying temperature. I will build a thermometer first. No, your horn is not a thermometer."
 HSM_BAR_mtk_tissue_bank_theory:0 "Working model of preservation.\n\nNecromantic fixation may slow the loss of a tissue's internal arrangement while cold slows its ordinary decay. Yet a thick organ has channels, secretions, and many sorts of cells whose rhythms may not tolerate the same spell. Thin grafts offer a simpler first comparison. Divide each donation between cold alone, fixation alone, and both together. After warming, test flexibility, fluid passage, and survival at the edges of a prepared graft bed. Colour and magical response are secondary observations.\n\nSigned: Silver Star.\nViira's narrow handwriting: Your definition of survival still includes anything that answers you. Ask whether it can continue after you stop asking."
 HSM_BAR_mtk_tissue_bank_tests:0 "Cabinet log, third week.\n\nOf twelve skin samples stored for seven days under cold and fixation, nine retained living margins after warming; only four of twelve kept in cold alone did so. Tendon strips retained useful strength, though their surface cells recovered unevenly. Every whole kidney specimen failed the circulation test. Several looked excellent while their smallest channels leaked. Three patients later received small skin grafts from the working batches. Two knitted; the third required replacement. Weekly examinations continue.\n\nSigned: Silver Star; Rada.\nLeopold, written across the sketch of a kidney: Stop putting the prettiest specimen at the front of the demonstration."
 HSM_BAR_mtk_tissue_bank_conclusion:0 "Inventory note attached to the graft cabinet.\n\nA modest bank of selected skin and tendon is practicable within the tested storage interval. Every batch still needs examination after warming; the spell cannot make an unsuitable donation suitable. This is not a universal supply of organs. Whole kidneys failed, and nothing here establishes preservation of a heart or brain. At the fourth weekly visit, the two accepted skin grafts remained sound; the replacement case is healing under ordinary care.\n\nSigned: Silver Star.\nRada, handwritten: Count the failed graft in the lecture.\nSilver's answer: It is on the first page. The patient asked me to include how much the second dressing hurt."

 HSM_BAR_mtk_ageless_sleep_title:0 "Ageless Sleep"
 HSM_BAR_mtk_ageless_sleep_idea:0 "Private proposal entered into the laboratory book.\n\nI have spent too many nights listening for the hoofsteps that will end mine. If growth, hunger, and decay could be suspended together, perhaps a sleeper might pass an interval without spending it bodily. The first specimens will be living tissue cultures, with matched untreated cultures beside them. We must distinguish halted ageing from a body too damaged to show its age. No sleeper should be asked to settle a question a dish can answer.\n\nSigned: Silver Star.\nViira, handwritten: You put White Star's name above the proposed comparison group. Your sister is not a unit of time."
 HSM_BAR_mtk_ageless_sleep_theory:0 "On the proposed pause of living processes.\n\nThe hypothesis requires a reversible arrest: after release, the tissue must resume its former work without accumulated damage. A lower pulse, a still surface, or the absence of wrinkles would prove little. Matched cultures will receive identical nourishment before and after the spell. We shall measure repair, division, and structural damage across repeated pauses, then compare them with cultures aged for the same total interval. Any apparent delay purchased by injury defeats the hypothesis.\n\nSigned: Silver Star.\nLeopold's cramped note: Your equation stops consumption and assumes maintenance continues. Specify what pays for maintenance. I cannot supply that term by admiration."
 HSM_BAR_mtk_ageless_sleep_tests:0 "Record of the six attempted pauses.\n\nThe spell stopped visible movement in all treated cultures. After release, four failed to resume growth; the remaining two divided more slowly and contained more damaged cells than their matched controls. Repetition worsened the injury. Calendar-matched cultures showed no evidence that ageing had been safely postponed. A second observer, using samples whose labels were concealed during examination, reached the same count. The proposed whole-body trials were therefore cancelled. No treatment emerged from this series.\n\nSigned: Silver Star; Leopold.\nSilver, added after midnight: I asked him to count again.\nLeopold's reply: I did. I stayed for tea afterwards. The count did not change."
 HSM_BAR_mtk_ageless_sleep_conclusion:0 "Closure entry: hypothesis not supported.\n\nAgeless Sleep failed. Arresting visible activity neither safely stopped ageing nor preserved the ability to recover. There is no therapeutic use, no safe sleeping interval, and no improved preservation method to offer from these experiments. The damaged cultures were not younger. Their stillness was injury. The proposed procedure will not be offered to patients or used on myself. Existing patients will continue their ordinary appointments without a promise of suspended time.\n\nSigned: Silver Star.\nAsinti, handwritten: You need not turn this page into a confession.\nSilver's reply: Nor into a discovery. I still fear death. This did not cure that either."

 HSM_BAR_mtk_spell_sterilisation_title:0 "Spell Sterilisation"
 HSM_BAR_mtk_spell_sterilisation_idea:0 "Note from the dressing room.\n\nA cleaned forceps can carry both living contamination and a remnant charm from its previous use. Boiling addresses one problem more reliably than the other. I propose a sterilising spell with a separate unwinding pass for residual enchantment, intended for instruments before they touch a wound. The test must include contaminated hinges, wrapped surfaces, and deliberately enchanted tools. A bright flash over polished steel is a performance, not evidence of cleanliness.\n\nSigned: Silver Star.\nRada, earth-pony nurse, in pencil: You demonstrated it over the cleanest tray we own. Take the tray from yesterday's late shift. I have left the hinge closed."
 HSM_BAR_mtk_spell_sterilisation_theory:0 "Two-pass formula for instrument treatment.\n\nThe first pass should disrupt the small repeating structures of microbial life on cleaned metal; the second should unwind the residual spell without imprinting a fresh command. These are different operations and require different witnesses. Culture swabs after treatment, and expose an unenchanted test crystal to the tool afterwards. Use matched instruments receiving ordinary sterilisation, the first pass alone, or both passes. Hinges and shadows must be sampled separately. No inference about living skin follows from success on metal.\n\nSigned: Silver Star.\nAsinti, inked beside the second circle: Unwinding can release what was bound. Measure the tray around the instrument as well."
 HSM_BAR_mtk_spell_sterilisation_tests:0 "Steriliser comparison, twenty-four instrument sets.\n\nThe early formula cleared exposed blades but left growth in four closed hinges. Opening the joints before treatment removed that failure in the repeated series. Under the revised two-pass procedure, all twenty-four sampled sets remained culture-negative through the observation period; their test crystals showed no transferred charm. Boiled comparison tools were clean of cultured organisms but sometimes retained the deliberately applied binding. One charmed handle cracked during unwinding and was discarded. Living dressings were excluded from the trial.\n\nSigned: Silver Star; Rada.\nRada, handwritten: He wanted to call the cracked handle an unrelated defect. It was a perfectly good handle before the spell."
 HSM_BAR_mtk_spell_sterilisation_conclusion:0 "Workshop copy of the accepted instrument procedure.\n\nThe combined treatment reliably sterilises the tested instruments and removes their residual enchantments when joints are opened and the preliminary cleaning is complete. The handle failure requires a separate check of enchanted fittings. Cloth, timber, and living wounds remain outside the demonstrated claim. The clinic has completed four weeks of use without a positive tray sample; infection in a patient still demands investigation on its own evidence.\n\nSigned: Silver Star.\nLeopold, handwritten: This may be your most frequently useful invention.\nSilver's reply: An unflattering prediction. I have nevertheless ordered another unit for the night ward. Rada says it is already overdue."

 HSM_BAR_mtk_phantom_pain_title:0 "Phantom Pain"
 HSM_BAR_mtk_phantom_pain_idea:0 "Consultation note, dictated with the patient present.\n\nA griffon carpenter feels a claw close in a forelimb that is no longer there. She can describe its posture more precisely than I can describe the spell I hope will help. Perhaps residual animation follows an old bodily outline and strengthens a signal that injured nerves already sustain. We shall map the sensation before applying any counter-pattern, and compare it with quiet sessions of equal length. The account belongs to the patient even when the instruments remain silent.\n\nSigned: Silver Star.\nLeopold, handwritten: Do not assume that because you study necromancy, every pain must be a haunting."
 HSM_BAR_mtk_phantom_pain_theory:0 "Competing explanations for the absent limb.\n\nOne possibility is a persisting magical outline; another is activity within the remaining nerves, with no such outline required. A third allows both to reinforce one another. A weak counter-pattern should change the first component without numbing intact tissue. Record the location of perceived movement, pain during rest and work, and sensation in the remaining limb. Alternate active and inactive sessions without telling the examining nurse their order. Improvements that follow expectation alone must not be assigned to the inscription.\n\nSigned: Silver Star.\nViira, pencilled below: Nor may an unmeasured magical trace become your explanation for every disappointing result."
 HSM_BAR_mtk_phantom_pain_tests:0 "Pain diaries, eight volunteers, four weeks.\n\nThree participants reported shorter painful episodes during active sessions and could sleep longer afterwards. The benefit faded by the next evening. Two improved equally during active and inactive visits; three reported no change. The carpenter's perceived claw relaxed for an hour, but her remaining shoulder still hurt at work. No missing limb returned, and the spell altered neither scar nor ordinary sensation. Diaries continued between visits, including days when no researcher was present.\n\nSigned: Silver Star; Rada.\nLeopold, handwritten: You graphed the best hour. She has to live the other twenty-three.\nSilver's answer: The daily totals are now beside it."
 HSM_BAR_mtk_phantom_pain_conclusion:0 "Letter to the rehabilitation room.\n\nA limited, temporary reduction of phantom pain is supported for three of eight participants. We cannot predict reliably who will respond, and the comparisons do not justify calling every improvement magical. Offer further sessions only where the patient records a worthwhile benefit; keep ordinary pain treatment, fitting work, and rest available. At the later review, two responders still requested sessions, while the third preferred fewer journeys to the clinic. Her choice does not change the earlier measurements.\n\nSigned: Silver Star.\nThe carpenter's pencilled correction: I asked to hold a cup without dreading it. You kept asking whether I felt whole. Please ask about the cup."

 HSM_BAR_mtk_last_minute_title:0 "The Last Minute"
 HSM_BAR_mtk_last_minute_idea:0 "Magnum Opus proposal, carried between ward and workshop.\n\nNecrotic Suture supplies temporary support; Tissue Bank supplies only selected grafts. Ageless Sleep failed, so this design must sustain living processes rather than suspend them. Spell Sterilisation supplies clean, unenchanted instruments; Phantom Pain requires us to distinguish comfort from recovery. Can these five lessons support a brief emergency interval in which surgery becomes possible? I want an answer that my sister could not have written. I also want the next stretcher to arrive in time. Both motives are mine.\n\nSigned: Silver Star.\nRada, handwritten: Then put a space for the surgeon's arrival beside your name. The spell cannot perform that part."
 HSM_BAR_mtk_last_minute_theory:0 "Design sheet for a finite necromantic support circuit.\n\nNecrotic Suture anchors the damaged structures while an externally driven rhythm assists failing motion. Tissue Bank limits replacement material to examined grafts. Ageless Sleep forbids a supposed pause of metabolism: circulation and air must continue. Spell Sterilisation removes stray commands from every contacting instrument. Phantom Pain adds independent checks of circulation and response, since relief alone proves no recovery. The circuit must disengage gradually as ordinary function returns, or yield immediately to the clinician. It cannot reconstruct a destroyed brain or summon back an absent person.\n\nSigned: Silver Star.\nLeopold, handwritten: Draw the failure state with the same care as the glorious one."
 HSM_BAR_mtk_last_minute_tests:0 "Emergency series, nine admissions.\n\nNecrotic Suture held damaged structures during support; Tissue Bank supplied examined skin in two repairs. Following Ageless Sleep's failure, breathing and circulation were maintained throughout. Spell Sterilisation cleared the instruments; Phantom Pain's lesson kept reported comfort separate from measured perfusion. Seven patients reached definitive treatment with circulation sustained. Six survived to discharge; one died after surgery, and two could not be stabilised. No death was reversed. The circuit supported failing bodies while clinicians treated their injuries.\n\nSigned: Silver Star; Rada; Leopold.\nRada, handwritten: He stayed for the unsuccessful cases too. His first draft still counted only the seven. This one counts nine."
 HSM_BAR_mtk_last_minute_conclusion:0 "Magnum Opus report, with six follow-up cards attached.\n\nEmergency necromantic stabilisation succeeded within its stated task. Five discharged patients now manage daily work; the sixth continues rehabilitation. Necrotic Suture's temporary support, Tissue Bank's selective stock, Ageless Sleep's failed suspension, Spell Sterilisation's two passes, and Phantom Pain's separation of relief from recovery remain essential limits of the method. Treatment must follow promptly. This is neither immortality nor universal revival; it cannot retrieve the dead. I still check my own pulse when the ward falls quiet.\n\nSigned: Silver Star.\nViira, handwritten: You promised to rest after the visits.\nSilver's reply: One letter first. White Star should hear that the miller climbed his stairs."
