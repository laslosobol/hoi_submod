l_english:
 HSM_VER_UI_ducal_eyr_government_tt:0 "Eyrie is free and uncapitulated, under Duke Iovinus."
 HSM_VER_UI_ducal_charter_recipients_tt:0 "Under the active charter: Erie and Eyrie, plus Avian if it is a charter partner:"
 HSM_VER_UI_ducal_diplomacy_tt:0 "Neither House has chosen military unification."
 HSM_VER_UI_ducal_armistice_context_tt:0 "Both free Houses are at peace under Vincent and Iovinus. Diplomacy remains open; no friendship treaty is in force."
 HSM_VER_UI_ducal_peace_tt:0 "Both Houses are free and at mutual peace, with a valid armistice or friendship treaty."
 HSM_VER_UI_ducal_guarantees_tt:0 "Both free Houses can negotiate under their dukes, or already have a valid armistice or friendship treaty."
 HSM_VER_UI_ducal_treaty_tt:0 "The friendship treaty is valid between two free Houses at mutual peace."
 HSM_VER_UI_ducal_charter_tt:0 "Both Houses are free and at mutual peace. Their treaty and unsuspended charter remain valid."
 HSM_VER_UI_ducal_erie_settlement_tt:0 "$HSM_VER_UI_ducal_charter_tt$ Our government has honoured the court's ruling."
 HSM_VER_UI_ducal_eyr_charter_tt:0 "$HSM_VER_UI_ducal_charter_tt$ Iovinus still governs Eyrie."
 HSM_VER_UI_ducal_eyr_settlement_tt:0 "$HSM_VER_UI_ducal_charter_tt$ Iovinus governs; the requisition dispute is settled."
 HSM_VER_UI_ducal_failed_conference_tt:0 "Our free House is at peace. Diplomacy failed with no reply pending; no charter is active and Verenia has not been founded."
 HSM_VER_UI_ducal_avian_available_tt:0 "A valid ducal settlement and free Intergigantes Avian at peace. Homeland control and alliances permit talks; no prior or pending association blocks them."
 HSM_VER_UI_ducal_avian_bypass_tt:0 "A valid Avian association exists, or Avian has joined our free Verenian state with the required homelands fully held."
 HSM_VER_UI_ducal_erie_start_tt:0 "Opens §Y$hsm_verenia.1.t$§!: Vincent begins hearing the country's grievances.\n$HSM_VER_UI_ducal_inherited_treaty_tt$"
 HSM_VER_UI_ducal_eyrie_start_tt:0 "Opens §Y$hsm_ver_eyrie.1.t$§!: Iovinus orders a review of muster rolls and requisitions.\n$HSM_VER_UI_ducal_inherited_treaty_tt$"
 HSM_VER_UI_ducal_inherited_treaty_tt:0 "Recognises any valid Avian-mediated peace already in force."
 HSM_VER_UI_ducal_choose_diplomacy_tt:0 "Commits our House to diplomacy. Agreements require the other House's consent; an existing armistice becomes indefinite."
 HSM_VER_UI_ducal_petitions_tt:0 "Opens §Y$hsm_verenia.2.t$§!: choose public hearings with ongoing civic commitments, or handle petitions privately at a political cost."
 HSM_VER_UI_ducal_erie_letters_tt:0 "Opens §Y$hsm_verenia.3.t$§!: Vincent hears Rosaline's wish to correspond freely with Montague, allowing personal contact between the Houses."
 HSM_VER_UI_ducal_eyrie_letters_tt:0 "Opens §Y$hsm_ver_eyrie.3.t$§!: Iovinus authorises Montague and Rosaline's correspondence, securing their passage without dictating their words."
 HSM_VER_UI_ducal_armistice_reward_tt:0 "Seeks an armistice. The other House may agree, request inspections or refuse. A signed settlement ends border clashes and mutual conquest goals; it remains in force until war or a friendship treaty."
 HSM_VER_UI_ducal_prepare_guarantees_tt:0 "Prepares guarantees and opens §Y$hsm_ver_routes.1.t$§! before the treaty: choose joint patrols with upkeep, or a one-time restitution fund replacing inspections with arbitration."
 HSM_VER_UI_ducal_open_roads_tt:0 "If we own and control §Y$STATE_401$§!, instantly adds §G1 infrastructure level§!. Opens §Y$hsm_verenia.4.t$§!: civilian traffic returns to the crossing."
 HSM_VER_UI_ducal_bridge_tt:0 "While peace holds, opens §Y$hsm_ver_eyrie.4.t$§!: engineers turn their frontier surveys into plans to repair the bridge and restore civilian traffic."
 HSM_VER_UI_ducal_treaty_reward_tt:0 "Seeks a friendship treaty. The other House may sign, request property arbitration or refuse. Ratification ends the rivalry and mutual territorial claims."
 HSM_VER_UI_ducal_treaty_recipients_tt:0 "Upon ratification, both Houses receive:"
 HSM_VER_UI_ducal_treaty_terms_tt:0 "Ratification ends the rivalry, inspections and mutual territorial claims. Both Houses retain their independence."
 HSM_VER_UI_ducal_delegates_tt:0 "Opens §Y$hsm_verenia.40.t$§!: spend political power to seat civic delegates and allow a public council, or retain household delegates for the charter."
 HSM_VER_UI_ducal_erie_charter_reward_tt:0 "Proposes equality or a limited ducal presidency. Eyrie may consent, seek equal terms or refuse."
 HSM_VER_UI_ducal_eyrie_charter_reward_tt:0 "Proposes an equal charter. Erie may consent, seek a limited presidency or refuse; Eyrie must approve any counterproposal."
 HSM_VER_UI_ducal_charter_benefits_tt:0 "Ratification establishes common courts and charter cooperation."
 HSM_VER_UI_ducal_joint_staff_tt:0 "Under the active charter, gives both Houses and any eligible Avian partner a joint staff: §G+5% division organisation§! and §G-8% supply consumption§! each."
 HSM_VER_UI_ducal_shared_services_tt:0 "Under the active charter, gives both Houses and any eligible Avian partner shared technical services: §G+10% production efficiency growth§! and §G+5% factory output§! each."
 HSM_VER_UI_ducal_judgement_tt:0 "Opens §Y$hsm_verenia.70.t$§!: honour the court's ruling at a political cost to continue the settlement, or claim a ducal exception and suspend charter benefits."
 HSM_VER_UI_ducal_erie_defence_tt:0 "Seeks Eyrie's consent to a defensive league. Erie leads a new league; existing leadership is retained. Avian receives a separate invitation."
 HSM_VER_UI_ducal_eyrie_defence_tt:0 "Seeks Erie's consent to a defensive league. Eyrie leads a new league; existing leadership is retained. Avian receives a separate invitation."
 HSM_VER_UI_ducal_keep_word_tt:0 "If we own and control §Y$STATE_401$§!, instantly adds §G1 civilian factory and 1 shared building slot§!. After 30 days, §Y$hsm_verenia.90.t$§! reviews the promises kept if the settlement holds."
 HSM_VER_UI_ducal_erie_finale_tt:0 "Completes Erie's charter settlement and opens §Y$hsm_verenia.91.t$§!. The Houses remain independent partners; a later convention can found a single Verenian state."
 HSM_VER_UI_ducal_eyrie_finale_tt:0 "Completes Eyrie's settlement and opens §Y$hsm_ver_eyrie.40.t$§!: civilian workshops and frontier traffic return to ordinary life under the charter, with both Houses independent."
 HSM_VER_UI_ducal_independent_settlement_tt:0 "Opens §Y$hsm_ver_routes.2.t$§!: after the conference fails, our House commits to independent development without a common council."
 HSM_VER_UI_ducal_avian_offer_tt:0 "Invites Avian to an association. Avian may refuse; accession to a single state requires a later agreement."
 HSM_VER_UI_ducal_muster_tt:0 "Opens §Y$hsm_ver_eyrie.2.t$§!: choose public review of the muster rolls for civilian accountability at a political cost, or an army commission that strengthens the officers."
 HSM_VER_UI_ducal_command_policy_tt:0 "Opens §Y$hsm_ver_eyrie.10.t$§!: choose civic scrutiny of military demands, or give professional command defined responsibilities for defence."
 HSM_VER_UI_ducal_return_order_tt:0 "Opens §Y$hsm_ver_eyrie.30.t$§!: spend political power to return civilian workshops and settle the dispute, or protect military requisitions and suspend charter benefits."
 HSM_VER_UI_ducal_workshops_tt:0 "With the settlement valid, grants §G1 civilian factory and 1 shared building slot§! in an eligible, fully controlled owned core. If none is available, grants §G1 research bonus of +100% for construction technology§! instead. Awarded once."
