 HSM_BAR_mtk_tissue_bank_prepare_rig_a_tt:0 "Keep small identified skin and tendon samples in separate columns. Match each donation across the cabinet conditions, since a useful thin graft cannot establish that an entire organ has survived the same treatment."
 HSM_BAR_mtk_tissue_bank_prepare_rig_b:0 "Whole kidney comparison"
 HSM_BAR_mtk_tissue_bank_prepare_rig_b_tt:0 "Include whole kidney specimens as a distinct limitation test beside the thin grafts. Examine their internal channels after warming rather than accepting an unchanged colour or responsive magical pattern as evidence of living function."
 HSM_BAR_mtk_tissue_bank_control_question:0 "Which cabinet condition will test preservation's contribution?"
 HSM_BAR_mtk_tissue_bank_prepare_control_a:0 "Cold-only comparison"
 HSM_BAR_mtk_tissue_bank_prepare_control_a_tt:0 "Store a matched portion under cold alone and preserve its donor record. After warming, compare flexibility, passage and living margins, keeping shelf appearance secondary to the ability to continue without the preservation spell."
 HSM_BAR_mtk_tissue_bank_prepare_control_b:0 "Fixation-only comparison"
 HSM_BAR_mtk_tissue_bank_prepare_control_b_tt:0 "Store a matched portion under fixation without the cabinet's cold treatment. Keep post-warming examination identical, so an attractive specimen cannot change the definition of survival simply by continuing to answer the caster."
 HSM_BAR_mtk_tissue_bank_observation_0:0 "Thin grafts retain their outline, but their living margins differ after warming. Cold-only samples make appearance an unreliable guide to which specimens will remain useful. The cabinet needs acceptance after warming, with tissue classes kept separate throughout the examination."
 HSM_BAR_mtk_tissue_bank_experiment_report_a_0:0 "APPARATUS: Thin skin and tendon. Cold-only comparison.\n\nThin grafts retain their outline, but their living margins differ after warming. Cold-only samples make appearance an unreliable guide to which specimens will remain useful. The cabinet needs acceptance after warming, with tissue classes kept separate throughout the examination.\n\nTrial log addendum\nBatch checks retained only examined thin grafts with suitable living margins. The cold-only comparison supported a limited contribution from combined cold and fixation. The bank remains a partial success for selected skin and tendon within the tested interval. Every batch needs warming checks; whole kidneys failed. Neither hearts nor brains are established stock, and the failed graft remains in the clinical account."
 HSM_BAR_mtk_tissue_bank_verification_a_0:0 "Thin grafts retain their outline, but their living margins differ after warming. Cold-only samples make appearance an unreliable guide to which specimens will remain useful. The cabinet needs acceptance after warming, with tissue classes kept separate throughout the examination.\n\nVERIFICATION ORDERED: Rebuild batch acceptance\nCommission separate warming and passage checks for each tissue class. This spends more on examination but resolves organ appearances sooner; thin graft batches can instead establish their restricted interval through a longer cabinet series with existing equipment."
 HSM_BAR_mtk_tissue_bank_experiment_report_b_0:0 "APPARATUS: Thin skin and tendon. Cold-only comparison.\n\nThin grafts retain their outline, but their living margins differ after warming. Cold-only samples make appearance an unreliable guide to which specimens will remain useful. The cabinet needs acceptance after warming, with tissue classes kept separate throughout the examination.\n\nTrial log addendum\nRepeated warmed examinations separated useful thin graft batches from failures requiring replacement. The cold-only comparison supported a limited contribution from combined cold and fixation. Selected skin and tendon can be banked within the examined interval, with no universal organ supply. Donor records and batch checks remain inseparable from storage. Last Minute may use examined grafts, not an assumption that attractive preserved tissue is alive."
 HSM_BAR_mtk_tissue_bank_verification_b_0:0 "Thin grafts retain their outline, but their living margins differ after warming. Cold-only samples make appearance an unreliable guide to which specimens will remain useful. The cabinet needs acceptance after warming, with tissue classes kept separate throughout the examination.\n\nVERIFICATION ORDERED: Extend warmed follow-up\nKeep the cabinets and follow the same batches through warming and later examination. This saves new checking fixtures but takes longer when whole organs must be excluded from promising shelf appearances; thin grafts provide a clearer restricted comparison sooner."
