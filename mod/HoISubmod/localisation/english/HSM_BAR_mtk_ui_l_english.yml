 HSM_BAR_mtk_revolver_howitzer_rig_question:0 "Which inert arrangement will challenge the cylinder proposal?"
 HSM_BAR_mtk_revolver_howitzer_prepare_rig_a:0 "Complete yard model"
 HSM_BAR_mtk_revolver_howitzer_prepare_rig_a_tt:0 "Move the complete inert handling model through the ordinary yard route. Include turning and preparation, since the promise concerns a working cycle rather than the short interval the original drawing chose to count."
 HSM_BAR_mtk_revolver_howitzer_prepare_rig_b:0 "Separate handling benches"
 HSM_BAR_mtk_revolver_howitzer_prepare_rig_b_tt:0 "Distribute inert handling and inspection exercises across separate benches. This makes obstructed access easier to observe, but every measured task must still be returned to the full cycle before comparing the proposal with an ordinary piece."
 HSM_BAR_mtk_revolver_howitzer_control_question:0 "What must the comparison include?"
 HSM_BAR_mtk_revolver_howitzer_prepare_control_a:0 "Ordinary piece's journey"
 HSM_BAR_mtk_revolver_howitzer_prepare_control_a_tt:0 "Time the ordinary comparison piece over the same journey and preparation. Record the assistance each requires, keeping an impressive handling interval from concealing the work needed to reach the starting position."
 HSM_BAR_mtk_revolver_howitzer_prepare_control_b:0 "Simulated shared stoppage"
 HSM_BAR_mtk_revolver_howitzer_prepare_control_b_tt:0 "Insert a simulated stoppage into the inert handling sequence. Observe which tasks can continue and which wait, then include inspection and preparation for restart; the exercise remains entirely without firing."
 HSM_BAR_mtk_revolver_howitzer_observation_0:0 "The yard model needs extra assistance to turn; its apparent handling gain excludes that movement. The ordinary piece has already reached its position while the cylinder model is still being prepared. Leopold needs a complete cycle account before deciding whether any promised advantage survives."
 HSM_BAR_mtk_revolver_howitzer_experiment_report_a_0:0 "APPARATUS: Complete yard model. Ordinary piece's journey.\n\nThe yard model needs extra assistance to turn; its apparent handling gain excludes that movement. The ordinary piece has already reached its position while the cylinder model is still being prepared. Leopold needs a complete cycle account before deciding whether any promised advantage survives.\n\nTrial log addendum\nThe reconstructed yard cycle retained the burden of moving the complete model. The ordinary comparison required less assistance across the complete journey and preparation. The howitzer failed and is closed without adoption or practical benefit. Weight, access and shared delays cancel the promise. No firing trial occurred; the Manufactory must retain this rejected assumption about removing pauses."
 HSM_BAR_mtk_revolver_howitzer_verification_a_0:0 "The yard model needs extra assistance to turn; its apparent handling gain excludes that movement. The ordinary piece has already reached its position while the cylinder model is still being prepared. Leopold needs a complete cycle account before deciding whether any promised advantage survives.\n\nVERIFICATION ORDERED: Reconstruct the full cycle\nCommission a joined handling record from the inert exercises, counting transfer and inspection explicitly. This costs more analysis but closes separated bench measurements sooner; a complete yard model can instead supply the same account through another slower route."
 HSM_BAR_mtk_revolver_howitzer_experiment_report_b_0:0 "APPARATUS: Complete yard model. Ordinary piece's journey.\n\nThe yard model needs extra assistance to turn; its apparent handling gain excludes that movement. The ordinary piece has already reached its position while the cylinder model is still being prepared. Leopold needs a complete cycle account before deciding whether any promised advantage survives.\n\nTrial log addendum\nAnother yard journey confirmed that preparation consumed the handling interval supposedly saved. The ordinary comparison required less assistance across the complete journey and preparation. No useful weapon or lesser application emerged. The inert prototype is retired without firing. Its failure supplies no compensating benefit; the report stays with the Manufactory because combining operations does not remove their interruptions."
 HSM_BAR_mtk_revolver_howitzer_verification_b_0:0 "The yard model needs extra assistance to turn; its apparent handling gain excludes that movement. The ordinary piece has already reached its position while the cylinder model is still being prepared. Leopold needs a complete cycle account before deciding whether any promised advantage survives.\n\nVERIFICATION ORDERED: Repeat the handling route\nRetain the inert equipment and repeat a fully observed working cycle. This uses fewer commissioned calculations but occupies the crews longer when separate benches must be reunited; the yard model already has its journey available for direct comparison."
 HSM_BAR_mtk_revolver_howitzer_observation_1:0 "The yard model needs extra assistance to turn; its apparent handling gain excludes that movement. A simulated stoppage holds the entire sequence, leaving attendants waiting beside otherwise available tasks. Leopold needs a complete cycle account before deciding whether any promised advantage survives."
