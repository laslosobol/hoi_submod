 HSM_BAR_mtk_spell_sterilisation_rig_question:0 "Which instrument surface should challenge the two passes?"
 HSM_BAR_mtk_spell_sterilisation_prepare_rig_a:0 "Opened instrument joints"
 HSM_BAR_mtk_spell_sterilisation_prepare_rig_a_tt:0 "Begin with cleaned instruments whose joints are held open. Sample the exposed blades and inner surfaces separately, since a clean-looking tray cannot establish that every previously sheltered part received the same treatment."
 HSM_BAR_mtk_spell_sterilisation_prepare_rig_b:0 "Closed comparison hinges"
 HSM_BAR_mtk_spell_sterilisation_prepare_rig_b_tt:0 "Keep a separate comparison set closed during treatment and sample inside afterwards. The comparison tests access to hidden contamination, not whether a brighter visible flash can stand in for examination of a hinge."
 HSM_BAR_mtk_spell_sterilisation_control_question:0 "Which residue needs an independent check?"
 HSM_BAR_mtk_spell_sterilisation_prepare_control_a:0 "Culture swabs"
 HSM_BAR_mtk_spell_sterilisation_prepare_control_a_tt:0 "Take culture swabs after treatment, including the hinges rather than only polished blades. Keep ordinary sterilisation as a comparison; absence of visible dirt is not the same observation as absence of subsequent growth."
 HSM_BAR_mtk_spell_sterilisation_prepare_control_b:0 "Unenchanted test crystal"
 HSM_BAR_mtk_spell_sterilisation_prepare_control_b_tt:0 "Expose an unenchanted crystal to deliberately charmed instruments after the unwinding pass. Check the surrounding tray too, since removing a binding must not merely transfer its remnant to the next contacting surface."
 HSM_BAR_mtk_spell_sterilisation_observation_0:0 "Opened joints expose the full surface, but the two passes need separate verification. The culture comparison has not yet cleared every sampled hinge. The procedure needs verified access and distinct contamination checks before acceptance."
 HSM_BAR_mtk_spell_sterilisation_experiment_report_a_0:0 "APPARATUS: Opened instrument joints. Culture swabs.\n\nOpened joints expose the full surface, but the two passes need separate verification. The culture comparison has not yet cleared every sampled hinge. The procedure needs verified access and distinct contamination checks before acceptance.\n\nTrial log addendum\nThe fixture kept opened surfaces accessible throughout both passes. Repeated cultures cleared the revised opened-joint procedure on tested instruments. Sterilisation succeeds on cleaned, opened instruments. Fittings need inspection; cloth, wood and living wounds remain untested."
 HSM_BAR_mtk_spell_sterilisation_verification_a_0:0 "Opened joints expose the full surface, but the two passes need separate verification. The culture comparison has not yet cleared every sampled hinge. The procedure needs verified access and distinct contamination checks before acceptance.\n\nVERIFICATION ORDERED: Rework the access fixture\nCommission a fixture that holds joints open and separates the two treatment checks. This costs more preparation but resolves closed-hinge failures promptly; an already open set may establish its procedure through a longer comparison using existing trays."
 HSM_BAR_mtk_spell_sterilisation_experiment_report_b_0:0 "APPARATUS: Opened instrument joints. Culture swabs.\n\nOpened joints expose the full surface, but the two passes need separate verification. The culture comparison has not yet cleared every sampled hinge. The procedure needs verified access and distinct contamination checks before acceptance.\n\nTrial log addendum\nRepeated open-set comparisons separated the effects of the two passes. Repeated cultures cleared the revised opened-joint procedure on tested instruments. The revised procedure clears tested instruments and residual charms. It supplies Last Minute with checked tools, not treatment for living wounds."
 HSM_BAR_mtk_spell_sterilisation_verification_b_0:0 "Opened joints expose the full surface, but the two passes need separate verification. The culture comparison has not yet cleared every sampled hinge. The procedure needs verified access and distinct contamination checks before acceptance.\n\nVERIFICATION ORDERED: Repeat tray comparisons\nRetain the trays and extend paired comparisons, opening any failed joint before repeating treatment. This saves fixture costs but takes longer for closed instruments; exposed surfaces already provide the clearer record for separating culture results from residual enchantment."
 HSM_BAR_mtk_spell_sterilisation_observation_1:0 "Opened joints expose the full surface, but the two passes need separate verification. A charmed fitting cracks during unwinding, requiring a check beyond the blade. The procedure needs verified access and distinct contamination checks before acceptance."
