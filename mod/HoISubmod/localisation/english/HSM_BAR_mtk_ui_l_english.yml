 HSM_BAR_mtk_sorting_engine_rig_question:0 "Which comparison specimens should enter the sorting feed?"
 HSM_BAR_mtk_sorting_engine_prepare_rig_a:0 "Clean known parts"
 HSM_BAR_mtk_sorting_engine_prepare_rig_a_tt:0 "Feed clean specimens from the named workshop families alongside their labelled references. Keep the undecided destination open, since the trial concerns restricted comparison and must not assume every incoming object belongs to a prepared class."
 HSM_BAR_mtk_sorting_engine_prepare_rig_b:0 "Worn comparison parts"
 HSM_BAR_mtk_sorting_engine_prepare_rig_b_tt:0 "Mix worn examples with the named references and record every destination before adjustment. Wear may make a familiar article resemble another class, which tests the boundary of the comparison rather than the object's true purpose."
 HSM_BAR_mtk_sorting_engine_control_question:0 "What should challenge a plausible match?"
 HSM_BAR_mtk_sorting_engine_prepare_control_a:0 "Changed feed order"
 HSM_BAR_mtk_sorting_engine_prepare_control_a_tt:0 "Reorder the same specimens without altering the reference trays. An independent fitter inspects the destinations, asking whether each correct match survives a different sequence rather than a memorized demonstration arrangement."
 HSM_BAR_mtk_sorting_engine_prepare_control_b:0 "Same outline, new material"
 HSM_BAR_mtk_sorting_engine_prepare_control_b_tt:0 "Add a specimen whose outline matches but whose material is unsuitable for the intended work. Record shape recognition separately from acceptance, giving the fitter a direct challenge to the machine's apparently confident classification."
 HSM_BAR_mtk_sorting_engine_observation_0:0 "Clean examples reach their named trays, although the machine offers no reason beyond the supplied comparisons. Changing feed order leaves an apparent match that still awaits the fitter's independent destination check. Doubtful matches need a visible destination or revised references before preliminary sorting can be distinguished from final acceptance."
 HSM_BAR_mtk_sorting_engine_experiment_report_a_0:0 "APPARATUS: Clean known parts. Changed feed order.\n\nClean examples reach their named trays, although the machine offers no reason beyond the supplied comparisons. Changing feed order leaves an apparent match that still awaits the fitter's independent destination check. Doubtful matches need a visible destination or revised references before preliminary sorting can be distinguished from final acceptance.\n\nTrial log addendum\nRebuilt references confirmed the narrow clean families without granting the machine an account of purpose. Changed feed order preserved the checked matches within the known clean families. The partial result is preliminary sorting of known clean parts. Uncertainty still reaches a fitter, and new classes need new trials. The engine infers no purpose and learns no trade; the Manufactory must retain its undecided destination."
 HSM_BAR_mtk_sorting_engine_verification_a_0:0 "Clean examples reach their named trays, although the machine offers no reason beyond the supplied comparisons. Changing feed order leaves an apparent match that still awaits the fitter's independent destination check. Doubtful matches need a visible destination or revised references before preliminary sorting can be distinguished from final acceptance.\n\nVERIFICATION ORDERED: Rebuild the references\nCommission checked reference specimens around the disputed class boundary. This costs more workshop preparation but resolves worn-part ambiguity sooner; clean families with an order question usually need less rebuilding and can be checked by extended destination inspection."
 HSM_BAR_mtk_sorting_engine_experiment_report_b_0:0 "APPARATUS: Clean known parts. Changed feed order.\n\nClean examples reach their named trays, although the machine offers no reason beyond the supplied comparisons. Changing feed order leaves an apparent match that still awaits the fitter's independent destination check. Doubtful matches need a visible destination or revised references before preliminary sorting can be distinguished from final acceptance.\n\nTrial log addendum\nExtended clean-part inspection confirmed repeatable preliminary destinations under the existing reference set. Changed feed order preserved the checked matches within the known clean families. Acceptance stays partial and supervised. References require upkeep, doubtful objects require inspection, and material can outweigh outline. The machine has not discovered an object's intention or acquired independent judgment; it repeats the comparisons supplied by the workshop."
 HSM_BAR_mtk_sorting_engine_verification_b_0:0 "Clean examples reach their named trays, although the machine offers no reason beyond the supplied comparisons. Changing feed order leaves an apparent match that still awaits the fitter's independent destination check. Doubtful matches need a visible destination or revised references before preliminary sorting can be distinguished from final acceptance.\n\nVERIFICATION ORDERED: Extend destination checks\nKeep the reference set and have the fitter inspect a longer sequence, diverting doubtful readings visibly. This saves specimen commissions but costs more time on worn stock; clean parts can establish the feed-order comparison with fewer disputed destinations."
