 HSM_BAR_mtk_shared_senses_rig_question:0 "What will the sender attend to?"
 HSM_BAR_mtk_shared_senses_prepare_rig_a:0 "Stationary outline"
 HSM_BAR_mtk_shared_senses_prepare_rig_a_tt:0 "Offer a simple card that stays still throughout the session. Keep the receiver's ordinary view unobstructed, allowing the offered outline to be drawn separately from the room around the station."
 HSM_BAR_mtk_shared_senses_prepare_rig_b:0 "Moving outline"
 HSM_BAR_mtk_shared_senses_prepare_rig_b_tt:0 "Move the same card slowly across the sender's view. This tests whether direction travels with the outline, while the receiver keeps an independent interruption and can end an uncomfortable exchange."
 HSM_BAR_mtk_shared_senses_control_question:0 "Which comparison will accompany the offered image?"
 HSM_BAR_mtk_shared_senses_prepare_control_a:0 "Inactive connection"
 HSM_BAR_mtk_shared_senses_prepare_control_a_tt:0 "Interleave inactive connections without showing their order to the reader of the drawings. A plausible outline matters only if active transmission differs from guesses made with the same card selection."
 HSM_BAR_mtk_shared_senses_prepare_control_b:0 "Imagined card"
 HSM_BAR_mtk_shared_senses_prepare_control_b_tt:0 "Ask the sender to imagine the card during separate comparison sessions. Keep those drawings apart from viewed cards so confidence or remembered colour cannot silently substitute for a transmitted visual feature."
 HSM_BAR_mtk_shared_senses_observation_0:0 "The stationary card leaves a recognizable outline in the receiver's drawing, although its pale colour arrives as brightness. Inactive sessions also produce confident sketches, so the active drawings still need comparison without their labels. The link needs a narrower offered feature or a longer comparison before these impressions can be treated as a usable exchange."
 HSM_BAR_mtk_shared_senses_experiment_report_a_0:0 "APPARATUS: Stationary outline. Inactive connection.\n\nThe stationary card leaves a recognizable outline in the receiver's drawing, although its pale colour arrives as brightness. Inactive sessions also produce confident sketches, so the active drawings still need comparison without their labels. The link needs a narrower offered feature or a longer comparison before these impressions can be treated as a usable exchange.\n\nTrial log addendum\nThe fixed mask preserved the stationary edge while colour was removed from the transmission claim. The inactive comparison failed to reproduce the active agreement on simple stationary outlines. A brief local exchange of deliberately offered outlines is retained. Independent stops and an ordinary view remain necessary. Colour, movement and whole experience are outside the finding; the connection does not make another observer's confidence a reliable measurement."
 HSM_BAR_mtk_shared_senses_verification_a_0:0 "The stationary card leaves a recognizable outline in the receiver's drawing, although its pale colour arrives as brightness. Inactive sessions also produce confident sketches, so the active drawings still need comparison without their labels. The link needs a narrower offered feature or a longer comparison before these impressions can be treated as a usable exchange.\n\nVERIFICATION ORDERED: Restrict the offered image\nPrepare a fixed outline mask and recalibrate the offered feature. Extra apparatus work can resolve a moving-card mismatch promptly; a station already holding a still card may reach the same restricted procedure more economically through comparison."
 HSM_BAR_mtk_shared_senses_experiment_report_b_0:0 "APPARATUS: Stationary outline. Inactive connection.\n\nThe stationary card leaves a recognizable outline in the receiver's drawing, although its pale colour arrives as brightness. Inactive sessions also produce confident sketches, so the active drawings still need comparison without their labels. The link needs a narrower offered feature or a longer comparison before these impressions can be treated as a usable exchange.\n\nTrial log addendum\nRepeated stationary drawings agreed on outline while continuing to disagree about hue. The inactive comparison failed to reproduce the active agreement on simple stationary outlines. The comparison supports selected stationary features, not shared awareness. Sessions stay brief and local, with each participant able to withdraw. Disagreeing drawings remain separate in the file; no composite image is allowed to conceal the limits of the partial result."
 HSM_BAR_mtk_shared_senses_verification_b_0:0 "The stationary card leaves a recognizable outline in the receiver's drawing, although its pale colour arrives as brightness. Inactive sessions also produce confident sketches, so the active drawings still need comparison without their labels. The link needs a narrower offered feature or a longer comparison before these impressions can be treated as a usable exchange.\n\nVERIFICATION ORDERED: Compare separate drawings\nExtend rested sessions and have Leopold compare the separate drawings before opening the labels. This uses fewer new fittings but takes longer after motion trials, since discomfort ends a session rather than becoming another observation to push through."
 HSM_BAR_mtk_shared_senses_observation_1:0 "The stationary card leaves a recognizable outline in the receiver's drawing, although its pale colour arrives as brightness. Imagined cards yield especially confident colour names but disagree with the outlines drawn during direct viewing. The link needs a narrower offered feature or a longer comparison before these impressions can be treated as a usable exchange."
 HSM_BAR_mtk_shared_senses_experiment_report_a_1:0 "APPARATUS: Stationary outline. Imagined card.\n\nThe stationary card leaves a recognizable outline in the receiver's drawing, although its pale colour arrives as brightness. Imagined cards yield especially confident colour names but disagree with the outlines drawn during direct viewing. The link needs a narrower offered feature or a longer comparison before these impressions can be treated as a usable exchange.\n\nTrial log addendum\nThe fixed mask preserved the stationary edge while colour was removed from the transmission claim. Imagined cards remained unreliable and were excluded from the accepted viewing procedure. A brief local exchange of deliberately offered outlines is retained. Independent stops and an ordinary view remain necessary. Colour, movement and whole experience are outside the finding; the connection does not make another observer's confidence a reliable measurement."
