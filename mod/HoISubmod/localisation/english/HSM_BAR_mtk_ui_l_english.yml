 HSM_BAR_mtk_sleep_lecture_rig_question:0 "How will unfamiliar signs be presented during observed sleep?"
 HSM_BAR_mtk_sleep_lecture_prepare_rig_a:0 "Spoken sign lesson"
 HSM_BAR_mtk_sleep_lecture_prepare_rig_a_tt:0 "Play an explanation of unfamiliar signs after the sleeper settles. Record delivery separately from morning recall, since hearing a voice or dreaming of a classroom cannot establish that its rule was learned."
 HSM_BAR_mtk_sleep_lecture_prepare_rig_b:0 "Repeated sign sequence"
 HSM_BAR_mtk_sleep_lecture_prepare_rig_b_tt:0 "Present the same unfamiliar sequence again during the observed interval. Keep the recording intact for inspection, and record disturbed rest before interpreting familiarity with its sounds as understanding of their order."
 HSM_BAR_mtk_sleep_lecture_control_question:0 "What will the morning examiner compare with the sleep lesson?"
 HSM_BAR_mtk_sleep_lecture_prepare_control_a:0 "Quiet comparison night"
 HSM_BAR_mtk_sleep_lecture_prepare_control_a_tt:0 "Leave the apparatus inactive on a comparison night and conceal the schedule from the examiner. Recognition, explanation and a new arrangement receive separate entries rather than a single impression of improvement."
 HSM_BAR_mtk_sleep_lecture_prepare_control_b:0 "Separate waking lesson"
 HSM_BAR_mtk_sleep_lecture_prepare_control_b_tt:0 "Teach a matched sign set to an awake class. The examiner asks for the rule in new arrangements, giving the sleep hypothesis a comparison that actually demonstrates understanding rather than recognition."
 HSM_BAR_mtk_sleep_lecture_observation_0:0 "After the spoken lesson, sleepers describe a classroom voice but hesitate when asked to explain an unfamiliar sign. Quiet-night accounts also contain apparent recognition, and the examiner has not yet exchanged the morning cards. Silver requests a rested examination that separates a familiar sound from usable knowledge before another night is assigned to this proposal."
 HSM_BAR_mtk_sleep_lecture_experiment_report_a_0:0 "APPARATUS: Spoken sign lesson. Quiet comparison night.\n\nAfter the spoken lesson, sleepers describe a classroom voice but hesitate when asked to explain an unfamiliar sign. Quiet-night accounts also contain apparent recognition, and the examiner has not yet exchanged the morning cards. Silver requests a rested examination that separates a familiar sound from usable knowledge before another night is assigned to this proposal.\n\nTrial log addendum\nFresh cards removed the spoken lesson's apparent recognition while its recorded delivery remained complete. Quiet-night recognition disappeared when the examiner exchanged the cards without changing the rule. The sleeping lecture failed. Dream accounts establish neither learning nor a useful teaching substitute, and no compensating practical benefit emerged. Further sleep instruction is withdrawn. This rejected premise must accompany the Chorus: receiving a signal does not demonstrate understanding."
 HSM_BAR_mtk_sleep_lecture_verification_a_0:0 "After the spoken lesson, sleepers describe a classroom voice but hesitate when asked to explain an unfamiliar sign. Quiet-night accounts also contain apparent recognition, and the examiner has not yet exchanged the morning cards. Silver requests a rested examination that separates a familiar sound from usable knowledge before another night is assigned to this proposal.\n\nVERIFICATION ORDERED: Exchange the morning cards\nCommission fresh matched cards and repeat the examination after rest. This costs more preparation but resolves the recognition claim promptly when the recording is simple; repeated sequences first require time to separate fatigue from the answers."
