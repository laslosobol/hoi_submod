 HSM_BAR_mtk_manufactory_rig_question:0 "Which approved articles should the supervised line repeat?"
 HSM_BAR_mtk_manufactory_prepare_rig_a:0 "Housing sequence"
 HSM_BAR_mtk_manufactory_prepare_rig_a_tt:0 "Assemble the approved housing sequence with each operation visible from the service aisle. Keep interchangeable patterns distinct from personal fittings, and retain a place for inspection before an article is accepted as finished."
 HSM_BAR_mtk_manufactory_prepare_rig_b:0 "Fitting sequence"
 HSM_BAR_mtk_manufactory_prepare_rig_b_tt:0 "Repeat the documented workshop fitting pattern while keeping an unfamiliar fitting outside the accepted order. Shared parts do not establish a universal fit, and the line must not improvise a drawing for an unlisted article."
 HSM_BAR_mtk_manufactory_control_question:0 "Which interruption must the line handle visibly?"
 HSM_BAR_mtk_manufactory_prepare_control_a:0 "Stop one station"
 HSM_BAR_mtk_manufactory_prepare_control_a_tt:0 "Stop a station during the approved sequence while watching its neighbours. Their current tasks and restart must remain separate, applying the rejected howitzer's lesson without claiming that its failed mechanism produced a useful machine."
 HSM_BAR_mtk_manufactory_prepare_control_b:0 "Uncertain blank"
 HSM_BAR_mtk_manufactory_prepare_control_b_tt:0 "Introduce a doubtful blank before the reference comparison and keep the fitter beside the undecided tray. The test asks whether uncertainty remains visible rather than disappearing into an apparently smooth manufacturing sequence."
 HSM_BAR_mtk_manufactory_observation_0:0 "The housing sequence repeats its motions, but the handover sheet omits an attendant's adjustment. A stopped station leaves neighbouring attendants unsure whether their completed tasks may be released. The line needs explicit handovers before repetition can count as supervised manufacture."
 HSM_BAR_mtk_manufactory_experiment_report_a_0:0 "APPARATUS: Housing sequence. Stop one station.\n\nThe housing sequence repeats its motions, but the handover sheet omits an attendant's adjustment. A stopped station leaves neighbouring attendants unsure whether their completed tasks may be released. The line needs explicit handovers before repetition can count as supervised manufacture.\n\nTrial log addendum\nRevised housing handovers named the attendant's adjustment before release. Separate stops allowed neighbouring stations to finish and restart without a shared blockage. The Manufactory succeeds under supervision. Prosthetics supplies checked patterns; Self-Repair requires staff and stocks; the failed Howitzer mandates separate stops; Crystal Drive needs sources and cooling; Sorting Engine keeps uncertainty with a fitter. No mechanism thinks or contains a bound soul, and new work requires trials."
 HSM_BAR_mtk_manufactory_verification_a_0:0 "The housing sequence repeats its motions, but the handover sheet omits an attendant's adjustment. A stopped station leaves neighbouring attendants unsure whether their completed tasks may be released. The line needs explicit handovers before repetition can count as supervised manufacture.\n\nVERIFICATION ORDERED: Rebuild station handovers\nCommission clearer station boundaries and signed handover sheets. This spends workshop effort to settle fitting exceptions promptly; the repeated housing sequence can instead expose its missing interventions through a longer supervised run using the current arrangement."
 HSM_BAR_mtk_manufactory_experiment_report_b_0:0 "APPARATUS: Housing sequence. Stop one station.\n\nThe housing sequence repeats its motions, but the handover sheet omits an attendant's adjustment. A stopped station leaves neighbouring attendants unsure whether their completed tasks may be released. The line needs explicit handovers before repetition can count as supervised manufacture.\n\nTrial log addendum\nThe extended housing run made the omitted adjustment a recorded service operation. Separate stops allowed neighbouring stations to finish and restart without a shared blockage. Accepted manufacture remains bounded by all five studies: Prosthetics patterns, staffed Self-Repair, separate stops learned from the failed Howitzer, cooled Crystal Drive, and supervised Sorting Engine. The failed gun gains no practical benefit. Output needs inspection; unknown orders produce no invented task or independent thought."
