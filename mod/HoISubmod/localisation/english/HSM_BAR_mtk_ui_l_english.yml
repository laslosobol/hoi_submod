 HSM_BAR_mtk_field_atlas_rig_question:0 "Where will the atlas stand take its first survey?"
 HSM_BAR_mtk_field_atlas_prepare_rig_a:0 "Teaching room"
 HSM_BAR_mtk_field_atlas_prepare_rig_a_tt:0 "Place the crystal stand beside the familiar light charm. Separate sheets record source position and the observer's facing, so a bright impression cannot quietly become a boundary on the map."
 HSM_BAR_mtk_field_atlas_prepare_rig_b:0 "Workshop wall"
 HSM_BAR_mtk_field_atlas_prepare_rig_b_tt:0 "Survey beside the working instruments, keeping their positions on a removable overlay. This exposes interference immediately, but tracing a boundary will require distinguishing the charm from neighbouring enchanted tools."
 HSM_BAR_mtk_field_atlas_control_question:0 "What should change while the stand remains fixed?"
 HSM_BAR_mtk_field_atlas_prepare_control_a:0 "Exchange readers"
 HSM_BAR_mtk_field_atlas_prepare_control_a_tt:0 "Let unfamiliar readers draw the same disturbance without seeing earlier sheets. Differences in reported brightness remain attributed to their perception until a shared boundary survives the exchange of observers."
 HSM_BAR_mtk_field_atlas_prepare_control_b:0 "Blank charm intervals"
 HSM_BAR_mtk_field_atlas_prepare_control_b_tt:0 "Have Silver conceal intervals when the light charm is absent. Leave the stand and nearby equipment in place, since a residual mark may belong to another source rather than anticipation."
 HSM_BAR_mtk_field_atlas_observation_0:0 "The teaching-room sheet gives the charm a narrow edge, but its faint side differs between successive drawings. Exchanged readers disagree about brightness while keeping their marks near the same part of the stand. The next survey must separate source movement from perception and interference before anyone inks a dependable boundary onto the atlas."
 HSM_BAR_mtk_field_atlas_experiment_report_a_0:0 "APPARATUS: Teaching room. Exchange readers.\n\nThe teaching-room sheet gives the charm a narrow edge, but its faint side differs between successive drawings. Exchanged readers disagree about brightness while keeping their marks near the same part of the stand. The next survey must separate source movement from perception and interference before anyone inks a dependable boundary onto the atlas.\n\nTrial log addendum\nSeparate sheets isolated the teaching-room edge without absorbing the readers' brightness judgments into it. Fresh readers recovered the corrected boundary despite continuing differences in perceived brightness. The atlas now supports repeatable local surveys under the recorded conditions. Rain and changed apparatus still leave uncertain edges; those remain marked as uncertain, preserving a shared reference without pretending that every impression has become measurable."
 HSM_BAR_mtk_field_atlas_verification_a_0:0 "The teaching-room sheet gives the charm a narrow edge, but its faint side differs between successive drawings. Exchanged readers disagree about brightness while keeping their marks near the same part of the stand. The next survey must separate source movement from perception and interference before anyone inks a dependable boundary onto the atlas.\n\nVERIFICATION ORDERED: Separate the overlays\nRebuild the source and interference overlays with workshop assistance. This spends more on drawing and alignment but shortens a workshop resurvey; in the quiet teaching room, following the source directly needs less reconstruction."
 HSM_BAR_mtk_field_atlas_experiment_report_b_0:0 "APPARATUS: Teaching room. Exchange readers.\n\nThe teaching-room sheet gives the charm a narrow edge, but its faint side differs between successive drawings. Exchanged readers disagree about brightness while keeping their marks near the same part of the stand. The next survey must separate source movement from perception and interference before anyone inks a dependable boundary onto the atlas.\n\nTrial log addendum\nMoving the charm across the teaching room shifted the mapped edge while the stand remained fixed. Fresh readers recovered the corrected boundary despite continuing differences in perceived brightness. The accepted atlas records a source another team can locate, with separate layers for interference and perception. Its sheets retain the weather and apparatus conditions of the survey. Weak boundaries remain unresolved when those conditions no longer hold."
 HSM_BAR_mtk_field_atlas_verification_b_0:0 "The teaching-room sheet gives the charm a narrow edge, but its faint side differs between successive drawings. Exchanged readers disagree about brightness while keeping their marks near the same part of the stand. The next survey must separate source movement from perception and interference before anyone inks a dependable boundary onto the atlas.\n\nVERIFICATION ORDERED: Follow the moved source\nKeep the existing stand and repeat the route as the charm moves. This saves commissioned overlays but ties up observers longer near working instruments; the teaching-room route can settle the spatial question with fewer appointments."
 HSM_BAR_mtk_field_atlas_observation_1:0 "The teaching-room sheet gives the charm a narrow edge, but its faint side differs between successive drawings. The concealed blank intervals leave a faint mark whose source has not yet been separated from the room. The next survey must separate source movement from perception and interference before anyone inks a dependable boundary onto the atlas."
 HSM_BAR_mtk_field_atlas_experiment_report_a_1:0 "APPARATUS: Teaching room. Blank charm intervals.\n\nThe teaching-room sheet gives the charm a narrow edge, but its faint side differs between successive drawings. The concealed blank intervals leave a faint mark whose source has not yet been separated from the room. The next survey must separate source movement from perception and interference before anyone inks a dependable boundary onto the atlas.\n\nTrial log addendum\nSeparate sheets isolated the teaching-room edge without absorbing the readers' brightness judgments into it. Concealed blanks stayed empty once the separately recorded interference was accounted for. The atlas now supports repeatable local surveys under the recorded conditions. Rain and changed apparatus still leave uncertain edges; those remain marked as uncertain, preserving a shared reference without pretending that every impression has become measurable."
