 HSM_BAR_mtk_self_repair_rig_question:0 "Which fault will the practice assembly present?"
 HSM_BAR_mtk_self_repair_prepare_rig_a:0 "Familiar loose joint"
 HSM_BAR_mtk_self_repair_prepare_rig_a_tt:0 "Introduce the loose assembly named on the drawing and observe its warning before touching the service fixture. Record the attendant's actions alongside the machine, including inspection, supplies and permission to restart."
 HSM_BAR_mtk_self_repair_prepare_rig_b:0 "Unfamiliar misalignment"
 HSM_BAR_mtk_self_repair_prepare_rig_b_tt:0 "Present an alignment fault outside the named service sequence. A familiar warning may still appear, but the test asks whether it identifies the required work rather than merely announcing that something has changed."
 HSM_BAR_mtk_self_repair_control_question:0 "What should challenge the warning's interpretation?"
 HSM_BAR_mtk_self_repair_prepare_control_a:0 "Clean service bench"
 HSM_BAR_mtk_self_repair_prepare_control_a_tt:0 "Keep the indicator clean and have a fitter inspect the stopped assembly independently. This comparison can show whether an apparently precise warning actually distinguishes adjustment from replacement of a damaged component."
 HSM_BAR_mtk_self_repair_prepare_control_b:0 "Dust on the indicator"
 HSM_BAR_mtk_self_repair_prepare_control_b_tt:0 "Allow ordinary workshop dust to obscure the indicator during a separate practice run. Keep the fitter's inspection available, since silence from a covered warning must not be mistaken for an undamaged assembly."
 HSM_BAR_mtk_self_repair_observation_0:0 "The familiar loose joint triggers its warning and reaches the maintenance stop, but restoration still waits for a fitter. On the clean bench, inspection finds more work than the machine's neat warning description records. The sequence needs an explicit human inspection and material account before an assisted adjustment can be distinguished from the proposed self-repair."
 HSM_BAR_mtk_self_repair_experiment_report_a_0:0 "APPARATUS: Familiar loose joint. Clean service bench.\n\nThe familiar loose joint triggers its warning and reaches the maintenance stop, but restoration still waits for a fitter. On the clean bench, inspection finds more work than the machine's neat warning description records. The sequence needs an explicit human inspection and material account before an assisted adjustment can be distinguished from the proposed self-repair.\n\nTrial log addendum\nThe loose-joint sheet now names the fitter who adjusts and approves the restored assembly. Independent inspection retained responsibility for deciding whether adjustment or replacement was required. The partial result is assisted maintenance with prepared stocks and accessible service points. Cracked parts stay cracked until replaced; the machine diagnoses no arbitrary damage and makes no missing material. The Manufactory will need a staffed workshop, not an unexplained healing step."
 HSM_BAR_mtk_self_repair_verification_a_0:0 "The familiar loose joint triggers its warning and reaches the maintenance stop, but restoration still waits for a fitter. On the clean bench, inspection finds more work than the machine's neat warning description records. The sequence needs an explicit human inspection and material account before an assisted adjustment can be distinguished from the proposed self-repair.\n\nVERIFICATION ORDERED: Rebuild the service sheet\nCommission an explicit service sequence with named inspection and replacement points. It costs more drafting but resolves unfamiliar warnings sooner; a familiar loose joint can be followed with the existing fixture and a longer attendant log."
 HSM_BAR_mtk_self_repair_experiment_report_b_0:0 "APPARATUS: Familiar loose joint. Clean service bench.\n\nThe familiar loose joint triggers its warning and reaches the maintenance stop, but restoration still waits for a fitter. On the clean bench, inspection finds more work than the machine's neat warning description records. The sequence needs an explicit human inspection and material account before an assisted adjustment can be distinguished from the proposed self-repair.\n\nTrial log addendum\nThe extended loose-joint log assigned restoration to the fixture and fitter rather than to autonomous repair. Independent inspection retained responsibility for deciding whether adjustment or replacement was required. The retained procedure helps attendants maintain familiar assemblies. Its warnings remain limited, and a fitter must approve every restart. No fractured component regenerated. For the Manufactory, the useful requirement is visible maintenance labour and stocks, not a machine capable of healing itself."
 HSM_BAR_mtk_self_repair_verification_b_0:0 "The familiar loose joint triggers its warning and reaches the maintenance stop, but restoration still waits for a fitter. On the clean bench, inspection finds more work than the machine's neat warning description records. The sequence needs an explicit human inspection and material account before an assisted adjustment can be distinguished from the proposed self-repair.\n\nVERIFICATION ORDERED: Follow each attendant\nExtend bench observations and record every adjustment, cleaning and supplied part. Existing tools keep the invoice smaller, but unfamiliar damage occupies the bench longer; familiar wear can be traced without commissioning an entirely revised service drawing first."
