 HSM_BAR_mtk_ritual_brake_rig_question:0 "Who will initiate the ending of the sustained ritual?"
 HSM_BAR_mtk_ritual_brake_prepare_rig_a:0 "Singer falls silent"
 HSM_BAR_mtk_ritual_brake_prepare_rig_a_tt:0 "Begin with the singer withdrawing the opening phrase while observers watch the remaining field. This distinguishes an audible ending from the stored rhythm that can continue after the voice has already ceased."
 HSM_BAR_mtk_ritual_brake_prepare_rig_b:0 "Assistant interrupts"
 HSM_BAR_mtk_ritual_brake_prepare_rig_b_tt:0 "Let the assistant call the brake while the singer continues the opening phrase. Keep the drum within the assistant's reach, since an independent interruption cannot depend on persuading the absorbed leader to cooperate first."
