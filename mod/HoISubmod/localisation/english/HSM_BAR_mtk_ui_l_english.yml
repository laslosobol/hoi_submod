 HSM_BAR_mtk_silent_witness_rig_question:0 "Which claim will the purported witness be asked to establish?"
 HSM_BAR_mtk_silent_witness_prepare_rig_a:0 "Concealed marked box"
 HSM_BAR_mtk_silent_witness_prepare_rig_a_tt:0 "Ask about a prepared mark in a covered box whose contents the sitters do not know. Fix the answer before revealing the target, keeping persuasive tone separate from an independently checkable statement."
 HSM_BAR_mtk_silent_witness_prepare_rig_b:0 "Record held elsewhere"
 HSM_BAR_mtk_silent_witness_prepare_rig_b_tt:0 "Ask about a prepared historical detail whose checking record is held elsewhere. Keep the question wording fixed, since a suggested surname or leading pause can supply a story without establishing information beyond the listeners' knowledge."
 HSM_BAR_mtk_silent_witness_control_question:0 "What should expose confidence without knowledge?"
 HSM_BAR_mtk_silent_witness_prepare_control_a:0 "Empty box or absent entry"
 HSM_BAR_mtk_silent_witness_prepare_control_a_tt:0 "Include a blank target appropriate to the series: an empty box or a record without the claimed detail. The witness must be allowed to supply no answer, rather than earning agreement simply by continuing to speak."
 HSM_BAR_mtk_silent_witness_prepare_control_b:0 "Invented witness name"
 HSM_BAR_mtk_silent_witness_prepare_control_b_tt:0 "Use an invented name while retaining the same target and question form. Compare the fixed transcript before discussing plausibility; a convincing childhood or familiar voice cannot authenticate the identity that the question itself supplied."
 HSM_BAR_mtk_silent_witness_observation_0:0 "The box receives a confident description before its concealed mark is revealed. A blank target receives an equally assured answer. The account needs fixed questioning and independent comparison before anyone accepts its claimed source."
 HSM_BAR_mtk_silent_witness_experiment_report_a_0:0 "APPARATUS: Concealed marked box. Empty box or absent entry.\n\nThe box receives a confident description before its concealed mark is revealed. A blank target receives an equally assured answer. The account needs fixed questioning and independent comparison before anyone accepts its claimed source.\n\nTrial log addendum\nFixed box questions did not improve answers beyond guessing. Blank targets exposed confident descriptions without corresponding facts. Silent Witness failed: no dependable testimony, identification or unknown information. It serves neither investigators nor bereaved families. Contact requires fresh challenges."
 HSM_BAR_mtk_silent_witness_verification_a_0:0 "The box receives a confident description before its concealed mark is revealed. A blank target receives an equally assured answer. The account needs fixed questioning and independent comparison before anyone accepts its claimed source.\n\nVERIFICATION ORDERED: Remove leading pauses\nCommission a fixed delivery of the questions, including their pauses, before repeating the comparisons. This spends more preparation but untangles record stories sooner; concealed boxes already have a simple target that can be checked through a longer transcript review."
