 HSM_BAR_mtk_last_minute_rig_question:0 "Which handover should the emergency circuit rehearse?"
 HSM_BAR_mtk_last_minute_prepare_rig_a:0 "Support into surgery"
 HSM_BAR_mtk_last_minute_prepare_rig_a_tt:0 "Rehearse temporary structural support until the clinician takes over. Keep circulation and breathing active throughout, since the failed Ageless Sleep study rules out claiming that a motionless patient has safely stepped outside ordinary bodily needs."
 HSM_BAR_mtk_last_minute_prepare_rig_b:0 "Release to ordinary care"
 HSM_BAR_mtk_last_minute_prepare_rig_b_tt:0 "Rehearse gradual withdrawal as ordinary function returns, with an immediate clinical release available. The circuit must yield to treatment, and the record must keep the unsuccessful cases visible alongside those that reach definitive care."
 HSM_BAR_mtk_last_minute_control_question:0 "Which independent record will challenge an apparently stable interval?"
 HSM_BAR_mtk_last_minute_prepare_control_a:0 "Perfusion and response"
 HSM_BAR_mtk_last_minute_prepare_control_a_tt:0 "Record circulation and response separately from reported comfort. Phantom Pain showed that relief can be real without constituting recovery; the emergency interval must therefore be judged by living function while treatment remains available."
 HSM_BAR_mtk_last_minute_prepare_control_b:0 "Graft and instrument check"
 HSM_BAR_mtk_last_minute_prepare_control_b_tt:0 "Check each proposed graft after warming and each instrument after both treatment passes. Tissue Bank and Spell Sterilisation supply restricted, examined materials; an apparently complete emergency tray must not quietly expand either study's accepted limits."
 HSM_BAR_mtk_last_minute_observation_0:0 "Support holds the damaged structures, but the transfer record does not yet specify when surgery takes over. Comfort improves before the independent circulation record settles. The circuit needs a verified handover before the emergency interval can be accepted."
 HSM_BAR_mtk_last_minute_experiment_report_a_0:0 "APPARATUS: Support into surgery. Perfusion and response.\n\nSupport holds the damaged structures, but the transfer record does not yet specify when surgery takes over. Comfort improves before the independent circulation record settles. The circuit needs a verified handover before the emergency interval can be accepted.\n\nTrial log addendum\nSupport passed to surgery. Perfusion stayed separate from comfort. Suture supports; Bank limits grafts; failed Sleep forbids suspension; Sterilisation clears tools; Phantom Pain distinguishes comfort. Stabilisation succeeds with urgent treatment, never resurrection."
 HSM_BAR_mtk_last_minute_verification_a_0:0 "Support holds the damaged structures, but the transfer record does not yet specify when surgery takes over. Comfort improves before the independent circulation record settles. The circuit needs a verified handover before the emergency interval can be accepted.\n\nVERIFICATION ORDERED: Rebuild the handover sheet\nCommission a coordinated handover sheet linking the circuit, clinician and independent checks. This spends more preparation to resolve withdrawal promptly; a support interval already ending at surgery can be examined through slower supervised rehearsals with the existing arrangement."
 HSM_BAR_mtk_last_minute_experiment_report_b_0:0 "APPARATUS: Support into surgery. Perfusion and response.\n\nSupport holds the damaged structures, but the transfer record does not yet specify when surgery takes over. Comfort improves before the independent circulation record settles. The circuit needs a verified handover before the emergency interval can be accepted.\n\nTrial log addendum\nRehearsals verified surgical takeover. Perfusion stayed separate from comfort. Suture, selective Bank, failed Sleep, Sterilisation and Phantom Pain constrain support, supplies, metabolism, tools and assessment. Stabilisation succeeds; destroyed brains and deaths remain irreversible."
 HSM_BAR_mtk_last_minute_verification_b_0:0 "Support holds the damaged structures, but the transfer record does not yet specify when surgery takes over. Comfort improves before the independent circulation record settles. The circuit needs a verified handover before the emergency interval can be accepted.\n\nVERIFICATION ORDERED: Extend clinical rehearsals\nRetain the layout and rehearse the entire handover with every independent record present. This saves replacement fittings but occupies the team longer when withdrawal is disputed; a defined surgical arrival already supplies a clearer endpoint for the support rehearsal."
