 HSM_BAR_mtk_empty_vessel_rig_question:0 "What simple external manifestation will the vessel record?"
 HSM_BAR_mtk_empty_vessel_prepare_rig_a:0 "Moving mark above the rim"
 HSM_BAR_mtk_empty_vessel_prepare_rig_a_tt:0 "Prepare the ceramic lattice to record a moving mark above the rim. Keep the vessel uninhabited and its observers outside the lattice; the first question is a brief external phenomenon, not residence by a stable person."
 HSM_BAR_mtk_empty_vessel_prepare_rig_b:0 "Changed prompt at the rim"
 HSM_BAR_mtk_empty_vessel_prepare_rig_b_tt:0 "Prepare a changed prompt while independently recording any marks at the rim. A difference after the prompt needs comparison with ordinary apparatus behaviour before it can support a claim of even a simple exchange."
 HSM_BAR_mtk_empty_vessel_control_question:0 "Which ordinary source should challenge the apparent reply?"
 HSM_BAR_mtk_empty_vessel_prepare_control_a:0 "Inactive inscription"
 HSM_BAR_mtk_empty_vessel_prepare_control_a_tt:0 "Keep a matched vessel with an inactive inscription beside the driven lattice. Record both independently of the listener's impressions, so an anticipated reply cannot be counted merely because the active vessel was expected to answer."
 HSM_BAR_mtk_empty_vessel_prepare_control_b:0 "Measured table vibration"
 HSM_BAR_mtk_empty_vessel_prepare_control_b_tt:0 "Measure ordinary vibration beneath the vessel while recording marks above its rim. The comparison asks whether motion follows the apparatus, retaining quiet intervals as carefully as the few appearances that seem responsive to a prompt."
 HSM_BAR_mtk_empty_vessel_observation_0:0 "A driven lattice briefly produces a moving filament before losing coherence. The inactive vessel stays quiet beside the short active appearance. The series needs a controlled short interval without treating extra power as greater stability."
 HSM_BAR_mtk_empty_vessel_experiment_report_a_0:0 "APPARATUS: Moving mark above the rim. Inactive inscription.\n\nA driven lattice briefly produces a moving filament before losing coherence. The inactive vessel stays quiet beside the short active appearance. The series needs a controlled short interval without treating extra power as greater stability.\n\nTrial log addendum\nThe revised interval recorded a brief filament without extending its residence. Inactive inscriptions produced no matching filament during the accepted comparison. Brief manifestations occur only sometimes, without living hosts. Stable residence and identity remain unproved; extra power heats the vessel and worsens coherence."
 HSM_BAR_mtk_empty_vessel_verification_a_0:0 "A driven lattice briefly produces a moving filament before losing coherence. The inactive vessel stays quiet beside the short active appearance. The series needs a controlled short interval without treating extra power as greater stability.\n\nVERIFICATION ORDERED: Rework the driven interval\nCommission a clearer start and release for the ceramic lattice, keeping the power restrained. This costs more bench preparation but makes prompt comparisons quicker; simple moving marks can instead be examined across a longer series with the existing arrangement."
 HSM_BAR_mtk_empty_vessel_experiment_report_b_0:0 "APPARATUS: Moving mark above the rim. Inactive inscription.\n\nA driven lattice briefly produces a moving filament before losing coherence. The inactive vessel stays quiet beside the short active appearance. The series needs a controlled short interval without treating extra power as greater stability.\n\nTrial log addendum\nSpaced trials retained brief appearances among many quiet or collapsed attempts. Inactive inscriptions produced no matching filament during the accepted comparison. The result stays brief and partial, without living hosts. Extra power worsened it; Contact may test exchanges, not assume embodiment or identity."
