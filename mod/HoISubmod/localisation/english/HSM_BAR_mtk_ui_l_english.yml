 HSM_BAR_mtk_crystal_memory_rig_question:0 "Which crystals will receive the illuminated pattern?"
 HSM_BAR_mtk_crystal_memory_prepare_rig_a:0 "Unused specimens"
 HSM_BAR_mtk_crystal_memory_prepare_rig_a_tt:0 "Number previously unexposed crystals before selecting the clear specimens. Their recovered traces will be compared with paper originals, keeping attractive appearance separate from the ability to retain a simple pattern."
 HSM_BAR_mtk_crystal_memory_prepare_rig_b:0 "Reused specimens"
 HSM_BAR_mtk_crystal_memory_prepare_rig_b_tt:0 "Write a new simple pattern over a documented earlier exposure. Keep both source diagrams available, since an apparent extra detail may be an older trace rather than a faithful part of the new image."
 HSM_BAR_mtk_crystal_memory_control_question:0 "Which shelf condition will accompany the replay?"
 HSM_BAR_mtk_crystal_memory_prepare_control_a:0 "Cool numbered tray"
 HSM_BAR_mtk_crystal_memory_prepare_control_a_tt:0 "Keep the numbered specimens away from the warm workshop wall. Record storage order and elapsed intervals, then ask readers unfamiliar with the source to draw each recovered trace before comparison."
 HSM_BAR_mtk_crystal_memory_prepare_control_b:0 "Warm workshop shelf"
 HSM_BAR_mtk_crystal_memory_prepare_control_b_tt:0 "Place the comparison tray near the warm wall without changing the source diagram. Temperature now challenges storage rather than the reader's confidence, and a sharp immediate replay cannot stand for later retention."
 HSM_BAR_mtk_crystal_memory_observation_0:0 "The unused crystals return the pattern's broad arrangement, but independent drawings already disagree about its finest edges. On the cool tray, successive replays look similar enough that the rate of fading remains difficult to judge. The trace needs its exposure history and a checked storage comparison before it can be filed as a temporary record."
 HSM_BAR_mtk_crystal_memory_experiment_report_a_0:0 "APPARATUS: Unused specimens. Cool numbered tray.\n\nThe unused crystals return the pattern's broad arrangement, but independent drawings already disagree about its finest edges. On the cool tray, successive replays look similar enough that the rate of fading remains difficult to judge. The trace needs its exposure history and a checked storage comparison before it can be filed as a temporary record.\n\nTrial log addendum\nSeparately filed unused specimens retained broad patterns without supplying any reliable fine detail. Cool storage slowed the visible loss but did not preserve fine edges indefinitely. Crystal memory remains a temporary record of simple visible patterns, always accompanied by paper originals and storage history. It cannot preserve a personality or complete experience. The Chorus may consult these traces only while retaining a durable independent reference."
 HSM_BAR_mtk_crystal_memory_verification_a_0:0 "The unused crystals return the pattern's broad arrangement, but independent drawings already disagree about its finest edges. On the cool tray, successive replays look similar enough that the rate of fading remains difficult to judge. The trace needs its exposure history and a checked storage comparison before it can be filed as a temporary record.\n\nVERIFICATION ORDERED: Separate the old traces\nCommission separate specimen trays and compare every replay with both source sheets. This spends more on cataloguing but quickly untangles reused crystals; unused specimens with no earlier image gain less from reconstructing their exposure history."
 HSM_BAR_mtk_crystal_memory_experiment_report_b_0:0 "APPARATUS: Unused specimens. Cool numbered tray.\n\nThe unused crystals return the pattern's broad arrangement, but independent drawings already disagree about its finest edges. On the cool tray, successive replays look similar enough that the rate of fading remains difficult to judge. The trace needs its exposure history and a checked storage comparison before it can be filed as a temporary record.\n\nTrial log addendum\nSpaced readings showed unused specimens losing detail while retaining only the broad illuminated arrangement. Cool storage slowed the visible loss but did not preserve fine edges indefinitely. The partial result supports short-lived visual references, not exact archives. Every accepted crystal keeps its source drawing, previous-use entry and storage conditions. Paper remains authoritative when a replay drifts, including when the Chorus later compares contributions from separate stations."
 HSM_BAR_mtk_crystal_memory_verification_b_0:0 "The unused crystals return the pattern's broad arrangement, but independent drawings already disagree about its finest edges. On the cool tray, successive replays look similar enough that the rate of fading remains difficult to judge. The trace needs its exposure history and a checked storage comparison before it can be filed as a temporary record.\n\nVERIFICATION ORDERED: Extend shelf comparison\nReuse the current trays for spaced readings under both shelf conditions. This economises on new storage fittings but takes longer where old and new images overlap; a clean exposure makes the fading comparison easier to finish."
