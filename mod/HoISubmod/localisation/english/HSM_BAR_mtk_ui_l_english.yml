 HSM_BAR_mtk_crystal_drive_rig_question:0 "Which load change should the polishing-wheel drive meet?"
 HSM_BAR_mtk_crystal_drive_prepare_rig_a:0 "Increasing resistance"
 HSM_BAR_mtk_crystal_drive_prepare_rig_a_tt:0 "Increase the resistance within the proposed workshop task and record the wheel separately from the crystal. A bright source or steady pointer cannot establish useful motion when the load itself is changing."
 HSM_BAR_mtk_crystal_drive_prepare_rig_b:0 "Withdrawn load"
 HSM_BAR_mtk_crystal_drive_prepare_rig_b_tt:0 "Remove the ordinary polishing load during a separate run and observe the stopping action. Keep neighbouring apparatus on its own sheet so the drive cannot appear reliable by drawing on an unrecorded source."
 HSM_BAR_mtk_crystal_drive_control_question:0 "Which source condition should accompany the mechanical record?"
 HSM_BAR_mtk_crystal_drive_prepare_control_a:0 "Inspected clear crystal"
 HSM_BAR_mtk_crystal_drive_prepare_control_a_tt:0 "Use an inspected specimen with Viira's independent spectral sheet beside the mechanical record. Include gradual weakening and cooling pauses, since a brief steady run does not establish an unlimited source of motion."
 HSM_BAR_mtk_crystal_drive_prepare_control_b:0 "Damaged comparison crystal"
 HSM_BAR_mtk_crystal_drive_prepare_control_b_tt:0 "Keep a damaged specimen in a separate comparison run rather than silently discarding an inconvenient source. Record irregular response and stop the run where required; the accepted drive must state which crystals it excludes."
 HSM_BAR_mtk_crystal_drive_observation_0:0 "Increasing resistance leaves the wheel apparently steady while the housing grows warm. The inspected source's spectrum changes gradually, but the cooling interval is not yet recorded clearly. Source inspection, regulation and the stopping record must agree before the wheel is accepted for another operator."
 HSM_BAR_mtk_crystal_drive_experiment_report_a_0:0 "APPARATUS: Increasing resistance. Inspected clear crystal.\n\nIncreasing resistance leaves the wheel apparently steady while the housing grows warm. The inspected source's spectrum changes gradually, but the cooling interval is not yet recorded clearly. Source inspection, regulation and the stopping record must agree before the wheel is accepted for another operator.\n\nTrial log addendum\nRecalibration aligned the loaded wheel's indication with the source record and required a cooling pause. The inspected source weakened into a predictable stop without borrowing from neighbouring apparatus. The drive succeeds for documented workshop loads with inspected sources and cooling. Another operator reproduced its stop. It makes neither replacement crystals nor universal power; the Manufactory must preserve those operating limits."
 HSM_BAR_mtk_crystal_drive_verification_a_0:0 "Increasing resistance leaves the wheel apparently steady while the housing grows warm. The inspected source's spectrum changes gradually, but the cooling interval is not yet recorded clearly. Source inspection, regulation and the stopping record must agree before the wheel is accepted for another operator.\n\nVERIFICATION ORDERED: Recalibrate the stop\nPay for a paired mechanical and spectral recalibration of the stopping action. A withdrawn-load mismatch can be resolved promptly this way; a warm loaded housing still needs observation, making a longer cooling series a less expensive alternative there."
 HSM_BAR_mtk_crystal_drive_experiment_report_b_0:0 "APPARATUS: Increasing resistance. Inspected clear crystal.\n\nIncreasing resistance leaves the wheel apparently steady while the housing grows warm. The inspected source's spectrum changes gradually, but the cooling interval is not yet recorded clearly. Source inspection, regulation and the stopping record must agree before the wheel is accepted for another operator.\n\nTrial log addendum\nRepeated loaded runs established a cooling interval before the housing's warmth obscured dependable motion. The inspected source weakened into a predictable stop without borrowing from neighbouring apparatus. The accepted drive provides bounded, inspectable motion and a tested stop. Prepared crystals and cooling remain necessary. Damage is not repaired by regulation, and this finding does not justify joining every workshop machine to one source."
 HSM_BAR_mtk_crystal_drive_verification_b_0:0 "Increasing resistance leaves the wheel apparently steady while the housing grows warm. The inspected source's spectrum changes gradually, but the cooling interval is not yet recorded clearly. Source inspection, regulation and the stopping record must agree before the wheel is accepted for another operator.\n\nVERIFICATION ORDERED: Extend cooling trials\nRetain the regulator and observe rested runs through warming, cooling and source exhaustion. This saves a new calibration commission but takes longer after load withdrawal; under a steady load, the needed thermal record is already being gathered."
