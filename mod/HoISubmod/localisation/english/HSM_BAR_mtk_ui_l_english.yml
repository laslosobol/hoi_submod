 HSM_BAR_mtk_prosthetics_rig_question:0 "Which movement will expose the fitting's demands first?"
 HSM_BAR_mtk_prosthetics_prepare_rig_a:0 "Courtyard walk"
 HSM_BAR_mtk_prosthetics_prepare_rig_a_tt:0 "Fit the crystal-assisted limb for the agreed courtyard route beside the wearer's existing aid. Record where support changes during turning and stopping, rather than accepting a straight demonstration as the whole task."
 HSM_BAR_mtk_prosthetics_prepare_rig_b:0 "Seated bench task"
 HSM_BAR_mtk_prosthetics_prepare_rig_b_tt:0 "Begin with sitting down and working at the bench. The drawing must allow the wearer's actual posture, since a support that looks correct while standing can press differently when its fitting bends."
 HSM_BAR_mtk_prosthetics_control_question:0 "Who will check whether the result survives ordinary use?"
 HSM_BAR_mtk_prosthetics_prepare_control_a:0 "Rest examination"
 HSM_BAR_mtk_prosthetics_prepare_control_a_tt:0 "Have Silver compare fatigue and skin condition before movement and after rest. Keep the wearer's own stopping action in the record, so a completed task does not conceal discomfort or dependence on the inventor."
 HSM_BAR_mtk_prosthetics_prepare_control_b:0 "Unfamiliar local fitter"
 HSM_BAR_mtk_prosthetics_prepare_control_b_tt:0 "Ask another fitter to replace a practice component from the drawing alone. Separate the interchangeable workshop part from the personal fitting, which must not be silently tightened to make an unsuitable pattern appear universal."
 HSM_BAR_mtk_prosthetics_observation_0:0 "The courtyard route is completed, but turning loads the personal fitting differently from the straight section of the walk. After rest, Silver finds a tender contact point although the wearer could halt the assisted movement independently. The fitting and its instructions need correction before repeatable movement can be accepted as something an ordinary workshop can maintain."
 HSM_BAR_mtk_prosthetics_experiment_report_a_0:0 "APPARATUS: Courtyard walk. Rest examination.\n\nThe courtyard route is completed, but turning loads the personal fitting differently from the straight section of the walk. After rest, Silver finds a tender contact point although the wearer could halt the assisted movement independently. The fitting and its instructions need correction before repeatable movement can be accepted as something an ordinary workshop can maintain.\n\nTrial log addendum\nThe walking fitting was relieved at the turning contact and the courtyard route repeated successfully. Rest examinations accepted the adjusted contact while keeping follow-up visits in the specification. The prosthesis succeeds for the recorded fitting and movements, with replaceable parts an ordinary workshop can supply. It restores no sensation and still wears. Other limb shapes require separate patterns; fitting visits remain part of the device rather than optional aftercare."
 HSM_BAR_mtk_prosthetics_verification_a_0:0 "The courtyard route is completed, but turning loads the personal fitting differently from the straight section of the walk. After rest, Silver finds a tender contact point although the wearer could halt the assisted movement independently. The fitting and its instructions need correction before repeatable movement can be accepted as something an ordinary workshop can maintain.\n\nVERIFICATION ORDERED: Refit the contact surface\nRework the personal contact and repeat the specified movement. This pays for prompt workshop adjustment, especially at the seated edge; a walking pattern already close to its drawing can instead be checked through slower fitting visits."
 HSM_BAR_mtk_prosthetics_experiment_report_b_0:0 "APPARATUS: Courtyard walk. Rest examination.\n\nThe courtyard route is completed, but turning loads the personal fitting differently from the straight section of the walk. After rest, Silver finds a tender contact point although the wearer could halt the assisted movement independently. The fitting and its instructions need correction before repeatable movement can be accepted as something an ordinary workshop can maintain.\n\nTrial log addendum\nRepeated courtyard visits located the turning pressure and established a checked local adjustment in the drawing. Rest examinations accepted the adjusted contact while keeping follow-up visits in the specification. Acceptance covers a maintainable mechanical aid for these agreed tasks. A different body still needs its own fitting, and discomfort can require another adjustment. Neither natural sensation nor freedom from wear follows from the successful replacement of a workshop component."
 HSM_BAR_mtk_prosthetics_verification_b_0:0 "The courtyard route is completed, but turning loads the personal fitting differently from the straight section of the walk. After rest, Silver finds a tender contact point although the wearer could halt the assisted movement independently. The fitting and its instructions need correction before repeatable movement can be accepted as something an ordinary workshop can maintain.\n\nVERIFICATION ORDERED: Extend fitting visits\nKeep the current parts and build the movement record across rested visits. This uses less commissioned reworking but takes longer for sitting pressure; the familiar walking route needs fewer revisions before a second fitter can follow it."
 HSM_BAR_mtk_prosthetics_observation_1:0 "The courtyard route is completed, but turning loads the personal fitting differently from the straight section of the walk. The unfamiliar fitter replaces the workshop part but cannot confirm the intended posture from the existing drawing. The fitting and its instructions need correction before repeatable movement can be accepted as something an ordinary workshop can maintain."
 HSM_BAR_mtk_prosthetics_experiment_report_a_1:0 "APPARATUS: Courtyard walk. Unfamiliar local fitter.\n\nThe courtyard route is completed, but turning loads the personal fitting differently from the straight section of the walk. The unfamiliar fitter replaces the workshop part but cannot confirm the intended posture from the existing drawing. The fitting and its instructions need correction before repeatable movement can be accepted as something an ordinary workshop can maintain.\n\nTrial log addendum\nThe walking fitting was relieved at the turning contact and the courtyard route repeated successfully. The unfamiliar fitter restored the documented movement from the revised replacement drawing alone. The prosthesis succeeds for the recorded fitting and movements, with replaceable parts an ordinary workshop can supply. It restores no sensation and still wears. Other limb shapes require separate patterns; fitting visits remain part of the device rather than optional aftercare."
 HSM_BAR_mtk_prosthetics_verification_a_1:0 "The courtyard route is completed, but turning loads the personal fitting differently from the straight section of the walk. The unfamiliar fitter replaces the workshop part but cannot confirm the intended posture from the existing drawing. The fitting and its instructions need correction before repeatable movement can be accepted as something an ordinary workshop can maintain.\n\nVERIFICATION ORDERED: Refit the contact surface\nRework the personal contact and repeat the specified movement. This pays for prompt workshop adjustment, especially at the seated edge; a walking pattern already close to its drawing can instead be checked through slower fitting visits."
