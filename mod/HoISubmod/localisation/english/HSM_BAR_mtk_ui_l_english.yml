 HSM_BAR_mtk_spell_sterilisation_experiment_report_b_1:0 "APPARATUS: Opened instrument joints. Unenchanted test crystal.\n\nOpened joints expose the full surface, but the two passes need separate verification. A charmed fitting cracks during unwinding, requiring a check beyond the blade. The procedure needs verified access and distinct contamination checks before acceptance.\n\nTrial log addendum\nRepeated open-set comparisons separated the effects of the two passes. The test crystal showed no transferred charm; the cracked fitting was discarded. The revised procedure clears tested instruments and residual charms. It supplies Last Minute with checked tools, not treatment for living wounds."
