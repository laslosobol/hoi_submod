 HSM_BAR_mtk_sensate_prosthesis_rig_question:0 "Which light task should the learned pressure signal support?"
 HSM_BAR_mtk_sensate_prosthesis_prepare_rig_a:0 "Holding the cup"
 HSM_BAR_mtk_sensate_prosthesis_prepare_rig_a_tt:0 "Use the wearer's fitted prosthesis to hold a light cup while a padded contact reports pressure to intact skin. Keep the ordinary mechanical release available, since this is a learned signal rather than restored natural sensation."
 HSM_BAR_mtk_sensate_prosthesis_prepare_rig_b:0 "Placing a light object"
 HSM_BAR_mtk_sensate_prosthesis_prepare_rig_b_tt:0 "Ask the wearer to place a light object using the individually fitted attachment. Record visual checks and comfortable handling separately from pain, so a smoother movement cannot stand in for an improvement in phantom symptoms."
 HSM_BAR_mtk_sensate_prosthesis_control_question:0 "Which feedback comparison should challenge apparent improvement?"
 HSM_BAR_mtk_sensate_prosthesis_prepare_control_a:0 "Contact pad disconnected"
 HSM_BAR_mtk_sensate_prosthesis_prepare_control_a_tt:0 "Compare the same comfortable task with the pressure contact disconnected. Preserve the patient's choice to stop or reject the attachment, since extra sensation can distract even when the mechanism produces a technically correct signal."
 HSM_BAR_mtk_sensate_prosthesis_prepare_control_b:0 "Delayed-signal comparison"
 HSM_BAR_mtk_sensate_prosthesis_prepare_control_b_tt:0 "Use the documented delayed-signal comparison only within comfortable loads and with immediate removal available. Watch for harder gripping instead of correction, recording the response as a limit of the attachment rather than blaming the wearer."
 HSM_BAR_mtk_sensate_prosthesis_observation_0:0 "The cup can be held, but the new skin signal still demands conscious attention. Disconnected feedback leaves a comparison that must be separated from ordinary practice. The fitting needs a checked signal or more rested practice before acceptance."
 HSM_BAR_mtk_sensate_prosthesis_experiment_report_a_0:0 "APPARATUS: Holding the cup. Contact pad disconnected.\n\nThe cup can be held, but the new skin signal still demands conscious attention. Disconnected feedback leaves a comparison that must be separated from ordinary practice. The fitting needs a checked signal or more rested practice before acceptance.\n\nTrial log addendum\nThe adjusted cup contact gave a clear learned pressure signal. Disconnected comparisons distinguished useful learned feedback from ordinary task practice. Some voluntarily adopt the aid. Prosthetics' fitting and Phantom Pain's comparison remain necessary; natural sensation and a phantom-pain cure remain absent."
 HSM_BAR_mtk_sensate_prosthesis_verification_a_0:0 "The cup can be held, but the new skin signal still demands conscious attention. Disconnected feedback leaves a comparison that must be separated from ordinary practice. The fitting needs a checked signal or more rested practice before acceptance.\n\nVERIFICATION ORDERED: Recalibrate the contact\nPay for a checked contact adjustment and verify its immediate signal with the wearer. This resolves placement mismatch sooner but needs extra fitting work; cup holding can instead establish the learned signal through longer comfortable practice using the present attachment."
 HSM_BAR_mtk_sensate_prosthesis_experiment_report_b_0:0 "APPARATUS: Holding the cup. Contact pad disconnected.\n\nThe cup can be held, but the new skin signal still demands conscious attention. Disconnected feedback leaves a comparison that must be separated from ordinary practice. The fitting needs a checked signal or more rested practice before acceptance.\n\nTrial log addendum\nRested cup practice taught some wearers to use the separate skin signal. Disconnected comparisons distinguished useful learned feedback from ordinary task practice. Benefit remains partial and voluntary. Fitting continues; learned pressure neither restores natural sensation nor cures phantom pain."
 HSM_BAR_mtk_sensate_prosthesis_verification_b_0:0 "The cup can be held, but the new skin signal still demands conscious attention. Disconnected feedback leaves a comparison that must be separated from ordinary practice. The fitting needs a checked signal or more rested practice before acceptance.\n\nVERIFICATION ORDERED: Extend rested practice\nRetain the accepted immediate contact and extend rested practice, keeping pain and handling diaries apart. This saves a new fitting commission but takes longer for object placement; a steady cup offers a simpler pressure pattern for the wearer to learn."
