 HSM_BAR_mtk_threshold_compass_rig_question:0 "Where should the paired resonators map their first edge?"
 HSM_BAR_mtk_threshold_compass_prepare_rig_a:0 "Prepared chamber boundary"
 HSM_BAR_mtk_threshold_compass_prepare_rig_a_tt:0 "Traverse a prepared ritual boundary beside an independently mapped thread line. Rotate the instrument without changing the edge, distinguishing the paired resonators' timing difference from an observer's expectation of where a doorway should be."
 HSM_BAR_mtk_threshold_compass_prepare_rig_b:0 "Workshop supply boundary"
 HSM_BAR_mtk_threshold_compass_prepare_rig_b_tt:0 "Approach the mapped edge near the workshop supply and preserve its local calibration sheet. Nearby machinery may distort either reading, so a displaced needle cannot immediately be called evidence of a changed ritual boundary."
 HSM_BAR_mtk_threshold_compass_control_question:0 "What comparison will distinguish a boundary from expectation?"
 HSM_BAR_mtk_threshold_compass_prepare_control_a:0 "Strong ordinary lamp"
 HSM_BAR_mtk_threshold_compass_prepare_control_a_tt:0 "Place an ordinary enchanted lamp nearby and compare both resonators together. Shared growth in their readings tests background strength; the claimed threshold requires a difference that still follows the independently surveyed edge."
 HSM_BAR_mtk_threshold_compass_prepare_control_b:0 "Painted doorway"
 HSM_BAR_mtk_threshold_compass_prepare_control_b_tt:0 "Keep the painted doorway in the comparison route even if observers find it unconvincing. The instrument must be checked where no boundary was prepared, with the same rotation and reference-ring exchange as the genuine traverse."
 HSM_BAR_mtk_threshold_compass_observation_0:0 "At the prepared edge, the needle turns near the thread line but needs a rotated confirmation. The lamp raises both readings, complicating the first apparent threshold signal. Local reference behaviour must be settled before another surveyor can trust the mapped line."
