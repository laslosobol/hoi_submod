 HSM_BAR_mtk_phantom_pain_rig_question:0 "Which daily situation should anchor the pain record?"
 HSM_BAR_mtk_phantom_pain_prepare_rig_a:0 "Resting absent limb"
 HSM_BAR_mtk_phantom_pain_prepare_rig_a_tt:0 "Map the patient's perceived absent limb during rest before offering a counter-pattern. Keep ordinary sensation in the remaining limb on its own sheet, so a quieter phantom cannot hide numbness or another source of pain."
 HSM_BAR_mtk_phantom_pain_prepare_rig_b:0 "Work and cup handling"
 HSM_BAR_mtk_phantom_pain_prepare_rig_b_tt:0 "Record the patient's chosen light task alongside the perceived posture of the absent limb. Ask about the cup and shoulder separately, since an easier movement does not establish that every component of pain changed."
 HSM_BAR_mtk_phantom_pain_control_question:0 "Which comparison should test a reported improvement?"
 HSM_BAR_mtk_phantom_pain_prepare_control_a:0 "Inactive appointments"
 HSM_BAR_mtk_phantom_pain_prepare_control_a_tt:0 "Alternate active and inactive appointments without telling the examining nurse their order. Preserve the patient's account in both, since improvement linked to the visit itself must not automatically be assigned to the inscription."
 HSM_BAR_mtk_phantom_pain_prepare_control_b:0 "Between-visit diaries"
 HSM_BAR_mtk_phantom_pain_prepare_control_b_tt:0 "Continue the diary beyond the best hour in the clinic, including days without a researcher. Record return of pain and the patient's practical choice about another visit rather than averaging those details out."
 HSM_BAR_mtk_phantom_pain_observation_0:0 "At rest, the perceived claw briefly relaxes without any change to the scar. An inactive visit also brings relief, leaving the inscription's contribution uncertain. The team must separate temporary relief, expectation and ordinary function before offering further sessions."
 HSM_BAR_mtk_phantom_pain_experiment_report_a_0:0 "APPARATUS: Resting absent limb. Inactive appointments.\n\nAt rest, the perceived claw briefly relaxes without any change to the scar. An inactive visit also brings relief, leaving the inscription's contribution uncertain. The team must separate temporary relief, expectation and ordinary function before offering further sessions.\n\nTrial log addendum\nThe revised resting map separated phantom relaxation from ordinary sensation. Inactive comparisons showed that some improvements belonged equally to both kinds of visit. Temporary relief for some is supported. Response remains unpredictable; care continues. No limb returns and comfort is not recovery."
 HSM_BAR_mtk_phantom_pain_verification_a_0:0 "At rest, the perceived claw briefly relaxes without any change to the scar. An inactive visit also brings relief, leaving the inscription's contribution uncertain. The team must separate temporary relief, expectation and ordinary function before offering further sessions.\n\nVERIFICATION ORDERED: Remap the counter-pattern\nSpend additional clinical work separating the perceived posture from remaining-limb pain. This can settle the work-task mismatch sooner, but quiet rest already provides a simpler map; longer paired appointments there may answer the question with less new preparation."
 HSM_BAR_mtk_phantom_pain_experiment_report_b_0:0 "APPARATUS: Resting absent limb. Inactive appointments.\n\nAt rest, the perceived claw briefly relaxes without any change to the scar. An inactive visit also brings relief, leaving the inscription's contribution uncertain. The team must separate temporary relief, expectation and ordinary function before offering further sessions.\n\nTrial log addendum\nLonger resting comparisons retained short relief in only some participants. Inactive comparisons showed that some improvements belonged equally to both kinds of visit. Relief remains limited and temporary. Visits depend on patient benefit and choice; neither universal cure nor reliable prediction emerged."
 HSM_BAR_mtk_phantom_pain_verification_b_0:0 "At rest, the perceived claw briefly relaxes without any change to the scar. An inactive visit also brings relief, leaving the inscription's contribution uncertain. The team must separate temporary relief, expectation and ordinary function before offering further sessions.\n\nVERIFICATION ORDERED: Extend paired appointments\nKeep the present pattern and compare active visits, quiet visits and the patient's daily record for longer. This reduces new fitting work but takes more time when work pain overlaps the phantom; restful sessions have fewer competing changes to untangle."
