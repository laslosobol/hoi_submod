 HSM_BAR_mtk_place_memory_rig_question:0 "Which stone will carry the known treatment sequence?"
 HSM_BAR_mtk_place_memory_prepare_rig_a:0 "Numbered bench bricks"
 HSM_BAR_mtk_place_memory_prepare_rig_a_tt:0 "Prepare numbered bricks with recorded heating and binding sequences before any reader sees them. Material response and imagined scenes receive separate sheets, since a repeatable trace need not contain a narrated history of the working."
 HSM_BAR_mtk_place_memory_prepare_rig_b:0 "Moved replacement brick"
 HSM_BAR_mtk_place_memory_prepare_rig_b_tt:0 "Compare a documented replacement brick with surrounding hall stone. Keep its workshop origin visible in the sealed treatment list, because an apparently ancient mark may have travelled with a recently moved piece of masonry."
 HSM_BAR_mtk_place_memory_control_question:0 "Which comparison should challenge a historical reading?"
 HSM_BAR_mtk_place_memory_prepare_control_a:0 "Reverse the spell order"
 HSM_BAR_mtk_place_memory_prepare_control_a_tt:0 "Apply the same workings in reverse order to matched material and conceal their labels. Readers must distinguish sequence before claiming history, rather than treating detection of either charm as proof of the order in which events occurred."
 HSM_BAR_mtk_place_memory_prepare_control_b:0 "Rain-weathered comparison"
 HSM_BAR_mtk_place_memory_prepare_control_b_tt:0 "Expose matched stone to rain and retain an unweathered comparison beside it. Record weakened traces before asking about scenes, since weather can remove parts of a material response without selecting a truthful memory to preserve."
 HSM_BAR_mtk_place_memory_observation_0:0 "Numbered bricks repeat a material response while observers describe different scenes. Reversing spell order leaves readings that are not yet distinguishable. The team must locate the material trace without turning it into an unsupported account of events."
 HSM_BAR_mtk_place_memory_experiment_report_a_0:0 "APPARATUS: Numbered bench bricks. Reverse the spell order.\n\nNumbered bricks repeat a material response while observers describe different scenes. Reversing spell order leaves readings that are not yet distinguishable. The team must locate the material trace without turning it into an unsupported account of events.\n\nTrial log addendum\nThe revised register linked bench responses to treatment, not observers' scenes. Reversed workings remained indistinguishable as a sequence despite detectable prior treatment. Altered material is detected, not history. Culprits, promises and event order remain unknowable from these marks; Contact must separate residue from reply."
 HSM_BAR_mtk_place_memory_verification_a_0:0 "Numbered bricks repeat a material response while observers describe different scenes. Reversing spell order leaves readings that are not yet distinguishable. The team must locate the material trace without turning it into an unsupported account of events.\n\nVERIFICATION ORDERED: Rebuild the stone register\nCommission a checked register linking each sample to its actual treatment and movement. This costs more documentary work but resolves the replacement brick sooner; bench samples already have a simpler history that can be tested through longer independent readings."
 HSM_BAR_mtk_place_memory_experiment_report_b_0:0 "APPARATUS: Numbered bench bricks. Reverse the spell order.\n\nNumbered bricks repeat a material response while observers describe different scenes. Reversing spell order leaves readings that are not yet distinguishable. The team must locate the material trace without turning it into an unsupported account of events.\n\nTrial log addendum\nIndependent bench readings repeated marks without agreeing on depicted figures. Reversed workings remained indistinguishable as a sequence despite detectable prior treatment. Material traces remain limited by weather and later use. The survey marks altered stone and uncertainty, never a verified history."
