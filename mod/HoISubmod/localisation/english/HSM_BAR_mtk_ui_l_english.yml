 HSM_BAR_mtk_interrupt_notation_rig_question:0 "Which written sequence should carry its own ending?"
 HSM_BAR_mtk_interrupt_notation_prepare_rig_a:0 "Elementary light sequence"
 HSM_BAR_mtk_interrupt_notation_prepare_rig_a_tt:0 "Attach interruption points to a reproduced elementary light exercise. Keep the required discharge interval beside the stop request, since a readable instruction must distinguish permission to stop from evidence that the field has actually settled."
 HSM_BAR_mtk_interrupt_notation_prepare_rig_b:0 "Exchanged sustained score"
 HSM_BAR_mtk_interrupt_notation_prepare_rig_b_tt:0 "Give another instructor the measured sustained sequence without the author's spoken explanation. Keep the assistant's interruption independent, testing whether the written score carries its ending across differences in teaching rhythm and personal casting habit."
 HSM_BAR_mtk_interrupt_notation_control_question:0 "Which copy will challenge the assistant's reading?"
 HSM_BAR_mtk_interrupt_notation_prepare_control_a:0 "Checked discharge marks"
 HSM_BAR_mtk_interrupt_notation_prepare_control_a_tt:0 "Provide the reference copy with separate marks for a stop request and measured return to baseline. The assistant must identify both before execution, linking Viira's readable conditions to Asinti's independently verified ending."
 HSM_BAR_mtk_interrupt_notation_prepare_control_b:0 "Altered comparison mark"
 HSM_BAR_mtk_interrupt_notation_prepare_control_b_tt:0 "Alter a discharge mark on a clearly designated comparison copy and compare it before starting. A disagreement must halt preparation until both pages agree, rather than letting the caster silently repair the notation from personal memory."
 HSM_BAR_mtk_interrupt_notation_observation_0:0 "The light sheet names a stop request but leaves the return to baseline ambiguous. The reference marks require the assistant to distinguish request from measured completion. The page needs an unambiguous ending that another reader can verify independently."
 HSM_BAR_mtk_interrupt_notation_experiment_report_a_0:0 "APPARATUS: Elementary light sequence. Checked discharge marks.\n\nThe light sheet names a stop request but leaves the return to baseline ambiguous. The reference marks require the assistant to distinguish request from measured completion. The page needs an unambiguous ending that another reader can verify independently.\n\nTrial log addendum\nRevised light marks separated the request from the verified ending. Separate reference marks distinguished the requested stop from the measured return. Notation joins Brake for measured rituals. Unknown sequences need trials; symbols neither banish independent beings nor make dangerous procedures harmless."
 HSM_BAR_mtk_interrupt_notation_verification_a_0:0 "The light sheet names a stop request but leaves the return to baseline ambiguous. The reference marks require the assistant to distinguish request from measured completion. The page needs an unambiguous ending that another reader can verify independently.\n\nVERIFICATION ORDERED: Redraw the ending marks\nCommission separate ending symbols and align them with the measured discharge interval. This spends more drafting to resolve an exchanged score quickly; the elementary exercise can instead verify its familiar sequence through a longer exchange of teaching copies."
