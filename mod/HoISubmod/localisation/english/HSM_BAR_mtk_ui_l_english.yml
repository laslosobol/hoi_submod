 HSM_BAR_mtk_chorus_rig_question:0 "Where should the independent Chorus stations stand?"
 HSM_BAR_mtk_chorus_prepare_rig_a:0 "Surveyed inner room"
 HSM_BAR_mtk_chorus_prepare_rig_a_tt:0 "Place the stations inside the Field Atlas boundary, with separate offered outlines and individual stops. This begins with a known spatial reference while leaving the coordination of contributions open to examination."
 HSM_BAR_mtk_chorus_prepare_rig_b:0 "Workshop-facing edge"
 HSM_BAR_mtk_chorus_prepare_rig_b_tt:0 "Place the stations along the surveyed edge facing the workshop. Preserve the atlas interference layer, since a disrupted common pattern could come from neighbouring apparatus rather than disagreement between the participants."
 HSM_BAR_mtk_chorus_control_question:0 "What reference will each awake participant explain before joining?"
 HSM_BAR_mtk_chorus_prepare_control_a:0 "Paper contribution sheets"
 HSM_BAR_mtk_chorus_prepare_control_a_tt:0 "Rehearse the written contribution with each participant before joining. Keep individual drawings beside the common light pattern; reception alone cannot replace understanding after the Sleeping Lecture's unsuccessful attempt at passive learning."
 HSM_BAR_mtk_chorus_prepare_control_b:0 "Crystal reference traces"
 HSM_BAR_mtk_chorus_prepare_control_b_tt:0 "Rehearse awake with temporary crystal traces beside their paper originals. The replay offers a changing reference, but participants must explain the notation and keep its stopping points visible when the crystal begins to drift."
 HSM_BAR_mtk_chorus_observation_0:0 "Inside the surveyed room, separate stations briefly sustain the common outline, but overlapping offers make individual contributions hard to follow. Participants explain their paper instructions, yet simultaneous starts obscure whose stopping mark should be checked first. The group needs a clearer boundary or staggered contributions before a stable light pattern can demonstrate collaboration between still-independent observers."
 HSM_BAR_mtk_chorus_experiment_report_a_0:0 "APPARATUS: Surveyed inner room. Paper contribution sheets.\n\nInside the surveyed room, separate stations briefly sustain the common outline, but overlapping offers make individual contributions hard to follow. Participants explain their paper instructions, yet simultaneous starts obscure whose stopping mark should be checked first. The group needs a clearer boundary or staggered contributions before a stable light pattern can demonstrate collaboration between still-independent observers.\n\nTrial log addendum\nRepositioned inner stations made each offered outline and withdrawal separately visible. Awake explanations and separate paper sheets kept understanding distinguishable from merely receiving a signal. The local Chorus succeeds with independent stops. Field Atlas bounds it; Shared Senses permits stationary outlines; failed Sleep Lecture requires awake understanding; Crystal Memory needs paper checks; Spell Notation makes contributions readable. Crowding still tires participants, and neither absent minds nor a merged consciousness were reached."
 HSM_BAR_mtk_chorus_verification_a_0:0 "Inside the surveyed room, separate stations briefly sustain the common outline, but overlapping offers make individual contributions hard to follow. Participants explain their paper instructions, yet simultaneous starts obscure whose stopping mark should be checked first. The group needs a clearer boundary or staggered contributions before a stable light pattern can demonstrate collaboration between still-independent observers.\n\nVERIFICATION ORDERED: Rebuild the station layout\nCommission a revised arrangement with individually inspected links. Moving the edge stations inward spends more workshop effort but quickly removes mapped interference; an already sheltered group gains less and may settle coordination through longer rehearsals instead."
 HSM_BAR_mtk_chorus_experiment_report_b_0:0 "APPARATUS: Surveyed inner room. Paper contribution sheets.\n\nInside the surveyed room, separate stations briefly sustain the common outline, but overlapping offers make individual contributions hard to follow. Participants explain their paper instructions, yet simultaneous starts obscure whose stopping mark should be checked first. The group needs a clearer boundary or staggered contributions before a stable light pattern can demonstrate collaboration between still-independent observers.\n\nTrial log addendum\nStaggered inner contributions sustained the pattern while each participant demonstrated an independent withdrawal. Awake explanations and separate paper sheets kept understanding distinguishable from merely receiving a signal. The accepted Chorus remains local. Field Atlas supplies its boundary, Shared Senses its narrow exchange, failed Sleep Lecture its demand for understanding, Crystal Memory its fallible references, and Spell Notation its checked contributions. Fatigue and range remain limits; nobody merges minds or acquires another's whole experience."
 HSM_BAR_mtk_chorus_verification_b_0:0 "Inside the surveyed room, separate stations briefly sustain the common outline, but overlapping offers make individual contributions hard to follow. Participants explain their paper instructions, yet simultaneous starts obscure whose stopping mark should be checked first. The group needs a clearer boundary or staggered contributions before a stable light pattern can demonstrate collaboration between still-independent observers.\n\nVERIFICATION ORDERED: Stagger the contributions\nExtend awake rehearsals, admitting each offered outline in a written order. This saves rebuilding sheltered stations but keeps the faculty occupied longer near interference; pauses and paper comparisons must be repeated whenever an edge contribution loses its reference."
