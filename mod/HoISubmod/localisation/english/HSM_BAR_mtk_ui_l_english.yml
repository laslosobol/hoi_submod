 HSM_BAR_mtk_chorus_origins:0 "Viira's binding note: the atlas gives a common reference, shared senses a narrow channel, and the sleeping lecture an indispensable refusal. Crystal traces fade; notation lets a participant correct the author. The Chorus begins where these limits meet, not where they disappear.\n\n1. $HSM_BAR_mtk_field_atlas_title$\n[GetHSMBARMtkPrep_field_atlas]\n\n2. $HSM_BAR_mtk_shared_senses_title$\n[GetHSMBARMtkPrep_shared_senses]\n\n3. $HSM_BAR_mtk_sleep_lecture_title$\n[GetHSMBARMtkPrep_sleep_lecture]\n\n4. $HSM_BAR_mtk_crystal_memory_title$\n[GetHSMBARMtkPrep_crystal_memory]\n\n5. $HSM_BAR_mtk_spell_notation_title$\n[GetHSMBARMtkPrep_spell_notation]"
 HSM_BAR_mtk_manufactory_origins:0 "Leopold's assembly note: approved prosthetic patterns, staffed repair and a failed gun that stopped everything together. Add a drive with a reliable stop and a sorter permitted to hesitate. The line must inherit all five conclusions, especially the one nobody wished to sign.\n\n1. $HSM_BAR_mtk_prosthetics_title$\n[GetHSMBARMtkPrep_prosthetics]\n\n2. $HSM_BAR_mtk_self_repair_title$\n[GetHSMBARMtkPrep_self_repair]\n\n3. $HSM_BAR_mtk_revolver_howitzer_title$\n[GetHSMBARMtkPrep_revolver_howitzer]\n\n4. $HSM_BAR_mtk_crystal_drive_title$\n[GetHSMBARMtkPrep_crystal_drive]\n\n5. $HSM_BAR_mtk_sorting_engine_title$\n[GetHSMBARMtkPrep_sorting_engine]"
 HSM_BAR_mtk_last_minute_origins:0 "Silver's covering letter: support is not healing, a tissue store is not an inexhaustible body, and stillness is not youth. Sterile instruments and relief from pain matter because a patient must return to ordinary life. The Last Minute buys time for treatment; these five casebooks set its boundaries.\n\n1. $HSM_BAR_mtk_necrotic_suture_title$\n[GetHSMBARMtkPrep_necrotic_suture]\n\n2. $HSM_BAR_mtk_tissue_bank_title$\n[GetHSMBARMtkPrep_tissue_bank]\n\n3. $HSM_BAR_mtk_ageless_sleep_title$\n[GetHSMBARMtkPrep_ageless_sleep]\n\n4. $HSM_BAR_mtk_spell_sterilisation_title$\n[GetHSMBARMtkPrep_spell_sterilisation]\n\n5. $HSM_BAR_mtk_phantom_pain_title$\n[GetHSMBARMtkPrep_phantom_pain]"
 HSM_BAR_mtk_contact_origins:0 "Asinti's forwarding note: an ending, a rejected witness, a trace that is not history, a boundary that can be measured, and a vessel that cannot keep its visitor. Contact requires all five. The silence of one unsuccessful study must not be filled with another's promise.\n\n1. $HSM_BAR_mtk_ritual_brake_title$\n[GetHSMBARMtkPrep_ritual_brake]\n\n2. $HSM_BAR_mtk_silent_witness_title$\n[GetHSMBARMtkPrep_silent_witness]\n\n3. $HSM_BAR_mtk_place_memory_title$\n[GetHSMBARMtkPrep_place_memory]\n\n4. $HSM_BAR_mtk_threshold_compass_title$\n[GetHSMBARMtkPrep_threshold_compass]\n\n5. $HSM_BAR_mtk_empty_vessel_title$\n[GetHSMBARMtkPrep_empty_vessel]"
