 HSM_BAR_mtk_necrotic_suture_rig_question:0 "Which tissue margins will challenge the temporary stitch?"
 HSM_BAR_mtk_necrotic_suture_prepare_rig_a:0 "Matched intact margins"
 HSM_BAR_mtk_necrotic_suture_prepare_rig_a_tt:0 "Compare matched tissue strips under the temporary stitch and ordinary thread. The question is support during repair, so record release and fluid passage as carefully as the strength with which the edges remain together."
 HSM_BAR_mtk_necrotic_suture_prepare_rig_b:0 "Bruised anchor margins"
 HSM_BAR_mtk_necrotic_suture_prepare_rig_b_tt:0 "Place the comparison anchors across bruised fibres in discarded surgical tissue. This asks whether apparent tension hides insecure anchoring; no successful bench pull alone permits a claim about a patient's later recovery."
 HSM_BAR_mtk_necrotic_suture_control_question:0 "Which comparison should challenge an apparently strong stitch?"
 HSM_BAR_mtk_necrotic_suture_prepare_control_a:0 "Ordinary thread"
 HSM_BAR_mtk_necrotic_suture_prepare_control_a_tt:0 "Use ordinary thread on the matched strip and compare bending and release. Record which support carries the tissue at each moment, since the magical stitch is intended to yield to ordinary treatment."
 HSM_BAR_mtk_necrotic_suture_prepare_control_b:0 "Fluid-passage record"
 HSM_BAR_mtk_necrotic_suture_prepare_control_b_tt:0 "Observe fluid passage through the supported tissue alongside its tension. A rigid connection can still obstruct small vessels; the comparison must expose that conflict before a stronger hold is praised as a better result."
 HSM_BAR_mtk_necrotic_suture_observation_0:0 "The intact margins hold through bending, but the strongest setting draws the supported edges unusually tight. Ordinary thread permits a visible handover that the magical release has not yet matched. Support must be separated from compression before the clinical record can be accepted."
 HSM_BAR_mtk_necrotic_suture_experiment_report_a_0:0 "APPARATUS: Matched intact margins. Ordinary thread.\n\nThe intact margins hold through bending, but the strongest setting draws the supported edges unusually tight. Ordinary thread permits a visible handover that the magical release has not yet matched. Support must be separated from compression before the clinical record can be accepted.\n\nTrial log addendum\nRepositioned intact anchors held the edges without demanding the tightest setting. Ordinary thread took over support after the temporary magical stitch was released. The suture succeeds as temporary support until treatment takes over. Circulation and release remain mandatory checks; infection, blood loss and injuries outside the stitch need their own treatment. Supported tissue is not healed tissue."
 HSM_BAR_mtk_necrotic_suture_verification_a_0:0 "The intact margins hold through bending, but the strongest setting draws the supported edges unusually tight. Ordinary thread permits a visible handover that the magical release has not yet matched. Support must be separated from compression before the clinical record can be accepted.\n\nVERIFICATION ORDERED: Relocate the anchors\nRework the anchor pattern and repeat the comparison at restrained tension. This costs more preparation but settles bruised-margin slipping sooner; matched intact margins may instead establish their release limits through a longer series using the present marks."
 HSM_BAR_mtk_necrotic_suture_experiment_report_b_0:0 "APPARATUS: Matched intact margins. Ordinary thread.\n\nThe intact margins hold through bending, but the strongest setting draws the supported edges unusually tight. Ordinary thread permits a visible handover that the magical release has not yet matched. Support must be separated from compression before the clinical record can be accepted.\n\nTrial log addendum\nRepeated release checks established a workable holding interval for the intact margins. Ordinary thread took over support after the temporary magical stitch was released. The accepted stitch holds damaged structures during transport or repair and requires no continued animation after removal. Ordinary care and follow-up remain necessary. Its lesson for Last Minute is a finite bridge to treatment, never a claim of healing by stiffness."
 HSM_BAR_mtk_necrotic_suture_verification_b_0:0 "The intact margins hold through bending, but the strongest setting draws the supported edges unusually tight. Ordinary thread permits a visible handover that the magical release has not yet matched. Support must be separated from compression before the clinical record can be accepted.\n\nVERIFICATION ORDERED: Extend release comparisons\nKeep the current pattern and compare restrained tension with ordinary support across repeated releases. This saves new inscriptions but takes longer around bruised anchors; intact margins already provide the cleanest comparison of holding, passage and handover to thread."
