 HSM_BAR_mtk_ageless_sleep_rig_question:0 "Which culture series will test a reversible pause?"
 HSM_BAR_mtk_ageless_sleep_prepare_rig_a:0 "Single observed pause"
 HSM_BAR_mtk_ageless_sleep_prepare_rig_a_tt:0 "Apply the proposed pause to matched living cultures and observe them after release. Keep nourishment identical before and afterwards, so a still surface is not mistaken for preserved ability to grow and repair."
 HSM_BAR_mtk_ageless_sleep_prepare_rig_b:0 "Repeated pauses"
 HSM_BAR_mtk_ageless_sleep_prepare_rig_b_tt:0 "Follow cultures through repeated pauses while retaining every recovery record. The hypothesis requires preserved function after each release; accumulating injury must remain visible even when the treated samples appear outwardly unchanged."
 HSM_BAR_mtk_ageless_sleep_control_question:0 "What comparison should challenge the appearance of suspended age?"
 HSM_BAR_mtk_ageless_sleep_prepare_control_a:0 "Calendar-matched cultures"
 HSM_BAR_mtk_ageless_sleep_prepare_control_a_tt:0 "Keep untreated cultures for the same total interval and compare growth after release. Their ordinary ageing supplies the relevant comparison, rather than an attractive picture of the treated dish taken during its stillest moment."
 HSM_BAR_mtk_ageless_sleep_prepare_control_b:0 "Concealed sample labels"
 HSM_BAR_mtk_ageless_sleep_prepare_control_b_tt:0 "Give another observer the recovery samples without treatment labels. Ask for damage and resumed function separately, preventing a preferred sample's identity from changing what counts as successful recovery after the proposed pause."
 HSM_BAR_mtk_ageless_sleep_observation_0:0 "After the single pause, still cultures show uncertain growth on release. Untreated cultures continue growing across the same interval. Recovery must be checked before stillness can support any claim about safely postponed ageing."
 HSM_BAR_mtk_ageless_sleep_experiment_report_a_0:0 "APPARATUS: Single observed pause. Calendar-matched cultures.\n\nAfter the single pause, still cultures show uncertain growth on release. Untreated cultures continue growing across the same interval. Recovery must be checked before stillness can support any claim about safely postponed ageing.\n\nTrial log addendum\nRe-examination confirmed impaired growth after the single pause. The calendar comparison showed no safe postponement of ageing. The hypothesis failed: damaged cultures yielded neither treatment nor improved preservation. Whole-body trials are cancelled; Last Minute must sustain living processes."
 HSM_BAR_mtk_ageless_sleep_verification_a_0:0 "After the single pause, still cultures show uncertain growth on release. Untreated cultures continue growing across the same interval. Recovery must be checked before stillness can support any claim about safely postponed ageing.\n\nVERIFICATION ORDERED: Recheck recovery samples\nCommission a second examination of the released cultures and their damage records. This costs more immediate work but settles repeated-pause ambiguity sooner; the single-pause series can instead be followed longer with the current dishes and observers."
 HSM_BAR_mtk_ageless_sleep_experiment_report_b_0:0 "APPARATUS: Single observed pause. Calendar-matched cultures.\n\nAfter the single pause, still cultures show uncertain growth on release. Untreated cultures continue growing across the same interval. Recovery must be checked before stillness can support any claim about safely postponed ageing.\n\nTrial log addendum\nLonger observation did not restore normal growth after the single pause. The calendar comparison showed no safe postponement of ageing. Ageless Sleep failed without therapeutic or preservation use. Stillness was injury, not youth. The procedure will not be offered to patients."
 HSM_BAR_mtk_ageless_sleep_verification_b_0:0 "After the single pause, still cultures show uncertain growth on release. Untreated cultures continue growing across the same interval. Recovery must be checked before stillness can support any claim about safely postponed ageing.\n\nVERIFICATION ORDERED: Extend ordinary recovery\nMaintain ordinary nourishment and observe released cultures through a longer recovery interval. Existing dishes keep expenses lower, but repeated injury takes longer to distinguish from delayed growth; a single pause leaves a simpler record to follow."
 HSM_BAR_mtk_ageless_sleep_observation_1:0 "After the single pause, still cultures show uncertain growth on release. The second observer records damage before learning which samples were treated. Recovery must be checked before stillness can support any claim about safely postponed ageing."
