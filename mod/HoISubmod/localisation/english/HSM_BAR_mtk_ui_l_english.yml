 HSM_BAR_mtk_contact_rig_question:0 "Which distinction will the brief exchange attempt?"
 HSM_BAR_mtk_contact_prepare_rig_a:0 "Matching and difference"
 HSM_BAR_mtk_contact_prepare_rig_a_tt:0 "Begin with matching and difference across newly chosen signs. Retain the vessel's short interval and independently mapped boundary, asking only for a demonstrated distinction rather than treating a fluent voice as a ready shared language."
 HSM_BAR_mtk_contact_prepare_rig_b:0 "Request for repetition"
 HSM_BAR_mtk_contact_prepare_rig_b_tt:0 "Offer the established signs in a changed order and allow a request for repetition. Keep either side's pause available, since continued speech cannot be purchased by overriding a refusal or substituting a living host for the vessel."
 HSM_BAR_mtk_contact_control_question:0 "What check must accompany an apparent answer?"
 HSM_BAR_mtk_contact_prepare_control_a:0 "Fresh clean baseline"
 HSM_BAR_mtk_contact_prepare_control_a_tt:0 "Record the vessel's baseline before each call and choose fresh signs afterwards. Old traces must remain distinguishable from present replies, applying the failed witness claim and material-memory study before discussing any offered name."
 HSM_BAR_mtk_contact_prepare_control_b:0 "Independent pause request"
 HSM_BAR_mtk_contact_prepare_control_b_tt:0 "Have the assistant record and execute a pause request independently of Asinti's wish to continue. Verify the field's ending and boundary together, since an agreeable exchange is still unacceptable if its prepared stop cannot be demonstrated."
