 HSM_BAR_mtk_spell_notation_rig_question:0 "Which casting route will the written light exercise describe?"
 HSM_BAR_mtk_spell_notation_prepare_rig_a:0 "Caster's movement"
 HSM_BAR_mtk_spell_notation_prepare_rig_a_tt:0 "Describe the movement Viira previously omitted from her lesson. Put the required magical condition beside the bodily action, so a reader can question whether copying her posture actually achieves the stated effect."
 HSM_BAR_mtk_spell_notation_prepare_rig_b:0 "External regulator"
 HSM_BAR_mtk_spell_notation_prepare_rig_b_tt:0 "Write the same required condition for an external regulator. The mechanism offers another route to the elementary exercise, but its drawing must explain preparation, attention and stopping without relying on Viira's demonstration."
 HSM_BAR_mtk_spell_notation_control_question:0 "Which copy will an unfamiliar instructor receive?"
 HSM_BAR_mtk_spell_notation_prepare_control_a:0 "Complete working copy"
 HSM_BAR_mtk_spell_notation_prepare_control_a_tt:0 "Give the instructor the entire draft without demonstrating the charm. Collect questions before execution, treating an unexplained action as a gap in the page rather than a fault in the new reader."
 HSM_BAR_mtk_spell_notation_prepare_control_b:0 "One instruction omitted"
 HSM_BAR_mtk_spell_notation_prepare_control_b_tt:0 "Remove an instruction from a marked comparison copy of the harmless exercise. Observe whether the instructor stops at the gap or supplies an unwritten habit; restore the page before any accepted demonstration."
 HSM_BAR_mtk_spell_notation_observation_0:0 "The movement sheet produces a brief glow, but the unfamiliar instructor cannot yet explain which condition sustains it. The complete draft leaves a question in the margin where preparation should become sustained attention. The page needs either a clearer equivalence or another independent lesson before a successful glow can count as reproducible instruction."
 HSM_BAR_mtk_spell_notation_experiment_report_a_0:0 "APPARATUS: Caster's movement. Complete working copy.\n\nThe movement sheet produces a brief glow, but the unfamiliar instructor cannot yet explain which condition sustains it. The complete draft leaves a question in the margin where preparation should become sustained attention. The page needs either a clearer equivalence or another independent lesson before a successful glow can count as reproducible instruction.\n\nTrial log addendum\nThe revised movement sheet separated Viira's habitual posture from the condition an instructor could actually check. The complete copy supported an explanation of both sustaining the light and ending it. The notation succeeds for reproduced elementary exercises. It records checked procedures without guaranteeing equal magical capacity or translating every bodily habit. More intricate charms remain drafts. The Chorus can use these pages to inspect contributions without borrowing their author's unspoken judgment."
 HSM_BAR_mtk_spell_notation_verification_a_0:0 "The movement sheet produces a brief glow, but the unfamiliar instructor cannot yet explain which condition sustains it. The complete draft leaves a question in the margin where preparation should become sustained attention. The page needs either a clearer equivalence or another independent lesson before a successful glow can count as reproducible instruction.\n\nVERIFICATION ORDERED: Redraw the conditions\nCommission separate diagrams for action, condition and stop. Regulator readers can use the corrected drawing promptly, while bodily habits take longer to translate; the extra drafting costs more than another classroom exchange using existing pages."
 HSM_BAR_mtk_spell_notation_experiment_report_b_0:0 "APPARATUS: Caster's movement. Complete working copy.\n\nThe movement sheet produces a brief glow, but the unfamiliar instructor cannot yet explain which condition sustains it. The complete draft leaves a question in the margin where preparation should become sustained attention. The page needs either a clearer equivalence or another independent lesson before a successful glow can count as reproducible instruction.\n\nTrial log addendum\nA second instructor isolated the unexplained movement and supplied a check another reader could reproduce. The complete copy supported an explanation of both sustaining the light and ending it. Another teacher now reproduces the elementary light exercise and its stopping condition. Acceptance applies to those checked pages; complicated spells and untranslated habits still need demonstrations. This gives the Chorus readable contributions, not permission to assume every participant can perform every written instruction."
 HSM_BAR_mtk_spell_notation_verification_b_0:0 "The movement sheet produces a brief glow, but the unfamiliar instructor cannot yet explain which condition sustains it. The complete draft leaves a question in the margin where preparation should become sustained attention. The page needs either a clearer equivalence or another independent lesson before a successful glow can count as reproducible instruction.\n\nVERIFICATION ORDERED: Exchange the lesson pages\nLet another instructor teach from the questioned pages and return an annotated copy. This saves new diagram commissions but requires classroom time, especially for unfamiliar regulators; a movement already explained aloud can be checked sooner through a second reader."
