l_english:
 HSM_BAR_anomalies:0 "Secret Case Registry"
 HSM_BAR_anomalies_desc:0 "The network controls Barrad's cabinet through false fronts, without the government's knowledge. Its files distinguish evidence, current custody and unresolved claims. Field teams work under civilian cover; residents are protected, and access follows the present custodian."
 HSM_BAR_case_local_survey:0 "Survey Barrad's surviving sites"
 HSM_BAR_case_local_survey_desc:0 "Under cover of routine inspections, interview residents and compare the Pentarchy's papers with surviving sites. Open five local dossiers while keeping the network hidden from the government."
 HSM_BAR_case_rock_investigate:0 "Investigate: Living Rock"
 HSM_BAR_case_rock_investigate_desc:0 "Sample the exposed rock without extending Asinti's temple. Record responses and define a safe boundary for work crews."
 HSM_BAR_case_rock_protect:0 "Protect the rock outcrop"
 HSM_BAR_case_rock_restrict:0 "Close the excavation"
 HSM_BAR_case_rock_protect_desc:0 "Observers will hold the site boundary. Olcha can test the supports while villagers repair wells beyond the marked line. No new passage may be opened without Marta's signature."
 HSM_BAR_case_rock_restrict_desc:0 "Wrona will close the approaches and withdraw the crews from the lower workings. Krzemien will retain the safely collected samples. No one is to descend again merely to retrieve abandoned tools."
 HSM_BAR_case_rock_protect_tt:0 "$HSM_BAR_outcome_rock_protect_tt$"
 HSM_BAR_case_rock_restrict_tt:0 "$HSM_BAR_outcome_rock_restrict_tt$"
 HSM_BAR_case_titan_investigate:0 "Investigate: The Buried Titan"
 HSM_BAR_case_titan_investigate_desc:0 "Leopold's old plans disagree about the dimensions of the same chamber. The team will compare the surviving workings with the drawings. Olcha orders that no recovered contact be supplied with power."
 HSM_BAR_case_titan_protect:0 "Guard the Titan site"
 HSM_BAR_case_titan_restrict:0 "Seal the Titan workings"
 HSM_BAR_case_titan_protect_desc:0 "Watchkeepers will remain at the excavation. The workshops may receive the load tables, but the workings will not become a source of cheap metal. Each watch must check the old survey marks as well as the locks."
 HSM_BAR_case_titan_restrict_desc:0 "The final inventory will be taken from outside. Once the barriers are installed, the lower workings will be watched from the upper post. Wrona has struck out a proposal to remove the supports before departure."
 HSM_BAR_case_titan_protect_tt:0 "$HSM_BAR_outcome_titan_protect_tt$"
 HSM_BAR_case_titan_restrict_tt:0 "$HSM_BAR_outcome_titan_restrict_tt$"
 HSM_BAR_case_entity_investigate:0 "Investigate: The Underground Consciousness"
 HSM_BAR_case_entity_investigate_desc:0 "Place receivers at different depths and record their answers separately. The watchkeepers will receive different questions. Marta forbids showing them the previous shift's transcript in advance."
 HSM_BAR_case_entity_protect:0 "Maintain a warded contact zone"
 HSM_BAR_case_entity_restrict:0 "Close the lower passages"
 HSM_BAR_case_entity_protect_desc:0 "Marta agrees to continued observation but refuses a permanent listener. Every contact requires an independent witness and a ready retrieval crew. No promises may be made that the Service has no right to fulfil."
 HSM_BAR_case_entity_restrict_desc:0 "Seal the lower passages and move the watch above them. Leave the listening pipes disconnected. Olcha asks that the case not be called settled merely because its replies can no longer be heard."
 HSM_BAR_case_entity_protect_tt:0 "$HSM_BAR_outcome_entity_protect_tt$"
 HSM_BAR_case_entity_restrict_tt:0 "$HSM_BAR_outcome_entity_restrict_tt$"
 HSM_BAR_case_amulet_investigate:0 "Investigate: Janosik's Ward Amulet"
 HSM_BAR_case_amulet_investigate_desc:0 "Gather the settlements' testimony and surviving records of the guardian's amulet. Compare the reported protective boundary with a site survey; do not confiscate the residents' protection."
 HSM_BAR_case_amulet_protect:0 "Keep the amulet with its guardian"
 HSM_BAR_case_amulet_restrict:0 "Establish supervised amulet custody"
 HSM_BAR_case_amulet_protect_desc:0 "Marta offers the guardians an exchange of observations without demanding the amulet. Survey markers will stand beside the boundary stones. Residents may request their removal; the protective boundary itself must remain undisturbed."
 HSM_BAR_case_amulet_restrict_desc:0 "End experiments at the settlement boundary. Retain the measurements already obtained, but conduct further trials at a separate site. Marta demands written confirmation that the order does not withdraw the residents' protection."
 HSM_BAR_case_amulet_protect_tt:0 "$HSM_BAR_outcome_amulet_protect_tt$"
 HSM_BAR_case_amulet_restrict_tt:0 "$HSM_BAR_outcome_amulet_restrict_tt$"
 HSM_BAR_case_plants_investigate:0 "Investigate: Barrad's Vegetation"
 HSM_BAR_case_plants_investigate_desc:0 "Krzemien asks for samples from both sides of the abandoned field, not merely its strangest plants. Wrona will interview the residents separately. Each bag must record where it was collected and when the first symptoms appeared."
 HSM_BAR_case_plants_protect:0 "Protect settlements with ward lines"
 HSM_BAR_case_plants_restrict:0 "Restrict access to affected groves"
 HSM_BAR_case_plants_protect_desc:0 "Protective strips will separate homes from dangerous growth. Marked observation plots will remain beyond them. Marta will not authorize burning plants for which neither residents nor the laboratory have identified a hazard."
 HSM_BAR_case_plants_restrict_desc:0 "Close the marked plots to grazing and gathering. Give families new routes to water and prohibit fires at the boundary until the smoke is tested. Wrona will leave observers: a fence does not explain what grows beyond it."
 HSM_BAR_case_plants_protect_tt:0 "$HSM_BAR_outcome_plants_protect_tt$"
 HSM_BAR_case_plants_restrict_tt:0 "$HSM_BAR_outcome_plants_restrict_tt$"
 HSM_BAR_case_recon_expedition:0 "Survey reports from [FROM.GetName]"
 HSM_BAR_case_recon_expedition_desc:0 "Quietly verify a current, documented lead in territory controlled by [FROM.GetName]. The inquiry records only cases supported by present evidence. New evidence can justify a later visit."
 HSM_BAR_case_archive_expedition:0 "Investigate archives in [FROM.GetName]"
 HSM_BAR_case_archive_expedition_desc:0 "Read surviving case records and establish what happened. Uncertain deaths support documentary research only."
 HSM_BAR_case_relic_expedition:0 "Recover documented relics from [FROM.GetName]"
 HSM_BAR_case_relic_expedition_desc:0 "Quietly transfer documented, located artifacts to concealed storage. Worn crowns and living rulers are excluded. Traces implicating Barrad damage relations with the current custodian and cost another 20 political power to contain."
 HSM_BAR_case_remains_expedition:0 "Recover confirmed remains from [FROM.GetName]"
 HSM_BAR_case_remains_expedition_desc:0 "Recover only the physically documented bones of Grover II before resurrection. Traces implicating Barrad damage relations with the current custodian and cost another 20 political power to contain."
 HSM_BAR_case_chalice_investigate:0 "Locate: Chalice of Blood"
 HSM_BAR_case_chalice_investigate_desc:0 "The expedition found an ancient chalice. Follow its transfer to Magehold and distinguish this artifact from Rosa's phylactery."
 HSM_BAR_case_chalice_investigated_tt:0 "The expedition found an ancient chalice. Follow its transfer to Magehold and distinguish this artifact from Rosa's phylactery."
 HSM_BAR_case_chalice_secure_local:0 "Secure under our control: Chalice of Blood"
 HSM_BAR_case_chalice_secure_local_desc:0 "A field team transfers the documented artifact from territory we control to a concealed vault at Barrad's capital. Prior transformations are not reversed."
 HSM_BAR_case_chalice_seal:0 "Seal for study: Chalice of Blood"
 HSM_BAR_case_chalice_seal_desc:0 "The Chalice is sealed for supervised study. Its containment does not reverse Rosa's existing transformation."
 HSM_BAR_case_chalice_seal_tt:0 "$HSM_BAR_outcome_chalice_sealed_tt$"
 HSM_BAR_case_phylactery_investigate:0 "Locate: Rosa's Phylactery"
 HSM_BAR_case_phylactery_investigate_desc:0 "Cross-check the lich ritual and search the hidden Magehold repository described by seized records. This forensic lead is a network investigation, not a claim that the vessel existed before its manufacture."
 HSM_BAR_case_phylactery_investigated_tt:0 "Cross-check the lich ritual and search the hidden Magehold repository described by seized records. This forensic lead is a network investigation, not a claim that the vessel existed before its manufacture."
 HSM_BAR_case_phylactery_secure_local:0 "Secure under our control: Rosa's Phylactery"
 HSM_BAR_case_phylactery_secure_local_desc:0 "A field team transfers the documented artifact from territory we control to a concealed vault at Barrad's capital. Prior transformations are not reversed."
 HSM_BAR_case_phylactery_seal:0 "Seal for study: Rosa's Phylactery"
 HSM_BAR_case_phylactery_seal_desc:0 "The concealed soul vessel is isolated. The network has no verified method to destroy it safely and does not claim that sealing it kills Rosa."
 HSM_BAR_case_phylactery_seal_tt:0 "$HSM_BAR_outcome_phylactery_sealed_tt$"
 HSM_BAR_case_darkheart_investigate:0 "Locate: The Dark Heart"
 HSM_BAR_case_darkheart_investigate_desc:0 "Trace the growth of the umbrum crystal and the return ritual. A political restoration without a documented surviving artifact leaves an archive lead only."
 HSM_BAR_case_darkheart_investigated_tt:0 "Trace the growth of the umbrum crystal and the return ritual. A political restoration without a documented surviving artifact leaves an archive lead only."
 HSM_BAR_case_darkheart_secure_local:0 "Secure under our control: The Dark Heart"
 HSM_BAR_case_darkheart_secure_local_desc:0 "A field team transfers the documented artifact from territory we control to a concealed vault at Barrad's capital. Prior transformations are not reversed."
 HSM_BAR_case_darkheart_seal:0 "Seal for study: The Dark Heart"
 HSM_BAR_case_darkheart_seal_desc:0 "The Dark Heart is sealed. The Crystal Heart is left in place; Sombra's historical identity and his returned body are not treated as interchangeable artifacts."
 HSM_BAR_case_darkheart_seal_tt:0 "$HSM_BAR_outcome_darkheart_sealed_tt$"
 HSM_BAR_case_rosa_review:0 "Review dossier: Rosa Maledicta"
 HSM_BAR_case_rosa_review_desc:0 "Commission a verified case summary. The first completed review replaces this case's preliminary research policy with its final dossier contribution. Later reviews reopen the report without another reward."
 HSM_BAR_case_grover_review:0 "Review dossier: Grover II"
 HSM_BAR_case_grover_review_desc:0 "Commission a verified case summary. The first completed review replaces this case's preliminary research policy with its final dossier contribution. Later reviews reopen the report without another reward."
 HSM_BAR_case_herald_review:0 "Review dossier: Herald of Boreas"
 HSM_BAR_case_herald_review_desc:0 "Commission a verified case summary. The first completed review replaces this case's preliminary research policy with its final dossier contribution. Later reviews reopen the report without another reward."
 HSM_BAR_case_sombra_review:0 "Review dossier: Sombra"
 HSM_BAR_case_sombra_review_desc:0 "Commission a verified case summary. The first completed review replaces this case's preliminary research policy with its final dossier contribution. Later reviews reopen the report without another reward."
 HSM_BAR_case_crown_review:0 "Review Crown custody ledger"
 HSM_BAR_case_crown_review_desc:0 "Each discovering country has its own recorded crown instance. The ledger counts known museum, sealed, worn and unlocated instances separately."
 HSM_BAR_case_crown_secure_local:0 "Secure documented local Crowns"
 HSM_BAR_case_crown_secure_local_desc:0 "Transfer investigated museum or sealed crowns from territory we control. A crown worn by a leader is excluded; the bearer is never a recovery target."
 HSM_BAR_case_grover_secure_local:0 "Protect Grover II's documented bones"
 HSM_BAR_case_grover_secure_local_desc:0 "The Gamia inventory confirms physical bones before Auferstehung succeeds. Securing them prevents the queued experiment from using them. No resurrection is performed."
 HSM_BAR_case_grover_inter:0 "Inter the recovered bones after examination"
 HSM_BAR_case_grover_inter_desc:0 "Complete a non-destructive forensic record, then place the bones in a guarded resting place. Respect for the dead does not require repeating Auferstehung."
 HSM_BAR_case_grover_interred_tt:0 "The bones are documented and interred. They are not available for resurrection."
 HSM_BAR_case_occupied_archives:0 "Inspect archives in controlled territory"
 HSM_BAR_case_occupied_archives_desc:0 "Read local Crown records and the surviving archives of Gamia, Yale, Magehold or the Crystal City. Documents establish history; they do not establish a recoverable corpse."
 HSM_BAR_case_expired_tt:0 "The target no longer meets the evidence or access conditions. No artifact, body, research reward or diplomatic incident is recorded."
 HSM_BAR_case_survey_tt:0 "Record the currently supported leads in the target's territory. Knowledge does not grant possession; later discoveries require new evidence."
 HSM_BAR_case_archives_tt:0 "Case records are investigated. This grants knowledge, not custody of an artifact or person."
 HSM_BAR_case_incident_tt:0 "Traces left by the theft damage the current custodian's relations with Barrad. Spend 20 political power containing the exposure through intermediaries; the network remains unknown to Barrad's government."
 HSM_BAR_case_relic_tt:0 "The documented relics are transferred to guarded storage at our capital. Continued access requires actual control of that site."
 HSM_BAR_case_remains_tt:0 "The confirmed bones are secured. No living ruler is taken, and the queued Auferstehung experiment can no longer use these bones."
 HSM_BAR_case_bones_missing_tt:0 "The physical bones have been removed from Gamia. The experiment cannot proceed."
 HSM_BAR_case_sealed_research:0 "Guarded relic study"
 hsm_bar_anomaly.bones_missing:0 "The slab is empty."
 hsm_bar_anomaly.file_report:0 "Enter the findings in the case file."
 hsm_bar_anomaly.3.t:0 "An Unexplained Disappearance"
 hsm_bar_anomaly.3.d:0 "Our custodians report that documented relics or historical remains have vanished from a site under our control. Transport records point to intermediaries operating from Barrad, but the organizers remain unidentified. Our officials distrust Barrad's denials; its government appears unable to explain the movements. No living ruler was taken."
 hsm_bar_anomaly.3.a:0 "Trace the intermediaries."
 hsm_bar_anomaly.10.t:0 "What Survived the Pentarchy"
 hsm_bar_anomaly.10.d:0 "The first field survey has opened files on living rock, the Titan excavation, the underground consciousness, Janosik's amulet and local vegetation. These are leads for investigation. A surviving site is not proof that a reactor was completed, that a dismantled construct remains intact, or that a dead Pentarch has returned."
 hsm_bar_anomaly.11.t:0 "Stone That Was Already Alive"
 hsm_bar_anomaly.11.d:0 "The exposed rock reacts before any new construction begins. The old builders discovered it; they did not create it. Small samples and the excavation record support a guarded research boundary. Connections with the vegetation and the underground intelligence remain hypotheses to test."
 hsm_bar_anomaly.12.t:0 "The Titan Inventory"
 hsm_bar_anomaly.12.d:0 "The records and site survey support an ancient buried construct. No confirmed dismantling is recorded. The network marks the workings and forbids activation during the survey. Guarding or sealing this place does not produce a second Titan or equip Leopold with an unearned new body."
 hsm_bar_anomaly.12.spent:0 "Native records confirm the Titan's defeat or dismantling. The case concerns the site and surviving documentation; material already consumed by workshops or Leopold's body cannot be recovered again. Nothing in this survey rebuilds the construct."
 hsm_bar_anomaly.13.t:0 "Voices Below Barrad"
 hsm_bar_anomaly.13.d:0 "The subterranean responses predate the network. Interviews and measured signals indicate a composite consciousness, not a device made by our investigators. No operating reactor is present at the site. A warded contact zone or a closed passage is possible without constructing one."
 hsm_bar_anomaly.13.reactor:0 "A reactor building exists at the site, but the consciousness has an older history. Engineers inventory the installation separately from the entity. This finding neither creates a reactor nor proves that every later Pentarch experiment took place."
 hsm_bar_anomaly.14.t:0 "A Guardian's Amulet"
 hsm_bar_anomaly.14.d:0 "Janosik's amulet predates this inquiry. Residents' testimony and surviving observations describe protection against the local vegetation. The report records a protective boundary, not the amulet's transfer to the Service. Claims that it repels everything made by a local god remain unproven. Further work must preserve the settlements' access to protection and distinguish records from actual custody."
 hsm_bar_anomaly.15.t:0 "Growth and Testimony"
 hsm_bar_anomaly.15.d:0 "The team has charted suspicious vegetation and tested precautions. No attack has been independently corroborated. The dossier therefore concerns monitoring and settlement protection; its authors refuse to turn unverified testimony into a declared infestation."
 hsm_bar_anomaly.15.manifested:0 "The surviving account confirms an attack and the amulet's defensive use. It does not date the first animation of every plant in Barrad. Residents need practical ward lines and access rules; the dossier does not declare all magical vegetation hostile."
 hsm_bar_anomaly.20.t:0 "The Many Accounts of Rosa"
 hsm_bar_anomaly.20.d:0 "Rosa's earlier career as a necromancer is documented. Neither a completed lich transformation nor a vampire transformation is confirmed in this file. Her office, a military defeat or the disappearance of the Dread League cannot substitute for physical evidence of death. Archive research remains possible; corpse recovery does not."
 hsm_bar_anomaly.20.lich:0 "The ritual record confirms Rosa's lich form and the manufacture of a concealed phylactery. This is not the Chalice of Blood. The transformed ruler remains a person; neither removing her from office nor taking the vessel establishes a normal corpse or proves her destruction."
 hsm_bar_anomaly.20.vampire:0 "The record confirms Rosa's vampire transformation. It does not also establish a lich form or a manufactured phylactery. The network may study records and separately documented relics. It has no authority to reclassify a ruling person as transportable remains."
 hsm_bar_anomaly.20.dead:0 "Available accounts record execution at Magehold or Rosa's final rest. It does not establish an intact, recoverable body, especially for the lich branch. The file is classified as documentary evidence only. Neither these reports nor the Dread League's capitulation establish where remains could be recovered."
 hsm_bar_anomaly.21.t:0 "Grover II: Bones, Return and Retirement"
 hsm_bar_anomaly.21.d:0 "The emperor's first death belongs to the historical record. His past death is not evidence that Yale currently possesses recoverable bones. The file remains archival until an actual recovery is documented. Grover VI is a different person."
 hsm_bar_anomaly.21.bones:0 "Gamia's expedition physically returned Grover II's bones from Griffonstone. The inventory provides positive evidence of recoverable remains at Gamia. That window ends when Auferstehung succeeds. A team arriving after resurrection must return empty-handed."
 hsm_bar_anomaly.21.returned:0 "Auferstehung succeeded: the ancient bones became the returned Grover II. The pre-ritual remains inventory is closed. The network may study records and public acts, but it cannot abduct the ruler or turn a later defeat into an unverified corpse."
 hsm_bar_anomaly.21.retired:0 "The account describes Grover II entering a mountain residence with living quarters and promising to remain available to his descendant. His retirement is not death. Neither the retirement nor the sarcophagus establishes recoverable remains."
 hsm_bar_anomaly.21.secured:0 "The documented bones were removed before the resurrection experiment. They now belong to a physical custody record, and access depends on control of their storage site. The network has neither resurrected Grover II nor acquired a living emperor."
 hsm_bar_anomaly.22.t:0 "The Herald and the Empty Throne"
 hsm_bar_anomaly.22.d:0 "Weihe's theories and the surrounding religious claims can be studied, but no completed Herald transformation is confirmed. The network does not manufacture an incarnation by opening a dossier."
 hsm_bar_anomaly.22.transformed:0 "The vault incident links the changed griffon to Weihe's fluid and records unusual light and movement. These observations establish a transformation, not proof of divine identity. The case permits documentary assessment; a ruling Herald cannot be kidnapped."
 hsm_bar_anomaly.22.vanished:0 "Witnesses describe the Herald fading and vanishing in a flash during Grover VI's coronation. No physical body remains in the account. Recovery is unavailable; the coronation testimony is retained for archive research."
 hsm_bar_anomaly.23.t:0 "Sombra Across the Veil"
 hsm_bar_anomaly.23.d:0 "Sombra's earlier history is established, but a new return has not been confirmed. Limbo is not a warehouse containing an available body, and a plan for a Dark Heart is not a completed artifact."
 hsm_bar_anomaly.23.returned:0 "Independent reports confirm Sombra's bodily return. His present office can be checked independently of that past transformation. Neither defeat nor loss of office proves that recoverable remains exist. The Dark Heart requires its own creation and custody evidence."
 hsm_bar_anomaly.23.removed:0 "The restoration removed Sombra from political and military office. It did not document a recoverable physical body; banishment or an uncertain fate cannot supply one. Any Dark Heart left without confirmed custody is likewise unlocated. The investigation retains the archives only."
 hsm_bar_anomaly.24.t:0 "A Ledger of Separate Crowns"
 hsm_bar_anomaly.24.d:0 "Known museum instances: [?HSM_BAR_case_crown_museum_count|0]\nKnown sealed instances: [?HSM_BAR_case_crown_sealed_count|0]\nKnown worn instances: [?HSM_BAR_case_crown_leader_count|0]\nUnlocated instances: [?HSM_BAR_case_crown_missing_count|0]\nSecured instances currently under our control: [?HSM_BAR_case_crown_vault_count|0]\n\nEach entry belongs to its own discovery chain. A museum or seal follows its recorded site through conquest. A worn crown is excluded from extraction, and a missing bearer does not automatically deposit it in a museum."
 hsm_bar_anomaly.2.t:0 "The Trail Has Gone Cold"
 hsm_bar_anomaly.2.d:0 "The team cannot complete the assignment: access, evidence or the remaining work has changed. No new investigation credit, artifact, remains, research reward or theft incident has been recorded. The network closes this attempt and preserves the existing file."
 hsm_bar_anomaly.16.t:0 "The Chalice Trail"
 hsm_bar_anomaly.16.d:0 "The forensic team has cross-checked the expedition inventory and the Chalice's custody trail. The dossier now supports a recovery attempt once containment is ready, its use in the documented ritual has ended and the present custodian can be reached. The Chalice has not been moved by this investigation."
 hsm_bar_anomaly.17.t:0 "A Vessel Behind the Ritual"
 hsm_bar_anomaly.17.d:0 "Records of the completed lich ritual and its repository establish a lead to Rosa's phylactery. The network has filed the forensic assessment. Recovery still requires containment and access to the current storage site; the vessel remains there, and Rosa's fate is unchanged."
 hsm_bar_anomaly.18.t:0 "The Dark Heart's Custody Trail"
 hsm_bar_anomaly.18.d:0 "The team has checked the creation record and the Dark Heart's documented location. The forensic dossier is complete. Recovery requires containment, a completed return of Sombra and access to the current site. The Crystal Heart remains untouched."
 HSM_BAR_case_local_survey_result_tt:0 "After 14 days, if site access remains available: open five local dossiers and receive the field survey report. Individual investigations become available."
 HSM_BAR_case_recon_expedition_result_tt:0 "After 14 days, if the target still has a supported lead: record those current leads and survey the jurisdiction. Any remaining supported archive work becomes available; no relic is transferred."
 HSM_BAR_case_archive_expedition_result_tt:0 "After 21 days, if evidence and access remain valid: investigate the supported records and Crown instances. Person dossiers can be reviewed; located relics may require a separate forensic investigation."
 HSM_BAR_case_relic_expedition_result_tt:0 "After 30 days, if evidence, containment and current custody still permit recovery: transfer qualifying relics to concealed storage at Barrad's capital. The current custodian's relations with Barrad deteriorate; handling the exposure costs another 20 political power."
 HSM_BAR_case_remains_expedition_result_tt:0 "After 21 days, if the confirmed bones remain accessible and resurrection has not occurred: secure them and prevent their use by Auferstehung. Relations with the current custodian deteriorate; handling the exposure costs another 20 political power."
 HSM_BAR_case_rock_investigate_result_tt:0 "After 21 days, if site access remains available: mark the Living Rock dossier investigated and receive its report. Unlock protective or restricted-access dispositions when their research and doctrine requirements are met. No artifact is moved."
 HSM_BAR_case_titan_investigate_result_tt:0 "After 21 days, if site access remains available: mark the Titan Inventory dossier investigated and receive its report. Unlock protective or restricted-access dispositions when their research and doctrine requirements are met. No artifact is moved."
 HSM_BAR_case_entity_investigate_result_tt:0 "After 21 days, if site access remains available: mark the Underground Consciousness dossier investigated and receive its report. Unlock protective or restricted-access dispositions when their research and doctrine requirements are met. No artifact is moved."
 HSM_BAR_case_amulet_investigate_result_tt:0 "After 21 days, if site access remains available: mark the Ward Amulet dossier investigated and receive its report. Unlock protective or restricted-access dispositions when their research and doctrine requirements are met. No artifact is moved."
 HSM_BAR_case_plants_investigate_result_tt:0 "After 21 days, if site access remains available: mark the Vegetation dossier investigated and receive its report. Unlock protective or restricted-access dispositions when their research and doctrine requirements are met. No artifact is moved."
 HSM_BAR_case_chalice_investigate_result_tt:0 "After 21 days, if the records, forensic capability and documented artifact remain available: finish the Chalice investigation and receive its report. Recovery becomes possible only when its separate containment, custody and case-specific recovery conditions are met."
 HSM_BAR_case_phylactery_investigate_result_tt:0 "After 21 days, if the records, forensic capability and documented artifact remain available: finish the phylactery investigation and receive its report. Recovery becomes possible only when its separate containment, custody and case-specific recovery conditions are met."
 HSM_BAR_case_darkheart_investigate_result_tt:0 "After 21 days, if the records, forensic capability and documented artifact remain available: finish the Dark Heart investigation and receive its report. Recovery becomes possible only when its separate containment, custody and case-specific recovery conditions are met."
