l_english:
 HSM_EYR_DEV_common_curriculum_bonus:0 "Common Technical Curriculum"
 HSM_EYR_DEV_public_health_bonus:0 "Public Health Training"
 HSM_EYR_borderland_reconstruction:0 "Rebuild the Borderlands"
 HSM_EYR_borderland_reconstruction_desc:0 "Eyrie's recovery begins with work that cannot wait for a settlement abroad. We will appoint local repair crews, inventory public buildings and give district officials the authority to keep essential services running."
 HSM_EYR_fair_grain_markets:0 "Fair Grain Markets"
 HSM_EYR_fair_grain_markets_desc:0 "Uncertain weights, spoiled stores and arbitrary charges leave farming households with little of what they earn. Common market rules and shared storage will ease rural poverty and help local savings find their way into civilian industry."
 HSM_EYR_market_roads:0 "Roads to Market"
 HSM_EYR_market_roads_desc:0 "A harvest is worth little when it cannot reach the mill. In Verenia and Eyrie, carriers know which bridge will fail in the rain and which road disappears beneath the thaw. Their accounts will guide the drainage crews and bridge builders, so that a farmer can promise a delivery without first guessing the weather."
 HSM_EYR_rural_processing:0 "Process the Harvest at Home"
 HSM_EYR_rural_processing_desc:0 "Milling, preserving and packing should provide skilled work close to the farms. Too much of the harvest leaves Eyrie's villages unprocessed, and too much of its value stays with distant buyers. Local processing works will let farming families sell goods that can travel farther and keep through the winter."
 HSM_EYR_equipment_cooperatives:0 "Equipment Cooperatives"
 HSM_EYR_equipment_cooperatives_desc:0 "Smallholders cannot each maintain an expensive workshop. Equipment cooperatives will pool their orders, keep spare parts in common stores and repair tools between harvests. A broken machine should bring a mechanic to the farm, not a creditor to the farmhouse."
 HSM_EYR_seasonal_work_schemes:0 "Work Between Harvests"
 HSM_EYR_seasonal_work_schemes_desc:0 "Seasonal work should not mean seasonal hunger. District offices will match willing workers to processing plants and repair jobs outside the harvest months. More dependable household incomes will reduce poverty further and strengthen confidence in the rebuilding programme."
 HSM_EYR_evening_classes:0 "Evening Classes"
 HSM_EYR_evening_classes_desc:0 "Schoolrooms can serve adults after the day's work is done. A new programme of reading, arithmetic and technical drawing will reach those whom ordinary schooling has missed and make practical study a lasting part of village life."
 HSM_EYR_practical_science:0 "Science for Everyday Work"
 HSM_EYR_practical_science_desc:0 "Our new classes and processing workshops need instructors who can test a material, explain a circuit and record an experiment. Modest teaching laboratories will strengthen a still-limited scientific base and prepare the ground for electrical research."
 HSM_EYR_district_laboratories:0 "District Laboratories"
 HSM_EYR_district_laboratories_desc:0 "The district schools have begun borrowing instruments from the workshops, whose foremen now bring their own questions to the teachers. Shared laboratories will give this exchange a permanent home. Materials can be tested, circuits assembled and failed experiments kept on record, instead of each instructor having to begin again alone."
 HSM_EYR_technical_fellowships:0 "Technical Fellowships"
 HSM_EYR_technical_fellowships_desc:0 "Our instructors cannot build a scientific community in the hours left after marking exercise books. Paid fellowships will let promising researchers devote themselves to a difficult problem and bring apprentices into the work. The workshops that supply their instruments will expect useful answers, but must learn to allow time for an honest experiment."
 HSM_EYR_defensive_service:0 "A Defensive Service"
 HSM_EYR_defensive_service_desc:0 "Defending Eyrie requires clear duties, dependable training and officers who know the ground. We will review local defence plans and use practical exercises to establish a common standard of service."
 HSM_EYR_skilled_reserve:0 "A Skilled Reserve"
 HSM_EYR_skilled_reserve_desc:0 "Soldiers returning to civilian life should not have to choose between a livelihood and their place in the reserve. Workshop apprenticeships will give them trades, while refresher courses keep former comrades accustomed to serving together. Employers and officers must agree on a calendar that does not summon a worker away whenever an order comes due."
 HSM_EYR_engineer_corps:0 "A Field Engineer Corps"
 HSM_EYR_engineer_corps_desc:0 "Drainage, covered positions and sound fieldworks matter more than grand plans drawn far from the border. A permanent cadre of engineers will teach units to entrench quickly and guide the development of better engineering equipment."
 HSM_EYR_repair_arsenals:0 "Repair Arsenals"
 HSM_EYR_repair_arsenals_desc:0 "A rifle awaiting a minor repair is still a rifle missing from its unit. Armourers need benches, gauges and a dependable supply of replacement parts. A properly equipped arsenal will let them mend worn weapons before another regiment has to march with whatever happens to be left in the stores."
 HSM_EYR_supply_depots:0 "Organise the Supply Depots"
 HSM_EYR_supply_depots_desc:0 "The quartermaster knows what his ledger contains; the driver knows what actually reached the depot. Too often their accounts describe different consignments. A permanent depot service will reconcile receipts, maintain transport schedules and make someone answer for supplies lost between the warehouse and the unit that needed them."
 HSM_EYR_infantry_drills:0 "Practical Infantry Drills"
 HSM_EYR_infantry_drills_desc:0 "Small units must be able to hold a position, cover a withdrawal and use their weapons effectively. Regular field exercises will reveal shortcomings in our infantry equipment and give instructors experience they can pass on."
 HSM_EYR_observation_posts:0 "Border Observation Sections"
 HSM_EYR_observation_posts_desc:0 "Local knowledge is useful only when a report arrives clearly and in time. Trained observation sections will compare patrol reports, keep accurate sketches and develop better reconnaissance methods for the troops guarding the border."
 HSM_EYR_signals_network:0 "A Common Signals Network"
 HSM_EYR_signals_network_desc:0 "A patrol's warning is useless if headquarters reads it after the reserve has marched the wrong way. Observers, depot staff and reserve officers will practise exchanging the same reports through trained signallers. The message must remain intelligible from the first field notebook to the last unit waiting for orders."
 HSM_EYR_DEV_public_works:0 "District Repair Crews"
 HSM_EYR_DEV_public_works_desc:0 "Locally organised crews and a common repair register help damaged buildings return to service sooner."
 HSM_EYR_DEV_rural_investment:0 "Rural Investment"
 HSM_EYR_DEV_rural_investment_desc:0 "More dependable farm incomes support investment in processing plants and workshops, accelerating civilian factory construction."
 HSM_EYR_DEV_practical_education:0 "Practical Education"
 HSM_EYR_DEV_practical_education_desc:0 "Evening study links basic education to technical work, giving researchers a wider pool of capable assistants."
 HSM_EYR_DEV_skilled_reserve:0 "Skilled Reservists"
 HSM_EYR_DEV_skilled_reserve_desc:0 "Workshop placements and refresher training retain useful skills in civilian production and military service alike."
 HSM_EYR_DEV_field_engineers:0 "Field Engineer Cadres"
 HSM_EYR_DEV_field_engineers_desc:0 "Experienced engineers teach units to prepare defensive positions more quickly."
 HSM_EYR_DEV_depot_service:0 "District Depot Service"
 HSM_EYR_DEV_depot_service_desc:0 "Better inventories and delivery routines reduce the supplies consumed by our forces."
 HSM_EYR_DEV_observer_sections:0 "Trained Observer Sections"
 HSM_EYR_DEV_observer_sections_desc:0 "Reliable patrol reporting and local observation improve the army's reconnaissance."
 HSM_EYR_DEV_coordinated_signals:0 "Coordinated Field Signals"
 HSM_EYR_DEV_coordinated_signals_desc:0 "A common reporting network preserves the observers' reconnaissance advantage and improves the rate at which reserves reinforce battles."
 HSM_EYR_DEV_road_methods_bonus:0 "Borderland Road Surveys"
 HSM_EYR_DEV_workshop_methods_bonus:0 "Cooperative Workshop Methods"
 HSM_EYR_DEV_instrumentation_bonus:0 "Teaching Instruments"
 HSM_EYR_DEV_material_testing_bonus:0 "District Materials Testing"
 HSM_EYR_DEV_fellowship_bonus:0 "Technical Fellowship Research"
 HSM_EYR_DEV_engineer_bonus:0 "Field Engineering Trials"
 HSM_EYR_DEV_maintenance_bonus:0 "Arsenal Maintenance Trials"
 HSM_EYR_DEV_logistics_bonus:0 "Depot Supply Studies"
 HSM_EYR_DEV_rail_supply_bonus:0 "Railway Supply Studies"
 HSM_EYR_DEV_infantry_bonus:0 "Infantry Equipment Trials"
 HSM_EYR_DEV_recon_bonus:0 "Border Reconnaissance Reports"
 HSM_EYR_DEV_signals_bonus:0 "Common Signals Procedures"
 HSM_EYR_teacher_training:0 "Teachers for Every District"
 HSM_EYR_teacher_training_desc:0 "A village school cannot depend on whichever clerk has an afternoon to spare. Residential courses will prepare teachers to lead a classroom, keep useful records and return to their districts with colleagues they can call upon."
 HSM_EYR_public_libraries:0 "Books Beyond the Classroom"
 HSM_EYR_public_libraries_desc:0 "School leavers need somewhere to keep learning. Public reading rooms will lend practical manuals, newspapers and stories, while travelling librarians carry books to settlements too small to maintain a collection of their own."
 HSM_EYR_universal_schooling:0 "A Place for Every Pupil"
 HSM_EYR_universal_schooling_desc:0 "A school is public only when every family can use it. Attendance officers will work with parents, teachers and employers to bring missing pupils into class, and adult tutors will welcome those whose childhood passed without that chance."
 HSM_EYR_district_housing:0 "Homes Fit for Work and Rest"
 HSM_EYR_district_housing_desc:0 "Crowded lodgings and leaking roofs consume the wages that should keep a household secure. District builders will repair rented homes and lay out affordable housing near the workshops, with residents able to demand repairs without risking eviction."
 HSM_EYR_social_insurance:0 "Security Through Hard Times"
 HSM_EYR_social_insurance_desc:0 "Illness and injury should not send a working family back to the poorhouse. Employers, workers and the treasury will sustain an insurance fund whose local offices pay claims promptly and answer openly for the money entrusted to them."
 HSM_EYR_rural_credit:0 "Credit for the Countryside"
 HSM_EYR_rural_credit_desc:0 "Farmers and village tradespeople need loans that can be repaid from honest work. Local credit associations will share risks, publish their terms and keep emergency borrowing from becoming a lifetime of dependence."
 HSM_EYR_public_utilities:0 "Water, Power and Public Works"
 HSM_EYR_public_utilities_desc:0 "Growing towns need dependable water, lighting and transport. Engineers and elected district representatives will agree on common service standards, extend reliable networks and train the crews who must keep them working through every season."
 HSM_EYR_lasting_prosperity:0 "Prosperity That Reaches Home"
 HSM_EYR_lasting_prosperity_desc:0 "The rebuilding programme must finally reach the households still left behind. Secure homes, steady work and dependable services will become ordinary expectations, with local authorities responsible for carrying prosperity beyond the busiest streets."
 HSM_EYR_DEV_electronics_bonus:0 "Public Library Research"
 HSM_EYR_DEV_industry_bonus:0 "Rural Credit Investment"
 HSM_EYR_DEV_construction_bonus:0 "Municipal Engineering"
