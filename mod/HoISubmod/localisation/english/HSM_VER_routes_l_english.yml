l_english:
 HSM_ERI_diplomatic_settlement:0 "An Inheritance We Can Share"
 HSM_ERI_diplomatic_settlement_desc:0 "Vincent can keep his claim to Verenia without making every neighbour live beneath the threat of his army. He will seek a settlement with Eyrie: hear the country, let the family speak, and accept guarantees that bind his own officers before asking Iovinus to disarm the feud. This choice closes the road to imposing his inheritance by conquest. If the other court refuses, Erie must still have a future worth building."
 HSM_EYR_diplomatic_settlement:0 "Security Without the Feud"
 HSM_EYR_diplomatic_settlement_desc:0 "Iovinus has guarded the frontier for so long that his officers have begun to confuse its safety with their freedom to raid across it. He will seek a settlement that protects Eyrie without requiring Erie's submission. The muster must be honest, the family must be allowed to speak, and the safeguards must bind both commands. His army will defend the country. It will not answer a failed conference by conquering the neighbour."
 HSM_VER_diplomatic_route_tt:0 "Commits our House to a diplomatic settlement and closes military unification. Each agreement requires consent; a signed armistice remains in force until war or a friendship treaty. If negotiations fail, independent development remains possible."
 HSM_VER_military_route_tt:0 "Chooses the §Ymilitary unification route§! and §Rexcludes the diplomatic-settlement branch§!. Victory leads to governing the defeated districts and a separate military continuation concerning Avian. War goals do not declare war automatically; existing truces, pacts and faction obligations still apply. Choosing this route does not cancel them or grant territory in advance."
 hsm_ver_routes.1.t:0 "Terms at the Boundary"
 hsm_ver_routes.1.d:0 "The meeting takes place beside a crossing neither escort is willing to leave unguarded. A farmer has brought a broken harness. The officer who took his team called it a requisition; the family who had to pull the plough called it something else. Across the table, another household has much the same story about our patrols.\n\nTwo proposals remain. Mixed patrols would investigate incidents together, putting an officer from each House beside every disputed account. Both courts would have to sustain that scrutiny. A restitution fund would instead commit our court to hearing property claims and meeting the political cost of acknowledging the damage.\n\nThe guarantees must be chosen before the armistice is concluded. For once, the question at the boundary is what we will undertake ourselves."
 hsm_ver_routes.1.a:0 "Put officers from both Houses in the patrols."
 hsm_ver_routes.1.b:0 "Establish the restitution fund."
 hsm_ver_routes.2.t:0 "What We Can Still Promise"
 hsm_ver_routes.2.d:0 "The conference has ended without the shared settlement we sought. Some councillors point to an empty place at the table, others to a clause that could not be reconciled. None can turn an absent signature into a promise.\n\nThe builders waiting outside have brought different questions: which school receives its roof, where the road crews begin, whether the workshops will finally be able to keep their apprentices. These decisions do not require another government's assent.\n\nOur undertaking was to end the pursuit of the neighbour by force. Disappointment does not release us from it. Any agreements still in force will be honoured; no agreement that never existed will be proclaimed. We will guard our country and rebuild it, without making its future depend on another conference."
 hsm_ver_routes.2.a:0 "The work at home must go on."
 HSM_VER_conference_construction_bonus:0 "Construction Lessons from the Conference"
 HSM_VER_diplomatic_route:0 "The diplomatic settlement has been chosen"
 HSM_VER_military_route:0 "Military unification has been chosen"
 HSM_VER_conference_failed_tt:0 "The conference was refused or its counterpart is no longer available, and no invitation awaits an answer. Our country is independent, at peace and not bound by an active common charter."
 HSM_VER_diplomatic_routes_open_tt:0 "Neither Erie nor Eyrie has chosen military unification."
 EYR_border_skirmish_desc:0 "Another patrol report from the Erie frontier lies on Iovinus's desk. His captains call for a sharp reply before their neighbours mistake restraint for fear. The villages along the line know what such replies bring: trampled fields, missing carts and another account of who crossed first. The duke's officers are ready to carry his answer across the boundary."
 EYR_border_skirmish_timeout_desc:0 "The fighting at the Erie frontier has outlasted the captains' first assurances. Runners bring requests for ammunition and news of positions gained, lost and contested again. Iovinus's officers must decide how much longer their men can hold the ground before the order to withdraw becomes unavoidable. Behind them, carts carry the wounded through villages promised a brief affair."
 ERI_border_skirmish_desc:0 "Vincent's captains have brought another grievance from the Eyrie frontier and a plan to settle it by force. A patrol will cross, a post will be challenged, and the court will call the affair a defence of its honour. The households beside the road will have to reckon with whatever the soldiers leave behind."
 ERI_border_skirmish_timeout_desc:0 "The clash with Eyrie's troops continues along the disputed line. Vincent's captains send contradictory reports, each asking for time to turn a stubborn fight into the sharp success promised at court. The men at the crossing count cartridges and watch for relief. If the position cannot be secured, their officers will have to bring them home with an account the duke may not wish to hear."
 ERI_create_wargoal_desc:0 "The old claim to Verenia is being copied from genealogies into military memoranda. Courtiers speak of an inheritance withheld; officers ask for stores, routes and a government prepared to answer for the campaign. The rival House will recognise the change in tone. An argument once renewed at every reception is becoming a demand backed by an army."
 ERI_white_peace_desc:0 "The casualty returns have grown longer than the lists of disputed estates. Neither court can restore the lives spent defending its claim, but both can still order the firing to stop. An envoy will carry terms that leave the inheritance unresolved and let the surviving soldiers return home. The other House must decide whether it too has had enough of this war."
